<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI MCQs | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f7fc;
color:#172033;
}

header{
background:#123b70;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:18px;
box-shadow:0 6px 25px #0001;
}

.status{
background:#e9fff1;
border:1px solid #9ee2b5;
padding:15px;
border-radius:12px;
color:#168344;
font-weight:bold;
}

h1{
color:#123b70;
margin-bottom:8px;
}

h2{
color:#123b70;
}

select{
width:100%;
padding:14px;
border:1px solid #ccd3df;
border-radius:10px;
font-size:16px;
background:white;
}

.generate{
width:100%;
margin-top:16px;
padding:15px;
border:0;
border-radius:10px;
background:#1769e0;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.generate:disabled{
opacity:.6;
}

.usage{
margin-top:15px;
padding:13px;
background:#eef5ff;
border-radius:10px;
text-align:center;
font-weight:bold;
color:#1769e0;
}

.message{
text-align:center;
font-weight:bold;
margin:15px 0;
}

.progress{
font-weight:bold;
color:#1769e0;
margin-bottom:15px;
}

.question{
font-size:20px;
font-weight:bold;
line-height:1.5;
margin-bottom:18px;
}

.option{
display:block;
width:100%;
padding:14px;
margin:9px 0;
border:1px solid #ccd3df;
border-radius:10px;
background:white;
text-align:left;
font-size:16px;
cursor:pointer;
}

.option:hover{
background:#f1f6ff;
}

.option.correct{
background:#dcfce7;
border-color:#22a35a;
}

.option.wrong{
background:#fee2e2;
border-color:#dc4c4c;
}

.option:disabled{
cursor:default;
}

.answer{
display:none;
margin-top:18px;
padding:15px;
border-radius:10px;
background:#f4f7fa;
line-height:1.6;
}

.next{
width:100%;
margin-top:18px;
padding:14px;
border:0;
border-radius:10px;
background:#123b70;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.hidden{
display:none;
}

.logout{
display:block;
text-align:center;
color:#1769e0;
font-weight:bold;
cursor:pointer;
margin:20px;
}

footer{
text-align:center;
padding:25px;
color:#667085;
font-size:13px;
}

@media(max-width:600px){
.container{padding:12px}
.card{padding:18px}
.question{font-size:18px}
}
</style>
</head>

<body>

<header>

<div class="logo">
📚 CreateLK Academy
</div>

<a href="index.html">
← Home
</a>

</header>


<div class="container">


<!-- MEMBERSHIP -->

<div class="card">

<div id="membershipStatus" class="status">
🔄 Checking Premium...
</div>

<div style="margin-top:8px">
⏳ Expires:
<strong id="expiry">Checking...</strong>
</div>

</div>


<!-- GENERATOR -->

<div class="card">

<h1>🤖 AI English MCQs</h1>

<p>
Generate <strong>one question at a time</strong> with
<strong>4 options</strong>.
</p>


<h2>📚 Choose Subject</h2>

<select id="subject">

<option value="general_english">🟢 General English</option>
<option value="grammar">📘 English Grammar</option>
<option value="vocabulary">📖 Vocabulary</option>
<option value="tenses">⏰ English Tenses</option>
<option value="prepositions">📍 Prepositions</option>
<option value="articles">📝 Articles</option>
<option value="pronouns">👤 Pronouns</option>
<option value="adjectives">🎨 Adjectives</option>
<option value="adverbs">⚡ Adverbs</option>
<option value="verbs">🏃 Verbs</option>
<option value="nouns">📚 Nouns</option>
<option value="conjunctions">🔗 Conjunctions</option>
<option value="sentence_structure">🏗️ Sentence Structure</option>
<option value="spelling">✍️ Spelling</option>
<option value="synonyms">🔄 Synonyms</option>
<option value="antonyms">↔️ Antonyms</option>
<option value="reading">📕 Reading Comprehension</option>
<option value="conversation">💬 Conversation English</option>
<option value="spoken_english">🗣️ Spoken English</option>
<option value="business_english">💼 Business English</option>
<option value="academic_english">🎓 Academic English</option>
<option value="writing">✒️ English Writing</option>
<option value="phrasal_verbs">🧩 Phrasal Verbs</option>
<option value="idioms">💡 English Idioms</option>
<option value="mixed_english">🌟 Mixed English</option>

</select>


<div id="usage" class="usage">
📊 Today: Checking...
</div>


<button
id="generateBtn"
class="generate"
onclick="generateQuestion()">

🤖 Generate Question

</button>


<div id="message" class="message"></div>

</div>


<!-- QUESTION -->

<div
id="questionCard"
class="card hidden">

<div
id="progress"
class="progress">
Question
</div>


<div
id="question"
class="question">
</div>


<div id="options"></div>


<div
id="answer"
class="answer">
</div>


<button
id="nextBtn"
class="next hidden"
onclick="generateQuestion()">

➡️ Next Question

</button>

</div>


</div>


<a
class="logout"
onclick="logout()">

🚪 Logout

</a>


<footer>
© 2026 CreateLK Academy. All Rights Reserved.
</footer>


<script>

/* =========================================
   CLOUDFLARE WORKER
========================================= */

const WORKER_URL =
"https://createlk-academy-api.createlk.workers.dev";


let token =
localStorage.getItem("createlk_token");

let questionNumber = 0;


/* =========================================
   ELEMENTS
========================================= */

const membershipStatus =
document.getElementById(
"membershipStatus"
);

const expiry =
document.getElementById(
"expiry"
);

const usage =
document.getElementById(
"usage"
);

const generateBtn =
document.getElementById(
"generateBtn"
);

const message =
document.getElementById(
"message"
);

const questionCard =
document.getElementById(
"questionCard"
);

const questionBox =
document.getElementById(
"question"
);

const optionsBox =
document.getElementById(
"options"
);

const answerBox =
document.getElementById(
"answer"
);

const nextBtn =
document.getElementById(
"nextBtn"
);


/* =========================================
   LOGIN
========================================= */

if(!token){

window.location.href =
"login.html";

}


/* =========================================
   MEMBERSHIP
========================================= */

async function checkMembership(){

try{

const response =
await fetch(
WORKER_URL+"/api/membership",
{
headers:{
"Authorization":
"Bearer "+token
}
}
);

const data =
await response.json();


if(!data.active){

window.location.href =
"payment.html";

return;

}


membershipStatus.innerHTML =
"🟢 Premium Membership Active";


const expires =
data.expires_at ||
data.expiresAt ||
data.subscription?.expires_at ||
data.subscription?.expiresAt;


if(expires){

expiry.textContent =
new Date(expires)
.toLocaleString();

}else{

expiry.textContent =
"Active";

}


/* SHOW DAILY USAGE */

if(
data.questionCount !== undefined
){

usage.textContent =
"📊 Today: "+
data.questionCount+
" / 100 questions";

}else if(
data.dailyUsage !== undefined
){

usage.textContent =
"📊 Today: "+
data.dailyUsage+
" / 100 questions";

}else{

usage.textContent =
"📊 Daily limit: 100 questions";

}

}catch(error){

membershipStatus.innerHTML =
"⚠️ Unable to check membership";

}

}


/* =========================================
   GENERATE ONE QUESTION
========================================= */

async function generateQuestion(){

const subject =
document.getElementById(
"subject"
).value;


generateBtn.disabled=true;

generateBtn.textContent =
"🤖 Generating...";

nextBtn.classList.add(
"hidden"
);

message.textContent =
"";


try{

const response =
await fetch(
WORKER_URL+"/api/ai-mcq",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer "+token
},

body:JSON.stringify({

subject:subject,

count:1

})
}
);


const data =
await response.json();


console.log(
"AI response:",
data
);


if(!response.ok ||
!data.success){

message.textContent =
data.message ||
"Unable to generate question.";

generateBtn.disabled=false;

generateBtn.textContent =
"🤖 Generate Question";

return;

}


let q =
data.question ||
(data.questions &&
data.questions[0]) ||
(data.mcqs &&
data.mcqs[0]);


if(!q){

message.textContent =
"No question returned.";

generateBtn.disabled=false;

generateBtn.textContent =
"🤖 Generate Question";

return;

}


showQuestion(q);


/* UPDATE USAGE */

if(
data.questionCount !== undefined
){

usage.textContent =
"📊 Today: "+
data.questionCount+
" / 100 questions";

}else if(
data.dailyUsage !== undefined
){

usage.textContent =
"📊 Today: "+
data.dailyUsage+
" / 100 questions";

}


generateBtn.disabled=false;

generateBtn.textContent =
"🤖 Generate Question";


}catch(error){

console.error(error);

message.textContent =
"Connection error. Please try again.";

generateBtn.disabled=false;

generateBtn.textContent =
"🤖 Generate Question";

}

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(q){

questionNumber++;

questionCard.classList.remove(
"hidden"
);


document.getElementById(
"progress"
).textContent =
"Question "+
questionNumber+
" • Daily limit: 100";


questionBox.textContent =
q.question ||
q.Question ||
"Question unavailable";


optionsBox.innerHTML="";

answerBox.style.display =
"none";

answerBox.innerHTML="";


let options =
q.options ||
q.Options ||
[];


if(!Array.isArray(options)){

options =
Object.values(options);

}


/* ONLY 4 OPTIONS */

options =
options.slice(0,4);


options.forEach(
function(option,index){

const button =
document.createElement(
"button"
);

button.className =
"option";

button.textContent =
String.fromCharCode(65+index)+
". "+
option;


button.onclick =
function(){

selectAnswer(
button,
option,
q
);

};


optionsBox.appendChild(
button
);

});


if(options.length !== 4){

message.textContent =
"⚠️ The AI did not return exactly 4 options.";

}


questionCard.scrollIntoView({
behavior:"smooth"
});

}


/* =========================================
   ANSWER
========================================= */

function selectAnswer(
clicked,
selected,
q
){

const correct =
q.correct_answer ||
q.correctAnswer ||
q.answer ||
q.correct;


const buttons =
document.querySelectorAll(
".option"
);


buttons.forEach(
function(button){

button.disabled=true;

const text =
button.textContent.substring(3);

if(
text === String(correct)
){

button.classList.add(
"correct"
);

}

});


if(
String(selected) !==
String(correct)
){

clicked.classList.add(
"wrong"
);

}


answerBox.innerHTML =
"<strong>✅ Correct Answer:</strong> "+
escapeHTML(String(correct))+
"<br><br>"+
"<strong>💡 Explanation:</strong><br>"+
escapeHTML(
String(
q.explanation ||
""
)
);

answerBox.style.display =
"block";


nextBtn.classList.remove(
"hidden"
);


if(
questionNumber >= 100
){

nextBtn.textContent =
"🎯 Daily Limit Reached";

nextBtn.disabled=true;

}

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_user"
);

window.location.href =
"login.html";

}


/* =========================================
   START
========================================= */

checkMembership();

</script>

</body>
</html>
