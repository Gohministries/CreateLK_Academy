<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Christian Book Reader</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,"Noto Sans",sans-serif;
  background:#111827;
  color:#fff;
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:58px;
  flex-shrink:0;
  background:#0b1220;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  border-bottom:1px solid #374151;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-icon{
  font-size:24px;
}

.book-name{
  font-size:16px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  gap:5px;
}

.header-actions button{
  border:1px solid #4b5563;
  background:#1f2937;
  color:#fff;
  border-radius:6px;
  padding:7px 10px;
}

.header-actions button:hover{
  background:#374151;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:flex;
}

/* THUMBNAILS */

.thumbs{
  width:210px;
  flex-shrink:0;
  background:#111827;
  border-right:1px solid #374151;
  overflow-y:auto;
  padding:10px;
}

.thumb{
  background:#fff;
  color:#111;
  margin-bottom:10px;
  border-radius:5px;
  padding:5px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumb.active{
  border-color:#60a5fa;
}

.thumb-number{
  font-size:10px;
  color:#555;
  text-align:center;
  margin-bottom:4px;
}

.thumb-page{
  width:100%;
  aspect-ratio:210/297;
  background:#fff;
  color:#111;
  overflow:hidden;
  position:relative;
}

.thumb-page-content{
  padding:10%;
  font-size:5px;
  line-height:1.3;
}

.thumb-page img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* READER */

.reader{
  flex:1;
  min-width:0;
  min-height:0;
  position:relative;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:30px;
}

.paper-holder{
  transform-origin:top center;
  transition:transform .2s ease;
}

.paper{
  background:#fff;
  color:#111;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 40px #0009;
  flex-shrink:0;
}

.paper.a4.portrait{
  width:794px;
  height:1123px;
}

.paper.a4.landscape{
  width:1123px;
  height:794px;
}

.paper.b5.portrait{
  width:665px;
  height:941px;
}

.paper.b5.landscape{
  width:941px;
  height:665px;
}

.paper-inner{
  position:absolute;
  inset:0;
  padding:55px;
  overflow:hidden;
}

.bg-layer{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.bg-overlay{
  position:absolute;
  inset:0;
}

.page-content{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  overflow:hidden;
}

.border-layer{
  position:absolute;
  z-index:8;
  pointer-events:none;
}

/* BACKGROUNDS */

.bg-cross{
  background:
    linear-gradient(90deg,transparent 46%,#b9a36a 46%,#b9a36a 54%,transparent 54%),
    linear-gradient(transparent 36%,#b9a36a 36%,#b9a36a 44%,transparent 44%),
    radial-gradient(circle,#f7f0d0,#d8d0ad);
}

.bg-bible{
  background:
    linear-gradient(155deg,#2d241c 0 45%,transparent 46%),
    linear-gradient(25deg,#493b2d 0 45%,transparent 46%),
    #ddd;
}

.bg-dove{
  background:
    radial-gradient(ellipse at 45% 45%,white 0 18%,transparent 19%),
    radial-gradient(ellipse at 60% 40%,white 0 12%,transparent 13%),
    linear-gradient(135deg,#dbeafe,#fff);
}

.bg-prayer{
  background:
    radial-gradient(circle at 50% 40%,#fff 0 8%,transparent 9%),
    radial-gradient(circle at 40% 50%,#cbd5e1 0 15%,transparent 16%),
    linear-gradient(135deg,#e0e7ff,#f8fafc);
}

.bg-church{
  background:
    linear-gradient(170deg,transparent 0 48%,#475569 49% 100%),
    linear-gradient(90deg,transparent 47%,#475569 47% 53%,transparent 53%),
    #e2e8f0;
}

.bg-cloud{
  background:
    radial-gradient(circle at 20% 50%,white 0 15%,transparent 16%),
    radial-gradient(circle at 40% 40%,white 0 20%,transparent 21%),
    radial-gradient(circle at 65% 55%,white 0 17%,transparent 18%),
    linear-gradient(#93c5fd,#f8fafc);
}

.bg-sunrise{
  background:
    radial-gradient(circle at 50% 85%,#fff 0 10%,#fde68a 11% 20%,transparent 21%),
    linear-gradient(#1e3a8a,#fbbf24,#fff);
}

.bg-wheat{
  background:
    repeating-linear-gradient(75deg,#d6b56c 0 4px,transparent 4px 15px),
    linear-gradient(#dbeafe,#fef3c7);
}

.bg-candle{
  background:
    radial-gradient(ellipse at 50% 30%,#fff 0 5%,#f59e0b 6% 12%,transparent 13%),
    linear-gradient(#1f2937,#111827);
}

.bg-crown{
  background:
    linear-gradient(135deg,transparent 40%,#d4af37 41% 45%,transparent 46%),
    linear-gradient(45deg,transparent 40%,#d4af37 41% 45%,transparent 46%),
    #f8fafc;
}

.bg-stars{
  background:
    radial-gradient(circle,#fff 0 2px,transparent 3px) 0 0/35px 35px,
    linear-gradient(#111827,#1e3a8a);
}

.bg-olive{
  background:
    repeating-linear-gradient(45deg,transparent 0 20px,#789262 21px 23px),
    #edf4e8;
}

/* COVER */

.cover-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

.cover-overlay{
  position:absolute;
  inset:0;
  z-index:2;
}

.cover-content{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:60px;
  color:#fff;
}

.cover-title{
  font-size:42px;
  font-weight:800;
  text-shadow:0 2px 7px #000;
}

.cover-subtitle{
  margin-top:15px;
  font-size:20px;
  text-shadow:0 2px 5px #000;
}

.cover-author{
  margin-top:30px;
  font-size:16px;
  text-shadow:0 2px 5px #000;
}

/* BOTTOM CONTROLS */

.controls{
  height:64px;
  flex-shrink:0;
  background:#0b1220;
  border-top:1px solid #374151;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px;
  z-index:100;
}

.controls button{
  border:1px solid #4b5563;
  background:#1f2937;
  color:#fff;
  border-radius:6px;
  padding:8px 12px;
}

.controls button:hover{
  background:#374151;
}

.page-display{
  min-width:100px;
  text-align:center;
  font-size:13px;
}

.zoom-display{
  min-width:55px;
  text-align:center;
  font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    height:52px;
  }

  .book-name{
    font-size:13px;
  }

  .thumbs{
    display:none;
  }

  .reader{
    padding:15px;
  }

  .controls{
    height:58px;
  }

  .controls button{
    padding:7px 9px;
  }

}

/* FULLSCREEN */

:fullscreen{
  background:#111827;
}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">
    <div class="brand-icon">✝</div>
    <div class="book-name" id="bookName">
      Christian Book
    </div>
  </div>

  <div class="header-actions">
    <button onclick="toggleThumbnails()">☰</button>
    <button onclick="toggleFullscreen()">⛶</button>
  </div>

</header>


<div class="main">

  <aside class="thumbs" id="thumbs"></aside>

  <section class="reader" id="reader">

    <div class="paper-holder" id="paperHolder">

      <div class="paper" id="paper">

        <div class="paper-inner">

          <div id="bgLayer" class="bg-layer"></div>
          <div id="bgOverlay" class="bg-overlay"></div>

          <img id="coverPhoto"
               class="cover-photo"
               style="display:none">

          <div id="coverOverlay"
               class="cover-overlay"
               style="display:none">
          </div>

          <div id="coverContent"
               class="cover-content"
               style="display:none">

            <div id="coverTitle"
                 class="cover-title"></div>

            <div id="coverSubtitle"
                 class="cover-subtitle"></div>

            <div id="coverAuthor"
                 class="cover-author"></div>

          </div>

          <div id="pageContent"
               class="page-content">
          </div>

          <div id="borderLayer"
               class="border-layer">
          </div>

        </div>

      </div>

    </div>

  </section>

</div>


<div class="controls">

  <button onclick="previousPage()">←</button>

  <div class="page-display" id="pageDisplay">
    1 / 1
  </div>

  <button onclick="nextPage()">→</button>

  <button onclick="zoomOut()">−</button>

  <div class="zoom-display" id="zoomDisplay">
    100%
  </div>

  <button onclick="zoomIn()">＋</button>

  <button onclick="fitPage()">Fit</button>

</div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let book = null;

let currentPage = 0;

let zoom = 1;


/* =========================================================
   LOAD BOOK
========================================================= */

function loadBook(){

  const saved =
    localStorage.getItem("christianBookCreator");

  if(!saved){

    showDemoBook();

    return;
  }

  try{

    book = JSON.parse(saved);

    if(!book.pages || !book.pages.length){
      throw new Error();
    }

    renderAll();

  }catch(e){

    showDemoBook();

  }

}


/* =========================================================
   DEMO BOOK
========================================================= */

function showDemoBook(){

  book={
    title:"Christian Book",
    author:"",
    paperSize:"a4",
    orientation:"portrait",
    colorMode:"color",
    coverEnabled:true,
    cover:{
      photo:"",
      title:"Christian Book",
      subtitle:"Faith • Hope • Love",
      author:"",
      overlay:"#000000",
      overlayOpacity:.35
    },
    pages:[
      {
        title:"Cover",
        content:"",
        background:"cross",
        bgOpacity:.35,
        overlay:"#ffffff",
        overlayOpacity:0,
        border:{
          enabled:false,
          style:"solid",
          width:2,
          color:"#111",
          inset:15
        }
      },
      {
        title:"Welcome",
        content:
          "<h1>Welcome</h1><p>Welcome to this Christian book.</p>",
        background:"cloud",
        bgOpacity:.25,
        overlay:"#ffffff",
        overlayOpacity:.5,
        border:{
          enabled:true,
          style:"solid",
          width:2,
          color:"#333",
          inset:15
        }
      }
    ]
  };

  renderAll();

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll(){

  document.getElementById("bookName").textContent =
    book.title || "Christian Book";

  renderThumbnails();

  renderPage();

  fitPage();

}


/* =========================================================
   RENDER PAGE
========================================================= */

function renderPage(){

  const page =
    book.pages[currentPage];

  if(!page) return;

  const paper =
    document.getElementById("paper");

  paper.className =
    "paper " +
    (book.paperSize || "a4") +
    " " +
    (book.orientation || "portrait");


  /* CONTENT */

  const content =
    document.getElementById("pageContent");

  if(currentPage === 0 && book.coverEnabled){

    content.style.display="none";

    renderCover();

  }else{

    content.style.display="block";

    content.innerHTML =
      page.content || "";

    document.getElementById("coverContent")
      .style.display="none";

    document.getElementById("coverPhoto")
      .style.display="none";

    document.getElementById("coverOverlay")
      .style.display="none";

  }


  /* BACKGROUND */

  const bg =
    document.getElementById("bgLayer");

  const selected =
    getBackgroundClass(page.background);

  bg.className="bg-layer";

  if(selected){
    bg.classList.add(selected);
  }

  bg.style.opacity =
    page.bgOpacity ?? .35;


  const overlay =
    document.getElementById("bgOverlay");

  overlay.style.background =
    page.overlay || "#fff";

  overlay.style.opacity =
    page.overlayOpacity ?? 0;


  /* BORDER */

  renderBorder(page);


  /* COLOR MODE */

  const paperHolder =
    document.getElementById("paperHolder");

  paperHolder.style.filter="none";

  if(book.colorMode==="grayscale"){
    paperHolder.style.filter="grayscale(1)";
  }

  if(book.colorMode==="bw"){
    paperHolder.style.filter=
      "grayscale(1) contrast(2)";
  }


  document.getElementById("pageDisplay")
    .textContent =
      (currentPage+1) +
      " / " +
      book.pages.length;

}


function getBackgroundClass(id){

  const map={
    cross:"bg-cross",
    bible:"bg-bible",
    dove:"bg-dove",
    prayer:"bg-prayer",
    church:"bg-church",
    cloud:"bg-cloud",
    sunrise:"bg-sunrise",
    wheat:"bg-wheat",
    candle:"bg-candle",
    crown:"bg-crown",
    stars:"bg-stars",
    olive:"bg-olive"
  };

  return map[id] || "bg-cross";

}


/* =========================================================
   COVER
========================================================= */

function renderCover(){

  const cover =
    book.cover || {};

  const content =
    document.getElementById("coverContent");

  content.style.display="flex";

  document.getElementById("coverTitle")
    .textContent =
      cover.title ||
      book.title ||
      "Christian Book";

  document.getElementById("coverSubtitle")
    .textContent =
      cover.subtitle || "";

  document.getElementById("coverAuthor")
    .textContent =
      cover.author ||
      book.author ||
      "";


  const photo =
    document.getElementById("coverPhoto");

  if(cover.photo){

    photo.src=cover.photo;
    photo.style.display="block";

  }else{

    photo.style.display="none";

  }


  const overlay =
    document.getElementById("coverOverlay");

  overlay.style.display="block";

  overlay.style.background =
    cover.overlay || "#000";

  overlay.style.opacity =
    cover.overlayOpacity ?? .35;

}


/* =========================================================
   BORDER
========================================================= */

function renderBorder(page){

  const border =
    document.getElementById("borderLayer");

  const data =
    page.border;

  if(!data || !data.enabled){

    border.style.display="none";

    return;
  }

  border.style.display="block";

  border.style.inset =
    (data.inset || 15) + "px";

  border.style.border =
    (data.width || 2) +
    "px " +
    (data.style || "solid") +
    " " +
    (data.color || "#111");

}


/* =========================================================
   THUMBNAILS
========================================================= */

function renderThumbnails(){

  const container =
    document.getElementById("thumbs");

  container.innerHTML="";

  book.pages.forEach((page,index)=>{

    const thumb =
      document.createElement("div");

    thumb.className =
      "thumb " +
      (index===currentPage ? "active" : "");

    thumb.onclick=()=>{
      currentPage=index;
      renderThumbnails();
      renderPage();
      fitPage();
    };


    const number =
      document.createElement("div");

    number.className="thumb-number";

    number.textContent =
      "Page " + (index+1);


    const preview =
      document.createElement("div");

    preview.className="thumb-page";


    if(index===0 && book.coverEnabled){

      if(book.cover.photo){

        const img =
          document.createElement("img");

        img.src=book.cover.photo;

        preview.appendChild(img);

      }else{

        preview.classList.add(
          getBackgroundClass(
            page.background
          )
        );

      }

    }else{

      preview.classList.add(
        getBackgroundClass(
          page.background
        )
      );

      const text =
        document.createElement("div");

      text.className=
        "thumb-page-content";

      text.innerHTML =
        page.content || "";

      preview.appendChild(text);

    }


    thumb.appendChild(number);
    thumb.appendChild(preview);

    container.appendChild(thumb);

  });

}


/* =========================================================
   NAVIGATION
========================================================= */

function previousPage(){

  if(currentPage <= 0) return;

  currentPage--;

  renderThumbnails();
  renderPage();
  fitPage();

}


function nextPage(){

  if(currentPage >= book.pages.length-1)
    return;

  currentPage++;

  renderThumbnails();
  renderPage();
  fitPage();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft"){
    previousPage();
  }

  if(e.key==="ArrowRight"){
    nextPage();
  }

});


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

  zoom =
    Math.min(
      2,
      zoom + .1
    );

  applyZoom();

}


function zoomOut(){

  zoom =
    Math.max(
      .25,
      zoom - .1
    );

  applyZoom();

}


function applyZoom(){

  document.getElementById("paperHolder")
    .style.transform =
      "scale(" + zoom + ")";

  document.getElementById("zoomDisplay")
    .textContent =
      Math.round(zoom*100) + "%";

}


function fitPage(){

  const reader =
    document.getElementById("reader");

  const paper =
    document.getElementById("paper");

  const width =
    paper.offsetWidth;

  const height =
    paper.offsetHeight;

  const availableWidth =
    reader.clientWidth - 40;

  const availableHeight =
    reader.clientHeight - 40;

  const scale =
    Math.min(
      availableWidth / width,
      availableHeight / height,
      1
    );

  zoom =
    Math.max(
      .25,
      scale
    );

  applyZoom();

}


/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* =========================================================
   THUMBNAILS TOGGLE
========================================================= */

function toggleThumbnails(){

  const thumbs =
    document.getElementById("thumbs");

  if(
    thumbs.style.display === "none"
  ){

    thumbs.style.display="block";

  }else{

    thumbs.style.display="none";

  }

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    fitPage();
  }
);


/* =========================================================
   START
========================================================= */

loadBook();

</script>

</body>
</html>
