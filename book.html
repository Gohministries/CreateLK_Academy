<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Christian Prayer Book</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans",
    sans-serif;
  background:#f2f2f2;
  color:#111;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 2px 10px #0004;
}

header h1{
  margin:0;
  font-size:19px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

button:focus-visible{
  outline:3px solid #fff;
  outline-offset:2px;
}

.pdfButton{
  background:#fff;
  color:#111;
}

.topButton{
  background:#d4af37;
  color:#111;
}

/* =========================
   MAIN
========================= */

main{
  width:min(1000px,94%);
  margin:20px auto 50px;
}

/* =========================
   BOOK COVER
========================= */

.bookCover{
  background:#fff;
  min-height:600px;
  border-radius:15px;
  padding:35px 25px;
  margin-bottom:25px;
  box-shadow:0 3px 18px #0002;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  position:relative;
  overflow:hidden;
}

.bookCover::before{
  content:"";
  position:absolute;
  inset:15px;
  border:2px solid #111;
  pointer-events:none;
}

.bookCover img{
  max-width:85%;
  max-height:350px;
  object-fit:contain;
  margin-bottom:25px;
  position:relative;
  z-index:1;
}

.bookCover h2{
  margin:8px 0;
  font-size:34px;
  position:relative;
  z-index:1;
}

.bookCover .subtitle{
  margin:8px 0;
  font-size:20px;
  color:#555;
  position:relative;
  z-index:1;
}

.bookCover .ministry{
  margin-top:20px;
  font-size:17px;
  font-weight:bold;
  position:relative;
  z-index:1;
}

/* =========================
   LOADING / ERROR
========================= */

.message{
  background:#fff;
  border-radius:12px;
  padding:30px;
  text-align:center;
  box-shadow:0 3px 15px #0002;
  margin:20px 0;
}

.error{
  color:#a00000;
}

/* =========================
   BOOK CONTENT
========================= */

#bookContent{
  display:none;
}

.page{
  position:relative;
  width:100%;
  min-height:1123px;
  background:#fff;
  color:#111;

  margin:25px auto;
  padding:65px 65px 75px;

  border-radius:10px;
  box-shadow:0 3px 18px #0002;

  overflow:hidden;
}

.page.outline{
  border:2px solid #111;
}

.pageNumber{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;

  text-align:center;
  font-size:13px;
  color:#555;
}

.pageTitle{
  text-align:center;
  font-size:28px;
  margin:0 0 25px;
  line-height:1.3;
}

.pagePhoto{
  display:block;
  max-width:100%;
  max-height:400px;

  margin:0 auto 25px;

  object-fit:contain;

  filter:none;
}

.pageText{
  font-size:18px;
  line-height:1.9;
  white-space:normal;
  word-wrap:break-word;
}

.pageVerse{
  margin-top:35px;
  padding:18px 15px;

  border-top:1px solid #111;
  border-bottom:1px solid #111;

  text-align:center;

  font-size:16px;
  line-height:1.7;
  font-style:italic;
}

/* =========================
   BACK TO TOP
========================= */

.backTop{
  display:block;
  width:max-content;
  margin:25px auto;
  background:#111;
  color:#fff;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:25px 15px;
  color:#666;
  font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    position:relative;
  }

  header h1{
    font-size:17px;
  }

  main{
    width:96%;
  }

  .bookCover{
    min-height:500px;
    padding:30px 20px;
  }

  .bookCover h2{
    font-size:27px;
  }

  .bookCover .subtitle{
    font-size:17px;
  }

  .bookCover img{
    max-height:260px;
  }

  .page{
    min-height:0;
    padding:45px 25px 65px;
    margin:15px auto;
  }

  .pageTitle{
    font-size:23px;
  }

  .pageText{
    font-size:17px;
    line-height:1.8;
  }

  .pagePhoto{
    max-height:280px;
  }

  .pageVerse{
    font-size:15px;
  }

}

/* =========================
   PRINT
========================= */

@media print{

  body{
    background:#fff;
  }

  header,
  footer,
  .backTop,
  .message{
    display:none!important;
  }

  main{
    width:100%;
    margin:0;
  }

  #bookContent{
    display:block!important;
  }

  .bookCover,
  .page{
    width:210mm;
    min-height:297mm;

    margin:0;

    border-radius:0;
    box-shadow:none;

    page-break-after:always;

    background:#fff!important;
    color:#000!important;
  }

  .page.outline{
    border:2px solid #000;
  }

}

</style>

</head>

<body>

<header>

  <h1 id="headerTitle">
    📖 Christian Prayer Book
  </h1>

  <div class="actions">

    <button
      class="topButton"
      onclick="scrollToTop()"
    >
      ↑ Top
    </button>

    <button
      class="pdfButton"
      onclick="downloadPDF()"
    >
      📄 Download PDF
    </button>

  </div>

</header>


<main>

  <!-- LOADING -->

  <div
    id="loading"
    class="message"
  >
    Loading prayer book...
  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="message error"
    style="display:none"
  >
    Could not load the prayer book.
  </div>


  <!-- PUBLIC BOOK -->

  <div id="bookContent">

    <!-- COVER -->

    <section
      id="bookCover"
      class="bookCover"
    >

      <img
        id="coverImage"
        style="display:none"
        alt="Prayer book cover"
      >

      <h2 id="bookTitle">
        Christian Prayer Book
      </h2>

      <div
        id="bookSubtitle"
        class="subtitle"
      >
        Prayers for Every Day
      </div>

      <div
        id="bookMinistry"
        class="ministry"
      >
        Gate of Heaven Ministries
      </div>

    </section>


    <!-- PAGES -->

    <div id="pages"></div>


    <button
      class="backTop"
      onclick="scrollToTop()"
    >
      ↑ Back to Top
    </button>

  </div>

</main>


<footer>

  <div id="footerMinistry">
    Gate of Heaven Ministries
  </div>

</footer>


<script>

/* =========================================
   BOOK DATA
========================================= */

let book={
  title:"Christian Prayer Book",
  subtitle:"Prayers for Every Day",
  ministry:"Gate of Heaven Ministries",
  cover:"",
  outline:true,
  pageNumbers:true,
  pages:[]
};


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   TEXT WITH LINE BREAKS
========================================= */

function formatText(value){

  return esc(value)
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .replace(/\n/g,"<br>");

}


/* =========================================
   LOAD BOOK
========================================= */

async function loadBook(){

  try{

    const response=
      await fetch(
        "/api/book",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "Book loading failed"
      );
    }

    const data=
      await response.json();

    if(data && typeof data==="object"){

      book={
        ...book,
        ...data
      };

      if(!Array.isArray(book.pages)){
        book.pages=[];
      }

    }

    renderBook();

  }catch(error){

    console.error(error);

    document
      .getElementById("loading")
      .style.display="none";

    document
      .getElementById("error")
      .style.display="block";

  }

}


/* =========================================
   RENDER BOOK
========================================= */

function renderBook(){

  document
    .getElementById("loading")
    .style.display="none";

  document
    .getElementById("error")
    .style.display="none";

  document
    .getElementById("bookContent")
    .style.display="block";


  /* TITLE */

  const title=
    book.title ||
    "Christian Prayer Book";

  document
    .getElementById("headerTitle")
    .textContent=
      "📖 " + title;

  document
    .getElementById("bookTitle")
    .textContent=
      title;


  /* SUBTITLE */

  const subtitle=
    document
      .getElementById("bookSubtitle");

  if(book.subtitle){

    subtitle.textContent=
      book.subtitle;

    subtitle.style.display=
      "block";

  }else{

    subtitle.style.display=
      "none";

  }


  /* MINISTRY */

  const ministry=
    book.ministry ||
    "Gate of Heaven Ministries";

  document
    .getElementById("bookMinistry")
    .textContent=
      ministry;

  document
    .getElementById("footerMinistry")
    .textContent=
      ministry;


  /* COVER */

  const cover=
    document
      .getElementById("coverImage");

  if(book.cover){

    cover.src=
      book.cover;

    cover.style.display=
      "block";

  }else{

    cover.style.display=
      "none";

  }


  renderPages();

}


/* =========================================
   RENDER PAGES
========================================= */

function renderPages(){

  const container=
    document.getElementById("pages");

  container.innerHTML="";


  book.pages.forEach(
    (page,index)=>{

      const section=
        document.createElement("section");

      section.className=
        "page" +
        (
          book.outline!==false
          ? " outline"
          : ""
        );


      let html="";


      /* OPTIONAL TITLE */

      if(page.title){

        html+=`
          <h2 class="pageTitle">
            ${esc(page.title)}
          </h2>
        `;

      }


      /* OPTIONAL PHOTO */

      if(page.photo){

        html+=`
          <img
            class="pagePhoto"
            src="${esc(page.photo)}"
            alt=""
          >
        `;

      }


      /* PRAYER TEXT */

      if(page.text){

        html+=`
          <div class="pageText">
            ${formatText(page.text)}
          </div>
        `;

      }


      /* BIBLE VERSE */

      if(page.verse){

        html+=`
          <div class="pageVerse">
            ${formatText(page.verse)}
          </div>
        `;

      }


      /* PAGE NUMBER */

      if(book.pageNumbers!==false){

        html+=`
          <div class="pageNumber">
            ${index+1}
          </div>
        `;

      }


      section.innerHTML=
        html;

      container.appendChild(
        section
      );

    }
  );

}


/* =========================================
   SCROLL TOP
========================================= */

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   PDF PASSWORD
========================================= */

async function downloadPDF(){

  const password=
    prompt(
      "Enter PDF download password:"
    );

  if(password===null){
    return;
  }

  if(!password.trim()){

    alert(
      "Please enter the PDF password."
    );

    return;

  }


  try{

    const response=
      await fetch(
        "/api/pdf-password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            password:password
          })

        }
      );


    if(!response.ok){

      alert(
        "Incorrect PDF password."
      );

      return;

    }


    await createPDF();

  }catch(error){

    console.error(error);

    alert(
      "Could not verify the PDF password."
    );

  }

}


/* =========================================
   CREATE BLACK & WHITE PDF
========================================= */

async function createPDF(){

  const cover=
    document.getElementById(
      "bookCover"
    );

  const pages=
    document.querySelectorAll(
      "#pages .page"
    );


  if(
    !cover &&
    !pages.length
  ){

    alert(
      "There is no book content."
    );

    return;

  }


  const {jsPDF}=
    window.jspdf;


  const pdf=
    new jsPDF(
      "p",
      "mm",
      "a4"
    );


  /* =====================================
     CREATE PDF PAGE LIST
  ===================================== */

  const allPages=[
    cover,
    ...Array.from(pages)
  ];


  for(
    let i=0;
    i<allPages.length;
    i++
  ){

    if(i>0){

      pdf.addPage();

    }


    const element=
      allPages[i];


    /*
      Clone the page.

      This ensures PDF export stays
      independent from the public design.
    */

    const clone=
      element.cloneNode(true);


    clone.style.position=
      "absolute";

    clone.style.left=
      "-99999px";

    clone.style.top=
      "0";

    clone.style.width=
      "794px";

    clone.style.minHeight=
      "1123px";

    clone.style.margin=
      "0";

    clone.style.borderRadius=
      "0";

    clone.style.boxShadow=
      "none";

    clone.style.background=
      "#fff";

    clone.style.color=
      "#000";

    clone.style.filter=
      "grayscale(100%)";


    /*
      Force every element to
      black and white.
    */

    clone
      .querySelectorAll("*")
      .forEach(el=>{

        el.style.backgroundColor=
          "#fff";

        el.style.color=
          "#000";

        el.style.borderColor=
          "#000";

        el.style.boxShadow=
          "none";

        el.style.textShadow=
          "none";

        el.style.filter=
          "grayscale(100%)";

      });


    /*
      Cover outline
    */

    if(
      book.outline!==false
    ){

      clone.style.border=
        "2px solid #000";

    }else{

      clone.style.border=
        "0";

    }


    document.body.appendChild(
      clone
    );


    const canvas=
      await html2canvas(
        clone,
        {
          scale:2,

          backgroundColor:
            "#ffffff",

          useCORS:true,

          logging:false
        }
      );


    document.body.removeChild(
      clone
    );


    /*
      Convert pixels to
      true grayscale.
    */

    const ctx=
      canvas.getContext(
        "2d"
      );


    const imageData=
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    for(
      let p=0;
      p<imageData.data.length;
      p+=4
    ){

      const r=
        imageData.data[p];

      const g=
        imageData.data[p+1];

      const b=
        imageData.data[p+2];


      const gray=
        Math.round(
          0.299*r+
          0.587*g+
          0.114*b
        );


      imageData.data[p]=
        gray;

      imageData.data[p+1]=
        gray;

      imageData.data[p+2]=
        gray;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


    const image=
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    pdf.addImage(
      image,
      "JPEG",
      0,
      0,
      210,
      297
    );

  }


  /* =====================================
     FILE NAME
  ===================================== */

  let filename=
    book.title ||
    "Christian-Prayer-Book";


  filename=
    filename
      .replace(
        /[<>:"/\\|?*]+/g,
        "-"
      )
      .trim();


  if(!filename){

    filename=
      "Christian-Prayer-Book";

  }


  pdf.save(
    filename + ".pdf"
  );

}


/* =========================================
   START
========================================= */

loadBook();

</script>

</body>
</html>
