<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Plan Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.header{
  background:#071b3a;
  color:white;
  padding:18px 20px;
}
.header h1{margin:0;font-size:21px}
.header p{margin:5px 0 0;color:#b9c8df;font-size:13px}

.container{
  max-width:600px;
  margin:30px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:16px;
  padding:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.card h2{margin-top:0}

.current{
  background:#eef5ff;
  padding:16px;
  border-radius:12px;
  margin-bottom:22px;
}

.current strong{
  display:block;
  font-size:28px;
  color:#1264d6;
  margin-top:5px;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e3;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#1264d6;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  display:none;
}

.success{
  display:block;
  background:#e8f8ee;
  color:#137333;
}

.error{
  display:block;
  background:#fdecec;
  color:#b3261e;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#1264d6;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>CreateLK Academy</h1>
  <p>Premium Plan Administration</p>
</div>

<div class="container">

  <div class="card">

    <h2>Premium Plan</h2>

    <div class="current">
      Current Price
      <strong id="currentPrice">Loading...</strong>
      <span id="currentDuration"></span>
    </div>

    <label for="price">Premium Price (LKR)</label>
    <input
      id="price"
      type="number"
      min="1"
      step="1"
      placeholder="999"
    >

    <label for="duration">Duration (Days)</label>
    <input
      id="duration"
      type="number"
      min="1"
      step="1"
      placeholder="30"
    >

    <button id="saveBtn" onclick="savePlan()">
      Save Changes
    </button>

    <div id="message" class="message"></div>

    <a class="back" href="/dashboard.html">
      ← Back to Dashboard
    </a>

  </div>

</div>

<script>

const API =
  "https://createlk-payhere.createlk.workers.dev";

const token =
  localStorage.getItem("createlk_token");

if(!token){
  showMessage(
    "You are not logged in.",
    "error"
  );
  document.getElementById("saveBtn").disabled = true;
}

async function loadPlan(){

  try{

    const response = await fetch(
      API + "/admin/premium-plan",
      {
        headers:{
          "Authorization":"Bearer " + token
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "Unable to load premium plan."
      );
    }

    document.getElementById("currentPrice")
      .textContent =
      "LKR " + Number(data.plan.price_lkr).toLocaleString();

    document.getElementById("currentDuration")
      .textContent =
      data.plan.duration_days + " days";

    document.getElementById("price").value =
      data.plan.price_lkr;

    document.getElementById("duration").value =
      data.plan.duration_days;

  }catch(error){

    showMessage(error.message,"error");

  }
}

async function savePlan(){

  const price =
    Number(document.getElementById("price").value);

  const duration =
    Number(document.getElementById("duration").value);

  if(!price || price < 1){
    showMessage(
      "Enter a valid Premium price.",
      "error"
    );
    return;
  }

  if(!duration || duration < 1){
    showMessage(
      "Enter a valid duration.",
      "error"
    );
    return;
  }

  const button =
    document.getElementById("saveBtn");

  button.disabled = true;
  button.textContent = "Saving...";

  try{

    const response = await fetch(
      API + "/admin/premium-plan",
      {
        method:"POST",

        headers:{
          "Authorization":"Bearer " + token,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          price_lkr:price,
          duration_days:duration
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "Unable to save plan."
      );
    }

    showMessage(
      "Premium plan updated successfully.",
      "success"
    );

    await loadPlan();

  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Save Changes";

  }
}

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;
  box.className =
    "message " + type;

}

loadPlan();

</script>

</body>
</html>
