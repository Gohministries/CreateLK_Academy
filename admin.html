<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy Admin</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033
}
header{
background:#fff;border-bottom:1px solid #e5e7eb;padding:15px
}
.nav{
max-width:900px;margin:auto;display:flex;
justify-content:space-between;align-items:center
}
.logo{font-size:19px;font-weight:800;color:#155eef}
.back{
background:#eef4ff;color:#155eef;padding:9px 13px;
border-radius:8px;text-decoration:none;font-weight:bold;font-size:13px
}
.container{max-width:900px;margin:auto;padding:25px 15px}
h1{text-align:center;font-size:25px;margin:5px 0 8px}
.sub{text-align:center;color:#667085;font-size:13px;margin-bottom:22px}
.login,.panel{
background:#fff;border:1px solid #e5e7eb;border-radius:14px;
padding:20px;margin-bottom:18px
}
input{
width:100%;padding:13px;border:1px solid #d0d5dd;
border-radius:8px;margin:8px 0 12px;font-size:14px
}
button{
border:0;border-radius:8px;padding:11px 14px;
font-weight:bold;cursor:pointer
}
.loginbtn{width:100%;background:#155eef;color:white}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;background:#eef4ff;color:#155eef}
.tab.active{background:#155eef;color:white}
.section{display:none}
.section.active{display:block}
.item{
background:#fff;border:1px solid #e5e7eb;border-radius:12px;
padding:16px;margin-bottom:12px
}
.row{
display:flex;justify-content:space-between;gap:10px;
padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px
}
.row:last-child{border:0}
.label{color:#667085}
.value{font-weight:bold;text-align:right;word-break:break-word}
.badge{
padding:5px 9px;border-radius:15px;background:#fff7ed;
color:#c2410c;font-size:11px;font-weight:bold
}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:12px}
.approve{flex:1;background:#16a34a;color:white}
.reject{flex:1;background:#dc2626;color:white}
.msg{
display:none;padding:11px;border-radius:8px;
background:#eef4ff;color:#344054;margin-bottom:15px;
font-size:13px;text-align:center
}
.empty{text-align:center;color:#667085;padding:25px}
footer{text-align:center;color:#98a2b3;font-size:11px;padding:25px}
@media(max-width:600px){
.actions{flex-direction:column}
.row{display:block}
.value{text-align:left;margin-top:3px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header>

<main class="container">

<h1>🔐 Admin Management</h1>
<p class="sub">Student payments and affiliate payouts</p>

<div id="msg" class="msg"></div>

<div id="login" class="login">
<input id="key" type="password" placeholder="Enter Admin Key">
<button class="loginbtn" onclick="login()">🔐 Login</button>
</div>

<div id="admin" style="display:none">

<div class="tabs">
<button id="payTab" class="tab active" onclick="showTab('payments')">
💳 Payments
</button>
<button id="payoutTab" class="tab" onclick="showTab('payouts')">
🤝 Payouts
</button>
</div>

<div id="payments" class="section active">
<div class="panel">
<button class="loginbtn" onclick="loadPayments()">🔄 Load Payments</button>
</div>
<div id="paymentList"></div>
</div>

<div id="payouts" class="section">
<div class="panel">
<button class="loginbtn" onclick="loadPayouts()">🔄 Load Payouts</button>
</div>
<div id="payoutList"></div>
</div>

</div>

</main>

<footer>© 2026 CreateLK Academy. All rights reserved.</footer>

<script>

const PAYMENT_API="https://admin-approval.createlk.workers.dev";
const PAYOUT_API="https://createlk-affiliate-payout.createlk.workers.dev";

let KEY="";

function msg(t){
const x=document.getElementById("msg");
x.textContent=t;
x.style.display="block";
}

function login(){

KEY=document.getElementById("key").value.trim();

if(!KEY){
msg("Please enter the Admin Key.");
return;
}

document.getElementById("login").style.display="none";
document.getElementById("admin").style.display="block";

msg("Admin access granted.");
loadPayments();
}

function showTab(tab){

document.getElementById("payments").classList.remove("active");
document.getElementById("payouts").classList.remove("active");

document.getElementById("payTab").classList.remove("active");
document.getElementById("payoutTab").classList.remove("active");

if(tab==="payments"){
document.getElementById("payments").classList.add("active");
document.getElementById("payTab").classList.add("active");
loadPayments();
}else{
document.getElementById("payouts").classList.add("active");
document.getElementById("payoutTab").classList.add("active");
loadPayouts();
}
}

/* STUDENT PAYMENTS */

async function loadPayments(){

const box=document.getElementById("paymentList");
box.innerHTML='<div class="empty">⏳ Loading...</div>';

try{

const r=await fetch(PAYMENT_API+"/api/admin/payments",{
headers:{
"X-Admin-Key":KEY,
"Authorization":"Bearer "+KEY
}
});

const d=await r.json();

if(!r.ok || d.success===false)
throw new Error(d.message||"Unable to load payments.");

const list=d.payments||d.data||d.results||[];

if(!list.length){
box.innerHTML='<div class="empty">📭 No payments found.</div>';
return;
}

box.innerHTML=list.map(p=>{

const status=String(p.status||"PENDING").toUpperCase();

return `
<div class="item">

<h3>💳 Payment #${safe(p.id||p.payment_id)}</h3>

<div class="row">
<span class="label">Student</span>
<span class="value">${safe(p.name||p.student_name||"-")}</span>
</div>

<div class="row">
<span class="label">Email</span>
<span class="value">${safe(p.email||"-")}</span>
</div>

<div class="row">
<span class="label">Amount</span>
<span class="value">LKR ${Number(p.amount||1500).toLocaleString()}</span>
</div>

<div class="row">
<span class="label">Student ID</span>
<span class="value">${safe(p.student_id||"-")}</span>
</div>

<div class="row">
<span class="label">Status</span>
<span class="value"><span class="badge ${status==="APPROVED"?"approved":status==="REJECTED"?"rejected":""}">${safe(status)}</span></span>
</div>

${status==="PENDING"?`
<div class="actions">
<button class="approve" onclick="paymentAction(${Number(p.id||p.payment_id)},'APPROVED')">✅ Approve</button>
<button class="reject" onclick="paymentAction(${Number(p.id||p.payment_id)},'REJECTED')">❌ Reject</button>
</div>`:""}

</div>`;
}).join("");

}catch(e){
box.innerHTML='<div class="empty">❌ '+safe(e.message)+'</div>';
}
}


/* PAYMENT APPROVAL */

async function paymentAction(id,status){

if(!confirm(status==="APPROVED"?"Approve this payment?":"Reject this payment?"))return;

try{

const r=await fetch(PAYMENT_API+"/api/admin/payment/update",{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":KEY,
"Authorization":"Bearer "+KEY
},
body:JSON.stringify({
payment_id:id,
status:status
})
});

const d=await r.json();

if(!r.ok || d.success===false)
throw new Error(d.message||"Update failed.");

msg("Payment updated successfully.");
loadPayments();

}catch(e){
msg(e.message);
}
}


/* AFFILIATE PAYOUTS */

async function loadPayouts(){

const box=document.getElementById("payoutList");
box.innerHTML='<div class="empty">⏳ Loading...</div>';

try{

const r=await fetch(PAYOUT_API+"/api/admin/payouts",{
headers:{
"X-Admin-Key":KEY,
"Authorization":"Bearer "+KEY
}
});

const d=await r.json();

if(!r.ok || d.success===false)
throw new Error(d.message||"Unable to load payouts.");

const list=d.payouts||d.requests||d.data||[];

if(!list.length){
box.innerHTML='<div class="empty">📭 No payout requests.</div>';
return;
}

box.innerHTML=list.map(p=>{

const status=String(p.status||"PENDING").toUpperCase();

return `
<div class="item">

<h3>🤝 Payout #${safe(p.id)}</h3>

<div class="row">
<span class="label">Affiliate ID</span>
<span class="value">${safe(p.affiliate_id||"-")}</span>
</div>

<div class="row">
<span class="label">Student ID</span>
<span class="value">${safe(p.student_id||"-")}</span>
</div>

<div class="row">
<span class="label">Amount</span>
<span class="value">LKR ${Number(p.amount||0).toLocaleString()}</span>
</div>

<div class="row">
<span class="label">Bank</span>
<span class="value">${safe(p.bank_name||"-")}</span>
</div>

<div class="row">
<span class="label">Account</span>
<span class="value">${safe(p.account_number||"-")}</span>
</div>

<div class="row">
<span class="label">Status</span>
<span class="value"><span class="badge ${status==="PAID"?"approved":status==="REJECTED"?"rejected":""}">${safe(status)}</span></span>
</div>

${status==="PENDING"?`
<div class="actions">
<button class="approve" onclick="payoutAction(${Number(p.id)},'PAID')">✅ Mark Paid</button>
<button class="reject" onclick="payoutAction(${Number(p.id)},'REJECTED')">❌ Reject</button>
</div>`:""}

</div>`;
}).join("");

}catch(e){
box.innerHTML='<div class="empty">❌ '+safe(e.message)+'</div>';
}
}


/* PAYOUT UPDATE */

async function payoutAction(id,status){

if(!confirm(status==="PAID"?"Mark payout as PAID?":"Reject payout?"))return;

try{

const r=await fetch(PAYOUT_API+"/api/admin/payout/update",{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":KEY,
"Authorization":"Bearer "+KEY
},
body:JSON.stringify({
payout_id:id,
status:status
})
});

const d=await r.json();

if(!r.ok || d.success===false)
throw new Error(d.message||"Update failed.");

msg("Payout updated successfully.");
loadPayouts();

}catch(e){
msg(e.message);
}
}


function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

</script>

</body>
</html>
