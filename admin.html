<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Days With God's Word</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
 --navy:#24344D;
 --gold:#B89445;
 --gold2:#D8C28A;
 --cream:#F8F5ED;
 --brown:#5E5142;
 --gray:#77736B;
 --purple:#76558F
}

body{
 margin:0;
 background:#ECEBE7;
 font-family:Montserrat,Arial,sans-serif
}

.app{
 max-width:1250px;
 margin:auto;
 padding:20px
}

.editor{
 background:#fff;
 padding:22px;
 border-radius:15px;
 margin-bottom:20px;
 box-shadow:0 8px 25px #0001
}

h1{
 margin:0;
 text-align:center;
 color:var(--navy);
 font-size:25px
}

.sub{
 text-align:center;
 color:var(--gray);
 font-size:12px;
 margin:7px 0 20px
}

.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.full{grid-column:1/-1}

label{
 display:block;
 margin-bottom:5px;
 color:var(--navy);
 font-size:12px;
 font-weight:700
}

input,textarea,select{
 width:100%;
 padding:10px;
 border:1px solid #d5d2ca;
 border-radius:7px;
 font:inherit;
 outline:none
}

textarea{
 height:75px;
 resize:vertical
}

input:focus,
textarea:focus,
select:focus{
 border-color:var(--gold)
}

.buttons{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:12px
}

button{
 border:0;
 border-radius:7px;
 padding:12px;
 font:700 13px Montserrat;
 cursor:pointer
}

button:disabled{
 opacity:.5;
 cursor:wait
}

.light{
 background:#eceae4;
 color:var(--navy)
}

.gold{
 background:var(--gold);
 color:#fff
}

.navy{
 background:var(--navy);
 color:#fff
}

.purple{
 background:var(--purple);
 color:#fff
}

.status{
 text-align:center;
 color:var(--gray);
 font-size:11px;
 margin-top:10px
}

.preview{
 overflow:auto;
 padding:10px
}

/* =================================
   12 × 9 INCH LANDSCAPE
   1200 × 900 CSS
   3600 × 2700 PNG
================================= */

.calendar{
 width:1200px;
 height:900px;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:var(--cream);
 border:18px solid var(--gold2);
 box-shadow:0 12px 35px #0003
}

.calendar:after{
 content:"";
 position:absolute;
 inset:18px;
 border:2px solid #b8944588;
 pointer-events:none;
 z-index:30
}

/* =================================
   MAIN
   LEFT = TEXT
   RIGHT = PHOTO
================================= */

.main{
 position:absolute;
 top:45px;
 left:45px;
 right:45px;
 bottom:45px;

 display:grid;
 grid-template-columns:44% 56%;
 gap:28px;

 z-index:2
}

/* =================================
   LEFT TEXT PANEL
================================= */

.text{
 min-width:0;
 height:100%;
 padding:32px 25px 28px 28px;

 background:rgba(248,245,237,.97);

 border:1px solid #b8944588;
 border-radius:7px;

 overflow:hidden;

 display:flex;
 flex-direction:column
}

/* Small title */

.brand{
 color:var(--gold);
 font-size:11px;
 font-weight:800;
 letter-spacing:3px;
 margin-bottom:20px
}

/* Day/date */

.dayrow{
 display:flex;
 align-items:center;
 gap:14px;

 padding-bottom:15px;
 margin-bottom:18px;

 border-bottom:1px solid var(--gold2)
}

.day{
 min-width:116px;
 height:48px;

 display:flex;
 align-items:center;
 justify-content:center;

 background:var(--navy);
 color:#fff;

 border-radius:4px;

 font-size:16px;
 font-weight:800;
 letter-spacing:.5px
}

.date{
 color:#5D5A55;
 font:20px "Playfair Display";
 white-space:nowrap
}

/* English */

.lang{
 color:var(--gold);
 font-size:11px;
 font-weight:800;
 letter-spacing:2.5px;
 margin-bottom:8px
}

.english{
 color:var(--navy);
 font:600 27px/1.38 "Playfair Display";
 margin:0
}

.reference{
 color:var(--gold);
 font-size:13px;
 font-weight:700;
 margin:9px 0 4px
}

/* Translation */

.translation{
 border-top:1px solid var(--gold2);
 padding-top:9px;
 margin-top:9px
}

.translation b{
 display:block;

 color:#806323;

 font-size:10px;
 font-weight:800;

 letter-spacing:1.5px;

 margin-bottom:4px
}

.tamil,
.sinhala{
 color:var(--brown);
 font-size:15.5px;
 line-height:1.5;
 margin:0
}

.tamil{
 font-family:"Noto Sans Tamil",sans-serif
}

.sinhala{
 font-family:"Noto Sans Sinhala",sans-serif
}

/* =================================
   RIGHT PHOTO
   PHOTO ONLY
================================= */

.photo{
 position:relative;
 width:100%;
 height:100%;

 overflow:hidden;

 border:1px solid #b8944588;
 border-radius:7px;

 background:#e5e0d5
}

.photo img{
 position:absolute;
 inset:0;

 width:100%;
 height:100%;

 object-fit:cover;
 object-position:center center;

 display:none
}

.placeholder{
 position:absolute;
 inset:0;

 display:flex;
 align-items:center;
 justify-content:center;

 text-align:center;

 color:#777;

 padding:30px;

 background:linear-gradient(
  135deg,
  #eeeae0,
  #dcd6c9
);

 font-size:16px
}

/* =================================
   FOOTER
================================= */

.footer{
 position:absolute;

 bottom:15px;
 left:45px;
 right:45px;

 text-align:center;

 color:#967225;

 font:italic 12px "Playfair Display";

 z-index:10
}

/* =================================
   MOBILE
================================= */

@media(max-width:750px){

 .form{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

 .buttons{
  grid-template-columns:1fr
 }

}
</style>
</head>

<body>

<div class="app">

<!-- =================================
     EDITOR
================================= -->

<div class="editor">

<h1>365 Days With God's Word</h1>

<div class="sub">
12 × 9 inch • Landscape • 3600 × 2700 PNG
</div>

<div class="form">

<div>
<label>Day</label>
<input
 id="day"
 type="number"
 min="1"
 max="365"
 value="1">
</div>

<div>
<label>Date</label>
<input
 id="date"
 type="text">
</div>

<div class="full">
<label>Upload Scenic Photo — RIGHT SIDE ONLY</label>
<input
 id="photo"
 type="file"
 accept="image/*">
</div>

<div class="full">
<label>English Bible Verse — Primary</label>
<textarea id="english"></textarea>
</div>

<div class="full">
<label>Tamil Bible Verse — Secondary</label>
<textarea id="tamil"></textarea>
</div>

<div class="full">
<label>Sinhala Bible Verse — Tertiary</label>
<textarea id="sinhala"></textarea>
</div>

<div>
<label>Bible Reference</label>
<input
 id="reference"
 placeholder="Deuteronomy 28:12">
</div>

<div>
<label>Photo Position</label>

<select id="position">

<option value="center center">
Center
</option>

<option value="center top">
Top
</option>

<option value="center bottom">
Bottom
</option>

<option value="left center">
Left
</option>

<option value="right center">
Right
</option>

</select>
</div>

</div>


<!-- BUTTONS -->

<div class="buttons">

<button
 class="light"
 onclick="previousDay()">
← Previous
</button>

<button
 class="gold"
 onclick="nextDay()">
Next →
</button>

<button
 class="navy"
 onclick="savePNG()">
💾 Save PNG
</button>

</div>

<div class="buttons">

<button
 class="light"
 onclick="clearVerse()">
Clear
</button>

<button
 class="purple"
 onclick="generate()">
Update Preview
</button>

</div>

<div
 id="status"
 class="status">
Day 1 of 365
</div>

</div>


<!-- =================================
     PREVIEW
================================= -->

<div class="preview">

<div id="calendar" class="calendar">


<!-- =================================
     MAIN
================================= -->

<div class="main">


<!-- =================================
     LEFT TEXT
================================= -->

<div class="text">

<div class="brand">
365 DAYS WITH GOD'S WORD
</div>


<!-- DAY + DATE -->

<div class="dayrow">

<div
 id="outDay"
 class="day">
DAY 001
</div>

<div
 id="outDate"
 class="date">
</div>

</div>


<!-- ENGLISH -->

<div class="lang">
ENGLISH
</div>

<div
 id="outEnglish"
 class="english">
</div>

<div
 id="outReference"
 class="reference">
</div>


<!-- TAMIL -->

<div class="translation">

<b>
தமிழ் • TAMIL
</b>

<div
 id="outTamil"
 class="tamil">
</div>

</div>


<!-- SINHALA -->

<div class="translation">

<b>
සිංහල • SINHALA
</b>

<div
 id="outSinhala"
 class="sinhala">
</div>

</div>

</div>


<!-- =================================
     RIGHT PHOTO ONLY
================================= -->

<div class="photo">

<div
 id="placeholder"
 class="placeholder">

Upload your scenic photo

</div>

<img
 id="outPhoto"
 alt="Scenic calendar photo">

</div>

</div>


<!-- FOOTER -->

<div class="footer">
“Walk with God • Grow in His Word”
</div>

</div>

</div>

</div>


<script>

/* =================================
   VARIABLES
================================= */

const $ =
 id => document.getElementById(id);

let currentDay = 1;

const pages = {};


/* =================================
   DATE
================================= */

function dateFor(day){

 return new Date(
  2027,
  0,
  day
 ).toLocaleDateString(
  "en-US",
  {
   month:"long",
   day:"numeric",
   year:"numeric"
  }
 );

}


/* =================================
   UPDATE PREVIEW
================================= */

function generate(){

 currentDay =
  Math.max(
   1,
   Math.min(
    365,
    +$("day").value || 1
   )
  );

 $("day").value =
  currentDay;


 $("outDay").textContent =
  "DAY " +
  String(currentDay)
   .padStart(3,"0");


 $("outDate").textContent =
  $("date").value ||
  dateFor(currentDay);


 $("outEnglish").textContent =
  $("english").value ||
  "Your Bible verse will appear here.";


 $("outTamil").textContent =
  $("tamil").value ||
  "தமிழ் வேதாகம வசனம் இங்கே தோன்றும்.";


 $("outSinhala").textContent =
  $("sinhala").value ||
  "සිංහල බයිබල් පදය මෙහි දිස් වේ.";


 $("outReference").textContent =
  $("reference").value
   ? "— " +
     $("reference").value
   : "";


 $("status").textContent =
  `Day ${currentDay} of 365`;

}


/* =================================
   SAVE DAY
================================= */

function saveCurrent(){

 pages[currentDay] = {

  date:
   $("date").value,

  english:
   $("english").value,

  tamil:
   $("tamil").value,

  sinhala:
   $("sinhala").value,

  reference:
   $("reference").value,

  photo:
   $("outPhoto").src || ""

 };

}


/* =================================
   LOAD DAY
================================= */

function loadDay(day){

 saveCurrent();


 currentDay =
  Math.max(
   1,
   Math.min(
    365,
    +day || 1
   )
  );


 const p =
  pages[currentDay] || {};


 $("day").value =
  currentDay;


 $("date").value =
  p.date ||
  dateFor(currentDay);


 $("english").value =
  p.english || "";


 $("tamil").value =
  p.tamil || "";


 $("sinhala").value =
  p.sinhala || "";


 $("reference").value =
  p.reference || "";


 if(p.photo){

  $("outPhoto").src =
   p.photo;

  $("outPhoto").style.display =
   "block";

  $("placeholder").style.display =
   "none";

 }else{

  $("outPhoto")
   .removeAttribute("src");

  $("outPhoto").style.display =
   "none";

  $("placeholder").style.display =
   "flex";

 }


 generate();

}


/* =================================
   NEXT
================================= */

function nextDay(){

 if(currentDay < 365){

  loadDay(
   currentDay + 1
  );

 }

}


/* =================================
   PREVIOUS
================================= */

function previousDay(){

 if(currentDay > 1){

  loadDay(
   currentDay - 1
  );

 }

}


/* =================================
   CLEAR
================================= */

function clearVerse(){

 $("english").value = "";

 $("tamil").value = "";

 $("sinhala").value = "";

 $("reference").value = "";

 generate();

}


/* =================================
   PHOTO UPLOAD
================================= */

$("photo").onchange =
function(){

 const file =
  this.files[0];

 if(!file)return;


 if(!file.type.startsWith("image/")){

  alert(
   "Please select an image."
  );

  return;

 }


 const reader =
  new FileReader();


 reader.onload =
 function(e){

  $("outPhoto").src =
   e.target.result;

  $("outPhoto").style.display =
   "block";

  $("placeholder").style.display =
   "none";


  pages[currentDay] =
   pages[currentDay] || {};


  pages[currentDay].photo =
   e.target.result;

 };


 reader.readAsDataURL(file);

};


/* =================================
   PHOTO POSITION
================================= */

$("position").onchange =
function(){

 $("outPhoto")
  .style.objectPosition =
  this.value;

};


/* =================================
   LIVE UPDATE
================================= */

[
 "day",
 "date",
 "english",
 "tamil",
 "sinhala",
 "reference"
].forEach(id=>{

 $(id).addEventListener(
  "input",
  generate
 );

});


/* =================================
   SAVE PNG
================================= */

async function savePNG(){

 generate();


 const btn =
  document.querySelector(
   'button[onclick="savePNG()"]'
  );


 btn.disabled = true;

 btn.textContent =
  "Creating PNG...";


 $("status").textContent =
  "Creating 3600 × 2700 PNG...";


 try{

  await document.fonts.ready;


  const img =
   $("outPhoto");


  if(
   img.src &&
   !img.complete
  ){

   await new Promise(
    resolve=>{

     img.onload =
      resolve;

     img.onerror =
      resolve;

    }
   );

  }


  await new Promise(
   r=>setTimeout(r,300)
  );


  const canvas =
   await html2canvas(
    $("calendar"),
    {

     width:1200,

     height:900,

     scale:3,

     useCORS:true,

     allowTaint:false,

     backgroundColor:
      "#F8F5ED",

     imageTimeout:20000,

     logging:false

    }
   );


  canvas.toBlob(
   blob=>{

    if(!blob){

     alert(
      "PNG creation failed."
     );

     return;

    }


    const url =
     URL.createObjectURL(
      blob
     );


    const a =
     document.createElement(
      "a"
     );


    a.href = url;


    a.download =
     "Bible-Calendar-Day-" +
     String(currentDay)
      .padStart(3,"0") +
     ".png";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
     ()=>URL.revokeObjectURL(url),
     1000
    );


    $("status").textContent =
     "✓ PNG saved • 3600 × 2700 px";

   },
   "image/png"
  );


 }catch(err){

  console.error(err);

  $("status").textContent =
   "PNG export failed";

  alert(
   "PNG export failed. Please use Chrome or Edge."
  );


 }finally{

  btn.disabled = false;

  btn.textContent =
   "💾 Save PNG";

 }

}


/* =================================
   SAMPLE DAY 1
================================= */

$("english").value =
"The LORD will open the heavens, the storehouse of his bounty, to send rain on your land in season and to bless all the work of your hands. You will lend to many nations but will borrow from none.";

$("tamil").value =
"ஏற்ற காலத்தில் உன் தேசத்திலே மழை பெய்யவும் நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார்; நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.";

$("sinhala").value =
"ස්වාමීන්වහන්සේ නිසි කාලයට නුඹේ දේශයට වර්ෂාව දෙන්ටද නුඹේ අත්වල සියලු වැඩට ආශීර්වාද කරන්ටද අහස නමැති තමන්ගේ උතුම් ගබඩාව නුඹට විවෘත කරනසේක. නුඹ බොහෝ ජාතීන්ට ණයට දෙන නුමුත් නුඹ ණයට නොගන්නෙහිය.";

$("reference").value =
"Deuteronomy 28:12";


/* =================================
   START
================================= */

loadDay(1);

</script>

</body>
</html>
