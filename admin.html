<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d7d0c7;color:#302c28;font:14px Arial;padding:18px}
.controls{max-width:1100px;margin:auto auto 18px;background:#fffdf9;padding:15px;border:1px solid #bdb1a2;border-radius:12px;box-shadow:0 5px 20px #0002}
h2{font:700 18px Georgia;color:#4b394f;margin-bottom:12px}
.grid,.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid{grid-template-columns:repeat(2,1fr)}
label{display:block;font-size:10px;font-weight:bold;margin:5px 0;color:#554d47}
input,textarea,select{width:100%;padding:8px;border:1px solid #c9bdae;border-radius:7px;background:#fff;font:inherit}
textarea{height:55px;resize:vertical}
input[type=range]{padding:0;accent-color:#70557b}
input[type=file]{padding:7px}
.bar{display:grid;grid-template-columns:1fr 35px;gap:6px;align-items:center}
.value{text-align:center;font-size:10px;font-weight:bold;color:#70557b}
.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{padding:9px 13px;border:1px solid #5d4967;border-radius:7px;background:#70557b;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(.9)}
.secondary{background:#8b7b6d;border-color:#756658}
.green{background:#58735e;border-color:#4a6350}
.status{margin-top:9px;padding:8px;background:#f1ece5;border-radius:7px;font-size:11px;color:#655b54}
.selectedDates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{padding:5px 8px;border-radius:20px;background:#ece4da;border:1px solid #c9bdae;font-size:10px}
.chip button{padding:1px 5px;border:0;border-radius:50%;background:#9a625e;font-size:9px}

.calendar{
 width:min(1100px,100%);
 aspect-ratio:16/10;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#f5eee3;
 border:1px solid #9d9183;
 outline:1px solid #776b60;
 outline-offset:-6px;
 box-shadow:0 8px 25px #0003;
 print-color-adjust:exact;
 -webkit-print-color-adjust:exact
}

.photo{
 position:absolute;
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 overflow:hidden;
 background:#aaa;
 border-radius:3px;
 box-shadow:0 2px 7px #0002
}

#art,#art svg{
 width:100%;
 height:100%;
 display:block
}

#art svg{
 min-width:100%;
 min-height:100%;
 border:0
}

.content{
 position:absolute;
 left:37%;
 right:5%;
 top:5%;
 bottom:5%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0
}

.dateRow{
 height:14%;
 min-height:50px;
 display:flex;
 align-items:center;
 border-bottom:1px solid #d8cec1;
 position:relative
}

.dateText{
 font:700 clamp(35px,5.5vw,68px)/1 Georgia;
 color:#51465b
}

.cross{
 position:absolute;
 right:1px;
 top:2px;
 font:18px Georgia;
 color:#69546f
}

.verses{
 flex:1;
 min-height:0;
 overflow:hidden;
 margin:6px 0
}

#verseBox{
 height:100%;
 display:flex;
 flex-direction:column;
 overflow:hidden
}

.section{
 flex:1;
 min-height:0;
 padding:7px 13px;
 border-top:1px solid #ddd3c8;
 overflow:hidden
}

.section:first-child{border-top:0}

.txt{
 width:100%;
 max-height:100%;
 overflow:hidden;
 overflow-wrap:anywhere;
 word-break:break-word
}

.en{font:500 25px/1.28 Georgia;color:#49334f}
.ta{font:500 18px/1.42 "Noto Sans Tamil",sans-serif;color:#76502f}
.si{font:500 18px/1.42 "Noto Sans Sinhala",sans-serif;color:#3f604a}

.left{text-align:left}
.center{text-align:center}
.right{text-align:right}

.ref{
 min-height:27px;
 border-top:1px solid #d8cec1;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 font:700 12px Georgia;
 color:#756c65;
 overflow:hidden;
 overflow-wrap:anywhere
}

@media(max-width:700px){
 body{padding:7px}
 .controls{padding:10px}
 .opts,.grid{grid-template-columns:1fr}
 .photo{left:4%;width:29%}
 .content{left:37%;right:4%;top:4%;bottom:4%}
 .dateText{font-size:clamp(22px,6vw,42px)}
 .cross{font-size:14px}
 .section{padding:4px 8px}
}

@media print{
 body{padding:0;background:white}
 .controls{display:none}
 .calendar{width:9in;height:5.625in;box-shadow:none}
}
</style>
</head>

<body>

<div class="controls">

<h2>365 Bible Calendar 2027</h2>

<div class="grid">

<div>
<label>Date</label>
<input id="date" type="date"
 min="2027-01-01" max="2027-12-31"
 value="2027-01-01">
</div>

<div>
<label>Bible Reference</label>
<input id="ref" value="John 3:16">
</div>

</div>

<div class="opts">

<!-- SVG UPLOAD -->

<div>
<label>Upload SVG Artwork</label>
<input id="svgUpload" type="file" accept=".svg,image/svg+xml">
</div>

<div>
<label>SVG Fit</label>
<select id="svgFit">
<option value="slice">Fill / Crop</option>
<option value="contain">Contain</option>
</select>
</div>

<div>
<label>SVG Position</label>
<select id="svgPos">
<option value="center">Center</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
</select>
</div>


<div>
<label>English Verse</label>
<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="ens" type="range" min="12" max="38" value="25">
<span class="value" id="ensv">25</span>
</div>
</div>


<div>
<label>Tamil Verse</label>
<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="tas" type="range" min="10" max="30" value="18">
<span class="value" id="tasv">18</span>
</div>
</div>


<div>
<label>Sinhala Verse</label>
<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="sis" type="range" min="10" max="30" value="18">
<span class="value" id="sisv">18</span>
</div>
</div>


<div>
<label>English Alignment</label>
<select id="ena">
<option>left</option>
<option>center</option>
<option>right</option>
</select>
</div>


<div>
<label>Tamil Alignment</label>
<select id="taa">
<option>left</option>
<option>center</option>
<option>right</option>
</select>
</div>


<div>
<label>Sinhala Alignment</label>
<select id="sia">
<option>left</option>
<option>center</option>
<option>right</option>
</select>
</div>


<div>
<label>Verse Position</label>
<div class="bar">
<input id="pos" type="range" min="0" max="100" value="0">
<span class="value" id="posv">Top</span>
</div>
</div>


<div>
<label>Language Space</label>
<div class="bar">
<input id="space" type="range" min="0" max="25" value="5">
<span class="value" id="spacev">5</span>
</div>
</div>

</div>


<div class="buttons">

<button onclick="move(-1)">Previous</button>
<button onclick="move(1)">Next</button>

<button class="green" onclick="generate()">
Generate
</button>

<button class="secondary" onclick="addDate()">
Add Date to PDF
</button>

<button class="secondary" onclick="clearDates()">
Clear Dates
</button>

<button onclick="currentPDF()">
Current PDF
</button>

<button class="green" onclick="multiPDF()">
Download Selected PDF
</button>

</div>


<div class="status" id="status">
SVG: No artwork uploaded | Selected PDF pages: 0 / 10
</div>

<div class="selectedDates" id="selected"></div>

</div>


<!-- CALENDAR -->

<div class="calendar" id="calendar">

<div class="photo">
<div id="art"></div>
</div>


<div class="content">

<div class="dateRow">

<div class="dateText" id="dateText"></div>

<div class="cross">✝</div>

</div>


<div class="verses">

<div id="verseBox">

<div class="section">
<div id="enText" class="txt en left"></div>
</div>

<div class="section">
<div id="taText" class="txt ta left"></div>
</div>

<div class="section">
<div id="siText" class="txt si left"></div>
</div>

</div>

</div>


<div class="ref" id="refText"></div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

let selectedDates=[];
let svgData="";


/* SVG UPLOAD */

$("svgUpload").onchange=e=>{

 let file=e.target.files[0];

 if(!file)return;

 if(file.type!=="image/svg+xml" &&
    !file.name.toLowerCase().endsWith(".svg")){

  alert("Please select an SVG file.");
  return;
 }

 let reader=new FileReader();

 reader.onload=()=>{

  svgData=reader.result;

  showSVG();

  $("status").textContent=
   "SVG uploaded: "+file.name+
   " | Selected PDF pages: "+
   selectedDates.length+" / 10";
 };

 reader.readAsText(file);
};


/* DISPLAY SVG */

function showSVG(){

 if(!svgData){

  $("art").innerHTML=`
  <div style="
   width:100%;
   height:100%;
   display:flex;
   align-items:center;
   justify-content:center;
   background:#e5ddd2;
   color:#756c65;
   text-align:center;
   font:12px Georgia">
   Upload SVG artwork
  </div>`;

  return;
 }


 let box=document.createElement("div");

 box.innerHTML=svgData.trim();

 let svg=box.querySelector("svg");

 if(!svg){

  alert("Invalid SVG file.");
  svgData="";
  return;
 }


 svg.removeAttribute("width");
 svg.removeAttribute("height");

 svg.style.width="100%";
 svg.style.height="100%";
 svg.style.display="block";
 svg.style.border="0";

 svg.setAttribute(
  "preserveAspectRatio",
  "xMidYMid "+
  ($("svgFit").value==="contain"?"meet":"slice")
 );

 svg.style.objectFit=
  $("svgFit").value==="contain"?
  "contain":"cover";

 svg.style.objectPosition=
  $("svgPos").value;

 $("art").replaceChildren(svg);
}


/* SVG OPTIONS */

$("svgFit").onchange=showSVG;
$("svgPos").onchange=showSVG;


/* GENERATE */

function generate(){

 let d=new Date(
  $("date").value+"T00:00:00"
 );

 if(isNaN(d))return;


 $("dateText").textContent=
 d.toLocaleDateString("en-US",{
  month:"short",
  day:"numeric"
 });


 $("enText").textContent=$("en").value;
 $("taText").textContent=$("ta").value;
 $("siText").textContent=$("si").value;

 $("refText").textContent=$("ref").value;


 $("enText").className=
 "txt en "+$("ena").value;

 $("taText").className=
 "txt ta "+$("taa").value;

 $("siText").className=
 "txt si "+$("sia").value;


 setSize("enText","ens");
 setSize("taText","tas");
 setSize("siText","sis");


 document.querySelectorAll(".section")
 .forEach((e,i)=>{
  e.style.marginTop=
   i ? $("space").value+"px":"0";
 });


 $("spacev").textContent=$("space").value;


 requestAnimationFrame(()=>{
  requestAnimationFrame(position);
 });
}


function setSize(id,slider){

 $(id).style.fontSize=
  $(slider).value+"px";

 $(slider+"v").textContent=
  $(slider).value;
}


function position(){

 let p=+$("pos").value;

 $("posv").textContent=
  p===0?"Top":
  p===50?"Center":
  p===100?"Bottom":
  p+"%";


 document.querySelectorAll(".section")
 .forEach(s=>{

  let t=s.querySelector(".txt");

  let free=s.clientHeight-t.offsetHeight;

  t.style.transform=
   "translateY("+
   Math.max(0,free)*p/100+
   "px)";
 });
}


/* DATE */

function move(n){

 let d=new Date(
  $("date").value+"T00:00:00"
 );

 d.setDate(d.getDate()+n);

 if(
  d<new Date("2027-01-01")||
  d>new Date("2027-12-31")
 )return;

 $("date").value=
  d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

 generate();
}


/* SELECTED DATES */

function addDate(){

 let d=$("date").value;

 if(selectedDates.includes(d))
  return alert("This date is already selected.");

 if(selectedDates.length>=10)
  return alert("Maximum 10 pages.");

 selectedDates.push(d);

 renderDates();
}


function renderDates(){

 $("selected").innerHTML=
 selectedDates.map((d,i)=>
 `<div class="chip">
 ${i+1}. ${
  new Date(d+"T00:00:00")
  .toLocaleDateString("en-US",{
   month:"short",
   day:"numeric"
  })
 }
 <button onclick="removeDate(${i})">×</button>
 </div>`
 ).join("");


 let svgStatus=svgData?
  "SVG uploaded":"SVG: No artwork uploaded";

 $("status").textContent=
  svgStatus+
  " | Selected PDF pages: "+
  selectedDates.length+
  " / 10";
}


function removeDate(i){

 selectedDates.splice(i,1);

 renderDates();
}


function clearDates(){

 selectedDates=[];

 renderDates();
}


/* PDF */

async function capture(){

 if(document.fonts)
  await document.fonts.ready;

 generate();

 await new Promise(r=>setTimeout(r,300));

 return html2canvas($("calendar"),{
  scale:3,
  useCORS:true,
  backgroundColor:"#f5eee3",
  logging:false,
  imageTimeout:0
 });
}


function newPDF(){

 return new jspdf.jsPDF({
  orientation:"landscape",
  unit:"in",
  format:[9,5.625],
  compress:true
 });
}


function addCanvas(pdf,c,newPage){

 if(newPage)
  pdf.addPage([9,5.625],"landscape");

 pdf.addImage(
  c.toDataURL("image/jpeg",.96),
  "JPEG",
  0,
  0,
  9,
  5.625
 );
}


/* CURRENT PDF */

async function currentPDF(){

 if(!window.jspdf?.jsPDF)
  return alert(
   "PDF library is not loaded."
  );

 if(!svgData)
  return alert(
   "Please upload an SVG artwork first."
  );

 let c=await capture();

 let pdf=newPDF();

 addCanvas(pdf,c,false);

 pdf.save(
  "Bible-Calendar-"+
  $("date").value+".pdf"
 );
}


/* SELECTED PDF */

async function multiPDF(){

 if(!selectedDates.length)
  return alert(
   "Add at least one date first."
  );

 if(!svgData)
  return alert(
   "Please upload an SVG artwork first."
  );

 if(!window.jspdf?.jsPDF)
  return alert(
   "PDF library is not loaded."
  );


 let original=$("date").value;

 let pdf=newPDF();

 try{

  for(let i=0;i<selectedDates.length;i++){

   $("date").value=
    selectedDates[i];

   let c=await capture();

   addCanvas(pdf,c,i>0);

   $("status").textContent=
    "Creating PDF: "+
    (i+1)+" / "+
    selectedDates.length;
  }


  pdf.save(
   "365-Bible-Calendar-"+
   selectedDates.length+
   "-Pages.pdf"
  );


 }catch(e){

  console.error(e);

  alert("PDF creation failed.");

 }finally{

  $("date").value=original;

  generate();

  renderDates();
 }
}


/* LIVE CONTROLS */

["ens","tas","sis"].forEach(x=>{

 $(x).oninput=()=>{

  setSize(
   x==="ens"?
    "enText":
   x==="tas"?
    "taText":
    "siText",
   x
  );

  position();
 };
});


$("pos").oninput=position;

$("space").oninput=generate;


["ena","taa","sia"].forEach(x=>{
 $(x).onchange=generate;
});


$("date").onchange=generate;
$("ref").oninput=generate;
$("en").oninput=generate;
$("ta").oninput=generate;
$("si").oninput=generate;


/* START */

showSVG();
generate();
renderDates();

</script>

</body>
</html>
