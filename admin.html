<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#d9d2c8;color:#443d38;font:13px Arial}
#controls{max-width:1050px;margin:auto;background:#fffaf4;padding:12px;border-radius:10px;box-shadow:0 3px 15px #0002}
h2{margin:3px 0 10px;font:700 20px Georgia;color:#57465d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
label{display:block;font-size:10px;font-weight:bold;margin:4px 0}
input,textarea,select{width:100%;padding:7px;border:1px solid #cbbfb3;border-radius:6px;font:inherit}
textarea{height:55px;resize:vertical}
.box{padding:8px;border:1px solid #ddd3c8;border-radius:7px;margin-bottom:7px}
.buttons{display:flex;gap:6px;flex-wrap:wrap}
button{border:0;border-radius:6px;padding:8px 11px;background:#705477;color:white;font-weight:bold}
button.alt{background:#817469}.chips{margin-top:7px;font-size:11px}
.chip{display:inline-block;background:#eee5dc;padding:4px 7px;border-radius:15px;margin:2px}
.calendar{width:min(1050px,100%);aspect-ratio:16/10;margin:18px auto;background:#f5eee3;position:relative;overflow:hidden;border:1px solid #8d8278;outline:1px solid #71675e;outline-offset:-6px;box-shadow:0 5px 20px #0003}
.photo{position:absolute;left:4%;top:6%;bottom:6%;width:29%;overflow:hidden;border-radius:4px}
#art,#art svg{width:100%;height:100%;display:block}
.content{position:absolute;left:36%;right:4%;top:5%;bottom:5%;display:flex;flex-direction:column}
.date{height:16%;display:flex;align-items:center;border-bottom:1px solid #d8cec2;font:700 clamp(35px,5vw,65px) Georgia;color:#55495c}
.month{font:700 10px Arial;letter-spacing:3px;margin:25px 0 0 7px;color:#877a83}
.cross{margin-left:auto;width:18px;height:24px}
.verses{flex:1;min-height:0;display:flex;flex-direction:column}
.sec{flex:1;min-height:0;padding:7px 10px;border-bottom:1px solid #ddd3c8;overflow:hidden;display:flex;align-items:center}
.txt{width:100%;overflow:hidden;overflow-wrap:anywhere}
.en{font:500 24px/1.25 Georgia;color:#49334f}
.ta{font:500 18px/1.4 "Noto Sans Tamil";color:#76502f}
.si{font:500 18px/1.4 "Noto Sans Sinhala";color:#3f604a}
.ref{height:7%;display:flex;align-items:center;justify-content:center;font:700 12px Georgia;color:#756c65}
.left{text-align:left}.center{text-align:center}.right{text-align:right}
.cover{position:absolute;inset:0}.cover svg{width:100%;height:100%}.ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;text-shadow:0 3px 12px #0009}.c365{font:700 12vw/.8 Georgia}.cb{font:700 4vw Georgia;letter-spacing:5px}.cy{font:bold 3vw Arial;letter-spacing:7px;margin:15px}.cv{max-width:70%;font:italic 17px Georgia}
@media(max-width:650px){.grid{grid-template-columns:1fr}.en{font-size:16px}.ta,.si{font-size:12px}.content{left:37%}.date{font-size:30px}.month{display:none}}
@media print{body{padding:0}.controls{display:none}.calendar{width:9in;height:5.625in;margin:0;box-shadow:none}}
</style>
</head>

<body>

<div id="controls">
<h2>365 Bible Calendar 2027</h2>

<div class="box">
<div class="grid">
<div><label>Date</label><input id="date" type="date" min="2027-01-01" max="2027-12-31" value="2027-01-01"></div>
<div><label>Bible Reference</label><input id="ref" value="John 3:16"></div>
<div><label>Artwork</label><select id="scene"><option value="auto">Automatic</option><option>mountain</option><option>lake</option><option>forest</option><option>river</option><option>sunrise</option><option>sunset</option><option>valley</option><option>path</option><option>mist</option><option>meadow</option></select></div>
</div>
</div>

<div class="box">
<label>English</label>
<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>
</div>

<div class="box">
<label>Tamil</label>
<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>
</div>

<div class="box">
<label>සිංහල</label>
<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>
</div>

<div class="box">
<div class="grid">
<div><label>English Size</label><input id="es" type="range" min="12" max="35" value="24"></div>
<div><label>Tamil Size</label><input id="ts" type="range" min="10" max="28" value="18"></div>
<div><label>Sinhala Size</label><input id="ss" type="range" min="10" max="28" value="18"></div>
</div>
</div>

<div class="box">
<div class="grid">
<div><label>English Align</label><select id="ea"><option>left</option><option>center</option><option>right</option></select></div>
<div><label>Tamil Align</label><select id="taA"><option>left</option><option>center</option><option>right</option></select></div>
<div><label>Sinhala Align</label><select id="sa"><option>left</option><option>center</option><option>right</option></select></div>
</div>
</div>

<div class="buttons">
<button onclick="move(-1)">‹ Previous</button>
<button onclick="move(1)">Next ›</button>
<button onclick="generate()">Generate</button>
<button onclick="cover()">Cover</button>
<button onclick="png()">PNG</button>
<button onclick="pdf()">PDF</button>
<button onclick="add()">Add Date</button>
<button class="alt" onclick="clearDates()">Clear</button>
<button onclick="multiPDF()">Selected PDF</button>
</div>

<div class="chips" id="chips"></div>
</div>

<div class="calendar" id="calendar">
<div class="photo"><div id="art"></div></div>

<div class="content">
<div class="date">
<span id="day"></span><span class="month" id="month"></span>
<svg class="cross" viewBox="0 0 40 50"><path fill="#705477" d="M14 2h12v17h12v11H26v18H14V30H2V19h12z"/></svg>
</div>

<div class="verses">
<div class="sec"><div id="enT" class="txt en"></div></div>
<div class="sec"><div id="taT" class="txt ta"></div></div>
<div class="sec"><div id="siT" class="txt si"></div></div>
</div>

<div class="ref" id="refT"></div>
</div>
</div>

<script>
const $=x=>document.getElementById(x),scenes=["mountain","lake","forest","river","sunrise","sunset","valley","path","mist","meadow"];
let selected=[];

function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,1))/864e5)+1}
function rnd(n){return Math.abs(Math.sin(n*91.73))}
function svg(n,type){

 type=type=="auto"?scenes[(n-1)%scenes.length]:type;
 let sky=type=="sunset"?"#765568":"#5b7885";
 let sun=type=="sunset"?"#e8a76e":"#f3ca86";

 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="a" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset=".55" stop-color="#b3bbb0"/><stop offset="1" stop-color="#dfc49c"/></linearGradient>
<linearGradient id="g" x2="0" y2="1"><stop stop-color="#687b62"/><stop offset="1" stop-color="#20352a"/></linearGradient>
<radialGradient id="s"><stop stop-color="#fff3bd"/><stop offset=".5" stop-color="${sun}" stop-opacity=".8"/><stop offset="1" stop-color="${sun}" stop-opacity="0"/></radialGradient>
</defs>
<rect width="500" height="700" fill="url(#a)"/>
<circle cx="${100+rnd(n)*300}" cy="130" r="130" fill="url(#s)"/>
<path d="M0 390L${80+rnd(n)*80} 180L230 380L${300+rnd(n)*70} 145L500 390V700H0Z" fill="#718079"/>
<path d="M0 450Q250 350 500 450V700H0Z" fill="url(#g)"/>
${type=="lake"||type=="water"?`<path d="M0 430Q250 360 500 430V700H0Z" fill="#47727b"/><g stroke="#d9e8e5" opacity=".25"><path d="M30 480h440"/><path d="M70 535h360"/><path d="M110 585h280"/></g>`:""}
${type=="river"||type=="path"?`<path d="M255 700Q370 580 230 455Q290 390 340 330" fill="none" stroke="${type=="river"?"#56818a":"#b49a76"}" stroke-width="${type=="river"?75:85}"/>`:""}
${type=="forest"?forest():trees(n)}
${type=="mist"?`<path d="M0 425Q250 370 500 425" stroke="#fff" stroke-width="65" opacity=".2" fill="none"/>`:""}
<rect width="500" height="700" fill="#101916" opacity=".07"/>
</svg>`;

 function trees(k){
  let x="";
  for(let i=0;i<8;i++){
   let a=20+i*65+rnd(k+i)*20,y=500-rnd(k+i*2)*70;
   x+=`<path d="M${a} ${y+100}V${y+40}" stroke="#382f28" stroke-width="6"/>
   <path d="M${a} ${y}l-30 55h18l-27 35h78l-27-35h18z" fill="#294436"/>
   <path d="M${a} ${y+20}l-20 35h12l-18 28h52l-18-28h12z" fill="#3c5845"/>`;
  }return x
 }
 function forest(){return trees(n)+trees(n+20)}
}

function generate(){

 let d=new Date($("date").value+"T00:00:00"),n=doy(d);
 $("day").textContent=d.toLocaleDateString("en-US",{month:"short",day:"2-digit"}).toUpperCase();
 $("month").textContent=d.toLocaleDateString("en-US",{month:"long"}).toUpperCase();
 $("art").innerHTML=svg(n,$("scene").value);
 $("enT").textContent=$("en").value;
 $("taT").textContent=$("ta").value;
 $("siT").textContent=$("si").value;
 $("refT").textContent=$("ref").value;

 [["enT","es","ea"],["taT","ts","taA"],["siT","ss","sa"]].forEach(a=>{
  let e=$(a[0]);e.style.fontSize=$(a[1]).value+"px";
  e.className="txt "+(a[0]=="enT"?"en":a[0]=="taT"?"ta":"si")+" "+$(a[2]).value;
  fit(e);
 });
}

function fit(e){
 let box=e.parentElement;
 while(e.scrollHeight>box.clientHeight&&parseFloat(e.style.fontSize)>10)
 e.style.fontSize=parseFloat(e.style.fontSize)-.5+"px";
}

function move(n){
 let d=new Date($("date").value+"T00:00:00");d.setDate(d.getDate()+n);
 if(d.getFullYear()==2027){$("date").value=d.toISOString().slice(0,10);generate()}
}

function add(){
 let d=$("date").value;
 if(selected.includes(d)||selected.length>=10)return;
 selected.push(d);show()
}

function show(){
 $("chips").innerHTML=selected.map((d,i)=>`<span class="chip">${d.slice(5)} <b onclick="selected.splice(${i},1);show()">×</b></span>`).join("");
}

function clearDates(){selected=[];show()}

function cover(){
 let verse="Your word is a lamp for my feet and a light for my path.";
 $("calendar").innerHTML=`<div class="cover">
 ${svg(1,"sunrise")}
 <div class="ct"><div class="c365">365</div><div class="cb">BIBLE CALENDAR</div><div class="cy">2027</div><div class="cv">“${verse}”<br><small>Psalm 119:105</small></div></div>
 </div>`;
}

async function shot(){
 await document.fonts.ready;
 return html2canvas($("calendar"),{scale:4,useCORS:true,backgroundColor:"#f5eee3"});
}

async function png(){
 generate();
 let c=await shot(),a=document.createElement("a");
 a.href=c.toDataURL("image/png");
 a.download="Bible-Calendar-"+$("date").value+".png";a.click()
}

async function pdf(){
 generate();
 let c=await shot(),P=jspdf.jsPDF;
 let p=new P({orientation:"landscape",unit:"in",format:[9,5.625]});
 p.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,9,5.625);
 p.save("Bible-Calendar-"+$("date").value+".pdf")
}

async function multiPDF(){
 if(!selected.length)return alert("Add dates first.");
 let old=$("date").value,P=jspdf.jsPDF;
 let p=new P({orientation:"landscape",unit:"in",format:[9,5.625]});

 for(let i=0;i<selected.length;i++){
  $("date").value=selected[i];generate();
  await new Promise(r=>setTimeout(r,150));
  let c=await shot();
  if(i)p.addPage([9,5.625],"landscape");
  p.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,9,5.625);
 }
 p.save("Bible-Calendar-Selected.pdf");
 $("date").value=old;generate()
}

["date","ref","en","ta","si","scene","es","ts","ss","ea","taA","sa"]
.forEach(x=>$(x).addEventListener("input",generate));

generate();show();
</script>
</body>
</html>
