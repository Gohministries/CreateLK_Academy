<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#eee;
  font-family:Arial,sans-serif;
  color:#222;
}

h1{
  text-align:center;
  margin:0 0 15px;
}

.controls{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 3px 12px #0002;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
}

label{
  font-size:13px;
  font-weight:bold;
}

input,
select,
button{
  padding:7px;
  border:1px solid #bbb;
  border-radius:5px;
}

button{
  cursor:pointer;
  background:#333;
  color:#fff;
  border:0;
}

button:hover{
  opacity:.85;
}

.range{
  display:flex;
  align-items:center;
  gap:5px;
}

.preview{
  margin:20px auto;
  max-width:900px;
}

/* 9 x 12 ratio */
.calendar{
  width:min(900px,100%);
  aspect-ratio:3/4;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#f5eee3;
  border:1px solid #5f574f;
  outline:2px solid #5f574f;
  outline-offset:-7px;
  box-shadow:0 8px 25px #0003;
  print-color-adjust:exact;
  -webkit-print-color-adjust:exact;
}

.photo,
.coverPhoto{
  position:absolute;
  overflow:hidden;
  background:#ddd4ca;
}

.photo{
  left:4.5%;
  top:8%;
  bottom:8%;
  width:29%;
  z-index:1;
}

.coverPhoto{
  inset:0;
  z-index:0;
  display:none;
}

.photo img,
.coverPhoto img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
  transform-origin:center;
}

.coverOverlay{
  position:absolute;
  inset:0;
  background:#000;
  pointer-events:none;
}

.content{
  position:absolute;
  left:38%;
  right:5%;
  top:8%;
  bottom:8%;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}

.coverMode .photo{
  display:none;
}

.coverMode .coverPhoto{
  display:block;
}

.coverMode .content{
  left:7%;
  right:7%;
  top:7%;
  bottom:7%;
  color:#fff;
  text-shadow:0 1px 5px #0009;
}

.date{
  font-size:clamp(18px,3vw,34px);
  font-weight:bold;
  margin-bottom:8px;
}

.month{
  font-size:clamp(25px,5vw,55px);
  font-weight:bold;
  margin-bottom:20px;
}

.ref{
  font-size:clamp(15px,2.5vw,25px);
  font-weight:bold;
  margin-bottom:15px;
}

.verse{
  font-size:clamp(13px,2vw,22px);
  line-height:1.5;
  margin-bottom:10px;
}

.tamil,
.sinhala{
  font-family:"Noto Sans Tamil","Noto Sans Sinhala",Arial,sans-serif;
}

.tamil{
  margin-top:8px;
}

.sinhala{
  margin-top:8px;
}

.controls small{
  color:#666;
}

.selected{
  margin-top:10px;
  padding:8px;
  background:#f5f5f5;
  border-radius:5px;
  font-size:13px;
}

/* PRINT */
@media print{
  body{
    padding:0;
    background:#fff;
  }

  .controls,
  h1{
    display:none;
  }

  .preview{
    margin:0;
    max-width:none;
  }

  .calendar{
    width:9in;
    height:12in;
    aspect-ratio:auto;
    margin:0;
    box-shadow:none;
  }
}
</style>
</head>

<body>

<h1>365 Bible Calendar 2027</h1>

<div class="controls">

  <div class="row">
    <label>
      Date<br>
      <input type="date" id="date" value="2027-01-01">
    </label>

    <label>
      Bible Reference<br>
      <input id="reference" value="John 3:16">
    </label>

    <label>
      Photo Layout<br>
      <select id="photoMode">
        <option value="side">Left Photo</option>
        <option value="cover">Full Page Cover</option>
      </select>
    </label>

    <label>
      Upload Photo<br>
      <input type="file" id="photo" accept="image/*">
    </label>
  </div>

  <div class="row">

    <label>
      Photo Fit<br>
      <select id="photoFit">
        <option value="cover">Cover</option>
        <option value="contain">Contain</option>
        <option value="fill">Fill</option>
      </select>
    </label>

    <label>
      Position<br>
      <select id="photoPos">
        <option value="center">Center</option>
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>

    <label>
      Brightness
      <div class="range">
        <input type="range" id="brightness" min="0" max="200" value="100">
        <span id="brightnessVal">100</span>%
      </div>
    </label>

    <label>
      Contrast
      <div class="range">
        <input type="range" id="contrast" min="0" max="200" value="100">
        <span id="contrastVal">100</span>%
      </div>
    </label>

    <label>
      Saturation
      <div class="range">
        <input type="range" id="saturation" min="0" max="200" value="100">
        <span id="saturationVal">100</span>%
      </div>
    </label>

  </div>

  <div class="row">

    <label>
      Opacity
      <div class="range">
        <input type="range" id="opacity" min="0" max="100" value="100">
        <span id="opacityVal">100</span>%
      </div>
    </label>

    <label>
      Blur
      <div class="range">
        <input type="range" id="blur" min="0" max="20" value="0">
        <span id="blurVal">0</span>
      </div>
    </label>

    <label>
      Rotation
      <div class="range">
        <input type="range" id="rotation" min="-180" max="180" value="0">
        <span id="rotationVal">0</span>°
      </div>
    </label>

    <label>
      Cover Overlay
      <div class="range">
        <input type="range" id="overlay" min="0" max="100" value="35">
        <span id="overlayVal">35</span>%
      </div>
    </label>

  </div>

  <hr>

  <div class="row">

    <label>
      English Verse<br>
      <textarea id="english" rows="3" cols="30">For God so loved the world, that he gave his only begotten Son.</textarea>
    </label>

    <label>
      Tamil Verse<br>
      <textarea id="tamil" rows="3" cols="30">தேவன் உலகத்தில் மிகவும் அன்புகூர்ந்தார்.</textarea>
    </label>

    <label>
      Sinhala Verse<br>
      <textarea id="sinhala" rows="3" cols="30">දෙවියන් වහන්සේ ලෝකයට බොහෝ සේ ප්‍රේම කළ සේක.</textarea>
    </label>

  </div>

  <div class="row">

    <label>
      English Size<br>
      <input type="number" id="englishSize" value="22" min="8" max="80">
    </label>

    <label>
      Tamil Size<br>
      <input type="number" id="tamilSize" value="20" min="8" max="80">
    </label>

    <label>
      Sinhala Size<br>
      <input type="number" id="sinhalaSize" value="20" min="8" max="80">
    </label>

    <label>
      Text Align<br>
      <select id="align">
        <option value="center">Center</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>

    <label>
      Verse Position<br>
      <select id="versePosition">
        <option value="center">Center</option>
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
      </select>
    </label>

  </div>

  <div class="row">

    <label>
      Language Spacing<br>
      <input type="number" id="langSpacing" value="8" min="0" max="50">
    </label>

  </div>

  <div class="row">
    <button onclick="previousDate()">Previous</button>
    <button onclick="nextDate()">Next</button>
    <button onclick="generate()">Generate</button>
    <button onclick="addDate()">Add Date to PDF</button>
    <button onclick="clearDates()">Clear Dates</button>
    <button onclick="window.print()">Current PDF</button>
    <button onclick="downloadPDF()">Download Selected PDF</button>
  </div>

  <div class="selected">
    <b>Selected dates:</b>
    <span id="selectedDates">None</span>
  </div>

  <small>
    PDF format: 9 × 12 inches, portrait. Selected dates are saved as
    sequential pages for duplex/front-back printing.
  </small>

</div>

<div class="preview">

  <div class="calendar" id="calendar">

    <div class="photo" id="leftPhoto"></div>

    <div class="coverPhoto" id="coverPhoto"></div>

    <div class="content" id="content">

      <div class="date" id="dateText"></div>

      <div class="month" id="monthText"></div>

      <div class="ref" id="refText"></div>

      <div class="verse" id="englishText"></div>

      <div class="verse tamil" id="tamilText"></div>

      <div class="verse sinhala" id="sinhalaText"></div>

    </div>

  </div>

</div>

<script>
const $ = id => document.getElementById(id);

let photoData = "";
let selectedDates = [];

/* ---------- PHOTO ---------- */

$("photo").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = ev => {
    photoData = ev.target.result;
    renderPhoto();
  };

  reader.readAsDataURL(file);
});

function renderPhoto(){

  if(!photoData){
    $("leftPhoto").innerHTML = "";
    $("coverPhoto").innerHTML = "";
    return;
  }

  const fit =
    $("photoMode").value === "cover"
      ? "cover"
      : $("photoFit").value;

  const filter =
    `brightness(${$("brightness").value}%) ` +
    `contrast(${$("contrast").value}%) ` +
    `saturate(${$("saturation").value}%) ` +
    `blur(${$("blur").value}px)`;

  const style =
    `object-fit:${fit};` +
    `object-position:${$("photoPos").value};` +
    `filter:${filter};` +
    `transform:rotate(${$("rotation").value}deg);` +
    `opacity:${$("opacity").value / 100};`;

  $("leftPhoto").innerHTML =
    `<img src="${photoData}" style="${style}">`;

  $("coverPhoto").innerHTML =
    `<img src="${photoData}" style="${style}">` +
    `<div class="coverOverlay" style="opacity:${$("overlay").value / 100}"></div>`;
}

/* ---------- DATE ---------- */

function formatDate(date){

  return date.toLocaleDateString("en-US",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });

}

function getMonth(date){

  return date.toLocaleDateString("en-US",{
    month:"long"
  });

}

function generate(){

  const date = new Date($("date").value + "T00:00:00");

  if(isNaN(date)) return;

  $("dateText").textContent = formatDate(date);

  $("monthText").textContent = getMonth(date);

  $("refText").textContent = $("reference").value;

  $("englishText").textContent = $("english").value;

  $("tamilText").textContent = $("tamil").value;

  $("sinhalaText").textContent = $("sinhala").value;

  $("englishText").style.fontSize =
    $("englishSize").value + "px";

  $("tamilText").style.fontSize =
    $("tamilSize").value + "px";

  $("sinhalaText").style.fontSize =
    $("sinhalaSize").value + "px";

  $("content").style.textAlign =
    $("align").value;

  $("tamilText").style.marginTop =
    $("langSpacing").value + "px";

  $("sinhalaText").style.marginTop =
    $("langSpacing").value + "px";

  const pos = $("versePosition").value;

  if(pos === "top"){
    $("content").style.justifyContent = "flex-start";
  }

  if(pos === "center"){
    $("content").style.justifyContent = "center";
  }

  if(pos === "bottom"){
    $("content").style.justifyContent = "flex-end";
  }

  mode();
  renderPhoto();
}

/* ---------- PHOTO MODE ---------- */

function mode(){

  $("calendar").classList.toggle(
    "coverMode",
    $("photoMode").value === "cover"
  );

}

/* ---------- DATE NAVIGATION ---------- */

function previousDate(){

  const d = new Date($("date").value + "T00:00:00");

  d.setDate(d.getDate() - 1);

  $("date").value =
    d.toISOString().split("T")[0];

  generate();
}

function nextDate(){

  const d = new Date($("date").value + "T00:00:00");

  d.setDate(d.getDate() + 1);

  $("date").value =
    d.toISOString().split("T")[0];

  generate();
}

/* ---------- SELECT DATES ---------- */

function addDate(){

  const date = $("date").value;

  if(!date) return;

  if(!selectedDates.includes(date)){
    selectedDates.push(date);
    selectedDates.sort();
  }

  renderDates();
}

function clearDates(){

  selectedDates = [];

  renderDates();
}

function renderDates(){

  $("selectedDates").textContent =
    selectedDates.length
      ? selectedDates.join(", ")
      : "None";

}

/* ---------- RANGE VALUES ---------- */

[
  ["brightness","brightnessVal"],
  ["contrast","contrastVal"],
  ["saturation","saturationVal"],
  ["opacity","opacityVal"],
  ["blur","blurVal"],
  ["rotation","rotationVal"],
  ["overlay","overlayVal"]
].forEach(([a,b]) => {

  $(a).addEventListener("input", () => {
    $(b).textContent = $(a).value;
    generate();
  });

});

/* ---------- LIVE CONTROLS ---------- */

[
  "reference",
  "english",
  "tamil",
  "sinhala",
  "englishSize",
  "tamilSize",
  "sinhalaSize",
  "align",
  "versePosition",
  "langSpacing",
  "photoMode",
  "photoFit",
  "photoPos"
].forEach(id => {

  $(id).addEventListener("input", generate);
  $(id).addEventListener("change", generate);

});

/* ---------- HTML2CANVAS ---------- */

async function capture(){

  generate();

  await new Promise(resolve =>
    setTimeout(resolve,150)
  );

  return await html2canvas(
    $("calendar"),
    {
      scale:2,
      useCORS:true,
      backgroundColor:null,
      logging:false
    }
  );

}

/* ---------- PDF ---------- */

async function makePDF(dates,name){

  if(!dates.length){
    alert("No dates selected.");
    return;
  }

  if(!photoData){
    alert("Please upload a photo first.");
    return;
  }

  const oldDate = $("date").value;

  const pdf = new jspdf.jsPDF({
    orientation:"portrait",
    unit:"in",
    format:[9,12],
    compress:true
  });

  try{

    for(let i=0;i<dates.length;i++){

      $("date").value = dates[i];

      const canvas = await capture();

      if(i){
        pdf.addPage([9,12],"portrait");
      }

      pdf.addImage(
        canvas.toDataURL("image/jpeg",0.96),
        "JPEG",
        0,
        0,
        9,
        12
      );

    }

    pdf.save(name);

  }finally{

    $("date").value = oldDate;

    generate();
    mode();
    renderDates();

  }

}

async function downloadPDF(){

  if(!selectedDates.length){

    if($("date").value){
      selectedDates = [$("date").value];
    }

  }

  renderDates();

  await makePDF(
    selectedDates,
    "Bible-Calendar-2027-9x12.pdf"
  );

}

/* ---------- INITIAL ---------- */

generate();
renderDates();

</script>

</body>
</html>
