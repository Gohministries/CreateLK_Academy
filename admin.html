<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Payments | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
padding:15px
}

.container{
max-width:850px;
margin:auto
}

.header{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:20px;
margin-bottom:18px;
text-align:center
}

.logo{
font-size:21px;
font-weight:800;
color:#155eef
}

h1{
font-size:25px;
margin:10px 0 5px
}

.subtitle{
color:#667085;
font-size:14px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:20px;
margin-bottom:18px;
box-shadow:0 3px 10px rgba(0,0,0,.04)
}

input{
width:100%;
padding:14px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:15px;
margin:10px 0
}

button{
border:0;
border-radius:9px;
padding:12px 15px;
font-weight:bold;
cursor:pointer;
font-size:14px
}

.login{
width:100%;
background:#155eef;
color:white
}

.refresh{
background:#eef4ff;
color:#155eef;
margin-bottom:15px
}

.approve{
background:#16a34a;
color:white
}

.reject{
background:#dc2626;
color:white
}

.receipt{
background:#f3f4f6;
color:#344054
}

.logout{
background:#fff1f2;
color:#dc2626
}

.actions{
display:flex;
gap:8px;
margin-top:18px;
flex-wrap:wrap
}

.actions button{
flex:1;
min-width:120px
}

.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:15px;
font-size:14px;
font-weight:bold
}

.success{
background:#ecfdf3;
color:#027a48
}

.error{
background:#fff1f2;
color:#be123c
}

.payment{
border:1px solid #e5e7eb;
border-radius:14px;
padding:18px;
margin-bottom:15px
}

.payment h3{
margin:0 0 15px;
font-size:17px
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #f0f2f5;
font-size:14px
}

.row:last-child{
border-bottom:0
}

.label{
color:#667085
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:11px
}

.pending{
background:#fff7ed;
color:#c2410c
}

.approved{
background:#ecfdf3;
color:#15803d
}

.rejected{
background:#fff1f2;
color:#be123c
}

.empty{
text-align:center;
padding:30px;
color:#667085
}

#dashboard{
display:none
}

footer{
text-align:center;
font-size:11px;
color:#98a2b3;
padding:20px
}

@media(max-width:600px){

body{
padding:10px
}

.card{
padding:15px
}

.row{
display:block
}

.value{
text-align:left;
margin-top:3px
}

.actions{
flex-direction:column
}

.actions button{
width:100%
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
📚 CreateLK Academy
</div>

<h1>💳 Student Payments</h1>

<div class="subtitle">
View, approve or reject Premium membership payments.
</div>

</div>


<div id="message" class="message"></div>


<!-- LOGIN -->

<div id="loginCard" class="card">

<h3>🔐 Admin Access</h3>

<p class="subtitle">
Enter your Student Payment Cloudflare Admin Key.
</p>

<input
id="adminKey"
type="password"
placeholder="Enter Admin Key"
autocomplete="off"
>

<button
class="login"
onclick="login()">
🔐 Load Payments
</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div class="card">

<button
class="refresh"
onclick="loadPayments()">
🔄 Refresh Payments
</button>

<button
class="logout"
onclick="logout()">
🚪 Logout
</button>

</div>


<div id="payments">

<div class="empty">
⏳ Loading payments...
</div>

</div>

</div>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

</div>


<script>

/* ==================================
   YOUR STUDENT PAYMENT WORKER
================================== */

const API =
"https://admin-approval.createlk.workers.dev";


let ADMIN_KEY = "";


/* ==================================
   MESSAGE
================================== */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent=text;

box.className =
"message " + type;

box.style.display="block";

}


/* ==================================
   LOGIN
================================== */

async function login(){

const key =
document.getElementById("adminKey")
.value.trim();

if(!key){

showMessage(
"Please enter your Admin Key.",
"error"
);

return;

}

ADMIN_KEY=key;

try{

await loadPayments(true);

}catch(error){

ADMIN_KEY="";

}

}


/* ==================================
   LOAD PAYMENTS
================================== */

async function loadPayments(isLogin=false){

const box =
document.getElementById("payments");

if(!isLogin){

box.innerHTML=
'<div class="empty">⏳ Loading payments...</div>';

}

try{

const response =
await fetch(
API + "/api/admin/payments",
{
method:"GET",

headers:{
"X-Admin-Key":ADMIN_KEY,
"Authorization":
"Bearer " + ADMIN_KEY,
"Accept":
"application/json"
}
}
);


if(
response.status===401 ||
response.status===403
){

throw new Error(
"Invalid Admin Key."
);

}


if(!response.ok){

throw new Error(
"Unable to load payments. HTTP " +
response.status
);

}


const text =
await response.text();

let data;

try{

data=JSON.parse(text);

}catch(e){

throw new Error(
"Worker returned an invalid response."
);

}


if(data.success===false){

throw new Error(
data.message ||
"Unable to load payments."
);

}


/* LOGIN SUCCESS */

document.getElementById(
"loginCard"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="block";


const list =
data.payments ||
data.results ||
data.data ||
data.requests ||
[];


renderPayments(list);

showMessage(
"Payments loaded successfully.",
"success"
);


}catch(error){

console.error(error);

if(isLogin){

showMessage(
error.message ||
"Unable to authenticate.",
"error"
);

}else{

box.innerHTML=
'<div class="empty">❌ ' +
escapeHTML(error.message) +
'</div>';

}

throw error;

}

}


/* ==================================
   RENDER PAYMENTS
================================== */

function renderPayments(list){

const box =
document.getElementById("payments");

box.innerHTML="";


if(!Array.isArray(list) || !list.length){

box.innerHTML=
'<div class="card empty">' +
'📭 No student payments found.' +
'</div>';

return;

}


list.forEach(payment=>{

box.appendChild(
createPaymentCard(payment)
);

});

}


/* ==================================
   PAYMENT CARD
================================== */

function createPaymentCard(p){

const card =
document.createElement("div");

card.className="payment";


const id =
p.id ||
p.payment_id ||
"";


const studentId =
p.student_id ||
"";


const name =
p.name ||
p.student_name ||
(
(p.first_name || "") +
" " +
(p.last_name || "")
).trim() ||
"Not available";


const email =
p.email ||
"Not available";


const phone =
p.phone ||
"Not available";


const amount =
Number(p.amount || 1500);


const reference =
p.payment_reference ||
p.transaction_reference ||
p.reference ||
"-";


const date =
p.payment_date ||
p.created_at ||
"-";


const status =
String(
p.status || "PENDING"
).toUpperCase();


const receipt =
p.receipt_url ||
p.receipt ||
p.receiptUrl ||
"";


let statusClass="pending";

if(status==="APPROVED")
statusClass="approved";

if(status==="REJECTED")
statusClass="rejected";


card.innerHTML=`

<h3>
💳 Payment #${escapeHTML(id)}
</h3>

<div class="row">
<div class="label">Student</div>
<div class="value">
${escapeHTML(name)}
</div>
</div>

<div class="row">
<div class="label">Email</div>
<div class="value">
${escapeHTML(email)}
</div>
</div>

<div class="row">
<div class="label">Phone</div>
<div class="value">
${escapeHTML(phone)}
</div>
</div>

<div class="row">
<div class="label">Student ID</div>
<div class="value">
${escapeHTML(studentId)}
</div>
</div>

<div class="row">
<div class="label">Amount</div>
<div class="value">
LKR ${amount.toLocaleString()}
</div>
</div>

<div class="row">
<div class="label">Payment Reference</div>
<div class="value">
${escapeHTML(reference)}
</div>
</div>

<div class="row">
<div class="label">Payment Date</div>
<div class="value">
${escapeHTML(date)}
</div>
</div>

<div class="row">
<div class="label">Status</div>
<div class="value">
<span class="status ${statusClass}">
${escapeHTML(status)}
</span>
</div>
</div>

<div class="actions">

${
receipt
?
`
<button
class="receipt"
onclick='viewReceipt(${JSON.stringify(receipt)})'>
👁 View Receipt
</button>
`
:
""
}

${
status==="PENDING"
?
`
<button
class="approve"
onclick="approvePayment(${Number(id)},this)">
✅ Approve Payment
</button>

<button
class="reject"
onclick="rejectPayment(${Number(id)},this)">
❌ Reject Payment
</button>
`
:
""
}

</div>

`;

return card;

}


/* ==================================
   VIEW RECEIPT
================================== */

function viewReceipt(url){

if(!url){

showMessage(
"Receipt is not available.",
"error"
);

return;

}

window.open(
url,
"_blank"
);

}


/* ==================================
   APPROVE
================================== */

async function approvePayment(
paymentId,
button
){

if(!confirm(
"Approve payment #" +
paymentId +
"?\n\nThis should activate the student's Premium membership and record the affiliate commission."
)){

return;

}

await updatePayment(
paymentId,
"APPROVED",
button
);

}


/* ==================================
   REJECT
================================== */

async function rejectPayment(
paymentId,
button
){

if(!confirm(
"Reject payment #" +
paymentId +
"?")){

return;

}

await updatePayment(
paymentId,
"REJECTED",
button
);

}


/* ==================================
   UPDATE PAYMENT
================================== */

async function updatePayment(
paymentId,
status,
button
){

button.disabled=true;

button.textContent=
"⏳ Processing...";


try{

/*
 IMPORTANT:
 This route must match the route
 already implemented by your Worker.
*/

const response =
await fetch(
API + "/api/admin/payment/update",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
ADMIN_KEY,

"Authorization":
"Bearer " + ADMIN_KEY
},

body:JSON.stringify({

payment_id:Number(paymentId),

status:status

})

}
);


const text =
await response.text();

let data;

try{

data=JSON.parse(text);

}catch(e){

throw new Error(
"Worker returned an invalid response."
);

}


if(
response.status===401 ||
response.status===403
){

throw new Error(
"Invalid Admin Key."
);

}


if(!response.ok ||
data.success===false){

throw new Error(
data.message ||
"Unable to update payment."
);

}


showMessage(
status==="APPROVED"
?
"✅ Payment approved successfully."
:
"❌ Payment rejected successfully.",
"success"
);


/* Reload */

await loadPayments();


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to update payment.",
"error"
);

button.disabled=false;

button.textContent=
status==="APPROVED"
?
"✅ Approve Payment"
:
"❌ Reject Payment";

}

}


/* ==================================
   LOGOUT
================================== */

function logout(){

ADMIN_KEY="";

document.getElementById(
"dashboard"
).style.display="none";

document.getElementById(
"loginCard"
).style.display="block";

document.getElementById(
"adminKey"
).value="";

document.getElementById(
"payments"
).innerHTML="";

showMessage(
"Logged out.",
"success"
);

}


/* ==================================
   ESCAPE
================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================
   ENTER KEY
================================== */

document.getElementById(
"adminKey"
).addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
login();
}

});

</script>

</body>
</html>
