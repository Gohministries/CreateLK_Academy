<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d8d1c8;color:#302c28;font:14px Arial;padding:18px}
.controls{max-width:1150px;margin:auto auto 18px;background:#fffdf9;padding:15px;border:1px solid #b9ad9f;border-radius:12px;box-shadow:0 5px 20px #0002}
h2{font:700 19px Georgia;color:#4d3b51;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{display:block;font-size:10px;font-weight:bold;margin:5px 0;color:#554c46}
input,textarea,select{width:100%;padding:8px;border:1px solid #c8bcaf;border-radius:7px;background:#fff;font:inherit}
textarea{height:60px;resize:vertical}
input[type=range]{padding:0;accent-color:#70547b}
.bar{display:grid;grid-template-columns:1fr 42px;gap:6px;align-items:center}
.value{text-align:center;font-size:10px;font-weight:bold;color:#70547b}
.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{padding:9px 13px;border:1px solid #5e4968;border-radius:7px;background:#70547b;color:#fff;font-weight:bold;cursor:pointer}
.secondary{background:#817265;border-color:#6f6155}
.green{background:#58735e;border-color:#4a6250}
.red{background:#985c58;border-color:#814b48}
.status{margin-top:9px;padding:8px;background:#f0ebe4;border-radius:7px;font-size:11px;color:#655c55}
.selectedDates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{padding:5px 8px;border-radius:20px;background:#ece4da;border:1px solid #c9bdae;font-size:10px}
.chip button{padding:1px 5px;border:0;border-radius:50%;background:#9a625e;font-size:9px}

/* 9 × 12 PAGE */
.calendar{
 width:min(900px,100%);
 aspect-ratio:3/4;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#f5eee3;
 border:1px solid #5f574f;
 outline:2px solid #5f574f;
 outline-offset:-7px;
 box-shadow:0 8px 25px #0003;
 print-color-adjust:exact;
 -webkit-print-color-adjust:exact
}

.photo,.coverPhoto{position:absolute;overflow:hidden;background:#ddd4ca}
.photo{left:4.5%;top:8%;bottom:8%;width:29%;z-index:1}
.coverPhoto{inset:0;z-index:0;display:none}
.photo img,.coverPhoto img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transform-origin:center}
.coverOverlay{position:absolute;inset:0;background:#000}

.content{position:absolute;left:37%;right:5%;top:5%;bottom:5%;display:flex;flex-direction:column;min-width:0;min-height:0;z-index:3}

.coverMode .photo{display:none}
.coverMode .coverPhoto{display:block}
.coverMode .content{left:7%;right:7%;top:7%;bottom:7%;text-shadow:0 1px 5px #0009}
.coverMode .dateText,.coverMode .cross,.coverMode .en,.coverMode .ta,.coverMode .si,.coverMode .ref{color:#fff}
.coverMode .dateRow,.coverMode .section,.coverMode .ref{border-color:#ffffff70}

.dateRow{height:14%;min-height:50px;display:flex;align-items:center;border-bottom:1px solid #d8cec1;position:relative}
.dateText{font:700 clamp(35px,5.5vw,68px)/1 Georgia;color:#51465b}
.cross{position:absolute;right:1px;top:2px;font:18px Georgia;color:#69546f}

.verses{flex:1;min-height:0;overflow:hidden;margin:6px 0}
#verseBox{height:100%;display:flex;flex-direction:column;overflow:hidden}
.section{flex:1;min-height:0;padding:7px 13px;border-top:1px solid #ddd3c8;overflow:hidden}
.section:first-child{border-top:0}
.txt{width:100%;max-height:100%;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
.en{font:500 25px/1.28 Georgia;color:#49334f}
.ta{font:500 18px/1.42 "Noto Sans Tamil",sans-serif;color:#76502f}
.si{font:500 18px/1.42 "Noto Sans Sinhala",sans-serif;color:#3f604a}
.left{text-align:left}.center{text-align:center}.right{text-align:right}

.ref{min-height:27px;border-top:1px solid #d8cec1;display:flex;align-items:center;justify-content:center;text-align:center;font:700 12px Georgia;color:#756c65;overflow:hidden}

@media(max-width:700px){
 body{padding:7px}
 .controls{padding:10px}
 .grid{grid-template-columns:1fr}
 .photo{left:4%;width:29%}
 .content{left:37%;right:4%;top:4%;bottom:4%}
 .coverMode .content{left:8%;right:8%}
 .dateText{font-size:clamp(22px,6vw,42px)}
 .section{padding:4px 8px}
}

@media print{
 body{padding:0;background:#fff}
 .controls{display:none}
 .calendar{width:9in;height:12in;aspect-ratio:auto;box-shadow:none}
}
</style></head><body><div class="controls">
<h2>365 Bible Calendar 2027</h2><div class="grid"><div>
<label>Date</label>
<input id="date" type="date" min="2027-01-01" max="2027-12-31" value="2027-01-01">
</div><div>
<label>Bible Reference</label>
<input id="ref" value="John 3:16">
</div><div>
<label>Photo Layout</label>
<select id="photoMode">
<option value="left">Left Photo Panel</option>
<option value="cover">Full Page Cover — 9×12</option>
</select>
</div><div>
<label>Upload Photo</label>
<input id="photoUpload" type="file" accept="image/*">
</div><div>
<label>Photo Fit</label>
<select id="photoFit">
<option value="cover">Fill / Crop</option>
<option value="contain">Show Full Photo</option>
</select>
</div><div>
<label>Photo Position</label>
<select id="photoPos">
<option value="center">Center</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div><div><label>Brightness</label><div class="bar"><input id="brightness" type="range" min="40" max="160" value="100"><span class="value" id="brightnessV">100%</span></div></div>
<div><label>Contrast</label><div class="bar"><input id="contrast" type="range" min="50" max="180" value="100"><span class="value" id="contrastV">100%</span></div></div>
<div><label>Saturation</label><div class="bar"><input id="saturation" type="range" min="0" max="180" value="100"><span class="value" id="saturationV">100%</span></div></div>
<div><label>Photo Opacity</label><div class="bar"><input id="opacity" type="range" min="20" max="100" value="100"><span class="value" id="opacityV">100%</span></div></div>
<div><label>Blur</label><div class="bar"><input id="blur" type="range" min="0" max="8" value="0"><span class="value" id="blurV">0px</span></div></div>
<div><label>Rotation</label><div class="bar"><input id="rotation" type="range" min="-10" max="10" value="0"><span class="value" id="rotationV">0°</span></div></div>
<div><label>Cover Dark Overlay</label><div class="bar"><input id="overlay" type="range" min="0" max="80" value="20"><span class="value" id="overlayV">20%</span></div></div><div>
<label>English Verse</label>
<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>
<label>Font Size</label>
<div class="bar"><input id="ens" type="range" min="12" max="38" value="25"><span class="value" id="ensv">25</span></div>
</div><div>
<label>Tamil Verse</label>
<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>
<label>Font Size</label>
<div class="bar"><input id="tas" type="range" min="10" max="30" value="18"><span class="value" id="tasv">18</span></div>
</div><div>
<label>Sinhala Verse</label>
<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>
<label>Font Size</label>
<div class="bar"><input id="sis" type="range" min="10" max="30" value="18"><span class="value" id="sisv">18</span></div>
</div><div>
<label>English Alignment</label>
<select id="ena"><option>left</option><option>center</option><option>right</option></select>
</div><div>
<label>Tamil Alignment</label>
<select id="taa"><option>left</option><option>center</option><option>right</option></select>
</div><div>
<label>Sinhala Alignment</label>
<select id="sia"><option>left</option><option>center</option><option>right</option></select>
</div><div><label>Verse Position</label><div class="bar"><input id="pos" type="range" min="0" max="100" value="0"><span class="value" id="posv">Top</span></div></div><div><label>Language Spacing</label><div class="bar"><input id="space" type="range" min="0" max="25" value="5"><span class="value" id="spacev">5px</span></div></div></div><div class="buttons">
<button id="prev">Previous</button>
<button id="next">Next</button>
<button id="generate" class="green">Generate</button>
<button id="add" class="secondary">Add Date to PDF</button>
<button id="clear" class="red">Clear Dates</button>
<button id="current">Current PDF</button>
<button id="multi" class="green">Download Selected PDF</button>
</div><div class="status" id="status"></div>
<div class="selectedDates" id="selected"></div>
</div><div class="calendar" id="calendar"><div class="coverPhoto" id="coverPhoto"></div>
<div class="photo" id="leftPhoto"></div><div class="content"><div class="dateRow">
<div class="dateText" id="dateText"></div>
<div class="cross">✝</div>
</div><div class="verses">
<div id="verseBox"><div class="section">
<div id="enText" class="txt en left"></div>
</div><div class="section">
<div id="taText" class="txt ta left"></div>
</div><div class="section">
<div id="siText" class="txt si left"></div>
</div></div>
</div><div class="ref" id="refText"></div></div>
</div><script>
const $=id=>document.getElementById(id);
let photoData="",selectedDates=[];


/* PHOTO */

function renderPhoto(){

 if(!photoData){
  $("leftPhoto").innerHTML="";
  $("coverPhoto").innerHTML="";
  return;
 }

 const fit=$("photoMode").value==="cover"?"cover":$("photoFit").value;
 const filter=`brightness(${$("brightness").value}%) contrast(${$("contrast").value}%) saturate(${$("saturation").value}%) blur(${$("blur").value}px)`;
 const style=`object-fit:${fit};object-position:${$("photoPos").value};filter:${filter};transform:rotate(${$("rotation").value}deg);opacity:${$("opacity").value/100}`;

 $("leftPhoto").innerHTML=`<img src="${photoData}" style="${style}">`;

 $("coverPhoto").innerHTML=
  `<img src="${photoData}" style="${style}">`+
  `<div class="coverOverlay" style="opacity:${$("overlay").value/100}"></div>`;
}

$("photoUpload").onchange=e=>{
 const f=e.target.files[0];
 if(!f||!f.type.startsWith("image/"))return alert("Please select an image.");
 const r=new FileReader();
 r.onload=()=>{photoData=r.result;renderPhoto();status()};
 r.readAsDataURL(f);
};


/* DISPLAY */

function generate(){

 const d=new Date($("date").value+"T00:00:00");

 $("dateText").textContent=d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
 $("refText").textContent=$("ref").value;
 $("enText").textContent=$("en").value;
 $("taText").textContent=$("ta").value;
 $("siText").textContent=$("si").value;

 [["en","ens","ena"],["ta","tas","taa"],["si","sis","sia"]].forEach(([x,s,a])=>{
  const t=$(x+"Text");
  t.className=`txt ${x} ${$(a).value}`;
  t.style.fontSize=$(s).value+"px";
  $(s+"v").textContent=$(s).value;
 });

 document.querySelectorAll(".section").forEach((s,i)=>{
  s.style.marginTop=i?$("space").value+"px":"0";
 });

 $("spacev").textContent=$("space").value+"px";

 requestAnimationFrame(position);
}


function position(){

 const p=+$("pos").value;

 $("posv").textContent=p===0?"Top":p===50?"Center":p===100?"Bottom":p+"%";

 document.querySelectorAll(".section").forEach(s=>{
  const t=s.querySelector(".txt");
  const free=s.clientHeight-t.offsetHeight;
  t.style.transform=free>0?`translateY(${free*p/100}px)`:"none";
 });
}


/* MODE */

function mode(){

 $("calendar").classList.toggle(
  "coverMode",
  $("photoMode").value==="cover"
 );

 renderPhoto();
 status();
}


function status(){

 $("status").textContent=
 `${photoData?"Photo uploaded":"No photo uploaded"} | `+
 `${$("photoMode").value==="cover"?"9×12 Full Page":"Left Photo"} | `+
 `PDF pages: ${selectedDates.length}/10`;
}


/* DATE */

function move(n){

 const d=new Date($("date").value+"T00:00:00");
 d.setDate(d.getDate()+n);

 if(d.getFullYear()!==2027)return;

 $("date").value=d.toISOString().slice(0,10);
 generate();
}


/* SELECT DATES */

function addDate(){

 const d=$("date").value;

 if(!d)return alert("Select a date first.");
 if(selectedDates.includes(d))return alert("Date already selected.");
 if(selectedDates.length>=10)return alert("Maximum 10 PDF pages.");

 selectedDates.push(d);
 renderDates();
}


function renderDates(){

 $("selected").innerHTML="";

 selectedDates.forEach((d,i)=>{

  const chip=document.createElement("div");
  chip.className="chip";
  chip.innerHTML=`${i+1}. ${new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})} `;

  const b=document.createElement("button");
  b.textContent="×";
  b.onclick=()=>{
   selectedDates.splice(i,1);
   renderDates();
  };

  chip.appendChild(b);
  $("selected").appendChild(chip);
 });

 status();
}


/* PDF */

async function capture(){

 generate();
 mode();

 if(document.fonts)await document.fonts.ready;
 await new Promise(r=>setTimeout(r,300));

 return html2canvas($("calendar"),{
  scale:3,
  useCORS:true,
  backgroundColor:null,
  imageTimeout:0
 });
}


async function makePDF(dates,name){

 if(!dates.length)return alert("No dates selected.");
 if(!photoData)return alert("Please upload a photo first.");

 const old=$("date").value;

 const pdf=new jspdf.jsPDF({
  orientation:"portrait",
  unit:"in",
  format:[9,12],
  compress:true
 });

 try{

  for(let i=0;i<dates.length;i++){

   $("date").value=dates[i];

   const canvas=await capture();

   if(i)pdf.addPage([9,12],"portrait");

   pdf.addImage(
    canvas.toDataURL("image/jpeg",.96),
    "JPEG",
    0,0,9,12
   );
  }

  pdf.save(name);

 }finally{

  $("date").value=old;
  generate();
  mode();
  renderDates();
 }
}


/* BUTTONS */

$("prev").onclick=()=>move(-1);
$("next").onclick=()=>move(1);

$("generate").onclick=()=>{
 generate();
 mode();
};

$("add").onclick=addDate;

$("clear").onclick=()=>{
 selectedDates=[];
 renderDates();
};

$("current").onclick=()=>
 makePDF([$("date").value],"Bible-Calendar-9x12.pdf");

$("multi").onclick=()=>{
 if(!selectedDates.length)
  return alert("Add dates to the PDF first.");

 makePDF(
  selectedDates,
  `Bible-Calendar-${selectedDates.length}-Pages-9x12.pdf`
 );
};


/* INPUTS */

["date","ref","en","ta","si"].forEach(id=>
 $(id).oninput=generate
);

["ena","taa","sia"].forEach(id=>
 $(id).onchange=generate
);

$("pos").oninput=position;
$("space").oninput=generate;

["ens","tas","sis"].forEach(id=>{
 $(id).oninput=()=>{
  $(id+"v").textContent=$(id).value;
  generate();
 };
});


/* PHOTO CONTROLS */

[
 ["brightness","brightnessV","%"],
 ["contrast","contrastV","%"],
 ["saturation","saturationV","%"],
 ["opacity","opacityV","%"],
 ["blur","blurV","px"],
 ["rotation","rotationV","°"],
 ["overlay","overlayV","%"]
].forEach(([id,v,u])=>{
 $(id).oninput=()=>{
  $(v).textContent=$(id).value+u;
  renderPhoto();
 };
});

$("photoFit").onchange=renderPhoto;
$("photoPos").onchange=renderPhoto;
$("photoMode").onchange=mode;


/* START */

generate();
mode();
renderDates();

</script></body>
</html>
