<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0
}

body{
 background:#d8d0c5;
 font-family:Arial,sans-serif;
 color:#302d29;
 padding:18px
}

.controls{
 max-width:1100px;
 margin:auto auto 18px;
 background:#fffdf9;
 padding:15px;
 border:1px solid #b9ad9d;
 border-radius:12px;
 box-shadow:0 4px 18px #0002
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px
}

.options{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px
}

label{
 display:block;
 font-size:10px;
 font-weight:bold;
 margin:6px 0 4px;
 color:#514a43
}

input,
textarea,
select{
 width:100%;
 border:1px solid #c8bdae;
 border-radius:7px;
 padding:8px;
 font:inherit;
 background:#fff
}

textarea{
 height:55px;
 resize:vertical
}

input[type=range]{
 padding:0;
 accent-color:#70547f
}

.bar{
 display:grid;
 grid-template-columns:1fr 48px;
 gap:7px;
 align-items:center
}

.value{
 font-size:10px;
 text-align:center;
 font-weight:bold;
 color:#70547f
}

.buttons{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px
}

button{
 border:1px solid #594467;
 border-radius:7px;
 padding:10px 14px;
 background:#70547f;
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

/* CALENDAR */

.calendar{
 width:min(1100px,100%);
 aspect-ratio:16/10;
 margin:auto;
 background:#f7f1e8;
 border:1px solid #a99c8d;
 outline:1px solid #817466;
 outline-offset:-6px;
 position:relative;
 overflow:hidden;
 box-shadow:0 7px 25px #0002
}

.photo{
 position:absolute;
 left:5%;
 top:10%;
 bottom:10%;
 width:27%;
 overflow:hidden;
 border-radius:4px;
 background:#d9d4cc
}

#art,
#art svg{
 width:100%;
 height:100%;
 display:block
}

.content{
 position:absolute;
 left:36%;
 right:5%;
 top:8%;
 bottom:7%;
 display:flex;
 flex-direction:column;
 min-width:0
}

.dateRow{
 height:17%;
 min-height:65px;
 display:flex;
 align-items:center;
 border-bottom:1px solid #d9d0c5;
 position:relative
}

.dateText{
 font-size:clamp(35px,5.8vw,68px);
 line-height:1;
 font-weight:700;
 color:#51475b
}

.icon{
 position:absolute;
 right:0;
 top:2px;
 font-size:21px;
 line-height:1
}

/* VERSE AREA */

.verses{
 flex:1;
 min-height:0;
 position:relative;
 overflow:hidden;
 margin-top:11px
}

/* ONE CLEAN VERSE AREA */

#verseBox{
 position:absolute;
 left:0;
 right:0;
 top:0;
 height:90%;

 display:flex;
 flex-direction:column;
 justify-content:center;

 background:transparent;
 border:0;
 border-radius:0;
 box-shadow:none;

 overflow:hidden;

 transition:transform .15s ease
}

/* THREE TEXT LINES - NO BOXES */

.verseText{
 width:100%;
 background:transparent;
 border:0;
 padding:0;
 overflow:hidden
}

.enText{
 line-height:1.25;
 color:#493452;
 font-family:Arial,sans-serif
}

.taText{
 line-height:1.4;
 color:#55452f;
 font-family:"Noto Sans Tamil","Latha","Vijaya",sans-serif
}

.siText{
 line-height:1.4;
 color:#3f5744;
 font-family:"Noto Sans Sinhala","Iskoola Pota",sans-serif
}

.left{
 text-align:left
}

.center{
 text-align:center
}

.right{
 text-align:right
}

/* REFERENCE */

.ref{
 height:8%;
 min-height:30px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-top:1px solid #d9d0c5;
 color:#766e67;
 font-size:clamp(10px,1.2vw,15px);
 font-weight:bold;
 margin-top:7px
}

/* MOBILE */

@media(max-width:700px){

 body{
  padding:7px
 }

 .controls{
  padding:10px
 }

 .grid,
 .options{
  grid-template-columns:1fr
 }

 .calendar{
  aspect-ratio:16/10
 }

 .photo{
  left:4%;
  width:28%
 }

 .content{
  left:36%;
  right:4%
 }

 .dateRow{
  min-height:42px
 }

 .verses{
  margin-top:6px
 }

 #verseBox{
  height:92%
 }

 .verseText{
  padding:0
 }

 .ref{
  min-height:20px;
  margin-top:4px
 }

 .icon{
  font-size:15px
 }
}
</style>
</head>

<body>

<div class="controls">

 <div class="grid">

  <div>
   <label>Date</label>

   <input
    id="date"
    type="date"
    min="2027-01-01"
    max="2027-12-31"
    value="2027-01-01">
  </div>

  <div>
   <label>Bible Reference</label>

   <input
    id="ref"
    type="text"
    placeholder="Optional">
  </div>

 </div>


 <div class="options">

  <div>
   <label>VERSE OF THE DAY Position</label>

   <div class="bar">

    <input
     id="vp"
     type="range"
     min="0"
     max="100"
     value="0">

    <span
     class="value"
     id="vpv">Top</span>

   </div>
  </div>


  <div>
   <label>VERSE OF THE DAY Style</label>

   <select id="vstyle">

    <option value="400">Normal</option>
    <option value="500">Elegant</option>
    <option value="700">Bold</option>

   </select>
  </div>


  <div>
   <label>Common Verse Position</label>

   <div class="bar">

    <input
     id="cp"
     type="range"
     min="0"
     max="100"
     value="50">

    <span
     class="value"
     id="cpv">Center</span>

   </div>
  </div>


  <div>

   <label>First Verse</label>

   <textarea
    id="en"
    placeholder="Bible verse"></textarea>

   <label>Size</label>

   <div class="bar">

    <input
     id="ens"
     type="range"
     min="12"
     max="38"
     value="25">

    <span
     class="value"
     id="ensv">25</span>

   </div>

  </div>


  <div>

   <label>Second Verse</label>

   <textarea
    id="ta"
    placeholder="Bible verse"></textarea>

   <label>Size</label>

   <div class="bar">

    <input
     id="tas"
     type="range"
     min="10"
     max="30"
     value="18">

    <span
     class="value"
     id="tasv">18</span>

   </div>

  </div>


  <div>

   <label>Third Verse</label>

   <textarea
    id="si"
    placeholder="Bible verse"></textarea>

   <label>Size</label>

   <div class="bar">

    <input
     id="sis"
     type="range"
     min="10"
     max="30"
     value="18">

    <span
     class="value"
     id="sisv">18</span>

   </div>

  </div>


  <div>

   <label>First Alignment</label>

   <select id="ena">

    <option value="left">Left</option>
    <option value="center">Center</option>
    <option value="right">Right</option>

   </select>

  </div>


  <div>

   <label>Second Alignment</label>

   <select id="taa">

    <option value="left">Left</option>
    <option value="center">Center</option>
    <option value="right">Right</option>

   </select>

  </div>


  <div>

   <label>Third Alignment</label>

   <select id="sia">

    <option value="left">Left</option>
    <option value="center">Center</option>
    <option value="right">Right</option>

   </select>

  </div>


  <div>

   <label>Section Space</label>

   <div class="bar">

    <input
     id="space"
     type="range"
     min="0"
     max="30"
     value="8">

    <span
     class="value"
     id="spacev">8</span>

   </div>

  </div>

 </div>


 <div class="buttons">

  <button onclick="move(-1)">
   Previous
  </button>

  <button onclick="move(1)">
   Next
  </button>

  <button onclick="update()">
   Generate
  </button>

  <button onclick="downloadPDF()">
   Download PDF
  </button>

 </div>

</div>


<!-- CALENDAR -->

<div
 class="calendar"
 id="calendar">

 <div class="photo">
  <div id="art"></div>
 </div>


 <div class="content">


  <div class="dateRow">

   <div
    class="dateText"
    id="dateText">
   </div>

   <div class="icon">
    ✝️
   </div>

  </div>


  <!-- SINGLE VERSE AREA -->

  <div
   class="verses"
   id="verses">

   <div id="verseBox">

    <div
     id="enText"
     class="verseText enText left">
    </div>

    <div
     id="taText"
     class="verseText taText left">
    </div>

    <div
     id="siText"
     class="verseText siText left">
    </div>

   </div>

  </div>


  <div
   class="ref"
   id="refText">
  </div>


 </div>

</div>


<script>

const $=id=>document.getElementById(id);


/* DATE */

function dateStr(d){

 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");

}


function doy(d){

 return Math.floor(
  (d-new Date(d.getFullYear(),0,1))
  /86400000
 )+1;

}


/* SCENES */

const scenes=[
 "mountain",
 "lake",
 "forest",
 "river",
 "sunrise",
 "sunset",
 "valley",
 "path",
 "water",
 "hill"
];


/* SVG DEFINITIONS */

function svgDefs(n){

 let u="d"+n;

 return `

 <defs>

  <linearGradient
   id="sky${u}"
   x2="0"
   y2="1">

   <stop
    offset="0"
    stop-color="#91b9cc"/>

   <stop
    offset=".55"
    stop-color="#d8d8ca"/>

   <stop
    offset="1"
    stop-color="#eee0cb"/>

  </linearGradient>


  <linearGradient
   id="ground${u}"
   x2="0"
   y2="1">

   <stop
    stop-color="#71816b"/>

   <stop
    offset="1"
    stop-color="#26372d"/>

  </linearGradient>


  <linearGradient
   id="water${u}"
   x2="0"
   y2="1">

   <stop
    stop-color="#8eafb5"/>

   <stop
    offset="1"
    stop-color="#4f7078"/>

  </linearGradient>

 </defs>


 <rect
  width="500"
  height="700"
  fill="url(#sky${u})"/>

 `;

}


/* MOUNTAINS */

function mountains(v,u){

 let p=[
  [80,190,220,410],
  [140,150,310,410],
  [250,185,430,410],
  [60,235,360,410]
 ][v%4];

 return `

 <path
  d="M0 410
     L${p[0]} ${p[1]}
     L${p[2]} 170
     L${p[3]} 410Z"
  fill="#66736f"/>


 <path
  d="M90 410
     L250 ${120+v*18}
     L500 410Z"
  fill="#52605d"/>


 <path
  d="M0 430
     Q230 ${370+v*12} 500 430
     V700 H0Z"
  fill="url(#ground${u})"/>

 `;

}


/* TREES */

function trees(v){

 let s="";

 for(let i=0;i<7;i++){

  let x=
   25+
   i*75+
   (v*23)%35;

  let y=
   445+
   (i%3)*18;

  s+=`

   <path
    d="M${x} ${y+90}
       V${y+38}"
    stroke="#3c3028"
    stroke-width="8"/>


   <path
    d="M${x} ${y}
       L${x-30} ${y+45}
       H${x-13}
       L${x-37} ${y+78}
       H${x+37}
       L${x+13} ${y+45}
       H${x+30}Z"
    fill="#30483a"/>

  `;

 }

 return s;

}


/* LAKE */

function lake(v,u){

 return `

 <path
  d="M0 ${350+v*12}
     Q250 ${315+v*15}
     500 ${350+v*12}
     V700 H0Z"
  fill="url(#water${u})"/>


 <path
  d="M20 ${420+v*8}
     Q250 ${390+v*8}
     480 ${420+v*8}"
  fill="none"
  stroke="#e6ece7"
  stroke-width="4"
  opacity=".5"/>


 <path
  d="M50 ${485+v*5}
     Q250 ${455+v*5}
     450 ${485+v*5}"
  fill="none"
  stroke="#e6ece7"
  stroke-width="2"
  opacity=".35"/>

 `;

}


/* SUN */

function sun(v,color){

 return `

 <circle
  cx="${90+v*95}"
  cy="${145+v*18}"
  r="58"
  fill="${color}"
  opacity=".9"/>


 <circle
  cx="${90+v*95}"
  cy="${145+v*18}"
  r="78"
  fill="${color}"
  opacity=".12"/>

 `;

}


/* PATH */

function pathScene(v){

 let end=150+v*75;

 return `

 <path
  d="M0 410
     Q250 ${360+v*15} 500 410
     V700 H0Z"
  fill="#566a58"/>


 <path
  d="M245 700
     Q${170+v*45} 570 ${end} 430"
  fill="none"
  stroke="#bca27e"
  stroke-width="72"/>


 ${trees((v+2)%4)}

 `;

}


/* ART */

function artSVG(n){

 let type=
  scenes[(n-1)%scenes.length];

 let v=
  Math.floor((n-1)/scenes.length)%4;

 let u="d"+n;

 let s=svgDefs(n);


 if(type==="mountain"){

  s+=mountains(v,u);
  s+=trees(v);

 }


 if(type==="lake"){

  s+=mountains((v+1)%4,u);
  s+=lake(v,u);
  s+=trees((v+2)%4);

 }


 if(type==="forest"){

  s+=`

   <path
    d="M0 390
       Q250 330 500 390
       V700 H0Z"
    fill="#405646"/>

   ${pathScene(v)}

  `;

 }


 if(type==="river"){

  s+=mountains((v+2)%4,u);

  s+=`

   <path
    d="M190 700
       Q${320+v*20} 570
       ${150+v*45} 430
       Q250 375 330 340"
    fill="#668d96"
    stroke="#dbe6e1"
    stroke-width="3"/>

   ${trees((v+1)%4)}

  `;

 }


 if(type==="sunrise"){

  s+=sun(v,"#f5d58e");

  s+=mountains(
   (v+1)%4,
   u
  );

 }


 if(type==="sunset"){

  s+=sun(
   (v+2)%4,
   "#e5a16d"
  );

  s+=mountains(
   (v+3)%4,
   u
  );

 }


 if(type==="valley"){

  s+=`

   <path
    d="M0 390
       L150 ${170+v*20}
       L250 390
       L370 ${150+v*15}
       L500 390
       V700 H0Z"
    fill="#58665f"/>


   <path
    d="M0 450
       Q250 ${370+v*15}
       500 450
       V700 H0Z"
    fill="url(#ground${u})"/>


   ${trees(v)}

  `;

 }


 if(type==="path"){

  s+=pathScene(v);

  s+=mountains(
   (v+3)%4,
   u
  );

 }


 if(type==="water"){

  s+=mountains(v,u);

  s+=lake(
   (v+1)%4,
   u
  );

 }


 if(type==="hill"){

  s+=`

   <path
    d="M0 440
       Q130 ${270+v*20}
       270 430
       Q380 ${260+v*25}
       500 440
       V700 H0Z"
    fill="#63745f"/>


   <path
    d="M0 500
       Q250 ${420+v*15}
       500 500
       V700 H0Z"
    fill="url(#ground${u})"/>


   ${trees((v+1)%4)}

  `;

 }


 /* DEPTH */

 s+=`

  <rect
   width="500"
   height="700"
   fill="#17231e"
   opacity=".07"/>

 `;


 /* SVG TITLE */

 let y=
  70+
  (+$("vp").value/100)*560;

 let weight=
  $("vstyle").value;

 let italic=
  weight==="500"
  ?'font-style="italic"'
  :"";


 s+=`

  <text
   x="250"
   y="${y}"
   text-anchor="middle"
   dominant-baseline="middle"
   font-family="Georgia,serif"
   font-size="25"
   font-weight="${weight}"
   ${italic}
   letter-spacing="2"
   fill="#fff">

   VERSE OF THE DAY

  </text>

 `;


 return `

 <svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 700"
  preserveAspectRatio="xMidYMid slice">

  ${s}

 </svg>

 `;

}


/* COMMON VERSE POSITION */

function positionVerseBox(){

 let area=
  $("verses");

 let box=
  $("verseBox");

 if(!area||!box)return;

 let free=
  Math.max(
   0,
   area.clientHeight-box.offsetHeight
  );

 let p=
  +$("cp").value/100;

 box.style.transform=
  `translateY(${free*p}px)`;

}


/* UPDATE */

function update(){

 let value=
  $("date").value;

 if(!value)return;

 let d=
  new Date(value+"T12:00:00");

 let n=
  doy(d);


 /* DATE */

 $("dateText").textContent=
  d.toLocaleDateString(
   "en-US",
   {
    month:"long",
    day:"numeric"
   }
  );


 /* SVG */

 $("art").replaceChildren();

 $("art").innerHTML=
  artSVG(n);


 /* TEXT */

 $("enText").textContent=
  $("en").value;

 $("taText").textContent=
  $("ta").value;

 $("siText").textContent=
  $("si").value;


 /* SIZE */

 $("enText").style.fontSize=
  $("ens").value+"px";

 $("taText").style.fontSize=
  $("tas").value+"px";

 $("siText").style.fontSize=
  $("sis").value+"px";


 /* ALIGNMENT */

 $("enText").className=
  "verseText enText "+
  $("ena").value;

 $("taText").className=
  "verseText taText "+
  $("taa").value;

 $("siText").className=
  "verseText siText "+
  $("sia").value;


 /* REFERENCE */

 $("refText").textContent=
  $("ref").value;


 /* SPACE */

 let space=
  +$("space").value;

 $("verseBox").style.gap=
  space+"px";

 $("spacev").textContent=
  space;


 /* POSITION */

 requestAnimationFrame(()=>{
  positionVerseBox();
 });


 /* COMMON POSITION */

 let cp=
  +$("cp").value;

 $("cpv").textContent=
  cp<33
  ?"Top"
  :cp>66
  ?"Bottom"
  :"Center";


 /* TITLE POSITION */

 let vp=
  +$("vp").value;

 $("vpv").textContent=
  vp<33
  ?"Top"
  :vp>66
  ?"Bottom"
  :"Center";


 /* SIZE VALUES */

 $("ensv").textContent=
  $("ens").value;

 $("tasv").textContent=
  $("tas").value;

 $("sisv").textContent=
  $("sis").value;

}


/* PREVIOUS / NEXT */

function move(step){

 let d=
  new Date(
   $("date").value+"T12:00:00"
  );

 d.setDate(
  d.getDate()+step
 );


 if(d.getFullYear()!==2027){

  d=
   step<0
   ?new Date(2027,0,1)
   :new Date(2027,11,31);

 }


 $("date").value=
  dateStr(d);

 update();

}


/* LIVE CONTROLS */

document.querySelectorAll(
 "#date,#ref,#en,#ta,#si,#ena,#taa,#sia,#vp,#vstyle,#cp,#ens,#tas,#sis,#space"
).forEach(el=>{

 el.addEventListener(
  "input",
  update
 );

 el.addEventListener(
  "change",
  update
 );

});


/* RESIZE */

window.addEventListener(
 "resize",
 positionVerseBox
);


/* INITIAL */

update();


/* PDF */

async function downloadPDF(){

 const canvas=
  await html2canvas(
   $("calendar"),
   {
    scale:4,
    backgroundColor:"#f7f1e8",
    useCORS:true,
    logging:false
   }
  );


 const {jsPDF}=
  window.jspdf;


 const pdf=
  new jsPDF({
   orientation:"landscape",
   unit:"in",
   format:[9,5.625]
  });


 pdf.addImage(
  canvas.toDataURL("image/png"),
  "PNG",
  0,
  0,
  9,
  5.625
 );


 pdf.save(
  "365-Bible-Calendar-2027.pdf"
 );

}

</script>

</body>
</html>
