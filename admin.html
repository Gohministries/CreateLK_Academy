<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Premium Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:480px;
  margin:30px auto;
}

.header{
  background:#155eef;
  color:white;
  padding:22px;
  border-radius:18px 18px 0 0;
}

.header h1{
  font-size:21px;
  margin-bottom:6px;
}

.header p{
  font-size:13px;
  opacity:.9;
}

.card{
  background:white;
  padding:24px;
  border:1px solid #e4e7ec;
  border-radius:0 0 18px 18px;
  box-shadow:0 8px 30px #10182812;
}

.info{
  background:#f8fafc;
  border:1px solid #eaecf0;
  padding:14px;
  border-radius:12px;
  margin-bottom:22px;
  font-size:13px;
  line-height:1.6;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:14px;
  margin-bottom:17px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus{
  border-color:#155eef;
  box-shadow:0 0 0 3px #155eef15;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#155eef;
  color:white;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  font-size:13px;
  line-height:1.7;
}

.success{
  display:block;
  background:#ecfdf3;
  border:1px solid #abefc6;
  color:#067647;
}

.error{
  display:block;
  background:#fef3f2;
  border:1px solid #fecdca;
  color:#b42318;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  text-decoration:none;
  color:#155eef;
  font-size:13px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📚 CreateLK Academy</h1>
    <p>Premium Membership Approval</p>
  </div>

  <div class="card">

    <div class="info">
      <strong>⭐ Activate Premium</strong><br>
      Enter the student's registered email and select
      the number of Premium days.
      <br><br>
      Referral commission:
      <strong>20% of LKR 300 = LKR 60</strong>
    </div>

    <form id="activationForm">

      <label for="email">
        Student Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="student@example.com"
        autocomplete="off"
        required
      >

      <label for="days">
        Premium Days
      </label>

      <select id="days" required>
        <option value="">Select days</option>
      </select>

      <button
        id="activateButton"
        type="submit">
        ✓ Approve & Activate Premium
      </button>

    </form>

    <div id="result" class="result"></div>

    <a href="admin.html" class="back">
      ← Back to Admin
    </a>

  </div>

</div>

<script>

/* =========================================
   YOUR CLOUDFLARE WORKER URL
   ========================================= */

const API_URL =
"https://createlk-premium-admin.YOUR-SUBDOMAIN.workers.dev";


/* =========================================
   CREATE 1–30 DAY OPTIONS
   ========================================= */

const daysSelect =
document.getElementById("days");

for(let i = 1; i <= 30; i++){

  const option =
  document.createElement("option");

  option.value = i;
  option.textContent =
    i + (i === 1 ? " Day" : " Days");

  daysSelect.appendChild(option);
}


/* =========================================
   ELEMENTS
   ========================================= */

const form =
document.getElementById("activationForm");

const email =
document.getElementById("email");

const button =
document.getElementById("activateButton");

const result =
document.getElementById("result");


/* =========================================
   RESULT
   ========================================= */

function showResult(message,type){

  result.className =
    "result " + type;

  result.innerHTML =
    message;
}


/* =========================================
   ACTIVATE
   ========================================= */

form.addEventListener("submit",async function(e){

  e.preventDefault();

  const studentEmail =
    email.value.trim().toLowerCase();

  const days =
    Number(daysSelect.value);


  if(!studentEmail){

    showResult(
      "Please enter the student's email.",
      "error"
    );

    return;
  }


  if(!days || days < 1 || days > 30){

    showResult(
      "Please select 1–30 Premium days.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Processing approval...";


  try{

    const response =
    await fetch(API_URL,{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        email:studentEmail,

        days:days

      })
    });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Activation failed."
      );
    }


    let commissionText =
      "No referrer found.";

    if(data.referral &&
       data.referral.found){

      commissionText =
        `Referrer: <strong>
        ${escapeHTML(data.referral.referrer)}
        </strong><br>
        Commission: <strong>
        LKR ${data.referral.commission}
        </strong>`;
    }


    showResult(`

      <strong>✅ Premium Activated Successfully</strong>

      <br><br>

      Student:
      <strong>${escapeHTML(studentEmail)}</strong>

      <br>

      Premium:
      <strong>${days} Day${days === 1 ? "" : "s"}</strong>

      <br>

      Status:
      <strong>ACTIVE</strong>

      <br>

      Expiry:
      <strong>${escapeHTML(
        data.membership.expiry
      )}</strong>

      <br><br>

      ${commissionText}

    `,"success");


    form.reset();


  }catch(error){

    showResult(
      "❌ " +
      escapeHTML(
        error.message ||
        "Server error."
      ),
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "✓ Approve & Activate Premium";

});


/* =========================================
   SECURITY
   ========================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
