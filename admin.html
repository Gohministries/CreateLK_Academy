<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#eef1f5;
font-family:Arial,sans-serif;
color:#172033
}

.app{
max-width:1100px;
margin:auto
}

h2{
text-align:center;
margin:0 0 15px
}

.controls{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:18px;
box-shadow:0 3px 12px #0001
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:5px
}

label{
font-weight:bold;
font-size:14px
}

input,select,textarea{
width:100%;
padding:9px;
border:1px solid #ccd2da;
border-radius:7px;
font:inherit
}

textarea{
min-height:75px;
resize:vertical
}

.adjustment{
margin-top:12px;
padding:12px;
background:#f7f8fa;
border-radius:8px
}

.adjustment h3{
margin:0 0 8px;
font-size:15px
}

.range{
display:grid;
grid-template-columns:1fr 65px;
gap:8px;
align-items:center;
margin:7px 0
}

.range input{
padding:0
}

.range span{
font-size:12px;
text-align:right
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px
}

button{
border:0;
border-radius:7px;
padding:10px 15px;
cursor:pointer;
font-weight:bold
}

.secondary{
background:#e8edf3;
color:#172033
}

.gold{
background:#c49a45;
color:#fff
}

.danger,
.deleteBtn{
background:#b83b3b;
color:#fff
}

.deleteBtn{
padding:5px 9px;
font-size:11px
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
margin-top:10px;
font-size:13px;
font-weight:bold
}

.generated{
display:flex;
flex-direction:column;
gap:6px;
margin-top:8px
}

.generatedRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
background:#f1f4f7;
border:1px solid #d9dee5;
border-radius:6px;
padding:6px 8px
}

.generatedDate{
font-size:13px;
font-weight:bold;
color:#17365d
}

.calendar{
position:relative;
width:100%;
aspect-ratio:16/10;
background:#faf8f2;
border:1px solid #c8b98a;
outline:5px solid #f1ece0;
overflow:hidden;
margin:0 auto 18px
}

.photoTitle{
position:absolute;
left:4.5%;
top:46%;
width:29%;
text-align:center;
z-index:25;
color:#fff;
font-family:Cinzel,Georgia,serif;
font-size:14px;
font-weight:700;
line-height:1;
letter-spacing:1.5px;
white-space:nowrap;
padding:0;
background:transparent;
border:0;
box-shadow:none;
text-shadow:0 1px 4px rgba(0,0,0,.9)
}

.photoTitle:after{
display:none
}

.photo{
position:absolute;
left:4.5%;
top:5%;
bottom:7%;
width:29%;
overflow:hidden;
border-radius:8px;
background:#ddd
}

.photo img,
.fullPhoto{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.fullPhoto{
position:absolute;
inset:0;
display:none;
z-index:10
}

.full-view .fullPhoto{
display:block
}

.full-view .photo,
.full-view .content,
.full-view .photoTitle{
display:none
}

.coverVerses{
position:absolute;
left:7%;
right:7%;
top:6%;
bottom:6%;
z-index:20;
display:none;
grid-template-rows:1fr 1fr 1fr;
color:#fff;
text-align:center;
text-shadow:0 2px 4px #000,0 4px 12px #0009
}

.full-view .coverVerses{
display:grid
}

.coverVerse{
min-height:0;
overflow:hidden;
padding:10px 14px
display:flex;
align-items:center;
justify-content:center
}

.coverText{
width:100%;
max-width:100%;
max-height:100%;
overflow:visible;
overflow-wrap:anywhere;
white-space:normal;
padding:8px 8px 14px
}

#coverEnglish{
font:600 34px/1.15 "Playfair Display",Georgia,serif
}

#coverTamil{
font:500 24px/1.42 "Noto Sans Tamil",sans-serif;
padding-top:9px;
padding-bottom:14px
}

#coverSinhala{
font:500 24px/1.42 "Noto Sans Sinhala",sans-serif;
padding-top:9px;
padding-bottom:14px
}

.content{
position:absolute;
left:37%;
right:5%;
top:4%;
bottom:4%;
display:flex;
flex-direction:column;
min-width:0;
min-height:0
}

.dateRow{
height:9%;
min-height:30px;
display:flex;
align-items:center;
border-bottom:2px solid #c49a45;
position:relative;
color:#17365d
}

.dateGroup{
display:flex;
align-items:center;
gap:8px
}

.month{
font-size:clamp(16px,2.3vw,28px);
font-weight:bold
}

.day{
font-size:clamp(15px,2vw,24px);
font-weight:bold
}

.cross{
position:absolute;
right:2px;
top:1px;
color:#c49a45;
font:15px Georgia
}

.verses{
flex:1;
min-height:0;
padding-top:5px;
overflow:visible
}

#verseBox{
height:100%;
display:grid;
grid-template-rows:repeat(3,minmax(0,1fr))
}

.section{
min-height:0;
overflow:visible;
padding:9px 8px 12px;
display:flex;
flex-direction:column;
justify-content:center
}

.section+.section{
border-top:1px solid #e5dfd2
}

.text{
width:100%;
max-width:100%;
overflow:visible;
overflow-wrap:anywhere;
white-space:normal
}

#english{
font:600 25px/1.18 Georgia;
color:#172033;
padding:3px
}

#tamil{
font:500 18px/1.38 "Noto Sans Tamil",sans-serif;
color:#7a4e2d;
padding:7px 4px 10px;
overflow:visible
}

#sinhala{
font:500 18px/1.38 "Noto Sans Sinhala",sans-serif;
color:#35634a;
padding:7px 4px 10px;
overflow:visible
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr
}

body{
padding:10px
}

.photoTitle{
font-size:clamp(7px,1.8vw,14px);
letter-spacing:.8px
}

.section{
padding-left:6px;
padding-right:6px
}

#tamil,
#sinhala{
line-height:1.4;
padding-top:7px;
padding-bottom:10px
}

}

@media print{

@page{
size:9in 5.625in landscape;
margin:0
}

body{
padding:0;
background:#fff
}

.controls{
display:none
}

.calendar{
width:9in;
height:5.625in;
margin:0;
outline:none
}

}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar 2027</h2>

<div class="controls">

<div class="grid">

<div class="field">
<label>View</label>
<select id="photoView">
<option value="calendar">Calendar View — Photo + Bible Text</option>
<option value="full">Full Photo — 3 Bible Verses</option>
</select>
</div>

<div class="field">
<label>Upload Photo</label>
<input type="file" id="photo" accept="image/*">
</div>

<div class="field" id="dateField">
<label>Calendar Date</label>
<input type="date" id="date"
min="2027-01-01"
max="2027-12-31"
value="2027-01-01">
</div>

<div class="field">
<label>Full Photo English Font</label>
<select id="coverFont">
<option>Playfair Display</option>
<option>Cinzel</option>
<option>Montserrat</option>
<option>Georgia</option>
<option>Arial</option>
</select>
</div>

<div class="field">
<label>English Bible Verse</label>
<textarea id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>
</div>

<div class="field">
<label>Tamil Bible Verse</label>
<textarea id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>
</div>

<div class="field">
<label>Sinhala Bible Verse</label>
<textarea id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>
</div>

</div>

<div class="adjustment">

<h3>Calendar Text Size</h3>

<div class="range">
<input type="range" id="englishSize"
min=".5" max="30" step=".1" value="25">
<span id="englishSizeValue">25px</span>
</div>

<div class="range">
<input type="range" id="tamilSize"
min=".5" max="24" step=".1" value="18">
<span id="tamilSizeValue">18px</span>
</div>

<div class="range">
<input type="range" id="sinhalaSize"
min=".5" max="24" step=".1" value="18">
<span id="sinhalaSizeValue">18px</span>
</div>

<h3>Full Photo Text Size</h3>

<div class="range">
<input type="range" id="coverEnglishSize"
min="8" max="70" step=".1" value="34">
<span id="coverEnglishSizeValue">34px</span>
</div>

<div class="range">
<input type="range" id="coverTamilSize"
min="8" max="55" step=".1" value="24">
<span id="coverTamilSizeValue">24px</span>
</div>

<div class="range">
<input type="range" id="coverSinhalaSize"
min="8" max="55" step=".1" value="24">
<span id="coverSinhalaSizeValue">24px</span>
</div>

</div>

<div class="buttons">

<button class="secondary" id="prevBtn">
← Previous
</button>

<button class="secondary" id="nextBtn">
Next →
</button>

<button class="gold" id="generateBtn">
Generate
</button>

<button class="danger" id="clearBtn">
Clear All
</button>

<button class="gold" id="downloadBtn">
Download All PDF
</button>

</div>

<div class="status" id="status"></div>

<div class="generated" id="generatedList"></div>

</div>


<div class="calendar" id="calendar">

<img id="fullPhoto" class="fullPhoto">

<div class="coverVerses">

<div class="coverVerse">
<div class="coverText" id="coverEnglish"></div>
</div>

<div class="coverVerse">
<div class="coverText" id="coverTamil"></div>
</div>

<div class="coverVerse">
<div class="coverText" id="coverSinhala"></div>
</div>

</div>

<div class="photoTitle">
VERSE OF THE DAY
</div>

<div class="photo">
<img id="photoPreview">
</div>

<div class="content">

<div class="dateRow">

<div class="dateGroup">

<div class="month" id="monthText">
JANUARY
</div>

<div class="day" id="dayText">
1
</div>

</div>

<div class="cross">
✝
</div>

</div>

<div class="verses">

<div id="verseBox">

<section class="section">
<div class="text" id="english"></div>
</section>

<section class="section">
<div class="text" id="tamil"></div>
</section>

<section class="section">
<div class="text" id="sinhala"></div>
</section>

</div>

</div>

</div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

const KEY="BibleCalendar2027";

const months=[
"JANUARY",
"FEBRUARY",
"MARCH",
"APRIL",
"MAY",
"JUNE",
"JULY",
"AUGUST",
"SEPTEMBER",
"OCTOBER",
"NOVEMBER",
"DECEMBER"
];

let pages=[];
let photoData="";
let busy=false;


/* SAVE */

function getSettings(){

return {
view:$("photoView").value,
date:$("date").value,
font:$("coverFont").value,
en:$("englishInput").value,
ta:$("tamilInput").value,
si:$("sinhalaInput").value,
es:$("englishSize").value,
ts:$("tamilSize").value,
ss:$("sinhalaSize").value,
ces:$("coverEnglishSize").value,
cts:$("coverTamilSize").value,
css:$("coverSinhalaSize").value
};

}

function save(){

try{

localStorage.setItem(
KEY,
JSON.stringify({
pages:pages,
photo:photoData,
settings:getSettings()
})
);

}catch(e){

console.warn(
"LocalStorage save failed:",
e
);

}

}


/* LOAD */

function load(){

try{

let data=JSON.parse(
localStorage.getItem(KEY)||"null"
);

if(!data)return;

if(Array.isArray(data.pages))
pages=data.pages.slice(0,10);

if(data.photo){

photoData=data.photo;

$("photoPreview").src=
photoData;

$("fullPhoto").src=
photoData;

}

let s=data.settings||{};

if(s.view)
$("photoView").value=s.view;

if(s.date)
$("date").value=s.date;

if(s.font)
$("coverFont").value=s.font;

if(s.en!=null)
$("englishInput").value=s.en;

if(s.ta!=null)
$("tamilInput").value=s.ta;

if(s.si!=null)
$("sinhalaInput").value=s.si;

if(s.es!=null)
$("englishSize").value=s.es;

if(s.ts!=null)
$("tamilSize").value=s.ts;

if(s.ss!=null)
$("sinhalaSize").value=s.ss;

if(s.ces!=null)
$("coverEnglishSize").value=s.ces;

if(s.cts!=null)
$("coverTamilSize").value=s.cts;

if(s.css!=null)
$("coverSinhalaSize").value=s.css;

}catch(e){

console.error("Load error:",e);

}

}


/* PHOTO */

$("photo").onchange=e=>{

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=()=>{

photoData=reader.result;

$("photoPreview").src=
photoData;

$("fullPhoto").src=
photoData;

save();

};

reader.readAsDataURL(file);

};


/* UPDATE */

function update(){

let d=new Date(
$("date").value+"T00:00:00"
);

$("monthText").textContent=
months[d.getMonth()];

$("dayText").textContent=
d.getDate();

let en=$("englishInput").value;
let ta=$("tamilInput").value;
let si=$("sinhalaInput").value;

$("english").textContent=en;
$("tamil").textContent=ta;
$("sinhala").textContent=si;

$("coverEnglish").textContent=en;
$("coverTamil").textContent=ta;
$("coverSinhala").textContent=si;


/* SIZES */

$("english").style.fontSize=
$("englishSize").value+"px";

$("tamil").style.fontSize=
$("tamilSize").value+"px";

$("sinhala").style.fontSize=
$("sinhalaSize").value+"px";

$("coverEnglish").style.fontSize=
$("coverEnglishSize").value+"px";

$("coverTamil").style.fontSize=
$("coverTamilSize").value+"px";

$("coverSinhala").style.fontSize=
$("coverSinhalaSize").value+"px";


$("coverEnglish").style.fontFamily=
`"${$("coverFont").value}",Georgia,serif`;


/* VALUE LABELS */

$("englishSizeValue").textContent=
$("englishSize").value+"px";

$("tamilSizeValue").textContent=
$("tamilSize").value+"px";

$("sinhalaSizeValue").textContent=
$("sinhalaSize").value+"px";

$("coverEnglishSizeValue").textContent=
$("coverEnglishSize").value+"px";

$("coverTamilSizeValue").textContent=
$("coverTamilSize").value+"px";

$("coverSinhalaSizeValue").textContent=
$("coverSinhalaSize").value+"px";


/* VIEW */

let full=
$("photoView").value==="full";

$("calendar").classList.toggle(
"full-view",
full
);

$("dateField").style.display=
full?"none":"";

}


/* SLIDERS */

const sliderTargets={
englishSize:"english",
tamilSize:"tamil",
sinhalaSize:"sinhala",
coverEnglishSize:"coverEnglish",
coverTamilSize:"coverTamil",
coverSinhalaSize:"coverSinhala"
};

Object.keys(sliderTargets).forEach(
sliderId=>{

let targetId=
sliderTargets[sliderId];

$(sliderId).addEventListener(
"input",
()=>{

let value=
$(sliderId).value;

$(targetId).style.fontSize=
value+"px";

$(sliderId+"Value").textContent=
value+"px";

save();

}
);

$(sliderId).addEventListener(
"change",
()=>{

let value=
$(sliderId).value;

$(targetId).style.fontSize=
value+"px";

$(sliderId+"Value").textContent=
value+"px";

save();

}
);

}
);


/* TEXT / SETTINGS */

[
"photoView",
"date",
"coverFont",
"englishInput",
"tamilInput",
"sinhalaInput"
].forEach(id=>{

$(id).addEventListener(
"input",
()=>{

update();
save();

}
);

$(id).addEventListener(
"change",
()=>{

update();
save();

}
);

});


/* GENERATED LIST */

function render(){

$("generatedList").innerHTML=

pages.map((p,i)=>{

let name;

if(p.type==="full"){

name="Full Photo";

}else{

let d=new Date(
p.date+"T00:00:00"
);

name=d.toLocaleDateString(
"en-GB"
);

}

return `

<div class="generatedRow">

<span class="generatedDate">
${i+1}. ${name}
</span>

<button
class="deleteBtn"
data-i="${i}">
Delete
</button>

</div>

`;

}).join("");

$("status").textContent=
`Generated Pages: ${pages.length}/10`;

}


/* GENERATE */

$("generateBtn").onclick=async()=>{

if(busy)return;

if(!photoData){

alert(
"Please upload a photo first."
);

return;

}

if(pages.length>=10){

alert(
"Maximum 10 pages reached."
);

return;

}

busy=true;

$("generateBtn").disabled=true;

$("generateBtn").textContent=
"Generating...";

try{

update();

let type=
$("photoView").value==="full"
?"full"
:"calendar";

let date=
$("date").value;

if(type==="calendar"){

if(!date){

alert(
"Please select a date."
);

return;

}

let exists=pages.some(
p=>
p.type==="calendar" &&
p.date===date
);

if(exists){

alert(
"This calendar date is already generated."
);

return;

}

}

$("status").textContent=
"Creating page...";

let image=
await capture();

pages.push({

type:type,

date:
type==="calendar"
?date
:"",

image:image

});

save();

render();

$("status").textContent=
`Page added — ${pages.length}/10`;

}catch(e){

console.error(e);

alert(
"Generation error: "+
(e.message||e)
);

}finally{

busy=false;

$("generateBtn").disabled=false;

$("generateBtn").textContent=
"Generate";

}

};


/* CAPTURE */

async function capture(){

update();

await document.fonts.ready;

await new Promise(
r=>setTimeout(r,500)
);

let canvas=
await html2canvas(
$("calendar"),
{
scale:2,
useCORS:true,
allowTaint:true,
backgroundColor:"#faf8f2",
logging:false
}
);

return canvas.toDataURL(
"image/jpeg",
.82
);

}


/* DELETE */

$("generatedList").onclick=e=>{

let button=
e.target.closest(".deleteBtn");

if(!button)return;

let index=
Number(button.dataset.i);

pages.splice(
index,
1
);

save();

render();

};


/* CLEAR */

$("clearBtn").onclick=()=>{

if(!pages.length){

alert(
"No generated pages."
);

return;

}

if(confirm(
"Delete all generated pages?"
)){

pages=[];

save();

render();

}

};


/* PREVIOUS */

$("prevBtn").onclick=()=>{

if(
busy ||
$("photoView").value==="full"
)return;

let d=new Date(
$("date").value+"T00:00:00"
);

d.setDate(
d.getDate()-1
);

if(d.getFullYear()!==2027)
return;

$("date").value=
d.getFullYear()+"-"+
String(
d.getMonth()+1
).padStart(2,"0")+"-"+
String(
d.getDate()
).padStart(2,"0");

update();

save();

};


/* NEXT */

$("nextBtn").onclick=()=>{

if(
busy ||
$("photoView").value==="full"
)return;

let d=new Date(
$("date").value+"T00:00:00"
);

d.setDate(
d.getDate()+1
);

if(d.getFullYear()!==2027)
return;

$("date").value=
d.getFullYear()+"-"+
String(
d.getMonth()+1
).padStart(2,"0")+"-"+
String(
d.getDate()
).padStart(2,"0");

update();

save();

};


/* PDF */

$("downloadBtn").onclick=async()=>{

if(busy)return;

if(!pages.length){

alert(
"Generate at least one page first."
);

return;

}

if(
typeof html2canvas!=="function" ||
!window.jspdf?.jsPDF
){

alert(
"PDF library failed to load. Please reload."
);

return;

}

busy=true;

let button=
$("downloadBtn");

button.disabled=true;

button.textContent=
"Creating PDF...";

try{

let PDF=
window.jspdf.jsPDF;

let pdf=new PDF({

orientation:"landscape",

unit:"in",

format:[
9,
5.625
],

compress:true

});

for(
let i=0;
i<pages.length;
i++
){

$("status").textContent=
`Creating PDF page ${i+1} of ${pages.length}...`;

if(i>0){

pdf.addPage(
[9,5.625],
"landscape"
);

}

pdf.addImage(
pages[i].image,
"JPEG",
0,
0,
9,
5.625
);

}

let blob=
pdf.output("blob");

let url=
URL.createObjectURL(blob);

let a=
document.createElement("a");

a.href=url;

a.download=
"365-Bible-Calendar-2027.pdf";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1500
);

$("status").textContent=
`PDF created — ${pages.length} page(s).`;

}catch(e){

console.error(e);

alert(
"PDF error: "+
(e.message||e)
);

}finally{

busy=false;

button.disabled=false;

button.textContent=
"Download All PDF";

}

};


/* START */

window.onload=()=>{

load();

render();

update();

};

</script>
