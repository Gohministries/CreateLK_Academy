<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0
}

body{
 margin:0;
 padding:18px;
 background:#d8d1c8;
 color:#302c28;
 font:14px Arial,sans-serif
}

.controls{
 max-width:1150px;
 margin:auto auto 18px;
 background:#fffdf9;
 padding:15px;
 border:1px solid #b9ad9f;
 border-radius:12px;
 box-shadow:0 5px 20px #0002
}

h2{
 font:700 19px Georgia;
 color:#4d3b51;
 margin-bottom:12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px
}

label{
 display:block;
 font-size:10px;
 font-weight:bold;
 margin:5px 0;
 color:#554c46
}

input,
textarea,
select{
 width:100%;
 padding:8px;
 border:1px solid #c8bcaf;
 border-radius:7px;
 background:#fff;
 font:inherit
}

textarea{
 height:60px;
 resize:vertical
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px
}

button{
 padding:9px 13px;
 border:1px solid #5e4968;
 border-radius:7px;
 background:#70547b;
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

.secondary{
 background:#817265;
 border-color:#6f6155
}

.green{
 background:#58735e;
 border-color:#4a6250
}

.red{
 background:#985c58;
 border-color:#814b48
}

.status{
 margin-top:9px;
 padding:8px;
 background:#f0ebe4;
 border-radius:7px;
 font-size:11px;
 color:#655c55
}

.selectedDates{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:8px
}

.chip{
 padding:5px 8px;
 border-radius:20px;
 background:#ece4da;
 border:1px solid #c9bdae;
 font-size:10px
}

.chip button{
 padding:1px 5px;
 border:0;
 border-radius:50%;
 background:#9a625e;
 font-size:9px
}


/* CALENDAR */

.calendar{
 width:min(1100px,100%);
 aspect-ratio:16/10;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#f5eee3;
 border:1px solid #5f574f;
 outline:2px solid #5f574f;
 outline-offset:-7px;
 box-shadow:0 8px 25px #0003;
 print-color-adjust:exact;
 -webkit-print-color-adjust:exact
}


/* PHOTO */

.photo,
.coverPhoto{
 position:absolute;
 overflow:hidden;
 background:#ddd4ca
}

.photo{
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 border-radius:3px;
 box-shadow:0 2px 7px #0002;
 z-index:1
}

.coverPhoto{
 inset:0;
 display:none;
 background:#000
}

.photo img,
.coverPhoto img{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover
}

.coverOverlay{
 position:absolute;
 inset:0;
 background:#000;
 opacity:.2
}


/* CONTENT */

.content{
 position:absolute;
 left:37%;
 right:5%;
 top:5%;
 bottom:5%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
 z-index:3
}


/* DATE */

.dateRow{
 height:14%;
 min-height:50px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 border-bottom:1px solid #d8cec1;
 position:relative;
 overflow:hidden
}

.dateText{
 width:100%;
 white-space:nowrap;
 overflow:hidden;
 font:700 clamp(35px,5.5vw,68px)/1 Georgia;
 color:#51465b;
 letter-spacing:-1px
}

.cross{
 position:absolute;
 right:1px;
 top:2px;
 font:18px Georgia;
 color:#69546f
}


/* VERSES */

.verses{
 flex:1;
 min-height:0;
 overflow:hidden;
 margin:6px 0
}

#verseBox{
 height:100%;
 width:100%;
 display:grid;
 grid-template-rows:repeat(3,minmax(0,1fr));
 overflow:hidden
}

.section{
 min-width:0;
 min-height:0;
 padding:7px 13px;
 border-top:1px solid #ddd3c8;
 overflow:hidden;
 position:relative
}

.section:first-child{
 border-top:0
}

.txt{
 display:block;
 width:100%;
 height:auto;
 margin:0;
 padding:0;
 overflow:hidden;
 white-space:normal;
 overflow-wrap:anywhere;
 word-break:break-word
}

.en{
 font:500 25px/1.2 Georgia,serif;
 color:#49334f
}


/* TAMIL */

.ta{
 font-family:"Noto Sans Tamil",sans-serif;
 font-weight:500;
 font-size:18px;
 line-height:1.05;
 color:#76502f;
 white-space:normal;
 overflow-wrap:anywhere;
 word-break:normal;
}


/* SINHALA */

.si{
 font:500 18px/1.28 "Noto Sans Sinhala",sans-serif;
 color:#3f604a
}


/* COVER */

.coverMode .photo{
 display:none
}

.coverMode .coverPhoto{
 display:block
}

.coverMode .content{
 left:7%;
 right:7%;
 top:7%;
 bottom:7%;
 text-shadow:0 1px 5px #0009
}

.coverMode .dateRow{
 display:none
}

.coverMode .verses{
 margin:0;
 width:100%;
 height:100%
}

.coverMode .section{
 border:0;
 padding:12px 20px;
 display:flex;
 align-items:center
}

.coverMode .en,
.coverMode .ta,
.coverMode .si{
 color:#fff
}


/* MOBILE */

@media(max-width:700px){

 body{
  padding:7px
 }

 .controls{
  padding:10px
 }

 .grid{
  grid-template-columns:1fr
 }

 .photo{
  left:4%;
  width:29%
 }

 .content{
  left:37%;
  right:4%;
  top:4%;
  bottom:4%
 }

 .dateText{
  font-size:clamp(22px,6vw,42px)
 }

 .cross{
  font-size:14px
 }

 .section{
  padding:4px 8px
 }

 .coverMode .content{
  left:5%;
  right:5%;
  top:5%;
  bottom:5%
 }

 .coverMode .section{
  padding:8px 5px
 }
}


/* PRINT */

@media print{

 body{
  padding:0;
  background:#fff
 }

 .controls{
  display:none
 }

 .calendar{
  width:9in;
  height:5.625in;
  aspect-ratio:auto;
  box-shadow:none
 }
}
</style>
</head>

<body>

<div class="controls">

<h2>365 Bible Calendar 2027</h2>

<div class="grid">

<div>
<label>Date</label>
<input
 id="date"
 type="date"
 min="2027-01-01"
 max="2027-12-31"
 value="2027-01-01">
</div>

<div>
<label>Upload Photo</label>
<input
 id="photoUpload"
 type="file"
 accept="image/*">
</div>

<div>
<label>Photo Layout</label>
<select id="photoMode">
<option value="left">Left Photo Panel</option>
<option value="cover">Full Page Cover</option>
</select>
</div>

<div>
<label>English Verse</label>
<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>
</div>

<div>
<label>Tamil Verse</label>
<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>
</div>

<div>
<label>Sinhala Verse</label>
<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>
</div>

</div>

<div class="buttons">

<button id="prev">Previous</button>
<button id="next">Next</button>
<button id="generate" class="green">Generate</button>
<button id="add" class="secondary">Add Date to PDF</button>
<button id="clear" class="red">Clear Dates</button>
<button id="current">Current PDF</button>
<button id="multi" class="green">Download Selected PDF</button>

</div>

<div class="status" id="status">
No photo uploaded | Selected PDF pages: 0 / 10
</div>

<div class="selectedDates" id="selected"></div>

</div>


<div class="calendar" id="calendar">

<div class="coverPhoto" id="coverPhoto"></div>

<div class="photo" id="leftPhoto"></div>

<div class="content">

<div class="dateRow">

<div class="dateText" id="dateText"></div>

<div class="cross">✝</div>

</div>

<div class="verses">

<div id="verseBox">

<div class="section">
<div id="enText" class="txt en"></div>
</div>

<div class="section">
<div id="taText" class="txt ta"></div>
</div>

<div class="section">
<div id="siText" class="txt si"></div>
</div>

</div>

</div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

const KEY="bibleCalendar2027";

let photoData="";
let selectedDates=[];


/* SAVE */

function save(){

 try{

  localStorage.setItem(
   KEY,
   JSON.stringify({
    date:$("date").value,
    photoMode:$("photoMode").value,
    en:$("en").value,
    ta:$("ta").value,
    si:$("si").value,
    photo:photoData,
    selectedDates:selectedDates
   })
  );

 }catch(e){}
}


/* LOAD */

function load(){

 try{

  const d=JSON.parse(
   localStorage.getItem(KEY)||"{}"
  );

  if(d.date)
   $("date").value=d.date;

  if(d.photoMode)
   $("photoMode").value=d.photoMode;

  if(d.en!==undefined)
   $("en").value=d.en;

  if(d.ta!==undefined)
   $("ta").value=d.ta;

  if(d.si!==undefined)
   $("si").value=d.si;

  if(d.photo)
   photoData=d.photo;

  if(Array.isArray(d.selectedDates))
   selectedDates=d.selectedDates;

 }catch(e){}
}


/* PHOTO */

function renderPhoto(){

 if(!photoData){

  $("leftPhoto").innerHTML="";
  $("coverPhoto").innerHTML="";

  return;
 }

 $("leftPhoto").innerHTML=
  `<img src="${photoData}" alt="">`;

 $("coverPhoto").innerHTML=
  `<img src="${photoData}" alt="">
   <div class="coverOverlay"></div>`;
}


/* MODE */

function updateMode(){

 $("calendar").classList.toggle(
  "coverMode",
  $("photoMode").value==="cover"
 );

 updateStatus();

 setTimeout(
  ()=>fitAll(),
  250
 );
}


/* STATUS */

function updateStatus(){

 $("status").textContent=
  `${photoData?"Photo uploaded":"No photo uploaded"} | Layout: ${
   $("photoMode").value==="cover"
   ?"Full Page Cover — 3 Verses"
   :"Left Photo Panel — 3 Verses"
  } | Selected PDF pages: ${
   selectedDates.length
  } / 10`;
}


/*
====================================================
ROBUST TEXT FIT
====================================================
*/

function getAvailableHeight(section){

 const cs=getComputedStyle(section);

 return section.clientHeight
  -parseFloat(cs.paddingTop)
  -parseFloat(cs.paddingBottom);
}


function createMeasureElement(el,width){

 const s=getComputedStyle(el);

 const m=document.createElement("div");

 m.textContent=el.textContent;

 m.style.position="fixed";
 m.style.left="-100000px";
 m.style.top="0";
 m.style.visibility="hidden";
 m.style.pointerEvents="none";

 m.style.width=width+"px";

 m.style.fontFamily=s.fontFamily;
 m.style.fontSize=s.fontSize;
 m.style.fontWeight=s.fontWeight;
 m.style.fontStyle=s.fontStyle;
 m.style.lineHeight=s.lineHeight;
 m.style.letterSpacing=s.letterSpacing;

 m.style.whiteSpace="normal";
 m.style.overflowWrap=s.overflowWrap;
 m.style.wordBreak=s.wordBreak;

 m.style.padding="0";
 m.style.margin="0";
 m.style.border="0";

 document.body.appendChild(m);

 return m;
}


function textFits(el,section,size){

 const cs=getComputedStyle(el);

 const width=
  section.clientWidth-
  parseFloat(getComputedStyle(section).paddingLeft)-
  parseFloat(getComputedStyle(section).paddingRight);

 const m=
  createMeasureElement(el,width);

 m.style.fontSize=size+"px";

 const height=
  m.getBoundingClientRect().height;

 m.remove();

 return height<=
  getAvailableHeight(section)+0.1;
}


async function fitOne(lang){

 const el=$(lang+"Text");

 const section=
  el.parentElement;

 if(!el.textContent.trim())
  return;


 const max=
  lang==="en" ? 25 :
  lang==="ta" ? 18 : 18;

 const min=
  lang==="ta" ? 2 : 5;


 /*
  Make sure Tamil font is loaded.
 */

 if(lang==="ta" && document.fonts){

  await document.fonts.load(
   '500 18px "Noto Sans Tamil"'
  );

 }


 /*
  Find the largest font size
  that contains the COMPLETE verse.
 */

 let low=min;
 let high=max;
 let best=min;


 for(let i=0;i<45;i++){

  const mid=
   (low+high)/2;

  if(
   textFits(
    el,
    section,
    mid
   )
  ){

   best=mid;
   low=mid;

  }else{

   high=mid;

  }

 }


 /*
  Apply final size.
 */

 el.style.fontSize=
  best+"px";

 el.style.height="auto";
 el.style.maxHeight="none";
 el.style.overflow="hidden";


 /*
  Final pixel-by-pixel safety check.
 */

 let guard=0;

 while(
  !textFits(
   el,
   section,
   parseFloat(el.style.fontSize)
  ) &&
  parseFloat(el.style.fontSize)>min &&
  guard<100
 ){

  const current=
   parseFloat(el.style.fontSize);

  el.style.fontSize=
   Math.max(
    min,
    current-0.1
   )+"px";

  guard++;

 }
}


async function fitAll(){

 if(document.fonts)
  await document.fonts.ready;


 await fitOne("en");
 await fitOne("ta");
 await fitOne("si");
}


/* GENERATE */

async function generate(){

 const value=
  $("date").value;

 if(!value)
  return;


 const d=
  new Date(
   value+"T00:00:00"
  );


 $("dateText").textContent=
  d.toLocaleDateString(
   "en-US",
   {
    month:"short",
    day:"numeric"
   }
  );


 $("enText").textContent=
  $("en").value;

 $("taText").textContent=
  $("ta").value;

 $("siText").textContent=
  $("si").value;


 $("enText").style.fontSize="25px";
 $("taText").style.fontSize="18px";
 $("siText").style.fontSize="18px";


 /*
  Two frames ensure the calendar
  dimensions are already calculated.
 */

 await new Promise(
  r=>requestAnimationFrame(
   ()=>requestAnimationFrame(r)
  )
 );


 await fitAll();

 save();
}


/* DATE NAVIGATION */

function moveDate(n){

 const d=
  new Date(
   $("date").value+
   "T00:00:00"
  );

 d.setDate(
  d.getDate()+n
 );


 if(
  d<new Date("2027-01-01") ||
  d>new Date("2027-12-31")
 )
  return;


 $("date").value=
  d.toISOString().slice(0,10);

 generate();
}


/* SELECTED DATES */

function renderDates(){

 const box=
  $("selected");

 box.innerHTML="";


 selectedDates.forEach(
  (d,i)=>{

   const chip=
    document.createElement("div");

   const date=
    new Date(d+"T00:00:00");


   chip.className="chip";

   chip.innerHTML=
    `${i+1}. ${
     date.toLocaleDateString(
      "en-US",
      {
       month:"short",
       day:"numeric"
      }
     )
    } `;


   const b=
    document.createElement("button");

   b.textContent="×";


   b.onclick=()=>{

    selectedDates.splice(i,1);

    renderDates();

    save();

   };


   chip.appendChild(b);

   box.appendChild(chip);

  }
 );


 updateStatus();
}


/* CAPTURE */

async function capture(){

 await generate();

 renderPhoto();

 updateMode();

 await new Promise(
  r=>setTimeout(r,500)
 );

 await fitAll();

 await new Promise(
  r=>requestAnimationFrame(r)
 );

 return html2canvas(
  $("calendar"),
  {
   scale:3,
   useCORS:true,
   allowTaint:false,
   backgroundColor:null,
   imageTimeout:0,
   logging:false
  }
 );
}


/* PDF */

async function makePDF(
 dates,
 name
){

 if(!dates.length)
  return alert(
   "No dates selected."
  );


 if(!photoData)
  return alert(
   "Please upload a photo first."
  );


 if(!window.jspdf?.jsPDF)
  return alert(
   "PDF library is not loaded."
  );


 const old=
  $("date").value;


 const pdf=
  new window.jspdf.jsPDF({
   orientation:"landscape",
   unit:"in",
   format:[9,5.625],
   compress:true
  });


 try{

  for(
   let i=0;
   i<dates.length;
   i++
  ){

   $("date").value=
    dates[i];


   $("status").textContent=
    `Creating PDF page ${
     i+1
    } / ${dates.length}`;


   const canvas=
    await capture();


   if(i){

    pdf.addPage(
     [9,5.625],
     "landscape"
    );

   }


   pdf.addImage(
    canvas.toDataURL(
     "image/jpeg",
     .96
    ),
    "JPEG",
    0,
    0,
    9,
    5.625
   );

  }


  pdf.save(name);


 }catch(e){

  console.error(e);

  alert(
   "PDF creation failed."
  );


 }finally{

  $("date").value=old;

  await generate();

  renderPhoto();

  updateMode();

  renderDates();

 }
}


/* PHOTO */

$("photoUpload").onchange=
function(){

 const file=
  this.files[0];

 if(!file)
  return;


 if(!file.type.startsWith("image/")){

  alert(
   "Please select an image."
  );

  this.value="";

  return;
 }


 const reader=
  new FileReader();


 reader.onload=()=>{

  photoData=
   reader.result;

  renderPhoto();

  updateStatus();

  save();

 };


 reader.readAsDataURL(file);
};


/* BUTTONS */

$("prev").onclick=()=>{
 moveDate(-1);
};

$("next").onclick=()=>{
 moveDate(1);
};


$("generate").onclick=
async()=>{

 await generate();

 renderPhoto();

 updateMode();

};


$("add").onclick=()=>{

 const d=
  $("date").value;


 if(!d)
  return alert(
   "Please select a date."
  );


 if(
  selectedDates.includes(d)
 )
  return alert(
   "This date is already selected."
  );


 if(
  selectedDates.length>=10
 )
  return alert(
   "Maximum 10 PDF pages."
  );


 selectedDates.push(d);

 renderDates();

 save();

};


$("clear").onclick=()=>{

 selectedDates=[];

 renderDates();

 save();

};


$("current").onclick=()=>{

 makePDF(
  [$("date").value],
  `Bible-Calendar-${$("date").value}.pdf`
 );

};


$("multi").onclick=()=>{

 if(!selectedDates.length)
  return alert(
   "Please click 'Add Date to PDF' first."
  );


 makePDF(
  selectedDates,
  `Bible-Calendar-${selectedDates.length}-Pages.pdf`
 );

};


/* LIVE */

["date","en","ta","si"].forEach(
 id=>{

  $(id).addEventListener(
   "input",
   generate
  );

 }
);


$("photoMode").onchange=()=>{

 updateMode();

 save();

};


window.addEventListener(
 "resize",
 async()=>{
  await fitAll();
 }
);


/* START */

load();

renderPhoto();

updateMode();

generate();

renderDates();

</script>

</body>
</html>
