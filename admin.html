<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title><style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#eef1f5;
 font-family:Arial,sans-serif;color:#172033
}
.app{max-width:1000px;margin:auto}
h2{text-align:center}
.controls{
 background:#fff;padding:18px;border-radius:15px;margin-bottom:20px
}
input,textarea,select,button{
 width:100%;padding:11px;margin:6px 0;
 border:1px solid #ccc;border-radius:8px;font-family:Arial
}
textarea{height:85px;resize:vertical}
button{
 background:#172033;color:#fff;border:0;cursor:pointer
}
.row{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.nav{
 display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px
}
.options{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
canvas{
 width:100%;display:block;background:#fff;border-radius:5px
}
#status{text-align:center;margin:10px;font-weight:bold}
label{
 display:block;margin-top:8px;font-weight:bold
}
small{color:#666}
</style></head><body><div class="app"><h2>365 Days Bible Calendar</h2><div class="controls"><div class="row">
<div>
<label>Day</label>
<input id="day" placeholder="1">
</div><div>
<label>Date</label>
<input id="date" placeholder="January 1, 2027">
</div>
</div><label>Upload Your Photo</label>
<input type="file" id="photo" accept="image/*" onchange="uploadPhoto()">
<small>Photo will appear as a background image.</small>

<label>English Bible Verse</label>

<textarea id="english" placeholder="Enter English Bible verse"></textarea><label>Tamil Bible Verse</label>

<textarea id="tamil" placeholder="தமிழ் வேதாகம வசனத்தை உள்ளிடவும்"></textarea><label>Sinhala Bible Verse</label>

<textarea id="sinhala" placeholder="සිංහල බයිබල් පදය ඇතුළත් කරන්න"></textarea><label>Bible Reference</label>
<input id="reference" placeholder="John 3:16">

<h3>Text Style & Position</h3><div class="options"><div>
<label>English Font</label>
<select id="englishFont">
<option value="Arial">Arial</option>
<option value="Georgia">Georgia</option>
<option value="Times New Roman">Times New Roman</option>
<option value="Verdana">Verdana</option>
<option value="Trebuchet MS">Trebuchet MS</option>
</select><label>English Color</label>
<input type="color" id="englishColor" value="#172033">

<label>English Position</label>
<select id="englishPos">

<option value="left">Left</option>
<option value="center" selected>Center</option>
<option value="right">Right</option>
</select>
</div><div>
<label>Tamil Font</label>
<select id="tamilFont">
<option value="Arial">Arial</option>
<option value="Georgia">Georgia</option>
<option value="Noto Sans Tamil">Noto Sans Tamil</option>
<option value="Latha">Latha</option>
<option value="Nirmala UI">Nirmala UI</option>
</select><label>Tamil Color</label>
<input type="color" id="tamilColor" value="#333333">

<label>Tamil Position</label>
<select id="tamilPos">

<option value="left">Left</option>
<option value="center" selected>Center</option>
<option value="right">Right</option>
</select>
</div><div>
<label>Sinhala Font</label>
<select id="sinhalaFont">
<option value="Arial">Arial</option>
<option value="Georgia">Georgia</option>
<option value="Noto Sans Sinhala">Noto Sans Sinhala</option>
<option value="Iskoola Pota">Iskoola Pota</option>
<option value="Nirmala UI">Nirmala UI</option>
</select><label>Sinhala Color</label>
<input type="color" id="sinhalaColor" value="#333333">

<label>Sinhala Position</label>
<select id="sinhalaPos">

<option value="left">Left</option>
<option value="center" selected>Center</option>
<option value="right">Right</option>
</select>
</div></div><div class="nav">
<button onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
</div><button onclick="generate()">Generate</button>
<button onclick="save()">Save PNG</button>

<div id="status">Enter the Bible verses</div></div><canvas id="canvas" width="2400" height="1800"></canvas>

</div><script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let days=[];
let index=0;
let photoImage=null;

function current(){
 return {
  day:day.value,
  date:date.value,
  english:english.value,
  tamil:tamil.value,
  sinhala:sinhala.value,
  reference:reference.value,
  englishFont:englishFont.value,
  tamilFont:tamilFont.value,
  sinhalaFont:sinhalaFont.value,
  englishColor:englishColor.value,
  tamilColor:tamilColor.value,
  sinhalaColor:sinhalaColor.value,
  englishPos:englishPos.value,
  tamilPos:tamilPos.value,
  sinhalaPos:sinhalaPos.value
 };
}

function load(d){
 day.value=d.day||"";
 date.value=d.date||"";
 english.value=d.english||"";
 tamil.value=d.tamil||"";
 sinhala.value=d.sinhala||"";
 reference.value=d.reference||"";

 englishFont.value=d.englishFont||"Arial";
 tamilFont.value=d.tamilFont||"Arial";
 sinhalaFont.value=d.sinhalaFont||"Arial";

 englishColor.value=d.englishColor||"#172033";
 tamilColor.value=d.tamilColor||"#333333";
 sinhalaColor.value=d.sinhalaColor||"#333333";

 englishPos.value=d.englishPos||"center";
 tamilPos.value=d.tamilPos||"center";
 sinhalaPos.value=d.sinhalaPos||"center";

 generate();
}

function uploadPhoto(){

 let file=document.getElementById("photo").files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=function(e){

  photoImage=new Image();

  photoImage.onload=function(){
   generate();
  };

  photoImage.src=e.target.result;
 };

 reader.readAsDataURL(file);
}

function drawPhoto(){

 if(!photoImage)return;

 let scale=Math.max(
  canvas.width/photoImage.width,
  canvas.height/photoImage.height
 );

 let w=photoImage.width*scale;
 let h=photoImage.height*scale;

 let x=(canvas.width-w)/2;
 let y=(canvas.height-h)/2;

 ctx.globalAlpha=.22;
 ctx.drawImage(photoImage,x,y,w,h);
 ctx.globalAlpha=1;

 /* white overlay */

 ctx.fillStyle="rgba(255,255,255,.60)";
 ctx.fillRect(0,0,2400,1800);
}

function wrap(text,x,y,max,size,line,font,color,pos){

 ctx.font=size+"px "+font;
 ctx.fillStyle=color;

 if(pos==="left"){
  ctx.textAlign="left";
  x=x-max/2;
 }

 else if(pos==="right"){
  ctx.textAlign="right";
  x=x+max/2;
 }

 else{
  ctx.textAlign="center";
 }

 let words=text.split(/\s+/);
 let row="";
 let rows=[];

 words.forEach(word=>{

  let test=row?row+" "+word:word;

  if(ctx.measureText(test).width>max && row){
   rows.push(row);
   row=word;
  }else{
   row=test;
  }

 });

 if(row)rows.push(row);

 rows.forEach((r,i)=>{
  ctx.fillText(r,x,y+i*line);
 });

 return rows.length;
}

function generate(){

 let d=current();

 ctx.clearRect(0,0,2400,1800);

 ctx.fillStyle="#f8f3e7";
 ctx.fillRect(0,0,2400,1800);

 drawPhoto();

 /* BORDER */

 ctx.strokeStyle="#b28a35";
 ctx.lineWidth=12;
 ctx.strokeRect(70,70,2260,1660);

 /* TITLE */

 ctx.textAlign="center";
 ctx.fillStyle="#9b7627";
 ctx.font="bold 55px Arial";
 ctx.fillText("365 DAYS WITH GOD'S WORD",1200,160);

 /* DAY */

 ctx.fillStyle="#172033";
 ctx.font="bold 75px Arial";

 ctx.fillText(
  "DAY "+(d.day||String(index+1).padStart(3,"0")),
  1200,270
 );

 /* DATE */

 ctx.fillStyle="#666";
 ctx.font="38px Arial";
 ctx.fillText(d.date||"",1200,330);

 ctx.fillStyle="#b28a35";
 ctx.fillRect(450,370,1500,6);

 /* ENGLISH */

 ctx.fillStyle="#9b7627";
 ctx.font="bold 34px Arial";
 ctx.textAlign="center";
 ctx.fillText("ENGLISH",1200,445);

 let englishRows=wrap(
  "“"+(d.english||"")+"”",
  1200,560,1800,75,100,
  d.englishFont,d.englishColor,d.englishPos
 );

 if(d.reference){

  ctx.fillStyle="#9b7627";
  ctx.font="bold 34px Arial";
  ctx.textAlign="center";

  ctx.fillText(
   "— "+d.reference,
   1200,
   560+englishRows*100+20
  );
 }

 /* TAMIL */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.textAlign="center";
 ctx.fillText("தமிழ்",1200,900);

 wrap(
  "“"+(d.tamil||"")+"”",
  1200,970,1800,45,65,
  d.tamilFont,d.tamilColor,d.tamilPos
 );

 /* SINHALA */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.textAlign="center";
 ctx.fillText("සිංහල",1200,1270);

 wrap(
  "“"+(d.sinhala||"")+"”",
  1200,1340,1800,45,65,
  d.sinhalaFont,d.sinhalaColor,d.sinhalaPos
 );

 /* FOOTER */

 ctx.fillStyle="#9b7627";
 ctx.font="italic 30px Arial";
 ctx.textAlign="center";

 ctx.fillText(
  "Walk with God • Grow in His Word",
  1200,1640
 );

 document.getElementById("status").textContent=
  "Day "+(index+1)+(days.length?" of "+days.length:"");
}

/* SAVE */

function save(){

 generate();

 let link=document.createElement("a");

 link.download=
  "Bible-Calendar-Day-"+
  String(index+1).padStart(3,"0")+
  ".png";

 link.href=canvas.toDataURL("image/png");

 link.click();
}

/* NEXT */

function next(){

 if(days.length){

  days[index]=current();

  if(index<days.length-1){
   index++;
   load(days[index]);
  }

 }else{

  days.push(current());
  index=days.length-1;
  generate();

 }
}

/* PREVIOUS */

function prev(){

 if(index>0){

  days[index]=current();

  index--;
  load(days[index]);

 }
}

generate();

</script></body>
</html>
