<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible Desk Calendar</title><style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033
}
.app{max-width:1000px;margin:auto}
h2{text-align:center}
.controls{
 background:#fff;
 padding:18px;
 border-radius:15px;
 margin-bottom:20px
}
input,textarea,button{
 width:100%;
 padding:12px;
 margin:6px 0;
 border:1px solid #ccc;
 border-radius:8px;
 font-family:Arial
}
textarea{
 height:85px;
 resize:vertical
}
button{
 background:#172033;
 color:#fff;
 border:0;
 cursor:pointer;
 font-weight:bold
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.nav{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}
canvas{
 width:100%;
 display:block;
 background:#fff;
 border-radius:5px
}
#status{
 text-align:center;
 margin:10px;
 font-weight:bold
}
label{
 display:block;
 margin-top:8px;
 font-weight:bold
}
</style></head><body><div class="app"><h2>365 Days Bible Desk Calendar</h2><div class="controls"><div class="row"><div>
<label>Day</label>
<input id="day" placeholder="1">
</div><div>
<label>Date</label>
<input id="date" placeholder="January 1, 2027">
</div></div><label>Upload Your Photo</label>
<input type="file" id="photo" accept="image/*">

<label>English Bible Verse</label>

<textarea id="english"
placeholder="Enter English Bible verse"></textarea><label>Tamil Bible Verse</label>

<textarea id="tamil"
placeholder="தமிழ் வேதாகம வசனத்தை உள்ளிடவும்"></textarea><label>Sinhala Bible Verse</label>

<textarea id="sinhala"
placeholder="සිංහල බයිබල් පදය ඇතුළත් කරන්න"></textarea><label>Bible Reference</label>
<input id="reference" placeholder="Psalm 23:1">

<div class="nav">
<button onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
</div><button onclick="generate()">Generate</button>
<button onclick="save()">Save PNG</button>

<div id="status">Enter your Bible verse</div></div><canvas id="canvas" width="3600" height="2700"></canvas>

</div><script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let days=[];
let index=0;
let photoImage=null;

/* GET DATA */

function current(){

 return{
  day:day.value,
  date:date.value,
  english:english.value,
  tamil:tamil.value,
  sinhala:sinhala.value,
  reference:reference.value
 };

}

/* LOAD DAY */

function load(d){

 day.value=d.day||"";
 date.value=d.date||"";
 english.value=d.english||"";
 tamil.value=d.tamil||"";
 sinhala.value=d.sinhala||"";
 reference.value=d.reference||"";

 generate();

}

/* PHOTO */

document.getElementById("photo").addEventListener("change",function(){

 const file=this.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(e){

  photoImage=new Image();

  photoImage.onload=function(){
   generate();
  };

  photoImage.src=e.target.result;

 };

 reader.readAsDataURL(file);

});

/* DRAW PHOTO */

function drawPhoto(){

 if(!photoImage)return;

 const scale=Math.max(
  canvas.width/photoImage.width,
  canvas.height/photoImage.height
 );

 const w=photoImage.width*scale;
 const h=photoImage.height*scale;

 const x=(canvas.width-w)/2;
 const y=(canvas.height-h)/2;

 ctx.globalAlpha=.18;

 ctx.drawImage(
  photoImage,
  x,y,w,h
 );

 ctx.globalAlpha=1;

 /* LIGHT OVERLAY */

 ctx.fillStyle="rgba(255,255,255,.72)";
 ctx.fillRect(0,0,3600,2700);

}

/* TEXT WRAP */

function wrap(text,x,y,max,size,line,font,color){

 ctx.font=size+"px "+font;
 ctx.fillStyle=color;
 ctx.textAlign="center";

 let words=text.split(/\s+/);
 let row="";
 let rows=[];

 words.forEach(word=>{

  let test=row?row+" "+word:word;

  if(ctx.measureText(test).width>max && row){

   rows.push(row);
   row=word;

  }else{

   row=test;

  }

 });

 if(row)rows.push(row);

 rows.forEach((r,i)=>{

  ctx.fillText(
   r,
   x,
   y+i*line
  );

 });

 return rows.length;

}

/* GENERATE */

function generate(){

 const d=current();

 /* BACKGROUND */

 ctx.clearRect(0,0,3600,2700);

 ctx.fillStyle="#F8F3E7";
 ctx.fillRect(0,0,3600,2700);

 drawPhoto();

 /* OUTER BORDER */

 ctx.strokeStyle="#B28A35";
 ctx.lineWidth=14;

 ctx.strokeRect(
  100,100,
  3400,2500
 );

 /* INNER BORDER */

 ctx.strokeStyle="rgba(178,138,53,.35)";
 ctx.lineWidth=4;

 ctx.strokeRect(
  130,130,
  3340,2440
 );

 /* HEADER */

 ctx.textAlign="center";

 ctx.fillStyle="#9B7627";
 ctx.font="bold 70px Georgia";

 ctx.fillText(
  "365 DAYS WITH GOD'S WORD",
  1800,270
 );

 /* DAY */

 ctx.fillStyle="#172033";
 ctx.font="bold 100px Georgia";

 ctx.fillText(
  "DAY "+(d.day||String(index+1).padStart(3,"0")),
  1800,450
 );

 /* DATE */

 ctx.fillStyle="#666666";
 ctx.font="42px Arial";

 ctx.fillText(
  d.date||"",
  1800,520
 );

 /* GOLD LINE */

 ctx.fillStyle="#B28A35";

 ctx.fillRect(
  650,590,
  2300,8
 );

 /* ENGLISH TITLE */

 ctx.fillStyle="#9B7627";
 ctx.font="bold 38px Arial";

 ctx.fillText(
  "ENGLISH",
  1800,700
 );

 /* ENGLISH VERSE */

 let englishRows=wrap(
  "“"+(d.english||"")+"”",
  1800,
  850,
  2800,
  92,
  125,
  "Georgia",
  "#172033"
 );

 /* REFERENCE */

 if(d.reference){

  ctx.fillStyle="#B28A35";
  ctx.font="bold 38px Georgia";

  ctx.fillText(
   "— "+d.reference,
   1800,
   850+englishRows*125+35
  );

 }

 /* TAMIL */

 let tamilY=
  Math.max(
   1250,
   850+englishRows*125+160
  );

 ctx.fillStyle="#7A5A20";
 ctx.font="bold 38px 'Noto Sans Tamil',Arial";

 ctx.fillText(
  "தமிழ்",
  1800,
  tamilY
 );

 wrap(
  "“"+(d.tamil||"")+"”",
  1800,
  tamilY+95,
  2800,
  58,
  82,
  "'Noto Sans Tamil',Arial",
  "#4A3925"
 );

 /* SINHALA */

 let sinhalaY=
  Math.max(
   1810,
   tamilY+360
  );

 ctx.fillStyle="#7A5A20";
 ctx.font="bold 38px 'Noto Sans Sinhala',Arial";

 ctx.fillText(
  "සිංහල",
  1800,
  sinhalaY
 );

 wrap(
  "“"+(d.sinhala||"")+"”",
  1800,
  sinhalaY+95,
  2800,
  58,
  82,
  "'Noto Sans Sinhala',Arial",
  "#3F3F3F"
 );

 /* FOOTER */

 ctx.fillStyle="#9B7627";
 ctx.font="italic 36px Georgia";

 ctx.fillText(
  "Walk with God • Grow in His Word",
  1800,2470
 );

 /* STATUS */

 document.getElementById("status").textContent=
  "Day "+(index+1)+(days.length?" of "+days.length:"");

}

/* SAVE */

function save(){

 generate();

 const link=document.createElement("a");

 link.download=
  "Bible-Desk-Calendar-Day-"+
  String(index+1).padStart(3,"0")+
  ".png";

 link.href=
  canvas.toDataURL("image/png");

 link.click();

}

/* NEXT */

function next(){

 if(days.length){

  days[index]=current();

  if(index<days.length-1){

   index++;
   load(days[index]);

  }

 }else{

  days.push(current());
  index=0;
  generate();

 }

}

/* PREVIOUS */

function prev(){

 if(index>0){

  days[index]=current();

  index--;
  load(days[index]);

 }

}

generate();

</script></body>
</html>
