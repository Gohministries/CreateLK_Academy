<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#eef1f4;font-family:Arial;color:#172033}
.app{max-width:1200px;margin:auto}

.calendar{
 position:relative;width:100%;aspect-ratio:16/10;background:#FAF8F2;
 border:1px solid #C8B98A;outline:5px solid #F1ECE0;
 overflow:hidden;margin:0 auto 18px
}

.photo{position:absolute;left:4.5%;top:8%;bottom:8%;width:29%;overflow:hidden;border-radius:8px;background:#ddd}
.photo img,.fullPhoto{width:100%;height:100%;object-fit:cover;display:block}
.fullPhoto{position:absolute;inset:0;display:none;z-index:10}
.full-view .fullPhoto{display:block}
.full-view .photo,.full-view .content{display:none}

.coverVerses{
 position:absolute;left:7%;right:7%;top:7%;bottom:7%;z-index:20;
 display:none;grid-template-rows:repeat(3,minmax(0,1fr));
 color:white;text-align:center;text-shadow:0 2px 4px #000,0 4px 12px #0009
}
.full-view .coverVerses{display:grid}
.coverVerse{
 min-height:0;overflow:hidden;padding:5px 10px;
 display:flex;align-items:center;justify-content:center
}
.coverVerse+.coverVerse{border-top:1px solid #ffffff55}
.coverText{width:100%;overflow:hidden;overflow-wrap:anywhere;white-space:normal}
#coverEnglish{font:600 34px/1.12 "Playfair Display",Georgia,serif}
#coverTamil{font:500 24px/1.1 "Noto Sans Tamil",sans-serif}
#coverSinhala{font:500 24px/1.1 "Noto Sans Sinhala",sans-serif}

.content{position:absolute;left:37%;right:5%;top:4%;bottom:4%;display:flex;flex-direction:column;min-width:0;min-height:0}
.dateRow{height:9%;min-height:30px;display:flex;align-items:center;border-bottom:2px solid #C49A45;position:relative;color:#17365D}
.dateGroup{display:flex;align-items:center;gap:8px}
.month{font-size:clamp(16px,2.3vw,28px);font-weight:bold}
.day{font-size:clamp(15px,2vw,24px);font-weight:bold}
.cross{position:absolute;right:2px;top:1px;color:#C49A45;font:15px Georgia}

.verses{flex:1;min-height:0;padding-top:5px;overflow:hidden}
#verseBox{height:100%;display:grid;grid-template-rows:repeat(3,minmax(0,1fr))}
.section{min-height:0;overflow:hidden;padding:4px 8px;display:flex;flex-direction:column;justify-content:center}
.section+.section{border-top:1px solid #E5DFD2}
.text{width:100%;overflow:hidden;overflow-wrap:anywhere}
#english{font:600 25px/1.12 Georgia;color:#172033}
#tamil{font:500 18px/1.1 "Noto Sans Tamil",sans-serif;color:#7A4E2D}
#sinhala{font:500 18px/1.12 "Noto Sans Sinhala",sans-serif;color:#35634A}

.controls,.adjustment{background:#fff;padding:14px;border-radius:10px;box-shadow:0 3px 15px #0001;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.full{grid-column:1/-1}
label{font-size:13px;font-weight:bold;color:#38455a}
input,textarea,select{width:100%;border:1px solid #ccd2da;border-radius:7px;padding:9px 10px;font:14px Arial}
textarea{resize:vertical;min-height:65px}
.photoInput{padding:7px}
.adjustmentTitle{font-size:14px;font-weight:bold;color:#17365D;margin-bottom:10px}
.adjustGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rangeBox{display:flex;flex-direction:column;gap:5px}
.rangeTop{display:flex;justify-content:space-between;font-size:12px;font-weight:bold}
.rangeTop span{color:#17365D}
input[type=range]{padding:0;accent-color:#17365D}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:7px;padding:10px 15px;font-weight:bold;cursor:pointer;background:#17365D;color:white}
button.secondary{background:#6d7480}
button.gold{background:#C49A45}
button:disabled{opacity:.5}
.generated{margin-top:12px;padding:10px;background:#f7f8fa;border:1px solid #e0e3e8;border-radius:8px}
.generatedTitle{font-size:13px;font-weight:bold;color:#17365D}
#generatedList{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.item{padding:5px 8px;border-radius:5px;background:#e9edf2;font-size:12px;font-weight:bold}
.status{margin-top:7px;font-size:12px;color:#566174}

@media(max-width:700px){
 body{padding:8px}
 .grid,.adjustGrid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .photo{left:3.5%;width:30%}
 .content{left:36%;right:4%}
 #english{font-size:19px}
 #tamil,#sinhala{font-size:15px}
 #coverEnglish{font-size:20px}
 #coverTamil,#coverSinhala{font-size:15px}
 .buttons button{flex:1}
}

@media print{
 @page{size:9in 5.625in landscape;margin:0}
 body{padding:0;background:white}
 .controls,.adjustment{display:none}
 .calendar{width:9in;height:5.625in;margin:0;outline:none;box-shadow:none}
}
</style>
</head>

<body>
<div class="app">

<div class="calendar" id="calendar">
<img id="fullPhoto" class="fullPhoto">

<div class="coverVerses">
 <div class="coverVerse"><div class="coverText" id="coverEnglish"></div></div>
 <div class="coverVerse"><div class="coverText" id="coverTamil"></div></div>
 <div class="coverVerse"><div class="coverText" id="coverSinhala"></div></div>
</div>

<div class="photo"><img id="photoPreview"></div>

<div class="content">
 <div class="dateRow">
  <div class="dateGroup">
   <div class="month" id="monthText">JANUARY</div>
   <div class="day" id="dayText">1</div>
  </div>
  <div class="cross">✝</div>
 </div>

 <div class="verses">
  <div id="verseBox">
   <section class="section"><div class="text" id="english"></div></section>
   <section class="section"><div class="text" id="tamil"></div></section>
   <section class="section"><div class="text" id="sinhala"></div></section>
  </div>
 </div>
</div>
</div>

<div class="adjustment">
<div class="adjustmentTitle">Calendar Bible Text Font Size</div>
<div class="adjustGrid">
 <div class="rangeBox"><div class="rangeTop"><span>English</span><span id="englishSizeValue">25px</span></div><input type="range" id="englishSize" min=".5" max="30" step=".5" value="25"></div>
 <div class="rangeBox"><div class="rangeTop"><span>Tamil</span><span id="tamilSizeValue">18px</span></div><input type="range" id="tamilSize" min=".5" max="24" step=".5" value="18"></div>
 <div class="rangeBox"><div class="rangeTop"><span>Sinhala</span><span id="sinhalaSizeValue">18px</span></div><input type="range" id="sinhalaSize" min=".5" max="24" step=".5" value="18"></div>
</div>
</div>

<div class="controls">
<div class="grid">

<div class="field">
<label>Photo View</label>
<select id="photoView">
<option value="calendar">Calendar View — Photo + Bible Text</option>
<option value="full">Full Photo — 3 Bible Verses</option>
</select>
</div>

<div class="field">
<label>Upload Photo</label>
<input class="photoInput" type="file" id="photo" accept="image/*">
</div>

<div class="field full">
<label>Cover Verse Font Sizes</label>
<div class="adjustGrid">
 <div class="rangeBox"><div class="rangeTop"><span>English</span><span id="coverEnglishSizeValue">34px</span></div><input type="range" id="coverEnglishSize" min="8" max="70" step=".5" value="34"></div>
 <div class="rangeBox"><div class="rangeTop"><span>Tamil</span><span id="coverTamilSizeValue">24px</span></div><input type="range" id="coverTamilSize" min="8" max="55" step=".5" value="24"></div>
 <div class="rangeBox"><div class="rangeTop"><span>Sinhala</span><span id="coverSinhalaSizeValue">24px</span></div><input type="range" id="coverSinhalaSize" min="8" max="55" step=".5" value="24"></div>
</div>
</div>

<div class="field">
<label>Cover English Font</label>
<select id="coverFont">
<option>Playfair Display</option>
<option>Cinzel</option>
<option>Montserrat</option>
<option>Georgia</option>
<option>Arial</option>
</select>
</div>

<div class="field" id="dateField">
<label>Calendar Date</label>
<input type="date" id="date" min="2027-01-01" max="2027-12-31" value="2027-01-01">
</div>

<div class="field full">
<label>English Bible Verse — First / Main</label>
<textarea id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>
</div>

<div class="field full">
<label>Tamil Bible Verse — Second</label>
<textarea id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>
</div>

<div class="field full">
<label>Sinhala Bible Verse — Third</label>
<textarea id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>
</div>

</div>

<div class="buttons">
<button class="secondary" onclick="move(-1)">← Previous</button>
<button class="secondary" onclick="move(1)">Next →</button>
<button class="gold" onclick="generate()">Generate</button>
<button id="downloadBtn" onclick="downloadGenerated()">Download Generated</button>
</div>

<div class="generated">
<div class="generatedTitle">Generated Pages</div>
<div id="generatedList"></div>
<div class="status" id="status">Generated: 0/10</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id),KEY="BibleCalendar2027";
let selected=[],photoData="",busy=false;

function dateInfo(v){
 let d=new Date(v+"T00:00:00"),m=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
 return[m[d.getMonth()],d.getDate()]
}

function save(){
 localStorage.setItem(KEY,JSON.stringify({
  selected,photoData,date:$("date").value,photoView:$("photoView").value,
  coverFont:$("coverFont").value,
  english:$("englishInput").value,tamil:$("tamilInput").value,sinhala:$("sinhalaInput").value,
  englishSize:$("englishSize").value,tamilSize:$("tamilSize").value,sinhalaSize:$("sinhalaSize").value,
  coverEnglishSize:$("coverEnglishSize").value,coverTamilSize:$("coverTamilSize").value,coverSinhalaSize:$("coverSinhalaSize").value
 }))
}

function load(){
 try{
  let x=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!x)return;
  selected=x.selected||[];
  photoData=x.photoData||"";
  ["date","photoView","coverFont","english","tamil","sinhala","englishSize","tamilSize","sinhalaSize","coverEnglishSize","coverTamilSize","coverSinhalaSize"].forEach(k=>{
   if(x[k]!=null)$(k).value=x[k]
  });
  if(photoData){
   $("photoPreview").src=photoData;
   $("fullPhoto").src=photoData
  }
 }catch(e){}
}

function render(){
 $("generatedList").innerHTML=selected.map((x,i)=>{
  let d=new Date(x+"T00:00:00");
  return`<div class="item">${i+1}/10 ${d.toLocaleDateString("en-GB")}</div>`
 }).join("");
 $("status").textContent=`Generated: ${selected.length}/10`
}

function update(){
 let v=$("date").value;
 if(v){
  let x=dateInfo(v);
  $("monthText").textContent=x[0];
  $("dayText").textContent=x[1]
 }

 $("english").textContent=$("englishInput").value.trim();
 $("tamil").textContent=$("tamilInput").value.trim();
 $("sinhala").textContent=$("sinhalaInput").value.trim();

 $("coverEnglish").textContent=$("englishInput").value.trim();
 $("coverTamil").textContent=$("tamilInput").value.trim();
 $("coverSinhala").textContent=$("sinhalaInput").value.trim();

 $("coverEnglish").style.fontFamily=`"${$("coverFont").value}",Georgia,serif`;
 $("coverEnglish").style.fontSize=$("coverEnglishSize").value+"px";
 $("coverTamil").style.fontSize=$("coverTamilSize").value+"px";
 $("coverSinhala").style.fontSize=$("coverSinhalaSize").value+"px";

 ["english","tamil","sinhala"].forEach(x=>{
  $(x).style.fontSize=$(`${x}Size`).value+"px"
 });

 ["english","tamil","sinhala"].forEach(x=>{
  $(`${x}SizeValue`).textContent=$(`${x}Size`).value+"px"
 });

 ["coverEnglish","coverTamil","coverSinhala"].forEach(x=>{
  $(`${x}SizeValue`).textContent=$(`${x}Size`).value+"px"
 });

 let full=$("photoView").value==="full";
 $("calendar").classList.toggle("full-view",full);
 $("dateField").style.display=full?"none":"";

 save()
}

async function fit(id,range){
 let el=$(id),box=el.closest(id.startsWith("cover")?".coverVerse":".section");
 if(!el||!box)return;

 let size=parseFloat($(range).value),min=id.startsWith("cover")?8:.5;
 await document.fonts.ready;

 const good=n=>{
  el.style.fontSize=n+"px";
  void el.offsetHeight;
  return el.scrollHeight<=box.clientHeight-10
 };

 if(!good(size)){
  let lo=min,hi=size,best=min;
  for(let i=0;i<50;i++){
   let mid=(lo+hi)/2;
   if(good(mid)){best=mid;lo=mid}else hi=mid
  }
  size=best
 }

 while(size>min&&!good(size))size=Math.max(min,size-.1);
 $(range).value=size.toFixed(1);
 $(range+"Value").textContent=size.toFixed(1)+"px";
 el.style.fontSize=size+"px"
}

async function updateFit(){
 update();

 if($("photoView").value==="full"){
  await fit("coverEnglish","coverEnglishSize");
  await fit("coverTamil","coverTamilSize");
  await fit("coverSinhala","coverSinhalaSize");
 }else{
  await fit("english","englishSize");
  await fit("tamil","tamilSize");
  await fit("sinhala","sinhalaSize");
 }
}

function addDate(v){
 if(selected.includes(v))return;
 if(selected.length>=10)return alert("Maximum 10 generated pages.");
 selected.push(v);render();save()
}

async function generate(){
 if($("photoView").value==="full"){
  if(!photoData)return alert("Please upload a photo first.");
  await updateFit();
  $("status").textContent="Cover ready to download.";
  return
 }
 let v=$("date").value;
 if(!v)return;
 await updateFit();
 addDate(v)
}

async function move(n){
 if($("photoView").value==="full")return;

 let d=new Date($("date").value+"T00:00:00");
 d.setDate(d.getDate()+n);

 if(d.getFullYear()!=2027)return;

 $("date").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 await updateFit()
}

$("photo").onchange=e=>{
 let f=e.target.files[0];
 if(!f)return;
 let r=new FileReader();
 r.onload=()=>{
  photoData=r.result;
  $("photoPreview").src=photoData;
  $("fullPhoto").src=photoData;
  save()
 };
 r.readAsDataURL(f)
};

$("photoView").onchange=updateFit;
$("coverFont").onchange=updateFit;
$("date").onchange=updateFit;

["englishInput","tamilInput","sinhalaInput"].forEach(id=>{
 $(id).oninput=updateFit
});

["englishSize","tamilSize","sinhalaSize","coverEnglishSize","coverTamilSize","coverSinhalaSize"].forEach(id=>{
 $(id).oninput=updateFit
});

async function capture(date){
 if(date)$("date").value=date;
 await updateFit();
 await new Promise(r=>setTimeout(r,250));

 let canvas=await html2canvas($("calendar"),{
  scale:3,useCORS:true,backgroundColor:"#FAF8F2",logging:false
 });

 return canvas.toDataURL("image/png",1)
}

async function downloadGenerated(){
 if(!photoData)return alert("Please upload a photo first.");

 let full=$("photoView").value==="full";

 if(!full&&!selected.length)
  return alert("Please generate at least one calendar page first.");

 let btn=$("downloadBtn");
 btn.disabled=true;
 btn.textContent="Creating PDF...";

 try{
  const {jsPDF}=window.jspdf;
  let pdf=new jsPDF({
   orientation:"landscape",
   unit:"in",
   format:[9,5.625],
   compress:true
  });

  if(full){
   let img=await capture("");
   pdf.addImage(img,"PNG",0,0,9,5.625,undefined,"FAST");
   pdf.save("365-Bible-Calendar-Cover.pdf");
  }else{
   let old=$("date").value;

   for(let i=0;i<selected.length;i++){
    let img=await capture(selected[i]);
    if(i)pdf.addPage([9,5.625],"landscape");
    pdf.addImage(img,"PNG",0,0,9,5.625,undefined,"FAST");
    $("status").textContent=`Creating PDF: ${i+1}/${selected.length}`
   }

   pdf.save("365-Bible-Calendar-2027.pdf");
   $("date").value=old;
   await updateFit()
  }
 }catch(e){
  console.error(e);
  alert("PDF creation failed.")
 }finally{
  btn.disabled=false;
  btn.textContent="Download Generated";
  render()
 }
}

window.onload=async()=>{
 load();
 render();
 await updateFit()
};

if(document.fonts)document.fonts.ready.then(updateFit);
</script>

</body>
</html>
