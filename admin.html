<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin | CreateLK Academy</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:1000px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
}

.logout{
border:0;
background:#fee2e2;
color:#b91c1c;
padding:9px 14px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 15px 50px;
}

h1{
font-size:28px;
margin-bottom:8px;
}

.subtitle{
color:#667085;
font-size:14px;
margin-bottom:25px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.card h2{
font-size:18px;
margin-bottom:15px;
}

input{
width:100%;
height:46px;
padding:0 12px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:14px;
margin-bottom:12px;
}

button{
border:0;
border-radius:8px;
padding:11px 16px;
font-weight:800;
cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.approve{
background:#16a34a;
color:#fff;
}

.reject{
background:#dc2626;
color:#fff;
}

.refresh{
background:#eef2f7;
color:#344054;
}

.payment{
border:1px solid #e5e7eb;
border-radius:12px;
padding:17px;
margin-bottom:12px;
}

.payment p{
font-size:13px;
line-height:1.7;
}

.status{
display:inline-block;
padding:4px 9px;
border-radius:20px;
font-size:11px;
font-weight:bold;
margin:7px 0;
background:#fff7ed;
color:#c2410c;
}

.actions{
display:flex;
gap:8px;
margin-top:12px;
}

.message{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:18px;
font-size:13px;
text-align:center;
}

.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.empty{
text-align:center;
padding:30px;
color:#667085;
font-size:14px;
}

@media(max-width:600px){

.actions{
flex-direction:column;
}

.actions button{
width:100%;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</header>


<main class="container">

<h1>
🛠️ Admin Dashboard
</h1>

<p class="subtitle">
Manage student premium payment requests.
</p>


<div id="message" class="message"></div>


<div class="card">

<h2>
🔐 Admin Login
</h2>

<input
id="adminKey"
type="password"
placeholder="Enter Admin Key"
autocomplete="off">

<button
class="primary"
onclick="saveAdminKey()">

Continue

</button>

</div>


<div class="card">

<h2>
💳 Pending Payments
</h2>

<button
class="refresh"
onclick="loadPayments()">

🔄 Refresh Payments

</button>

<div
id="payments"
style="margin-top:18px;">

<div class="empty">
Enter your Admin Key first.
</div>

</div>

</div>

</main>


<script>

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";

const ADMIN_KEY_STORAGE =
"createlk_admin_key";


function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


function saveAdminKey(){

const key =
document.getElementById(
"adminKey"
).value.trim();

if(!key){

showMessage(
"Please enter the Admin Key.",
"error"
);

return;

}

sessionStorage.setItem(
ADMIN_KEY_STORAGE,
key
);

showMessage(
"Admin Key saved.",
"success"
);

loadPayments();

}


async function loadPayments(){

const key =
sessionStorage.getItem(
ADMIN_KEY_STORAGE
);

if(!key){

showMessage(
"Please enter the Admin Key first.",
"error"
);

return;

}


const container =
document.getElementById(
"payments"
);

container.innerHTML =
'<div class="empty">⏳ Loading payments...</div>';


try{

const response =
await fetch(
API_URL +
"/api/admin/payments",
{
headers:{
"Accept":"application/json",
"X-Admin-Key":key
}
}
);


const data =
await response.json();


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to load payments."
);

}


const payments =
data.payments || [];


if(!payments.length){

container.innerHTML =
'<div class="empty">✅ No pending payments.</div>';

return;

}


container.innerHTML = "";


payments.forEach(
function(payment){

const div =
document.createElement("div");

div.className =
"payment";


div.innerHTML =

"<p><strong>Payment ID:</strong> " +
escapeHtml(payment.id) +
"</p>" +

"<p><strong>Student:</strong> " +
escapeHtml(
payment.first_name +
" " +
payment.last_name
) +
"</p>" +

"<p><strong>Email:</strong> " +
escapeHtml(payment.email) +
"</p>" +

"<p><strong>Amount:</strong> LKR " +
escapeHtml(payment.amount) +
"</p>" +

"<p><strong>Reference:</strong> " +
escapeHtml(
payment.transaction_reference
) +
"</p>" +

"<p><strong>Submitted:</strong> " +
escapeHtml(
payment.created_at
) +
"</p>" +

'<span class="status">' +
escapeHtml(payment.status) +
"</span>" +

'<div class="actions">' +

'<button class="approve" onclick="approvePayment(' +
Number(payment.id) +
')">' +

"✅ Approve" +

"</button>" +

'<button class="reject" onclick="rejectPayment(' +
Number(payment.id) +
')">' +

"❌ Reject" +

"</button>" +

"</div>";


container.appendChild(div);

});


}catch(error){

console.error(error);

container.innerHTML =
'<div class="empty">❌ ' +
escapeHtml(error.message) +
"</div>";

}

}


async function approvePayment(
paymentId
){

if(
!confirm(
"Approve this payment and activate 30-day Premium?"
)
){

return;

}

await updatePayment(
paymentId,
"APPROVED"
);

}


async function rejectPayment(
paymentId
){

if(
!confirm(
"Reject this payment?"
)
){

return;

}

await updatePayment(
paymentId,
"REJECTED"
);

}


async function updatePayment(
paymentId,
status
){

const key =
sessionStorage.getItem(
ADMIN_KEY_STORAGE
);

try{

const response =
await fetch(
API_URL +
"/api/admin/payment",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
key
},

body:JSON.stringify({

payment_id:
paymentId,

status:
status

})
}
);


const data =
await response.json();


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to update payment."
);

}


showMessage(
status === "APPROVED"
?
"✅ Payment approved and membership activated."
:
"❌ Payment rejected.",
"success"
);


loadPayments();


}catch(error){

showMessage(
error.message ||
"Unable to update payment.",
"error"
);

}

}


function logout(){

sessionStorage.removeItem(
ADMIN_KEY_STORAGE
);

location.reload();

}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
