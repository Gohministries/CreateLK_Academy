<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033;
}

.app{
 max-width:1100px;
 margin:auto;
}

h2{
 text-align:center;
 margin:0 0 18px;
}

.controls{
 background:#fff;
 padding:18px;
 border-radius:12px;
 box-shadow:0 4px 18px #0001;
 margin-bottom:20px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px;
}

input,
textarea,
select{
 width:100%;
 padding:10px;
 border:1px solid #ccd2dc;
 border-radius:7px;
 font-family:inherit;
}

textarea{
 min-height:90px;
 resize:vertical;
}

.full{
 grid-column:1/-1;
}

button{
 border:0;
 border-radius:7px;
 padding:11px 16px;
 cursor:pointer;
 font-weight:bold;
 background:#172033;
 color:#fff;
 margin:5px 4px 0 0;
}

button:hover{
 opacity:.9;
}


/* =========================
   12 × 9 CALENDAR
   ========================= */

#calendar{
 width:1200px;
 height:900px;

 margin:25px auto;

 position:relative;
 overflow:hidden;

 background:#ddd;

 box-shadow:0 8px 30px #0002;
}


/* =========================
   FULL PHOTO
   ========================= */

#outPhoto{
 position:absolute;

 inset:0;

 width:100%;
 height:100%;

 object-fit:cover;
 object-position:center center;

 display:none;
}


/* =========================
   RIGHT TEXT PANEL
   ========================= */

.text{
 position:absolute;

 top:45px;
 right:45px;
 bottom:45px;

 width:43%;

 padding:32px 30px;

 background:rgba(248,245,237,.94);

 border:1px solid #b89445;

 border-radius:8px;

 overflow:hidden;

 display:flex;
 flex-direction:column;

 box-shadow:0 8px 25px #0003;
}


/* DAY + DATE */

.dayrow{
 display:flex;

 align-items:flex-end;
 justify-content:space-between;

 border-bottom:2px solid #b89445;

 padding-bottom:14px;

 margin-bottom:22px;
}

.day{
 font-family:Montserrat,sans-serif;

 font-size:32px;

 font-weight:700;

 color:#172033;
}

.date{
 font-family:Montserrat,sans-serif;

 font-size:17px;

 font-weight:600;

 color:#6d624f;
}


/* ENGLISH */

.lang{
 font-family:Montserrat,sans-serif;

 font-size:12px;

 font-weight:700;

 letter-spacing:2px;

 color:#9b7831;

 margin-bottom:9px;
}

.english{
 font-family:"Playfair Display",serif;

 font-size:25px;

 line-height:1.42;

 font-weight:600;

 color:#172033;
}


/* REFERENCE */

.reference{
 margin-top:13px;

 font-family:Montserrat,sans-serif;

 font-size:14px;

 font-weight:700;

 color:#9b7831;
}


/* TRANSLATIONS */

.translation{
 margin-top:20px;

 padding-top:15px;

 border-top:1px solid #d5c9ad;
}

.translation b{
 display:block;

 font-family:Montserrat,sans-serif;

 font-size:11px;

 letter-spacing:1.4px;

 margin-bottom:7px;

 color:#6d624f;
}


/* TAMIL */

.tamil{
 font-family:"Noto Sans Tamil",sans-serif;

 font-size:16px;

 line-height:1.48;

 color:#38332c;
}


/* SINHALA */

.sinhala{
 font-family:"Noto Sans Sinhala",sans-serif;

 font-size:15px;

 line-height:1.52;

 color:#50545b;
}


/* =========================
   RESPONSIVE EDITOR
   ========================= */

@media(max-width:1250px){

 #calendar{
  transform-origin:top left;
  transform:scale(.8);

  margin-bottom:-150px;
 }

}

@media(max-width:700px){

 .grid{
  grid-template-columns:1fr;
 }

 .full{
  grid-column:auto;
 }

 #calendar{
  transform:scale(.45);

  transform-origin:top left;

  margin-left:0;

  margin-bottom:-480px;
 }

}

</style>
</head>


<body>

<div class="app">

<h2>365-Day Bible Calendar</h2>


<!-- =========================
     CONTROLS
     ========================= -->

<div class="controls">

<div class="grid">


<!-- DAY -->

<div>

<label>Day</label>

<input
 id="day"
 type="number"
 min="1"
 max="365"
 value="1"
>

</div>


<!-- DATE -->

<div>

<label>Date</label>

<input
 id="date"
 type="date"
 value="2027-01-01"
>

</div>


<!-- UPLOAD PHOTO -->

<div class="full">

<label>Upload Your Photo</label>

<input
 id="photo"
 type="file"
 accept="image/jpeg,image/png,image/webp"
>

</div>


<!-- ENGLISH -->

<div class="full">

<label>English Bible Verse</label>

<textarea id="english">The LORD will open the heavens, the storehouse of his bounty, to send rain on your land in season and to bless all the work of your hands. You will lend to many nations but will borrow from none.</textarea>

</div>


<!-- TAMIL -->

<div class="full">

<label>Tamil Bible Verse</label>

<textarea id="tamil">ஏற்ற காலத்தில் உன் தேசத்திலே மழை பெய்யவும் நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார்; நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.</textarea>

</div>


<!-- SINHALA -->

<div class="full">

<label>Sinhala Bible Verse</label>

<textarea id="sinhala">ස්වාමීන්වහන්සේ නිසි කාලයට නුඹේ දේශයට වර්ෂාව දෙන්ටද නුඹේ අත්වල සියලු වැඩට ආශීර්වාද කරන්ටද අහස නමැති තමන්ගේ උතුම් ගබඩාව නුඹට විවෘත කරනසේක. නුඹ බොහෝ ජාතීන්ට ණයට දෙන නුමුත් නුඹ ණයට නොගන්නෙහිය.</textarea>

</div>


<!-- REFERENCE -->

<div>

<label>Bible Reference</label>

<input
 id="reference"
 value="Deuteronomy 28:12"
>

</div>


<!-- PHOTO POSITION -->

<div>

<label>Photo Position</label>

<select id="position">

<option value="center center">
Center
</option>

<option value="center top">
Top
</option>

<option value="center bottom">
Bottom
</option>

<option value="left center">
Left
</option>

<option value="right center">
Right
</option>

</select>

</div>

</div>


<button onclick="updatePreview()">
Update Preview
</button>

<button onclick="savePNG()">
Save PNG
</button>

<button onclick="clearPhoto()">
Remove Photo
</button>

</div>



<!-- =========================
     CALENDAR
     ========================= -->

<div id="calendar">


<!-- FULL UPLOADED PHOTO -->

<img
 id="outPhoto"
 alt="Uploaded photo"
>


<!-- RIGHT TEXT -->

<div class="text">


<!-- DAY / DATE -->

<div class="dayrow">

<div id="outDay" class="day">
DAY 1
</div>

<div id="outDate" class="date">
January 1, 2027
</div>

</div>


<!-- ENGLISH -->

<div class="lang">
ENGLISH
</div>

<div id="outEnglish" class="english">
</div>


<!-- REFERENCE -->

<div id="outReference" class="reference">
</div>


<!-- TAMIL -->

<div class="translation">

<b>
தமிழ் • TAMIL
</b>

<div id="outTamil" class="tamil">
</div>

</div>


<!-- SINHALA -->

<div class="translation">

<b>
සිංහල • SINHALA
</b>

<div id="outSinhala" class="sinhala">
</div>

</div>


</div>

</div>

</div>


<script>


/* =========================
   PHOTO
   ========================= */

let photoData = "";


/* =========================
   UPDATE PREVIEW
   ========================= */

function updatePreview(){

 const day =
  document.getElementById("day").value;

 const dateValue =
  document.getElementById("date").value;


 document.getElementById("outDay").textContent =
  "DAY " + day;


 if(dateValue){

  const d =
   new Date(dateValue + "T00:00:00");

  document.getElementById("outDate").textContent =
   d.toLocaleDateString(
    "en-US",
    {
     month:"long",
     day:"numeric",
     year:"numeric"
    }
   );

 }


 document.getElementById("outEnglish").textContent =
  document.getElementById("english").value;


 document.getElementById("outTamil").textContent =
  document.getElementById("tamil").value;


 document.getElementById("outSinhala").textContent =
  document.getElementById("sinhala").value;


 document.getElementById("outReference").textContent =
  "— " +
  document.getElementById("reference").value;


 document.getElementById("outPhoto").style.objectPosition =
  document.getElementById("position").value;


 if(photoData){

  document.getElementById("outPhoto").src =
   photoData;

  document.getElementById("outPhoto").style.display =
   "block";

 }

}


/* =========================
   UPLOAD PHOTO
   ========================= */

document
.getElementById("photo")
.addEventListener(
 "change",
 function(event){

  const file =
   event.target.files[0];

  if(!file){
   return;
  }


  const reader =
   new FileReader();


  reader.onload =
   function(e){

    photoData =
     e.target.result;


    const img =
     document.getElementById("outPhoto");


    img.src =
     photoData;


    img.style.display =
     "block";


    img.style.objectPosition =
     document.getElementById("position").value;

   };


  reader.readAsDataURL(file);

 }
);


/* =========================
   PHOTO POSITION
   ========================= */

document
.getElementById("position")
.addEventListener(
 "change",
 function(){

  document
   .getElementById("outPhoto")
   .style.objectPosition =
    this.value;

 }
);


/* =========================
   REMOVE PHOTO
   ========================= */

function clearPhoto(){

 photoData = "";


 const img =
  document.getElementById("outPhoto");


 img.src = "";

 img.style.display =
  "none";


 document.getElementById("photo").value =
  "";

}


/* =========================
   AUTOMATIC DATE
   ========================= */

document
.getElementById("day")
.addEventListener(
 "input",
 function(){

  const day =
   parseInt(this.value);


  if(
   isNaN(day) ||
   day < 1 ||
   day > 365
  ){

   return;

  }


  const date =
   new Date(2027,0,day);


  const yyyy =
   date.getFullYear();


  const mm =
   String(
    date.getMonth()+1
   ).padStart(2,"0");


  const dd =
   String(
    date.getDate()
   ).padStart(2,"0");


  document.getElementById("date").value =
   yyyy + "-" + mm + "-" + dd;

 }
);


/* =========================
   SAVE 3600 × 2700 PNG
   ========================= */

async function savePNG(){

 updatePreview();


 const calendar =
  document.getElementById("calendar");


 const canvas =
  await html2canvas(
   calendar,
   {
    scale:3,
    useCORS:true,
    backgroundColor:null
   }
  );


 const link =
  document.createElement("a");


 const day =
  document.getElementById("day").value ||
  "1";


 link.download =
  "Bible-Calendar-Day-" +
  day +
  ".png";


 link.href =
  canvas.toDataURL(
   "image/png"
  );


 link.click();

}


/* =========================
   INITIAL
   ========================= */

updatePreview();

</script>

</body>
</html>
