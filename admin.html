<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#eef1f5;
 font-family:Arial,sans-serif;color:#172033
}
.app{max-width:1000px;margin:auto}
h2{text-align:center}
.controls{
 background:#fff;padding:18px;border-radius:15px;
 margin-bottom:20px
}
input,textarea,button{
 width:100%;padding:12px;margin:6px 0;
 border:1px solid #ccc;border-radius:8px;
 font-family:Arial
}
textarea{height:90px;resize:vertical}
button{
 background:#172033;color:#fff;
 border:0;cursor:pointer
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.nav{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px
}
canvas{
 width:100%;display:block;
 background:#fff;border-radius:5px
}
#status{
 text-align:center;
 margin:10px;
 font-weight:bold
}
label{
 display:block;
 margin-top:8px;
 font-weight:bold
}
</style>
</head>

<body>

<div class="app">

<h2>365 Days Bible Calendar</h2>

<div class="controls">

<div class="row">
<div>
<label>Day</label>
<input id="day" placeholder="1">
</div>

<div>
<label>Date</label>
<input id="date" placeholder="January 1, 2027">
</div>
</div>

<label>English Bible Verse</label>
<textarea id="english" placeholder="Enter English Bible verse"></textarea>

<label>Tamil Bible Verse</label>
<textarea id="tamil" placeholder="தமிழ் வேதாகம வசனத்தை உள்ளிடவும்"></textarea>

<label>Sinhala Bible Verse</label>
<textarea id="sinhala" placeholder="සිංහල බයිබල් පදය ඇතුළත් කරන්න"></textarea>

<label>Bible Reference</label>
<input id="reference" placeholder="John 3:16">

<div class="nav">
<button onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
</div>

<button onclick="generate()">Generate</button>
<button onclick="save()">Save PNG</button>

<div id="status">Enter the Bible verses</div>

</div>

<canvas id="canvas" width="2400" height="1800"></canvas>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let days=[];
let index=0;

function current(){
 return {
  day:document.getElementById("day").value,
  date:document.getElementById("date").value,
  english:document.getElementById("english").value,
  tamil:document.getElementById("tamil").value,
  sinhala:document.getElementById("sinhala").value,
  reference:document.getElementById("reference").value
 };
}

function load(d){
 document.getElementById("day").value=d.day||"";
 document.getElementById("date").value=d.date||"";
 document.getElementById("english").value=d.english||"";
 document.getElementById("tamil").value=d.tamil||"";
 document.getElementById("sinhala").value=d.sinhala||"";
 document.getElementById("reference").value=d.reference||"";
 generate();
}

function wrap(text,x,y,max,size,line){

 ctx.font=size+"px Arial";
 ctx.textAlign="center";

 let words=text.split(/\s+/);
 let row="";
 let rows=[];

 words.forEach(word=>{
  let test=row?row+" "+word:word;

  if(ctx.measureText(test).width>max && row){
   rows.push(row);
   row=word;
  }else{
   row=test;
  }
 });

 if(row)rows.push(row);

 rows.forEach((r,i)=>{
  ctx.fillText(r,x,y+i*line);
 });

 return rows.length;
}

function generate(){

 let d=current();

 ctx.fillStyle="#f8f3e7";
 ctx.fillRect(0,0,2400,1800);

 ctx.strokeStyle="#b28a35";
 ctx.lineWidth=12;
 ctx.strokeRect(70,70,2260,1660);

 ctx.textAlign="center";

 /* TITLE */

 ctx.fillStyle="#9b7627";
 ctx.font="bold 55px Arial";
 ctx.fillText("365 DAYS WITH GOD'S WORD",1200,160);

 /* DAY */

 ctx.fillStyle="#172033";
 ctx.font="bold 75px Arial";
 ctx.fillText(
  "DAY "+(d.day||String(index+1).padStart(3,"0")),
  1200,270
 );

 /* DATE */

 ctx.fillStyle="#666";
 ctx.font="38px Arial";
 ctx.fillText(d.date||"",1200,330);

 ctx.fillStyle="#b28a35";
 ctx.fillRect(450,370,1500,6);

 /* ENGLISH */

 ctx.fillStyle="#9b7627";
 ctx.font="bold 34px Arial";
 ctx.fillText("ENGLISH",1200,445);

 ctx.fillStyle="#172033";

 let englishRows=wrap(
  "“"+(d.english||"")+"”",
  1200,560,1800,75,100
 );

 if(d.reference){

  ctx.fillStyle="#9b7627";
  ctx.font="bold 34px Arial";

  ctx.fillText(
   "— "+d.reference,
   1200,
   560+englishRows*100+20
  );
 }

 /* TAMIL */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.fillText("தமிழ்",1200,900);

 ctx.fillStyle="#222";

 wrap(
  "“"+(d.tamil||"")+"”",
  1200,970,1800,45,65
 );

 /* SINHALA */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.fillText("සිංහල",1200,1270);

 ctx.fillStyle="#222";

 wrap(
  "“"+(d.sinhala||"")+"”",
  1200,1340,1800,45,65
 );

 /* FOOTER */

 ctx.fillStyle="#9b7627";
 ctx.font="italic 30px Arial";

 ctx.fillText(
  "Walk with God • Grow in His Word",
  1200,1640
 );

 document.getElementById("status").textContent=
  "Day "+(index+1)+(days.length?" of "+days.length:"");

}

/* SAVE */

function save(){

 generate();

 let link=document.createElement("a");

 link.download=
  "Bible-Calendar-Day-"+
  String(index+1).padStart(3,"0")+
  ".png";

 link.href=canvas.toDataURL("image/png");

 link.click();
}

/* NEXT */

function next(){

 if(days.length){

  if(index<days.length-1){
   index++;
   load(days[index]);
  }

 }else{

  days.push(current());
  index=days.length-1;

  generate();
 }
}

/* PREVIOUS */

function prev(){

 if(index>0){

  days[index]=current();

  index--;

  load(days[index]);
 }
}

generate();

</script>

</body>
</html>
