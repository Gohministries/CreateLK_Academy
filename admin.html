<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 padding:20px;
 background:#e8e8e8;
 font-family:Arial,sans-serif;
 color:#333;
}

.app{
 max-width:1200px;
 margin:auto;
}

h2{
 text-align:center;
 margin:0 0 18px;
 color:#222;
}

.controls{
 background:#fff;
 padding:16px;
 border-radius:12px;
 box-shadow:0 3px 18px #0002;
 margin-bottom:20px;
}

.row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 color:#444;
}

input,
textarea{
 width:100%;
 margin-top:5px;
 padding:9px;
 border:1px solid #ccc;
 border-radius:7px;
 font:inherit;
}

textarea{
 height:80px;
 resize:vertical;
}

.buttons{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}

button{
 border:0;
 padding:10px 16px;
 border-radius:7px;
 background:#333;
 color:white;
 cursor:pointer;
 font-weight:bold;
}

button:hover{
 opacity:.85;
}


/* ==================================================
   CALENDAR PAGE
   REFERENCE STYLE
   ================================================== */

.calendar{
 width:100%;
 aspect-ratio:16/10;
 position:relative;
 overflow:hidden;

 background:#fdfcf9;

 box-shadow:
  0 8px 35px #0002;

 border:1px solid #ddd;
}


/* ==================================================
   LEFT PHOTO
   ================================================== */

.photo{
 position:absolute;

 left:5%;
 top:10%;
 bottom:10%;

 width:27%;

 border-radius:9px;
 overflow:hidden;

 box-shadow:
  0 4px 16px #0003;

 background:#ddd;
}

.photo svg{
 width:100%;
 height:100%;
 display:block;
}


/* ==================================================
   PHOTO TEXT
   ================================================== */

.photoTitle{
 position:absolute;
 left:0;
 right:0;
 bottom:9%;

 text-align:center;

 color:white;

 font-family:
  "Brush Script MT",
  "Segoe Script",
  cursive;

 font-size:clamp(20px,3vw,45px);

 text-shadow:
  0 2px 5px #0008;
}

.photoSub{
 position:absolute;
 left:0;
 right:0;
 bottom:5%;

 text-align:center;

 color:white;

 font-family:Georgia,serif;

 font-size:clamp(8px,1vw,14px);

 letter-spacing:1px;

 text-shadow:0 1px 4px #0008;
}


/* ==================================================
   RIGHT CONTENT
   ================================================== */

.content{
 position:absolute;

 left:36%;
 right:5%;

 top:8%;
 bottom:7%;

 padding:2% 2% 1% 1%;

 display:flex;
 flex-direction:column;

 overflow:hidden;
}


/* ==================================================
   TOP DATE
   ================================================== */

.dateRow{
 display:flex;
 align-items:baseline;
 gap:7px;

 margin-bottom:4%;
}

.dayNumber{
 font-family:Georgia,serif;

 font-size:clamp(
  35px,
  5vw,
  72px
 );

 line-height:.8;

 color:#7b4a8e;

 font-weight:normal;
}

.slash{
 font-family:Georgia,serif;

 font-size:clamp(
  18px,
  2.5vw,
  32px
 );

 color:#555;
}

.month{
 font-family:Georgia,serif;

 font-size:clamp(
  13px,
  1.6vw,
  22px
 );

 color:#999;
}


/* ==================================================
   SMALL TOP LABEL
   ================================================== */

.smallLabel{
 font-family:Arial,sans-serif;

 font-size:clamp(
  7px,
  .8vw,
  11px
 );

 color:#aaa;

 letter-spacing:2px;

 margin-left:4px;

 margin-bottom:1%;
}


/* ==================================================
   CHRISTIAN ICON
   ================================================== */

.icon{
 position:absolute;

 right:0;
 top:0;

 width:clamp(45px,6vw,75px);
 aspect-ratio:1;

 border-radius:50%;

 background:#a998c7;

 display:flex;
 align-items:center;
 justify-content:center;
}

.icon svg{
 width:58%;
 height:58%;
}


/* ==================================================
   ENGLISH VERSE
   ================================================== */

.en{
 font-family:Georgia,
 "Times New Roman",
 serif;

 font-size:clamp(
  15px,
  1.8vw,
  25px
 );

 line-height:1.48;

 color:#555;

 font-weight:normal;

 margin-bottom:3%;

 max-width:96%;
}


/* ==================================================
   TAMIL
   ================================================== */

.ta{
 font-family:
  "Noto Sans Tamil",
  "Latha",
  "Vijaya",
  sans-serif;

 font-size:clamp(
  9px,
  1.05vw,
  15px
 );

 line-height:1.55;

 color:#777;

 margin-bottom:1.5%;

 max-width:96%;
}


/* ==================================================
   SINHALA
   ================================================== */

.si{
 font-family:
  "Noto Sans Sinhala",
  "Iskoola Pota",
  sans-serif;

 font-size:clamp(
  8px,
  .95vw,
  14px
 );

 line-height:1.55;

 color:#777;

 margin-bottom:2%;

 max-width:96%;
}


/* ==================================================
   REFERENCE
   ================================================== */

.ref{
 font-family:Georgia,serif;

 font-size:clamp(
  9px,
  1vw,
  14px
 );

 color:#999;

 margin-top:auto;

 padding-top:5px;
}


/* ==================================================
   GOLD DECORATION
   ================================================== */

.goldMark{
 width:28px;
 height:28px;

 margin-top:5px;
 margin-bottom:5px;
}

.goldMark svg{
 width:100%;
 height:100%;
}


/* ==================================================
   BOTTOM MESSAGE
   ================================================== */

.bottom{
 font-family:Georgia,serif;

 font-size:clamp(
  6px,
  .65vw,
  9px
 );

 color:#aaa;

 letter-spacing:1.3px;

 margin-top:3px;
}


/* ==================================================
   OUTER DECORATIVE LINE
   ================================================== */

.calendar:before{
 content:"";

 position:absolute;

 inset:9px;

 border:1px solid #e4dfd5;

 pointer-events:none;

 z-index:10;
}


/* ==================================================
   MOBILE
   ================================================== */

@media(max-width:700px){

 body{
  padding:10px;
 }

 .row{
  grid-template-columns:1fr 1fr;
 }

 .calendar{
  aspect-ratio:16/10;
 }

 .photo{
  left:4%;
  top:12%;
  bottom:12%;
  width:29%;
 }

 .content{
  left:36%;
  right:4%;
  top:8%;
  bottom:6%;
 }

 .en{
  font-size:12px;
  line-height:1.4;
 }

 .ta{
  font-size:8px;
 }

 .si{
  font-size:7px;
 }

 .dayNumber{
  font-size:38px;
 }
}


/* ==================================================
   PRINT
   ================================================== */

@media print{

 body{
  background:white;
  padding:0;
 }

 .controls,
 h2{
  display:none;
 }

 .calendar{
  width:100%;
  box-shadow:none;
  border:0;
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar</h2>


<!-- ==================================================
     CONTROLS
     ================================================== -->

<div class="controls">

 <div class="row">

  <div>
   <label>Date</label>

   <input
    id="date"
    type="date"
    min="2027-01-01"
    max="2027-12-31"
    value="2027-01-01"
    onchange="updateCalendar()">
  </div>


  <div>
   <label>English Verse</label>

   <textarea id="en">The LORD will open the heavens, the storehouse of his bounty, to send rain on your land in season and to bless all the work of your hands. You will lend to many nations but will borrow from none.</textarea>
  </div>


  <div>
   <label>Tamil Verse</label>

   <textarea id="ta">ஏற்ற காலத்தில் உன் தேசத்திலே மழை பெய்யவும் நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார்; நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.</textarea>
  </div>


  <div>
   <label>Sinhala Verse</label>

   <textarea id="si">ස්වාමීන්වහන්සේ නිසි කාලයට නුඹේ දේශයට වර්ෂාව දෙන්ටද නුඹේ අත්වල සියලු වැඩට ආශීර්වාද කරන්ටද අහස නමැති තමන්ගේ උතුම් ගබඩාව නුඹට විවෘත කරනසේක.</textarea>
  </div>

 </div>


 <div style="margin-top:10px">

  <label>Bible Reference</label>

  <input
   id="ref"
   value="Deuteronomy 28:12">

 </div>


 <div class="buttons">

  <button onclick="previousDay()">
   ← Previous
  </button>

  <button onclick="nextDay()">
   Next →
  </button>

  <button onclick="updateCalendar()">
   Generate
  </button>

  <button onclick="downloadPDF()">
   Download PDF
  </button>

 </div>

</div>


<!-- ==================================================
     CALENDAR
     ================================================== -->

<div id="calendar" class="calendar">


 <!-- LEFT PHOTO -->

 <div class="photo">

  <div id="photoSVG"></div>

  <div class="photoTitle">
   Blessing
  </div>

  <div class="photoSub">
   for you
  </div>

 </div>


 <!-- RIGHT CONTENT -->

 <div class="content">

  <div class="smallLabel">
   DAILY WORD
  </div>


  <div class="dateRow">

   <div
    id="showDay"
    class="dayNumber">
   </div>

   <div class="slash">
    /
   </div>

   <div
    id="showDaySmall"
    class="slash">
   </div>

   <div
    id="showMonth"
    class="month">
   </div>

  </div>


  <!-- ICON -->

  <div class="icon">

   <svg
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg">

    <circle
     cx="50"
     cy="50"
     r="46"
     fill="none"
     stroke="#fff"
     stroke-width="3"
     opacity=".55"/>

    <path
     d="M50 20V78"
     stroke="#fff"
     stroke-width="6"
     stroke-linecap="round"/>

    <path
     d="M27 42H73"
     stroke="#fff"
     stroke-width="6"
     stroke-linecap="round"/>

   </svg>

  </div>


  <!-- ENGLISH -->

  <div
   id="showEN"
   class="en">
  </div>


  <!-- TAMIL -->

  <div
   id="showTA"
   class="ta">
  </div>


  <!-- SINHALA -->

  <div
   id="showSI"
   class="si">
  </div>


  <!-- GOLD MARK -->

  <div class="goldMark">

   <svg
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg">

    <path
     d="M50 8
     C40 25 22 32 28 48
     C31 56 40 57 50 53
     C60 57 69 56 72 48
     C78 32 60 25 50 8Z"
     fill="#c79b3b"/>

    <circle
     cx="50"
     cy="38"
     r="8"
     fill="#e4c36c"/>

    <path
     d="M50 55V82"
     stroke="#c79b3b"
     stroke-width="7"
     stroke-linecap="round"/>

   </svg>

  </div>


  <!-- REFERENCE -->

  <div
   id="showRef"
   class="ref">
  </div>


  <div class="bottom">
   MAY GOD'S WORD GUIDE YOUR DAY
  </div>

 </div>

</div>

</div>


<script>

/* ==================================================
   HELPERS
   ================================================== */

const $=id=>document.getElementById(id);


/* ==================================================
   DAY OF YEAR
   ================================================== */

function dayOfYear(d){

 const start=
  new Date(d.getFullYear(),0,1);

 return Math.floor(
  (d-start)/86400000
 )+1;
}


/* ==================================================
   SEEDED RANDOM
   ================================================== */

function rnd(n){

 const x=
  Math.sin(n*999.123)*43758.5453;

 return x-Math.floor(x);
}


/* ==================================================
   LANDSCAPE PHOTO
   ================================================== */

function createPhoto(d){

 const n=dayOfYear(d);

 const palettes=[
  ["#ead8df","#b78aa8","#51416b"],
  ["#f0d9c0","#c49a9e","#514768"],
  ["#e8d9ca","#a989a6","#403b62"],
  ["#f3d9ca","#bd8da0","#55446e"],
  ["#dedbd0","#8ca0a0","#465a67"],
  ["#eed7c6","#c18b9e","#59456c"]
 ];

 const p=
  palettes[(n-1)%palettes.length];


 let mountains="";

 for(let i=0;i<9;i++){

  const x=i*90;

  const h=
   90+
   rnd(n+i*4)*140;

  mountains+=`
   <path
    d="
    M${x} 350
    L${x+45} ${350-h}
    L${x+100} 350
    Z"
    fill="#765f82"
    opacity=".55"/>
  `;
 }


 let clouds="";

 for(let i=0;i<4;i++){

  const x=
   40+rnd(n+i*8)*300;

  const y=
   55+rnd(n+i*4)*90;

  clouds+=`
   <ellipse
    cx="${x}"
    cy="${y}"
    rx="90"
    ry="22"
    fill="#fff"
    opacity=".25"/>
  `;
 }


 return `
 <svg
  viewBox="0 0 500 700"
  preserveAspectRatio="xMidYMid slice"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

   <linearGradient
    id="photoSky"
    x2="0"
    y2="1">

    <stop
     stop-color="${p[0]}"/>

    <stop
     offset=".55"
     stop-color="${p[1]}"/>

    <stop
     offset="1"
     stop-color="${p[2]}"/>

   </linearGradient>

   <linearGradient
    id="photoGround"
    x2="0"
    y2="1">

    <stop
     stop-color="#443b59"/>

    <stop
     offset="1"
     stop-color="#181923"/>

   </linearGradient>

  </defs>


  <!-- SKY -->

  <rect
   width="500"
   height="700"
   fill="url(#photoSky)"/>


  <!-- SUN -->

  <circle
   cx="390"
   cy="115"
   r="90"
   fill="#fff4dc"
   opacity=".30"/>

  <circle
   cx="390"
   cy="115"
   r="45"
   fill="#fff7e2"
   opacity=".55"/>


  <!-- CLOUDS -->

  ${clouds}


  <!-- MOUNTAINS -->

  ${mountains}


  <!-- MAIN HILLS -->

  <path
   d="
   M0 470
   Q120 390 220 470
   T430 460
   T500 470
   V700
   H0Z"
   fill="url(#photoGround)"/>


  <!-- FOREGROUND -->

  <path
   d="
   M0 580
   Q130 520 250 575
   T500 570
   V700
   H0Z"
   fill="#171922"
   opacity=".85"/>


  <!-- LIGHT -->

  <path
   d="
   M350 110
   L500 420
   L410 420
   Z"
   fill="#fff4d0"
   opacity=".08"/>


  <!-- VIGNETTE -->

  <rect
   width="500"
   height="700"
   fill="#000"
   opacity=".08"/>

 </svg>
 `;
}


/* ==================================================
   UPDATE
   ================================================== */

function updateCalendar(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );


 const day=d.getDate();

 const month=d.toLocaleDateString(
  "en-US",
  {month:"long"}
 );


 $("showDay").textContent=
  day;

 $("showDaySmall").textContent=
  day;

 $("showMonth").textContent=
  month;


 $("showEN").textContent=
  $("en").value;

 $("showTA").textContent=
  $("ta").value;

 $("showSI").textContent=
  $("si").value;

 $("showRef").textContent=
  "— "+$("ref").value;


 $("photoSVG").innerHTML=
  createPhoto(d);
}


/* ==================================================
   PREVIOUS
   ================================================== */

function previousDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(
  d.getDate()-1
 );

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* ==================================================
   NEXT
   ================================================== */

function nextDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(
  d.getDate()+1
 );

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* ==================================================
   PDF
   ================================================== */

async function downloadPDF(){

 const calendar=$("calendar");

 const canvas=
  await html2canvas(
   calendar,
   {
    scale:4,
    useCORS:true,
    backgroundColor:"#fdfcf9"
   }
  );


 const {jsPDF}=
  window.jspdf;


 const pdf=
  new jsPDF({
   orientation:"landscape",
   unit:"in",
   format:[12,7.5]
  });


 pdf.addImage(
  canvas.toDataURL(
   "image/jpeg",
   .98
  ),
  "JPEG",
  0,
  0,
  12,
  7.5
 );


 pdf.save(
  "Bible-Calendar-"+
  $("date").value+
  ".pdf"
 );
}


/* ==================================================
   LIVE UPDATE
   ================================================== */

["en","ta","si","ref"].forEach(id=>{

 $(id).addEventListener(
  "input",
  updateCalendar
 );

});


/* ==================================================
   START
   ================================================== */

updateCalendar();

</script>

</body>
</html>
