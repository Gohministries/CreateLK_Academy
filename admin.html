<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#e8e8e8;font-family:Arial;color:#333}
.app{max-width:1200px;margin:auto}
h2{text-align:center;margin:0 0 18px;color:#222}
.controls{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 18px #0002;margin-bottom:20px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{display:block;font-size:13px;font-weight:bold;color:#444}
input,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #ccc;border-radius:7px;font:inherit}
textarea{height:80px;resize:vertical}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;padding:10px 16px;border-radius:7px;background:#333;color:#fff;cursor:pointer;font-weight:bold}

.calendar{
 width:100%;aspect-ratio:16/10;position:relative;overflow:hidden;
 background:#fdfcf9;box-shadow:0 8px 35px #0002;border:1px solid #ddd
}

.photo{
 position:absolute;left:5%;top:10%;bottom:10%;width:27%;
 border-radius:9px;overflow:hidden;box-shadow:0 4px 16px #0003;background:#ddd
}
.photo svg{width:100%;height:100%;display:block}

.content{
 position:absolute;left:36%;right:5%;top:8%;bottom:7%;
 padding:2% 2% 1% 1%;display:flex;flex-direction:column;overflow:hidden
}

.dateRow{display:flex;align-items:baseline;gap:7px;margin-bottom:4%}
.dayNumber{font-family:Georgia,serif;font-size:clamp(35px,5vw,72px);line-height:.8;color:#7b4a8e}
.slash{font-family:Georgia,serif;font-size:clamp(18px,2.5vw,32px);color:#555}
.month{font-family:Georgia,serif;font-size:clamp(13px,1.6vw,22px);color:#999}

.icon{
 position:absolute;right:0;top:0;width:clamp(45px,6vw,75px);aspect-ratio:1;
 border-radius:50%;background:#a998c7;display:flex;align-items:center;justify-content:center
}
.icon svg{width:58%;height:58%}

.en{
 font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,1.8vw,25px);
 line-height:1.48;color:#555;margin-bottom:3%;max-width:96%
}
.ta{
 font-family:"Noto Sans Tamil","Latha","Vijaya",sans-serif;
 font-size:clamp(9px,1.05vw,15px);line-height:1.55;color:#777;margin-bottom:1.5%;max-width:96%
}
.si{
 font-family:"Noto Sans Sinhala","Iskoola Pota",sans-serif;
 font-size:clamp(8px,.95vw,14px);line-height:1.55;color:#777;margin-bottom:2%;max-width:96%
}
.ref{font-family:Georgia,serif;font-size:clamp(9px,1vw,14px);color:#999;margin-top:auto;padding-top:5px}
.bottom{font-family:Georgia,serif;font-size:clamp(6px,.65vw,9px);color:#aaa;letter-spacing:1.3px;margin-top:3px}

.calendar:before{
 content:"";position:absolute;inset:9px;border:1px solid #e4dfd5;
 pointer-events:none;z-index:10
}

@media(max-width:700px){
 body{padding:10px}
 .row{grid-template-columns:1fr 1fr}
 .photo{left:4%;top:12%;bottom:12%;width:29%}
 .content{left:36%;right:4%;top:8%;bottom:6%}
 .en{font-size:12px;line-height:1.4}
 .ta{font-size:8px}.si{font-size:7px}.dayNumber{font-size:38px}
}

@media print{
 body{background:#fff;padding:0}
 .controls,h2{display:none}
 .calendar{width:100%;box-shadow:none;border:0}
}
</style>
</head>

<body>
<div class="app">

<h2>365 Bible Calendar</h2>

<div class="controls">
<div class="row">

<div>
<label>Date</label>
<input id="date" type="date" min="2027-01-01" max="2027-12-31" value="2027-01-01">
</div>

<div>
<label>English Verse</label>
<textarea id="en">The LORD will open the heavens, the storehouse of his bounty, to send rain on your land in season and to bless all the work of your hands. You will lend to many nations but will borrow from none.</textarea>
</div>

<div>
<label>Tamil Verse</label>
<textarea id="ta">ஏற்ற காலத்தில் உன் தேசத்திலே மழை பெய்யவும் நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார்; நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.</textarea>
</div>

<div>
<label>Sinhala Verse</label>
<textarea id="si">ස්වාමීන්වහන්සේ නිසි කාලයට නුඹේ දේශයට වර්ෂාව දෙන්ටද නුඹේ අත්වල සියලු වැඩට ආශීර්වාද කරන්ටද අහස නමැති තමන්ගේ උතුම් ගබඩාව නුඹට විවෘත කරනසේක.</textarea>
</div>

</div>

<div style="margin-top:10px">
<label>Bible Reference</label>
<input id="ref" value="Deuteronomy 28:12">
</div>

<div class="buttons">
<button onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
<button onclick="update()">Generate</button>
<button onclick="pdf()">Download PDF</button>
</div>
</div>


<div id="calendar" class="calendar">

<div class="photo"><div id="art"></div></div>

<div class="content">

<div class="dateRow">
<div id="day" class="dayNumber"></div>
<div class="slash">/</div>
<div id="day2" class="slash"></div>
<div id="month" class="month"></div>
</div>

<div class="icon">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
<path d="M50 20V78M27 42H73" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
</svg>
</div>

<div id="en2" class="en"></div>
<div id="ta2" class="ta"></div>
<div id="si2" class="si"></div>
<div id="ref2" class="ref"></div>

<div class="bottom">MAY GOD'S WORD GUIDE YOUR DAY</div>

</div>
</div>
</div>


<script>
const $=id=>document.getElementById(id);

function dateStr(d){
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function doy(d){
 return Math.floor((d-new Date(d.getFullYear(),0,1))/86400000)+1;
}

function rnd(n){
 return Math.abs(Math.sin(n*91.731)*43758.5453)%1;
}


/* COMPACT REALISTIC SVG */
function art(d){

 const n=doy(d), s=n%10;
 const palettes=[
  ["#b9d2da","#efd0a8","#496456"],
  ["#c9dce1","#f2d5ae","#607565"],
  ["#d5dfd9","#e8c8a7","#3e5748"],
  ["#b9cbd3","#e7c39e","#526a58"]
 ];
 const p=palettes[n%palettes.length];
 const sunX=90+rnd(n)*320;

 let scene="";

 /* mountains */
 for(let i=0;i<5;i++){
  let x=i*120-80,h=150+rnd(n+i)*180;
  scene+=`<path d="M${x} 450L${x+75} ${450-h}L${x+150} 450Z" fill="${p[2]}" opacity="${.35+i*.06}"/>`;
 }

 /* water scenes */
 if([1,3,7].includes(s)){
  scene+=`
  <path d="M0 430Q120 390 250 430T500 425V700H0Z" fill="#456d71"/>
  <path d="M0 485Q130 455 250 485T500 480M30 545Q150 515 280 545T480 540"
   fill="none" stroke="#edf0e7" stroke-width="4" opacity=".3"/>`;
 }

 /* trees */
 if([2,3,5,8].includes(s)){
  for(let i=0;i<10;i++){
   let x=i*50+rnd(n+i)*20,h=70+rnd(n+i+20)*120;
   scene+=`
   <path d="M${x} 610L${x+22} ${610-h}L${x+44} 610Z" fill="#294939" opacity=".85"/>
   <path d="M${x+7} 555L${x+22} ${580-h}L${x+37} 555Z" fill="#3d5d49"/>`;
  }
 }

 /* church */
 if(s===4){
  let x=270;
  scene+=`
  <ellipse cx="${x}" cy="570" rx="95" ry="13" fill="#17251e" opacity=".3"/>
  <path d="M${x-65} 560V425L${x} 360L${x+65} 425V560Z" fill="#e8e2d4" stroke="#655b4e" stroke-width="3"/>
  <path d="M${x-78} 425L${x} 345L${x+78} 425Z" fill="#594738"/>
  <rect x="${x-12}" y="475" width="24" height="85" fill="#544437"/>
  <circle cx="${x}" cy="445" r="17" fill="#9db5b4"/>
  <path d="M${x} 415V458M${x-19} 437H${x+19}" stroke="#62594c" stroke-width="5"/>`;
 }

 /* cross */
 if(s===6){
  let x=250;
  scene+=`
  <ellipse cx="${x}" cy="585" rx="75" ry="12" fill="#17251e" opacity=".3"/>
  <rect x="${x-8}" y="300" width="16" height="285" rx="3" fill="#554536"/>
  <rect x="${x-58}" y="370" width="116" height="18" rx="3" fill="#554536"/>`;
 }

 /* bible */
 if(s===9){
  scene+=`
  <g transform="translate(70 490) rotate(-4)">
  <ellipse cx="180" cy="145" rx="145" ry="18" fill="#17251e" opacity=".25"/>
  <path d="M0 25Q90 -5 180 25Q270 -5 360 25V140Q270 112 180 145Q90 112 0 140Z"
   fill="#eee6d3" stroke="#756851" stroke-width="4"/>
  <path d="M180 25V145" stroke="#aa9977" stroke-width="3"/>
  </g>`;
 }

 return `<svg viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <defs>
 <linearGradient id="g${n}" x2="0" y2="1">
 <stop stop-color="${p[0]}"/><stop offset=".55" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/>
 </linearGradient>
 <radialGradient id="sun${n}">
 <stop stop-color="#fff8d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff1c8" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <rect width="500" height="700" fill="url(#g${n})"/>
 <circle cx="${sunX}" cy="${70+rnd(n+5)*100}" r="120" fill="url(#sun${n})"/>
 ${scene}
 <path d="M-40 470Q130 350 260 440T540 420V700H-40Z" fill="#263d31" opacity=".16"/>
 <rect width="500" height="700" fill="#000" opacity=".045"/>
 </svg>`;
}


/* UPDATE */
function update(){

 const d=new Date($("date").value+"T12:00:00");

 $("day").textContent=d.getDate();
 $("day2").textContent=d.getDate();
 $("month").textContent=d.toLocaleDateString("en-US",{month:"long"});

 $("en2").textContent=$("en").value;
 $("ta2").textContent=$("ta").value;
 $("si2").textContent=$("si").value;
 $("ref2").textContent="— "+$("ref").value;

 $("art").innerHTML=art(d);
}


/* NAVIGATION */
function move(x){
 const d=new Date($("date").value+"T12:00:00");
 d.setDate(d.getDate()+x);
 if(d.getFullYear()===2027){
  $("date").value=dateStr(d);
  update();
 }
}

function prev(){move(-1)}
function next(){move(1)}


/* PDF 9 × 5.625 INCH */
async function pdf(){

 const canvas=await html2canvas($("calendar"),{
  scale:4,
  useCORS:true,
  backgroundColor:"#fdfcf9"
 });

 const {jsPDF}=window.jspdf;

 const p=new jsPDF({
  orientation:"landscape",
  unit:"in",
  format:[9,5.625]
 });

 p.addImage(
  canvas.toDataURL("image/jpeg",.98),
  "JPEG",0,0,9,5.625
 );

 p.save("Bible-Calendar-"+$("date").value+".pdf");
}


/* LIVE TEXT */
["en","ta","si","ref"].forEach(id=>
 $(id).addEventListener("input",update)
);

$("date").addEventListener("change",update);

update();
</script>

</body>
</html>
