<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#eef1f5;font-family:Arial;color:#172033}
.app{max-width:1100px;margin:auto}
h2{text-align:center;margin:0 0 14px}

.controls{
 background:#fff;
 padding:14px;
 border-radius:12px;
 margin-bottom:18px;
 box-shadow:0 3px 12px #0001
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px
}

label{
 font-weight:bold;
 font-size:13px
}

input,textarea{
 width:100%;
 padding:8px;
 border:1px solid #ccd2da;
 border-radius:7px;
 font:inherit
}

textarea{
 min-height:68px;
 resize:vertical
}

.adjustment{
 margin-top:10px;
 padding:10px;
 background:#f6f7f9;
 border-radius:8px
}

.adjustment h3{
 margin:0 0 6px;
 font-size:14px
}

.range{
 display:grid;
 grid-template-columns:1fr 55px;
 gap:7px;
 align-items:center;
 margin:5px 0
}

.range input{padding:0}
.range span{text-align:right;font-size:11px}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:10px
}

button{
 border:0;
 border-radius:7px;
 padding:9px 13px;
 font-weight:bold;
 cursor:pointer
}

.secondary{background:#e7ecf2}
.gold{background:#bd9440;color:#fff}
.danger{background:#b83b3b;color:#fff}
button:disabled{opacity:.5}

.status{
 margin-top:8px;
 font-size:12px;
 font-weight:bold
}

.generated{
 display:flex;
 gap:5px;
 margin-top:6px;
 overflow:auto
}

.generatedRow{
 padding:5px 8px;
 background:#f0f3f6;
 border:1px solid #d9dee5;
 border-radius:5px;
 white-space:nowrap;
 font-size:11px
}


/* CALENDAR */

.calendar{
 width:100%;
 aspect-ratio:16/10;
 position:relative;
 overflow:hidden;
 border:1px solid #d3b36a;
 outline:4px solid #f1ece0;
 margin-bottom:15px;
 background:linear-gradient(135deg,#182c78,#59419a,#a44882,#dc9750)
}

.calendar:after{
 content:"";
 position:absolute;
 inset:0;
 background:#0002;
 z-index:1
}


/* 12 MONTH BACKGROUNDS */

.calendar.m1{background:linear-gradient(135deg,#183b87,#4f7acb,#71c9d0)}
.calendar.m2{background:linear-gradient(135deg,#59164c,#a73570,#ef7d9f)}
.calendar.m3{background:linear-gradient(135deg,#17644f,#45a86d,#b8ce62)}
.calendar.m4{background:linear-gradient(135deg,#14557f,#398dbb,#7bc8d5)}
.calendar.m5{background:linear-gradient(135deg,#813d1c,#c66b35,#e6a04f)}
.calendar.m6{background:linear-gradient(135deg,#182b72,#345db4,#51a0ca)}
.calendar.m7{background:linear-gradient(135deg,#751f1c,#b94c30,#e28b43)}
.calendar.m8{background:linear-gradient(135deg,#38216d,#6950a8,#aa7bc7)}
.calendar.m9{background:linear-gradient(135deg,#285937,#568d50,#9aba5d)}
.calendar.m10{background:linear-gradient(135deg,#681f1a,#a93d28,#d97839)}
.calendar.m11{background:linear-gradient(135deg,#172c62,#365d9f,#5d80c5)}
.calendar.m12{background:linear-gradient(135deg,#571a42,#8c315d,#c45770)}


.calendarContent{
 position:absolute;
 z-index:2;
 inset:1% 4% 2%;
 display:grid;
 grid-template-rows:auto auto minmax(0,1fr);
 min-height:0;
 text-align:center;
 color:#fff
}


/* SMALL TOP */

.topLine{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:10px;
 min-height:24px;
 text-shadow:0 2px 5px #000
}

.cross{
 font:18px Georgia;
 color:#f5d477
}

.month,.date{
 font:600 clamp(16px,2.1vw,26px) Cinzel,Georgia;
 letter-spacing:2px;
 line-height:1
}

.month{color:#f9dc82}

.verseTitle{
 margin:1px auto 3px;
 padding:1px 12px;
 border-top:1px solid #f6d97c70;
 border-bottom:1px solid #f6d97c70;
 font:500 clamp(7px,.75vw,10px) Cinzel;
 letter-spacing:1.5px;
 color:#fff3bd
}


/* THREE EQUAL BOXES */

.verseArea{
 min-height:0;
 display:grid;
 grid-template-rows:repeat(3,1fr);
 gap:7px;
 overflow:hidden
}

.verseBox{
 min-height:0;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:10px 20px;
 border:1px solid #f7df91aa;
 border-radius:10px;
 background:#ffffff20;
 box-shadow:inset 0 0 20px #fff1,0 3px 12px #0004;
 overflow:hidden
}

.verseText{
 width:100%;
 max-height:100%;
 margin:0;
 text-align:center;
 overflow-wrap:anywhere;
 color:#fff;
 text-shadow:0 2px 4px #000,0 1px 8px #0008
}


/* FIRST = SINHALA */

#sinhala{
 font-family:"Noto Sans Sinhala",sans-serif;
 font-weight:700;
 line-height:1.3
}


/* SECOND = TAMIL */

#tamil{
 font-family:"Noto Sans Tamil",sans-serif;
 font-weight:700;
 line-height:1.3
}


/* THIRD = ENGLISH */

#english{
 font-family:Georgia,"Times New Roman",serif;
 font-weight:700;
 color:#fff1a8;
 line-height:1.18
}


@media(max-width:700px){

 body{padding:10px}

 .grid{grid-template-columns:1fr}

 .calendarContent{inset:1% 3% 2%}

 .topLine{
  gap:6px;
  min-height:21px
 }

 .cross{font-size:14px}

 .month,.date{
  font-size:18px;
  letter-spacing:1px
 }

 .verseBox{
  padding:7px 9px
 }
}


@media print{

 @page{
  size:9in 5.625in landscape;
  margin:0
 }

 html,body{
  width:9in;
  height:5.625in;
  margin:0;
  padding:0
 }

 .app{
  width:9in;
  max-width:none
 }

 h2,.controls{
  display:none!important
 }

 .calendar{
  width:9in;
  height:5.625in;
  aspect-ratio:auto;
  outline:none;
  margin:0;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar 2027</h2>

<div class="controls">

<div class="grid">

<div class="field">
<label>Date</label>
<input id="date"
type="date"
min="2027-01-01"
max="2027-12-31"
value="2027-01-01">
</div>

<div class="field">
<label>English Bible Verse</label>
<textarea id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>
</div>

<div class="field">
<label>Tamil Bible Verse</label>
<textarea id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>
</div>

<div class="field">
<label>Sinhala Bible Verse</label>
<textarea id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>
</div>

</div>


<div class="adjustment">

<h3>Text Size</h3>

<div class="range">
<input id="englishSize"
type="range"
min="8"
max="35"
step=".1"
value="25">
<span id="englishSizeValue">25px</span>
</div>

<div class="range">
<input id="tamilSize"
type="range"
min="8"
max="30"
step=".1"
value="18">
<span id="tamilSizeValue">18px</span>
</div>

<div class="range">
<input id="sinhalaSize"
type="range"
min="8"
max="30"
step=".1"
value="18">
<span id="sinhalaSizeValue">18px</span>
</div>

</div>


<div class="buttons">

<button class="secondary" id="prevBtn">
← Previous
</button>

<button class="secondary" id="nextBtn">
Next →
</button>

<button class="gold" id="generateBtn">
Generate
</button>

<button class="danger" id="clearBtn">
Clear All
</button>

<button class="gold" id="downloadBtn">
Download All PDF
</button>

</div>


<div class="status" id="status"></div>
<div class="generated" id="generatedList"></div>

</div>


<!-- CALENDAR -->

<div class="calendar m1" id="calendar">

<div class="calendarContent">


<div class="topLine">

<span class="cross">✝</span>

<div class="month" id="monthText">
JANUARY
</div>

<div class="date" id="dayText">
1
</div>

</div>


<div class="verseTitle">
VERSE OF THE DAY
</div>


<div class="verseArea">


<!-- FIRST: SINHALA -->

<div class="verseBox">
<div class="verseText" id="sinhala"></div>
</div>


<!-- SECOND: TAMIL -->

<div class="verseBox">
<div class="verseText" id="tamil"></div>
</div>


<!-- THIRD: ENGLISH -->

<div class="verseBox">
<div class="verseText" id="english"></div>
</div>


</div>
</div>
</div>


<script>

const $=id=>document.getElementById(id);
const KEY="BibleCalendar2027",MAX=10;

const months=[
"JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
"JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"
];

let pages=[],busy=false;


/* SAVE / LOAD */

function settings(){
 return{
  date:$("date").value,
  en:$("englishInput").value,
  ta:$("tamilInput").value,
  si:$("sinhalaInput").value,
  es:$("englishSize").value,
  ts:$("tamilSize").value,
  ss:$("sinhalaSize").value
 }
}

function save(){
 try{
  localStorage.setItem(
   KEY,
   JSON.stringify({
    pages,
    settings:settings()
   })
  )
 }catch(e){}
}

function load(){
 try{

  let x=
   JSON.parse(
    localStorage.getItem(KEY)||"null"
   );

  if(!x)return;

  pages=(x.pages||[]).slice(0,MAX);

  let s=x.settings||{};

  if(s.date)$("date").value=s.date;
  if(s.en!=null)$("englishInput").value=s.en;
  if(s.ta!=null)$("tamilInput").value=s.ta;
  if(s.si!=null)$("sinhalaInput").value=s.si;
  if(s.es!=null)$("englishSize").value=s.es;
  if(s.ts!=null)$("tamilSize").value=s.ts;
  if(s.ss!=null)$("sinhalaSize").value=s.ss;

 }catch(e){}
}


/* AUTO FIT */

function fit(el,min=8){

 let box=el.parentElement;

 let size=
  parseFloat(
   getComputedStyle(el).fontSize
  );

 for(
  let i=0;
  i<150 && size>min;
  i++
 ){

  if(
   el.scrollHeight<=box.clientHeight-8 &&
   el.scrollWidth<=box.clientWidth-8
  )break;

  size-=.2;

  el.style.fontSize=
   Math.max(min,size)+"px";
 }
}

function fitAll(){
 fit($("sinhala"));
 fit($("tamil"));
 fit($("english"));
}


/* UPDATE */

function update(){

 let d=
  new Date(
   $("date").value+"T00:00:00"
  );

 if(isNaN(d))return;


 $("monthText").textContent=
  months[d.getMonth()];

 $("dayText").textContent=
  d.getDate();


 $("sinhala").textContent=
  $("sinhalaInput").value.trim();

 $("tamil").textContent=
  $("tamilInput").value.trim();

 $("english").textContent=
  $("englishInput").value.trim();


 $("sinhala").style.fontSize=
  $("sinhalaSize").value+"px";

 $("tamil").style.fontSize=
  $("tamilSize").value+"px";

 $("english").style.fontSize=
  $("englishSize").value+"px";


 $("sinhalaSizeValue").textContent=
  $("sinhalaSize").value+"px";

 $("tamilSizeValue").textContent=
  $("tamilSize").value+"px";

 $("englishSizeValue").textContent=
  $("englishSize").value+"px";


 $("calendar").className=
  "calendar m"+(d.getMonth()+1);


 requestAnimationFrame(fitAll);
}


/* INPUTS */

[
 "date",
 "englishInput",
 "tamilInput",
 "sinhalaInput"
].forEach(id=>{

 $(id).addEventListener(
  "input",
  ()=>{
   update();
   save()
  }
 );

 $(id).addEventListener(
  "change",
  ()=>{
   update();
   save()
  }
 );

});


/* FONT SLIDERS */

[
 ["englishSize","english"],
 ["tamilSize","tamil"],
 ["sinhalaSize","sinhala"]
].forEach(([slider,text])=>{

 $(slider).addEventListener(
  "input",
  ()=>{

   $(text).style.fontSize=
    $(slider).value+"px";

   $(slider+"Value").textContent=
    $(slider).value+"px";

   requestAnimationFrame(fitAll);

   save();
  }
 );

});


/* GENERATED LIST */

function render(){

 $("generatedList").innerHTML=
  pages.map((p,i)=>{

   let d=
    new Date(
     p.date+"T00:00:00"
    );

   return`
    <div class="generatedRow">
     ${i+1}.
     ${String(d.getDate()).padStart(2,"0")}
     ${months[d.getMonth()].slice(0,3)}
    </div>
   `

  }).join("");

 $("status").textContent=
  `Generated Pages: ${pages.length}/${MAX}`;
}


/* LOCK */

function lock(x){

 [
  "generateBtn",
  "prevBtn",
  "nextBtn",
  "clearBtn",
  "downloadBtn"
 ].forEach(
  id=>$(id).disabled=x
 );

}


/* CAPTURE */

async function capture(){

 update();

 await document.fonts.ready;

 await new Promise(
  r=>requestAnimationFrame(
   ()=>requestAnimationFrame(r)
  )
 );

 fitAll();

 const el=$("calendar");

 const canvas=
  await html2canvas(
   el,
   {
    scale:3,
    useCORS:true,
    allowTaint:true,
    backgroundColor:null,
    logging:false,
    width:el.offsetWidth,
    height:el.offsetHeight
   }
  );

 return canvas.toDataURL(
  "image/jpeg",
  .96
 );
}


/* GENERATE */

$("generateBtn").onclick=async()=>{

 if(busy||pages.length>=MAX)return;

 let date=$("date").value;

 if(!date)
  return alert("Please select a date.");

 if(
  pages.some(
   p=>p.date===date
  )
 )
  return alert("This date is already generated.");

 busy=true;

 lock(true);

 $("generateBtn").textContent=
  "Generating...";


 try{

  pages.push({
   date,
   image:await capture()
  });

  save();
  render();

 }catch(e){

  alert(
   "Generation error: "+
   e.message
  );

 }


 busy=false;

 lock(false);

 $("generateBtn").textContent=
  "Generate";
};


/* CLEAR */

$("clearBtn").onclick=()=>{

 if(
  pages.length &&
  confirm("Delete all generated pages?")
 ){

  pages=[];

  save();

  render();
 }
};


/* PREVIOUS / NEXT */

function move(n){

 let d=
  new Date(
   $("date").value+"T00:00:00"
  );

 d.setDate(
  d.getDate()+n
 );

 if(
  d.getFullYear()!=2027
 )return;

 $("date").value=
  d.toISOString().slice(0,10);

 update();

 save();
}

$("prevBtn").onclick=
 ()=>move(-1);

$("nextBtn").onclick=
 ()=>move(1);


/* PDF */

$("downloadBtn").onclick=()=>{

 if(!pages.length)
  return alert(
   "Generate at least one page first."
  );

 if(!window.jspdf)
  return alert(
   "PDF library failed to load."
  );


 const PDF=
  window.jspdf.jsPDF;


 const pdf=
  new PDF({
   orientation:"landscape",
   unit:"in",
   format:[9,5.625],
   compress:true
  });


 pages.forEach((p,i)=>{

  if(i)
   pdf.addPage(
    [9,5.625],
    "landscape"
   );

  pdf.addImage(
   p.image,
   "JPEG",
   0,
   0,
   9,
   5.625,
   undefined,
   "FAST"
  );

 });


 pdf.save(
  "365-Bible-Calendar-2027.pdf"
 );
};


/* START */

window.onload=()=>{

 load();

 update();

 render();

};

</script>

</body>
</html>
