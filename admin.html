<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Libre+Baskerville:wght@400;700&family=Noto+Sans+Sinhala:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#eef1f5;
 color:#263449;
 font-family:Arial,sans-serif
}

.app{max-width:1100px;margin:auto}

h2{
 margin:0 0 15px;
 text-align:center;
 font:700 25px Cinzel,serif;
 color:#304d73
}

.controls{
 background:#fff;
 padding:14px;
 border-radius:12px;
 margin-bottom:18px;
 box-shadow:0 4px 18px #0001
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px
}

.field{
 display:flex;
 flex-direction:column;
 gap:4px
}

label{
 font-size:11px;
 font-weight:700;
 color:#4b5563
}

input,textarea{
 width:100%;
 padding:8px;
 border:1px solid #ccd2da;
 border-radius:7px;
 outline:none;
 font:inherit
}

input:focus,textarea:focus{
 border-color:#ad8741;
 box-shadow:0 0 0 2px #ad874120
}

textarea{
 height:65px;
 resize:vertical
}

.adjust{
 margin-top:10px;
 padding:10px;
 border:1px solid #dfd2b6;
 border-radius:8px;
 background:#faf7f0
}

.adjust-title{
 margin-bottom:7px;
 color:#304d73;
 font-weight:700;
 font-size:12px
}

.range{
 display:grid;
 grid-template-columns:1fr 65px;
 gap:7px;
 align-items:center;
 margin:7px 0
}

.range input{
 padding:0;
 border:0;
 box-shadow:none;
 cursor:pointer
}

.range span{
 text-align:right;
 font-size:11px;
 font-weight:700;
 color:#596273
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:10px
}

button{
 border:0;
 border-radius:7px;
 padding:8px 11px;
 font-weight:700;
 cursor:pointer
}

.secondary{background:#e5ebf1;color:#273346}
.gold{background:#ad8741;color:#fff}
.dark{background:#304d73;color:#fff}
.danger{background:#b83d3d;color:#fff}

.pdf-control{
 display:flex;
 align-items:center;
 gap:6px;
 padding:3px 5px;
 background:#f4f6f8;
 border-radius:7px
}

#pdfPages{
 width:55px;
 text-align:center;
 padding:7px 5px
}

.status{
 min-height:16px;
 margin-top:7px;
 font-size:12px;
 font-weight:700;
 color:#304d73
}

.progress{
 display:none;
 margin-top:7px
}

.progress-bar{
 height:7px;
 background:#e5e8ec;
 border-radius:20px;
 overflow:hidden
}

.progress-fill{
 width:0;
 height:100%;
 background:#ad8741
}

.progress-text{
 margin-top:3px;
 text-align:center;
 font-size:10px
}

.generated{
 display:flex;
 gap:4px;
 overflow:auto;
 margin-top:7px;
 padding-bottom:2px
}

.generated span{
 padding:4px 7px;
 border-radius:5px;
 background:#eef2f5;
 font-size:10px;
 cursor:pointer;
 white-space:nowrap
}

.generated .current{
 background:#ad8741;
 color:#fff
}

/* 12 MONTH BACKGROUNDS */

.m1{--accent:#6684a8;--dark:#304b70;background:linear-gradient(135deg,#e9f1fa,#cbd9e8 50%,#f7f4ed)}
.m2{--accent:#a65f70;--dark:#713b4b;background:linear-gradient(135deg,#fff4f5,#eccbd3 50%,#f9eee7)}
.m3{--accent:#668d67;--dark:#3d5d40;background:linear-gradient(135deg,#f1f8ec,#cbdcc6 50%,#f7f3e8)}
.m4{--accent:#5790a8;--dark:#2f6076;background:linear-gradient(135deg,#e5f7fc,#bcdde8 50%,#f8f3e7)}
.m5{--accent:#a57d43;--dark:#6f4e25;background:linear-gradient(135deg,#fff9df,#e8d59f 50%,#f7eed9)}
.m6{--accent:#5d76ae;--dark:#344b80;background:linear-gradient(135deg,#edf3ff,#c4d2ee 50%,#f5f1e8)}
.m7{--accent:#a96e45;--dark:#713d27;background:linear-gradient(135deg,#fff5df,#e9c79e 50%,#f8ead5)}
.m8{--accent:#8069a0;--dark:#55406e;background:linear-gradient(135deg,#f8f2ff,#d9c8e8 50%,#f5efe5)}
.m9{--accent:#728a57;--dark:#465d35;background:linear-gradient(135deg,#f5f8e9,#d5dfb9 50%,#f8f2e3)}
.m10{--accent:#ad7048;--dark:#703d29;background:linear-gradient(135deg,#fff2dc,#e8c19d 50%,#f5e2ce)}
.m11{--accent:#61799e;--dark:#384d72;background:linear-gradient(135deg,#edf4fc,#cbd9e9 50%,#f4eadb)}
.m12{--accent:#91596b;--dark:#633644;background:linear-gradient(135deg,#fff0ed,#e2c0c6 50%,#f3dfb7)}

/* CALENDAR */

.calendar{
 position:relative;
 width:100%;
 aspect-ratio:16/10;
 overflow:hidden;
 border:3px solid #b18a45;
 border-radius:4px;
 box-shadow:0 10px 30px #0002
}

.calendar:before{
 content:"✝";
 position:absolute;
 left:8%;
 top:7%;
 font:120px Georgia,serif;
 color:var(--accent);
 opacity:.06;
 pointer-events:none
}

.calendar:after{
 content:"";
 position:absolute;
 inset:8px;
 border:1px solid #b18a4566;
 pointer-events:none
}

.content{
 position:absolute;
 inset:4% 5% 3%;
 display:grid;
 grid-template-columns:27% 73%;
 min-width:0;
 min-height:0
}

.left{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 border-right:1px solid #b18a4590;
 padding:3%
}

.small{
 font:700 clamp(7px,.7vw,10px) Cinzel,serif;
 letter-spacing:2px;
 color:var(--dark)
}

.cross{
 margin:6px;
 font:62px Georgia,serif;
 font-size:clamp(35px,4.5vw,62px);
 color:var(--accent)
}

.title{
 font:800 clamp(15px,1.8vw,24px) Cinzel,serif;
 letter-spacing:2px;
 line-height:1.2;
 color:var(--dark)
}

.line{
 width:55%;
 height:1px;
 margin:10px;
 background:var(--accent)
}

.ornament{
 color:var(--accent);
 margin-top:8px
}

/* RIGHT */

.right{
 display:grid;
 grid-template-rows:18% 82%;
 padding:0 4% 0 5%;
 min-width:0;
 min-height:0
}

.date{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:7px;
 min-height:0;
 text-align:center
}

.day{
 color:var(--dark);
 font:800 clamp(24px,3.4vw,48px) Cinzel,serif;
 line-height:.9
}

.slash{
 color:#b5a77e;
 font:24px Georgia,serif
}

.month{
 color:var(--dark);
 font:700 clamp(10px,1.2vw,18px) Cinzel,serif;
 letter-spacing:1.5px
}

/* VERSES */

.verses{
 display:grid;
 grid-template-rows:1fr 1fr 1.15fr;
 gap:3px;
 min-height:0;
 height:100%;
 overflow:hidden
}

.verse{
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 overflow:hidden;
 padding:2px 5px;
 min-width:0;
 min-height:0
}

.verse p{
 width:100%;
 height:auto;
 margin:0;
 padding:0;
 overflow:hidden;
 overflow-wrap:anywhere;
 word-break:normal;
 display:block
}

#sinhala{
 font-family:"Noto Sans Sinhala",sans-serif;
 font-weight:800;
 line-height:1.25;
 color:#293d59
}

#tamil{
 font-family:"Noto Sans Tamil",sans-serif;
 font-weight:800;
 line-height:1.25;
 color:#293d59
}

#english{
 font-family:"Libre Baskerville",Georgia,serif;
 font-weight:700;
 line-height:1.3;
 color:#263a55
}

@media(max-width:700px){

 body{padding:8px}

 .grid{grid-template-columns:1fr}

 .content{inset:4% 4% 3%}

 .left{padding:2%}

 .right{
  padding-left:4%;
  padding-right:3%
 }

 .title{font-size:13px}
 .small{font-size:6px}
 .cross{font-size:32px}

 .buttons button{
  flex:1 1 auto
 }

 .pdf-control{
  flex:1 1 100%
 }
}

@media print{

 @page{
  size:9in 5.625in landscape;
  margin:0
 }

 body{
  padding:0;
  background:#fff
 }

 .app{
  width:9in;
  max-width:none
 }

 h2,.controls{display:none}

 .calendar{
  width:9in;
  height:5.625in;
  aspect-ratio:auto;
  box-shadow:none;
  print-color-adjust:exact;
  -webkit-print-color-adjust:exact
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar 2027</h2>

<div class="controls">

<div class="grid">

<div class="field">
<label>Date</label>
<input id="date"
 type="date"
 min="2027-01-01"
 max="2027-12-31"
 value="2027-01-01">
</div>

<div class="field">
<label>English Bible Verse</label>
<textarea id="englishInput"></textarea>
</div>

<div class="field">
<label>Tamil Bible Verse</label>
<textarea id="tamilInput"></textarea>
</div>

<div class="field">
<label>Sinhala Bible Verse</label>
<textarea id="sinhalaInput"></textarea>
</div>

</div>

<div class="adjust">

<div class="adjust-title">
Bible Text Size Adjustment
</div>

<div class="range">
<input id="englishSize"
 type="range"
 min="0.5"
 max="35"
 value="18"
 step="0.1">
<span id="englishSizeValue">18px</span>
</div>

<div class="range">
<input id="tamilSize"
 type="range"
 min="0.5"
 max="30"
 value="15"
 step="0.1">
<span id="tamilSizeValue">15px</span>
</div>

<div class="range">
<input id="sinhalaSize"
 type="range"
 min="0.5"
 max="30"
 value="15"
 step="0.1">
<span id="sinhalaSizeValue">15px</span>
</div>

</div>

<div class="buttons">

<button class="secondary" onclick="move(-1)">← Previous</button>
<button class="secondary" onclick="move(1)">Next →</button>
<button class="secondary" onclick="firstPage()">First</button>
<button class="secondary" onclick="lastPage()">Last</button>
<button class="gold" onclick="generate()">Generate</button>
<button class="dark" onclick="generateAll()">Generate All 365</button>
<button class="danger" onclick="clearAll()">Clear All</button>

<div class="pdf-control">
<label>PDF:</label>
<input id="pdfPages" type="number" min="1" max="10" value="10">
<span style="font-size:10px">pages</span>
<button class="gold" onclick="downloadPDF()">Download PDF</button>
</div>

</div>

<div class="status" id="status"></div>

<div class="progress" id="progress">

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="progress-text" id="progressText">
0 / 0
</div>

</div>

<div class="generated" id="generated"></div>

</div>

<div class="calendar m1" id="calendar">

<div class="content">

<div class="left">

<div class="small">
DAILY DEVOTIONAL
</div>

<div class="cross">
✝
</div>

<div class="title">
GOD'S<br>PROMISE
</div>

<div class="line"></div>

<div class="ornament">
✦
</div>

</div>

<div class="right">

<div class="date">

<div class="day" id="day">
01
</div>

<div class="slash">
/
</div>

<div class="month" id="month">
JANUARY
</div>

</div>

<div class="verses">

<div class="verse">
<p id="sinhala"></p>
</div>

<div class="verse">
<p id="tamil"></p>
</div>

<div class="verse">
<p id="english"></p>
</div>

</div>

</div>

</div>

</div>

</div>

<script>
const $=id=>document.getElementById(id);
const KEY="bibleCalendar2027_clean";

const DEFAULT={
 english:"My times are in your hands; deliver me from the hands of my enemies and from those who pursue me.",
 tamil:"என் காலங்கள் உமது கையில் இருக்கிறது; என்னைப் பின் தொடருகிற என் சத்துருக்களின் கைக்கும் என்னைத் தப்புவியும்.",
 sinhala:"මාගේ කාලය ඔබගේ අතෙහි තිබේ; මාගේ සතුරන්ගේ අතින් සහ මා පසුපස එන්නන්ගෙන් මා ගළවන්න."
};

const DEFAULT_SIZES={
 english:18,
 tamil:15,
 sinhala:15
};

let pages={};

try{
 pages=JSON.parse(localStorage.getItem(KEY)||"{}");
}catch(e){
 pages={}
}

function dateKey(d){
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function getDate(k){
 return new Date(k+"T00:00:00");
}

function getPage(k){

 if(!pages[k]){
  pages[k]={
   ...DEFAULT,
   sizes:{...DEFAULT_SIZES}
  };
 }

 pages[k].sizes={
  ...DEFAULT_SIZES,
  ...(pages[k].sizes||{})
 };

 return pages[k];
}

function save(){

 try{
  localStorage.setItem(KEY,JSON.stringify(pages));
 }catch(e){
  $("status").textContent="Storage is full.";
 }
}

function saveCurrent(){

 const k=$("date").value;
 const p=getPage(k);

 p.english=$("englishInput").value;
 p.tamil=$("tamilInput").value;
 p.sinhala=$("sinhalaInput").value;

 p.sizes={
  english:Math.max(.5,parseFloat($("englishSize").value)||.5),
  tamil:Math.max(.5,parseFloat($("tamilSize").value)||.5),
  sinhala:Math.max(.5,parseFloat($("sinhalaSize").value)||.5)
 };

 save();
}

function load(){

 const p=getPage($("date").value);

 $("englishInput").value=p.english;
 $("tamilInput").value=p.tamil;
 $("sinhalaInput").value=p.sinhala;

 $("englishSize").value=p.sizes.english;
 $("tamilSize").value=p.sizes.tamil;
 $("sinhalaSize").value=p.sizes.sinhala;

 render();
}

function render(){

 const k=$("date").value;
 const d=getDate(k);
 const p=getPage(k);

 $("day").textContent=
  String(d.getDate()).padStart(2,"0");

 $("month").textContent=
  d.toLocaleString("en",{month:"long"}).toUpperCase();

 $("english").textContent=p.english;
 $("tamil").textContent=p.tamil;
 $("sinhala").textContent=p.sinhala;

 $("calendar").className=
  "calendar m"+(d.getMonth()+1);

 applySize();

 requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
   fitAll();
   showPages();
  });
 });
}

function formatSize(n){
 n=Math.max(.5,parseFloat(n)||.5);
 return n.toFixed(1).replace(/\.0$/,"")+"px";
}

function applySize(){

 const list=[
  ["english","englishSize","englishSizeValue"],
  ["tamil","tamilSize","tamilSizeValue"],
  ["sinhala","sinhalaSize","sinhalaSizeValue"]
 ];

 list.forEach(([text,slider,value])=>{

  let n=parseFloat($(slider).value);

  if(!Number.isFinite(n))
   n=.5;

  n=Math.max(.5,n);

  $(text).style.fontSize=formatSize(n);
  $(value).textContent=formatSize(n);
 });
}

/* Accurate overflow detection */

function fits(el){

 const box=el.parentElement;

 const h=el.getBoundingClientRect().height;
 const w=el.getBoundingClientRect().width;

 return h<=box.clientHeight+1 &&
        w<=box.clientWidth+1;
}

/* Reduce displayed text only.
   Slider always remains at user's selected size. */

function fit(el,size){

 let n=Math.max(.5,parseFloat(size)||.5);

 el.style.fontSize=formatSize(n);

 let guard=0;

 while(!fits(el)&&n>.5&&guard<400){

  n=Math.max(.5,Math.round((n-.1)*10)/10);

  el.style.fontSize=formatSize(n);

  guard++;
 }

 /* Never hide the verse */

 if(el.textContent.trim() && n<=.5){
  el.style.fontSize=".5px";
 }
}

function fitAll(){

 fit($("sinhala"),$("sinhalaSize").value);
 fit($("tamil"),$("tamilSize").value);
 fit($("english"),$("englishSize").value);
}

function generate(){

 saveCurrent();
 render();

 $("status").textContent=
  "✓ Saved successfully";
}

/* TEXT INPUT */

["englishInput","tamilInput","sinhalaInput"].forEach(id=>{

 $(id).addEventListener("input",()=>{

  saveCurrent();

  $("status").textContent=
   "✓ Auto-saved";

  render();
 });
});

/* SIZE SLIDERS */

["english","tamil","sinhala"].forEach(name=>{

 $(name+"Size").addEventListener("input",()=>{

  const slider=$(name+"Size");
  const text=$(name);
  const value=$(name+"SizeValue");

  let n=parseFloat(slider.value);

  if(!Number.isFinite(n))
   n=.5;

  n=Math.max(.5,n);

  /* Show exact selected size immediately */
  text.style.fontSize=formatSize(n);
  value.textContent=formatSize(n);

  /* Then reduce only if the verse cannot fit */
  requestAnimationFrame(()=>{
   requestAnimationFrame(()=>{

    fitAll();
    saveCurrent();

    $("status").textContent=
     "✓ Text size adjusted";
   });
  });
 });
});

/* DATE */

$("date").addEventListener("change",()=>{

 saveCurrent();
 load();
});

/* NAVIGATION */

function move(amount){

 saveCurrent();

 const d=getDate($("date").value);

 d.setDate(d.getDate()+amount);

 if(d.getFullYear()!==2027){

  $("status").textContent=
   amount>0?
   "End of 2027 reached.":
   "Beginning of 2027 reached.";

  return;
 }

 $("date").value=dateKey(d);

 load();
}

function firstPage(){

 saveCurrent();

 $("date").value=
  "2027-01-01";

 load();
}

function lastPage(){

 saveCurrent();

 $("date").value=
  "2027-12-31";

 load();
}

/* GENERATED PAGES */

function showPages(){

 const box=$("generated");

 box.innerHTML="";

 Object.keys(pages)
 .filter(k=>
  k>="2027-01-01"&&
  k<="2027-12-31"
 )
 .sort()
 .forEach(k=>{

  const s=document.createElement("span");
  const d=getDate(k);

  s.textContent=
   d.toLocaleDateString("en-US",{
    month:"short",
    day:"numeric"
   });

  if(k===$("date").value)
   s.className="current";

  s.onclick=()=>{

   saveCurrent();

   $("date").value=k;

   load();
  };

  box.appendChild(s);
 });
}

/* GENERATE ALL */

async function generateAll(){

 if(!confirm(
  "Create all 365 calendar pages?"
 ))return;

 saveCurrent();

 $("progress").style.display="block";

 for(let i=1;i<=365;i++){

  getPage(
   dateKey(new Date(2027,0,i))
  );

  $("progressFill").style.width=
   i/365*100+"%";

  $("progressText").textContent=
   i+" / 365";

  if(i%15===0){

   save();

   await new Promise(r=>
    setTimeout(r,0)
   );
  }
 }

 save();

 render();

 $("status").textContent=
  "✓ All 365 pages saved";

 setTimeout(()=>{
  $("progress").style.display="none";
 },1500);
}

/* CLEAR */

function clearAll(){

 if(!confirm(
  "Delete all saved pages?"
 ))return;

 pages={};

 localStorage.removeItem(KEY);

 $("date").value=
  "2027-01-01";

 load();

 $("status").textContent=
  "All pages cleared";
}

/* PDF */

async function downloadPDF(){

 saveCurrent();

 let count=
  parseInt($("pdfPages").value,10);

 if(!Number.isFinite(count))
  count=10;

 count=
  Math.max(1,Math.min(10,count));

 $("pdfPages").value=count;

 const dates=
  Object.keys(pages)
  .filter(k=>
   k>="2027-01-01"&&
   k<="2027-12-31"
  )
  .sort();

 if(!dates.length){

  alert(
   "Generate at least one page first."
  );

  return;
 }

 let start=
  dates.indexOf($("date").value);

 if(start<0)
  start=0;

 const selected=
  dates.slice(start,start+count);

 if(!selected.length){

  alert(
   "No saved pages available."
  );

  return;
 }

 if(!confirm(
  "Create PDF with "+
  selected.length+
  " page(s)?\nMaximum 10 pages."
 ))return;

 const oldDate=$("date").value;

 const {jsPDF}=window.jspdf;

 const pdf=new jsPDF({
  orientation:"landscape",
  unit:"in",
  format:[9,5.625],
  compress:true
 });

 $("progress").style.display="block";

 try{

  if(document.fonts)
   await document.fonts.ready;

  for(let i=0;i<selected.length;i++){

   const k=selected[i];
   const p=getPage(k);
   const d=getDate(k);

   $("day").textContent=
    String(d.getDate()).padStart(2,"0");

   $("month").textContent=
    d.toLocaleString("en",{
     month:"long"
    }).toUpperCase();

   $("english").textContent=p.english;
   $("tamil").textContent=p.tamil;
   $("sinhala").textContent=p.sinhala;

   $("englishSize").value=
    p.sizes.english;

   $("tamilSize").value=
    p.sizes.tamil;

   $("sinhalaSize").value=
    p.sizes.sinhala;

   $("calendar").className=
    "calendar m"+(d.getMonth()+1);

   applySize();

   await new Promise(r=>
    requestAnimationFrame(r)
   );

   await new Promise(r=>
    requestAnimationFrame(r)
   );

   fitAll();

   await new Promise(r=>
    requestAnimationFrame(r)
   );

   const canvas=
    await html2canvas(
     $("calendar"),
     {
      scale:3,
      useCORS:true,
      backgroundColor:null,
      logging:false
     }
    );

   if(i>0)
    pdf.addPage(
     [9,5.625],
     "landscape"
    );

   pdf.addImage(
    canvas.toDataURL(
     "image/jpeg",
     .95
    ),
    "JPEG",
    0,
    0,
    9,
    5.625,
    undefined,
    "FAST"
   );

   $("progressFill").style.width=
    (i+1)/selected.length*100+"%";

   $("progressText").textContent=
    (i+1)+" / "+selected.length;

   await new Promise(r=>
    setTimeout(r,30)
   );
  }

  pdf.save(
   "Bible-Calendar-2027.pdf"
  );

  $("status").textContent=
   "✓ "+selected.length+
   " PDF page(s) downloaded successfully";

 }catch(e){

  console.error(e);

  $("status").textContent=
   "PDF creation failed.";

  alert(
   "PDF creation failed. Please try again."
  );
 }

 $("date").value=oldDate;

 load();

 setTimeout(()=>{
  $("progress").style.display=
   "none";
 },1000);
}

load();
</script>
