<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin | CreateLK Academy</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#fff;
    padding:18px 20px;
    border-bottom:1px solid #ddd;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.box,.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #e5e7eb;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0 12px;
    border:1px solid #ccc;
    border-radius:7px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
}

.load{
    background:#155eef;
    color:#fff;
}

.view{
    background:#475467;
    color:#fff;
}

.approve{
    background:#16a34a;
    color:#fff;
}

.reject{
    background:#dc2626;
    color:#fff;
}

.pending{
    color:#d97706;
    font-weight:bold;
}

.approved{
    color:#16a34a;
    font-weight:bold;
}

.rejected{
    color:#dc2626;
    font-weight:bold;
}

#message{
    margin-top:10px;
    font-size:14px;
}

.affiliate-success{
    color:#16a34a;
    font-weight:bold;
}

.affiliate-error{
    color:#dc2626;
    font-weight:bold;
}

</style>

</head>


<body>


<header>

<div class="container">

<h2>
📚 CreateLK Academy Admin
</h2>

</div>

</header>


<div class="container">


<div class="box">

<label>
Admin Key
</label>

<input
id="adminKey"
type="password"
placeholder="Enter ADMIN_KEY">

<button
class="load"
onclick="loadPayments()">

Load Payments

</button>

<div id="message"></div>

</div>


<div id="payments"></div>


</div>


<script>


/* =====================================
   PAYMENT API
===================================== */

const API =
"https://createlk-bank-api.createlk.workers.dev";


/* =====================================
   AFFILIATE COMMISSION API
===================================== */

const AFFILIATE_API =
"https://createlk-affiliate-commission.createlk.workers.dev";


/* =====================================
   GET ADMIN KEY
===================================== */

function getKey(){

    return document
        .getElementById("adminKey")
        .value
        .trim();

}


/* =====================================
   MESSAGE
===================================== */

function message(text){

    document
        .getElementById("message")
        .textContent = text;

}


/* =====================================
   LOAD PAYMENTS
===================================== */

async function loadPayments(){

    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Loading..."
    );


    try{

        const response =
            await fetch(
                API +
                "/api/admin/payments",
                {
                    headers:{
                        "X-Admin-Key":key
                    }
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            message(
                data.message ||
                "Unable to load payments."
            );

            return;

        }


        displayPayments(
            data.payments || []
        );


        message(
            "Payments loaded."
        );


    }catch(error){

        console.error(error);


        message(
            "Unable to connect to server."
        );

    }

}


/* =====================================
   DISPLAY PAYMENTS
===================================== */

function displayPayments(list){

    const container =
        document.getElementById(
            "payments"
        );


    container.innerHTML =
        "";


    if(!list.length){

        container.innerHTML =
        `
        <div class="card">

            No payments found.

        </div>
        `;

        return;

    }


    list.forEach(
        p => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML =
            `

            <h3>

                ${safe(
                    p.first_name
                )}

                ${safe(
                    p.last_name
                )}

            </h3>


            <p>

                <b>Email:</b>

                ${safe(
                    p.email
                )}

            </p>


            <p>

                <b>Phone:</b>

                ${safe(
                    p.phone
                )}

            </p>


            <p>

                <b>Student ID:</b>

                ${safe(
                    p.student_id ||
                    "NOT FOUND"
                )}

            </p>


            <p>

                <b>Payment ID:</b>

                ${safe(
                    p.payment_id
                )}

            </p>


            <p>

                <b>Amount:</b>

                LKR
                ${Number(
                    p.amount || 0
                ).toLocaleString()}

            </p>


            <p>

                <b>Payment Date:</b>

                ${safe(
                    p.payment_date ||
                    "-"
                )}

            </p>


            <p>

                <b>Status:</b>

                <span
                    class="${safe(
                        p.status
                    )}">

                    ${safe(
                        p.status
                    )}

                </span>

            </p>


            <button
                class="view"
                onclick="viewSlip(
                    '${encodeURIComponent(
                        p.payment_id
                    )}'
                )">

                👁 View Slip

            </button>


            ${
                String(
                    p.status
                ).toLowerCase()
                === "pending"

                ?

                `

                <button
                    class="approve"
                    onclick="approve(
                        '${encodeURIComponent(
                            p.payment_id
                        )}',

                        ${Number(
                            p.student_id || 0
                        )},

                        ${Number(
                            p.amount || 0
                        )}
                    )">

                    ✓ Approve

                </button>


                <button
                    class="reject"
                    onclick="reject(
                        '${encodeURIComponent(
                            p.payment_id
                        )}'
                    )">

                    ✕ Reject

                </button>

                `

                :

                ""

            }

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================
   VIEW RECEIPT
===================================== */

async function viewSlip(id){

    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Opening receipt..."
    );


    try{

        const response =
            await fetch(

                API +
                "/api/admin/receipt/" +
                id,

                {
                    headers:{
                        "X-Admin-Key":key
                    }
                }

            );


        if(!response.ok){

            const data =
                await response.json();


            message(
                data.message ||
                "Unable to open receipt."
            );

            return;

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        window.open(
            url,
            "_blank"
        );


        message(
            "Receipt opened."
        );


    }catch(error){

        console.error(error);


        message(
            "Unable to open receipt."
        );

    }

}


/* =====================================
   APPROVE PAYMENT
===================================== */

async function approve(
    id,
    studentId,
    amount
){

    if(!confirm(
        "Approve this payment and activate 30-day membership?"
    )){

        return;

    }


    await processPayment(

        "/api/admin/approve/" +
        id,

        studentId,

        amount

    );

}


/* =====================================
   REJECT PAYMENT
===================================== */

async function reject(id){

    if(!confirm(
        "Reject this payment?"
    )){

        return;

    }


    await processPayment(

        "/api/admin/reject/" +
        id

    );

}


/* =====================================
   PROCESS PAYMENT
===================================== */

async function processPayment(
    path,
    studentId = 0,
    amount = 0
){

    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Processing payment..."
    );


    try{


        /* =================================
           STEP 1
           APPROVE / REJECT PAYMENT
        ================================= */

        const response =
            await fetch(

                API +
                path,

                {
                    method:"POST",

                    headers:{
                        "X-Admin-Key":
                            key
                    }

                }

            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            message(
                data.message ||
                "Payment processing failed."
            );

            return;

        }


        /* =================================
           REJECTED PAYMENT
        ================================= */

        if(
            path.includes(
                "/reject/"
            )
        ){

            message(
                "Payment rejected successfully."
            );


            setTimeout(
                loadPayments,
                500
            );


            return;

        }


        /* =================================
           APPROVED PAYMENT
        ================================= */

        message(
            "Payment approved. Processing affiliate commission..."
        );


        /* =================================
           VALIDATE STUDENT
        ================================= */

        if(
            !studentId ||
            studentId <= 0
        ){

            message(
                "Payment approved, but Student ID was not found. Affiliate commission was not processed."
            );


            setTimeout(
                loadPayments,
                1000
            );


            return;

        }


        /* =================================
           VALIDATE AMOUNT
        ================================= */

        if(
            !amount ||
            amount <= 0
        ){

            message(
                "Payment approved, but payment amount was not found. Affiliate commission was not processed."
            );


            setTimeout(
                loadPayments,
                1000
            );


            return;

        }


        /* =================================
           STEP 2
           AFFILIATE COMMISSION
        ================================= */

        const affiliateResponse =
            await fetch(

                AFFILIATE_API +
                "/api/approve-commission",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            student_id:
                                Number(
                                    studentId
                                ),

                            amount:
                                Number(
                                    amount
                                )

                        })

                }

            );


        const affiliateData =
            await affiliateResponse.json();


        /* =================================
           AFFILIATE RESULT
        ================================= */

        if(
            affiliateResponse.ok &&
            affiliateData.success
        ){

            const commission =
                Number(
                    affiliateData
                    ?.commission
                    ?.amount || 0
                );


            message(
                "✅ Payment approved successfully. Affiliate commission of LKR " +
                commission.toLocaleString() +
                " was recorded."
            );

        }else{

            message(
                "✅ Payment approved successfully, but no affiliate commission was recorded. " +
                (
                    affiliateData.message ||
                    "No affiliate referral found."
                )
            );

        }


        /* =================================
           REFRESH
        ================================= */

        setTimeout(
            loadPayments,
            1200
        );


    }catch(error){

        console.error(
            "Payment processing error:",
            error
        );


        message(
            "Payment was processed, but an error occurred while connecting to the affiliate system."
        );


        setTimeout(
            loadPayments,
            1200
        );

    }

}


/* =====================================
   SECURITY
===================================== */

function safe(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>

</html>
