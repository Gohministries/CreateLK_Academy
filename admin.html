<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
padding:18px 20px;
border-bottom:1px solid #ddd;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.box,
.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:15px;
border:1px solid #e5e7eb;
box-shadow:0 2px 8px rgba(16,24,40,.03);
}

input{
width:100%;
padding:12px;
margin:8px 0 12px;
border:1px solid #ccc;
border-radius:7px;
font-size:15px;
}

button{
border:0;
padding:10px 14px;
border-radius:7px;
cursor:pointer;
font-weight:bold;
margin:4px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.load{
background:#155eef;
color:#fff;
}

.view{
background:#475467;
color:#fff;
}

.approve{
background:#16a34a;
color:#fff;
}

.reject{
background:#dc2626;
color:#fff;
}

.pending{
color:#d97706;
font-weight:bold;
}

.approved{
color:#16a34a;
font-weight:bold;
}

.rejected{
color:#dc2626;
font-weight:bold;
}

#message{
margin-top:10px;
font-size:14px;
line-height:1.5;
padding:10px;
border-radius:7px;
}

.info{
background:#eef4ff;
border:1px solid #dbe7ff;
padding:12px;
border-radius:8px;
margin-bottom:15px;
font-size:14px;
}

.success-box{
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
padding:12px;
border-radius:8px;
margin-top:15px;
font-weight:bold;
}

.warning-box{
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
padding:12px;
border-radius:8px;
margin-top:15px;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #f0f2f5;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#667085;
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word;
}

@media(max-width:600px){

.container{
padding:15px;
}

.row{
display:block;
}

.value{
text-align:left;
margin-top:3px;
}

button{
width:100%;
margin:5px 0;
}

}

</style>

</head>

<body>

<header>

<div class="container">

<h2>
📚 CreateLK Academy Admin
</h2>

</div>

</header>


<div class="container">


<!-- ================================
     ADMIN LOGIN
================================ -->

<div class="box">

<label>
<strong>Admin Key</strong>
</label>

<input
id="adminKey"
type="password"
placeholder="Enter ADMIN_KEY"
autocomplete="off">

<button
class="load"
id="loadButton"
onclick="loadPayments()">

🔐 Load Payments

</button>

<div id="message"></div>

</div>


<!-- ================================
     INFORMATION
================================ -->

<div class="info">

<strong>Affiliate Commission:</strong>

20% of an approved Premium payment is
automatically added to the referring
affiliate's commission balance.

<br><br>

<strong>Example:</strong>

LKR 1,500 × 20% = LKR 300 commission.

</div>


<!-- ================================
     PAYMENTS
================================ -->

<div id="payments"></div>


</div>


<script>


/* =========================================
   BANK API
========================================= */

const API =
"https://createlk-bank-api.createlk.workers.dev";


/* =========================================
   ADMIN KEY
========================================= */

function getKey(){

return document
.getElementById("adminKey")
.value
.trim();

}


/* =========================================
   MESSAGE
========================================= */

function message(text,type="normal"){

const box =
document.getElementById("message");

box.textContent = text;

if(type === "success"){

box.style.background =
"#ecfdf3";

box.style.color =
"#166534";

}

else if(type === "error"){

box.style.background =
"#fef2f2";

box.style.color =
"#991b1b";

}

else{

box.style.background =
"#eef4ff";

box.style.color =
"#344054";

}

}


/* =========================================
   LOAD PAYMENTS
========================================= */

async function loadPayments(){

const key =
getKey();

if(!key){

message(
"Please enter the Admin Key.",
"error"
);

return;

}

const button =
document.getElementById(
"loadButton"
);

button.disabled = true;

button.textContent =
"Loading...";

message(
"Loading payments..."
);

try{

const response =
await fetch(
API +
"/api/admin/payments",
{
method:"GET",

headers:{
"X-Admin-Key":key,
"Accept":"application/json"
}

}
);

const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

throw new Error(
"Bank API returned an invalid response."
);

}

if(!response.ok){

throw new Error(
data.message ||
"Unable to load payments."
);

}

if(!data.success){

throw new Error(
data.message ||
"Unable to load payments."
);

}

displayPayments(
data.payments ||
[]
);

message(
"✅ Payments loaded successfully.",
"success"
);

}catch(error){

console.error(error);

message(
error.message ||
"Unable to connect to Bank API.",
"error"
);

}finally{

button.disabled = false;

button.textContent =
"🔐 Load Payments";

}

}


/* =========================================
   DISPLAY PAYMENTS
========================================= */

function displayPayments(list){

const container =
document.getElementById(
"payments"
);

container.innerHTML = "";


if(!list.length){

container.innerHTML = `

<div class="card">

<h3>
📭 No Payments
</h3>

<p>
No payment records were found.
</p>

</div>

`;

return;

}


list.forEach(
p => {

const card =
document.createElement("div");

card.className =
"card";


const status =
String(
p.status || "pending"
).toLowerCase();


const studentId =
Number(
p.student_id || 0
);


const paymentId =
Number(
p.payment_id ||
p.id ||
0
);


const amount =
Number(
p.amount || 0
);


let statusClass =
"pending";

if(status === "approved"){
statusClass =
"approved";
}

if(status === "rejected"){
statusClass =
"rejected";
}


card.innerHTML = `

<h3>
💳 Payment #${paymentId}
</h3>


<div class="row">

<div class="label">
Student
</div>

<div class="value">

${safe(
p.first_name || "-"
)}

${safe(
p.last_name || ""
)}

</div>

</div>


<div class="row">

<div class="label">
Email
</div>

<div class="value">

${safe(
p.email || "-"
)}

</div>

</div>


<div class="row">

<div class="label">
Phone
</div>

<div class="value">

${safe(
p.phone || "-"
)}

</div>

</div>


<div class="row">

<div class="label">
Student ID
</div>

<div class="value">

${studentId || "-"}

</div>

</div>


<div class="row">

<div class="label">
Payment ID
</div>

<div class="value">

${paymentId}

</div>

</div>


<div class="row">

<div class="label">
Amount
</div>

<div class="value">

LKR ${amount.toLocaleString()}

</div>

</div>


<div class="row">

<div class="label">
Payment Reference
</div>

<div class="value">

${safe(
p.payment_reference || "-"
)}

</div>

</div>


<div class="row">

<div class="label">
Payment Date
</div>

<div class="value">

${safe(
p.payment_date ||
p.created_at ||
"-"
)}

</div>

</div>


<div class="row">

<div class="label">
Status
</div>

<div class="value">

<span class="${statusClass}">

${safe(
String(
p.status || "PENDING"
).toUpperCase()
)}

</span>

</div>

</div>


<div>

<button
class="view"
onclick="viewSlip(${paymentId})">

👁 View Receipt

</button>


${
status === "pending"

?

`

<button
class="approve"
onclick="approvePayment(${paymentId})">

✅ Approve Payment

</button>


<button
class="reject"
onclick="rejectPayment(${paymentId})">

❌ Reject Payment

</button>

`

:

""

}

</div>

`;

container.appendChild(card);

}

);

}


/* =========================================
   VIEW RECEIPT
========================================= */

async function viewSlip(paymentId){

const key =
getKey();

if(!key){

message(
"Please enter the Admin Key.",
"error"
);

return;

}

message(
"Opening payment receipt..."
);

try{

const response =
await fetch(

API +
"/api/admin/receipt/" +
encodeURIComponent(
paymentId
),

{
method:"GET",

headers:{
"X-Admin-Key":key
}

}

);


if(!response.ok){

const text =
await response.text();

let data = {};

try{

data =
JSON.parse(text);

}catch(e){}

throw new Error(
data.message ||
"Unable to open receipt."
);

}


const blob =
await response.blob();


const receiptURL =
URL.createObjectURL(
blob
);


window.open(
receiptURL,
"_blank"
);


message(
"✅ Receipt opened.",
"success"
);

}catch(error){

console.error(error);

message(
error.message ||
"Unable to open receipt.",
"error"
);

}

}


/* =========================================
   APPROVE PAYMENT
========================================= */

async function approvePayment(paymentId){

if(!confirm(

"Approve this payment?\n\n" +

"Premium membership will be approved " +
"and the affiliate commission will be " +
"processed automatically."

)){

return;

}


const key =
getKey();

if(!key){

message(
"Please enter the Admin Key.",
"error"
);

return;

}


message(
"Approving payment..."
);


try{

const response =
await fetch(

API +
"/api/admin/payment/approve",

{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
key
},

body:
JSON.stringify({

payment_id:
Number(paymentId)

})

}

);


const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

throw new Error(
"Bank API returned an invalid response."
);

}


if(!response.ok){

throw new Error(
data.message ||
"Payment approval failed."
);

}


if(!data.success){

throw new Error(
data.message ||
"Payment approval failed."
);

}


/* =========================================
   AFFILIATE RESULT
========================================= */

const affiliate =
data.affiliate_commission ||
null;


if(
affiliate &&
affiliate.processed
){

const commission =
Number(
affiliate.commission_amount || 0
);


message(

"✅ Payment approved successfully. " +

"Affiliate commission: LKR " +

commission.toLocaleString(),

"success"

);

}

else if(
affiliate &&
affiliate.already_processed
){

const commission =
Number(
affiliate.amount || 0
);


message(

"✅ Payment was already approved. " +

"Affiliate commission was already processed: LKR " +

commission.toLocaleString(),

"success"

);

}

else{

message(

"✅ Payment approved successfully. " +

(
affiliate?.reason ||
"No affiliate commission was processed."
),

"success"

);

}


/* =========================================
   REFRESH
========================================= */

setTimeout(
function(){

loadPayments();

},
1200
);


}catch(error){

console.error(
"Approval error:",
error
);

message(

error.message ||
"Unable to connect to Bank API.",

"error"

);

}

}


/* =========================================
   REJECT PAYMENT
========================================= */

async function rejectPayment(paymentId){

if(!confirm(
"Reject this payment?"
)){

return;

}


const key =
getKey();

if(!key){

message(
"Please enter the Admin Key.",
"error"
);

return;

}


message(
"Rejecting payment..."
);


try{

const response =
await fetch(

API +
"/api/admin/payment/reject",

{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
key
},

body:
JSON.stringify({

payment_id:
Number(paymentId)

})

}

);


const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

throw new Error(
"Bank API returned an invalid response."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Payment rejection failed."
);

}


message(
"✅ Payment rejected.",
"success"
);


setTimeout(
function(){

loadPayments();

},
700
);


}catch(error){

console.error(error);

message(
error.message ||
"Unable to reject payment.",
"error"
);

}

}


/* =========================================
   SAFE HTML
========================================= */

function safe(value){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>


</body>

</html>
