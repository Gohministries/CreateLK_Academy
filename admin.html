<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin | CreateLK Academy</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#fff;
    padding:18px 20px;
    border-bottom:1px solid #ddd;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.box,
.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #e5e7eb;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0 12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
}

.load{
    background:#155eef;
    color:#fff;
}

.view{
    background:#475467;
    color:#fff;
}

.approve{
    background:#16a34a;
    color:#fff;
}

.reject{
    background:#dc2626;
    color:#fff;
}

.pending{
    color:#d97706;
    font-weight:bold;
}

.approved{
    color:#16a34a;
    font-weight:bold;
}

.rejected{
    color:#dc2626;
    font-weight:bold;
}

#message{
    margin-top:10px;
    font-size:14px;
    line-height:1.5;
}

.info{
    background:#eef4ff;
    border:1px solid #dbe7ff;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
}

.affiliate-ok{
    color:#16a34a;
    font-weight:bold;
}

.affiliate-none{
    color:#667085;
    font-weight:bold;
}

.affiliate-error{
    color:#d97706;
    font-weight:bold;
}

</style>

</head>


<body>


<header>

<div class="container">

<h2>
📚 CreateLK Academy Admin
</h2>

</div>

</header>


<div class="container">


<div class="box">

<label>
Admin Key
</label>

<input
id="adminKey"
type="password"
placeholder="Enter ADMIN_KEY">

<button
class="load"
onclick="loadPayments()">

Load Payments

</button>

<div id="message"></div>

</div>


<div class="info">

<strong>Affiliate:</strong>

Affiliate commission is processed separately
after a payment is successfully approved.

Premium membership approval is not dependent
on the affiliate system.

</div>


<div id="payments"></div>


</div>


<script>


/* =====================================
   PAYMENT API
===================================== */

const API =
"https://createlk-bank-api.createlk.workers.dev";


/* =====================================
   EXISTING AFFILIATE WORKER
===================================== */

const AFFILIATE_API =
"https://createlk-affiliate-commission.createlk.workers.dev";


/* =====================================
   ADMIN KEY
===================================== */

function getKey(){

    return document
        .getElementById("adminKey")
        .value
        .trim();

}


/* =====================================
   MESSAGE
===================================== */

function message(text){

    document
        .getElementById("message")
        .textContent = text;

}


/* =====================================
   LOAD PAYMENTS
===================================== */

async function loadPayments(){

    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Loading payments..."
    );


    try{

        const response =
            await fetch(
                API +
                "/api/admin/payments",
                {
                    method:"GET",

                    headers:{
                        "X-Admin-Key":
                            key
                    }
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            message(
                data.message ||
                "Unable to load payments."
            );

            return;

        }


        displayPayments(
            data.payments || []
        );


        message(
            "Payments loaded."
        );


    }catch(error){

        console.error(
            error
        );


        message(
            "Unable to connect to payment server."
        );

    }

}


/* =====================================
   DISPLAY PAYMENTS
===================================== */

function displayPayments(list){

    const container =
        document.getElementById(
            "payments"
        );


    container.innerHTML =
        "";


    if(!list.length){

        container.innerHTML =
        `
        <div class="card">

            No payments found.

        </div>
        `;

        return;

    }


    list.forEach(
        p => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const status =
                String(
                    p.status || ""
                ).toLowerCase();


            const studentId =
                Number(
                    p.student_id || 0
                );


            const amount =
                Number(
                    p.amount || 0
                );


            card.innerHTML =
            `

            <h3>

                ${safe(
                    p.first_name
                )}

                ${safe(
                    p.last_name
                )}

            </h3>


            <p>

                <b>Email:</b>

                ${safe(
                    p.email
                )}

            </p>


            <p>

                <b>Phone:</b>

                ${safe(
                    p.phone
                )}

            </p>


            <p>

                <b>Student ID:</b>

                ${
                    studentId > 0

                    ? safe(
                        String(
                            studentId
                        )
                    )

                    : `
                    <span
                        style="
                        color:#d97706;
                        font-weight:bold;
                        ">
                        Not available
                    </span>
                    `
                }

            </p>


            <p>

                <b>Payment ID:</b>

                ${safe(
                    p.payment_id
                )}

            </p>


            <p>

                <b>Amount:</b>

                LKR
                ${amount.toLocaleString()}

            </p>


            <p>

                <b>Payment Date:</b>

                ${safe(
                    p.payment_date || "-"
                )}

            </p>


            <p>

                <b>Status:</b>

                <span
                    class="${safe(status)}">

                    ${safe(
                        p.status
                    )}

                </span>

            </p>


            <button
                class="view"
                onclick="viewSlip(
                    '${encodeURIComponent(
                        p.payment_id
                    )}'
                )">

                👁 View Slip

            </button>


            ${
                status === "pending"

                ?

                `

                <button
                    class="approve"
                    onclick="approvePayment(
                        '${encodeURIComponent(
                            p.payment_id
                        )}',

                        ${studentId},

                        ${amount}
                    )">

                    ✓ Approve

                </button>


                <button
                    class="reject"
                    onclick="rejectPayment(
                        '${encodeURIComponent(
                            p.payment_id
                        )}'
                    )">

                    ✕ Reject

                </button>

                `

                :

                ""

            }

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================
   VIEW RECEIPT
===================================== */

async function viewSlip(id){

    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Opening receipt..."
    );


    try{

        const response =
            await fetch(

                API +
                "/api/admin/receipt/" +
                id,

                {
                    method:"GET",

                    headers:{
                        "X-Admin-Key":
                            key
                    }
                }

            );


        if(!response.ok){

            let data = {};

            try{

                data =
                    await response.json();

            }catch(e){}


            message(
                data.message ||
                "Unable to open receipt."
            );

            return;

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        window.open(
            url,
            "_blank"
        );


        message(
            "Receipt opened."
        );


    }catch(error){

        console.error(
            error
        );


        message(
            "Unable to open receipt."
        );

    }

}


/* =====================================
   APPROVE PAYMENT
===================================== */

async function approvePayment(
    paymentId,
    studentId,
    amount
){

    if(!confirm(
        "Approve this payment and activate 30-day membership?"
    )){

        return;

    }


    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Approving payment..."
    );


    try{


        /* =================================
           STEP 1
           EXISTING PAYMENT APPROVAL
        ================================= */

        const response =
            await fetch(

                API +
                "/api/admin/approve/" +
                paymentId,

                {

                    method:"POST",

                    headers:{
                        "X-Admin-Key":
                            key
                    }

                }

            );


        const data =
            await response.json();


        /*
           IMPORTANT:

           If payment approval fails,
           STOP HERE.

           Affiliate is NOT called.
        */

        if(
            !response.ok ||
            !data.success
        ){

            message(
                data.message ||
                "Payment approval failed."
            );

            return;

        }


        /* =================================
           PAYMENT IS NOW APPROVED
        ================================= */

        message(
            "✅ Payment approved successfully."
        );


        /*
           DO NOT let affiliate errors
           affect Premium membership.

           Premium approval has already
           completed above.
        */


        /* =================================
           STEP 2
           AFFILIATE PROCESS
        ================================= */

        if(
            !studentId ||
            studentId <= 0
        ){

            console.warn(
                "Student ID unavailable."
            );


            message(
                "✅ Payment approved. Affiliate commission could not be checked because Student ID was unavailable."
            );


            setTimeout(
                loadPayments,
                1000
            );


            return;

        }


        if(
            !amount ||
            amount <= 0
        ){

            console.warn(
                "Payment amount unavailable."
            );


            message(
                "✅ Payment approved. Affiliate commission could not be checked because payment amount was unavailable."
            );


            setTimeout(
                loadPayments,
                1000
            );


            return;

        }


        message(
            "Payment approved. Checking affiliate referral..."
        );


        try{


            const affiliateResponse =
                await fetch(

                    AFFILIATE_API +
                    "/api/approve-commission",

                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                student_id:
                                    Number(
                                        studentId
                                    ),

                                amount:
                                    Number(
                                        amount
                                    )

                            })

                        }

                    );


            const affiliateData =
                await affiliateResponse.json();


            /* =================================
               AFFILIATE SUCCESS
            ================================= */

            if(
                affiliateResponse.ok &&
                affiliateData.success
            ){

                const commission =
                    Number(
                        affiliateData
                        ?.commission
                        ?.amount || 0
                    );


                message(
                    "✅ Payment approved. Affiliate commission of LKR " +
                    commission.toLocaleString() +
                    " recorded."
                );


            }

            /* =================================
               NO REFERRAL
            ================================= */

            else{

                message(
                    "✅ Payment approved. No pending affiliate referral was processed."
                );


                console.log(
                    "Affiliate response:",
                    affiliateData
                );

            }


        }catch(
            affiliateError
        ){

            /*
               IMPORTANT:

               Affiliate failure does NOT
               affect Premium approval.
            */

            console.error(
                "Affiliate error:",
                affiliateError
            );


            message(
                "✅ Payment approved successfully. Affiliate commission could not be processed at this time."
            );

        }


        /* =================================
           REFRESH PAYMENT LIST
        ================================= */

        setTimeout(
            loadPayments,
            1200
        );


    }catch(error){

        console.error(
            "Payment approval error:",
            error
        );


        message(
            "Unable to complete payment approval request."
        );

    }

}


/* =====================================
   REJECT PAYMENT
===================================== */

async function rejectPayment(
    paymentId
){

    if(!confirm(
        "Reject this payment?"
    )){

        return;

    }


    const key =
        getKey();


    if(!key){

        message(
            "Enter Admin Key."
        );

        return;

    }


    message(
        "Rejecting payment..."
    );


    try{

        const response =
            await fetch(

                API +
                "/api/admin/reject/" +
                paymentId,

                {

                    method:"POST",

                    headers:{
                        "X-Admin-Key":
                            key
                    }

                }

            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            message(
                data.message ||
                "Payment rejection failed."
            );

            return;

        }


        message(
            "Payment rejected successfully."
        );


        setTimeout(
            loadPayments,
            500
        );


    }catch(error){

        console.error(
            error
        );


        message(
            "Unable to connect to payment server."
        );

    }

}


/* =====================================
   SECURITY
===================================== */

function safe(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>


</body>

</html>
