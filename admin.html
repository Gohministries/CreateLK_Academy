<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
 box-sizing:border-box
}

body{
 margin:0;
 padding:12px;
 background:#eef1f4;
 font-family:Arial,sans-serif;
 color:#172033
}

.app{
 max-width:1200px;
 margin:auto
}


/* =========================
   CALENDAR
========================= */

.calendar{
 position:relative;
 width:100%;
 aspect-ratio:16/10;
 background:#FAF8F2;
 border:1px solid #C8B98A;
 outline:5px solid #F1ECE0;
 overflow:hidden;
 margin:0 auto 18px;
 box-shadow:0 5px 20px #0001
}


/* =========================
   PHOTO
========================= */

.photo{
 position:absolute;
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 overflow:hidden;
 border-radius:8px;
 background:#ddd;
 z-index:1
}

.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block
}


/* =========================
   CONTENT
========================= */

.content{
 position:absolute;
 left:37%;
 right:5%;
 top:4%;
 bottom:4%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
 z-index:2
}


/* =========================
   DATE
========================= */

.dateRow{
 height:9%;
 min-height:30px;
 display:flex;
 align-items:center;
 border-bottom:2px solid #C49A45;
 color:#17365D;
 position:relative;
 overflow:hidden
}


/* MONTH + DAY TOGETHER */

.dateGroup{
 display:flex;
 align-items:center;
 gap:8px;
 min-width:0
}

.month{
 font-size:clamp(16px,2.3vw,28px);
 font-weight:bold;
 letter-spacing:.5px
}

.day{
 font-size:clamp(15px,2vw,24px);
 font-weight:bold
}


/* =========================
   CROSS
========================= */

.cross{
 position:absolute;
 right:2px;
 top:1px;
 color:#C49A45;
 font:15px Georgia,serif;
 z-index:5;
 pointer-events:none
}


/* =========================
   VERSES
========================= */

.verses{
 flex:1;
 min-height:0;
 padding-top:5px;
 overflow:hidden
}

#verseBox{
 height:100%;
 display:grid;
 grid-template-rows:repeat(3,minmax(0,1fr));
 overflow:hidden
}

.section{
 min-height:0;
 min-width:0;
 overflow:hidden;
 padding:4px 8px;
 display:flex;
 flex-direction:column;
 justify-content:center
}

.section+.section{
 border-top:1px solid #E5DFD2
}

.text{
 width:100%;
 min-height:0;
 max-width:100%;
 overflow:hidden;
 overflow-wrap:anywhere;
 word-break:normal;
 white-space:normal;
 display:block
}


/* =========================
   ENGLISH
========================= */

#english{
 font-family:Georgia,"Times New Roman",serif;
 font-size:25px;
 line-height:1.12;
 font-weight:600;
 color:#172033
}


/* =========================
   TAMIL
========================= */

#tamil{
 font-family:
  "Noto Sans Tamil",
  "Nirmala UI",
  sans-serif;
 font-size:18px;
 line-height:1.10;
 font-weight:500;
 color:#7A4E2D;
 padding:3px 0
}


/* =========================
   SINHALA
========================= */

#sinhala{
 font-family:
  "Noto Sans Sinhala",
  "Nirmala UI",
  sans-serif;
 font-size:18px;
 line-height:1.12;
 font-weight:500;
 color:#35634A;
 padding:3px 0
}


/* =========================
   CONTROLS
========================= */

.controls{
 background:#fff;
 padding:14px;
 border-radius:12px;
 box-shadow:0 3px 15px #0001
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px;
 min-width:0
}

.full{
 grid-column:1/-1
}

label{
 font-size:13px;
 font-weight:bold;
 color:#38455a
}

input,
textarea{
 width:100%;
 border:1px solid #ccd2da;
 border-radius:7px;
 padding:9px 10px;
 font-size:14px;
 outline:none;
 font-family:inherit
}

input:focus,
textarea:focus{
 border-color:#C49A45;
 outline:none
}

textarea{
 resize:vertical;
 min-height:65px
}


/* =========================
   ADJUSTMENT
========================= */

.adjustment{
 margin:0 0 12px 0;
 padding:12px;
 background:#f7f8fa;
 border:1px solid #e0e3e8;
 border-radius:8px
}

.adjustmentTitle{
 font-size:14px;
 font-weight:bold;
 color:#17365D;
 margin-bottom:10px
}

.adjustGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.rangeBox{
 display:flex;
 flex-direction:column;
 gap:5px;
 min-width:0
}

.rangeTop{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 font-weight:bold
}

.rangeTop span{
 color:#17365D
}

input[type=range]{
 padding:0;
 accent-color:#17365D
}


/* =========================
   BUTTONS
========================= */

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px
}

button{
 border:0;
 border-radius:7px;
 padding:10px 15px;
 font-weight:bold;
 cursor:pointer;
 background:#17365D;
 color:white
}

button.secondary{
 background:#6d7480
}

button.gold{
 background:#C49A45
}

button:disabled{
 opacity:.5;
 cursor:not-allowed
}


/* =========================
   GENERATED
========================= */

.generated{
 margin-top:12px;
 padding:10px;
 background:#f7f8fa;
 border:1px solid #e0e3e8;
 border-radius:8px
}

.generatedTitle{
 font-size:13px;
 font-weight:bold;
 color:#17365D
}

#generatedList{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:7px
}

.item{
 padding:5px 8px;
 border-radius:5px;
 background:#e9edf2;
 font-size:12px;
 font-weight:bold
}

.status{
 margin-top:7px;
 font-size:12px;
 color:#566174
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

 body{
  padding:8px
 }

 .grid,
 .adjustGrid{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

 .photo{
  left:3.5%;
  width:30%
 }

 .content{
  left:36%;
  right:4%
 }

 .section{
  padding:3px 5px
 }

 #english{
  font-size:19px
 }

 #tamil,
 #sinhala{
  font-size:15px
 }

 .buttons button{
  flex:1
 }

 .dateGroup{
  gap:5px
 }

 .cross{
  right:2px;
  top:1px;
  font-size:13px
 }

}


/* =========================
   PRINT
========================= */

@media print{

 @page{
  size:9in 5.625in landscape;
  margin:0
 }

 body{
  padding:0;
  background:white
 }

 .controls{
  display:none
 }

 .calendar{
  width:9in;
  height:5.625in;
  margin:0;
  outline:none;
  box-shadow:none
 }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     CALENDAR
========================= -->

<div class="calendar" id="calendar">

 <div class="photo">

  <img
   id="photoPreview"
   alt="">

 </div>


 <div class="content">


  <!-- DATE -->

  <div class="dateRow">

   <div class="dateGroup">

    <div
     class="month"
     id="monthText">
     JANUARY
    </div>

    <div
     class="day"
     id="dayText">
     1
    </div>

   </div>


   <div class="cross">
    ✝
   </div>

  </div>


  <!-- VERSES -->

  <div class="verses">

   <div id="verseBox">


    <!-- ENGLISH -->

    <section class="section">

     <div
      class="text"
      id="english">

      Your word is a lamp for my feet, a light on my path.

     </div>

    </section>


    <!-- TAMIL -->

    <section class="section">

     <div
      class="text"
      id="tamil">

      உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.

     </div>

    </section>


    <!-- SINHALA -->

    <section class="section">

     <div
      class="text"
      id="sinhala">

      ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.

     </div>

    </section>


   </div>

  </div>


 </div>

</div>



<!-- =========================
     ADJUSTMENT
========================= -->

<div class="adjustment">

 <div class="adjustmentTitle">
  Adjustment — Reduce up to 0.50px
 </div>

 <div class="adjustGrid">


  <!-- FIRST -->

  <div class="rangeBox">

   <div class="rangeTop">

    <span>
     First
    </span>

    <span id="englishSizeValue">
     25px
    </span>

   </div>

   <input
    type="range"
    id="englishSize"
    min="0.5"
    max="30"
    step="0.5"
    value="25">

  </div>


  <!-- SECOND -->

  <div class="rangeBox">

   <div class="rangeTop">

    <span>
     Second
    </span>

    <span id="tamilSizeValue">
     18px
    </span>

   </div>

   <input
    type="range"
    id="tamilSize"
    min="0.5"
    max="24"
    step="0.5"
    value="18">

  </div>


  <!-- THIRD -->

  <div class="rangeBox">

   <div class="rangeTop">

    <span>
     Third
    </span>

    <span id="sinhalaSizeValue">
     18px
    </span>

   </div>

   <input
    type="range"
    id="sinhalaSize"
    min="0.5"
    max="24"
    step="0.5"
    value="18">

  </div>


 </div>

</div>



<!-- =========================
     CONTROLS
========================= -->

<div class="controls">


 <div class="grid">


  <!-- DATE -->

  <div class="field">

   <label>
    Date
   </label>

   <input
    type="date"
    id="date"
    min="2027-01-01"
    max="2027-12-31"
    value="2027-01-01">

  </div>


  <!-- PHOTO -->

  <div class="field">

   <label>
    Calendar Photo
   </label>

   <input
    type="file"
    id="photo"
    accept="image/*">

  </div>


  <!-- ENGLISH -->

  <div class="field full">

   <label>
    English Bible Verse
   </label>

   <textarea
    id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>

  </div>


  <!-- TAMIL -->

  <div class="field full">

   <label>
    Tamil Bible Verse
   </label>

   <textarea
    id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>

  </div>


  <!-- SINHALA -->

  <div class="field full">

   <label>
    Sinhala Bible Verse
   </label>

   <textarea
    id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>

  </div>


 </div>



 <!-- =========================
      BUTTONS
 ========================= -->

 <div class="buttons">


  <button
   class="secondary"
   onclick="move(-1)">

   ← Previous

  </button>


  <button
   class="secondary"
   onclick="move(1)">

   Next →

  </button>


  <button
   class="gold"
   id="generateBtn"
   onclick="generate(true)">

   Generate

  </button>


  <button
   id="downloadBtn"
   onclick="downloadGenerated()">

   Download Generated

  </button>


 </div>



 <!-- =========================
      GENERATED
 ========================= -->

 <div class="generated">


  <div class="generatedTitle">
   Generated Pages
  </div>


  <div id="generatedList"></div>


  <div
   class="status"
   id="status">

   Generated: 0/10

  </div>


 </div>


</div>

</div>



<script>

const $=id=>
 document.getElementById(id);


const KEY=
 "BibleCalendar2027";


let selected=[];

let photoData="";


/* =========================
   DATE
========================= */

function dateInfo(v){

 const d=
  new Date(
   v+"T00:00:00"
  );


 const months=[

  "JANUARY",
  "FEBRUARY",
  "MARCH",
  "APRIL",
  "MAY",
  "JUNE",
  "JULY",
  "AUGUST",
  "SEPTEMBER",
  "OCTOBER",
  "NOVEMBER",
  "DECEMBER"

 ];


 return[

  months[d.getMonth()],

  d.getDate()

 ];

}



/* =========================
   SAVE
========================= */

function save(){

 try{

  localStorage.setItem(

   KEY,

   JSON.stringify({

    selected,

    photoData,

    date:$("date").value,

    english:
     $("englishInput").value,

    tamil:
     $("tamilInput").value,

    sinhala:
     $("sinhalaInput").value,

    englishSize:
     $("englishSize").value,

    tamilSize:
     $("tamilSize").value,

    sinhalaSize:
     $("sinhalaSize").value

   })

  );

 }catch(e){}

}



/* =========================
   LOAD
========================= */

function load(){

 try{

  const x=
   JSON.parse(
    localStorage.getItem(KEY)||"null"
   );


  if(!x)return;


  selected=
   Array.isArray(x.selected)
    ?x.selected.slice(0,10)
    :[];


  photoData=
   x.photoData||"";


  if(x.date)
   $("date").value=x.date;


  if(x.english!=null)
   $("englishInput").value=
    x.english;


  if(x.tamil!=null)
   $("tamilInput").value=
    x.tamil;


  if(x.sinhala!=null)
   $("sinhalaInput").value=
    x.sinhala;


  if(x.englishSize)
   $("englishSize").value=
    x.englishSize;


  if(x.tamilSize)
   $("tamilSize").value=
    x.tamilSize;


  if(x.sinhalaSize)
   $("sinhalaSize").value=
    x.sinhalaSize;


  if(photoData)
   $("photoPreview").src=
    photoData;


 }catch(e){}

}



/* =========================
   GENERATED LIST
========================= */

function render(){

 $("generatedList").innerHTML=

  selected.map((x,i)=>{

   const d=
    new Date(
     x+"T00:00:00"
    );


   return `

    <div class="item">

     ${i+1}/10
     ${d.toLocaleDateString("en-GB")}

    </div>

   `;

  }).join("");


 $("status").textContent=
  `Generated: ${selected.length}/10`;

}



/* =========================
   ADD DATE
========================= */

function addDate(v){

 if(selected.includes(v)){

  render();

  return true;

 }


 if(selected.length>=10){

  alert(
   "Maximum 10 generated pages."
  );

  return false;

 }


 selected.push(v);

 save();

 render();

 return true;

}



/* =========================
   MANUAL FONT SIZE
========================= */

function applySizes(){

 $("english").style.fontSize=
  $("englishSize").value+"px";


 $("tamil").style.fontSize=
  $("tamilSize").value+"px";


 $("sinhala").style.fontSize=
  $("sinhalaSize").value+"px";


 $("englishSizeValue").textContent=
  $("englishSize").value+"px";


 $("tamilSizeValue").textContent=
  $("tamilSize").value+"px";


 $("sinhalaSizeValue").textContent=
  $("sinhalaSize").value+"px";

}



/* =========================
   AUTO FIT
========================= */

async function fit(id){

 const el=
  $(id);


 const section=
  el.closest(".section");


 if(!el||!section)
  return;


 let size=
  parseFloat(
   el.style.fontSize
  );


 if(!size)
  return;


 /* MINIMUM 0.50px */

 const min=0.5;


 if(document.fonts)
  await document.fonts.ready;



 function apply(n){

  el.style.fontSize=
   n+"px";


  if(id==="english"){

   el.style.lineHeight=
    "1.12";

  }
  else if(id==="tamil"){

   el.style.lineHeight=
    n<=12
     ?"1.08"
     :"1.10";

  }
  else{

   el.style.lineHeight=
    n<=12
     ?"1.08"
     :"1.12";

  }


  void el.offsetHeight;

 }



 function fits(n){

  apply(n);


  return(
   el.scrollHeight<=
   section.clientHeight-8
  );

 }


 let low=min;

 let high=size;

 let best=min;


 if(fits(high)){

  best=high;

 }
 else{

  for(
   let i=0;
   i<60;
   i++
  ){

   const mid=
    (low+high)/2;


   if(fits(mid)){

    best=mid;

    low=mid;

   }
   else{

    high=mid;

   }

  }

 }


 best=
  Math.floor(
   best*10
  )/10;


 apply(best);


 while(

  best>min &&

  el.scrollHeight>
   section.clientHeight-8

 ){

  best=
   Math.max(

    min,

    Math.round(
     (best-.1)*10
    )/10

   );


  apply(best);

 }


 const rangeId=

  id==="english"
   ?"englishSize"
   :id==="tamil"
    ?"tamilSize"
    :"sinhalaSize";


 const valueId=

  id==="english"
   ?"englishSizeValue"
   :id==="tamil"
    ?"tamilSizeValue"
    :"sinhalaSizeValue";


 $(rangeId).value=
  best.toFixed(1);


 $(valueId).textContent=
  best.toFixed(1)+"px";

}



/* =========================
   GENERATE
========================= */

async function generate(add=false){

 const v=
  $("date").value;


 if(!v)
  return;


 const info=
  dateInfo(v);


 $("monthText").textContent=
  info[0];


 $("dayText").textContent=
  info[1];


 $("english").textContent=
  $("englishInput").value.trim();


 $("tamil").textContent=
  $("tamilInput").value.trim();


 $("sinhala").textContent=
  $("sinhalaInput").value.trim();


 applySizes();


 await new Promise(
  r=>requestAnimationFrame(r)
 );


 await fit("english");

 await fit("tamil");

 await fit("sinhala");


 if(add){

  addDate(v);

 }
 else{

  save();

  render();

 }

}



/* =========================
   PREVIOUS / NEXT
========================= */

async function move(n){

 const d=
  new Date(
   $("date").value+
   "T00:00:00"
  );


 d.setDate(
  d.getDate()+n
 );


 if(
  d.getFullYear()!==2027
 )
  return;


 $("date").value=

  d.getFullYear()+
  "-"+
  String(
   d.getMonth()+1
  ).padStart(2,"0")+
  "-"+
  String(
   d.getDate()
  ).padStart(2,"0");


 await generate(false);

}



/* =========================
   PHOTO
========================= */

$("photo").onchange=e=>{

 const f=
  e.target.files[0];


 if(!f)
  return;


 const r=
  new FileReader();


 r.onload=()=>{

  photoData=
   r.result;


  $("photoPreview").src=
   photoData;


  save();

 };


 r.readAsDataURL(f);

};



/* =========================
   ADJUSTMENT
========================= */

[

 "englishSize",
 "tamilSize",
 "sinhalaSize"

].forEach(id=>{


 $(id).addEventListener(

  "input",

  async()=>{


   applySizes();


   await new Promise(
    r=>requestAnimationFrame(r)
   );


   const lang=

    id==="englishSize"
     ?"english"
     :id==="tamilSize"
      ?"tamil"
      :"sinhala";


   await fit(lang);


   save();

  }

 );

});



/* =========================
   INPUT SAVE
========================= */

[

 "date",
 "englishInput",
 "tamilInput",
 "sinhalaInput"

].forEach(id=>{

 $(id).addEventListener(
  "input",
  save
 );

});



/* =========================
   CAPTURE
========================= */

async function capture(v){

 $("date").value=
  v;


 await generate(false);


 await new Promise(
  r=>setTimeout(r,200)
 );


 const canvas=
  await html2canvas(

   $("calendar"),

   {

    scale:3,

    useCORS:true,

    backgroundColor:
     "#FAF8F2",

    logging:false

   }

  );


 return canvas.toDataURL(
  "image/png",
  1
 );

}



/* =========================
   DOWNLOAD GENERATED
========================= */

async function downloadGenerated(){

 if(!selected.length){

  alert(
   "Please generate at least one page first."
  );

  return;

 }


 if(!photoData){

  alert(
   "Please upload a calendar photo first."
  );

  return;

 }


 const btn=
  $("downloadBtn");


 btn.disabled=true;


 btn.textContent=
  "Creating PDF...";


 try{

  const {jsPDF}=
   window.jspdf;


  const pdf=
   new jsPDF({

    orientation:
     "landscape",

    unit:
     "in",

    format:[
     9,
     5.625
    ],

    compress:true

   });


  const oldDate=
   $("date").value;


  for(

   let i=0;

   i<selected.length;

   i++

  ){

   const img=
    await capture(
     selected[i]
    );


   if(i){

    pdf.addPage(
     [9,5.625],
     "landscape"
    );

   }


   pdf.addImage(

    img,

    "PNG",

    0,
    0,

    9,
    5.625,

    undefined,

    "FAST"

   );


   $("status").textContent=

    `Creating PDF: ${
      i+1
    }/${selected.length}`;

  }


  pdf.save(
   "365-Bible-Calendar-2027.pdf"
  );


  $("date").value=
   oldDate;


  await generate(false);


 }
 catch(e){

  console.error(e);


  alert(
   "PDF creation failed."
  );

 }
 finally{

  btn.disabled=false;


  btn.textContent=
   "Download Generated";


  render();

 }

}



/* =========================
   START
========================= */

window.onload=async()=>{

 load();

 render();

 applySizes();

 await generate(false);

};



/* =========================
   FONT READY
========================= */

if(document.fonts){

 document.fonts.ready.then(
  ()=>generate(false)
 );

}



/* =========================
   RESIZE
========================= */

window.onresize=()=>{

 clearTimeout(
  window._resize
 );


 window._resize=

  setTimeout(

   ()=>generate(false),

   150

  );

};

</script>
