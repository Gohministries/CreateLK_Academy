<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033
}

.app{
 max-width:1100px;
 margin:auto
}

h2{
 text-align:center;
 margin:0 0 15px
}

.controls{
 background:#fff;
 padding:15px;
 border-radius:12px;
 box-shadow:0 3px 15px #0001;
 margin-bottom:18px
}

.row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}

label{
 font-size:13px;
 font-weight:bold
}

input,textarea{
 width:100%;
 margin-top:5px;
 padding:9px;
 border:1px solid #ccd3df;
 border-radius:7px;
 font:inherit
}

textarea{
 height:70px;
 resize:vertical
}

.buttons{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap
}

button{
 border:0;
 padding:10px 15px;
 border-radius:7px;
 background:#172033;
 color:white;
 cursor:pointer;
 font-weight:bold
}

button:hover{
 opacity:.88
}

/* 12 × 9 LANDSCAPE CALENDAR */
.calendar{
 width:100%;
 aspect-ratio:4/3;
 background:#fff;
 display:flex;
 overflow:hidden;

 /* PREMIUM OUTLINE */
 border:3px solid #172033;
 outline:1px solid #c7a35a;
 outline-offset:-7px;

 box-shadow:
 0 5px 25px #0002;
}

.visual{
 width:56%;
 position:relative;
 overflow:hidden;
 background:#101a30;

 /* GOLD INNER FRAME */
 border-right:2px solid #c7a35a;
}

.visual svg{
 width:100%;
 height:100%;
 display:block
}

.text{
 width:44%;
 padding:5%;
 display:flex;
 flex-direction:column;
 justify-content:center;
 background:#fffdf8;
 position:relative
}

/* subtle gold divider */
.text:before{
 content:"";
 position:absolute;
 left:0;
 top:7%;
 bottom:7%;
 width:1px;
 background:#c7a35a;
 opacity:.7
}

.label{
 font-size:clamp(12px,1.5vw,20px);
 letter-spacing:2px;
 font-weight:bold;
 color:#9a7229
}

.date{
 font-size:clamp(20px,3vw,42px);
 font-weight:bold;
 margin:5px 0 15px;
 color:#172033
}

.verse{
 font-size:clamp(14px,1.7vw,23px);
 line-height:1.45;
 margin-bottom:13px
}

.en{
 font-weight:bold;
 color:#172033
}

.ta{
 color:#60452d
}

.si{
 color:#355d45
}

.ref{
 margin-top:auto;
 font-size:clamp(12px,1.4vw,18px);
 font-weight:bold;
 color:#9a7229
}

.bottom{
 margin-top:10px;
 text-align:center;
 font-size:11px;
 letter-spacing:1px;
 color:#777
}

@media(max-width:700px){

 .row{
  grid-template-columns:1fr 1fr
 }

 .calendar{
  aspect-ratio:auto;
  flex-direction:column
 }

 .visual,
 .text{
  width:100%
 }

 .visual{
  height:420px;
  border-right:0;
  border-bottom:2px solid #c7a35a
 }

 .text{
  min-height:430px
 }

 .text:before{
  display:none
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar</h2>

<div class="controls">

 <div class="row">

  <div>
   <label>Date</label>
   <input
    id="date"
    type="date"
    min="2027-01-01"
    max="2027-12-31"
    value="2027-01-01"
    onchange="updateCalendar()">
  </div>

  <div>
   <label>English Verse</label>
   <textarea id="en">The Lord is my shepherd; I shall not want.</textarea>
  </div>

  <div>
   <label>Tamil Verse</label>
   <textarea id="ta">கர்த்தர் என் மேய்ப்பர்; எனக்குக் குறைவில்லை.</textarea>
  </div>

  <div>
   <label>Sinhala Verse</label>
   <textarea id="si">ස්වාමීන්වහන්සේ මාගේ එඬේරාය; මට හිඟයක් නොවන්නේය.</textarea>
  </div>

 </div>

 <div style="margin-top:10px">
  <label>Bible Reference</label>
  <input id="ref" value="Psalm 23:1">
 </div>

 <div class="buttons">
  <button onclick="previousDay()">← Previous</button>
  <button onclick="nextDay()">Next →</button>
  <button onclick="updateCalendar()">Generate</button>
  <button onclick="downloadPDF()">Download PDF</button>
 </div>

</div>


<!-- CALENDAR -->

<div id="calendar" class="calendar">

 <div class="visual" id="svgBox"></div>

 <div class="text">

  <div class="label">
   VERSE OF THE DAY
  </div>

  <div class="date" id="showDate"></div>

  <div class="verse en" id="showEN"></div>

  <div class="verse ta" id="showTA"></div>

  <div class="verse si" id="showSI"></div>

  <div class="ref" id="showRef"></div>

  <div class="bottom">
   MAY GOD'S WORD GUIDE YOUR DAY
  </div>

 </div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);


/* DAY OF YEAR */

function dayOfYear(d){

 const a=new Date(
  d.getFullYear(),
  0,
  1
 );

 return Math.floor((d-a)/86400000)+1;
}


/* EASTER */

function easter(year){

 const a=year%19;
 const b=Math.floor(year/100);
 const c=year%100;
 const d=Math.floor(b/4);
 const e=b%4;
 const f=Math.floor((b+8)/25);
 const g=Math.floor((b-f+1)/3);
 const h=(19*a+b-d-g+15)%30;
 const i=Math.floor(c/4);
 const k=c%4;
 const l=(32+2*e+2*i-h-k)%7;
 const m=Math.floor((a+11*h+22*l)/451);
 const month=Math.floor((h+l-7*m+114)/31);
 const day=((h+l-7*m+114)%31)+1;

 return new Date(year,month-1,day);
}


/* SAME DATE */

function same(d,m,day){

 return d.getMonth()+1===m &&
        d.getDate()===day;
}


/* SPECIAL CHRISTIAN DAYS */

function special(d){

 const y=d.getFullYear();

 const e=easter(y);

 const good=new Date(e);
 good.setDate(e.getDate()-2);

 const pent=new Date(e);
 pent.setDate(e.getDate()+49);


 /* SECOND SUNDAY OF MAY */
 const mothers=new Date(y,4,1);
 mothers.setDate(
  1+(7-mothers.getDay())%7+7
 );


 /* THIRD SUNDAY OF JUNE */
 const fathers=new Date(y,5,1);
 fathers.setDate(
  1+(7-fathers.getDay())%7+14
 );


 if(same(d,1,1))
  return "NEW YEAR";

 if(same(d,2,14))
  return "VALENTINE'S DAY";

 if(d.toDateString()===good.toDateString())
  return "GOOD FRIDAY";

 if(d.toDateString()===e.toDateString())
  return "EASTER SUNDAY";

 if(d.toDateString()===mothers.toDateString())
  return "MOTHER'S DAY";

 if(d.toDateString()===pent.toDateString())
  return "PENTECOST";

 if(d.toDateString()===fathers.toDateString())
  return "FATHER'S DAY";

 if(same(d,12,24))
  return "CHRISTMAS EVE";

 if(same(d,12,25))
  return "CHRISTMAS DAY";

 if(same(d,12,31))
  return "YEAR END";

 return "";
}


/* DATE WITHOUT YEAR */

function dateText(d){

 return d.toLocaleDateString(
  "en-US",
  {
   month:"long",
   day:"numeric"
  }
 );
}


/* SEEDED RANDOM */

function rnd(n){

 const x=Math.sin(n*999.123)*43758.5453;

 return x-Math.floor(x);
}


/* CLOUD */

function cloud(x,y,s){

 return `
 <g
  opacity=".20"
  fill="#fff"
  filter="url(#blur)">

  <ellipse
   cx="${x}"
   cy="${y}"
   rx="${45*s}"
   ry="${17*s}"/>

  <ellipse
   cx="${x-35*s}"
   cy="${y+5*s}"
   rx="${32*s}"
   ry="${14*s}"/>

  <ellipse
   cx="${x+35*s}"
   cy="${y+5*s}"
   rx="${35*s}"
   ry="${15*s}"/>

 </g>`;
}


/* MOUNTAINS */

function mountains(n){

 let p="";

 for(let i=0;i<=12;i++){

  const x=i*100;

  const h=80+rnd(n+i)*150;

  p+=`
  ${x},430
  ${x+50},${430-h}
  ${x+100},430`;
 }

 return p;
}


/* STARS */

function stars(n){

 let s="";

 for(let i=0;i<45;i++){

  const x=20+rnd(n+i*3)*760;
  const y=20+rnd(n+i*7)*250;
  const r=.5+rnd(n+i*9)*2;

  s+=`
  <circle
   cx="${x}"
   cy="${y}"
   r="${r}"
   fill="#fff"
   opacity="${.35+rnd(i+n)*.6}"/>`;
 }

 return s;
}


/* NORMAL SVG */

function normalSVG(d,n,title){

 const palettes=[

  ["#06172d","#174f78","#d88b42"],
  ["#080d22","#403a72","#e6a55a"],
  ["#132b3f","#337c82","#f2c36d"],
  ["#100b24","#5a315e","#d99c78"],
  ["#071d25","#28625f","#f0bd67"],
  ["#101827","#43536d","#f1c987"],
  ["#162438","#315f83","#d5a457"],
  ["#08151e","#20526b","#f3b46d"],
  ["#161125","#46375f","#e4ad72"],
  ["#0b1e22","#28645c","#edc078"]
 ];

 const c=palettes[(n-1)%palettes.length];

 const sunX=100+rnd(n)*600;
 const sunY=90+rnd(n)*100;


 let rays="";

 for(let i=0;i<16;i++){

  const a=(i-8)*5;

  rays+=`
  <line
   x1="${sunX}"
   y1="${sunY}"
   x2="${sunX+a*45}"
   y2="${sunY+260}"
   stroke="${c[2]}"
   stroke-width="3"
   opacity=".10"/>`;

 return `
 <svg
  viewBox="0 0 800 675"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

   <linearGradient
    id="sky"
    x2="0"
    y2="1">

    <stop stop-color="${c[0]}"/>
    <stop
     offset=".55"
     stop-color="${c[1]}"/>
    <stop
     offset="1"
     stop-color="${c[2]}"/>

   </linearGradient>


   <radialGradient id="sun">

    <stop stop-color="#fff"/>
    <stop
     offset=".2"
     stop-color="#fff7c9"/>

    <stop
     offset=".65"
     stop-color="${c[2]}"
     stop-opacity=".55"/>

    <stop
     offset="1"
     stop-color="${c[2]}"
     stop-opacity="0"/>

   </radialGradient>


   <linearGradient
    id="mount"
    x2="0"
    y2="1">

    <stop stop-color="#273a49"/>

     offset="1"

   </linearGradient>

    <stop
     offset="1"
     stop-color="#000"
     stop-opacity=".55"/>

   </radialGradient>

  </defs>


  <rect
   width="800"
   height="675"

  <circle
   cx="${sunX}"
   cy="${sunY}"

   fill="url(#sun)"
   filter="url(#soft)"/>


  <circle
   cx="${sunX}"
   cy="${sunY}"
   r="48"
   fill="url(#sun)"/>


  ${rays}


  ${cloud(180,170,.9)}
  ${cloud(600,220,1)}
  ${cloud(390,110,.7)}


  <g>
   ${stars(n)}
  </g>


  <polygon
   points="${mountains(n)}"
   fill="#182b39"
   opacity=".55"/>


  <polygon
   points="${mountains(n+30)}"
   fill="url(#mount)"
   opacity=".9"/>


  <path
   d="M0 500 Q140 430 280 505 T560 485 T800 500 V675 H0Z"
   fill="#061018"/>


  <path
   d="M0 570 Q150 515 300 575 T600 555 T800 580"
   fill="none"
   stroke="#294b4a"
   stroke-width="8"
   opacity=".5"/>


  <!-- CROSS -->

  <g transform="translate(650 405)">

   <rect
    x="27"
    y="0"
    width="12"
    height="105"
    rx="4"
    fill="#090e13"/>

   <rect
    x="0"
    y="27"
    width="66"
    height="12"
    rx="4"
    fill="#090e13"/>

  </g>


  <rect
   width="800"
   height="675"
   fill="url(#vignette)"/>


  <!-- SVG INNER OUTLINE -->

  <rect
   x="28"
   y="28"
   width="744"
   height="619"
   rx="8"
   fill="none"
   stroke="#e3bd70"
   stroke-width="2"
   opacity=".85"/>


  <rect
   x="35"
   y="35"
   width="730"
   height="605"
   rx="6"
   fill="none"
   stroke="#fff"
   stroke-width="1"
   opacity=".12"/>


  <text
   x="50"
   y="75"
   fill="#fff"
   font-size="24"
   font-family="Arial"
   letter-spacing="5"
   font-weight="bold">

   VERSE OF THE DAY

  </text>


  <text
   x="50"
   y="610"
   fill="#fff"
   font-size="17"
   font-family="Arial"
   letter-spacing="2">

   ${title || "FAITH • HOPE • LOVE"}

  </text>


  <text
   x="750"
   y="610"
   fill="#e3bd70"
   text-anchor="end"
   font-size="17"
   font-family="Arial">

   ${dateText(d)}

  </text>

 </svg>`;
}

 /* CHRISTMAS */

 if(t==="CHRISTMAS DAY"){

   <circle

   <rect

   <text
    x="50"
    y="75"
    fill="#fff"
    font-size="24"
    font-family="Arial"
    letter-spacing="5"
    font-weight="bold">

    VERSE OF THE DAY

   </text>


   <text
    x="50"
    y="610"
    fill="#fff"
    font-size="18"
    font-family="Arial"
    letter-spacing="2">

    CHRISTMAS DAY

   </text>


   <text
    x="750"
    y="610"
    fill="#e4c276"
    text-anchor="end"
    font-size="17"
    font-family="Arial">

    ${dateText(d)}

   </text>

  </svg>`;
 }


 /* SPECIAL COLORS */

 const color={

  "NEW YEAR":["#081b35","#cda34d"],

  "VALENTINE'S DAY":["#3b0c22","#e58b9d"],

  "GOOD FRIDAY":["#08090d","#b08b60"],

  "EASTER SUNDAY":["#102a22","#e4c16a"],

  "MOTHER'S DAY":["#30182d","#e7a6b8"],

  "PENTECOST":["#30190c","#f2a83b"],

  "FATHER'S DAY":["#10253b","#8eb5d1"],

  "CHRISTMAS EVE":["#06182d","#d5b15e"],

 }[t]||["#08182b","#d6b66c"];


 return `
 <svg

  xmlns="http://www.w3.org/2000/svg">

  <defs>

   <linearGradient id="s" y2="1">

    <stop

   </linearGradient>


   <radialGradient id="l">

    <stop stop-color="${color[1]}"/>

   </radialGradient>

  </defs>


  <rect

  <circle

  <path

      Q160 440 320 515

  <!-- CROSS -->

   <rect
    x="34"

   <rect
    x="-20"

    height="17"
    rx="5"

  </g>


  <circle
   cx="400"
   cy="330"
   r="115"
   fill="none"
   stroke="${color[1]}"
   stroke-width="2"

  <circle
   cx="400"

 </svg>`;
}


/* CREATE SVG */

function createSVG(d){

 const n=dayOfYear(d);

 const sp=special(d);

 return sp
  ? specialSVG(d,sp)
  : normalSVG(d,n,"FAITH • HOPE • LOVE");
}


/* UPDATE */

function updateCalendar(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );


 $("showDate").textContent=
  dateText(d);


 $("showEN").textContent=
  $("en").value;


 $("showTA").textContent=
  $("ta").value;


 $("showSI").textContent=
  $("si").value;


 $("showRef").textContent=
  $("ref").value;


 $("svgBox").innerHTML=
  createSVG(d);
}


/* PREVIOUS */

function previousDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(d.getDate()-1);

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* NEXT */

function nextDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(d.getDate()+1);

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* PDF 12 × 9 INCH */

async function downloadPDF(){

 const calendar=$("calendar");

 const canvas=
  await html2canvas(calendar,{
   scale:3,
   useCORS:true,
   backgroundColor:"#fff"
  });


 const {jsPDF}=window.jspdf;


 const pdf=new jsPDF({

  orientation:"landscape",

  unit:"in",

  format:[12,9]
 });


 pdf.addImage(
  canvas.toDataURL(
   "image/jpeg",
   .95
  ),
  "JPEG",
  0,
  0,
  12,
  9
 );


 pdf.save(
  "Bible-Calendar-"+
  $("date").value+
  ".pdf"
 );
}

["en","ta","si","ref"].forEach(id=>{

 $(id).addEventListener(

  updateCalendar
 );

});

updateCalendar();
