<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033
}

.app{max-width:1100px;margin:auto}

h2{
 text-align:center;
 margin:0 0 15px
}

.controls{
 background:#fff;
 padding:15px;
 border-radius:12px;
 margin-bottom:18px;
 box-shadow:0 3px 12px #0001
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px
}

label{
 font-weight:bold;
 font-size:14px
}

input,select,textarea{
 width:100%;
 padding:9px;
 border:1px solid #ccd2da;
 border-radius:7px;
 font:inherit
}

textarea{
 min-height:75px;
 resize:vertical
}

.adjustment{
 margin-top:12px;
 padding:12px;
 background:#f7f8fa;
 border-radius:8px
}

.adjustment h3{
 margin:0 0 8px;
 font-size:15px
}

.range{
 display:grid;
 grid-template-columns:1fr 65px;
 gap:8px;
 align-items:center;
 margin:7px 0
}

.range input{padding:0}

.range span{
 font-size:12px;
 text-align:right
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px
}

button{
 border:0;
 border-radius:7px;
 padding:10px 15px;
 cursor:pointer;
 font-weight:bold
}

.secondary{
 background:#e8edf3;
 color:#172033
}

.gold{
 background:#c49a45;
 color:#fff
}

.danger{
 background:#b83b3b;
 color:#fff
}

.deleteBtn{
 background:#b83b3b;
 color:#fff;
 padding:5px 9px;
 font-size:11px
}

button:disabled{
 opacity:.5;
 cursor:not-allowed
}

.status{
 margin-top:10px;
 font-size:13px;
 font-weight:bold
}

.generated{
 display:flex;
 flex-direction:column;
 gap:6px;
 margin-top:8px
}

.generatedRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#f1f4f7;
 border:1px solid #d9dee5;
 border-radius:6px;
 padding:6px 8px
}

.generatedDate{
 font-size:13px;
 font-weight:bold;
 color:#17365d
}

/* CALENDAR */

.calendar{
 position:relative;
 width:100%;
 aspect-ratio:16/10;
 background:#faf8f2;
 border:1px solid #c8b98a;
 outline:5px solid #f1ece0;
 overflow:hidden;
 margin:0 auto 18px
}

.photo{
 position:absolute;
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 overflow:hidden;
 border-radius:8px;
 background:#ddd
}

.photo img,
.fullPhoto{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block
}

.fullPhoto{
 position:absolute;
 inset:0;
 display:none;
 z-index:10
}

.full-view .fullPhoto{
 display:block
}

.full-view .photo,
.full-view .content{
 display:none
}

/* FULL PHOTO TEXT */

.coverVerses{
 position:absolute;
 left:7%;
 right:7%;
 top:7%;
 bottom:7%;
 z-index:20;
 display:none;
 grid-template-rows:repeat(3,minmax(0,1fr));
 color:#fff;
 text-align:center;
 text-shadow:0 2px 4px #000,0 4px 12px #0009
}

.full-view .coverVerses{
 display:grid
}

.coverVerse{
 min-height:0;
 overflow:hidden;
 padding:5px 10px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:0!important
}

.coverText{
 width:100%;
 max-width:100%;
 overflow:hidden;
 overflow-wrap:anywhere;
 white-space:normal
}

#coverEnglish{
 font:600 34px/1.12 "Playfair Display",Georgia,serif
}

#coverTamil{
 font:500 24px/1.1 "Noto Sans Tamil",sans-serif
}

#coverSinhala{
 font:500 24px/1.1 "Noto Sans Sinhala",sans-serif
}

/* CALENDAR CONTENT */

.content{
 position:absolute;
 left:37%;
 right:5%;
 top:4%;
 bottom:4%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0
}

.dateRow{
 height:9%;
 min-height:30px;
 display:flex;
 align-items:center;
 border-bottom:2px solid #c49a45;
 position:relative;
 color:#17365d
}

.dateGroup{
 display:flex;
 align-items:center;
 gap:8px
}

.month{
 font-size:clamp(16px,2.3vw,28px);
 font-weight:bold
}

.day{
 font-size:clamp(15px,2vw,24px);
 font-weight:bold
}

.cross{
 position:absolute;
 right:2px;
 top:1px;
 color:#c49a45;
 font:15px Georgia
}

.verses{
 flex:1;
 min-height:0;
 padding-top:5px;
 overflow:hidden
}

#verseBox{
 height:100%;
 display:grid;
 grid-template-rows:repeat(3,minmax(0,1fr))
}

.section{
 min-height:0;
 overflow:hidden;
 padding:4px 8px;
 display:flex;
 flex-direction:column;
 justify-content:center
}

.section+.section{
 border-top:1px solid #e5dfd2
}

.text{
 width:100%;
 max-width:100%;
 overflow:hidden;
 overflow-wrap:anywhere;
 white-space:normal
}

#english{
 font:600 25px/1.12 Georgia;
 color:#172033
}

#tamil{
 font:500 18px/1.1 "Noto Sans Tamil",sans-serif;
 color:#7a4e2d
}

#sinhala{
 font:500 18px/1.12 "Noto Sans Sinhala",sans-serif;
 color:#35634a
}

@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 body{padding:10px}
}

@media print{
 @page{
  size:9in 5.625in landscape;
  margin:0
 }

 body{
  padding:0;
  background:#fff
 }

 .controls{display:none}

 .calendar{
  width:9in;
  height:5.625in;
  margin:0;
  outline:none
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar 2027</h2>

<div class="controls">

<div class="grid">

<div class="field">
<label>View</label>
<select id="photoView">
<option value="calendar">Calendar View — Photo + Bible Text</option>
<option value="full">Full Photo — 3 Bible Verses</option>
</select>
</div>

<div class="field">
<label>Upload Photo</label>
<input type="file" id="photo" accept="image/*">
</div>

<div class="field" id="dateField">
<label>Calendar Date</label>
<input type="date"
 id="date"
 min="2027-01-01"
 max="2027-12-31"
 value="2027-01-01">
</div>

<div class="field">
<label>Full Photo English Font</label>
<select id="coverFont">
<option>Playfair Display</option>
<option>Cinzel</option>
<option>Montserrat</option>
<option>Georgia</option>
<option>Arial</option>
</select>
</div>

<div class="field">
<label>English Bible Verse</label>
<textarea id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>
</div>

<div class="field">
<label>Tamil Bible Verse</label>
<textarea id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>
</div>

<div class="field">
<label>Sinhala Bible Verse</label>
<textarea id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>
</div>

</div>

<div class="adjustment">

<h3>Calendar Text Size</h3>

<div class="range">
<input type="range" id="englishSize" min=".5" max="30" step=".1" value="25">
<span id="englishSizeValue">25px</span>
</div>

<div class="range">
<input type="range" id="tamilSize" min=".5" max="24" step=".1" value="18">
<span id="tamilSizeValue">18px</span>
</div>

<div class="range">
<input type="range" id="sinhalaSize" min=".5" max="24" step=".1" value="18">
<span id="sinhalaSizeValue">18px</span>
</div>

<h3>Full Photo Text Size</h3>

<div class="range">
<input type="range" id="coverEnglishSize" min="8" max="70" step=".1" value="34">
<span id="coverEnglishSizeValue">34px</span>
</div>

<div class="range">
<input type="range" id="coverTamilSize" min="8" max="55" step=".1" value="24">
<span id="coverTamilSizeValue">24px</span>
</div>

<div class="range">
<input type="range" id="coverSinhalaSize" min="8" max="55" step=".1" value="24">
<span id="coverSinhalaSizeValue">24px</span>
</div>

</div>

<div class="buttons">

<button type="button" id="prevBtn" class="secondary">
← Previous
</button>

<button type="button" id="nextBtn" class="secondary">
Next →
</button>

<button type="button" id="generateBtn" class="gold">
Generate
</button>

<button type="button" id="clearBtn" class="danger">
Clear All
</button>

<button type="button" id="downloadBtn" class="gold">
Download All PDF
</button>

</div>

<div class="status" id="status"></div>
<div class="generated" id="generatedList"></div>

</div>

<div class="calendar" id="calendar">

<img id="fullPhoto" class="fullPhoto">

<div class="coverVerses">

<div class="coverVerse">
<div class="coverText" id="coverEnglish"></div>
</div>

<div class="coverVerse">
<div class="coverText" id="coverTamil"></div>
</div>

<div class="coverVerse">
<div class="coverText" id="coverSinhala"></div>
</div>

</div>

<div class="photo">
<img id="photoPreview">
</div>

<div class="content">

<div class="dateRow">

<div class="dateGroup">
<div class="month" id="monthText">JANUARY</div>
<div class="day" id="dayText">1</div>
</div>

<div class="cross">✝</div>

</div>

<div class="verses">

<div id="verseBox">

<section class="section">
<div class="text" id="english"></div>
</section>

<section class="section">
<div class="text" id="tamil"></div>
</section>

<section class="section">
<div class="text" id="sinhala"></div>
</section>

</div>

</div>

</div>

</div>

</div>

<script>

const $=id=>document.getElementById(id);
const KEY="BibleCalendar2027";

let selected=[];
let photoData="";
let busy=false;

const months=[
 "JANUARY","FEBRUARY","MARCH","APRIL",
 "MAY","JUNE","JULY","AUGUST",
 "SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"
];

function dateInfo(v){
 let d=new Date(v+"T00:00:00");
 return[months[d.getMonth()],d.getDate()];
}

function save(){

 try{

  localStorage.setItem(KEY,JSON.stringify({

   selected,
   photoData,

   date:$("date").value,
   photoView:$("photoView").value,
   coverFont:$("coverFont").value,

   english:$("englishInput").value,
   tamil:$("tamilInput").value,
   sinhala:$("sinhalaInput").value,

   englishSize:$("englishSize").value,
   tamilSize:$("tamilSize").value,
   sinhalaSize:$("sinhalaSize").value,

   coverEnglishSize:$("coverEnglishSize").value,
   coverTamilSize:$("coverTamilSize").value,
   coverSinhalaSize:$("coverSinhalaSize").value

  }));

 }catch(e){

  console.warn("Save failed",e);

 }
}

function load(){

 try{

  let x=JSON.parse(
   localStorage.getItem(KEY)||"null"
  );

  if(!x)return;

  selected=[
   ...new Set(
    Array.isArray(x.selected)?x.selected:[]
   )
  ].slice(0,10);

  photoData=x.photoData||"";

  [
   "date",
   "photoView",
   "coverFont",
   "englishSize",
   "tamilSize",
   "sinhalaSize",
   "coverEnglishSize",
   "coverTamilSize",
   "coverSinhalaSize"
  ].forEach(k=>{

   if(x[k]!=null && $(k))
    $(k).value=x[k];

  });

  if(x.english!=null)
   $("englishInput").value=x.english;

  if(x.tamil!=null)
   $("tamilInput").value=x.tamil;

  if(x.sinhala!=null)
   $("sinhalaInput").value=x.sinhala;

  if(photoData){

   $("photoPreview").src=photoData;
   $("fullPhoto").src=photoData;

  }

 }catch(e){

  console.error(e);

 }
}

function render(){

 $("generatedList").innerHTML="";

 selected.forEach((v,i)=>{

  let d=new Date(v+"T00:00:00");

  let row=document.createElement("div");
  row.className="generatedRow";

  let span=document.createElement("span");
  span.className="generatedDate";

  span.textContent=
   `${i+1}. ${d.toLocaleDateString("en-GB")}`;

  let btn=document.createElement("button");

  btn.type="button";
  btn.className="deleteBtn";
  btn.textContent="Delete";
  btn.dataset.date=v;

  row.appendChild(span);
  row.appendChild(btn);

  $("generatedList").appendChild(row);

 });

 $("status").textContent=
  `Generated: ${selected.length}/10`;
}

function deleteDate(v){

 selected=selected.filter(x=>x!==v);

 save();
 render();

}

function clearAll(){

 if(!selected.length){

  alert("There are no generated pages.");
  return;

 }

 if(!confirm("Delete all generated calendar pages?"))
  return;

 selected=[];

 save();
 render();

 $("status").textContent=
  "All generated pages cleared.";
}

function update(){

 let v=$("date").value;

 if(v){

  let x=dateInfo(v);

  $("monthText").textContent=x[0];
  $("dayText").textContent=x[1];

 }

 let en=$("englishInput").value.trim();
 let ta=$("tamilInput").value.trim();
 let si=$("sinhalaInput").value.trim();

 $("english").textContent=en;
 $("tamil").textContent=ta;
 $("sinhala").textContent=si;

 $("coverEnglish").textContent=en;
 $("coverTamil").textContent=ta;
 $("coverSinhala").textContent=si;

 $("coverEnglish").style.fontFamily=
  `"${$("coverFont").value}",Georgia,serif`;

 $("coverEnglish").style.fontSize=
  $("coverEnglishSize").value+"px";

 $("coverTamil").style.fontSize=
  $("coverTamilSize").value+"px";

 $("coverSinhala").style.fontSize=
  $("coverSinhalaSize").value+"px";

 ["english","tamil","sinhala"].forEach(id=>{

  $(id).style.fontSize=
   $(`${id}Size`).value+"px";

  $(`${id}SizeValue`).textContent=
   $(`${id}Size`).value+"px";

 });

 ["coverEnglish","coverTamil","coverSinhala"].forEach(id=>{

  $(`${id}SizeValue`).textContent=
   $(`${id}Size`).value+"px";

 });

 let full=$("photoView").value==="full";

 $("calendar").classList.toggle(
  "full-view",
  full
 );

 $("dateField").style.display=
  full?"none":"";

}

async function fit(id,range){

 let el=$(id);

 if(!el)return;

 let box=el.closest(
  id.startsWith("cover")
   ?".coverVerse"
   :".section"
 );

 if(!box)return;

 await document.fonts.ready;

 let max=parseFloat(
  $(range).value
 );

 let min=id.startsWith("cover")?8:.5;

 function good(n){

  el.style.fontSize=n+"px";

  void el.offsetHeight;

  return(
   el.scrollHeight<=box.clientHeight-6 &&
   el.scrollWidth<=box.clientWidth
  );

 }

 if(good(max)){

  $(range+"Value").textContent=
   max.toFixed(1)+"px";

  return;

 }

 let lo=min;
 let hi=max;
 let best=min;

 for(let i=0;i<35;i++){

  let mid=(lo+hi)/2;

  if(good(mid)){

   best=mid;
   lo=mid;

  }else{

   hi=mid;

  }

 }

 el.style.fontSize=
  best.toFixed(1)+"px";

 $(range).value=
  best.toFixed(1);

 $(range+"Value").textContent=
  best.toFixed(1)+"px";

}

async function updateFit(){

 update();

 await new Promise(
  r=>requestAnimationFrame(r)
 );

 if($("photoView").value==="full"){

  await fit(
   "coverEnglish",
   "coverEnglishSize"
  );

  await fit(
   "coverTamil",
   "coverTamilSize"
  );

  await fit(
   "coverSinhala",
   "coverSinhalaSize"
  );

 }else{

  await fit(
   "english",
   "englishSize"
  );

  await fit(
   "tamil",
   "tamilSize"
  );

  await fit(
   "sinhala",
   "sinhalaSize"
  );

 }

 save();
}

async function generate(){

 if(busy)return;

 if(!photoData){

  alert("Please upload a photo first.");
  return;

 }

 if($("photoView").value==="full"){

  await updateFit();

  $("status").textContent=
   "Full Photo ready. Click Download All PDF.";

  return;

 }

 let v=$("date").value;

 if(!v)return;

 if(selected.includes(v)){

  alert("This date is already generated.");
  return;

 }

 if(selected.length>=10){

  alert("Maximum 10 generated pages.");
  return;

 }

 await updateFit();

 selected.push(v);

 save();
 render();

 $("status").textContent=
  `Generated ${selected.length}/10`;

}

async function move(n){

 if(busy)return;

 if($("photoView").value==="full")
  return;

 let d=new Date(
  $("date").value+"T00:00:00"
 );

 d.setDate(
  d.getDate()+n
 );

 if(d.getFullYear()!=2027)
  return;

 $("date").value=
  d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

 await updateFit();

}

$("photo").addEventListener(
 "change",
 e=>{

  let f=e.target.files[0];

  if(!f)return;

  let r=new FileReader();

  r.onload=()=>{

   photoData=r.result;

   $("photoPreview").src=
    photoData;

   $("fullPhoto").src=
    photoData;

   save();

   $("status").textContent=
    "Photo uploaded.";

  };

  r.readAsDataURL(f);

 }
);

$("generatedList").addEventListener(
 "click",
 e=>{

  let btn=e.target.closest(".deleteBtn");

  if(btn)
   deleteDate(btn.dataset.date);

 }
);

$("prevBtn").addEventListener(
 "click",
 ()=>move(-1)
);

$("nextBtn").addEventListener(
 "click",
 ()=>move(1)
);

$("generateBtn").addEventListener(
 "click",
 generate
);

$("clearBtn").addEventListener(
 "click",
 clearAll
);

$("photoView").addEventListener(
 "change",
 updateFit
);

$("coverFont").addEventListener(
 "change",
 updateFit
);

$("date").addEventListener(
 "change",
 updateFit
);

[
 "englishInput",
 "tamilInput",
 "sinhalaInput",
 "englishSize",
 "tamilSize",
 "sinhalaSize",
 "coverEnglishSize",
 "coverTamilSize",
 "coverSinhalaSize"
].forEach(id=>{

 $(id).addEventListener(
  "input",
  updateFit
 );

});

async function capturePage(){

 update();

 await new Promise(
  r=>requestAnimationFrame(r)
 );

 await updateFit();

 await new Promise(
  r=>setTimeout(r,700)
 );

 let canvas=
  await html2canvas(
   $("calendar"),
   {
    scale:3,
    useCORS:true,
    allowTaint:true,
    backgroundColor:"#FAF8F2",
    logging:false,
    imageTimeout:0
   }
  );

 return canvas.toDataURL(
  "image/jpeg",
  .95
 );

}

async function downloadGenerated(){

 if(busy)return;

 if(!photoData){

  alert("Please upload a photo first.");
  return;

 }

 if(
  !window.jspdf ||
  !window.html2canvas
 ){

  alert(
   "PDF libraries are still loading. Please try again."
  );

  return;

 }

 let btn=$("downloadBtn");

 busy=true;

 btn.disabled=true;
 btn.textContent="Creating PDF...";

 let oldDate=$("date").value;
 let oldView=$("photoView").value;

 try{

  const {jsPDF}=window.jspdf;

  /* FULL PHOTO */

  if(oldView==="full"){

   $("status").textContent=
    "Creating full photo PDF...";

   await updateFit();

   let img=
    await capturePage();

   let pdf=
    new jsPDF({
     orientation:"landscape",
     unit:"in",
     format:[9,5.625],
     compress:true
    });

   pdf.addImage(
    img,
    "JPEG",
    0,
    0,
    9,
    5.625,
    undefined,
    "FAST"
   );

   pdf.save(
    "365-Bible-Calendar-Cover.pdf"
   );

   $("status").textContent=
    "Full Photo PDF downloaded.";

   return;
  }

  /* CALENDAR */

  let pages=[
   ...new Set(selected)
  ].slice(0,10);

  if(!pages.length){

   alert(
    "Please generate calendar pages first."
   );

   return;
  }

  $("status").textContent=
   `Creating ${pages.length} page PDF...`;

  let pdf=
   new jsPDF({
    orientation:"landscape",
    unit:"in",
    format:[9,5.625],
    compress:true
   });

  for(let i=0;i<pages.length;i++){

   $("date").value=pages[i];

   $("status").textContent=
    `Creating page ${i+1} of ${pages.length}...`;

   let img=
    await capturePage();

   if(i>0){

    pdf.addPage(
     [9,5.625],
     "landscape"
    );

   }

   pdf.addImage(
    img,
    "JPEG",
    0,
    0,
    9,
    5.625,
    undefined,
    "FAST"
   );

  }

  pdf.save(
   "365-Bible-Calendar-2027.pdf"
  );

  $("status").textContent=
   `Downloaded ${pages.length} pages in ONE PDF.`;

 }catch(e){

  console.error(e);

  alert(
   "PDF creation failed:\n"+
   (e.message||e)
  );

 }finally{

  $("date").value=oldDate;

  $("photoView").value=oldView;

  update();

  await new Promise(
   r=>requestAnimationFrame(r)
  );

  await updateFit();

  busy=false;

  btn.disabled=false;

  btn.textContent=
   "Download All PDF";

  render();

 }

}

window.addEventListener(
 "load",
 async()=>{

  load();

  render();

  await updateFit();

 }
);

</script>

</body>
</html>
