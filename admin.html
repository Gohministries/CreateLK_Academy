<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#eef1f5;
 font-family:Arial,sans-serif;color:#172033
}
.app{max-width:1000px;margin:auto}
h2{text-align:center}
.controls{
 background:white;padding:18px;border-radius:15px;
 margin-bottom:20px
}
input,button{
 padding:11px;border:1px solid #ccc;border-radius:8px
}
button{
 background:#172033;color:white;cursor:pointer;
 border:0;margin:4px
}
canvas{
 width:100%;display:block;
 background:white;border-radius:4px
}
.nav{text-align:center;margin-top:15px}
#status{text-align:center;margin:10px;font-weight:bold}
</style>
</head>

<body>

<div class="app">

<h2>365 Days Bible Calendar</h2>

<div class="controls">

<input type="file" id="file" accept=".txt">

<div id="status">Upload your 365-day text file</div>

<div class="nav">
<button onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
<button onclick="generate()">Generate</button>
<button onclick="save()">Save PNG</button>
</div>

</div>

<canvas id="canvas" width="2400" height="1800"></canvas>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let days=[],index=0;

document.getElementById("file").onchange=e=>{
 const reader=new FileReader();
 reader.onload=()=>{
   days=parse(reader.result);
   index=0;
   generate();
 };
 reader.readAsText(e.target.files[0],"UTF-8");
};

function parse(text){

 const blocks=text.trim().split(/\n\s*\n/);

 return blocks.map(block=>{

   let d={};

   block.split("\n").forEach(line=>{

     let p=line.indexOf(":");

     if(p<0)return;

     let key=line.slice(0,p).trim().toUpperCase();
     let value=line.slice(p+1).trim();

     if(key==="DAY")d.day=value;
     if(key==="DATE")d.date=value;
     if(key==="ENGLISH")d.english=value;
     if(key==="TAMIL")d.tamil=value;
     if(key==="SINHALA")d.sinhala=value;
     if(key==="REFERENCE")d.reference=value;

   });

   return d;
 });
}

function wrap(text,x,y,max,size,line){

 ctx.font=size+"px Arial";
 ctx.textAlign="center";
 ctx.fillStyle="#222";

 let words=text.split(" ");
 let row="",rows=[];

 words.forEach(w=>{
   let test=row?row+" "+w:w;

   if(ctx.measureText(test).width>max){
     rows.push(row);
     row=w;
   }else row=test;
 });

 if(row)rows.push(row);

 rows.forEach((r,i)=>{
   ctx.fillText(r,x,y+i*line);
 });

 return rows.length;
}

function generate(){

 if(!days.length)return;

 let d=days[index];

 ctx.fillStyle="#f8f3e7";
 ctx.fillRect(0,0,2400,1800);

 ctx.strokeStyle="#b28a35";
 ctx.lineWidth=12;
 ctx.strokeRect(70,70,2260,1660);

 ctx.textAlign="center";

 ctx.fillStyle="#9b7627";
 ctx.font="bold 55px Arial";
 ctx.fillText("365 DAYS WITH GOD'S WORD",1200,160);

 ctx.fillStyle="#172033";
 ctx.font="bold 75px Arial";
 ctx.fillText("DAY "+(d.day||String(index+1).padStart(3,"0")),1200,270);

 ctx.font="38px Arial";
 ctx.fillStyle="#666";
 ctx.fillText(d.date||"",1200,330);

 ctx.fillStyle="#b28a35";
 ctx.fillRect(450,370,1500,6);

 /* ENGLISH */

 ctx.fillStyle="#9b7627";
 ctx.font="bold 34px Arial";
 ctx.fillText("ENGLISH",1200,445);

 let englishSize=75;

 let englishRows=wrap(
   "“"+(d.english||"")+"”",
   1200,560,1800,englishSize,100
 );

 if(d.reference){
   ctx.fillStyle="#9b7627";
   ctx.font="bold 34px Arial";
   ctx.fillText("— "+d.reference,1200,560+englishRows*100+20);
 }

 /* TAMIL */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.fillText("தமிழ்",1200,900);

 wrap(
   "“"+(d.tamil||"")+"”",
   1200,970,1800,45,65
 );

 /* SINHALA */

 ctx.fillStyle="#555";
 ctx.font="bold 30px Arial";
 ctx.fillText("සිංහල",1200,1270);

 wrap(
   "“"+(d.sinhala||"")+"”",
   1200,1340,1800,45,65
 );

 ctx.fillStyle="#9b7627";
 ctx.font="italic 30px Arial";
 ctx.fillText("Walk with God • Grow in His Word",1200,1640);

 document.getElementById("status").textContent=
   "Day "+(index+1)+" of "+days.length;

}

function save(){

 if(!days.length)return;

 let link=document.createElement("a");

 link.download=
   "Bible-Calendar-Day-"+String(index+1).padStart(3,"0")+".png";

 link.href=canvas.toDataURL("image/png");

 link.click();
}

function next(){

 if(index<days.length-1){
   index++;
   generate();
 }
}

function prev(){

 if(index>0){
   index--;
   generate();
 }
}

</script>

</body>
</html>
