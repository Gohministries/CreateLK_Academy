<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
padding:20px;
background:#eef1f5;
font-family:Arial,sans-serif;
color:#172033
}

.app{
max-width:1100px;
margin:auto
}

h2{
text-align:center;
margin:0 0 15px;
font-family:Cinzel,serif;
color:#17365D
}

.controls{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:18px;
box-shadow:0 3px 12px #0001
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:5px
}

label{
font-weight:bold;
font-size:14px
}

input,select,textarea{
width:100%;
padding:9px;
border:1px solid #ccd2da;
border-radius:7px;
font:inherit
}

textarea{
min-height:75px;
resize:vertical
}

.adjustment{
margin-top:12px;
padding:12px;
background:#f7f8fa;
border-radius:8px
}

.adjustment h3{
margin:0 0 8px;
font-size:15px;
color:#17365D
}

.range{
display:grid;
grid-template-columns:1fr 65px;
gap:8px;
align-items:center;
margin:7px 0
}

.range input{
padding:0
}

.range span{
text-align:right;
font-size:12px
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px
}

button{
border:0;
border-radius:7px;
padding:10px 15px;
cursor:pointer;
font-weight:bold
}

.secondary{
background:#e8edf3;
color:#172033
}

.gold{
background:#b58a3c;
color:#fff
}

.danger,.deleteBtn{
background:#b83b3b;
color:#fff
}

.deleteBtn,.editBtn{
padding:5px 9px;
font-size:11px
}

.editBtn{
background:#17365D
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
margin-top:10px;
font-size:13px;
font-weight:bold
}

.generated{
display:flex;
flex-direction:column;
gap:6px;
margin-top:8px;
max-height:320px;
overflow:auto
}

.generatedRow{
display:flex;
align-items:center;
justify-content:space-between;
background:#f1f4f7;
border:1px solid #d9dee5;
border-radius:6px;
padding:7px 8px
}

.generatedInfo,
.generatedActions{
display:flex;
align-items:center;
gap:8px
}

.generatedDate{
font-size:13px;
font-weight:bold;
color:#17365d
}

.generatedIndex{
font-size:11px;
color:#777
}


/* ================= CALENDAR ================= */

.calendar{
position:relative;
width:100%;
aspect-ratio:16/10;
background:#f5efe1;
border:1px solid #a88a4a;
outline:5px solid #eee7d8;
overflow:hidden;
margin:0 auto 18px;
box-shadow:0 8px 25px rgba(43,35,20,.12)
}

.calendar:before,
.calendar:after{
content:"";
position:absolute;
pointer-events:none;
z-index:10
}

.calendar:before{
inset:2.2%;
border:1px solid rgba(121,94,39,.55)
}

.calendar:after{
inset:3.2%;
border:1px solid rgba(121,94,39,.22)
}


/* ================= HEADER ================= */

.header{
position:relative;
z-index:3;
height:25%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:2% 6%
}

.headerLine{
display:flex;
align-items:center;
justify-content:center;
gap:18px;
flex-wrap:nowrap;
white-space:nowrap;
line-height:1
}

.month,
.dateNumber{
font-family:Cinzel,Georgia,serif;
font-size:clamp(28px,4.2vw,48px);
font-weight:700;
line-height:1;
letter-spacing:2px;

height:1em;
min-height:1em;

display:flex;
align-items:center;
justify-content:center;

margin:0;
padding:0;

white-space:nowrap;
flex:none
}

.month{
color:#17365D
}

.dateNumber{
color:#8B3A3A
}


/* ================= CROSS TOP RIGHT ================= */

.cross{
position:absolute;

top:14%;
right:7%;

font-family:Cinzel,Georgia,serif;
font-size:clamp(28px,4.2vw,48px);
font-weight:700;
line-height:1;

color:#b48b36;

width:1em;
height:1em;

display:flex;
align-items:center;
justify-content:center;

margin:0;
padding:0;

z-index:5
}


/* ================= VERSES ================= */

.verses{
position:relative;
z-index:3;
height:75%;
display:flex;
flex-direction:column;
padding:0 7% 5%;
min-height:0
}

.section{
flex:1;
min-height:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:7px 7%;
position:relative;
overflow:hidden
}

.section+.section{
border-top:1px solid rgba(130,110,70,.25)
}

.text{
width:100%;
overflow:hidden;
overflow-wrap:anywhere;
white-space:normal;
text-align:center;
margin:0
}

#english{
font-family:"Playfair Display",Georgia,serif;
font-size:25px;
font-weight:700;
line-height:1.2;
color:#17365D
}

#tamil{
font-family:"Noto Sans Tamil",sans-serif;
font-size:18px;
font-weight:700;
line-height:1.42;
color:#8B3A3A
}

#sinhala{
font-family:"Noto Sans Sinhala",sans-serif;
font-size:18px;
font-weight:700;
line-height:1.42;
color:#35634A
}


/* ================= MONTH BACKGROUNDS ================= */

.month-january{
background:linear-gradient(135deg,#e8dcc1,#faf7ee 48%,#d4c095)
}

.month-february{
background:linear-gradient(135deg,#e8cecf,#fcf3f1 48%,#d6b3b6)
}

.month-march{
background:linear-gradient(135deg,#d5e3d0,#f5f8f1 48%,#b5cbb0)
}

.month-april{
background:linear-gradient(135deg,#ddd4e9,#f8f5fb 48%,#c1b3d5)
}

.month-may{
background:linear-gradient(135deg,#ead7ad,#fbf7e9 48%,#ceb374)
}

.month-june{
background:linear-gradient(135deg,#cfe4ea,#f3f9fb 48%,#a8cbd5)
}

.month-july{
background:linear-gradient(135deg,#e5d6b8,#fbf7ed 48%,#c9b27f)
}

.month-august{
background:linear-gradient(135deg,#d5e1d0,#f4f8f1 48%,#afc5a6)
}

.month-september{
background:linear-gradient(135deg,#e4d8c3,#fbf8f0 48%,#c6b28e)
}

.month-october{
background:linear-gradient(135deg,#ead0b0,#fcf3e5 48%,#cf9d6b)
}

.month-november{
background:linear-gradient(135deg,#d8dce4,#f6f7f9 48%,#b4bcc9)
}

.month-december{
background:linear-gradient(135deg,#d9dee8,#f7f8fb 48%,#b2bbc9)
}


/* ================= MOBILE ================= */

@media(max-width:700px){

body{
padding:10px
}

.grid{
grid-template-columns:1fr
}

.header{
padding:2% 2% 0
}

.headerLine{
gap:9px;
flex-wrap:nowrap;
white-space:nowrap
}

.month,
.dateNumber{
font-size:clamp(24px,7vw,36px);
height:1em;
min-height:1em;
line-height:1;
letter-spacing:1px
}

.cross{
top:12%;
right:6%;
font-size:clamp(24px,7vw,36px);
width:1em;
height:1em
}

.section{
padding:5px 4%
}

}


/* ================= PRINT ================= */

@media print{

@page{
size:9in 5.625in landscape;
margin:0
}

html,body{
width:9in;
height:5.625in;
margin:0;
padding:0
}

.controls,
h2{
display:none!important
}

.calendar{
width:9in;
height:5.625in;
margin:0;
outline:none
}

}
</style>
</head>

<body>

<div class="app">

<h2>365 Bible Calendar 2027</h2>

<div class="controls">

<div class="grid">

<div class="field">
<label>Calendar Date</label>
<input
type="date"
id="date"
min="2027-01-01"
max="2027-12-31"
value="2027-01-01">
</div>

<div class="field">
<label>English Font</label>

<select id="englishFont">
<option>Playfair Display</option>
<option>Cinzel</option>
<option>Montserrat</option>
<option>Georgia</option>
<option>Arial</option>
</select>

</div>

<div class="field">
<label>English Bible Verse</label>

<textarea id="englishInput">Your word is a lamp for my feet, a light on my path.</textarea>

</div>

<div class="field">
<label>Tamil Bible Verse</label>

<textarea id="tamilInput">உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.</textarea>

</div>

<div class="field">
<label>Sinhala Bible Verse</label>

<textarea id="sinhalaInput">ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.</textarea>

</div>

</div>


<div class="adjustment">

<h3>Calendar Text Size</h3>

<div class="range">
<input
type="range"
id="englishSize"
min="8"
max="45"
step=".1"
value="25">
<span id="englishSizeValue">25px</span>
</div>

<div class="range">
<input
type="range"
id="tamilSize"
min="8"
max="38"
step=".1"
value="18">
<span id="tamilSizeValue">18px</span>
</div>

<div class="range">
<input
type="range"
id="sinhalaSize"
min="8"
max="38"
step=".1"
value="18">
<span id="sinhalaSizeValue">18px</span>
</div>

</div>


<div class="buttons">

<button class="secondary" id="prevBtn">
← Previous
</button>

<button class="secondary" id="nextBtn">
Next →
</button>

<button class="gold" id="generateBtn">
Generate
</button>

<button class="danger" id="clearBtn">
Clear All
</button>

<button class="gold" id="downloadBtn">
Download All PDF
</button>

</div>


<div class="status" id="status"></div>

<div class="generated" id="generatedList"></div>

</div>


<!-- ================= CALENDAR ================= -->

<div class="calendar month-january" id="calendar">

<div class="header">

<div class="headerLine">

<div class="month" id="monthText">
JANUARY
</div>

<div class="dateNumber" id="dateText">
1
</div>

</div>

<div class="cross">
✝
</div>

</div>


<div class="verses">

<section class="section">

<div class="text" id="english">
Your word is a lamp for my feet, a light on my path.
</div>

</section>


<section class="section">

<div class="text" id="tamil">
உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.
</div>

</section>


<section class="section">

<div class="text" id="sinhala">
ඔබගේ වචනය මාගේ පාදවලට පහනක්ද, මාගේ මාර්ගයට ආලෝකයක්ද වේ.
</div>

</section>

</div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

const KEY="BibleCalendar2027_Settings_v3";
const DB="BibleCalendar2027_DB";
const STORE="pages";

const months=[
"JANUARY",
"FEBRUARY",
"MARCH",
"APRIL",
"MAY",
"JUNE",
"JULY",
"AUGUST",
"SEPTEMBER",
"OCTOBER",
"NOVEMBER",
"DECEMBER"
];

const classes=months.map(
x=>"month-"+x.toLowerCase()
);

let db;
let pages=[];
let busy=false;


/* ================= DATABASE ================= */

function openDB(){

return new Promise((res,rej)=>{

let r=indexedDB.open(DB,1);

r.onupgradeneeded=e=>{

if(!e.target.result.objectStoreNames.contains(STORE)){

e.target.result.createObjectStore(
STORE,
{keyPath:"date"}
);

}

};

r.onsuccess=e=>{

db=e.target.result;
res();

};

r.onerror=()=>rej(r.error);

});

}


function store(mode){

return db
.transaction(STORE,mode)
.objectStore(STORE);

}


function getAll(){

return new Promise((res,rej)=>{

let r=store("readonly").getAll();

r.onsuccess=()=>{
res(r.result||[]);
};

r.onerror=()=>{
rej(r.error);
};

});

}


function put(x){

return new Promise((res,rej)=>{

let t=db.transaction(STORE,"readwrite");

t.objectStore(STORE).put(x);

t.oncomplete=res;

t.onerror=()=>{
rej(t.error);
};

});

}


function del(d){

return new Promise((res,rej)=>{

let t=db.transaction(STORE,"readwrite");

t.objectStore(STORE).delete(d);

t.oncomplete=res;

t.onerror=()=>{
rej(t.error);
};

});

}


function clearDB(){

return new Promise((res,rej)=>{

let t=db.transaction(STORE,"readwrite");

t.objectStore(STORE).clear();

t.oncomplete=res;

t.onerror=()=>{
rej(t.error);
};

});

}


/* ================= SETTINGS ================= */

function settings(){

return{

date:date.value,

font:englishFont.value,

en:englishInput.value,

ta:tamilInput.value,

si:sinhalaInput.value,

es:englishSize.value,

ts:tamilSize.value,

ss:sinhalaSize.value

};

}


function saveSettings(){

try{

localStorage.setItem(
KEY,
JSON.stringify(settings())
);

}catch(e){}

}


function loadSettings(){

try{

let x=JSON.parse(
localStorage.getItem(KEY)||"null"
);

if(!x)return;

if(x.date)
date.value=x.date;

if(x.font)
englishFont.value=x.font;

if(x.en!=null)
englishInput.value=x.en;

if(x.ta!=null)
tamilInput.value=x.ta;

if(x.si!=null)
sinhalaInput.value=x.si;

if(x.es!=null)
englishSize.value=x.es;

if(x.ts!=null)
tamilSize.value=x.ts;

if(x.ss!=null)
sinhalaSize.value=x.ss;

}catch(e){}

}


/* ================= UPDATE CALENDAR ================= */

function update(){

let d=new Date(
date.value+"T00:00:00"
);

let m=d.getMonth();

monthText.textContent=months[m];

dateText.textContent=d.getDate();

calendar.classList.remove(...classes);

calendar.classList.add(
classes[m]
);

english.textContent=
englishInput.value;

tamil.textContent=
tamilInput.value;

sinhala.textContent=
sinhalaInput.value;

english.style.fontSize=
englishSize.value+"px";

tamil.style.fontSize=
tamilSize.value+"px";

sinhala.style.fontSize=
sinhalaSize.value+"px";

english.style.fontFamily=
`"${englishFont.value}",Georgia,serif`;

englishSizeValue.textContent=
englishSize.value+"px";

tamilSizeValue.textContent=
tamilSize.value+"px";

sinhalaSizeValue.textContent=
sinhalaSize.value+"px";

fitAll();

}


/* ================= FIT TEXT ================= */

function fit(el,min=8){

let s=parseFloat(
getComputedStyle(el).fontSize
);

let n=150;

while(

(
el.scrollHeight>
el.clientHeight+1 ||

el.scrollWidth>
el.clientWidth+1
)

&&
s>min
&&
n--

){

s-=.2;

el.style.fontSize=
s.toFixed(1)+"px";

}

}


function fitAll(){

setTimeout(()=>{

fit(english);
fit(tamil);
fit(sinhala);

},20);

}


/* ================= PAGES ================= */

function find(d){

return pages.find(
x=>x.date===d
);

}


function loadPage(p){

if(!p)return;

date.value=p.date;

englishInput.value=
p.english||"";

tamilInput.value=
p.tamil||"";

sinhalaInput.value=
p.sinhala||"";

englishFont.value=
p.font||"Playfair Display";

englishSize.value=
p.englishSize||25;

tamilSize.value=
p.tamilSize||18;

sinhalaSize.value=
p.sinhalaSize||18;

update();

saveSettings();

buttonText();

}


function buttonText(){

generateBtn.textContent=
find(date.value)
?
"Update Page"
:
"Generate";

}


function render(){

pages.sort(
(a,b)=>a.date.localeCompare(b.date)
);

generatedList.innerHTML=
pages.map((p,i)=>{

let d=new Date(
p.date+"T00:00:00"
);

let n=d.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

return `

<div class="generatedRow">

<div class="generatedInfo">

<span class="generatedIndex">
${i+1}.
</span>

<span class="generatedDate">
${n}
</span>

</div>

<div class="generatedActions">

<button
class="editBtn"
data-edit="${p.date}">
Edit
</button>

<button
class="deleteBtn"
data-delete="${p.date}">
Delete
</button>

</div>

</div>

`;

}).join("");

status.textContent=
`Generated Pages: ${pages.length}/365`;

}


/* ================= GENERATE ================= */

async function generate(){

if(busy)return;

busy=true;

generateBtn.disabled=true;

try{

update();

saveSettings();

await document.fonts.ready;

await new Promise(
r=>setTimeout(r,250)
);

fitAll();

status.textContent=
"Generating...";

let canvas=
await html2canvas(
calendar,
{
scale:3,
useCORS:true,
allowTaint:true,
backgroundColor:null,
logging:false
}
);

let page={

date:date.value,

english:englishInput.value,

tamil:tamilInput.value,

sinhala:sinhalaInput.value,

font:englishFont.value,

englishSize:englishSize.value,

tamilSize:tamilSize.value,

sinhalaSize:sinhalaSize.value,

image:canvas.toDataURL(
"image/jpeg",
.95
)

};

await put(page);

let i=pages.findIndex(
x=>x.date===page.date
);

i>=0
?
pages[i]=page
:
pages.push(page);

render();

buttonText();

status.textContent=
"Saved: "+page.date;

}catch(e){

console.error(e);

status.textContent=
"Error: "+e.message;

}

generateBtn.disabled=false;

busy=false;

}


/* ================= DATE NAVIGATION ================= */

async function changeDate(n){

let d=new Date(
date.value+"T00:00:00"
);

d.setDate(
d.getDate()+n
);

if(d.getFullYear()!=2027){

status.textContent=
"Only dates in 2027 are available.";

return;

}

date.value=
d.toISOString().slice(0,10);

let p=find(date.value);

p
?
loadPage(p)
:
(
update(),
buttonText(),
saveSettings()
);

}


/* ================= DELETE ================= */

async function removePage(d){

if(!confirm(
"Delete this generated page?"
))
return;

await del(d);

pages=pages.filter(
x=>x.date!==d
);

render();

buttonText();

status.textContent=
"Page deleted.";

}


/* ================= GENERATED LIST ================= */

generatedList.onclick=e=>{

if(e.target.dataset.edit){

let p=find(
e.target.dataset.edit
);

if(p){

loadPage(p);

scrollTo({
top:0,
behavior:"smooth"
});

}

}

if(e.target.dataset.delete){

removePage(
e.target.dataset.delete
);

}

};


/* ================= DATE CHANGE ================= */

date.onchange=changeCurrent;

async function changeCurrent(){

let p=find(date.value);

p
?
loadPage(p)
:
(
update(),
buttonText(),
saveSettings()
);

}


/* ================= INPUTS ================= */

[
englishInput,
tamilInput,
sinhalaInput,
englishFont,
englishSize,
tamilSize,
sinhalaSize
].forEach(x=>{

x.oninput=()=>{

update();

saveSettings();

};

});


/* ================= BUTTONS ================= */

prevBtn.onclick=()=>{
changeDate(-1);
};

nextBtn.onclick=()=>{
changeDate(1);
};

generateBtn.onclick=generate;


/* ================= CLEAR ================= */

clearBtn.onclick=async()=>{

if(!confirm(
"Delete all generated pages?"
))
return;

await clearDB();

pages=[];

render();

date.value=
"2027-01-01";

englishInput.value=
"Your word is a lamp for my feet, a light on my path.";

tamilInput.value=
"உமது வார்த்தை என் கால்களுக்கு விளக்கும், என் பாதைக்கு வெளிச்சமுமாயிருக்கிறது.";

sinhalaInput.value=

/* ================= PDF ================= */

downloadBtn.onclick=async()=>{

if(!pages.length){

status.textContent=
"No generated pages.";

return;

}

downloadBtn.disabled=true;

try{

let {jsPDF}=window.jspdf;

let pdf=new jsPDF({

orientation:"landscape",

unit:"in",

format:[9,5.625],

compress:true

});

pages.sort(
(a,b)=>a.date.localeCompare(b.date)
);

for(
let i=0;
i<pages.length;
i++
){

if(i){

pdf.addPage(
[9,5.625],
"landscape"
);

}

pdf.addImage(

pages[i].image,

"JPEG",

0,
0,
9,
5.625,

undefined,

"FAST"

);

status.textContent=
`PDF: ${i+1}/${pages.length}`;

await new Promise(
r=>setTimeout(r,5)
);

}

pdf.save(
"365-Bible-Calendar-2027.pdf"
);

status.textContent=
"PDF downloaded successfully.";

}catch(e){

status.textContent=
"PDF error: "+e.message;

}

downloadBtn.disabled=false;

};
