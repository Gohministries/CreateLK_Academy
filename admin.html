<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Referral Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:13px
}

.nav{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:18px;
font-weight:900;
color:#155eef
}

button{
border:0;
border-radius:8px;
padding:9px 12px;
font-size:11px;
font-weight:800;
cursor:pointer
}

.primary{background:#155eef;color:#fff}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#b91c1c}
.copy{background:#eff6ff;color:#155eef}

main{
max-width:900px;
margin:auto;
padding:15px
}

.login{
max-width:380px;
margin:70px auto;
background:#fff;
padding:22px;
border-radius:16px;
box-shadow:0 8px 25px #0001
}

input{
width:100%;
height:42px;
border:1px solid #d0d5dd;
border-radius:8px;
padding:0 10px;
margin:7px 0 12px;
font-size:12px
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px
}

.stat{
background:#fff;
padding:14px;
border-radius:12px;
border:1px solid #e5e7eb
}

.stat small{
display:block;
color:#667085;
font-size:9px;
font-weight:800
}

.stat strong{
display:block;
font-size:20px;
margin-top:4px
}

.section{
margin-bottom:15px
}

.section h2{
font-size:15px;
margin-bottom:9px
}

.payout{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-bottom:10px
}

.payout-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px
}

.code{
font-size:11px;
font-weight:900;
color:#155eef;
word-break:break-all
}

.student{
font-size:10px;
color:#667085;
margin-top:4px
}

.amount{
font-size:20px;
font-weight:900;
margin-top:8px
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:7px;
font-size:9px;
font-weight:900
}

.pending{background:#fff7ed;color:#c2410c}
.paid{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#b91c1c}

.bank{
margin-top:12px;
padding:12px;
background:#f8fafc;
border-radius:10px
}

.bank-title{
font-size:11px;
font-weight:900;
margin-bottom:8px
}

.row{
font-size:10px;
margin:5px 0
}

.row b{
display:inline-block;
width:110px
}

.account{
word-break:break-all
}

.actions{
display:flex;
gap:7px;
margin-top:12px
}

.actions button{
flex:1
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:12px;
padding:20px;
text-align:center;
font-size:11px;
color:#667085
}

.message{
padding:10px;
border-radius:8px;
font-size:11px;
margin-bottom:10px;
display:none
}

.error{
background:#fff1f2;
color:#be123c;
border:1px solid #fecdd3
}

#admin{display:none}

@media(max-width:600px){
.stats{grid-template-columns:1fr 1fr}

.payout-top{
flex-direction:column
}

.actions{
flex-direction:column
}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Referral Admin
</div>

<button onclick="logout()">
Logout
</button>

</div>
</header>

<div id="loginBox" class="login">

<h2>Admin Login</h2>

<p style="font-size:11px;color:#667085;margin:8px 0 12px">
Enter your private admin secret.
</p>

<input
id="secret"
type="password"
placeholder="Admin secret">

<button
class="primary"
style="width:100%"
onclick="login()">
Login
</button>

<div id="loginMessage"
style="color:#b91c1c;font-size:11px;margin-top:9px">
</div>

</div>

<main id="admin">

<div id="errorBox" class="message error"></div>

<div class="stats">

<div class="stat">
<small>STUDENTS</small>
<strong id="students">0</strong>
</div>

<div class="stat">
<small>PREMIUM</small>
<strong id="premium">0</strong>
</div>

<div class="stat">
<small>REFERRALS</small>
<strong id="referrals">0</strong>
</div>

<div class="stat">
<small>PENDING WITHDRAWALS</small>
<strong id="withdrawals">LKR 0</strong>
</div>

</div>

<section class="section">

<h2>💰 Payout Requests</h2>

<div id="payouts">
<div class="empty">
Loading payout requests...
</div>
</div>

</section>

</main>

<script>

const API =
"https://createlk-referral-admin.createlk.workers.dev";

let ADMIN_SECRET =
sessionStorage.getItem(
"createlk_admin_secret"
);


/* =========================
LOGIN
========================= */

function login(){

const value =
document.getElementById("secret")
.value.trim();

if(!value){

document.getElementById("loginMessage")
.textContent =
"Enter the admin secret.";

return;
}

ADMIN_SECRET = value;

sessionStorage.setItem(
"createlk_admin_secret",
value
);

showAdmin();
}


/* =========================
API
========================= */

async function api(path,options={}){

const response =
await fetch(
API + path,
{
...options,

headers:{
"Content-Type":"application/json",
"X-Admin-Secret":ADMIN_SECRET,
...(options.headers || {})
}
}
);

if(response.status === 401){

logout();

throw new Error("Unauthorized");
}

const data =
await response.json();

if(!response.ok){

throw new Error(
data.message ||
"Request failed"
);
}

return data;
}


/* =========================
SHOW ADMIN
========================= */

function showAdmin(){

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"admin"
).style.display="block";

loadAll();
}


/* =========================
SUMMARY
========================= */

async function loadSummary(){

const data =
await api("/api/summary");

if(!data.success){

throw new Error(
data.message ||
"Unable to load summary"
);
}

document.getElementById(
"students"
).textContent =
data.students || 0;

document.getElementById(
"premium"
).textContent =
data.premium || 0;

document.getElementById(
"referrals"
).textContent =
data.referrals || 0;

document.getElementById(
"withdrawals"
).textContent =
"LKR " +
Number(
data.withdrawals?.pending || 0
).toLocaleString();
}


/* =========================
PAYOUTS
========================= */

async function loadPayouts(){

const box =
document.getElementById("payouts");

box.innerHTML =
`<div class="empty">
Loading payout requests...
</div>`;

try{

const data =
await api("/api/payouts");

if(!data.success){

throw new Error(
data.message ||
"Unable to load payouts"
);
}

const payouts =
data.payouts || [];

if(!payouts.length){

box.innerHTML =
`<div class="empty">
No payout requests found.
</div>`;

return;
}

box.innerHTML="";

payouts.forEach(function(p){

const card =
document.createElement("div");

card.className="payout";

const status =
String(p.status || "")
.toLowerCase();

const accountName =
p.account_name || "-";

const bank =
p.bank_name || "-";

const branch =
p.branch || "-";

const accountNumber =
p.account_number || "-";

let actions="";

if(p.status === "PENDING"){

actions=`

<div class="actions">

<button
class="success"
onclick="approvePayout(${p.id})">
✓ Approve
</button>

<button
class="danger"
onclick="rejectPayout(${p.id})">
✕ Reject
</button>

</div>

`;

}

card.innerHTML=`

<div class="payout-top">

<div>

<div class="code">
${escapeHTML(p.payout_code || "-")}
</div>

<div class="student">
Student ID: ${escapeHTML(
String(p.student_id || "-")
)}
</div>

</div>

<span class="badge ${status}">
${escapeHTML(p.status || "-")}
</span>

</div>

<div class="amount">
LKR ${Number(
p.amount || 0
).toLocaleString()}
</div>

<div class="bank">

<div class="bank-title">
🏦 Bank Account
</div>

<div class="row">
<b>Account Name</b>
${escapeHTML(accountName)}
</div>

<div class="row">
<b>Bank</b>
${escapeHTML(bank)}
</div>

<div class="row">
<b>Branch</b>
${escapeHTML(branch)}
</div>

<div class="row account">
<b>Account Number</b>
${escapeHTML(accountNumber)}
</div>

<button
class="copy"
style="margin-top:8px"
onclick="copyAccount('${escapeJS(accountNumber)}')">
📋 Copy Account Number
</button>

</div>

<div style="
font-size:9px;
color:#667085;
margin-top:9px">
Requested:
${escapeHTML(
p.created_at || "-"
)}
</div>

${actions}

`;

box.appendChild(card);

});

}catch(error){

console.error(error);

box.innerHTML=
`<div class="empty">
Unable to load payout requests.<br>
${escapeHTML(error.message)}
</div>`;
}

}


/* =========================
APPROVE
========================= */

async function approvePayout(id){

if(!confirm(
"Confirm that this payout has been transferred?"
)) return;

try{

const data =
await api(
"/api/payout/approve",
{
method:"POST",

body:JSON.stringify({
id:id
})
}
);

alert(
data.message ||
"Payout approved."
);

loadAll();

}catch(error){

alert(
error.message ||
"Unable to approve payout."
);

}

}


/* =========================
REJECT
========================= */

async function rejectPayout(id){

if(!confirm(
"Reject this payout request?"
)) return;

try{

const data =
await api(
"/api/payout/reject",
{
method:"POST",

body:JSON.stringify({
id:id
})
}
);

alert(
data.message ||
"Payout rejected."
);

loadAll();

}catch(error){

alert(
error.message ||
"Unable to reject payout."
);

}

}


/* =========================
COPY ACCOUNT
========================= */

async function copyAccount(value){

if(!value || value === "-"){

alert("Account number not available.");

return;
}

try{

await navigator.clipboard.writeText(value);

alert("Account number copied.");

}catch(error){

prompt(
"Copy account number:",
value
);

}

}


/* =========================
ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* =========================
ESCAPE JS
========================= */

function escapeJS(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}


/* =========================
LOAD ALL
========================= */

async function loadAll(){

document.getElementById(
"errorBox"
).style.display="none";

try{

await Promise.all([
loadSummary(),
loadPayouts()
]);

}catch(error){

console.error(error);

const box =
document.getElementById("errorBox");

box.textContent =
error.message ||
"Unable to load admin data.";

box.style.display="block";
}

}


/* =========================
LOGOUT
========================= */

function logout(){

sessionStorage.removeItem(
"createlk_admin_secret"
);

ADMIN_SECRET="";

location.reload();
}


/* =========================
AUTO LOGIN
========================= */

if(ADMIN_SECRET){

showAdmin();

}

</script>

</body>
</html>
