<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033
}

.app{
 max-width:1100px;
 margin:auto
}

h2{
 text-align:center;
 margin:0 0 18px
}

.controls{
 background:#fff;
 padding:18px;
 border-radius:12px;
 box-shadow:0 4px 18px #0001;
 margin-bottom:20px
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

label{
 font-size:13px;
 font-weight:bold;
 display:block;
 margin-bottom:5px
}

input,textarea,select{
 width:100%;
 padding:10px;
 border:1px solid #ccd2dc;
 border-radius:7px;
 font-family:inherit
}

textarea{
 min-height:90px;
 resize:vertical
}

.full{
 grid-column:1/-1
}

button{
 border:0;
 border-radius:7px;
 padding:11px 16px;
 cursor:pointer;
 font-weight:bold;
 background:#172033;
 color:white;
 margin:5px 4px 0 0
}

button:hover{
 opacity:.9
}

#calendar{
 width:1200px;
 height:900px;
 margin:25px auto;
 position:relative;
 overflow:hidden;
 background:#f5f1e8;
 box-shadow:0 8px 30px #0002
}

.main{
 position:absolute;
 top:45px;
 left:45px;
 right:45px;
 bottom:45px;

 display:grid;
 grid-template-columns:44% 56%;
 gap:28px
}

.text{
 min-width:0;
 height:100%;
 padding:32px 28px;

 background:rgba(248,245,237,.98);
 border:1px solid #b89445;
 border-radius:7px;

 overflow:hidden;

 display:flex;
 flex-direction:column
}

.dayrow{
 display:flex;
 align-items:end;
 justify-content:space-between;
 border-bottom:2px solid #b89445;
 padding-bottom:14px;
 margin-bottom:22px
}

.day{
 font-family:Montserrat,sans-serif;
 font-size:34px;
 font-weight:700;
 color:#172033
}

.date{
 font-family:Montserrat,sans-serif;
 font-size:18px;
 font-weight:600;
 color:#6d624f
}

.lang{
 font-family:Montserrat,sans-serif;
 font-size:13px;
 font-weight:700;
 letter-spacing:2px;
 color:#9b7831;
 margin-bottom:10px
}

.english{
 font-family:"Playfair Display",serif;
 font-size:27px;
 line-height:1.45;
 font-weight:600;
 color:#172033
}

.reference{
 margin-top:15px;
 font-family:Montserrat,sans-serif;
 font-size:15px;
 font-weight:700;
 color:#9b7831
}

.translation{
 margin-top:25px;
 padding-top:18px;
 border-top:1px solid #d5c9ad
}

.translation b{
 display:block;
 font-family:Montserrat,sans-serif;
 font-size:12px;
 letter-spacing:1.5px;
 margin-bottom:8px;
 color:#6d624f
}

.tamil{
 font-family:"Noto Sans Tamil",sans-serif;
 font-size:18px;
 line-height:1.55;
 color:#38332c
}

.sinhala{
 font-family:"Noto Sans Sinhala",sans-serif;
 font-size:17px;
 line-height:1.6;
 color:#50545b
}

.photo{
 position:relative;
 width:100%;
 height:100%;
 overflow:hidden;
 border:1px solid #b89445;
 border-radius:7px;
 background:#e5e0d5
}

.photo img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center center;
 display:none
}

@media(max-width:1250px){
 #calendar{
  transform-origin:top left;
  transform:scale(.8);
  margin-bottom:-150px
 }
}

@media(max-width:700px){
 .grid{
  grid-template-columns:1fr
 }

 .full{
  grid-column:auto
 }

 #calendar{
  transform:scale(.45);
  margin-left:0;
  margin-bottom:-480px
 }
}
</style>
</head>

<body>

<div class="app">

<h2>365-Day Bible Calendar</h2>

<div class="controls">

<div class="grid">

<div>
<label>Day</label>
<input id="day" type="number" min="1" max="365" value="1">
</div>

<div>
<label>Date</label>
<input id="date" type="date" value="2027-01-01">
</div>

<div class="full">
<label>Upload Photo</label>
<input id="photo" type="file" accept="image/*">
</div>

<div class="full">
<label>English Bible Verse</label>
<textarea id="english">The LORD will open the heavens, the storehouse of his bounty, to send rain on your land in season and to bless all the work of your hands. You will lend to many nations but will borrow from none.</textarea>
</div>

<div class="full">
<label>Tamil Bible Verse</label>
<textarea id="tamil">ஏற்ற காலத்தில் உன் தேசத்திலே மழை பெய்யவும் நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார்; நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.</textarea>
</div>

<div class="full">
<label>Sinhala Bible Verse</label>
<textarea id="sinhala">ස්වාමීන්වහන්සේ නිසි කාලයට නුඹේ දේශයට වර්ෂාව දෙන්ටද නුඹේ අත්වල සියලු වැඩට ආශීර්වාද කරන්ටද අහස නමැති තමන්ගේ උතුම් ගබඩාව නුඹට විවෘත කරනසේක. නුඹ බොහෝ ජාතීන්ට ණයට දෙන නුමුත් නුඹ ණයට නොගන්නෙහිය.</textarea>
</div>

<div>
<label>Bible Reference</label>
<input id="reference" value="Deuteronomy 28:12">
</div>

<div>
<label>Photo Position</label>
<select id="position">
<option value="center center">Center</option>
<option value="center top">Top</option>
<option value="center bottom">Bottom</option>
<option value="left center">Left</option>
<option value="right center">Right</option>
</select>
</div>

</div>

<div>
<button onclick="updatePreview()">Update Preview</button>
<button onclick="savePNG()">Save PNG</button>
<button onclick="clearPhoto()">Remove Photo</button>
</div>

</div>


<!-- CALENDAR -->

<div id="calendar">

<div class="main">

<!-- LEFT TEXT -->

<div class="text">

<div class="dayrow">
<div id="outDay" class="day">DAY 1</div>
<div id="outDate" class="date">January 1, 2027</div>
</div>

<div class="lang">ENGLISH</div>

<div id="outEnglish" class="english"></div>

<div id="outReference" class="reference"></div>

<div class="translation">
<b>தமிழ் • TAMIL</b>
<div id="outTamil" class="tamil"></div>
</div>

<div class="translation">
<b>සිංහල • SINHALA</b>
<div id="outSinhala" class="sinhala"></div>
</div>

</div>


<!-- RIGHT PHOTO -->

<div class="photo">
<img id="outPhoto" alt="Uploaded photo">
</div>

</div>

</div>

</div>


<script>

const $ = id => document.getElementById(id);

let photoData = "";


/* UPDATE PREVIEW */

function updatePreview(){

 $("outDay").textContent =
  "DAY " + $("day").value;

 const d = new Date($("date").value);

 $("outDate").textContent =
  d.toLocaleDateString("en-US",{
   month:"long",
   day:"numeric",
   year:"numeric"
  });

 $("outEnglish").textContent =
  $("english").value;

 $("outTamil").textContent =
  $("tamil").value;

 $("outSinhala").textContent =
  $("sinhala").value;

 $("outReference").textContent =
  "— " + $("reference").value;

 $("outPhoto").style.objectPosition =
  $("position").value;

 if(photoData){
  $("outPhoto").src = photoData;
  $("outPhoto").style.display = "block";
 }

}


/* PHOTO UPLOAD */

$("photo").addEventListener("change",function(e){

 const file = e.target.files[0];

 if(!file) return;

 const reader = new FileReader();

 reader.onload = function(event){

  photoData = event.target.result;

  $("outPhoto").src = photoData;
  $("outPhoto").style.display = "block";

 };

 reader.readAsDataURL(file);

});


/* PHOTO POSITION */

$("position").addEventListener("change",function(){

 $("outPhoto").style.objectPosition =
  this.value;

});


/* REMOVE PHOTO */

function clearPhoto(){

 photoData = "";

 $("outPhoto").src = "";
 $("outPhoto").style.display = "none";

 $("photo").value = "";

}


/* SAVE PNG */

async function savePNG(){

 updatePreview();

 const calendar = $("calendar");

 const canvas = await html2canvas(calendar,{
  scale:3,
  useCORS:true,
  backgroundColor:"#f5f1e8"
 });

 const link = document.createElement("a");

 const day =
  $("day").value || "1";

 link.download =
  "Bible-Calendar-Day-" + day + ".png";

 link.href =
  canvas.toDataURL("image/png");

 link.click();

}


/* AUTO DATE FROM DAY */

$("day").addEventListener("input",function(){

 let day = parseInt(this.value);

 if(day < 1 || day > 365) return;

 const date =
  new Date(2027,0,day);

 const yyyy =
  date.getFullYear();

 const mm =
  String(date.getMonth()+1).padStart(2,"0");

 const dd =
  String(date.getDate()).padStart(2,"0");

 $("date").value =
  yyyy + "-" + mm + "-" + dd;

});


/* INITIAL PREVIEW */

updatePreview();

</script>

</body>
</html>
