<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d8d1c8;color:#302c28;font:14px Arial;padding:18px}
.controls{max-width:1150px;margin:auto auto 18px;background:#fffdf9;padding:15px;border:1px solid #b9ad9f;border-radius:12px;box-shadow:0 5px 20px #0002}
h2{font:700 19px Georgia;color:#4d3b51;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{display:block;font-size:10px;font-weight:bold;margin:5px 0;color:#554c46}
input,textarea,select{width:100%;padding:8px;border:1px solid #c8bcaf;border-radius:7px;background:#fff;font:inherit}
textarea{height:60px;resize:vertical}
input[type=range]{padding:0;accent-color:#70547b}
.bar{display:grid;grid-template-columns:1fr 42px;gap:6px;align-items:center}
.value{text-align:center;font-size:10px;font-weight:bold;color:#70547b}
.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{padding:9px 13px;border:1px solid #5e4968;border-radius:7px;background:#70547b;color:#fff;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(.9)}
.secondary{background:#817265;border-color:#6f6155}
.green{background:#58735e;border-color:#4a6250}
.red{background:#985c58;border-color:#814b48}
.status{margin-top:9px;padding:8px;background:#f0ebe4;border-radius:7px;font-size:11px;color:#655c55}
.selectedDates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{padding:5px 8px;border-radius:20px;background:#ece4da;border:1px solid #c9bdae;font-size:10px}
.chip button{padding:1px 5px;border:0;border-radius:50%;background:#9a625e;font-size:9px}

/* CALENDAR */
.calendar{
 width:min(1100px,100%);
 aspect-ratio:16/10;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#f5eee3;
 border:1px solid #665d55;
 outline:2px solid #665d55;
 outline-offset:-7px;
 box-shadow:0 8px 25px #0003;
 print-color-adjust:exact;
 -webkit-print-color-adjust:exact
}

/* FULL COVER */
.coverPhoto{
 position:absolute;
 inset:0;
 z-index:0;
 overflow:hidden;
 display:none
}

.coverPhoto img{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 object-position:center;
 transform-origin:center
}

.coverOverlay{
 position:absolute;
 inset:0;
 background:#000;
 opacity:.2;
 pointer-events:none
}

/* LEFT PHOTO */
.photo{
 position:absolute;
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 overflow:hidden;
 background:#ddd4ca;
 border-radius:3px;
 box-shadow:0 2px 7px #0002;
 z-index:1
}

#art{
 width:100%;
 height:100%
}

#art img{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 object-position:center;
 transform-origin:center
}

/* CONTENT */
.content{
 position:absolute;
 left:37%;
 right:5%;
 top:5%;
 bottom:5%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
 z-index:3
}

.coverMode .content{
 left:7%;
 right:7%;
 top:7%;
 bottom:7%;
 text-shadow:0 1px 5px #0009
}

.dateRow{
 height:14%;
 min-height:50px;
 display:flex;
 align-items:center;
 border-bottom:1px solid #d8cec1;
 position:relative
}

.coverMode .dateRow{border-bottom-color:#ffffff80}

.dateText{
 font:700 clamp(35px,5.5vw,68px)/1 Georgia;
 color:#51465b
}

.coverMode .dateText{color:#fff}

.cross{
 position:absolute;
 right:1px;
 top:2px;
 font:18px Georgia;
 color:#69546f
}

.coverMode .cross{color:#fff}

.verses{
 flex:1;
 min-height:0;
 overflow:hidden;
 margin:6px 0
}

#verseBox{
 height:100%;
 display:flex;
 flex-direction:column;
 overflow:hidden
}

.section{
 flex:1;
 min-height:0;
 padding:7px 13px;
 border-top:1px solid #ddd3c8;
 overflow:hidden
}

.section:first-child{border-top:0}

.coverMode .section{border-top-color:#ffffff66}

.txt{
 width:100%;
 max-height:100%;
 overflow:hidden;
 overflow-wrap:anywhere;
 word-break:break-word
}

.en{font:500 25px/1.28 Georgia;color:#49334f}
.ta{font:500 18px/1.42 "Noto Sans Tamil",sans-serif;color:#76502f}
.si{font:500 18px/1.42 "Noto Sans Sinhala",sans-serif;color:#3f604a}

.coverMode .en,
.coverMode .ta,
.coverMode .si,
.coverMode .ref{color:#fff}

.left{text-align:left}
.center{text-align:center}
.right{text-align:right}

.ref{
 min-height:27px;
 border-top:1px solid #d8cec1;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 font:700 12px Georgia;
 color:#756c65;
 overflow:hidden;
 overflow-wrap:anywhere
}

.coverMode .ref{border-top-color:#ffffff80}

@media(max-width:700px){
 body{padding:7px}
 .controls{padding:10px}
 .grid{grid-template-columns:1fr}
 .photo{left:4%;width:29%}
 .content{left:37%;right:4%;top:4%;bottom:4%}
 .coverMode .content{left:8%;right:8%}
 .dateText{font-size:clamp(22px,6vw,42px)}
 .cross{font-size:14px}
 .section{padding:4px 8px}
}

@media print{
 body{padding:0;background:#fff}
 .controls{display:none}
 .calendar{width:9in;height:5.625in;box-shadow:none}
}
</style>
</head>

<body>

<div class="controls">

<h2>365 Bible Calendar 2027</h2>

<div class="grid">

<div>
<label>Date</label>
<input id="date" type="date" min="2027-01-01" max="2027-12-31" value="2027-01-01">
</div>

<div>
<label>Bible Reference</label>
<input id="ref" value="John 3:16">
</div>

<div>
<label>Photo Layout</label>
<select id="photoMode">
<option value="left">Left Photo Panel</option>
<option value="cover">Full Page Cover</option>
</select>
</div>

<div>
<label>Upload Photo</label>
<input id="photoUpload" type="file" accept="image/*">
</div>

<div>
<label>Photo Fit</label>
<select id="photoFit">
<option value="cover">Fill / Crop</option>
<option value="contain">Show Full Photo</option>
</select>
</div>

<div>
<label>Photo Position</label>
<select id="photoPos">
<option value="center">Center</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div>

<div>
<label>Brightness</label>
<div class="bar">
<input id="brightness" type="range" min="40" max="160" value="100">
<span class="value" id="brightnessV">100%</span>
</div>
</div>

<div>
<label>Contrast</label>
<div class="bar">
<input id="contrast" type="range" min="50" max="180" value="100">
<span class="value" id="contrastV">100%</span>
</div>
</div>

<div>
<label>Saturation</label>
<div class="bar">
<input id="saturation" type="range" min="0" max="180" value="100">
<span class="value" id="saturationV">100%</span>
</div>
</div>

<div>
<label>Photo Opacity</label>
<div class="bar">
<input id="opacity" type="range" min="20" max="100" value="100">
<span class="value" id="opacityV">100%</span>
</div>
</div>

<div>
<label>Blur</label>
<div class="bar">
<input id="blur" type="range" min="0" max="8" value="0">
<span class="value" id="blurV">0px</span>
</div>
</div>

<div>
<label>Rotation</label>
<div class="bar">
<input id="rotation" type="range" min="-10" max="10" value="0">
<span class="value" id="rotationV">0°</span>
</div>
</div>

<div>
<label>Cover Dark Overlay</label>
<div class="bar">
<input id="overlay" type="range" min="0" max="80" value="20">
<span class="value" id="overlayV">20%</span>
</div>
</div>

<div>
<label>English Verse</label>
<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="ens" type="range" min="12" max="38" value="25">
<span class="value" id="ensv">25</span>
</div>
</div>

<div>
<label>Tamil Verse</label>
<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="tas" type="range" min="10" max="30" value="18">
<span class="value" id="tasv">18</span>
</div>
</div>

<div>
<label>Sinhala Verse</label>
<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>

<label>Font Size</label>
<div class="bar">
<input id="sis" type="range" min="10" max="30" value="18">
<span class="value" id="sisv">18</span>
</div>
</div>

<div>
<label>English Alignment</label>
<select id="ena">
<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>
</select>
</div>

<div>
<label>Tamil Alignment</label>
<select id="taa">
<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>
</select>
</div>

<div>
<label>Sinhala Alignment</label>
<select id="sia">
<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>
</select>
</div>

<div>
<label>Verse Position</label>
<div class="bar">
<input id="pos" type="range" min="0" max="100" value="0">
<span class="value" id="posv">Top</span>
</div>
</div>

<div>
<label>Language Spacing</label>
<div class="bar">
<input id="space" type="range" min="0" max="25" value="5">
<span class="value" id="spacev">5px</span>
</div>
</div>

</div>

<div class="buttons">
<button id="prev">Previous</button>
<button id="next">Next</button>
<button id="generate" class="green">Generate</button>
<button id="add" class="secondary">Add Date to PDF</button>
<button id="clear" class="red">Clear Dates</button>
<button id="current">Current PDF</button>
<button id="multi" class="green">Download Selected PDF</button>
</div>

<div class="status" id="status">
No photo uploaded | Selected PDF pages: 0 / 10
</div>

<div class="selectedDates" id="selected"></div>

</div>


<!-- CALENDAR -->

<div class="calendar" id="calendar">

<div class="coverPhoto" id="coverPhoto">

<div id="coverPlaceholder"
style="
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
background:#ddd4ca;
color:#70665e;
font:14px Georgia">
Upload photo
</div>

<div class="coverOverlay" id="coverOverlay"></div>

</div>


<div class="photo">

<div id="art">

<div style="
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
background:#ddd4ca;
color:#70665e;
font:12px Georgia">
Upload photo
</div>

</div>

</div>


<div class="content">

<div class="dateRow">
<div class="dateText" id="dateText"></div>
<div class="cross">✝</div>
</div>

<div class="verses">

<div id="verseBox">

<div class="section">
<div id="enText" class="txt en left"></div>
</div>

<div class="section">
<div id="taText" class="txt ta left"></div>
</div>

<div class="section">
<div id="siText" class="txt si left"></div>
</div>

</div>

</div>

<div class="ref" id="refText"></div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

let photoData="";
let selectedDates=[];


/* PHOTO UPLOAD */

$("photoUpload").addEventListener("change",function(){

 const file=this.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("Please select an image.");
  return;
 }

 const reader=new FileReader();

 reader.onload=()=>{
  photoData=reader.result;
  updatePhoto();
  updateStatus();
 };

 reader.readAsDataURL(file);
});


/* PHOTO UPDATE */

function updatePhoto(){

 const fit=$("photoFit").value;
 const pos=$("photoPos").value;

 const filter=
 `brightness(${$("brightness").value}%)
  contrast(${$("contrast").value}%)
  saturate(${$("saturation").value}%)
  blur(${$("blur").value}px)`;

 const transform=
 `rotate(${$("rotation").value}deg)`;

 const opacity=+$("opacity").value/100;

 if(photoData){

  $("art").innerHTML=
  `<img src="${photoData}" alt="">`;

  const leftImg=$("art").querySelector("img");

  leftImg.style.objectFit=fit;
  leftImg.style.objectPosition=pos;
  leftImg.style.filter=filter;
  leftImg.style.transform=transform;
  leftImg.style.opacity=opacity;


  $("coverPhoto").innerHTML=`
  <img id="coverImg" src="${photoData}" alt="">
  <div class="coverOverlay" id="coverOverlay"></div>
  `;

  const coverImg=$("coverPhoto").querySelector("img");

  coverImg.style.objectFit=fit;
  coverImg.style.objectPosition=pos;
  coverImg.style.filter=filter;
  coverImg.style.transform=transform;
  coverImg.style.opacity=opacity;

  $("coverOverlay").style.opacity=
   +$("overlay").value/100;

 }else{

  $("art").innerHTML=`
  <div style="
  width:100%;height:100%;
  display:flex;align-items:center;
  justify-content:center;
  background:#ddd4ca;
  color:#70665e;
  font:12px Georgia">
  Upload photo
  </div>`;

  $("coverPhoto").innerHTML=`
  <div style="
  width:100%;height:100%;
  display:flex;align-items:center;
  justify-content:center;
  background:#ddd4ca;
  color:#70665e;
  font:14px Georgia">
  Upload photo
  </div>
  `;
 }

 updateMode();
}


/* PHOTO MODE */

$("photoMode").addEventListener("change",updateMode);

function updateMode(){

 const cover=$("photoMode").value==="cover";

 $("calendar").classList.toggle("coverMode",cover);

 $("coverPhoto").style.display=
  cover?"block":"none";

 $("photo").style.display=
  cover?"none":"block";
}


/* PHOTO CONTROLS */

[
 ["brightness","brightnessV","%"],
 ["contrast","contrastV","%"],
 ["saturation","saturationV","%"],
 ["opacity","opacityV","%"],
 ["blur","blurV","px"],
 ["rotation","rotationV","°"],
 ["overlay","overlayV","%"]
].forEach(x=>{

 $(x[0]).addEventListener("input",()=>{

  $(x[1]).textContent=
   $(x[0]).value+x[2];

  updatePhoto();
 });
});

$("photoFit").addEventListener("change",updatePhoto);
$("photoPos").addEventListener("change",updatePhoto);


/* GENERATE */

function generate(){

 const d=new Date($("date").value+"T00:00:00");

 if(isNaN(d))return;

 $("dateText").textContent=
  d.toLocaleDateString("en-US",{
   month:"short",
   day:"numeric"
  });

 $("enText").textContent=$("en").value;
 $("taText").textContent=$("ta").value;
 $("siText").textContent=$("si").value;
 $("refText").textContent=$("ref").value;

 $("enText").className=
  "txt en "+$("ena").value;

 $("taText").className=
  "txt ta "+$("taa").value;

 $("siText").className=
  "txt si "+$("sia").value;

 setSize("enText","ens");
 setSize("taText","tas");
 setSize("siText","sis");

 $("spacev").textContent=
  $("space").value+"px";

 requestAnimationFrame(()=>{
  requestAnimationFrame(position);
 });
}


function setSize(id,slider){

 $(id).style.fontSize=
  $(slider).value+"px";

 $(slider+"v").textContent=
  $(slider).value;
}


function position(){

 const p=+$("pos").value;

 $("posv").textContent=
  p===0?"Top":
  p===50?"Center":
  p===100?"Bottom":
  p+"%";

 document.querySelectorAll(".section").forEach(s=>{

  const t=s.querySelector(".txt");

  t.style.transform="translateY(0)";

  const free=s.clientHeight-t.offsetHeight;

  if(free>0)
   t.style.transform=
    `translateY(${free*p/100}px)`;
 });

 document.querySelectorAll(".section").forEach((s,i)=>{
  s.style.marginTop=
   i?$("space").value+"px":"0";
 });
}


/* DATE */

function move(n){

 const d=new Date($("date").value+"T00:00:00");

 d.setDate(d.getDate()+n);

 if(
  d<new Date("2027-01-01T00:00:00")||
  d>new Date("2027-12-31T00:00:00")
 )return;

 $("date").value=
  d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

 generate();
}


/* PDF DATES */

function addDate(){

 const d=$("date").value;

 if(selectedDates.includes(d)){
  alert("This date is already selected.");
  return;
 }

 if(selectedDates.length>=10){
  alert("Maximum 10 pages.");
  return;
 }

 selectedDates.push(d);
 renderDates();
}


function removeDate(i){

 selectedDates.splice(i,1);
 renderDates();
}


function clearDates(){

 selectedDates=[];
 renderDates();
}


function renderDates(){

 $("selected").innerHTML=
  selectedDates.map((d,i)=>{

   const date=new Date(d+"T00:00:00");

   return `
   <div class="chip">
   ${i+1}.
   ${date.toLocaleDateString("en-US",{
    month:"short",
    day:"numeric"
   })}
   <button data-remove="${i}">×</button>
   </div>`;

  }).join("");

 document.querySelectorAll("[data-remove]")
 .forEach(b=>{
  b.onclick=()=>{
   removeDate(+b.dataset.remove);
  };
 });

 updateStatus();
}


function updateStatus(){

 $("status").textContent=
  (photoData?"Photo uploaded":"No photo uploaded")+
  " | Layout: "+
  ($("photoMode").value==="cover"?
   "Full Page Cover":"Left Photo Panel")+
  " | Selected PDF pages: "+
  selectedDates.length+" / 10";
}


/* CAPTURE */

async function capture(){

 generate();
 updatePhoto();
 updateMode();

 if(document.fonts)
  await document.fonts.ready;

 await new Promise(r=>setTimeout(r,350));

 return await html2canvas($("calendar"),{
  scale:3,
  useCORS:true,
  allowTaint:false,
  backgroundColor:null,
  imageTimeout:0,
  logging:false
 });
}


/* CURRENT PDF */

async function currentPDF(){

 if(!photoData){
  alert("Please upload a photo first.");
  return;
 }

 const {jsPDF}=window.jspdf;

 if(!jsPDF){
  alert("PDF library is not loaded.");
  return;
 }

 const c=await capture();

 const pdf=new jsPDF({
  orientation:"landscape",
  unit:"in",
  format:[9,5.625],
  compress:true
 });

 pdf.addImage(
  c.toDataURL("image/jpeg",.96),
  "JPEG",
  0,0,9,5.625
 );

 pdf.save(
  "Bible-Calendar-"+$("date").value+".pdf"
 );
}


/* MULTI PDF */

async function multiPDF(){

 if(!selectedDates.length){
  alert("Add at least one date first.");
  return;
 }

 if(!photoData){
  alert("Please upload a photo first.");
  return;
 }

 const {jsPDF}=window.jspdf;

 if(!jsPDF){
  alert("PDF library is not loaded.");
  return;
 }

 const original=$("date").value;

 const pdf=new jsPDF({
  orientation:"landscape",
  unit:"in",
  format:[9,5.625],
  compress:true
 });

 try{

  for(let i=0;i<selectedDates.length;i++){

   $("date").value=selectedDates[i];

   const c=await capture();

   if(i)
    pdf.addPage([9,5.625],"landscape");

   pdf.addImage(
    c.toDataURL("image/jpeg",.96),
    "JPEG",
    0,0,9,5.625
   );

   $("status").textContent=
    "Creating PDF "+
    (i+1)+" / "+selectedDates.length;
  }

  pdf.save(
   "Bible-Calendar-"+selectedDates.length+"-Pages.pdf"
  );

 }catch(e){

  console.error(e);
  alert("PDF creation failed.");

 }finally{

  $("date").value=original;

  generate();
  updatePhoto();
  updateMode();
  renderDates();
 }
}


/* BUTTONS */

$("prev").addEventListener("click",()=>move(-1));
