<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#eef1f5;
 font-family:Arial,sans-serif;
 color:#172033
}

.app{
 max-width:1100px;
 margin:auto
}

h2{
 text-align:center;
 margin:0 0 15px
}

.controls{
 background:#fff;
 padding:15px;
 border-radius:12px;
 box-shadow:0 3px 15px #0001;
 margin-bottom:18px
}

.row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}

label{
 font-size:13px;
 font-weight:bold
}

input,textarea{
 width:100%;
 margin-top:5px;
 padding:9px;
 border:1px solid #ccd3df;
 border-radius:7px;
 font:inherit
}

textarea{
 height:75px;
 resize:vertical
}

.buttons{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap
}

button{
 border:0;
 padding:10px 15px;
 border-radius:7px;
 background:#172033;
 color:white;
 cursor:pointer;
 font-weight:bold
}

button:hover{opacity:.88}


/* =========================
   12 × 9 LANDSCAPE CALENDAR
   ========================= */

.calendar{
 width:100%;
 aspect-ratio:4/3;
 position:relative;
 overflow:hidden;
 background:#101a30;

 border:3px solid #172033;
 outline:1px solid #c7a35a;
 outline-offset:-7px;

 box-shadow:0 5px 25px #0002
}


/* SCENIC SVG */

.visual{
 position:absolute;
 inset:0;
 width:100%;
 height:100%
}

.visual svg{
 width:100%;
 height:100%;
 display:block
}


/* LEFT TEXT PANEL */

.text{
 position:absolute;
 left:0;
 top:0;
 bottom:0;

 width:47%;

 padding:5% 4.5% 4.5%;

 display:flex;
 flex-direction:column;
 justify-content:center;

 color:#fff;

 background:
 linear-gradient(
  90deg,
  rgba(5,14,27,.93) 0%,
  rgba(8,20,34,.86) 72%,
  rgba(8,20,34,.18) 100%
 );

 border-right:1px solid rgba(220,184,103,.55);

 text-shadow:0 1px 3px #0008
}


/* SMALL TOP LABEL */

.label{
 font-family:Georgia,serif;
 font-size:clamp(11px,1.25vw,17px);
 letter-spacing:3px;
 font-weight:bold;
 color:#e2bd70;
 margin-bottom:5px
}


/* DATE */

.date{
 font-family:Georgia,serif;
 font-size:clamp(17px,2.3vw,32px);
 font-weight:bold;
 color:#fff;
 margin-bottom:12px
}


/* ENGLISH */

.en{
 font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(14px,1.65vw,23px);
 line-height:1.38;
 font-weight:bold;
 color:#f0cc7a;
 margin-bottom:12px
}


/* TAMIL */

.ta{
 font-family:"Latha","Vijaya","Noto Sans Tamil",sans-serif;
 font-size:clamp(11px,1.25vw,17px);
 line-height:1.48;
 color:#fff;
 margin-bottom:10px
}


/* SINHALA */

.si{
 font-family:"Iskoola Pota","Noto Sans Sinhala",sans-serif;
 font-size:clamp(10px,1.18vw,16px);
 line-height:1.5;
 color:#d9dde2;
 margin-bottom:8px
}


/* REFERENCE */

.ref{
 font-family:Georgia,serif;
 font-size:clamp(11px,1.25vw,17px);
 font-weight:bold;
 color:#e2bd70;
 margin-top:3px
}


/* BOTTOM MESSAGE */

.bottom{
 margin-top:9px;
 font-size:clamp(7px,.8vw,11px);
 letter-spacing:1.7px;
 color:#ddd;
 font-weight:bold
}


/* OUTER DECORATIVE FRAME */

.calendar:after{
 content:"";
 position:absolute;
 inset:12px;

 border:1px solid rgba(225,193,116,.7);
 border-radius:5px;

 pointer-events:none
}


/* MOBILE */

@media(max-width:700px){

 .row{
  grid-template-columns:1fr 1fr
 }

 .calendar{
  aspect-ratio:4/3
 }

 .text{
  width:62%;
  padding:7% 5% 5%
 }

 .en{
  font-size:14px
 }

 .ta,.si{
  font-size:10px
 }
}
</style>
</head>

<script>

const $=id=>document.getElementById(id);


/* =========================
   DAY OF YEAR
   ========================= */

function dayOfYear(d){

 const start=
  new Date(d.getFullYear(),0,1);

 return Math.floor(
  (d-start)/86400000
 )+1;
}


/* =========================
   SEEDED RANDOM
   ========================= */

function rnd(n){

 const x=
  Math.sin(n*999.123)*43758.5453;

 return x-Math.floor(x);
}


/* =========================
   EASTER
   ========================= */

function easter(year){

 const a=year%19;
 const b=Math.floor(year/100);
 const c=year%100;
 const d=Math.floor(b/4);
 const e=b%4;
 const f=Math.floor((b+8)/25);
 const g=Math.floor((b-f+1)/3);
 const h=(19*a+b-d-g+15)%30;
 const i=Math.floor(c/4);
 const k=c%4;
 const l=(32+2*e+2*i-h-k)%7;
 const m=Math.floor((a+11*h+22*l)/451);

 const month=
  Math.floor((h+l-7*m+114)/31);

 const day=
  ((h+l-7*m+114)%31)+1;

 return new Date(
  year,
  month-1,
  day
 );
}


/* =========================
   SPECIAL DAYS
   ========================= */

function special(d){

 const y=d.getFullYear();

 const e=easter(y);


 const good=new Date(e);
 good.setDate(e.getDate()-2);


 const pent=new Date(e);
 pent.setDate(e.getDate()+49);


 /* SECOND SUNDAY OF MAY */

 const mothers=new Date(y,4,1);

 mothers.setDate(
  1+(7-mothers.getDay())%7+7
 );


 /* THIRD SUNDAY OF JUNE */

 const fathers=new Date(y,5,1);

 fathers.setDate(
  1+(7-fathers.getDay())%7+14
 );


 if(d.getMonth()===0 && d.getDate()===1)
  return"NEW YEAR";


 if(d.getMonth()===1 && d.getDate()===14)
  return"VALENTINE'S DAY";


 if(d.toDateString()===good.toDateString())
  return"GOOD FRIDAY";


 if(d.toDateString()===e.toDateString())
  return"EASTER SUNDAY";


 if(d.toDateString()===mothers.toDateString())
  return"MOTHER'S DAY";


 if(d.toDateString()===pent.toDateString())
  return"PENTECOST";


 if(d.toDateString()===fathers.toDateString())
  return"FATHER'S DAY";


 if(d.getMonth()===11 && d.getDate()===24)
  return"CHRISTMAS EVE";


 if(d.getMonth()===11 && d.getDate()===25)
  return"CHRISTMAS DAY";


 if(d.getMonth()===11 && d.getDate()===31)
  return"YEAR END";


 return"";
}


/* =========================
   DATE TEXT
   ========================= */

function dateText(d){

 return d.toLocaleDateString(
  "en-US",
  {
   month:"long",
   day:"numeric"
  }
 );
}


/* =========================
   CLOUDS
   ========================= */

function clouds(n){

 let s="";

 for(let i=0;i<5;i++){

  const x=80+rnd(n+i*8)*700;
  const y=80+rnd(n+i*11)*230;
  const w=70+rnd(n+i)*100;

  s+=`
  <g
   fill="#fff"
   opacity="${.06+rnd(n+i)*.09}"
   filter="url(#cloud)">

   <ellipse
    cx="${x}"
    cy="${y}"
    rx="${w}"
    ry="${w*.25}"/>

   <ellipse
    cx="${x-w*.45}"
    cy="${y+8}"
    rx="${w*.45}"
    ry="${w*.20}"/>

   <ellipse
    cx="${x+w*.45}"
    cy="${y+7}"
    rx="${w*.5}"
    ry="${w*.22}"/>

  </g>`;
 }

 return s;
}


/* =========================
   STARS
   ========================= */

function stars(n){

 let s="";

 for(let i=0;i<70;i++){

  const x=rnd(n+i*3)*1200;
  const y=rnd(n+i*7)*330;
  const r=.4+rnd(n+i*9)*1.8;

  s+=`
  <circle
   cx="${x}"
   cy="${y}"
   r="${r}"
   fill="#fff"
   opacity="${.25+rnd(n+i)*.65}"/>`;
 }

 return s;
}


/* =========================
   MOUNTAINS
   ========================= */

function mountainPath(n,base,minH,maxH){

 let p=`M0 ${base}`;

 for(let i=0;i<=12;i++){

  const x=i*100;
  const h=
   minH+
   rnd(n+i*4)*(maxH-minH);

  p+=`
   L${x+50} ${base-h}
   L${x+100} ${base}`;
 }

 p+=` L1200 675 L0 675 Z`;

 return p;
}


/* =========================
   TREES
   ========================= */

function trees(n){

 let s="";

 for(let i=0;i<20;i++){

  const x=650+rnd(n+i*5)*550;
  const y=480+rnd(n+i*3)*80;
  const h=55+rnd(n+i)*90;

  s+=`
  <path
   d="
   M${x} ${y}
   L${x-18} ${y}
   L${x-6} ${y-h*.55}
   L${x-25} ${y-h*.55}
   L${x} ${y-h}
   L${x+25} ${y-h*.55}
   L${x+7} ${y-h*.55}
   L${x+18} ${y}
   Z"
   fill="#07131b"
   opacity=".85"/>`;
 }

 return s;
}


/* =========================
   LIGHT RAYS
   ========================= */

function rays(n,sunX,sunY){

 let s="";

 for(let i=0;i<12;i++){

  const endX=
   sunX-450+
   rnd(n+i)*900;

  s+=`
  <path
   d="
   M${sunX} ${sunY}
   L${endX} 650
   L${endX+45} 650
   Z"
   fill="#f5d486"
   opacity="${.025+rnd(n+i)*.045}"/>`;
 }

 return s;
}

  <path

/* =========================
   CREATE BACKGROUND
   ========================= */

function createSVG(d){

 const sp=special(d);

 if(sp==="CHRISTMAS DAY")
  return christmasSVG(d);

 return scenicSVG(d,sp);
}


/* =========================
   UPDATE CALENDAR
   ========================= */

function updateCalendar(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );


 $("showDate").textContent=
  dateText(d);


 $("showEN").textContent=
  $("en").value;


 $("showTA").textContent=
  $("ta").value;


 $("showSI").textContent=
  $("si").value;


 $("showRef").textContent=
  "— "+$("ref").value;


 $("svgBox").innerHTML=
  createSVG(d);
}


/* =========================
   PREVIOUS
   ========================= */

function previousDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(
  d.getDate()-1
 );

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* =========================
   NEXT
   ========================= */

function nextDay(){

 const d=new Date(
  $("date").value+"T12:00:00"
 );

 d.setDate(
  d.getDate()+1
 );

 if(d.getFullYear()===2027){

  $("date").value=
   d.toISOString().slice(0,10);

  updateCalendar();
 }
}


/* =========================
   PDF — EXACT 12 × 9
   ========================= */

async function downloadPDF(){

 const calendar=$("calendar");


 const canvas=
  await html2canvas(
   calendar,
   {
    scale:3,
    useCORS:true,
    backgroundColor:"#fff"
   }
  );


 const {jsPDF}=window.jspdf;


 const pdf=new jsPDF({

  orientation:"landscape",

  unit:"in",

  format:[12,9]
 });


 pdf.addImage(
  canvas.toDataURL(
   "image/jpeg",
   .96
  ),
  "JPEG",
  0,
  0,
  12,
  9
 );


 pdf.save(
  "Bible-Calendar-"+
  $("date").value+
  ".pdf"
 );
}


/* =========================
   LIVE TEXT
   ========================= */

["en","ta","si","ref"].forEach(id=>{

 $(id).addEventListener(
  "input",
  updateCalendar
 );

});


/* =========================
   START
   ========================= */

updateCalendar();

</script>
