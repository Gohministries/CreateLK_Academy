<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>CreateLK Referral Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --blue:#155eef;
 --green:#059669;
 --red:#dc2626;
 --orange:#c2410c;
 --dark:#172033;
 --muted:#667085;
 --line:#e5e7eb;
 --bg:#f5f7ff;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--dark);
}

header{
 background:#fff;
 border-bottom:1px solid var(--line);
 position:sticky;
 top:0;
 z-index:10;
}

.nav{
 max-width:900px;
 margin:auto;
 padding:13px 15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:var(--blue);
 font-size:17px;
 font-weight:900;
}

.logout{
 border:0;
 background:#fef2f2;
 color:#dc2626;
 border-radius:7px;
 padding:7px 10px;
 font-size:10px;
 font-weight:900;
 cursor:pointer;
}

main{
 max-width:900px;
 margin:auto;
 padding:15px;
}

.title{
 font-size:20px;
 font-weight:900;
 margin-bottom:12px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
 margin-bottom:15px;
}

.stat{
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
}

.stat small{
 display:block;
 color:var(--muted);
 font-size:9px;
 font-weight:800;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:21px;
}

.section-title{
 font-size:14px;
 font-weight:900;
 margin:15px 0 9px;
}

.payout-card{
 background:#fff;
 border:1px solid var(--line);
 border-radius:14px;
 padding:15px;
 margin-bottom:11px;
 box-shadow:0 2px 8px #00000008;
}

.payout-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
}

.payout-code{
 font-size:10px;
 font-weight:900;
 color:var(--blue);
 word-break:break-all;
}

.status{
 font-size:8px;
 font-weight:900;
 padding:5px 8px;
 border-radius:20px;
 white-space:nowrap;
}

.status.pending{
 background:#fff7ed;
 color:var(--orange);
}

.status.approved{
 background:#ecfdf3;
 color:#047857;
}

.status.rejected{
 background:#fef2f2;
 color:#b91c1c;
}

.amount{
 background:#ecfdf5;
 border:1px solid #a7f3d0;
 border-radius:10px;
 padding:12px;
 margin-bottom:12px;
}

.amount small{
 display:block;
 color:#047857;
 font-size:8px;
 font-weight:900;
}

.amount strong{
 display:block;
 color:#047857;
 font-size:23px;
 margin-top:3px;
}

.bank-box{
 background:#f8fafc;
 border:1px solid var(--line);
 border-radius:10px;
 padding:11px;
}

.bank-title{
 font-size:11px;
 font-weight:900;
 margin-bottom:7px;
}

.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 min-height:34px;
 border-bottom:1px solid #eef0f3;
}

.row:last-child{
 border-bottom:0;
}

.label{
 color:var(--muted);
 font-size:9px;
 font-weight:700;
}

.value{
 display:flex;
 align-items:center;
 gap:5px;
 text-align:right;
 font-size:10px;
 font-weight:900;
 word-break:break-word;
}

.copy{
 border:0;
 background:#eff6ff;
 color:var(--blue);
 border-radius:6px;
 padding:4px 7px;
 font-size:8px;
 font-weight:900;
 cursor:pointer;
 white-space:nowrap;
}

.copy.done{
 background:#ecfdf3;
 color:#047857;
}

.date{
 margin-top:9px;
 color:var(--muted);
 font-size:8px;
}

.actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.action{
 flex:1;
 height:39px;
 border:0;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 font-weight:900;
 cursor:pointer;
}

.approve{
 background:var(--green);
}

.reject{
 background:var(--red);
}

.action:disabled{
 opacity:.5;
 cursor:not-allowed;
}

.empty{
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:25px;
 text-align:center;
 color:var(--muted);
 font-size:11px;
}

.loading{
 text-align:center;
 padding:25px;
 color:var(--muted);
 font-size:11px;
}

.message{
 padding:10px;
 border-radius:9px;
 margin-bottom:10px;
 font-size:10px;
 line-height:1.5;
 display:none;
}

.message.success{
 display:block;
 background:#ecfdf3;
 border:1px solid #bbf7d0;
 color:#166534;
}

.message.error{
 display:block;
 background:#fff1f2;
 border:1px solid #fecdd3;
 color:#be123c;
}

@media(max-width:650px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:420px){
 main{
  padding:10px;
 }

 .stats{
  gap:7px;
 }

 .stat{
  padding:11px;
 }

 .stat strong{
  font-size:18px;
 }

 .payout-card{
  padding:12px;
 }

 .row{
  align-items:flex-start;
  padding:7px 0;
 }

 .value{
  max-width:65%;
 }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Referral Admin
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>
</header>

<main>

<div class="title">
Affiliate Finance
</div>

<div id="message" class="message"></div>

<div class="stats">

<div class="stat">
<small>STUDENTS</small>
<strong id="students">0</strong>
</div>

<div class="stat">
<small>PREMIUM</small>
<strong id="premium">0</strong>
</div>

<div class="stat">
<small>REFERRALS</small>
<strong id="referrals">0</strong>
</div>

<div class="stat">
<small>PENDING WITHDRAWALS</small>
<strong id="pendingAmount">LKR 0</strong>
</div>

</div>

<div class="section-title">
💰 Payout Requests
</div>

<div id="payouts">
<div class="loading">
Loading payout requests...
</div>
</div>

</main>

<script>

const API =
"https://createlk-referrals.createlk.workers.dev";


/* =========================
   HELPERS
========================= */

const $ = id =>
document.getElementById(id);


function money(value){

 return "LKR " +
 Number(value || 0).toLocaleString(
  "en-LK",
  {
   maximumFractionDigits:0
  }
 );

}


function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function safe(value){

 return String(value ?? "")
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");
}


function showMessage(text,type){

 const box=$("message");

 box.textContent=text;
 box.className="message "+type;

 setTimeout(()=>{
  box.className="message";
 },4000);

}


/* =========================
   COPY
========================= */

async function copyValue(value,button){

 if(!value)return;

 try{

  await navigator.clipboard.writeText(
   String(value)
  );

 }catch(e){

  const input=document.createElement("textarea");

  input.value=value;

  document.body.appendChild(input);

  input.select();

  document.execCommand("copy");

  input.remove();

 }

 const old=button.textContent;

 button.textContent="Copied!";
 button.classList.add("done");

 setTimeout(()=>{

  button.textContent=old;
  button.classList.remove("done");

 },1200);

}


/* =========================
   LOAD ADMIN
========================= */

async function loadAdmin(){

 try{

  /*
   Change this URL only if your
   admin Worker uses another route.
  */

  const response=await fetch(
   API+"/api/admin",
   {
    cache:"no-store"
   }
  );

  const data=await response.json();

  console.log("Admin response:",data);

  if(
   !response.ok ||
   data.success===false
  ){

   throw new Error(
    data.message ||
    "Unable to load admin data."
   );

  }


  /*
   Accept common property names.
  */

  $("students").textContent =
   Number(
    data.students ??
    data.total_students ??
    0
   );


  $("premium").textContent =
   Number(
    data.premium ??
    data.premium_students ??
    0
   );


  $("referrals").textContent =
   Number(
    data.referrals ??
    data.total_referrals ??
    0
   );


  const payouts =
   data.payouts ||
   data.payout_requests ||
   [];


  const pending =
   payouts.filter(
    p =>
     String(p.status || "")
      .toUpperCase() === "PENDING"
   );


  const pendingTotal =
   pending.reduce(
    (sum,p)=>
     sum + Number(p.amount || 0),
    0
   );


  $("pendingAmount").textContent =
   money(pendingTotal);


  renderPayouts(payouts);


 }catch(error){

  console.error(error);

  $("payouts").innerHTML=`
   <div class="empty">
    Unable to load payout requests.<br>
    <small>${esc(error.message)}</small>
   </div>
  `;

 }

}


/* =========================
   PAYOUT CARDS
========================= */

function renderPayouts(list){

 const box=$("payouts");

 if(!Array.isArray(list) || !list.length){

  box.innerHTML=`
   <div class="empty">
    No payout requests found.
   </div>
  `;

  return;
 }


 box.innerHTML=list.map(p=>{

  const status=
   String(p.status || "PENDING")
    .toUpperCase();

  const statusClass =
   status.toLowerCase();


  return `

  <div class="payout-card">

   <div class="payout-head">

    <div class="payout-code">
     ${esc(p.payout_code || "-")}
    </div>

    <div class="status ${esc(statusClass)}">
     ${esc(status)}
    </div>

   </div>


   <div class="amount">

    <small>WITHDRAWAL AMOUNT</small>

    <strong>
     ${money(p.amount)}
    </strong>

   </div>


   <div class="bank-box">

    <div class="bank-title">
     🏦 Bank Account
    </div>


    <div class="row">

     <span class="label">
      Student ID
     </span>

     <span class="value">
      ${esc(p.student_id || "-")}
     </span>

    </div>


    <div class="row">

     <span class="label">
      Account Name
     </span>

     <span class="value">

      ${esc(p.account_name || "-")}

      ${
       p.account_name
       ? `
       <button
        class="copy"
        onclick="copyValue('${safe(p.account_name)}',this)">
        Copy
       </button>
       `
       : ""
      }

     </span>

    </div>


    <div class="row">

     <span class="label">
      Bank
     </span>

     <span class="value">
      ${esc(p.bank_name || "-")}
     </span>

    </div>


    <div class="row">

     <span class="label">
      Branch
     </span>

     <span class="value">
      ${esc(p.branch || "-")}
     </span>

    </div>


    <div class="row">

     <span class="label">
      Account Number
     </span>

     <span class="value">

      ${esc(p.account_number || "-")}

      ${
       p.account_number
       ? `
       <button
        class="copy"
        onclick="copyValue('${safe(p.account_number)}',this)">
        Copy
       </button>
       `
       : ""
      }

     </span>

    </div>

   </div>


   <div class="date">
    📅 ${esc(p.created_at || "-")}
   </div>


   ${
    status === "PENDING"
    ? `

    <div class="actions">

     <button
      class="action approve"
      onclick="approvePayout('${safe(p.payout_code)}',this)">
      ✓ Approve
     </button>

     <button
      class="action reject"
      onclick="rejectPayout('${safe(p.payout_code)}',this)">
      ✕ Reject
     </button>

    </div>

    `
    : ""
   }

  </div>

  `;

 }).join("");

}


/* =========================
   APPROVE
========================= */

async function approvePayout(code,button){

 if(!confirm(
  "Approve this payout request?"
 ))return;


 button.disabled=true;
 button.textContent="Approving...";


 try{

  const response=await fetch(
   API+"/api/admin/payout",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     payout_code:code,
     action:"APPROVE"
    })
   }
  );


  const data=
   await response.json();


  if(
   !response.ok ||
   data.success===false
  ){

   throw new Error(
    data.message ||
    "Approval failed."
   );

  }


  showMessage(
   "Payout approved successfully.",
   "success"
  );


  await loadAdmin();


 }catch(error){

  console.error(error);

  showMessage(
   error.message ||
   "Unable to approve payout.",
   "error"
  );

  button.disabled=false;
  button.textContent="✓ Approve";

 }

}


/* =========================
   REJECT
========================= */

async function rejectPayout(code,button){

 if(!confirm(
  "Reject this payout request?"
 ))return;


 button.disabled=true;
 button.textContent="Rejecting...";


 try{

  const response=await fetch(
   API+"/api/admin/payout",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     payout_code:code,
     action:"REJECT"
    })
   }
  );


  const data=
   await response.json();


  if(
   !response.ok ||
   data.success===false
  ){

   throw new Error(
    data.message ||
    "Rejection failed."
   );

  }


  showMessage(
   "Payout rejected successfully.",
   "success"
  );


  await loadAdmin();


 }catch(error){

  console.error(error);

  showMessage(
   error.message ||
   "Unable to reject payout.",
   "error"
  );

  button.disabled=false;
  button.textContent="✕ Reject";

 }

}


/* =========================
   LOGOUT
========================= */

function logout(){

 localStorage.removeItem(
  "createlk_admin"
 );

 location.href="login.html";

}


/* =========================
   START
========================= */

loadAdmin();

</script>

</body>
</html>
