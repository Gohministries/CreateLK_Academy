<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>CreateLK Referral Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:15px
}

header div{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:900;
color:#155eef
}

main{
max-width:1100px;
margin:auto;
padding:20px 15px
}

.login{
max-width:400px;
margin:60px auto;
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px #0001
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
margin:8px 0
}

button{
border:0;
padding:11px 15px;
border-radius:9px;
font-weight:800;
cursor:pointer
}

.primary{
background:#155eef;
color:#fff
}

.danger{
background:#fee2e2;
color:#b91c1c
}

.success{
background:#dcfce7;
color:#166534
}

.stats{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:12px;
margin-bottom:20px
}

.stat{
background:#fff;
padding:18px;
border-radius:15px;
box-shadow:0 4px 15px #0000000a
}

.stat small{
color:#667085;
display:block
}

.stat strong{
font-size:23px;
display:block;
margin-top:5px
}

.card{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:20px;
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:650px
}

th,td{
padding:11px;
border-bottom:1px solid #eee;
text-align:left;
font-size:13px
}

th{
background:#f8fafc
}

.badge{
padding:5px 8px;
border-radius:7px;
font-size:11px;
font-weight:800
}

.pending{
background:#fff7ed;
color:#c2410c
}

.paid{
background:#dcfce7;
color:#166534
}

.rejected{
background:#fee2e2;
color:#b91c1c
}

#admin{
display:none
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr
}

}

</style>

</head>

<body>

<header>

<div>

<div class="logo">
📚 CreateLK Referral Admin
</div>

<button
onclick="logout()">
Logout
</button>

</div>

</header>


<div id="loginBox"
class="login">

<h2>Admin Login</h2>

<p style="color:#667085;margin:8px 0">
Enter your private admin secret.
</p>

<input
id="secret"
type="password"
placeholder="Admin secret">

<button
class="primary"
style="width:100%"
onclick="login()">

Login

</button>

<p id="loginMessage"
style="margin-top:10px;color:#b91c1c">
</p>

</div>


<main id="admin">

<div class="stats">

<div class="stat">

<small>Students</small>

<strong id="students">
0
</strong>

</div>

<div class="stat">

<small>Premium</small>

<strong id="premium">
0
</strong>

</div>

<div class="stat">

<small>Referrals</small>

<strong id="referrals">
0
</strong>

</div>

<div class="stat">

<small>Pending Withdrawals</small>

<strong id="withdrawals">
LKR 0
</strong>

</div>

</div>


<div class="card">

<h2>💰 Payout Requests</h2>

<br>

<table>

<thead>

<tr>

<th>Payout ID</th>
<th>Student</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
<th>Action</th>

</tr>

</thead>

<tbody id="payoutTable">

</tbody>

</table>

</div>


<div class="card">

<h2>🤝 Referrals</h2>

<br>

<table>

<thead>

<tr>

<th>ID</th>
<th>Referrer</th>
<th>Referred</th>
<th>Code</th>
<th>Status</th>
<th>Date</th>

</tr>

</thead>

<tbody id="referralTable">

</tbody>

</table>

</div>

</main>


<script>

const API =
"https://createlk-referral-admin.createlk.workers.dev";

let ADMIN_SECRET =
sessionStorage.getItem(
"createlk_admin_secret"
);


/* =========================
   LOGIN
========================= */

function login(){

const value =
document.getElementById(
"secret"
).value.trim();

if(!value){

document.getElementById(
"loginMessage"
).textContent =
"Enter the admin secret.";

return;

}

ADMIN_SECRET =
value;

sessionStorage.setItem(
"createlk_admin_secret",
value
);

showAdmin();

}


/* =========================
   API
========================= */

async function api(
path,
options={}
){

const response =
await fetch(
API + path,
{
...options,
headers:{
"Content-Type":
"application/json",

"X-Admin-Secret":
ADMIN_SECRET,

...(options.headers || {})
}
}
);

if(response.status === 401){

logout();

throw new Error(
"Unauthorized"
);

}

return response.json();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"admin"
).style.display =
"block";

loadAll();

}


/* =========================
   SUMMARY
========================= */

async function loadSummary(){

const data =
await api(
"/api/summary"
);

if(!data.success) return;

document.getElementById(
"students"
).textContent =
data.students;

document.getElementById(
"premium"
).textContent =
data.premium;

document.getElementById(
"referrals"
).textContent =
data.referrals;

document.getElementById(
"withdrawals"
).textContent =
"LKR " +
Number(
data.withdrawals.pending || 0
).toLocaleString();

}


/* =========================
   PAYOUTS
========================= */

async function loadPayouts(){

const data =
await api(
"/api/payouts"
);

const table =
document.getElementById(
"payoutTable"
);

table.innerHTML = "";

if(!data.success) return;

(data.payouts || [])
.forEach(function(p){

const tr =
document.createElement("tr");

let action = "";

if(p.status === "PENDING"){

action = `
<button
class="success"
onclick="approvePayout(${p.id})">
Approve
</button>

<button
class="danger"
onclick="rejectPayout(${p.id})">
Reject
</button>
`;

}

tr.innerHTML = `

<td>${p.payout_code}</td>

<td>${p.student_id}</td>

<td>
LKR ${Number(p.amount).toLocaleString()}
</td>

<td>
<span class="badge ${
p.status.toLowerCase()
}">
${p.status}
</span>
</td>

<td>${p.created_at || "-"}</td>

<td>${action}</td>

`;

table.appendChild(tr);

});

}


/* =========================
   APPROVE
========================= */

async function approvePayout(id){

if(!confirm(
"Confirm that you have transferred this payout?"
)) return;

const data =
await api(
"/api/payout/approve",
{
method:"POST",

body:JSON.stringify({
id:id
})
}
);

alert(
data.message ||
"Completed."
);

loadAll();

}


/* =========================
   REJECT
========================= */

async function rejectPayout(id){

if(!confirm(
"Reject this payout request?"
)) return;

const data =
await api(
"/api/payout/reject",
{
method:"POST",

body:JSON.stringify({
id:id
})
}
);

alert(
data.message ||
"Rejected."
);

loadAll();

}


/* =========================
   REFERRALS
========================= */

async function loadReferrals(){

const data =
await api(
"/api/referrals"
);

const table =
document.getElementById(
"referralTable"
);

table.innerHTML = "";

if(!data.success) return;

(data.referrals || [])
.forEach(function(r){

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>${r.id}</td>

<td>${r.referrer_id}</td>

<td>${r.referred_id}</td>

<td>${r.referral_code}</td>

<td>${r.status}</td>

<td>${r.created_at || "-"}</td>

`;

table.appendChild(tr);

});

}


/* =========================
   LOAD
========================= */

function loadAll(){

loadSummary();
loadPayouts();
loadReferrals();

}


/* =========================
   LOGOUT
========================= */

function logout(){

sessionStorage.removeItem(
"createlk_admin_secret"
);

ADMIN_SECRET = "";

location.reload();

}


/* =========================
   AUTO LOGIN
========================= */

if(ADMIN_SECRET){

showAdmin();

}

</script>

</body>

</html>
