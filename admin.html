<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Calendar 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 padding:12px;
 background:#eef1f4;
 font:14px Arial,sans-serif;
 color:#30343b;
}

/* =========================
   CONTROLS
========================= */

.controls{
 max-width:1100px;
 margin:auto auto 12px;
 padding:12px;
 background:#ffffff;
 border:1px solid #d5c69d;
 border-radius:10px;
 box-shadow:0 2px 8px rgba(23,54,93,.06);
}

h2{
 color:#17365D;
 font:700 19px Georgia,serif;
 margin-bottom:9px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

label{
 display:block;
 font-size:10px;
 font-weight:bold;
 margin:3px 0;
 color:#39424d;
}

input,
textarea,
select{
 width:100%;
 padding:6px;
 border:1px solid #cec7b7;
 border-radius:5px;
 background:#fff;
 color:#30343b;
 font:inherit;
}

input:focus,
textarea:focus,
select:focus{
 outline:none;
 border-color:#C49A45;
 box-shadow:0 0 0 2px rgba(196,154,69,.12);
}

textarea{
 height:55px;
 resize:vertical;
}

.size{
 margin-top:4px;
 padding:4px 6px;
 background:#f7f4eb;
 border:1px solid #e3dccb;
 border-radius:5px;
}

.size label{
 font-size:9px;
 color:#5a5e64;
}

.size input[type=range]{
 padding:0;
 height:15px;
 border:0;
}

.auto{
 display:flex!important;
 align-items:center;
}

.auto input{
 width:auto;
 margin-right:4px;
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:9px;
}

button{
 padding:7px 11px;
 border:0;
 border-radius:5px;
 background:#17365D;
 color:#fff;
 font-weight:bold;
 cursor:pointer;
 transition:.15s ease;
}

button:hover{
 filter:brightness(1.08);
}

.green{
 background:#35634A;
}

.red{
 background:#8B4C48;
}

.gray{
 background:#70685d;
}

.status{
 margin-top:7px;
 padding:6px;
 background:#f4f1e8;
 border:1px solid #e3dccb;
 border-radius:5px;
 font-size:10px;
 color:#555b61;
}

.selected{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
 margin-top:6px;
}

.chip{
 padding:3px 6px;
 background:#f3eee2;
 border:1px solid #d5c69d;
 border-radius:12px;
 font-size:9px;
 color:#4b4f54;
}

.chip button{
 padding:1px 4px;
 background:#8B4C48;
 border-radius:50%;
 font-size:8px;
}


/* =========================
   CALENDAR
========================= */

.calendar{
 width:min(1100px,100%);
 aspect-ratio:16/10;
 margin:auto;
 position:relative;
 overflow:hidden;

 background:#FAF8F2;

 border:1px solid #C8B98A;
 outline:2px solid #C8B98A;
 outline-offset:-7px;

 box-shadow:0 5px 18px rgba(23,54,93,.10);
}


/* =========================
   PHOTO
========================= */

.photo,
.cover{
 position:absolute;
 overflow:hidden;
 background:#ddd9ce;
}

.photo{
 left:4.5%;
 top:8%;
 bottom:8%;
 width:29%;
 z-index:1;

 border-radius:2px;
}

.cover{
 inset:0;
 display:none;
}

.photo img,
.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.overlay{
 position:absolute;
 inset:0;
 background:#000;
 opacity:.28;
}


/* =========================
   CONTENT
========================= */

.content{
 position:absolute;
 left:37%;
 right:5%;
 top:4%;
 bottom:4%;

 display:flex;
 flex-direction:column;

 min-width:0;
 min-height:0;

 z-index:3;
}


/* =========================
   DATE
========================= */

.dateRow{
 height:9%;
 min-height:30px;

 flex-shrink:0;

 display:flex;
 align-items:center;

 border-bottom:1px solid #D8CEB8;

 position:relative;
 overflow:hidden;

 padding:0 2px;
}

.dateText{
 font:700 clamp(24px,4vw,48px)/1 Georgia,serif;

 color:#17365D;

 white-space:nowrap;

 overflow:hidden;
}

.cross{
 position:absolute;

 right:2px;
 top:1px;

 color:#C49A45;

 font:15px Georgia,serif;
}


/* =========================
   VERSES
========================= */

.verses{
 flex:1;

 min-height:0;

 overflow:hidden;

 margin:2px 0;
}

#verseBox{
 height:100%;

 display:grid;

 grid-template-rows:
  repeat(3,minmax(0,1fr));

 overflow:hidden;
}


/* =========================
   LANGUAGE SECTIONS
========================= */

.section{
 min-width:0;
 min-height:0;

 padding:4px 8px;

 border-top:1px solid #E5DFD2;

 overflow:hidden;

 display:flex;
 align-items:flex-start;
}

.section:first-child{
 border:0;
}

.txt{
 width:100%;
 max-width:100%;
 max-height:100%;

 overflow:hidden;

 overflow-wrap:anywhere;

 word-break:normal;

 white-space:normal;

 display:block;
}


/* =========================
   ENGLISH
========================= */

.en{
 font-family:Georgia,serif;

 font-weight:500;

 font-size:25px;

 line-height:1.12;

 color:#17365D;
}


/* =========================
   TAMIL
========================= */

.ta{
 font-family:
  "Noto Sans Tamil",
  "Nirmala UI",
  sans-serif;

 font-weight:500;

 font-size:18px;

 line-height:1.10;

 padding:3px 0;

 color:#7A4E2D;
}


/* =========================
   SINHALA
========================= */

.si{
 font-family:
  "Noto Sans Sinhala",
  "Nirmala UI",
  sans-serif;

 font-weight:500;

 font-size:18px;

 line-height:1.12;

 padding:3px 0;

 color:#35634A;
}


/* =========================
   COVER MODE
========================= */

.coverMode .photo{
 display:none;
}

.coverMode .cover{
 display:block;
}

.coverMode .content{
 left:7%;
 right:7%;
 top:7%;
 bottom:7%;
}

.coverMode .dateRow{
 display:none;
}

.coverMode .verses{
 margin:0;
}

.coverMode .section{
 border:0;

 padding:10px 15px;

 display:flex;

 align-items:center;
}

.coverMode .en,
.coverMode .ta,
.coverMode .si{
 color:#fff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

 body{
  padding:6px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .section{
  padding:4px 6px;
 }

 .content{
  left:37%;
  right:4%;
  top:4%;
  bottom:4%;
 }

 .photo{
  left:4%;
  width:29%;
 }

 .dateText{
  font-size:24px;
 }

}


/* =========================
   PRINT
========================= */

@media print{

 body{
  padding:0;
  background:#fff;
 }

 .controls{
  display:none;
 }

 .calendar{
  width:9in;
  height:5.625in;
  aspect-ratio:auto;
 }

}

</style>
</head>


<body>

<div class="controls">

<h2>365 Bible Calendar 2027</h2>

<div class="grid">

<!-- DATE -->
<div>

<label>Date</label>

<input
 id="date"
 type="date"
 min="2027-01-01"
 max="2027-12-31"
 value="2027-01-01">

</div>


<!-- PHOTO -->
<div>

<label>Upload Photo</label>

<input
 id="photoUpload"
 type="file"
 accept="image/*">

</div>


<!-- PHOTO MODE -->
<div>

<label>Photo Layout</label>

<select id="photoMode">

<option value="left">
Left Photo Panel
</option>

<option value="cover">
Full Page Cover
</option>

</select>

</div>


<!-- ENGLISH -->
<div>

<label>English Verse</label>

<textarea id="en">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</textarea>

<div class="size">

<label>
English:
<span id="enV">25.0px</span>
</label>

<input
 id="enS"
 type="range"
 min="0.1"
 max="35"
 step="0.1"
 value="25">

<label class="auto">

<input
 id="enA"
 type="checkbox"
 checked>

Auto Fit

</label>

</div>

</div>


<!-- TAMIL -->
<div>

<label>Tamil Verse</label>

<textarea id="ta">தேவன் தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, உலகத்தில் அன்புகூர்ந்தார்.</textarea>

<div class="size">

<label>
Tamil:
<span id="taV">18.0px</span>
</label>

<input
 id="taS"
 type="range"
 min="0.1"
 max="30"
 step="0.1"
 value="18">

<label class="auto">

<input
 id="taA"
 type="checkbox"
 checked>

Auto Fit

</label>

</div>

</div>


<!-- SINHALA -->
<div>

<label>Sinhala Verse</label>

<textarea id="si">මක්නිසාද දෙවියන්වහන්සේ ලෝකයාට කොපමණ ප්‍රේමකළසේක්ද කිවහොත්, තමන්වහන්සේගේ ඒකජාතක පුත්‍රයා දුන්සේක. එසේ කළේ උන්වහන්සේ කෙරෙහි අදහාගන්නා සියල්ලන්ම විනාශ නොවී සදාකාල ජීවනය ලබන පිණිසය.</textarea>

<div class="size">

<label>
Sinhala:
<span id="siV">18.0px</span>
</label>

<input
 id="siS"
 type="range"
 min="0.1"
 max="30"
 step="0.1"
 value="18">

<label class="auto">

<input
 id="siA"
 type="checkbox"
 checked>

Auto Fit

</label>

</div>

</div>

</div>


<!-- BUTTONS -->

<div class="buttons">

<button onclick="move(-1)">
Previous
</button>

<button onclick="move(1)">
Next
</button>

<button
 class="green"
 onclick="generate()">
Generate
</button>

<button
 class="gray"
 onclick="addDate()">
Add Date
</button>

<button
 class="red"
 onclick="clearDates()">
Clear
</button>

<button onclick="currentPDF()">
Current PDF
</button>

<button
 class="green"
 onclick="multiPDF()">
Selected PDF
</button>

</div>


<div
 class="status"
 id="status">
</div>


<div
 class="selected"
 id="selected">
</div>

</div>


<!-- =========================
     CALENDAR
========================= -->

<div
 class="calendar"
 id="calendar">

<div
 class="cover"
 id="cover">
</div>


<div
 class="photo"
 id="photo">
</div>


<div class="content">

<div class="dateRow">

<div
 class="dateText"
 id="dateText">
</div>

<div class="cross">
✝
</div>

</div>


<div class="verses">

<div id="verseBox">

<!-- ENGLISH -->

<div class="section">

<div
 id="enText"
 class="txt en">
</div>

</div>


<!-- TAMIL -->

<div class="section">

<div
 id="taText"
 class="txt ta">
</div>

</div>


<!-- SINHALA -->

<div class="section">

<div
 id="siText"
 class="txt si">
</div>

</div>

</div>

</div>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

let photoData="";

let selected=[];


/* =========================
   SAVE
========================= */

function save(){

 localStorage.setItem(
  "BibleCalendar2027",

  JSON.stringify({

   date:$("date").value,

   mode:$("photoMode").value,

   en:$("en").value,

   ta:$("ta").value,

   si:$("si").value,

   enS:$("enS").value,

   taS:$("taS").value,

   siS:$("siS").value,

   enA:$("enA").checked,

   taA:$("taA").checked,

   siA:$("siA").checked,

   photo:photoData,

   selected:selected

  })
 );

}


/* =========================
   LOAD
========================= */

function load(){

 try{

  const d=
   JSON.parse(
    localStorage.getItem(
     "BibleCalendar2027"
    )||"{}"
   );

  if(d.date)
   $("date").value=d.date;

  if(d.mode)
   $("photoMode").value=d.mode;

  if(d.en!=null)
   $("en").value=d.en;

  if(d.ta!=null)
   $("ta").value=d.ta;

  if(d.si!=null)
   $("si").value=d.si;

  if(d.enS)
   $("enS").value=d.enS;

  if(d.taS)
   $("taS").value=d.taS;

  if(d.siS)
   $("siS").value=d.siS;

  if(d.enA!=null)
   $("enA").checked=d.enA;

  if(d.taA!=null)
   $("taA").checked=d.taA;

  if(d.siA!=null)
   $("siA").checked=d.siA;

  if(d.photo)
   photoData=d.photo;

  if(Array.isArray(d.selected))
   selected=d.selected;

 }catch(e){}

}


/* =========================
   PHOTO
========================= */

$("photoUpload").onchange=
function(e){

 const file=e.target.files[0];

 if(!file)
  return;

 const reader=
  new FileReader();

 reader.onload=function(){

  photoData=
   reader.result;

  showPhoto();

  save();

 };

 reader.readAsDataURL(file);

};


function showPhoto(){

 if(!photoData)
  return;

 $("photo").innerHTML=
  `<img src="${photoData}">`;

 $("cover").innerHTML=
  `<img src="${photoData}">
   <div class="overlay"></div>`;

}


/* =========================
   MODE
========================= */

function mode(){

 $("calendar").classList.toggle(
  "coverMode",
  $("photoMode").value==="cover"
 );

}


/* =========================
   TEXT
========================= */

function putText(){

 $("enText").textContent=
  $("en").value;

 $("taText").textContent=
  $("ta").value;

 $("siText").textContent=
  $("si").value;

}


/* =========================
   MANUAL SIZE
========================= */

function size(lang){

 const data={

  en:[
   "enS",
   "enV",
   "enText"
  ],

  ta:[
   "taS",
   "taV",
   "taText"
  ],

  si:[
   "siS",
   "siV",
   "siText"
  ]

 };

 const [s,v,t]=
  data[lang];

 const n=
  parseFloat(
   $(s).value
  );

 $(t).style.fontSize=
  n+"px";

 $(v).textContent=
  n.toFixed(1)+"px";

}


/* =========================
   AUTO FIT
========================= */

async function fit(lang){

 const data={

  en:[
   "enS",
   "enA",
   "enText"
  ],

  ta:[
   "taS",
   "taA",
   "taText"
  ],

  si:[
   "siS",
   "siA",
   "siText"
  ]

 };

 const [slider,auto,id]=
  data[lang];

 const el=$(id);

 if(!$(auto).checked){

  size(lang);

  return;

 }

 if(document.fonts)
  await document.fonts.ready;

 let min=0.1;

 let max=
  lang==="en"
   ?25
   :18;

 let best=min;

 const section=
  el.closest(".section");

 function apply(n){

  n=
   Math.max(
    0.1,
    Math.round(n*10)/10
   );

  el.style.fontSize=
   n+"px";

  if(lang==="en"){

   el.style.lineHeight=
    "1.12";

  }

  else if(lang==="ta"){

   el.style.lineHeight=
    n<=4
     ?"1.08"
     :n<=8
      ?"1.09"
      :"1.10";

  }

  else{

   el.style.lineHeight=
    n<=4
     ?"1.08"
     :n<=8
      ?"1.10"
      :"1.12";

  }

  void el.offsetHeight;

 }


 function fits(n){

  apply(n);

  return(
   el.scrollHeight <=
   section.clientHeight-6
  );

 }


 for(let i=0;i<50;i++){

  const mid=
   (min+max)/2;

  if(fits(mid)){

   best=mid;

   min=mid;

  }

  else{

   max=mid;

  }

 }


 best=
  Math.floor(
   best*10
  )/10;

 apply(best);


 while(
  best>0.1 &&
  el.scrollHeight>
   section.clientHeight-6
 ){

  best=
   Math.max(
    0.1,
    Math.round(
     (best-0.1)*10
    )/10
   );

  apply(best);

 }


 slider.value=
  best.toFixed(1);

 $(lang+"V").textContent=
  best.toFixed(1)+"px";

}


/* =========================
   GENERATE
========================= */

async function generate(){

 const d=
  new Date(
   $("date").value+
   "T00:00:00"
  );

 $("dateText").textContent=
  d.toLocaleDateString(
   "en-US",
   {
    month:"short",
    day:"numeric"
   }
  );

 putText();

 mode();

 await new Promise(
  r=>
   requestAnimationFrame(
    ()=>
     requestAnimationFrame(r)
   )
 );

 await fit("en");

 await fit("ta");

 await fit("si");

 showPhoto();

 save();

 renderSelected();

}


/* =========================
   NEXT / PREVIOUS
========================= */

function move(n){

 const d=
  new Date(
   $("date").value+
   "T00:00:00"
  );

 d.setDate(
  d.getDate()+n
 );

 if(
  d<
   new Date("2027-01-01") ||

  d>
   new Date("2027-12-31")
 )
  return;

 $("date").value=
  d.toISOString().slice(0,10);

 generate();

}


/* =========================
   ADD DATE
========================= */

function addDate(){

 const d=
  $("date").value;

 if(selected.includes(d)){

  alert(
   "Date already added."
  );

  return;

 }

 if(selected.length>=10){

  alert(
   "Maximum 10 pages."
  );

  return;

 }

 selected.push(d);

 renderSelected();

 save();

}


/* =========================
   SELECTED DATES
========================= */

function renderSelected(){

 $("selected").innerHTML=

  selected.map(
   (d,i)=>{

    const x=
     new Date(
      d+"T00:00:00"
     );

    return `

     <div class="chip">

      ${i+1}.
      ${x.toLocaleDateString(
       "en-US",
       {
        month:"short",
        day:"numeric"
       }
      )}

      <button
       onclick="removeDate(${i})">

       ×

      </button>

     </div>

    `;

   }
  ).join("");

 $("status").textContent=

  `${photoData
   ?"Photo uploaded"
   :"No photo"} |

   ${$("photoMode").value==="cover"
    ?"Cover"
    :"Left Photo"} |

   ${selected.length}/10 pages`;

}


/* =========================
   REMOVE
========================= */

function removeDate(i){

 selected.splice(i,1);

 renderSelected();

 save();

}


/* =========================
   CLEAR
========================= */

function clearDates(){

 selected=[];

 renderSelected();

 save();

}


/* =========================
   CAPTURE
========================= */

async function capture(){

 await generate();

 await new Promise(
  r=>setTimeout(r,150)
 );

 return html2canvas(
  $("calendar"),
  {

   scale:3,

   useCORS:true,

   backgroundColor:null,

   logging:false

  }
 );

}


/* =========================
   MAKE PDF
========================= */

async function makePDF(
 dates,
 name
){

 if(!photoData){

  alert(
   "Please upload a photo."
  );

  return;

 }

 if(!dates.length){

  alert(
   "No dates selected."
  );

  return;

 }

 const old=
  $("date").value;

 const pdf=
  new jspdf.jsPDF({

   orientation:"landscape",

   unit:"in",

   format:[
    9,
    5.625
   ],

   compress:true

  });


 for(
  let i=0;
  i<dates.length;
  i++
 ){

  $("date").value=
   dates[i];

  const canvas=
   await capture();

  if(i){

   pdf.addPage(
    [9,5.625],
    "landscape"
   );

  }

  pdf.addImage(

   canvas.toDataURL(
    "image/png"
   ),

   "PNG",

   0,
   0,

   9,
   5.625

  );

 }

 pdf.save(name);

 $("date").value=
  old;

 await generate();

}


/* =========================
   CURRENT PDF
========================= */

function currentPDF(){

 makePDF(

  [$("date").value],

  "Bible-Calendar-2027.pdf"

 );

}


/* =========================
   SELECTED PDF
========================= */

function multiPDF(){

 makePDF(

  selected,

  "Bible-Calendar-2027-Selected.pdf"

 );

}


/* =========================
   TEXT INPUT
========================= */

["en","ta","si"].forEach(
 id=>{

  $(id).oninput=
   generate;

 }
);


/* =========================
   DATE

 generate;

   PHOTO MODE
========================= */

$("photoMode").onchange=
 ()=>{

  mode();

  generate();

 };


/* =========================
   SIZE SLIDERS
========================= */

["en","ta","si"].forEach(
 lang=>{

  $(lang+"S").oninput=
   ()=>{

    if(
     !$(lang+"A").checked
    ){

     size(lang);

    }

    save();

   };


  $(lang+"A").onchange=
   async ()=>{

    await fit(lang);

    save();

   };

 });

load();

showPhoto();

mode();

renderSelected();

generate();
