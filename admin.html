<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Referral Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:13px 15px;
position:sticky;
top:0;
z-index:5
}

.nav{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:18px;
font-weight:900;
color:#155eef
}

button{
border:0;
border-radius:8px;
padding:9px 12px;
font-weight:800;
cursor:pointer
}

.primary{background:#155eef;color:#fff}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#b91c1c}
.copy{background:#eff6ff;color:#155eef}

.login{
max-width:380px;
margin:60px auto;
padding:22px;
background:#fff;
border-radius:16px;
box-shadow:0 8px 30px #00000012
}

input{
width:100%;
height:42px;
border:1px solid #d0d5dd;
border-radius:8px;
padding:0 11px;
margin:8px 0;
outline:none
}

main{
max-width:1000px;
margin:auto;
padding:15px
}

#admin{display:none}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px
}

.stat{
background:#fff;
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px
}

.stat small{
display:block;
font-size:10px;
color:#667085;
font-weight:700
}

.stat strong{
display:block;
font-size:21px;
margin-top:5px
}

.section-title{
font-size:16px;
font-weight:900;
margin:5px 0 10px
}

.payout{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-bottom:10px
}

.payout-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:12px
}

.code{
font-size:11px;
font-weight:900;
color:#155eef;
word-break:break-all
}

.amount{
font-size:20px;
font-weight:900
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:7px;
font-size:10px;
font-weight:900;
margin-top:5px
}

.badge.pending{
background:#fff7ed;
color:#c2410c
}

.badge.paid{
background:#dcfce7;
color:#166534
}

.badge.rejected{
background:#fee2e2;
color:#b91c1c
}

.bank{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
padding:11px;
margin-top:10px
}

.bank-title{
font-size:11px;
font-weight:900;
margin-bottom:8px
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
padding:5px 0;
border-bottom:1px solid #e5e7eb;
font-size:11px
}

.row:last-child{border-bottom:0}

.label{
color:#667085
}

.value{
font-weight:800;
text-align:right;
word-break:break-word
}

.actions{
display:flex;
gap:7px;
margin-top:11px
}

.actions button{
flex:1
}

.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:12px;
padding:25px;
text-align:center;
color:#667085;
font-size:12px
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
padding:10px;
border-radius:9px;
font-size:11px;
margin-bottom:10px;
display:none
}

@media(max-width:650px){
.stats{
grid-template-columns:1fr 1fr
}

.payout-head{
align-items:flex-start
}

.row{
font-size:10px
}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Referral Admin
</div>

<button onclick="logout()">Logout</button>

</div>
</header>


<div id="loginBox" class="login">

<h2>Admin Login</h2>

<p style="color:#667085;font-size:12px;margin:8px 0">
Enter your private admin secret.
</p>

<input
id="secret"
type="password"
placeholder="Admin secret"
>

<button
class="primary"
style="width:100%;margin-top:5px"
onclick="login()">
Login
</button>

<p
id="loginMessage"
style="color:#b91c1c;font-size:11px;margin-top:8px">
</p>

</div>


<main id="admin">

<div class="stats">

<div class="stat">
<small>STUDENTS</small>
<strong id="students">0</strong>
</div>

<div class="stat">
<small>PREMIUM</small>
<strong id="premium">0</strong>
</div>

<div class="stat">
<small>REFERRALS</small>
<strong id="referrals">0</strong>
</div>

<div class="stat">
<small>PENDING WITHDRAWALS</small>
<strong id="withdrawals">LKR 0</strong>
</div>

</div>


<div id="errorBox" class="error"></div>

<div class="section-title">
💰 Payout Requests
</div>

<div id="payoutList"></div>

</main>


<script>

const API =
"https://createlk-referral-admin.createlk.workers.dev";

let ADMIN_SECRET =
sessionStorage.getItem("createlk_admin_secret") || "";


/* LOGIN */

function login(){

const secret =
document.getElementById("secret").value.trim();

if(!secret){

document.getElementById("loginMessage").textContent =
"Enter the admin secret.";

return;

}

ADMIN_SECRET = secret;

sessionStorage.setItem(
"createlk_admin_secret",
secret
);

showAdmin();

}


/* API */

async function api(path,options={}){

const response =
await fetch(API + path,{
...options,
headers:{
"Content-Type":"application/json",
"X-Admin-Secret":ADMIN_SECRET,
...(options.headers || {})
}
});

if(response.status === 401){

logout();

throw new Error("Unauthorized");

}

const data = await response.json();

if(!response.ok || data.success === false){

throw new Error(
data.message || "API request failed"
);

}

return data;

}


/* SHOW */

function showAdmin(){

document.getElementById("loginBox").style.display="none";
document.getElementById("admin").style.display="block";

loadAll();

}


/* SUMMARY */

async function loadSummary(){

const data =
await api("/api/summary");

document.getElementById("students").textContent =
data.students || 0;

document.getElementById("premium").textContent =
data.premium || 0;

document.getElementById("referrals").textContent =
data.referrals || 0;

document.getElementById("withdrawals").textContent =
"LKR " +
Number(
data.withdrawals?.pending || 0
).toLocaleString();

}


/* PAYOUTS */

async function loadPayouts(){

const list =
document.getElementById("payoutList");

list.innerHTML =
`<div class="empty">Loading payouts...</div>`;

try{

const data =
await api("/api/payouts");

const payouts =
data.payouts || [];

if(!payouts.length){

list.innerHTML =
`<div class="empty">No payout requests.</div>`;

return;

}

list.innerHTML="";

payouts.forEach(p=>{

const card =
document.createElement("div");

card.className="payout";

const status =
String(p.status || "PENDING").toLowerCase();

let actions="";

if(p.status === "PENDING"){

actions=`

<div class="actions">

<button
class="success"
onclick="approvePayout(${p.id})">
✓ Approve
</button>

<button
class="danger"
onclick="rejectPayout(${p.id})">
✕ Reject
</button>

</div>

`;

}

const accountNumber =
p.account_number || "-";

card.innerHTML=`

<div class="payout-head">

<div>

<div class="code">
${escapeHtml(p.payout_code || "-")}
</div>

<div style="font-size:10px;color:#667085;margin-top:3px">
Student ID: ${escapeHtml(p.student_id || "-")}
</div>

<span class="badge ${status}">
${escapeHtml(p.status || "-")}
</span>

</div>

<div class="amount">
LKR ${Number(p.amount || 0).toLocaleString()}
</div>

</div>


<div class="bank">

<div class="bank-title">
🏦 Bank Account
</div>

<div class="row">
<span class="label">Account Name</span>
<span class="value">
${escapeHtml(p.account_name || "-")}
</span>
</div>

<div class="row">
<span class="label">Bank</span>
<span class="value">
${escapeHtml(p.bank_name || "-")}
</span>
</div>

<div class="row">
<span class="label">Branch</span>
<span class="value">
${escapeHtml(p.branch || "-")}
</span>
</div>

<div class="row">
<span class="label">Account Number</span>
<span class="value">
${escapeHtml(accountNumber)}
</span>
</div>

<button
class="copy"
style="width:100%;margin-top:8px"
onclick="copyAccount('${escapeJs(accountNumber)}')">
📋 Copy Account Number
</button>

</div>


<div style="
font-size:9px;
color:#667085;
margin-top:8px">
Requested: ${escapeHtml(p.created_at || "-")}
</div>

${actions}

`;

list.appendChild(card);

});

}catch(error){

console.error(error);

showError(
"Unable to load payout requests: " +
error.message
);

list.innerHTML =
`<div class="empty">
Unable to load payout requests.
</div>`;

}

}


/* COPY */

function copyAccount(number){

if(!number || number === "-"){

alert("Account number not available.");

return;

}

navigator.clipboard.writeText(number)
.then(()=>{
alert("Account number copied.");
})
.catch(()=>{
prompt("Copy account number:",number);
});

}


/* APPROVE */

async function approvePayout(id){

if(!confirm(
"Confirm that this payout has been transferred?"
)) return;

try{

const data =
await api(
"/api/payout/approve",
{
method:"POST",
body:JSON.stringify({id})
}
);

alert(
data.message || "Payout approved."
);

loadAll();

}catch(error){

alert(error.message);

}

}


/* REJECT */

async function rejectPayout(id){

if(!confirm(
"Reject this payout request?"
)) return;

try{

const data =
await api(
"/api/payout/reject",
{
method:"POST",
body:JSON.stringify({id})
}
);

alert(
data.message || "Payout rejected."
);

loadAll();

}catch(error){

alert(error.message);

}

}


/* ERROR */

function showError(message){

const box =
document.getElementById("errorBox");

box.textContent=message;
box.style.display="block";

}


/* LOAD */

async function loadAll(){

document.getElementById(
"errorBox"
).style.display="none";

await Promise.all([
loadSummary(),
loadPayouts()
]);

}


/* ESCAPE */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJs(value){

return String(value ?? "")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}


/* LOGOUT */

function logout(){

sessionStorage.removeItem(
"createlk_admin_secret"
);

ADMIN_SECRET="";

location.reload();

}


/* AUTO LOGIN */

if(ADMIN_SECRET){

showAdmin();

}

</script>

</body>
</html>
