<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Premium Payment | CreateLK Academy</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef5ff,#f8fbff);
color:#172033;
}

header{
background:#123b70;
color:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:520px;
margin:30px auto;
padding:18px;
}

.card{
background:white;
padding:28px;
border-radius:20px;
box-shadow:0 8px 30px #0002;
}

.logo{
text-align:center;
font-size:25px;
font-weight:bold;
color:#123b70;
}

.subtitle{
text-align:center;
color:#667085;
}

.price{
text-align:center;
font-size:34px;
font-weight:bold;
color:#1769e0;
margin-top:20px;
}

.duration{
text-align:center;
color:#667085;
margin-bottom:25px;
}

.status{
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
margin:20px 0;
}

.pending{
background:#fff4d6;
color:#8a6100;
}

.active{
background:#dcfce7;
color:#166534;
}

.info{
background:#f8fafc;
padding:16px;
border-radius:12px;
line-height:1.8;
}

.pay{
width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:10px;
background:#1769e0;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.pay:disabled{
opacity:.6;
}

.message{
text-align:center;
font-weight:bold;
margin-top:18px;
line-height:1.6;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#1769e0;
text-decoration:none;
font-weight:bold;
}

.hidden{
display:none;
}

</style></head><body><header><a href="index.html">
📚 CreateLK Academy
</a><a href="#" onclick="logout()">
Logout
</a></header><div class="container"><div class="card"><div class="logo">
⭐ Premium Membership
</div><p class="subtitle">
Unlock AI English MCQ Practice
</p><div class="price">
LKR 1,500
</div><div class="duration">
30 Days Premium Membership
</div><div
id="status"
class="status pending">Checking your account...

</div><div
id="details"
class="info">Please wait...

</div><button
id="paymentBtn"
class="pay"
onclick="createPayment()">

💳 Create Payment Request

</button><div
id="message"
class="message">
</div><a
class="back"
href="index.html">

🏠 Back to CreateLK Academy

</a></div></div><script>


/* =====================================
   CLOUDFLARE WORKER
===================================== */

const WORKER_URL =
"https://createlk-academy-api.createlk.workers.dev";


const statusBox =
document.getElementById("status");

const details =
document.getElementById("details");

const paymentBtn =
document.getElementById("paymentBtn");

const message =
document.getElementById("message");


/* =====================================
   CHECK CLOUDFLARE SESSION
===================================== */

async function checkAccount(){

try{

const response =
await fetch(
WORKER_URL+"/api/membership",
{
method:"GET",
credentials:"include"
}
);


const data =
await response.json();


console.log(
"Membership:",
data
);


/* NOT LOGGED IN */

if(!data.loggedIn){

window.location.href =
"login.html";

return;

}


/* =====================================
   ALREADY APPROVED
===================================== */

if(data.active){

statusBox.className =
"status active";

statusBox.innerHTML =
"🟢 Premium Membership Active";


details.innerHTML =
"⭐ Your Premium Membership is already active.<br><br>"+
"⏳ Days remaining: <strong>"+
(data.daysRemaining || 0)+
"</strong><br><br>"+
"🤖 You can access AI English MCQs now.";


paymentBtn.style.display =
"none";


setTimeout(function(){

window.location.href =
"premium-course.html";

},1200);


return;

}


/* =====================================
   NOT APPROVED
===================================== */

statusBox.className =
"status pending";

statusBox.innerHTML =
"🟡 Premium Membership Not Active";


details.innerHTML =
"<strong>CreateLK Academy Premium</strong><br><br>"+
"💰 Price: LKR 1,500<br>"+
"📅 Duration: 30 Days<br>"+
"🤖 AI English MCQ Practice<br>"+
"📝 One question at a time<br>"+
"🎯 Maximum 100 questions per day<br>"+
"✅ Admin approval required";


paymentBtn.style.display =
"block";


}
catch(error){

console.error(error);

statusBox.className =
"status pending";

statusBox.innerHTML =
"⚠️ Connection Error";


details.innerHTML =
"Unable to connect to CreateLK Academy. Please refresh and try again.";

}

}


/* =====================================
   CREATE PAYMENT
===================================== */

async function createPayment(){

paymentBtn.disabled=true;

paymentBtn.textContent =
"Creating Payment...";

message.textContent="";


try{

const response =
await fetch(
WORKER_URL+"/api/payment",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":
"application/json"
}
}
);


const data =
await response.json();


console.log(
"Payment:",
data
);


if(!response.ok ||
!data.success){

message.textContent =
data.message ||
"Unable to create payment.";

paymentBtn.disabled=false;

paymentBtn.textContent =
"💳 Create Payment Request";

return;

}


message.innerHTML =
"✅ Payment request created.<br><br>"+
"Payment ID: <strong>"+
(data.paymentId || "")+
"</strong><br><br>"+
"Complete your payment and wait for admin approval.";


paymentBtn.disabled=true;

paymentBtn.textContent =
"🟡 Payment Pending";


statusBox.className =
"status pending";

statusBox.innerHTML =
"🟡 Waiting for Admin Approval";


}
catch(error){

console.error(error);

message.textContent =
"Connection error. Please try again.";

paymentBtn.disabled=false;

paymentBtn.textContent =
"💳 Create Payment Request";

}

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

try{

await fetch(
WORKER_URL+"/api/logout",
{
method:"POST",
credentials:"include"
}
);

}
catch(error){

console.error(error);

}

window.location.href =
"login.html";

}


/* =====================================
   START
===================================== */

checkAccount();


/*
Check membership again every 15 seconds.
If admin approves payment, the page
will automatically detect it.
*/

setInterval(
checkAccount,
15000
);

</script></body>
</html>
