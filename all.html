<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CreateLK Academy Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.admin-box{
width:100%;
max-width:430px;
background:#ffffff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:30px 24px;
box-shadow:0 8px 30px rgba(16,24,40,.08);
text-align:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
margin-bottom:10px;
}

.subtitle{
color:#667085;
font-size:14px;
margin-bottom:25px;
}

.admin-link{
display:block;
width:100%;
padding:14px 16px;
margin:12px 0;
border-radius:10px;
text-decoration:none;
font-size:15px;
font-weight:bold;
background:#eef4ff;
color:#155eef;
border:1px solid #dbe7ff;
transition:.2s;
}

.admin-link:hover{
background:#155eef;
color:#ffffff;
transform:translateY(-1px);
}

footer{
margin-top:25px;
font-size:11px;
color:#98a2b3;
}

</style>

</head>

<body>

<div class="admin-box">

<div class="logo">
📚 CreateLK Academy
</div>

<p class="subtitle">
Admin Management
</p>

<a
href="admin.html"
class="admin-link">
👤 Student Admin
</a>

<a
href="affiliate-admin.html"
class="admin-link">
🤝 Affiliate Admin
</a>

<a
href="affiliate-payouts-admin.html"
class="admin-link">
💳 Payout Admin
</a>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

</div>

</body>
</html>
