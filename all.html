<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CreateLK Academy Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.admin-box{
width:100%;
max-width:430px;
background:#ffffff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:30px 24px;
box-shadow:0 8px 30px rgba(16,24,40,.08);
text-align:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
margin-bottom:10px;
}

.subtitle{
color:#667085;
font-size:14px;
margin-bottom:25px;
}

input{
width:100%;
padding:14px 15px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:15px;
outline:none;
margin-bottom:12px;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

.login-btn{
width:100%;
padding:14px 16px;
border:none;
border-radius:10px;
background:#155eef;
color:#ffffff;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.login-btn:hover{
background:#004ecc;
}

.error{
display:none;
color:#d92d20;
font-size:13px;
margin-top:12px;
font-weight:bold;
}

#adminPanel{
display:none;
}

.admin-link{
display:block;
width:100%;
padding:14px 16px;
margin:12px 0;
border-radius:10px;
text-decoration:none;
font-size:15px;
font-weight:bold;
background:#eef4ff;
color:#155eef;
border:1px solid #dbe7ff;
transition:.2s;
}

.admin-link:hover{
background:#155eef;
color:#ffffff;
transform:translateY(-1px);
}

.logout{
margin-top:15px;
background:#fff1f0;
color:#d92d20;
border:1px solid #ffd5d2;
}

.logout:hover{
background:#d92d20;
color:#ffffff;
}

footer{
margin-top:25px;
font-size:11px;
color:#98a2b3;
}

</style>

</head>

<body>

<div class="admin-box">

<div class="logo">
📚 CreateLK Academy
</div>

<!-- PASSWORD SCREEN -->
<div id="loginPanel">

<p class="subtitle">
Admin Management
</p>

<input
type="password"
id="password"
placeholder="Enter admin password"
autocomplete="off"
>

<button
class="login-btn"
onclick="login()">
🔐 Login
</button>

<p
class="error"
id="error">
Incorrect password. Please try again.
</p>

</div>


<!-- ADMIN LINKS -->
<div id="adminPanel">

<p class="subtitle">
Admin Management
</p>

<a
href="admin.html"
class="admin-link">
👤 Student Admin
</a>

<a
href="affiliate-admin.html"
class="admin-link">
🤝 Affiliate Admin
</a>

<a
href="affiliate-payouts-admin.html"
class="admin-link">
💳 Payout Admin
</a>

<a
href="certificate-control.html"
class="admin-link">
🎓 Certificate Control
</a>

<button
class="login-btn logout"
onclick="logout()">
🚪 Logout
</button>

</div>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

</div>


<script>

const ADMIN_PASSWORD = "Sathya#2026#";

function login(){

const password =
document.getElementById("password").value;

const error =
document.getElementById("error");

if(password === ADMIN_PASSWORD){

document.getElementById("loginPanel").style.display = "none";

document.getElementById("adminPanel").style.display = "block";

error.style.display = "none";

}else{

error.style.display = "block";

document.getElementById("password").value = "";

}

}

function logout(){

document.getElementById("adminPanel").style.display = "none";

document.getElementById("loginPanel").style.display = "block";

document.getElementById("password").value = "";

}

document.getElementById("password").addEventListener("keydown", function(event){

if(event.key === "Enter"){
login();
}

});

</script>

</body>
</html>
