<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Affiliate Payouts | CreateLK Academy</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:1200px;
margin:auto;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
}

.back{
text-decoration:none;
background:#eef4ff;
color:#155eef;
padding:9px 14px;
border-radius:8px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 15px;
}

h1{
margin-bottom:8px;
}

.subtitle{
color:#667085;
margin-bottom:25px;
}

.message{
padding:12px;
border-radius:8px;
margin-bottom:20px;
display:none;
}

.success{
display:block;
background:#ecfdf3;
color:#027a48;
}

.error{
display:block;
background:#fff1f2;
color:#be123c;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(16,24,40,.04);
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:1000px;
}

th,
td{
padding:13px 10px;
border-bottom:1px solid #eaecf0;
text-align:left;
font-size:14px;
}

th{
background:#f9fafb;
font-weight:700;
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.pending{
background:#fff7ed;
color:#c2410c;
}

.paid{
background:#ecfdf3;
color:#027a48;
}

.rejected{
background:#fff1f2;
color:#be123c;
}

button{
border:0;
padding:8px 11px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
margin:2px;
}

.paid-btn{
background:#16a34a;
color:#fff;
}

.reject-btn{
background:#dc2626;
color:#fff;
}

.refresh-btn{
background:#155eef;
color:#fff;
padding:10px 16px;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.empty{
text-align:center;
padding:35px;
color:#667085;
}

.details{
line-height:1.7;
}

@media(max-width:600px){
.container{
padding:20px 10px;
}

h1{
font-size:24px;
}
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>

</header>

<main class="container">

<h1>
💳 Affiliate Payout Requests
</h1>

<p class="subtitle">
View and manage affiliate payout requests.
</p>

<div id="message" class="message"></div>

<div class="card">

<button
class="refresh-btn"
onclick="loadPayouts()">

🔄 Refresh Requests

</button>

</div>

<div class="card">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>ID</th>
<th>Affiliate</th>
<th>Student</th>
<th>Amount</th>
<th>Bank Details</th>
<th>Status</th>
<th>Requested</th>
<th>Action</th>

</tr>

</thead>

<tbody id="payoutTable">

<tr>
<td colspan="8" class="empty">
Loading payout requests...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>

<script>

/* =====================================
   SETTINGS
===================================== */

const API =
"https://createlk-affiliate-payout.createlk.workers.dev";


/* =====================================
   MESSAGE
===================================== */

function showMessage(
text,
type="success"
){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message " + type;

}


/* =====================================
   LOAD PAYOUTS
===================================== */

async function loadPayouts(){

const table =
document.getElementById("payoutTable");

table.innerHTML =
`
<tr>
<td colspan="8" class="empty">
⏳ Loading...
</td>
</tr>
`;

try{

const response =
await fetch(
API + "/api/admin/payouts"
);

const data =
await response.json();

console.log(
"Admin payouts:",
data
);

if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to load payouts."
);

}

const payouts =
data.payouts || [];

if(
payouts.length === 0
){

table.innerHTML =
`
<tr>
<td colspan="8" class="empty">
No payout requests found.
</td>
</tr>
`;

return;

}

table.innerHTML =
"";

payouts.forEach(
payout => {

let details = {};

try{

details =
typeof payout.payment_details ===
"string"
?
JSON.parse(
payout.payment_details
)
:
payout.payment_details || {};

}catch(e){

details = {};

}

const status =
String(
payout.status || "PENDING"
).toUpperCase();

let statusClass =
"pending";

if(status === "PAID"){
statusClass = "paid";
}

if(status === "REJECTED"){
statusClass = "rejected";
}

const row =
document.createElement("tr");

row.innerHTML = `

<td>
${payout.id || ""}
</td>

<td>
${payout.affiliate_id || ""}
</td>

<td>
${payout.student_id || ""}
</td>

<td>
<strong>
LKR ${Number(
payout.amount || 0
).toLocaleString()}
</strong>
</td>

<td>

<div class="details">

<strong>
${details.account_name || "-"}
</strong><br>

🏦 ${details.bank_name || "-"}<br>

💳 ${details.account_number || "-"}<br>

📍 ${details.branch_name || payout.branch_name || "-"}

</div>

</td>

<td>

<span class="status ${statusClass}">
${status}
</span>

</td>

<td>
${payout.requested_at || payout.created_at || "-"}
</td>

<td>

${
status === "PENDING"
?

`

<button
class="paid-btn"
onclick="markPaid(${payout.id})">

✅ Mark Paid

</button>

<button
class="reject-btn"
onclick="rejectPayout(${payout.id})">

❌ Reject

</button>

`

:

"-"

}

</td>

`;

table.appendChild(row);

});

}catch(error){

console.error(error);

table.innerHTML =
`
<tr>
<td colspan="8" class="empty">
❌ ${error.message}
</td>
</tr>
`;

showMessage(
error.message,
"error"
);

}

}


/* =====================================
   MARK PAID
===================================== */

async function markPaid(id){

if(
!confirm(
"Mark payout #" +
id +
" as PAID?"
)
){

return;

}

try{

const response =
await fetch(
API + "/api/admin/payout/paid",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
id:id
})

});

const data =
await response.json();

if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to mark payout as paid."
);

}

showMessage(
"Payout #" +
id +
" marked as PAID."
);

loadPayouts();

}catch(error){

showMessage(
error.message,
"error"
);

}

}


/* =====================================
   REJECT
===================================== */

async function rejectPayout(id){

if(
!confirm(
"Reject payout #" +
id +
"?\n\nThe payout amount should be returned to the affiliate balance."
)
){

return;

}

try{

const response =
await fetch(
API + "/api/admin/payout/reject",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
id:id
})

});

const data =
await response.json();

if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to reject payout."
);

}

showMessage(
"Payout #" +
id +
" rejected."
);

loadPayouts();

}catch(error){

showMessage(
error.message,
"error"
);

}

}


/* =====================================
   START
===================================== */

loadPayouts();

</script>

</body>
</html>
