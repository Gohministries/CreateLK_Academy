<!DOCTYPE html>

Certificates | CreateLK Academy

<style>

*{
box-sizing:border-box;
margin:0;

body{

.container{

.card{

.student{

border:1px solid #e5e7eb;

}

.loading{

text-align:center;

}

.certificate{
margin-top:20px;
padding:25px;
border:2px solid #d8b45a;
border-radius:15px;
background:#fffdf5;

}

.certificate-icon{

margin-bottom:10px;
}

.certificate h2{

}

.certificate-name{

}

.certificate p{

color:#667085;

}

.progress-area{

}

.progress-bar{
height:14px;
background:#e5e7eb;

}

.progress-fill{

}

.progress-text{

}

.remaining{

}

.status{

font-weight:800;
}

.locked{

color:#92400e;
}

.unlocked{
background:#dcfce7;

}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

.btn{
flex:1;
border:0;
border-radius:9px;
padding:12px;
font-size:13px;
font-weight:800;
cursor:pointer;
text-decoration:none;
text-align:center;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:9px;
font-size:13px;
text-align:center;
line-height:1.5;
}

.message.show{
display:block;
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.success{
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:500px){

.card{
padding:20px 15px;
}

.buttons{
flex-direction:column;
}

h1{
font-size:23px;
}

.certificate-name{
font-size:19px;
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<div class="subtitle">

Earn your certificate by completing
1,000 correct English answers.

</div>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div id="certificateArea">
</div>


<div
id="message"
class="message">
</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<script>

/* =====================================================
   CREATE LK ACADEMY
   CERTIFICATE PAGE
===================================================== */


/* =====================================================
   WORKER
===================================================== */

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";


/* =====================================================
   STORAGE
===================================================== */

const STUDENT_KEY =
"createlk_student";


/* =====================================================
   CERTIFICATE TARGET
===================================================== */

const DEFAULT_TARGET = 1000;


/* =====================================================
   STUDENT
===================================================== */

let student = null;
let studentId = null;


/* =====================================================
   LOAD STUDENT
===================================================== */

function loadStudent(){

let stored =
sessionStorage.getItem(
STUDENT_KEY
);


/*
 If sessionStorage is empty,
 check localStorage.
*/

if(!stored){

stored =
localStorage.getItem(
STUDENT_KEY
);

}


/*
 No stored student.
*/

if(!stored){

return false;

}


try{

const data =
JSON.parse(stored);


if(!data ||
typeof data !== "object"){

return false;

}


student = data;


studentId =
data.id ||
data.student_id ||
data.user_id ||
null;


if(studentId){

studentId =
String(studentId);

}


return !!studentId;


}catch(error){

console.error(
"Student storage error:",
error
);

return false;

}

}


/* =====================================================
   STUDENT NAME
===================================================== */

function getStudentName(){

if(!student){

return "Student";

}


if(student.name){

return String(
student.name
);

}


const first =
student.first_name ||
student.firstName ||
"";


const last =
student.last_name ||
student.lastName ||
"";


const name =
`${first} ${last}`.trim();


return name ||
"Student";

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(){

const name =
getStudentName();


document.getElementById(
"studentBox"
).textContent =
"👤 " + name;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type="info"
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message show " + type;

}


function hideMessage(){

const box =
document.getElementById(
"message"
);

box.className =
"message";

box.textContent =
"";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   LOAD CERTIFICATE PROGRESS
===================================================== */

async function loadCertificateProgress(){

if(!studentId){

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Your login session could not be found. Please return to the login page and log in again.",
"error"
);

return;

}


try{


/*
 IMPORTANT:

Use the SAME progress Worker
that your AI practice page uses.
*/

const url =
PROGRESS_API +
"/api/progress?student_id=" +
encodeURIComponent(
studentId
);


const response =
await fetch(
url,
{
method:"GET",

headers:{
"Accept":
"application/json"
}
}
);


const raw =
await response.text();


console.log(
"Progress API:",
raw
);


let data;


try{

data =
JSON.parse(raw);

}catch(error){

throw new Error(
"Progress server returned an invalid response."
);

}


if(!response.ok){

throw new Error(
data.message ||
data.error ||
`Progress request failed (${response.status})`
);

}


if(
data.success === false
){

throw new Error(
data.message ||
data.error ||
"Could not load certificate progress."
);

}


/* =====================================================
   FIND PROGRESS
===================================================== */

const certificate =
data.certificate ||
{};


const target =
Number(
data.certificate_target ||
certificate.target ||
DEFAULT_TARGET
);


const correct =
Number(
data.certificate_progress ??
certificate.correct_answers ??
data.correct_answers ??
0
);


const safeCorrect =
Math.max(
0,
correct
);


const percentage =
target > 0
?
Math.min(
100,
Math.round(
(safeCorrect / target) * 100
)
)
:
0;


const remaining =
Math.max(
0,
target - safeCorrect
);


/* =====================================================
   HIDE LOADING
===================================================== */

document.getElementById(
"loading"
).style.display =
"none";


/* =====================================================
   DISPLAY CERTIFICATE STATUS
===================================================== */

if(
safeCorrect >= target
){

showUnlocked(
safeCorrect,
target
);

}else{

showLocked(
safeCorrect,
target,
percentage,
remaining
);

}


}catch(error){

console.error(
"Certificate progress error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showMessage(
error.message ||
"Unable to load certificate progress.",
"error"
);

}

}


/* =====================================================
   LOCKED CERTIFICATE
===================================================== */

function showLocked(
correct,
target,
percentage,
remaining
){

const area =
document.getElementById(
"certificateArea"
);


area.innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🔒
</div>

<h2>
Certificate Locked
</h2>

<div class="certificate-name">

${escapeHtml(
getStudentName()
)}

</div>

<p>

Complete

<strong>
${target.toLocaleString()}
correct answers
</strong>

to earn your CreateLK Academy
Achievement Certificate.

</p>


<div class="progress-area">

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percentage}%">
</div>

</div>


<div class="progress-text">

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</div>


<div class="remaining">

${remaining.toLocaleString()}
more correct answers needed.

</div>

</div>


<div class="status locked">

🔒 Certificate Locked — ${percentage}% Complete

</div>


<div class="buttons">

<a
href="dashboard.html"
class="btn secondary">

← Continue Learning

</a>

</div>

</div>

`;

}


/* =====================================================
   UNLOCKED CERTIFICATE
===================================================== */

function showUnlocked(
correct,
target
){

const area =
document.getElementById(
"certificateArea"
);


area.innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🏆
</div>

<h2>
Certificate Unlocked!
</h2>

<div class="certificate-name">

${escapeHtml(
getStudentName()
)}

</div>

<p>

Congratulations!

You have completed

<strong>
${correct.toLocaleString()}
correct English answers
</strong>

through CreateLK Academy.

</p>


<div class="status unlocked">

🎓 Achievement Certificate Earned

</div>


<div class="buttons">

<button
class="btn primary"
onclick="printCertificate()">

🖨️ Print Certificate

</button>


<a
href="dashboard.html"
class="btn secondary">

← Dashboard

</a>

</div>

</div>

`;


showMessage(
"🎉 Congratulations! Your certificate requirement has been completed.",
"success"
);

}


/* =====================================================
   PRINT CERTIFICATE
===================================================== */

function printCertificate(){

const name =
getStudentName();


const printWindow =
window.open(
"",
"_blank",
"width=1000,height=750"
);


if(!printWindow){

alert(
"Please allow pop-ups to print your certificate."
);

return;

}


printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>
CreateLK Academy Certificate
</title>


<style>

body{

margin:0;

padding:30px;

font-family:
Arial,
Helvetica,
sans-serif;

background:#fff;

text-align:center;

}

.certificate{

max-width:850px;

margin:auto;

padding:70px 50px;

border:10px solid #d8b45a;

background:#fffdf5;

box-shadow:
0 0 0 4px #f4e7b8 inset;

}

.logo{

font-size:30px;

font-weight:800;

color:#155eef;

margin-bottom:25px;

}

.icon{

font-size:50px;

margin-bottom:15px;

}

.title{

font-size:32px;

font-weight:800;

margin-bottom:30px;

}

.subtitle{

font-size:16px;

color:#667085;

}

.name{

font-size:38px;

font-weight:900;

color:#155eef;

margin:30px 0;

}

.text{

font-size:18px;

line-height:1.8;

}

.footer{

margin-top:45px;

font-size:13px;

color:#667085;

}

@media print{

body{

padding:0;

}

.certificate{

box-shadow:none;

}

}

</style>

</head>


<body>


<div class="certificate">


<div class="logo">

📚 CreateLK Academy

</div>


<div class="icon">
🏆
</div>


<div class="title">

English Learning
Achievement Certificate

</div>


<div class="subtitle">

This certificate is proudly presented to

</div>


<div class="name">

${escapeHtml(name)}

</div>


<div class="text">

For successfully completing

<strong>
1,000 correct English answers
</strong>

through the
CreateLK Academy
English learning platform.

</div>


<div class="footer">

Issued by CreateLK Academy

</div>


</div>


</body>

</html>

`);


printWindow.document.close();

printWindow.focus();


setTimeout(
function(){

printWindow.print();

},
500
);

}


/* =====================================================
   START
===================================================== */

const studentFound =
loadStudent();


if(studentFound){

displayStudent();

loadCertificateProgress();

}else{

document.getElementById(
"studentBox"
).textContent =
"👤 Student session not found";

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Please log in to CreateLK Academy to view your certificate progress.",
"info"
);

}

</script>

</body>

</html>
