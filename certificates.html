<main class="container">

<h1>
Achievement Certificates
</h1>

Earn your certificate by completing
1,000 correct English answers.

</p>

id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>

© 2026 CreateLK Academy. All rights reserved.

<script>


/* =====================================================
   CONFIGURATION
===================================================== */

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";

const CERTIFICATE_API =
"https://certificate.createlk.workers.dev";

const SITE =
"https://createlk.com";

const STUDENT_KEY =
"createlk_student";

const TARGET =
1000;

let student = null;
let studentId = null;
let certificate = null;


/* =====================================================
   LOAD STUDENT
===================================================== */

function loadStudent(){

const saved =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!saved){

return false;

}

try{

student =
JSON.parse(saved);

studentId =
student.id ||
student.student_id ||
student.user_id;

if(studentId){

studentId =
String(studentId);

}

return !!studentId;

}catch(error){

console.error(error);

return false;

}

}


/* =====================================================
   STUDENT NAME
===================================================== */

function studentName(){

if(student?.name){

return String(student.name);

}

return (

`${student?.first_name || ""}
 ${student?.last_name || ""}`

.replace(/\s+/g," ")
.trim()

||

"Student"

);

}


/* =====================================================
   MESSAGE
===================================================== */

function message(text,type){

const box =
$("message");

box.textContent =
text;

box.className =
"message show " + type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escape(text){

const div =
document.createElement("div");

div.textContent =
String(text ?? "");

return div.innerHTML;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

if(!date){

return new Date()
.toLocaleDateString();

}

const d =
new Date(date);

if(isNaN(d.getTime())){

return String(date);

}

return d.toLocaleDateString();

}


/* =====================================================
   LOAD PROGRESS
===================================================== */

async function loadProgress(){

if(!studentId){

$("loading").style.display =
"none";

message(
"Please log in again to view your certificate.",
"error"
);

return;

}


try{

const response =
await fetch(

PROGRESS_API +
"/api/progress?student_id=" +
encodeURIComponent(studentId)

);


const data =
await response.json();


if(!response.ok ||
data.success === false){

throw new Error(

data.message ||
data.error ||
"Unable to load progress."

);

}


const certificateData =
data.certificate || {};


const correct =
Number(

data.certificate_progress ??
certificateData.correct_answers ??
data.correct_answers ??
0

);


const target =
Number(

data.certificate_target ??
certificateData.target ??
TARGET

);


$("loading").style.display =
"none";


if(correct < target){

showLocked(
correct,
target
);

return;

}


/*
The student reached the required
number of correct answers.

Now the server creates or retrieves
the official certificate.
*/

await issueCertificate(
correct,
target
);


}catch(error){

console.error(error);

$("loading").style.display =
"none";

message(

error.message ||
"Unable to load certificate progress.",

"error"

);

}

}


/* =====================================================
   ISSUE CERTIFICATE
===================================================== */

async function issueCertificate(
correct,
target
){

const response =
await fetch(

CERTIFICATE_API +
"/issue",

{

method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify({

student_id:
studentId,

student_name:
studentName(),

correct_answers:
correct

})

}

);


const data =
await response.json();


if(!response.ok ||
!data.success){

throw new Error(

data.message ||
"Certificate could not be issued."

);

}


certificate =
data.certificate;


if(!certificate ||
!certificate.certificate_id){

throw new Error(
"Certificate ID was not returned by the server."
);

}


showCertificate(
certificate,
target
);

}


/* =====================================================
   LOCKED CERTIFICATE
===================================================== */

function showLocked(
correct,
target
){

const percent =
Math.min(

100,

Math.round(
correct / target * 100
)

);


$("certificateArea").innerHTML = `

<div class="locked-card">

<div style="font-size:40px">
🔒
</div>

<h2 style="margin:8px 0">
Certificate Locked
</h2>

<p style="font-size:13px;color:#667085">

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</p>

<div class="progress">

<div
class="progress-fill"
style="width:${percent}%">
</div>

</div>

<p style="
margin-top:10px;
font-size:12px;
color:#667085;
">

${Math.max(
0,
target - correct
).toLocaleString()}

more correct answers needed.

</p>

</div>

`;

}


/* =====================================================
   SHOW CERTIFICATE
===================================================== */

function showCertificate(
cert,
target
){

const name =
cert.student_name ||
studentName();


const id =
cert.certificate_id;


const issued =
formatDate(
cert.issued_at
);


const verifyUrl =
cert.verification_url ||

`${SITE}/verify.html?id=` +
encodeURIComponent(id);


const answers =
Number(
cert.correct_answers ||
target
);


$("certificateArea").innerHTML = `

<div
class="certificate"
id="certificate">


<div class="cert-content">


<div class="logo-mark">
CL
</div>


<div class="brand">
CREATE LK ACADEMY
</div>


<div class="website">
createlk.com
</div>


<div class="line"></div>


<div class="cert-heading">
CERTIFICATE OF ACHIEVEMENT
</div>


<div class="cert-title">
English Learning
</div>


<div class="presented">

This certificate is proudly presented to

</div>


<div class="student-name">

${escape(name)}

</div>


<div class="description">

For successfully completing

<strong>

${answers.toLocaleString()}
correct English answers

</strong>

through the CreateLK Academy
English learning platform.

</div>


<div class="seal">
🏆
</div>


<div class="verification">

<span class="verified">
✓ DIGITALLY VERIFIED
</span>

<br>

Certificate ID:

<strong>
${escape(id)}
</strong>

<br>

Official verification:
<strong>
createlk.com
</strong>

</div>


<div class="cert-footer">


<div class="signature">

<div class="digital-signature">
CreateLK Academy
</div>

Authorized

</div>


<div class="website-footer">

createlk.com

<br>

Issued:
${escape(issued)}

<div class="certificate-id">

ID:
${escape(id)}

</div>

</div>


<div class="signature">

<div class="digital-signature">
English Learning
</div>

Achievement

</div>


</div>


</div>

</div>


<div class="buttons">


<button
class="primary"
onclick="downloadCertificate()">

⬇️ Download Certificate

</button>


<a
href="${escape(verifyUrl)}"
target="_blank"
rel="noopener"
class="btn verify-btn">

✓ Verify Certificate

</a>


<a
href="dashboard.html"
class="btn secondary">

← Dashboard

</a>


</div>

`;

message(
"🎉 Your official CreateLK certificate has been issued.",
"success"
);

}


/* =====================================================
   DOWNLOAD CERTIFICATE
===================================================== */

function downloadCertificate(){

if(!certificate){

message(
"Certificate is not ready.",
"error"
);

return;

}


const name =
studentName();


const id =
certificate.certificate_id;


const issued =
formatDate(
certificate.issued_at
);


const verifyUrl =
certificate.verification_url ||

`${SITE}/verify.html?id=` +
encodeURIComponent(id);


const answers =
Number(
certificate.correct_answers ||
TARGET
);


const html = `

}

}

}

`;


const blob =
new Blob(
[html],
{
type:"text/html"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href =
url;


link.download =

"CreateLK-Academy-Certificate-" +

name.replace(
/[^a-z0-9]/gi,
"-"
) +

"-" +

id +

".html";


document.body.appendChild(link);

link.click();

document.body.removeChild(link);


setTimeout(
()=>{
URL.revokeObjectURL(url);
},
1000
);


message(
"🎓 Certificate downloaded successfully.",
"success"
);

}


/* =====================================================
   HELPER
===================================================== */

function $(id){

return document.getElementById(id);

}


/* =====================================================
   START
===================================================== */

if(loadStudent()){

$("studentBox").textContent =
"👤 " + studentName();

loadProgress();

}else{

$("studentBox").textContent =
"👤 Student session not found";

$("loading").style.display =
"none";

message(
"Please log in to CreateLK Academy.",
"info"
);

}
