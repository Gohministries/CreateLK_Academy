<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #ddd}
.nav{max-width:1100px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between}
.logo{font-weight:800;color:#155eef}.back{text-decoration:none;color:#475467;font-weight:bold}
.container{max-width:1150px;margin:auto;padding:20px 15px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin-bottom:20px}
.hero{text-align:center}.muted,.empty{color:#667085}
.status{padding:11px;border-radius:8px;margin-top:15px;font-weight:bold}
.active{background:#dcfce7;color:#166534}.locked{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:30px}
.btn{display:inline-block;margin:6px;padding:12px 20px;border:0;border-radius:8px;background:#155eef;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}
.green-btn{background:#15803d}

/* CERTIFICATE */
.certificate-wrap{display:none}

.certificate{
position:relative;width:1120px;height:792px;margin:auto;
background:linear-gradient(135deg,#fff,#f5f3ff);
border:10px solid #172554;color:#172033;overflow:hidden
}

.certificate:before{
content:"";position:absolute;inset:18px;
border:4px solid #f59e0b
}

.certificate:after{
content:"";position:absolute;inset:30px;
border:2px solid #2563eb
}

.certificate-content{
position:absolute;z-index:2;top:65px;left:80px;right:80px;bottom:70px;
display:flex;flex-direction:column;align-items:center;text-align:center
}

.academy{
font-size:27px;font-weight:900;letter-spacing:7px;color:#155eef
}

.line{
width:210px;height:4px;
background:linear-gradient(90deg,#2563eb,#f59e0b,#9333ea);
margin:12px
}

.title{
font:64px Georgia,serif;
letter-spacing:8px;margin:0;color:#172554
}

.sub{
font-weight:bold;letter-spacing:6px;
color:#d97706;margin-top:5px
}

.presented{
margin-top:30px;color:#667085
}

.name{
font:bold 46px Georgia,serif;
color:#1d4ed8;margin:12px 0;
padding:0 40px 10px;
border-bottom:4px solid #f59e0b;
max-width:850px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.course{
font:bold 29px Georgia,serif;
color:#172554;margin-top:8px;
max-width:800px
}

.score{
margin-top:18px;padding:10px 30px;
border:3px solid #f59e0b;
border-radius:40px;
background:#fff8e8;
font-weight:bold
}

.score strong{
font-size:25px;
color:#155eef;
margin-left:25px
}

.details{
width:88%;margin-top:auto;
display:flex;justify-content:space-between;gap:30px
}

.detail{width:33%;text-align:center;overflow:hidden}

.value{
font-weight:bold;margin-bottom:7px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

.line2{
border-top:1px solid #777;
padding-top:7px;font-size:10px;
letter-spacing:2px;color:#667085
}

.signature{
font:28px "Brush Script MT",cursive;
color:#155eef
}

.website{
position:absolute;bottom:27px;left:0;right:0;
color:#155eef;font-weight:bold;z-index:3
}

.verify{
position:absolute;bottom:10px;left:0;right:0;
font-size:9px;color:#999;z-index:3
}

/* PRINT / PDF */
@page{
size:A4 landscape;
margin:0
}

@media print{
html,body{
width:297mm!important;
height:210mm!important;
margin:0!important;
padding:0!important;
background:#fff!important;
overflow:hidden!important
}

header,.hero,#progressCard,footer,.actions,
#membershipStatus{
display:none!important
}

.container,.card{
width:297mm!important;
height:210mm!important;
margin:0!important;
padding:0!important;
border:0!important;
box-shadow:none!important
}

.certificate-wrap{
display:block!important;
width:297mm!important;
height:210mm!important;
padding:0!important;
margin:0!important;
overflow:hidden!important
}

.certificate{
width:297mm!important;
height:210mm!important;
margin:0!important;
border:2.6mm solid #172554!important
}

.certificate:before{
inset:4.8mm!important;
border:1mm solid #f59e0b!important
}

.certificate:after{
inset:7.5mm!important;
border:.5mm solid #2563eb!important
}

.certificate-content{
top:18mm!important;
left:24mm!important;
right:24mm!important;
bottom:19mm!important
}

.academy{font-size:6mm!important;letter-spacing:1.6mm!important}
.line{width:50mm!important;height:.8mm!important}
.title{font-size:17mm!important;letter-spacing:2mm!important}
.sub{font-size:4.5mm!important}
.presented{margin-top:8mm!important;font-size:4.3mm!important}

.name{
font-size:12mm!important;
padding:0 12mm 3mm!important;
margin:3mm 0 2mm!important;
max-width:225mm!important;
border-bottom:1mm solid #f59e0b!important
}

.course{font-size:7mm!important}

.score{
margin-top:4mm!important;
padding:2.5mm 8mm!important;
border:.7mm solid #f59e0b!important
}

.score strong{font-size:5.5mm!important}
.details{width:88%!important;gap:10mm!important}
.value{font-size:3.7mm!important}
.line2{font-size:2.5mm!important}
.signature{font-size:6mm!important}
.website{bottom:7mm!important;font-size:3.5mm!important}
.verify{bottom:3mm!important;font-size:2.2mm!important}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header>

<div class="container">

<div class="card hero">
<div style="font-size:40px">🎓</div>
<h1>My Certificate</h1>
<p class="muted">Your certificate is available as a professional A4 PDF.</p>
<div id="membershipStatus" class="status">
Checking Premium membership...
</div>
</div>

<div id="progressCard" class="card">
<h2>📊 Assessment Result</h2>
<div id="progressArea" class="empty">Loading...</div>
</div>

<div class="card">
<h2>🏆 Certificate</h2>
<div id="certificateArea" class="empty">
Checking certificate...
</div>
</div>

</div>

<footer style="text-align:center;padding:20px;color:#667085">
© 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

const MEMBERSHIP_API=
"https://createlk-membership-api.createlk.workers.dev";

const CERTIFICATE_API=
"https://createlk-certificate-api.createlk.workers.dev";

const token=
sessionStorage.getItem("createlk_token");

const student=
JSON.parse(
sessionStorage.getItem("createlk_student")||"null"
);

if(!token||!student){
location.href="login.html";
}

const $=id=>document.getElementById(id);


/* REAL STUDENT NAME
   NEVER USE EMAIL
*/
function getStudentName(){

const first=
String(student.first_name||"").trim();

const last=
String(student.last_name||"").trim();

const full=
(first+" "+last).trim();

return full||
"CreateLK Academy Student";
}


/* MEMBERSHIP */
async function checkPremium(){

try{

const r=await fetch(
MEMBERSHIP_API+
"/api/membership?student_id="+
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer "+token
}
}
);

const d=await r.json();

if(!r.ok||!d.success||!d.active){

$("membershipStatus").className=
"status locked";

$("membershipStatus").textContent=
"🔒 Active Premium Membership Required";

$("certificateArea").innerHTML=
'<div class="empty">🔒 Premium membership is required.</div>';

return;
}

$("membershipStatus").className=
"status active";

$("membershipStatus").textContent=
"⭐ Premium Membership Active";

loadData();

}catch(e){

$("membershipStatus").className=
"status locked";

$("membershipStatus").textContent=
"Unable to connect to membership server.";

}
}


/* LOAD */
async function loadData(){

try{

const r=await fetch(
CERTIFICATE_API+
"/api/certificate/progress?student_id="+
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer "+token
}
}
);

const d=await r.json();

if(!r.ok||!d.success)throw Error();

showProgress(d);

showCertificate(d.certificates||[]);

}catch(e){

$("certificateArea").innerHTML=
'<div class="empty">❌ Unable to load certificate.</div>';

}
}


/* SCORE */
function getPercent(score,total){

let n=parseFloat(
String(score??0).replace("%","")
)||0;

total=parseInt(total)||10;

if(n<=1)n*=100;
else if(n<=10)n=(n/total)*100;

return Math.round(
Math.max(0,Math.min(100,n))
);
}


/* PROGRESS */
function showProgress(d){

const a=d.assessment;

if(!a){

$("progressArea").innerHTML=
'<div class="empty">📝 Final Assessment Not Completed.<br><br><a class="btn" href="exam.html">Take Assessment</a></div>';

return;
}

const p=getPercent(
a.score,
a.total_questions
);

const pass=
p>=70||
Number(a.passed)===1;

$("progressArea").innerHTML=`

<div>
<strong>Course:</strong>
${esc(a.course_name||"Premium English Course")}
<br><br>

<strong>Score:</strong>
${p}%

<br><br>

<strong>Result:</strong>
${pass?"✅ PASSED":"❌ NOT PASSED"}
</div>`;

}


/* CERTIFICATE */
function showCertificate(list){

if(!list.length){

$("certificateArea").innerHTML=
'<div class="empty">🎓 No certificate available yet.<br><br><a class="btn" href="exam.html">Final Assessment</a></div>';

return;
}

const c=list[0];

const p=getPercent(
c.score,
c.total_questions
);


/*
IMPORTANT FIX:

Always use the real logged-in
student name first.

This prevents an old API
certificate containing an email
from appearing on the certificate.
*/

const realName=
getStudentName();

const course=
c.course_name||
"Premium English Course";

const date=
c.issue_date||
new Date().toLocaleDateString("en-GB");

const certId=
c.certificate_id||
"CREATELK-CERT";


$("certificateArea").innerHTML=`

<div class="certificate-wrap">

<div class="certificate">

<div class="certificate-content">

<div class="academy">
CREATELK ACADEMY
</div>

<div class="line"></div>

<h1 class="title">
CERTIFICATE
</h1>

<div class="sub">
OF ACHIEVEMENT
</div>

<div class="presented">
This certificate is proudly presented to
</div>

<div class="name">
${esc(realName)}
</div>

<div class="muted">
for successfully completing
</div>

<div class="course">
${esc(course)}
</div>

<div class="score">
FINAL ASSESSMENT SCORE
<strong>${p}%</strong>
</div>

<div class="details">

<div class="detail">
<div class="value">
${esc(date)}
</div>
<div class="line2">
DATE OF ISSUE
</div>
</div>

<div class="detail">
<div class="signature">
CreateLK Academy
</div>
<div class="line2">
AUTHORIZED SIGNATURE
</div>
</div>

<div class="detail">
<div class="value">
${esc(certId)}
</div>
<div class="line2">
CERTIFICATE ID
</div>
</div>

</div>

</div>

<div class="website">
createlk.com
</div>

<div class="verify">
This certificate may be verified online using the Certificate ID.
</div>

</div>

</div>

<div class="actions">

<button
class="btn green-btn"
onclick="downloadPDF()">

📄 Download / Save PDF

</button>

<a
class="btn"
href="dashboard.html">

← Dashboard

</a>

</div>

`;

}


/* PDF / PRINT */
function downloadPDF(){

window.print();

}


/* ESCAPE */
function esc(v){

return String(v??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

}

checkPremium();

</script>

</body>
</html>
