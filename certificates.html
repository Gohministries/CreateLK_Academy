<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificates | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:14px 16px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:800;
font-size:18px;
color:#155eef;
}

.back{
text-decoration:none;
color:#475467;
font-size:13px;
font-weight:bold;
}

.container{
max-width:900px;
margin:25px auto;
padding:0 15px 40px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px #0000000d;
}

.hero{text-align:center}

.icon{
width:60px;
height:60px;
margin:auto;
border-radius:15px;
background:#f5f3ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:25px;
margin:12px 0 6px;
}

.subtitle{
color:#667085;
font-size:14px;
}

.student{
margin-top:18px;
padding:12px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
font-weight:bold;
}

.loading{
padding:25px;
text-align:center;
color:#667085;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
text-align:center;
font-size:13px;
}

.message.show{display:block}
.error{background:#fff1f2;color:#be123c}
.success{background:#ecfdf3;color:#166534}
.info{background:#eff6ff;color:#1d4ed8}


/* LOCKED */

.locked-card{
margin-top:20px;
padding:25px;
text-align:center;
border:1px solid #f3dfb0;
border-radius:14px;
background:#fffdf5;
}

.progress{
height:12px;
margin-top:18px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#155eef;
}


/* CERTIFICATE */

.certificate{
position:relative;
margin:25px auto 0;
max-width:820px;
aspect-ratio:1.414/1;
background:#fffdf5;
border:10px solid #c8a951;
box-shadow:0 0 0 3px #8d6f24;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.certificate:before{
content:"";
position:absolute;
inset:15px;
border:2px solid #c8a951;
}

.cert-content{
position:relative;
z-index:2;
width:78%;
text-align:center;
}

.brand{
font-size:17px;
font-weight:900;
letter-spacing:3px;
color:#155eef;
}

.line{
width:100px;
height:2px;
background:#c8a951;
margin:10px auto;
}

.cert-heading{
font-size:13px;
letter-spacing:3px;
color:#667085;
font-weight:bold;
}

.cert-title{
font-family:Georgia,serif;
font-size:36px;
margin:8px 0;
}

.presented{
font-size:12px;
color:#667085;
}

.student-name{
font-family:Georgia,serif;
font-size:31px;
font-weight:bold;
color:#155eef;
margin:10px auto;
padding:0 15px 7px;
border-bottom:2px solid #c8a951;
display:inline-block;
}

.description{
font-size:12px;
line-height:1.7;
color:#344054;
}

.seal{
width:55px;
height:55px;
margin:12px auto;
border:3px solid #c8a951;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
background:#fff;
}

.cert-footer{
display:flex;
justify-content:space-between;
font-size:8px;
color:#667085;
margin-top:8px;
}

.signature{
border-top:1px solid #667085;
padding-top:3px;
width:130px;
}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

button,a.btn{
flex:1;
padding:12px;
border:0;
border-radius:9px;
font-size:13px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:600px){

.card{padding:20px 14px}

.cert-title{font-size:20px}

.brand{font-size:9px;letter-spacing:1px}

.cert-heading{font-size:7px;letter-spacing:1px}

.student-name{font-size:18px}

.description{
font-size:7px;
line-height:1.4;
}

.presented{font-size:7px}

.seal{
width:35px;
height:35px;
font-size:16px;
margin:6px auto;
}

.cert-footer{
font-size:5px;
}

.signature{
width:65px;
}

.certificate{
border-width:6px;
}

.certificate:before{
inset:9px;
}

.buttons{
flex-direction:column;
}

}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header>

<main class="container">

<div class="card">

<div class="hero">
<div class="icon">🎓</div>

<h1>Achievement Certificates</h1>

<p class="subtitle">
Earn your certificate by completing 1,000 correct English answers.
</p>
</div>

<div id="studentBox" class="student">
Loading student...
</div>

<div id="loading" class="loading">
⏳ Checking certificate progress...
</div>

<div id="certificateArea"></div>

<div id="message" class="message"></div>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

const API =
"https://createlk-progress.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const TARGET = 1000;

let student = null;
let studentId = null;


/* STUDENT */

function loadStudent(){

let saved =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!saved)return false;

try{

student = JSON.parse(saved);

studentId =
student.id ||
student.student_id ||
student.user_id;

return !!studentId;

}catch(e){

return false;

}

}

function studentName(){

if(student.name)
return student.name;

return (
`${student.first_name||""} ${student.last_name||""}`
.trim() ||
"Student"
);

}


/* MESSAGE */

function message(text,type){

const box =
document.getElementById("message");

box.textContent = text;
box.className = "message show " + type;

}


/* ESCAPE */

function escape(text){

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}


/* LOAD PROGRESS */

async function loadProgress(){

if(!studentId){

$("loading").style.display="none";

message(
"Please log in again to view your certificate.",
"error"
);

return;

}

try{

const response =
await fetch(
API +
"/api/progress?student_id=" +
encodeURIComponent(studentId)
);

const data =
await response.json();

if(!response.ok || data.success===false){

throw new Error(
data.message ||
data.error ||
"Unable to load progress."
);

}

const certificate =
data.certificate || {};

const correct =
Number(
data.certificate_progress ??
certificate.correct_answers ??
data.correct_answers ??
0
);

const target =
Number(
data.certificate_target ??
certificate.target ??
TARGET
);

$("loading").style.display="none";

if(correct >= target){

showCertificate(correct,target);

}else{

showLocked(correct,target);

}

}catch(error){

$("loading").style.display="none";

message(
error.message ||
"Unable to load certificate progress.",
"error"
);

}

}


/* LOCKED */

function showLocked(correct,target){

const percent =
Math.min(
100,
Math.round(correct/target*100)
);

$("certificateArea").innerHTML = `

<div class="locked-card">

<div style="font-size:40px">🔒</div>

<h2 style="margin:8px 0">
Certificate Locked
</h2>

<p style="font-size:13px;color:#667085">
${correct.toLocaleString()} /
${target.toLocaleString()} correct answers
</p>

<div class="progress">
<div
class="progress-fill"
style="width:${percent}%">
</div>
</div>

<p style="margin-top:10px;font-size:12px;color:#667085">
${Math.max(0,target-correct).toLocaleString()}
more correct answers needed.
</p>

</div>

`;

}


/* CERTIFICATE */

function showCertificate(correct,target){

const name =
studentName();

$("certificateArea").innerHTML = `

<div class="certificate" id="certificate">

<div class="cert-content">

<div class="brand">
CREATE LK ACADEMY
</div>

<div class="line"></div>

<div class="cert-heading">
CERTIFICATE OF ACHIEVEMENT
</div>

<div class="cert-title">
English Learning
</div>

<div class="presented">
This certificate is proudly presented to
</div>

<div class="student-name">
${escape(name)}
</div>

<div class="description">

For successfully completing

<strong>
${target.toLocaleString()} correct English answers
</strong>

through the CreateLK Academy
English learning platform.

</div>

<div class="seal">
🏆
</div>

<div class="cert-footer">

<div class="signature">
CreateLK Academy<br>
Authorized
</div>

<div>
Issued ${new Date().toLocaleDateString()}
</div>

<div class="signature">
English Learning<br>
Achievement
</div>

</div>

</div>

</div>

<div class="buttons">

<button
class="primary"
onclick="downloadCertificate()">

⬇️ Download Certificate

</button>

<a
href="dashboard.html"
class="btn secondary">

← Dashboard

</a>

</div>

`;

message(
"🎉 Congratulations! Your certificate is unlocked.",
"success"
);

}


/* DOWNLOAD */

function downloadCertificate(){

const name =
studentName();

const date =
new Date().toLocaleDateString();

const html = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
CreateLK Academy Certificate
</title>

<style>

body{
margin:0;
padding:30px;
background:#eee;
font-family:Arial,sans-serif;
}

.certificate{
max-width:1100px;
margin:auto;
aspect-ratio:1.414/1;
background:#fffdf5;
border:14px solid #c8a951;
box-shadow:0 0 0 4px #8d6f24;
display:flex;
align-items:center;
justify-content:center;
}

.content{
width:78%;
text-align:center;
}

.brand{
font-size:25px;
font-weight:900;
letter-spacing:4px;
color:#155eef;
}

.line{
width:150px;
height:3px;
background:#c8a951;
margin:15px auto;
}

.heading{
font-size:17px;
letter-spacing:4px;
color:#667085;
font-weight:bold;
}

.title{
font-family:Georgia,serif;
font-size:48px;
margin:15px 0;
}

.presented{
color:#667085;
}

.name{
font-family:Georgia,serif;
font-size:44px;
font-weight:bold;
color:#155eef;
display:inline-block;
margin:15px;
padding:0 30px 10px;
border-bottom:3px solid #c8a951;
}

.text{
font-size:17px;
line-height:1.8;
color:#344054;
}

.seal{
width:80px;
height:80px;
border:4px solid #c8a951;
border-radius:50%;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

.footer{
display:flex;
justify-content:space-between;
font-size:11px;
color:#667085;
}

.signature{
border-top:1px solid #667085;
padding-top:5px;
width:180px;
}

@media(max-width:600px){

body{padding:10px}

.brand{font-size:10px}
.heading{font-size:7px}
.title{font-size:22px}
.name{font-size:20px}
.text{font-size:8px}
.seal{
width:40px;
height:40px;
font-size:18px;
}

.footer{font-size:5px}

.signature{width:70px}

}

</style>

</head>

<body>

<div class="certificate">

<div class="content">

<div class="brand">
CREATE LK ACADEMY
</div>

<div class="line"></div>

<div class="heading">
CERTIFICATE OF ACHIEVEMENT
</div>

<div class="title">
English Learning
</div>

<div class="presented">
This certificate is proudly presented to
</div>

<div class="name">
${escape(name)}
</div>

<div class="text">

For successfully completing

<strong>
1,000 correct English answers
</strong>

through the CreateLK Academy
English learning platform.

</div>

<div class="seal">
🏆
</div>

<div class="footer">

<div class="signature">
CreateLK Academy<br>
Authorized
</div>

<div>
Issued: ${date}
</div>

<div class="signature">
English Learning<br>
Achievement
</div>

</div>

</div>

</div>

</body>

</html>
`;

const blob =
new Blob(
[html],
{type:"text/html"}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;

link.download =
"CreateLK-Academy-Certificate-" +
name.replace(/[^a-z0-9]/gi,"-") +
".html";

link.click();

URL.revokeObjectURL(url);

message(
"🎓 Certificate downloaded successfully.",
"success"
);

}


/* HELPER */

function $(id){
return document.getElementById(id);
}


/* START */

if(loadStudent()){

$("studentBox").textContent =
"👤 " + studentName();

loadProgress();

}else{

$("studentBox").textContent =
"👤 Student session not found";

$("loading").style.display="none";

message(
"Please log in to CreateLK Academy.",
"info"
);

}

</script>

</body>
</html>
