<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificates | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:850px;
margin:auto;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef;
}

.back{
color:#475467;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.container{
max-width:800px;
margin:25px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.hero{
text-align:center;
}

.icon{
width:64px;
height:64px;
margin:auto;
border-radius:16px;
background:#f5f3ff;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

h1{
font-size:26px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.6;
}

.student{
margin-top:20px;
padding:13px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
}

.loading{
padding:25px;
text-align:center;
color:#667085;
}

.certificate{
margin-top:20px;
padding:24px;
border:2px solid #d8b45a;
border-radius:15px;
background:#fffdf5;
text-align:center;
}

.certificate-icon{
font-size:42px;
margin-bottom:10px;
}

.certificate h2{
font-size:21px;
margin-bottom:8px;
}

.certificate-name{
font-size:22px;
font-weight:800;
color:#155eef;
margin:12px 0;
}

.certificate p{
font-size:13px;
color:#667085;
line-height:1.6;
}

.certificate-id{
font-size:12px;
color:#667085;
margin-top:12px;
}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

.btn{
flex:1;
border:0;
border-radius:9px;
padding:12px;
font-size:13px;
font-weight:800;
cursor:pointer;
text-decoration:none;
text-align:center;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:9px;
font-size:13px;
text-align:center;
line-height:1.5;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:500px){
.card{padding:20px 15px}
.buttons{flex-direction:column}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>


<main class="container">

<div class="card">

<div class="hero">

<div class="icon">🎓</div>

<h1>Achievement Certificates</h1>

<div class="subtitle">
View your CreateLK Academy learning certificates.
</div>

</div>


<div id="studentBox" class="student">
Loading student...
</div>


<div id="loading" class="loading">
⏳ Loading certificates...
</div>


<div id="certificates"></div>


<div id="message" class="message"></div>

</div>

</main>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

/* =========================================
   CREATE LK ACADEMY API
========================================= */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* =========================================
   GET STUDENT
========================================= */

let student = null;

try{

const saved =
sessionStorage.getItem(
STUDENT_KEY
);

if(saved){

student =
JSON.parse(saved);

}

}catch(error){

console.error(error);

}


/* =========================================
   LOGIN CHECK
========================================= */

if(
!student ||
sessionStorage.getItem(LOGIN_KEY) !== "true"
){

window.location.replace("login.html");

}


/* =========================================
   STUDENT DATA
========================================= */

const studentId =
student?.id ||
student?.student_id;

const firstName =
student?.first_name ||
student?.firstName ||
"Student";

const lastName =
student?.last_name ||
student?.lastName ||
"";

const fullName =
(firstName + " " + lastName).trim();


document.getElementById(
"studentBox"
).textContent =
"👤 " + fullName;


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =========================================
   LOAD CERTIFICATES
========================================= */

async function loadCertificates(){

if(!studentId){

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Student ID is missing. Please login again.",
"error"
);

return;

}


try{

const response =
await fetch(
API_URL +
"/api/certificates?student_id=" +
encodeURIComponent(studentId),
{
method:"GET",
headers:{
"Accept":"application/json"
}
}
);


const raw =
await response.text();


console.log(
"CERTIFICATE RESPONSE:",
raw
);


let data;

try{

data =
JSON.parse(raw);

}catch(error){

throw new Error(
"Invalid response from certificate server."
);

}


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to load certificates."
);

}


const certificates =
data.certificates ||
data.data ||
[];


document.getElementById(
"loading"
).style.display =
"none";


if(
!Array.isArray(certificates) ||
certificates.length === 0
){

showMessage(
"No certificates are available yet. Complete the required learning activities to earn a certificate.",
"info"
);

return;

}


const container =
document.getElementById(
"certificates"
);

container.innerHTML =
"";


certificates.forEach(
function(cert){

const box =
document.createElement(
"div"
);

box.className =
"certificate";


const certificateId =
cert.certificate_id ||
cert.id ||
"";


const title =
cert.title ||
cert.certificate_title ||
"Achievement Certificate";


const issuedDate =
cert.issued_at ||
cert.created_at ||
"";


box.innerHTML =

'<div class="certificate-icon">🏆</div>' +

'<h2>' +
escapeHtml(title) +
'</h2>' +

'<div class="certificate-name">' +
escapeHtml(
cert.student_name ||
fullName
) +
'</div>' +

'<p>' +
escapeHtml(
cert.description ||
"Successfully completed the required CreateLK Academy learning assessment."
) +
'</p>' +

(
certificateId
?
'<div class="certificate-id">' +
'Certificate ID: ' +
escapeHtml(String(certificateId)) +
'</div>'
:
''
) +

(
issuedDate
?
'<div class="certificate-id">' +
'Issued: ' +
escapeHtml(formatDate(issuedDate)) +
'</div>'
:
''
) +

'<div class="buttons">' +

'<button class="btn primary" ' +
'onclick="printCertificate(this)">' +
'🖨️ Print Certificate' +
'</button>' +

(
cert.certificate_url
?
'<a class="btn secondary" target="_blank" rel="noopener" href="' +
escapeAttribute(cert.certificate_url) +
'">' +
'📄 View Certificate' +
'</a>'
:
''
) +

'</div>';


container.appendChild(box);

});

}catch(error){

console.error(
"Certificate error:",
error
);

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
error.message ||
"Unable to load certificates.",
"error"
);

}

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value || "")
.replace(/"/g,"&quot;")
.replace(/</g,"%3C")
.replace(/>/g,"%3E");

}


/* =========================================
   DATE
========================================= */

function formatDate(value){

try{

return new Date(value)
.toLocaleDateString();

}catch(error){

return value;

}

}


/* =========================================
   PRINT
========================================= */

function printCertificate(button){

const certificate =
button.closest(
".certificate"
);

if(!certificate){
return;
}


const printWindow =
window.open(
"",
"_blank",
"width=900,height=700"
);


if(!printWindow){

alert(
"Please allow pop-ups to print your certificate."
);

return;

}


printWindow.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>CreateLK Academy Certificate</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
padding:40px;
text-align:center;
}

.certificate{
border:8px solid #d8b45a;
padding:60px 40px;
max-width:800px;
margin:auto;
}

h1{
font-size:32px;
color:#155eef;
}

h2{
font-size:24px;
margin:20px 0;
}

.name{
font-size:30px;
font-weight:bold;
color:#155eef;
margin:25px 0;
}

p{
line-height:1.7;
}

</style>

</head>

<body>

<div class="certificate">

<h1>📚 CreateLK Academy</h1>

<h2>Achievement Certificate</h2>

<div class="name">
${escapeHtml(fullName)}
</div>

<p>
This certificate recognizes the successful
learning achievement of the above student.
</p>

<p>
Issued by CreateLK Academy
</p>

</div>

</body>
</html>
`);


printWindow.document.close();

printWindow.focus();

setTimeout(
function(){

printWindow.print();

},
500
);

}


/* =========================================
   START
========================================= */

loadCertificates();

</script>

</body>
</html>
