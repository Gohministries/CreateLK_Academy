<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Certificates | CreateLK Academy
</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
line-height:1.5;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:850px;
margin:auto;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef;
}

.back{
color:#475467;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.back:hover{
color:#155eef;
}

.container{
max-width:800px;
margin:25px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.hero{
text-align:center;
}

.icon{
width:64px;
height:64px;
margin:auto;
border-radius:16px;
background:#f5f3ff;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

h1{
font-size:26px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.6;
}

.student{
margin-top:20px;
padding:13px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
font-weight:700;
}

.loading{
padding:25px;
text-align:center;
color:#667085;
}

.certificate{
margin-top:20px;
padding:24px;
border:2px solid #d8b45a;
border-radius:15px;
background:#fffdf5;
text-align:center;
}

.certificate-icon{
font-size:42px;
margin-bottom:10px;
}

.certificate h2{
font-size:21px;
margin-bottom:8px;
}

.certificate-name{
font-size:22px;
font-weight:800;
color:#155eef;
margin:12px 0;
}

.certificate p{
font-size:13px;
color:#667085;
line-height:1.6;
}

.certificate-id{
font-size:12px;
color:#667085;
margin-top:12px;
}

.progress-area{
margin-top:20px;
}

.progress-bar{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#155eef;
border-radius:20px;
transition:width .5s ease;
}

.progress-text{
margin-top:10px;
font-size:14px;
font-weight:800;
color:#344054;
}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

.btn{
flex:1;
border:0;
border-radius:9px;
padding:12px;
font-size:13px;
font-weight:800;
cursor:pointer;
text-decoration:none;
text-align:center;
}

.primary{
background:#155eef;
color:#fff;
}

.primary:hover{
background:#1247b8;
}

.message{
display:block;
margin-top:18px;
padding:13px;
border-radius:9px;
font-size:13px;
text-align:center;
line-height:1.5;
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.success{
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

.hidden{
display:none;
}

@media(max-width:500px){

.card{
padding:20px 15px;
}

.buttons{
flex-direction:column;
}

h1{
font-size:23px;
}

.certificate-name{
font-size:20px;
}

}

</style>

</head>

<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<div class="subtitle">

Earn your certificate by completing
1,000 correct English answers.

</div>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div id="content"></div>


<div
id="message"
class="hidden">
</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<script>

/* =====================================================
   CREATE LK ACADEMY
   CERTIFICATE PAGE
===================================================== */


/* =====================================================
   PROGRESS WORKER
===================================================== */

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";


/* =====================================================
   STORAGE
===================================================== */

const STUDENT_KEY =
"createlk_student";


/* =====================================================
   CERTIFICATE TARGET
===================================================== */

const DEFAULT_TARGET = 1000;


/* =====================================================
   STUDENT VARIABLES
===================================================== */

let student = null;
let studentId = null;


/* =====================================================
   LOAD STUDENT
===================================================== */

function loadStudent(){

let saved = null;


/*
   First try sessionStorage.
*/

try{

saved =
sessionStorage.getItem(
STUDENT_KEY
);

}catch(error){

console.warn(
"Session storage unavailable."
);

}


/*
   If sessionStorage is empty,
   try localStorage.
*/

if(!saved){

try{

saved =
localStorage.getItem(
STUDENT_KEY
);

}catch(error){

console.warn(
"Local storage unavailable."
);

}

}


/*
   No student found.
*/

if(!saved){

return false;

}


try{

const data =
JSON.parse(saved);


if(
!data ||
typeof data !== "object"
){

return false;

}


student = data;


studentId =
data.id ||
data.student_id ||
data.user_id ||
null;


if(studentId){

studentId =
String(studentId);

}


/*
   Restore into sessionStorage.

   This makes navigation inside
   the website more reliable.
*/

try{

sessionStorage.setItem(
STUDENT_KEY,
JSON.stringify(student)
);

}catch(error){

console.warn(
"Could not restore session."
);

}


return true;


}catch(error){

console.error(
"Student JSON error:",
error
);

return false;

}


/* =====================================================
   GET STUDENT ID
===================================================== */

function getStudentId(){

if(studentId){

return String(studentId);

}


/*
   Try loading again.
*/

loadStudent();


if(studentId){

return String(studentId);

}


return null;

}


/* =====================================================
   STUDENT NAME
===================================================== */

function getStudentName(){

if(!student){

loadStudent();

}


if(!student){

return "Student";

}


const first =
student.first_name ||
student.firstName ||
"";


const last =
student.last_name ||
student.lastName ||
"";


const full =
`${first} ${last}`.trim();


if(full){

return full;

}


if(student.name){

return String(
student.name
).trim();

}


return "Student";

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(){

document.getElementById(
"studentBox"
).textContent =
"👤 " + getStudentName();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.className =
type;

box.textContent =
text;

}


function hideMessage(){

const box =
document.getElementById(
"message"
);

box.className =
"hidden";

box.textContent =
"";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   LOAD PROGRESS
===================================================== */

async function loadProgress(){

loadStudent();

displayStudent();


const id =
getStudentId();


/*
   IMPORTANT:

   We do not ask the user to type
   a Student ID.

   The ID comes automatically from
   createlk_student.
*/

if(!id){

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Your login session could not be found. Please return to the Dashboard and log in again.",
"error"
);

return;

}


try{


/* =================================================
   CALL PROGRESS WORKER
================================================= */

const url =
PROGRESS_API +
"/api/progress?student_id=" +
encodeURIComponent(id);


console.log(
"Progress request:",
url
);


const response =
await fetch(
url,
{
method:"GET",

headers:{
"Accept":
"application/json"
}
}
);


/* =================================================
   READ RESPONSE
================================================= */

const raw =
await response.text();


console.log(
"Progress Worker response:",
raw
);


let data;


try{

data =
JSON.parse(raw);

}catch(error){

throw new Error(
"Progress Worker returned invalid JSON."
);

}


/* =================================================
   SERVER ERROR
================================================= */

if(!response.ok){

throw new Error(
data.message ||
data.error ||
`Server error (${response.status})`
);

}


/* =================================================
   SUCCESS CHECK
================================================= */

if(
data.success === false
){

throw new Error(
data.message ||
data.error ||
"Unable to load progress."
);

}


/* =================================================
   HIDE LOADING
================================================= */

document.getElementById(
"loading"
).style.display =
"none";


hideMessage();


/* =================================================
   FIND CORRECT ANSWERS
================================================= */


/*
   Different versions of your Worker
   may use different field names.

   We support all of these.
*/

let correct =
Number(
data.certificate_progress ??
data.correct_answers ??
data.progress ??
data.total_correct ??
data.certificate?.correct_answers ??
0
);


/* =================================================
   TARGET
===================================================== */

let target =
Number(
data.certificate_target ??
data.required_correct_answers ??
data.target ??
data.certificate?.target ??
DEFAULT_TARGET
);


if(!target || target < 1){

target =
DEFAULT_TARGET;

}


/* =================================================
   ELIGIBILITY
===================================================== */

const eligible =
data.eligible === true ||
data.certificate_unlocked === true ||
data.certificate?.unlocked === true ||
correct >= target;


/* =================================================
   CERTIFICATE RECORD
===================================================== */

let certificates =
Array.isArray(
data.certificates
)
?
data.certificates
:
[];


/* =================================================
   DISPLAY
===================================================== */

if(
certificates.length > 0
){

displayCertificates(
certificates,
correct
);

return;

}


/*
   No certificate record returned.

   If the user has reached 1,000,
   show the unlocked state.
*/

if(eligible){

showUnlocked(
correct,
target
);

return;

}


/*
   User has not reached target.
*/

showLocked(
correct,
target
);


}catch(error){

console.error(
"Certificate progress error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showMessage(
error.message ||
"Unable to load certificate progress.",
"error"
);

}

}


/* =====================================================
   SHOW LOCKED
===================================================== */

function showLocked(
correct,
target
){

const percentage =
target > 0
?
Math.min(
100,
Math.round(
(correct / target) * 100
)
)
:
0;


const remaining =
Math.max(
0,
target - correct
);


const name =
getStudentName();


document.getElementById(
"content"
).innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🔒
</div>

<h2>
Certificate Locked
</h2>

<div class="certificate-name">
${escapeHtml(name)}
</div>

<p>

Complete

<strong>
${target.toLocaleString()}
correct answers
</strong>

to earn your
CreateLK Academy
Achievement Certificate.

</p>


<div class="progress-area">

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percentage}%">
</div>

</div>


<div class="progress-text">

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</div>


<p style="margin-top:8px">

Progress: ${percentage}%

</p>


<p style="margin-top:5px">

${remaining.toLocaleString()}
more correct answers needed.

</p>

</div>

</div>

`;

}


/* =====================================================
   SHOW UNLOCKED
===================================================== */

function showUnlocked(
correct,
target
){

const name =
getStudentName();


document.getElementById(
"content"
).innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🎓
</div>

<h2>
Certificate Unlocked
</h2>

<div class="certificate-name">
${escapeHtml(name)}
</div>

<p>

Congratulations!

You have completed

<strong>
${correct.toLocaleString()}
correct English answers
</strong>

and reached the
CreateLK Academy
certificate requirement.

</p>


<div class="progress-area">

<div class="progress-bar">

<div
class="progress-fill"
style="width:100%">
</div>

</div>


<div class="progress-text">

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</div>

</div>


<div class="buttons">

<button
type="button"
class="btn primary"
onclick="printUnlockedCertificate()">

🖨️ Print Certificate

</button>

</div>

</div>

`;

}


/* =====================================================
   DISPLAY CERTIFICATE RECORD
===================================================== */

function displayCertificates(
certificates,
correctAnswers
){

const container =
document.getElementById(
"content"
);


container.innerHTML =
"";


const defaultName =
getStudentName();


certificates.forEach(
function(cert){

const box =
document.createElement(
"div"
);


box.className =
"certificate";


const id =
cert.certificate_id ||
cert.id ||
"";


const title =
cert.title ||
"English Learning Achievement Certificate";


const name =
cert.student_name ||
defaultName;


const issued =
cert.issued_at ||
cert.created_at ||
"";


const answers =
Number(
cert.correct_answers ??
correctAnswers ??
0
);


box.innerHTML = `

<div class="certificate-icon">
🏆
</div>


<h2>
${escapeHtml(title)}
</h2>


<div class="certificate-name">

${escapeHtml(name)}

</div>


<p>

Congratulations!

You have successfully completed

<strong>
${answers.toLocaleString()}
correct English answers
</strong>

through CreateLK Academy.

</p>


<div class="certificate-id">

Certificate ID:
${escapeHtml(id)}

</div>


<div class="certificate-id">

Issued:
${escapeHtml(
formatDate(issued)
)}

</div>


<div class="buttons">

<button
type="button"
class="btn primary"
onclick="printCertificate(this)">

🖨️ Print Certificate

</button>

</div>

`;


container.appendChild(
box
);

});

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
value
){

if(!value){

return "—";

}


const date =
new Date(value);


if(
Number.isNaN(
date.getTime()
)
){

return String(value);

}


return date.toLocaleDateString(
undefined,
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}


/* =====================================================
   PRINT EXISTING CERTIFICATE
===================================================== */

function printCertificate(
button
){

const certificate =
button.closest(
".certificate"
);


if(!certificate){

return;

}


const name =
certificate.querySelector(
".certificate-name"
)?.textContent.trim()
||
getStudentName();


printCertificateDocument(
name
);

}


/* =====================================================
   PRINT UNLOCKED CERTIFICATE
===================================================== */

function printUnlockedCertificate(){

printCertificateDocument(
getStudentName()
);

}


/* =====================================================
   PRINT DOCUMENT
===================================================== */

function printCertificateDocument(
name
){

const printWindow =
window.open(
"",
"_blank",
"width=900,height=700"
);


if(!printWindow){

alert(
"Please allow pop-ups to print your certificate."
);

return;

}


printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
CreateLK Academy Certificate
</title>

<style>

*{
box-sizing:border-box;
}

body{

font-family:
Arial,
Helvetica,
sans-serif;

padding:40px;

background:#fff;

text-align:center;

}

.certificate{

max-width:850px;

margin:auto;

padding:70px 40px;

border:10px solid #d8b45a;

background:#fffdf5;

}

.logo{

font-size:34px;

font-weight:800;

color:#155eef;

}

.title{

font-size:30px;

font-weight:800;

margin:25px 0;

}

.name{

font-size:34px;

font-weight:800;

color:#155eef;

margin:30px 0;

}

.text{

font-size:17px;

line-height:1.8;

}

.footer{

margin-top:35px;

font-size:14px;

color:#667085;

}

@media print{

body{

padding:0;

}

.certificate{

max-width:none;

min-height:90vh;

}

}

</style>

</head>

<body>


<div class="certificate">


<div class="logo">

📚 CreateLK Academy

</div>


<div class="title">

🏆 English Learning
Achievement Certificate

</div>


<div class="name">

${escapeHtml(name)}

</div>


<div class="text">

This certificate recognizes the
successful completion of

<strong>
1,000 correct English answers
</strong>

through the
CreateLK Academy
learning platform.

</div>


<div class="footer">

Issued by CreateLK Academy

</div>


</div>


</body>

</html>

`);


printWindow.document.close();

printWindow.focus();


setTimeout(
function(){

printWindow.print();

},
500
);

}


/* =====================================================
   START
===================================================== */

loadStudent();

displayStudent();

loadProgress();

</script>

</body>

</html>
