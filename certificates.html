<script>

const MEMBERSHIP_API=
"https://createlk-membership-api.createlk.workers.dev";

const CERTIFICATE_API=
"https://createlk-certificate-api.createlk.workers.dev";

const token=
sessionStorage.getItem("createlk_token");

const student=
JSON.parse(
sessionStorage.getItem("createlk_student")||"null"
);

if(!token||!student){
location.href="login.html";
}


/* =========================
   IMPORTANT:
   GET REAL STUDENT NAME
   NEVER USE EMAIL
========================= */

function getStudentName(){

const first=
String(student.first_name||"").trim();

const last=
String(student.last_name||"").trim();

const full=
(first+" "+last).trim();

return full||"CreateLK Academy Student";

}


/* =========================
   CHECK PREMIUM
========================= */

async function checkPremium(){

try{

const r=await fetch(
MEMBERSHIP_API+
"/api/membership?student_id="+
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer "+token
}
}
);

const d=await r.json();

if(!r.ok||!d.success||!d.active){

showLocked(
"🔒 Active Premium Membership Required"
);

return;

}

loadCertificate();

}catch(e){

showLocked(
"Unable to connect to membership server."
);

}

}


/* =========================
   LOAD CERTIFICATE
========================= */

async function loadCertificate(){

try{

const r=await fetch(
CERTIFICATE_API+
"/api/certificate/progress?student_id="+
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer "+token
}
}
);

const d=await r.json();

if(!r.ok||!d.success){

throw Error();

}

const certificates=
d.certificates||[];

if(!certificates.length){

showLocked(
"🎓 No certificate available yet. Pass the final assessment with at least 70%."
);

return;

}

const c=certificates[0];


/* REAL NAME FROM LOGIN ACCOUNT */

const name=getStudentName();


/* COURSE */

const course=
c.course_name||
"Premium English Course";


/* SCORE */

let score=
parseFloat(
String(c.score??0).replace("%","")
)||0;

if(score<=1){
score=Math.round(score*100);
}

if(score<=10&&c.total_questions==10){
score=Math.round(score/10*100);
}

score=Math.min(score,100);


/* DISPLAY */

document.getElementById(
"studentName"
).textContent=name;

document.getElementById(
"courseName"
).textContent=course;

document.getElementById(
"score"
).textContent=score+"%";


document.getElementById(
"status"
).className="status active";

document.getElementById(
"status"
).textContent=
"🎓 Certificate Ready";

document.getElementById(
"info"
).classList.remove("hidden");


/* DOWNLOAD */

document.getElementById(
"downloadBtn"
).onclick=function(){

downloadCertificate({

name:name,

course:course,

score:score,

date:
c.issue_date||
new Date().toLocaleDateString("en-GB"),

id:
c.certificate_id||
"CREATELK-CERT"

});

};


}catch(e){

console.error(e);

showLocked(
"❌ Unable to load certificate."
);

}

}

========================= */

const win=
window.open("","_blank");

win.document.write(`

}


/* =========================
   LOCKED
========================= */

function showLocked(text){

const status=
document.getElementById("status");

status.className="status locked";

status.textContent=text;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
