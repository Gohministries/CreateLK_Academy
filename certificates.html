<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Certificates | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:1000px;
margin:auto;
padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef;
}

.back{
text-decoration:none;
font-size:13px;
font-weight:700;
color:#475467;
}

.container{
max-width:1000px;
margin:28px auto;
padding:0 16px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:20px;
padding:28px;
box-shadow:0 10px 30px rgba(16,24,40,.06);
}

.hero{
text-align:center;
}

.icon{
width:64px;
height:64px;
margin:auto;
border-radius:16px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:31px;
}

h1{
font-size:26px;
margin-top:13px;
}

.subtitle{
margin-top:7px;
font-size:14px;
color:#667085;
}

.student{
margin-top:20px;
padding:13px;
border:1px solid #e5e7eb;
background:#f8fafc;
border-radius:10px;
text-align:center;
font-size:13px;
font-weight:700;
}

.loading{
padding:28px;
text-align:center;
font-size:13px;
color:#667085;
}

.message{
display:none;
margin-top:16px;
padding:12px 14px;
border-radius:10px;
font-size:13px;
text-align:center;
line-height:1.5;
}

.message.show{
display:block;
}

.success{
background:#ecfdf3;
color:#166534;
border:1px solid #bbf7d0;
}

.error{
background:#fff1f2;
color:#be123c;
border:1px solid #fecdd3;
}

.info{
background:#eff6ff;
color:#1d4ed8;
border:1px solid #bfdbfe;
}


/* LOCKED */

.locked-card{
margin-top:22px;
padding:28px;
text-align:center;
border:1px solid #f3dfb0;
border-radius:16px;
background:#fffdf5;
}

.lock-icon{
font-size:42px;
}

.locked-card h2{
margin-top:8px;
font-size:20px;
}

.locked-card p{
margin-top:8px;
font-size:13px;
color:#667085;
}

.progress{
height:12px;
margin:20px auto 0;
max-width:500px;
background:#e5e7eb;
border-radius:30px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#155eef;
border-radius:30px;
}


/* CERTIFICATE */

.certificate{
position:relative;
width:100%;
max-width:850px;
margin:28px auto 0;
aspect-ratio:1.414/1;

background:#fffdf5;

border:5px solid #c8a951;

box-shadow:
0 0 0 2px #8d6f24,
inset 0 0 0 1px #c8a951;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
}

.certificate::before{
content:"";
position:absolute;
inset:12px;
border:1px solid #c8a951;
pointer-events:none;
}

.certificate::after{
content:"CREATE LK ACADEMY • CREATELK.COM";

position:absolute;
left:-10%;
top:45%;
width:120%;

font-size:30px;
font-weight:900;
letter-spacing:4px;

color:#155eef;
opacity:.035;

transform:rotate(-25deg);

white-space:nowrap;
pointer-events:none;
}

.cert-content{
position:relative;
z-index:2;
width:78%;
text-align:center;
}


/* BRAND */

.brand{
font-size:20px;
font-weight:900;
letter-spacing:3px;
color:#155eef;
}

.website{
margin-top:4px;
font-size:10px;
font-weight:700;
letter-spacing:1.5px;
color:#667085;
}

.gold-line{
width:105px;
height:2px;
background:#c8a951;
margin:10px auto;
}

.heading{
font-size:12px;
font-weight:800;
letter-spacing:3px;
color:#667085;
}

.title{
font-family:Georgia,"Times New Roman",serif;
font-size:34px;
color:#172033;
margin:8px 0 10px;
}

.presented{
font-size:11px;
color:#667085;
}

.student-name{
display:inline-block;

font-family:Georgia,"Times New Roman",serif;

font-size:30px;
font-weight:700;

color:#155eef;

margin:9px auto 8px;

padding:0 20px 6px;

border-bottom:2px solid #c8a951;
}

.description{
max-width:650px;
margin:auto;

font-size:11px;
line-height:1.7;

color:#344054;
}

.description strong{
color:#172033;
}


/* SEAL */

.seal{
width:50px;
height:50px;

margin:9px auto;

border:3px solid #c8a951;

border-radius:50%;

background:#fff;

display:flex;
align-items:center;
justify-content:center;

font-size:23px;
}


/* CERTIFICATE ID */

.certificate-info{
display:inline-block;

margin-top:1px;

padding:5px 12px;

background:#f8fafc;

border:1px solid #d0d5dd;

border-radius:6px;

font-size:7px;

color:#475467;
}

.certificate-info strong{
font-family:monospace;
color:#172033;
letter-spacing:.5px;
}


/* FOOTER */

.cert-footer{
display:flex;
justify-content:space-between;
align-items:flex-end;

margin-top:8px;

font-size:7px;
color:#667085;
}

.signature{
width:125px;
border-top:1px solid #667085;
padding-top:3px;
}

.digital-signature{
font-family:
"Brush Script MT",
"Segoe Script",
cursive;

font-size:16px;
color:#172033;
}

.center-info{
font-weight:700;
color:#155eef;
line-height:1.5;
}

.authorized{
margin-top:1px;
}


/* BUTTONS */

.buttons{
display:flex;
gap:10px;
max-width:850px;
margin:18px auto 0;
}

button,
.btn{
flex:1;

border:0;
border-radius:10px;

padding:13px 15px;

font-family:inherit;
font-size:13px;
font-weight:700;

text-align:center;
text-decoration:none;

cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.primary:hover{
background:#1247b8;
}

.secondary{
background:#eef2f7;
color:#344054;
}


/* FOOTER */

footer{
text-align:center;
padding:25px;

font-size:11px;
color:#98a2b3;
}


/* MOBILE */

@media(max-width:600px){

.container{
margin:18px auto;
}

.card{
padding:20px 13px;
}

h1{
font-size:22px;
}

.subtitle{
font-size:12px;
}

.certificate{
border-width:4px;
}

.certificate::before{
inset:8px;
}

.cert-content{
width:82%;
}

.brand{
font-size:10px;
letter-spacing:1.5px;
}

.website{
font-size:5px;
letter-spacing:1px;
}

.gold-line{
width:55px;
height:1px;
margin:5px auto;
}

.heading{
font-size:6px;
letter-spacing:1px;
}

.title{
font-size:20px;
margin:5px 0 6px;
}

.presented{
font-size:6px;
}

.student-name{
font-size:17px;
margin:5px auto;
padding:0 10px 3px;
}

.description{
font-size:6px;
line-height:1.4;
}

.seal{
width:30px;
height:30px;
font-size:14px;
border-width:2px;
margin:5px auto;
}

.certificate-info{
font-size:4px;
padding:3px 5px;
}

.cert-footer{
font-size:4px;
margin-top:4px;
}

.signature{
width:55px;
}

.digital-signature{
font-size:9px;
}

.buttons{
flex-direction:column;
}


/* Keep certificate readable on very small screens */

.certificate::after{
font-size:16px;
}

}


/* PRINT */

@media print{

body{
background:#fff;
}

header,
.hero,
.student,
.loading,
.message,
.buttons,
footer{
display:none !important;
}

.container,
.card{
margin:0;
padding:0;
max-width:none;
border:0;
box-shadow:none;
}

.certificate{
max-width:none;
margin:0;
width:100%;
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<p class="subtitle">

Earn your CreateLK Academy certificate
after completing 1,000 correct English answers.

</p>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div id="certificateArea"></div>


<div
id="message"
class="message">

</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const TARGET =
1000;

let student = null;

let studentId = null;

let certificate = null;


/* =====================================================
   HELPER
===================================================== */

function $(id){

return document.getElementById(id);

}


/* =====================================================
   LOAD STUDENT
===================================================== */

function loadStudent(){

const saved =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!saved){

return false;

}

try{

student =
JSON.parse(saved);

studentId =
student.id ||
student.student_id ||
student.user_id;

if(studentId){

studentId =
String(studentId);

}

return !!studentId;

}catch(error){

console.error(error);

return false;

}

}


/* =====================================================
   STUDENT NAME
===================================================== */

function studentName(){

if(student && student.name){

return String(
student.name
);

}

const first =
student?.first_name || "";

const last =
student?.last_name || "";

return (

(first + " " + last)
.replace(/\s+/g," ")
.trim()

) || "Student";

}


/* =====================================================
   MESSAGE
===================================================== */

function message(
text,
type
){

const box =
$("message");

box.textContent =
text;

box.className =
"message show " + type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
String(text ?? "");

return div.innerHTML;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

if(!value){

return new Date()
.toLocaleDateString();

}

const d =
new Date(value);

if(isNaN(d.getTime())){

return String(value);

}

return d.toLocaleDateString();

}


/* =====================================================
   CERTIFICATE ID
===================================================== */

function getCertificateId(){

const storageKey =
"createlk_certificate_" +
studentId;

let existing =
localStorage.getItem(storageKey);

if(existing){

return existing;

}

const year =
new Date().getFullYear();

const random =
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

const id =
"CLA-" +
year +
"-" +
random;

localStorage.setItem(
storageKey,
id
);

return id;

}


/* =====================================================
   FETCH PROGRESS
===================================================== */

async function loadProgress(){

if(!studentId){

$("loading").style.display =
"none";

message(
"Please log in again to view your certificate.",
"error"
);

return;

}

try{

const response =
await fetch(

PROGRESS_API +
"/api/progress?student_id=" +
encodeURIComponent(studentId)

);


if(!response.ok){

throw new Error(
"Unable to load certificate progress."
);

}


const data =
await response.json();


const certificateData =
data.certificate || {};


const correct =
Number(

data.certificate_progress ??
certificateData.correct_answers ??
data.correct_answers ??
0

);


const target =
Number(

data.certificate_target ??
certificateData.target ??
TARGET

);


$("loading").style.display =
"none";


if(correct < target){

showLocked(
correct,
target
);

return;

}


/*
Student has completed the
required number of answers.
*/

certificate = {

student_name:
studentName(),

correct_answers:
correct,

certificate_id:
getCertificateId(),

issued_at:
getIssuedDate()

};


showCertificate(
certificate,
target
);


}catch(error){

console.error(
"Progress error:",
error
);

$("loading").style.display =
"none";

message(

error.message ||
"Unable to load certificate progress.",

"error"

);

}

}


/* =====================================================
   ISSUED DATE
===================================================== */

function getIssuedDate(){

const storageKey =
"createlk_certificate_date_" +
studentId;

let existing =
localStorage.getItem(storageKey);

if(existing){

return existing;

}

const date =
new Date()
.toISOString();

localStorage.setItem(
storageKey,
date
);

return date;

}


/* =====================================================
   LOCKED
===================================================== */

function showLocked(
correct,
target
){

const percent =
Math.min(

100,

Math.round(
correct / target * 100
)

);


$("certificateArea")
.innerHTML = `

<div class="locked-card">

<div class="lock-icon">
🔒
</div>

<h2>
Certificate Locked
</h2>

<p>

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</p>

<div class="progress">

<div
class="progress-fill"
style="width:${percent}%">

</div>

</div>

<p>

${Math.max(
0,
target - correct
).toLocaleString()}

more correct answers needed.

</p>

</div>

`;

}


/* =====================================================
   SHOW CERTIFICATE
===================================================== */

function showCertificate(
cert,
target
){

const name =
cert.student_name ||
studentName();

const id =
cert.certificate_id;

const issued =
formatDate(
cert.issued_at
);

const answers =
Number(
cert.correct_answers ||
target
);


$("certificateArea")
.innerHTML = `

<div
class="certificate"
id="certificate">

<div class="cert-content">


<div class="brand">
CREATE LK ACADEMY
</div>


<div class="website">
createlk.com
</div>


<div class="gold-line"></div>


<div class="heading">
CERTIFICATE OF ACHIEVEMENT
</div>


<div class="title">
English Learning
</div>


<div class="presented">

This certificate is proudly presented to

</div>


<div class="student-name">

${escapeHTML(name)}

</div>


<div class="description">

For successfully completing

<strong>

${answers.toLocaleString()}
correct English answers

</strong>

through the CreateLK Academy
English learning platform.

</div>


<div class="seal">
🏆
</div>


<div class="certificate-info">

Certificate ID:

<strong>
${escapeHTML(id)}
</strong>

</div>


<div class="cert-footer">


<div class="signature">

<div class="digital-signature">
CreateLK Academy
</div>

<div class="authorized">
Authorized
</div>

</div>


<div class="center-info">

createlk.com

<br>

Issued:
${escapeHTML(issued)}

</div>


<div class="signature">

<div class="digital-signature">
English Learning
</div>

Achievement

</div>


</div>


</div>

</div>


<div class="buttons">


<button
class="primary"
onclick="downloadCertificate()">

⬇️ Download Certificate

</button>


<button
class="secondary"
onclick="window.print()">

🖨️ Print Certificate

</button>


<a
href="dashboard.html"
class="btn secondary">

← Dashboard

</a>


</div>

`;

message(
"🎉 Congratulations! Your certificate is unlocked.",
"success"
);

}


/* =====================================================
   DOWNLOAD CERTIFICATE
===================================================== */

function downloadCertificate(){

if(!certificate){

message(
"Certificate is not ready.",
"error"
);

return;

}


const name =
certificate.student_name ||
studentName();

const id =
certificate.certificate_id;

const issued =
formatDate(
certificate.issued_at
);

const answers =
Number(
certificate.correct_answers ||
TARGET
);


const html = `

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>
CreateLK Academy Certificate
</title>

<style>

@page{
size:A4 landscape;
margin:0;
}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
}

body{

font-family:
Arial,
Helvetica,
sans-serif;

background:#fff;

padding:25px;
}

.certificate{

width:100%;

max-width:1100px;

margin:auto;

aspect-ratio:1.414/1;

background:#fffdf5;

border:6px solid #c8a951;

box-shadow:
0 0 0 2px #8d6f24,
inset 0 0 0 1px #c8a951;

display:flex;

align-items:center;
justify-content:center;

position:relative;

overflow:hidden;
}

.certificate:before{

content:"";

position:absolute;

inset:15px;

border:1.5px solid #c8a951;
}

.certificate:after{

content:
"CREATE LK ACADEMY • CREATELK.COM";

position:absolute;

left:-10%;

top:45%;

width:120%;

font-size:34px;

font-weight:900;

letter-spacing:4px;

color:#155eef;

opacity:.035;

transform:rotate(-25deg);

white-space:nowrap;
}

.content{

position:relative;

z-index:2;

width:78%;

text-align:center;
}

.brand{

font-size:25px;

font-weight:900;

letter-spacing:4px;

color:#155eef;
}

.website{

font-size:12px;

font-weight:bold;

letter-spacing:2px;

color:#667085;

margin-top:4px;
}

.line{

width:130px;

height:3px;

background:#c8a951;

margin:13px auto;
}

.heading{

font-size:16px;

letter-spacing:4px;

color:#667085;

font-weight:bold;
}

.title{

font-family:
Georgia,
"Times New Roman",
serif;

font-size:45px;

margin:12px 0;
}

.presented{

font-size:14px;

color:#667085;
}

.name{

font-family:
Georgia,
"Times New Roman",
serif;

font-size:40px;

font-weight:bold;

color:#155eef;

display:inline-block;

margin:12px;

padding:0 25px 8px;

border-bottom:2px solid #c8a951;
}

.text{

font-size:16px;

line-height:1.8;

color:#344054;
}

.seal{

width:70px;

height:70px;

border:3px solid #c8a951;

border-radius:50%;

margin:14px auto;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;
}

.certificate-info{

display:inline-block;

padding:6px 13px;

border:1px solid #d0d5dd;

background:#f8fafc;

border-radius:6px;

font-size:9px;

color:#475467;
}

.certificate-info strong{

font-family:monospace;

color:#172033;

letter-spacing:.5px;
}

.footer{

display:flex;

justify-content:space-between;

align-items:flex-end;

font-size:10px;

color:#667085;

margin-top:10px;
}

.signature{

border-top:1px solid #667085;

padding-top:4px;

width:160px;
}

.digital-signature{

font-family:
"Brush Script MT",
"Segoe Script",
cursive;

font-size:20px;

color:#172033;
}

.center-info{

font-weight:bold;

color:#155eef;

line-height:1.5;
}

</style>

</head>

<body>


<div class="certificate">


<div class="content">


<div class="brand">
CREATE LK ACADEMY
</div>


<div class="website">
createlk.com
</div>


<div class="line"></div>


<div class="heading">
CERTIFICATE OF ACHIEVEMENT
</div>


<div class="title">
English Learning
</div>


<div class="presented">

This certificate is proudly presented to

</div>


<div class="name">

${escapeHTML(name)}

</div>


<div class="text">

For successfully completing

<strong>

${answers.toLocaleString()}
correct English answers

</strong>

through the CreateLK Academy
English learning platform.

</div>


<div class="seal">
🏆
</div>


<div class="certificate-info">

Certificate ID:

<strong>
${escapeHTML(id)}
</strong>

</div>


<div class="footer">


<div class="signature">

<div class="digital-signature">
CreateLK Academy
</div>

Authorized

</div>


<div class="center-info">

createlk.com

<br>

Issued:
${escapeHTML(issued)}

</div>


<div class="signature">

<div class="digital-signature">
English Learning
</div>

Achievement

</div>


</div>


</div>

</div>


</body>

</html>
`;


const blob =
new Blob(
[html],
{
type:"text/html"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href =
url;


link.download =

"CreateLK-Academy-Certificate-" +

name.replace(
/[^a-z0-9]/gi,
"-"
) +

"-" +

id +

".html";


document.body.appendChild(link);

link.click();

link.remove();


setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);


message(
"🎓 Certificate downloaded successfully.",
"success"
);

}


/* =====================================================
   START
===================================================== */

if(loadStudent()){

$("studentBox").textContent =
"👤 " + studentName();

loadProgress();

}else{

$("studentBox").textContent =
"👤 Student session not found";

$("loading").style.display =
"none";

message(
"Please log in to CreateLK Academy.",
"info"
);

}

</script>

</body>
</html>
