<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Certificates | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:14px 16px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:800;
font-size:18px;
color:#155eef;
}

.back{
text-decoration:none;
color:#475467;
font-size:13px;
font-weight:bold;
}

.container{
max-width:900px;
margin:25px auto;
padding:0 15px 40px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px #0000000d;
}

.hero{
text-align:center;
}

.icon{
width:60px;
height:60px;
margin:auto;
border-radius:15px;
background:#f5f3ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:25px;
margin:12px 0 6px;
}

.subtitle{
color:#667085;
font-size:14px;
}

.student{
margin-top:18px;
padding:12px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
font-weight:bold;
}

.loading{
padding:25px;
text-align:center;
color:#667085;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
text-align:center;
font-size:13px;
}

.message.show{
display:block;
}

.error{
background:#fff1f2;
color:#be123c;
}

.success{
background:#ecfdf3;
color:#166534;
}

.info{
background:#eff6ff;
color:#1d4ed8;
}


/* LOCKED */

.locked-card{
margin-top:20px;
padding:25px;
text-align:center;
border:1px solid #f3dfb0;
border-radius:14px;
background:#fffdf5;
}

.progress{
height:12px;
margin-top:18px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#155eef;
}


/* CERTIFICATE */

.certificate{
position:relative;
margin:25px auto 0;
max-width:820px;
aspect-ratio:1.414/1;
background:#fffdf5;

border:5px solid #c8a951;

box-shadow:
0 0 0 2px #8d6f24,
inset 0 0 0 1px #c8a951;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
}

.certificate:before{
content:"";
position:absolute;
inset:12px;
border:1px solid #c8a951;
pointer-events:none;
}

.certificate:after{
content:"CREATE LK ACADEMY • CREATELK.COM";

position:absolute;
font-size:28px;
font-weight:900;
letter-spacing:3px;
color:#155eef;
opacity:.035;
transform:rotate(-28deg);
white-space:nowrap;
pointer-events:none;
}

.cert-content{
position:relative;
z-index:2;
width:78%;
text-align:center;
}


/* BRAND */

.brand{
font-size:17px;
font-weight:900;
letter-spacing:2px;
color:#155eef;
}

.website{
font-size:9px;
font-weight:bold;
letter-spacing:1px;
color:#667085;
margin-top:3px;
}

.line{
width:90px;
height:2px;
background:#c8a951;
margin:9px auto;
}

.cert-heading{
font-size:12px;
letter-spacing:3px;
color:#667085;
font-weight:bold;
}

.cert-title{
font-family:Georgia,serif;
font-size:32px;
margin:7px 0;
color:#172033;
}

.presented{
font-size:11px;
color:#667085;
}

.student-name{
font-family:Georgia,serif;
font-size:29px;
font-weight:bold;
color:#155eef;
margin:9px auto;
padding:0 15px 6px;
border-bottom:2px solid #c8a951;
display:inline-block;
}

.description{
font-size:11px;
line-height:1.7;
color:#344054;
}


/* SEAL */

.seal{
width:48px;
height:48px;
margin:9px auto;
border:3px solid #c8a951;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
background:#fff;
}


/* CERTIFICATE ID */

.certificate-info{
display:inline-block;
padding:5px 10px;
border:1px solid #d0d5dd;
border-radius:6px;
background:#f8fafc;
font-size:7px;
color:#475467;
}

.certificate-info strong{
font-family:monospace;
color:#172033;
}


/* SIGNATURES */

.cert-footer{
display:flex;
justify-content:space-between;
align-items:flex-end;
font-size:7px;
color:#667085;
margin-top:7px;
}

.signature{
width:125px;
text-align:center;
font-size:7px;
color:#667085;
}

.digital-signature{
font-family:
"Brush Script MT",
"Segoe Script",
cursive;

font-size:16px;
font-weight:600;
font-style:italic;

color:#172033;

line-height:1.1;

margin-bottom:4px;

padding-bottom:3px;

border-bottom:1px solid #667085;
}

.website-footer{
font-weight:bold;
color:#155eef;
text-align:center;
}


/* BUTTONS */

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

button,
a.btn{
flex:1;
padding:12px;
border:0;
border-radius:9px;
font-size:13px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}


/* FOOTER */

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}


/* MOBILE */

@media(max-width:600px){

.card{
padding:20px 14px;
}

.certificate{
border-width:4px;
}

.certificate:before{
inset:8px;
}

.brand{
font-size:9px;
letter-spacing:1px;
}

.website{
font-size:5px;
}

.line{
width:55px;
height:1px;
margin:5px auto;
}

.cert-heading{
font-size:6px;
letter-spacing:1px;
}

.cert-title{
font-size:19px;
}

.presented{
font-size:6px;
}

.student-name{
font-size:17px;
margin:5px auto;
padding-bottom:3px;
}

.description{
font-size:6px;
line-height:1.4;
}

.seal{
width:30px;
height:30px;
font-size:14px;
margin:5px auto;
border-width:2px;
}

.certificate-info{
font-size:4px;
padding:3px 5px;
}

.digital-signature{
font-size:10px;
margin-bottom:2px;
padding-bottom:2px;
}

.cert-footer{
font-size:4px;
}

.signature{
width:58px;
font-size:4px;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<p class="subtitle">

Earn your certificate by completing
1,000 correct English answers.

</p>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div id="certificateArea"></div>


<div
id="message"
class="message">

</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const TARGET =
1000;

let student = null;
let studentId = null;
let certificate = null;


/* =====================================================
   HELPER
===================================================== */

function $(id){
return document.getElementById(id);
}


/* =====================================================
   LOAD STUDENT
===================================================== */

function loadStudent(){

const saved =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!saved){
return false;
}

try{

student =
JSON.parse(saved);

studentId =
student.id ||
student.student_id ||
student.user_id;

if(studentId){
studentId =
String(studentId);
}

return !!studentId;

}catch(error){

console.error(error);

return false;

}

}


/* =====================================================
   STUDENT NAME
===================================================== */

function studentName(){

if(student?.name){
return String(student.name);
}

return (

`${student?.first_name || ""}
 ${student?.last_name || ""}`

.replace(/\s+/g," ")
.trim()

|| "Student"

);

}


/* =====================================================
   MESSAGE
===================================================== */

function message(text,type){

const box =
$("message");

box.textContent =
text;

box.className =
"message show " + type;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
String(text ?? "");

return div.innerHTML;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

if(!value){
return new Date().toLocaleDateString();
}

const d =
new Date(value);

if(isNaN(d.getTime())){
return String(value);
}

return d.toLocaleDateString();

}


/* =====================================================
   CERTIFICATE ID
===================================================== */

function getCertificateId(){

const storageKey =
"createlk_certificate_" +
studentId;

let existing =
localStorage.getItem(storageKey);

if(existing){
return existing;
}

const year =
new Date().getFullYear();

const random =
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

const id =
"CLA-" +
year +
"-" +
random;

localStorage.setItem(
storageKey,
id
);

return id;

}


/* =====================================================
   ISSUED DATE
===================================================== */

function getIssuedDate(){

const storageKey =
"createlk_certificate_date_" +
studentId;

let existing =
localStorage.getItem(storageKey);

if(existing){
return existing;
}

const date =
new Date().toISOString();

localStorage.setItem(
storageKey,
date
);

return date;

}


/* =====================================================
   LOAD PROGRESS
===================================================== */

async function loadProgress(){

if(!studentId){

$("loading").style.display =
"none";

message(
"Please log in again to view your certificate.",
"error"
);

return;

}

try{

const response =
await fetch(

PROGRESS_API +
"/api/progress?student_id=" +
encodeURIComponent(studentId)

);

if(!response.ok){

throw new Error(
"Unable to load certificate progress."
);

}

const data =
await response.json();

if(data.success === false){

throw new Error(
data.message ||
data.error ||
"Unable to load certificate progress."
);

}

const certificateData =
data.certificate || {};

const correct =
Number(

data.certificate_progress ??
certificateData.correct_answers ??
data.correct_answers ??
0

);

const target =
Number(

data.certificate_target ??
certificateData.target ??
TARGET

);

$("loading").style.display =
"none";


if(correct < target){

showLocked(
correct,
target
);

return;

}


/* Certificate unlocked */

certificate = {

student_name:
studentName(),

correct_answers:
correct,

certificate_id:
getCertificateId(),

issued_at:
getIssuedDate()

};

showCertificate(
certificate,
target
);


}catch(error){

console.error(error);

$("loading").style.display =
"none";

message(

error.message ||
"Unable to load certificate progress.",

"error"

);

}

}


/* =====================================================
   LOCKED
===================================================== */

function showLocked(correct,target){

const percent =
Math.min(

100,

Math.round(
correct / target * 100
)

);

$("certificateArea").innerHTML = `

<div class="locked-card">

<div style="font-size:40px">
🔒
</div>

<h2 style="margin:8px 0">
Certificate Locked
</h2>

<p style="font-size:13px;color:#667085">

${correct.toLocaleString()}
/
${target.toLocaleString()}
correct answers

</p>

<div class="progress">

<div
class="progress-fill"
style="width:${percent}%">

</div>

</div>

<p style="
margin-top:10px;
font-size:12px;
color:#667085;
">

${Math.max(
0,
target - correct
).toLocaleString()}

more correct answers needed.

</p>

</div>

`;

}


/* =====================================================
   SHOW CERTIFICATE
===================================================== */

function showCertificate(
cert,
target
){

const name =
cert.student_name ||
studentName();

const id =
cert.certificate_id;

const issued =
formatDate(
cert.issued_at
);

const answers =
Number(
cert.correct_answers ||
target
);

$("certificateArea").innerHTML = `

<div
class="certificate"
id="certificate">

<div class="cert-content">


<div class="brand">
CREATE LK ACADEMY
</div>


<div class="website">
createlk.com
</div>


<div class="line"></div>


<div class="cert-heading">
CERTIFICATE OF ACHIEVEMENT
</div>


<div class="cert-title">
English Learning
</div>


<div class="presented">

This certificate is proudly presented to

</div>


<div class="student-name">

${escapeHTML(name)}

</div>


<div class="description">

For successfully completing

<strong>

${answers.toLocaleString()}
correct English answers

</strong>

through the CreateLK Academy
English learning platform.

</div>


<div class="seal">
🏆
</div>


<div class="certificate-info">

Certificate ID:

<strong>
${escapeHTML(id)}
</strong>

</div>


<div class="cert-footer">


<div class="signature">

<div class="digital-signature">
T. Saththiyanadan
</div>

Founder<br>
CreateLK Academy

</div>


<div class="website-footer">

createlk.com

<br>

Issued:
${escapeHTML(issued)}

</div>


<div class="signature">

<div class="digital-signature">
CreateLK Academy
</div>

English Learning<br>
Achievement

</div>


</div>


</div>

</div>


<div class="buttons">


<button
class="primary"
onclick="downloadCertificate()">

⬇️ Download Certificate

</button>


<button
class="secondary"
onclick="window.print()">

🖨️ Print Certificate

</button>


<a
href="dashboard.html"
class="btn secondary">

← Dashboard

</a>


</div>

`;

message(
"🎉 Congratulations! Your certificate is unlocked.",
"success"
);

}


/* =====================================================
   DOWNLOAD CERTIFICATE
===================================================== */

function downloadCertificate(){

if(!certificate){

message(
"Certificate is not ready.",
"error"
);

return;

}

const name =
certificate.student_name ||
studentName();

const id =
certificate.certificate_id;

const issued =
formatDate(
certificate.issued_at
);

const answers =
Number(
certificate.correct_answers ||
TARGET
);

const html = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
CreateLK Academy Certificate
</title>

<style>

@page{
size:A4 landscape;
margin:0;
}

box-sizing:border-box;
}

body{

overflow:hidden;
}

.certificate:before{

content:"";

position:absolute;

inset:15px;

}

.certificate:after{

content:
"CREATE LK ACADEMY • CREATELK.COM";

position:absolute;

font-size:34px;

letter-spacing:4px;

color:#155eef;

opacity:.035;

transform:rotate(-28deg);

white-space:nowrap;

}

.content{

position:relative;
z-index:2;

width:78%;

text-align:center;
}

.brand{

font-size:25px;

font-weight:900;

letter-spacing:4px;

color:#155eef;
}

.website{

font-size:12px;

font-weight:bold;

letter-spacing:2px;

color:#667085;

margin-top:3px;
}

.line{

width:130px;

height:3px;

background:#c8a951;

margin:13px auto;
}

.heading{

font-size:16px;

letter-spacing:4px;

color:#667085;

font-weight:bold;
}

.title{

font-family:Georgia,serif;

font-size:45px;

margin:12px 0;
}

.presented{

font-size:14px;

color:#667085;
}

.name{

font-family:Georgia,serif;

font-size:40px;

font-weight:bold;

color:#155eef;

display:inline-block;

margin:12px;

padding:0 25px 8px;

border-bottom:2px solid #c8a951;
}

.text{

font-size:16px;

line-height:1.8;

color:#344054;
}

.seal{

width:70px;

height:70px;

border:3px solid #c8a951;

border-radius:50%;

margin:14px auto;

display:flex;

align-items:center;

font-size:30px;
}

.certificate-info{

display:inline-block;

padding:6px 13px;

border:1px solid #d0d5dd;

background:#f8fafc;

border-radius:6px;

font-size:9px;

color:#475467;
}

.certificate-info strong{

font-family:monospace;

color:#172033;
}


/* FIXED SIGNATURE */

.footer{

display:flex;

justify-content:space-between;

align-items:flex-end;

font-size:10px;

color:#667085;

margin-top:10px;
}

.signature{

width:160px;

text-align:center;

font-size:10px;

color:#667085;
}

.digital-signature{

font-family:
"Brush Script MT",
"Segoe Script",
cursive;

font-size:20px;

font-weight:600;

font-style:italic;

color:#172033;

line-height:1.1;

margin-bottom:5px;

padding-bottom:4px;

border-bottom:1px solid #667085;
}

.center{

font-weight:bold;

color:#155eef;

line-height:1.5;

text-align:center;
}

</style>

</head>

<body>


<div class="certificate">


<div class="content">


<div class="brand">
CREATE LK ACADEMY
</div>


<div class="website">
createlk.com
</div>


<div class="line"></div>


<div class="heading">
CERTIFICATE OF ACHIEVEMENT
</div>


<div class="title">
English Learning
</div>


<div class="presented">

This certificate is proudly presented to

</div>


<div class="name">

${escapeHTML(name)}

</div>


<div class="text">

For successfully completing

<strong>

${answers.toLocaleString()}
correct English answers

</strong>

through the CreateLK Academy
English learning platform.

</div>


<div class="seal">
🏆
</div>


<div class="certificate-info">

Certificate ID:

<strong>
${escapeHTML(id)}
</strong>

</div>


<div class="footer">


<div class="signature">

<div class="digital-signature">
T. Saththiyanadan
</div>

Founder<br>
CreateLK Academy

</div>


<div class="center">

createlk.com

<br>

Issued:
${escapeHTML(issued)}

</div>


<div class="signature">

<div class="digital-signature">
CreateLK Academy
</div>

English Learning<br>
Achievement

</div>


</div>


</div>

</div>


</body>

</html>
`;


const blob =
new Blob(
[html],
{
type:"text/html"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href =
url;

link.download =

"CreateLK-Academy-Certificate-" +

name.replace(
/[^a-z0-9]/gi,
"-"
) +

"-" +

id +

".html";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
1000
);

message(
"🎓 Certificate downloaded successfully.",
"success"
);

}


/* =====================================================
   START
===================================================== */

if(loadStudent()){

$("studentBox").textContent =
"👤 " + studentName();

loadProgress();

}else{

$("studentBox").textContent =
"👤 Student session not found";

$("loading").style.display =
"none";

message(
"Please log in to CreateLK Academy.",
"info"
);

}

</script>

</body>
</html>
