<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Certificate | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #ddd}
.nav{max-width:900px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between}
.logo{font-weight:800;color:#155eef}.back{color:#475467;text-decoration:none;font-weight:bold}
.container{max-width:800px;margin:auto;padding:25px 15px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:25px;margin-bottom:20px}
.hero{text-align:center}
.icon{font-size:55px}
.muted{color:#667085}
.status{padding:12px;border-radius:9px;margin-top:15px;font-weight:bold}
.active{background:#dcfce7;color:#166534}
.locked{background:#fee2e2;color:#991b1b}
.progress{border:1px solid #ddd;border-radius:9px;padding:15px;margin-top:15px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}
.green{color:#15803d}
.center{text-align:center}
.btn{display:inline-block;border:0;border-radius:9px;padding:13px 22px;background:#155eef;color:white;text-decoration:none;font-weight:bold;cursor:pointer;margin:5px}
.download{background:#15803d;font-size:16px}
.hidden{display:none}
.error{color:#b91c1c;text-align:center}

/* PRINT CERTIFICATE */
.print-certificate{display:none}

@page{size:A4 landscape;margin:0}

@media print{
body{background:#fff!important}
header,.screen,.actions,footer{display:none!important}

.print-certificate{
display:block!important;
position:relative;
width:297mm;
height:210mm;
background:linear-gradient(135deg,#fff,#f5f3ff);
border:2.6mm solid #172554;
color:#172033;
overflow:hidden;
-webkit-print-color-adjust:exact;
print-color-adjust:exact;
}

.print-certificate:before{
content:"";
position:absolute;
inset:4.8mm;
border:1mm solid #f59e0b;
}

.print-certificate:after{
content:"";
position:absolute;
inset:7.5mm;
border:.5mm solid #2563eb;
}

.pc-content{
position:absolute;
z-index:2;
top:18mm;
left:24mm;
right:24mm;
bottom:19mm;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.pc-academy{
font-size:6mm;
font-weight:900;
letter-spacing:1.6mm;
color:#155eef;
}

.pc-line{
width:50mm;
height:.8mm;
background:linear-gradient(90deg,#2563eb,#f59e0b,#9333ea);
margin:3mm 0 5mm;
}

.pc-title{
font:17mm Georgia,serif;
letter-spacing:2mm;
margin:0;
color:#172554;
}

.pc-sub{
font-size:4.5mm;
font-weight:bold;
letter-spacing:1.5mm;
color:#d97706;
margin-top:2mm;
}

.pc-presented{
margin-top:8mm;
font-size:4.3mm;
color:#667085;
}

.pc-name{
font:bold 12mm Georgia,serif;
color:#1d4ed8;
margin:3mm 0 2mm;
padding:0 12mm 3mm;
border-bottom:1mm solid #f59e0b;
max-width:225mm;
}

.pc-course{
font:bold 7mm Georgia,serif;
color:#172554;
margin-top:2mm;
max-width:205mm;
}

.pc-score{
margin-top:4mm;
padding:2.5mm 8mm;
border:.7mm solid #f59e0b;
border-radius:10mm;
background:#fff8e8;
font-size:3.6mm;
font-weight:bold;
}

.pc-score strong{
font-size:5.5mm;
color:#155eef;
margin-left:8mm;
}

.pc-details{
width:88%;
margin-top:auto;
display:flex;
justify-content:space-between;
gap:10mm;
}

.pc-detail{
width:33%;
text-align:center;
}

.pc-value{
font-size:3.7mm;
font-weight:bold;
margin-bottom:2mm;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.pc-line2{
border-top:.3mm solid #777;
padding-top:2mm;
font-size:2.5mm;
letter-spacing:.5mm;
color:#667085;
}

.pc-signature{
font:6mm "Brush Script MT",cursive;
color:#155eef;
}

.pc-website{
position:absolute;
z-index:3;
bottom:7mm;
left:0;
right:0;
text-align:center;
font-size:3.5mm;
font-weight:bold;
color:#155eef;
}

.pc-verify{
position:absolute;
z-index:3;
bottom:3mm;
left:0;
right:0;
text-align:center;
font-size:2.2mm;
color:#999;
}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header>

<div class="container screen">

<div class="card hero">
<div class="icon">🎓</div>
<h1>My Certificate</h1>
<p class="muted">
Your certificate is available after successfully passing the final assessment.
</p>
<div id="membershipStatus" class="status">
Checking Premium membership...
</div>
</div>

<div class="card">
<h2>📊 Assessment Result</h2>
<div id="progressArea" class="muted">
Loading...
</div>
</div>

<div class="card center actions" id="certificateCard">
<div id="certificateArea">
Loading certificate...
</div>
</div>

</div>

<footer class="screen" style="text-align:center;padding:20px;color:#667085">
© 2026 CreateLK Academy. All rights reserved.
</footer>


<!-- HIDDEN UNTIL PRINT -->
<div id="printCertificate" class="print-certificate"></div>


<script>
const MEMBERSHIP_API=
"https://createlk-membership-api.createlk.workers.dev";

const CERTIFICATE_API=
"https://createlk-certificate-api.createlk.workers.dev";

const token=sessionStorage.getItem("createlk_token");
const student=JSON.parse(
sessionStorage.getItem("createlk_student")||"null"
);

if(!token||!student){
location.href="login.html";
}

const $=id=>document.getElementById(id);

async function start(){

try{

const r=await fetch(
MEMBERSHIP_API+
"/api/membership?student_id="+
encodeURIComponent(student.id),
{
headers:{Authorization:"Bearer "+token}
}
);

const d=await r.json();

if(!r.ok||!d.success||!d.active){

$("membershipStatus").className="status locked";
$("membershipStatus").textContent=
"🔒 Active Premium Membership Required";

$("progressArea").innerHTML=
'<div class="error">Premium membership is required.</div>';

$("certificateArea").innerHTML=
'<div class="muted">Certificate unavailable.</div>';

return;
}

$("membershipStatus").className="status active";
$("membershipStatus").textContent=
"⭐ Premium Membership Active";

loadCertificate();

}catch(e){

$("membershipStatus").className="status locked";
$("membershipStatus").textContent=
"Unable to connect to membership server.";

}
}


async function loadCertificate(){

try{

const r=await fetch(
CERTIFICATE_API+
"/api/certificate/progress?student_id="+
encodeURIComponent(student.id),
{
headers:{Authorization:"Bearer "+token}
}
);

const d=await r.json();

if(!r.ok||!d.success)throw Error();

showProgress(d);

const list=d.certificates||[];

if(!list.length){

$("certificateArea").innerHTML=`
<p class="muted">
🎓 No certificate has been issued yet.
</p>
<a class="btn" href="exam.html">
📝 Take Final Assessment
</a>`;

return;
}

createCertificate(list[0]);

}catch(e){

$("progressArea").innerHTML=
'<div class="error">❌ Unable to load assessment.</div>';

$("certificateArea").innerHTML=
'<div class="error">❌ Unable to load certificate.</div>';

}
}


function percent(score,total){

let n=parseFloat(
String(score??0).replace("%","")
)||0;

total=parseInt(total)||10;

if(n<=1)n*=100;
else if(n<=10&&total===10)n=n/total*100;

return Math.round(Math.min(n,100));
}


function showProgress(d){

const a=d.assessment;

if(!a){

$("progressArea").innerHTML=`
<p>
📝 Final assessment not completed.
</p>
<a class="btn" href="exam.html">
Take Final Assessment
</a>`;

return;
}

const p=percent(
a.score,
a.total_questions
);

const pass=p>=70||Number(a.passed)===1;

$("progressArea").innerHTML=`
<div class="progress">

<div class="row">
<span>Course</span>
<strong>${esc(a.course_name||"Premium English Course")}</strong>
</div>

<div class="row">
<span>Score</span>
<strong>${p}%</strong>
</div>

<div class="row">
<span>Result</span>
<strong class="${pass?"green":""}">
${pass?"✅ PASSED":"❌ NOT PASSED"}
</strong>
</div>

<div class="row">
<span>Certificate</span>
<strong class="${pass?"green":""}">
${pass?"🎓 ISSUED":"🔒 70% Required"}
</strong>
</div>

</div>`;

}


function createCertificate(c){

const name=
c.student_name||
(
(student.first_name||"")+" "+
(student.last_name||"")
).trim()||
"CreateLK Academy Student";

const course=
c.course_name||
"Premium English Course";

const score=percent(
c.score,
c.total_questions
);

const date=
c.issue_date||
new Date().toLocaleDateString("en-GB");

const id=
c.certificate_id||
"CREATELK-CERT";

$("certificateArea").innerHTML=`

<h2>🎓 Certificate Ready</h2>

<p class="muted">
Your certificate has been successfully issued.
</p>

<p>
<strong>${esc(name)}</strong>
</p>

<p class="muted">
${esc(course)} · ${score}%
</p>

<button class="btn download" onclick="printCertificate()">
🖨️ Download / Print Certificate
</button>

<p class="muted" style="font-size:13px">
Click the button and choose <strong>Save as PDF</strong>
to download your certificate.
</p>
`;


/* Build printable certificate */

$("printCertificate").innerHTML=`

<div class="pc-content">

<div class="pc-academy">
CREATELK ACADEMY
</div>

<div class="pc-line"></div>

<h1 class="pc-title">
CERTIFICATE
</h1>

<div class="pc-sub">
OF ACHIEVEMENT
</div>

<div class="pc-presented">
This certificate is proudly presented to
</div>

<div class="pc-name">
${esc(name)}
</div>

<div class="muted">
for successfully completing
</div>

<div class="pc-course">
${esc(course)}
</div>

<div class="pc-score">
FINAL ASSESSMENT SCORE
<strong>${score}%</strong>
</div>

<div class="pc-details">

<div class="pc-detail">
<div class="pc-value">${esc(date)}</div>
<div class="pc-line2">DATE OF ISSUE</div>
</div>

<div class="pc-detail">
<div class="pc-signature">CreateLK Academy</div>
<div class="pc-line2">AUTHORIZED SIGNATURE</div>
</div>

<div class="pc-detail">
<div class="pc-value">${esc(id)}</div>
<div class="pc-line2">CERTIFICATE ID</div>
</div>

</div>

</div>

<div class="pc-website">
createlk.com
</div>

<div class="pc-verify">
This certificate may be verified online using the Certificate ID.
</div>
`;

}


function printCertificate(){

window.print();

}


function esc(v){

return String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

start();
</script>

</body>
</html>
