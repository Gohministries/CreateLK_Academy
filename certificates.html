name="viewport"

Certificates | CreateLK Academy

<style>

*{

body{

.hero{

.icon{

.subtitle{

.certificate{

}

.certificate-icon{

margin-bottom:10px;
}

.certificate h2{

margin-bottom:8px;
}

.certificate-name{
font-size:22px;

.certificate p{

.certificate-id{

color:#667085;
margin-top:12px;
}

.progress-area{
margin-top:20px;
}

.progress-bar{
height:14px;
background:#e5e7eb;

.progress-fill{

}

.btn{

}

.primary{

color:#fff;
}

.primary:hover{
background:#1247b8;
}

.secondary{
background:#eef2f7;

}

.message{

padding:13px;
border-radius:9px;
font-size:13px;

}

.error{

.info{

}

.success{

}

font-size:11px;

}

@media(max-width:500px){

.card{
padding:20px 15px;
}

.buttons{
flex-direction:column;
}

}

.certificate-name{
font-size:20px;
}

}

</style>

</head>

<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<div class="subtitle">

Earn your certificate by completing
1,000 correct English answers.

</div>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div id="certificates"></div>


<div
id="message"
class="message">
</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<script>

/* =====================================================
   CREATE LK ACADEMY
   CERTIFICATE PAGE
===================================================== */


/* =====================================================
   API
===================================================== */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";


/* =====================================================
   STORAGE
===================================================== */

const STUDENT_KEY =
"createlk_student";


/* =====================================================
   CERTIFICATE REQUIREMENT
===================================================== */

const REQUIRED_CORRECT = 1000;


/* =====================================================
   STUDENT
===================================================== */

let student = null;
let studentId = null;


/*
   Session storage first.
   Local storage is the fallback.

   This means the student can leave this page,
   return again, and the ID can still be recovered.
*/

function loadStudent(){

let saved =
sessionStorage.getItem(
STUDENT_KEY
);


/*
   Fallback to localStorage
*/

if(!saved){

saved =
localStorage.getItem(
STUDENT_KEY
);

}


/*
   Nothing found
*/

if(!saved){

return false;

}


try{

const data =
JSON.parse(saved);

if(
!data ||
typeof data !== "object"
){

return false;

}


student = data;


studentId =
data.id ||
data.student_id ||
data.user_id ||
null;


if(studentId){

studentId =
String(studentId);

}


/*
   If the student was found only in localStorage,
   restore it to sessionStorage so navigation
   during the current session remains stable.
*/

if(student){

try{

sessionStorage.setItem(
STUDENT_KEY,
JSON.stringify(student)
);

}catch(error){

console.warn(
"Could not restore student session:",
error
);

}

}


return !!student;

}catch(error){

console.error(
"Student storage error:",
error
);

return false;

}

}


/* =====================================================
   GET STUDENT ID
===================================================== */

function getStudentId(){

if(studentId){

return String(studentId);

}


/*
   Reload from storage.
*/

loadStudent();


if(studentId){

return String(studentId);

}


/*
   Final fallback:
   search storage directly.
*/

const sessionData =
sessionStorage.getItem(
STUDENT_KEY
);

const localData =
localStorage.getItem(
STUDENT_KEY
);


const saved =
sessionData ||
localData;


if(saved){

try{

const data =
JSON.parse(saved);

const id =
data?.id ||
data?.student_id ||
data?.user_id ||
null;

if(id){

student = data;

studentId =
String(id);

return studentId;

}

}catch(error){

console.error(
"Student ID recovery error:",
error
);

}

}


return null;

}


/* =====================================================
   STUDENT NAME
===================================================== */

function getStudentName(){

if(!student){

loadStudent();

}


if(!student){

return "Student";

}


const first =
student.first_name ||
student.firstName ||
"";


const last =
student.last_name ||
student.lastName ||
"";


const combined =
`${first} ${last}`.trim();


if(combined){

return combined;

}


if(student.name){

return String(
student.name
).trim();

}


return "Student";

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(){

const name =
getStudentName();


document.getElementById(
"studentBox"
).textContent =
"👤 " + name;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

const box =
document.getElementById(
"message"
);

box.style.display =
"none";

}


/* =====================================================
   LOAD CERTIFICATE
===================================================== */

async function loadCertificates(){

/*
   Always attempt to recover the student
   before making the API request.
*/

loadStudent();

displayStudent();


const id =
getStudentId();


/*
   No ID.
   Do NOT immediately say "login again".
   Give a clear message instead.
*/

if(!id){

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Your login session could not be found. Please return to the Dashboard and log in again.",
"error"
);

return;

}


try{

/* =================================================
   API REQUEST
================================================= */

const url =
API_URL +
"/api/certificates?student_id=" +
encodeURIComponent(id);


const response =
await fetch(
url,
{
method:"GET",

headers:{
"Accept":
"application/json"
}
}
);


/* =================================================
   READ RESPONSE
================================================= */

const raw =
await response.text();


console.log(
"Certificate API response:",
raw
);


let data;


try{

data =
JSON.parse(raw);

}catch(error){

throw new Error(
"Invalid certificate server response."
);

}


/* =================================================
   API ERROR
================================================= */

if(
!response.ok
){

throw new Error(
data.message ||
data.error ||
`Certificate request failed (${response.status}).`
);

}


/*
   Some Workers return success:false
   when the request is valid but there
   is no certificate yet.
*/

if(
data.success === false
){

throw new Error(
data.message ||
data.error ||
"Unable to load certificate information."
);

}


/* =================================================
   HIDE LOADING
================================================= */

document.getElementById(
"loading"
).style.display =
"none";


/* =================================================
   CORRECT ANSWERS
================================================= */

const correctAnswers =
Number(
data.correct_answers ??
data.certificate_progress ??
data.progress ??
0
);


/* =================================================
   REQUIRED ANSWERS
================================================= */

const required =
Number(
data.required_correct_answers ??
data.certificate_target ??
data.target ??
REQUIRED_CORRECT
);


/* =================================================
   ELIGIBILITY
================================================= */

const eligible =
data.eligible === true ||
correctAnswers >= required;


/* =================================================
   NOT ELIGIBLE
================================================= */

if(!eligible){

showProgress(
correctAnswers,
required
);

return;

}


/* =================================================
   CERTIFICATES
================================================= */

const certificates =
Array.isArray(
data.certificates
)
?
data.certificates
:
[];


/*
   If API says eligible but does not return
   a certificate record, show an informative message.
*/

if(
certificates.length === 0
){

showMessage(
"🎓 You have completed the requirement. Your certificate is being prepared.",
"success"
);

return;

}


/* =================================================
   DISPLAY
================================================= */

displayCertificates(
certificates,
correctAnswers
);


}catch(error){

console.error(
"Certificate error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showMessage(
error.message ||
"Unable to load certificate information.",
"error"
);

}

}


/* =====================================================
   SHOW PROGRESS
===================================================== */

function showProgress(
correct,
required
){

const percentage =
required > 0
?
Math.min(
100,
Math.round(
(correct / required) * 100
)
)
:
0;


const remaining =
Math.max(
0,
required - correct
);


const name =
getStudentName();


document.getElementById(
"certificates"
).innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🔒
</div>

<h2>
Certificate Locked
</h2>

<div class="certificate-name">
${escapeHtml(name)}
</div>

<p>

Complete

<strong>
${required.toLocaleString()}
correct answers
</strong>

to earn your
CreateLK Academy
Achievement Certificate.

</p>


<div class="progress-area">

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percentage}%">
</div>

</div>


<div class="progress-text">

${correct.toLocaleString()}
/
${required.toLocaleString()}
correct answers

</div>


<p style="margin-top:8px">

Progress: ${percentage}%

</p>


<p style="margin-top:5px">

${remaining.toLocaleString()}
more correct answers needed.

</p>

</div>

</div>

`;

}


/* =====================================================
   DISPLAY CERTIFICATES
===================================================== */

function displayCertificates(
certificates,
correctAnswers
){

const container =
document.getElementById(
"certificates"
);


container.innerHTML =
"";


const name =
getStudentName();


certificates.forEach(
function(cert){

const box =
document.createElement(
"div"
);


box.className =
"certificate";


const certificateId =
cert.certificate_id ||
cert.id ||
"";


const title =
cert.title ||
"English Learning Achievement Certificate";


const issued =
cert.issued_at ||
cert.created_at ||
"";


const completedAnswers =
Number(
cert.correct_answers ??
correctAnswers ??
0
);


box.innerHTML = `

<div class="certificate-icon">
🏆
</div>


<h2>
${escapeHtml(title)}
</h2>


<div class="certificate-name">

${escapeHtml(
cert.student_name ||
name
)}

</div>


<p>

Congratulations!

You have successfully completed

<strong>
${completedAnswers.toLocaleString()}
correct English answers
</strong>

through CreateLK Academy.

</p>


<div class="certificate-id">

Certificate ID:
${escapeHtml(
String(certificateId)
)}

</div>


<div class="certificate-id">

Issued:
${escapeHtml(
formatDate(issued)
)}

</div>


<div class="buttons">

<button
class="btn primary"
type="button"
onclick="printCertificate(this)">

🖨️ Print Certificate

</button>

</div>

`;


container.appendChild(
box
);

});

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
value
){

if(!value){

return "—";

}


try{

const date =
new Date(value);


if(
Number.isNaN(
date.getTime()
)
){

return String(value);

}


return date.toLocaleDateString(
undefined,
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}catch(error){

return String(value);

}

}


/* =====================================================
   PRINT CERTIFICATE
===================================================== */

function printCertificate(
button
){

const certificate =
button.closest(
".certificate"
);


if(!certificate){

return;

}


const printWindow =
window.open(
"",
"_blank",
"width=900,height=700"
);


if(!printWindow){

alert(
"Please allow pop-ups to print your certificate."
);

return;

}


const name =
getStudentName();


printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>
CreateLK Academy Certificate
</title>

<style>

*{
box-sizing:border-box;
}

body{

font-family:
Arial,
Helvetica,
sans-serif;

padding:40px;

text-align:center;

background:#fff;

}

.certificate{

border:10px solid #d8b45a;

padding:70px 40px;

max-width:850px;

margin:auto;

background:#fffdf5;

}

.logo{

font-size:34px;

font-weight:800;

color:#155eef;

}

.title{

font-size:30px;

font-weight:800;

margin:25px 0;

}

.name{

font-size:34px;

font-weight:800;

color:#155eef;

margin:30px 0;

}

.text{

font-size:17px;

line-height:1.8;

}

.footer{

margin-top:35px;

font-size:14px;

color:#667085;

}

@media print{

body{

padding:0;

}

.certificate{

max-width:none;

width:100%;

min-height:90vh;

}

}

</style>

</head>


<body>


<div class="certificate">


<div class="logo">

📚 CreateLK Academy

</div>


<div class="title">

🏆 English Learning
Achievement Certificate

</div>


<div class="name">

${escapeHtml(name)}

</div>


<div class="text">

This certificate recognizes the
successful completion of

<strong>
1,000 correct English answers
</strong>

through the
CreateLK Academy
learning platform.

</div>


<div class="footer">

Issued by CreateLK Academy

</div>


</div>


</body>

</html>

`);


printWindow.document.close();

printWindow.focus();


setTimeout(
function(){

printWindow.print();

},
500
);

}


/* =====================================================
   START
===================================================== */

loadStudent();

displayStudent();

loadCertificates();

</script>

</body>

</html>
