<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Certificates | CreateLK Academy
</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:850px;
margin:auto;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef;
}

.back{
color:#475467;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.container{
max-width:800px;
margin:25px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.hero{
text-align:center;
}

.icon{
width:64px;
height:64px;
margin:auto;
border-radius:16px;
background:#f5f3ff;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

h1{
font-size:26px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.6;
}

.student{
margin-top:20px;
padding:13px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
}

.loading{
padding:25px;
text-align:center;
color:#667085;
}

.certificate{
margin-top:20px;
padding:24px;
border:2px solid #d8b45a;
border-radius:15px;
background:#fffdf5;
text-align:center;
}

.certificate-icon{
font-size:42px;
margin-bottom:10px;
}

.certificate h2{
font-size:21px;
margin-bottom:8px;
}

.certificate-name{
font-size:22px;
font-weight:800;
color:#155eef;
margin:12px 0;
}

.certificate p{
font-size:13px;
color:#667085;
line-height:1.6;
}

.certificate-id{
font-size:12px;
color:#667085;
margin-top:12px;
}

.progress-area{
margin-top:20px;
}

.progress-bar{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#155eef;
border-radius:20px;
}

.progress-text{
margin-top:10px;
font-size:14px;
font-weight:800;
color:#344054;
}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
}

.btn{
flex:1;
border:0;
border-radius:9px;
padding:12px;
font-size:13px;
font-weight:800;
cursor:pointer;
text-decoration:none;
text-align:center;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:9px;
font-size:13px;
text-align:center;
line-height:1.5;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:500px){

.card{
padding:20px 15px;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<main class="container">

<div class="card">


<div class="hero">

<div class="icon">
🎓
</div>

<h1>
Achievement Certificates
</h1>

<div class="subtitle">

Earn your certificate by completing
1,000 correct English answers.

</div>

</div>


<div
id="studentBox"
class="student">

Loading student...

</div>


<div
id="loading"
class="loading">

⏳ Checking certificate progress...

</div>


<div
id="certificates">
</div>


<div
id="message"
class="message">
</div>


</div>

</main>


<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<script>

/* =====================================================
   CREATE LK ACADEMY
   CERTIFICATE SYSTEM
===================================================== */


/* =====================================================
   API
===================================================== */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";


/* =====================================================
   SESSION KEYS
===================================================== */

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* =====================================================
   CERTIFICATE REQUIREMENT
===================================================== */

const REQUIRED_CORRECT =
1000;


/* =====================================================
   GET STUDENT
===================================================== */

let student = null;

try{

const saved =
sessionStorage.getItem(
STUDENT_KEY
);

if(saved){

student =
JSON.parse(saved);

}

}catch(error){

console.error(
"Student session error:",
error
);

}


/* =====================================================
   LOGIN CHECK
===================================================== */

if(
!student ||
sessionStorage.getItem(
LOGIN_KEY
) !== "true"
){

window.location.replace(
"login.html"
);

}


/* =====================================================
   STUDENT ID
===================================================== */

const studentId =
student?.id ||
student?.student_id;


/* =====================================================
   STUDENT NAME
===================================================== */

const firstName =
student?.first_name ||
student?.firstName ||
"Student";

const lastName =
student?.last_name ||
student?.lastName ||
"";

const fullName =
(
firstName +
" " +
lastName
).trim();


/* =====================================================
   DISPLAY STUDENT
===================================================== */

document.getElementById(
"studentBox"
).textContent =
"👤 " + fullName;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =====================================================
   LOAD CERTIFICATE
===================================================== */

async function loadCertificates(){

if(!studentId){

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
"Student ID is missing. Please login again.",
"error"
);

return;

}


try{


/* =====================================================
   API REQUEST
===================================================== */

const response =
await fetch(

API_URL +
"/api/certificates?student_id=" +
encodeURIComponent(
studentId
),

{
method:"GET",

headers:{
"Accept":
"application/json"
}

}

);


/* =====================================================
   RESPONSE
===================================================== */

const raw =
await response.text();

console.log(
"CERTIFICATE API:",
raw
);


let data;

try{

data =
JSON.parse(raw);

}catch(error){

throw new Error(
"Invalid certificate server response."
);

}


/* =====================================================
   API ERROR
===================================================== */

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to load certificate information."
);

}


/* =====================================================
   HIDE LOADING
===================================================== */

document.getElementById(
"loading"
).style.display =
"none";


/* =====================================================
   CORRECT ANSWERS
===================================================== */

const correctAnswers =
Number(
data.correct_answers ||
0
);


const required =
Number(
data.required_correct_answers ||
REQUIRED_CORRECT
);


/* =====================================================
   ELIGIBILITY
===================================================== */

const eligible =
data.eligible === true ||
correctAnswers >= required;


/* =====================================================
   NOT ELIGIBLE
===================================================== */

if(!eligible){

showProgress(
correctAnswers,
required
);

return;

}


/* =====================================================
   CERTIFICATE
===================================================== */

const certificates =
Array.isArray(
data.certificates
)
?
data.certificates
:
[];


if(
certificates.length === 0
){

showMessage(
"Certificate is eligible but has not been created yet.",
"info"
);

return;

}


/* =====================================================
   DISPLAY
===================================================== */

displayCertificates(
certificates,
correctAnswers
);


}catch(error){

console.error(
"Certificate error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showMessage(
error.message ||
"Unable to load certificates.",
"error"
);

}

}


/* =====================================================
   SHOW PROGRESS
===================================================== */

function showProgress(
correct,
required
){

const percentage =
Math.min(
100,
Math.round(
(correct / required) * 100
)
);


const remaining =
Math.max(
0,
required - correct
);


document.getElementById(
"certificates"
).innerHTML = `

<div class="certificate">

<div class="certificate-icon">
🔒
</div>

<h2>
Certificate Locked
</h2>

<div class="certificate-name">
${escapeHtml(fullName)}
</div>

<p>

Complete

<strong>
${required.toLocaleString()}
correct answers
</strong>

to earn your
CreateLK Academy
Achievement Certificate.

</p>


<div class="progress-area">

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percentage}%">
</div>

</div>


<div class="progress-text">

${correct.toLocaleString()}
/
${required.toLocaleString()}
correct answers

</div>

<p>
Progress: ${percentage}%
</p>

<p>

${remaining.toLocaleString()}
more correct answers needed.

</p>

</div>

</div>

`;

}


/* =====================================================
   DISPLAY CERTIFICATES
===================================================== */

function displayCertificates(
certificates,
correctAnswers
){

const container =
document.getElementById(
"certificates"
);

container.innerHTML =
"";


certificates.forEach(
function(cert){

const box =
document.createElement(
"div"
);

box.className =
"certificate";


const certificateId =
cert.certificate_id ||
cert.id ||
"";


const title =
cert.title ||
"English Learning Achievement Certificate";


const issued =
cert.issued_at ||
cert.created_at ||
"";


box.innerHTML = `

<div class="certificate-icon">
🏆
</div>


<h2>
${escapeHtml(title)}
</h2>


<div class="certificate-name">

${escapeHtml(
cert.student_name ||
fullName
)}

</div>


<p>

Congratulations!

You have successfully completed

<strong>
${Number(
cert.correct_answers ||
correctAnswers
).toLocaleString()}
correct English answers
</strong>

through CreateLK Academy.

</p>


<div class="certificate-id">

Certificate ID:
${escapeHtml(
String(certificateId)
)}

</div>


<div class="certificate-id">

Issued:
${escapeHtml(
formatDate(issued)
)}

</div>


<div class="buttons">

<button
class="btn primary"
onclick="printCertificate(this)">

🖨️ Print Certificate

</button>

</div>

`;


container.appendChild(
box
);

});

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
value
){

return String(
value || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
value
){

if(!value){

return "";

}

try{

return new Date(
value
).toLocaleDateString();

}catch(error){

return value;

}

}


/* =====================================================
   PRINT CERTIFICATE
===================================================== */

function printCertificate(
button
){

const certificate =
button.closest(
".certificate"
);

if(!certificate){

return;

}


const printWindow =
window.open(
"",
"_blank",
"width=900,height=700"
);


if(!printWindow){

alert(
"Please allow pop-ups to print your certificate."
);

return;

}


printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>
CreateLK Academy Certificate
</title>

<style>

body{

font-family:
Arial,
Helvetica,
sans-serif;

padding:40px;

text-align:center;

background:#fff;

}

.certificate{

border:10px solid #d8b45a;

padding:70px 40px;

max-width:850px;

margin:auto;

background:#fffdf5;

}

.logo{

font-size:34px;

font-weight:800;

color:#155eef;

}

.title{

font-size:30px;

font-weight:800;

margin:25px 0;

}

.name{

font-size:34px;

font-weight:800;

color:#155eef;

margin:30px 0;

}

.text{

font-size:17px;

line-height:1.8;

}

.footer{

margin-top:35px;

font-size:14px;

color:#667085;

}

</style>

</head>


<body>

<div class="certificate">


<div class="logo">

📚 CreateLK Academy

</div>


<div class="title">

🏆 English Learning
Achievement Certificate

</div>


<div class="name">

${escapeHtml(fullName)}

</div>


<div class="text">

This certificate recognizes the
successful completion of

<strong>
1,000 correct English answers
</strong>

through the
CreateLK Academy
learning platform.

</div>


<div class="footer">

Issued by CreateLK Academy

</div>


</div>

</body>

</html>

`);


printWindow.document.close();

printWindow.focus();


setTimeout(
function(){

printWindow.print();

},
500
);

}


/* =====================================================
   START
===================================================== */

loadCertificates();

</script>

</body>

</html>
