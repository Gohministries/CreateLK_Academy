<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>


<div class="container">

<div class="card hero">

<div class="icon">
🎓
</div>

<h1>
My Certificate
</h1>

<p class="muted">
Your official CreateLK Academy certificate.
</p>

<div id="membershipStatus" class="status">
Checking Premium membership...
</div>

</div>


<div class="card">

<h2>
📊 Assessment Result
</h2>

<div id="progressArea" class="muted">
Loading...
</div>

</div>


<div class="card center">

<div id="certificateArea">
Loading certificate...
</div>

</div>

</div>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

const MEMBERSHIP_API =
"https://createlk-membership-api.createlk.workers.dev";

const CERTIFICATE_API =
"https://createlk-certificate-api.createlk.workers.dev";


const token =
sessionStorage.getItem("createlk_token");


const student =
JSON.parse(
sessionStorage.getItem("createlk_student") || "null"
);


if(!token || !student){

location.href="login.html";

}


const $ = id =>
document.getElementById(id);


/* =========================
   CHECK PREMIUM
========================= */

async function start(){

try{

const response =
await fetch(
MEMBERSHIP_API +
"/api/membership?student_id=" +
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer " + token
}
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success ||
!data.active
){

$("membershipStatus").className =
"status locked";

$("membershipStatus").textContent =
"🔒 Active Premium Membership Required";


$("progressArea").innerHTML = `
<p class="error">
Premium membership is required.
</p>
`;


$("certificateArea").innerHTML = `
<p class="muted">
Your certificate is locked until Premium membership is active.
</p>
`;


return;

}


$("membershipStatus").className =
"status active";

$("membershipStatus").textContent =
"⭐ Premium Membership Active";


loadCertificate();


}catch(error){

console.error(error);

$("membershipStatus").className =
"status locked";

$("membershipStatus").textContent =
"Unable to connect to membership server.";

}

}


/* =========================
   LOAD CERTIFICATE
========================= */

async function loadCertificate(){

try{

const response =
await fetch(
CERTIFICATE_API +
"/api/certificate/progress?student_id=" +
encodeURIComponent(student.id),
{
headers:{
Authorization:"Bearer " + token
}
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message || "Unable to load data"
);

}


showProgress(data);


const certificates =
data.certificates || [];


if(!certificates.length){

$("certificateArea").innerHTML = `

<div class="muted">

<div style="font-size:45px">
🎓
</div>

<h3>
Certificate Not Available
</h3>

<p>
Pass the final assessment with at least 70%.
</p>

<a
href="exam.html"
class="btn"
>
📝 Take Final Assessment
</a>

</div>

`;

return;

}


createCertificate(
certificates[0]
);


}catch(error){

console.error(error);

$("progressArea").innerHTML =
'<p class="error">❌ Unable to load assessment.</p>';

$("certificateArea").innerHTML =
'<p class="error">❌ Unable to load certificate.</p>';

}

}


/* =========================
   SCORE
========================= */

function getPercent(score,total){

let number =
parseFloat(
String(score ?? 0)
.replace("%","")
) || 0;


total =
parseInt(total) || 10;


/*
If API stores 0.75
*/
if(number > 0 && number <= 1){

number =
number * 100;

}


/*
If API stores marks such as 8/10
*/
else if(
number > 1 &&
number <= 10 &&
total === 10
){

number =
(number / total) * 100;

}


return Math.round(
Math.min(number,100)
);

}


/* =========================
   PROGRESS
========================= */

function showProgress(data){

const assessment =
data.assessment;


if(!assessment){

$("progressArea").innerHTML = `

<p>
📝 Final assessment not completed.
</p>

<a
href="exam.html"
class="btn"
>
Take Final Assessment
</a>

`;

return;

}


const percentage =
getPercent(
assessment.score,
assessment.total_questions
);


const passed =
percentage >= 70 ||
Number(assessment.passed) === 1;


$("progressArea").innerHTML = `

<div class="progress">

<div class="row">

<span>
Course
</span>

<strong>
${esc(
assessment.course_name ||
"Premium English Course"
)}
</strong>

</div>


<div class="row">

<span>
Score
</span>

<strong>
${percentage}%
</strong>

</div>


<div class="row">

<span>
Result
</span>

<strong class="${passed?"green":""}">
${passed ?
"✅ PASSED" :
"❌ NOT PASSED"}
</strong>

</div>


<div class="row">

<span>
Certificate
</span>

<strong class="${passed?"green":""}">
${passed ?
"🎓 ISSUED" :
"🔒 70% Required"}
</strong>

</div>

</div>

`;

}


/* =========================
   CERTIFICATE
========================= */

let certificateData = null;


function createCertificate(c){

const studentName =
c.student_name ||
(
(student.first_name || "") +
" " +
(student.last_name || "")
).trim() ||
"CreateLK Academy Student";


const courseName =
c.course_name ||
"Premium English Course";


const score =
getPercent(
c.score,
c.total_questions
);


const issueDate =
c.issue_date ||
new Date().toLocaleDateString("en-GB");


const certificateId =
c.certificate_id ||
"CREATELK-CERT";


certificateData = {

name:studentName,

course:courseName,

score:score,

date:issueDate,

id:certificateId

};


$("certificateArea").innerHTML = `

<div class="success">

<div style="font-size:50px">
🏆
</div>

<h2>
Certificate Ready
</h2>

<p>
<strong>
${esc(studentName)}
</strong>
</p>

<p class="muted">
${esc(courseName)}
</p>

<p class="muted">
Final Assessment: <strong>
${score}%
</strong>
</p>

<button
class="btn download"
onclick="downloadPDF()"
>
📄 Download Certificate PDF
</button>

<p class="small">
A4 Landscape • Official Certificate
</p>

</div>

`;

}


/* =========================
   DOWNLOAD PDF
========================= */

function downloadPDF(){

if(!certificateData){

alert(
"Certificate information is not available."
);

return;

}


if(
typeof window.jspdf === "undefined"
){

alert(
"PDF generator is loading. Please try again."
);

return;

}

jsPDF
} = window.jspdf;


/*
A4 landscape
*/

new jsPDF({

unit:"mm",
format:"a4"
});

const H = 210;

========================= */

250,

);

0,
0,

"F"
);

========================= */

23,

);

pdf.setLineWidth(2.5);

pdf.rect(
4,
4,
289,
202
);


/* GOLD BORDER */

245,
158,
11
);

pdf.setLineWidth(1);

pdf.rect(
9,
9,
279,
192
);


/* BLUE INNER BORDER */

pdf.setDrawColor(
37,
99,
235
);

pdf.setLineWidth(.5);

pdf.rect(

15,
267,
180

========================= */

21,

239

"bold"
);

pdf.setFontSize(17);

W/2,

{

}
);


/* LINE */

pdf.line(

/* =========================
   TITLE

);

pdf.setFont(
"times",
"bold"
);

pdf.setFontSize(34);

pdf.text(
"CERTIFICATE",
W/2,
58,
{
align:"center"
}
);


pdf.setTextColor(
217,
119,
6
);

pdf.setFont(
"helvetica",
"bold"
);

pdf.setFontSize(11);

pdf.text(
"OF ACHIEVEMENT",
W/2,
67,
{
align:"center"
}
);


/* =========================
   PRESENTED
========================= */

pdf.setTextColor(
102,
112,
133
);

pdf.setFont(
"helvetica",
"normal"
);

pdf.setFontSize(10);

pdf.text(
"This certificate is proudly presented to",
W/2,
82,
{
align:"center"
}
);


/* =========================
   STUDENT NAME
========================= */

pdf.setTextColor(

78,
216
);

pdf.setFont(
"times",
"bold"
);

/*
Prevent very long names
from overflowing
*/

if(name.length > 38){

}

98,

/* NAME LINE */

245,

11
);

pdf.setLineWidth(.8);

pdf.line(
60,
103,
237,
103
);


/* =========================
   COURSE
========================= */

102,

133
);

"helvetica",
"normal"
);

pdf.setFontSize(9);

113,
{
align:"center"
}
);


pdf.setTextColor(
23,
37,
84
);

pdf.setFont(
"times",
"bold"
);

pdf.setFontSize(17);

pdf.text(
certificateData.course,
W/2,
124,
{
align:"center",
maxWidth:210
}
);


/* =========================
   SCORE BOX
========================= */

pdf.setFillColor(
255,
248,
232
);

pdf.setDrawColor(
245,
158,
11
);

pdf.setLineWidth(.8);

pdf.roundedRect(
95,
134,
107,
18,
8,
8,
"FD"
);

71,

);

pdf.setFont(
"helvetica",
"bold"
);

pdf.setFontSize(8);

pdf.text(

122,
145,
{
align:"center"
}
);


pdf.setTextColor(
21,
94,
239
);

pdf.setFontSize(15);

pdf.text(

174,
146,
{

}

/* =========================

const y=175;


/* DATE */

/* =========================
   WEBSITE
========================= */

);

pdf.setFont(

);

========================= */

);

/* =========================
   FILE NAME
========================= */

const safeName =
certificateData.name
.replace(/[^a-z0-9]+/gi,"_")
.replace(/^_+|_+$/g,"");


pdf.save(
"CreateLK_Academy_Certificate_" +
safeName +
".pdf"
);

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

return String(
value ?? ""
).replace(
/[&<>"']/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

}
);

}


/* START */

start();

</script>
