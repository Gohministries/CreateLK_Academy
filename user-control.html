<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Control | CreateLK Academy</title><style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:700;
}

.logo span{
    color:#155eef;
}

.back{
    text-decoration:none;
    color:#475467;
    font-size:14px;
    font-weight:600;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

.card{
    background:#fff;
    border:1px solid #e4e7ec;
    border-radius:12px;
    padding:24px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

h1{
    margin:0 0 8px;
    font-size:25px;
}

.subtitle{
    margin:0 0 25px;
    color:#667085;
    font-size:14px;
}

.section{
    max-width:500px;
}

label{

    margin-bottom:6px;
    font-size:14px;

}

input{

    border-color:#155eef;

}

/* LOAD USERS BUTTON */
.load-button{
    display:block !important;
    width:auto !important;
    min-width:125px;
    height:44px;
    padding:0 18px;
    margin:0 !important;
    border:0 !important;
    border-radius:8px;
    background:#155eef !important;
    color:#ffffff !important;
    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:700;
    line-height:44px;
    text-align:center;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
}

.load-button:hover{
    background:#0d4dcc !important;
}

.load-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

#message{
    margin-top:15px;
    min-height:20px;
    font-size:14px;
}

.users-section{
    margin-top:30px;
}

.users-section h2{
    margin:0 0 15px;
    font-size:19px;
}

.user-list{
    border:1px solid #e4e7ec;
    border-radius:10px;
    overflow:hidden;
}

.empty{
    padding:25px;
    text-align:center;
    color:#667085;
    background:#fafafa;
    font-size:14px;
}

.user{
    padding:20px;
    border-bottom:1px solid #eaecf0;
}

.user:last-child{
    border-bottom:0;
}

.user-name{
    font-size:16px;
    font-weight:700;
}

.user-info{
    margin-top:8px;
    color:#667085;
    font-size:14px;
    line-height:1.8;
}

.status{
    display:inline-block;
    padding:4px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.active{
    background:#ecfdf3;
    color:#027a48;
}

.pending{
    background:#fffaeb;
    color:#b54708;
}

.expired{
    background:#fef3f2;
    color:#b42318;
}

.suspended{
    background:#f2f4f7;
    color:#344054;
}

.unknown{
    background:#f2f4f7;
    color:#667085;
}

.actions{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.actions button{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.activate{
    background:#027a48;
    color:#fff;
}

.extend{
    background:#155eef;
    color:#fff;
}

.suspend{
    background:#667085;
    color:#fff;
}

.delete{
    background:#d92d20;
    color:#fff;
}

footer{
    text-align:center;
    padding:25px 20px;
    color:#98a2b3;
    font-size:13px;
}

@media(max-width:600px){

    .header-inner{
        padding:15px;
    }

    .container{
        margin:20px auto;
        padding:0 15px;
    }

    .card{
        padding:18px;
    }

    h1{
        font-size:22px;
    }

    .load-button{
        width:100% !important;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .actions button{
        width:100%;
    }
}
</style></head><body><header>
<div class="header-inner"><div class="logo">
Create<span>LK</span> Academy
</div><a href="admin.html" class="back">
← Admin
</a></div>
</header><main class="container"><div class="card"><h1>User Control</h1><p class="subtitle">
Manage CreateLK Academy users and membership access.
</p><div class="section"><label for="adminKey">
Admin Key
</label><input
id="adminKey"
type="password"
placeholder="Enter Admin Key"
autocomplete="off"

«»

<button
id="loadButton"
class="load-button"
type="button"

«»

Load Users
</button>

<div id="message"></div></div><div class="users-section"><h2>Users</h2><div
id="userList"
class="user-list"
><div class="empty">
Enter Admin Key and click "Load Users".
</div></div></div></div></main><footer>
© 2026 CreateLK Academy. All rights reserved.
</footer><script>

const WORKER_URL =
"https://createlk-user-control-api.createlk.workers.dev";


const adminKey =
document.getElementById("adminKey");

const loadButton =
document.getElementById("loadButton");

const message =
document.getElementById("message");

const userList =
document.getElementById("userList");


loadButton.addEventListener(
"click",
loadUsers
);


adminKey.addEventListener(
"keydown",
function(e){

if(e.key === "Enter"){
loadUsers();
}

});


async function loadUsers(){

const key =
adminKey.value.trim();

if(!key){

showMessage(
"Please enter the Admin Key.",
"error"
);

return;
}


loadButton.disabled=true;

loadButton.textContent=
"Loading...";


userList.innerHTML=
`
<div class="empty">
Loading users...
</div>
`;


try{

const response=
await fetch(
WORKER_URL+"/students",
{
method:"GET",

headers:{
"X-Admin-Key":key,
"Authorization":"Bearer "+key,
"Accept":"application/json"
}
}
);


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Unable to load users."
);

}


if(!data.success){

throw new Error(
data.error ||
"Unable to load users."
);

}


const users=
data.users || [];


if(users.length===0){

userList.innerHTML=
`
<div class="empty">
No users found.
</div>
`;

showMessage(
"No users found.",
"normal"
);

return;
}


renderUsers(users);


showMessage(
users.length+
" user(s) loaded successfully.",
"success"
);

}
catch(error){

userList.innerHTML=
`
<div class="empty">
Unable to load users.
</div>
`;

showMessage(
error.message ||
"Connection error.",
"error"
);

}
finally{

loadButton.disabled=false;

loadButton.textContent=
"Load Users";

}

}


function renderUsers(users){

userList.innerHTML="";


users.forEach(function(user){

const firstName=
user.first_name || "";

const lastName=
user.last_name || "";

const fullName=
(
firstName+
" "+
lastName
).trim();

const name=
user.name ||
fullName ||
"Unnamed User";

const email=
user.email ||
"No email";

const phone=
user.phone ||
"No phone";

const status=
user.membership_status ||
user.status ||
"Unknown";

const expiry=
user.membership_expiry ||
user.expires_at ||
"—";

const id=
user.id;


const div=
document.createElement("div");

div.className="user";


div.innerHTML=
`
<div class="user-name">
${escapeHTML(name)}
</div>

<div class="user-info">

Email:
${escapeHTML(email)}

<br>

Phone:
${escapeHTML(phone)}

<br>

Membership:
<span class="status ${statusClass(status)}">
${escapeHTML(status)}
</span>

<br>

Expiry:
${escapeHTML(expiry)}

</div>

<div class="actions">

<button
class="activate"
onclick="activateUser(${id})"
>
Activate
</button>

<button
class="extend"
onclick="extendUser(${id})"
>
+30 Days
</button>

<button
class="suspend"
onclick="suspendUser(${id})"
>
Suspend
</button>

<button
class="delete"
onclick="deleteUser(${id})"
>
Delete
</button>

</div>
`;


userList.appendChild(div);

});

}


async function activateUser(id){

if(!confirm(
"Activate this user's membership for 30 days?"
)){
return;
}

await action(
"/activate",
id
);

}


async function extendUser(id){

if(!confirm(
"Extend this membership by 30 days?"
)){
return;
}

await action(
"/extend",
id
);

}


async function suspendUser(id){

if(!confirm(
"Suspend this user's membership?"
)){
return;
}

await action(
"/suspend",
id
);

}


async function deleteUser(id){

if(!confirm(
"Delete this user permanently?\n\nThis cannot be undone."
)){
return;
}

await action(
"/delete",
id
);

}


async function action(endpoint,id){

const key=
adminKey.value.trim();

if(!key){

showMessage(
"Admin Key is required.",
"error"
);

return;
}


showMessage(
"Processing...",
"normal"
);


try{

const response=
await fetch(
WORKER_URL+endpoint,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
key,

"Authorization":
"Bearer "+key
},

body:
JSON.stringify({
id:id
})
}
);


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Action failed."
);

}


if(!data.success){

throw new Error(
data.error ||
"Action failed."
);

}


showMessage(
data.message ||
"Action completed.",
"success"
);


await loadUsers();

}
catch(error){

showMessage(
error.message ||
"Action failed.",
"error"
);

}

}


function statusClass(status){

const value=
String(status).toLowerCase();

if(value.includes("active"))
return "active";

if(value.includes("pending"))
return "pending";

if(value.includes("expired"))
return "expired";

if(value.includes("suspend"))
return "suspended";

return "unknown";

}


function showMessage(text,type){

message.textContent=text;

if(type==="error"){

message.style.color="#d92d20";

}
else if(type==="success"){

message.style.color="#027a48";

}
else{

message.style.color="#475467";

}

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script></body>
</html>
