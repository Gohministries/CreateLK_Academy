</div></header><div class="container"><div class="title"><h1>User Control</h1><p>

</p></div><!-- ADMIN ACCESS --><div class="box"><label for="adminKey">

</label><input
id="adminKey"
type="password"
placeholder="Enter ADMIN_KEY"
autocomplete="off"

<button

</label><input

«»

</div><!-- USERS --><div id="users"><div class="box empty">
Enter your Admin Key and click "Load Users".
</div></div></div><script>

/*
==================================================
USER CONTROL CONFIGURATION
==================================================
*/

const API =
"https://createlk-user-control-api.createlk.workers.dev";


let allUsers = [];


/*
==================================================
ADMIN KEY
==================================================
*/

function getKey(){

    return document
        .getElementById("adminKey")
        .value
        .trim();

}


/*
==================================================
MESSAGE
==================================================
*/

function message(text){

    document
        .getElementById("message")
        .textContent = text;

}


/*
==================================================
LOAD USERS
==================================================
*/

async function loadUsers(){

    const key = getKey();

    if(!key){

        message("Enter Admin Key.");

        return;
    }

    message("Loading users...");

    try{

        const response =
            await fetch(
                API + "/api/admin/users",
                {
                    headers:{
                        "X-Admin-Key":key
                    }
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            message(
                data.message ||
                "Unable to load users."
            );

            return;
        }

        allUsers =
            data.users || [];

        document
            .getElementById("searchBox")
            .style.display =
            "block";

        displayUsers(allUsers);

        message(
            allUsers.length +
            " user(s) loaded."
        );

    }catch(error){

        console.error(error);

        message(
            "Unable to connect to User Control API."
        );

    }

}


/*
==================================================
DISPLAY USERS
==================================================
*/

function displayUsers(list){

    const container =
        document.getElementById("users");

    container.innerHTML = "";

    if(!list.length){

        container.innerHTML =
        `<div class="box empty">
            No users found.
        </div>`;

        return;
    }


    list.forEach(user => {

        const card =
            document.createElement("div");

        card.className =
            "user-card";

        const accountStatus =
            String(
                user.account_status ||
                "ACTIVE"
            ).toLowerCase();

        const premiumStatus =
            String(
                user.premium_status ||
                "NONE"
            ).toLowerCase();

        const certificateStatus =
            String(
                user.certificate_status ||
                "NOT_ELIGIBLE"
            ).toLowerCase();


        card.innerHTML = `

        <div class="user-header">

            <div>

                <h2>
                    ${safe(user.first_name)}
                    ${safe(user.last_name)}
                </h2>

                <div class="user-email">
                    ${safe(user.email)}
                </div>

            </div>

            <span class="status ${statusClass(accountStatus)}">
                ${safe(user.account_status || "ACTIVE")}
            </span>

        </div>


        <div class="info-grid">

            <div class="info">

                <small>Account</small>

                <strong>
                    ${safe(
                        user.account_status ||
                        "ACTIVE"
                    )}
                </strong>

            </div>


            <div class="info">

                <small>Premium</small>

                <strong>
                    ${safe(
                        user.premium_status ||
                        "NONE"
                    )}
                </strong>

            </div>


            <div class="info">

                <small>Expiry</small>

                <strong>
                    ${safe(
                        user.membership_expiry ||
                        "-"
                    )}
                </strong>

            </div>

        </div>


        <div class="section">

            <h3>
                Account Control
            </h3>

            <div class="actions">

                <button
                    class="success"
                    onclick="action(
                        'activate',
                        '${safeAttr(user.id)}'
                    )">
                    Activate
                </button>

                <button
                    class="warning"
                    onclick="action(
                        'deactivate',
                        '${safeAttr(user.id)}'
                    )">
                    Suspend
                </button>

                <button
                    class="danger"
                    onclick="action(
                        'ban',
                        '${safeAttr(user.id)}'
                    )">
                    Ban
                </button>

                <button
                    class="secondary"
                    onclick="action(
                        'unban',
                        '${safeAttr(user.id)}'
                    )">
                    Unban
                </button>

            </div>

        </div>


        <div class="section">

            <h3>
                Premium Control
            </h3>

            <div class="actions">

                <button
                    class="success"
                    onclick="action(
                        'premium-activate',
                        '${safeAttr(user.id)}'
                    )">
                    Activate Premium
                </button>

                <button
                    class="danger"
                    onclick="action(
                        'premium-cancel',
                        '${safeAttr(user.id)}'
                    )">
                    Cancel Premium
                </button>

                <button
                    class="primary"
                    onclick="action(
                        'premium-extend',
                        '${safeAttr(user.id)}'
                    )">
                    Extend 30 Days
                </button>

            </div>

        </div>


        <div class="section">

            <h3>
                Certificate
            </h3>

            <p style="margin:0 0 8px;font-size:13px;color:#667085;">
                Status:
                <b>
                    ${safe(
                        user.certificate_status ||
                        "NOT_ELIGIBLE"
                    )}
                </b>
            </p>

            <div class="actions">

                <button
                    class="danger"
                    onclick="action(
                        'certificate-revoke',
                        '${safeAttr(user.id)}'
                    )">
                    Revoke Certificate
                </button>

            </div>

        </div>

        `;

        container.appendChild(card);

    });

}


/*
==================================================
SEARCH
==================================================
*/

function filterUsers(){

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    if(!query){

        displayUsers(allUsers);

        return;
    }

    const filtered =
        allUsers.filter(user => {

            const name =
                (
                    (user.first_name || "") +
                    " " +
                    (user.last_name || "")
                ).toLowerCase();

            const email =
                String(
                    user.email || ""
                ).toLowerCase();

            const phone =
                String(
                    user.phone || ""
                ).toLowerCase();

            return (
                name.includes(query) ||
                email.includes(query) ||
                phone.includes(query)
            );

        });

    displayUsers(filtered);

}


/*
==================================================
ACTION
==================================================
*/

async function action(type,id){

    const labels = {

        "activate":
            "Activate this account?",

        "deactivate":
            "Suspend this account?",

        "ban":
            "Ban this user?",

        "unban":
            "Unban this user?",

        "premium-activate":
            "Activate premium for this user?",

        "premium-cancel":
            "Cancel this user's premium membership?",

        "premium-extend":
            "Extend premium membership by 30 days?",

        "certificate-revoke":
            "Revoke this certificate?"

    };


    if(!confirm(
        labels[type] ||
        "Continue with this action?"
    )){

        return;

    }


    const key = getKey();

    if(!key){

        message("Enter Admin Key.");

        return;

    }


    message("Processing...");


    const endpointMap = {

        "activate":
            "/api/admin/user/activate",

        "deactivate":
            "/api/admin/user/deactivate",

        "ban":
            "/api/admin/user/ban",

        "unban":
            "/api/admin/user/unban",

        "premium-activate":
            "/api/admin/user/premium/activate",

        "premium-cancel":
            "/api/admin/user/premium/cancel",

        "premium-extend":
            "/api/admin/user/premium/extend",

        "certificate-revoke":
            "/api/admin/user/certificate/revoke"

    };


    try{

        const response =
            await fetch(
                API +
                endpointMap[type],
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "X-Admin-Key":
                            key
                    },

                    body:
                        JSON.stringify({
                            student_id:id
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            message(
                data.message ||
                "Action failed."
            );

            return;

        }


        message(
            data.message ||
            "Action completed."
        );


        setTimeout(
            loadUsers,
            500
        );


    }catch(error){

        console.error(error);

        message(
            "Unable to connect to User Control API."
        );

    }

}


/*
==================================================
STATUS CLASS
==================================================
*/

function statusClass(status){

    if(
        status === "active"
    ){
        return "active";
    }

    if(
        status === "suspended"
    ){
        return "suspended";
    }

    if(
        status === "banned"
    ){
        return "banned";
    }

    if(
        status === "expired"
    ){
        return "expired";
    }

    return "none";

}


/*
==================================================
SECURITY
==================================================
*/

function safe(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeAttr(value){

    return String(
        value ?? ""
    )
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}

</script></body>
