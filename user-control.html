<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User Control | CreateLK Academy</title><style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {

}

.header-inner {
    max-width: 1100px;

    padding: 18px 20px;

}

}

}

    padding: 0 20px;

}

h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.subtitle {
    margin: 0 0 25px;
    color: #667085;
    font-size: 14px;
}

.control-box {
    max-width: 500px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 700;
    color: #344054;
}

input {
    display: block;
    width: 100%;
    height: 46px;
    padding: 12px;
    margin: 0 0 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;

    font-size: 14px;

}

input:focus {
    border-color: #155eef;
}

/* SIMPLE LOAD BUTTON */
#loadButton {
    display: block;
    visibility: visible;
    opacity: 1;
    width: 140px;
    height: 44px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 8px;
    background: #155eef;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

#loadButton:hover {
    background: #0d4dcc;
}

#loadButton:disabled {
    opacity: .6;
    cursor: wait;
}

#message {
    min-height: 20px;
    margin-top: 15px;
    font-size: 14px;
}

.users-section {
    margin-top: 30px;
}

.users-section h2 {
    margin: 0 0 15px;
    font-size: 19px;
}

.user-list {
    border: 1px solid #e4e7ec;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
}

.empty {
    padding: 25px;
    text-align: center;
    color: #667085;
    background: #fafafa;
    font-size: 14px;
}

.user {
    padding: 20px;
    border-bottom: 1px solid #eaecf0;
}

.user:last-child {
    border-bottom: none;
}

.user-name {
    font-size: 17px;
    font-weight: 700;
    color: #172033;
}

.user-info {
    margin-top: 8px;
    color: #667085;
    font-size: 14px;
    line-height: 1.8;
}

.status {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
}

.status-active {
    background: #ecfdf3;
    color: #027a48;
}

.status-pending {
    background: #fffaeb;
    color: #b54708;
}

.status-expired {
    background: #fef3f2;
    color: #b42318;
}

.status-suspended {
    background: #f2f4f7;
    color: #344054;
}

.status-unknown {
    background: #f2f4f7;
    color: #667085;
}

.actions {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.actions button {
    border: none;
    border-radius: 7px;
    padding: 9px 13px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.activate {
    background: #027a48;
    color: #ffffff;
}

.extend {
    background: #155eef;
    color: #ffffff;
}

.suspend {
    background: #667085;
    color: #ffffff;
}

.delete {
    background: #d92d20;
    color: #ffffff;
}

footer {
    text-align: center;
    padding: 25px 20px;
    color: #98a2b3;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        margin: 20px auto;
        padding: 0 15px;
    }

    .card {
        padding: 18px;
    }

    h1 {
        font-size: 22px;
    }

    #loadButton {
        width: 100%;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .actions button {
        width: 100%;
    }
}
</style></head><body><header>
    <div class="header-inner">    <div class="logo">
        Create<span>LK</span> Academy
    </div>

    <a href="admin.html" class="back">
        ← Admin
    </a>

</div>

</header><main class="container"><div class="card">

    <h1>User Control</h1>

    <p class="subtitle">
        Manage CreateLK Academy users and membership access.
    </p>


    <div class="control-box">

        <label for="adminKey">
            Admin Key
        </label>

        <input
            id="adminKey"
            type="password"
            placeholder="Enter Admin Key"
            autocomplete="off"
        >

        <button
            id="loadButton"
            type="button"
        >
            Load Users
        </button>

        <div id="message"></div>

    </div>


    <div class="users-section">

        <h2>Users</h2>

        <div
            id="userList"
            class="user-list"
        >

            <div class="empty">
                Enter Admin Key and click "Load Users".
            </div>

        </div>

    </div>

</div>

</main><footer>
    © 2026 CreateLK Academy. All rights reserved.
</footer><script>

const API =
    "https://createlk-user-control-api.createlk.workers.dev";


const keyInput =
    document.getElementById("adminKey");

const loadButton =
    document.getElementById("loadButton");

const message =
    document.getElementById("message");

const userList =
    document.getElementById("userList");


loadButton.onclick = loadUsers;


keyInput.onkeydown = function(event) {

    if (event.key === "Enter") {
        loadUsers();
    }

};


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    const key =
        keyInput.value.trim();


    if (!key) {

        setMessage(
            "Please enter the Admin Key.",
            "error"
        );

        return;
    }


    loadButton.disabled = true;

    loadButton.textContent = "Loading...";


    userList.innerHTML =
        '<div class="empty">Loading users...</div>';


    try {

        const response =
            await fetch(
                API + "/students",
                {
                    method: "GET",

                    headers: {
                        "X-Admin-Key": key,
                        "Authorization":
                            "Bearer " + key,
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load users."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Unable to load users."
            );

        }


        const users =
            Array.isArray(data.users)
            ? data.users
            : [];


        if (!users.length) {

            userList.innerHTML =
                '<div class="empty">No users found.</div>';

            setMessage(
                "No users found.",
                "normal"
            );

            return;
        }


        renderUsers(users);


        setMessage(
            users.length +
            " user(s) loaded successfully.",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        userList.innerHTML =
            '<div class="empty">Unable to load users.</div>';

        setMessage(
            error.message ||
            "Connection error.",
            "error"
        );

    }

    finally {

        loadButton.disabled = false;

        loadButton.textContent =
            "Load Users";

    }

}


/* =========================
   DISPLAY USERS
========================= */

function renderUsers(users) {

    userList.innerHTML = "";


    users.forEach(function(user) {

        const first =
            user.first_name || "";

        const last =
            user.last_name || "";

        const fullName =
            (first + " " + last).trim();


        const name =
            user.name ||
            fullName ||
            "Unnamed User";


        const email =
            user.email ||
            "—";


        const phone =
            user.phone ||
            "—";


        const status =
            user.membership_status ||
            "Unknown";


        const expiry =
            user.membership_expiry ||
            "—";


        const registered =
            user.created_at ||
            "—";


        const id =
            Number(user.id);


        const item =
            document.createElement("div");


        item.className =
            "user";


        item.innerHTML = `

            <div class="user-name">
                ${safe(name)}
            </div>

            <div class="user-info">

                Email:
                ${safe(email)}

                <br>

                Phone:
                ${safe(phone)}

                <br>

                Membership:
                <span class="status ${getStatusClass(status)}">
                    ${safe(status)}
                </span>

                <br>

                Expiry:
                ${safe(expiry)}

                <br>

                Registered:
                ${safe(registered)}

            </div>

            <div class="actions">

                <button
                    class="activate"
                    onclick="activateUser(${id})"
                >
                    Activate
                </button>

                <button
                    class="extend"
                    onclick="extendUser(${id})"
                >
                    +30 Days
                </button>

                <button
                    class="suspend"
                    onclick="suspendUser(${id})"
                >
                    Suspend
                </button>

                <button
                    class="delete"
                    onclick="deleteUser(${id})"
                >
                    Delete
                </button>

            </div>
        `;


        userList.appendChild(item);

    });

}


/* =========================
   ACTIVATE
========================= */

async function activateUser(id) {

    if (
        !confirm(
            "Activate this user's membership for 30 days?"
        )
    ) {
        return;
    }


    await sendAction(
        "/activate",
        id
    );

}


/* =========================
   EXTEND
========================= */

async function extendUser(id) {

    if (
        !confirm(
            "Extend this membership by 30 days?"
        )
    ) {
        return;
    }


    await sendAction(
        "/extend",
        id
    );

}


/* =========================
   SUSPEND
========================= */

async function suspendUser(id) {

    if (
        !confirm(
            "Suspend this user's membership?"
        )
    ) {
        return;
    }


    await sendAction(
        "/suspend",
        id
    );

}


/* =========================
   DELETE
========================= */

async function deleteUser(id) {

    if (
        !confirm(
            "Delete this user permanently?\n\nThis cannot be undone."
        )
    ) {
        return;
    }


    await sendAction(
        "/delete",
        id
    );

}


/* =========================
   ACTION
========================= */

async function sendAction(
    endpoint,
    id
) {

    const key =
        keyInput.value.trim();


    if (!key) {

        setMessage(
            "Admin Key is required.",
            "error"
        );

        return;
    }


    setMessage(
        "Processing...",
        "normal"
    );


    try {

        const response =
            await fetch(
                API + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-Admin-Key":
                            key,

                        "Authorization":
                            "Bearer " + key,

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id: id
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        setMessage(
            data.message ||
            "Action completed.",
            "success"
        );


        await loadUsers();

    }

    catch (error) {

        setMessage(
            error.message ||
            "Action failed.",
            "error"
        );

    }

}


/* =========================
   STATUS
========================= */

function getStatusClass(status) {

    const value =
        String(status).toLowerCase();


    if (value === "active")
        return "status-active";

    if (value === "pending")
        return "status-pending";

    if (value === "expired")
        return "status-expired";

    if (value === "suspended")
        return "status-suspended";

    return "status-unknown";
}


/* =========================
   MESSAGE
========================= */

function setMessage(
    text,
    type
) {

    message.textContent =
        text;


    if (type === "error") {

        message.style.color =
            "#d92d20";

    }
    else if (type === "success") {

        message.style.color =
            "#027a48";

    }
    else {

        message.style.color =
            "#475467";

    }

}


/* =========================
   SAFE TEXT
========================= */

function safe(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script></body>
</html>
