</button><div id="message"></div></div><div class="users-section"><h2>

const WORKER_URL =
    "https://createlk-user-control-api.createlk.workers.dev";


const adminKey =
    document.getElementById("adminKey");

const loadButton =
    document.getElementById("loadButton");

const message =
    document.getElementById("message");

const userList =
    document.getElementById("userList");


loadButton.addEventListener(
    "click",
    loadUsers
);


adminKey.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            loadUsers();
        }

    }
);


/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers(){

    const key =
        adminKey.value.trim();


    if(!key){

        showMessage(
            "Please enter the Admin Key.",
            "error"
        );

        return;
    }


    loadButton.disabled = true;

    loadButton.textContent =
        "Loading...";


    userList.innerHTML = `
        <div class="empty">
            Loading users...
        </div>
    `;


    showMessage(
        "Loading users...",
        "normal"
    );


    try{

        const response =
            await fetch(
                WORKER_URL + "/students",
                {
                    method:"GET",

                    headers:{
                        "X-Admin-Key":key,
                        "Authorization":
                            "Bearer " + key,
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Unable to load users."
            );

        }


        if(!data.success){

            throw new Error(
                data.error ||
                "Unable to load users."
            );

        }


        const users =
            data.users || [];


        if(users.length === 0){

            userList.innerHTML = `
                <div class="empty">
                    No users found.
                </div>
            `;

            showMessage(
                "No users found.",
                "normal"
            );

            return;
        }


        renderUsers(users);


        showMessage(
            users.length +
            " user(s) loaded successfully.",
            "success"
        );


    }
    catch(error){

        console.error(error);


        userList.innerHTML = `
            <div class="empty">
                Unable to load users.
            </div>
        `;


        showMessage(
            error.message ||
            "Connection error.",
            "error"
        );

    }
    finally{

        loadButton.disabled = false;

        loadButton.textContent =
            "Load Users";

    }

}


/* ==========================================
   RENDER USERS
========================================== */

function renderUsers(users){

    userList.innerHTML = "";


    users.forEach(function(user){

        const firstName =
            user.first_name || "";

        const lastName =
            user.last_name || "";


        const fullName =
            (
                firstName +
                " " +
                lastName
            ).trim();


        const name =
            user.name ||
            fullName ||
            "Unnamed User";


        const email =
            user.email ||
            "No email";


        const phone =
            user.phone ||
            "No phone";


        const status =
            user.membership_status ||
            user.status ||
            "Unknown";


        const expiry =
            user.membership_expiry ||
            user.expires_at ||
            "—";


        const id =
            user.id;


        const div =
            document.createElement("div");


        div.className =
            "user";


        div.innerHTML = `

            <div class="user-top">

                <div>

                    <div class="user-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="user-info">

                        Email:
                        ${escapeHTML(email)}

                        <br>

                        Phone:
                        ${escapeHTML(phone)}

                        <br>

                        Membership:
                        <span class="status ${statusClass(status)}">
                            ${escapeHTML(status)}
                        </span>

                        <br>

                        Expiry:
                        ${escapeHTML(expiry)}

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="activate"
                    onclick="activateUser(${id})"
                >
                    Activate
                </button>

                <button
                    class="extend"
                    onclick="extendUser(${id})"
                >
                    +30 Days
                </button>

                <button
                    class="suspend"
                    onclick="suspendUser(${id})"
                >
                    Suspend
                </button>

                <button
                    class="delete"
                    onclick="deleteUser(${id}, '${escapeJS(name)}')"
                >
                    Delete
                </button>

            </div>

        `;


        userList.appendChild(div);

    });

}


/* ==========================================
   ACTIVATE
========================================== */

async function activateUser(id){

    if(
        !confirm(
            "Activate this user's membership for 30 days?"
        )
    ){
        return;
    }


    await performAction(
        "/activate",
        id,
        "Membership activated successfully."
    );

}


/* ==========================================
   EXTEND
========================================== */

async function extendUser(id){

    if(
        !confirm(
            "Extend this membership by 30 days?"
        )
    ){
        return;
    }


    await performAction(
        "/extend",
        id,
        "Membership extended by 30 days."
    );

}


/* ==========================================
   SUSPEND
========================================== */

async function suspendUser(id){

    if(
        !confirm(
            "Suspend this user's membership?"
        )
    ){
        return;
    }


    await performAction(
        "/suspend",
        id,
        "User suspended successfully."
    );

}


/* ==========================================
   DELETE
========================================== */

async function deleteUser(
    id,
    name
){

    const confirmed =
        confirm(
            "DELETE this user permanently?\n\n" +
            name +
            "\n\nThis cannot be undone."
        );


    if(!confirmed){
        return;
    }


    await performAction(
        "/delete",
        id,
        "User deleted successfully."
    );

}


/* ==========================================
   ACTION REQUEST
========================================== */

async function performAction(
    endpoint,
    id,
    successMessage
){

    const key =
        adminKey.value.trim();


    if(!key){

        showMessage(
            "Admin Key is required.",
            "error"
        );

        return;
    }


    showMessage(
        "Processing...",
        "normal"
    );


    try{

        const response =
            await fetch(
                WORKER_URL + endpoint,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "X-Admin-Key":
                            key,

                        "Authorization":
                            "Bearer " + key,

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id:id
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        if(!data.success){

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        showMessage(
            successMessage,
            "success"
        );


        // Reload users
        await loadUsers();


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Action failed.",
            "error"
        );

    }

}


/* ==========================================
   STATUS CLASS
========================================== */

function statusClass(status){

    const value =
        String(status)
        .toLowerCase();


    if(
        value.includes("active")
    ){
        return "active";
    }


    if(
        value.includes("pending")
    ){
        return "pending";
    }


    if(
        value.includes("expired")
    ){
        return "expired";
    }


    if(
        value.includes("suspend")
    ){
        return "suspended";
    }


    return "unknown";
}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;


    if(type === "error"){

        message.style.color =
            "#d92d20";

    }
    else if(type === "success"){

        message.style.color =
            "#027a48";

    }
    else{

        message.style.color =
            "#475467";

    }

}


/* ==========================================
   HTML SECURITY
========================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJS(value){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        );

}
