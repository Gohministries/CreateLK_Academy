/* ==================================
   CREATELK USER CONTROL API
================================== */

const API_URL =
"https://createlk-user-control-api.createlk.workers.dev";


/* ==================================
   LOAD USERS
================================== */

async function loadUsers(){

    const key =
        document.getElementById("adminKey").value.trim();

    const button =
        document.getElementById("loadUsersButton");

    const message =
        document.getElementById("message");

    const list =
        document.getElementById("userList");


    /* CHECK KEY */

    if(!key){

        message.textContent =
            "Please enter the Admin Key.";

        message.style.color =
            "#d92d20";

        return;
    }


    /* BUTTON WORKING */

    button.disabled = true;

    button.textContent =
        "Loading...";


    message.textContent =
        "Connecting to User Control API...";

    message.style.color =
        "#475467";


    list.innerHTML =
        '<div class="empty">Loading users...</div>';


    try{

        const response =
            await fetch(
                API_URL + "/students",
                {
                    method:"GET",

                    headers:{
                        "X-Admin-Key":key,
                        "Authorization":"Bearer "+key,
                        "Accept":"application/json"
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "User Control API:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "API request failed."
            );

        }


        if(data.success !== true){

            throw new Error(
                data.error ||
                "Unable to load users."
            );

        }


        const users =
            data.users || [];


        if(!Array.isArray(users)){

            throw new Error(
                "Invalid users response."
            );

        }


        renderUsers(users);


        message.textContent =
            users.length +
            " user(s) loaded successfully.";

        message.style.color =
            "#027a48";

    }

    catch(error){

        console.error(error);


        list.innerHTML =
            '<div class="empty">Unable to load users.</div>';


        message.textContent =
            error.message ||
            "Connection error.";

        message.style.color =
            "#d92d20";

    }

    finally{

        button.disabled = false;

        button.textContent =
            "Load Users";

    }

}


/* ==================================
   DISPLAY USERS
================================== */

function renderUsers(users){

    const list =
        document.getElementById("userList");


    if(users.length === 0){

        list.innerHTML =
            '<div class="empty">No users found.</div>';

        return;
    }


    list.innerHTML = "";


    users.forEach(function(user){

        const id =
            user.id;


        const first =
            user.first_name || "";


        const last =
            user.last_name || "";


        const name =
            user.name ||
            (first + " " + last).trim() ||
            "Unnamed User";


        const email =
            user.email || "—";


        const phone =
            user.phone || "—";


        const membership =
            user.membership_status ||
            user.status ||
            "Unknown";


        const expiry =
            user.membership_expiry ||
            user.expires_at ||
            "—";


        const registered =
            user.created_at ||
            "—";


        const div =
            document.createElement("div");


        div.className =
            "user";


        div.innerHTML = `

            <div class="name">
                ${escapeHTML(name)}
            </div>

            <div class="info">

                Email:
                ${escapeHTML(email)}

                <br>

                Phone:
                ${escapeHTML(phone)}

                <br>

                Membership:
                ${escapeHTML(membership)}

                <br>

                Expiry:
                ${escapeHTML(expiry)}

                <br>

                Registered:
                ${escapeHTML(registered)}

            </div>

            <div class="actions">

                <button
                    class="activate"
                    onclick="activateUser(${id})"
                >
                    Activate
                </button>

                <button
                    class="extend"
                    onclick="extendUser(${id})"
                >
                    +30 Days
                </button>

                <button
                    class="suspend"
                    onclick="suspendUser(${id})"
                >
                    Suspend
                </button>

                <button
                    class="delete"
                    onclick="deleteUser(${id})"
                >
                    Delete
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* ==================================
   ACTIONS
================================== */

async function activateUser(id){

    if(!confirm(
        "Activate this user's membership for 30 days?"
    )){
        return;
    }

    await userAction(
        "/activate",
        id
    );

}


async function extendUser(id){

    if(!confirm(
        "Extend this membership by 30 days?"
    )){
        return;
    }

    await userAction(
        "/extend",
        id
    );

}


async function suspendUser(id){

    if(!confirm(
        "Suspend this user?"
    )){
        return;
    }

    await userAction(
        "/suspend",
        id
    );

}


async function deleteUser(id){

    if(!confirm(
        "Delete this user permanently?"
    )){
        return;
    }

    await userAction(
        "/delete",
        id
    );

}


/* ==================================
   USER ACTION API
================================== */

async function userAction(
    endpoint,
    id
){

    const key =
        document.getElementById("adminKey").value.trim();


    const message =
        document.getElementById("message");


    if(!key){

        message.textContent =
            "Please enter the Admin Key.";

        message.style.color =
            "#d92d20";

        return;
    }


    message.textContent =
        "Processing...";

    message.style.color =
        "#475467";


    try{

        const response =
            await fetch(
                API_URL + endpoint,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "X-Admin-Key":
                            key,

                        "Authorization":
                            "Bearer " + key
                    },

                    body:JSON.stringify({
                        id:id
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        if(data.success !== true){

            throw new Error(
                data.error ||
                "Action failed."
            );

        }


        message.textContent =
            data.message ||
            "Action completed.";

        message.style.color =
            "#027a48";


        await loadUsers();

    }

    catch(error){

        message.textContent =
            error.message ||
            "Action failed.";

        message.style.color =
            "#d92d20";

    }

}


/* ==================================
   SECURITY
================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
