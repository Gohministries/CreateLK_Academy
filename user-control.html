<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control | CreateLK Academy</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:700;
    color:#172033;
}

.logo span{
    color:#155eef;
}

.logout{
    text-decoration:none;
    color:#475467;
    font-size:14px;
    font-weight:600;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

.card{
    background:#fff;
    border:1px solid #e4e7ec;
    border-radius:12px;
    padding:24px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

h1{
    margin:0 0 8px;
    font-size:25px;
}

.subtitle{
    margin:0 0 25px;
    color:#667085;
    font-size:14px;
}

.section{
    max-width:500px;
}

label{
    display:block;
    margin-bottom:4px;
    font-size:14px;
    font-weight:700;
    color:#344054;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0 12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:14px;
    background:#fff !important;
    color:#172033;
    outline:none;
}

input:focus{
    border-color:#155eef;
    box-shadow:0 0 0 3px rgba(21,94,239,.10);
}

button{
    display:inline-block;
    border:0;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin:4px 3px;
    font-size:14px;
    background:#155eef;
    color:#fff;
}

button.primary{
    background:#155eef !important;
    color:#fff !important;
}

button.primary:hover{
    background:#0d4dcc !important;
}

button:active{
    transform:translateY(1px);
}

#message{
    margin-top:15px;
    font-size:14px;
    color:#475467;
}

.users-section{
    margin-top:30px;
}

.users-section h2{
    font-size:19px;
    margin:0 0 15px;
}

.user-list{
    border:1px solid #e4e7ec;
    border-radius:8px;
    overflow:hidden;
}

.empty{
    padding:20px;
    text-align:center;
    color:#667085;
    font-size:14px;
    background:#fafafa;
}

footer{
    text-align:center;
    padding:25px 20px;
    color:#98a2b3;
    font-size:13px;
}

@media(max-width:600px){

    .header-inner{
        padding:15px;
    }

    .container{
        margin:20px auto;
        padding:0 15px;
    }

    .card{
        padding:18px;
    }

    h1{
        font-size:22px;
    }

    button{
        width:100%;
        margin:4px 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">
            Create<span>LK</span> Academy
        </div>

        <a href="admin.html" class="logout">
            ← Admin
        </a>
    </div>
</header>

<main class="container">

    <div class="card">

        <h1>User Control</h1>

        <p class="subtitle">
            Manage CreateLK Academy users and membership access.
        </p>

        <div class="section">

            <label for="adminKey">Admin Key</label>

            <input
                id="adminKey"
                type="password"
                placeholder="Enter ADMIN_KEY"
                autocomplete="off"
            >

            <button
                type="button"
                class="primary"
                onclick="loadUsers()">
                Load Users
            </button>

            <div id="message"></div>

        </div>

        <div class="users-section">

            <h2>Users</h2>

            <div class="user-list">

                <div class="empty" id="userList">
                    Enter Admin Key and click "Load Users".
                </div>

            </div>

        </div>

    </div>

</main>

<footer>
    © 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

function loadUsers(){

    const adminKey = document.getElementById("adminKey").value.trim();
    const message = document.getElementById("message");

    if(!adminKey){

        message.textContent = "Please enter the Admin Key.";
        message.style.color = "#d92d20";

        return;
    }

    message.textContent = "Load Users button is working.";
    message.style.color = "#027a48";

    /*
        API connection will be added next.

        The button is intentionally not connected
        to the Worker yet.
    */
}

</script>

</body>
</html>
