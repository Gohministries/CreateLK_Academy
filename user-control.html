<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User Control | CreateLK Academy</title><style>

.user:last-child{

.user-info{

    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.status.active{
    background:#ecfdf3;
    color:#027a48;
}

.status.pending{
    background:#fffaeb;
    color:#b54708;
}

.status.expired{
    background:#fef3f2;
    color:#b42318;
}

.status.rejected{
    background:#fef3f2;
    color:#b42318;
}

.status.other{

footer{
    text-align:center;

    .header-inner{
        padding:15px;
    }

    .container{
        margin:20px auto;
        padding:0 15px;

    .card{

    }

</style></head><body><header><div class="header-inner">

    <div class="logo">
        Create<span>LK</span> Academy
    </div>

    <a href="admin.html" class="logout">
        ← Admin
    </a>

</div>

</header><main class="container"><div class="card">

    <h1>User Control</h1>

    <p class="subtitle">
        Manage CreateLK Academy users and membership access.
    </p>


    <div class="section">

        <label for="adminKey">
            Admin Key
        </label>

        <input
            id="adminKey"
            type="password"
            placeholder="Enter ADMIN_KEY"
            autocomplete="off"
        >

        <button
            type="button"
            id="loadButton"
            onclick="loadUsers()">
            Load Users
        </button>

        <div id="message"></div>

    </div>


    <div class="users-section">

        <h2>Users</h2>

        <div class="user-list" id="userList">

            <div class="empty">
                Enter Admin Key and click "Load Users".
            </div>

        </div>

    </div>

</div>

</main><footer>
    © 2026 CreateLK Academy. All rights reserved.
</footer><script>

/* ==========================================
   USER CONTROL WORKER
========================================== */

const WORKER_URL =
    "https://createlk-user-control-api.createlk.workers.dev";


/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers(){

    const adminKey =
        document.getElementById("adminKey").value.trim();

    const message =
        document.getElementById("message");

    const userList =
        document.getElementById("userList");

    const button =
        document.getElementById("loadButton");


    if(!adminKey){

        message.textContent =
            "Please enter the Admin Key.";

        message.style.color =
            "#d92d20";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Loading...";


    message.textContent =
        "Loading users...";

    message.style.color =
        "#475467";


    userList.innerHTML = `
        <div class="empty">
            Loading users...
        </div>
    `;


    try{

        const response = await fetch(
            WORKER_URL + "/students",
            {
                method:"GET",

                headers:{
                    "Authorization":
                        "Bearer " + adminKey,

                    "X-Admin-Key":
                        adminKey,

                    "Accept":
                        "application/json"
                }
            }
        );


        const responseText =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(responseText);

        }catch(error){

            console.error(
                "Invalid JSON:",
                responseText
            );

            throw new Error(
                "The Worker returned an invalid response."
            );
        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Admin authentication failed."
            );
        }


        let users = [];


        if(Array.isArray(data)){

            users = data;

        }
        else if(
            data.students &&
            Array.isArray(data.students)
        ){

            users = data.students;

        }
        else if(
            data.users &&
            Array.isArray(data.users)
        ){

            users = data.users;

        }
        else if(
            data.results &&
            Array.isArray(data.results)
        ){

            users = data.results;

        }
        else if(
            data.data &&
            Array.isArray(data.data)
        ){

            users = data.data;
        }


        if(users.length === 0){

            userList.innerHTML = `
                <div class="empty">
                    No users found.
                </div>
            `;

            message.textContent =
                "Connected successfully, but no users were returned.";

            message.style.color =
                "#027a48";

            return;
        }


        displayUsers(users);


        message.textContent =
            users.length +
            " user(s) loaded successfully.";

        message.style.color =
            "#027a48";


    }
    catch(error){

        console.error(
            "User loading error:",
            error
        );


        userList.innerHTML = `
            <div class="empty">
                Unable to load users.
            </div>
        `;


        message.textContent =
            error.message ||
            "Connection error. Please try again.";

        message.style.color =
            "#d92d20";

    }
    finally{

        button.disabled = false;

        button.textContent =
            "Load Users";

    }

}


/* ==========================================
   DISPLAY USERS
========================================== */

function displayUsers(users){

    const userList =
        document.getElementById("userList");


    userList.innerHTML = "";


    users.forEach(function(user){

        const firstName =
            user.first_name || "";

        const lastName =
            user.last_name || "";


        let name =
            user.name ||
            (firstName + " " + lastName).trim() ||
            "Unnamed User";


        const email =
            user.email ||
            "No email";


        const phone =
            user.phone ||
            "No phone";


        const status =
            user.membership_status ||
            user.status ||
            "Unknown";


        const expiry =
            user.membership_expiry ||
            user.expires_at ||
            user.expiry ||
            "—";


        const div =
            document.createElement("div");


        div.className =
            "user";


        div.innerHTML = `

            <div class="user-name">
                ${escapeHTML(name)}
            </div>

            <div class="user-info">

                Email:
                ${escapeHTML(email)}

                <br>

                Phone:
                ${escapeHTML(phone)}

                <br>

                Membership:
                <span class="status ${getStatusClass(status)}">
                    ${escapeHTML(status)}
                </span>

                <br>

                Expiry:
                ${escapeHTML(expiry)}

            </div>

        `;


        userList.appendChild(div);

    });

}


/* ==========================================
   STATUS CLASS
========================================== */

function getStatusClass(status){

    const value =
        String(status).toLowerCase();


    if(value === "active" ||
       value.includes("active")){

        return "active";
    }


    if(value === "pending" ||
       value.includes("pending")){

        return "pending";
    }


    if(value === "expired" ||
       value.includes("expired")){

        return "expired";
    }


    if(value === "rejected" ||
       value.includes("rejected")){

        return "rejected";
    }


    return "other";
}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* ==========================================
   ENTER KEY
========================================== */

document
    .getElementById("adminKey")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                loadUsers();

            }

        }
    );

</script></body>
</html>
