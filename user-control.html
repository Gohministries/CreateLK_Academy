.status.pending{

.status.expired{

    text-align:center;

</style></head><body><header><div class="header-inner">

    <div class="logo">
        Create<span>LK</span> Academy
    </div>

    <a href="admin.html" class="logout">
        ← Admin
    </a>

</div>

</header><main class="container"><div class="card">

    <h1>User Control</h1>

    <p class="subtitle">
        Manage CreateLK Academy users and membership access.
    </p>


    <div class="section">

        <label for="adminKey">
            Admin Key
        </label>

        <input
            id="adminKey"
            type="password"
            placeholder="Enter Admin Key"
            autocomplete="off"
        >

        <button
            type="button"
            id="loadButton">
            Load Users
        </button>

        <div id="message"></div>

    </div>


    <div class="users-section">

        <h2>Users</h2>

        <div
            class="user-list"
            id="userList">

            <div class="empty">
                Enter Admin Key and click "Load Users".
            </div>

        </div>

    </div>

</div>

</main><footer>
    © 2026 CreateLK Academy. All rights reserved.
</footer><script>

/* =========================================
   USER CONTROL API
========================================= */

const WORKER_URL =
    "https://createlk-user-control-api.createlk.workers.dev";


/* =========================================
   ELEMENTS
========================================= */

const adminKeyInput =
    document.getElementById("adminKey");

const loadButton =
    document.getElementById("loadButton");

const message =
    document.getElementById("message");

const userList =
    document.getElementById("userList");


/* =========================================
   LOAD USERS
========================================= */

loadButton.addEventListener(
    "click",
    loadUsers
);


adminKeyInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loadUsers();

        }

    }
);


async function loadUsers(){

    const adminKey =
        adminKeyInput.value.trim();


    if(!adminKey){

        showMessage(
            "Please enter the Admin Key.",
            "error"
        );

        adminKeyInput.focus();

        return;
    }


    loadButton.disabled = true;

    loadButton.textContent =
        "Loading...";


    showMessage(
        "Connecting to User Control API...",
        "normal"
    );


    userList.innerHTML = `
        <div class="empty">
            Loading users...
        </div>
    `;


    try{

        const response =
            await fetch(
                WORKER_URL + "/students",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json",

                        "X-Admin-Key":
                            adminKey,

                        "Authorization":
                            "Bearer " + adminKey
                    }
                }
            );


        const responseText =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(responseText);

        }
        catch(error){

            console.error(
                "Worker response:",
                responseText
            );

            throw new Error(
                "The server returned an invalid response."
            );
        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "Unable to load users."
            );
        }


        if(
            data.success === false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "Request failed."
            );
        }


        let users = [];


        if(
            Array.isArray(data.users)
        ){

            users =
                data.users;

        }
        else if(
            Array.isArray(data.students)
        ){

            users =
                data.students;

        }
        else if(
            Array.isArray(data.results)
        ){

            users =
                data.results;

        }
        else if(
            Array.isArray(data.data)
        ){

            users =
                data.data;

        }
        else if(
            Array.isArray(data)
        ){

            users =
                data;

        }


        if(users.length === 0){

            userList.innerHTML = `
                <div class="empty">
                    No users found in the database.
                </div>
            `;

            showMessage(
                "Connected successfully. No users found.",
                "success"
            );

            return;
        }


        renderUsers(users);


        showMessage(
            users.length +
            " user(s) loaded successfully.",
            "success"
        );


    }
    catch(error){

        console.error(
            "Load users error:",
            error
        );


        userList.innerHTML = `
            <div class="empty">
                Unable to load users.
            </div>
        `;


        showMessage(
            error.message ||
            "Connection error. Please try again.",
            "error"
        );

    }
    finally{

        loadButton.disabled = false;

        loadButton.textContent =
            "Load Users";

    }

}


/* =========================================
   DISPLAY USERS
========================================= */

function renderUsers(users){

    userList.innerHTML = "";


    users.forEach(
        function(user){

            const firstName =
                user.first_name ||
                "";

            const lastName =
                user.last_name ||
                "";


            const fullName =
                (
                    firstName +
                    " " +
                    lastName
                ).trim();


            const name =
                user.name ||
                fullName ||
                "Unnamed User";


            const email =
                user.email ||
                "No email";


            const phone =
                user.phone ||
                "No phone";


            const membership =
                user.membership_status ||
                user.status ||
                "Unknown";


            const expiry =
                user.membership_expiry ||
                user.expires_at ||
                user.expiry ||
                "—";


            const created =
                user.created_at ||
                "—";


            const userElement =
                document.createElement(
                    "div"
                );


            userElement.className =
                "user";


            userElement.innerHTML = `

                <div class="user-name">
                    ${escapeHTML(name)}
                </div>

                <div class="user-info">

                    Email:
                    ${escapeHTML(email)}

                    <br>

                    Phone:
                    ${escapeHTML(phone)}

                    <br>

                    Membership:
                    <span class="status ${getStatusClass(membership)}">
                        ${escapeHTML(membership)}
                    </span>

                    <br>

                    Expiry:
                    ${escapeHTML(expiry)}

                    <br>

                    Registered:
                    ${escapeHTML(created)}

                </div>

            `;


            userList.appendChild(
                userElement
            );

        }
    );

}


/* =========================================
   STATUS
========================================= */

function getStatusClass(status){

    const value =
        String(status)
        .toLowerCase();


    if(
        value.includes("active")
    ){

        return "active";

    }


    if(
        value.includes("pending")
    ){

        return "pending";

    }


    if(
        value.includes("expired")
    ){

        return "expired";

    }


    if(
        value.includes("reject")
    ){

        return "rejected";

    }


    return "other";
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;


    if(type === "error"){

        message.style.color =
            "#d92d20";

    }
    else if(type === "success"){

        message.style.color =
            "#027a48";

    }
    else{

        message.style.color =
            "#475467";

    }

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script></body>
