<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Payouts | CreateLK Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
  color:#155eef;
}

.back{
  background:#eef4ff;
  color:#155eef;
  padding:9px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:32px 20px 50px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  color:#667085;
  font-size:14px;
}

.message{
  display:none;
  padding:12px 15px;
  border-radius:9px;
  margin-bottom:20px;
  text-align:center;
  font-size:14px;
}

.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
  border:1px solid #abefc6;
}

.error{
  display:block;
  background:#fff1f2;
  color:#be123c;
  border:1px solid #fecdd3;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.summary-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:22px;
  text-align:center;
  box-shadow:0 2px 8px rgba(16,24,40,.04);
}

.summary-icon{
  font-size:25px;
  margin-bottom:8px;
}

.summary-number{
  font-size:25px;
  font-weight:800;
  margin-bottom:5px;
}

.summary-label{
  color:#667085;
  font-size:13px;
}

.toolbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:15px;
}

.refresh{
  border:0;
  background:#155eef;
  color:#fff;
  padding:11px 18px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.requests{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.payout{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:22px;
  box-shadow:0 2px 8px rgba(16,24,40,.04);
}

.payout-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.payout-title{
  font-size:18px;
  font-weight:800;
}

.payout-date{
  color:#667085;
  font-size:13px;
  margin-top:4px;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.status.pending{
  background:#fff7ed;
  color:#c2410c;
}

.status.paid{
  background:#ecfdf3;
  color:#027a48;
}

.status.rejected{
  background:#fff1f2;
  color:#be123c;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.detail{
  background:#f8fafc;
  border:1px solid #edf0f4;
  border-radius:10px;
  padding:13px;
}

.detail-label{
  color:#667085;
  font-size:12px;
  margin-bottom:5px;
}

.detail-value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.amount-box{
  background:#eef4ff;
  border:1px solid #dbe7ff;
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
  text-align:center;
}

.amount-label{
  color:#667085;
  font-size:12px;
  margin-bottom:4px;
}

.amount{
  color:#155eef;
  font-size:24px;
  font-weight:800;
}

.bank-section{
  margin-top:15px;
}

.bank-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}

.bank-details{
  background:#f8fafc;
  border:1px solid #edf0f4;
  border-radius:10px;
  padding:15px;
}

.bank-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

.bank-row:last-child{
  border-bottom:0;
}

.bank-label{
  color:#667085;
}

.bank-value{
  font-weight:bold;
  text-align:right;
  word-break:break-word;
}

.copy-btn{
  border:0;
  background:#eef4ff;
  color:#155eef;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  margin-left:5px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.paid-btn,
.reject-btn{
  flex:1;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.paid-btn{
  background:#16a34a;
  color:#fff;
}

.reject-btn{
  background:#fff1f2;
  color:#be123c;
  border:1px solid #fecdd3;
}

.paid-btn:disabled,
.reject-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  color:#667085;
}

.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:35px;
  text-align:center;
  color:#667085;
}

footer{
  text-align:center;
  padding:30px;
  color:#98a2b3;
  font-size:12px;
}

@media(max-width:700px){

  .summary{
    grid-template-columns:1fr;
  }

  .details{
    grid-template-columns:1fr;
  }

  .payout-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .bank-row{
    flex-direction:column;
    gap:4px;
  }

  .bank-value{
    text-align:left;
  }

  .actions{
    flex-direction:column;
  }

  .header h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>


<main class="container">

<div id="message" class="message"></div>

<div class="header">

<h1>💳 Affiliate Payouts</h1>

<p>
View and manage affiliate payout requests.
</p>

</div>


<section class="summary">

<div class="summary-card">

<div class="summary-icon">⏳</div>

<div id="pendingCount" class="summary-number">
0
</div>

<div class="summary-label">
Pending Requests
</div>

</div>


<div class="summary-card">

<div class="summary-icon">💰</div>

<div id="pendingAmount" class="summary-number">
LKR 0
</div>

<div class="summary-label">
Pending Amount
</div>

</div>


<div class="summary-card">

<div class="summary-icon">💵</div>

<div id="paidCount" class="summary-number">
0
</div>

<div class="summary-label">
Paid Requests
</div>

</div>

</section>


<div class="toolbar">

<button
class="refresh"
onclick="loadPayouts()">

🔄 Refresh

</button>

</div>


<div id="requests" class="requests">

<div class="loading">
⏳ Loading payout requests...
</div>

</div>

</main>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

/* =========================================
   SETTINGS
========================================= */

const API =
"https://createlk-affiliate-payout.createlk.workers.dev";


/* =========================================
   ADMIN TOKEN
========================================= */

const token =
sessionStorage.getItem("createlk_token");


/*
   If your admin Worker uses another
   authentication system, change only
   the Authorization header below.
*/


/* =========================================
   MESSAGE
========================================= */

function showMessage(
text,
type="success"
){

const box =
document.getElementById("message");

box.textContent =
text;

box.className =
"message " + type;

box.style.display =
"block";

setTimeout(()=>{
box.style.display="none";
},5000);

}


/* =========================================
   MONEY
========================================= */

function money(value){

return "LKR " +
Number(value || 0).toLocaleString();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   COPY
========================================= */

async function copyText(
value
){

try{

await navigator.clipboard.writeText(
String(value || "")
);

showMessage(
"Copied successfully."
);

}catch(error){

const textarea =
document.createElement("textarea");

textarea.value =
String(value || "");

document.body.appendChild(
textarea
);

textarea.select();

document.execCommand("copy");

textarea.remove();

showMessage(
"Copied successfully."
);

}

}


/* =========================================
   LOAD PAYOUTS
========================================= */

async function loadPayouts(){

const container =
document.getElementById(
"requests"
);

container.innerHTML =
'<div class="loading">⏳ Loading payout requests...</div>';

try{

const response =
await fetch(
API + "/api/payout/admin",
{
headers:{
"Authorization":
"Bearer " + token
}
}
);

if(!response.ok){

throw new Error(
"Unable to load payout requests."
);

}

const data =
await response.json();

console.log(
"Admin payouts:",
data
);


if(!data.success){

throw new Error(
data.message ||
"Unable to load payout requests."
);

}


const payouts =
data.payouts ||
data.requests ||
data.data ||
[];


renderPayouts(
payouts
);


}catch(error){

console.error(
"Load payouts:",
error
);

container.innerHTML =
'<div class="empty">❌ ' +
escapeHTML(error.message) +
'</div>';

showMessage(
error.message,
"error"
);

}

}


/* =========================================
   RENDER
========================================= */

function renderPayouts(
payouts
){

const container =
document.getElementById(
"requests"
);

let pendingCount=0;
let pendingAmount=0;
let paidCount=0;


payouts.forEach(
p => {

const status =
String(
p.status || ""
).toUpperCase();

if(status==="PENDING"){

pendingCount++;

pendingAmount +=
Number(
p.amount || 0
);

}

if(status==="PAID"){

paidCount++;

}

});


document.getElementById(
"pendingCount"
).textContent =
pendingCount.toLocaleString();


document.getElementById(
"pendingAmount"
).textContent =
money(pendingAmount);


document.getElementById(
"paidCount"
).textContent =
paidCount.toLocaleString();


if(!payouts.length){

container.innerHTML =
`
<div class="empty">

<div style="font-size:35px;margin-bottom:10px">
💳
</div>

No affiliate payout requests found.

</div>
`;

return;

}


/*
   Newest first
*/

payouts.sort(
(a,b)=>
Number(b.id||0) -
Number(a.id||0)
);


container.innerHTML =
payouts.map(
payoutCard
).join("");

}


/* =========================================
   PAYOUT CARD
========================================= */

function payoutCard(
p
){

const status =
String(
p.status || "PENDING"
).toUpperCase();


let statusClass =
"pending";

if(status==="PAID")
statusClass="paid";

if(status==="REJECTED")
statusClass="rejected";


const details =
p.payment_details ||
p.paymentDetails ||
{};


let bank={};

if(
typeof details ===
"string"
){

try{

bank =
JSON.parse(details);

}catch(e){

bank={
payment_details:
details
};

}

}else{

bank =
details || {};

}


/*
   Support different Worker response
   property names.
*/

const accountName =
p.account_name ||
bank.account_name ||
"";


const bankName =
p.bank_name ||
bank.bank_name ||
"";


const accountNumber =
p.account_number ||
bank.account_number ||
"";


const branchName =
p.branch_name ||
bank.branch_name ||
p.branch ||
bank.branch_name ||
"";


const affiliateId =
p.affiliate_id ||
p.affiliateId ||
"";


const studentId =
p.student_id ||
p.studentId ||
"";


const requested =
p.requested_at ||
p.created_at ||
p.createdAt ||
"";


const amount =
Number(
p.amount || 0
);


let actions="";


if(status==="PENDING"){

actions =
`
<div class="actions">

<button
class="paid-btn"
onclick="markPaid(${Number(p.id)})">

✅ Mark Paid

</button>

<button
class="reject-btn"
onclick="rejectPayout(${Number(p.id)})">

❌ Reject

</button>

</div>
`;

}


return `
<article class="payout">

<div class="payout-top">

<div>

<div class="payout-title">
💳 Payout #${escapeHTML(p.id)}
</div>

<div class="payout-date">
Requested: ${escapeHTML(requested)}
</div>

</div>

<div class="status ${statusClass}">
${escapeHTML(status)}
</div>

</div>


<div class="amount-box">

<div class="amount-label">
Payout Amount
</div>

<div class="amount">
${money(amount)}
</div>

</div>


<div class="details">

<div class="detail">

<div class="detail-label">
Affiliate ID
</div>

<div class="detail-value">
${escapeHTML(affiliateId)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Student ID
</div>

<div class="detail-value">
${escapeHTML(studentId)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Payment Method
</div>

<div class="detail-value">
${escapeHTML(
p.payment_method ||
"BANK_TRANSFER"
)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Email
</div>

<div class="detail-value">
${escapeHTML(
p.email || "Not provided"
)}
</div>

</div>

</div>


<div class="bank-section">

<div class="bank-title">
🏦 Bank Account Details
</div>


<div class="bank-details">


<div class="bank-row">

<span class="bank-label">
Account Name
</span>

<span class="bank-value">
${escapeHTML(
accountName || "Not provided"
)}
</span>

</div>


<div class="bank-row">

<span class="bank-label">
Bank Name
</span>

<span class="bank-value">
${escapeHTML(
bankName || "Not provided"
)}
</span>

</div>


<div class="bank-row">

<span class="bank-label">
Account Number
</span>

<span class="bank-value">

${escapeHTML(
accountNumber || "Not provided"
)}

${
accountNumber
?
`<button
class="copy-btn"
onclick='copyText(${JSON.stringify(String(accountNumber))})'>
📋 Copy
</button>`
:""
}

</span>

</div>


<div class="bank-row">

<span class="bank-label">
Branch
</span>

<span class="bank-value">
${escapeHTML(
branchName || "Not provided"
)}
</span>

</div>


</div>

</div>


${actions}

</article>
`;

}


/* =========================================
   MARK PAID
========================================= */

async function markPaid(
id
){

if(
!confirm(
"Mark payout #" +
id +
" as PAID?"
)
){

return;

}


try{

const response =
await fetch(
API + "/api/payout/paid",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer " + token
},

body:JSON.stringify({
id:Number(id)
})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to mark payout as paid."
);

}


showMessage(
"Payout #" +
id +
" marked as PAID."
);


await loadPayouts();


}catch(error){

console.error(
"Mark paid:",
error
);

showMessage(
error.message,
"error"
);

}

}


/* =========================================
   REJECT
========================================= */

async function rejectPayout(
id
){

if(
!confirm(
"Reject payout #" +
id +
"?\n\nThe payout will not be paid."
)
){

return;

}


try{

const response =
await fetch(
API + "/api/payout/reject",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer " + token
},

body:JSON.stringify({
id:Number(id)
})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to reject payout."
);

}


showMessage(
"Payout #" +
id +
" rejected."
);


await loadPayouts();


}catch(error){

console.error(
"Reject payout:",
error
);

showMessage(
error.message,
"error"
);

}

}


/* =========================================
   START
========================================= */

loadPayouts();

</script>

</body>
</html>
