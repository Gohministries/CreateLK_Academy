</div><div class="stat-label">

</div></div><div class="stat"><div class="stat-icon">💵</div><div id="paidCount" class="stat-number">

© 2026 CreateLK Academy. All rights reserved.
</footer><script>

/* =========================================
   SETTINGS
========================================= */

const API =
"https://createlk-affiliate-payout.createlk.workers.dev";

/*
 IMPORTANT:
 Ideally the Admin Key should NOT be placed
 directly inside public HTML.

 Your Worker should check the key.
*/

const ADMIN_KEY =
"YOUR_ADMIN_KEY";


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="success"){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message " + type;

box.style.display = "block";

setTimeout(()=>{
box.style.display="none";
},5000);

}


/* =========================================
   MONEY
========================================= */

function money(value){

return "LKR " +
Number(value || 0).toLocaleString();

}


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   COPY
========================================= */

async function copyText(value){

try{

await navigator.clipboard.writeText(value);

showMessage("Copied successfully.");

}catch(e){

const input =
document.createElement("input");

input.value=value;

document.body.appendChild(input);

input.select();

document.execCommand("copy");

input.remove();

showMessage("Copied successfully.");

}

}


/* =========================================
   LOAD PAYOUTS
========================================= */

async function loadPayouts(){

const list =
document.getElementById("list");

list.innerHTML =
'<div class="loading">⏳ Loading payout requests...</div>';

try{

const response =
await fetch(
API + "/api/admin/payouts",
{
method:"GET",
headers:{
"Authorization":
"Bearer " + ADMIN_KEY,
"X-Admin-Key":
ADMIN_KEY
}
}
);

const data =
await response.json();

if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to load payout requests."
);

}

const payouts =
Array.isArray(data.payouts)
? data.payouts
: [];

renderPayouts(payouts);

}catch(error){

console.error(error);

list.innerHTML =
'<div class="empty">❌ ' +
esc(error.message) +
'</div>';

showMessage(
error.message ||
"Failed to fetch payout requests.",
"error"
);

}

}


/* =========================================
   RENDER
========================================= */

function renderPayouts(payouts){

const list =
document.getElementById("list");

let pendingCount=0;
let pendingAmount=0;
let paidCount=0;

payouts.forEach(p=>{

const status =
String(p.status || "PENDING").toUpperCase();

if(status==="PENDING"){

pendingCount++;

pendingAmount +=
Number(p.amount || 0);

}

if(status==="PAID"){

paidCount++;

}

});


document.getElementById(
"pendingCount"
).textContent =
pendingCount;


document.getElementById(
"pendingAmount"
).textContent =
money(pendingAmount);


document.getElementById(
"paidCount"
).textContent =
paidCount;


if(!payouts.length){

list.innerHTML =
'<div class="empty">' +
'📭 No affiliate payout requests found.' +
'</div>';

return;

}


list.innerHTML =
payouts.map(renderCard).join("");

}


/* =========================================
   CARD
========================================= */

function renderCard(p){

const id =
p.id || "";

const affiliateId =
p.affiliate_id || "";

const studentId =
p.student_id || "";

const amount =
Number(p.amount || 0);

const status =
String(p.status || "PENDING")
.toUpperCase();

const details =
parseDetails(p.payment_details);

const requested =
p.requested_at ||
p.created_at ||
"-";


let statusClass="pending";

if(status==="PAID")
statusClass="paid";

if(status==="REJECTED")
statusClass="rejected";


const actions =
status==="PENDING"

?

`
<div class="actions">

<button
class="action paid-btn"
onclick="updateStatus(${Number(id)},'PAID')">

✅ Mark as Paid

</button>

<button
class="action reject-btn"
onclick="updateStatus(${Number(id)},'REJECTED')">

❌ Reject

</button>

</div>
`

:

`
<div class="actions">

<button
class="action disabled"
disabled>

${status==="PAID" ? "✅ Payment Completed" : "❌ Request Rejected"}

</button>

</div>
`;


return `

<div class="card">

<div class="card-top">

<div class="request-id">
Payout Request #${esc(id)}
</div>

<div class="status ${statusClass}">
${esc(status)}
</div>

</div>


<div class="details">

<div class="detail">

<div class="detail-label">
Affiliate
</div>

<div class="detail-value">
Affiliate ID: ${esc(affiliateId)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Student
</div>

<div class="detail-value">
Student ID: ${esc(studentId)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Amount
</div>

<div class="detail-value">
${money(amount)}
</div>

</div>


<div class="detail">

<div class="detail-label">
Requested
</div>

<div class="detail-value">
${esc(requested)}
</div>

</div>

</div>


<div class="bank">

<div class="bank-title">
🏦 Bank Details
</div>


<div class="bank-row">

<span>Account Name</span>

<strong>
${esc(details.account_name || "-")}
</strong>

<button
class="copy"
onclick="copyText('${safe(details.account_name)}')">

Copy

</button>

</div>


<div class="bank-row">

<span>Bank Name</span>

<strong>
${esc(details.bank_name || "-")}
</strong>

<button
class="copy"
onclick="copyText('${safe(details.bank_name)}')">

Copy

</button>

</div>


<div class="bank-row">

<span>Account Number</span>

<strong>
${esc(details.account_number || "-")}
</strong>

<button
class="copy"
onclick="copyText('${safe(details.account_number)}')">

Copy

</button>

</div>


<div class="bank-row">

<span>Branch</span>

<strong>
${esc(details.branch_name || "-")}
</strong>

<button
class="copy"
onclick="copyText('${safe(details.branch_name)}')">

Copy

</button>

</div>

</div>


${actions}

</div>

`;

}


/* =========================================
   PARSE PAYMENT DETAILS
========================================= */

function parseDetails(value){

if(!value){

return {};

}

if(typeof value==="object"){

return value;

}

try{

return JSON.parse(value);

}catch(e){

return {};

}

}


/* =========================================
   SAFE STRING FOR COPY BUTTON
========================================= */

function safe(value){

return String(value || "")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(id,status){

if(!id){

return;

}


const action =
status==="PAID"
? "mark this payout as PAID"
: "REJECT this payout";


if(!confirm(
"Are you sure you want to " +
action +
"?"

)){

return;

}


try{

const response =
await fetch(
API + "/api/admin/payout/" +
encodeURIComponent(id),
{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + ADMIN_KEY,

"X-Admin-Key":
ADMIN_KEY

},

body:JSON.stringify({

status:status

})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to update payout."
);

}


showMessage(
status==="PAID"
? "Payout marked as PAID successfully."
: "Payout rejected successfully."
);


await loadPayouts();


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to update payout.",
"error"
);

}

}


/* =========================================
   START
========================================= */

loadPayouts();


/* Auto refresh every 30 seconds */

setInterval(
loadPayouts,
30000
);

</script></body>
