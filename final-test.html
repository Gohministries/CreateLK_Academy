<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Final Assessment | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.nav{
    max-width:900px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#155eef;
}

.back{
    text-decoration:none;
    color:#475467;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 15px;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:25px;
}

.badge{
    display:inline-block;
    background:#dcfce7;
    color:#15803d;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

h1{
    margin:15px 0 8px;
}

.info{
    color:#667085;
    line-height:1.6;
}

.progress{
    margin:20px 0;
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#155eef;
    transition:.3s;
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin:25px 0 15px;
}

.option{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #d0d5dd;
    border-radius:9px;
    background:#f8fafc;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.option:hover{
    background:#eef4ff;
}

.option.selected{
    background:#e5efff;
    border-color:#155eef;
}

.btn{
    width:100%;
    border:0;
    border-radius:9px;
    padding:14px;
    margin-top:18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.next{
    background:#155eef;
    color:#fff;
}

.result{
    text-align:center;
    padding:20px 0;
}

.score{
    font-size:45px;
    font-weight:800;
    color:#155eef;
}

.pass{
    color:#16a34a;
    font-weight:bold;
}

.fail{
    color:#dc2626;
    font-weight:bold;
}

.hidden{
    display:none;
}

.error{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#fee2e2;
    color:#991b1b;
}

</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>

<div class="container">

<div class="card">

<div class="badge">
⭐ Premium Assessment
</div>

<h1>🎓 Final English Assessment</h1>

<p class="info">
Complete the final assessment to qualify for your
CreateLK Academy certificate.
</p>

<p class="info">
<strong>20 Questions</strong> ·
<strong>70% Pass Mark</strong>
</p>

<div id="startBox">

<button
class="btn next"
onclick="startTest()">

📝 Start Final Assessment

</button>

</div>

<div id="testBox" class="hidden">

<div id="questionNumber"></div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="question" class="question"></div>

<div id="options"></div>

<button
id="nextButton"
class="btn next"
onclick="nextQuestion()"
disabled>

Next Question →

</button>

</div>

<div id="resultBox" class="result hidden"></div>

<div id="errorBox" class="error hidden"></div>

</div>

</div>

<script>

const token =
sessionStorage.getItem("createlk_token");

const student =
JSON.parse(
sessionStorage.getItem("createlk_student") || "null"
);

if(!token || !student){
    window.location.href="login.html";
}


/*
   20 FINAL QUESTIONS

   These are sample questions for testing.
   Later we will connect this page to
   your secure Cloudflare Worker.
*/

const questions = [

{
q:"Choose the correct sentence.",
options:[
"She go to school every day.",
"She goes to school every day.",
"She going to school every day.",
"She gone to school every day."
],
answer:1
},

{
q:"Choose the correct past tense.",
options:[
"I go yesterday.",
"I goes yesterday.",
"I went yesterday.",
"I going yesterday."
],
answer:2
},

{
q:"Choose the correct article.",
options:[
"He is a doctor.",
"He is an doctor.",
"He is doctor.",
"He is the doctor always."
],
answer:0
},

{
q:"What is the opposite of 'difficult'?",
options:[
"Hard",
"Easy",
"Strong",
"Heavy"
],
answer:1
},

{
q:"Choose the correct plural form.",
options:[
"Childs",
"Childes",
"Children",
"Childrens"
],
answer:2
},

{
q:"Choose the correct sentence.",
options:[
"They are happy.",
"They is happy.",
"They am happy.",
"They be happy."
],
answer:0
},

{
q:"What is a synonym for 'quick'?",
options:[
"Slow",
"Fast",
"Late",
"Weak"
],
answer:1
},

{
q:"Choose the correct preposition: 'She lives ___ Colombo.'",
options:[
"at",
"on",
"in",
"by"
],
answer:2
},

{
q:"Choose the correct form: 'I ___ English every day.'",
options:[
"study",
"studies",
"studying",
"studied"
],
answer:0
},

{
q:"Which word is a noun?",
options:[
"Beautiful",
"Quickly",
"Teacher",
"Run"
],
answer:2
},

{
q:"Choose the correct sentence.",
options:[
"He have a car.",
"He has a car.",
"He having a car.",
"He haves a car."
],
answer:1
},

{
q:"What is the opposite of 'early'?",
options:[
"Fast",
"Late",
"Quick",
"First"
],
answer:1
},

{
q:"Choose the correct pronoun.",
options:[
"John is my friend. ___ is kind.",
"He",
"Her",
"They",
"It"
],
answer:0
},

{
q:"Choose the correct comparative form.",
options:[
"More tall",
"Taller",
"Most tall",
"Tallest"
],
answer:1
},

{
q:"Choose the correct conjunction.",
options:[
"I stayed home because it was raining.",
"I stayed home pencil it was raining.",
"I stayed home quickly it was raining.",
"I stayed home table it was raining."
],
answer:0
},

{
q:"Choose the correct sentence.",
options:[
"We was happy.",
"We were happy.",
"We is happy.",
"We be happy."
],
answer:1
},

{
q:"What is the synonym of 'begin'?",
options:[
"End",
"Start",
"Stop",
"Finish"
],
answer:1
},

{
q:"Choose the correct spelling.",
options:[
"Beautiful",
"Beautifull",
"Beutiful",
"Beautifol"
],
answer:0
},

{
q:"Choose the correct sentence.",
options:[
"She can sings.",
"She can singing.",
"She can sing.",
"She can sang."
],
answer:2
},

{
q:"Choose the correct future form.",
options:[
"I will study tomorrow.",
"I studied tomorrow.",
"I studying tomorrow.",
"I studies tomorrow."
],
answer:0
}

];

let currentQuestion = 0;
let score = 0;
let selected = null;

function startTest(){

document.getElementById("startBox")
.classList.add("hidden");

document.getElementById("testBox")
.classList.remove("hidden");

showQuestion();

}

function showQuestion(){

selected = null;

const q = questions[currentQuestion];

document.getElementById("questionNumber")
.textContent =
"Question "+
(currentQuestion+1)+
" of "+
questions.length;

document.getElementById("progressBar")
.style.width =
(
((currentQuestion)/questions.length)*100
)+"%";

document.getElementById("question")
.textContent = q.q;

const options =
document.getElementById("options");

options.innerHTML="";

q.options.forEach((text,index)=>{

const button =
document.createElement("button");

button.className="option";
button.type="button";
button.textContent=
String.fromCharCode(65+index)+". "+text;

button.onclick=function(){

document.querySelectorAll(".option")
.forEach(b=>{
b.classList.remove("selected");
});

button.classList.add("selected");

selected=index;

document.getElementById("nextButton")
.disabled=false;

};

options.appendChild(button);

});

document.getElementById("nextButton")
.textContent =
currentQuestion === questions.length-1
?
"Submit Assessment"
:
"Next Question →";

document.getElementById("nextButton")
.disabled=true;

}

function nextQuestion(){

if(selected===null)return;

const q=questions[currentQuestion];

if(selected===q.answer){
score++;
}

currentQuestion++;

if(currentQuestion>=questions.length){

finishTest();

return;

}

showQuestion();

}

function finishTest(){

document.getElementById("testBox")
.classList.add("hidden");

const result =
document.getElementById("resultBox");

result.classList.remove("hidden");

const percentage =
Math.round(
(score/questions.length)*100
);

if(percentage>=70){

result.innerHTML=`

<div class="score">
${percentage}%
</div>

<h2 class="pass">
🎉 Assessment Passed!
</h2>

<p>
You scored ${score} out of ${questions.length}.
</p>

<p>
You qualify for a CreateLK Academy certificate.
</p>

<button
class="btn next"
onclick="issueCertificate()">

🎓 Get My Certificate

</button>

`;

}else{

result.innerHTML=`

<div class="score">
${percentage}%
</div>

<h2 class="fail">
❌ Assessment Not Passed
</h2>

<p>
You scored ${score} out of ${questions.length}.
</p>

<p>
You need at least 70% to receive a certificate.
</p>

<button
class="btn next"
onclick="location.reload()">

🔄 Try Again

</button>

`;

}

}

function issueCertificate(){

alert(
"Certificate generation will be connected to the Cloudflare Worker in the next step."
);

}

</script>

</body>
</html>
