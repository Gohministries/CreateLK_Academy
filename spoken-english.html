<!DOCTYPE html><html lang="en">
<head>

<meta name="theme-color" content="#2563eb">
<title>CreateLK Academy | Daily Spoken English</title><style>

--p:#7c3aed;
--bg:#f4f7fb;

--muted:#64748b;

--gold:#f59e0b;

}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh
}

color:#fff;

}

.header-inner{
max-width:680px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{font-size:16px;font-weight:900}
.menu{font-size:21px}

.container{
width:100%;
max-width:680px;
margin:auto;
padding:10px 9px 25px
}

.hero{
background:#fff;
border-radius:16px;
padding:18px;
margin-bottom:11px;
text-align:center;
box-shadow:0 3px 12px rgba(15,23,42,.05)
}

.brand{
color:var(--b);
font-size:10px;
font-weight:900;
letter-spacing:.7px;
margin-bottom:6px
}

h1{
font-size:22px;
line-height:1.3;
margin-bottom:5px
}

.subtitle{
color:var(--muted);
font-size:12px;

}

.date{
margin-top:8px;

}

.membership{
background:linear-gradient(135deg,#fff7ed,#fffbeb);
border:1px solid #fed7aa;

margin-bottom:12px
}

.membership-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px
}

.membership-title{
color:#92400e;
font-size:13px;
font-weight:900
}

.status{
background:#dcfce7;
color:#166534;
border-radius:999px;
padding:5px 9px;
font-size:9px;
font-weight:900;
white-space:nowrap
}

.membership-text{
color:#78350f;
font-size:11px;
line-height:1.4;
margin-top:6px
}

.hidden{display:none!important}

.section-title{
font-size:17px;
font-weight:900;
text-align:center;
margin:15px 2px 8px
}

.note{
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1e40af;
border-radius:10px;
padding:9px 11px;
font-size:11px;
line-height:1.4;
margin-bottom:10px;
text-align:center
}

.lesson-grid{
display:flex;
flex-direction:column;
gap:9px
}

.card{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(15,23,42,.04)
}

.card.free{border-top:3px solid var(--green)}
.card.premium{border-top:3px solid var(--gold)}

.number{
color:var(--b);
font-size:9px;
font-weight:900;
margin-bottom:8px;
letter-spacing:.3px
}

.tamil{
font-size:15px;
font-weight:800;
line-height:1.5;
margin-bottom:7px
}

.sinhala{
color:#475569;
font-size:12px;
line-height:1.5;
margin-bottom:7px
}

.english{
color:#1e293b;
font-size:13px;
line-height:1.55;
font-weight:600
}

.listen{
border:0;
background:#eff6ff;
color:var(--b);
border-radius:8px;
padding:7px 10px;
margin-top:9px;
font-size:10px;
font-weight:800;
cursor:pointer
}

.badge{
display:inline-block;
margin-top:8px;
border-radius:999px;
padding:4px 7px;
font-size:8px;
font-weight:900
}

.free-badge{
background:#dcfce7;
color:#166534
}

.premium-badge{
background:#fef3c7;
color:#92400e
}

.premium-box{
background:linear-gradient(135deg,#fff7ed,#fffbeb);
border:2px solid #fbbf24;
border-radius:14px;
padding:15px;
text-align:center
}

.premium-box-title{
color:#92400e;
font-size:15px;
font-weight:900
}

.premium-box-text{
color:#78350f;
font-size:11px;
line-height:1.45;
margin-top:5px
}

.premium-button{
display:block;
width:100%;
background:linear-gradient(135deg,#f59e0b,#f97316);

font-weight:900;
cursor:pointer
}

.share-btn{
width:100%;
border:0;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
border-radius:10px;
padding:11px;
margin-top:11px;
font-size:12px;
font-weight:900;
cursor:pointer
}

background:#fff;
border-radius:12px;
padding:18px;
text-align:center;
color:var(--muted);
font-size:12px
}

.error{
background:#fef2f2;
border:1px solid #fecaca;
color:#991b1b;
border-radius:11px;
padding:12px;
font-size:12px;
line-height:1.4;
text-align:center
}

.footer{
text-align:center;
color:var(--muted);
font-size:10px;
padding:16px
}

@media(max-width:380px){
.container{padding-left:7px;padding-right:7px}
.hero{padding:15px}
h1{font-size:20px}
.tamil{font-size:14px}
.english{font-size:12px}
}
</style></head><body><header class="header">
<div class="header-inner">
<div class="logo">📚 CreateLK Academy</div>
<div class="menu">☰</div>
</div>
</header><main class="container"><section class="hero">
<div class="brand">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<p class="subtitle">
Learn Tamil → English conversations every day.
</p>
<div id="lessonDate" class="date">Loading...</div>
</section><section class="membership"><div class="membership-top">
<div class="membership-title">⭐ Premium Membership</div>
<div id="membershipStatus" class="status">Checking...</div>
</div><div id="membershipText" class="membership-text">
Checking membership...
</div></section><h2 class="section-title">📖 TODAY'S LESSON</h2><div id="limitNote" class="note">
Loading today's lesson...
</div><div id="loading" class="loading">
Loading today's lesson...
</div><div id="error" class="error hidden"></div><section id="lessonGrid" class="lesson-grid hidden"></section><button id="shareButton"
class="share-btn hidden"
type="button">
📤 Share Today's Lesson
</button>

</main><footer class="footer">
© 2026 CreateLK Academy
</footer><script>

const LESSON_API=
"https://spokenlessons.createlk.workers.dev";

const PAYMENT_API=
"https://createlk-premium-payments.createlk.workers.dev";

const STUDENT_KEY="createlk_student";

let student={};
let currentLesson=[];

function loadStudent(){

try{
student=JSON.parse(
localStorage.getItem(STUDENT_KEY)||"{}"
)||{};
}catch(e){
student={};
}

}

function studentId(){

return Number(
student.id||
student.database_id||
student.student_id_number||
student.student_id||
0
);

}

function isPremium(){

loadStudent();

const status=String(
student.membership_status||
student.membershipStatus||
student.status||
""
).trim().toUpperCase();

const expiry=
student.membership_expiry||
student.membershipExpiry||
student.expiry||
"";

if(status!=="PREMIUM"||!expiry)return false;

const d=new Date(expiry);

return !isNaN(d.getTime())&&
d.getTime()>Date.now();

}

function updateMembership(){

const premium=isPremium();

const status=
document.getElementById("membershipStatus");

const text=
document.getElementById("membershipText");

const note=
document.getElementById("limitNote");

if(premium){

status.textContent="✓ Premium";

text.textContent=
"Premium is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";

}else{

status.textContent="Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are free. Upgrade for all 10.";

}

return premium;

}

function getTamil(x){
return x.tamil||x.ta||x.tamil_text||
x.question_tamil||x.text_tamil||"";
}

function getSinhala(x){
return x.sinhala||x.si||x.sinhala_text||
x.translation_sinhala||x.text_sinhala||"";
}

function getEnglish(x){
return x.english||x.en||x.english_text||
x.answer_english||x.text_english||"";
}

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function listenEnglish(text){

if(!("speechSynthesis" in window)){
alert("Voice playback is not supported.");
return;
}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=.9;

speechSynthesis.speak(u);

}

function createCard(item,index){

const card=
document.createElement("article");

card.className=
"card "+(index<3?"free":"premium");

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${escapeHTML(ta)}
</div>

${si?
`<div class="sinhala">
${escapeHTML(si)}
</div>`:""}

<div class="english">
${escapeHTML(en)}
</div>

${en?
`<button type="button" class="listen">
🔊 Listen
</button>`:""}

<span class="badge ${
index<3?"free-badge":"premium-badge"
}">
${index<3?"✓ FREE":"⭐ PREMIUM"}
</span>
`;

const btn=
card.querySelector(".listen");

if(btn){
btn.onclick=()=>listenEnglish(en);
}

return card;

}

function createUpgradeCard(){

const box=
document.createElement("div");

box.className="premium-box";

box.innerHTML=`

<div class="premium-box-title">
⭐ Unlock All 10 Dialogues
</div>

<div class="premium-box-text">
3 dialogues are free every day.
Premium unlocks all 10 daily dialogues.
</div>

<button
type="button"
class="premium-button"
onclick="checkout()">
💳 Upgrade — LKR 1,500
</button>
`;

return box;

}

function normalizeLesson(json){

let data=json;

if(json&&json.lesson)
data=json.lesson;

if(json&&json.data&&!Array.isArray(json.data))
data=json.data;

const dialogues=
data.dialogues||
data.conversations||
data.items||
data.lessons;

if(!Array.isArray(dialogues))
throw new Error("No dialogues were returned.");

return{dialogues};

}

async function loadLesson(){

loadStudent();

const premium=
updateMembership();

const now=new Date();

document.getElementById("lessonDate")
.textContent=
now.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

try{

const monthDay=
String(now.getMonth()+1)
.padStart(2,"0")+
"-"+
String(now.getDate())
.padStart(2,"0");

const response=
await fetch(
LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),
{
cache:"no-store",
headers:{
Accept:"application/json"
}
}
);

if(!response.ok)
throw new Error(
"Lesson service returned HTTP "+
response.status
);

const json=
await response.json();

const lesson=
normalizeLesson(json);

if(lesson.dialogues.length<3)
throw new Error(
"Today's lesson is incomplete."
);

currentLesson=
lesson.dialogues;

const grid=
document.getElementById("lessonGrid");

grid.innerHTML="";

const count=
premium?
Math.min(10,currentLesson.length):
Math.min(3,currentLesson.length);

for(let i=0;i<count;i++){

grid.appendChild(
createCard(
currentLesson[i],
i
)
);

}

if(!premium)
grid.appendChild(
createUpgradeCard()
);

document.getElementById("loading")
.classList.add("hidden");

document.getElementById("error")
.classList.add("hidden");

grid.classList.remove("hidden");

document.getElementById("shareButton")
.classList.remove("hidden");

}catch(error){

console.error(error);

document.getElementById("loading")
.classList.add("hidden");

const box=
document.getElementById("error");

box.textContent=
"⚠️ "+error.message;

box.classList.remove("hidden");

}

}


/* CHECKOUT */

async function checkout(){

loadStudent();

const id=studentId();

if(!id){

alert("Please log in first.");

location.href="login.html";

return;

}

const button=
document.querySelector(".premium-button");

if(button){

button.disabled=true;
button.textContent="Opening PayHere...";
}

try{

const response=
await fetch(
PAYMENT_API+
"/api/checkout",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"text/html,application/json"
},
body:JSON.stringify({
student_id:id
})
}
);

const raw=
await response.text();

if(!response.ok){

throw new Error(
"Checkout failed. HTTP "+
response.status
);

}

if(
raw.toLowerCase().includes("<form")
){

document.open();
document.write(raw);
document.close();

return;

}

let data;

try{
data=JSON.parse(raw);
}catch(e){
throw new Error(
"Invalid payment response."
);
}

const url=
data.url||
data.checkout_url||
data.payment_url||
data.redirect_url;

if(url){

location.href=url;
return;

}

throw new Error(
"Payment checkout URL was not returned."
);

}catch(error){

console.error(error);

alert(error.message);

if(button){

button.disabled=false;
button.textContent=
"💳 Upgrade — LKR 1,500";

}

}

}


/* SHARE IMAGE */

async function shareLesson(){

if(!currentLesson.length){

alert("Today's lesson is not loaded yet.");
return;

}

const item=currentLesson[0];

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

const date=
document.getElementById("lessonDate")
.textContent;

const canvas=
document.createElement("canvas");

canvas.width=1080;
canvas.height=1350;

const ctx=
canvas.getContext("2d");


/* BACKGROUND */

const bg=
ctx.createLinearGradient(
0,0,1080,1350
);

bg.addColorStop(0,"#2563eb");
bg.addColorStop(.5,"#7c3aed");
bg.addColorStop(1,"#db2777");

ctx.fillStyle=bg;
ctx.fillRect(0,0,1080,1350);


/* DECORATION */

ctx.fillStyle=
"rgba(255,255,255,.12)";

ctx.beginPath();
ctx.arc(1010,90,210,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(60,1280,170,0,Math.PI*2);
ctx.fill();


/* HEADER */

ctx.textAlign="center";
ctx.fillStyle="#fff";

ctx.font="bold 44px Arial";
ctx.fillText(
"📚 CreateLK Academy",
540,95
);

ctx.font="bold 31px Arial";
ctx.fillText(
"DAILY SPOKEN ENGLISH",
540,145
);

ctx.font="23px Arial";
ctx.fillText(
date,
540,185
);


/* WHITE BOARD */

const boxX=70;
const boxY=235;
const boxW=940;
const boxH=790;

ctx.shadowColor=
"rgba(0,0,0,.22)";
ctx.shadowBlur=28;
ctx.shadowOffsetY=10;

ctx.fillStyle="#fff";

roundRect(
ctx,
boxX,
boxY,
boxW,
boxH,
38
);

ctx.fill();

ctx.shadowColor="transparent";
ctx.shadowBlur=0;
ctx.shadowOffsetY=0;


/* CALCULATE CONTENT HEIGHT FIRST */

const contentWidth=770;

const taLines=
getLines(
ctx,
ta,
contentWidth,
"bold 37px Arial"
);

const siLines=si?
getLines(
ctx,
si,
contentWidth,
"27px Arial"
):[];

const enLines=
getLines(
ctx,
en,
contentWidth,
"bold 34px Arial"
);

const lineTa=56;
const lineSi=46;
const lineEn=52;

let contentHeight=0;

if(taLines.length)
contentHeight+=
taLines.length*lineTa;

if(siLines.length)
contentHeight+=
30+
siLines.length*lineSi;

if(enLines.length)
contentHeight+=
38+
enLines.length*lineEn;


/* PERFECT VERTICAL CENTER */

let y=
boxY+
(boxH-contentHeight)/2;


/* TAMIL */

if(taLines.length){

y=drawLines(
ctx,
taLines,
540,
y,
lineTa,
"bold 37px Arial",
"#172033"
);

}


/* SINHALA */

if(siLines.length){

y+=30;

y=drawLines(
ctx,
siLines,
540,
y,
lineSi,
"27px Arial",
"#64748b"
);

}


/* ENGLISH */

if(enLines.length){

y+=38;

drawLines(
ctx,
enLines,
540,
y,
lineEn,
"bold 34px Arial",
"#2563eb"
);

}


/* FOOTER TEXT */

ctx.fillStyle="#fff";

ctx.font="bold 28px Arial";
ctx.fillText(
"Learn English Every Day",
540,
1135
);

ctx.font="bold 27px Arial";
ctx.fillText(
"creatlk.com",
540,
1185
);


/* TEXT OUTSIDE PHOTO */

const shareText=
`🗣️ Daily Spoken English

${ta}

${si?si+"\n\n":""}${en}

📚 CreateLK Academy
Learn English Every Day

Full lesson: creatlk.com`;


canvas.toBlob(
async blob=>{

if(!blob){

alert("Unable to create image.");
return;

}

const file=
new File(
[blob],
"createlk-daily-english.png",
{type:"image/png"}
);

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({
title:
"CreateLK Academy | Daily Spoken English",
text:shareText,
files:[file]
});

return;

}catch(e){

if(e.name==="AbortError")
return;

}

}

if(navigator.share){

try{

await navigator.share({
title:
"CreateLK Academy | Daily Spoken English",
text:shareText
});

return;

}catch(e){

if(e.name==="AbortError")
return;

}

}

const link=
document.createElement("a");

link.download=
"createlk-daily-english.png";

link.href=
URL.createObjectURL(blob);

link.click();

setTimeout(
()=>{
URL.revokeObjectURL(link.href);
},
1000
);

},
"image/png"
);

}


/* TEXT WRAP */

function getLines(
ctx,
text,
maxWidth,
font
){

ctx.font=font;

const words=
String(text)
.trim()
.split(/\s+/);

let line="";
const lines=[];

for(const word of words){

const test=
line?
line+" "+word:
word;

if(
ctx.measureText(test).width>
maxWidth&&
line
){

lines.push(line);
line=word;

}else{

line=test;

}

}

if(line)
lines.push(line);

return lines;

}

function drawLines(
ctx,
lines,
x,
y,
lineHeight,
font,
color
){

ctx.font=font;
ctx.fillStyle=color;
ctx.textAlign="center";

for(const line of lines){

ctx.fillText(
line,
x,
y
);

y+=lineHeight;

}

return y;

}

function roundRect(
ctx,x,y,w,h,r
){

ctx.beginPath();

ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);

ctx.quadraticCurveTo(
x+w,y,
x+w,y+r
);

ctx.lineTo(
x+w,y+h-r
);

ctx.quadraticCurveTo(
x+w,y+h,
x+w-r,y+h
);

ctx.lineTo(
x+r,y+h
);

ctx.quadraticCurveTo(
x,y+h,
x,y+h-r
);

ctx.lineTo(
x,y+r
);

ctx.quadraticCurveTo(
x,y,
x+r,y
);

ctx.closePath();

}


document.getElementById(
"shareButton"
).addEventListener(
"click",
shareLesson
);

loadLesson();

</script></body>
</html>
