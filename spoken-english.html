<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">

<title>Student Status - CreateLK Academy</title>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --b:#2563eb;
 --p:#7c3aed;
 --d:#0f172a;
 --m:#64748b;
 --l:#e2e8f0;
 --bg:#f3f6fb;
 --green:#166534;
 --greenbg:#f0fdf4;
 --gold:#f59e0b;
}

html,body{
 width:100%;
 min-height:100%;
}

body{
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--d);
 -webkit-font-smoothing:antialiased;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#fff;
 border-bottom:1px solid var(--l);
}

.nav{
 width:100%;
 max-width:820px;
 margin:auto;
 padding:11px 7px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.logo{
 font-size:15px;
 font-weight:900;
 color:var(--b);
 text-decoration:none;
}

.logo span{
 color:var(--p);
}

.back{
 border:1px solid var(--l);
 background:#fff;
 color:var(--d);
 padding:8px 11px;
 border-radius:9px;
 font-size:10px;
 font-weight:800;
 cursor:pointer;
 white-space:nowrap;
}

main{
 width:100%;
 max-width:820px;
 margin:auto;
 padding:7px 2px 0;
}

.card{
 width:100%;
 background:#fff;
 border:1px solid var(--l);
 border-radius:16px;
 padding:17px;
 margin-bottom:10px;
}

.hero{
 min-height:145px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 color:#fff;
 border:0;
 padding:21px;
 box-shadow:0 5px 18px rgba(37,99,235,.12);
}

.hero h1{
 font-size:23px;
 font-weight:900;
 line-height:1.25;
}

.hero p{
 font-size:11px;
 line-height:1.5;
 margin-top:6px;
}

.quote{
 margin-top:13px;
 padding-top:11px;
 border-top:1px solid rgba(255,255,255,.28);
 font-size:11px;
 line-height:1.55;
 font-style:italic;
 font-weight:600;
}

.quote::before{
 content:"“";
 font-size:20px;
 font-weight:900;
 vertical-align:-4px;
 margin-right:2px;
}

.quote::after{
 content:"”";
 font-size:20px;
 font-weight:900;
 vertical-align:-4px;
 margin-left:2px;
}

.stats{
 width:100%;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-bottom:10px;
}

.stat{
 min-height:80px;
 background:#fff;
 border:1px solid var(--l);
 border-radius:15px;
 padding:10px 5px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
}

.stat small{
 display:block;
 color:var(--m);
 font-size:7px;
 font-weight:900;
 letter-spacing:.2px;
 margin-bottom:4px;
}

.stat b{
 font-size:12px;
 font-weight:900;
 overflow-wrap:anywhere;
}

.statPremium{
 color:#047857;
}

.statFree{
 color:var(--m);
}

.accountCard{
 padding:18px;
}

.title{
 font-size:12px;
 font-weight:900;
 margin-bottom:10px;
}

.account{
 width:100%;
 display:flex;
 flex-direction:column;
 gap:7px;
}

.item{
 width:100%;
 min-height:54px;
 background:#f8fafc;
 border:1px solid var(--l);
 border-radius:10px;
 padding:9px 10px;
}

.item small{
 display:block;
 color:var(--m);
 font-size:7px;
 font-weight:900;
 letter-spacing:.2px;
 margin-bottom:3px;
}

.item b{
 display:block;
 font-size:10px;
 font-weight:800;
 line-height:1.4;
 overflow-wrap:anywhere;
}

.premiumActive{
 width:100%;
 background:var(--greenbg);
 border:1px solid #bbf7d0;
 color:var(--green);
 border-radius:13px;
 padding:15px;
 text-align:center;
 font-size:10px;
 font-weight:800;
 margin-bottom:10px;
}

.premiumActive strong{
 display:block;
 font-size:13px;
 margin-bottom:4px;
}

.premiumActive span{
 display:block;
 font-size:9px;
 font-weight:700;
}

.premiumOffer{
 padding:18px;
}

.premiumOffer p{
 font-size:9px;
 line-height:1.6;
 color:var(--m);
}

.payButton{
 width:100%;
 height:46px;
 margin-top:11px;
 border:0;
 border-radius:10px;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 color:#fff;
 font-size:11px;
 font-weight:900;
 cursor:pointer;
 box-shadow:0 4px 12px rgba(37,99,235,.16);
}

.payButton:active{
 transform:scale(.99);
}

.payButton:disabled{
 opacity:.65;
 cursor:wait;
}

.expired{
 width:100%;
 background:#fff7ed;
 border:1px solid #fed7aa;
 color:#9a3412;
 border-radius:13px;
 padding:12px;
 text-align:center;
 font-size:9px;
 font-weight:800;
 margin-bottom:10px;
}

footer{
 width:100%;
 text-align:center;
 color:var(--m);
 font-size:8px;
 padding:5px 0 18px;
}

.hidden{
 display:none!important;
}

@media(max-width:600px){

 main{
  padding-left:2px;
  padding-right:2px;
 }

 .hero{
  min-height:145px;
 }

}

@media(max-width:380px){

 .nav{
  padding-left:6px;
  padding-right:6px;
 }

 .logo{
  font-size:14px;
 }

 .back{
  font-size:9px;
  padding:7px 9px;
 }

 .hero{
  min-height:135px;
  padding:18px;
 }

 .hero h1{
  font-size:21px;
 }

 .hero p{
  font-size:10px;
 }

 .quote{
  font-size:10px;
 }

 .card{
  padding:15px;
 }

 .stat{
  min-height:72px;
 }

 .accountCard{
  padding:15px;
 }

 .item{
  min-height:51px;
  padding:8px 9px;
 }

 .item b{
  font-size:9px;
 }

}

@media(
 min-height:700px
) and (
 max-width:600px
){

 .hero{
  min-height:150px;
 }

 .stat{
  min-height:82px;
 }

 .accountCard{
  padding:18px;
 }

 .item{
  min-height:55px;
 }

 footer{
  padding-bottom:20px;
 }

}

</style>
</head>

<body>

<header>

 <div class="nav">

  <a
   class="logo"
   href="dashboard.html">

   📚 CreateLK <span>Academy</span>

  </a>

  <button
   type="button"
   class="back"
   onclick="location.href='dashboard.html'">

   ← Dashboard

  </button>

 </div>

</header>


<main>


<!-- HERO -->

<section class="card hero">

 <h1>
  🎓 Student Status
 </h1>

 <p id="welcome">
  Loading...
 </p>

 <div class="quote">
  Every lesson you complete brings you one step closer to confident English.
 </div>

</section>


<!-- BASIC STATS -->

<div class="stats">

 <div class="stat">

  <small>
   STUDENT ID
  </small>

  <b id="sid">
   -
  </b>

 </div>


 <div class="stat">

  <small>
   LESSONS
  </small>

  <b id="lessons">
   0
  </b>

 </div>


 <div class="stat">

  <small>
   MEMBERSHIP
  </small>

  <b
   id="member"
   class="statFree">

   Free

  </b>

 </div>

</div>


<!-- ACCOUNT -->

<section class="card accountCard">

 <div class="title">
  👤 Account
 </div>

 <div class="account">


  <div class="item">

   <small>
    NAME
   </small>

   <b id="name">
    -
   </b>

  </div>


  <div class="item">

   <small>
    EMAIL
   </small>

   <b id="email">
    -
   </b>

  </div>


  <div class="item">

   <small>
    PHONE
   </small>

   <b id="phone">
    -
   </b>

  </div>


  <div class="item">

   <small>
    PREMIUM EXPIRY
   </small>

   <b id="expiry">
    Not active
   </b>

  </div>


 </div>

</section>


<!-- PREMIUM AREA -->

<div id="premiumArea"></div>


<footer>
 © 2026 CreateLK Academy
</footer>


</main>


<script>


/* =====================================================
   API
===================================================== */

const COURSE_API =
 "https://createlk-course-lessons.createlk.workers.dev";

const PAYMENT =
 "https://createlk-premium-payments.createlk.workers.dev";


/* =====================================================
   STUDENT STORAGE
===================================================== */

const STUDENT_KEY =
 "createlk_student";


let student={};


/* =====================================================
   LOAD STUDENT
===================================================== */

try{

 const raw =
  localStorage.getItem(
   STUDENT_KEY
  );

 if(raw){

  student =
   JSON.parse(raw);

 }

}catch(error){

 console.error(
  "Student data error:",
  error
 );

 student={};

}


/* =====================================================
   STUDENT ID
===================================================== */

function getStudentId(){

 return Number(

  student.id ||

  student.database_id ||

  student.student_id_number ||

  student.student_id ||

  0

 );

}


/* =====================================================
   MEMBERSHIP STATUS
=====================================================

   PREMIUM IS ACTIVE ONLY WHEN:

   1. membership_status = PREMIUM
   2. membership expiry exists
   3. expiry is still in the future

===================================================== */

function isPremiumActive(){

 const status =
  String(

   student.membership_status ||

   student.membershipStatus ||

   student.status ||

   ""

  ).trim().toUpperCase();


 const expiry =
  student.membership_expiry ||

  student.membershipExpiry ||

  "";


 if(
  status !== "PREMIUM"
 ){

  return false;

 }


 if(!expiry){

  return false;

 }


 const expiryDate =
  new Date(expiry);


 if(
  isNaN(
   expiryDate.getTime()
  )
 ){

  return false;

 }


 return expiryDate.getTime() >
        Date.now();

}


/* =====================================================
   EXPIRY DISPLAY
===================================================== */

function formatExpiry(value){

 if(!value){

  return "Not active";

 }

 const date =
  new Date(value);

 if(
  isNaN(
   date.getTime()
  )
 ){

  return String(value);

 }

 return date.toLocaleDateString(
  "en-US",
  {
   year:"numeric",
   month:"long",
   day:"numeric"
  }
 );

}


/* =====================================================
   DISPLAY ACCOUNT
===================================================== */

function display(){

 const fullName = (

  `${student.first_name || ""} ${
    student.last_name || ""
  }`

 ).trim()

 || student.name

 || "Student";


 document.getElementById(
  "welcome"
 ).textContent =
  `Welcome, ${fullName}`;


 document.getElementById(
  "sid"
 ).textContent =

  student.student_id ||

  student.studentId ||

  getStudentId();


 document.getElementById(
  "name"
 ).textContent =
  fullName;


 document.getElementById(
  "email"
 ).textContent =
  student.email || "-";


 document.getElementById(
  "phone"
 ).textContent =
  student.phone || "-";


 const expiry =
  student.membership_expiry ||

  student.membershipExpiry ||

  "";


 document.getElementById(
  "expiry"
 ).textContent =
  formatExpiry(expiry);


 const member =
  document.getElementById(
   "member"
  );


 if(
  isPremiumActive()
 ){

  member.textContent =
   "Premium";

  member.className =
   "statPremium";

 }else{

  member.textContent =
   "Free";

  member.className =
   "statFree";

 }

}


/* =====================================================
   PREMIUM UI
===================================================== */

function displayPremium(){

 const box =
  document.getElementById(
   "premiumArea"
  );


 const active =
  isPremiumActive();


 const expiry =
  student.membership_expiry ||

  student.membershipExpiry ||

  "";


 if(active){

  box.innerHTML = `

   <div class="premiumActive">

    <strong>
     ✅ Premium Membership Active
    </strong>

    <span>
     All 10 daily spoken English dialogues are unlocked.
    </span>

    <span>
     Premium expires:
     ${formatExpiry(expiry)}
    </span>

   </div>

  `;

  return;

 }


 /*
   If status says PREMIUM but expiry
   is past, show expired message.
 */

 const status =
  String(

   student.membership_status ||

   student.membershipStatus ||

   ""

  ).toUpperCase();


 if(
  status === "PREMIUM" &&
  expiry
 ){

  box.innerHTML = `

   <div class="expired">

    ⚠️ Your Premium membership has expired.
    Renew to unlock all 10 daily dialogues.

   </div>

  `;

 }


 /*
   FREE / EXPIRED MEMBERS
   ALWAYS GET PAYMENT BUTTON.
 */

 box.innerHTML += `

  <section class="card premiumOffer">

   <div class="title">
    ⭐ Premium Membership
   </div>

   <p>

    Get all 10 daily spoken English dialogues
    instead of only the 3 free dialogues.
    Premium membership costs
    <strong>LKR 1,500 for 30 days.</strong>

   </p>

   <button
    type="button"
    class="payButton"
    id="payButton"
    onclick="checkout()">

    💳 Pay LKR 1,500

   </button>

  </section>

 `;

}


/* =====================================================
   LOAD COMPLETED LESSONS
===================================================== */

async function loadProgress(){

 const studentId =
  getStudentId();


 if(!studentId){

  return;

 }


 try{

  const response =
   await fetch(

    COURSE_API +
    "/api/progress?student_id=" +
    encodeURIComponent(
     studentId
    ),

    {
     method:"GET",
     cache:"no-store",
     headers:{
      "Accept":
       "application/json"
     }
    }

   );


  if(!response.ok){

   console.log(
    "Progress request failed:",
    response.status
   );

   return;

  }


  const data =
   await response.json();


  if(data.success){

   const completed =
    Number(

     data.completed_lessons ??

     data.completed ??

     data.lessons_completed ??

     0

    );


   document.getElementById(
    "lessons"
   ).textContent =
    Math.max(
     0,
     completed
    );

  }

 }catch(error){

  console.log(
   "Progress error:",
   error
  );

 }

}


/* =====================================================
   PAYHERE CHECKOUT
===================================================== */

async function checkout(){

 const button =
  document.getElementById(
   "payButton"
  );


 if(button){

  button.disabled =
   true;

  button.textContent =
   "Opening PayHere...";

 }


 const studentId =
  getStudentId();


 if(!studentId){

  alert(
   "Student account not found. Please login again."
  );

  if(button){

   button.disabled =
    false;

   button.textContent =
    "💳 Pay LKR 1,500";

  }

  return;

 }


 try{

  const response =
   await fetch(

    PAYMENT +
    "/api/checkout",

    {

     method:"POST",

     headers:{
      "Content-Type":
       "application/json",

      "Accept":
       "application/json"
     },

     body:JSON.stringify({

      student_id:
       studentId

     })

    }

   );


  const raw =
   await response.text();


  if(!response.ok){

   console.error(
    "Payment response:",
    raw
   );

   throw new Error(
    "Unable to open PayHere."
   );

  }


  /*
    Some versions of the payment
    Worker return an HTML PayHere form.
  */

  if(
   raw
    .toLowerCase()
    .includes("<form")
  ){

   document.open();

   document.write(raw);

   document.close();

   return;

  }


  /*
    Otherwise expect JSON.
  */

  let data;

  try{

   data =
    JSON.parse(raw);

  }catch(error){

   console.error(
    "Invalid payment response:",
    raw
   );

   throw new Error(
    "Invalid payment response from payment server."
   );

  }


  const url =
   data.url ||

   data.checkout_url ||

   data.payment_url;


  if(url){

   window.location.href =
    url;

   return;

  }


  throw new Error(
   data.message ||
   "Payment checkout URL was not returned."
  );


 }catch(error){

  console.error(
   "Checkout error:",
   error
  );

  alert(
   error.message ||
   "Unable to open PayHere."
  );


  if(button){

   button.disabled =
    false;

   button.textContent =
    "💳 Pay LKR 1,500";

  }

 }

}


/* =====================================================
   START
===================================================== */

async function start(){

 const studentId =
  getStudentId();


 if(!studentId){

  location.href =
   "login.html";

  return;

 }


 display();

 displayPremium();

 await loadProgress();

}


start();

</script>

</body>
</html>
