border:1px solid #a7f3d0
}

.upgrade{

}

.dialogueNumber{

.tamil{

}

.sinhala{

margin-top:5px
}

.english{

line-height:1.5;
margin-top:5px
}

.label{

color:var(--m);
font-weight:800
}

.listen{

background:#fff;
border-radius:8px;
padding:6px 9px;
font-size:9px;
font-weight:800;
cursor:pointer
}

.locked{
opacity:.75;
background:#f8fafc
}

.lockMessage{
font-size:10px;
color:var(--m);
margin-top:5px;
line-height:1.5
}

.loading,
.error{
text-align:center;
font-size:11px;
padding:18px 5px;

}

.error{

}

footer{
text-align:center;
font-size:8px;
color:var(--m);
padding:2px 0 15px
}

@media(max-width:380px){
.logo{font-size:14px}
.card{padding:14px}
.hero{padding:17px}
.hero h1{font-size:20px}
}
</style></head><body><header>
<div class="nav"><a class="logo" href="index.html">
📚 CreateLK <span>Academy</span>
</a><a class="back" href="dashboard.html">
← Dashboard
</a></div>
</header><main><section class="card hero"><small>DAILY SPOKEN ENGLISH</small>

<h1 id="welcome">Welcome 👋</h1><p>
Tamil → Sinhala → English conversations every day.
</p></section><section class="card"><div class="dayBox"><div class="dayIcon">📅</div><div><div class="dayTitle">
DAY <span id="dayNumber">Loading...</span>
</div><div class="date" id="lessonDate">
Loading...
</div></div></div></section><section class="card"><div class="membership"><div class="memberLeft"><div class="memberIcon">⭐</div><div><div class="memberTitle">
Premium Membership
</div><div class="memberText" id="memberText">
Checking membership...
</div></div></div><div id="memberBadge" class="badge free">
Checking
</div></div><button
id="upgradeButton"
class="upgrade"
onclick="upgrade()">
⭐ Upgrade to Premium — Get All 10 Dialogues Daily
</button>

</section><section class="card"><div class="lessonTitle">
📖 TODAY'S LESSON
</div><div id="lessonContent" class="loading">
Loading today's lesson...
</div></section><footer>
© 2026 CreateLK Academy
</footer></main><script>

const COURSE_API =
"https://spokenlessons.createlk.workers.dev";

const ACCOUNT_API =
"https://createlk-auth-createlk.workers.dev";

const KEY =
"createlk_student";

let student={};
let lesson=null;


/* =========================
   LOAD STUDENT
========================= */

try{

student=
JSON.parse(
localStorage.getItem(KEY)||"{}"
);

}catch(e){

student={};

}


/* =========================
   STUDENT ID
========================= */

function studentId(){

return Number(
student.id ||
student.database_id ||
student.student_id ||
student.student_id_number ||
0
);

}


/* =========================
   PREMIUM
========================= */

function isPremium(){

return String(
student.membership_status || "FREE"
).toUpperCase()==="PREMIUM";

}


/* =========================
   REFRESH ACCOUNT
========================= */

async function refreshStudent(){

const id=studentId();

if(!id)return;

try{

const r=await fetch(
ACCOUNT_API+
"/api/student?id="+
encodeURIComponent(id),
{
cache:"no-store"
}
);

if(!r.ok)return;

const d=await r.json();

if(d.success && d.student){

student={
...student,
...d.student,
id:Number(d.student.id)
};

localStorage.setItem(
KEY,
JSON.stringify(student)
);

}

}catch(e){

console.log("Account error:",e);

}

}


/* =========================
   TODAY
========================= */

function getToday(){

const now=new Date();

const year=now.getFullYear();
const month=String(
now.getMonth()+1
).padStart(2,"0");

const day=String(
now.getDate()
).padStart(2,"0");

return {

monthDay:month+"-"+day,

date:new Date(
year,
now.getMonth(),
now.getDate()
)

};

}


/* =========================
   COURSE DAY
========================= */

function getCourseDay(){

const start=new Date(
2026,
0,
1
);

const today=getToday().date;

const diff=Math.floor(
(
today.getTime()-
start.getTime()
)/
86400000
);

return diff+1;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

return date.toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}


/* =========================
   LOAD TODAY LESSON
========================= */

async function loadLesson(){

const today=getToday();

const day=getCourseDay();

document.getElementById(
"dayNumber"
).textContent=day;

document.getElementById(
"lessonDate"
).textContent=
formatDate(today.date);

try{

let response;

const urls=[

COURSE_API+
"/api/lesson?month_day="+
encodeURIComponent(today.monthDay),

COURSE_API+
"/api/lesson?day="+
encodeURIComponent(day),

COURSE_API+
"/api/today?month_day="+
encodeURIComponent(today.monthDay),

COURSE_API+
"/api/today"

];

for(const url of urls){

try{

const r=await fetch(
url,
{cache:"no-store"}
);

if(!r.ok)continue;

const d=await r.json();

if(
d &&
(
d.lesson ||
d.data ||
d.id ||
d.success
)
){

response=d.lesson ||
d.data ||
d;

break;

}

}catch(e){

console.log(
"Trying next lesson endpoint..."
);

}

}

if(!response){

throw new Error(
"Today's lesson could not be loaded."
);

}

lesson=response;

renderLesson();

}catch(e){

console.log(e);

document.getElementById(
"lessonContent"
).innerHTML=`

<div class="error">

⚠️ Today's lesson could not be loaded.

<br><br>

Please refresh the page.

</div>

`;

}

}


/* =========================
   RENDER LESSON
========================= */

function renderLesson(){

const box=
document.getElementById(
"lessonContent"
);

if(!lesson){

box.innerHTML=`

<div class="error">
⚠️ No lesson data.
</div>

`;

return;

}

let dialogues=
lesson.dialogues ||
lesson.dialogue ||
lesson.content ||
[];

if(typeof dialogues==="string"){

try{

dialogues=
JSON.parse(dialogues);

}catch(e){

console.log(
"Dialogue JSON error:",
e
);

dialogues=[];

}

}

if(!Array.isArray(dialogues)){

dialogues=[];

}

if(dialogues.length===0){

box.innerHTML=`

<div class="error">
⚠️ No lesson data.
</div>

`;

return;

}


/*
FREE USERS:
First 3 dialogues visible.
Remaining 7 locked.
PREMIUM:
All 10 visible.
*/

const premium=isPremium();

const visibleCount=
premium ? dialogues.length : 3;

let html="";

dialogues.forEach(
(item,index)=>{

const number=index+1;

if(
!premium &&
index>=visibleCount
){

html+=`

<div class="dialogue locked">

<div class="dialogueNumber">
DIALOGUE ${number} 🔒
</div>

<div class="lockMessage">
⭐ Premium members can access all 10 daily dialogues.
</div>

</div>

`;

return;

}

html+=`

<div class="dialogue">

<div class="dialogueNumber">
DIALOGUE ${number}
</div>

<div class="label">
🇱🇰 TAMIL
</div>

<div class="tamil">
${escapeHTML(item.tamil||"")}
</div>

<div class="label" style="margin-top:5px">
🇱🇰 SINHALA
</div>

<div class="sinhala">
${escapeHTML(item.sinhala||"")}
</div>

<div class="label" style="margin-top:5px">
🇬🇧 ENGLISH
</div>

<div class="english">
${escapeHTML(item.english||"")}
</div>

<button
class="listen"
onclick='speak(${JSON.stringify(
item.english||""
)})'>
🔊 Listen
</button>

</div>

`;

}
);


/*
Upgrade button after
free dialogues.
*/

if(!premium && dialogues.length>3){

html+=`

<button
class="upgrade"
style="display:block"
onclick="upgrade()">

⭐ Upgrade to Premium — Unlock All 10 Daily Dialogues

</button>

`;

}

box.innerHTML=html;

}


/* =========================
   UPDATE MEMBERSHIP UI
========================= */

function updateMembership(){

const badge=
document.getElementById(
"memberBadge"
);

const text=
document.getElementById(
"memberText"
);

const button=
document.getElementById(
"upgradeButton"
);

if(isPremium()){

badge.textContent=
"✓ Premium";

badge.className=
"badge premium";

text.textContent=
"Premium access is active. All 10 dialogues are unlocked.";

button.style.display="none";

}else{

badge.textContent=
"Free";

badge.className=
"badge free";

text.textContent=
"3 dialogues are free. Upgrade to Premium for all 10 daily dialogues.";

button.style.display="block";

}

}


/* =========================
   WELCOME
========================= */

function updateWelcome(){

const name=(

(student.first_name||"")+" "+
(student.last_name||"")

).trim() ||
student.name ||
"Student";

document.getElementById(
"welcome"
).textContent=
"Welcome, "+name+" 👋";

}


/* =========================
   UPGRADE
========================= */

function upgrade(){

/*
Change this URL to your actual
Premium payment/subscription page
if different.
*/

location.href=
"premium.html";

}


/* =========================
   SPEECH
========================= */

function speak(text){

if(!text)return;

if(
!"speechSynthesis" in window
){

alert(
"Speech is not supported on this device."
);

return;

}

window.speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=0.9;

window.speechSynthesis.speak(u);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

async function start(){

if(!studentId()){

location.replace(
"login.html"
);

return;

}

updateWelcome();

updateMembership();

await refreshStudent();

updateWelcome();

updateMembership();

await loadLesson();

}

start();

</script></body>
</html>
