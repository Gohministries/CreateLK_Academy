</main><footer class="footer">

/* =========================
   API
========================= */

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};

let currentLesson=null;


/* =========================
   LOAD STUDENT
========================= */

try{

student=
JSON.parse(
localStorage.getItem(STUDENT_KEY)||"{}"
);

}catch(e){

student={};

}


/* =========================
   STUDENT ID
========================= */

function getStudentId(){

return Number(
student.id ||
student.database_id ||
student.student_id_number ||
student.student_id ||
0
);

}


/* =========================
   PREMIUM
========================= */

function isPremium(){

return String(
student.membership_status ||
student.membershipStatus ||
"FREE"
)
.trim()
.toUpperCase()==="PREMIUM";

}


/* =========================
   DATE
========================= */

function setupDate(){

const now=new Date();

document.getElementById(
"lessonDate"
).textContent=
now.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

return now;

}


/* =========================
   MEMBERSHIP UI
========================= */

function updateMembership(){

const premium=isPremium();

const status=
document.getElementById(
"membershipStatus"
);

const text=
document.getElementById(
"membershipText"
);

const note=
document.getElementById(
"limitNote"
);

if(premium){

status.textContent=
"✓ Premium";

text.textContent=
"Premium is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All available daily dialogues are unlocked.";

}else{

status.textContent=
"Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are available. Upgrade to unlock all 10.";

}

return premium;

}


/* =========================
   FIELDS
========================= */

function getTamil(item){

return item.tamil||
item.ta||
item.tamil_text||
item.question_tamil||
item.text_tamil||
"";

}


function getSinhala(item){

return item.sinhala||
item.si||
item.sinhala_text||
item.translation_sinhala||
item.text_sinhala||
"";

}


function getEnglish(item){

return item.english||
item.en||
item.english_text||
item.answer_english||
item.text_english||
"";

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   LISTEN
========================= */

function listenEnglish(text){

if(!("speechSynthesis" in window)){

alert(
"Voice playback is not supported."
);

return;

}

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-US";
speech.rate=.9;

speechSynthesis.speak(speech);

}


/* =========================
   LESSON CARD
========================= */

function createCard(item,index){

const card=
document.createElement("article");

card.className=
"card "+
(index<3?"free":"premium");

const ta=getTamil(item);

const si=getSinhala(item);

const en=getEnglish(item);

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${escapeHTML(ta)}
</div>

${
si
?
`
<div class="sinhala">
${escapeHTML(si)}
</div>
`
:""
}

<div class="english">
${escapeHTML(en)}
</div>

${
en
?
`
<button
type="button"
class="listen">
🔊 Listen
</button>
`
:""
}

<span class="badge ${
index<3
?"free-badge"
:"premium-badge"
}">
${index<3?"✓ FREE":"⭐ PREMIUM"}
</span>

`;

const listen=
card.querySelector(".listen");

if(listen){

listen.onclick=
()=>listenEnglish(en);

}

return card;

}


/* =========================
   PREMIUM CHECKOUT CARD
   ONE BUTTON ONLY
========================= */

function createCheckoutCard(){

const box=
document.createElement("div");

box.className=
"premium-box";

box.innerHTML=`

<div class="premium-box-title">
⭐ Unlock the Full Daily Lesson
</div>

<div class="premium-box-text">

Today's first 3 conversations are free.

<br><br>

Upgrade to Premium for the
<strong>complete daily lesson with all 10 conversations.</strong>

</div>

<button
type="button"
class="payButton"
onclick="checkout()">

💳 Unlock Full Lesson — LKR 1,500

</button>

`;

return box;

}


/* =========================
   NORMALIZE CLOUDFLARE
========================= */

function normalizeLesson(json){

let data=json;

if(json && json.lesson){

data=json.lesson;

}

if(
json &&
json.data &&
!Array.isArray(json.data)
){

data=json.data;

}

const dialogues=
data.dialogues||
data.conversations||
data.items||
data.lessons;

if(!Array.isArray(dialogues)){

throw new Error(
"No dialogues were returned by Cloudflare."
);

}

return{
dialogues:dialogues
};

}


/* =========================
   LOAD TODAY'S LESSON
========================= */

async function loadLesson(){

const now=setupDate();

const premium=
updateMembership();

try{

const monthDay=
String(
now.getMonth()+1
).padStart(2,"0")
+
"-"+
String(
now.getDate()
).padStart(2,"0");


const url=
LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay);


const response=
await fetch(
url,
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


if(!response.ok){

throw new Error(
"Lesson service returned HTTP "+
response.status+"."
);

}


const json=
await response.json();


const lesson=
normalizeLesson(json);


if(
lesson.dialogues.length<3
){

throw new Error(
"Today's lesson has fewer than 3 dialogues."
);

}


currentLesson=
lesson.dialogues;


const grid=
document.getElementById(
"lessonGrid"
);

grid.innerHTML="";


/* =========================
   FREE
========================= */

if(!premium){

const freeCount=
Math.min(
3,
lesson.dialogues.length
);

for(
let i=0;
i<freeCount;
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}


/* ONE CHECKOUT BUTTON */

grid.appendChild(
createCheckoutCard()
);

}


/* =========================
   PREMIUM
========================= */

else{

const maximum=
Math.min(
10,
lesson.dialogues.length
);

for(
let i=0;
i<maximum;
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}

}


/* SHOW */

document.getElementById(
"loading"
).classList.add("hidden");

document.getElementById(
"error"
).classList.add("hidden");

grid.classList.remove("hidden");

document.getElementById(
"shareButton"
).classList.remove("hidden");

}catch(error){

console.error(error);

document.getElementById(
"loading"
).classList.add("hidden");

const errorBox=
document.getElementById("error");

errorBox.textContent=
"⚠️ "+error.message;

errorBox.classList.remove("hidden");

}

}


/* =========================
   PAYHERE CHECKOUT
   SAME WORKING LOGIC
   AS STUDENT STATUS PAGE
========================= */

async function checkout(){

try{

const studentId=
getStudentId();

if(!studentId){

location.href="login.html";

return;

}


const r=
await fetch(
PAYMENT+
"/api/checkout",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:
studentId

})

}
);


const raw=
await r.text();


if(!r.ok){

throw new Error(
"Unable to open PayHere."
);

}


/* HTML PAYMENT FORM */

if(
raw.includes("<form")
){

document.open();

document.write(raw);

document.close();

return;

}


/* JSON RESPONSE */

const d=
JSON.parse(raw);


if(
d.url ||
d.checkout_url
){

location.href=
d.url ||
d.checkout_url;

return;

}


throw new Error(
"Invalid payment response."
);


}catch(e){

console.error(e);

alert(
e.message
);

}

}


/* =========================
   SHARE DAILY LESSON
========================= */

async function shareDailyLesson(){

if(
!currentLesson ||
!currentLesson.length
){

alert(
"Today's lesson is not loaded yet."
);

return;

}


/* SHARE FIRST DIALOGUE */

const item=
currentLesson[0];

const ta=
getTamil(item);

const si=
getSinhala(item);

const en=
getEnglish(item);

const date=
document.getElementById(
"lessonDate"
).textContent;


/* CANVAS */

const canvas=
document.createElement("canvas");

canvas.width=1080;

canvas.height=1350;

const ctx=
canvas.getContext("2d");


/* BACKGROUND */

const gradient=
ctx.createLinearGradient(
0,
0,
1080,
1350
);

gradient.addColorStop(
0,
"#1d4ed8"
);

gradient.addColorStop(
.5,
"#2563eb"
);

gradient.addColorStop(
1,
"#7c3aed"
);

ctx.fillStyle=
gradient;

ctx.fillRect(
0,
0,
1080,
1350
);


/* DECORATION */

ctx.fillStyle=
"rgba(255,255,255,.08)";

ctx.beginPath();

ctx.arc(
950,
120,
210,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
80,
1250,
170,
0,
Math.PI*2
);

ctx.fill();


/* HEADER */

ctx.fillStyle="#fff";

ctx.textAlign="center";

ctx.font=
"bold 46px Arial";

ctx.fillText(
"📚 CreateLK Academy",
540,
105
);

ctx.font=
"bold 38px Arial";

ctx.fillText(
"Daily Lesson",
540,
160
);

ctx.font=
"24px Arial";

ctx.globalAlpha=.9;

ctx.fillText(
date,
540,
207
);

ctx.globalAlpha=1;


/* WHITE BOARD */

ctx.shadowColor=
"rgba(0,0,0,.18)";

ctx.shadowBlur=30;

ctx.shadowOffsetY=12;

ctx.fillStyle="#fff";

roundRect(
ctx,
65,
275,
950,
790,
38
);

ctx.fill();

ctx.shadowColor="transparent";

ctx.shadowBlur=0;

ctx.shadowOffsetY=0;


/* CONTENT AREA */

ctx.fillStyle=
"#2563eb";

ctx.font=
"bold 22px Arial";

ctx.fillText(
"DAILY CONVERSATION",
540,
345
);

ctx.strokeStyle="#e2e8f0";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
170,
375
);

ctx.lineTo(
910,
375
);

ctx.stroke();


/* BALANCED CONTENT */

const content=[];

if(ta)content.push({
text:ta,
font:"bold 34px Arial",
color:"#172033",
lineHeight:48,
gap:24
});

if(si)content.push({
text:si,
font:"26px Arial",
color:"#64748b",
lineHeight:42,
gap:24
});

if(en)content.push({
text:en,
font:"bold 32px Arial",
color:"#1e293b",
lineHeight:48,
gap:0
});


/* CALCULATE TOTAL HEIGHT */

let totalHeight=0;

const measured=[];

for(const item of content){

ctx.font=item.font;

const lines=
getWrappedLines(
ctx,
item.text,
800
);

const height=
lines.length*
item.lineHeight;

measured.push({
...item,
lines:lines,
height:height
});

totalHeight+=height+
item.gap;

}

if(totalHeight>0){

totalHeight-=content.length?
content[content.length-1].gap:0;

}


/* CENTER VERTICALLY */

let y=
720-
(totalHeight/2);


/* DRAW */

for(const item of measured){

ctx.font=item.font;

ctx.fillStyle=item.color;

ctx.textAlign="center";

for(const line of item.lines){

ctx.fillText(
line,
540,
y
);

y+=item.lineHeight;

}

y+=item.gap;

}


/* BOTTOM LINE */

ctx.fillStyle="#2563eb";

roundRect(
ctx,
410,
985,
260,
7,
4
);

ctx.fill();


/* FOOTER */

ctx.fillStyle="#fff";

ctx.font=
"bold 30px Arial";

ctx.fillText(
"creatlk.com",
540,
1175
);

ctx.font=
"22px Arial";

ctx.globalAlpha=.9;

ctx.fillText(
"Learn English Every Day",
540,
1220
);

ctx.globalAlpha=1;


/* CREATE IMAGE */

canvas.toBlob(
async(blob)=>{

if(!blob){

alert(
"Unable to create share image."
);

return;

}


const file=
new File(
[blob],
"createlk-daily-lesson.png",
{
type:"image/png"
}
);


/* NATIVE SHARE */

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({

title:
"Daily Lesson",

text:
"For the full lesson: creatlk.com",

files:[file]

});

return;

}catch(error){

if(
error.name==="AbortError"
){

return;

}

}

}


/* FALLBACK DOWNLOAD */

const link=
document.createElement("a");

link.download=
"createlk-daily-lesson.png";

link.href=
URL.createObjectURL(blob);

link.click();

setTimeout(
()=>{
URL.revokeObjectURL(
link.href
);
},
1000
);

},
"image/png"
);

}


/* =========================
   WRAPPED TEXT
========================= */

function getWrappedLines(
ctx,
text,
maxWidth
){

const words=
String(text).split(/\s+/);

const lines=[];

let line="";

for(
const word of words
){

const test=
line
?
line+" "+word
:
word;

if(
ctx.measureText(test).width>
maxWidth &&
line
){

lines.push(line);

line=word;

}else{

line=test;

}

}

if(line){

lines.push(line);

}

return lines;

}


/* =========================
   ROUNDED RECT
========================= */

function roundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}


/* =========================
   SHARE BUTTON
========================= */

document.getElementById(
"shareButton"
).addEventListener(
"click",
shareDailyLesson
);


/* =========================
   START
========================= */

async function start(){

if(!getStudentId()){

location.href="login.html";

return;

}

await loadLesson();

}


start();
