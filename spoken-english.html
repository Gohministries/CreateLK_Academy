</style></head><body><header class="header">
<div class="header-inner">

<div>☰</div>

</header><main class="container"><section class="hero">
<div class="brand">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<p class="subtitle">
Learn Tamil → English conversations every day.
</p>
<div id="lessonDate" class="date">
Loading...
</div>
</section><section class="membership"><div class="membership-top"><div class="membership-title">

</div><div id="membershipStatus" class="status">
Checking...
</div></div><div id="membershipText" class="membership-text">
Checking membership...
</div><button
id="upgradeButton"
class="upgrade hidden"
type="button">

</button>

</section><h2 class="section-title">

</h2><div id="limitNote" class="note">

</div><div id="loading" class="loading">
Loading today's lesson...
</div><div id="error" class="error hidden"></div><section
id="lessonGrid"
class="lesson-grid hidden">
</section><button
id="shareButton"
class="share-btn hidden"
type="button">
📤 Share Today's Lesson
</button>

</main><footer class="footer">
© 2026 CreateLK Academy
</footer><script>

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const PAYMENT_API =
"https://createlk-premium-payments.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};
let currentFirstDialogue=null;


/* =========================
   STUDENT
========================= */

function loadStudent(){

try{

student=
JSON.parse(
localStorage.getItem(STUDENT_KEY)||"{}"
);

}catch(e){

student={};

}

}


/* =========================
   STUDENT ID
========================= */

function getStudentId(){

return Number(

student.id||
student.database_id||
student.student_id_number||
student.student_id||
0

);

}


/* =========================
   PREMIUM CHECK
========================= */

function isPremium(){

loadStudent();

const status=
String(

student.membership_status||
student.membershipStatus||
student.status||
"FREE"

).trim().toUpperCase();

const expiry=
student.membership_expiry||
student.membershipExpiry||
student.expiry||
"";

if(status!=="PREMIUM"){
return false;
}

if(!expiry){
return false;
}

const expiryDate=
new Date(expiry);

return(

!isNaN(
expiryDate.getTime()
)&&
expiryDate.getTime()>Date.now()

);

}


/* =========================
   DATE
========================= */

function setupDate(){

const now=
new Date();

document.getElementById(
"lessonDate"
).textContent=

now.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

return now;

}


/* =========================
   MEMBERSHIP
========================= */

function updateMembership(){

const premium=
isPremium();

const status=
document.getElementById(
"membershipStatus"
);

const text=
document.getElementById(
"membershipText"
);

const note=
document.getElementById(
"limitNote"
);

const upgrade=
document.getElementById(
"upgradeButton"
);

if(premium){

status.textContent=
"✓ Premium";

text.textContent=
"Premium is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";

upgrade.classList.add(
"hidden"
);

}else{

status.textContent=
"Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are free. Upgrade for all 10.";

upgrade.classList.remove(
"hidden"
);

}

return premium;

}


/* =========================
   TEXT FIELDS
========================= */

function getTamil(item){

return(

item.tamil||
item.ta||
item.tamil_text||
item.question_tamil||
item.text_tamil||
""

);

}


function getSinhala(item){

return(

item.sinhala||
item.si||
item.sinhala_text||
item.translation_sinhala||
item.text_sinhala||
""

);

}


function getEnglish(item){

return(

item.english||
item.en||
item.english_text||
item.answer_english||
item.text_english||
""

);

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   VOICE
========================= */

function listenEnglish(text){

if(!("speechSynthesis" in window)){

alert(
"Voice playback is not supported."
);

return;

}

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-US";
speech.rate=.9;

speechSynthesis.speak(speech);

}


/* =========================
   LESSON CARD
========================= */

function createCard(item,index){

const card=
document.createElement("article");

const isPremiumCard=
index>=3;

card.className=
"card "+
(
isPremiumCard
?"premium"
:"free"
);

const ta=
getTamil(item);

const si=
getSinhala(item);

const en=
getEnglish(item);

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${escapeHTML(ta)}
</div>

${
si
?
`
<div class="sinhala">
${escapeHTML(si)}
</div>
`
:""
}

<div class="english">
${escapeHTML(en)}
</div>

${
en
?
`
<button
class="listen"
type="button">
🔊 Listen
</button>
`
:""
}

<span class="badge ${
isPremiumCard
?"premium-badge"
:"free-badge"
}">

${
isPremiumCard
?"⭐ PREMIUM"
:"✓ FREE"
}

</span>

`;

const button=
card.querySelector(
".listen"
);

if(button){

button.onclick=
function(){

listenEnglish(en);

};

}

return card;

}


/* =========================
   FREE UPGRADE BOX
========================= */

function createUpgradeCard(){

const box=
document.createElement("div");

box.className=
"premium-box";

box.innerHTML=`

<h3>
⭐ Unlock All 10 Dialogues
</h3>

<p>
Upgrade to Premium for only LKR 499
and enjoy all 10 daily dialogues.
</p>

<button
class="upgrade"
type="button">
⭐ Upgrade to Premium — LKR 499
</button>

`;

box.querySelector(
".upgrade"
).onclick=checkout;

return box;

}


/* =========================
   API DATA
========================= */

function normalizeLesson(json){

let data=json;

if(
json &&
json.lesson &&
typeof json.lesson==="object"
){

data=json.lesson;

}

if(
json &&
json.data &&
typeof json.data==="object" &&
!Array.isArray(json.data)
){

data=json.data;

}

const dialogues=

data.dialogues||
data.conversations||
data.items||
data.lessons||
data.questions;

if(
!Array.isArray(dialogues)
){

throw new Error(
"No dialogues were returned by the lesson API."
);

}

return dialogues;

}


/* =========================
   LOAD LESSON
========================= */

async function loadLesson(){

const now=
setupDate();

const premium=
updateMembership();

try{

const monthDay=

String(
now.getMonth()+1
).padStart(2,"0")

+

"-"

+

String(
now.getDate()
).padStart(2,"0");


const response=
await fetch(

LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),

{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}

);


if(!response.ok){

throw new Error(
"Lesson service returned HTTP "+
response.status
);

}


const json=
await response.json();


const dialogues=
normalizeLesson(json);


if(
dialogues.length<3
){

throw new Error(
"Today's lesson has fewer than 3 dialogues."
);

}


const grid=
document.getElementById(
"lessonGrid"
);

grid.innerHTML="";


/*
 SAME HTML FOR FREE AND PREMIUM.
 ONLY THE LIMIT CHANGES.
*/

const limit=
premium
?10
:3;


const count=
Math.min(
limit,
dialogues.length
);


for(
let i=0;
i<count;
i++
){

grid.appendChild(

createCard(
dialogues[i],
i
)

);

}


/*
 FREE USERS GET ONE
 UPGRADE BOX AFTER
 THEIR 3 LESSONS.
*/

if(
!premium &&
dialogues.length>3
){

grid.appendChild(
createUpgradeCard()
);

}


currentFirstDialogue=
dialogues[0];


document.getElementById(
"loading"
).classList.add(
"hidden"
);


document.getElementById(
"error"
).classList.add(
"hidden"
);


grid.classList.remove(
"hidden"
);


document.getElementById(
"shareButton"
).classList.remove(
"hidden"
);


}catch(error){

console.error(error);

document.getElementById(
"loading"
).classList.add(
"hidden"
);

const box=
document.getElementById(
"error"
);

box.textContent=
"⚠️ "+error.message;

box.classList.remove(
"hidden"
);

}

}


/* =========================
   CHECKOUT
========================= */

async function checkout(){

loadStudent();

const studentId=
getStudentId();


if(!studentId){

location.href=
"login.html";

return;

}


try{

const response=
await fetch(

PAYMENT_API+
"/api/checkout",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

student_id:
studentId

})

}

);


const raw=
await response.text();


if(!response.ok){

throw new Error(
"Unable to open payment."
);

}


/*
 PAYHERE FORM
*/

if(
raw
.toLowerCase()
.includes("<form")
){

document.open();

document.write(
raw
);

document.close();

return;

}


/*
 JSON RESPONSE
*/

let data;

try{

data=
JSON.parse(raw);

}catch(e){

throw new Error(
"Invalid payment response."
);

}


const url=

data.url||
data.checkout_url||
data.payment_url||
data.redirect_url||
"";


if(!url){

throw new Error(
"Payment URL was not returned."
);

}


location.href=
url;


}catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
   SHARE LESSON
========================= */

async function shareLesson(){

if(!currentFirstDialogue){

alert(
"Lesson is not loaded yet."
);

return;

}


const ta=
getTamil(
currentFirstDialogue
);

const si=
getSinhala(
currentFirstDialogue
);

const en=
getEnglish(
currentFirstDialogue
);


const date=
document.getElementById(
"lessonDate"
).textContent;


const canvas=
document.createElement(
"canvas"
);

canvas.width=1080;
canvas.height=1350;

const ctx=
canvas.getContext(
"2d"
);


/* BACKGROUND */

const bg=
ctx.createLinearGradient(
0,0,1080,1350
);

bg.addColorStop(
0,
"#2563eb"
);

bg.addColorStop(
.5,
"#7c3aed"
);

bg.addColorStop(
1,
"#db2777"
);

ctx.fillStyle=
bg;

ctx.fillRect(
0,0,1080,1350
);


/* HEADER */

ctx.textAlign=
"center";

ctx.fillStyle=
"#fff";

ctx.font=
"bold 48px Arial";

ctx.fillText(
"📚 CreateLK Academy",
540,
105
);

ctx.font=
"bold 30px Arial";

ctx.fillText(
"DAILY SPOKEN ENGLISH",
540,
160
);

ctx.font=
"24px Arial";

ctx.fillText(
date,
540,
200
);


/* WHITE BOARD */

const boxX=70;
const boxY=255;
const boxW=940;
const boxH=755;

ctx.fillStyle=
"#fff";

roundRect(
ctx,
boxX,
boxY,
boxW,
boxH,
38
);

ctx.fill();


/*
 TEXT AREA
*/

const maxWidth=760;

const tamilLines=
getLines(
ctx,
ta,
maxWidth,
"bold 38px Arial"
);

const sinhalaLines=
getLines(
ctx,
si,
maxWidth,
"28px Arial"
);

const englishLines=
getLines(
ctx,
en,
maxWidth,
"bold 35px Arial"
);


/*
 HEIGHTS
*/

const tamilHeight=
tamilLines.length*58;

const sinhalaHeight=
sinhalaLines.length*48;

const englishHeight=
englishLines.length*55;

let gaps=0;

if(
tamilLines.length &&
sinhalaLines.length
){

gaps+=32;

}

if(
(tamilLines.length||
sinhalaLines.length) &&
englishLines.length
){

gaps+=42;

}


const totalHeight=

tamilHeight+
sinhalaHeight+
englishHeight+
gaps;


/*
 TRUE VERTICAL CENTER
*/

let y=
boxY+
(
boxH-totalHeight
)/2;


/*
 TAMIL
*/

if(
tamilLines.length
){

y=
drawLines(
ctx,
tamilLines,
540,
y,
58,
"bold 38px Arial",
"#172033"
);

}


/*
 SINHALA
*/

if(
sinhalaLines.length
){

if(
tamilLines.length
){

y+=32;

}

y=
drawLines(
ctx,
sinhalaLines,
540,
y,
48,
"28px Arial",
"#64748b"
);

}


/*
 ENGLISH
*/

if(
englishLines.length
){

if(
tamilLines.length||
sinhalaLines.length
){

y+=42;

}

drawLines(
ctx,
englishLines,
540,
y,
55,
"bold 35px Arial",
"#2563eb"
);

}


/* FOOTER */

ctx.fillStyle=
"#fff";

ctx.font=
"bold 30px Arial";

ctx.fillText(
"Learn English Every Day",
540,
1135
);

ctx.font=
"bold 28px Arial";

ctx.fillText(
"createlk.com",
540,
1185
);


/* CREATE IMAGE */

canvas.toBlob(
async function(blob){

if(!blob){

alert(
"Unable to create image."
);

return;

}


const file=
new File(
[blob],
"createlk-daily-english.png",
{
type:"image/png"
}
);


const shareText=

`🗣️ Daily Spoken English

${ta}

${en}

📚 Learn English Every Day
createlk.com`;


if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({

title:
"CreateLK Academy",

text:
shareText,

files:
[file]

});

return;

}catch(error){

if(
error.name===
"AbortError"
){

return;

}

}

}


/* FALLBACK */

const link=
document.createElement(
"a"
);

link.download=
"createlk-daily-english.png";

link.href=
URL.createObjectURL(
blob
);

link.click();

setTimeout(
function(){

URL.revokeObjectURL(
link.href
);

},
1000
);

},
"image/png"
);

}


/* =========================
   WRAP TEXT
========================= */

function getLines(
ctx,
text,
maxWidth,
font
){

const clean=
String(
text||""
).trim();

if(!clean){
return[];
}

ctx.font=
font;

const words=
clean.split(/\s+/);

const lines=[];

let line="";


for(
const word of words
){

const test=
line
?line+" "+word
:word;


if(
ctx.measureText(
test
).width>maxWidth &&
line
){

lines.push(
line
);

line=
word;

}else{

line=
test;

}

}


if(line){

lines.push(
line
);

}


return lines;

}


/* =========================
   DRAW LINES
========================= */

function drawLines(
ctx,
lines,
x,
y,
lineHeight,
font,
color
){

ctx.textAlign=
"center";

ctx.font=
font;

ctx.fillStyle=
color;


for(
const line of lines
){

ctx.fillText(
line,
x,
y
);

y+=lineHeight;

}


return y;

}


/* =========================
   ROUNDED RECTANGLE
========================= */

function roundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}


/* =========================
   BUTTON
========================= */

document
.getElementById(
"upgradeButton"
)
.addEventListener(
"click",
checkout
);


document
.getElementById(
"shareButton"
)
.addEventListener(
"click",
shareLesson
);


/* =========================
   START
========================= */

loadLesson();

</script></body>
