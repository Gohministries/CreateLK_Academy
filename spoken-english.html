</header><main class="container"><section class="hero">

<p class="subtitle">Learn Tamil → English conversations every day.</p>

</section><section class="membership"><div class="membership-top">

</div><a id="upgradeButton"

</section><h2 class="section-title">📖 TODAY'S LESSON</h2><div id="limitNote" class="note">
Loading today's lesson...

</div><div id="error" class="error hidden"></div><section id="lessonGrid" class="lesson-grid hidden"></section><button id="shareButton"
class="share-btn hidden"
type="button">
📤 Share Dialogue 1
</button>

</main><footer class="footer">
© 2026 CreateLK Academy
</footer><script>

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

/* DATE */

function setupDate(){

document.getElementById("lessonDate").textContent=
new Date().toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

}

/* STUDENT */

function getStudent(){

const keys=[
"createlk_student",
"student"
];

for(const key of keys){

const raw=localStorage.getItem(key);

if(!raw)continue;

try{

const data=JSON.parse(raw);

if(data)return data;

}catch(e){}

}

return null;

}

/* PREMIUM */

function isPremium(){

const student=getStudent();

if(!student)return false;

const status=String(
student.membership_status||
student.membershipStatus||
""
).trim().toUpperCase();

if(status!=="PREMIUM")return false;

const expiry=
student.membership_expiry||
student.membershipExpiry||
"";

if(!expiry)return false;

const expiryDate=new Date(expiry);

if(isNaN(expiryDate.getTime()))
return false;

return expiryDate.getTime()>Date.now();

}

/* MEMBERSHIP */

function updateMembership(){

const premium=isPremium();

const status=
document.getElementById("membershipStatus");

const text=
document.getElementById("membershipText");

const note=
document.getElementById("limitNote");

const upgrade=
document.getElementById("upgradeButton");

if(premium){

status.textContent="✓ Premium";

text.textContent=
"Premium is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";

upgrade.classList.add("hidden");

}else{

status.textContent="Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are free. Upgrade for all 10.";

upgrade.classList.remove("hidden");

}

return premium;

}

/* FIELDS */

function getTamil(x){
return x.tamil||x.ta||x.tamil_text||
x.question_tamil||x.text_tamil||"";
}

function getSinhala(x){
return x.sinhala||x.si||x.sinhala_text||
x.translation_sinhala||x.text_sinhala||"";
}

function getEnglish(x){
return x.english||x.en||x.english_text||
x.answer_english||x.text_english||"";
}

/* ESCAPE */

function esc(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* VOICE */

function listenEnglish(text){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-US";
speech.rate=.9;

speechSynthesis.speak(speech);

}

/* CARD */

function createCard(item,index){

const card=
document.createElement("article");

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

card.className=
"card "+(index<3?"free":"premium");

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${esc(ta)}
</div>

${si?`
<div class="sinhala">
${esc(si)}
</div>`:""}

<div class="english">
${esc(en)}
</div>

${en?`
<button class="listen" type="button">
🔊 Listen
</button>`:""}

<span class="badge ${
index<3?"free-badge":"premium-badge"
}">
${index<3?"✓ FREE":"⭐ PREMIUM"}
</span>
`;

const button=
card.querySelector(".listen");

if(button){
button.onclick=()=>listenEnglish(en);
}

return card;

}

/* UPGRADE */

function createUpgradeCard(){

const box=
document.createElement("div");

box.className="premium-box";

box.innerHTML=`

<div class="premium-box-title">
⭐ Continue Learning
</div>

<div class="premium-box-text">
You have completed today's 3 free dialogues.
<br><br>
Upgrade to Premium for all
<strong>10 daily dialogues</strong>.
</div>

<a href="premium.html"
class="premium-button">
⭐ Unlock All 10
</a>
`;

return box;

}

/* NORMALIZE */

function normalizeLesson(json){

let data=json;

if(json?.lesson)
data=json.lesson;

if(json?.data&&!Array.isArray(json.data))
data=json.data;

const dialogues=
data?.dialogues||
data?.conversations||
data?.items||
data?.lessons;

if(!Array.isArray(dialogues))
throw new Error("No dialogues were returned.");

return dialogues;

}

/* LOAD */

async function loadLesson(){

setupDate();

const premium=updateMembership();

try{

const now=new Date();

const monthDay=
String(now.getMonth()+1).padStart(2,"0")+
"-"+
String(now.getDate()).padStart(2,"0");

const response=
await fetch(
LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),
{
cache:"no-store",
headers:{
Accept:"application/json"
}
}
);

if(!response.ok)
throw new Error(
"Lesson service returned HTTP "+
response.status+"."
);

const json=
await response.json();

const dialogues=
normalizeLesson(json);

if(dialogues.length<3)
throw new Error(
"Today's lesson has fewer than 3 dialogues."
);

const grid=
document.getElementById("lessonGrid");

grid.innerHTML="";

const maximum=
premium
?Math.min(10,dialogues.length)
:3;

for(let i=0;i<maximum;i++){

grid.appendChild(
createCard(dialogues[i],i)
);

}

if(!premium){

grid.appendChild(
createUpgradeCard()
);

}

window.currentFirstDialogue=
dialogues[0];

document.getElementById("loading")
.classList.add("hidden");

document.getElementById("error")
.classList.add("hidden");

grid.classList.remove("hidden");

document.getElementById("shareButton")
.classList.remove("hidden");

}catch(error){

console.error(error);

document.getElementById("loading")
.classList.add("hidden");

const errorBox=
document.getElementById("error");

errorBox.textContent=
"⚠️ "+error.message;

errorBox.classList.remove("hidden");

}

}

/* SHARE IMAGE */

async function shareFirstDialogue(){

const item=
window.currentFirstDialogue;

if(!item)return;

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

const canvas=
document.createElement("canvas");

canvas.width=1080;
canvas.height=1350;

const ctx=
canvas.getContext("2d");

/* BLUE OUTER BACKGROUND */

const gradient=
ctx.createLinearGradient(
0,0,1080,1350
);

gradient.addColorStop(0,"#2563eb");
gradient.addColorStop(1,"#7c3aed");

ctx.fillStyle=gradient;
ctx.fillRect(0,0,1080,1350);

/* WHITE CARD */

ctx.fillStyle="#fff";

roundRect(
ctx,
55,
70,
970,
1210,
40
);

ctx.fill();

/* BRAND */

ctx.textAlign="center";

ctx.fillStyle="#2563eb";

ctx.font="bold 42px Arial";

ctx.fillText(
"📚 CreateLK Academy",
540,
145
);

ctx.fillStyle="#172033";

ctx.font="bold 34px Arial";

ctx.fillText(
"Daily Spoken English",
540,
205
);

ctx.strokeStyle="#e2e8f0";
ctx.lineWidth=2;

ctx.beginPath();
ctx.moveTo(150,235);
ctx.lineTo(930,235);
ctx.stroke();

/* FIRST LESSON */

ctx.fillStyle="#2563eb";

ctx.font="bold 23px Arial";

ctx.fillText(
"FIRST DAILY DIALOGUE",
540,
290
);

let y=370;

y=drawWrapped(
ctx,
ta,
540,
y,
800,
48,
"bold 35px Arial",
"#172033"
);

if(si){

y+=28;

y=drawWrapped(
ctx,
si,
540,
y,
800,
42,
"26px Arial",
"#64748b"
);

}

y+=35;

y=drawWrapped(
ctx,
en,
540,
y,
800,
48,
"bold 33px Arial",
"#1e293b"
);

/* BOTTOM */

ctx.fillStyle="#2563eb";

ctx.font="bold 30px Arial";

ctx.fillText(
"creatlk.com",
540,
1130
);

ctx.fillStyle="#475569";

ctx.font="24px Arial";

ctx.fillText(
"For full lesson visit creatlk.com",
540,
1180
);

canvas.toBlob(
async blob=>{

if(!blob)return;

const file=
new File(
[blob],
"createlk-daily-english.png",
{type:"image/png"}
);

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({files:[file]})
){

try{

await navigator.share({
title:"CreateLK Academy",
files:[file]
});

return;

}catch(e){

if(e.name==="AbortError")
return;

}

}

const link=
document.createElement("a");

link.download=
"createlk-daily-english.png";

link.href=
URL.createObjectURL(blob);

link.click();

setTimeout(
()=>URL.revokeObjectURL(link.href),
1000
);

},
"image/png"
);

}

/* ROUND RECT */

function roundRect(ctx,x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);

ctx.quadraticCurveTo(
x+w,y,x+w,y+r
);

ctx.lineTo(x+w,y+h-r);

ctx.quadraticCurveTo(
x+w,y+h,x+w-r,y+h
);

ctx.lineTo(x+r,y+h);

ctx.quadraticCurveTo(
x,y+h,x,y+h-r
);

ctx.lineTo(x,y+r);

ctx.quadraticCurveTo(
x,y,x+r,y
);

ctx.closePath();

}

/* WRAP TEXT */

function drawWrapped(
ctx,
text,
x,
y,
maxWidth,
lineHeight,
font,
color
){

ctx.font=font;
ctx.fillStyle=color;
ctx.textAlign="center";

const words=
String(text).split(/\s+/);

let line="";
const lines=[];

for(const word of words){

const test=
line?line+" "+word:word;

if(
ctx.measureText(test).width>
maxWidth&&line
){

lines.push(line);
line=word;

}else{

line=test;

}

}

if(line)
lines.push(line);

for(const value of lines){

ctx.fillText(
value,
x,
y
);

y+=lineHeight;

}

return y;

}

/* SHARE BUTTON */

document.getElementById(
"shareButton"
).addEventListener(
"click",
shareFirstDialogue
);

/* START */

loadLesson();

</script></body>
