<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Daily Spoken English | CreateLK Academy</title><style>

--b:#2563eb;
--p:#7c3aed;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f3f6fb
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--d)
}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid var(--l)
}

.nav{
max-width:900px;
margin:auto;
padding:10px 7px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:900;
color:var(--b);
text-decoration:none
}

.logo span{color:var(--p)}

.back{
font-size:10px;
font-weight:800;
text-decoration:none
}

main{
max-width:900px;
margin:auto;
padding:7px 2px
}

.card{
background:#fff;
border:1px solid var(--l);
border-radius:16px;
padding:16px;
margin-bottom:9px
}

.hero{
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
border:0;
padding:20px
}

.hero small{
font-size:9px;
font-weight:900
}

.hero h1{
font-size:22px;
margin:5px 0
}

.hero p{
font-size:10px
}

.info{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.day{
font-size:18px;
font-weight:900
}

.date{
font-size:9px;
color:var(--m);
margin-top:2px
}

.membership{
margin-top:12px;
padding-top:12px;
border-top:1px solid var(--l);
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.memberText{
font-size:9px;
color:var(--m)
}

.badge{
padding:7px 10px;
border-radius:9px;
font-size:9px;
font-weight:900;
white-space:nowrap
}

.premium{
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0
}

.free{
background:#f8fafc;
color:var(--m);
border:1px solid var(--l)
}

.sectionTitle{
font-size:10px;
font-weight:900;
color:var(--m);
margin-bottom:12px
}

.dialogue{
border:1px solid var(--l);
border-radius:13px;
padding:13px;
margin-bottom:9px
}

.dialogue:last-child{
margin-bottom:0
}

.label{
font-size:8px;
font-weight:900;
color:var(--m);
margin-bottom:8px
}

.tamil{
font-size:13px;
font-weight:800;
line-height:1.5
}

.english{
font-size:13px;
margin-top:5px;
line-height:1.5
}

.listen{
margin-top:9px;
border:0;
background:#eff6ff;
color:#2563eb;
border-radius:8px;
padding:7px 10px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.locked{
text-align:center;
padding:18px 10px;
background:#f8fafc;
border:1px dashed #cbd5e1;
border-radius:12px;
font-size:10px;
color:var(--m)
}

.complete{
width:100%;
border:0;
background:#059669;
color:#fff;
border-radius:10px;
padding:13px;
font-size:10px;
font-weight:900;
cursor:pointer;
margin-top:12px
}

.navButtons{
display:flex;
gap:8px;
margin-top:10px
}

.navButtons a{
flex:1;
text-align:center;
background:#fff;
border:1px solid var(--l);
border-radius:10px;
padding:11px;
font-size:10px;
font-weight:900
}

.status{
text-align:center;
padding:20px;
font-size:10px;
color:var(--m)
}

.error{color:#dc2626}

footer{
text-align:center;
font-size:8px;
color:var(--m);
padding:5px 0 18px
}

@media(max-width:380px){
.logo{font-size:14px}
.hero{padding:17px}
.hero h1{font-size:21px}
.card{padding:14px}
.tamil,.english{font-size:12px}
}
</style></head><body><header><div class="nav"><a class="logo" href="index.html">
📚 CreateLK <span>Academy</span>
</a><a class="back" href="dashboard.html">
← Dashboard
</a></div></header><main><section class="card hero"><small>DAILY SPOKEN ENGLISH</small>

<h1 id="welcome">
Welcome 👋
</h1><p>
Tamil → English conversations every day.
</p></section><section class="card"><div class="info"><div><div class="day" id="day">
DAY
</div><div class="date" id="date">
Loading...
</div></div><div>📖</div></div><div class="membership"><div class="memberText" id="memberText">
Checking membership...
</div><div id="badge" class="badge free">
Checking
</div></div></section><section class="card"><div class="sectionTitle" id="lessonTitle">
📖 TODAY'S LESSON
</div><div id="result" class="status">
Loading lesson...
</div></section><div class="navButtons"><a href="#" id="prev">
← Previous Lesson
</a><a href="#" id="next">
Next Lesson →
</a></div><footer>
© 2026 CreateLK Academy
</footer></main><script>

const API=
"https://createlk-course-lessons.createlk.workers.dev";

const ACCOUNT_API=
"https://createlk-auth-createlk.workers.dev";

const KEY="createlk_student";

let student={};
let premium=false;

try{

student=JSON.parse(
localStorage.getItem(KEY)||"{}"
);

}catch(e){

student={};

}

function studentId(){

return Number(
student.id||
student.database_id||
student.student_id||
student.student_id_number||
0
);

}

function membershipValue(){

return String(
student.membership_status||
student.membership||
student.status||
""
).trim().toUpperCase();

}

function checkPremium(){

const value=membershipValue();

return [
"PREMIUM",
"ACTIVE",
"PAID",
"PRO",
"PREMIUM_ACTIVE"
].includes(value);

}

async function refreshStudent(){

const id=studentId();

if(!id)return;

try{

const r=await fetch(
ACCOUNT_API+
"/api/student?id="+
encodeURIComponent(id),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)return;

const d=await r.json();

if(d.success&&d.student){

student={
...student,
...d.student,
id:Number(d.student.id||id)
};

localStorage.setItem(
KEY,
JSON.stringify(student)
);

}

}catch(e){

console.log("Account refresh failed",e);

}

}

function getDate(){

const p=
new URLSearchParams(location.search);

let value=p.get("date");

if(!/^\d{2}-\d{2}$/.test(value||"")){

const n=new Date();

value=
String(n.getMonth()+1).padStart(2,"0")+
"-"+
String(n.getDate()).padStart(2,"0");

}

const [m,d]=value.split("-").map(Number);

const now=new Date();

if(
m<1||
m>12||
d<1||
d>31
){

return {
value:
String(now.getMonth()+1).padStart(2,"0")+
"-"+
String(now.getDate()).padStart(2,"0"),
date:now
};

}

return {
value:value,
date:new Date(
now.getFullYear(),
m-1,
d
)
};

}

function dayNumber(date){

const start=
new Date(date.getFullYear(),0,1);

return Math.floor(
(
date-start
)/
86400000
)+1;

}

function formatDate(date){

return date.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

}

async function loadLesson(){

const selected=getDate();

document.getElementById("day")
.textContent=
"DAY "+dayNumber(selected.date);

document.getElementById("date")
.textContent=
formatDate(selected.date);

const result=
document.getElementById("result");

result.className="status";
result.textContent=
"Loading lesson...";

const date=selected.value;

try{

const r=await fetch(
API+
"?date="+
encodeURIComponent(date),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)
throw Error("Lesson could not be loaded.");

const data=await r.json();

if(!data.success)
throw Error(
data.error||
"Lesson not found."
);

const lesson=
data.lesson||
data.devotional||
data.data;

if(!lesson)
throw Error("No lesson data.");

const conversations=
lesson.conversations||
lesson.dialogues||
lesson.items||
[];

if(!Array.isArray(conversations)||
!conversations.length){

throw Error(
"No conversations available."
);

}

const limit=premium?10:3;

const visible=
conversations.slice(0,limit);

let html="";

visible.forEach((x,i)=>{

const tamil=
x.tamil||
x.ta||
x.question_ta||
x.tamil_text||
"";

const english=
x.english||
x.en||
x.answer_en||
x.english_text||
"";

html+=`

<div class="dialogue">

<div class="label">
DIALOGUE ${i+1} / ${limit}
</div>

<div class="tamil">
🇱🇰 ${escapeHTML(tamil)}
</div>

<div class="english">
🇬🇧 ${escapeHTML(english)}
</div>

<button
class="listen"
onclick="speak(${JSON.stringify(english)})">
🔊 Listen
</button>

</div>

`;

});

if(!premium&&conversations.length>3){

html+=`

<div class="locked">

⭐ <b>Premium</b><br><br>
Unlock all 10 daily conversations.

</div>

`;

}

html+=`

<button
class="complete"
onclick="completeLesson()">
✅ Complete Lesson
</button>

`;

result.className="";
result.innerHTML=html;

document.getElementById("lessonTitle")
.textContent=
"📖 DAILY LESSON";

}catch(e){

console.log(e);

result.className="status error";

result.textContent=
"⚠️ "+e.message;

}

}

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function speak(text){

if(!("speechSynthesis" in window))
return;

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";

speechSynthesis.speak(u);

}

async function completeLesson(){

const id=studentId();

if(!id){

alert("Please login again.");

return;

}

try{

const r=await fetch(
API+
"/api/progress",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
student_id:id,
lesson_date:getDate().value
})
}
);

if(r.ok){

alert("✅ Lesson completed!");

}else{

alert(
"Lesson could not be marked complete."
);

}

}catch(e){

alert(
"Connection error. Please try again."
);

}

}

function setupNavigation(){

const selected=getDate();

const current=selected.date;

const prev=
new Date(
current.getFullYear(),
current.getMonth(),
current.getDate()-1
);

const next=
new Date(
current.getFullYear(),
current.getMonth(),
current.getDate()+1
);

function link(date){

return "spoken-english.html?date="+
String(date.getMonth()+1).padStart(2,"0")+
"-"+
String(date.getDate()).padStart(2,"0");

}

document.getElementById("prev")
.href=link(prev);

const today=new Date();

today.setHours(0,0,0,0);

next.setHours(0,0,0,0);

if(next>today){

document.getElementById("next")
.style.opacity=".4";

document.getElementById("next")
.href="#";

}else{

document.getElementById("next")
.href=link(next);

}

}

async function start(){

if(!studentId()){

location.replace("login.html");
return;

}

await refreshStudent();

premium=checkPremium();

const name=(
(student.first_name||"")+" "+
(student.last_name||"")
).trim()||
student.name||
"Student";

document.getElementById("welcome")
.textContent=
"Welcome, "+name+" 👋";

const badge=
document.getElementById("badge");

const text=
document.getElementById("memberText");

if(premium){

badge.textContent="✓ Premium";
badge.className="badge premium";

text.textContent=
"10 dialogues available today.";

}else{

badge.textContent="Free";
badge.className="badge free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

}

setupNavigation();

await loadLesson();

}

start();

</script></body>
</html>
