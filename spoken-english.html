<div class="header-inner">

</header><main class="container"><section class="hero"><div class="brand-small">

</div><h1>🗣️ Daily Spoken English</h1><p class="subtitle">

</p><div id="lessonDate" class="date">

id="shareButton"
class="share-btn hidden"
type="button">

📤 Share Dialogue 1

</button></main><footer class="footer">
© 2026 CreateLK Academy
</footer><script>

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};
let currentFirstDialogue=null;


/* ================================
   LOAD STUDENT
================================ */

function loadStudent(){

const keys=[
"createlk_student",
"student",
"currentUser",
"user"
];

for(const key of keys){

const raw=
localStorage.getItem(key);

if(!raw) continue;

try{

const data=
JSON.parse(raw);

if(
data &&
typeof data==="object"
){

student=data;
return;

}

}catch(e){}

}

student={};

}


/* ================================
   EXPIRY CHECK
================================ */

function validExpiry(value){

if(!value) return false;

const expiry=
new Date(value);

if(
isNaN(expiry.getTime())
){
return false;
}

return expiry.getTime()>Date.now();

}


/* ================================
   PREMIUM CHECK
================================ */

function isPremium(){

loadStudent();


const status=
String(
student.membership_status ||
student.membershipStatus ||
student.membership_status_name ||
student.premium_status ||
student.premiumStatus ||
student.subscription_status ||
student.subscriptionStatus ||
student.status ||
""
)
.trim()
.toUpperCase();


const expiry=
student.membership_expiry ||
student.membershipExpiry ||
student.premium_expiry ||
student.premiumExpiry ||
student.subscription_expiry ||
student.subscriptionExpiry ||
"";


/*
Accepted active statuses.
*/

const activeStatus=
status==="PREMIUM" ||
status==="ACTIVE" ||
status==="PREMIUM_ACTIVE";


/*
Premium must also have
a valid expiry when expiry
is supplied.
*/

if(activeStatus){

if(!expiry){
return true;
}

return validExpiry(expiry);

}


/*
Some stored records may only
contain a future expiry.
*/

if(validExpiry(expiry)){
return true;
}


return false;

}


/* ================================
   MEMBERSHIP UI
================================ */

function updateMembership(){

const premium=
isPremium();

const status=
document.getElementById(
"membershipStatus"
);

const text=
document.getElementById(
"membershipText"
);

const note=
document.getElementById(
"limitNote"
);

const upgrade=
document.getElementById(
"upgradeButton"
);


if(premium){

status.textContent=
"✓ Premium";

text.textContent=
"Premium membership is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";

upgrade.classList.add("hidden");

}else{

status.textContent=
"Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are free. Upgrade to Premium for all 10 daily dialogues.";

upgrade.classList.remove("hidden");

}

return premium;

}


/* ================================
   DATE
================================ */

function setupDate(){

const now=
new Date();

document.getElementById(
"lessonDate"
).textContent=
now.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

}


/* ================================
   TEXT FIELDS
================================ */

function getTamil(item){

return String(
item.tamil ||
item.ta ||
item.tamil_text ||
item.question_tamil ||
item.text_tamil ||
""
);

}

function getSinhala(item){

return String(
item.sinhala ||
item.si ||
item.sinhala_text ||
item.translation_sinhala ||
item.text_sinhala ||
""
);

}

function getEnglish(item){

return String(
item.english ||
item.en ||
item.english_text ||
item.answer_english ||
item.text_english ||
""
);

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   LISTEN
================================ */

function listenEnglish(text){

if(!("speechSynthesis" in window)){

alert(
"Voice playback is not supported on this device."
);

return;

}

window.speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-US";
speech.rate=.9;

window.speechSynthesis.speak(speech);

}


/* ================================
   LESSON CARD
================================ */

function createCard(item,index){

const card=
document.createElement("article");

const ta=
getTamil(item);

const si=
getSinhala(item);

const en=
getEnglish(item);

card.className=
"card "+
(index<3?"free":"premium");

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${escapeHTML(ta)}
</div>

${
si
?`
<div class="sinhala">
${escapeHTML(si)}
</div>
`
:""
}

<div class="english">
${escapeHTML(en)}
</div>

${
en
?`
<button
type="button"
class="listen">

🔊 Listen

</button>
`
:""
}

<span class="badge ${
index<3
?"free-badge"
:"premium-badge"
}">

${
index<3
?"✓ FREE"
:"⭐ PREMIUM"
}

</span>

`;

const listen=
card.querySelector(".listen");

if(listen){

listen.onclick=
function(){

listenEnglish(en);

};

}

return card;

}


/* ================================
   PREMIUM CARD
================================ */

function createUpgradeCard(){

const box=
document.createElement("div");

box.className=
"premium-box";

box.innerHTML=`

<div class="premium-box-title">
⭐ Continue Learning
</div>

<div class="premium-box-text">

You have completed today's
3 free dialogues.

<br><br>

Upgrade to Premium to unlock
<strong>10 daily spoken English dialogues</strong>
every day.

</div>

<a
href="premium.html"
class="premium-button">

⭐ Unlock All 10 Daily Dialogues

</a>

`;

return box;

}


/* ================================
   NORMALIZE CLOUDFLARE
================================ */

function normalizeLesson(json){

let data=json;

if(
json &&
json.lesson &&
typeof json.lesson==="object"
){

data=json.lesson;

}

if(
json &&
json.data &&
!Array.isArray(json.data) &&
typeof json.data==="object"
){

data=json.data;

}

const dialogues=
data.dialogues ||
data.conversations ||
data.items ||
data.lessons ||
[];


if(!Array.isArray(dialogues)){

throw new Error(
"No dialogues were returned by Cloudflare."
);

}

return {
dialogues:dialogues
};

}


/* ================================
   LOAD TODAY'S LESSON
================================ */

async function loadLesson(){

setupDate();

const premium=
updateMembership();

try{

const now=
new Date();

const monthDay=
String(
now.getMonth()+1
).padStart(2,"0")
+
"-"+
String(
now.getDate()
).padStart(2,"0");


let response=
await fetch(

LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),

{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}

);


/*
Fallback route.
*/

if(
!response.ok
){

response=
await fetch(

LESSON_API+
"/api/lesson?month_day="+
encodeURIComponent(monthDay),

{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}

);

}


if(!response.ok){

throw new Error(
"Cloudflare lesson API returned HTTP "+
response.status+"."
);

}


const json=
await response.json();

const lesson=
normalizeLesson(json);


if(
lesson.dialogues.length<3
){

throw new Error(
"Today's lesson has fewer than 3 dialogues."
);

}


const grid=
document.getElementById(
"lessonGrid"
);

grid.innerHTML="";


/*
FREE:
3 lessons + upgrade card.
*/

if(!premium){

for(
let i=0;
i<Math.min(
3,
lesson.dialogues.length
);
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}

grid.appendChild(
createUpgradeCard()
);

}


/*
PREMIUM:
all available lessons,
maximum 10.
*/

else{

const maximum=
Math.min(
10,
lesson.dialogues.length
);

for(
let i=0;
i<maximum;
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}

}


currentFirstDialogue=
lesson.dialogues[0];


document.getElementById(
"loading"
).classList.add("hidden");

document.getElementById(
"error"
).classList.add("hidden");

grid.classList.remove("hidden");

document.getElementById(
"shareButton"
).classList.remove("hidden");


}catch(error){

console.error(error);

document.getElementById(
"loading"
).classList.add("hidden");

const box=
document.getElementById("error");

box.textContent=
"⚠️ "+
(
error.message ||
"Unable to load today's lesson."
);

box.classList.remove("hidden");

}

}


/* ================================
   SHARE DIALOGUE 1
================================ */

async function shareFirstDialogue(){

const item=
currentFirstDialogue;

if(!item){

alert(
"Today's lesson is not loaded yet."
);

return;

}

const ta=
getTamil(item);

const si=
getSinhala(item);

const en=
getEnglish(item);

const date=
document.getElementById(
"lessonDate"
).textContent;


/*
Professional 4:5
social image.

1080 × 1350
*/

const canvas=
document.createElement("canvas");

canvas.width=1080;
canvas.height=1350;

const ctx=
canvas.getContext("2d");


/* Background */

const gradient=
ctx.createLinearGradient(
0,0,1080,1350
);

gradient.addColorStop(
0,
"#2563eb"
);

gradient.addColorStop(
1,
"#7c3aed"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
1080,
1350
);


/* Decorative circle */

ctx.fillStyle=
"rgba(255,255,255,.12)";

ctx.beginPath();

ctx.arc(
950,
70,
190,
0,
Math.PI*2
);

ctx.fill();


/* Header */

ctx.fillStyle="#fff";
ctx.textAlign="center";

ctx.font=
"bold 46px Arial";

ctx.fillText(
"📚 CreateLK Academy",
540,
95
);

ctx.font=
"bold 36px Arial";

ctx.fillText(
"🗣️ Daily Spoken English",
540,
150
);

ctx.font=
"24px Arial";

ctx.fillText(
date,
540,
195
);


/* White lesson card */

ctx.fillStyle="#fff";

roundRect(
ctx,
55,
255,
970,
850,
36
);

ctx.fill();


/* Content */

let y=350;

y=
drawWrapped(
ctx,
ta,
y,
820,
50,
"bold 36px Arial",
"#172033"
);

if(si){

y+=35;

y=
drawWrapped(
ctx,
si,
y,
820,
44,
"26px Arial",
"#475569"
);

}

if(en){

y+=40;

y=
drawWrapped(
ctx,
en,
y,
820,
50,
"bold 34px Arial",
"#1e293b"
);

}


/* Bottom branding */

ctx.fillStyle="#fff";

ctx.font=
"bold 30px Arial";

ctx.fillText(
"creatlk.com",
540,
1195
);

ctx.font=
"22px Arial";

ctx.fillText(
"Daily English Learning",
540,
1235
);


canvas.toBlob(
async function(blob){

if(!blob){

alert(
"Unable to create share image."
);

return;

}

const file=
new File(
[blob],
"createlk-daily-english.png",
{
type:"image/png"
}
);


/*
Native phone share.
*/

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({

title:
"CreateLK Academy",

text:
"Daily Spoken English",

files:[file]

});

return;

}catch(error){

if(
error.name==="AbortError"
){

return;

}

}

}


/*
Fallback.
*/

const link=
document.createElement("a");

link.download=
"createlk-daily-english.png";

link.href=
URL.createObjectURL(blob);

link.click();

setTimeout(
function(){

URL.revokeObjectURL(
link.href
);

},
1000
);

},
"image/png"
);

}


/* ================================
   CANVAS ROUND RECT
================================ */

function roundRect(
ctx,
x,
y,
width,
height,
radius
){

ctx.beginPath();

ctx.moveTo(
x+radius,
y
);

ctx.lineTo(
x+width-radius,
y
);

ctx.quadraticCurveTo(
x+width,
y,
x+width,
y+radius
);

ctx.lineTo(
x+width,
y+height-radius
);

ctx.quadraticCurveTo(
x+width,
y+height,
x+width-radius,
y+height
);

ctx.lineTo(
x+radius,
y+height
);

ctx.quadraticCurveTo(
x,
y+height,
x,
y+height-radius
);

ctx.lineTo(
x,
y+radius
);

ctx.quadraticCurveTo(
x,
y,
x+radius,
y
);

ctx.closePath();

}


/* ================================
   WRAPPED TEXT
================================ */

function drawWrapped(
ctx,
text,
x,
y,
maxWidth,
lineHeight,
font,
color
){

ctx.font=font;
ctx.fillStyle=color;
ctx.textAlign="center";

const words=
String(text)
.split(/\s+/);

let line="";
const lines=[];

for(
let i=0;
i<words.length;
i++
){

const test=
line
?line+" "+words[i]
:words[i];

if(
ctx.measureText(test).width>
maxWidth &&
line
){

lines.push(line);
line=words[i];

}else{

line=test;

}

}

if(line){
lines.push(line);
}

lines.forEach(
function(value,index){

ctx.fillText(
value,
x,
y+(index*lineHeight)
);

}
);

return y+
(lines.length*lineHeight);

}


/* ================================
   SHARE BUTTON
================================ */

document.getElementById(
"shareButton"
).addEventListener(
"click",
shareFirstDialogue
);


/* ================================
   START
================================ */

loadLesson();

</script></body>
