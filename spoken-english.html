<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Daily Spoken English | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --b:#2563eb;--p:#7c3aed;--g:#f59e0b;
 --bg:#f4f7fb;--t:#172033;--m:#64748b;
 --br:#e2e8f0
}
body{
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);color:var(--t)
}
header{
 background:linear-gradient(135deg,var(--b),var(--p));
 color:#fff;padding:12px
}
.nav,.main{max-width:700px;margin:auto}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:16px;font-weight:900}
.menu{font-size:21px}
.main{padding:10px}
.hero,.membership,.card,.upgrade-box{
 background:#fff;border:1px solid var(--br);border-radius:14px
}
.hero{padding:15px;margin-bottom:9px}
.brand{font-size:10px;color:var(--b);font-weight:900}
h1{font-size:21px;margin:3px 0}
.sub,.date,.membership-text,.note{
 color:var(--m);font-size:11px;line-height:1.45
}
.date{margin-top:6px}
.membership{
 background:#fffbeb;border-color:#fed7aa;padding:12px;margin-bottom:10px
}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mtitle{font-size:12px;font-weight:900;color:#92400e}
.status{
 background:#dcfce7;color:#166534;border-radius:20px;
 padding:4px 8px;font-size:9px;font-weight:900
}
.membership-text{color:#78350f;margin-top:5px}
button{
 font-family:inherit;cursor:pointer
}
.upgrade,.pay{
 width:100%;border:0;border-radius:9px;
 background:var(--g);color:#fff;font-weight:900
}
.upgrade{padding:9px;margin-top:8px;font-size:10px}
.hidden{display:none!important}
.title{font-size:15px;font-weight:900;margin:13px 2px 7px}
.note{
 background:#eff6ff;border:1px solid #bfdbfe;
 color:#1e40af;border-radius:9px;padding:8px 10px;margin-bottom:8px
}
.lessons{display:flex;flex-direction:column;gap:8px}
.card{padding:13px;border-left:4px solid #16a34a}
.card.premium{border-left-color:var(--g)}
.num{font-size:9px;color:var(--b);font-weight:900;margin-bottom:7px}
.ta{font-size:14px;font-weight:800;line-height:1.4;margin-bottom:6px}
.si{font-size:11px;color:#475569;line-height:1.4;margin-bottom:6px}
.en{font-size:13px;font-weight:700;line-height:1.45}
.listen{
 border:0;background:#eff6ff;color:var(--b);
 border-radius:7px;padding:6px 9px;font-size:9px;
 font-weight:800;margin-top:8px
}
.badge{
 display:inline-block;margin-top:7px;padding:3px 7px;
 border-radius:20px;font-size:8px;font-weight:900
}
.free{background:#dcfce7;color:#166534}
.pro{background:#fef3c7;color:#92400e}
.upgrade-box{
 background:#fffbeb;border-color:#fbbf24;
 padding:14px;text-align:center;margin-top:8px
}
.upgrade-box h3{font-size:14px;color:#92400e}
.upgrade-box p{
 font-size:10px;color:#78350f;line-height:1.5;margin:5px 0
}
.pay{padding:9px;font-size:10px}
.share{
 width:100%;border:0;border-radius:10px;
 background:linear-gradient(135deg,var(--b),var(--p));
 color:#fff;padding:10px;margin-top:9px;
 font-size:10px;font-weight:900
}
.loading,.error{
 background:#fff;border-radius:10px;padding:18px;
 text-align:center;font-size:11px
}
.error{background:#fef2f2;color:#991b1b}
footer{text-align:center;color:var(--m);font-size:9px;padding:15px}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<div class="menu">☰</div>
</div>
</header>

<main class="main">

<section class="hero">
<div class="brand">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<div class="sub">Learn practical Tamil and Sinhala conversations in English.</div>
<div id="date" class="date"></div>
</section>

<section class="membership">
<div class="mtop">
<div class="mtitle">⭐ Premium Membership</div>
<div id="status" class="status">Checking...</div>
</div>

<div id="membershipText" class="membership-text">
Checking membership...
</div>

<button id="upgrade" class="upgrade hidden" onclick="checkout()">
⭐ Upgrade to Premium
</button>
</section>

<div class="title">📖 TODAY'S LESSON</div>

<div id="note" class="note">Loading lesson...</div>

<div id="loading" class="loading">
Loading today's lesson...
</div>

<div id="error" class="error hidden"></div>

<section id="lessons" class="lessons hidden"></section>

<button id="share" class="share hidden" onclick="shareLesson()">
📤 Share Dialogue 1
</button>

</main>

<footer>© 2026 CreateLK Academy</footer>

<script>

const LESSON_API="https://createlk-course-lessons.createlk.workers.dev";
const PAYMENT_API="https://createlk-premium-payments.createlk.workers.dev";
const KEY="createlk_student";

let student={};
let first=null;

try{
 student=JSON.parse(localStorage.getItem(KEY)||"{}");
}catch(e){student={}}

const id=()=>Number(
 student.id||
 student.database_id||
 student.student_id_number||
 student.student_id||
 0
);

function premium(){

 const status=String(
  student.membership_status||
  student.membershipStatus||
  student.status||
  ""
 ).toUpperCase();

 const expiry=
  student.membership_expiry||
  student.membershipExpiry||
  "";

 if(status!=="PREMIUM"||!expiry)return false;

 const d=new Date(expiry);

 return !isNaN(d.getTime())&&d.getTime()>Date.now();
}

function text(x,type){

 if(type==="ta")
  return x.tamil||x.ta||x.tamil_text||x.question_tamil||x.text_tamil||"";

 if(type==="si")
  return x.sinhala||x.si||x.sinhala_text||x.translation_sinhala||x.text_sinhala||"";

 return x.english||x.en||x.english_text||x.answer_english||x.text_english||"";
}

function esc(x){
 return String(x||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function membershipUI(){

 const pro=premium();

 status.textContent=pro?"✓ Premium":"Free";

 membershipText.textContent=pro
 ?"Premium is active. All 10 daily dialogues are unlocked."
 :"3 dialogues are free. Upgrade to Premium for all 10 daily dialogues.";

 note.innerHTML=pro
 ?"<b>⭐ Premium:</b> All 10 daily dialogues are available."
 :"<b>Free:</b> Dialogues 1–3 are free. Upgrade for all 10.";

 upgrade.classList.toggle("hidden",pro);

 return pro;
}

function card(x,i){

 const ta=text(x,"ta");
 const si=text(x,"si");
 const en=text(x,"en");

 const c=document.createElement("article");

 c.className="card "+(i>2?"premium":"");

 c.innerHTML=`
 <div class="num">DIALOGUE ${i+1}</div>
 <div class="ta">${esc(ta)}</div>
 ${si?`<div class="si">${esc(si)}</div>`:""}
 <div class="en">${esc(en)}</div>
 ${en?`<button class="listen">🔊 Listen</button>`:""}
 <span class="badge ${i<3?"free":"pro"}">
 ${i<3?"✓ FREE":"⭐ PREMIUM"}
 </span>`;

 const b=c.querySelector(".listen");

 if(b)b.onclick=()=>{
  speechSynthesis.cancel();
  const s=new SpeechSynthesisUtterance(en);
  s.lang="en-US";
  s.rate=.9;
  speechSynthesis.speak(s);
 };

 return c;
}

function upgradeCard(){

 const d=document.createElement("div");

 d.className="upgrade-box";

 d.innerHTML=`
 <h3>⭐ Continue Learning</h3>
 <p>
 Today's 3 free dialogues are available above.
 Upgrade to Premium for <b>10 daily dialogues</b>.
 </p>
 <button class="pay" onclick="checkout()">
 ⭐ Unlock All 10 Dialogues
 </button>`;

 return d;
}

async function load(){

 date.textContent=new Date().toLocaleDateString(
  "en-US",{month:"long",day:"numeric",year:"numeric"}
 );

 const pro=membershipUI();

 try{

  const n=new Date();

  const md=
   String(n.getMonth()+1).padStart(2,"0")+
   "-"+
   String(n.getDate()).padStart(2,"0");

  const r=await fetch(
   LESSON_API+"/api/today?month_day="+encodeURIComponent(md),
   {cache:"no-store"}
  );

  if(!r.ok)
   throw Error("Lesson service returned HTTP "+r.status);

  const j=await r.json();

  const data=j.lesson||j.data||j;

  const arr=
   data.dialogues||
   data.conversations||
   data.items||
   data.lessons;

  if(!Array.isArray(arr)||arr.length<3)
   throw Error("Today's lesson is unavailable.");

  first=arr[0];

  lessons.innerHTML="";

  const max=pro?Math.min(10,arr.length):3;

  for(let i=0;i<max;i++)
   lessons.appendChild(card(arr[i],i));

  if(!pro)
   lessons.appendChild(upgradeCard());

  loading.classList.add("hidden");
  lessons.classList.remove("hidden");
  share.classList.remove("hidden");

 }catch(e){

  loading.classList.add("hidden");
  error.textContent="⚠️ "+e.message;
  error.classList.remove("hidden");

 }
}

async function checkout(){

 const sid=id();

 if(!sid){
  location.href="login.html";
  return;
 }

 upgrade.disabled=true;
 upgrade.textContent="Opening payment...";

 try{

  const r=await fetch(
   PAYMENT_API+"/api/checkout",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({student_id:sid})
   }
  );

  const raw=await r.text();

  if(!r.ok)
   throw Error("Payment checkout failed.");

  if(raw.toLowerCase().includes("<form")){
   document.open();
   document.write(raw);
   document.close();
   return;
  }

  const j=JSON.parse(raw);

  const url=
   j.url||
   j.checkout_url||
   j.payment_url||
   j.redirect_url;

  if(!url)throw Error("Payment link was not returned.");

  location.href=url;

 }catch(e){

  alert(e.message);
  upgrade.disabled=false;
  upgrade.textContent="⭐ Upgrade to Premium";

 }
}

function wrap(ctx,text,x,y,w,line,font,color){

 ctx.font=font;
 ctx.fillStyle=color;

 const words=String(text||"").split(/\s+/);
 let s="";

 for(const word of words){

  const test=s?s+" "+word:word;

  if(ctx.measureText(test).width>w&&s){

   ctx.fillText(s,x,y);
   y+=line;
   s=word;

  }else s=test;

 }

 if(s){
  ctx.fillText(s,x,y);
  y+=line;
 }

 return y;
}

function round(ctx,x,y,w,h,r){

 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);
 ctx.closePath();
}

async function shareLesson(){

 if(!first)return;

 const ta=text(first,"ta");
 const si=text(first,"si");
 const en=text(first,"en");

 const c=document.createElement("canvas");
 c.width=1080;
 c.height=1350;

 const x=c.getContext("2d");

 x.fillStyle="#f4f7fb";
 x.fillRect(0,0,1080,1350);

 x.textAlign="center";
 x.fillStyle="#2563eb";
 x.font="bold 45px Arial";
 x.fillText("CreateLK Academy",540,90);

 x.fillStyle="#172033";
 x.font="bold 34px Arial";
 x.fillText("Daily Spoken English",540,145);

 x.fillStyle="#fff";
 round(x,55,205,970,850,30);
 x.fill();

 x.strokeStyle="#e2e8f0";
 x.stroke();

 x.textAlign="left";

 let y=285;

 x.fillStyle="#2563eb";
 x.font="bold 24px Arial";
 x.fillText("DIALOGUE 1",115,y);

 y+=65;

 y=wrap(x,ta,115,y,850,45,"bold 31px Arial","#172033");
 y+=30;

 if(si){
  y=wrap(x,si,115,y,850,40,"25px Arial","#475569");
  y+=30;
 }

 wrap(x,en,115,y,850,46,"bold 30px Arial","#1e293b");

 x.textAlign="center";
 x.fillStyle="#2563eb";
 x.font="bold 30px Arial";
 x.fillText("CreateLK.com",540,1165);

 x.fillStyle="#475569";
 x.font="22px Arial";
 x.fillText("For full lesson visit creatlk.com",540,1210);

 c.toBlob(async blob=>{

  if(!blob)return;

  const file=new File(
   [blob],
   "createlk-dialogue-1.png",
   {type:"image/png"}
  );

  if(
   navigator.share&&
   navigator.canShare&&
   navigator.canShare({files:[file]})
  ){

   try{
    await navigator.share({files:[file]});
    return;
   }catch(e){
    if(e.name==="AbortError")return;
   }

  }

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="createlk-dialogue-1.png";
  a.click();

 }, "image/png");
}

load();

</script>

</body>
</html>
