<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>CreateLK Academy | Daily Spoken English</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--blue:#2563eb;--blue2:#1d4ed8;--bg:#f4f7fb;
--text:#172033;--muted:#64748b;--green:#16a34a;
--gold:#f59e0b;--border:#e2e8f0
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px}
.header-inner{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:900}.menu{font-size:25px}
.container{width:100%;max-width:700px;margin:auto;padding:14px 12px 35px}
.hero{background:#fff;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.brand-small{color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.6px;margin-bottom:5px}
h1{font-size:24px;margin-bottom:5px}.subtitle{color:var(--muted);font-size:14px;line-height:1.5}
.date{margin-top:15px;font-size:14px;font-weight:800}
.membership{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa;border-radius:16px;padding:14px;margin-bottom:14px}
.membership-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.membership-title{color:#92400e;font-weight:900}
.status{background:#dcfce7;color:#166534;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.membership-text{color:#78350f;font-size:13px;line-height:1.5;margin-top:7px}
.upgrade{display:block;margin-top:10px;background:var(--gold);color:#fff;text-decoration:none;text-align:center;padding:11px;border-radius:10px;font-weight:900}
.hidden{display:none!important}
.section-title{font-size:19px;font-weight:900;margin:18px 3px 10px}
.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:12px}
.lesson-grid{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:17px;padding:18px;min-height:210px;border:1px solid var(--border);box-shadow:0 3px 12px rgba(15,23,42,.05);display:flex;flex-direction:column}
.card.free{border-top:4px solid var(--green)}.card.premium{border-top:4px solid var(--gold)}
.number{color:var(--blue);font-size:11px;font-weight:900;margin-bottom:14px}
.tamil{font-size:17px;font-weight:800;line-height:1.5;margin-bottom:12px}
.sinhala{color:#475569;font-size:14px;line-height:1.5;margin-bottom:12px}
.english{color:#1e293b;font-size:15px;line-height:1.55;flex:1}
.listen{border:0;background:#eff6ff;color:var(--blue);border-radius:9px;padding:9px 11px;margin-top:14px;font-weight:800;cursor:pointer;align-self:flex-start}
.badge{display:inline-block;align-self:flex-start;margin-top:12px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}
.free-badge{background:#dcfce7;color:#166534}.premium-badge{background:#fef3c7;color:#92400e}
.premium-box{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:2px solid #fbbf24;border-radius:17px;padding:20px;text-align:center}
.premium-box-title{color:#92400e;font-size:18px;font-weight:900;margin-bottom:8px}
.premium-box-text{color:#78350f;font-size:13px;line-height:1.6}
.premium-button{display:block;background:var(--gold);color:#fff;text-decoration:none;padding:12px;border-radius:10px;margin-top:13px;font-size:14px;font-weight:900}
.share-btn{width:100%;border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:13px;padding:13px;margin-top:14px;font-size:14px;font-weight:900;cursor:pointer}
.loading{background:#fff;border-radius:15px;padding:25px;text-align:center;color:var(--muted)}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:15px;font-size:14px;line-height:1.5}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:430px){
.container{padding-left:10px;padding-right:10px}
.card{min-height:210px;padding:16px}
.tamil{font-size:16px}.sinhala,.english{font-size:14px}h1{font-size:22px}
}
</style></head><body><header class="header">
<div class="header-inner">
<div class="logo">📚 CreateLK Academy</div>
<div class="menu">☰</div>
</div>
</header><main class="container"><section class="hero">
<div class="brand-small">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<p class="subtitle">Learn Tamil → English conversations every day.</p>
<div id="lessonDate" class="date">Loading...</div>
</section><section class="membership">
<div class="membership-top">
<div class="membership-title">⭐ Premium Membership</div>
<div id="membershipStatus" class="status">Checking...</div>
</div><div id="membershipText" class="membership-text">
Checking membership...
</div><a id="upgradeButton" href="premium.html" class="upgrade hidden">
⭐ Upgrade to Premium
</a>
</section><h2 class="section-title">📖 TODAY'S LESSON</h2><div id="limitNote" class="note">
Loading today's lesson...
</div><div id="loading" class="loading">
Loading today's lesson...
</div><div id="error" class="error hidden"></div><section id="lessonGrid" class="lesson-grid hidden"></section><button id="shareButton" class="share-btn hidden" type="button">
📤 Share Dialogue 1
</button></main><footer class="footer">© 2026 CreateLK Academy</footer><script>

const LESSON_API="https://spokenlessons.createlk.workers.dev";

function setupDate(){
const d=new Date();
document.getElementById("lessonDate").textContent=
d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}

function getStudent(){
for(const key of ["createlk_student","student","currentUser","user"]){
const raw=localStorage.getItem(key);
if(!raw)continue;
try{
const data=JSON.parse(raw);
if(data)return data;
}catch(e){}
}
return null;
}

function isPremium(){
const s=getStudent();
if(!s)return false;

const status=String(
s.membership_status||s.membershipStatus||""
).trim().toUpperCase();

if(status!=="PREMIUM")return false;

const expiry=s.membership_expiry||s.membershipExpiry||"";
if(!expiry)return false;

const date=new Date(expiry);
return !isNaN(date.getTime())&&date.getTime()>Date.now();
}

function updateMembership(){
const premium=isPremium();
const status=document.getElementById("membershipStatus");
const text=document.getElementById("membershipText");
const note=document.getElementById("limitNote");
const upgrade=document.getElementById("upgradeButton");

if(premium){
status.textContent="✓ Premium";
text.textContent="Premium membership is active. All 10 daily dialogues are unlocked.";
note.innerHTML="<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";
upgrade.classList.add("hidden");
}else{
status.textContent="Free";
text.textContent="3 dialogues are free. Upgrade to Premium for all 10 daily dialogues.";
note.innerHTML="<strong>Free:</strong> Dialogues 1–3 are free. Premium unlocks all 10 daily dialogues.";
upgrade.classList.remove("hidden");
}
return premium;
}

function getTamil(x){
return x.tamil||x.ta||x.tamil_text||x.question_tamil||x.text_tamil||"";
}

function getSinhala(x){
return x.sinhala||x.si||x.sinhala_text||x.translation_sinhala||x.text_sinhala||"";
}

function getEnglish(x){
return x.english||x.en||x.english_text||x.answer_english||x.text_english||"";
}

function esc(x){
return String(x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function listenEnglish(text){
if(!("speechSynthesis" in window)){
alert("Voice playback is not supported on this device.");
return;
}
speechSynthesis.cancel();
const s=new SpeechSynthesisUtterance(text);
s.lang="en-US";
s.rate=.9;
speechSynthesis.speak(s);
}

function createCard(item,index){
const card=document.createElement("article");
const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

card.className="card "+(index<3?"free":"premium");

card.innerHTML=`
<div class="number">DIALOGUE ${index+1}</div>
<div class="tamil">${esc(ta)}</div>
${si?`<div class="sinhala">${esc(si)}</div>`:""}
<div class="english">${esc(en)}</div>
${en?`<button type="button" class="listen">🔊 Listen</button>`:""}
<span class="badge ${index<3?"free-badge":"premium-badge"}">
${index<3?"✓ FREE":"⭐ PREMIUM"}
</span>
`;

const button=card.querySelector(".listen");
if(button)button.onclick=()=>listenEnglish(en);

return card;
}

function createUpgradeCard(){
const box=document.createElement("div");
box.className="premium-box";
box.innerHTML=`
<div class="premium-box-title">⭐ Continue Learning</div>
<div class="premium-box-text">
You have today's <strong>3 free dialogues</strong>.
<br><br>
Upgrade to Premium to unlock
<strong>10 daily spoken English dialogues</strong>
every day.
</div>
<a href="premium.html" class="premium-button">
⭐ Unlock All 10 Daily Dialogues
</a>
`;
return box;
}

function normalizeLesson(json){
let data=json;
if(json&&json.lesson)data=json.lesson;
if(json&&json.data&&!Array.isArray(json.data))data=json.data;

const dialogues=
data.dialogues||
data.conversations||
data.items||
data.lessons;

if(!Array.isArray(dialogues)){
throw new Error("No dialogues were returned by Cloudflare.");
}

return {dialogues};
}

async function loadLesson(){

setupDate();
const premium=updateMembership();

try{

const d=new Date();

const monthDay=
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

const response=await fetch(
LESSON_API+"/api/today?month_day="+encodeURIComponent(monthDay),
{
method:"GET",
cache:"no-store",
headers:{"Accept":"application/json"}
}
);

if(!response.ok){
throw new Error(
"Cloudflare lesson API returned HTTP "+response.status+"."
);
}

const lesson=normalizeLesson(await response.json());

if(lesson.dialogues.length<3){
throw new Error("Today's lesson has fewer than 3 dialogues.");
}

const grid=document.getElementById("lessonGrid");
grid.innerHTML="";

if(premium){

for(let i=0;i<Math.min(10,lesson.dialogues.length);i++){
grid.appendChild(createCard(lesson.dialogues[i],i));
}

}else{

for(let i=0;i<Math.min(3,lesson.dialogues.length);i++){
grid.appendChild(createCard(lesson.dialogues[i],i));
}

grid.appendChild(createUpgradeCard());
}

window.currentFirstDialogue=lesson.dialogues[0];

document.getElementById("loading").classList.add("hidden");
document.getElementById("error").classList.add("hidden");
grid.classList.remove("hidden");
document.getElementById("shareButton").classList.remove("hidden");

}catch(e){

console.error(e);

document.getElementById("loading").classList.add("hidden");

const error=document.getElementById("error");
error.textContent="⚠️ "+(e.message||"Unable to load today's lesson.");
error.classList.remove("hidden");

}
}

function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,font,color){

if(!text)return y;

ctx.font=font;
ctx.fillStyle=color;
ctx.textAlign="center";

const words=String(text).split(/\s+/);
const lines=[];
let line="";

for(const word of words){

const test=line?line+" "+word:word;

if(ctx.measureText(test).width>maxWidth&&line){
lines.push(line);
line=word;
}else{
line=test;
}

}

if(line)lines.push(line);

lines.forEach((value,i)=>{
ctx.fillText(value,x,y+i*lineHeight);
});

return y+lines.length*lineHeight;
}

async function shareFirstDialogue(){

const item=window.currentFirstDialogue;

if(!item){
alert("Today's lesson is not loaded yet.");
return;
}

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);
const date=document.getElementById("lessonDate").textContent;

const canvas=document.createElement("canvas");
canvas.width=1080;
canvas.height=1350;

const ctx=canvas.getContext("2d");

const gradient=ctx.createLinearGradient(0,0,1080,1350);
gradient.addColorStop(0,"#2563eb");
gradient.addColorStop(1,"#7c3aed");

ctx.fillStyle=gradient;
ctx.fillRect(0,0,1080,1350);

ctx.fillStyle="#fff";
ctx.textAlign="center";

ctx.font="bold 48px Arial";
ctx.fillText("📚 CreateLK Academy",540,105);

ctx.font="bold 38px Arial";
ctx.fillText("🗣️ Daily Spoken English",540,165);

ctx.font="26px Arial";
ctx.fillText(date,540,215);

ctx.fillStyle="#fff";
roundRect(ctx,65,280,950,820,36);
ctx.fill();

let y=370;

y=drawWrapped(
ctx,ta,540,y,830,48,
"bold 34px Arial","#172033"
);

y+=42;

if(si){
y=drawWrapped(
ctx,si,540,y,830,42,
"26px Arial","#475569"
);
}

y+=48;

drawWrapped(
ctx,en,540,y,830,48,
"bold 32px Arial","#1e293b"
);

ctx.fillStyle="#fff";
ctx.font="bold 30px Arial";
ctx.fillText("creatlk.com",540,1205);

canvas.toBlob(async blob=>{

if(!blob){
alert("Unable to create share image.");
return;
}

const file=new File(
[blob],
"createlk-dialogue.png",
{type:"image/png"}
);

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({files:[file]})
){

try{

await navigator.share({
title:"CreateLK Academy",
text:"Daily Spoken English",
files:[file]
});

return;

}catch(e){

if(e.name==="AbortError")return;

}

}

const link=document.createElement("a");
link.download="createlk-dialogue.png";
link.href=URL.createObjectURL(blob);
document.body.appendChild(link);
link.click();
link.remove();

setTimeout(()=>{
URL.revokeObjectURL(link.href);
},1000);

},"image/png");

}

document.getElementById("shareButton").onclick=shareFirstDialogue;

loadLesson();

</script></body>
</html>
