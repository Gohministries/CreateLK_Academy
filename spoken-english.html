<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<meta
name="theme-color"
content="#2563eb"
>

<title>Daily Spoken English | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--b:#2563eb;
--p:#7c3aed;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f3f6fb;
--green:#047857
}

body{
font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:var(--bg);
color:var(--d);
line-height:1.5
}

a{
text-decoration:none;
color:inherit
}

header{
position:sticky;
top:0;
z-index:20;

background:#fff;

border-bottom:
1px solid var(--l)
}

.nav{
max-width:900px;
margin:auto;

padding:10px 8px;

display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:900;
color:var(--b)
}

.logo span{
color:var(--p)
}

.back{
font-size:10px;
font-weight:800;
color:var(--m)
}

main{
max-width:900px;
margin:auto;

padding:8px 3px 20px
}

.card{
background:#fff;

border:
1px solid var(--l);

border-radius:16px;

margin-bottom:9px;

padding:16px
}


/* HERO */

.hero{
background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:#fff;

border:0;

padding:20px;

min-height:145px
}

.hero small{
font-size:9px;
font-weight:900;
opacity:.9
}

.hero h1{
font-size:22px;
margin:5px 0
}

.hero p{
font-size:10px;
opacity:.95
}


/* DAY */

.dayCard{
display:flex;
align-items:center;
gap:12px
}

.dayIcon{
width:45px;
height:45px;

border-radius:13px;

display:grid;
place-items:center;

background:#eff6ff;

font-size:22px;

flex-shrink:0
}

.dayNumber{
font-size:20px;
font-weight:900;
color:var(--b)
}

.dateText{
font-size:10px;
color:var(--m);
margin-top:2px
}


/* MEMBERSHIP */

.membership{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.memberLeft{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.memberIcon{
width:42px;
height:42px;

border-radius:12px;

display:grid;
place-items:center;

background:#f5f3ff;

font-size:20px;

flex-shrink:0
}

.memberTitle{
font-size:12px;
font-weight:900
}

.memberText{
font-size:9px;
color:var(--m);
margin-top:3px
}

.badge{
padding:7px 10px;

border-radius:9px;

font-size:9px;
font-weight:900;

white-space:nowrap
}

.premium{
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0
}

.free{
background:#f8fafc;
color:var(--m);
border:1px solid var(--l)
}


/* LESSON */

.lessonHeader{
display:flex;
align-items:center;
gap:9px;

margin-bottom:12px
}

.lessonEmoji{
font-size:20px
}

.lessonTitle{
font-size:14px;
font-weight:900
}

.lessonDescription{
font-size:9px;
color:var(--m);
margin-top:2px
}


/* DIALOGUE */

.dialogue{
background:#f8fafc;

border:
1px solid var(--l);

border-radius:14px;

padding:14px;

margin-bottom:10px
}

.dialogueNumber{
font-size:9px;
font-weight:900;

color:var(--b);

margin-bottom:10px
}

.lang{
font-size:8px;
font-weight:900;

color:var(--m);

margin-top:7px;
margin-bottom:2px
}

.tamil,
.sinhala,
.english{
font-size:13px;
font-weight:700;

padding:4px 0;

word-break:break-word
}

.tamil{
color:#7c3aed
}

.sinhala{
color:#0f766e
}

.english{
color:#1d4ed8
}

.listen{
margin-top:9px;

border:
1px solid #cbd5e1;

background:#fff;

border-radius:9px;

padding:7px 11px;

font-size:9px;
font-weight:800;

cursor:pointer;

color:#334155
}


/* UPGRADE */

.upgrade{
margin-top:14px;

padding:18px;

border-radius:15px;

background:
linear-gradient(
135deg,
#eff6ff,
#f5f3ff
);

border:
1px solid #c7d2fe;

text-align:center
}

.upgradeIcon{
font-size:25px;
margin-bottom:4px
}

.upgradeTitle{
font-size:14px;
font-weight:900
}

.upgradeText{
font-size:9px;
color:var(--m);

margin:
5px auto 12px;

max-width:500px
}

.upgradeButton{
display:block;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:#fff;

padding:11px;

border-radius:10px;

font-size:10px;

font-weight:900
}


/* COMPLETE */

.complete{
width:100%;

border:0;

background:
linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:#fff;

padding:12px;

border-radius:10px;

font-size:10px;

font-weight:900;

cursor:pointer;

margin-top:4px
}

.complete:disabled{
opacity:.6;
cursor:not-allowed
}


/* LOADING */

.loading{
text-align:center;

padding:20px;

font-size:10px;

color:var(--m)
}

.error{
text-align:center;

padding:18px;

font-size:10px;

color:#b91c1c;

background:#fef2f2;

border:1px solid #fecaca;

border-radius:12px
}


/* FOOTER */

footer{
text-align:center;

color:var(--m);

font-size:8px;

padding:
4px 0 18px
}


@media(max-width:380px){

.logo{
font-size:14px
}

.hero{
padding:17px
}

.hero h1{
font-size:20px
}

.card{
padding:14px
}

.tamil,
.sinhala,
.english{
font-size:12px
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<a
class="logo"
href="index.html"
>
📚 CreateLK <span>Academy</span>
</a>

<a
class="back"
href="dashboard.html"
>
← Dashboard
</a>

</div>

</header>


<main>


<!-- HERO -->

<section class="card hero">

<small>
DAILY SPOKEN ENGLISH
</small>

<h1 id="welcome">
Welcome 👋
</h1>

<p>
Tamil → Sinhala → English conversations every day.
</p>

</section>


<!-- DAY -->

<section class="card dayCard">

<div class="dayIcon">
📅
</div>

<div>

<div
class="dayNumber"
id="dayNumber"
>
DAY
</div>

<div
class="dateText"
id="dateText"
>
Loading...
</div>

</div>

</section>


<!-- MEMBERSHIP -->

<section class="card">

<div class="membership">

<div class="memberLeft">

<div class="memberIcon">
⭐
</div>

<div>

<div class="memberTitle">
Premium Membership
</div>

<div
class="memberText"
id="memberText"
>
Checking membership...
</div>

</div>

</div>

<div
id="memberBadge"
class="badge free"
>
Checking
</div>

</div>

</section>


<!-- LESSON -->

<section class="card">

<div class="lessonHeader">

<div class="lessonEmoji">
📖
</div>

<div>

<div class="lessonTitle">
TODAY'S LESSON
</div>

<div
class="lessonDescription"
id="lessonDescription"
>
Loading today's lesson...
</div>

</div>

</div>


<div id="lessonArea">

<div class="loading">
Loading today's lesson...
</div>

</div>

</section>


<footer>
© 2026 CreateLK Academy
</footer>


</main>


<script>


/*
==================================================
CONFIGURATION
==================================================
*/

const ACCOUNT_API =
"https://createlk-auth.createlk.workers.dev";

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const PROGRESS_API =
"https://createlk-course-lessons.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const TOTAL_DIALOGUES =
10;

const FREE_DIALOGUES =
3;


/*
==================================================
STUDENT
==================================================
*/

let student = {};

let currentLesson = null;


/*
LOAD LOCAL STUDENT
*/

try{

student =
JSON.parse(
localStorage.getItem(STUDENT_KEY) || "{}"
);

}catch(e){

student={};

}


/*
STUDENT ID
*/

function studentId(){

return Number(
student.id ||
student.database_id ||
student.student_id ||
student.student_id_number ||
0
);

}


/*
==================================================
PREMIUM CHECK
==================================================
*/

function isPremium(){

const status =
String(
student.membership_status ||
student.membership ||
student.plan ||
"FREE"
).trim().toUpperCase();

return (
status === "PREMIUM" ||
status === "ACTIVE_PREMIUM" ||
status === "PAID"
);

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
==================================================
ESCAPE ATTRIBUTE
==================================================
*/

function escapeAttribute(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/*
==================================================
REFRESH STUDENT FROM AUTH WORKER
==================================================
*/

async function refreshStudent(){

const id =
studentId();

if(!id){

return false;

}

try{

const response =
await fetch(
ACCOUNT_API +
"/api/student?id=" +
encodeURIComponent(id),
{
method:"GET",
cache:"no-store"
}
);

if(!response.ok){

console.log(
"Student API HTTP:",
response.status
);

return false;

}

const data =
await response.json();

console.log(
"Student API:",
data
);


if(
data &&
data.success &&
data.student
){

student = {

...student,

...data.student,

id:Number(
data.student.id ||
student.id
)

};


localStorage.setItem(
STUDENT_KEY,
JSON.stringify(student)
);

return true;

}

}catch(error){

console.log(
"Student refresh error:",
error
);

}

return false;

}


/*
==================================================
UPDATE MEMBERSHIP UI
==================================================
*/

function updateMembership(){

const badge =
document.getElementById(
"memberBadge"
);

const text =
document.getElementById(
"memberText"
);


if(isPremium()){

badge.textContent =
"✓ Premium";

badge.className =
"badge premium";

text.textContent =
"Premium access is active. All 10 dialogues are unlocked.";

}else{

badge.textContent =
"Free";

badge.className =
"badge free";

text.textContent =
"3 dialogues are free. Upgrade to Premium for all 10 daily dialogues.";

}

}


/*
==================================================
GET TODAY
==================================================
*/

function getToday(){

const now =
new Date();


/*
Sri Lanka timezone
*/

const parts =
new Intl.DateTimeFormat(
"en-CA",
{
timeZone:"Asia/Colombo",
year:"numeric",
month:"2-digit",
day:"2-digit"
}
).formatToParts(now);


let year = "";
let month = "";
let day = "";


for(
const part of parts
){

if(part.type === "year")
year = part.value;

if(part.type === "month")
month = part.value;

if(part.type === "day")
day = part.value;

}


return {

year,
month,
day,

monthDay:
month + "-" + day

};

}


/*
==================================================
DAY OF YEAR
==================================================
*/

function getDayOfYear(
year,
month,
day
){

const date =
new Date(
Number(year),
Number(month)-1,
Number(day)
);

const start =
new Date(
Number(year),
0,
1
);

const diff =
date - start;

return Math.floor(
diff /
86400000
) + 1;

}


/*
==================================================
FORMAT DATE
==================================================
*/

function updateDate(){

const today =
getToday();


const dayOfYear =
getDayOfYear(
today.year,
today.month,
today.day
);


document.getElementById(
"dayNumber"
).textContent =
"DAY " +
dayOfYear;


const date =
new Date(
Number(today.year),
Number(today.month)-1,
Number(today.day)
);


document.getElementById(
"dateText"
).textContent =
date.toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

return today;

}


/*
==================================================
LOAD TODAY LESSON
==================================================
*/

async function loadTodayLesson(){

const today =
getToday();

const monthDay =
today.monthDay;

console.log(
"Loading month_day:",
monthDay
);


const area =
document.getElementById(
"lessonArea"
);

const description =
document.getElementById(
"lessonDescription"
);


area.innerHTML =
`
<div class="loading">
Loading today's lesson...
</div>
`;


try{


/*
IMPORTANT:

The API should support:

GET /api/lesson?month_day=08-29

*/

const url =
LESSON_API +
"/api/lesson?month_day=" +
encodeURIComponent(monthDay);


console.log(
"Lesson URL:",
url
);


const response =
await fetch(
url,
{
method:"GET",
cache:"no-store"
}
);


console.log(
"Lesson HTTP:",
response.status
);


if(!response.ok){

throw new Error(
"Lesson API HTTP " +
response.status
);

}


const data =
await response.json();


console.log(
"Lesson API:",
data
);


/*
ACCEPT COMMON RESPONSE FORMATS
*/

let lesson =
data.lesson ||
data.data ||
data;


if(
data.success === false
){

throw new Error(
data.message ||
"No lesson found"
);

}


/*
CHECK LESSON
*/

if(
!lesson ||
!lesson.dialogues
){

throw new Error(
"No lesson data"
);

}


let dialogues =
lesson.dialogues;


/*
DIALOGUES MAY BE JSON STRING
*/

if(
typeof dialogues === "string"
){

try{

dialogues =
JSON.parse(dialogues);

}catch(e){

console.log(
"Dialogue JSON error:",
e
);

throw new Error(
"Invalid dialogue data"
);

}

}


/*
MAKE SURE ARRAY
*/

if(
!Array.isArray(dialogues)
){

throw new Error(
"Dialogue data is not an array"
);

}


if(
dialogues.length === 0
){

throw new Error(
"No dialogues available"
);

}


currentLesson = {

...lesson,

dialogues

};


document.getElementById(
"lessonDescription"
).textContent =
lesson.description ||
"Learn 10 useful Tamil, Sinhala and English spoken conversations.";


/*
RENDER
*/

renderDialogues(
dialogues
);


}catch(error){

console.log(
"Lesson loading error:",
error
);


area.innerHTML = `

<div class="error">

⚠️ Today's lesson could not be loaded.

<br><br>

Please refresh the page.

</div>

`;

}

}


/*
==================================================
RENDER DIALOGUES
==================================================
*/

function renderDialogues(
dialogues
){

const area =
document.getElementById(
"lessonArea"
);


area.innerHTML =
"";


const premiumUser =
isPremium();


const visibleCount =
premiumUser
?
Math.min(
TOTAL_DIALOGUES,
dialogues.length
)
:
Math.min(
FREE_DIALOGUES,
dialogues.length
);


/*
SHOW DIALOGUES
*/

for(
let i=0;
i<visibleCount;
i++
){

const item =
dialogues[i] || {};


const tamil =
item.tamil ||
"";


const sinhala =
item.sinhala ||
"";


const english =
item.english ||
"";


const box =
document.createElement(
"div"
);


box.className =
"dialogue";


box.innerHTML = `

<div class="dialogueNumber">
DIALOGUE ${i+1} / 10
</div>

<div class="lang">
🇱🇰 TAMIL
</div>

<div class="tamil">
${escapeHTML(tamil)}
</div>

<div class="lang">
🇱🇰 SINHALA
</div>

<div class="sinhala">
${escapeHTML(sinhala)}
</div>

<div class="lang">
🇬🇧 ENGLISH
</div>

<div class="english">
${escapeHTML(english)}
</div>

<button
class="listen"
type="button"
data-text="${escapeAttribute(english)}"
onclick="speakEnglish(this)"
>
🔊 Listen
</button>

`;


area.appendChild(
box
);

}


/*
==================================================
FREE USER UPGRADE
==================================================
*/

if(
!premiumUser &&
dialogues.length > FREE_DIALOGUES
){

const upgrade =
document.createElement(
"div"
);


upgrade.className =
"upgrade";


upgrade.innerHTML = `

<div class="upgradeIcon">
⭐
</div>

<div class="upgradeTitle">
Unlock All 10 Daily Dialogues
</div>

<div class="upgradeText">
You can learn the first 3 dialogues for free.
Upgrade to Premium to access all 10 Tamil → Sinhala → English dialogues every day.
</div>

<a
class="upgradeButton"
href="premium.html"
>
⭐ Upgrade to Premium
</a>

`;


area.appendChild(
upgrade
);

}


/*
==================================================
COMPLETE BUTTON
==================================================
*/

const complete =
document.createElement(
"button"
);


complete.className =
"complete";


complete.type =
"button";


complete.id =
"completeButton";


complete.textContent =
"✓ Complete Today's Lesson";


complete.onclick =
completeLesson;


area.appendChild(
complete
);

}


/*
==================================================
TEXT TO SPEECH
==================================================
*/

function speakEnglish(
button
){

const text =
button.dataset.text ||
"";


if(!text){

return;

}


if(
"speechSynthesis" in window
){

window.speechSynthesis.cancel();


const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"en-US";

speech.rate =
0.85;


window.speechSynthesis.speak(
speech
);

}

}


/*
==================================================
COMPLETE LESSON
==================================================
*/

async function completeLesson(){

const id =
studentId();

if(!id){

alert(
"Please log in again."
);

location.replace(
"login.html"
);

return;

}


if(!currentLesson){

return;

}


const button =
document.getElementById(
"completeButton"
);


if(button){

button.disabled =
true;

button.textContent =
"Saving...";

}


try{

const response =
await fetch(
PROGRESS_API +
"/api/progress",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:id,

lesson_id:
currentLesson.id,

day:
currentLesson.day,

month_day:
currentLesson.month_day ||

getToday().monthDay

})

}
);


if(!response.ok){

throw new Error(
"Progress API HTTP " +
response.status
);

}


const data =
await response.json();


console.log(
"Progress:",
data
);


if(
data.success === false
){

throw new Error(
data.message ||
"Could not save progress"
);

}


if(button){

button.textContent =
"✓ Lesson Completed";

}

}catch(error){

console.log(
"Complete error:",
error
);


if(button){

button.disabled =
false;

button.textContent =
"✓ Complete Today's Lesson";

}


alert(
"Could not save your progress. Please try again."
);

}

}


/*
==================================================
START
==================================================
*/

async function start(){

/*
CHECK LOGIN
*/

if(
!studentId()
){

location.replace(
"login.html"
);

return;

}


/*
UPDATE DATE IMMEDIATELY
*/

updateDate();


/*
GET LATEST ACCOUNT STATUS
*/

await refreshStudent();


/*
UPDATE PREMIUM AFTER AUTH
*/

updateMembership();


/*
LOAD TODAY'S LESSON
*/

await loadTodayLesson();

}


/*
START
*/

start();

</script>

</body>

</html>
