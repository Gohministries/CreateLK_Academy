<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>CreateLK Academy | Daily Spoken English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#2563eb;--p:#7c3aed;--bg:#f4f7fb;--t:#172033;--m:#64748b;--g:#16a34a;--gold:#f59e0b;--bd:#e2e8f0}
body{font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.header{background:linear-gradient(135deg,var(--b),var(--p));color:#fff;padding:12px 14px}
.header-inner{max-width:680px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:16px;font-weight:900}.menu{font-size:21px}
.container{max-width:680px;margin:auto;padding:10px 9px 25px}
.hero,.membership,.card,.premium-box,.loading{background:#fff;border-radius:15px}
.hero{padding:17px;margin-bottom:10px;box-shadow:0 3px 12px #0f172a0d}
.brand{color:var(--b);font-size:10px;font-weight:900;letter-spacing:.5px}
h1{font-size:22px;margin:5px 0}
.subtitle{color:var(--m);font-size:12px;line-height:1.45}
.date{margin-top:8px;font-size:12px;font-weight:800}
.membership{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa;padding:12px;margin-bottom:12px}
.membership-top{display:flex;justify-content:space-between;align-items:center}
.membership-title{color:#92400e;font-size:13px;font-weight:900}
.status{background:#dcfce7;color:#166534;border-radius:99px;padding:5px 9px;font-size:9px;font-weight:900}
.membership-text{color:#78350f;font-size:11px;margin-top:6px}
.upgrade,.premium-button{display:block;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);border-radius:9px;padding:10px;margin-top:9px;font-size:11px;font-weight:900}
.hidden{display:none!important}
.section-title{font-size:17px;margin:15px 2px 8px}
.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:9px 11px;font-size:11px;margin-bottom:10px}
.lesson-grid{display:flex;flex-direction:column;gap:9px}
.card{border:1px solid var(--bd);padding:14px;box-shadow:0 2px 8px #0f172a0a}
.free{border-top:3px solid var(--g)}.premium{border-top:3px solid var(--gold)}
.number{color:var(--b);font-size:9px;font-weight:900;margin-bottom:8px}
.tamil{font-size:15px;font-weight:800;line-height:1.45;margin-bottom:6px}
.sinhala{color:#475569;font-size:12px;line-height:1.45;margin-bottom:6px}
.english{color:#1e293b;font-size:13px;line-height:1.5;font-weight:600}
.listen{border:0;background:#eff6ff;color:var(--b);border-radius:8px;padding:7px 9px;margin-top:8px;font-size:10px;font-weight:800}
.badge{display:inline-block;margin-top:8px;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}
.free-badge{background:#dcfce7;color:#166534}.premium-badge{background:#fef3c7;color:#92400e}
.premium-box{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:2px solid #fbbf24;padding:15px;text-align:center}
.premium-box-title{color:#92400e;font-size:15px;font-weight:900}
.premium-box-text{color:#78350f;font-size:11px;line-height:1.45;margin-top:5px}
.share-btn{width:100%;border:0;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;border-radius:10px;padding:11px;margin-top:11px;font-size:12px;font-weight:900}
.loading{text-align:center;padding:18px;color:var(--m);font-size:12px}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:11px;padding:12px;font-size:12px}
.footer{text-align:center;color:var(--m);font-size:10px;padding:16px}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div class="logo">📚 CreateLK Academy</div>
<div class="menu">☰</div>
</div>
</header>

<main class="container">

<section class="hero">
<div class="brand">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<p class="subtitle">Learn Tamil → English conversations every day.</p>
<div id="lessonDate" class="date">Loading...</div>
</section>

<section class="membership">
<div class="membership-top">
<div class="membership-title">⭐ Premium Membership</div>
<div id="membershipStatus" class="status">Checking...</div>
</div>
<div id="membershipText" class="membership-text">Checking membership...</div>
<a id="upgradeButton" href="premium.html" class="upgrade hidden">⭐ Upgrade to Premium</a>
</section>

<h2 class="section-title">📖 TODAY'S LESSON</h2>

<div id="limitNote" class="note">Loading today's lesson...</div>
<div id="loading" class="loading">Loading today's lesson...</div>
<div id="error" class="error hidden"></div>
<section id="lessonGrid" class="lesson-grid hidden"></section>

<button id="shareButton" class="share-btn hidden">📤 Share Today's English</button>

</main>

<footer class="footer">© 2026 CreateLK Academy</footer>

<script>
const API="https://spokenlessons.createlk.workers.dev";
const KEY="createlk_student";
let student={},firstDialogue=null;

function loadStudent(){
 try{student=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}
 catch(e){student={}}
}

function isPremium(){
 loadStudent();
 const status=String(
  student.membership_status||student.membershipStatus||student.status||""
 ).toUpperCase().trim();
 const expiry=student.membership_expiry||student.membershipExpiry||student.expiry||"";
 if(status!=="PREMIUM"||!expiry)return false;
 const d=new Date(expiry);
 return !isNaN(d.getTime())&&d.getTime()>Date.now();
}

function setup(){
 const d=new Date();
 document.getElementById("lessonDate").textContent=d.toLocaleDateString("en-US",{
  month:"long",day:"numeric",year:"numeric"
 });
}

function membership(){
 const p=isPremium();
 const s=document.getElementById("membershipStatus");
 const t=document.getElementById("membershipText");
 const n=document.getElementById("limitNote");
 const u=document.getElementById("upgradeButton");

 if(p){
  s.textContent="✓ Premium";
  t.textContent="Premium is active. All 10 daily dialogues are unlocked.";
  n.innerHTML="<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";
  u.classList.add("hidden");
 }else{
  s.textContent="Free";
  t.textContent="3 dialogues are free. Premium unlocks all 10.";
  n.innerHTML="<strong>Free:</strong> Dialogues 1–3 are free. Upgrade for all 10.";
  u.classList.remove("hidden");
 }
 return p;
}

function ta(x){return x.tamil||x.ta||x.tamil_text||x.question_tamil||x.text_tamil||""}
function si(x){return x.sinhala||x.si||x.sinhala_text||x.translation_sinhala||x.text_sinhala||""}
function en(x){return x.english||x.en||x.english_text||x.answer_english||x.text_english||""}

function esc(x){
 return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function listen(text){
 if(!("speechSynthesis" in window)){alert("Voice playback is not supported.");return}
 speechSynthesis.cancel();
 const s=new SpeechSynthesisUtterance(text);
 s.lang="en-US";s.rate=.9;speechSynthesis.speak(s);
}

function card(x,i){
 const c=document.createElement("article");
 c.className="card "+(i<3?"free":"premium");
 const a=ta(x),b=si(x),e=en(x);

 c.innerHTML=`
 <div class="number">LESSON ${i+1}</div>
 <div class="tamil">${esc(a)}</div>
 ${b?`<div class="sinhala">${esc(b)}</div>`:""}
 <div class="english">${esc(e)}</div>
 ${e?`<button class="listen" type="button">🔊 Listen</button>`:""}
 <span class="badge ${i<3?"free-badge":"premium-badge"}">${i<3?"✓ FREE":"⭐ PREMIUM"}</span>`;

 const btn=c.querySelector(".listen");
 if(btn)btn.onclick=()=>listen(e);
 return c;
}

function upgradeCard(){
 const x=document.createElement("div");
 x.className="premium-box";
 x.innerHTML=`
 <div class="premium-box-title">⭐ Unlock All 10 Dialogues</div>
 <div class="premium-box-text">Enjoy the complete daily Spoken English lesson with Premium.</div>
 <a href="premium.html" class="premium-button">⭐ Upgrade to Premium</a>`;
 return x;
}

function normalize(j){
 let d=j;
 if(j?.lesson)d=j.lesson;
 if(j?.data&&!Array.isArray(j.data))d=j.data;
 const list=d?.dialogues||d?.conversations||d?.items||d?.lessons;
 if(!Array.isArray(list))throw Error("No dialogues were returned.");
 return list;
}

async function load(){
 setup();
 const p=membership();

 try{
  const d=new Date();
  const md=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  const r=await fetch(API+"/api/today?month_day="+encodeURIComponent(md),{
   cache:"no-store",
   headers:{Accept:"application/json"}
  });

  if(!r.ok)throw Error("Lesson service returned HTTP "+r.status+".");

  const list=normalize(await r.json());
  if(list.length<3)throw Error("Today's lesson has fewer than 3 dialogues.");

  firstDialogue=list[0];

  const grid=document.getElementById("lessonGrid");
  grid.innerHTML="";

  const count=p?Math.min(10,list.length):Math.min(3,list.length);

  for(let i=0;i<count;i++)grid.appendChild(card(list[i],i));

  if(!p)grid.appendChild(upgradeCard());

  document.getElementById("loading").classList.add("hidden");
  document.getElementById("error").classList.add("hidden");
  grid.classList.remove("hidden");
  document.getElementById("shareButton").classList.remove("hidden");

 }catch(e){
  document.getElementById("loading").classList.add("hidden");
  const x=document.getElementById("error");
  x.textContent="⚠️ "+e.message;
  x.classList.remove("hidden");
 }
}

function round(ctx,x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);
 ctx.closePath();
}

function wrap(ctx,text,x,y,max,line,font,color){
 ctx.font=font;ctx.fillStyle=color;ctx.textAlign="center";
 const words=String(text).trim().split(/\s+/);
 let lineText="",lines=[];
 for(const w of words){
  const test=lineText?lineText+" "+w:w;
  if(ctx.measureText(test).width>max&&lineText){
   lines.push(lineText);lineText=w;
  }else lineText=test;
 }
 if(lineText)lines.push(lineText);
 lines.forEach(v=>{ctx.fillText(v,x,y);y+=line});
 return y;
}

async function share(){
 if(!firstDialogue){alert("Today's lesson is not loaded yet.");return}

 const a=ta(firstDialogue),b=si(firstDialogue),e=en(firstDialogue);
 const date=document.getElementById("lessonDate").textContent;

 const canvas=document.createElement("canvas");
 canvas.width=1080;canvas.height=1350;
 const ctx=canvas.getContext("2d");

 const bg=ctx.createLinearGradient(0,0,1080,1350);
 bg.addColorStop(0,"#2563eb");
 bg.addColorStop(.5,"#7c3aed");
 bg.addColorStop(1,"#db2777");
 ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1350);

 ctx.fillStyle="#ffffff";
 ctx.textAlign="center";
 ctx.font="bold 46px Arial";
 ctx.fillText("📚 CreateLK Academy",540,110);

 ctx.font="bold 32px Arial";
 ctx.fillText("DAILY SPOKEN ENGLISH",540,160);

 ctx.font="24px Arial";
 ctx.globalAlpha=.9;
 ctx.fillText(date,540,200);
 ctx.globalAlpha=1;

 ctx.shadowColor="rgba(0,0,0,.2)";
 ctx.shadowBlur=28;
 ctx.shadowOffsetY=10;
 ctx.fillStyle="#fff";
 round(ctx,65,255,950,780,38);
 ctx.fill();
 ctx.shadowColor="transparent";
 ctx.shadowBlur=0;
 ctx.shadowOffsetY=0;

 let y=405;

 if(a)y=wrap(ctx,a,540,y,790,60,"bold 38px Arial","#172033");
 if(b){y+=35;y=wrap(ctx,b,540,y,790,50,"27px Arial","#64748b")}
 if(e){y+=50;wrap(ctx,e,540,y,790,58,"bold 36px Arial","#2563eb")}

 ctx.fillStyle="#172033";
 ctx.font="bold 30px Arial";
 ctx.fillText("Learn English Every Day",540,1120);

 ctx.fillStyle="#64748b";
 ctx.font="25px Arial";
 ctx.fillText("CreateLK.com",540,1170);

 ctx.fillStyle="#2563eb";
 round(ctx,455,1220,170,7,4);
 ctx.fill();

 canvas.toBlob(async blob=>{
  if(!blob){alert("Unable to create image.");return}

  const file=new File([blob],"createlk-daily-english.png",{type:"image/png"});

  const text=
`🗣️ Daily Spoken English

${a}

${e}

📚 CreateLK Academy
For the full lesson visit createlk.com`;

  if(navigator.share){
   try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
     await navigator.share({
      title:"CreateLK Academy | Daily Spoken English",
      text:text,
      files:[file]
     });
    }else{
     await navigator.share({
      title:"CreateLK Academy | Daily Spoken English",
      text:text
     });
    }
    return;
   }catch(err){
    if(err.name==="AbortError")return;
   }
  }

  const link=document.createElement("a");
  link.download="createlk-daily-english.png";
  link.href=URL.createObjectURL(blob);
  link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
 },"image/png");
}

document.getElementById("shareButton").onclick=share;
load();
</script>

</body>
</html>
