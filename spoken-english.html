<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Daily Spoken English | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#2563eb;
--p:#7c3aed;
--g:#059669;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f3f6fb
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--d);
line-height:1.5
}

a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid var(--l)
}

.nav{
max-width:900px;
margin:auto;
padding:10px 8px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:900;
color:var(--b)
}

.logo span{color:var(--p)}

.back{
font-size:10px;
font-weight:800;
color:var(--m)
}

main{
max-width:900px;
margin:auto;
padding:8px 3px 20px
}

.card{
background:#fff;
border:1px solid var(--l);
border-radius:16px;
padding:16px;
margin-bottom:9px
}

.hero{
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
border:0;
padding:20px
}

.hero small{
font-size:9px;
font-weight:900;
letter-spacing:.5px
}

.hero h1{
font-size:22px;
line-height:1.2;
margin:5px 0
}

.hero p{
font-size:10px;
opacity:.95
}

.day{
text-align:center;
padding:15px
}

.dayNumber{
font-size:12px;
font-weight:900;
color:var(--b)
}

.date{
font-size:20px;
font-weight:900;
margin:3px 0
}

.dayInfo{
font-size:9px;
color:var(--m)
}

.badge{
display:inline-block;
margin-top:9px;
padding:6px 10px;
border-radius:8px;
font-size:9px;
font-weight:900
}

.premium{
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0
}

.free{
background:#f8fafc;
color:var(--m);
border:1px solid var(--l)
}

.sectionTitle{
font-size:11px;
font-weight:900;
margin-bottom:10px
}

.dialogue{
border:1px solid var(--l);
border-radius:12px;
padding:13px;
margin-bottom:9px;
background:#fff
}

.dialogue:last-child{margin-bottom:0}

.dialogueNo{
font-size:9px;
font-weight:900;
color:var(--p);
margin-bottom:7px
}

.tamil{
font-size:14px;
font-weight:800;
margin-bottom:5px
}

.english{
font-size:13px;
color:#334155;
margin-bottom:9px
}

.listen{
border:0;
background:#eff6ff;
color:var(--b);
border-radius:8px;
padding:7px 11px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.complete{
width:100%;
border:0;
background:var(--g);
color:#fff;
border-radius:10px;
padding:13px;
font-size:11px;
font-weight:900;
cursor:pointer
}

.complete:disabled{
opacity:.6
}

.status{
text-align:center;
padding:25px 10px;
font-size:11px;
color:var(--m)
}

.error{color:#dc2626}

.notice{
font-size:9px;
color:var(--m);
text-align:center;
margin-top:9px
}

footer{
text-align:center;
color:var(--m);
font-size:8px;
padding:5px 0 18px
}

@media(max-width:380px){
.logo{font-size:14px}
.card{padding:14px}
.hero{padding:17px}
.hero h1{font-size:21px}
.tamil{font-size:13px}
.english{font-size:12px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="logo" href="index.html">
📚 CreateLK <span>Academy</span>
</a>

<a class="back" href="index.html">
← Dashboard
</a>

</div>
</header>

<main>

<section class="card hero">

<small>DAILY SPOKEN ENGLISH</small>

<h1 id="welcome">Welcome 👋</h1>

<p>
Tamil → English conversations every day.
</p>

</section>


<section class="card day">

<div class="dayNumber" id="dayNumber">
DAY
</div>

<div class="date" id="date">
Loading...
</div>

<div class="dayInfo">
📖 10 dialogues available today.
</div>

<div id="badge" class="badge free">
Checking membership...
</div>

</section>


<section class="card">

<div class="sectionTitle">
📖 TODAY'S LESSON
</div>

<div id="lesson" class="status">
Loading today's lesson...
</div>

</section>


<section class="card" id="completeBox" style="display:none">

<button
id="completeBtn"
class="complete"
onclick="completeLesson()">
✅ Complete Lesson
</button>

<div class="notice" id="completeStatus"></div>

</section>


<footer>
© 2026 CreateLK Academy
</footer>

</main>


<script>

const COURSE_API =
"https://createlk-course-lessons.createlk.workers.dev";

const ACCOUNT_API =
"https://createlk-auth-createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const FREE_DIALOGUES = 3;
const TOTAL_DIALOGUES = 10;

let student={};
let lesson=null;
let premium=false;
let completed=false;


/* LOAD LOGIN DATA */

try{

student=JSON.parse(
localStorage.getItem(STUDENT_KEY)||"{}"
);

}catch(e){

student={};

}


/* STUDENT ID */

function studentId(){

return Number(
student.id ||
student.database_id ||
student.student_id ||
student.student_id_number ||
0
);

}


/* DATE */

function today(){

const d=new Date();

return String(d.getMonth()+1).padStart(2,"0")+
"-"+
String(d.getDate()).padStart(2,"0");

}


/* DATE TEXT */

function dateText(){

const d=new Date();

return d.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);


/* DAY OF YEAR */

function dayOfYear(){

const d=new Date();

const start=new Date(d.getFullYear(),0,0);

const diff=d-start;

return Math.floor(
diff/(1000*60*60*24)
);

}


/* ACCOUNT */

async function refreshStudent(){

const id=studentId();

if(!id)return;

try{

const r=await fetch(
ACCOUNT_API+
"/api/student?id="+
encodeURIComponent(id),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)return;

const d=await r.json();

if(d.success && d.student){

student={
...student,
...d.student,
id:Number(d.student.id)
};

localStorage.setItem(
STUDENT_KEY,
JSON.stringify(student)
);

}

}catch(e){

console.log(
"Account refresh failed",
e
);

}

}


/* PREMIUM */

function checkPremium(){

const status=String(
student.membership_status||
student.membershipStatus||
student.membership||
"FREE"
).toUpperCase();

premium=status==="PREMIUM";

const badge=
document.getElementById("badge");

if(premium){

badge.textContent="✓ Premium";
badge.className="badge premium";

}else{

badge.textContent="Free";
badge.className="badge free";

}

}


/* LOAD TODAY'S LESSON */

async function loadLesson(){

const lessonBox=
document.getElementById("lesson");

const md=today();

try{

const r=await fetch(
COURSE_API+
"?date="+
encodeURIComponent(md),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)
throw Error(
"Lesson server error: "+r.status
);

const d=await r.json();

if(!d.success)
throw Error(
d.error||"No lesson data."
);

lesson=
d.lesson||
d.devotional||
d.data;

if(!lesson)
throw Error("No lesson data.");

renderLesson();

}catch(e){

console.log(e);

lessonBox.className="status error";

lessonBox.textContent=
"⚠️ No lesson data.";

}

}


/* FIND DIALOGUES */

function getDialogues(){

return lesson.dialogues ||
lesson.conversations ||
lesson.lessons ||
[];


}


/* TEXT */

function getText(item,names){

for(const n of names){

if(
item[n]!==undefined &&
item[n]!==null &&
String(item[n]).trim()
){

return String(item[n]);

}

}

return "";

}


/* RENDER */

function renderLesson(){

const box=
document.getElementById("lesson");

let dialogues=getDialogues();

if(!Array.isArray(dialogues))
dialogues=[];


/* FALLBACK FOR OBJECT */

if(!dialogues.length && lesson){

const tamil=
lesson.tamil ||
lesson.tamil_text ||
lesson.question_ta;

const english=
lesson.english ||
lesson.english_text ||
lesson.answer_en;

if(tamil || english){

dialogues=[{
tamil:tamil,
english:english
}];

}

}


/* LIMIT */

const visible=
premium
?TOTAL_DIALOGUES
:FREE_DIALOGUES;

dialogues=
dialogues.slice(0,visible);

if(!dialogues.length){

box.className="status error";
box.textContent="⚠️ No lesson data.";
return;

}

let html="";

dialogues.forEach((x,i)=>{

const ta=getText(x,[
"tamil",
"ta",
"tamil_text",
"question_ta",
"sentence_ta"
]);

const en=getText(x,[
"english",
"en",
"english_text",
"answer_en",
"sentence_en"
]);

html+=`

<div class="dialogue">

<div class="dialogueNo">
DIALOGUE ${i+1} / ${premium?TOTAL_DIALOGUES:FREE_DIALOGUES}
</div>

<div class="tamil">
🇱🇰 ${escapeHTML(ta)}
</div>

<div class="english">
🇬🇧 ${escapeHTML(en)}
</div>

<button
class="listen"
onclick='speak(${JSON.stringify(en)})'>
🔊 Listen
</button>

</div>

`;

});


if(!premium && dialogues.length<10){

html+=`

<div class="notice">
⭐ Premium unlocks all 10 dialogues.
</div>

`;

}

box.className="";
box.innerHTML=html;

document.getElementById(
"completeBox"
).style.display="block";

}


/* ESCAPE */

function escapeHTML(x){

return String(x||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* VOICE */

function speak(text){

if(!text)return;

if("speechSynthesis" in window){

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=.9;

speechSynthesis.speak(u);

}

}


/* COMPLETE */

async function completeLesson(){

const id=studentId();

if(!id){

alert("Please login again.");
return;

}

const btn=
document.getElementById("completeBtn");

const status=
document.getElementById("completeStatus");

btn.disabled=true;
btn.textContent="Saving...";

try{

const r=await fetch(
COURSE_API+
"/api/progress",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({

student_id:id,

lesson_id:today(),

date:today()

})
}
);

const d=await r.json();

if(!r.ok || !d.success){

throw Error(
d.error||"Could not save progress."
);

}

completed=true;

btn.textContent="✓ Lesson Completed";

status.textContent=
"Today's lesson has been completed.";

}catch(e){

console.log(e);

btn.disabled=false;
btn.textContent="✅ Complete Lesson";

status.textContent=
"⚠️ "+e.message;

}

}


/* START */

async function start(){

if(!studentId()){

location.replace("login.html");
return;

}

document.getElementById(
"dayNumber"
).textContent=
"DAY "+dayOfYear();

document.getElementById(
"date"
).textContent=
dateText();

const first=
student.first_name||"";

const last=
student.last_name||"";

const name=
(`${first} ${last}`).trim()||
student.name||
"Student";

document.getElementById(
"welcome"
).textContent=
"Welcome, "+name+" 👋";


await refreshStudent();

checkPremium();

await loadLesson();

}


/* START */

start();

</script>

</body>
</html>
