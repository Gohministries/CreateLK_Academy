<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>CreateLK Academy | Daily Spoken English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --blue:#2563eb;
 --blue2:#7c3aed;
 --bg:#f4f7fb;
 --text:#172033;
 --muted:#64748b;
 --green:#16a34a;
 --gold:#f59e0b;
 --border:#e2e8f0;
}

body{
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

.header{
 background:linear-gradient(135deg,var(--blue),var(--blue2));
 color:#fff;
 padding:12px 14px;
}

.header-inner{
 max-width:680px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.logo{
 font-size:16px;
 font-weight:900;
}

.menu{
 font-size:21px;
}

.container{
 width:100%;
 max-width:680px;
 margin:auto;
 padding:10px 9px 25px;
}

.hero{
 background:#fff;
 border-radius:15px;
 padding:16px;
 margin-bottom:10px;
 box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.brand{
 color:var(--blue);
 font-size:10px;
 font-weight:900;
 letter-spacing:.5px;
 margin-bottom:5px;
}

h1{
 font-size:22px;
 line-height:1.25;
 margin-bottom:5px;
}

.subtitle{
 color:var(--muted);
 font-size:12px;
 line-height:1.45;
}

.date{
 margin-top:8px;
 font-size:12px;
 font-weight:800;
}

.membership{
 background:linear-gradient(135deg,#fff7ed,#fffbeb);
 border:1px solid #fed7aa;
 border-radius:14px;
 padding:12px;
 margin-bottom:12px;
}

.membership-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.membership-title{
 color:#92400e;
 font-size:13px;
 font-weight:900;
}

.status{
 background:#dcfce7;
 color:#166534;
 border-radius:999px;
 padding:5px 9px;
 font-size:9px;
 font-weight:900;
 white-space:nowrap;
}

.membership-text{
 color:#78350f;
 font-size:11px;
 line-height:1.4;
 margin-top:6px;
}

.upgrade{
 display:block;
 background:linear-gradient(135deg,#f59e0b,#f97316);
 color:#fff;
 text-decoration:none;
 text-align:center;
 border-radius:9px;
 padding:10px;
 margin-top:9px;
 font-size:11px;
 font-weight:900;
}

.hidden{
 display:none!important;
}

.section-title{
 font-size:17px;
 font-weight:900;
 margin:15px 2px 8px;
}

.note{
 background:#eff6ff;
 border:1px solid #bfdbfe;
 color:#1e40af;
 border-radius:10px;
 padding:9px 11px;
 font-size:11px;
 line-height:1.4;
 margin-bottom:10px;
}

.lesson-grid{
 display:flex;
 flex-direction:column;
 gap:9px;
}

.card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:14px;
 padding:14px;
 box-shadow:0 2px 8px rgba(15,23,42,.04);
}

.card.free{
 border-top:3px solid var(--green);
}

.card.premium{
 border-top:3px solid var(--gold);
}

.number{
 color:var(--blue);
 font-size:9px;
 font-weight:900;
 margin-bottom:8px;
 letter-spacing:.3px;
}

.tamil{
 font-size:15px;
 font-weight:800;
 line-height:1.45;
 margin-bottom:6px;
}

.sinhala{
 color:#475569;
 font-size:12px;
 line-height:1.45;
 margin-bottom:6px;
}

.english{
 color:#1e293b;
 font-size:13px;
 line-height:1.5;
 font-weight:600;
}

.listen{
 border:0;
 background:#eff6ff;
 color:var(--blue);
 border-radius:8px;
 padding:7px 9px;
 margin-top:8px;
 font-size:10px;
 font-weight:800;
 cursor:pointer;
}

.badge{
 display:inline-block;
 margin-top:8px;
 border-radius:999px;
 padding:4px 7px;
 font-size:8px;
 font-weight:900;
}

.free-badge{
 background:#dcfce7;
 color:#166534;
}

.premium-badge{
 background:#fef3c7;
 color:#92400e;
}

.premium-box{
 background:linear-gradient(135deg,#fff7ed,#fffbeb);
 border:2px solid #fbbf24;
 border-radius:14px;
 padding:15px;
 text-align:center;
}

.premium-box-title{
 color:#92400e;
 font-size:15px;
 font-weight:900;
 margin-bottom:5px;
}

.premium-box-text{
 color:#78350f;
 font-size:11px;
 line-height:1.45;
}

.premium-button{
 display:block;
 background:linear-gradient(135deg,#f59e0b,#f97316);
 color:#fff;
 text-decoration:none;
 border-radius:9px;
 padding:10px;
 margin-top:9px;
 font-size:11px;
 font-weight:900;
}

.share-btn{
 width:100%;
 border:0;
 background:linear-gradient(135deg,var(--blue),var(--blue2));
 color:#fff;
 border-radius:10px;
 padding:11px;
 margin-top:11px;
 font-size:12px;
 font-weight:900;
 cursor:pointer;
}

.loading{
 background:#fff;
 border-radius:12px;
 padding:18px;
 text-align:center;
 color:var(--muted);
 font-size:12px;
}

.error{
 background:#fef2f2;
 border:1px solid #fecaca;
 color:#991b1b;
 border-radius:11px;
 padding:12px;
 font-size:12px;
 line-height:1.4;
}

.footer{
 text-align:center;
 color:var(--muted);
 font-size:10px;
 padding:16px;
}

@media(max-width:380px){
 .container{padding-left:7px;padding-right:7px}
 .hero{padding:14px}
 h1{font-size:20px}
 .tamil{font-size:14px}
 .english{font-size:12px}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div class="logo">📚 CreateLK Academy</div>
<div class="menu">☰</div>
</div>
</header>

<main class="container">

<section class="hero">
<div class="brand">CREATELK ACADEMY</div>
<h1>🗣️ Daily Spoken English</h1>
<p class="subtitle">
Learn Tamil → English conversations every day.
</p>
<div id="lessonDate" class="date">Loading...</div>
</section>

<section class="membership">

<div class="membership-top">
<div class="membership-title">⭐ Premium Membership</div>
<div id="membershipStatus" class="status">Checking...</div>
</div>

<div id="membershipText" class="membership-text">
Checking membership...
</div>

<a
id="upgradeButton"
href="premium.html"
class="upgrade hidden">
⭐ Upgrade to Premium
</a>

</section>

<h2 class="section-title">📖 TODAY'S LESSON</h2>

<div id="limitNote" class="note">
Loading today's lesson...
</div>

<div id="loading" class="loading">
Loading today's lesson...
</div>

<div id="error" class="error hidden"></div>

<section id="lessonGrid" class="lesson-grid hidden"></section>

<button
id="shareButton"
class="share-btn hidden"
type="button">
📤 Share Dialogue 1
</button>

</main>

<footer class="footer">
© 2026 CreateLK Academy
</footer>

<script>

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};


/* =========================
   STUDENT
========================= */

function loadStudent(){

try{

const raw=
localStorage.getItem(STUDENT_KEY);

if(raw){
student=JSON.parse(raw)||{};
}

}catch(e){

student={};

}

}


/* =========================
   PREMIUM LOGIC
   STATUS + EXPIRY
========================= */

function isPremium(){

loadStudent();

const status=
String(
student.membership_status||
student.membershipStatus||
student.status||
""
).trim().toUpperCase();

const expiry=
student.membership_expiry||
student.membershipExpiry||
student.expiry||
"";

/*
 Premium is valid only when:
 1. status is PREMIUM
 2. expiry exists
 3. expiry is still in the future
*/

if(status!=="PREMIUM"){
return false;
}

if(!expiry){
return false;
}

const expiryDate=
new Date(expiry);

if(
isNaN(expiryDate.getTime())
){
return false;
}

return expiryDate.getTime()>Date.now();

}


/* =========================
   DATE
========================= */

function setupDate(){

const now=new Date();

document.getElementById(
"lessonDate"
).textContent=
now.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

return now;

}


/* =========================
   MEMBERSHIP UI
========================= */

function updateMembership(){

const premium=
isPremium();

const status=
document.getElementById(
"membershipStatus"
);

const text=
document.getElementById(
"membershipText"
);

const note=
document.getElementById(
"limitNote"
);

const upgrade=
document.getElementById(
"upgradeButton"
);

if(premium){

status.textContent="✓ Premium";

text.textContent=
"Premium is active. All 10 daily dialogues are unlocked.";

note.innerHTML=
"<strong>⭐ Premium:</strong> All 10 daily dialogues are available.";

upgrade.classList.add("hidden");

}else{

status.textContent="Free";

text.textContent=
"3 dialogues are free. Premium unlocks all 10.";

note.innerHTML=
"<strong>Free:</strong> Dialogues 1–3 are free. Upgrade for all 10.";

upgrade.classList.remove("hidden");

}

return premium;

}


/* =========================
   FIELD HELPERS
========================= */

function getTamil(item){

return(
item.tamil||
item.ta||
item.tamil_text||
item.question_tamil||
item.text_tamil||
""
);

}

function getSinhala(item){

return(
item.sinhala||
item.si||
item.sinhala_text||
item.translation_sinhala||
item.text_sinhala||
""
);

}

function getEnglish(item){

return(
item.english||
item.en||
item.english_text||
item.answer_english||
item.text_english||
""
);

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   VOICE
========================= */

function listenEnglish(text){

if(!("speechSynthesis" in window)){

alert("Voice playback is not supported.");

return;

}

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="en-US";
speech.rate=.9;

speechSynthesis.speak(speech);

}


/* =========================
   LESSON CARD
========================= */

function createCard(item,index){

const card=
document.createElement("article");

card.className=
"card "+(
index<3
?"free"
:"premium"
);

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

card.innerHTML=`

<div class="number">
DIALOGUE ${index+1}
</div>

<div class="tamil">
${escapeHTML(ta)}
</div>

${
si
?
`<div class="sinhala">
${escapeHTML(si)}
</div>`
:""
}

<div class="english">
${escapeHTML(en)}
</div>

${
en
?
`<button type="button" class="listen">
🔊 Listen
</button>`
:""
}

<span class="badge ${
index<3
?"free-badge"
:"premium-badge"
}">
${
index<3
?"✓ FREE"
:"⭐ PREMIUM"
}
</span>
`;

const listen=
card.querySelector(".listen");

if(listen){

listen.onclick=
()=>listenEnglish(en);

}

return card;

}


/* =========================
   UPGRADE CARD
========================= */

function createUpgradeCard(){

const box=
document.createElement("div");

box.className="premium-box";

box.innerHTML=`

<div class="premium-box-title">
⭐ Unlock More Lessons
</div>

<div class="premium-box-text">
3 dialogues are free every day.
Premium unlocks all 10.
</div>

<a
href="premium.html"
class="premium-button">
⭐ Upgrade to Premium
</a>

`;

return box;

}


/* =========================
   NORMALIZE API
========================= */

function normalizeLesson(json){

let data=json;

if(json&&json.lesson){
data=json.lesson;
}

if(
json&&
json.data&&
!Array.isArray(json.data)
){

data=json.data;

}

const dialogues=
data.dialogues||
data.conversations||
data.items||
data.lessons;

if(!Array.isArray(dialogues)){

throw new Error(
"No dialogues were returned by Cloudflare."
);

}

return{
dialogues:dialogues
};

}


/* =========================
   LOAD LESSON
========================= */

async function loadLesson(){

setupDate();

const premium=
updateMembership();

try{

const now=new Date();

const monthDay=
String(
now.getMonth()+1
).padStart(2,"0")
+
"-"+
String(
now.getDate()
).padStart(2,"0");

const response=
await fetch(
LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!response.ok){

throw new Error(
"Lesson service returned HTTP "+
response.status+"."
);

}

const json=
await response.json();

const lesson=
normalizeLesson(json);

if(lesson.dialogues.length<3){

throw new Error(
"Today's lesson has fewer than 3 dialogues."
);

}

const grid=
document.getElementById("lessonGrid");

grid.innerHTML="";


/* FREE */

if(!premium){

for(
let i=0;
i<Math.min(3,lesson.dialogues.length);
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}

grid.appendChild(
createUpgradeCard()
);

}


/* PREMIUM */

else{

const maximum=
Math.min(
10,
lesson.dialogues.length
);

for(
let i=0;
i<maximum;
i++
){

grid.appendChild(
createCard(
lesson.dialogues[i],
i
)
);

}

}


window.currentFirstDialogue=
lesson.dialogues[0];


document.getElementById("loading")
.classList.add("hidden");

document.getElementById("error")
.classList.add("hidden");

grid.classList.remove("hidden");

document.getElementById("shareButton")
.classList.remove("hidden");

}catch(error){

console.error(error);

document.getElementById("loading")
.classList.add("hidden");

const errorBox=
document.getElementById("error");

errorBox.textContent=
"⚠️ "+error.message;

errorBox.classList.remove("hidden");

}

}


/* =========================
   SHARE IMAGE
   COLORFUL + CENTERED
   1080 × 1350
========================= */

async function shareFirstDialogue(){

const item=
window.currentFirstDialogue;

if(!item){

alert(
"Today's lesson is not loaded yet."
);

return;

}

const ta=getTamil(item);
const si=getSinhala(item);
const en=getEnglish(item);

const date=
document.getElementById(
"lessonDate"
).textContent;

const canvas=
document.createElement("canvas");

canvas.width=1080;
canvas.height=1350;

const ctx=
canvas.getContext("2d");


/* BACKGROUND */

const bg=
ctx.createLinearGradient(
0,
0,
1080,
1350
);

bg.addColorStop(
0,
"#2563eb"
);

bg.addColorStop(
0.5,
"#7c3aed"
);

bg.addColorStop(
1,
"#db2777"
);

ctx.fillStyle=bg;

ctx.fillRect(
0,
0,
1080,
1350
);


/* DECORATION */

ctx.fillStyle=
"rgba(255,255,255,.12)";

ctx.beginPath();
ctx.arc(1000,100,230,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(70,1280,190,0,Math.PI*2);
ctx.fill();


/* BRAND */

ctx.textAlign="center";

ctx.fillStyle="#fff";

ctx.font=
"bold 48px Arial";

ctx.fillText(
"📚 CreateLK Academy",
540,
105
);

ctx.font=
"bold 34px Arial";

ctx.fillText(
"DAILY SPOKEN ENGLISH",
540,
160
);

ctx.font=
"24px Arial";

ctx.globalAlpha=.9;

ctx.fillText(
date,
540,
202
);

ctx.globalAlpha=1;


/* WHITE CONTENT CARD */

ctx.shadowColor=
"rgba(0,0,0,.20)";

ctx.shadowBlur=30;

ctx.shadowOffsetY=12;

ctx.fillStyle="#fff";

roundRect(
ctx,
70,
260,
940,
760,
38
);

ctx.fill();

ctx.shadowColor="transparent";
ctx.shadowBlur=0;
ctx.shadowOffsetY=0;


/* CARD LABEL */

ctx.fillStyle="#2563eb";

ctx.font=
"bold 25px Arial";

ctx.fillText(
"DIALOGUE 1",
540,
325
);


/* SMALL DIVIDER */

ctx.strokeStyle="#e2e8f0";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(190,350);
ctx.lineTo(890,350);

ctx.stroke();


/* CONTENT */

let y=435;

if(ta){

y=drawWrapped(
ctx,
ta,
540,
y,
780,
58,
"bold 38px Arial",
"#172033"
);

}

if(si){

y+=35;

y=drawWrapped(
ctx,
si,
540,
y,
780,
48,
"27px Arial",
"#64748b"
);

}

if(en){

y+=45;

drawWrapped(
ctx,
en,
540,
y,
780,
55,
"bold 35px Arial",
"#2563eb"
);

}


/* FOOTER OF IMAGE */

ctx.fillStyle="#fff";

ctx.font=
"bold 28px Arial";

ctx.fillText(
"Learn English Every Day",
540,
1120
);

ctx.font=
"bold 26px Arial";

ctx.globalAlpha=.9;

ctx.fillText(
"CreateLK Academy",
540,
1170
);

ctx.globalAlpha=1;


/* SHARE */

canvas.toBlob(
async(blob)=>{

if(!blob){

alert("Unable to create image.");

return;

}

const file=
new File(
[blob],
"createlk-daily-english.png",
{
type:"image/png"
}
);


/*
 TEXT IS SEPARATE FROM PHOTO.
*/

const shareText=
`🗣️ Daily Spoken English

${ta}

${en}

📚 CreateLK Academy
For the full lesson visit createlk.com`;


/* NATIVE SHARE */

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({
title:"CreateLK Academy | Daily Spoken English",
text:shareText,
files:[file]
});

return;

}catch(error){

if(error.name==="AbortError"){
return;
}

}

}


/* TEXT FALLBACK */

if(navigator.share){

try{

await navigator.share({
title:"CreateLK Academy | Daily Spoken English",
text:shareText
});

return;

}catch(error){

if(error.name==="AbortError"){
return;
}

}

}


/* IMAGE DOWNLOAD FALLBACK */

const link=
document.createElement("a");

link.download=
"createlk-daily-english.png";

link.href=
URL.createObjectURL(blob);

link.click();

setTimeout(
()=>{
URL.revokeObjectURL(link.href);
},
1000
);

},
"image/png"
);

}


/* =========================
   ROUNDED RECT
========================= */

function roundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.lineTo(x+w-r,y);

ctx.quadraticCurveTo(
x+w,y,
x+w,y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}


/* =========================
   WRAPPED TEXT
========================= */

function drawWrapped(
ctx,
text,
x,
y,
maxWidth,
lineHeight,
font,
color
){

ctx.font=font;
ctx.fillStyle=color;
ctx.textAlign="center";

const clean=
String(text)
.trim();

if(!clean){
return y;
}


/*
 Support Tamil/Sinhala text
 by wrapping according to measured width.
*/

const words=
clean.split(/\s+/);

let line="";
const lines=[];

for(const word of words){

const test=
line
?
line+" "+word
:
word;

if(
ctx.measureText(test).width>
maxWidth &&
line
){

lines.push(line);
line=word;

}else{

line=test;

}

}

if(line){
lines.push(line);
}

for(const value of lines){

ctx.fillText(
value,
x,
y
);

y+=lineHeight;

}

return y;

}


/* =========================
   SHARE BUTTON
========================= */

document.getElementById(
"shareButton"
).addEventListener(
"click",
shareFirstDialogue
);


/* =========================
   START
========================= */

loadLesson();

</script>

</body>
</html>
