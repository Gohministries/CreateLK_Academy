.shareButton,

}

margin-top:12px;

color:#fff
}

margin-top:9px;

}

}

@media(max-width:380px){

.logo{
font-size:14px
}

main{
padding-left:5px;

}

padding:14px
}

}

}

</style></head><body><header><div class="nav"><a class="back" href="dashboard.html">

</a><a class="logo" href="index.html">
📚 CreateLK <span>Academy</span>
</a></div></header><main><section class="card hero"><small>DAILY SPOKEN ENGLISH</small>

<h1 id="welcome">
Welcome 👋
</h1><p>
Learn English every day with CreateLK Academy.
</p></section><section class="card"><div class="membership"><div class="memberLeft"><div class="memberIcon">
⭐
</div><div><div class="memberTitle">
Premium Membership
</div><div class="memberText" id="memberText">
Checking membership...
</div></div></div><div id="memberBadge" class="badge free">
Checking
</div></div></section><section class="card"><div class="sectionTitle">
📖 TODAY'S LESSON
</div><div class="sectionText" id="lessonDescription">
Loading...
</div><div id="lessonArea"><div class="loading">
Loading today's conversations...
</div></div></section><footer>
© 2026 CreateLK Academy
</footer></main><script>

const AUTH_API =
"https://createlk-auth-createlk.workers.dev";

const LESSON_API =
"https://spokenlessons.createlk.workers.dev";

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev";

const STORAGE_KEY =
"createlk_student";

let student={};
let todayLesson=null;

try{

student=
JSON.parse(
localStorage.getItem(STORAGE_KEY)||"{}"
);

}catch(e){

student={};

}


/* STUDENT ID */

function getStudentId(){

return Number(

student.id||
student.database_id||
student.student_id_number||
student.student_id||
0

);

}


/* PREMIUM */

function isPremium(){

return String(

student.membership_status||
student.membershipStatus||
student.membership||
"FREE"

).toUpperCase()==="PREMIUM";

}


/* REFRESH STUDENT */

async function refreshStudent(){

const studentId=
getStudentId();

if(!studentId)return;

try{

const response=
await fetch(

AUTH_API+
"/api/student?id="+
encodeURIComponent(studentId),

{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}

);

if(!response.ok)return;

const data=
await response.json();

if(
data.success&&
data.student
){

student={
...student,
...data.student,
id:Number(
data.student.id||
studentId
)
};

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(student)
);

}

}catch(error){

console.log(
"Student refresh error:",
error
);

}

}


/* STUDENT UI */

function updateStudentUI(){

const name=
(
(student.first_name||"")+
" "+
(student.last_name||"")
).trim()
||
student.name
||
"Student";

document.getElementById(
"welcome"
).textContent=
"Welcome, "+name+" 👋";

const badge=
document.getElementById(
"memberBadge"
);

const text=
document.getElementById(
"memberText"
);

if(isPremium()){

badge.textContent=
"✓ Premium";

badge.className=
"badge premium";

text.textContent=
"Premium access is active.";

}else{

badge.textContent=
"Free";

badge.className=
"badge free";

text.textContent=
"3 conversations are free.";

}

}


/* TODAY */

function getToday(){

const now=new Date();

return(

String(now.getMonth()+1)
.padStart(2,"0")

+"-"+

String(now.getDate())
.padStart(2,"0")

);

}


/* CHECKOUT */

async function checkout(){

const studentId=
getStudentId();

if(!studentId){

alert(
"Please login again."
);

location.href=
"login.html";

return;

}

const button=
document.querySelector(
".upgradeButton"
);

if(button){

button.disabled=true;

button.textContent=
"Opening payment...";

}

try{

const response=
await fetch(

PAYMENT+
"/api/checkout",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:studentId

})

}

);

const raw=
await response.text();

if(!response.ok){

throw new Error(
"Unable to open payment."
);

}


/* PAYHERE FORM */

if(
raw.includes("<form")
){

document.open();

document.write(raw);

document.close();

return;

}


/* JSON */

let data;

try{

data=
JSON.parse(raw);

}catch(e){

throw new Error(
"Invalid payment response."
);

}

if(
data.url||
data.checkout_url
){

location.href=
data.url||
data.checkout_url;

return;

}

throw new Error(
"Invalid payment response."
);

}catch(error){

console.error(
"Checkout error:",
error
);

alert(
error.message||
"Unable to start payment."
);

if(button){

button.disabled=false;

button.textContent=
"⭐ Upgrade to Premium";

}

}

}


/* FETCH LESSON */

async function fetchLesson(){

const monthDay=
getToday();

const area=
document.getElementById(
"lessonArea"
);

const description=
document.getElementById(
"lessonDescription"
);

area.innerHTML=
'<div class="loading">Loading...</div>';

try{

let response=
await fetch(

LESSON_API+
"/api/today?month_day="+
encodeURIComponent(monthDay),

{
cache:"no-store"
}

);

if(!response.ok){

response=
await fetch(

LESSON_API+
"/api/lesson?month_day="+
encodeURIComponent(monthDay),

{
cache:"no-store"
}

);

}

if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}

const data=
await response.json();

let lesson=null;

if(data&&data.lesson){

lesson=data.lesson;

}else if(
data&&
data.data&&
!Array.isArray(data.data)
){

lesson=data.data;

}else if(
data&&
data.result
){

lesson=data.result;

}else if(
data&&
data.dialogues
){

lesson=data;

}else if(
Array.isArray(data)&&
data.length
){

lesson=data[0];

}

if(!lesson){

description.textContent=
"Today's conversations are not available.";

area.innerHTML=
'<div class="error">⚠️ No lesson available today.</div>';

return;

}

todayLesson=
lesson;

description.textContent=
lesson.description||
"Practice useful spoken English every day.";

let dialogues=
lesson.dialogues;

if(
typeof dialogues==="string"
){

try{

dialogues=
JSON.parse(dialogues);

}catch(e){

dialogues=[];

}

}

if(
(!Array.isArray(dialogues)||
!dialogues.length)&&
lesson.dialogue_data
){

try{

dialogues=
typeof lesson.dialogue_data==="string"
?
JSON.parse(lesson.dialogue_data)
:
lesson.dialogue_data;

}catch(e){

dialogues=[];

}

}

if(
!Array.isArray(dialogues)||
!dialogues.length
){

area.innerHTML=
'<div class="error">⚠️ No conversations available.</div>';

return;

}

renderDialogues(dialogues);

try{

sessionStorage.setItem(
"createlk_today_lesson",
JSON.stringify(lesson)
);

}catch(e){}

}catch(error){

console.error(
"Lesson error:",
error
);

area.innerHTML=
'<div class="error">⚠️ Unable to load today\'s lesson.<br><br>Please refresh the page.</div>';

}

}


/* RENDER */

function renderDialogues(dialogues){

const area=
document.getElementById(
"lessonArea"
);

area.innerHTML="";

const available=
isPremium()
?
dialogues.length
:
Math.min(3,dialogues.length);

for(
let i=0;
i<available;
i++
){

const item=
dialogues[i]||{};

const box=
document.createElement(
"div"
);

box.className=
"dialogue";

box.innerHTML=`

<div class="dialogueNumber">
CONVERSATION ${i+1}
</div>

<div class="lang">
TAMIL
</div>

<div class="tamil">
${escapeHTML(item.tamil||"")}
</div>

<div class="lang">
SINHALA
</div>

<div class="sinhala">
${escapeHTML(item.sinhala||"")}
</div>

<div class="lang">
ENGLISH
</div>

<div class="english">
${escapeHTML(item.english||"")}
</div>

<button
class="listen"
onclick="speakEnglish(this)"
data-text="${escapeAttribute(item.english||"")}"
>
🔊 Listen
</button>

`;

area.appendChild(box);

}


/* FREE LOCK */

if(
!isPremium()&&
dialogues.length>3
){

const lock=
document.createElement(
"div"
);

lock.className=
"lock";

lock.innerHTML=
"🔒 <b>Unlock 10 daily conversations with Premium.</b>";

area.appendChild(lock);

}


/* SHARE */

const share=
document.createElement(
"button"
);

share.className=
"shareButton";

share.textContent=
"📤 Share First Conversation";

share.onclick=
shareFirstLesson;

area.appendChild(share);


/* PREMIUM BUTTON */

if(!isPremium()){

const upgrade=
document.createElement(
"button"
);

upgrade.className=
"upgradeButton";

upgrade.textContent=
"⭐ Upgrade to Premium";

upgrade.onclick=
checkout;

area.appendChild(upgrade);

}

}


/* ESCAPE */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttribute(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/* SPEECH */

function speakEnglish(button){

const text=
button.getAttribute(
"data-text"
);

if(
!text||
!("speechSynthesis"in window)
){

return;

}

window.speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(text);

speech.lang=
"en-US";

speech.rate=
.9;

window.speechSynthesis.speak(
speech
);

}


/* SHARE */

async function shareFirstLesson(){

if(
!todayLesson||
!todayLesson.dialogues
){

alert(
"Today's lesson is not ready."
);

return;

}

let dialogues=
todayLesson.dialogues;

if(
typeof dialogues==="string"
){

try{

dialogues=
JSON.parse(dialogues);

}catch(e){

alert(
"Lesson data error."
);

return;

}

}

const first=
dialogues[0];

if(!first){

alert(
"First conversation is not available."
);

return;

}


/* 4:5 */

const canvas=
document.createElement(
"canvas"
);

canvas.width=
1080;

canvas.height=
1350;

const ctx=
canvas.getContext(
"2d"
);


/* BACKGROUND */

const gradient=
ctx.createLinearGradient(
0,
0,
1080,
1350
);

gradient.addColorStop(
0,
"#2563eb"
);

gradient.addColorStop(
.5,
"#7c3aed"
);

gradient.addColorStop(
1,
"#0f172a"
);

ctx.fillStyle=
gradient;

ctx.fillRect(
0,
0,
1080,
1350
);


/* DECORATION */

ctx.globalAlpha=
.12;

ctx.fillStyle=
"#ffffff";

ctx.beginPath();

ctx.arc(
930,
150,
260,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
80,
1210,
230,
0,
Math.PI*2
);

ctx.fill();

ctx.globalAlpha=
1;


/* TITLE */

ctx.textAlign=
"center";

ctx.fillStyle=
"#ffffff";

ctx.font=
"bold 50px Arial";

ctx.fillText(
"CreateLK Academy",
540,
100
);

ctx.font=
"bold 42px Arial";

ctx.fillText(
"DAILY SPOKEN ENGLISH",
540,
165
);


/* WHITE CARD */

const cardX=
70;

const cardY=
230;

const cardW=
940;

const cardH=
850;

drawRoundRect(
ctx,
cardX,
cardY,
cardW,
cardH,
35
);

ctx.fillStyle=
"#ffffff";

ctx.fill();


/*
 BALANCED CONTENT INSIDE WHITE CARD
 */

const centerX=
540;

const contentTop=
315;

const contentBottom=
995;

const availableHeight=
contentBottom-
contentTop;


/*
 Sections
 */

const sections=[

{
label:"TAMIL",
text:first.tamil||"",
textColor:"#0f172a",
font:"bold 30px Arial",
lineHeight:42
},

{
label:"SINHALA",
text:first.sinhala||"",
textColor:"#334155",
font:"bold 30px Arial",
lineHeight:42
},

{
label:"ENGLISH",
text:first.english||"",
textColor:"#2563eb",
font:"bold 34px Arial",
lineHeight:48
}

];


/*
 Calculate section heights
 */

let totalContentHeight=0;

const sectionHeights=[];

sections.forEach(section=>{

ctx.font=
section.font;

const words=
String(section.text)
.split(/\s+/);

let line="";
let lines=0;

words.forEach(word=>{

const test=
line+
(line?" ":"")+
word;

if(
ctx.measureText(test).width>
780&&
line
){

lines++;

line=
word;

}else{

line=
test;

}

});

if(line)lines++;

const labelHeight=
30;

const labelGap=
28;

const textHeight=
lines*
section.lineHeight;

const sectionHeight=
labelHeight+
labelGap+
textHeight;

sectionHeights.push(
sectionHeight
);

totalContentHeight+=
sectionHeight;

});


/*
 Equal spacing
 */

const sectionGap=
48;

totalContentHeight+=
sectionGap*2;


/*
 Vertically center the entire
 Tamil + Sinhala + English group
 */

let y=
contentTop+
(
availableHeight-
totalContentHeight
)/2;


/*
 DRAW
 */

sections.forEach(
(section,index)=>{

/* LABEL */

ctx.fillStyle=
"#64748b";

ctx.font=
"bold 24px Arial";

ctx.fillText(
section.label,
centerX,
y+24
);

y+=
24+
28;


/* TEXT */

ctx.fillStyle=
section.textColor;

ctx.font=
section.font;

y=
drawWrappedCentered(
ctx,
section.text,
centerX,
y,
780,
section.lineHeight
);


/* GAP */

if(
index<
sections.length-1
){

y+=
sectionGap;

}

});


/* WATERMARK */

ctx.textAlign=
"center";

ctx.fillStyle=
"rgba(255,255,255,.72)";

ctx.font=
"bold 25px Arial";

ctx.fillText(
"createlk.com",
540,
1285
);


/* DOWNLOAD / SHARE */

canvas.toBlob(
async function(blob){

if(!blob)return;

const file=
new File(
[blob],
"createlk-spoken-english.png",
{
type:"image/png"
}
);

const shareText=
"📚 Daily Spoken English\n\n"+
"Learn English every day with CreateLK Academy.\n\n"+
"Full lesson:\n"+
"https://createlk.com";

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({

files:[file],

text:shareText

});

}catch(e){

console.log(
"Share cancelled"
);

}

}else{

const url=
URL.createObjectURL(blob);

const a=
document.createElement(
"a"
);

a.href=
url;

a.download=
"createlk-spoken-english.png";

a.click();

URL.revokeObjectURL(
url
);

}

},
"image/png"
);

}


/* CENTER WRAP */

function drawWrappedCentered(
ctx,
text,
centerX,
startY,
maxWidth,
lineHeight
){

const words=
String(text)
.split(/\s+/);

let line="";

let y=
startY;

for(
let i=0;
i<words.length;
i++
){

const test=
line+
(words[i]?" ":"")+
words[i];

if(
ctx.measureText(test).width>
maxWidth&&
line
){

ctx.fillText(
line,
centerX,
y
);

y+=
lineHeight;

line=
words[i];

}else{

line=
test;

}

}

if(line){

ctx.fillText(
line,
centerX,
y
);

y+=
lineHeight;

}

return y;

}


/* ROUND RECT */

function drawRoundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}


/* START */

async function start(){

if(!getStudentId()){

location.replace(
"login.html"
);

return;

}

await refreshStudent();

updateStudentUI();

await fetchLesson();

}

start();
