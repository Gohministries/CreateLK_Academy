<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Daily Spoken English | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#2563eb;
--p:#7c3aed;
--g:#059669;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f3f6fb
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--d);
line-height:1.5
}

a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid var(--l)
}

.nav{
max-width:900px;
margin:auto;
padding:10px 8px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:900;
color:var(--b)
}

.logo span{color:var(--p)}

.back{
font-size:10px;
font-weight:800;
color:var(--m)
}

main{
max-width:900px;
margin:auto;
padding:8px 3px 20px
}

.card{
background:#fff;
border:1px solid var(--l);
border-radius:16px;
padding:16px;
margin-bottom:9px
}

.hero{
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
border:0;
padding:20px
}

.hero small{
font-size:9px;
font-weight:900;
letter-spacing:.5px
}

.hero h1{
font-size:22px;
line-height:1.2;
margin:5px 0
}

.hero p{
font-size:10px;
opacity:.95
}

.day{
text-align:center;
padding:15px
}

.dayNumber{
font-size:12px;
font-weight:900;
color:var(--b)
}

.date{
font-size:20px;
font-weight:900;
margin:3px 0
}

.dayInfo{
font-size:9px;
color:var(--m)
}

.badge{
display:inline-block;
margin-top:9px;
padding:6px 10px;
border-radius:8px;
font-size:9px;
font-weight:900
}

.premium{
background:#ecfdf5;
color:#047857;
border:1px solid #a7f3d0
}

.free{
background:#f8fafc;
color:var(--m);
border:1px solid var(--l)
}

.sectionTitle{
font-size:11px;
font-weight:900;
margin-bottom:10px
}

.dialogue{
border:1px solid var(--l);
border-radius:12px;
padding:13px;
margin-bottom:9px
}

.dialogueNo{
font-size:9px;
font-weight:900;
color:var(--p);
margin-bottom:7px
}

.tamil{
font-size:14px;
font-weight:800;
margin-bottom:5px
}

.english{
font-size:13px;
color:#334155;
margin-bottom:9px
}

.listen{
border:0;
background:#eff6ff;
color:var(--b);
border-radius:8px;
padding:7px 11px;
font-size:9px;
font-weight:900;
cursor:pointer
}

.complete{
width:100%;
border:0;
background:var(--g);
color:#fff;
border-radius:10px;
padding:13px;
font-size:11px;
font-weight:900;
cursor:pointer
}

.complete:disabled{
opacity:.6
}

.status{
text-align:center;
padding:25px 10px;
font-size:11px;
color:var(--m)
}

.error{color:#dc2626}

.notice{
font-size:9px;
color:var(--m);
text-align:center;
margin-top:9px
}

footer{
text-align:center;
color:var(--m);
font-size:8px;
padding:5px 0 18px
}

@media(max-width:380px){
.logo{font-size:14px}
.card{padding:14px}
.hero{padding:17px}
.hero h1{font-size:21px}
.tamil{font-size:13px}
.english{font-size:12px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="logo" href="index.html">
📚 CreateLK <span>Academy</span>
</a>

<a class="back" href="index.html">
← Dashboard
</a>

</div>
</header>

<main>

<section class="card hero">

<small>DAILY SPOKEN ENGLISH</small>

<h1 id="welcome">Welcome 👋</h1>

<p>
Tamil → English conversations every day.
</p>

</section>


<section class="card day">

<div class="dayNumber" id="dayNumber">
DAY
</div>

<div class="date" id="date">
Loading...
</div>

<div class="dayInfo">
📖 10 dialogues available today.
</div>

<div id="badge" class="badge free">
Checking membership...
</div>

</section>


<section class="card">

<div class="sectionTitle">
📖 TODAY'S LESSON
</div>

<div id="lesson" class="status">
Loading today's lesson...
</div>

</section>


<section class="card" id="completeBox" style="display:none">

<button
id="completeBtn"
class="complete"
onclick="completeLesson()">
✅ Complete Lesson
</button>

<div class="notice" id="completeStatus"></div>

</section>


<footer>
© 2026 CreateLK Academy
</footer>

</main>


<script>

const COURSE_API =
"https://createlk-course-lessons.createlk.workers.dev";

const ACCOUNT_API =
"https://createlk-auth-createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const FREE_DIALOGUES = 3;
const TOTAL_DIALOGUES = 10;

let student = {};
let premium = false;


/* LOAD STUDENT */

try{

student = JSON.parse(
localStorage.getItem(STUDENT_KEY) || "{}"
);

}catch(e){

student = {};

}


/* STUDENT ID */

function studentId(){

return Number(
student.id ||
student.database_id ||
student.student_id ||
student.student_id_number ||
0
);

}


/* TODAY */

function today(){

const d = new Date();

return (
String(d.getMonth()+1).padStart(2,"0") +
"-" +
String(d.getDate()).padStart(2,"0")
);

}


/* DATE TEXT */

function dateText(){

const d = new Date();

return d.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric",
year:"numeric"
}
);

}


/* DAY OF YEAR */

function dayOfYear(){

const d = new Date();

const start =
new Date(d.getFullYear(),0,0);

const diff = d - start;

return Math.floor(
diff / 86400000
);

}


/* ACCOUNT */

async function refreshStudent(){

const id = studentId();

if(!id){
return false;
}

try{

const r = await fetch(
ACCOUNT_API +
"/api/student?id=" +
encodeURIComponent(id),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok){

console.log(
"Account HTTP:",
r.status
);

return false;

}

const d = await r.json();

console.log(
"Account response:",
d
);

if(d.success && d.student){

student = {
...student,
...d.student,
id:Number(
d.student.id || id
)
};

localStorage.setItem(
STUDENT_KEY,
JSON.stringify(student)
);

return true;

}

}catch(e){

console.log(
"Account refresh error:",
e
);

}

return false;

}


/* PREMIUM */

function checkPremium(){

const status = String(

student.membership_status ||
student.membershipStatus ||
student.membership ||
student.plan ||
"FREE"

).trim().toUpperCase();

premium =
status === "PREMIUM" ||
status === "ACTIVE_PREMIUM";

const badge =
document.getElementById("badge");

if(premium){

badge.textContent =
"✓ Premium";

badge.className =
"badge premium";

}else{

badge.textContent =
"Free";

badge.className =
"badge free";

}

}


/* LESSON */

async function loadLesson(){

const box =
document.getElementById("lesson");

const md = today();

console.log(
"Loading lesson:",
md
);

try{

/*
IMPORTANT:
The Worker receives today's date.
*/

const url =
COURSE_API +
"?date=" +
encodeURIComponent(md);

const r = await fetch(
url,
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

console.log(
"Lesson HTTP:",
r.status
);

if(!r.ok){

throw new Error(
"HTTP "+r.status
);

}

const d =
await r.json();

console.log(
"Lesson response:",
d
);

if(!d.success){

throw new Error(
d.error ||
"No lesson data"
);

}

const data =
d.lesson ||
d.devotional ||
d.data ||
d;

if(!data){

throw new Error(
"No lesson data"
);

}

renderLesson(data);

}catch(e){

console.log(
"Lesson error:",
e
);

box.className =
"status error";

box.textContent =
"⚠️ No lesson data.";

}

}


/* GET DIALOGUES */

function getDialogues(data){

let list =
data.dialogues ||
data.conversations ||
data.items ||
data.lessons ||
[];

if(Array.isArray(list)){
return list;
}


/*
If Worker returns dialogue_1_ta,
dialogue_1_en style fields.
*/

const result=[];

for(let i=1;i<=TOTAL_DIALOGUES;i++){

const ta =
data["dialogue_"+i+"_ta"] ||
data["tamil_"+i] ||
data["tamil"+i] ||
"";

const en =
data["dialogue_"+i+"_en"] ||
data["english_"+i] ||
data["english"+i] ||
"";

if(ta || en){

result.push({
tamil:ta,
english:en
});

}

}

return result;

}


/* GET TEXT */

function getText(item,keys){

for(const key of keys){

if(
item[key] !== undefined &&
item[key] !== null &&
String(item[key]).trim()
){

return String(item[key]);

}

}

return "";

}


/* ESCAPE */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* RENDER */

function renderLesson(data){

const box =
document.getElementById("lesson");

let dialogues =
getDialogues(data);


/*
Single dialogue fallback.
*/

if(!dialogues.length){

const ta =
getText(data,[
"tamil",
"ta",
"tamil_text",
"question_ta"
]);

const en =
getText(data,[
"english",
"en",
"english_text",
"answer_en"
]);

if(ta || en){

dialogues=[{
tamil:ta,
english:en
}];

}

}


/*
Free = 3
Premium = 10
*/

const limit =
premium
?TOTAL_DIALOGUES
:FREE_DIALOGUES;

dialogues =
dialogues.slice(0,limit);

if(!dialogues.length){

box.className =
"status error";

box.textContent =
"⚠️ No lesson data.";

return;

}

let html = "";

dialogues.forEach(
(item,index)=>{

const tamil =
getText(item,[
"tamil",
"ta",
"tamil_text",
"question_ta",
"sentence_ta"
]);

const english =
getText(item,[
"english",
"en",
"english_text",
"answer_en",
"sentence_en"
]);

html += `

<div class="dialogue">

<div class="dialogueNo">
DIALOGUE ${index+1} / ${TOTAL_DIALOGUES}
</div>

<div class="tamil">
🇱🇰 ${escapeHTML(tamil)}
</div>

<div class="english">
🇬🇧 ${escapeHTML(english)}
</div>

<button
class="listen"
onclick='speak(${JSON.stringify(english)})'>
🔊 Listen
</button>

</div>

`;

});


if(!premium){

html += `

<div class="notice">
⭐ 3 dialogues are free.
Premium unlocks all 10 dialogues.
</div>

`;

}

box.className = "";
box.innerHTML = html;

document.getElementById(
"completeBox"
).style.display =
"block";

}


/* SPEAK */

function speak(text){

if(
!text ||
!("speechSynthesis" in window)
){

return;

}

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "en-US";
speech.rate = .9;

speechSynthesis.speak(
speech
);

}


/* COMPLETE */

async function completeLesson(){

const id =
studentId();

if(!id){

alert(
"Please login again."
);

return;

}

const btn =
document.getElementById(
"completeBtn"
);

const status =
document.getElementById(
"completeStatus"
);

btn.disabled = true;

btn.textContent =
"Saving...";

try{

const r = await fetch(
COURSE_API + "/api/progress",
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},
body:JSON.stringify({

student_id:id,

lesson_id:today(),

date:today()

})
}
);

const d =
await r.json();

if(!r.ok || !d.success){

throw new Error(
d.error ||
"Could not save progress."
);

}

btn.textContent =
"✓ Lesson Completed";

status.textContent =
"Today's lesson completed.";

}catch(e){

console.log(e);

btn.disabled = false;

btn.textContent =
"✅ Complete Lesson";

status.textContent =
"⚠️ "+e.message;

}

}


/* START */

async function start(){

const id =
studentId();

if(!id){

location.replace(
"login.html"
);

return;

}


/*
Show basic information immediately.
*/

document.getElementById(
"dayNumber"
).textContent =
"DAY "+dayOfYear();

document.getElementById(
"date"
).textContent =
dateText();

const name =
(
(student.first_name || "")+
" "+
(student.last_name || "")
).trim() ||
student.name ||
"Student";

document.getElementById(
"welcome"
).textContent =
"Welcome, "+name+" 👋";


/*
Refresh account first.
This is what updates Premium status.
*/

await refreshStudent();

checkPremium();


/*
Now load today's lesson.
*/

await loadLesson();

}


/* RUN */

start();

</script>

</body>
</html>
