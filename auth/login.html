<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | CreateLK Academy</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fc;
    color:#172033;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border:1px solid #e5e9f0;
    border-radius:20px;
    padding:32px;
    box-shadow:0 15px 45px rgba(15,23,42,.08);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:70px;
    height:70px;
    object-fit:contain;
}

h1{
    text-align:center;
    font-size:27px;
    color:#172554;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.notice{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.5;
}

.notice.show{
    display:block;
}

.notice.error{
    background:#fff1f1;
    border:1px solid #ffd0d0;
    color:#b42318;
}

.notice.success{
    background:#effdf4;
    border:1px solid #bbf7d0;
    color:#15803d;
}

label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:#334155;
    margin-bottom:7px;
}

.input-group{
    margin-bottom:17px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d8dee8;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:#fff;
    color:#172033;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.login-btn{
    width:100%;
    border:0;
    background:#2563eb;
    color:#fff;
    padding:14px;
    border-radius:10px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    margin-top:3px;
}

.login-btn:hover{
    background:#1d4ed8;
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.register{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#64748b;
}

.register a{
    color:#2563eb;
    font-weight:800;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#64748b;
    font-size:12px;
    text-decoration:none;
}

@media(max-width:500px){
    .login-box{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK Academy">
    </div>

    <h1>Welcome Back</h1>

    <div class="subtitle">
        Sign in to continue learning with CreateLK Academy.
    </div>

    <div id="notice" class="notice"></div>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email Address</label>

            <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
        </div>

        <button
        type="submit"
        id="loginButton"
        class="login-btn">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="/auth/register.html">Create Account</a>
    </div>

    <a href="/" class="back">
        ← Back to CreateLK Academy
    </a>

</div>

<script>

const API =
"https://createlk-auth-api.createlk.workers.dev";


/* Get the requested destination */
const params =
new URLSearchParams(
window.location.search
);

const redirect =
params.get("redirect") ||
"/dashboard.html";


function showNotice(message,type="error"){

    const notice =
    document.getElementById("notice");

    notice.textContent =
    message;

    notice.className =
    "notice show " + type;
}


function hideNotice(){

    const notice =
    document.getElementById("notice");

    notice.textContent = "";

    notice.className =
    "notice";
}


/*
    LOGIN
*/
document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideNotice();

        const button =
        document.getElementById(
            "loginButton"
        );

        const email =
        document.getElementById(
            "email"
        ).value.trim();

        const password =
        document.getElementById(
            "password"
        ).value;

        if(!email || !password){

            showNotice(
                "Please enter your email and password.",
                "error"
            );

            return;
        }

        button.disabled = true;

        button.textContent =
        "Signing in...";


        try{

            const response =
            await fetch(
                API + "/auth/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json",

                        "Accept":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


            const data =
            await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Login failed."
                );
            }


            if(
                !data.success ||
                !data.token
            ){

                throw new Error(
                    data.error ||
                    "Login was unsuccessful."
                );
            }


            /*
                IMPORTANT:
                Save the authentication token
                BEFORE redirecting.
            */

            localStorage.setItem(
                "createlk_token",
                data.token
            );


            /*
                Save customer information
                if returned by the API.
            */

            if(data.customer){

                localStorage.setItem(
                    "createlk_customer",
                    JSON.stringify(
                        data.customer
                    )
                );

            }


            /*
                Verify that the token was
                actually stored.
            */

            const savedToken =
            localStorage.getItem(
                "createlk_token"
            );


            if(
                !savedToken ||
                savedToken !== data.token
            ){

                throw new Error(
                    "Login session could not be saved. Please enable browser storage and try again."
                );
            }


            /*
                Redirect only AFTER token
                has been successfully stored.
            */

            window.location.replace(
                redirect
            );


        }catch(error){

            console.error(
                "Login error:",
                error
            );

            showNotice(
                error.message ||
                "Unable to login. Please try again.",
                "error"
            );

            button.disabled = false;

            button.textContent =
            "Login";
        }

    }
);

</script>

</body>
</html>
