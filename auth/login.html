<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | CreateLK Academy</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fc;
    color:#172033;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border:1px solid #e5e9f0;
    border-radius:20px;
    padding:32px;
    box-shadow:0 15px 45px rgba(15,23,42,.08);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:70px;
    height:70px;
    object-fit:contain;
}

h1{
    text-align:center;
    font-size:27px;
    color:#172554;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.notice{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.5;
}

.notice.show{
    display:block;
}

.notice.error{
    background:#fff1f1;
    border:1px solid #ffd0d0;
    color:#b42318;
}

.notice.success{
    background:#effdf4;
    border:1px solid #bbf7d0;
    color:#15803d;
}

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:#334155;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d8dee8;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:#fff;
    color:#172033;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.main-btn{
    width:100%;
    border:0;
    background:#2563eb;
    color:#fff;
    padding:14px;
    border-radius:10px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.main-btn:hover{
    background:#1d4ed8;
}

.main-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.switch{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#64748b;
}

.switch a{
    color:#2563eb;
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#64748b;
    font-size:12px;
    text-decoration:none;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK Academy">
    </div>

    <!-- LOGIN -->

    <div id="loginView">

        <h1>Welcome Back</h1>

        <div class="subtitle">
            Sign in to continue learning with CreateLK Academy.
        </div>

        <div id="loginNotice" class="notice"></div>

        <form id="loginForm">

            <div class="input-group">
                <label for="loginEmail">
                    Email Address
                </label>

                <input
                type="email"
                id="loginEmail"
                autocomplete="email"
                placeholder="Enter your email"
                required>
            </div>

            <div class="input-group">
                <label for="loginPassword">
                    Password
                </label>

                <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                placeholder="Enter your password"
                required>
            </div>

            <button
            type="submit"
            id="loginButton"
            class="main-btn">
                Login
            </button>

        </form>

        <div class="switch">
            Don't have an account?
            <a onclick="showRegister()">
                Create Account
            </a>
        </div>

    </div>


    <!-- REGISTER -->

    <div id="registerView" class="hidden">

        <h1>Create Account</h1>

        <div class="subtitle">
            Create your CreateLK Academy student account.
        </div>

        <div id="registerNotice" class="notice"></div>

        <form id="registerForm">

            <div class="input-group">
                <label for="registerName">
                    Full Name
                </label>

                <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required>
            </div>

            <div class="input-group">
                <label for="registerEmail">
                    Email Address
                </label>

                <input
                type="email"
                id="registerEmail"
                autocomplete="email"
                placeholder="Enter your email"
                required>
            </div>

            <div class="input-group">
                <label for="registerPhone">
                    Phone Number
                </label>

                <input
                type="tel"
                id="registerPhone"
                autocomplete="tel"
                placeholder="Enter your phone number"
                required>
            </div>

            <div class="input-group">
                <label for="registerPassword">
                    Password
                </label>

                <input
                type="password"
                id="registerPassword"
                autocomplete="new-password"
                placeholder="Create a password"
                required>
            </div>

            <button
            type="submit"
            id="registerButton"
            class="main-btn">
                Create Account
            </button>

        </form>

        <div class="switch">
            Already have an account?
            <a onclick="showLogin()">
                Login
            </a>
        </div>

    </div>


    <a href="/" class="back">
        ← Back to CreateLK Academy
    </a>

</div>


<script>

const API =
"https://createlk-auth-api.createlk.workers.dev";


/* Preserve the original destination */

const params =
new URLSearchParams(
window.location.search
);

const redirect =
params.get("redirect") ||
"/dashboard.html";


function showLogin(){

    document.getElementById(
        "loginView"
    ).classList.remove("hidden");

    document.getElementById(
        "registerView"
    ).classList.add("hidden");

}


function showRegister(){

    document.getElementById(
        "loginView"
    ).classList.add("hidden");

    document.getElementById(
        "registerView"
    ).classList.remove("hidden");

}


function notice(id,message,type){

    const box =
    document.getElementById(id);

    box.textContent = message;

    box.className =
    "notice show " + type;
}


/* LOGIN */

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const button =
        document.getElementById(
            "loginButton"
        );

        const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

        const password =
        document.getElementById(
            "loginPassword"
        ).value;


        button.disabled = true;

        button.textContent =
        "Signing in...";


        try{

            const response =
            await fetch(
                API + "/auth/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json",

                        "Accept":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


            const data =
            await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Login failed."
                );
            }


            if(
                !data.success ||
                !data.token
            ){

                throw new Error(
                    data.error ||
                    "Login was unsuccessful."
                );
            }


            /*
              IMPORTANT:
              Save token before redirect.
            */

            localStorage.setItem(
                "createlk_token",
                data.token
            );


            if(data.customer){

                localStorage.setItem(
                    "createlk_customer",
                    JSON.stringify(
                        data.customer
                    )
                );

            }


            /*
              Confirm token was saved.
            */

            const savedToken =
            localStorage.getItem(
                "createlk_token"
            );


            if(savedToken !== data.token){

                throw new Error(
                    "Login session could not be saved."
                );
            }


            /*
              Redirect to the exact
              requested page.
            */

            window.location.replace(
                redirect
            );


        }catch(error){

            console.error(
                "Login error:",
                error
            );

            notice(
                "loginNotice",
                error.message ||
                "Unable to login.",
                "error"
            );

            button.disabled = false;

            button.textContent =
            "Login";
        }

    }
);


/* REGISTER */

document.getElementById(
    "registerForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const button =
        document.getElementById(
            "registerButton"
        );

        const name =
        document.getElementById(
            "registerName"
        ).value.trim();

        const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

        const phone =
        document.getElementById(
            "registerPhone"
        ).value.trim();

        const password =
        document.getElementById(
            "registerPassword"
        ).value;


        button.disabled = true;

        button.textContent =
        "Creating Account...";


        try{

            const response =
            await fetch(
                API + "/auth/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json",

                        "Accept":
                        "application/json"
                    },

                    body:JSON.stringify({
                        name:name,
                        email:email,
                        phone:phone,
                        password:password
                    })
                }
            );


            const data =
            await response.json();


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Registration failed."
                );
            }


            /*
              If registration returns a token,
              log the student in immediately.
            */

            if(data.success && data.token){

                localStorage.setItem(
                    "createlk_token",
                    data.token
                );


                if(data.customer){

                    localStorage.setItem(
                        "createlk_customer",
                        JSON.stringify(
                            data.customer
                        )
                    );

                }


                window.location.replace(
                    redirect
                );

                return;
            }


            /*
              If registration succeeds but
              does not return a token,
              switch to Login.
            */

            notice(
                "registerNotice",
                "Account created successfully. Please login.",
                "success"
            );

            setTimeout(
                function(){
                    showLogin();
                },
                1000
            );


        }catch(error){

            console.error(
                "Register error:",
                error
            );

            notice(
                "registerNotice",
                error.message ||
                "Unable to create account.",
                "error"
            );

            button.disabled = false;

            button.textContent =
            "Create Account";
        }

    }
);

</script>

</body>
</html>
