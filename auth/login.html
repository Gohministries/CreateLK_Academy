.message.show{

.footer{

</style></head><body><div class="container"><div class="card"><div class="logo-area"><img
class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

<div class="brand">
CreateLK Academy
</div><div class="subtitle">
Online Education for Sri Lankan Students
</div></div><div class="tabs"><button
class="tab active"
id="loginTab"
onclick="showForm('login')">

Login

</button><button
class="tab"
id="registerTab"
onclick="showForm('register')">

Create Account

</button></div><div
id="message"
class="message">
</div><!-- LOGIN --><form
id="loginForm"
class="form active"
onsubmit="login(event)"><div class="field"><label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required>

</div><div class="field"><label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

</div><button
id="loginButton"
class="button"
type="submit">

Login

</button></form><!-- REGISTER --><form
id="registerForm"
class="form"
onsubmit="register(event)"><div class="row"><div class="field"><label>First Name</label>

<input
id="firstName"
type="text"
placeholder="First name"
autocomplete="given-name"
required>

</div><div class="field"><label>Last Name</label>

<input
id="lastName"
type="text"
placeholder="Last name"
autocomplete="family-name">

</div></div><div class="field"><label>Email</label>

<input
id="registerEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required>

</div><div class="field"><label>Phone</label>

<input
id="phone"
type="tel"
placeholder="Phone number"
autocomplete="tel">

</div><div class="field"><label>Password</label>

<input
id="registerPassword"
type="password"
placeholder="Minimum 6 characters"
minlength="6"
autocomplete="new-password"
required>

</div><button
id="registerButton"
class="button"
type="submit">

Create Account

</button></form><div class="footer">By continuing, you agree to our

<a href="../pages/terms-and-conditions.html">
Terms
</a>and

<a href="../pages/privacy-policy.html">
Privacy Policy
</a>.</div></div></div><script>

/* =========================
   AUTH API
========================= */

const API =
"https://createlk-auth-api.createlk.workers.dev";


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type="error"
){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message show " + type;

}


function clearMessage(){

const box =
document.getElementById("message");

box.className =
"message";

box.textContent = "";

}


/* =========================
   FORM SWITCH
========================= */

function showForm(type){

clearMessage();

const loginForm =
document.getElementById("loginForm");

const registerForm =
document.getElementById("registerForm");

const loginTab =
document.getElementById("loginTab");

const registerTab =
document.getElementById("registerTab");


if(type === "login"){

loginForm.classList.add("active");

registerForm.classList.remove("active");

loginTab.classList.add("active");

registerTab.classList.remove("active");

}else{

registerForm.classList.add("active");

loginForm.classList.remove("active");

registerTab.classList.add("active");

loginTab.classList.remove("active");

}

}


/* =========================
   DESTINATION
========================= */

function getDestination(){

const params =
new URLSearchParams(
window.location.search
);

const redirect =
params.get("redirect");


if(
redirect &&
redirect.startsWith("/") &&
!redirect.startsWith("//")
){

return redirect;

}

return "/dashboard.html";

}


/* =========================
   SAVE LOGIN
========================= */

function saveLogin(data){

if(
!data ||
!data.token
){

throw new Error(
"No login token received."
);

}


localStorage.setItem(
"createlk_token",
data.token
);


if(data.customer){

localStorage.setItem(
"createlk_customer",
JSON.stringify(
data.customer
)
);

}

}


/* =========================
   LOGIN
========================= */

async function login(event){

event.preventDefault();

clearMessage();

const button =
document.getElementById(
"loginButton"
);

const email =
document.getElementById(
"loginEmail"
).value
.trim()
.toLowerCase();

const password =
document.getElementById(
"loginPassword"
).value;


button.disabled = true;

button.innerHTML =
'<span class="loading"></span>Logging in...';


try{

const response =
await fetch(
API + "/auth/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({
email,
password
})

}
);


let data;

try{

data =
await response.json();

}catch(error){

throw new Error(
"Invalid response from login server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"Login failed."
);

}


/* SAVE TOKEN */

saveLogin(data);


showMessage(
"Login successful. Opening dashboard...",
"success"
);


setTimeout(
function(){

window.location.replace(
getDestination()
);

},
400
);


}catch(error){

console.error(
"Login error:",
error
);

showMessage(
error.message ||
"Unable to connect to login server."
);

button.disabled = false;

button.textContent =
"Login";

}

}


/* =========================
   REGISTER
========================= */

async function register(event){

event.preventDefault();

clearMessage();

const button =
document.getElementById(
"registerButton"
);


const first_name =
document.getElementById(
"firstName"
).value.trim();


const last_name =
document.getElementById(
"lastName"
).value.trim();


const email =
document.getElementById(
"registerEmail"
).value
.trim()
.toLowerCase();


const phone =
document.getElementById(
"phone"
).value.trim();


const password =
document.getElementById(
"registerPassword"
).value;


if(password.length < 6){

showMessage(
"Password must be at least 6 characters."
);

return;

}


button.disabled = true;

button.innerHTML =
'<span class="loading"></span>Creating account...';


try{

const response =
await fetch(
API + "/auth/register",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({

first_name,
last_name,
email,
phone,
password

})

}
);


let data;

try{

data =
await response.json();

}catch(error){

throw new Error(
"Invalid response from registration server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"Registration failed."
);

}


saveLogin(data);


showMessage(
"Account created successfully. Opening dashboard...",
"success"
);


setTimeout(
function(){

window.location.replace(
"/dashboard.html"
);

},
400
);


}catch(error){

console.error(
"Registration error:",
error
);

showMessage(
error.message ||
"Unable to create account."
);

button.disabled = false;

button.textContent =
"Create Account";

}

}


/* =========================
   CHECK EXISTING LOGIN
========================= */

async function checkExistingLogin(){

const token =
localStorage.getItem(
"createlk_token"
);


if(!token){

return;

}


try{

const response =
await fetch(
API + "/auth/me",
{
method:"GET",

headers:{
"Authorization":
"Bearer " + token,

"Accept":
"application/json"
}

}
);


/*
  Only remove token if
  server explicitly says 401.
*/

if(response.status === 401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

return;

}


/*
  Do not delete token for
  temporary server/network errors.
*/

if(!response.ok){

return;

}


const data =
await response.json();


if(
data.success &&
data.customer
){

localStorage.setItem(
"createlk_customer",
JSON.stringify(
data.customer
)
);


/*
  Already logged in.
*/

window.location.replace(
getDestination()
);

}

}catch(error){

console.error(
"Existing session check:",
error
);

}

}


/* =========================
   START
========================= */

checkExistingLogin();

</script></body></html>
