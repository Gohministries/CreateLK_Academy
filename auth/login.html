<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CreateLK Academy</title><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:#f5f7fb;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#172033;
}

.container{
width:100%;
max-width:430px;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:70px;
height:70px;
object-fit:contain;
}

.logo h1{
font-size:25px;
color:#172554;
margin-top:8px;
}

.logo p{
font-size:13px;
color:#64748b;
margin-top:5px;
}

.card{
background:#fff;
border:1px solid #e5e9f0;
border-radius:20px;
padding:28px;
box-shadow:0 15px 40px rgba(15,23,42,.08);
}

.tabs{
display:flex;
gap:8px;
margin-bottom:22px;
}

.tab{
flex:1;
padding:11px;
border:1px solid #dce2eb;
background:#fff;
border-radius:9px;
font-weight:800;
cursor:pointer;
color:#64748b;
}

.tab.active{
background:#2563eb;
border-color:#2563eb;
color:#fff;
}

.form{
display:none;
}

.form.active{
display:block;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:6px;
color:#334155;
}

input{
width:100%;
padding:12px 13px;
border:1px solid #d9e0ea;
border-radius:9px;
font-size:14px;
outline:none;
margin-bottom:15px;
}

input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

button.submit{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-size:14px;
font-weight:800;
cursor:pointer;
}

button.submit:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
padding:11px 13px;
border-radius:9px;
margin-bottom:15px;
font-size:13px;
line-height:1.5;
}

.message.show{
display:block;
}

.message.error{
background:#fff1f1;
color:#b42318;
}

.message.success{
background:#effbf3;
color:#19733a;
}

.home{
display:block;
text-align:center;
margin-top:18px;
font-size:13px;
color:#2563eb;
font-weight:700;
}

</style></head><body><div class="container"><div class="logo"><img
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

<h1>CreateLK Academy</h1><p>Learn. Grow. Succeed.</p></div><div class="card"><div class="tabs"><button
class="tab active"
id="loginTab"
onclick="showForm('login')">
Login
</button>

<button
class="tab"
id="registerTab"
onclick="showForm('register')">
Register
</button>

</div><div
id="message"
class="message">
</div><!-- LOGIN --><form
id="loginForm"
class="form active"
onsubmit="login(event)"><label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="Enter your email"
required
autocomplete="email">

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Enter your password"
required
autocomplete="current-password">

<button
id="loginButton"
class="submit"
type="submit">
Login
</button>

</form><!-- REGISTER --><form
id="registerForm"
class="form"
onsubmit="register(event)"><label>Name</label>

<input
id="registerName"
type="text"
placeholder="Your full name"
required
autocomplete="name">

<label>Email</label>

<input
id="registerEmail"
type="email"
placeholder="Your email"
required
autocomplete="email">

<label>Phone</label>

<input
id="registerPhone"
type="tel"
placeholder="Your phone number"
required
autocomplete="tel">

<label>Password</label>

<input
id="registerPassword"
type="password"
placeholder="Create a password"
required
autocomplete="new-password">

<button
id="registerButton"
class="submit"
type="submit">
Create Account
</button>

</form></div><a
href="/"
class="home">
← Back to CreateLK Academy
</a>

</div><script>

const API =
"https://createlk-auth-api.createlk.workers.dev";


function showForm(type){

document.getElementById("message")
.className="message";

document.getElementById("loginForm")
.classList.remove("active");

document.getElementById("registerForm")
.classList.remove("active");

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("registerTab")
.classList.remove("active");


if(type==="login"){

document.getElementById("loginForm")
.classList.add("active");

document.getElementById("loginTab")
.classList.add("active");

}else{

document.getElementById("registerForm")
.classList.add("active");

document.getElementById("registerTab")
.classList.add("active");

}

}


function showMessage(message,type){

const box =
document.getElementById("message");

box.textContent=message;

box.className=
"message show "+type;

}


function getDestination(){

const params =
new URLSearchParams(
window.location.search
);

const redirect =
params.get("redirect");


if(
redirect &&
redirect.startsWith("/") &&
!redirect.startsWith("//")
){

return redirect;

}

return "/dashboard.html";

}


function saveLogin(data){

if(!data || !data.token){

throw new Error(
"Login token was not received."
);

}

localStorage.setItem(
"createlk_token",
data.token
);


if(data.customer){

localStorage.setItem(
"createlk_customer",
JSON.stringify(
data.customer
)
);

}

}


async function login(event){

event.preventDefault();


const button =
document.getElementById("loginButton");

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;


button.disabled=true;
button.textContent="Logging in...";


try{

const response =
await fetch(
API+"/auth/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email,
password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"Login failed."
);

}


saveLogin(data);


window.location.replace(
getDestination()
);


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to login.",
"error"
);

button.disabled=false;
button.textContent="Login";

}

}


async function register(event){

event.preventDefault();


const button =
document.getElementById(
"registerButton"
);


const name =
document.getElementById(
"registerName"
).value.trim();

const email =
document.getElementById(
"registerEmail"
).value.trim();

const phone =
document.getElementById(
"registerPhone"
).value.trim();

const password =
document.getElementById(
"registerPassword"
).value;


button.disabled=true;
button.textContent="Creating Account...";


try{

const response =
await fetch(
API+"/auth/register",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
name,
email,
phone,
password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"Registration failed."
);

}


saveLogin(data);


showMessage(
"Account created successfully.",
"success"
);


setTimeout(
function(){

window.location.replace(
"/dashboard.html"
);

},
500
);


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to register.",
"error"
);

button.disabled=false;
button.textContent="Create Account";

}

}


/*
 IMPORTANT:
 We check an existing token,
 but temporary network/server errors
 NEVER delete the token.
*/

async function checkExistingLogin(){

const existingToken =
localStorage.getItem(
"createlk_token"
);


if(!existingToken){

return;

}


try{

const response =
await fetch(
API+"/auth/me",
{
method:"GET",

headers:{
"Authorization":
"Bearer "+existingToken,

"Accept":
"application/json"
},

cache:"no-store"
}
);


if(response.status===401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

return;

}


if(!response.ok){

return;

}


const data =
await response.json();


if(
data.success &&
data.customer
){

localStorage.setItem(
"createlk_customer",
JSON.stringify(
data.customer
)
);


window.location.replace(
getDestination()
);

}

}catch(error){

console.error(
"Existing login check:",
error
);

/*
 NEVER remove token here.
*/

}

}


document.addEventListener(
"DOMContentLoaded",
function(){

checkExistingLogin();

}
);

</script></body>
</html>
