<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:linear-gradient(180deg,#f7f9ff,#eef2ff);
 color:#172033
}
button{cursor:pointer;font:700 14px Arial}
header{
 background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed);
 color:white;padding:18px 5%;
 display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:21px;font-weight:800}
.logout{
 background:white;color:#2563eb;border:0;border-radius:8px;
 padding:9px 16px
}
.hero{text-align:center;padding:35px 15px 20px}
.hero h1{font-size:30px;color:#111827}
.hero p{margin-top:8px;color:#64748b}
#greeting{margin-top:12px;font-size:18px;font-weight:700;color:#2563eb}

.wrap{max-width:1050px;margin:auto;padding:15px}
.card{
 background:white;border-radius:16px;padding:22px;margin:18px 0;
 box-shadow:0 6px 25px #0000000d
}
.center{text-align:center}

.premium{
 background:linear-gradient(135deg,#fff8df,#fff);
 border:1px solid #f1d77a
}
.premium h2{color:#9a6700}
.price{font-size:22px;font-weight:800;margin:10px}
.premium p{color:#64748b;line-height:1.5}
.status{margin:14px 0;font-weight:700}
.active{color:#15803d}
.not-active{color:#dc2626}
.buy{
 background:#2563eb;color:white;border:0;border-radius:9px;
 padding:12px 28px
}
.countdown{
 margin-top:10px;font-weight:800;color:#7c3aed
}

.section-title{text-align:center;margin:25px 0 15px}
.grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:12px
}
.lesson{
 min-height:58px;background:white;border:1px solid #dbe3f0;
 border-radius:10px;padding:10px;color:#172033
}
.lesson:hover{border-color:#2563eb}
.lock{color:#dc2626}
.done{color:#15803d}

.pages{text-align:center;margin:20px 0}
.pages button{
 margin:4px;padding:8px 12px;border:1px solid #cbd5e1;
 background:white;border-radius:7px
}
.pages .on{background:#2563eb;color:white}

.modal{
 display:none;position:fixed;inset:0;background:#0008;
 padding:20px;overflow:auto;z-index:10
}
.modal-box{
 max-width:700px;margin:30px auto;background:white;
 border-radius:16px;padding:22px
}
.close{
 float:right;border:0;background:#fee2e2;color:#b91c1c;
 border-radius:7px;padding:7px 11px
}
.lang{
 display:flex;gap:7px;justify-content:center;
 margin:18px 0;flex-wrap:wrap
}
.lang button{
 padding:8px 12px;border:1px solid #cbd5e1;
 background:white;border-radius:7px
}
.dialogue{
 margin:10px 0;padding:13px;background:#f8fafc;
 border-radius:10px;line-height:1.6
}
.actions{text-align:center;margin-top:18px}
.actions button{
 padding:10px 18px;margin:4px;border:0;border-radius:8px
}
.play{background:#2563eb;color:white}
.stop{background:#e2e8f0}
.complete{background:#16a34a;color:white}

@media(max-width:700px){
 header{padding:15px}
 .logo{font-size:18px}
 .hero h1{font-size:25px}
 .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div class="logo">CreateLK Academy</div>
 <button class="logout" onclick="logout()">Logout</button>
</header>

<section class="hero">
 <h1>Spoken English</h1>
 <p>Learn English through practical conversations</p>
 <div id="greeting">Welcome 👋</div>
</section>

<main class="wrap">

<section class="card premium center">
 <h2>Premium Membership</h2>
 <div class="price">LKR 999 • 30 Days</div>
 <p>
 Unlock all 100 lessons and learn through practical conversations
 for everyday, travel and workplace English.
 </p>
 <div id="premiumStatus" class="status">Checking...</div>
 <div id="countdown"></div>
 <button id="premiumBtn" class="buy" onclick="buyPremium()">
  Get Premium
 </button>
</section>

<h2 class="section-title">100 Spoken English Lessons</h2>
<div id="lessons" class="grid"></div>
<div id="pages" class="pages"></div>

</main>

<div id="modal" class="modal">
 <div class="modal-box">
  <button class="close" onclick="closeLesson()">✕</button>
  <h2 id="lessonTitle" class="center"></h2>

  <div class="lang">
   <button onclick="setLang('en')">English Only</button>
   <button onclick="setLang('ta')">English → Tamil</button>
   <button onclick="setLang('si')">English → Sinhala</button>
  </div>

  <div id="dialogues"></div>

  <div class="actions">
   <button class="play" onclick="playAll()">▶ Play All</button>
   <button class="stop" onclick="speechSynthesis.cancel()">■ Stop</button>
   <button class="complete" onclick="completeLesson()">✓ Complete</button>
  </div>
 </div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";
const AUTH="/auth/login.html";
const TOKEN="createlk_token";

let lessons=[],premium=false,premiumExpiry=null;
let page=1,current=null,lang="en",timer;

const $=id=>document.getElementById(id);
const token=localStorage.getItem(TOKEN);

if(!token) location.href=AUTH;

function userName(){
 try{
  const u=JSON.parse(localStorage.getItem("createlk_customer")||"{}");
  return `${u.first_name||u.name||""} ${u.last_name||""}`.trim();
 }catch{return ""}
}

function greeting(){
 const h=new Date().getHours();
 const g=h<12?"Good Morning":h<17?"Good Afternoon":h<21?"Good Evening":"Good Night";
 $("greeting").textContent=`${g}${userName()?", "+userName():""} 👋`;
}

async function load(){
 greeting();
 try{
  const r=await fetch(`${API}/lessons/${"spoken-english"}`,{
   headers:{Authorization:`Bearer ${token}`}
  });
  const d=await r.json();

  lessons=d.lessons||d.data||[];
  premium=!!d.premium;

  premiumExpiry=
   d.premium_expires_at||
   d.expires_at||
   d.premium_expiry||
   null;

  updatePremium();
  render();
 }catch(e){
  $("lessons").innerHTML=
   `<p class="center">Unable to load lessons.</p>`;
 }
}

function updatePremium(){
 clearInterval(timer);

 $("premiumStatus").innerHTML=premium
  ? `<span class="active">✓ Premium Active</span>`
  : `<span class="not-active">Premium not active</span>`;

 $("premiumBtn").style.display=premium?"none":"inline-block";

 if(premium&&premiumExpiry) countdown();
 else $("countdown").innerHTML="";
}

function countdown(){
 function run(){
  let x=new Date(premiumExpiry)-Date.now();

  if(x<=0){
   premium=false;
   updatePremium();
   return;
  }

  let s=Math.floor(x/1000);
  let d=Math.floor(s/86400);
  let h=Math.floor(s%86400/3600);
  let m=Math.floor(s%3600/60);
  let sec=s%60;

  $("countdown").innerHTML=
   `⏳ ${d} days ${String(h).padStart(2,"0")}:`+
   `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")} remaining`;
 }
 run();
 timer=setInterval(run,1000);
}

function free(n){return Number(n)<=2}

function render(){
 const start=(page-1)*10;
 const list=lessons.slice(start,start+10);

 $("lessons").innerHTML=list.map((l,i)=>{
  const n=l.lesson_number||l.number||start+i+1;
  const title=l.title||`Lesson ${n}`;
  const locked=!premium&&!free(n);
  const done=completed(n);

  return `
   <button class="lesson" onclick="openLesson(${n})">
    ${done?"✓ ":""}${title}
    ${locked?` <span class="lock">🔒</span>`:""}
   </button>`;
 }).join("");

 const total=Math.ceil(lessons.length/10);
 $("pages").innerHTML=Array.from({length:total},(_,i)=>
  `<button class="${page===i+1?"on":""}"
   onclick="page=${i+1};render()">${i+1}</button>`
 ).join("");
}

function completed(n){
 try{
  return JSON.parse(localStorage.getItem("createlk_completed")||"[]")
   .includes(Number(n));
 }catch{return false}
}

function openLesson(n){
 const l=lessons.find(x=>Number(x.lesson_number||x.number)===Number(n));
 if(!l)return;

 if(!premium&&!free(n)){
  alert("Premium is required to unlock this lesson.");
  return;
 }

 current=l;
 $("lessonTitle").textContent=l.title||`Lesson ${n}`;
 showDialogues();
 $("modal").style.display="block";
}

function showDialogues(){
 const d=current.dialogues||current.dialogue||[];
 $("dialogues").innerHTML=d.map(x=>{
  let html=`<div class="dialogue"><b>${x.speaker||""}</b><br>${x.english||x.en||x.text||""}`;

  if(lang==="ta") html+=`<br>🇱🇰 ${x.tamil||""}`;
  if(lang==="si") html+=`<br>🇱🇰 ${x.sinhala||""}`;

  return html+"</div>";
 }).join("");
}

function setLang(x){lang=x;showDialogues()}

function playAll(){
 speechSynthesis.cancel();
 const text=[...$("dialogues").querySelectorAll(".dialogue")]
  .map(x=>x.innerText).join(". ");
 speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function completeLesson(){
 if(!current)return;
 const n=Number(current.lesson_number||current.number);

 let a;
 try{a=JSON.parse(localStorage.getItem("createlk_completed")||"[]")}
 catch{a=[]}

 if(!a.includes(n))a.push(n);
 localStorage.setItem("createlk_completed",JSON.stringify(a));
 render();
 closeLesson();
}

function closeLesson(){
 speechSynthesis.cancel();
 $("modal").style.display="none";
}

async function buyPremium(){
 try{
  const r=await fetch(`${PAY}/premium-checkout`,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    Authorization:`Bearer ${token}`
   },
   body:"{}"
  });

  const d=await r.json();

  if(!r.ok)throw Error(d.error||"Payment error");

  const form=document.createElement("form");
  form.method="POST";
  form.action="https://www.payhere.lk/pay/checkout";

  Object.entries(d).forEach(([k,v])=>{
   if(v==null)return;
   const i=document.createElement("input");
   i.type="hidden";i.name=k;i.value=v;
   form.appendChild(i);
  });

  document.body.appendChild(form);
  form.submit();
 }catch(e){
  alert(e.message||"Unable to start payment.");
 }
}

function logout(){
 localStorage.removeItem(TOKEN);
 location.href=AUTH;
}

window.addEventListener("pageshow",load);
document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)load();
});

load();
</script>

</body>
</html>
