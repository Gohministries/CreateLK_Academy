<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
min-height:100vh
}

header{
background:#1e3a8a;
color:white;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:20px;
font-weight:bold
}

.user-box{
display:flex;
align-items:center;
gap:10px
}

#userName{
font-size:14px
}

.logout{
background:#ef4444;
color:white;
border:0;
padding:8px 12px;
border-radius:8px;
cursor:pointer
}

.container{
max-width:1000px;
margin:auto;
padding:20px
}

.hero{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 5px 20px #0000000d
}

.hero h1{
font-size:28px;
margin-bottom:8px
}

.hero p{
color:#64748b;
line-height:1.6
}

.premium{
background:#f59e0b;
color:white;
border:0;
padding:13px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:15px
}

.lessons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px
}

.lesson{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 5px 20px #0000000d
}

.lesson h3{
margin-bottom:8px
}

.lesson p{
font-size:13px;
color:#64748b;
line-height:1.5;
margin-bottom:15px
}

.lesson button{
width:100%;
padding:11px;
border:0;
border-radius:9px;
cursor:pointer;
font-weight:bold
}

.lesson button.locked{
background:#e2e8f0;
color:#64748b
}

.lesson button.open{
background:#2563eb;
color:white
}


/* LESSON MODAL */

.modal-bg{
display:none;
position:fixed;
inset:0;
background:#0008;
padding:15px;
z-index:20;
align-items:center;
justify-content:center
}

.modal{
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
background:white;
border-radius:20px
}

.modal-head{
background:#1e3a8a;
color:white;
padding:20px;
position:relative
}

.modal-head h2{
margin-bottom:5px
}

.modal-head p{
font-size:13px;
opacity:.85
}

.close{
position:absolute;
right:12px;
top:10px;
background:#ffffff20;
color:white;
border:0;
font-size:22px;
width:38px;
height:38px;
border-radius:9px;
cursor:pointer
}

.modal-body{
padding:20px;
line-height:1.7
}


/* PAYMENT OPTIONS */

.payment-bg{
display:none;
position:fixed;
inset:0;
background:#0009;
padding:15px;
z-index:30;
align-items:center;
justify-content:center
}

.payment-modal{
width:100%;
max-width:430px;
background:#fff;
border-radius:22px;
overflow:hidden;
box-shadow:0 20px 60px #0004
}

.payment-head{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
color:#fff;
padding:23px;
position:relative
}

.payment-head h2{
margin:6px 0;
font-size:23px
}

.payment-head p{
font-size:13px;
opacity:.9
}

.payment-close{
position:absolute;
right:13px;
top:11px;
background:#ffffff20;
color:#fff;
border:0;
font-size:22px;
width:38px;
height:38px;
border-radius:9px;
cursor:pointer
}

.payment-body{
padding:20px
}

.payment-option{
width:100%;
border:1px solid #e5e7eb;
background:#fff;
border-radius:16px;
padding:17px;
margin-bottom:12px;
display:flex;
align-items:center;
gap:14px;
text-align:left;
cursor:pointer
}

.payment-option:hover{
border-color:#2563eb;
background:#f8faff
}

.payment-icon{
width:48px;
height:48px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
flex:none
}

.online-icon{
background:#dbeafe
}

.manual-icon{
background:#dcfce7
}

.payment-info{
flex:1
}

.payment-info strong{
display:block;
font-size:16px;
margin-bottom:4px
}

.payment-info span{
display:block;
font-size:12px;
color:#64748b;
line-height:1.4
}

.payment-arrow{
font-size:22px;
color:#94a3b8
}

@media(max-width:520px){

.payment-modal{
max-width:100%
}

}

</style>

</head>

<body>


<header>

<div class="logo">
CreateLK Academy
</div>

<div class="user-box">

<span id="userName">
Loading...
</span>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">


<div class="hero">

<h1>
Spoken English
</h1>

<p>
Improve your English speaking skills with our complete
Spoken English course. Learn step by step and become
more confident in everyday conversations.
</p>

<button
id="premiumBtn"
class="premium"
onclick="showPaymentOptions()">
GET PREMIUM
</button>

</div>


<div
id="lessons"
class="lessons">
</div>


</div>


<!-- LESSON MODAL -->

<div
id="modalBg"
class="modal-bg">

<div class="modal">

<div class="modal-head">

<button
class="close"
onclick="closeLesson()">
×
</button>

<h2 id="modalTitle">
Lesson
</h2>

<p id="modalSubtitle">
Spoken English
</p>

</div>

<div
id="modalBody"
class="modal-body">
</div>

</div>

</div>


<!-- PAYMENT OPTIONS MODAL -->

<div
id="paymentBg"
class="payment-bg">

<div class="payment-modal">

<div class="payment-head">

<button
class="payment-close"
onclick="closePaymentOptions()">
×
</button>

<small>
PREMIUM MEMBERSHIP
</small>

<h2>
Choose Payment Method
</h2>

<p>
LKR 999 • 30 Days Premium Access
</p>

</div>


<div class="payment-body">

<button
class="payment-option"
onclick="onlinePayment()">

<div class="payment-icon online-icon">
💳
</div>

<div class="payment-info">

<strong>
Online Payment
</strong>

<span>
Pay securely online using PayHere.
</span>

</div>

<div class="payment-arrow">
›
</div>

</button>


<button
class="payment-option"
onclick="manualPayment()">

<div class="payment-icon manual-icon">
🏦
</div>

<div class="payment-info">

<strong>
Manual Payment
</strong>

<span>
View bank details and payment instructions.
</span>

</div>

<div class="payment-arrow">
›
</div>

</button>

</div>

</div>

</div>



<script>


const API=
"https://createlk-academy-api.createlk.workers.dev";


const PAYHERE_API=
"https://createlk-payhere.createlk.workers.dev";


const COURSE=
"spoken-english";


const PRICE=
999;


const $=
id=>document.getElementById(id);



/* LOGIN CHECK */

const currentToken=
localStorage.getItem("createlk_token");


if(!currentToken){

location.replace("/Aca/login.html");

}



/* LOAD USER */

async function loadUser(){

try{

const res=
await fetch(
API+"/me",
{
headers:{
Authorization:
"Bearer "+currentToken
}
}
);


if(!res.ok){

throw new Error();

}


const data=
await res.json();


$("userName").textContent=
data.user?.name ||
data.user?.email ||
"User";


}

catch(e){

$("userName").textContent=
"User";

}

}


loadUser();



/* PAYMENT OPTIONS */

function showPaymentOptions(){

const currentToken=
localStorage.getItem("createlk_token");


if(!currentToken){

alert(
"Your login session has expired. Please login again."
);

location.replace("/Aca/login.html");

return;

}


$("paymentBg").style.display=
"flex";

}


function closePaymentOptions(){

$("paymentBg").style.display=
"none";

}


function onlinePayment(){

closePaymentOptions();

buyPremium();

}


function manualPayment(){

closePaymentOptions();

location.href=
"/Aca/bank.html";

}



/* PREMIUM PAYMENT */

async function buyPremium(){

const currentToken=
localStorage.getItem("createlk_token");


if(!currentToken){

alert(
"Your login session has expired. Please login again."
);

location.replace("/Aca/login.html");

return;

}


try{

const res=
await fetch(
PAYHERE_API+"/premium-checkout",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+currentToken
},

body:JSON.stringify({

course:
COURSE,

amount:
PRICE

})

}
);


if(!res.ok){

throw new Error(
"Payment initialization failed"
);

}


const data=
await res.json();


if(!data){

throw new Error(
"Invalid payment response"
);

}


/*
Existing PayHere checkout
*/

const form=
document.createElement("form");

form.method=
"POST";

form.action=
"https://www.payhere.lk/pay/checkout";

form.style.display=
"none";


Object.keys(data).forEach(
key=>{

const input=
document.createElement("input");

input.type=
"hidden";

input.name=
key;

input.value=
data[key];

form.appendChild(input);

}
);


document.body.appendChild(form);

form.submit();

}

catch(error){

console.error(error);

alert(
"Unable to start payment. Please try again."
);

}

}



/* LESSONS */

const lessons=[

{
title:"Lesson 01 - Introduction",
description:
"Introduction to Spoken English and basic communication.",
content:
"Welcome to Spoken English. In this lesson you will learn the basics of English communication and how to start speaking with confidence."
},

{
title:"Lesson 02 - Daily English",
description:
"Learn useful English sentences for everyday situations.",
content:
"Learn common English expressions and sentences that can be used in daily conversations."
},

{
title:"Lesson 03 - Speaking Practice",
description:
"Practice speaking English naturally and confidently.",
content:
"Practice speaking using simple questions, answers and everyday conversations."
},

{
title:"Lesson 04 - Common Conversations",
description:
"Learn English conversations used in real-life situations.",
content:
"Practice conversations for shopping, travelling, meeting people and other everyday situations."
},

{
title:"Lesson 05 - Grammar for Speaking",
description:
"Learn the grammar you need for better speaking.",
content:
"Understand simple grammar structures that help you create correct English sentences."
},

{
title:"Lesson 06 - Vocabulary",
description:
"Build your English vocabulary for everyday communication.",
content:
"Learn useful words and expressions and understand how to use them naturally."
},

{
title:"Lesson 07 - Pronunciation",
description:
"Improve your pronunciation and speaking clarity.",
content:
"Practice English sounds, word stress and sentence pronunciation."
},

{
title:"Lesson 08 - Fluency Practice",
description:
"Develop your English speaking fluency.",
content:
"Use speaking exercises to reduce hesitation and speak English more naturally."
},

{
title:"Lesson 09 - Advanced Conversation",
description:
"Practice longer and more natural English conversations.",
content:
"Improve your ability to explain ideas, opinions and experiences in English."
},

{
title:"Lesson 10 - Final Speaking Practice",
description:
"Put everything together and improve your confidence.",
content:
"Complete the final speaking activities and continue practicing English every day."
}

];



/* RENDER LESSONS */

function renderLessons(){

const container=
$("lessons");

container.innerHTML="";


lessons.forEach(
(lesson,index)=>{

const card=
document.createElement("div");

card.className=
"lesson";


const premium=
index>0;


card.innerHTML=`

<h3>
${lesson.title}
</h3>

<p>
${lesson.description}
</p>

<button
class="${premium?"locked":"open"}"
onclick="${premium
?"showPaymentOptions()"
:`openLesson(${index})`}">

${premium
?"🔒 Premium Lesson"
:"Start Lesson"}

</button>

`;


container.appendChild(card);

}
);

}


renderLessons();



/* OPEN LESSON */

function openLesson(index){

const lesson=
lessons[index];


$("modalTitle").textContent=
lesson.title;


$("modalSubtitle").textContent=
"Spoken English";


$("modalBody").textContent=
lesson.content;


$("modalBg").style.display=
"flex";

}


function closeLesson(){

$("modalBg").style.display=
"none";

}



/* LOGOUT */

function logout(){

localStorage.removeItem(
"createlk_token"
);

location.replace(
"/index.html"
);

}



/* CLOSE MODALS WHEN CLICKING BACKGROUND */

$("modalBg").addEventListener(
"click",
function(e){

if(e.target===
$("modalBg")){

closeLesson();

}

}
);


$("paymentBg").addEventListener(
"click",
function(e){

if(e.target===
$("paymentBg")){

closePaymentOptions();

}

}
);


</script>

</body>
</html>
