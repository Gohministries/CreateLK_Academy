<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f8faff,#eef3ff);
color:#172033
}

header{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
color:#fff;
padding:17px 20px;
box-shadow:0 4px 18px #0f172a30
}

.head,.wrap{
max-width:1050px;
margin:auto
}

.head{
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:22px;
font-weight:800
}

.logo b{color:#fbbf24}

.logout{
background:#ffffff18;
color:#fff;
border:1px solid #ffffff30;
padding:9px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold
}

.wrap{
padding:25px 15px 55px
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
padding:42px 28px;
border-radius:25px;
color:#fff;
background:
radial-gradient(circle at 90% 15%,#818cf855 0 15%,transparent 35%),
linear-gradient(135deg,#1d4ed8,#4338ca 55%,#312e81);
box-shadow:0 14px 35px #312e8140;
text-align:center;
display:flex;
flex-direction:column;
align-items:center
}

.hero:after{
content:"";
position:absolute;
width:150px;
height:150px;
right:-50px;
bottom:-70px;
border-radius:50%;
background:#fbbf2430
}

.hero small{
font-weight:bold;
letter-spacing:1.5px;
opacity:.85
}

.hero h1{
font-size:36px;
margin:10px 0 12px;
position:relative;
z-index:1
}

.hero p{
line-height:1.65;
max-width:650px;
opacity:.92;
position:relative;
z-index:1
}

.badge{
display:inline-block;
margin-top:20px;
background:#ffffff18;
border:1px solid #ffffff30;
padding:9px 16px;
border-radius:30px;
font-size:13px;
font-weight:bold;
position:relative;
z-index:1
}

/* CARDS */

.card{
background:#fff;
padding:21px;
border-radius:20px;
margin-top:19px;
box-shadow:0 7px 25px #1e3a8a12;
border:1px solid #e2e8f0
}

/* PREMIUM */

.premium-card{
background:linear-gradient(135deg,#fffdf5,#fff7df);
border:1px solid #f5d77a;
position:relative;
overflow:hidden
}

.premium-card .row{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px
}

.premium-title{
font-size:18px;
font-weight:800;
color:#92400e
}

.price{
font-size:19px;
font-weight:800;
margin-top:6px
}

.status{
color:#64748b;
font-size:13px;
margin-top:5px
}

.active{
color:#15803d;
font-weight:bold
}

.premium{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#fff;
padding:12px 24px;
border:0;
border-radius:11px;
font-weight:800;
cursor:pointer;
box-shadow:0 5px 14px #d9770638
}

.premium:disabled{
opacity:.6;
cursor:wait
}

/* CERTIFICATE */

.certificate{
display:flex;
justify-content:center;
align-items:center
}

.certificate-btn{
width:100%;
max-width:320px;
background:linear-gradient(135deg,#2563eb,#4338ca);
color:#fff;
border:0;
padding:13px 18px;
border-radius:11px;
font-weight:800;
cursor:pointer
}

/* LESSONS */

.section{
margin:32px 0 16px;
font-size:23px;
color:#172554;
text-align:center
}

#lessons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.lesson{
background:linear-gradient(145deg,#fff,#f8faff);
padding:20px 17px;
border-radius:18px;
border:1px solid #dbe4f0;
position:relative;
overflow:hidden;
transition:.2s
}

.lesson:before{
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:4px;
background:linear-gradient(180deg,#2563eb,#7c3aed)
}

.lesson:hover{
transform:translateY(-4px);
box-shadow:0 10px 25px #2563eb18
}

.num{
font-size:11px;
font-weight:800;
color:#2563eb;
letter-spacing:.8px
}

.lesson h3{
font-size:16px;
line-height:1.4;
margin-top:8px
}

.lesson p{
font-size:13px;
color:#64748b;
line-height:1.5;
margin-top:7px
}

.bottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:16px
}

.open,.complete{
background:linear-gradient(135deg,#2563eb,#4338ca);
color:#fff;
border:0;
padding:9px 14px;
border-radius:9px;
font-weight:bold;
cursor:pointer
}

.lock{
background:#eef2f7;
color:#64748b;
border:0;
padding:9px 13px;
border-radius:9px;
cursor:pointer
}

.free{
color:#16a34a;
font-weight:bold;
font-size:11px
}

/* MODAL */

.modal-bg{
display:none;
position:fixed;
inset:0;
background:#0f172acc;
backdrop-filter:blur(5px);
padding:15px;
overflow:auto;
z-index:10
}

.modal{
background:#fff;
max-width:760px;
margin:25px auto;
border-radius:22px;
overflow:hidden
}

.modal-head{
background:linear-gradient(135deg,#1e3a8a,#4338ca);
color:#fff;
padding:24px;
position:relative
}

.close{
position:absolute;
right:15px;
top:12px;
background:#ffffff20;
color:#fff;
border:1px solid #ffffff30;
font-size:22px;
border-radius:9px;
padding:4px 10px;
cursor:pointer
}

.modal-body{
padding:20px
}

.controls{
display:flex;
gap:10px;
margin-bottom:18px
}

.play,.stop{
flex:1;
border:0;
padding:12px;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.play{
background:#1e3a8a;
color:#fff
}

.stop{
background:#dc2626;
color:#fff
}

.language-select{
flex:1;
border:1px solid #dbe4f0;
border-radius:10px;
padding:12px;
background:#f8faff;
font-weight:bold
}

.dialogue{
padding:17px;
margin:12px 0;
border:1px solid #e2e8f0;
border-radius:15px;
background:#fbfdff
}

.dialogue.playing{
border-color:#2563eb;
box-shadow:0 0 0 3px #2563eb18
}

.lang{
font-size:11px;
font-weight:bold;
color:#2563eb;
margin-top:12px
}

.text{
margin-top:4px;
line-height:1.55
}

.complete{
width:100%;
margin-top:15px;
padding:12px
}

.loading{
text-align:center;
padding:35px;
color:#64748b
}

.error{
text-align:center;
padding:30px;
color:#dc2626
}

@media(max-width:750px){

#lessons{
grid-template-columns:repeat(2,1fr)
}

.hero h1{
font-size:29px
}

}

@media(max-width:520px){

header{
padding:15px
}

.logo{
font-size:19px
}

.wrap{
padding:18px 12px 40px
}

.hero{
padding:30px 20px;
border-radius:21px
}

.hero h1{
font-size:27px
}

.premium{
width:100%
}

#lessons{
grid-template-columns:1fr;
gap:12px
}

.lesson{
padding:18px
}

.controls{
position:sticky;
top:0;
background:#fff;
padding-bottom:8px;
z-index:2;
flex-wrap:wrap
}

.language-select{
width:100%;
flex:none
}

}
</style>
</head>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";

const PAY="https://createlk-payhere.createlk.workers.dev";

const COURSE="spoken-english";

const token=localStorage.getItem("createlk_token");


/* LOGIN CHECK */

if(!token){

location.replace("/Aca/login.html");

throw new Error("Login required");

}


let premium=false;

let completed=[];

let dialogues=[];

let playing=false;

let selectedLanguage="en";


const headers={

"Content-Type":"application/json",

"Authorization":"Bearer "+token

};


const $=id=>document.getElementById(id);


/* LESSON TITLES */

const titles=[

"Introducing Yourself",
"Greetings and Small Talk",
"Talking About Your Family",
"Talking About Your Home",
"Daily Routine",
"Morning Activities",
"Talking About Your Job",

"Shopping for Clothes",
"Asking the Price",
"Returning an Item",
"At the Bus Stop",
"Taking a Bus",
"Taking a Taxi",
"Asking for Directions",
"Finding a Place",
"At the Train Station",
"Buying a Ticket",
"At the Airport",
"Checking Into a Hotel",
"Hotel Problems",
"Talking About Weather",
"Talking About Hobbies",
"Sports and Games",
"Music",
"Movies and TV",
"Reading Books",
"Weekend Activities",
"Holidays",
"Birthday Conversations",
"Celebrations",
"At the Doctor",
"Describing Symptoms",
"At the Pharmacy",
"Healthy Habits",
"Exercise and Fitness",
"Asking for Help",
"Offering Help",
"Giving Advice",
"Asking for Permission",
"Saying Sorry",
"Thanking Someone",
"Compliments",
"Agreeing and Disagreeing",
"Expressing Opinions",
"Making Suggestions",
"Making Decisions",
"Solving a Problem",
"Making a Complaint",
"Apologizing Professionally",
"Workplace Conversations",
"Job Interviews",
"Talking With a Customer",
"Talking With a Manager",
"Making an Appointment",
"Office Phone Calls",
"Meetings",
"Giving Instructions",
"Asking Questions at Work",
"Discussing a Project",
"Talking About Money",
"Banking",
"Using an ATM",
"Online Shopping",
"Using the Internet",
"Social Media Conversations",
"Learning English",
"Practicing English",
"Common English Mistakes",
"Understanding Fast English",
"Everyday Expressions",
"Making Conversation",
"Keeping a Conversation Going",
"Speaking Politely",
"Speaking Confidently",
"Natural English",
"Travel Conversations",
"Emergency Conversations",
"Real-Life Situations",
"Advanced Everyday Conversations",
"Speaking English Confidently"

];


/* LOAD LESSONS */

async function loadLessons(){

try{

const r=await fetch(

`${API}/lessons?course=${COURSE}&language=en`,

{headers}

);


if(r.status===401){

logout();

return;

}


const d=await r.json();


if(!r.ok||!d.success)

throw Error(
d.error||
d.message||
"Unable to load lessons."
);


premium=!!d.premium;


$("premiumStatus").innerHTML=premium

?'<span class="active">✓ Premium Active</span>'

:"Premium not active";


resetPremiumButton();


const apiLessons=d.lessons||[];


$("lessons").innerHTML=titles.map((title,i)=>{

const n=i+1;


const api=apiLessons.find(

x=>+x.lesson_number===n

);


const free=

n===1||

+api?.is_free===1;


const unlocked=

free||premium;


const done=

completed.includes(n);


return `

<article class="lesson">

<div class="num">
LESSON ${n}
</div>

<h3>
${esc(api?.title||title)}
</h3>

<p>
${esc(
api?.summary||
api?.objectives||
"Practical English conversation"
)}
</p>

<div class="bottom">

<span class="free">

${done
?"✓ COMPLETED"
:free
?"FREE"
:"PREMIUM"}

</span>

<button
class="${unlocked?"open":"lock"}"
onclick="${unlocked
?`openLesson(${n})`
:"buyPremium()"}">

${unlocked
?"Open"
:"🔒 Locked"}

</button>

</div>

</article>

`;

}).join("");


}catch(e){

console.error(e);


$("lessons").innerHTML=

`<div class="error">
${esc(e.message||"Unable to load lessons.")}
</div>`;

}

}


/* OPEN LESSON */

async function openLesson(n){

stopSpeech();


$("modalBg").style.display="block";


$("modalNum").textContent="LESSON "+n;


$("modalTitle").textContent="Loading...";


$("modalBody").innerHTML=

'<div class="loading">Loading lesson...</div>';


try{


const [en,si,ta]=await Promise.all([

getLesson(n,"en"),

getLesson(n,"si"),

getLesson(n,"ta")

]);


const l=en.lesson;


if(!l)

throw Error("Lesson data not found.");


$("modalTitle").textContent=l.title;


dialogues=[];


const enD=l.dialogues||[];

const siD=si.lesson?.dialogues||[];

const taD=ta.lesson?.dialogues||[];


for(let i=0;i<enD.length;i++){

dialogues.push({

number:enD[i].dialogue_number,

lines:[

{
language:"English",
speaker:enD[i].speaker_a,
text:enD[i].text_a
},

{
language:"English",
speaker:enD[i].speaker_b,
text:enD[i].text_b
},

{
language:"Sinhala",
speaker:siD[i]?.speaker_a||"",
text:siD[i]?.text_a||""
},

{
language:"Sinhala",
speaker:siD[i]?.speaker_b||"",
text:siD[i]?.text_b||""
},

{
language:"Tamil",
speaker:taD[i]?.speaker_a||"",
text:taD[i]?.text_a||""
},

{
language:"Tamil",
speaker:taD[i]?.speaker_b||"",
text:taD[i]?.text_b||""
}

]

});

}


let html="";


if(l.objectives){

html+=`

<div class="card"
style="margin:0 0 15px">

${esc(l.objectives)}

</div>

`;

}


html+=`

<div class="controls">

<select
id="languageSelect"
class="language-select"
onchange="changeLanguage()">

<option value="en">
English Only
</option>

<option value="ta">
English → Tamil
</option>

<option value="si">
English → Sinhala
</option>

</select>

<button
id="playBtn"
class="play"
onclick="playAll()">

▶️ Play All

</button>

<button
class="stop"
onclick="stopSpeech()">

⏹️ Stop

</button>

</div>

`;


html+=dialogues.map((d,i)=>`

<div
class="dialogue"
id="dialogue-${i}">

<div class="num">
DIALOGUE ${d.number}
</div>

${renderLines(d)}

</div>

`).join("");


html+=`

<button
class="complete"
onclick="completeLesson(${n})">

${completed.includes(n)
?"✓ Lesson Completed"
:"Mark Lesson Complete"}

</button>

`;


$("modalBody").innerHTML=html;


}catch(e){

console.error(e);


$("modalBody").innerHTML=

`<div class="error">
${esc(e.message||"Unable to load this lesson.")}
</div>`;

}

}


/* RENDER LINES */

function renderLines(d){

return d.lines.map(x=>{

const show=

selectedLanguage==="en"

?x.language==="English"

:selectedLanguage==="ta"

?x.language==="English"||
x.language==="Tamil"

:x.language==="English"||
x.language==="Sinhala";


return show&&x.text?

`

<div class="lang">
${x.language}
</div>

<div class="text">

<b>
${esc(x.speaker)}:
</b>

${esc(x.text)}

</div>

`

:"";

}).join("");

}


/* CHANGE LANGUAGE */

function changeLanguage(){

selectedLanguage=$("languageSelect").value;

stopSpeech();


dialogues.forEach((d,i)=>{

const box=$("dialogue-"+i);


if(box){

box.innerHTML=`

<div class="num">
DIALOGUE ${d.number}
</div>

${renderLines(d)}

`;

}

});

}


/* GET LESSON */

async function getLesson(n,language){

const r=await fetch(

`${API}/lesson?course=${COURSE}&lesson=${n}&language=${language}`,

{headers}

);


if(r.status===401){

logout();

throw Error("Login session expired.");

}


const text=await r.text();


let d;


try{

d=JSON.parse(text);

}catch{

throw Error(
`Lesson server error (${r.status})`
);

}


if(!r.ok||!d.success)

throw Error(
d.error||
d.message||
"Unable to load lesson."
);


return d;

}


/* PREMIUM BUTTON */

function resetPremiumButton(){

const btn=$("premiumBtn");


if(!btn)return;


if(premium){

btn.style.display="none";

return;

}


btn.style.display="block";

btn.disabled=false;

btn.textContent="GET PREMIUM";

}


window.addEventListener(
"pageshow",
resetPremiumButton
);


document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible")

resetPremiumButton();

});


/* PREMIUM CHECKOUT */

async function buyPremium(){

const btn=$("premiumBtn");


if(!btn||btn.disabled)return;


const currentToken=
localStorage.getItem("createlk_token");


if(!currentToken){

logout();

return;

}


btn.disabled=true;

btn.textContent="Connecting...";


try{

const r=await fetch(

`${PAY}/premium-checkout`,

{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":
"Bearer "+currentToken

},

body:"{}"

}

);


if(r.status===401){

logout();

return;

}


const text=await r.text();


let d;


try{

d=JSON.parse(text);

}catch{

throw Error(

"Payment server returned an invalid response ("+
r.status+
")."

);

}


if(!r.ok||!d.success)

throw Error(

d.message||
d.error||
`Checkout failed (${r.status})`

);


const fields=
d.fields||d.checkout;


if(!fields)

throw Error(
"Payment details are missing."
);


const form=
document.createElement("form");


form.method="POST";

form.action=
"https://www.payhere.lk/pay/checkout";

form.style.display="none";


Object.entries(fields).forEach(
([key,value])=>{

const input=
document.createElement("input");

input.type="hidden";

input.name=key;

input.value=value??"";

form.appendChild(input);

});


document.body.appendChild(form);

form.submit();


}catch(e){

console.error(
"CreateLK Premium Checkout:",
e
);


alert(
e.message||
"Payment could not be started."
);


resetPremiumButton();

}

}


/* SPEECH */

const voiceLang={

English:"en-US",

Sinhala:"si-LK",

Tamil:"ta-LK"

};


function playAll(){

stopSpeech();


playing=true;


if($("playBtn"))

$("playBtn").textContent=
"⏸️ Playing...";


let index=0;


function next(){

if(
!playing||
index>=dialogues.length
){

playing=false;


if($("playBtn"))

$("playBtn").textContent=
"▶️ Play All";


return;

}


const box=
$("dialogue-"+index);


document.querySelectorAll(
".dialogue"
).forEach(
x=>x.classList.remove("playing")
);


if(box){

box.classList.add("playing");


box.scrollIntoView({

behavior:"smooth",

block:"center"

});

}


const allowed=

selectedLanguage==="en"

?["English"]

:selectedLanguage==="ta"

?["English","Tamil"]

:["English","Sinhala"];


const lines=
dialogues[index].lines.filter(

x=>allowed.includes(x.language)

);


speakLines(lines,0,()=>{

index++;

next();

});

}


next();

}


function speakLines(lines,i,done){

if(
!playing||
i>=lines.length
){

done();

return;

}


const line=lines[i];


if(!line.text){

speakLines(
lines,
i+1,
done
);

return;

}


const u=
new SpeechSynthesisUtterance(
line.text
);


u.lang=
voiceLang[line.language];


u.rate=.88;


u.onend=()=>{

speakLines(
lines,
i+1,
done
);

};


u.onerror=()=>{

speakLines(
lines,
i+1,
done
);

};


speechSynthesis.speak(u);

}


/* STOP SPEECH */

function stopSpeech(){

playing=false;


speechSynthesis.cancel();


document.querySelectorAll(
".dialogue"
).forEach(
x=>x.classList.remove("playing")
);


if($("playBtn"))

$("playBtn").textContent=
"▶️ Play All";

}


/* COMPLETE LESSON */

async function completeLesson(n){

try{

const r=await fetch(

`${API}/lesson/complete`,

{

method:"POST",

headers,

body:JSON.stringify({

course:COURSE,

lesson_number:n

})

}

);


if(r.status===401){

logout();

return;

}


const d=await r.json();


if(!r.ok||!d.success)

throw Error(

d.error||
d.message||
"Unable to complete lesson."

);


if(!completed.includes(n))

completed.push(n);


closeLesson();


await loadLessons();


}catch(e){

alert(

e.message||
"Unable to complete lesson."

);

}

}


/* CLOSE LESSON */

function closeLesson(){

stopSpeech();

$("modalBg").style.display="none";

}


/* LOGOUT */

function logout(){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

sessionStorage.clear();


location.replace(
"/Aca/index.html"
);

}


/* ESCAPE HTML */

function esc(v){

return String(v??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* CLOSE MODAL ON BACKGROUND CLICK */

$("modalBg").onclick=e=>{

if(
e.target===
$("modalBg")
)

closeLesson();

};


/* INITIALIZE */

async function init(){

await loadLessons();

}


init();

</script>
