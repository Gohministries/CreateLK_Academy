<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f8fbff,#eef2ff,#fdf2f8);
color:#172033;
min-height:100vh
}

button,a{font-family:inherit}
button{cursor:pointer}

header{
background:linear-gradient(135deg,#172554,#2563eb,#7c3aed);
color:#fff;
padding:18px 14px;
box-shadow:0 5px 20px #2563eb25
}

.header{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.brand h1{font-size:22px}
.brand p{font-size:11px;margin-top:4px;opacity:.85}

.btn{
border:1px solid #2563eb;
background:#fff;
color:#1d4ed8;
border-radius:10px;
padding:9px 13px;
min-height:36px;
font-size:12px;
font-weight:800;
display:inline-flex;
align-items:center;
justify-content:center;
text-decoration:none
}

.btn.dark{
background:#ffffff18;
color:#fff;
border-color:#ffffff88
}

main{
max-width:900px;
margin:auto;
padding:20px 12px 45px
}

.welcome{text-align:center;margin-bottom:20px}
.welcome h2{
font-size:24px;
background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
-webkit-background-clip:text;
color:transparent
}
.welcome p{
font-size:12px;
color:#64748b;
margin-top:5px
}

/* GRAMMAR */

.grammar{
max-width:540px;
margin:auto auto 23px;
padding:18px;
text-align:center;
border-radius:18px;
background:linear-gradient(135deg,#fff,#f8f7ff);
border:1px solid #d8ddff;
box-shadow:0 10px 28px #4f46e51a
}

.grammar-label{
color:#6d28d9;
font-size:14px;
font-weight:800;
margin-bottom:7px
}

.grammar-title{
font-size:18px;
font-weight:800;
margin-bottom:5px
}

.grammar-desc{
font-size:12px;
line-height:1.5;
color:#64748b;
margin-bottom:12px
}

.grammar .btn{width:100%;max-width:240px}

/* LESSONS */

.section{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 2px 10px
}

.section h3{font-size:17px}
.count{font-size:11px;color:#64748b;font-weight:700}

.lessons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.lesson{
background:#fff;
border:1px solid #dce3f0;
border-left:4px solid #3b82f6;
border-radius:13px;
padding:12px;
min-height:76px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
box-shadow:0 4px 14px #1e293b0d
}

.lesson:nth-child(4n+2){border-left-color:#8b5cf6}
.lesson:nth-child(4n+3){border-left-color:#ec4899}
.lesson:nth-child(4n+4){border-left-color:#14b8a6}

.number{
font-size:9px;
font-weight:700;
color:#94a3b8;
margin-bottom:4px;
text-transform:uppercase
}

.title{
font-size:13px;
font-weight:800;
line-height:1.35
}

.lesson .btn{min-width:76px}

.free{
color:#15803d;
border-color:#86efac;
background:#f0fdf4
}

.premium{
color:#92400e;
border-color:#fbbf24;
background:#fffbeb
}

.message{
grid-column:1/-1;
text-align:center;
padding:30px;
font-size:13px;
color:#64748b
}

.error{color:#b91c1c}

/* MODAL */

.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:12px;
background:#0f172aaa;
z-index:100
}

.modal.show{display:flex}

.modal-box{
width:min(720px,100%);
max-height:92vh;
overflow:auto;
background:#fff;
border-radius:18px
}

.modal-head{
position:sticky;
top:0;
display:flex;
justify-content:space-between;
gap:10px;
padding:15px;
background:#f8faff;
border-bottom:1px solid #e5e7eb;
z-index:2
}

.modal-title{
font-size:19px;
font-weight:800;
line-height:1.35
}

.close{
width:34px;
height:34px;
border:1px solid #cbd5e1;
border-radius:9px;
background:#fff;
font-size:20px
}

.modal-body{
padding:16px;
font-size:14px;
line-height:1.7;
color:#334155
}

.meta{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:15px
}

.tag{
padding:4px 9px;
border-radius:20px;
background:#f8fafc;
border:1px solid #dbe4f5;
font-size:10px;
font-weight:700
}

.dialogue,.questions{margin-top:18px}

.dialogue h4,.questions h4{
font-size:15px;
color:#1e3a8a;
margin-bottom:9px
}

.dialogue-box,.question{
padding:11px;
border:1px solid #dbe4f5;
border-radius:11px;
margin-bottom:8px;
font-size:13px;
line-height:1.6
}

.question-title{font-weight:700;margin-bottom:6px}
.option{font-size:12px;color:#475569;margin:3px 0}

footer{
text-align:center;
padding:18px;
font-size:10px;
color:#94a3b8
}

@media(max-width:650px){
.header{gap:10px}
.brand h1{font-size:19px}
.brand p{font-size:10px}
.lessons{grid-template-columns:1fr}
main{padding:17px 10px 40px}
.welcome h2{font-size:21px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="brand">
<h1>CreateLK Academy</h1>
<p>Learn Skills. Build Your Future.</p>
</div>
<a class="btn dark" href="/Aca/login.html">Account</a>
</div>
</header>

<main>

<div class="welcome">
<h2>Spoken English</h2>
<p>Learn practical English through real-life conversations.</p>
</div>

<section class="grammar">
<div class="grammar-label">📘 Today's Grammar</div>
<div id="grammarTitle" class="grammar-title">Loading...</div>
<div id="grammarDesc" class="grammar-desc">Loading today's grammar lesson...</div>
<button id="grammarBtn" class="btn" onclick="openGrammar()" disabled>
Open Grammar
</button>
</section>

<div class="section">
<h3>100 Spoken English Lessons</h3>
<span id="count" class="count">Loading...</span>
</div>

<div id="lessons" class="lessons">
<div class="message">Loading lessons...</div>
</div>

</main>

<footer>© CreateLK Academy</footer>

<div id="modal" class="modal">
<div class="modal-box">

<div class="modal-head">
<div id="modalTitle" class="modal-title">Lesson</div>
<button class="close" onclick="closeModal()">×</button>
</div>

<div class="modal-body">
<div id="meta" class="meta"></div>
<div id="content">Loading...</div>
<div id="dialogues" class="dialogue"></div>
<div id="questions" class="questions"></div>
</div>

</div>
</div>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const TOKEN="createlk_token";

let lessons=[];
let grammar=null;

function headers(){
const h={"Content-Type":"application/json"};
const t=localStorage.getItem(TOKEN);
if(t)h.Authorization="Bearer "+t;
return h;
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function text(v){
return esc(v).replace(/\n/g,"<br>");
}

/* LESSONS */

async function loadLessons(){

try{

const r=await fetch(
API+"/lessons?course=spoken-english&language=en",
{headers:headers()}
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Unable to load lessons.");

lessons=d.lessons||[];

document.getElementById("count").textContent=
lessons.length+" lessons";

if(!lessons.length){
document.getElementById("lessons").innerHTML=
'<div class="message">No lessons available.</div>';
return;
}

document.getElementById("lessons").innerHTML=
lessons.map(l=>{

const n=Number(l.lesson_number);
const free=n===1||n===2;

return `
<div class="lesson">

<div>
<div class="number">Lesson ${n}</div>
<div class="title">
${esc(l.title||"Lesson "+n)}
${free?"":" 👑"}
</div>
</div>

<button
class="btn ${free?"free":"premium"}"
onclick="openLesson(${n})">
${free?"Free":"Premium"}
</button>

</div>`;
}).join("");

}catch(e){

document.getElementById("count").textContent="";

document.getElementById("lessons").innerHTML=
`<div class="message error">${esc(e.message)}</div>`;
}
}

/* OPEN LESSON */

async function openLesson(n){

const free=n===1||n===2;

if(!free&&!localStorage.getItem(TOKEN)){
location.href="/Aca/login.html";
return;
}

showModal();

const item=lessons.find(
x=>Number(x.lesson_number)===n
);

document.getElementById("modalTitle").textContent=
item?.title||"Lesson "+n;

document.getElementById("meta").innerHTML=
`<span class="tag">Lesson ${n}</span>
<span class="tag">${free?"Free":"Premium 👑"}</span>`;

document.getElementById("content").textContent="Loading...";
document.getElementById("dialogues").innerHTML="";
document.getElementById("questions").innerHTML="";

try{

const r=await fetch(
API+`/lesson?course=spoken-english&language=en&lesson=${n}`,
{headers:headers()}
);

const d=await r.json();

if(r.status===401){
location.href="/Aca/login.html";
return;
}

if(r.status===403&&d.premium_required){
showPremium();
return;
}

if(!r.ok||!d.success)
throw Error(d.error||"Unable to load lesson.");

renderLesson(d.lesson);

}catch(e){

document.getElementById("content").innerHTML=
`<div class="error">${esc(e.message)}</div>`;
}
}

/* RENDER */

function renderLesson(l){

document.getElementById("modalTitle").textContent=
l.title||"Lesson";

document.getElementById("meta").innerHTML=
[
l.duration?`⏱ ${esc(l.duration)}`:"",
l.language?esc(l.language).toUpperCase():""
].filter(Boolean)
.map(x=>`<span class="tag">${x}</span>`)
.join("");

let html="";

if(l.objectives)
html+=`<h3>Learning Objectives</h3><p>${text(l.objectives)}</p>`;

if(l.content)
html+=`<h3>Lesson</h3><p>${text(l.content)}</p>`;

if(l.key_points)
html+=`<h3>Key Points</h3><p>${text(l.key_points)}</p>`;

if(l.summary)
html+=`<h3>Summary</h3><p>${text(l.summary)}</p>`;

document.getElementById("content").innerHTML=
html||"This lesson is ready to learn.";

if(l.dialogues?.length){

document.getElementById("dialogues").innerHTML=
`<h4>💬 Practice Dialogue</h4>`+
l.dialogues.map(d=>`
<div class="dialogue-box">
<b>${esc(d.speaker_a||"Speaker A")}</b><br>
${esc(d.text_a||"")}<br><br>
<b>${esc(d.speaker_b||"Speaker B")}</b><br>
${esc(d.text_b||"")}
</div>`).join("");
}

if(l.questions?.length){

document.getElementById("questions").innerHTML=
`<h4>📝 Practice Questions</h4>`+
l.questions.map((q,i)=>`
<div class="question">
<div class="question-title">
${i+1}. ${esc(q.question||"")}
</div>
${q.option_a?`<div class="option">A. ${esc(q.option_a)}</div>`:""}
${q.option_b?`<div class="option">B. ${esc(q.option_b)}</div>`:""}
${q.option_c?`<div class="option">C. ${esc(q.option_c)}</div>`:""}
${q.option_d?`<div class="option">D. ${esc(q.option_d)}</div>`:""}
</div>`).join("");
}
}

/* PREMIUM */

function showPremium(){

document.getElementById("content").innerHTML=`
<div style="text-align:center;padding:25px 5px">
<div style="font-size:38px">👑</div>
<h3>Premium Lesson</h3>
<p style="margin:8px 0 15px;color:#64748b">
This lesson is available with CreateLK Academy Premium.
</p>
<button class="btn premium" onclick="location.href='/Aca/login.html'">
Get Premium
</button>
</div>`;
}

/* MODAL */

function showModal(){
document.getElementById("modal").classList.add("show");
}

function closeModal(){
document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").onclick=e=>{
if(e.target.id==="modal")closeModal();
};

/* GRAMMAR */

async function loadGrammar(){

try{

const r=await fetch(
API+"/grammar/today",
{headers:headers()}
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error();

grammar=d.lesson;

document.getElementById("grammarTitle").textContent=
grammar.title||"Today's Grammar";

document.getElementById("grammarDesc").textContent=
grammar.description||"Improve your English grammar today.";

document.getElementById("grammarBtn").disabled=false;

}catch{

document.getElementById("grammarTitle").textContent=
"Today's Grammar";

document.getElementById("grammarDesc").textContent=
"Grammar lesson will be available soon.";
}
}

function openGrammar(){

if(!grammar)return;

showModal();

document.getElementById("modalTitle").textContent=
"📘 "+grammar.title;

document.getElementById("meta").innerHTML=
'<span class="tag">Today\'s Grammar</span>';

document.getElementById("content").innerHTML=
`<h3>${esc(grammar.title)}</h3>
<p>${text(grammar.description||"")}</p>`;

document.getElementById("dialogues").innerHTML="";
document.getElementById("questions").innerHTML="";
}

loadLessons();
loadGrammar();

</script>

</body>
</html>
