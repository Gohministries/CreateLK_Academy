<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:Arial;background:#f5f7fb;color:#172033}
button,select{font:inherit;cursor:pointer}header{background:#172554;color:white;padding:16px 20px}
.head,.wrap{max-width:1050px;margin:auto}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:21px;font-weight:bold}.logo b{color:#fbbf24}.logout{background:#ffffff20;color:white;border:0;padding:9px 13px;border-radius:9px}
.wrap{padding:25px 15px 50px}.hero{padding:30px;border-radius:22px;color:white;background:linear-gradient(135deg,#1d4ed8,#4f46e5)}
.hero h1{font-size:30px;margin:8px 0}.hero p{line-height:1.6;opacity:.9}.badge{display:inline-block;margin-top:14px;background:#ffffff20;padding:7px 12px;border-radius:20px;font-size:13px}
.card{background:white;padding:20px;border-radius:17px;margin-top:18px;box-shadow:0 5px 20px #0001}
.price{font-size:18px;margin-top:5px}.status{font-size:13px;color:#64748b;margin-top:5px}.active{color:#16a34a;font-weight:bold}
.premium,.open,.complete{background:#2563eb;color:white;border:0;padding:10px 14px;border-radius:9px;font-weight:bold}.premium{background:#f59e0b}
.progress{height:10px;background:#e5e7eb;border-radius:20px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb}
.section{margin:30px 0 15px}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.lesson{background:white;padding:17px;border-radius:16px;border:1px solid #e5e7eb}.lesson h3{margin:8px 0}.lesson p{font-size:13px;color:#64748b;line-height:1.5;min-height:38px}
.num{font-size:11px;color:#2563eb;font-weight:bold}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.free{font-size:11px;color:#16a34a;font-weight:bold}.lock{background:#e5e7eb;color:#64748b;border:0;padding:9px 13px;border-radius:9px}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;padding:15px;overflow:auto;z-index:5}.modal{max-width:820px;margin:25px auto;background:#f8fafc;border-radius:20px;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:white;padding:22px;position:relative}.modal-head h2{margin-top:5px}.close{position:absolute;right:15px;top:12px;background:#ffffff20;color:white;border:0;font-size:22px;border-radius:8px;padding:3px 10px}
.modal-body{padding:20px}.objective,.practice{background:white;padding:15px;border-radius:14px;margin-bottom:15px;line-height:1.6}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:15px;position:sticky;top:0;background:#f8fafc;padding-bottom:8px;z-index:2}
select,.play,.stop{border:1px solid #dbe2ea;border-radius:9px;padding:10px;background:white}.play{background:#1e3a8a;color:white}.stop{background:#dc2626;color:white;border:0}
.dialogue{background:white;padding:16px;border:1px solid #e5e7eb;border-radius:16px;margin:13px 0}.dialogue.playing{border-color:#2563eb}
.speaker{font-size:12px;font-weight:bold;color:#475569;margin-bottom:5px}.line{padding:11px;margin:8px 0;background:#f8fafc;border-radius:11px;border-left:4px solid #2563eb}.line.female{border-color:#db2777}
.text{font-size:16px;line-height:1.6}.listen{margin-top:7px;border:0;background:#eef2ff;color:#3730a3;padding:6px 9px;border-radius:7px;font-size:12px}
.practice{background:#eff6ff}.complete{width:100%;margin-top:15px;padding:13px}.loading{text-align:center;padding:30px;color:#64748b}.error{text-align:center;padding:30px;color:#dc2626}
@media(max-width:750px){.lessons{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.lessons{grid-template-columns:1fr}.hero{padding:24px 20px}.hero h1{font-size:26px}.row{align-items:flex-start}.premium{width:100%}.controls{grid-template-columns:1fr 1fr}.controls select:first-child{grid-column:1/-1}.modal-bg{padding:0}.modal{margin:0;min-height:100vh;border-radius:0}.modal-body{padding:15px}}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("createlk_token"))
  location.replace("/Aca/login.html");
</script>

<header>
<div class="head">
<div class="logo">CreateLK <b>Academy</b></div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<small>ONLINE COURSE</small>
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<span class="badge">100 Lessons • 1,000 Practical Dialogues</span>
</section>

<section class="card">
<div class="row">
<div>
<b>👑 Premium Membership</b>
<div class="price">LKR 999 <span class="status">• 30 Days</span></div>
<div id="premiumStatus" class="status">Checking...</div>
</div>
<button id="premiumBtn" class="premium" onclick="buyPremium()">GET PREMIUM</button>
</div>
</section>

<section class="card">
<div class="row"><b>Your Progress</b><b id="progressText">0 of 100</b></div>
<div class="progress"><div id="fill" class="fill"></div></div>
</section>

<h2 class="section">100 Spoken English Lessons</h2>
<div id="lessons"><div class="loading">Loading...</div></div>

</main>

<div id="modalBg" class="modal-bg">
<div class="modal">
<div class="modal-head">
<button class="close" onclick="closeLesson()">×</button>
<small id="modalNum"></small>
<h2 id="modalTitle"></h2>
</div>
<div id="modalBody" class="modal-body"></div>
</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev",
PAY="https://createlk-payhere.createlk.workers.dev",
COURSE="spoken-english",
TOKEN=localStorage.getItem("createlk_token"),
HEAD={"Content-Type":"application/json","Authorization":"Bearer "+TOKEN};

let premium=false,completed=[],data=[],lang="en",rate=.88,voices=[],playing=false;
const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function api(url,opt={}){
  const r=await fetch(API+url,{...opt,headers:HEAD});
  const d=await r.json();
  if(!r.ok||d.success===false)throw Error(d.error||"Request failed");
  return d;
}

function loadVoices(){
  voices=speechSynthesis.getVoices();
}
if("speechSynthesis"in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}

function voice(g,l){
  const c={en:"en",ta:"ta",si:"si"}[l],
  a=voices.filter(v=>v.lang?.toLowerCase().startsWith(c));
  if(!a.length)return null;
  const words=g==="female"?["female","woman","sarah","samantha"]:["male","man","david","daniel"];
  return a.find(v=>words.some(x=>v.name.toLowerCase().includes(x)))||a[0];
}

function speak(text,l,g){
  return new Promise(done=>{
    if(!text||!speechSynthesis)return done();
    const u=new SpeechSynthesisUtterance(text);
    u.lang={en:"en-US",ta:"ta-LK",si:"si-LK"}[l];
    u.rate=rate;u.pitch=g==="female"?1.05:.92;
    const v=voice(g,l);if(v)u.voice=v;
    u.onend=u.onerror=done;speechSynthesis.speak(u);
  });
}

function gender(name,fallback){
  const n=String(name||"").toLowerCase().replace(/\./g,"");
  if(/^(john|david|james|michael|daniel|robert|william|thomas|richard|joseph|alex|mark|peter|paul|sam|tom|adam|jack|teacher|mr)$/.test(n))return"male";
  if(/^(sarah|mary|anna|maria|jane|julia|emma|olivia|sophia|emily|alice|linda|jessica|laura|amy|lisa|karen|helen|mother|mom|sister|wife|ms|mrs|miss)$/.test(n))return"female";
  return fallback;
}

async function load(){
  try{
    const d=await api(`/lessons?course=${COURSE}&language=en`);
    premium=!!d.premium;
    $("premiumStatus").innerHTML=premium?'<span class="active">✓ Premium Active</span>':"Premium not active";
    $("premiumBtn").style.display=premium?"none":"block";
    const list=d.lessons||[];
    $("lessons").innerHTML=list.map((x,i)=>{
      const n=+(x.lesson_number||i+1),free=n===1||+x.is_free===1,open=free||premium,done=completed.includes(n);
      return `<article class="lesson"><div class="num">LESSON ${n}</div>
      <h3>${esc(x.title||"Lesson "+n)}</h3>
      <p>${esc(x.summary||x.objectives||"Practical English conversation")}</p>
      <div class="bottom"><span class="free">${done?"✓ COMPLETED":free?"FREE":"PREMIUM"}</span>
      <button class="${open?"open":"lock"}" onclick="${open?`openLesson(${n})`:"buyPremium()"}">${open?"Open":"🔒 Locked"}</button></div></article>`;
    }).join("");
  }catch(e){$("lessons").innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

async function progress(){
  try{
    const d=await api(`/progress?course=${COURSE}`);
    completed=(d.completed||[]).map(x=>+(x.lesson_number??x.lesson??x));
    $("progressText").textContent=`${completed.length} of 100`;
    $("fill").style.width=Math.min(completed.length,100)+"%";
  }catch(e){}
}

async function openLesson(n){
  stop();
  $("modalBg").style.display="block";
  $("modalNum").textContent="LESSON "+n;
  $("modalTitle").textContent="Loading...";
  $("modalBody").innerHTML='<div class="loading">Loading lesson...</div>';

  try{
    const e=await api(`/lesson?course=${COURSE}&lesson=${n}&language=en`);
    const l=e.lesson;
    $("modalTitle").textContent=l.title;
    data=l.dialogues||[];
    render(l,n);
  }catch(e){$("modalBody").innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

function render(l,n){
  $("modalBody").innerHTML=`
  ${l.objectives?`<div class="objective"><b>🎯 Today's Goal</b><br>${esc(l.objectives)}</div>`:""}
  <div class="controls">
  <select id="language" onchange="changeLang()">
  <option value="en">English Only</option>
  <option value="ta">English + Tamil</option>
  <option value="si">English + Sinhala</option>
  </select>
  <select onchange="rate=+this.value">
  <option value=".72">🐢 Slow</option><option value=".88" selected>🔊 Natural</option><option value="1">⚡ Normal</option>
  </select>
  <button class="play" onclick="playAll()">▶️ Play All</button>
  <button class="stop" onclick="stop()">⏹ Stop</button>
  </div>
  <div id="dialogues">${data.map((d,i)=>box(d,i)).join("")}</div>
  <div class="practice"><b>🗣 Practice Speaking</b><br><small>Listen first, then repeat the sentences aloud.</small></div>
  <button class="complete" onclick="completeLesson(${n})">✓ Complete Lesson</button>`;
}

function box(d,i){
  const a=d.speaker_a||"Speaker A",b=d.speaker_b||"Speaker B";
  return `<div class="dialogue" id="d${i}">
  <div class="row"><small>DIALOGUE ${i+1}</small><button class="listen" onclick="playDialogue(${i})">▶ Play</button></div>
  ${line(a,d.text_a,"male",i,0)}${line(b,d.text_b,"female",i,1)}
  <div id="x${i}"></div></div>`;
}

function line(s,t,g,d,i){
  return `<div class="line ${g}"><div class="speaker">${g==="female"?"👩":"👨"} ${esc(s)}</div>
  <div class="text">${esc(t)}</div><button class="listen" onclick="playLine(${d},${i})">🔊 Listen</button></div>`;
}

async function changeLang(){
  lang=$("language").value;
  if(lang==="en"){
    $("dialogues").innerHTML=data.map((d,i)=>box(d,i)).join("");
    return;
  }

  try{
    const d=await api(`/lesson?course=${COURSE}&lesson=${$("modalNum").textContent.split(" ")[1]}&language=${lang}`);
    const tr=d.lesson?.dialogues||[];
    data.forEach((x,i)=>{
      const t=tr[i];
      if(t)$("x"+i).innerHTML=line(t.speaker_a||x.speaker_a,t.text_a,"male",i,2)+line(t.speaker_b||x.speaker_b,t.text_b,"female",i,3);
    });
  }catch(e){}
}

function stop(){
  playing=false;
  if("speechSynthesis"in window)speechSynthesis.cancel();
  document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));
}

async function playLine(d,i){
  stop();
  const x=data[d],l=i<2?{s:i?x.speaker_b:x.speaker_a,t:i?x.text_b:x.text_a,g:i?"female":"male",lang:"en"}:null;
  if(l)await speak(l.t,l.lang,l.g);
}

async function playDialogue(i){
  stop();playing=true;
  const x=data[i],items=[
    [x.speaker_a,x.text_a,"male","en"],
    [x.speaker_b,x.text_b,"female","en"]
  ];
  if(lang!=="en"){
    try{
      const d=await api(`/lesson?course=${COURSE}&lesson=${$("modalNum").textContent.split(" ")[1]}&language=${lang}`);
      const t=d.lesson?.dialogues?.[i];
      if(t)items.push([t.speaker_a,t.text_a,"male",lang],[t.speaker_b,t.text_b,"female",lang]);
    }catch(e){}
  }
  $(`d${i}`)?.classList.add("playing");
  for(const x of items)if(playing)await speak(x[1],x[3],x[2]);
  $(`d${i}`)?.classList.remove("playing");playing=false;
}

async function playAll(){
  stop();playing=true;
  for(let i=0;i<data.length&&playing;i++)await playDialogue(i);
  playing=false;
}

async function completeLesson(n){
  try{
    await api("/lesson/complete",{method:"POST",body:JSON.stringify({course:COURSE,lesson:n})});
    if(!completed.includes(n))completed.push(n);
    $("progressText").textContent=`${completed.length} of 100`;
    $("fill").style.width=Math.min(completed.length,100)+"%";
    closeLesson();load();
  }catch(e){alert(e.message)}
}

async function buyPremium(){
  const b=$("premiumBtn");b.disabled=true;b.textContent="Processing...";
  try{
    const r=await fetch(`${PAY}/premium-checkout`,{
      method:"POST",headers:HEAD,
      body:JSON.stringify({amount:999,course:COURSE})
    });
    const d=await r.json();
    if(!r.ok||!d.success)throw Error(d.error||"Payment setup failed");
    const f=document.createElement("form");
    f.method="POST";f.action="https://www.payhere.lk/pay/checkout";
    Object.entries(d.payment||{}).forEach(([k,v])=>{
      const i=document.createElement("input");
      i.type="hidden";i.name=k;i.value=v;f.appendChild(i);
    });
    document.body.appendChild(f);f.submit();
  }catch(e){alert(e.message);b.disabled=false;b.textContent="GET PREMIUM"}
}

function closeLesson(){stop();$("modalBg").style.display="none"}
function logout(){localStorage.removeItem("createlk_token");location.replace("/Aca/login.html")}
$("modalBg").onclick=e=>{if(e.target===$("modalBg"))closeLesson()};

progress();
load();
</script>
</body>
</html>
