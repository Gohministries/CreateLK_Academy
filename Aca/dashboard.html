<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#f8faff,#eef3ff);color:#172033}
header{background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);color:#fff;padding:17px 20px;box-shadow:0 4px 18px #0f172a30}
.head,.wrap{max-width:1050px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}.logo b{color:#fbbf24}
button{cursor:pointer;font-weight:bold}
.logout{background:#ffffff18;color:#fff;border:1px solid #ffffff30;padding:9px 14px;border-radius:10px}
.wrap{padding:25px 15px 55px}

.hero{position:relative;overflow:hidden;padding:34px 28px;border-radius:25px;color:#fff;background:radial-gradient(circle at 90% 15%,#818cf855 0 15%,transparent 35%),linear-gradient(135deg,#1d4ed8,#4338ca 55%,#312e81);box-shadow:0 14px 35px #312e8140}
.hero h1{font-size:34px;margin:9px 0 10px}.hero p{line-height:1.65;max-width:650px;opacity:.92}
.hero small{font-weight:bold;letter-spacing:1.5px;opacity:.85}
.badge{display:inline-block;margin-top:18px;background:#ffffff18;border:1px solid #ffffff30;padding:8px 14px;border-radius:30px;font-size:13px;font-weight:bold}

.card{background:#fff;padding:21px;border-radius:20px;margin-top:19px;box-shadow:0 7px 25px #1e3a8a12;border:1px solid #e2e8f0}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px}
.premium-card{background:linear-gradient(135deg,#fffdf5,#fff7df);border-color:#f5d77a}
.premium-title{font-size:18px;font-weight:800;color:#92400e}
.price{font-size:19px;font-weight:800;margin-top:6px}
.status{color:#64748b;font-size:13px;margin-top:5px}.active{color:#15803d;font-weight:bold}
.premium{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:12px 20px;border:0;border-radius:11px;box-shadow:0 5px 14px #d9770638}
.premium:disabled{opacity:.6;cursor:wait}

.certificate{text-align:center}
.certificate-btn{width:100%;max-width:320px;background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;border:0;padding:13px 18px;border-radius:11px;box-shadow:0 5px 14px #2563eb30}

.section{margin:32px 0 16px;font-size:23px;color:#172554}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.lesson{background:linear-gradient(145deg,#fff,#f8faff);padding:20px 17px;border-radius:18px;border:1px solid #dbe4f0;position:relative;overflow:hidden;transition:.2s}
.lesson:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#2563eb,#7c3aed)}
.lesson:hover{transform:translateY(-3px);border-color:#93c5fd;box-shadow:0 10px 25px #2563eb18}
.num{font-size:11px;font-weight:800;color:#2563eb;letter-spacing:.8px}
.lesson h3{font-size:16px;line-height:1.4;margin-top:8px}
.lesson p{font-size:13px;color:#64748b;line-height:1.5;margin-top:7px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.open,.complete{background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;border:0;padding:9px 14px;border-radius:9px}
.lock{background:#eef2f7;color:#64748b;border:0;padding:9px 13px;border-radius:9px}
.free{color:#16a34a;font-weight:bold;font-size:11px}

.modal-bg{display:none;position:fixed;inset:0;background:#0f172acc;backdrop-filter:blur(5px);padding:15px;overflow:auto;z-index:10}
.modal{background:#fff;max-width:760px;margin:25px auto;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0005}
.modal-head{background:linear-gradient(135deg,#1e3a8a,#4338ca);color:#fff;padding:24px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#ffffff20;color:#fff;border:1px solid #ffffff30;font-size:22px;border-radius:9px;padding:4px 10px}
.modal-body{padding:20px}
.controls{display:flex;gap:10px;margin-bottom:18px}
.play,.stop,.language-select{flex:1;border:0;padding:12px;border-radius:10px;font-weight:bold}
.play{background:#1e3a8a;color:#fff}.stop{background:#dc2626;color:#fff}
.language-select{border:1px solid #dbe4f0;background:#f8faff;color:#172033}
.dialogue{padding:17px;margin:12px 0;border:1px solid #e2e8f0;border-radius:15px;background:#fbfdff}
.dialogue.playing{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.lang{font-size:11px;font-weight:bold;color:#2563eb;margin-top:12px}
.text{margin-top:4px;line-height:1.55}
.complete{width:100%;margin-top:15px;padding:12px}
.loading{text-align:center;padding:35px;color:#64748b}
.error{text-align:center;padding:30px;color:#dc2626}

@media(max-width:750px){.lessons{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:29px}}
@media(max-width:520px){
header{padding:15px}.logo{font-size:19px}.wrap{padding:18px 12px 40px}
.hero{padding:27px 21px;border-radius:21px}.hero h1{font-size:26px}
.row{align-items:stretch;flex-direction:column}.premium{width:100%}
.lessons{grid-template-columns:1fr;gap:12px}.lesson{padding:18px}
.controls{position:sticky;top:0;background:#fff;padding-bottom:8px;z-index:2;flex-wrap:wrap}
.language-select{width:100%;flex:none}.play,.stop{min-width:0}
}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("createlk_token")){
document.documentElement.style.display="none";
location.replace("/Aca/login.html");
}
</script>

<header>
<div class="head">
<div class="logo">CreateLK <b>Academy</b></div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<small>ONLINE COURSE</small>
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<span class="badge">100 Lessons • 1,000 Practical Dialogues</span>
</section>

<section class="card premium-card">
<div class="row">
<div>
<div class="premium-title">👑 Premium Membership</div>
<div class="price">LKR 999 <span class="status">• 30 Days</span></div>
<div id="premiumStatus" class="status">Checking...</div>
</div>
<button id="premiumBtn" class="premium" onclick="buyPremium()">GET PREMIUM 👑</button>
</div>
</section>

<section class="card certificate">
<button class="certificate-btn" onclick="location.href='/Aca/certificate.html'">
🎓 GET YOUR CERTIFICATE
</button>
</section>

<h2 class="section">100 Spoken English Lessons</h2>
<div id="lessons"><div class="loading">Loading...</div></div>

</main>

<div id="modalBg" class="modal-bg">
<div class="modal">

<div class="modal-head">
<button class="close" onclick="closeLesson()">×</button>
<small id="modalNum">LESSON</small>
<h2 id="modalTitle">Loading...</h2>
</div>

<div id="modalBody" class="modal-body">
<div class="loading">Loading lesson...</div>
</div>

</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";
const COURSE="spoken-english";
const token=localStorage.getItem("createlk_token");
const headers={"Content-Type":"application/json","Authorization":"Bearer "+token};

let premium=false,completed=[],dialogues=[],playing=false,selectedLanguage="en";

const $=id=>document.getElementById(id);

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities","Talking About Your Job",
"Talking About School","Talking About Friends","Asking for Personal Information",
"Meeting Someone New","Making a Phone Call","Sending a Message","Talking About the Time",
"Talking About the Date","Making Plans","Weekend Plans","Invitations","Accepting an Invitation",
"Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu","Paying the Bill",
"At a Café","Buying Groceries","At a Supermarket","Shopping for Clothes","Asking the Price",
"Returning an Item","At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions",
"Finding a Place","At the Train Station","Buying a Ticket","At the Airport",
"Checking Into a Hotel","Hotel Problems","Talking About Weather","Talking About Hobbies",
"Sports and Games","Music","Movies and TV","Reading Books","Weekend Activities","Holidays",
"Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms","At the Pharmacy",
"Healthy Habits","Exercise and Fitness","Asking for Help","Offering Help","Giving Advice",
"Asking for Permission","Saying Sorry","Thanking Someone","Compliments",
"Agreeing and Disagreeing","Expressing Opinions","Making Suggestions","Making Decisions",
"Solving a Problem","Making a Complaint","Apologizing Professionally","Workplace Conversations",
"Job Interviews","Talking With a Customer","Talking With a Manager","Making an Appointment",
"Office Phone Calls","Meetings","Giving Instructions","Asking Questions at Work",
"Discussing a Project","Talking About Money","Banking","Using an ATM","Online Shopping",
"Using the Internet","Social Media Conversations","Learning English","Practicing English",
"Common English Mistakes","Understanding Fast English","Everyday Expressions",
"Making Conversation","Keeping a Conversation Going","Speaking Politely",
"Speaking Confidently","Natural English","Travel Conversations","Emergency Conversations",
"Real-Life Situations","Advanced Everyday Conversations","Speaking English Confidently"
];

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function loadLessons(){
try{
const r=await fetch(`${API}/lessons?course=${COURSE}&language=en`,{headers});
if(r.status===401)return logout();

const d=await r.json();
if(!r.ok||!d.success)throw Error(d.error||d.message||"Unable to load lessons.");

premium=!!d.premium;
$("premiumStatus").innerHTML=premium?'<span class="active">✓ Premium Active</span>':"Premium not active";
$("premiumBtn").style.display=premium?"none":"block";

const list=Array.isArray(d.lessons)?d.lessons:Array.isArray(d.data)?d.data:[];
$("lessons").className="lessons";

$("lessons").innerHTML=titles.map((title,i)=>{
const n=i+1;
const a=list.find(x=>Number(x.lesson_number??x.lesson)===n);
const free=n===1||Number(a?.is_free)===1||a?.is_free===true;
const unlocked=free||premium;
const done=completed.includes(n);

return `
<article class="lesson">
<div class="num">LESSON ${n}</div>
<h3>${esc(a?.title||title)}</h3>
<p>${esc(a?.summary||a?.objectives||"Practical English conversation")}</p>
<div class="bottom">
<span class="free">${done?"✓ COMPLETED":free?"FREE":"PREMIUM"}</span>
<button class="${unlocked?"open":"lock"}" onclick="${unlocked?`openLesson(${n})`:"buyPremium()"}">
${unlocked?"Open":"🔒 Locked"}
</button>
</div>
</article>`;
}).join("");

}catch(e){
$("lessons").innerHTML=`<div class="error">${esc(e.message||"Unable to load lessons.")}</div>`;
}
}

async function getLesson(n,language){
const r=await fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=${language}`,{headers});
if(r.status===401){logout();throw Error("Login session expired.");}

const text=await r.text();
let d;
try{d=JSON.parse(text)}catch{throw Error(`Lesson server error (${r.status})`)}

if(!r.ok||!d.success)throw Error(d.error||d.message||"Unable to load lesson.");
return d;
}

async function openLesson(n){
stopSpeech();
selectedLanguage="en";
$("modalBg").style.display="block";
$("modalNum").textContent="LESSON "+n;
$("modalTitle").textContent="Loading...";
$("modalBody").innerHTML='<div class="loading">Loading lesson...</div>';

try{
const [en,si,ta]=await Promise.all([getLesson(n,"en"),getLesson(n,"si"),getLesson(n,"ta")]);
const l=en.lesson;
if(!l)throw Error("Lesson data not found.");

$("modalTitle").textContent=l.title;
dialogues=(l.dialogues||[]).map((x,i)=>({
number:x.dialogue_number||i+1,
lines:[
{language:"English",speaker:x.speaker_a,text:x.text_a},
{language:"English",speaker:x.speaker_b,text:x.text_b},
{language:"Sinhala",speaker:si.lesson?.dialogues?.[i]?.speaker_a,text:si.lesson?.dialogues?.[i]?.text_a},
{language:"Sinhala",speaker:si.lesson?.dialogues?.[i]?.speaker_b,text:si.lesson?.dialogues?.[i]?.text_b},
{language:"Tamil",speaker:ta.lesson?.dialogues?.[i]?.speaker_a,text:ta.lesson?.dialogues?.[i]?.text_a},
{language:"Tamil",speaker:ta.lesson?.dialogues?.[i]?.speaker_b,text:ta.lesson?.dialogues?.[i]?.text_b}
]}));

let html=l.objectives?`<div class="card" style="margin:0 0 15px">${esc(l.objectives)}</div>`:"";

html+=`
<div class="controls">
<select id="languageSelect" class="language-select" onchange="changeLanguage()">
<option value="en">English Only</option>
<option value="ta">English → Tamil</option>
<option value="si">English → Sinhala</option>
</select>
<button id="playBtn" class="play" onclick="playAll()">▶️ Play All</button>
<button class="stop" onclick="stopSpeech()">⏹️ Stop</button>
</div>`;

html+=dialogues.map((d,i)=>`
<div class="dialogue" id="dialogue-${i}">
<div class="num">DIALOGUE ${esc(d.number)}</div>
${renderLines(d)}
</div>`).join("");

html+=`<button class="complete" onclick="completeLesson(${n})">
${completed.includes(n)?"✓ Lesson Completed":"Mark Lesson Complete"}
</button>`;

$("modalBody").innerHTML=html;

}catch(e){
$("modalBody").innerHTML=`<div class="error">${esc(e.message||"Unable to load this lesson.")}</div>`;
}
}

function allowedLanguages(){
return selectedLanguage==="en"?["English"]:selectedLanguage==="ta"?["English","Tamil"]:["English","Sinhala"];
}

function renderLines(d){
const allowed=allowedLanguages();
return d.lines.filter(x=>allowed.includes(x.language)&&x.text).map(x=>`
<div class="lang">${esc(x.language)}</div>
<div class="text"><b>${esc(x.speaker)}:</b> ${esc(x.text)}</div>
`).join("");
}

function changeLanguage(){
selectedLanguage=$("languageSelect").value;
stopSpeech();
dialogues.forEach((d,i)=>{
const box=$("dialogue-"+i);
if(box)box.innerHTML=`<div class="num">DIALOGUE ${esc(d.number)}</div>${renderLines(d)}`;
});
}

async function buyPremium(){
const btn=$("premiumBtn");
btn.disabled=true;
btn.textContent="Connecting...";

try{
const t=localStorage.getItem("createlk_token");
if(!t)throw Error("Your login session has expired. Please login again.");

const r=await fetch(`${PAY}/premium-checkout`,{
method:"POST",
headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},
body:"{}"
});

const text=await r.text();
let d;
try{d=JSON.parse(text)}catch{throw Error(`Payment server returned an invalid response (${r.status}).`)}

if(r.status===401)return logout();
if(!r.ok||d.success===false)throw Error(d.error||d.message||`Checkout failed (${r.status})`);

const fields=d.fields||d.checkout||d;
const required=["merchant_id","return_url","cancel_url","notify_url","order_id","items","currency","amount","first_name","last_name","email","phone","address","city","country","hash"];
const missing=required.filter(k=>!String(fields[k]??"").trim());

if(missing.length)throw Error("Payment details are incomplete. Missing: "+missing.join(", "));

const form=document.createElement("form");
form.method="POST";
form.action="https://www.payhere.lk/pay/checkout";
form.style.display="none";

Object.entries(fields).forEach(([k,v])=>{
if(v!=null){
const input=document.createElement("input");
input.type="hidden";
input.name=k;
input.value=String(v);
form.appendChild(input);
}
});

document.body.appendChild(form);
form.submit();

}catch(e){
alert(e.message||"Payment could not be started.");
btn.disabled=false;
btn.textContent="GET PREMIUM 👑";
}
}

const voiceLang={English:"en-US",Sinhala:"si-LK",Tamil:"ta-LK"};

function playAll(){
stopSpeech();
if(!dialogues.length)return;

playing=true;
$("playBtn").textContent="⏸️ Playing...";
let i=0;

function next(){
if(!playing||i>=dialogues.length){
stopSpeech();
return;
}

document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));
const box=$("dialogue-"+i);
if(box){
box.classList.add("playing");
box.scrollIntoView({behavior:"smooth",block:"center"});
}

speakLines(dialogues[i].lines.filter(x=>allowedLanguages().includes(x.language)),0,()=>{
i++;
next();
});
}

next();
}

function speakLines(lines,i,done){
if(!playing||i>=lines.length)return done();

const u=new SpeechSynthesisUtterance(lines[i].text);
u.lang=voiceLang[lines[i].language];
u.rate=.88;
u.onend=()=>speakLines(lines,i+1,done);
u.onerror=()=>speakLines(lines,i+1,done);
speechSynthesis.speak(u);
}

function stopSpeech(){
playing=false;
speechSynthesis.cancel();
document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));
if($("playBtn"))$("playBtn").textContent="▶️ Play All";
}

function closeLesson(){
stopSpeech();
$("modalBg").style.display="none";
}

function completeLesson(n){
if(!completed.includes(n))completed.push(n);
alert("Lesson "+n+" completed!");
closeLesson();
loadLessons();
}

function logout(){
localStorage.removeItem("createlk_token");
location.replace("/Aca/login.html");
}

$("modalBg").addEventListener("click",e=>{
if(e.target===$("modalBg"))closeLesson();
});

loadLessons();
</script>

</body>
</html>
