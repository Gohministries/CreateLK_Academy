<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f7f9ff,#eef2ff);
  color:#172033;
  min-height:100vh;
}

button{
  font:700 13px Arial,sans-serif;
  cursor:pointer;
}

header{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:white;
  padding:20px 16px;
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand h1{
  font-size:22px;
  margin-bottom:5px;
}

.brand p{
  font-size:12px;
  opacity:.82;
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid #2563eb;
  background:white;
  color:#1d4ed8;
  border-radius:9px;
  padding:9px 13px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
}

.btn:hover{
  background:#eff6ff;
}

.btn.dark{
  border-color:#93c5fd;
  background:transparent;
  color:white;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px 14px 50px;
}

.welcome{
  text-align:center;
  margin:8px 0 18px;
}

.welcome h2{
  font-size:23px;
  margin-bottom:5px;
}

.welcome p{
  color:#64748b;
  font-size:13px;
}

/* TODAY GRAMMAR */

.grammar-card{
  max-width:520px;
  margin:0 auto 22px;
  background:white;
  border:1px solid #dbe4f5;
  border-radius:16px;
  padding:17px;
  box-shadow:0 6px 20px rgba(30,58,138,.07);
  text-align:center;
}

.grammar-label{
  color:#1d4ed8;
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}

.grammar-title{
  font-size:18px;
  font-weight:800;
  color:#172033;
  margin-bottom:5px;
}

.grammar-description{
  color:#64748b;
  font-size:12px;
  line-height:1.5;
  margin-bottom:12px;
}

.grammar-btn{
  width:100%;
}

/* COURSE */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:20px 0 10px;
}

.section-head h3{
  font-size:18px;
}

.count{
  color:#64748b;
  font-size:12px;
}

.lessons{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.lesson-card{
  background:white;
  border:1px solid #dbe4f5;
  border-radius:13px;
  padding:13px;
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 3px 12px rgba(30,58,138,.045);
}

.lesson-info{
  min-width:0;
}

.lesson-number{
  font-size:11px;
  color:#64748b;
  margin-bottom:4px;
}

.lesson-title{
  font-size:14px;
  font-weight:800;
  line-height:1.3;
}

.lesson-button{
  flex-shrink:0;
  min-width:76px;
}

.free{
  color:#15803d;
  border-color:#86efac;
}

.free:hover{
  background:#f0fdf4;
}

.premium{
  color:#92400e;
  border-color:#fbbf24;
}

.premium:hover{
  background:#fffbeb;
}

/* EMPTY / LOADING */

.message{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

.error{
  color:#b91c1c;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-head{
  position:sticky;
  top:0;
  background:white;
  border-bottom:1px solid #e5e7eb;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  z-index:2;
}

.modal-title{
  font-size:19px;
  line-height:1.3;
}

.close{
  width:36px;
  height:36px;
  padding:0;
  border-radius:9px;
  border:1px solid #cbd5e1;
  background:white;
  color:#334155;
  font-size:18px;
}

.modal-body{
  padding:16px;
}

.lesson-content{
  color:#334155;
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:15px;
}

.tag{
  border:1px solid #dbe4f5;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  color:#475569;
  background:#f8fafc;
}

.dialogue{
  margin-top:18px;
}

.dialogue h4{
  margin-bottom:10px;
  font-size:16px;
}

.dialogue-box{
  border:1px solid #e2e8f0;
  background:#f8fafc;
  border-radius:12px;
  padding:11px;
  margin-bottom:8px;
  font-size:13px;
  line-height:1.55;
}

.questions{
  margin-top:20px;
}

.question{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  margin-bottom:9px;
}

.question-title{
  font-weight:700;
  margin-bottom:7px;
}

.option{
  font-size:13px;
  margin:4px 0;
}

footer{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  padding:20px;
}

@media(max-width:600px){

  header{
    padding:16px 12px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .brand h1{
    font-size:19px;
  }

  .header-actions .btn{
    padding:8px 10px;
    font-size:12px;
  }

  main{
    padding:15px 10px 40px;
  }

  .lessons{
    grid-template-columns:1fr;
  }

  .lesson-card{
    min-height:72px;
  }

  .welcome h2{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <h1>CreateLK Academy</h1>
      <p>Learn Skills. Build Your Future.</p>
    </div>

    <div class="header-actions">
      <a class="btn dark" href="/Aca/login.html">Account</a>
    </div>

  </div>
</header>

<main>

  <div class="welcome">
    <h2>Spoken English</h2>
    <p>Learn practical English through real-life conversations.</p>
  </div>


  <!-- TODAY'S GRAMMAR -->

  <section class="grammar-card">

    <div class="grammar-label">
      📘 Today's Grammar
    </div>

    <div id="grammarTitle" class="grammar-title">
      Loading...
    </div>

    <div id="grammarDescription" class="grammar-description">
      Loading today's grammar lesson...
    </div>

    <button
      id="grammarButton"
      class="btn grammar-btn"
      type="button"
      onclick="openGrammar()"
      disabled
    >
      Open Grammar
    </button>

  </section>


  <!-- SPOKEN ENGLISH -->

  <div class="section-head">
    <h3>100 Spoken English Lessons</h3>
    <span id="lessonCount" class="count">Loading...</span>
  </div>

  <div id="lessons" class="lessons">
    <div class="message">
      Loading lessons...
    </div>
  </div>

</main>

<footer>
  © CreateLK Academy
</footer>


<!-- LESSON MODAL -->

<div id="lessonModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <div>
        <div id="modalTitle" class="modal-title">
          Lesson
        </div>
      </div>

      <button
        class="close"
        type="button"
        onclick="closeLesson()"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div id="modalMeta" class="meta"></div>

      <div
        id="modalContent"
        class="lesson-content"
      >
        Loading...
      </div>

      <div
        id="dialogues"
        class="dialogue"
      ></div>

      <div
        id="questions"
        class="questions"
      ></div>

    </div>

  </div>

</div>


<script>

const API =
  "https://createlk-academy-api.createlk.workers.dev";

const TOKEN_KEY =
  "createlk_token";

let lessons = [];

let currentLesson = null;

let todayGrammar = null;


/* =========================
   AUTH HEADERS
========================= */

function headers(){

  const token =
    localStorage.getItem(TOKEN_KEY);

  const h = {
    "Content-Type":
      "application/json"
  };

  if(token){

    h.Authorization =
      "Bearer " + token;
  }

  return h;
}


/* =========================
   LOAD LESSONS
========================= */

async function loadLessons(){

  const box =
    document.getElementById("lessons");

  try{

    const response =
      await fetch(
        API +
        "/lessons?course=spoken-english&language=en",
        {
          headers: headers()
        }
      );

    const data =
      await response.json();

    if(!response.ok ||
       !data.success){

      throw new Error(
        data.error ||
        "Unable to load lessons."
      );
    }

    lessons =
      data.lessons || [];

    renderLessons();

  }catch(error){

    box.innerHTML = `
      <div class="message error">
        ${escapeHtml(
          error.message ||
          "Unable to load lessons."
        )}
      </div>
    `;

    document.getElementById(
      "lessonCount"
    ).textContent = "";
  }
}


/* =========================
   RENDER LESSONS
========================= */

function renderLessons(){

  const box =
    document.getElementById("lessons");

  const count =
    document.getElementById("lessonCount");

  count.textContent =
    lessons.length + " lessons";

  if(!lessons.length){

    box.innerHTML = `
      <div class="message">
        No lessons available.
      </div>
    `;

    return;
  }

  box.innerHTML =
    lessons.map(lesson => {

      const number =
        Number(
          lesson.lesson_number
        );

      const free =
        number === 1 ||
        number === 2 ||
        lesson.access_type === "free";

      const title =
        lesson.title ||
        `Lesson ${number}`;

      const buttonText =
        free
          ? "Free"
          : "Premium 👑";

      return `

        <div class="lesson-card">

          <div class="lesson-info">

            <div class="lesson-number">
              Lesson ${number}
            </div>

            <div class="lesson-title">
              ${escapeHtml(title)}
              ${free ? "" : " 👑"}
            </div>

          </div>

          <button
            class="btn lesson-button ${
              free ? "free" : "premium"
            }"
            type="button"
            onclick="openLesson(${number})"
          >
            ${buttonText}
          </button>

        </div>

      `;

    }).join("");
}


/* =========================
   OPEN LESSON
========================= */

async function openLesson(number){

  const lesson =
    lessons.find(
      x =>
        Number(x.lesson_number) ===
        Number(number)
    );

  if(!lesson)
    return;

  const free =
    Number(number) === 1 ||
    Number(number) === 2;

  if(!free){

    const token =
      localStorage.getItem(
        TOKEN_KEY
      );

    if(!token){

      window.location.href =
        "/Aca/login.html";

      return;
    }
  }

  showModal();

  document.getElementById(
    "modalTitle"
  ).textContent =
    lesson.title ||
    `Lesson ${number}`;

  document.getElementById(
    "modalMeta"
  ).innerHTML = `
    <span class="tag">
      Lesson ${number}
    </span>

    <span class="tag">
      ${free ? "Free" : "Premium 👑"}
    </span>
  `;

  document.getElementById(
    "modalContent"
  ).textContent =
    "Loading lesson...";

  document.getElementById(
    "dialogues"
  ).innerHTML = "";

  document.getElementById(
    "questions"
  ).innerHTML = "";

  try{

    const response =
      await fetch(
        API +
        "/lesson?course=spoken-english&language=en&lesson=" +
        encodeURIComponent(number),
        {
          headers: headers()
        }
      );

    const data =
      await response.json();

    if(response.status === 401){

      window.location.href =
        "/Aca/login.html";

      return;
    }

    if(response.status === 403 &&
       data.premium_required){

      showPremiumMessage();

      return;
    }

    if(!response.ok ||
       !data.success){

      throw new Error(
        data.error ||
        "Unable to load lesson."
      );
    }

    currentLesson =
      data.lesson;

    renderLesson(
      data.lesson
    );

  }catch(error){

    document.getElementById(
      "modalContent"
    ).innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          "Unable to load lesson."
        )}
      </div>
    `;
  }
}


/* =========================
   RENDER LESSON
========================= */

function renderLesson(lesson){

  document.getElementById(
    "modalTitle"
  ).textContent =
    lesson.title ||
    "Lesson";

  const meta = [];

  if(lesson.duration)
    meta.push(
      `⏱ ${escapeHtml(
        lesson.duration
      )}`
    );

  if(lesson.language)
    meta.push(
      escapeHtml(
        lesson.language
      ).toUpperCase()
    );

  document.getElementById(
    "modalMeta"
  ).innerHTML =
    meta.map(x =>
      `<span class="tag">${x}</span>`
    ).join("");

  let html = "";

  if(lesson.objectives){

    html += `
      <h3 style="margin-bottom:8px">
        Learning Objectives
      </h3>

      <div style="margin-bottom:18px">
        ${formatText(
          lesson.objectives
        )}
      </div>
    `;
  }

  if(lesson.content){

    html += `
      <h3 style="margin-bottom:8px">
        Lesson
      </h3>

      <div style="margin-bottom:18px">
        ${formatText(
          lesson.content
        )}
      </div>
    `;
  }

  if(lesson.key_points){

    html += `
      <h3 style="margin-bottom:8px">
        Key Points
      </h3>

      <div style="margin-bottom:18px">
        ${formatText(
          lesson.key_points
        )}
      </div>
    `;
  }

  if(lesson.summary){

    html += `
      <h3 style="margin-bottom:8px">
        Summary
      </h3>

      <div>
        ${formatText(
          lesson.summary
        )}
      </div>
    `;
  }

  if(!html){

    html =
      "This lesson is ready to learn.";
  }

  document.getElementById(
    "modalContent"
  ).innerHTML =
    html;


  /* DIALOGUES */

  const dialogueBox =
    document.getElementById(
      "dialogues"
    );

  const dialogues =
    lesson.dialogues || [];

  if(dialogues.length){

    dialogueBox.innerHTML = `

      <h4>
        💬 Practice Dialogue
      </h4>

      ${
        dialogues.map(d => `

          <div class="dialogue-box">

            <strong>
              ${escapeHtml(
                d.speaker_a ||
                "Speaker A"
              )}
            </strong>

            <br>

            ${escapeHtml(
              d.text_a || ""
            )}

            <br><br>

            <strong>
              ${escapeHtml(
                d.speaker_b ||
                "Speaker B"
              )}
            </strong>

            <br>

            ${escapeHtml(
              d.text_b || ""
            )}

          </div>

        `).join("")
      }

    `;
  }


  /* QUESTIONS */

  const questionBox =
    document.getElementById(
      "questions"
    );

  const questions =
    lesson.questions || [];

  if(questions.length){

    questionBox.innerHTML = `

      <h4 style="margin-bottom:10px">
        📝 Practice Questions
      </h4>

      ${
        questions.map(
          (q,i) => `

            <div class="question">

              <div class="question-title">
                ${i + 1}.
                ${escapeHtml(
                  q.question || ""
                )}
              </div>

              ${
                q.option_a
                  ? `<div class="option">
                       A. ${escapeHtml(q.option_a)}
                     </div>`
                  : ""
              }

              ${
                q.option_b
                  ? `<div class="option">
                       B. ${escapeHtml(q.option_b)}
                     </div>`
                  : ""
              }

              ${
                q.option_c
                  ? `<div class="option">
                       C. ${escapeHtml(q.option_c)}
                     </div>`
                  : ""
              }

              ${
                q.option_d
                  ? `<div class="option">
                       D. ${escapeHtml(q.option_d)}
                     </div>`
                  : ""
              }

            </div>

          `
        ).join("")
      }

    `;
  }
}


/* =========================
   PREMIUM MESSAGE
========================= */

function showPremiumMessage(){

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div style="
      text-align:center;
      padding:20px 5px;
    ">

      <div style="
        font-size:38px;
        margin-bottom:10px;
      ">
        👑
      </div>

      <h3 style="
        margin-bottom:8px;
      ">
        Premium Lesson
      </h3>

      <p style="
        color:#64748b;
        font-size:13px;
        line-height:1.6;
        margin-bottom:15px;
      ">
        This lesson is available with
        CreateLK Academy Premium.
      </p>

      <button
        class="btn premium"
        type="button"
        onclick="goPremium()"
      >
        Get Premium 👑
      </button>

    </div>

  `;
}


/* =========================
   PREMIUM
========================= */

function goPremium(){

  window.location.href =
    "/Aca/login.html";
}


/* =========================
   MODAL
========================= */

function showModal(){

  document
    .getElementById(
      "lessonModal"
    )
    .classList.add("show");
}

function closeLesson(){

  document
    .getElementById(
      "lessonModal"
    )
    .classList.remove("show");
}

document
  .getElementById(
    "lessonModal"
  )
  .addEventListener(
    "click",
    function(e){

      if(e.target === this)
        closeLesson();

    }
  );


/* =========================
   TODAY'S GRAMMAR
========================= */

async function loadTodayGrammar(){

  const title =
    document.getElementById(
      "grammarTitle"
    );

  const description =
    document.getElementById(
      "grammarDescription"
    );

  const button =
    document.getElementById(
      "grammarButton"
    );

  try{

    /*
      This endpoint should return
      one grammar lesson selected
      from the D1 grammar_lessons table.
    */

    const response =
      await fetch(
        API + "/grammar/today",
        {
          headers: headers()
        }
      );

    const data =
      await response.json();

    if(!response.ok ||
       !data.success){

      throw new Error(
        data.error ||
        "Grammar lesson unavailable."
      );
    }

    todayGrammar =
      data.lesson;

    title.textContent =
      todayGrammar.title ||
      "Today's Grammar";

    description.textContent =
      todayGrammar.description ||
      "Improve your English grammar today.";

    button.disabled =
      false;

  }catch(error){

    title.textContent =
      "Today's Grammar";

    description.textContent =
      "Grammar lesson will be available soon.";

    button.disabled =
      true;
  }
}


/* =========================
   OPEN GRAMMAR
========================= */

function openGrammar(){

  if(!todayGrammar)
    return;

  const title =
    todayGrammar.title ||
    "Today's Grammar";

  const description =
    todayGrammar.description ||
    "";

  showModal();

  document.getElementById(
    "modalTitle"
  ).textContent =
    "📘 " + title;

  document.getElementById(
    "modalMeta"
  ).innerHTML = `
    <span class="tag">
      Today's Grammar
    </span>
  `;

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <h3 style="margin-bottom:8px">
      ${escapeHtml(title)}
    </h3>

    <div>
      ${formatText(description)}
    </div>

  `;

  document.getElementById(
    "dialogues"
  ).innerHTML = "";

  document.getElementById(
    "questions"
  ).innerHTML = "";
}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatText(value){

  return escapeHtml(value)
    .replace(/\n/g,"<br>");
}


/* =========================
   START
========================= */

loadLessons();
loadTodayGrammar();

</script>

</body>
</html>
