<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#f8faff,#eef3ff);color:#172033}
button,select{font:inherit;cursor:pointer}

header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:800}.logo small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.logout{background:#ffffff18;color:#fff;border:1px solid #ffffff35;padding:9px 13px;border-radius:9px}

main{max-width:1100px;margin:auto;padding:22px 15px 50px}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:28px 22px;margin-bottom:18px}
.hero h1{font-size:30px;margin-bottom:8px}.hero p{line-height:1.5;opacity:.9}

.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:18px;margin-bottom:16px}
.ptop{display:flex;justify-content:space-between;margin-bottom:10px}
.ptext{color:#2563eb;font-weight:800}
.bar{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:.3s}

.premium{background:linear-gradient(135deg,#111827,#312e81);color:#fff}
.premium p{opacity:.85;margin:7px 0 13px}
.premium button{background:#facc15;border:0;padding:11px 16px;border-radius:10px;font-weight:800}

h2{margin:22px 0 13px}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}
.lesson{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;cursor:pointer}
.lesson:hover{border-color:#93c5fd}
.num{font-size:11px;color:#64748b;font-weight:700;margin-bottom:7px}
.ltitle{font-weight:800;margin-bottom:11px}
.lbar{height:6px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.lfill{height:100%;width:0;background:#2563eb;transition:.3s}
.lprog{font-size:11px;color:#64748b;margin-top:5px}

.modal{display:none;position:fixed;inset:0;background:#020617aa;z-index:30;padding:12px;overflow:auto}
.modal.show{display:block}
.box{max-width:800px;margin:20px auto;background:#fff;border-radius:20px;overflow:hidden}
.mhead{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
.close{background:#ffffff18;color:#fff;border:1px solid #ffffff30;width:35px;height:35px;border-radius:9px;font-size:20px}
.content{padding:17px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.controls select,.controls button{padding:9px 12px;border:1px solid #dbe3ef;border-radius:9px;background:#fff}
.controls .primary{background:#2563eb;color:#fff;border-color:#2563eb}

.dialogue{padding:15px;margin:9px 0;border:1px solid #e2e8f0;border-radius:13px;background:#fbfdff;cursor:pointer}
.dialogue.playing{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.dialogue.saved{border-color:#16a34a;background:#f0fdf4}
.dnum{font-size:10px;color:#2563eb;font-weight:800;margin-bottom:8px}
.lang{font-size:9px;color:#64748b;font-weight:800;margin-top:8px;text-transform:uppercase}
.text{line-height:1.55;margin-top:2px}

@media(max-width:600px){
 .hero h1{font-size:25px}
 .ptop{flex-direction:column;gap:5px}
}
</style>
</head>

<body>

<header>
<div class="head">
 <div class="logo">
  CreateLK Academy
  <small>LEARN SKILLS • BUILD YOUR FUTURE</small>
 </div>
 <button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main>

<section class="hero">
 <h1>Spoken English</h1>
 <p>Improve your English through practical conversations and real-life situations.</p>
</section>

<section class="card">
 <div class="ptop">
  <b>📈 Your Learning Progress</b>
  <span id="totalText" class="ptext">0 / 2,500</span>
 </div>
 <div class="bar"><div id="totalFill" class="fill"></div></div>
</section>

<section class="card premium">
 <h2>⭐ Go Premium</h2>
 <p>Enjoy an ad-free learning experience.</p>
 <button id="premiumBtn" onclick="buyPremium()">GET PREMIUM</button>
</section>

<h2>📚 100 English Lessons</h2>
<section id="lessons" class="lessons">Loading...</section>

</main>

<div id="modal" class="modal">
<div class="box">

 <div class="mhead">
  <b id="modalTitle">Lesson</b>
  <button class="close" onclick="closeLesson()">×</button>
 </div>

 <div class="content">

  <div class="controls">
   <select id="language">
    <option value="en">English Only</option>
    <option value="ta">English + Tamil</option>
    <option value="si">English + Sinhala</option>
   </select>

   <button class="primary" id="playBtn" onclick="playAll()">▶️ Play All</button>
   <button onclick="stopSpeech()">⏹️ Stop</button>
  </div>

  <div id="dialogues">Loading...</div>

 </div>
</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev",
PAY="https://createlk-payhere.createlk.workers.dev",
COURSE="spoken-english",
TOKEN=localStorage.getItem("createlk_token"),
H={"Content-Type":"application/json","Authorization":"Bearer "+TOKEN};

if(!TOKEN){
 document.documentElement.style.display="none";
 location.replace("/Aca/login.html");
}

const $=id=>document.getElementById(id);
let currentLesson=0,selectedLanguage="en",dialogues=[],played=new Set(),playing=false;

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function normalize(list){
 let s=new Set();
 (list||[]).forEach(x=>{
  if(typeof x==="string"){
   if(/^\d+:\d+$/.test(x))s.add(x);
  }else if(x){
   let l=x.lesson_number??x.lesson??x.lessonNumber,
       d=x.dialogue_number??x.dialogue??x.dialogueNumber;
   if(l!=null&&d!=null)s.add(`${+l}:${+d}`);
  }
 });
 return s;
}

async function loadProgress(){
 try{
  let r=await fetch(`${API}/progress?course=${COURSE}`,{headers:H,cache:"no-store"});
  if(r.status===401)return logout();
  let d=await r.json();
  played=normalize(d.played_dialogues);
 }catch(e){}
 updateProgress();
}

function updateProgress(){
 let n=Math.min(2500,played.size);
 $("totalText").textContent=`${n.toLocaleString()} / 2,500`;
 $("totalFill").style.width=n/2500*100+"%";
}

function lessonProgress(n){
 let c=0,p=n+":";
 played.forEach(x=>x.startsWith(p)&&c++);
 return Math.min(25,c);
}

function updateCard(n){
 let c=document.querySelector(`[data-lesson="${n}"]`);
 if(!c)return;
 let p=lessonProgress(n);
 c.querySelector(".lfill").style.width=p/25*100+"%";
 c.querySelector(".lprog").textContent=`${p} / 25 dialogues`;
}

async function saveDialogue(n){
 let key=`${currentLesson}:${n}`;
 if(played.has(key))return;

 played.add(key);
 updateProgress();
 updateCard(currentLesson);

 let box=document.querySelector(`[data-number="${n}"]`);
 box?.classList.add("saved");

 try{
  let r=await fetch(`${API}/dialogue/progress`,{
   method:"POST",headers:H,cache:"no-store",
   body:JSON.stringify({
    course:COURSE,
    lesson_number:+currentLesson,
    dialogue_number:+n
   })
  });

  if(r.status===401)return logout();

  if(!r.ok)throw Error();

 }catch(e){
  played.delete(key);
  updateProgress();
  updateCard(currentLesson);
  box?.classList.remove("saved");
 }
}

async function getLesson(n,lang){
 let r=await fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=${lang}`,{headers:H});
 if(r.status===401)return logout();
 let d=await r.json();
 if(!r.ok||!d.success)throw Error(d.error||"Lesson unavailable");
 return d;
}

async function openLesson(n){
 stopSpeech();
 currentLesson=n;
 $("modal").classList.add("show");
 $("modalTitle").textContent=`Lesson ${n}`;
 $("dialogues").innerHTML="Loading...";

 try{
  let [en,si,ta]=await Promise.all([
   getLesson(n,"en"),
   getLesson(n,"si"),
   getLesson(n,"ta")
  ]);

  let ed=en.lesson?.dialogues||[],
      sd=si.lesson?.dialogues||[],
      td=ta.lesson?.dialogues||[];

  dialogues=ed.map((x,i)=>({
   number:x.dialogue_number,
   lines:[
    ["English",x.speaker_a,x.text_a],
    ["English",x.speaker_b,x.text_b],
    ["Sinhala",sd[i]?.speaker_a,sd[i]?.text_a],
    ["Sinhala",sd[i]?.speaker_b,sd[i]?.text_b],
    ["Tamil",td[i]?.speaker_a,td[i]?.text_a],
    ["Tamil",td[i]?.speaker_b,td[i]?.text_b]
   ]
  }));

  render();
 }catch(e){
  $("dialogues").innerHTML=`<p>${esc(e.message)}</p>`;
 }
}

function visible(x){
 return selectedLanguage==="en"
  ?x[0]==="English"
  :selectedLanguage==="ta"
  ?["English","Tamil"].includes(x[0])
  :["English","Sinhala"].includes(x[0]);
}

function linesHTML(d){
 return d.lines.map(x=>
  visible(x)&&x[2]
  ?`<div class="lang">${x[0]}</div><div class="text"><b>${esc(x[1])}:</b> ${esc(x[2])}</div>`
  :""
 ).join("");
}

function render(){
 $("dialogues").innerHTML=dialogues.map((d,i)=>{
  let key=`${currentLesson}:${d.number}`;
  return `<div class="dialogue ${played.has(key)?"saved":""}" data-number="${d.number}" onclick="playDialogue(${i})">
   <div class="dnum">DIALOGUE ${d.number}</div>
   ${linesHTML(d)}
  </div>`;
 }).join("");
}

$("language").onchange=function(){
 selectedLanguage=this.value;
 render();
};

function playDialogue(i){
 stopSpeech();
 let d=dialogues[i];
 if(!d)return;

 playing=true;

 document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));

 let box=document.querySelectorAll(".dialogue")[i];
 box?.classList.add("playing");
 box?.scrollIntoView({behavior:"smooth",block:"center"});

 saveDialogue(d.number);

 let allowed=selectedLanguage==="en"
  ?["English"]
  :selectedLanguage==="ta"
  ?["English","Tamil"]
  :["English","Sinhala"];

 speak(d.lines.filter(x=>allowed.includes(x[0])&&x[2]),0,stopSpeech);
}

function playAll(){
 stopSpeech();
 if(!dialogues.length)return;

 playing=true;
 $("playBtn").textContent="⏸️ Playing...";

 let i=0;

 function next(){
  if(!playing||i>=dialogues.length)return stopSpeech();

  let d=dialogues[i],
      box=document.querySelectorAll(".dialogue")[i];

  document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));

  box?.classList.add("playing");
  box?.scrollIntoView({behavior:"smooth",block:"center"});

  saveDialogue(d.number);

  let allowed=selectedLanguage==="en"
   ?["English"]
   :selectedLanguage==="ta"
   ?["English","Tamil"]
   :["English","Sinhala"];

  speak(d.lines.filter(x=>allowed.includes(x[0])&&x[2]),0,()=>{
   i++;
   next();
  });
 }

 next();
}

function speak(lines,i,done){
 if(!playing)return;
 if(i>=lines.length)return done?.();

 let u=new SpeechSynthesisUtterance(lines[i][2]);

 u.lang=lines[i][0]==="English"
  ?"en-US"
  :lines[i][0]==="Tamil"
  ?"ta-LK"
  :"si-LK";

 u.rate=.88;
 u.onend=()=>speak(lines,i+1,done);
 u.onerror=()=>speak(lines,i+1,done);

 speechSynthesis.speak(u);
}

function stopSpeech(){
 playing=false;
 speechSynthesis.cancel();
 document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));
 if($("playBtn"))$("playBtn").textContent="▶️ Play All";
}

function closeLesson(){
 stopSpeech();
 $("modal").classList.remove("show");
}

$("modal").onclick=e=>{
 if(e.target===$("modal"))closeLesson();
};

async function loadLessons(){
 try{
  let r=await fetch(`${API}/lessons?course=${COURSE}&language=en`,{headers:H});
  if(r.status===401)return logout();

  let d=await r.json(),
      list=d.lessons||d.data||[];

  $("lessons").innerHTML=list.map(x=>{
   let n=x.lesson_number??x.lesson??x.number,
       title=x.title??x.lesson_title??`Lesson ${n}`;

   return `<div class="lesson" data-lesson="${+n}" onclick="openLesson(${+n})">
    <div class="num">LESSON ${+n}</div>
    <div class="ltitle">${esc(title)}</div>
    <div class="lbar"><div class="lfill"></div></div>
    <div class="lprog">0 / 25 dialogues</div>
   </div>`;
  }).join("");

  list.forEach(x=>updateCard(+(x.lesson_number??x.lesson??x.number)));

 }catch(e){
  $("lessons").innerHTML="<p>Unable to load lessons.</p>";
 }
}

async function buyPremium(){
 let b=$("premiumBtn");
 b.disabled=true;
 b.textContent="Connecting...";

 try{
  let r=await fetch(`${PAY}/premium-checkout`,{
   method:"POST",headers:H,body:"{}"
  });

  if(r.status===401)return logout();

  let d=await r.json();

  if(!r.ok||!d.success)throw Error(d.error||d.message||"Checkout failed");

  let form=document.createElement("form");
  form.method="POST";
  form.action="https://www.payhere.lk/pay/checkout";

  Object.entries(d.fields||d.checkout||{}).forEach(([k,v])=>{
   let i=document.createElement("input");
   i.type="hidden";
   i.name=k;
   i.value=v??"";
   form.appendChild(i);
  });

  document.body.appendChild(form);
  form.submit();

 }catch(e){
  alert(e.message||"Payment failed");
  b.disabled=false;
  b.textContent="GET PREMIUM";
 }
}

function logout(){
 localStorage.removeItem("createlk_token");
 localStorage.removeItem("createlk_customer");
 sessionStorage.clear();
 location.replace("/index.html");
}

(async()=>{
 await loadProgress();
 await loadLessons();
})();
</script>

</body>
</html>
