<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f8faff,#eef3ff);
color:#172033
}
button,select{font:inherit}
header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:#fff;padding:22px 16px
}
header h1{font-size:24px}
header p{margin-top:5px;opacity:.85}
main{max-width:900px;margin:auto;padding:16px}
.card{
background:#fff;border-radius:16px;padding:18px;
margin-bottom:16px;
box-shadow:0 5px 20px #0000000c
}
.progress-title{font-weight:bold;margin-bottom:10px}
.progress-bar{
height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden
}
#totalFill{
height:100%;width:0;
background:linear-gradient(90deg,#2563eb,#7c3aed);
transition:.3s
}
#totalText{
text-align:center;font-size:15px;
font-weight:bold;margin-top:8px
}
.top{
display:flex;gap:10px;flex-wrap:wrap;
align-items:center;justify-content:space-between
}
select{
padding:10px;border:1px solid #d1d5db;
border-radius:9px;background:#fff
}
button{
border:0;border-radius:9px;
padding:10px 15px;font-weight:bold;cursor:pointer
}
.primary{background:#2563eb;color:#fff}
.stop{background:#dc2626;color:#fff}
.logout{background:#e5e7eb}
.lessons{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px
}
.lesson{
border:1px solid #e5e7eb;border-radius:12px;
padding:14px;background:#fff;cursor:pointer
}
.lesson:hover{border-color:#2563eb}
.lesson strong{display:block;margin-bottom:8px}
.lesson-progress{
height:7px;background:#e5e7eb;
border-radius:20px;overflow:hidden
}
.lesson-progress-fill{
height:100%;width:0;background:#2563eb
}
.lesson-progress-text{
font-size:12px;color:#64748b;margin-top:6px
}
#lessonBox{display:none}
.lesson-head{
display:flex;justify-content:space-between;
align-items:center;gap:10px;margin-bottom:15px
}
.dialogue{
border:1px solid #e5e7eb;
border-radius:12px;padding:14px;
margin-bottom:12px;
transition:.2s
}
.dialogue.playing{
border-color:#2563eb;
box-shadow:0 0 0 3px #2563eb18
}
.dialogue.saved{
border-color:#16a34a;
background:#f0fdf4
}
.num{
font-size:12px;font-weight:bold;
color:#2563eb;margin-bottom:10px
}
.lang{
font-size:11px;color:#64748b;
font-weight:bold;margin-top:9px
}
.text{
line-height:1.55;margin-top:2px
}
.empty{text-align:center;color:#64748b;padding:25px}
@media(max-width:600px){
header h1{font-size:20px}
main{padding:10px}
.card{padding:14px}
}
</style>
</head>

<body>

<header>
<h1>CreateLK Academy</h1>
<p>Spoken English • 100 Lessons • 2,500 Dialogues</p>
</header>

<main>

<div class="card">
<div class="progress-title">Your Progress</div>
<div class="progress-bar">
<div id="totalFill"></div>
</div>
<div id="totalText">0 / 2,500</div>
</div>

<div class="card">
<div class="top">
<select id="language" onchange="changeLanguage()">
<option value="en">🇬🇧 English</option>
<option value="ta">🇱🇰 Tamil</option>
<option value="si">🇱🇰 Sinhala</option>
</select>

<div>
<button class="primary" id="playBtn" onclick="playAll()">▶️ Play All</button>
<button class="stop" onclick="stopSpeech()">⏹ Stop</button>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>
</div>

<div class="card">
<h2 style="margin-bottom:14px">100 Lessons</h2>
<div id="lessons" class="lessons"></div>
</div>

<div id="lessonBox" class="card">
<div class="lesson-head">
<h2 id="lessonTitle"></h2>
<button class="logout" onclick="closeLesson()">← Back</button>
</div>
<div id="dialogues"></div>
</div>

</main>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const COURSE="spoken-english";
const TOKEN=localStorage.getItem("createlk_token");
const H={
"Content-Type":"application/json",
"Authorization":"Bearer "+TOKEN
};

if(!TOKEN){
document.documentElement.style.display="none";
location.replace("/Aca/login.html");
}

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities",
"Talking About Your Job","Talking About School","Talking About Friends",
"Asking for Personal Information","Meeting Someone New","Making a Phone Call",
"Sending a Message","Talking About the Time","Talking About the Date",
"Making Plans","Weekend Plans","Invitations","Accepting an Invitation",
"Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu",
"Paying the Bill","At a Café","Buying Groceries","At a Supermarket",
"Shopping for Clothes","Asking the Price","Returning an Item","At the Bus Stop",
"Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel",
"Hotel Problems","Talking About Weather","Talking About Hobbies",
"Sports and Games","Music","Movies and TV","Reading Books",
"Weekend Activities","Holidays","Birthday Conversations","Celebrations",
"At the Doctor","Describing Symptoms","At the Pharmacy","Healthy Habits",
"Exercise and Fitness","Asking for Help","Offering Help","Giving Advice",
"Asking for Permission","Saying Sorry","Thanking Someone","Compliments",
"Agreeing and Disagreeing","Expressing Opinions","Making Suggestions",
"Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews",
"Talking With a Customer","Talking With a Manager","Making an Appointment",
"Office Phone Calls","Meetings","Giving Instructions","Asking Questions at Work",
"Discussing a Project","Talking About Money","Banking","Using an ATM",
"Online Shopping","Using the Internet","Social Media Conversations",
"Learning English","Practicing English","Common English Mistakes",
"Understanding Fast English","Everyday Expressions","Making Conversation",
"Keeping a Conversation Going","Speaking Politely","Speaking Confidently",
"Natural English","Travel Conversations","Emergency Conversations",
"Real-Life Situations","Advanced Everyday Conversations",
"Speaking English Confidently"
];

let played=new Set();
let completed=[];
let currentLesson=0;
let selectedLanguage="en";
let dialogues=[];
let playing=false;
let utterances=[];

const $=id=>document.getElementById(id);

function normalizePlayed(list){
const s=new Set();

(list||[]).forEach(x=>{
if(typeof x==="string"){
const m=x.match(/^(\d+):(\d+)$/);
if(m)s.add(`${Number(m[1])}:${Number(m[2])}`);
}else if(x&&typeof x==="object"){
const l=x.lesson_number??x.lesson??x.lessonNumber;
const d=x.dialogue_number??x.dialogue??x.dialogueNumber;
if(l!=null&&d!=null)s.add(`${Number(l)}:${Number(d)}`);
}
});

return s;
}

async function loadProgress(){
try{
const r=await fetch(
`${API}/progress?course=${COURSE}`,
{headers:H,cache:"no-store"}
);

if(r.status===401)return logout();

const d=await r.json();

played=normalizePlayed(d.played_dialogues||[]);
updateProgress();

}catch(e){
console.log(e);
}
}

function updateProgress(){
const d=Math.min(2500,played.size);
$("totalFill").style.width=(d/2500*100)+"%";
$("totalText").textContent=`${d.toLocaleString()} / 2,500`;
}

function lessonProgress(n){
let count=0;
const prefix=`${n}:`;

played.forEach(x=>{
if(x.startsWith(prefix))count++;
});

return Math.min(25,count);
}

function updateCard(n){
const card=document.querySelector(`[data-lesson="${n}"]`);
if(!card)return;

const d=lessonProgress(n);

card.querySelector(".lesson-progress-fill").style.width=
(d/25*100)+"%";

card.querySelector(".lesson-progress-text").textContent=
`${d} / 25 dialogues`;
}

function renderLessons(){
$("lessons").innerHTML=titles.map((title,i)=>{
const n=i+1;

return `
<div class="lesson" data-lesson="${n}" onclick="openLesson(${n})">
<strong>${n}. ${title}</strong>
<div class="lesson-progress">
<div class="lesson-progress-fill"
style="width:${lessonProgress(n)/25*100}%"></div>
</div>
<div class="lesson-progress-text">
${lessonProgress(n)} / 25 dialogues
</div>
</div>`;
}).join("");
}

function esc(x){
return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

async function getLesson(n,lang){
const r=await fetch(
`${API}/lesson?course=${COURSE}&lesson=${n}&language=${lang}`,
{headers:H}
);

if(r.status===401){
logout();
throw Error("Login expired");
}

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Lesson unavailable");

return d;
}

async function openLesson(n){
stopSpeech();

currentLesson=n;
selectedLanguage=$("language").value;

$("lessonTitle").textContent=
`Lesson ${n}: ${titles[n-1]}`;

$("lessonBox").style.display="block";
$("lessons").parentElement.style.display="none";

$("dialogues").innerHTML=
`<div class="empty">Loading...</div>`;

try{
const [ed,sd,td]=await Promise.all([
getLesson(n,"en"),
getLesson(n,"si"),
getLesson(n,"ta")
]);

dialogues=ed.map((x,i)=>({
number:x.dialogue_number,
lines:[
["English",x.speaker_a,x.text_a],
["English",x.speaker_b,x.text_b],
["Sinhala",sd[i]?.speaker_a,sd[i]?.text_a],
["Sinhala",sd[i]?.speaker_b,sd[i]?.text_b],
["Tamil",td[i]?.speaker_a,td[i]?.text_a],
["Tamil",td[i]?.speaker_b,td[i]?.text_b]
]
}));

renderDialogues();

}catch(e){
$("dialogues").innerHTML=
`<div class="empty">${esc(e.message)}</div>`;
}
}

function linesHTML(d){
return d.lines.map(x=>{

const show=
selectedLanguage==="en"
?x[0]==="English"
:selectedLanguage==="ta"
?x[0]==="English"||x[0]==="Tamil"
:x[0]==="English"||x[0]==="Sinhala";

return show&&x[2]
?`<div class="lang">${x[0]}</div>
<div class="text"><b>${esc(x[1])}:</b> ${esc(x[2])}</div>`
:"";

}).join("");
}

function renderDialogues(){

$("dialogues").innerHTML=dialogues.map((d,i)=>{

const saved=
played.has(`${currentLesson}:${d.number}`)
?" saved":"";

return `
<div class="dialogue${saved}" id="d${i}">
<div class="num">DIALOGUE ${d.number}</div>
${linesHTML(d)}
</div>`;
}).join("");
}

async function saveDialogue(n){

const key=`${currentLesson}:${n}`;

if(played.has(key))return;

played.add(key);

updateProgress();
updateCard(currentLesson);

const index=
dialogues.findIndex(x=>+x.number===+n);

const box=$("d"+index);

if(box)box.classList.add("saved");

try{

const r=await fetch(
`${API}/dialogue/progress`,
{
method:"POST",
headers:H,
cache:"no-store",
body:JSON.stringify({
course:COURSE,
lesson_number:Number(currentLesson),
dialogue_number:Number(n)
})
});

if(r.status===401){
logout();
return;
}

if(!r.ok){

played.delete(key);

updateProgress();
updateCard(currentLesson);

if(box)box.classList.remove("saved");
}

}catch(e){

console.log("Dialogue save error:",e);

played.delete(key);

updateProgress();
updateCard(currentLesson);

if(box)box.classList.remove("saved");
}
}

function speak(lines,i,done){

if(!playing)return;

if(i>=lines.length){
done?.();
return;
}

const u=new SpeechSynthesisUtterance(lines[i][2]);

u.lang=
lines[i][0]==="English"
?"en-US"
:lines[i][0]==="Tamil"
?"ta-IN"
:"si-LK";

u.rate=.9;

u.onend=()=>{
if(playing)speak(lines,i+1,done);
};

u.onerror=()=>{
if(playing)speak(lines,i+1,done);
};

speechSynthesis.speak(u);
utterances.push(u);
}

function playAll(){

stopSpeech();

if(!dialogues.length)return;

playing=true;
$("playBtn").textContent="⏸️ Playing...";

let i=0;

function next(){

if(!playing||i>=dialogues.length){
stopSpeech();
return;
}

const d=dialogues[i];
const box=$("d"+i);

document.querySelectorAll(".dialogue")
.forEach(x=>x.classList.remove("playing"));

box?.classList.add("playing");

box?.scrollIntoView({
behavior:"smooth",
block:"center"
});

void saveDialogue(d.number);

const allowed=
selectedLanguage==="en"
?["English"]
:selectedLanguage==="ta"
?["English","Tamil"]
:["English","Sinhala"];

const lines=d.lines.filter(x=>
allowed.includes(x[0])&&x[2]
);

speak(lines,0,()=>{
i++;
next();
});
}

next();
}

function stopSpeech(){

playing=false;

speechSynthesis.cancel();
utterances=[];

document.querySelectorAll(".dialogue")
.forEach(x=>x.classList.remove("playing"));

if($("playBtn"))
$("playBtn").textContent="▶️ Play All";
}

function changeLanguage(){

selectedLanguage=$("language").value;

if(currentLesson)
renderDialogues();
}

function closeLesson(){

stopSpeech();

currentLesson=0;
dialogues=[];

$("lessonBox").style.display="none";
$("lessons").parentElement.style.display="block";
}

function logout(){

localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");

sessionStorage.clear();

location.replace("/index.html");
}

loadProgress().then(renderLessons);
</script>

</body>
</html>
