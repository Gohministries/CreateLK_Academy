<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7ff;color:#172033}
header{background:linear-gradient(135deg,#111827,#3730a3);color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold}button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:bold}
.logout{background:#fff;color:#312e81}.wrap{max-width:1100px;margin:auto;padding:25px 15px}
.hero{background:linear-gradient(135deg,#312e81,#4f46e5);color:white;border-radius:20px;padding:30px;margin-bottom:20px}
.hero small{opacity:.8}.hero h1{font-size:36px;margin:8px 0}.hero p{opacity:.9}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 5px 20px #0001}
.progress{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.fill{height:100%;background:#4f46e5;width:0}
.stats{display:flex;gap:20px;margin-top:12px;color:#555;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.lesson{border:1px solid #e5e7eb;border-radius:14px;padding:17px;background:white}
.lesson h3{margin:0 0 8px;font-size:17px}.lesson p{font-size:13px;color:#667085;min-height:34px}
.lesson button{background:#4f46e5;color:white;width:100%}.locked{background:#e5e7eb!important;color:#777!important}
.bar{height:6px;background:#eee;border-radius:8px;margin:10px 0}.bar i{display:block;height:100%;background:#22c55e;border-radius:8px}
#modal{display:none;position:fixed;inset:0;background:#0008;padding:20px;z-index:5}
.box{background:white;max-width:700px;max-height:90vh;overflow:auto;margin:auto;border-radius:18px;padding:22px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dialogue{background:#f7f8fc;border-radius:12px;padding:13px;margin:10px 0}
.dialogue b{color:#4f46e5}.actions{display:flex;gap:8px;flex-wrap:wrap}
select{padding:9px;border:1px solid #ddd;border-radius:8px}
@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
<div class="logo">CreateLK Academy</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main class="wrap">
<section class="hero">
<small>ONLINE COURSE</small>
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<b>100 Lessons • 2,500 Practical Dialogues</b>
</section>

<section class="card">
<h3>My Progress</h3>
<div class="progress"><div class="fill" id="fill"></div></div>
<div class="stats">
<span id="dp">0 / 2,500 dialogues</span>
<span id="lp">0 / 100 lessons</span>
<span id="pc">0%</span>
</div>
</section>

<section class="card">
<h2>Premium</h2>
<p>Unlock all 100 lessons and learn without ads.</p>
<button onclick="pay()">Get Premium – LKR 999</button>
</section>

<div id="lessons" class="grid"></div>
</main>

<div id="modal">
<div class="box">
<div class="top">
<h2 id="title"></h2><button onclick="closeModal()">✕</button>
</div>

<div class="actions">
<select id="lang" onchange="loadLesson()">
<option value="en">🇬🇧 English</option>
<option value="ta">🇱🇰 Tamil</option>
<option value="si">🇱🇰 Sinhala</option>
</select>
<button onclick="playAll()">▶ Play All</button>
<button onclick="speechSynthesis.cancel()">■ Stop</button>
</div>

<p id="mp"></p>
<div id="dialogues"></div>
<button onclick="completeLesson()">✓ Mark Lesson Complete</button>
</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev",
COURSE="spoken-english",TOKEN=localStorage.getItem("createlk_token");
let premium=false,done=new Set(),completed=new Set(),lesson=0,data=[];

const H={Authorization:"Bearer "+TOKEN};

if(!TOKEN)location.href="/auth/login.html";

async function api(url,opt={}){
 let r=await fetch(API+url,{...opt,headers:{...H,...(opt.headers||{})}});
 if(r.status==401)return logout();
 return r;
}

async function progress(){
 try{
  let d=await(await api("/progress?course="+COURSE)).json();
  done=new Set(d.played_dialogues||[]);
  completed=new Set((d.completed_lessons||[]).map(Number));
  update();
 }catch(e){}
}

function update(){
 let n=done.size,p=completed.size;
 fill.style.width=n/25+"%";
 dp.textContent=n+" / 2,500 dialogues";
 lp.textContent=p+" / 100 lessons";
 pc.textContent=Math.round(n/25)+"%";
}

async function loadLessons(){
 let d=await(await api("/lessons?course="+COURSE+"&language=en")).json();
 premium=!!d.premium;
 lessons.innerHTML=d.lessons.map(x=>{
  let n=x.lesson_number,c=[...done].filter(v=>v.startsWith(n+":")).length;
  let lock=!premium&&n>1;
  return `<div class="lesson">
  <h3>${n}. ${x.title}</h3><p>${x.summary||"Practical English conversation"}</p>
  <div class="bar"><i style="width:${c/25*100}%"></i></div>
  <small>${c}/25 dialogues</small><br><br>
  <button class="${lock?"locked":""}" ${lock?"disabled":""} onclick="openLesson(${n})">
  ${lock?"🔒 Premium":"Open Lesson"}</button></div>`;
 }).join("");
}

async function openLesson(n){
 lesson=n;
 title.textContent="Lesson "+n;
 modal.style.display="block";
 loadLesson();
}

async function loadLesson(){
 let d=await(await api(`/lesson?course=${COURSE}&lesson=${lesson}&language=${lang.value}`)).json();
 data=d.lesson.dialogues||[];
 title.textContent=d.lesson.title||"Lesson "+lesson;
 dialogues.innerHTML=data.map((x,i)=>{
  let k=lesson+":"+x.dialogue_number;
  return `<div class="dialogue">
  <b>${x.speaker_a}</b><br>${x.text_a}<br><br>
  <b>${x.speaker_b}</b><br>${x.text_b}
  <br><button onclick="play(${i})">▶</button>
  ${done.has(k)?" ✓":""}</div>`;
 }).join("");
 mp.textContent=doneCount()+"/"+data.length+" dialogues completed";
}

function doneCount(){
 return data.filter(x=>done.has(lesson+":"+x.dialogue_number)).length;
}

function speak(t,next){
 let u=new SpeechSynthesisUtterance(t);
 u.onend=next;speechSynthesis.speak(u);
}

async function play(i){
 let x=data[i],k=lesson+":"+x.dialogue_number;
 speechSynthesis.cancel();
 speak(x.text_a,()=>speak(x.text_b,()=>saveDialogue(x.dialogue_number)));
}

function playAll(){
 speechSynthesis.cancel();
 let i=0;
 function next(){
  if(i>=data.length)return;
  let x=data[i++];
  speak(x.text_a,()=>speak(x.text_b,next));
  saveDialogue(x.dialogue_number);
 }
 next();
}

async function saveDialogue(n){
 let k=lesson+":"+n;
 if(done.has(k))return;
 let r=await api("/dialogue/progress",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({course:COURSE,lesson_number:lesson,dialogue_number:n})
 });
 if(r.ok){done.add(k);update();loadLessons();loadLesson();}
}

async function completeLesson(){
 let r=await api("/lesson/complete",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({course:COURSE,lesson_number:lesson})
 });
 if(r.ok){completed.add(lesson);update();loadLessons();closeModal();}
}

function closeModal(){modal.style.display="none";speechSynthesis.cancel()}

function pay(){
 location.href=API+"/pay?course="+COURSE;
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

(async()=>{await progress();await loadLessons()})();
</script>
</body>
</html>
