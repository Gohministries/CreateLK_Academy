<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial;background:#f4f7ff;color:#172033}
button,select{font:inherit}
header{background:linear-gradient(135deg,#111827,#3730a3);color:white;padding:15px 20px}
.head,.wrap{max-width:1000px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}.logo b{color:#fbbf24}
button{border:0;cursor:pointer;border-radius:9px;padding:10px 15px;font-weight:bold}
.logout{background:#ffffff20;color:white}
.wrap{padding:20px 14px 50px}
.hero{padding:38px 20px;text-align:center;color:white;border-radius:22px;background:linear-gradient(135deg,#2563eb,#4338ca)}
.hero h1{font-size:34px;margin:8px}.hero p{opacity:.9}
.badge{display:inline-block;margin-top:15px;padding:8px 14px;border-radius:20px;background:#ffffff20}
.card{background:white;border:1px solid #e2e8f0;border-radius:17px;padding:18px;margin-top:16px;box-shadow:0 5px 20px #1e3a8a10}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-weight:800;color:#172554}
.bar{height:11px;background:#e8edf5;border-radius:20px;overflow:hidden;margin:12px 0 7px}
.fill,.mini div{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.info{font-size:12px;color:#64748b}
.continue{background:#eef4ff}
.primary{background:#2563eb;color:white}
.premium{background:#fff8df;border-color:#f5d77a}
.gold{color:#a16207;font-weight:bold}
.buy{background:#f59e0b;color:white}
.section{text-align:center;margin:28px 0 15px;color:#172554}
#lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lesson{background:white;border:1px solid #dbe4f0;border-radius:14px;padding:15px}
.lesson h3{font-size:15px;margin:6px 0}.num{font-size:10px;color:#2563eb;font-weight:bold}
.mini{height:5px;background:#e8edf5;border-radius:10px;overflow:hidden;margin:12px 0}
.bottom{display:flex;justify-content:space-between;align-items:center}
.free{font-size:10px;color:#16a34a;font-weight:bold}.locked{font-size:10px;color:#d97706;font-weight:bold}
.open{background:#eef2ff;color:#3730a3;padding:8px 11px}
.modalbg{display:none;position:fixed;inset:0;background:#111827cc;padding:12px;overflow:auto;z-index:5}
.modal{max-width:700px;margin:20px auto;background:white;border-radius:18px;overflow:hidden}
.mhead{background:linear-gradient(135deg,#1e3a8a,#4338ca);color:white;padding:20px}
.mbody{padding:17px}.close{float:right;background:#ffffff20;color:white;padding:5px 10px}
.controls{display:flex;gap:7px;margin-bottom:12px}.controls>*{flex:1}
select{padding:10px;border:1px solid #ddd;border-radius:8px}
.play{background:#1e3a8a;color:white}.stop{background:#dc2626;color:white}
.dialogue{padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:9px 0}
.dialogue.played{background:#f0fdf4;border-color:#86efac}
.dialogue.playing{border-color:#2563eb}
.lang{font-size:10px;color:#2563eb;font-weight:bold;margin-top:8px}
.text{line-height:1.5;margin-top:3px}.listen{margin-top:9px;background:#eef2ff;color:#3730a3;padding:8px}
.loading{text-align:center;padding:25px;color:#64748b}
@media(max-width:700px){#lessons{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){#lessons{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}}
</style>
</head>

<body>

<script>
if(!localStorage.getItem("createlk_token"))
location="/auth/login.html";
</script>

<header>
<div class="head">
<div class="logo">CreateLK <b>Academy</b></div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<h1>Spoken English</h1>
<p>Learn English through practical everyday conversations.</p>
<div class="badge">100 Lessons • 2,500 Dialogues</div>
</section>

<section class="card">
<div class="row">
<strong class="title">Your Progress</strong>
<b id="pct">0%</b>
</div>
<div class="bar"><div id="fill" class="fill" style="width:0"></div></div>
<div class="row info">
<span id="total">0 / 2,500 dialogues</span>
<span id="less">0 / 100 lessons</span>
</div>
</section>

<section class="card continue">
<div class="row">
<div>
<small>CONTINUE LEARNING</small>
<h3 id="next">Lesson 1</h3>
<p id="nextp" class="info">0 / 25 dialogues</p>
</div>
<button class="primary" onclick="openLesson(nextLesson())">Continue →</button>
</div>
</section>

<section class="card premium">
<div class="row">
<div>
<strong class="gold">👑 Premium</strong>
<p><b>LKR 999</b> • 30 Days</p>
<small id="premiumStatus">Checking...</small>
</div>
<button id="buy" class="buy" onclick="buyPremium()">GET PREMIUM</button>
</div>
</section>

<h2 class="section">100 Lessons</h2>
<div id="lessons"><div class="loading">Loading...</div></div>

</main>

<div id="modalbg" class="modalbg">
<div class="modal">
<div class="mhead">
<button class="close" onclick="closeLesson()">×</button>
<small id="mnum"></small>
<h2 id="mtitle"></h2>
<p id="mprogress"></p>
</div>
<div class="mbody" id="mbody"></div>
</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev",
PAY="https://createlk-payhere.createlk.workers.dev",
TOKEN=localStorage.getItem("createlk_token"),
COURSE="spoken-english";

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family","Talking About Your Home",
"Daily Routine","Morning Activities","Talking About Your Job","Talking About School","Talking About Friends",
"Asking for Personal Information","Meeting Someone New","Making a Phone Call","Sending a Message",
"Talking About the Time","Talking About the Date","Making Plans","Weekend Plans","Invitations",
"Accepting an Invitation","Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu",
"Paying the Bill","At a Café","Buying Groceries","At a Supermarket","Shopping for Clothes","Asking the Price",
"Returning an Item","At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel","Hotel Problems",
"Talking About Weather","Talking About Hobbies","Sports and Games","Music","Movies and TV","Reading Books",
"Weekend Activities","Holidays","Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms",
"At the Pharmacy","Healthy Habits","Exercise and Fitness","Asking for Help","Offering Help","Giving Advice",
"Asking for Permission","Saying Sorry","Thanking Someone","Compliments","Agreeing and Disagreeing",
"Expressing Opinions","Making Suggestions","Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews","Talking With a Customer",
"Talking With a Manager","Making an Appointment","Office Phone Calls","Meetings","Giving Instructions",
"Asking Questions at Work","Discussing a Project","Talking About Money","Banking","Using an ATM",
"Online Shopping","Using the Internet","Social Media Conversations","Learning English","Practicing English",
"Common English Mistakes","Understanding Fast English","Everyday Expressions","Making Conversation",
"Keeping a Conversation Going","Speaking Politely","Speaking Confidently","Natural English",
"Travel Conversations","Emergency Conversations","Real-Life Situations","Advanced Everyday Conversations",
"Speaking English Confidently"
];

const H={
"Content-Type":"application/json",
"Authorization":"Bearer "+TOKEN
};

let progress=new Set,completed=new Set,premium=false,current=0,data=[],lang="en",playing=false;

const $=x=>document.getElementById(x);

function count(n){
let c=0;
for(let i=1;i<=25;i++)if(progress.has(`${n}:${i}`))c++;
return c;
}

function nextLesson(){
let n=1;
while(n<100&&completed.has(n))n++;
return n;
}

function update(){
let n=progress.size,p=Math.min(100,n/2500*100);
$("pct").textContent=p.toFixed(1)+"%";
$("fill").style.width=p+"%";
$("total").textContent=`${n.toLocaleString()} / 2,500 dialogues`;
$("less").textContent=`${completed.size} / 100 lessons`;
let x=nextLesson();
$("next").textContent=`Lesson ${x} · ${titles[x-1]}`;
$("nextp").textContent=`${count(x)} / 25 dialogues`;
}

async function loadProgress(){
try{
let r=await fetch(`${API}/progress?course=${COURSE}`,{headers:H});
let d=await r.json();
(d.played_dialogues||[]).forEach(x=>progress.add(String(x)));
(d.completed_lessons||[]).forEach(x=>completed.add(+x));
update();
}catch(e){}
}

async function loadLessons(){
try{
let r=await fetch(`${API}/lessons?course=${COURSE}&language=en`,{headers:H}),
d=await r.json();
premium=!!d.premium;
$("premiumStatus").innerHTML=premium?"<b style='color:#15803d'>✓ Active</b>":"Not active";
$("buy").style.display=premium?"none":"block";

$("lessons").innerHTML=titles.map((t,i)=>{
let n=i+1,c=count(n),free=n==1,ok=free||premium,p=Math.round(c/25*100);
return `<article class="lesson">
<div class="num">LESSON ${n}</div>
<h3>${t}</h3>
<div class="mini"><div style="width:${p}%"></div></div>
<div class="bottom">
<small class="${free?'free':'locked'}">${free?'FREE':'PREMIUM'}</small>
<button class="open" onclick="${ok?`openLesson(${n})`:"buyPremium()"}">${ok?'Open':'🔒'}</button>
</div></article>`;
}).join("");
}catch(e){$("lessons").innerHTML="Unable to load lessons."}
}

async function openLesson(n){
stop();current=n;lang="en";
$("modalbg").style.display="block";
$("mnum").textContent=`LESSON ${n}`;
$("mtitle").textContent=titles[n-1];
$("mbody").innerHTML='<div class="loading">Loading dialogues...</div>';

try{
let [a,s,t]=await Promise.all([get(n,"en"),get(n,"si"),get(n,"ta")]);
let A=a.lesson.dialogues,S=s.lesson.dialogues,T=t.lesson.dialogues;

data=A.map((x,i)=>({
number:+x.dialogue_number,
lines:[
["English",x.speaker_a,x.text_a],["English",x.speaker_b,x.text_b],
["Sinhala",S[i]?.speaker_a,S[i]?.text_a],["Sinhala",S[i]?.speaker_b,S[i]?.text_b],
["Tamil",T[i]?.speaker_a,T[i]?.text_a],["Tamil",T[i]?.speaker_b,T[i]?.text_b]
]}));

$("mbody").innerHTML=`
<div class="controls">
<select id="lang" onchange="changeLang()">
<option value="en">English</option>
<option value="ta">English + Tamil</option>
<option value="si">English + Sinhala</option>
</select>
<button class="play" onclick="playAll()">▶ Play All</button>
<button class="stop" onclick="stop()">■ Stop</button>
</div>
<div id="list"></div>`;
render();
}catch(e){$("mbody").innerHTML=`<div class="loading">${e.message}</div>`}
}

async function get(n,l){
let r=await fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=${l}`,{headers:H});
if(!r.ok)throw Error("Unable to load lesson");
return r.json();
}

function allowed(){
return lang=="en"?["English"]:["English",lang=="ta"?"Tamil":"Sinhala"];
}

function render(){
$("list").innerHTML=data.map((d,i)=>{
let done=progress.has(`${current}:${d.number}`);
return `<div class="dialogue ${done?'played':''}" id="d${i}">
<div class="num">DIALOGUE ${d.number} ${done?'✓':''}</div>
${d.lines.map(x=>allowed().includes(x[0])&&x[2]?`
<div class="lang">${x[0]}</div>
<div class="text"><b>${x[1]}:</b> ${x[2]}</div>`:"").join("")}
<button class="listen" onclick="playOne(${i})">🔊 Listen</button>
</div>`;
}).join("");
$("mprogress").textContent=`${count(current)} / 25 dialogues`;
}

function changeLang(){
lang=$("lang").value;stop();render();
}

async function mark(n){
let k=`${current}:${n}`;
if(progress.has(k))return;
progress.add(k);update();render();
try{
await fetch(`${API}/dialogue/progress`,{
method:"POST",headers:H,
body:JSON.stringify({course:COURSE,lesson_number:current,dialogue_number:n})
});
}catch(e){}
if(count(current)==25&&!completed.has(current)){
completed.add(current);
update();
fetch(`${API}/lesson/complete`,{
method:"POST",headers:H,
body:JSON.stringify({course:COURSE,lesson_number:current})
});
}
}

function speak(lines,i,done){
if(!playing||i>=lines.length)return done();
let u=new SpeechSynthesisUtterance(lines[i][2]);
u.lang={English:"en-US",Tamil:"ta-LK",Sinhala:"si-LK"}[lines[i][0]];
u.rate=.88;
u.onend=()=>speak(lines,i+1,done);
u.onerror=()=>speak(lines,i+1,done);
speechSynthesis.speak(u);
}

function playOne(i){
stop();playing=true;
let d=data[i],box=$("d"+i);
box.classList.add("playing");
mark(d.number);
speak(d.lines.filter(x=>allowed().includes(x[0])),0,()=>{
playing=false;box.classList.remove("playing");
});
}

function playAll(){
stop();playing=true;let i=0;
function next(){
if(!playing||i>=data.length){playing=false;return}
playOneChain(i++);
}
function playOneChain(i){
let d=data[i],box=$("d"+i);
box.classList.add("playing");mark(d.number);
speak(d.lines.filter(x=>allowed().includes(x[0])),0,()=>{
box.classList.remove("playing");next();
});
}
next();
}

function stop(){
playing=false;speechSynthesis.cancel();
document.querySelectorAll(".dialogue").forEach(x=>x.classList.remove("playing"));
}

function closeLesson(){stop();$("modalbg").style.display="none"}

async function buyPremium(){
let b=$("buy");b.disabled=true;b.textContent="Loading...";
try{
let r=await fetch(`${PAY}/premium-checkout`,{
method:"POST",headers:H,body:"{}"
}),d=await r.json(),f=d.fields||d.checkout;
let form=document.createElement("form");
form.method="POST";form.action="https://www.payhere.lk/pay/checkout";
Object.entries(f).forEach(([k,v])=>{
let x=document.createElement("input");x.type="hidden";x.name=k;x.value=v;form.appendChild(x)
});
document.body.appendChild(form);form.submit();
}catch(e){alert("Payment could not be started");b.disabled=false;b.textContent="GET PREMIUM"}
}

function logout(){
localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");
location="/auth/login.html";
}

loadProgress();
loadLessons();
</script>
</body>
</html>
