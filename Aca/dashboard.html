<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{
 font-family:Arial,sans-serif;
 background:linear-gradient(180deg,#f8faff,#eef3ff);
 color:#172033
}
header{
 background:linear-gradient(135deg,#111827,#4f46e5);
 color:white;padding:18px 5%;
 display:flex;justify-content:space-between;align-items:center
}
header b{font-size:20px}
button,select{
 border:0;border-radius:10px;padding:11px 15px;
 font-weight:bold;cursor:pointer
}
.logout{background:#fff;color:#312e81}
main{max-width:1100px;margin:auto;padding:25px 15px}
.hero{
 background:linear-gradient(135deg,#4f46e5,#7c3aed);
 color:#fff;border-radius:22px;padding:28px;margin-bottom:18px
}
.hero h1{font-size:34px;margin:8px 0}
.badge{
 display:inline-block;background:#ffffff22;
 padding:7px 12px;border-radius:20px;font-size:13px
}
.card{
 background:white;border-radius:18px;padding:20px;
 margin-bottom:18px;box-shadow:0 8px 25px #0000000b
}
.progress{
 height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;
 margin:12px 0
}
.fill{
 height:100%;width:0;
 background:linear-gradient(90deg,#4f46e5,#9333ea)
}
.lessons{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px
}
.lesson{
 background:#fff;border:1px solid #e5e7eb;border-radius:15px;
 padding:16px;cursor:pointer;transition:.2s
}
.lesson:hover{transform:translateY(-2px);box-shadow:0 7px 20px #0001}
.lesson strong{display:block;margin-bottom:8px}
.meta{font-size:12px;color:#64748b}
.free{color:#16a34a}
.premium{color:#7c3aed}
.completed{color:#16a34a;font-weight:bold}
.modal{
 display:none;position:fixed;inset:0;background:#0008;
 padding:15px;overflow:auto;z-index:10
}
.modalBox{
 max-width:700px;margin:30px auto;background:white;
 border-radius:20px;padding:20px
}
.top{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin-bottom:15px
}
.close{background:#f1f5f9}
.controls{
 display:flex;gap:8px;flex-wrap:wrap;margin:12px 0
}
.play{background:#4f46e5;color:white}
.dialogue{
 border:1px solid #e5e7eb;border-radius:14px;
 padding:14px;margin:10px 0
}
.dialogue.saved{
 border-color:#16a34a;background:#f0fdf4
}
.dialogue.playing{border-color:#4f46e5}
.speaker{
 font-size:12px;color:#6366f1;font-weight:bold;margin-bottom:5px
}
.text{line-height:1.5}
.small{font-size:13px;color:#64748b}
</style>
</head>

<body>

<header>
<b>CreateLK Academy</b>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<section class="hero">
 <span class="badge">100 Lessons • 2,500 Practical Dialogues</span>
 <h1>Spoken English</h1>
 <p>Learn English through practical everyday conversations.</p>
</section>

<section class="card">
 <b>Your Progress</b>
 <div class="progress"><div id="totalFill" class="fill"></div></div>
 <div id="totalText" class="small">0 / 2,500 dialogues • 0 / 100 lessons</div>
</section>

<section class="card">
 <h2>Premium Membership</h2>
 <p class="small" style="margin:8px 0 15px">
  Enjoy an ad-free learning experience for 30 days.
 </p>
 <button onclick="buyPremium()" style="background:#7c3aed;color:white">
  ⭐ Premium – LKR 999 / 30 Days
 </button>
</section>

<section class="card">
 <h2 style="margin-bottom:15px">Lessons</h2>
 <div id="lessons" class="lessons"></div>
</section>

</main>

<div id="modal" class="modal">
<div class="modalBox">

<div class="top">
 <div>
  <h2 id="lessonTitle"></h2>
  <div id="lessonProgress" class="small"></div>
 </div>
 <button class="close" onclick="closeModal()">✕</button>
</div>

<select id="language" onchange="changeLanguage()">
 <option value="en">English Only</option>
 <option value="ta">English → Tamil</option>
 <option value="si">English → Sinhala</option>
</select>

<div class="controls">
 <button id="playBtn" class="play" onclick="playAll()">▶️ Play All</button>
 <button onclick="stopSpeech()">⏹ Stop</button>
 <button onclick="markComplete()">✓ Complete Lesson</button>
</div>

<div id="dialogues"></div>

</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";
const COURSE="spoken-english";
const TOKEN=localStorage.getItem("createlk_token");
const H={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};

if(!TOKEN)location.href="/auth/login.html";

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities","Talking About Your Job",
"Talking About School","Talking About Friends","Asking for Personal Information",
"Meeting Someone New","Making a Phone Call","Sending a Message","Talking About the Time",
"Talking About the Date","Making Plans","Weekend Plans","Invitations","Accepting an Invitation",
"Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu","Paying the Bill",
"At a Café","Buying Groceries","At a Supermarket","Shopping for Clothes","Asking the Price",
"Returning an Item","At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions",
"Finding a Place","At the Train Station","Buying a Ticket","At the Airport",
"Checking Into a Hotel","Hotel Problems","Talking About Weather","Talking About Hobbies",
"Sports and Games","Music","Movies and TV","Reading Books","Weekend Activities","Holidays",
"Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms","At the Pharmacy",
"Healthy Habits","Exercise and Fitness","Asking for Help","Offering Help","Giving Advice",
"Asking for Permission","Saying Sorry","Thanking Someone","Compliments",
"Agreeing and Disagreeing","Expressing Opinions","Making Suggestions","Making Decisions",
"Solving a Problem","Making a Complaint","Apologizing Professionally",
"Workplace Conversations","Job Interviews","Talking With a Customer",
"Talking With a Manager","Making an Appointment","Office Phone Calls","Meetings",
"Giving Instructions","Asking Questions at Work","Discussing a Project","Talking About Money",
"Banking","Using an ATM","Online Shopping","Using the Internet",
"Social Media Conversations","Learning English","Practicing English","Common English Mistakes",
"Understanding Fast English","Everyday Expressions","Making Conversation",
"Keeping a Conversation Going","Speaking Politely","Speaking Confidently","Natural English",
"Travel Conversations","Emergency Conversations","Real-Life Situations",
"Advanced Everyday Conversations","Speaking English Confidently"
];

let premium=false,completed=[],played=new Set();
let dialogues=[],currentLesson=0,playing=false,language="en";

const $=id=>document.getElementById(id);

function normalizePlayed(list){
 const s=new Set();
 (list||[]).forEach(x=>{
  if(typeof x==="string"){
   const m=x.match(/^(\d+):(\d+)$/);
   if(m)s.add(`${+m[1]}:${+m[2]}`);
  }else if(x){
   const l=x.lesson_number??x.lesson??x.lessonNumber;
   const d=x.dialogue_number??x.dialogue??x.dialogueNumber;
   if(l!=null&&d!=null)s.add(`${+l}:${+d}`);
  }
 });
 return s;
}

async function loadProgress(){
 try{
  const r=await fetch(`${API}/progress?course=${COURSE}`,{headers:H,cache:"no-store"});
  if(r.status===401)return logout();
  const d=await r.json();

  premium=!!d.premium;
  completed=(d.completed_lessons||[]).map(Number);
  played=normalizePlayed(d.played_dialogues||[]);

  updateProgress();
  renderLessons();
 }catch(e){console.log(e)}
}

function lessonProgress(n){
 let c=0,p=`${n}:`;
 for(const x of played)if(x.startsWith(p))c++;
 return Math.min(25,c);
}

function updateProgress(){
 const n=played.size;
 $("totalFill").style.width=Math.min(100,n/25)+"%";
 $("totalText").textContent=
 `${n.toLocaleString()} / 2,500 dialogues • ${completed.length} / 100 lessons`;
 if(currentLesson)$("lessonProgress").textContent=
 `${lessonProgress(currentLesson)} / 25 dialogues`;
}

function renderLessons(){
 $("lessons").innerHTML=titles.map((t,i)=>{
  const n=i+1,p=lessonProgress(n),done=completed.includes(n);
  const free=n<=5;
  const locked=!premium&&!free;

  return `
  <article class="lesson" onclick="openLesson(${n})">
   <strong>${n}. ${t}</strong>
   <div class="meta">
    ${done?'<span class="completed">✓ COMPLETED</span>':
      locked?'<span class="premium">🔒 PREMIUM</span>':
      '<span class="free">FREE</span>'}
   </div>
   <div class="progress"><div class="fill" style="width:${p*4}%"></div></div>
   <div class="meta">${p} / 25 dialogues</div>
  </article>`;
 }).join("");
}

async function openLesson(n){
 const free=n<=5;
 if(!premium&&!free){
  buyPremium();
  return;
 }

 currentLesson=n;
 language=$("language").value="en";
 $("lessonTitle").textContent=`Lesson ${n}: ${titles[n-1]}`;
 $("modal").style.display="block";
 $("dialogues").innerHTML='<p class="small">Loading...</p>';

 try{
  const [en,ta,si]=await Promise.all([
   fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=en`,{headers:H}),
   fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=ta`,{headers:H}),
   fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=si`,{headers:H})
  ]);

  if([en,ta,si].some(r=>r.status===401))return logout();

  const e=await en.json(),t=await ta.json(),s=await si.json();
  const E=e.dialogues||e.lessons||e;
  const T=t.dialogues||t.lessons||t;
  const S=s.dialogues||s.lessons||s;

  dialogues=(Array.isArray(E)?E:[]).map((x,i)=>({
   number:x.number??i+1,
   speaker:x.speaker||x.role||"",
   en:x.text||x.english||"",
   ta:T[i]?.text||T[i]?.tamil||"",
   si:S[i]?.text||S[i]?.sinhala||""
  }));

  renderDialogues();
 }catch(e){
  $("dialogues").innerHTML='<p class="small">Unable to load lesson.</p>';
 }
}

function renderDialogues(){
 $("lessonProgress").textContent=`${lessonProgress(currentLesson)} / 25 dialogues`;

 $("dialogues").innerHTML=dialogues.map((d,i)=>{
  const key=`${currentLesson}:${d.number}`;
  let text=d.en;
  if(language==="ta")text+=d.ta?`<br><br>🇱🇰 ${d.ta}`:"";
  if(language==="si")text+=d.si?`<br><br>🇱🇰 ${d.si}`:"";

  return `
  <div id="d${i}" class="dialogue ${played.has(key)?"saved":""}">
   <div class="speaker">${d.speaker}</div>
   <div class="text">${text}</div>
   <button onclick="speakOne(${i})" style="margin-top:10px">🔊</button>
  </div>`;
 }).join("");
}

function changeLanguage(){
 stopSpeech();
 renderDialogues();
}

function speakOne(i){
 stopSpeech();
 speechSynthesis.speak(new SpeechSynthesisUtterance(dialogues[i].en));
}

function speak(lines,i,done){
 if(!playing||i>=lines.length){done?.(false);return}

 const u=new SpeechSynthesisUtterance(lines[i]);
 u.onend=()=>done?.(true);
 speechSynthesis.speak(u);
}

function playAll(){
 if(playing){stopSpeech();return}

 playing=true;
 $("playBtn").textContent="⏸️ Playing...";

 let i=0;

 const next=()=>{
  if(!playing||i>=dialogues.length){
   playing=false;
   $("playBtn").textContent="▶️ Play All";
   return;
  }

  const d=dialogues[i],box=$("d"+i);
  document.querySelectorAll(".dialogue.playing")
   .forEach(x=>x.classList.remove("playing"));
  box?.classList.add("playing");

  const lines=[d.en];
  if(language==="ta"&&d.ta)lines.push(d.ta);
  if(language==="si"&&d.si)lines.push(d.si);

  speak(lines,0,()=>{
   if(!playing)return;
   saveDialogue(d.number);
   box?.classList.remove("playing");
   i++;
   next();
  });
 };

 next();
}

function stopSpeech(){
 playing=false;
 speechSynthesis.cancel();
 $("playBtn").textContent="▶️ Play All";
 document.querySelectorAll(".dialogue.playing")
  .forEach(x=>x.classList.remove("playing"));
}

async function saveDialogue(n){
 const key=`${currentLesson}:${n}`;
 if(played.has(key))return;

 played.add(key);
 updateProgress();
 renderLessons();

 const i=dialogues.findIndex(x=>+x.number===+n);
 $("d"+i)?.classList.add("saved");

 try{
  const r=await fetch(`${API}/dialogue/progress`,{
   method:"POST",headers:H,
   body:JSON.stringify({
    course:COURSE,
    lesson_number:+currentLesson,
    dialogue_number:+n
   })
  });

  if(r.status===401)return logout();

  if(!r.ok){
   played.delete(key);
   updateProgress();
   renderLessons();
   $("d"+i)?.classList.remove("saved");
   return;
  }

  if(lessonProgress(currentLesson)>=25)
   await completeLesson(currentLesson,true);

 }catch(e){
  played.delete(key);
  updateProgress();
  renderLessons();
  $("d"+i)?.classList.remove("saved");
 }
}

async function completeLesson(n,auto=false){
 if(completed.includes(n))return;

 try{
  const r=await fetch(`${API}/lesson/complete`,{
   method:"POST",headers:H,
   body:JSON.stringify({course:COURSE,lesson:+n})
  });

  if(r.status===401)return logout();
  if(!r.ok)return;

  completed.push(+n);
  completed.sort((a,b)=>a-b);
  updateProgress();
  renderLessons();

  if(!auto)closeModal();
 }catch(e){console.log(e)}
}

function markComplete(){
 completeLesson(currentLesson);
}

function closeModal(){
 stopSpeech();
 $("modal").style.display="none";
}

async function buyPremium(){
 try{
  const r=await fetch(`${PAY}/premium-checkout`,{
   method:"POST",headers:H,body:"{}"
  });
  if(r.status===401)return logout();

  const d=await r.json();
  if(!d.url){
   alert("Unable to start payment.");
   return;
  }

  const f=document.createElement("form");
  f.method="POST";
  f.action="https://www.payhere.lk/pay/checkout";

  Object.entries(d).forEach(([k,v])=>{
   const i=document.createElement("input");
   i.type="hidden";i.name=k;i.value=v;
   f.appendChild(i);
  });

  document.body.appendChild(f);
  f.submit();
 }catch(e){
  alert("Payment error.");
 }
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

loadProgress();
</script>

</body>
</html>
