<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | CreateLK Academy</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fc;
    color:#172033;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;

    background:#fff;

    border:1px solid #e5e9f0;
    border-radius:20px;

    padding:32px;

    box-shadow:
        0 15px 45px rgba(15,23,42,.08);
}


/* LOGO */

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:70px;
    height:70px;

    object-fit:contain;
}


/* TITLES */

h1{
    text-align:center;

    font-size:27px;

    color:#172554;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    color:#64748b;

    font-size:14px;

    line-height:1.6;

    margin-bottom:25px;
}


/* NOTICE */

.notice{
    display:none;

    padding:12px 14px;

    border-radius:10px;

    margin-bottom:18px;

    font-size:13px;

    line-height:1.5;
}

.notice.show{
    display:block;
}

.notice.error{
    background:#fff1f1;

    border:1px solid #ffd0d0;

    color:#b42318;
}

.notice.success{
    background:#effdf4;

    border:1px solid #bbf7d0;

    color:#15803d;
}


/* INPUTS */

.input-group{
    margin-bottom:17px;
}

label{
    display:block;

    font-size:13px;

    font-weight:800;

    color:#334155;

    margin-bottom:7px;
}

.optional{
    font-weight:400;

    color:#94a3b8;
}

input{
    width:100%;

    padding:13px 14px;

    border:1px solid #d8dee8;

    border-radius:10px;

    outline:none;

    font-size:14px;

    background:#fff;

    color:#172033;

    transition:.2s;
}

input:focus{
    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.08);
}


/* BUTTON */

.main-btn{
    width:100%;

    border:0;

    background:#2563eb;

    color:#fff;

    padding:14px;

    border-radius:10px;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.main-btn:hover{
    background:#1d4ed8;
}

.main-btn:disabled{
    opacity:.65;

    cursor:not-allowed;
}


/* SWITCH */

.switch{
    text-align:center;

    margin-top:20px;

    font-size:13px;

    color:#64748b;
}

.switch a{
    color:#2563eb;

    font-weight:800;

    text-decoration:none;

    cursor:pointer;
}


/* BACK */

.back{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:12px;

    text-decoration:none;
}


/* HIDDEN */

.hidden{
    display:none;
}

</style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK Academy">

    </div>


    <!-- ================================================= -->
    <!-- LOGIN -->
    <!-- ================================================= -->

    <div id="loginView">


        <h1>
            Welcome Back
        </h1>


        <div class="subtitle">

            Sign in to continue learning
            with CreateLK Academy.

        </div>


        <div
        id="loginNotice"
        class="notice">
        </div>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                type="email"
                id="loginEmail"
                autocomplete="email"
                placeholder="Enter your email"
                required>

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                placeholder="Enter your password"
                required>

            </div>


            <!-- LOGIN BUTTON -->

            <button
            type="submit"
            id="loginButton"
            class="main-btn">

                Login

            </button>


        </form>


        <div class="switch">

            Don't have an account?

            <a onclick="showRegister()">
                Create Account
            </a>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- REGISTER -->
    <!-- ================================================= -->

    <div
    id="registerView"
    class="hidden">


        <h1>
            Create Account
        </h1>


        <div class="subtitle">

            Create your CreateLK Academy
            student account.

        </div>


        <div
        id="registerNotice"
        class="notice">
        </div>


        <form id="registerForm">


            <!-- FIRST NAME -->

            <div class="input-group">

                <label for="registerFirstName">
                    First Name
                </label>

                <input
                type="text"
                id="registerFirstName"
                autocomplete="given-name"
                placeholder="Enter your first name"
                required>

            </div>


            <!-- LAST NAME -->

            <div class="input-group">

                <label for="registerLastName">
                    Last Name
                    <span class="optional">
                        (Optional)
                    </span>
                </label>

                <input
                type="text"
                id="registerLastName"
                autocomplete="family-name"
                placeholder="Enter your last name">

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                type="email"
                id="registerEmail"
                autocomplete="email"
                placeholder="Enter your email"
                required>

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="registerPhone">

                    Phone Number

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <input
                type="tel"
                id="registerPhone"
                autocomplete="tel"
                placeholder="Enter your phone number">

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                type="password"
                id="registerPassword"
                autocomplete="new-password"
                placeholder="Create a password"
                minlength="6"
                required>

            </div>


            <!-- REGISTER BUTTON -->

            <button
            type="submit"
            id="registerButton"
            class="main-btn">

                Create Account

            </button>


        </form>


        <div class="switch">

            Already have an account?

            <a onclick="showLogin()">
                Login
            </a>

        </div>


    </div>


    <!-- BACK -->

    <a
    href="/"
    class="back">

        ← Back to CreateLK Academy

    </a>


</div>



<script>


/* =====================================================
   API
   ===================================================== */

const API =
"https://createlk-auth-api.createlk.workers.dev";


/* =====================================================
   REDIRECT
   ===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


/*
 * Keep the original requested page.
 *
 * Example:
 *
 * /login.html?redirect=/Aca/course.html
 *
 * After login:
 *
 * /Aca/course.html
 */

const redirect =
params.get("redirect") ||
"/Aca/dashboard.html";


/* =====================================================
   VIEW SWITCHING
   ===================================================== */

function showLogin(){

    document
    .getElementById("loginView")
    .classList.remove("hidden");

    document
    .getElementById("registerView")
    .classList.add("hidden");

}


function showRegister(){

    document
    .getElementById("loginView")
    .classList.add("hidden");

    document
    .getElementById("registerView")
    .classList.remove("hidden");

}


/* =====================================================
   NOTICE
   ===================================================== */

function notice(
    id,
    message,
    type
){

    const box =
    document.getElementById(id);

    box.textContent = message;

    box.className =
        "notice show " + type;

}


/* =====================================================
   LOGIN
   ===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
        document.getElementById(
            "loginButton"
        );


        const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


        const password =
        document.getElementById(
            "loginPassword"
        ).value;


        /*
         * Clear previous notice
         */

        document.getElementById(
            "loginNotice"
        ).className = "notice";


        button.disabled = true;

        button.textContent =
            "Signing in...";


        try{


            /* SEND LOGIN REQUEST */

            const response =
            await fetch(
                API + "/auth/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        email:email,

                        password:password

                    })
                }
            );


            /*
             * Read response
             */

            const data =
            await response.json();


            /*
             * API error
             */

            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Login failed."
                );

            }


            /*
             * Make sure token exists
             */

            if(
                !data.success ||
                !data.token
            ){

                throw new Error(
                    data.error ||
                    "Login was unsuccessful."
                );

            }


            /*
             * SAVE TOKEN
             */

            localStorage.setItem(
                "createlk_token",
                data.token
            );


            /*
             * SAVE CUSTOMER
             */

            if(data.customer){

                localStorage.setItem(
                    "createlk_customer",
                    JSON.stringify(
                        data.customer
                    )
                );

            }


            /*
             * Confirm token was saved
             */

            const savedToken =
            localStorage.getItem(
                "createlk_token"
            );


            if(
                !savedToken ||
                savedToken !== data.token
            ){

                throw new Error(
                    "Login session could not be saved."
                );

            }


            /*
             * REDIRECT
             */

            window.location.replace(
                redirect
            );


        }catch(error){


            console.error(
                "Login error:",
                error
            );


            notice(
                "loginNotice",

                error.message ||
                "Unable to login.",

                "error"
            );


            button.disabled = false;

            button.textContent =
                "Login";

        }

    }
);


/* =====================================================
   REGISTER
   ===================================================== */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
        document.getElementById(
            "registerButton"
        );


        const firstName =
        document.getElementById(
            "registerFirstName"
        ).value.trim();


        const lastName =
        document.getElementById(
            "registerLastName"
        ).value.trim();


        const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


        const phone =
        document.getElementById(
            "registerPhone"
        ).value.trim();


        const password =
        document.getElementById(
            "registerPassword"
        ).value;


        /*
         * VALIDATION
         */

        if(!firstName){

            notice(
                "registerNotice",
                "First name is required.",
                "error"
            );

            return;

        }


        if(!email){

            notice(
                "registerNotice",
                "Email address is required.",
                "error"
            );

            return;

        }


        if(!password){

            notice(
                "registerNotice",
                "Password is required.",
                "error"
            );

            return;

        }


        if(password.length < 6){

            notice(
                "registerNotice",
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try{


            /*
             * IMPORTANT
             *
             * Your Cloudflare Worker expects:
             *
             * first_name
             * last_name
             * email
             * phone
             * password
             *
             * NOT:
             *
             * firstName
             */

            const payload = {

                first_name:firstName,

                last_name:lastName,

                email:email,

                phone:phone,

                password:password

            };


            /*
             * SEND REGISTER REQUEST
             */

            const response =
            await fetch(
                API + "/auth/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify(
                        payload
                    )
                }
            );


            /*
             * Read response
             */

            const data =
            await response.json();


            /*
             * API error
             */

            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Registration failed."
                );

            }


            /*
             * Registration should return
             * a token according to your Worker.
             */

            if(
                data.success &&
                data.token
            ){


                /*
                 * SAVE TOKEN
                 */

                localStorage.setItem(
                    "createlk_token",
                    data.token
                );


                /*
                 * SAVE CUSTOMER
                 */

                if(data.customer){

                    localStorage.setItem(
                        "createlk_customer",
                        JSON.stringify(
                            data.customer
                        )
                    );

                }


                /*
                 * REDIRECT TO DASHBOARD
                 */

                window.location.replace(
                    redirect
                );

                return;

            }


            /*
             * Registration succeeded but
             * no token was returned.
             */

            notice(
                "registerNotice",

                "Account created successfully. Please login.",

                "success"
            );


            /*
             * Return to login
             */

            setTimeout(
                function(){

                    showLogin();

                    document.getElementById(
                        "loginEmail"
                    ).value = email;

                },
                1000
            );


        }catch(error){


            console.error(
                "Register error:",
                error
            );


            notice(
                "registerNotice",

                error.message ||
                "Unable to create account.",

                "error"
            );


            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    }
);


/* =====================================================
   AUTO SHOW REGISTER
   ===================================================== */

/*
 * If URL contains:
 *
 * ?register=1
 *
 * automatically show registration.
 */

if(
    params.get("register") === "1"
){

    showRegister();

}


/* =====================================================
   CLEAR OLD LOGIN NOTICE
   ===================================================== */

document
.getElementById("loginEmail")
.addEventListener(
    "input",
    function(){

        document.getElementById(
            "loginNotice"
        ).className = "notice";

    }
);


document
.getElementById("loginPassword")
.addEventListener(
    "input",
    function(){

        document.getElementById(
            "loginNotice"
        ).className = "notice";

    }
);


</script>

</body>
</html>
