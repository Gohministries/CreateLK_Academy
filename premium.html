<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Membership | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:520px;
margin:30px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
margin:0 0 8px;
font-size:25px;
}

.subtitle{
color:#667085;
font-size:14px;
line-height:1.6;
margin-bottom:22px;
}

.price{
background:#eef4ff;
border-radius:12px;
padding:18px;
margin-bottom:20px;
}

.price strong{
font-size:28px;
color:#155eef;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

input{
width:100%;
height:48px;
border:1px solid #d9dee8;
border-radius:9px;
padding:0 13px;
font-size:14px;
margin-bottom:16px;
outline:none;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

input[type=file]{
height:auto;
padding:12px;
}

.submit{
width:100%;
height:50px;
border:0;
border-radius:10px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

.submit:disabled{
opacity:.65;
cursor:not-allowed;
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:10px;
font-size:13px;
line-height:1.6;
}

.success{
display:block;
background:#f0fdf4;
border:1px solid #bbf7d0;
color:#166534;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.status{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f8fafc;
border:1px solid #eaecf0;
display:none;
}

.status strong{
display:block;
margin-bottom:5px;
}

.back{
display:inline-block;
margin-top:18px;
color:#155eef;
text-decoration:none;
font-size:14px;
font-weight:700;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>⭐ Premium Membership</h1>

<p class="subtitle">
Unlock AI English MCQ practice and premium learning features.
</p>

<div class="price">
<div>Membership Price</div>

<strong>LKR 1,500</strong>

<div style="margin-top:5px;color:#667085;font-size:13px;">
30 Days Premium Membership
</div>
</div>

<div id="studentDetails"
style="font-size:13px;line-height:1.7;margin-bottom:20px;color:#475467;">
Checking account...
</div>

<form id="paymentForm">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="email"
required
readonly>

<label for="reference">
Payment Reference
</label>

<input
type="text"
id="reference"
name="payment_reference"
placeholder="Bank / PayHere transaction reference"
required>

<label for="receipt">
Payment Receipt
</label>

<input
type="file"
id="receipt"
name="receipt"
accept=".jpg,.jpeg,.png,.webp,.pdf"
required>

<div style="font-size:12px;color:#667085;margin-top:-8px;margin-bottom:18px;">
JPG, PNG, WEBP or PDF — Maximum 10 MB
</div>

<button
type="submit"
id="submitButton"
class="submit">

Submit Payment

</button>

</form>

<div id="message" class="message"></div>

<div id="statusBox" class="status">

<strong>Payment Status</strong>

<span id="statusText">
Checking...
</span>

</div>

<a href="dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

</div>

<script>

/* =====================================================
   CREATE LK ACADEMY V2 PREMIUM
   SAME LOGIN SESSION AS login-v2.html
===================================================== */

const MEMBERSHIP_API =
"https://createlk-academy-v2-api.createlk.workers.dev";

const PAYMENT_API =
"https://createlk-v2-payment.createlk.workers.dev";


/* =====================================================
   GET STUDENT
===================================================== */

function getStudent(){

const raw =
sessionStorage.getItem("createlk_student") ||
localStorage.getItem("createlk_student");

if(!raw){
return null;
}

try{

return JSON.parse(raw);

}catch(error){

return null;

}

}


/* =====================================================
   GET TOKEN
===================================================== */

function getToken(){

return (
sessionStorage.getItem("createlk_student_token") ||
sessionStorage.getItem("createlk_token") ||
localStorage.getItem("createlk_student_token") ||
localStorage.getItem("createlk_token") ||
""
);

}


/* =====================================================
   CHECK LOGIN
===================================================== */

function isLoggedIn(){

return (
sessionStorage.getItem("createlk_v2_logged_in") === "true" ||
sessionStorage.getItem("createlk_logged_in") === "true" ||
localStorage.getItem("createlk_v2_logged_in") === "true" ||
localStorage.getItem("createlk_logged_in") === "true"
);

}


/* =====================================================
   STUDENT
===================================================== */

const student =
getStudent();

const token =
getToken();


if(!student || !isLoggedIn()){

window.location.replace(
"login-v2.html"
);

}else{

initializePremium();

}


/* =====================================================
   INITIALIZE
===================================================== */

function initializePremium(){

const first =
student.first_name ||
student.firstName ||
"";

const last =
student.last_name ||
student.lastName ||
"";

const email =
student.email ||
"";

const phone =
student.phone ||
"";

const studentId =
student.id ||
student.student_id ||
student.user_id ||
"";


document.getElementById(
"studentDetails"
).innerHTML =

"<strong>Student:</strong> " +
escapeHTML(
(first + " " + last).trim()
) +

"<br>" +

"<strong>Email:</strong> " +
escapeHTML(email) +

(phone
?
"<br><strong>Phone:</strong> " +
escapeHTML(phone)
:
"");


document.getElementById(
"email"
).value =
email;


/*
   IMPORTANT:
   Check Premium FIRST.

   ACTIVE → MCQ
   NOT ACTIVE → stay on payment page
*/

checkMembership(studentId);

}


/* =====================================================
   MEMBERSHIP CHECK
===================================================== */

async function checkMembership(studentId){

if(!studentId){

showMessage(
"Student account information is missing. Please login again.",
"error"
);

return;

}


try{

const headers = {
"Accept":"application/json"
};


if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

MEMBERSHIP_API +
"/api/v2/membership?student_id=" +
encodeURIComponent(studentId),

{
method:"GET",
headers:headers
}

);


const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

console.error(
"MEMBERSHIP RESPONSE:",
text
);

throw new Error(
"Invalid membership response."
);

}


if(!response.ok){

showPaymentPage();

return;

}


const status =
String(
data.status || ""
).trim().toLowerCase();


const active =
data.active === true ||
data.membership_active === true ||
status === "active";


/*
   ACTIVE
   → GO DIRECTLY TO MCQ
*/

if(active){

window.location.replace(
"mcq.html"
);

return;

}


/*
   NOT ACTIVE
   → PAYMENT PAGE
*/

showPaymentPage();


}catch(error){

console.error(
"Membership check error:",
error
);

/*
   If membership check fails,
   do NOT falsely send student to MCQ.
   Show payment page.
*/

showPaymentPage();

}

}


/* =====================================================
   SHOW PAYMENT PAGE
===================================================== */

function showPaymentPage(){

document.getElementById(
"paymentForm"
).style.display =
"block";

showMessage(
"Premium membership is not active. You can submit your payment below.",
"info"
);

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =====================================================
   PAYMENT SUBMISSION
===================================================== */

document.getElementById(
"paymentForm"
).addEventListener(
"submit",
async function(event){

event.preventDefault();


const button =
document.getElementById(
"submitButton"
);


const email =
document.getElementById(
"email"
).value.trim();


const reference =
document.getElementById(
"reference"
).value.trim();


const receipt =
document.getElementById(
"receipt"
).files[0];


const studentId =
Number(
student.id ||
student.student_id ||
student.user_id
);


if(!studentId){

showMessage(
"Student account information is missing. Please login again.",
"error"
);

return;

}


if(!reference){

showMessage(
"Please enter your payment reference.",
"error"
);

return;

}


if(!receipt){

showMessage(
"Please upload your payment receipt.",
"error"
);

return;

}


if(
receipt.size >
10 * 1024 * 1024
){

showMessage(
"Receipt must be smaller than 10 MB.",
"error"
);

return;

}


/* =====================================================
   FORM DATA
===================================================== */

const formData =
new FormData();


formData.append(
"student_id",
String(studentId)
);

formData.append(
"email",
email
);

formData.append(
"amount",
"1500"
);

formData.append(
"payment_reference",
reference
);

formData.append(
"receipt",
receipt
);


/* =====================================================
   SUBMIT
===================================================== */

button.disabled =
true;

button.textContent =
"Submitting...";


showMessage(
"Uploading your payment receipt. Please wait...",
"info"
);


try{

const response =
await fetch(

PAYMENT_API +
"/api/v2/payment",

{
method:"POST",

headers: token
?
{
"Authorization":
"Bearer " + token
}
:
{},

body:formData

}

);


const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

console.error(
"PAYMENT RAW RESPONSE:",
text
);

throw new Error(
"Invalid response from payment server."
);

}


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Payment submission failed."
);

}


/* =====================================================
   SUCCESS
===================================================== */

showMessage(
"✅ Payment submitted successfully. Your payment is now pending approval.",
"success"
);


document.getElementById(
"reference"
).value =
"";

document.getElementById(
"receipt"
).value =
"";


button.textContent =
"Payment Submitted";


loadPaymentStatus(
studentId
);

}catch(error){

console.error(
"PAYMENT ERROR:",
error
);

showMessage(
error.message ||
"Unable to submit payment. Please try again.",
"error"
);

button.disabled =
false;

button.textContent =
"Submit Payment";

}

});


/* =====================================================
   PAYMENT STATUS
===================================================== */

async function loadPaymentStatus(studentId){

try{

const headers = {
"Accept":"application/json"
};

if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

PAYMENT_API +
"/api/v2/payment-status?student_id=" +
encodeURIComponent(studentId),

{
method:"GET",
headers:headers
}

);


if(!response.ok){
return;
}


const data =
await response.json();


if(data.success !== true){
return;
}


const payments =
Array.isArray(data.payments)
?
data.payments
:
[];


if(!payments.length){
return;
}


const latest =
payments[0];


const status =
String(
latest.status ||
"PENDING"
).toUpperCase();


const box =
document.getElementById(
"statusBox"
);

const text =
document.getElementById(
"statusText"
);


box.style.display =
"block";


if(status === "APPROVED"){

text.textContent =
"✅ Approved — Premium membership is active.";

/*
   Approved → MCQ
*/

setTimeout(
function(){

window.location.replace(
"mcq.html"
);

},
1000
);


}else if(status === "REJECTED"){

text.textContent =
"❌ Rejected — Please submit a new payment.";


}else{

text.textContent =
"⏳ Pending — Your payment is waiting for administrator approval.";

}

}catch(error){

console.error(
"Payment status error:",
error
);

}

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
