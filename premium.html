<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Membership | CreateLK Academy</title>

<script src="https://www.payhere.lk/lib/payhere.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb
}

.nav{
max-width:700px;
margin:auto;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef
}

.back{
text-decoration:none;
color:#475467;
font-size:13px;
font-weight:700
}

.container{
max-width:600px;
margin:30px auto;
padding:0 15px 50px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
text-align:center
}

.icon{
width:65px;
height:65px;
margin:auto;
border-radius:17px;
background:#fff7d6;
display:flex;
align-items:center;
justify-content:center;
font-size:32px
}

h1{
font-size:25px;
margin:15px 0 8px
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.5;
margin-bottom:25px
}

.price{
font-size:32px;
font-weight:900;
color:#155eef;
margin:10px 0
}

.plan{
font-size:13px;
color:#667085;
margin-bottom:25px
}

.info{
text-align:left;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
padding:16px;
margin-bottom:20px
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:7px 0;
font-size:13px
}

.row span:first-child{
color:#667085
}

.row span:last-child{
font-weight:700;
text-align:right
}

.pay{
width:100%;
height:50px;
border:0;
border-radius:10px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer
}

.pay:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:10px;
font-size:13px;
line-height:1.5
}

.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c
}

.note{
margin-top:15px;
font-size:11px;
color:#98a2b3
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>

<main class="container">

<div class="card">

<div class="icon">⭐</div>

<h1>Premium Membership</h1>

<div class="subtitle">
Unlock premium English learning features and AI English MCQ practice.
</div>

<div class="price">
LKR 1,500
</div>

<div class="plan">
30-Day Premium Membership
</div>

<div class="info">

<div class="row">
<span>Student</span>
<span id="studentName">Loading...</span>
</div>

<div class="row">
<span>Email</span>
<span id="studentEmail">Loading...</span>
</div>

<div class="row">
<span>Membership</span>
<span>30 Days</span>
</div>

</div>

<button
id="payButton"
class="pay"
type="button">
⭐ Pay LKR 1,500 with PayHere
</button>

<div
id="message"
class="message">
</div>

<div class="note">
Secure payment powered by PayHere.
</div>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

const API =
"https://createlk-academy-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";

let student = null;

try{
student = JSON.parse(
sessionStorage.getItem(STUDENT_KEY) || "null"
);
}catch(e){
student = null;
}

if(
!student ||
sessionStorage.getItem(LOGIN_KEY) !== "true"
){
window.location.href = "login.html";
}

const studentId =
student?.id || student?.student_id;

if(!studentId){
window.location.href = "login.html";
}

const name =
[
student?.first_name,
student?.last_name
].filter(Boolean).join(" ");

document.getElementById(
"studentName"
).textContent =
name || "Student";

document.getElementById(
"studentEmail"
).textContent =
student?.email || "";

const payButton =
document.getElementById("payButton");

const message =
document.getElementById("message");

function showMessage(text,type){

message.textContent = text;
message.className =
"message " + type;

}

payhere.onCompleted =
function(orderId){

showMessage(
"Payment completed. Your membership will be activated after PayHere confirms the payment.",
"success"
);

setTimeout(function(){
window.location.href =
"dashboard.html";
},2500);

};

payhere.onDismissed =
function(){

payButton.disabled = false;

payButton.textContent =
"⭐ Pay LKR 1,500 with PayHere";

};

payhere.onError =
function(error){

payButton.disabled = false;

payButton.textContent =
"⭐ Pay LKR 1,500 with PayHere";

showMessage(
"PayHere error: " + error,
"error"
);

};

payButton.onclick =
async function(){

payButton.disabled = true;

payButton.textContent =
"Connecting to PayHere...";

message.className =
"message";

try{

const response =
await fetch(
API + "/api/payhere/create",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
student_id:Number(studentId)
})
}
);

const data =
await response.json();

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to create payment."
);

}

const payment = {

sandbox:true,

merchant_id:
data.merchant_id,

return_url:
data.return_url,

cancel_url:
data.cancel_url,

notify_url:
data.notify_url,

order_id:
data.order_id,

items:
data.items,

amount:
data.amount,

currency:
data.currency,

hash:
data.hash,

first_name:
data.first_name,

last_name:
data.last_name,

email:
data.email,

phone:
data.phone || "",

address:
data.address || "Sri Lanka",

city:
data.city || "Nuwara Eliya",

country:
data.country || "Sri Lanka"

};

payhere.startPayment(payment);

}catch(error){

console.error(error);

payButton.disabled = false;

payButton.textContent =
"⭐ Pay LKR 1,500 with PayHere";

showMessage(
error.message ||
"Unable to start PayHere payment.",
"error"
);

}

};

</script>

</body>
</html>
