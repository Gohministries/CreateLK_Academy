<head>

<title>Premium Membership | CreateLK Academy</title>

}

.nav{

padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
}

.back{

color:#475467;

font-weight:700;
}

.container{

margin:auto;
padding:35px 20px;
}

.card{

}

.icon{

margin-bottom:15px;
}

h1{

margin-bottom:10px;
}

.subtitle{
color:#667085;
font-size:14px;
line-height:1.6;
margin-bottom:25px;
}

.account{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px;
font-size:13px;
line-height:1.7;
text-align:left;
margin-bottom:20px;
}

.status{
padding:12px;
border-radius:9px;
font-size:14px;
font-weight:700;
margin-bottom:20px;
}

.loading{
background:#eef4ff;
color:#155eef;
}

.active{
background:#ecfdf3;
color:#067647;
}

.pending{
background:#fffaeb;
color:#b54708;
}

.locked{
background:#fef3f2;
color:#b42318;
}

.btn{
display:block;
width:100%;
padding:13px;
border-radius:9px;
text-decoration:none;
font-weight:800;
color:#fff;
background:#155eef;
margin-top:12px;
}

.btn.green{
background:#16a34a;
}

.btn.orange{
background:#d97706;
}

}

footer{
text-align:center;
padding:30px;

}

@media(max-width:600px){

}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>

<main class="container">

<div class="card">

<div class="icon">
⭐
</div>

<h1>
Premium Membership
</h1>

<p class="subtitle">
Unlock AI English MCQ practice and premium learning features.
</p>

<div id="account" class="account">
Checking your login...
</div>

<div id="status" class="status loading">
Checking login...
</div>

<div id="action">
</div>

<div id="message" class="message">
</div>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

/* =========================================
   SAME LOGIN SYSTEM AS DASHBOARD
========================================= */

const STUDENT_KEY =
"createlk_student";

const TOKEN_KEY =
"createlk_student_token";

const TOKEN_KEY_2 =
"createlk_token";

const LOGIN_KEY =
"createlk_logged_in";

const V2_LOGIN_KEY =
"createlk_v2_logged_in";


/* =========================================
   SAME V2 API
========================================= */

const API =
"https://createlk-v2-membership.createlk.workers.dev";


const MEMBERSHIP_URL =
API + "/api/v2/membership";


/* =========================================
   GET STUDENT
   SESSION FIRST, LOCAL BACKUP
========================================= */

function getStudent(){

const raw =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!raw) return null;

try{

return JSON.parse(raw);

}catch(error){

return null;

}

}


/* =========================================
   GET TOKEN
   SAME KEYS USED BY LOGIN
========================================= */

function getToken(){

return (
sessionStorage.getItem(TOKEN_KEY) ||
sessionStorage.getItem(TOKEN_KEY_2) ||
localStorage.getItem(TOKEN_KEY) ||
localStorage.getItem(TOKEN_KEY_2) ||
""
);

}


/* =========================================
   CHECK LOGIN
========================================= */

function isLoggedIn(){

return (
sessionStorage.getItem(LOGIN_KEY) === "true" ||
localStorage.getItem(LOGIN_KEY) === "true" ||
sessionStorage.getItem(V2_LOGIN_KEY) === "true" ||
localStorage.getItem(V2_LOGIN_KEY) === "true"
);

}


/* =========================================
   START
========================================= */

const student =
getStudent();

const token =
getToken();


if(!student || !isLoggedIn()){

window.location.replace(
"login-v2.html"
);

}else{

showAccount();

checkMembership();

}


/* =========================================
   ACCOUNT
========================================= */

function showAccount(){

const first =
student.first_name ||
student.firstName ||
"Student";

const last =
student.last_name ||
student.lastName ||
"";

const email =
student.email ||
"";

const phone =
student.phone ||
"";

document.getElementById(
"account"
).innerHTML =

"<strong>Student:</strong> " +
escapeHTML(
(first + " " + last).trim()
) +

"<br><strong>Email:</strong> " +
escapeHTML(email) +

(
phone
?
"<br><strong>Phone:</strong> " +
escapeHTML(phone)
:
""
);

}


/* =========================================
   CHECK MEMBERSHIP
========================================= */

async function checkMembership(){

const studentId =
student.id ||
student.student_id ||
student.user_id;

if(!studentId){

showNotLogged();

return;

}


/*
IMPORTANT:

Use the SAME student ID
from the login response.
*/


try{

const headers = {
"Accept":"application/json"
};


/*
If login returned a token,
send it.

If there is no token,
do not block the page.
*/

if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

MEMBERSHIP_URL +
"?student_id=" +
encodeURIComponent(studentId),

{
method:"GET",
headers:headers
}

);


const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

throw new Error(
"Invalid membership response."
);

}


console.log(
"Premium membership response:",
data
);


if(!response.ok){

showFree();

return;

}


const status =
String(
data.status || ""
).toLowerCase();


const active =
data.active === true ||
data.membership_active === true ||
status === "active";


if(active){

showActive(data);

return;

}


if(status === "pending"){

showPending();

return;

}


if(status === "rejected"){

showRejected();

return;

}


if(status === "expired"){

showExpired();

return;

}


showFree();


}catch(error){

console.error(
"Premium check error:",
error
);

showFree();

}

}


/* =========================================
   ACTIVE
========================================= */

function showActive(data){

const status =
document.getElementById("status");

status.className =
"status active";

status.textContent =
"⭐ Premium Active";


const expiry =
data.expiry_date ||
data.expires_at ||
data.membership_expiry ||
"";


document.getElementById(
"action"
).innerHTML =

'<a href="mcq.html" class="btn">' +
'🤖 Start AI English MCQ' +
'</a>';


if(expiry){

document.getElementById(
"message"
).style.display =
"block";

document.getElementById(
"message"
).textContent =
"Premium active until " +
expiry;

}

}


/* =========================================
   PENDING
========================================= */

function showPending(){

const status =
document.getElementById("status");

status.className =
"status pending";

status.textContent =
"⏳ Payment Pending";


document.getElementById(
"action"
).innerHTML =

'<a href="dashboard.html" class="btn orange">' +
'← Back to Dashboard' +
'</a>';

document.getElementById(
"message"
).style.display =
"block";

document.getElementById(
"message"
).textContent =
"Your Premium payment is waiting for administrator approval.";

}


/* =========================================
   REJECTED
========================================= */

function showRejected(){

const status =
document.getElementById("status");

status.className =
"status locked";

status.textContent =
"❌ Payment Rejected";


document.getElementById(
"action"
).innerHTML =

'<a href="payment.html" class="btn green">' +
'💳 Submit Payment Again' +
'</a>';

document.getElementById(
"message"
).style.display =
"block";

document.getElementById(
"message"
).textContent =
"Your previous Premium payment was rejected.";

}


/* =========================================
   EXPIRED
========================================= */

function showExpired(){

const status =
document.getElementById("status");

status.className =
"status locked";

status.textContent =
"⚠️ Premium Expired";


document.getElementById(
"action"
).innerHTML =

'<a href="payment.html" class="btn green">' +
'⭐ Renew Premium' +
'</a>';

}


/* =========================================
   FREE
========================================= */

function showFree(){

const status =
document.getElementById("status");

status.className =
"status locked";

status.textContent =
"🔒 Premium Required";


document.getElementById(
"action"
).innerHTML =

'<a href="payment.html" class="btn green">' +
'⭐ Get Premium' +
'</a>';

document.getElementById(
"message"
).style.display =
"block";

document.getElementById(
"message"
).textContent =
"Your account is logged in. Premium membership is not active yet.";

}


/* =========================================
   NO STUDENT ID
========================================= */

function showNotLogged(){

document.getElementById(
"status"
).className =
"status locked";

document.getElementById(
"status"
).textContent =
"⚠️ Account information missing";

document.getElementById(
"action"
).innerHTML =

'<a href="dashboard.html" class="btn">' +
'← Return to Dashboard' +
'</a>';

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
