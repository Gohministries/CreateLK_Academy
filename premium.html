<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Membership | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:700px;
margin:auto;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:19px;
font-weight:800;
color:#155eef;
}

.back{
text-decoration:none;
color:#475467;
font-size:13px;
font-weight:700;
}

.container{
max-width:600px;
margin:30px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:28px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
text-align:center;
}

.icon{
width:70px;
height:70px;
margin:auto;
border-radius:18px;
background:#fff7ed;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

h1{
font-size:25px;
margin:15px 0 8px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.5;
margin-bottom:25px;
}

.price{
font-size:34px;
font-weight:900;
color:#155eef;
margin-bottom:5px;
}

.duration{
font-size:13px;
color:#667085;
margin-bottom:25px;
}

.details{
background:#f8fafc;
border-radius:12px;
padding:15px;
text-align:left;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:8px 0;
font-size:13px;
border-bottom:1px solid #e5e7eb;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#667085;
}

.value{
font-weight:700;
text-align:right;
word-break:break-word;
}

.pay{
width:100%;
height:50px;
border:0;
border-radius:10px;
background:#16a34a;
color:white;
font-size:15px;
font-weight:800;
cursor:pointer;
}

.pay:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
font-size:13px;
line-height:1.5;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>

<main class="container">

<div class="card">

<div class="icon">⭐</div>

<h1>Premium Membership</h1>

<div class="subtitle">
Unlock premium English learning features and AI English MCQ practice.
</div>

<div class="price">
LKR 1,500
</div>

<div class="duration">
30-Day Premium Membership
</div>

<div class="details">

<div class="row">
<span class="label">Student</span>
<span id="studentName" class="value">Loading...</span>
</div>

<div class="row">
<span class="label">Email</span>
<span id="studentEmail" class="value">Loading...</span>
</div>

<div class="row">
<span class="label">Membership</span>
<span class="value">30 Days</span>
</div>

</div>

<button
id="payButton"
class="pay"
onclick="startPayment()"
disabled>

Loading...

</button>

<div id="message" class="message"></div>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";

const MERCHANT_ID =
"257692";

const AMOUNT =
"1500.00";

const CURRENCY =
"LKR";


let student=null;


try{

const saved=
sessionStorage.getItem(STUDENT_KEY);

if(saved){
student=JSON.parse(saved);
}

}catch(error){

console.error(error);

}


if(
!student ||
sessionStorage.getItem(LOGIN_KEY)!=="true"
){

window.location.replace("login.html");

}else{

loadStudent();

}


function loadStudent(){

const first=
student.first_name ||
student.firstName ||
"";

const last=
student.last_name ||
student.lastName ||
"";

document.getElementById(
"studentName"
).textContent=
(first+" "+last).trim();

document.getElementById(
"studentEmail"
).textContent=
student.email || "";

document.getElementById(
"payButton"
).disabled=false;

document.getElementById(
"payButton"
).textContent=
"⭐ Pay LKR 1,500 with PayHere";

}


function startPayment(){

if(!student){

showMessage(
"Please log in first.",
"error"
);

return;

}


const studentId=
student.id ||
student.student_id;

const email=
student.email || "";

const first=
student.first_name ||
student.firstName ||
"Student";

const last=
student.last_name ||
student.lastName ||
"";


if(!studentId || !email){

showMessage(
"Student information is missing.",
"error"
);

return;

}


/*
 IMPORTANT:

The actual PayHere hash must be generated
server-side by your Worker.

This page will later POST the payment
data to the Worker, which will return the
secure PayHere checkout information.
*/


showMessage(
"PayHere payment connection is being prepared...",
"info"
);


/*
 TEMPORARY:

We will connect this button to:

/api/payhere-create

after the Worker PayHere endpoint
is added.
*/

}


function showMessage(text,type){

const box=
document.getElementById("message");

box.textContent=text;

box.className=
"message "+type;

}

</script>

</body>
</html>
