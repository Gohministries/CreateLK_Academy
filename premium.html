<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Login | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:30px;
box-shadow:0 8px 30px rgba(16,24,40,.08);
}

.logo{
text-align:center;
font-size:22px;
font-weight:800;
color:#155eef;
margin-bottom:25px;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:8px;
}

.subtitle{
text-align:center;
font-size:14px;
color:#667085;
margin-bottom:25px;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

input{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:14px;
margin-bottom:17px;
outline:none;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px #eef4ff;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:700;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:8px;
font-size:13px;
line-height:1.5;
text-align:center;
}

.error{
display:block;
background:#fef3f2;
color:#b42318;
}

.success{
display:block;
background:#ecfdf3;
color:#067647;
}

.register{
text-align:center;
margin-top:20px;
font-size:13px;
color:#667085;
}

.register a{
color:#155eef;
font-weight:700;
text-decoration:none;
}

footer{
text-align:center;
margin-top:20px;
font-size:11px;
color:#98a2b3;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
📚 CreateLK Academy
</div>

<h1>
Student Login
</h1>

<div class="subtitle">
Login to your CreateLK Academy account
</div>

<form id="loginForm">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="email"
required>

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
required>

<button
type="submit"
id="loginButton">

🔐 Login

</button>

</form>

<div
id="message"
class="message">
</div>

<div class="register">

Don't have an account?

<a href="register-v2.html">
Create Account
</a>

</div>

<footer>
© 2026 CreateLK Academy
</footer>

</div>


<script>

/* =====================================
   CREATE LK ACADEMY V2 LOGIN
===================================== */

const API =
"https://createlk-v2-membership.createlk.workers.dev";

const LOGIN_URL =
API + "/api/v2/login";


/* =====================================
   ELEMENTS
===================================== */

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");


/* =====================================
   MESSAGE
===================================== */

function showMessage(text, success){

message.textContent = text;

message.className =
"message " +
(
success
? "success"
: "error"
);

}


/* =====================================
   LOGIN
===================================== */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

showMessage(
"Please enter your email and password.",
false
);

return;

}


button.disabled = true;

button.textContent =
"Logging in...";


try{

/* =====================================
   API REQUEST
===================================== */

const response =
await fetch(
LOGIN_URL,
{
method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}
);


/* =====================================
   READ RESPONSE SAFELY
===================================== */

const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

console.error(
"LOGIN RAW RESPONSE:",
text
);

throw new Error(
"Server returned an invalid response."
);

}


/* =====================================
   CHECK LOGIN
===================================== */

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* =====================================
   GET STUDENT
===================================== */

const student =
data.student ||
data.user ||
data.data ||
data.profile ||
null;


if(!student){

throw new Error(
"Login successful, but student information was not returned."
);

}


/* =====================================
   GET TOKEN
   TOKEN IS OPTIONAL
===================================== */

const token =
data.token ||
data.access_token ||
data.auth_token ||
data.student_token ||
"";


/* =====================================
   CLEAR OLD SESSION
===================================== */

sessionStorage.removeItem(
"createlk_student"
);

sessionStorage.removeItem(
"createlk_student_token"
);

sessionStorage.removeItem(
"createlk_token"
);


/* =====================================
   SAVE STUDENT
===================================== */

sessionStorage.setItem(
"createlk_student",
JSON.stringify(student)
);


/* =====================================
   SAVE TOKEN ONLY IF API RETURNS ONE
===================================== */

if(token){

sessionStorage.setItem(
"createlk_student_token",
token
);

sessionStorage.setItem(
"createlk_token",
token
);

}


/* =====================================
   LOGIN FLAGS
===================================== */

sessionStorage.setItem(
"createlk_logged_in",
"true"
);

sessionStorage.setItem(
"createlk_v2_logged_in",
"true"
);


/* =====================================
   LOCAL BACKUP
===================================== */

localStorage.setItem(
"createlk_student",
JSON.stringify(student)
);

if(token){

localStorage.setItem(
"createlk_student_token",
token
);

localStorage.setItem(
"createlk_token",
token
);

}

localStorage.setItem(
"createlk_logged_in",
"true"
);

localStorage.setItem(
"createlk_v2_logged_in",
"true"
);


/* =====================================
   SUCCESS
===================================== */

showMessage(
"✅ Login successful. Opening dashboard...",
true
);

button.textContent =
"Login Successful";


/* =====================================
   DASHBOARD
===================================== */

setTimeout(
function(){

window.location.replace(
"dashboard.html"
);

},
700
);


}
catch(error){

console.error(
"LOGIN ERROR:",
error
);

showMessage(
error.message ||
"Unable to connect to server.",
false
);

button.disabled =
false;

button.textContent =
"🔐 Login";

}

});


/* =====================================
   DEBUG
===================================== */

console.log(
"CreateLK Academy V2 Login"
);

console.log(
"Login API:",
LOGIN_URL
);

</script>

</body>

</html>
