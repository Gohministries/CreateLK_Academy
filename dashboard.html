<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>CreateLK Academy</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--b:#2563eb;
--p:#7c3aed;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f6f8fc
}

html,body{
width:100%;
min-height:100%
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--d);
-webkit-font-smoothing:antialiased
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid var(--l)
}

.nav{
width:100%;
max-width:720px;
margin:auto;
padding:11px 12px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:15px;
font-weight:900;
color:var(--b);
text-decoration:none
}

.logo span{
color:var(--p)
}

.logout{
border:1px solid var(--l);
background:#fff;
color:var(--d);
padding:8px 11px;
border-radius:9px;
font-size:10px;
font-weight:800;
cursor:pointer
}

/* MAIN */

main{
width:100%;
max-width:720px;
margin:auto;
padding:10px
}

/* HERO */

.hero{
background:linear-gradient(135deg,var(--b),var(--p));
color:#fff;
border-radius:16px;
padding:22px 18px;
margin-bottom:10px;
box-shadow:0 5px 18px rgba(37,99,235,.12)
}

.hero small{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:.4px;
opacity:.9
}

.hero h1{
font-size:23px;
font-weight:900;
line-height:1.25;
margin-top:6px
}

.hero p{
font-size:11px;
line-height:1.5;
margin-top:6px;
opacity:.96
}

/* LESSON NAVIGATION */

.lesson{
display:flex;
align-items:center;
gap:14px;
width:100%;
min-height:105px;
padding:15px;
background:#fff;
border:1px solid var(--l);
border-left:4px solid var(--b);
border-radius:15px;
text-decoration:none;
color:var(--d);
transition:transform .15s ease,box-shadow .15s ease
}

.lesson:active{
transform:scale(.99)
}

.lessonIcon{
width:48px;
height:48px;
min-width:48px;
display:flex;
align-items:center;
justify-content:center;
background:#eff6ff;
border-radius:12px;
font-size:24px
}

.lessonText{
flex:1;
min-width:0
}

.lessonText b{
display:block;
font-size:15px;
font-weight:900;
margin-bottom:4px
}

.lessonText span{
display:block;
font-size:10px;
line-height:1.5;
color:var(--m)
}

.arrow{
font-size:28px;
font-weight:500;
color:var(--b);
line-height:1
}

/* FOOTER */

footer{
text-align:center;
color:var(--m);
font-size:8px;
padding:18px 0
}

/* MOBILE */

@media(max-width:400px){

.nav{
padding:10px 8px
}

.logo{
font-size:14px
}

.logout{
font-size:9px;
padding:7px 9px
}

main{
padding:8px
}

.hero{
padding:19px 15px
}

.hero h1{
font-size:21px
}

.hero p{
font-size:10px
}

.lesson{
min-height:96px;
padding:13px
}

.lessonIcon{
width:44px;
height:44px;
min-width:44px;
font-size:22px
}

.lessonText b{
font-size:14px
}

.lessonText span{
font-size:9px
}

.arrow{
font-size:25px
}

}

@media(max-width:350px){

.hero h1{
font-size:19px
}

.lesson{
gap:10px
}

.lessonIcon{
width:40px;
height:40px;
min-width:40px;
font-size:20px
}

.lessonText b{
font-size:13px
}

.lessonText span{
font-size:8px
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<a
class="logo"
href="dashboard.html"
>
📚 CreateLK <span>Academy</span>
</a>

<button
type="button"
class="logout"
onclick="logout()"
>
Logout
</button>

</div>

</header>


<main>

<section class="hero">

<small>CREATE LK ACADEMY</small>

<h1 id="welcome">
Welcome 👋
</h1>

<p>
Continue your English learning journey.
</p>

</section>


<!-- ONLY MAIN NAVIGATION -->

<a
class="lesson"
href="spoken-english.html"
>

<div class="lessonIcon">
📖
</div>

<div class="lessonText">

<b>
Learn English
</b>

<span>
Open your daily lessons and continue learning English.
</span>

</div>

<div class="arrow">
›
</div>

</a>


<footer>
© 2026 CreateLK Academy
</footer>

</main>


<script>

const STUDENT_KEY =
"createlk_student";


let student={};


/* LOAD STUDENT */

try{

student=
JSON.parse(
localStorage.getItem(
STUDENT_KEY
)||"{}"
);

}catch(error){

student={};

}


/* SHOW NAME */

function showWelcome(){

const first =
student.first_name || "";

const last =
student.last_name || "";

const name =
`${first} ${last}`.trim()
||
student.name
||
"Student";

document.getElementById(
"welcome"
).textContent =
`Welcome, ${name} 👋`;

}


/* LOGOUT */

function logout(){

localStorage.removeItem(
"createlk_student"
);

localStorage.removeItem(
"createlk_user"
);

localStorage.removeItem(
"createlk_logged_in"
);

sessionStorage.removeItem(
"createlk_student"
);

sessionStorage.removeItem(
"createlk_logged_in"
);

sessionStorage.removeItem(
"createlk_student_id"
);

sessionStorage.removeItem(
"createlk_student_email"
);

location.href =
"login.html";

}


/* START */

showWelcome();

</script>

</body>
</html>
