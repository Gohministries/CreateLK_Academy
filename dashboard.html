<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard | CreateLK Academy</title><link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f6f8fc;
color:#172033;
min-height:100vh;
}

header{
background:#fff;
border-bottom:1px solid #e7eaf0;
}

.header-container{
max-width:1100px;
margin:auto;
min-height:70px;
padding:8px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand img{
width:45px;
height:45px;
object-fit:contain;
}

.brand-name{
font-size:19px;
font-weight:800;
color:#172554;
}

.home-btn{
background:#eef2ff;
color:#3730a3;
padding:9px 16px;
border-radius:9px;
font-size:13px;
font-weight:800;
}

main{
max-width:1000px;
margin:auto;
padding:40px 20px 70px;
}

h1{
font-size:32px;
color:#172554;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
color:#64748b;
margin-bottom:25px;
}

.card{
background:#fff;
border:1px solid #e4e9f1;
border-radius:18px;
padding:23px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(15,23,42,.05);
}

.card h2{
font-size:18px;
color:#172554;
margin-bottom:16px;
}

.profile-row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.profile-item{
background:#f8fafc;
border-radius:11px;
padding:13px;
}

.profile-label{
font-size:11px;
color:#64748b;
margin-bottom:5px;
}

.profile-value{
font-size:14px;
font-weight:800;
color:#172033;
word-break:break-word;
}

.premium{
border:1px solid #dbe5ff;
background:#f8faff;
}

.status{
font-size:15px;
font-weight:900;
margin-bottom:8px;
}

.details{
font-size:13px;
color:#64748b;
line-height:1.6;
}

.lesson-btn{
display:inline-block;
margin-top:17px;
padding:12px 18px;
background:#2563eb;
color:#fff;
border-radius:10px;
font-size:13px;
font-weight:800;
}

.pay-btn{
margin-top:17px;
padding:12px 18px;
background:#2563eb;
border:0;
color:#fff;
border-radius:10px;
font-size:13px;
font-weight:800;
cursor:pointer;
}

.pay-btn:disabled{
opacity:.6;
}

.countdown{
margin-top:12px;
font-size:13px;
font-weight:800;
color:#2563eb;
}

.loading{
text-align:center;
padding:50px;
color:#64748b;
}

.message{
display:none;
padding:13px;
border-radius:10px;
margin-bottom:20px;
font-size:13px;
line-height:1.5;
}

.message.show{
display:block;
}

.message.error{
background:#fff1f1;
color:#b42318;
}

.message.info{
background:#eef6ff;
color:#155eef;
}

.logout{
border:0;
background:#fee2e2;
color:#b42318;
padding:10px 16px;
border-radius:9px;
font-weight:800;
cursor:pointer;
}

@media(max-width:650px){

.profile-row{
grid-template-columns:1fr;
}

main{
padding:28px 15px 50px;
}

h1{
font-size:27px;
}

.brand-name{
font-size:16px;
}

}

</style></head><body><header><div class="header-container"><div class="brand"><img
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

<div class="brand-name">
CreateLK Academy
</div></div><a
href="/"
class="home-btn">
Home
</a>

</div></header><main><div
id="loading"
class="loading">Loading your account...

</div><div
id="dashboard"
style="display:none;"><h1>
Dashboard
</h1><p class="subtitle">
Welcome to your CreateLK Academy account.
</p><div
id="message"
class="message">
</div><div class="card"><h2>
My Account
</h2><div class="profile-row"><div class="profile-item"><div class="profile-label">
Name
</div><div
id="name"
class="profile-value">
-
</div></div><div class="profile-item"><div class="profile-label">
Email
</div><div
id="email"
class="profile-value">
-
</div></div><div class="profile-item"><div class="profile-label">
Phone
</div><div
id="phone"
class="profile-value">
-
</div></div></div></div><div class="card premium"><h2>
Premium Status
</h2><div
id="premiumStatus"
class="status">
Checking...
</div><div
id="premiumDetails"
class="details">
Checking your subscription...
</div><div
id="countdown"
class="countdown">
</div><div id="premiumAction">
</div></div><button
class="logout"
onclick="logout()">
Logout
</button>

</div></main><script>

const API =
"https://createlk-auth-api.createlk.workers.dev";

const PREMIUM_API =
"https://createlk-premium-api.createlk.workers.dev";

const GRADE = "06";


function showMessage(message,type){

const box =
document.getElementById("message");

box.textContent=message;

box.className=
"message show "+type;

}


function logout(){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

window.location.replace(
"/auth/login.html"
);

}


async function loadAccount(){

const token =
localStorage.getItem(
"createlk_token"
);


if(!token){

window.location.replace(
"/auth/login.html?redirect=/dashboard.html"
);

return;

}


try{

const response =
await fetch(
API+"/auth/me",
{
method:"GET",

headers:{
"Authorization":
"Bearer "+token,

"Accept":
"application/json"
},

cache:"no-store"
}
);


if(response.status===401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

window.location.replace(
"/auth/login.html?redirect=/dashboard.html"
);

return;

}


if(!response.ok){

throw new Error(
"Unable to load account."
);

}


const data =
await response.json();


if(
!data.success ||
!data.customer
){

throw new Error(
"Account information unavailable."
);

}


const customer =
data.customer;


localStorage.setItem(
"createlk_customer",
JSON.stringify(customer)
);


document.getElementById("name")
.textContent =
customer.name || "-";

document.getElementById("email")
.textContent =
customer.email || "-";

document.getElementById("phone")
.textContent =
customer.phone || "-";


document.getElementById(
"loading"
).style.display="none";


document.getElementById(
"dashboard"
).style.display="block";


await loadPremium(token);


}catch(error){

console.error(error);


document.getElementById(
"loading"
).style.display="none";


showMessage(
error.message ||
"Unable to load your account.",
"error"
);

}

}


async function loadPremium(token){

try{

const response =
await fetch(
PREMIUM_API+
"/premium/status?grade="+GRADE,
{
method:"GET",

headers:{
"Authorization":
"Bearer "+token,

"Accept":
"application/json"
},

cache:"no-store"
}
);


if(response.status===401){

document.getElementById(
"premiumStatus"
).textContent =
"⚠️ Login verification failed";

document.getElementById(
"premiumDetails"
).textContent =
"Please refresh the page and try again.";

return;

}


if(!response.ok){

throw new Error(
"Premium service unavailable."
);

}


const data =
await response.json();


const premium =
data.premium || {};


if(
data.success &&
premium.active
){

showActivePremium(
premium
);

}else{

showFreePremium();

}

}catch(error){

console.error(error);

document.getElementById(
"premiumStatus"
).textContent =
"⚠️ Unable to check";

document.getElementById(
"premiumDetails"
).textContent =
"Please refresh the page.";

}

}


function showActivePremium(premium){

document.getElementById(
"premiumStatus"
).textContent =
"🟢 Premium Active";


document.getElementById(
"premiumDetails"
).textContent =
"Grade 06 Premium is active.";


if(premium.expires_at){

startCountdown(
premium.expires_at
);

}


document.getElementById(
"premiumAction"
).innerHTML =

'<a class="lesson-btn" href="/grades/grade-06.html">Open Grade 06 Lessons →</a>';

}


function showFreePremium(){

document.getElementById(
"premiumStatus"
).textContent =
"🔵 Premium Required";


document.getElementById(
"premiumDetails"
).textContent =
"Get Grade 06 Premium for LKR 999 / 30 Days.";


document.getElementById(
"premiumAction"
).innerHTML =

'<button class="pay-btn" id="payButton" onclick="subscribe()">Pay LKR 999 / 30 Days</button>';

}


function startCountdown(expiresAt){

function update(){

const expiry =
new Date(
expiresAt.replace(" ","T")+"Z"
).getTime();

const now =
Date.now();

const difference =
expiry-now;


if(difference<=0){

document.getElementById(
"countdown"
).textContent =
"Premium has expired.";

return;

}


const days =
Math.floor(
difference/(1000*60*60*24)
);

const hours =
Math.floor(
(difference%(1000*60*60*24))/
(1000*60*60)
);

const minutes =
Math.floor(
(difference%(1000*60*60))/
(1000*60)
);


document.getElementById(
"countdown"
).textContent =
"Expires in "+days+
"d "+hours+
"h "+minutes+"m";

}


update();

setInterval(update,60000);

}


async function subscribe(){

const token =
localStorage.getItem(
"createlk_token"
);


if(!token){

window.location.replace(
"/auth/login.html?redirect=/dashboard.html"
);

return;

}


const button =
document.getElementById(
"payButton"
);


button.disabled=true;

button.textContent=
"Preparing Payment...";


try{

const response =
await fetch(
PREMIUM_API+
"/premium/checkout?grade="+GRADE,
{
method:"GET",

headers:{
"Authorization":
"Bearer "+token,

"Accept":
"application/json"
}
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Unable to create payment."
);

}


if(data.checkout_url){

window.location.href =
data.checkout_url;

return;

}


throw new Error(
"Payment URL was not received."
);


}catch(error){

console.error(error);

showMessage(
error.message ||
"Payment could not be started.",
"error"
);

button.disabled=false;

button.textContent=
"Pay LKR 999 / 30 Days";

}

}


loadAccount();

</script></body>
</html>
