<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:20px;
 background:#f3f6fa;
 font-family:Arial,sans-serif;
 color:#172033
}
.app{max-width:1050px;margin:auto}
header{
 background:#172033;
 color:white;
 padding:18px 22px;
 border-radius:14px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
header h2{margin:0}
button{
 border:0;
 border-radius:9px;
 padding:11px 16px;
 cursor:pointer;
 font-weight:bold
}
.logout{background:#fff;color:#172033}

.hero{
 background:white;
 padding:25px;
 margin-top:18px;
 border-radius:14px;
 box-shadow:0 3px 12px #0001
}
.hero h1{margin:0 0 8px}
.hero p{color:#667085}

.premium{
 margin-top:18px;
 background:#fff8df;
 border:1px solid #ead18a;
 padding:20px;
 border-radius:14px
}
.premium h3{margin-top:0}
.price{font-size:25px;font-weight:bold}
.get{
 background:#172033;
 color:white;
 margin-top:12px
}
.countdown{
 margin-top:12px;
 font-weight:bold
}

.progress{
 background:white;
 padding:20px;
 margin-top:18px;
 border-radius:14px
}
.bar{
 height:10px;
 background:#e4e8ee;
 border-radius:20px;
 overflow:hidden;
 margin-top:10px
}
.bar span{
 display:block;
 height:100%;
 background:#172033;
 width:0
}

.lessons{
 margin-top:18px;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px
}
.lesson{
 background:white;
 padding:16px;
 border-radius:12px;
 border:1px solid #e5e7eb
}
.lesson strong{display:block}
.lesson small{color:#667085}
.open{
 background:#172033;
 color:white;
 margin-top:10px
}
.locked{
 background:#eee;
 color:#777;
 margin-top:10px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:10;
 padding:15px;
 overflow:auto
}
.modal-box{
 background:white;
 max-width:850px;
 margin:30px auto;
 border-radius:16px;
 padding:22px
}
.close{
 float:right;
 background:#eee
}

.langs,.speak-modes{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:15px 0
}
.langs button,.speak-modes button{
 background:#edf1f5
}
.langs button.active,
.speak-modes button.active{
 background:#172033;
 color:white
}

.dialogue{
 background:#f5f7fa;
 padding:14px;
 border-radius:10px;
 margin:10px 0
}
.dialogue b{display:block;margin-bottom:5px}

.content{
 line-height:1.7;
 white-space:pre-line
}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:15px 0
}
.play{background:#172033;color:white}
.stop{background:#eee}
.complete{
 background:#198754;
 color:white;
 width:100%;
 margin-top:15px
}

.notice{
 background:#fff3cd;
 padding:12px;
 border-radius:8px;
 margin:10px 0
}
</style>
</head>

<body>

<div class="app">

<header>
 <h2>CreateLK Academy</h2>
 <button class="logout" onclick="logout()">Logout</button>
</header>

<section class="hero">
 <h1>Spoken English</h1>
 <p>Build confidence through practical conversations and real-life situations.</p>
 <strong>100 Lessons • 1,000 Practical Dialogues</strong>
</section>

<section class="premium">
 <h3>👑 Premium Membership</h3>
 <div class="price">LKR 999 • 30 Days</div>
 <div id="premiumStatus">Checking membership...</div>
 <div id="countdown" class="countdown"></div>
 <button class="get" onclick="buyPremium()">GET PREMIUM</button>
</section>

<section class="progress">
 <strong>Your Progress</strong>
 <div id="progressText">0 of 100</div>
 <div class="bar"><span id="progressBar"></span></div>
</section>

<h2>100 Spoken English Lessons</h2>
<div id="lessons" class="lessons"></div>

</div>


<!-- LESSON MODAL -->

<div id="modal" class="modal">
 <div class="modal-box">

  <button class="close" onclick="closeLesson()">✕</button>

  <h2 id="lessonTitle"></h2>

  <!-- DISPLAY LANGUAGE -->
  <h3>Display Language</h3>

  <div class="langs">
   <button id="lang-en" onclick="changeLanguage('en')">English</button>
   <button id="lang-ta" onclick="changeLanguage('ta')">தமிழ்</button>
   <button id="lang-si" onclick="changeLanguage('si')">සිංහල</button>
  </div>

  <!-- SPEAK MODE -->
  <h3>🔊 Speak Mode</h3>

  <div class="speak-modes">
   <button id="mode-en" onclick="setSpeakMode('en')">
    English Only
   </button>

   <button id="mode-ta" onclick="setSpeakMode('en-ta')">
    English → Tamil
   </button>

   <button id="mode-si" onclick="setSpeakMode('en-si')">
    English → Sinhala
   </button>

   <button id="mode-all" onclick="setSpeakMode('all')">
    English → Tamil → Sinhala
   </button>
  </div>

  <div class="controls">
   <button class="play" onclick="playAll()">🔊 Play All</button>
   <button class="stop" onclick="stopSpeech()">⏹ Stop</button>
  </div>

  <div id="lessonContent"></div>

  <button class="complete" onclick="completeLesson()">
   ✓ Complete Lesson
  </button>

 </div>
</div>


<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";

const titles=[
"Introducing Yourself",
"Greetings and Small Talk",
"Talking About Your Family",
"Talking About Your Home",
"Daily Routine",
"Morning Activities",
"Talking About Your Job",
"Talking About School",
"Talking About Friends",
"Asking for Personal Information",
"Meeting Someone New",
"Making a Phone Call",
"Sending a Message",
"Talking About the Time",
"Talking About the Date",
"Making Plans",
"Weekend Plans",
"Invitations",
"Accepting an Invitation",
"Refusing Politely",
"At the Restaurant",
"Ordering Food",
"Asking About a Menu",
"Paying the Bill",
"At a Café",
"Buying Groceries",
"At a Supermarket",
"Shopping for Clothes",
"Asking the Price",
"Returning an Item",
"At the Bus Stop",
"Taking a Bus",
"Taking a Taxi",
"Asking for Directions",
"Finding a Place",
"At the Train Station",
"Buying a Ticket",
"At the Airport",
"Checking Into a Hotel",
"Hotel Problems",
"Talking About Weather",
"Talking About Hobbies",
"Sports and Games",
"Music",
"Movies and TV",
"Reading Books",
"Weekend Activities",
"Holidays",
"Birthday Conversations",
"Celebrations",
"At the Doctor",
"Describing Symptoms",
"At the Pharmacy",
"Healthy Habits",
"Exercise and Fitness",
"Asking for Help",
"Offering Help",
"Giving Advice",
"Asking for Permission",
"Saying Sorry",
"Thanking Someone",
"Compliments",
"Agreeing and Disagreeing",
"Expressing Opinions",
"Making Suggestions",
"Making Decisions",
"Solving a Problem",
"Making a Complaint",
"Apologizing Professionally",
"Workplace Conversations",
"Job Interviews",
"Talking With a Customer",
"Talking With a Manager",
"Making an Appointment",
"Office Phone Calls",
"Meetings",
"Giving Instructions",
"Asking Questions at Work",
"Discussing a Project",
"Talking About Money",
"Banking",
"Using an ATM",
"Online Shopping",
"Using the Internet",
"Social Media Conversations",
"Learning English",
"Practicing English",
"Common English Mistakes",
"Understanding Fast English",
"Everyday Expressions",
"Making Conversation",
"Keeping a Conversation Going",
"Speaking Politely",
"Speaking Confidently",
"Natural English",
"Travel Conversations",
"Emergency Conversations",
"Real-Life Situations",
"Advanced Everyday Conversations",
"Speaking English Confidently"
];

let token=localStorage.getItem("createlk_token");

if(!token){
 location.href="/login.html";
}

let lessons=[];
let currentLesson=0;
let lessonData={
 en:null,
 ta:null,
 si:null
};

let currentLanguage="en";
let speakMode="en";
let speechQueue=[];
let speechIndex=0;


/* API */

async function api(url,options={}){
 options.headers={
  ...(options.headers||{}),
  Authorization:"Bearer "+token,
  "Content-Type":"application/json"
 };

 const r=await fetch(url,options);
 const d=await r.json();

 if(!r.ok || d.success===false){
  throw new Error(d.message||"Request failed");
 }

 return d;
}


/* LOAD LESSON LIST */

async function loadLessons(){

 try{

  const d=await api(
   API+"/lessons?course=spoken-english&language=en"
  );

  lessons=d.lessons||[];

 }catch(e){

  console.log(e);
  lessons=[];

 }

 renderLessons();
 updateProgress();
}


/* RENDER 100 LESSONS */

function renderLessons(){

 const box=document.getElementById("lessons");
 box.innerHTML="";

 for(let i=1;i<=100;i++){

  const data=lessons.find(x=>
   Number(x.lesson_number)===i
  );

  const free=data ? Number(data.is_free)===1 : i===1;

  const div=document.createElement("div");
  div.className="lesson";

  div.innerHTML=`
   <strong>LESSON ${i}</strong>
   <div>${titles[i-1]}</div>
   <small>${free?"Free lesson":"Premium lesson"}</small>
   <br>
   <button class="${free?"open":"open"}"
     onclick="openLesson(${i})">
     Open
   </button>
  `;

  box.appendChild(div);
 }
}


/* OPEN LESSON */

async function openLesson(n){

 currentLesson=n;

 document.getElementById("modal").style.display="block";

 document.getElementById("lessonTitle").innerText=
  "Lesson "+n+": "+titles[n-1];

 document.getElementById("lessonContent").innerHTML=
  "<p>Loading lesson...</p>";

 lessonData={
  en:null,
  ta:null,
  si:null
 };

 try{

  /* English is required */
  const en=await api(
   API+"/lesson?course=spoken-english&lesson="+n+"&language=en"
  );

  lessonData.en=en.lesson;

  /* Tamil and Sinhala are optional */
  const results=await Promise.allSettled([

   api(
    API+"/lesson?course=spoken-english&lesson="+n+"&language=ta"
   ),

   api(
    API+"/lesson?course=spoken-english&lesson="+n+"&language=si"
   )

  ]);

  if(results[0].status==="fulfilled"){
   lessonData.ta=results[0].value.lesson;
  }

  if(results[1].status==="fulfilled"){
   lessonData.si=results[1].value.lesson;
  }

  currentLanguage="en";
  speakMode="en";

  updateLanguageButtons();
  updateSpeakButtons();

  renderLanguage();

 }catch(e){

  document.getElementById("lessonContent").innerHTML=
   `<div class="notice">${e.message}</div>`;

 }

}


/* CHANGE DISPLAY LANGUAGE */

function changeLanguage(lang){

 currentLanguage=lang;

 updateLanguageButtons();
 renderLanguage();

}


/* LANGUAGE BUTTONS */

function updateLanguageButtons(){

 document.querySelectorAll(".langs button")
 .forEach(x=>x.classList.remove("active"));

 const b=document.getElementById("lang-"+currentLanguage);

 if(b)b.classList.add("active");

}


/* RENDER CURRENT LANGUAGE */

function renderLanguage(){

 const data=lessonData[currentLanguage];

 if(!data){

  document.getElementById("lessonContent").innerHTML=`
   <div class="notice">
    This language is not available for this lesson yet.
   </div>
  `;

  return;
 }

 let html="";

 if(data.objectives){

  html+=`
   <h3>Objectives</h3>
   <div class="content">${escapeHTML(data.objectives)}</div>
  `;

 }

 if(data.content){

  html+=`
   <h3>Lesson</h3>
   <div class="content">${escapeHTML(data.content)}</div>
  `;

 }

 if(data.key_points){

  html+=`
   <h3>Key Points</h3>
   <div class="content">${escapeHTML(data.key_points)}</div>
  `;

 }

 if(data.dialogues && data.dialogues.length){

  html+="<h3>Practice Dialogues</h3>";

  data.dialogues.forEach(d=>{

   html+=`
    <div class="dialogue">
     <b>${escapeHTML(d.speaker_a||"A")}</b>
     ${escapeHTML(d.text_a||"")}

     <br><br>

     <b>${escapeHTML(d.speaker_b||"B")}</b>
     ${escapeHTML(d.text_b||"")}
    </div>
   `;

  });

 }

 if(data.summary){

  html+=`
   <h3>Summary</h3>
   <div class="content">${escapeHTML(data.summary)}</div>
  `;

 }

 document.getElementById("lessonContent").innerHTML=html;

}


/* SPEAK MODE */

function setSpeakMode(mode){

 speakMode=mode;

 updateSpeakButtons();

 stopSpeech();

}


/* SPEAK BUTTON UI */

function updateSpeakButtons(){

 document.querySelectorAll(".speak-modes button")
 .forEach(x=>x.classList.remove("active"));

 if(speakMode==="en"){
  document.getElementById("mode-en").classList.add("active");
 }

 if(speakMode==="en-ta"){
  document.getElementById("mode-ta").classList.add("active");
 }

 if(speakMode==="en-si"){
  document.getElementById("mode-si").classList.add("active");
 }

 if(speakMode==="all"){
  document.getElementById("mode-all").classList.add("active");
 }

}


/* PLAY ALL */

function playAll(){

 stopSpeech();

 const en=lessonData.en;
 const ta=lessonData.ta;
 const si=lessonData.si;

 if(!en)return;

 speechQueue=[];

 /*
 English only
 */

 if(speakMode==="en"){

  addSpeech(en,"en");

 }

 /*
 English → Tamil
 */

 if(speakMode==="en-ta"){

  addSpeech(en,"en");

  if(ta)addSpeech(ta,"ta");

 }

 /*
 English → Sinhala
 */

 if(speakMode==="en-si"){

  addSpeech(en,"en");

  if(si)addSpeech(si,"si");

 }

 /*
 English → Tamil → Sinhala
 */

 if(speakMode==="all"){

  addSpeech(en,"en");

  if(ta)addSpeech(ta,"ta");

  if(si)addSpeech(si,"si");

 }

 speechIndex=0;

 speakNext();

}


/* ADD LESSON TO SPEECH QUEUE */

function addSpeech(data,lang){

 if(!data)return;

 if(data.objectives){

  speechQueue.push({
   text:data.objectives,
   lang
  });

 }

 if(data.content){

  speechQueue.push({
   text:data.content,
   lang
  });

 }

 if(data.key_points){

  speechQueue.push({
   text:data.key_points,
   lang
  });

 }

 if(data.dialogues){

  data.dialogues.forEach(d=>{

   if(d.text_a){

    speechQueue.push({
     text:d.text_a,
     lang
    });

   }

   if(d.text_b){

    speechQueue.push({
     text:d.text_b,
     lang
    });

   }

  });

 }

 if(data.summary){

  speechQueue.push({
   text:data.summary,
   lang
  });

 }

}


/* SPEAK NEXT */

function speakNext(){

 if(speechIndex>=speechQueue.length)return;

 const item=speechQueue[speechIndex++];

 const u=new SpeechSynthesisUtterance(item.text);

 u.lang={
  en:"en-US",
  ta:"ta-LK",
  si:"si-LK"
 }[item.lang];

 u.rate=.9;
 u.pitch=1;

 u.onend=speakNext;

 speechSynthesis.speak(u);

}


/* STOP */

function stopSpeech(){

 speechSynthesis.cancel();

 speechQueue=[];
 speechIndex=0;

}


/* COMPLETE */

function completeLesson(){

 let done=
  JSON.parse(localStorage.getItem("completed_lessons")||"[]");

 if(!done.includes(currentLesson)){
  done.push(currentLesson);
 }

 localStorage.setItem(
  "completed_lessons",
  JSON.stringify(done)
 );

 updateProgress();
 alert("Lesson completed!");

}


/* PROGRESS */

function updateProgress(){

 const done=
  JSON.parse(localStorage.getItem("completed_lessons")||"[]");

 const count=done.length;

 document.getElementById("progressText").innerText=
  count+" of 100";

 document.getElementById("progressBar").style.width=
  count+"%";

}


/* PREMIUM */

async function checkPremium(){

 try{

  const d=await api(
   API+"/lessons?course=spoken-english&language=en"
  );

  if(d.premium && d.subscription){

   document.getElementById("premiumStatus").innerText=
    "✓ Premium Active";

   startCountdown(d.subscription.expires_at);

  }else{

   document.getElementById("premiumStatus").innerText=
    "Premium not active";

  }

 }catch(e){

  document.getElementById("premiumStatus").innerText=
   "Premium not active";

 }

}


/* COUNTDOWN */

let countdownTimer=null;

function startCountdown(expiry){

 clearInterval(countdownTimer);

 const end=new Date(expiry).getTime();

 function update(){

  const diff=end-Date.now();

  if(diff<=0){

   document.getElementById("countdown").innerText=
    "Premium expired";

   clearInterval(countdownTimer);

   return;
  }

  const days=Math.floor(diff/86400000);

  const hours=Math.floor(
   diff%86400000/3600000
  );

  const minutes=Math.floor(
   diff%3600000/60000
  );

  const seconds=Math.floor(
   diff%60000/1000
  );

  document.getElementById("countdown").innerText=
   `Expires in ${days}d ${hours}h ${minutes}m ${seconds}s`;

 }

 update();

 countdownTimer=setInterval(update,1000);

}


/* PAYHERE */

async function buyPremium(){

 try{

  const d=await api(
   PAY+"/premium-checkout",
   {
    method:"POST",
    body:JSON.stringify({
     course:"spoken-english"
    })
   }
  );

  const fields=d.fields||d.checkout||d;

  const form=document.createElement("form");

  form.method="POST";
  form.action="https://www.payhere.lk/pay/checkout";

  Object.keys(fields).forEach(key=>{

   const input=document.createElement("input");

   input.type="hidden";
   input.name=key;
   input.value=fields[key];

   form.appendChild(input);

  });

  document.body.appendChild(form);

  form.submit();

 }catch(e){

  alert(e.message);

 }

}


/* CLOSE */

function closeLesson(){

 stopSpeech();

 document.getElementById("modal").style.display="none";

}


/* LOGOUT */

function logout(){

 localStorage.removeItem("createlk_token");

 location.href="/login.html";

}


/* ESCAPE HTML */

function escapeHTML(value){

 return String(value||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* START */

loadLessons();
checkPremium();

</script>

</body>
</html>
