<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}

body{
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

header{
 background:linear-gradient(135deg,#111827,#1e3a8a);
 color:#fff;
 padding:16px 20px
}

.head,.wrap{
 max-width:1050px;
 margin:auto
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:21px;
 font-weight:800
}

.logo b{
 color:#fbbf24
}

.logout{
 background:#ffffff20;
 color:#fff;
 border:0;
 padding:9px 13px;
 border-radius:9px;
 cursor:pointer
}

.wrap{
 padding:25px 15px 50px
}

.hero{
 padding:30px;
 border-radius:23px;
 color:#fff;
 background:linear-gradient(135deg,#1d4ed8,#4f46e5);
 box-shadow:0 10px 30px #2563eb33
}

.hero h1{
 font-size:31px;
 margin:8px 0
}

.hero p{
 line-height:1.6;
 opacity:.9
}

.badge{
 display:inline-block;
 margin-top:15px;
 background:#ffffff20;
 padding:7px 12px;
 border-radius:20px;
 font-size:13px
}

.card{
 background:#fff;
 padding:20px;
 border-radius:18px;
 margin-top:18px;
 box-shadow:0 5px 20px #0001
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.premium{
 background:#f59e0b;
 color:#fff;
 padding:10px 15px;
 border:0;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer
}

.status{
 color:#64748b;
 font-size:14px;
 margin-top:5px
}

.active{
 color:#16a34a;
 font-weight:bold
}

.progress{
 height:10px;
 background:#e5e7eb;
 border-radius:20px;
 margin-top:12px;
 overflow:hidden
}

.fill{
 height:100%;
 width:0;
 background:#2563eb;
 transition:.3s
}

.section{
 margin:30px 0 15px
}

.lessons{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.lesson{
 background:#fff;
 padding:18px;
 border-radius:17px;
 border:1px solid #e5e7eb
}

.num{
 font-size:12px;
 color:#2563eb;
 font-weight:bold
}

.lesson h3{
 margin:8px 0
}

.lesson p{
 font-size:13px;
 color:#64748b;
 min-height:38px;
 line-height:1.5
}

.bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:15px
}

.open,.complete{
 background:#2563eb;
 color:#fff;
 border:0;
 padding:9px 13px;
 border-radius:9px;
 font-weight:bold;
 cursor:pointer
}

.lock{
 background:#e5e7eb;
 color:#64748b;
 border:0;
 padding:9px 13px;
 border-radius:9px;
 cursor:pointer
}

.free{
 color:#16a34a;
 font-weight:bold;
 font-size:12px
}

.modal-bg{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 padding:15px;
 overflow:auto;
 z-index:1000
}

.modal{
 background:#fff;
 max-width:760px;
 margin:25px auto;
 border-radius:20px;
 overflow:hidden
}

.modal-head{
 background:linear-gradient(135deg,#1e3a8a,#2563eb);
 color:#fff;
 padding:22px;
 position:relative
}

.close{
 position:absolute;
 right:15px;
 top:12px;
 background:#ffffff20;
 color:#fff;
 border:0;
 font-size:22px;
 border-radius:8px;
 padding:4px 10px;
 cursor:pointer
}

.modal-body{
 padding:20px
}

.controls{
 display:flex;
 gap:10px;
 margin-bottom:18px
}

.play,.stop{
 flex:1;
 border:0;
 padding:12px;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer
}

.play{
 background:#1e3a8a;
 color:#fff
}

.stop{
 background:#e5e7eb
}

.dialogue{
 padding:17px;
 margin:12px 0;
 border:1px solid #e5e7eb;
 border-radius:15px;
 transition:.3s
}

.dialogue.playing{
 border-color:#2563eb;
 box-shadow:0 0 0 3px #2563eb18
}

.lang{
 font-size:11px;
 font-weight:bold;
 color:#2563eb;
 margin-top:12px
}

.text{
 margin-top:4px;
 line-height:1.55
}

.complete{
 width:100%;
 margin-top:15px
}

.next-btn{
 width:100%;
 margin-top:15px;
 background:#16a34a;
 color:#fff;
 border:0;
 padding:13px;
 border-radius:10px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer
}

.back-btn{
 width:100%;
 margin-top:10px;
 padding:11px;
 border:0;
 background:#e5e7eb;
 color:#475569;
 border-radius:9px;
 font-weight:bold;
 cursor:pointer
}

.loading{
 text-align:center;
 padding:35px;
 color:#64748b
}

.error{
 text-align:center;
 padding:30px;
 color:#dc2626
}

.success-box{
 text-align:center;
 padding:35px 15px
}

.success-icon{
 font-size:45px;
 margin-bottom:12px
}

.success-box h2{
 margin-bottom:10px
}

.success-box p{
 color:#64748b;
 line-height:1.6
}

@media(max-width:750px){
 .lessons{
  grid-template-columns:repeat(2,1fr)
 }
}

@media(max-width:520px){

 .lessons{
  grid-template-columns:1fr
 }

 .head{
  gap:10px
 }

 .hero h1{
  font-size:26px
 }

 .controls{
  position:sticky;
  top:0;
  background:#fff;
  padding-bottom:8px;
  z-index:2
 }
}
</style>
</head>

<body>

<header>
<div class="head">

<div class="logo">
CreateLK <b>Academy</b>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>
</header>

<main class="wrap">

<section class="hero">

<small>ONLINE COURSE</small>

<h1>Spoken English</h1>

<p>
Build confidence through practical conversations and real-life situations.
</p>

<span class="badge">
100 Lessons • 1,000 Practical Dialogues
</span>

</section>


<section class="card row">

<div>

<b>Premium Membership</b>

<div id="premiumStatus" class="status">
Checking...
</div>

</div>

<button
id="premiumBtn"
class="premium"
onclick="premiumPage()"
>
Get Premium
</button>

</section>


<section class="card">

<div class="row">

<b>Your Progress</b>

<b id="progressText">
0 of 100
</b>

</div>

<div class="progress">

<div
id="fill"
class="fill"
></div>

</div>

</section>


<h2 class="section">
100 Spoken English Lessons
</h2>


<div id="lessons" class="lessons">

<div class="loading">
Loading...
</div>

</div>

</main>


<div id="modalBg" class="modal-bg">

<div class="modal">


<div class="modal-head">

<button
class="close"
onclick="closeLesson()"
>
×
</button>

<small id="modalNum">
LESSON
</small>

<h2 id="modalTitle">
Loading...
</h2>

</div>


<div id="modalBody" class="modal-body">

<div class="loading">
Loading lesson...
</div>

</div>

</div>

</div>


<script>

const API=
"https://createlk-academy-api.createlk.workers.dev";

const COURSE=
"spoken-english";

const token=
localStorage.getItem("createlk_token");


let premium=false;

let completed=[];

let dialogues=[];

let playing=false;


if(!token){

 location.href="/auth/login.html";

}


const headers={

 "Content-Type":"application/json",

 "Authorization":"Bearer "+token

};


const $=
id=>document.getElementById(id);


/* =========================
   LOAD LESSON LIST
========================= */

async function loadLessons(){

 try{

  const r=await fetch(
   `${API}/lessons?course=${COURSE}&language=en`,
   {headers}
  );

  const d=await r.json();

  if(!r.ok||!d.success){

   throw Error(
    d.message||"Unable to load lessons."
   );

  }


  premium=!!d.premium;


  $("premiumStatus").innerHTML=

   premium

   ?'<span class="active">✓ Premium Active</span>'

   :"Premium not active";


  $("premiumBtn").style.display=

   premium
   ?"none"
   :"block";


  $("lessons").innerHTML=

   d.lessons.map(x=>{

    const n=+x.lesson_number;

    const free=
     +x.is_free===1;

    const unlocked=
     free||premium;

    const done=
     completed.includes(n);


    return `

    <article class="lesson">

     <div class="num">
      LESSON ${n}
     </div>

     <h3>
      ${esc(x.title||"Lesson "+n)}
     </h3>

     <p>
      ${esc(
       x.summary||
       x.objectives||
       ""
      )}
     </p>

     <div class="bottom">

      <span class="free">

       ${
        done
        ?"✓ COMPLETED"
        :free
        ?"FREE FOREVER"
        :"PREMIUM"
       }

      </span>


      <button
       class="${unlocked?"open":"lock"}"
       onclick="${
        unlocked
        ?`openLesson(${n})`
        :"premiumPage()"
       }"
      >

       ${
        unlocked
        ?"Open"
        :"🔒 Locked"
       }

      </button>

     </div>

    </article>

    `;

   }).join("");


 }catch(e){

  console.error(e);

  $("lessons").innerHTML=

   '<div class="error">Unable to load lessons.</div>';

 }

}


/* =========================
   OPEN LESSON
========================= */

async function openLesson(n){

 stopSpeech();


 $("modalBg").style.display="block";


 $("modalNum").textContent=
 "LESSON "+n;


 $("modalTitle").textContent=
 "Loading...";


 $("modalBody").innerHTML=
 '<div class="loading">Loading lesson...</div>';


 /*
  Lessons 2–100 require Premium
 */

 if(n>1 && !premium){

  showPremiumLesson(n);

  return;

 }


 try{

  const [en,si,ta]=
   await Promise.all([

    getLesson(n,"en"),

    getLesson(n,"si"),

    getLesson(n,"ta")

   ]);


  const l=en.lesson;


  if(!l){

   throw Error(
    "Lesson data not found."
   );

  }


  $("modalTitle").textContent=
   l.title;


  dialogues=[];


  const enD=
   en.lesson.dialogues||[];

  const siD=
   si.lesson.dialogues||[];

  const taD=
   ta.lesson.dialogues||[];


  for(
   let i=0;
   i<enD.length;
   i++
  ){

   dialogues.push({

    number:
     enD[i].dialogue_number,

    lines:[

     {
      language:"English",
      speaker:enD[i].speaker_a,
      text:enD[i].text_a
     },

     {
      language:"English",
      speaker:enD[i].speaker_b,
      text:enD[i].text_b
     },

     {
      language:"Sinhala",
      speaker:siD[i]?.speaker_a||"",
      text:siD[i]?.text_a||""
     },

     {
      language:"Sinhala",
      speaker:siD[i]?.speaker_b||"",
      text:siD[i]?.text_b||""
     },

     {
      language:"Tamil",
      speaker:taD[i]?.speaker_a||"",
      text:taD[i]?.text_a||""
     },

     {
      language:"Tamil",
      speaker:taD[i]?.speaker_b||"",
      text:taD[i]?.text_b||""
     }

    ]

   });

  }


  let html="";


  if(l.objectives){

   html+=`

    <div
     class="card"
     style="margin:0 0 15px"
    >

     ${esc(l.objectives)}

    </div>

   `;

  }


  html+=`

   <div class="controls">

    <button
     class="play"
     onclick="playAll()"
    >
     ▶ Play All
    </button>

    <button
     class="stop"
     onclick="stopSpeech()"
    >
     ■ Stop
    </button>

   </div>

  `;


  html+=

   dialogues.map((d,i)=>`

    <div
     class="dialogue"
     id="dialogue-${i}"
    >

     <div class="num">
      DIALOGUE ${d.number}
     </div>


     ${

      d.lines.map(x=>`

       <div class="lang">
        ${x.language}
       </div>

       <div class="text">

        <b>
         ${esc(x.speaker)}:
        </b>

        ${esc(x.text)}

       </div>

      `).join("")

     }

    </div>

   `).join("");


  html+=`

   <button
    class="complete"
    onclick="completeLesson(${n})"
   >

    ${
     completed.includes(n)
     ?"✓ Lesson Completed"
     :"Mark Lesson Complete"
    }

   </button>

  `;


  $("modalBody").innerHTML=
   html;


 }catch(e){

  console.error(e);


  $("modalBody").innerHTML=`

   <div class="error">

    Unable to load this lesson.

    <br><br>

    <small>
     ${esc(e.message||"Unknown error")}
    </small>

   </div>

  `;

 }

}


/* =========================
   PREMIUM SCREEN
========================= */

function showPremiumLesson(n){

 $("modalTitle").textContent=
  "Premium Lesson";


 $("modalBody").innerHTML=`

  <div class="success-box">

   <div class="success-icon">
    🔒
   </div>

   <h2>
    Premium Required
   </h2>

   <p>
    Lesson ${n} is available with
    Premium Membership.
   </p>


   <button
    class="next-btn"
    onclick="premiumPage()"
   >
    Get Premium
   </button>


   <button
    class="back-btn"
    onclick="closeLesson()"
   >
    Back to Lessons
   </button>

  </div>

 `;

}


/* =========================
   GET LESSON
========================= */

async function getLesson(
 n,
 language
){

 const r=await fetch(

  `${API}/lesson?course=${COURSE}&lesson=${n}&language=${language}`,

  {headers}

 );


 const d=await r.json();


 if(!r.ok||!d.success){

  throw Error(
   d.message||
   `Unable to load ${language} lesson.`
  );

 }


 return d;

}


/* =========================
   PLAY ALL
========================= */

function playAll(){

 stopSpeech();

 playing=true;


 let index=0;


 function next(){

  if(
   !playing||
   index>=dialogues.length
  ){

   playing=false;

   return;

  }


  const box=
   $(`dialogue-${index}`);


  document
   .querySelectorAll(".dialogue")
   .forEach(x=>
    x.classList.remove("playing")
   );


  box.classList.add("playing");


  box.scrollIntoView({

   behavior:"smooth",

   block:"center"

  });


  speakLines(
   dialogues[index].lines,
   0,
   ()=>{

    index++;

    next();

   }
  );

 }


 next();

}


/* =========================
   SPEAK
========================= */

function speakLines(
 lines,
 i,
 done
){

 if(
  !playing||
  i>=lines.length
 ){

  done();

  return;

 }


 const line=
  lines[i];


 /*
  Ignore empty translated lines
 */

 if(!line.text){

  speakLines(
   lines,
   i+1,
   done
  );

  return;

 }


 const u=
  new SpeechSynthesisUtterance(
   line.text
  );


 u.lang=
  voiceLang[line.language];


 u.rate=.88;


 u.onend=()=>{

  speakLines(
   lines,
   i+1,
   done
  );

 };


 u.onerror=()=>{

  speakLines(
   lines,
   i+1,
   done
  );

 };


 speechSynthesis.speak(u);

}


/* =========================
   VOICE LANGUAGES
========================= */

const voiceLang={

 English:"en-US",

 Sinhala:"si-LK",

 Tamil:"ta-LK"

};


/* =========================
   STOP
========================= */

function stopSpeech(){

 playing=false;

 speechSynthesis.cancel();


 document
  .querySelectorAll(".dialogue")
  .forEach(x=>
   x.classList.remove("playing")
  );

}


/* =========================
   COMPLETE LESSON
========================= */

async function completeLesson(n){

 try{

  const r=await fetch(

   `${API}/lesson/complete`,

   {

    method:"POST",

    headers,

    body:JSON.stringify({

     course:COURSE,

     lesson_number:n

    })

   }

  );


  const d=
   await r.json();


  if(
   !r.ok||
   !d.success
  ){

   throw Error(
    d.message||
    "Unable to complete lesson."
   );

  }


  if(
   !completed.includes(n)
  ){

   completed.push(n);

  }


  updateProgress(
   d.completed_count||
   completed.length
  );


  loadLessons();


  const next=n+1;


  /*
   Course completed
  */

  if(next>100){

   $("modalBody").innerHTML=`

    <div class="success-box">

     <div class="success-icon">
      🏆
     </div>

     <h2>
      Course Completed!
     </h2>

     <p>
      Congratulations!
      You completed all 100 lessons.
     </p>

    </div>

   `;

   return;

  }


  /*
   Show next lesson
  */

  $("modalBody").innerHTML=`

   <div class="success-box">

    <div class="success-icon">
     🎉
    </div>

    <h2>
     Lesson ${n} Completed
    </h2>

    <p>
     Great job! Continue to the next lesson.
    </p>


    <button
     class="next-btn"
     onclick="openNextLesson(${next})"
    >
     Next Lesson →
    </button>


    <button
     class="back-btn"
     onclick="closeLesson()"
    >
     Back to Lessons
    </button>

   </div>

  `;


 }catch(e){

  alert(
   e.message||
   "Unable to complete lesson."
  );

 }

}


/* =========================
   NEXT LESSON
========================= */

function openNextLesson(n){

 stopSpeech();


 /*
  Lessons 2–100 require Premium
 */

 if(
  n>1 &&
  !premium
 ){

  $("modalNum").textContent=
   "LESSON "+n;

  showPremiumLesson(n);

  return;

 }


 openLesson(n);

}


/* =========================
   PROGRESS
========================= */

async function loadProgress(){

 try{

  const r=await fetch(

   `${API}/progress?course=${COURSE}`,

   {headers}

  );


  const d=
   await r.json();


  if(d.success){

   completed=
    (d.lessons||[])
    .map(x=>
     +x.lesson_number
    );


   updateProgress(

    d.completed_count||
    completed.length

   );

  }


 }catch(e){

  console.error(
   "Progress error:",
   e
  );

 }

}


/* =========================
   UPDATE PROGRESS
========================= */

function updateProgress(n){

 n=Math.min(
  100,
  +n||0
 );


 $("progressText").textContent=
  n+" of 100";


 $("fill").style.width=
  n+"%";

}


/* =========================
   CLOSE
========================= */

function closeLesson(){

 stopSpeech();

 $("modalBg").style.display=
  "none";

}


/* =========================
   PREMIUM
========================= */

function premiumPage(){

 location.href="/premium/";

}


/* =========================
   LOGOUT
========================= */

function logout(){

 localStorage.removeItem(
  "createlk_token"
 );

 location.href=
  "/auth/login.html";

}


/* =========================
   ESCAPE HTML
========================= */

function esc(v){

 return String(v??"")

  .replace(
   /&/g,
   "&amp;"
  )

  .replace(
   /</g,
   "&lt;"
  )

  .replace(
   />/g,
   "&gt;"
  )

  .replace(
   /"/g,
   "&quot;"
  )

  .replace(
   /'/g,
   "&#039;"
  );

}


/* =========================
   MODAL BACKGROUND
========================= */

$("modalBg").onclick=e=>{

 if(
  e.target===
  $("modalBg")
 ){

  closeLesson();

 }

};


/* =========================
   INITIALIZE
========================= */

async function init(){

 await loadProgress();

 await loadLessons();

}


init();

</script>

</body>
</html>
