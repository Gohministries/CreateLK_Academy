<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#155eef">

<title>Login | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--blue:#155eef;
--purple:#7c3aed;
--pink:#ec4899;
--green:#10b981;
--dark:#172033;
--muted:#667085;
--line:#e5e7eb;
--bg:#f5f7ff
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 10% 10%,
#dbeafe 0,
transparent 28%
),
radial-gradient(
circle at 90% 20%,
#fce7f3 0,
transparent 28%
),
var(--bg);
color:var(--dark);
min-height:100vh
}

a{
text-decoration:none
}


/* ================= HEADER ================= */

header{
background:#ffffffee;
backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:900px;
margin:auto;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:900;
color:var(--blue)
}

.logo span{
color:var(--purple)
}

.home{
font-size:14px;
font-weight:700;
color:#475467
}


/* ================= MAIN ================= */

main{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:35px 15px
}


/* ================= CARD ================= */

.card{
width:100%;
max-width:440px;
background:#fff;
border-radius:24px;
padding:30px;
border:1px solid #fff;
box-shadow:
0 20px 55px rgba(16,24,40,.12);
position:relative;
overflow:hidden
}

.card:before{
content:"";
position:absolute;
width:150px;
height:150px;
right:-75px;
top:-75px;
border-radius:50%;
background:#dbeafe
}

.card:after{
content:"";
position:absolute;
width:130px;
height:130px;
left:-65px;
bottom:-65px;
border-radius:50%;
background:#fce7f3
}


/* ================= TITLE ================= */

.header{
text-align:center;
position:relative;
z-index:1;
margin-bottom:25px
}

.icon{
width:68px;
height:68px;
margin:auto;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
background:
linear-gradient(
135deg,
#eef4ff,
#f5f0ff
);
box-shadow:
0 10px 25px rgba(21,94,239,.12)
}

h1{
font-size:28px;
margin:15px 0 7px
}

.subtitle{
font-size:14px;
line-height:1.5;
color:var(--muted)
}


/* ================= MESSAGE ================= */

.message{
display:none;
padding:13px;
border-radius:11px;
margin-bottom:18px;
font-size:13px;
line-height:1.5;
text-align:center;
position:relative;
z-index:2
}

.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c
}

.message.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534
}

.message.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8
}


/* ================= FORM ================= */

form{
position:relative;
z-index:2
}

.group{
margin-bottom:17px
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:7px
}

input{
width:100%;
height:50px;
padding:0 14px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:14px;
outline:none;
background:#fff
}

input:focus{
border-color:var(--blue);
box-shadow:
0 0 0 3px rgba(21,94,239,.10)
}


/* ================= PASSWORD ================= */

.password-wrap{
position:relative
}

.password-wrap input{
padding-right:70px
}

.show-password{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:0;
background:transparent;
color:var(--blue);
font-size:12px;
font-weight:800;
cursor:pointer;
padding:6px
}


/* ================= BUTTON ================= */

button.login-btn{
width:100%;
height:52px;
border:0;
border-radius:11px;
background:
linear-gradient(
135deg,
var(--blue),
var(--purple)
);
color:#fff;
font-size:15px;
font-weight:900;
cursor:pointer;
box-shadow:
0 10px 25px rgba(21,94,239,.22);
transition:.2s
}

button.login-btn:hover{
transform:translateY(-2px)
}

button.login-btn:disabled{
opacity:.6;
cursor:not-allowed;
transform:none
}


/* ================= REGISTER ================= */

.register{
position:relative;
z-index:2;
text-align:center;
margin-top:20px;
font-size:14px;
color:var(--muted)
}

.register a{
color:var(--blue);
font-weight:800
}


/* ================= TERMS ================= */

.terms{
position:relative;
z-index:2;
text-align:center;
font-size:11px;
color:#98a2b3;
margin-top:18px;
line-height:1.5
}

.terms a{
color:#667085;
font-weight:700
}


/* ================= FOOTER ================= */

footer{
text-align:center;
padding:20px;
font-size:11px;
color:#98a2b3
}


/* ================= WHATSAPP ================= */

.whatsapp{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
border-radius:50%;
background:#25d366;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:29px;
box-shadow:0 8px 25px #0003;
z-index:999
}


/* ================= MOBILE ================= */

@media(max-width:500px){

.card{
padding:25px 18px;
border-radius:20px
}

h1{
font-size:25px
}

.nav{
padding:14px 15px
}

.logo{
font-size:18px
}

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

<div class="nav">

<a
href="index.html"
class="logo">

📚 CreateLK <span>Academy</span>

</a>

<a
href="index.html"
class="home">

← Home

</a>

</div>

</header>


<!-- ================= MAIN ================= -->

<main>

<div class="card">


<!-- HEADER -->

<div class="header">

<div class="icon">
🔐
</div>

<h1>
Welcome Back
</h1>

<div class="subtitle">

Login to continue your
English learning journey.

</div>

</div>


<!-- MESSAGE -->

<div
id="message"
class="message">
</div>


<!-- FORM -->

<form id="loginForm">


<!-- EMAIL -->

<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email">

</div>


<!-- PASSWORD -->

<div class="group">

<label for="password">
Password
</label>

<div class="password-wrap">

<input
id="password"
type="password"
placeholder="Enter your password"
required
autocomplete="current-password">

<button
type="button"
class="show-password"
id="showPassword">

Show

</button>

</div>

</div>


<!-- LOGIN -->

<button
id="loginButton"
class="login-btn"
type="submit">

🔐 Login

</button>


</form>


<!-- REGISTER -->

<div class="register">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>


<!-- TERMS -->

<div class="terms">

By logging in, you agree to our

<a href="terms.html">
Terms
</a>,

<a href="privacy.html">
Privacy Policy
</a>

</div>


</div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<!-- ================= WHATSAPP ================= -->

<a
class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="WhatsApp">

💬

</a>


<script>

/* =========================================
   CREATE LK STUDENT AUTH WORKER
========================================= */

const API =
"https://createlk-student-auth.createlk.workers.dev";


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById(
"loginForm"
);

const emailInput =
document.getElementById(
"email"
);

const passwordInput =
document.getElementById(
"password"
);

const button =
document.getElementById(
"loginButton"
);

const message =
document.getElementById(
"message"
);

const showPassword =
document.getElementById(
"showPassword"
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
text,
type
){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPassword.addEventListener(
"click",
function(){

if(
passwordInput.type ===
"password"
){

passwordInput.type =
"text";

showPassword.textContent =
"Hide";

}else{

passwordInput.type =
"password";

showPassword.textContent =
"Show";

}

}
);


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;


if(!email || !password){

showMessage(
"Please enter your email and password.",
"error"
);

return;

}


button.disabled =
true;

button.textContent =
"⏳ Logging in...";


showMessage(
"Checking your account...",
"info"
);


try{


/* =================================
   API REQUEST
================================= */

const response =
await fetch(
API + "/api/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

});


/* =================================
   RESPONSE
================================= */

const raw =
await response.text();


console.log(
"LOGIN RESPONSE:",
raw
);


let data;


try{

data =
JSON.parse(raw);

}catch{

throw new Error(
"Server returned an invalid response."
);

}


/* =================================
   LOGIN FAILED
================================= */

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* =================================
   SAVE TOKEN
================================= */

if(!data.token){

throw new Error(
"Login succeeded but no session token was returned."
);

}


localStorage.setItem(
"cla_token",
data.token
);


/* =================================
   SAVE STUDENT
================================= */

if(data.student){

localStorage.setItem(
"cla_student",
JSON.stringify(
data.student
)
);

}


/* =================================
   SUCCESS
================================= */

showMessage(
"✅ Login successful! Opening your dashboard...",
"success"
);

button.textContent =
"✓ Login Successful";


/* =================================
   REDIRECT
================================= */

setTimeout(
function(){

window.location.href =
"dashboard.html";

},
700
);


}catch(error){

console.error(
"LOGIN ERROR:",
error
);


showMessage(
error.message ||
"Unable to connect to CreateLK Academy.",
"error"
);


button.disabled =
false;

button.textContent =
"🔐 Login";

}

});


/* =========================================
   CHECK EXISTING LOGIN
========================================= */

(function(){

const token =
localStorage.getItem(
"cla_token"
);

if(token){

/*
   Don't automatically redirect here.
   The student can still log in with another
   account if they want.
*/

console.log(
"Existing CreateLK Academy session found."
);

}

})();

</script>


</body>
</html>
