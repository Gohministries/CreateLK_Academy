<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800;color:#174ea6}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.logout{background:#eee}
.hero{background:linear-gradient(135deg,#174ea6,#512da8);color:#fff;padding:38px 20px;text-align:center}
.hero h1{margin:8px 0;font-size:34px}
.hero p{margin:8px 0 18px}
.badge{display:inline-block;background:#ffffff22;border:1px solid #ffffff55;padding:8px 14px;border-radius:30px}
.wrap{max-width:1000px;margin:22px auto;padding:0 15px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
.premium{display:flex;align-items:center;justify-content:space-between;gap:15px}
.premium h2{margin:0 0 5px}
.price{font-size:24px;font-weight:800}
.primary{background:#174ea6;color:#fff}
.progress{height:10px;background:#e5e8ef;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#174ea6}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lesson{background:#fff;border:1px solid #e2e5eb;border-radius:12px;padding:15px;cursor:pointer}
.lesson:hover{border-color:#174ea6}
.lesson b{display:block;margin-bottom:5px}
.lock{float:right}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;padding:20px;overflow:auto}
.box{background:#fff;max-width:850px;margin:30px auto;border-radius:15px;padding:22px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#eee}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
select{padding:10px;border:1px solid #ccc;border-radius:8px}
.dialogue{border:1px solid #e1e5eb;border-radius:10px;padding:14px;margin:12px 0}
.lang{font-size:12px;color:#174ea6;font-weight:700;margin-top:7px}
.text{line-height:1.55}
.objectives{background:#f5f7fb;padding:12px;border-radius:9px}
@media(max-width:600px){
 .premium{display:block}
 .premium button{margin-top:12px}
 .hero h1{font-size:28px}
}
</style>
</head>

<body>

<header>
  <div class="logo">CreateLK Academy</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<section class="hero">
  <div class="badge">100 Lessons • 1,000 Practical Dialogues</div>
  <h1>Spoken English</h1>
  <p>Learn English through practical everyday conversations.</p>
</section>

<main class="wrap">

  <div class="card premium">
    <div>
      <h2>Premium Membership</h2>
      <div>Unlock all 100 lessons and 1,000 dialogues.</div>
      <div class="price">LKR 999 / 30 days</div>
      <small id="premiumStatus"></small>
    </div>
    <button class="primary" onclick="premium()">GET PREMIUM</button>
  </div>

  <div class="card">
    <b>Course Progress</b>
    <p id="progressText">0 of 100 lessons completed</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="card">
    <h2>Lessons</h2>
    <div class="lessons" id="lessons">Loading...</div>
  </div>

</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeLesson()">
  <div class="box">
    <button class="close" onclick="closeLesson()">✕</button>
    <h2 id="lessonTitle"></h2>

    <div class="objectives" id="objectives"></div>

    <div class="controls">
      <select id="lang" onchange="mode=this.value;stopSpeech();renderDialogues()">
        <option value="english">English Only</option>
        <option value="sinhala">English → Sinhala</option>
        <option value="tamil">English → Tamil</option>
      </select>
      <button class="primary" onclick="playAll()">▶ Play</button>
      <button onclick="stopSpeech()">■ Stop</button>
      <button class="primary" onclick="completeLesson()">✓ Complete Lesson</button>
    </div>

    <div id="dialogues"></div>
  </div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev",
      PAY="https://createlk-payhere.createlk.workers.dev",
      COURSE="spoken-english",
      TOKEN=localStorage.getItem("createlk_token");

if(!TOKEN)location.href="/auth/login.html";

const $=id=>document.getElementById(id);
const titles=[
"Greetings & Introductions","Meeting New People","Introducing Your Family",
"Talking About Yourself","Daily Routine","Morning Activities","At Home",
"Talking About Time","Days & Dates","Talking About the Weather",
"Shopping","At the Supermarket","Buying Clothes","At a Restaurant",
"Ordering Food","At a Café","Asking for Directions","Using Public Transport",
"Taking a Taxi","At the Bus Station","At the Train Station","At the Airport",
"Booking a Hotel","Checking Into a Hotel","Hotel Problems","Making a Phone Call",
"Leaving a Message","Making Appointments","At the Doctor","At the Pharmacy",
"Talking About Health","At School","Talking About Studies","In the Classroom",
"Talking to a Teacher","At Work","Talking to Your Boss","Job Interview",
"Office Conversation","Business Meeting","Talking About Money","Banking",
"Using an ATM","Sending Money","At the Post Office","Sending a Package",
"Talking About Family","Talking About Friends","Inviting Someone","Accepting an Invitation",
"Refusing Politely","Making Plans","Weekend Plans","Holiday Plans",
"Travel Conversation","At a Tourist Attraction","Taking Photos","Talking About Hobbies",
"Sports","Music","Movies","Books","Using Social Media","Internet Conversation",
"Computer Problems","Mobile Phone","Technology","Housework","Cooking",
"At the Market","Buying Groceries","Talking About Food","Restaurant Problems",
"Making a Complaint","Apologizing","Thanking Someone","Asking for Help",
"Offering Help","Giving Advice","Agreeing","Disagreeing Politely",
"Expressing Opinions","Making Suggestions","Making Decisions","Solving Problems",
"Emergency Situations","Police Station","Lost Property","Talking About Experiences",
"Past Events","Future Plans","Dreams & Goals","Learning English",
"Common Mistakes","Useful Expressions","Review 1","Review 2","Final Review"
];

let lessons=[],done=[],current=0,dialogues=[],mode="english";

const modes={
 english:["English"],
 sinhala:["English","Sinhala"],
 tamil:["English","Tamil"]
};

async function api(url,opt={}){
 const r=await fetch(url,{...opt,headers:{
   "Authorization":"Bearer "+TOKEN,
   "Content-Type":"application/json",
   ...(opt.headers||{})
 }});
 if(!r.ok)throw Error(await r.text());
 return r.json();
}

function esc(x=""){
 return String(x).replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[m]));
}

async function loadLessons(){
 try{
   lessons=await api(`${API}/lessons?course=${COURSE}&language=en`);
   renderLessons();
 }catch(e){
   $("lessons").innerHTML="<p>Unable to load lessons.</p>";
 }
}

function renderLessons(){
 $("lessons").innerHTML=lessons.map((l,i)=>{
   const n=l.lesson_number||i+1;
   const free=n===1||l.is_free===1;
   return `<div class="lesson" onclick="openLesson(${n})">
     <span class="lock">${free?"":"🔒"}</span>
     <b>Lesson ${n}</b>${esc(l.title||titles[n-1]||"Lesson "+n)}
   </div>`;
 }).join("");
}

async function loadProgress(){
 try{
   const r=await api(`${API}/progress?course=${COURSE}`);
   done=r.completed_lessons||r.completed||[];
   if(Array.isArray(done))done=done.map(Number);
   $("progressText").textContent=`${done.length} of 100 lessons completed`;
   $("bar").style.width=(done.length)+"%";
 }catch(e){}
}

async function openLesson(n){
 current=n;
 $("modal").style.display="block";
 $("lessonTitle").textContent="Lesson "+n+" — "+(titles[n-1]||"Spoken English");
 $("dialogues").innerHTML="Loading...";
 $("objectives").innerHTML="";
 try{
   const [en,si,ta]=await Promise.all([
     api(`${API}/lesson?course=${COURSE}&lesson=${n}&language=en`),
     api(`${API}/lesson?course=${COURSE}&lesson=${n}&language=si`),
     api(`${API}/lesson?course=${COURSE}&lesson=${n}&language=ta`)
   ]);

   const ed=en.dialogues||en;
   const sd=si.dialogues||si;
   const td=ta.dialogues||ta;

   dialogues=ed.map((e,i)=>({
     number:e.dialogue_number||i+1,
     lines:[
       ["English",e.speaker_a,e.text_a],
       ["English",e.speaker_b,e.text_b],
       ["Sinhala",sd[i]?.speaker_a,sd[i]?.text_a],
       ["Sinhala",sd[i]?.speaker_b,sd[i]?.text_b],
       ["Tamil",td[i]?.speaker_a,td[i]?.text_a],
       ["Tamil",td[i]?.speaker_b,td[i]?.text_b]
     ].map(x=>({language:x[0],speaker:x[1],text:x[2]}))
   }));

   $("objectives").innerHTML=en.objectives
     ? "<b>Objectives:</b> "+esc(en.objectives)
     : "";

   renderDialogues();
 }catch(e){
   $("dialogues").innerHTML="<p>Unable to load this lesson.</p>";
 }
}

function renderDialogues(){
 $("dialogues").innerHTML=dialogues.map((d,i)=>{
   const lines=d.lines.filter(x=>modes[mode].includes(x.language)&&x.text);
   return `<div class="dialogue">
     <b>Dialogue ${d.number}</b>
     <div id="d${i}">
       ${lines.map(x=>`
         <div class="lang">${x.language}</div>
         <div class="text"><b>${esc(x.speaker)}:</b> ${esc(x.text)}</div>
       `).join("")}
     </div>
   </div>`;
 }).join("");
}

function playAll(){
 stopSpeech();
 dialogues.forEach(d=>{
   d.lines.filter(x=>modes[mode].includes(x.language)&&x.text)
   .forEach(x=>{
     const u=new SpeechSynthesisUtterance(x.text);
     u.lang=x.language==="English"?"en-US":x.language==="Sinhala"?"si-LK":"ta-LK";
     speechSynthesis.speak(u);
   });
 });
}

function stopSpeech(){speechSynthesis.cancel()}

function closeLesson(){
 stopSpeech();
 $("modal").style.display="none";
}

async function completeLesson(){
 try{
   await api(`${API}/lesson/complete`,{
     method:"POST",
     body:JSON.stringify({course:COURSE,lesson_number:current})
   });
   if(!done.includes(current))done.push(current);
   loadProgress();
   closeLesson();
 }catch(e){
   alert("Unable to save progress.");
 }
}

async function premium(){
 try{
   const r=await api(`${PAY}/premium-checkout`,{
     method:"POST",
     body:JSON.stringify({course:COURSE})
   });

   const f=document.createElement("form");
   f.method="POST";
   f.action="https://www.payhere.lk/pay/checkout";

   Object.entries(r).forEach(([k,v])=>{
     const i=document.createElement("input");
     i.type="hidden";i.name=k;i.value=v;
     f.appendChild(i);
   });

   document.body.appendChild(f);
   f.submit();
 }catch(e){
   alert("Unable to start payment.");
 }
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

loadLessons();
loadProgress();
</script>

</body>
</html>
