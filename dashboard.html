<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#071b3a;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
button{border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.logout{background:none;border:1px solid #ffffff55;color:#fff}
main{max-width:850px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#1264d6,#063c82);color:#fff;padding:25px;border-radius:17px;margin-bottom:15px}
.hero h1{margin:6px 0}
.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 4px 18px #0000000b}
.premium{background:#eef6ff}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px}
.price{font-size:25px;font-weight:bold;color:#1264d6;margin:7px 0}
.primary{background:#1264d6;color:#fff}
.progress{height:9px;background:#e5e9ef;border-radius:20px;margin-top:9px}
.fill{height:100%;background:#1264d6;border-radius:20px;width:0}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e2e6ec;border-radius:10px;margin:7px 0}
.num{font-size:11px;color:#1264d6;font-weight:bold}
.title{font-weight:bold;margin:3px 0}
.status{font-size:11px;color:#687386}
.open{background:#edf4ff;color:#1264d6}
.lock{font-size:12px;color:#888}
.hidden{display:none}
.dialogue{padding:14px;border:1px solid #e2e6ec;border-radius:11px;margin:9px 0}
.lang{margin-top:10px;line-height:1.55}
.lang b{font-size:11px;color:#687386}
.controls,.languages{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
.stop{background:#eee}
.language{background:#eee}
.language.active{background:#1264d6;color:#fff}
.complete{width:100%;background:#138544;color:#fff;margin-top:12px}
.back{background:none;color:#1264d6;padding:0}
</style>
</head>

<body>

<header>
  <b>CreateLK Academy</b>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<section id="dashboard">

  <div class="hero">
    <small>ONLINE COURSE</small>
    <h1>Spoken English</h1>
    <p>Build confidence through practical conversations and real-life situations.</p>
  </div>

  <div class="card premium">
    <div class="row">
      <div>
        <b>Premium Membership</b>
        <div id="premiumStatus">Checking...</div>
        <div class="price" id="price">LKR 999</div>
        <small id="expiry">30 days access</small>
      </div>
      <button id="premiumBtn" class="primary" onclick="buyPremium()">
        Get Premium
      </button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <b>Your Progress</b>
      <span id="progressText">0 of 100</span>
    </div>
    <div class="progress">
      <div id="fill" class="fill"></div>
    </div>
  </div>

  <div class="card">
    <h3>Spoken English — 100 Lessons</h3>
    <div id="lessons">Loading...</div>
  </div>

</section>

<section id="lesson" class="card hidden">

  <button class="back" onclick="back()">← Back</button>

  <div id="lessonContent">Loading...</div>

</section>

</main>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";

const token=localStorage.getItem("createlk_token");

if(!token){
  location.href="/auth/login.html";
}

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities","Talking About Your Job",
"Talking About School","Talking About Friends","Asking for Personal Information",
"Meeting Someone New","Making a Phone Call","Sending a Message","Talking About the Time",
"Talking About the Date","Making Plans","Weekend Plans","Invitations",
"Accepting an Invitation","Refusing Politely","At the Restaurant","Ordering Food",
"Asking About a Menu","Paying the Bill","At a Café","Buying Groceries",
"At a Supermarket","Shopping for Clothes","Asking the Price","Returning an Item",
"At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel",
"Hotel Problems","Talking About Weather","Talking About Hobbies","Sports and Games",
"Music","Movies and TV","Reading Books","Weekend Activities","Holidays",
"Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms",
"At the Pharmacy","Healthy Habits","Exercise and Fitness","Asking for Help",
"Offering Help","Giving Advice","Asking for Permission","Saying Sorry",
"Thanking Someone","Compliments","Agreeing and Disagreeing","Expressing Opinions",
"Making Suggestions","Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews",
"Talking With a Customer","Talking With a Manager","Making an Appointment",
"Office Phone Calls","Meetings","Giving Instructions","Asking Questions at Work",
"Discussing a Project","Talking About Money","Banking","Using an ATM","Online Shopping",
"Using the Internet","Social Media Conversations","Learning English","Practicing English",
"Common English Mistakes","Understanding Fast English","Everyday Expressions",
"Making Conversation","Keeping a Conversation Going","Speaking Politely",
"Speaking Confidently","Natural English","Travel Conversations","Emergency Conversations",
"Real-Life Situations","Advanced Everyday Conversations","Speaking English Confidently"
];

let currentLesson=1;
let currentLanguage="en";
let playing=false;

async function api(url,options={}){
  options.headers={
    ...(options.headers||{}),
    Authorization:"Bearer "+token
  };

  const r=await fetch(url,options);
  const d=await r.json();

  if(!r.ok)
    throw Error(d.error||d.message||"Server error");

  return d;
}


/* PREMIUM */

async function loadPremium(){

  try{

    const d=await api(
      API+"/premium/status?course=spoken-english"
    );

    if(d.premium){

      premiumStatus.innerHTML=
        "<b style='color:#138544'>✓ PREMIUM ACTIVE</b>";

      premiumBtn.textContent="Premium Active";
      premiumBtn.disabled=true;

      if(d.subscription?.expires_at){

        expiry.textContent=
          "Expires: "+
          new Date(
            d.subscription.expires_at.replace(" ","T")
          ).toLocaleDateString();

      }

    }else{

      premiumStatus.textContent=
        "Premium not active";

      premiumBtn.textContent="Get Premium";
      premiumBtn.disabled=false;

      expiry.textContent="30 days access";
    }

  }catch(e){

    console.error(e);

    premiumStatus.textContent=
      "Unable to check Premium";
  }
}


/* PROGRESS */

async function loadProgress(){

  try{

    const d=await api(
      API+"/progress?course=spoken-english"
    );

    const n=Number(d.completed_count||0);

    progressText.textContent=n+" of 100";
    fill.style.width=Math.min(n,100)+"%";

  }catch(e){

    console.error(e);
  }
}


/* LESSON LIST */

async function loadLessons(){

  try{

    const d=await api(
      API+"/lessons?course=spoken-english&language=en"
    );

    const available=d.lessons||[];

    lessons.innerHTML=titles.map((title,i)=>{

      const n=i+1;

      const l=available.find(
        x=>Number(x.lesson_number)===n
      );

      const free=n===1;

      return `
      <div class="lesson">

        <div>
          <div class="num">LESSON ${n}</div>
          <div class="title">${l?.title||title}</div>
          <div class="status">
            ${free?"FREE":"PREMIUM"}
          </div>
        </div>

        ${
          l
          ? `<button class="open"
              onclick="openLesson(${n})">
              Open
             </button>`
          : `<span class="lock">🔒 Locked</span>`
        }

      </div>
      `;

    }).join("");

  }catch(e){

    console.error(e);

    lessons.innerHTML=
      "<p>Unable to load lessons.</p>";
  }
}


/* OPEN LESSON */

async function openLesson(number){

  currentLesson=number;

  dashboard.classList.add("hidden");
  lesson.classList.remove("hidden");

  lessonContent.innerHTML=
    "<p>Loading lesson...</p>";

  try{

    const d=await api(
      API+
      "/lesson?course=spoken-english"+
      "&lesson="+number+
      "&language="+currentLanguage
    );

    const l=d.lesson;

    const dialogues=l.dialogues||[];

    lessonContent.innerHTML=`

      <h2>
        Lesson ${l.lesson_number}: ${l.title}
      </h2>

      <p>${l.objectives||""}</p>

      <div class="languages">

        <button class="language ${currentLanguage==="en"?"active":""}"
          onclick="changeLanguage('en')">
          English
        </button>

        <button class="language ${currentLanguage==="si"?"active":""}"
          onclick="changeLanguage('si')">
          සිංහල
        </button>

        <button class="language ${currentLanguage==="ta"?"active":""}"
          onclick="changeLanguage('ta')">
          தமிழ்
        </button>

      </div>

      <div class="controls">
        <button class="primary" onclick="playAll()">
          ▶ Play All
        </button>

        <button class="stop" onclick="stopAll()">
          ■ Stop
        </button>
      </div>

      ${
        dialogues.length

        ? dialogues.map((x,i)=>`

          <div class="dialogue" id="d${i}">

            <b>DIALOGUE ${x.dialogue_number}</b>

            <div class="lang">

              <b>${languageName(currentLanguage)}</b><br>

              ${x.speaker_a}: ${x.text_a}<br>
              ${x.speaker_b}: ${x.text_b}

            </div>

          </div>

        `).join("")

        : "<p>No dialogues available for this language.</p>"
      }

      <button class="complete"
        onclick="completeLesson(${number})">

        ✓ Mark Lesson ${number} Complete

      </button>
    `;

  }catch(e){

    lessonContent.innerHTML=`

      <button class="back" onclick="back()">
        ← Back
      </button>

      <h3>Unable to load lesson</h3>

      <p>${e.message}</p>
    `;
  }
}


/* LANGUAGE */

function languageName(language){

  if(language==="si") return "සිංහල";
  if(language==="ta") return "தமிழ்";

  return "ENGLISH";
}

function changeLanguage(language){

  currentLanguage=language;

  openLesson(currentLesson);
}


/* PLAY */

function playAll(){

  stopAll();

  playing=true;

  const items=[
    ...document.querySelectorAll(".dialogue")
  ];

  items.forEach((el,i)=>{

    setTimeout(()=>{

      if(!playing)return;

      el.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

      speechSynthesis.speak(
        new SpeechSynthesisUtterance(
          el.innerText
        )
      );

    },i*4500);
  });
}

function stopAll(){

  playing=false;
  speechSynthesis.cancel();
}


/* COMPLETE */

async function completeLesson(number){

  try{

    await api(
      API+"/lesson/complete",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          course:"spoken-english",
          lesson_number:number
        })
      }
    );

    alert("Lesson completed!");

    back();

    loadProgress();

  }catch(e){

    alert(e.message);
  }
}


/* PAYHERE */

async function buyPremium(){

  premiumBtn.disabled=true;
  premiumBtn.textContent="Opening Payment...";

  try{

    const d=await api(
      PAY+"/premium-checkout",
      {
        method:"POST"
      }
    );

    const c=d.checkout;

    if(!c)
      throw Error("Payment information unavailable.");

    const form=document.createElement("form");

    form.method="POST";
    form.action=
      "https://www.payhere.lk/pay/checkout";

    Object.entries(c).forEach(([key,value])=>{

      const input=
        document.createElement("input");

      input.type="hidden";
      input.name=key;
      input.value=value??"";

      form.appendChild(input);
    });

    document.body.appendChild(form);

    form.submit();

  }catch(e){

    console.error(e);

    alert(
      e.message||
      "Unable to start payment."
    );

    premiumBtn.disabled=false;
    premiumBtn.textContent="Get Premium";
  }
}


/* BACK */

function back(){

  stopAll();

  lesson.classList.add("hidden");
  dashboard.classList.remove("hidden");

  window.scrollTo(0,0);
}


/* LOGOUT */

function logout(){

  localStorage.removeItem("createlk_token");

  location.href="/auth/login.html";
}


/* START */

loadPremium();
loadProgress();
loadLessons();

</script>

</body>
</html>
