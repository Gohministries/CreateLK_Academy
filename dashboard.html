<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Spoken English</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,Arial,sans-serif}
header{height:64px;background:#071a3d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-size:20px;font-weight:800}.logout{background:#ffffff12;border:1px solid #ffffff35;color:#fff;padding:8px 13px;border-radius:8px}
main{max-width:1050px;margin:auto;padding:18px}
.back{display:inline-block;color:#1d4ed8;text-decoration:none;font-weight:700;margin:4px 0 15px}
.hero{background:linear-gradient(135deg,#0d47a1,#6938ef);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}
.hero small{opacity:.8;font-weight:700}.hero h1{margin:7px 0;font-size:30px}.hero p{margin:0;opacity:.9}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{background:#ffffff18;border:1px solid #ffffff25;border-radius:12px;padding:10px 14px;font-size:13px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:18px}
.premium{border:2px solid #7c3aed;background:linear-gradient(145deg,#fff,#faf7ff)}
.premium-top{display:flex;justify-content:space-between;gap:15px;align-items:center}
.premium h2{margin:0}.price{font-size:29px;font-weight:900;color:#6d28d9}.muted{color:#64748b;font-size:14px}
.features{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;font-size:13px;color:#475569}
.premium-btn{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #4f46e544}
.premium-btn span{display:block;font-size:11px;font-weight:500;margin-top:4px;opacity:.9}
.active{padding:13px;background:#ecfdf3;border:1px solid #86efac;color:#166534;border-radius:12px;font-weight:800}
.progress-head{display:flex;justify-content:space-between;font-weight:800}.bar{height:9px;background:#e5e7eb;border-radius:20px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;width:0}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.lesson{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;cursor:pointer;transition:.2s}
.lesson:hover{transform:translateY(-2px);border-color:#2563eb}
.lesson.locked{opacity:.72}.num{font-size:11px;font-weight:900;color:#64748b}.title{font-weight:800;margin:7px 0 12px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}.free{background:#dcfce7;color:#166534}.pro{background:#ede9fe;color:#6d28d9}
.complete{color:#16a34a;font-size:12px;font-weight:800;margin-top:9px}
.lesson-view{display:none}.lesson-title{font-size:26px;margin:4px 0}
.lesson-meta{color:#64748b;font-size:13px}
.tabs{display:flex;gap:6px;margin:20px 0 0;background:#f1f5f9;padding:5px;border-radius:12px}
.tab{flex:1;border:0;padding:11px;border-radius:9px;background:transparent;font-weight:800;cursor:pointer}
.tab.active{background:#fff;color:#2563eb;box-shadow:0 2px 8px #00000010}
.lang{display:none}.lang.active{display:block}
.section{margin-top:18px}.section h3{font-size:16px;margin-bottom:8px}.text{line-height:1.65;color:#475569}
.dialogue{border:1px solid #e5e7eb;border-radius:13px;padding:14px;margin:10px 0;background:#fafbff}
.speaker{font-size:12px;font-weight:900;color:#2563eb}.speech{line-height:1.55;margin:4px 0 9px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.controls button,.next{border:0;padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}
.play{background:#2563eb;color:#fff}.stop{background:#111827;color:#fff}.done-btn{background:#16a34a;color:#fff}.next{background:#eef2ff;color:#1d4ed8;margin-top:15px}
.lock-box{text-align:center;padding:28px;background:#faf7ff;border:1px solid #ddd6fe;border-radius:16px}
.lock-box .icon{font-size:35px}.lock-box h3{margin:8px}.loading{text-align:center;padding:30px}
@media(max-width:600px){main{padding:12px}.hero h1{font-size:24px}.premium-top{display:block}.lesson-grid{grid-template-columns:1fr}.tabs{position:sticky;top:64px;z-index:5}}
</style>
</head>

<body>
<header>
  <div class="brand">CreateLK Academy</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>
<a href="#" class="back" onclick="showDashboard();return false">← Back</a>

<section class="hero" id="hero">
  <small>ONLINE COURSE</small>
  <h1>Spoken English</h1>
  <p>Build confidence through practical conversations and real-life situations.</p>
  <div class="stats">
    <div class="stat">100 Lessons</div>
    <div class="stat">1,000 Dialogues</div>
    <div class="stat">English • සිංහල • தமிழ்</div>
  </div>
</section>

<section class="card premium">
  <div class="premium-top">
    <div>
      <h2>👑 Premium Membership</h2>
      <div class="muted">Unlock the complete Spoken English course</div>
    </div>
    <div class="price">LKR 999</div>
  </div>

  <div id="premiumArea"></div>
</section>

<section class="card">
  <div class="progress-head">
    <span>Your Progress</span>
    <span id="progressText">0 / 100</span>
  </div>
  <div class="bar"><i id="progressBar"></i></div>
</section>

<section id="dashboard">
  <h2>Lessons</h2>
  <div class="lesson-grid" id="lessonList"></div>
</section>

<section class="lesson-view card" id="lessonView">
  <div id="lessonContent"></div>
</section>
</main>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";
const token=localStorage.getItem("createlk_token");

if(!token)location.href="/auth/login.html";

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family","Talking About Your Home",
"Daily Routine","Morning Activities","Talking About Your Job","Talking About School","Talking About Friends",
"Asking for Personal Information","Meeting Someone New","Making a Phone Call","Sending a Message",
"Talking About the Time","Talking About the Date","Making Plans","Weekend Plans","Invitations",
"Accepting an Invitation","Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu",
"Paying the Bill","At a Café","Buying Groceries","At a Supermarket","Shopping for Clothes","Asking the Price",
"Returning an Item","At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel","Hotel Problems",
"Talking About Weather","Talking About Hobbies","Sports and Games","Music","Movies and TV","Reading Books",
"Weekend Activities","Holidays","Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms",
"At the Pharmacy","Healthy Habits","Exercise and Fitness","Asking for Help","Offering Help","Giving Advice",
"Asking for Permission","Saying Sorry","Thanking Someone","Compliments","Agreeing and Disagreeing",
"Expressing Opinions","Making Suggestions","Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews","Talking With a Customer",
"Talking With a Manager","Making an Appointment","Office Phone Calls","Meetings","Giving Instructions",
"Asking Questions at Work","Discussing a Project","Talking About Money","Banking","Using an ATM",
"Online Shopping","Using the Internet","Social Media Conversations","Learning English","Practicing English",
"Common English Mistakes","Understanding Fast English","Everyday Expressions","Making Conversation",
"Keeping a Conversation Going","Speaking Politely","Speaking Confidently","Natural English",
"Travel Conversations","Emergency Conversations","Real-Life Situations","Advanced Everyday Conversations",
"Speaking English Confidently"
];

let premium=false,completed=[],current=null,playing=false;

const headers={
 Authorization:"Bearer "+token,
 "Content-Type":"application/json"
};

async function api(url,opt={}){
 const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

async function init(){
 await Promise.all([loadPremium(),loadProgress()]);
 await loadLessons();
}

async function loadPremium(){
 try{
  const d=await api(API+"/premium/status?course=spoken-english");
  premium=!!d.active;
  const exp=d.subscription?.expires_at?
    new Date(d.subscription.expires_at).toLocaleDateString():"";

  document.getElementById("premiumArea").innerHTML=premium?
   `<div class="active">✓ Premium Active${exp?`<br><small>Access until ${exp}</small>`:""}</div>`:
   `<div class="features">
      <span>✓ Lessons 2–100</span>
      <span>✓ 1,000 dialogues</span>
      <span>✓ 30 days access</span>
      <span>✓ 3 languages</span>
    </div>
    <button class="premium-btn" onclick="buyPremium()">
      👑 GET PREMIUM — LKR 999
      <span>30 Days • Unlock Lessons 2–100</span>
    </button>`;
 }catch(e){console.log(e)}
}

async function loadProgress(){
 try{
  const d=await api(API+"/progress?course=spoken-english");
  completed=(d.completed||d.progress||[]).map(x=>Number(x.lesson_number));
 }catch(e){completed=[]}

 document.getElementById("progressText").textContent=
   `${completed.length} / 100`;

 document.getElementById("progressBar").style.width=
   `${Math.min(completed.length,100)}%`;
}

async function loadLessons(){
 let available=[];
 try{
  const d=await api(API+"/lessons?course=spoken-english&language=en");
  available=d.lessons||[];
 }catch(e){}

 const map=new Map(available.map(x=>[Number(x.lesson_number),x]));

 document.getElementById("lessonList").innerHTML=titles.map((title,i)=>{
  const n=i+1,free=n===1,done=completed.includes(n);
  const open=free||premium;

  return `<div class="lesson ${!open?"locked":""}" onclick="openLesson(${n})">
    <div class="num">LESSON ${String(n).padStart(2,"0")}</div>
    <div class="title">${esc(map.get(n)?.title||title)}</div>
    <span class="badge ${free?"free":"pro"}">${free?"FREE":"PREMIUM"}</span>
    ${done?`<div class="complete">✓ COMPLETED</div>`:
      `<div style="margin-top:10px">${open?"Continue →":"🔒 Unlock with Premium"}</div>`}
  </div>`;
 }).join("");
}

async function openLesson(n){
 stop();

 if(n>1&&!premium){
  document.getElementById("premiumArea").scrollIntoView({behavior:"smooth"});
  return;
 }

 document.getElementById("lessonView").style.display="block";
 document.getElementById("lessonContent").innerHTML=
   `<div class="loading">Loading Lesson ${n}...</div>`;

 document.getElementById("lessonView").scrollIntoView({behavior:"smooth"});

 try{
  const [en,si,ta]=await Promise.all([
   api(`${API}/lesson?course=spoken-english&lesson=${n}&language=en`),
   api(`${API}/lesson?course=spoken-english&lesson=${n}&language=si`),
   api(`${API}/lesson?course=spoken-english&lesson=${n}&language=ta`)
  ]);

  current=en.lesson;

  document.getElementById("lessonContent").innerHTML=`
   <div class="lesson-meta">LESSON ${String(n).padStart(2,"0")}</div>
   <h2 class="lesson-title">${esc(en.lesson.title||titles[n-1])}</h2>

   <div class="controls">
    <button class="play" onclick="playAll()">▶ Play All</button>
    <button class="stop" onclick="stop()">■ Stop</button>
    <button class="done-btn" onclick="completeLesson(${n})">✓ Mark Complete</button>
   </div>

   <div class="tabs">
    <button class="tab active" onclick="tab(this,'en')">English</button>
    <button class="tab" onclick="tab(this,'si')">සිංහල</button>
    <button class="tab" onclick="tab(this,'ta')">தமிழ்</button>
   </div>

   ${lang("en","English",en.lesson)}
   ${lang("si","සිංහල",si.lesson)}
   ${lang("ta","தமிழ்",ta.lesson)}

   <button class="next" onclick="nextLesson(${n})">
     ${n<100?"Next Lesson →":"🎉 Course Complete"}
   </button>
  `;

 }catch(e){
  document.getElementById("lessonContent").innerHTML=`
   <div class="lock-box">
    <div class="icon">🔒</div>
    <h3>Premium Lesson</h3>
    <p>This lesson requires Premium membership.</p>
    <button class="premium-btn" onclick="buyPremium()">
      👑 GET PREMIUM — LKR 999
      <span>30 Days • Unlock Lessons 2–100</span>
    </button>
   </div>`;
 }
}

function lang(id,name,l){
 if(!l)return"";
 const ds=l.dialogues||[];

 return `<div id="lang-${id}" class="lang ${id==="en"?"active":""}">
  <div class="section">
   <h3>Objectives</h3>
   <div class="text">${fmt(l.objectives)}</div>
  </div>

  <div class="section">
   <h3>Lesson</h3>
   <div class="text">${fmt(l.content)}</div>
  </div>

  <div class="section">
   <h3>Key Points</h3>
   <div class="text">${fmt(l.key_points)}</div>
  </div>

  <div class="section">
   <h3>Practical Dialogues</h3>
   ${ds.length?ds.map((d,i)=>`
    <div class="dialogue">
     <div class="speaker">${esc(d.speaker_a||"Speaker A")}</div>
     <div class="speech">${esc(d.text_a||"")}</div>
     <div class="speaker">${esc(d.speaker_b||"Speaker B")}</div>
     <div class="speech">${esc(d.text_b||"")}</div>
    </div>`).join(""):"<p>No dialogues available.</p>"}
  </div>

  <div class="section">
   <h3>Summary</h3>
   <div class="text">${fmt(l.summary)}</div>
  </div>
 </div>`;
}

function tab(btn,id){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".lang").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 document.getElementById("lang-"+id).classList.add("active");
}

function playAll(){
 if(!current?.dialogues?.length)return alert("No dialogues available.");
 stop();playing=true;
 const ds=current.dialogues;
 let i=0;

 function next(){
  if(!playing||i>=ds.length)return;
  const d=ds[i++];
  const u=new SpeechSynthesisUtterance(
   `${d.speaker_a||"Speaker A"}: ${d.text_a||""}. `+
   `${d.speaker_b||"Speaker B"}: ${d.text_b||""}`
  );
  u.lang="en-US";u.rate=.9;
  u.onend=()=>setTimeout(next,350);
  speechSynthesis.speak(u);
 }
 next();
}

function stop(){
 playing=false;
 if(window.speechSynthesis)speechSynthesis.cancel();
}

async function completeLesson(n){
 try{
  await api(API+"/lesson/complete",{
   method:"POST",
   body:JSON.stringify({course:"spoken-english",lesson_number:n})
  });
  if(!completed.includes(n))completed.push(n);
  await loadProgress();
  await loadLessons();
  alert("Lesson completed ✓");
 }catch(e){alert(e.message)}
}

function nextLesson(n){
 if(n<100)openLesson(n+1);
}

function showDashboard(){
 stop();
 document.getElementById("lessonView").style.display="none";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function buyPremium(){
 try{
  const d=await api(PAY+"/premium-checkout",{
   method:"POST",
   body:JSON.stringify({course:"spoken-english"})
  });

  if(!d.success)throw Error(d.error||"Unable to start payment.");

  const f=document.createElement("form");
  f.method="POST";
  f.action="https://www.payhere.lk/pay/checkout";

  Object.entries(d.fields||{}).forEach(([k,v])=>{
   const i=document.createElement("input");
   i.type="hidden";i.name=k;i.value=v;f.appendChild(i);
  });

  document.body.appendChild(f);
  f.submit();

 }catch(e){
  alert("Payment Error: "+e.message);
 }
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function fmt(x){
 return esc(x||"").replace(/\n/g,"<br>");
}

function logout(){
 stop();
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

init();
</script>
</body>
</html>
