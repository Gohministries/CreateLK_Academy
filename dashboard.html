<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Spoken English</title>

<link rel="icon" href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#172554}
.brand img{width:42px;height:42px}
button,select{font:inherit}
button{cursor:pointer;border:0}
.logout{padding:9px 14px;border-radius:9px;background:#eef2ff;color:#3730a3;font-weight:700}

.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:32px 16px}
.hero-inner,.container{max-width:1100px;margin:auto}
.hero h1{font-size:36px;margin-bottom:5px}
.hero p{font-size:14px;color:#dbeafe}
select{margin-top:15px;padding:9px 12px;border-radius:8px;border:0}

.container{padding:25px 16px 50px}

.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;margin-bottom:18px}
.card h2{font-size:18px;color:#172554}
.card p{font-size:13px;color:#64748b;margin-top:4px}

.premium{display:flex;justify-content:space-between;align-items:center;gap:15px}
.premium-btn,.complete{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:10px 16px;border-radius:9px;font-weight:700}
.active{color:#15803d;font-weight:800;font-size:12px}
.expired{color:#b91c1c;font-weight:800;font-size:12px}
.countdown{margin-top:7px;color:#175cd3!important;font-weight:700}

.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:12px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed)}

.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lesson{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:16px}
.number{color:#175cd3;font-weight:900;font-size:12px}
.lesson h3{font-size:14px;margin:7px 0}
.badge{font-size:10px;font-weight:800;color:#64748b}
.free{color:#15803d}
.locked{color:#b91c1c}
.open{float:right;background:#172554;color:#fff;padding:6px 9px;border-radius:7px;font-size:10px}

.loading{text-align:center;color:#64748b;padding:35px}

.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px}
.modal.show{display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;margin-bottom:15px}
.close{background:#f1f5f9;border-radius:50%;width:32px;height:32px}
.dialogue{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0;font-size:13px}
.dialogue strong{color:#175cd3}
.complete{width:100%;margin-top:15px}

@media(max-width:600px){
 .lessons{grid-template-columns:1fr}
 .premium{align-items:flex-start;flex-direction:column}
 .hero h1{font-size:30px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a class="brand" href="index.html">
<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">
<span>CreateLK Academy</span>
</a>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<section class="hero">
<div class="hero-inner">
<h1>Spoken English</h1>
<p>100 Lessons • 1,000 Practical Dialogues</p>

<select id="language" onchange="loadLessons()">
<option value="en">English</option>
<option value="si">සිංහල</option>
<option value="ta">தமிழ்</option>
</select>
</div>
</section>

<main class="container">

<div class="card premium">
<div>
<h2>Premium Membership</h2>
<p id="premiumStatus">Checking...</p>
<p id="countdown"></p>
</div>
<button id="premiumBtn" class="premium-btn" onclick="premium()">
Get Premium
</button>
</div>

<div class="card">
<h2>Your Progress</h2>
<p id="progressText">0 of 100 lessons completed</p>
<div class="progress"><div id="progressBar"></div></div>
</div>

<h2 style="margin:20px 0 12px;color:#172554">
100 Spoken English Lessons
</h2>

<div id="lessons" class="lessons">
<div class="loading">Loading lessons...</div>
</div>

</main>


<div id="modal" class="modal">
<div class="modal-box">

<div class="modal-head">
<h2 id="modalTitle"></h2>
<button class="close" onclick="closeLesson()">×</button>
</div>

<div id="content">
Loading...
</div>

<button id="completeBtn" class="complete" onclick="completeLesson()">
Mark Lesson Complete
</button>

</div>
</div>


<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const PREMIUM="https://createlk-premium-api.createlk.workers.dev";
const PAYHERE="https://createlk-payhere.createlk.workers.dev";
const COURSE="spoken-english";
const token=localStorage.getItem("createlk_token");

let premiumActive=false;
let currentLesson=null;
let completed=new Set();

if(!token) location.href="auth/login.html";

const headers={
 "Authorization":"Bearer "+token,
 "Content-Type":"application/json"
};

async function request(url,options={}){
 return fetch(url,{
   ...options,
   headers:{...headers,...(options.headers||{})}
 });
}

async function init(){
 await checkPremium();
 await loadProgress();
 await loadLessons();
}

async function checkPremium(){

 const r=await request(
   PREMIUM+"/premium/status?course="+COURSE
 );

 if(!r.ok){
   showExpired();
   return;
 }

 const d=await r.json();

 premiumActive=d.active===true;

 if(premiumActive){

   document.getElementById("premiumStatus").innerHTML=
   '<span class="active">✓ PREMIUM ACTIVE</span>';

   document.getElementById("premiumBtn").style.display="none";

   if(d.expires_at) countdown(d.expires_at);

 }else{
   showExpired();
 }
}

function showExpired(){
 document.getElementById("premiumStatus").innerHTML=
 '<span class="expired">PREMIUM NOT ACTIVE</span>';

 document.getElementById("countdown").textContent=
 "Lessons 2–100 require Premium.";
}

function countdown(date){

 setInterval(()=>{

   const diff=new Date(date)-Date.now();

   if(diff<=0){
     premiumActive=false;
     showExpired();
     return;
   }

   const days=Math.floor(diff/86400000);
   const hours=Math.floor(diff%86400000/3600000);
   const minutes=Math.floor(diff%3600000/60000);

   document.getElementById("countdown").textContent=
   `Premium remaining: ${days}d ${hours}h ${minutes}m`;

 },1000);
}

async function loadProgress(){

 const r=await request(
   API+"/progress?course="+COURSE
 );

 if(!r.ok)return;

 const d=await r.json();

 completed=new Set(
   (d.completed_lessons||[]).map(Number)
 );

 updateProgress();
}

function updateProgress(){

 const count=completed.size;

 document.getElementById("progressText").textContent=
 `${count} of 100 lessons completed`;

 document.getElementById("progressBar").style.width=
 `${Math.min(count,100)}%`;
}

async function loadLessons(){

 const language=
   document.getElementById("language").value;

 const box=document.getElementById("lessons");

 box.innerHTML=
 '<div class="loading">Loading lessons from Cloudflare...</div>';

 const r=await request(
   API+"/lessons?course="+COURSE+
   "&language="+language
 );

 if(!r.ok){
   box.innerHTML=
   '<div class="loading">Unable to load lessons.</div>';
   return;
 }

 const d=await r.json();

 const lessons=d.lessons||[];

 box.innerHTML=lessons.map(l=>{

   const n=Number(l.lesson_number);
   const free=n===1||l.is_free===1||l.is_free===true;
   const unlocked=free||premiumActive;
   const done=completed.has(n);

   return `
   <div class="lesson">

     <div class="number">
       LESSON ${n}
     </div>

     <h3>${escape(l.title||"Lesson "+n)}</h3>

     <span class="badge ${free?"free":unlocked?"":"locked"}">
       ${done?"✓ Completed":
         free?"FREE FOREVER":
         unlocked?"PREMIUM":
         "🔒 PREMIUM"}
     </span>

     <button
       class="open"
       ${unlocked?"":"disabled"}
       onclick="openLesson(${n})"
     >
       ${unlocked?"Open":"Locked"}
     </button>

   </div>`;
 }).join("");
}

async function openLesson(number){

 if(number!==1&&!premiumActive){
   premium();
   return;
 }

 currentLesson=number;

 document.getElementById("modal").classList.add("show");
 document.getElementById("modalTitle").textContent=
   "Lesson "+number;

 document.getElementById("content").innerHTML=
   "<p>Loading lesson...</p>";

 const language=
   document.getElementById("language").value;

 const r=await request(
   API+"/lesson?course="+COURSE+
   "&lesson="+number+
   "&language="+language
 );

 if(!r.ok){
   document.getElementById("content").innerHTML=
   "<p>Unable to load this lesson.</p>";
   return;
 }

 const d=await r.json();

 document.getElementById("modalTitle").textContent=
   d.title||"Lesson "+number;

 let html="";

 if(d.objectives)
   html+=`<p>${escape(d.objectives)}</p>`;

 if(Array.isArray(d.dialogues)){

   html+="<h3 style='margin:18px 0 8px'>10 Practical Dialogues</h3>";

   d.dialogues.forEach(x=>{
     html+=`
     <div class="dialogue">
       <strong>${escape(x.speaker_a||"A")}:</strong>
       ${escape(x.text_a||"")}
       <br><br>
       <strong>${escape(x.speaker_b||"B")}:</strong>
       ${escape(x.text_b||"")}
     </div>`;
   });

 }else if(d.content){

   html+=`<p>${escape(d.content)}</p>`;
 }

 document.getElementById("content").innerHTML=html;

 document.getElementById("completeBtn").textContent=
   completed.has(number)
   ?"✓ Lesson Completed"
   :"Mark Lesson Complete";
}

async function completeLesson(){

 if(!currentLesson||completed.has(currentLesson))return;

 const btn=document.getElementById("completeBtn");

 btn.disabled=true;
 btn.textContent="Saving...";

 const r=await request(
   API+"/lesson/complete",
   {
     method:"POST",
     body:JSON.stringify({
       course:COURSE,
       lesson_number:currentLesson
     })
   }
 );

 if(!r.ok){
   btn.disabled=false;
   btn.textContent="Mark Lesson Complete";
   alert("Unable to save progress.");
   return;
 }

 completed.add(currentLesson);

 updateProgress();
 loadLessons();

 btn.textContent="✓ Lesson Completed";
}

function closeLesson(){
 document.getElementById("modal").classList.remove("show");
 currentLesson=null;
}

function premium(){
 location.href=PAYHERE+"/?course="+COURSE;
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="auth/login.html";
}

function escape(value){
 const div=document.createElement("div");
 div.textContent=value??"";
 return div.innerHTML;
}

init();

</script>

</body>
</html>
