<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold}
.logout{background:#374151;color:white}
.container{max-width:1100px;margin:auto;padding:20px}
.hero{background:white;padding:25px;border-radius:16px;margin-bottom:18px}
.hero h1{margin:0 0 8px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
.premium{border:2px solid #f59e0b}
.price{font-size:25px;font-weight:bold;color:#b45309}
.active{color:#16a34a;font-weight:bold}
.status{margin-top:8px}
.countdown{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.time{background:#111827;color:white;padding:10px 13px;border-radius:9px;text-align:center;min-width:65px}
.time b{display:block;font-size:20px}
.time small{font-size:10px;color:#d1d5db}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lesson{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
.lesson h3{margin:0 0 7px;font-size:16px}
.lesson p{color:#6b7280;font-size:13px}
.open{background:#2563eb;color:white}
.locked{background:#f3f4f6;color:#6b7280}
.progressbar{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}
.progressfill{height:100%;background:#2563eb;width:0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px;overflow:auto}
.modalbox{background:white;max-width:850px;margin:30px auto;border-radius:16px;padding:22px}
.dialogue{padding:12px;border-bottom:1px solid #eee}
.speaker{font-weight:bold;color:#2563eb}
.close{float:right;background:#e5e7eb}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
@media(max-width:600px){
 .container{padding:12px}
 .time{min-width:58px}
}
</style>
</head>

<body>

<header>
<h2>CreateLK Academy</h2>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main class="container">

<section class="hero">
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<b>100 Lessons • 1,000 Practical Dialogues</b>
</section>

<section class="card premium">
<h2>👑 Premium Membership</h2>
<div class="price">LKR 999 • 30 Days</div>

<div id="premiumStatus" class="status">Checking...</div>

<div id="premiumCountdown" class="countdown" style="display:none">
<div class="time"><b id="countDays">00</b><small>DAYS</small></div>
<div class="time"><b id="countHours">00</b><small>HOURS</small></div>
<div class="time"><b id="countMinutes">00</b><small>MINUTES</small></div>
<div class="time"><b id="countSeconds">00</b><small>SECONDS</small></div>
</div>

<p id="premiumExpiry"></p>

<button id="premiumBtn" onclick="buyPremium()">GET PREMIUM</button>
</section>

<section class="card">
<h3>Your Progress</h3>
<div id="progressText">0 of 100</div>
<div class="progressbar">
<div id="progressFill" class="progressfill"></div>
</div>
</section>

<section class="card">
<h2>100 Spoken English Lessons</h2>
<div id="lessons" class="lessons"></div>
</section>

</main>

<div id="modal" class="modal" onclick="closeModal(event)">
<div class="modalbox" onclick="event.stopPropagation()">
<button class="close" onclick="closeLesson()">✕</button>

<h2 id="lessonTitle"></h2>
<p id="lessonInfo"></p>

<div class="controls">
<button onclick="playAll()">🔊 Play All</button>
<button onclick="speechSynthesis.cancel()">⏹ Stop</button>
</div>

<div id="lessonContent"></div>

<br>
<button id="completeBtn" onclick="completeLesson()">✓ Complete Lesson</button>
</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";
const COURSE="spoken-english";
const TOKEN=localStorage.getItem("createlk_token");

if(!TOKEN) location.href="/auth/login.html";

const $=id=>document.getElementById(id);

let premium=false;
let premiumTimer=null;
let currentLesson=0;
let currentData=null;
let completed=new Set();

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities",
"Talking About Your Job","Talking About School","Talking About Friends",
"Asking for Personal Information","Meeting Someone New","Making a Phone Call",
"Sending a Message","Talking About the Time","Talking About the Date",
"Making Plans","Weekend Plans","Invitations","Accepting an Invitation",
"Refusing Politely","At the Restaurant","Ordering Food","Asking About a Menu",
"Paying the Bill","At a Café","Buying Groceries","At a Supermarket",
"Shopping for Clothes","Asking the Price","Returning an Item","At the Bus Stop",
"Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel",
"Hotel Problems","Talking About Weather","Talking About Hobbies","Sports and Games",
"Music","Movies and TV","Reading Books","Weekend Activities","Holidays",
"Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms",
"At the Pharmacy","Healthy Habits","Exercise and Fitness","Asking for Help",
"Offering Help","Giving Advice","Asking for Permission","Saying Sorry",
"Thanking Someone","Compliments","Agreeing and Disagreeing","Expressing Opinions",
"Making Suggestions","Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews",
"Talking With a Customer","Talking With a Manager","Making an Appointment",
"Office Phone Calls","Meetings","Giving Instructions","Asking Questions at Work",
"Discussing a Project","Talking About Money","Banking","Using an ATM",
"Online Shopping","Using the Internet","Social Media Conversations",
"Learning English","Practicing English","Common English Mistakes",
"Understanding Fast English","Everyday Expressions","Making Conversation",
"Keeping a Conversation Going","Speaking Politely","Speaking Confidently",
"Natural English","Travel Conversations","Emergency Conversations",
"Real-Life Situations","Advanced Everyday Conversations",
"Speaking English Confidently"
];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[m]));
}

function startPremiumCountdown(expiresAt){

 clearInterval(premiumTimer);

 if(!expiresAt){
  $("premiumCountdown").style.display="none";
  return;
 }

 const raw=String(expiresAt);
 const end=raw.includes("T")
   ?new Date(raw.endsWith("Z")?raw:raw+"Z")
   :new Date(raw.replace(" ","T")+"Z");

 if(isNaN(end.getTime())) return;

 $("premiumCountdown").style.display="flex";

 function update(){

  const left=end-Date.now();

  if(left<=0){
   clearInterval(premiumTimer);
   premium=false;
   $("premiumStatus").innerHTML=
    '<span style="color:#dc2626;font-weight:bold">✕ Premium Expired</span>';
   $("premiumCountdown").style.display="none";
   $("premiumBtn").style.display="block";
   loadLessons();
   return;
  }

  const s=Math.floor(left/1000);
  const d=Math.floor(s/86400);
  const h=Math.floor(s%86400/3600);
  const m=Math.floor(s%3600/60);
  const sec=s%60;

  $("countDays").textContent=String(d).padStart(2,"0");
  $("countHours").textContent=String(h).padStart(2,"0");
  $("countMinutes").textContent=String(m).padStart(2,"0");
  $("countSeconds").textContent=String(sec).padStart(2,"0");

  $("premiumExpiry").textContent=
   "Expires "+end.toLocaleDateString("en-GB",{
    day:"2-digit",month:"long",year:"numeric"
   })+" at "+end.toLocaleTimeString("en-GB",{
    hour:"2-digit",minute:"2-digit"
   });
 }

 update();
 premiumTimer=setInterval(update,1000);
}

async function loadLessons(){

 try{

  const r=await fetch(
   `${API}/lessons?course=${COURSE}&language=en`,
   {headers:{Authorization:`Bearer ${TOKEN}`}}
  );

  const d=await r.json();

  premium=!!d.premium;

  if(premium){
   $("premiumStatus").innerHTML=
    '<span class="active">✓ Premium Active</span>';
   $("premiumBtn").style.display="none";

   if(d.subscription)
    startPremiumCountdown(d.subscription.expires_at);

  }else{
   $("premiumStatus").textContent="Premium not active";
   $("premiumBtn").style.display="block";
   $("premiumCountdown").style.display="none";
   clearInterval(premiumTimer);
  }

  renderLessons(d.lessons||[]);

 }catch(e){
  console.error(e);
  $("premiumStatus").textContent="Unable to load membership";
 }
}

function renderLessons(apiLessons){

 const map={};

 apiLessons.forEach(x=>map[x.lesson_number]=x);

 $("lessons").innerHTML=titles.map((title,i)=>{

  const n=i+1;
  const api=map[n];
  const free=n===1 || api?.free || api?.is_free;
  const unlocked=free || premium;
  const done=completed.has(n);

  return `
  <div class="lesson">
   <h3>LESSON ${n}</h3>
   <strong>${esc(title)}</strong>
   <p>${free?"Free lesson":"Premium lesson"}</p>

   <button class="${unlocked?"open":"locked"}"
    onclick="${unlocked?`openLesson(${n})`:"buyPremium()"}">
    ${done?"✓ COMPLETED":unlocked?"Open":"🔒 Premium"}
   </button>
  </div>`;
 }).join("");
}

async function openLesson(n){

 currentLesson=n;

 try{

  const r=await fetch(
   `${API}/lesson?course=${COURSE}&lesson=${n}&language=en`,
   {headers:{Authorization:`Bearer ${TOKEN}`}}
  );

  const d=await r.json();

  if(!d.success){
   alert(d.message||"Unable to open lesson");
   return;
  }

  currentData=d.lesson;

  $("lessonTitle").textContent=
   "Lesson "+n+": "+(currentData.title||titles[n-1]);

  $("lessonInfo").textContent=
   currentData.summary||"Practical English conversation";

  let html="";

  if(currentData.content)
   html+=`<div><b>Lesson:</b><br>${esc(currentData.content)}</div>`;

  const dialogues=currentData.dialogues||[];

  dialogues.forEach(x=>{
   html+=`
   <div class="dialogue">
    <div class="speaker">${esc(x.speaker_a)}</div>
    <div>${esc(x.text_a)}</div>
    <br>
    <div class="speaker">${esc(x.speaker_b)}</div>
    <div>${esc(x.text_b)}</div>
   </div>`;
  });

  if(currentData.key_points)
   html+=`<p><b>Key Points</b><br>${esc(currentData.key_points)}</p>`;

  if(currentData.questions?.length){
   html+="<h3>Practice Questions</h3>";
   currentData.questions.forEach(q=>{
    html+=`<div class="dialogue"><b>${esc(q.question)}</b></div>`;
   });
  }

  $("lessonContent").innerHTML=
   html||"<p>Lesson content will be available soon.</p>";

  $("modal").style.display="block";

 }catch(e){
  console.error(e);
  alert("Unable to load lesson.");
 }
}

function playAll(){

 if(!currentData)return;

 speechSynthesis.cancel();

 let text=currentData.title+".";

 if(currentData.content)
  text+=" "+currentData.content;

 (currentData.dialogues||[]).forEach(x=>{
  text+=" "+x.speaker_a+". "+x.text_a;
  text+=" "+x.speaker_b+". "+x.text_b;
 });

 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 u.rate=.9;
 speechSynthesis.speak(u);
}

async function completeLesson(){

 if(!currentLesson)return;

 try{

  const r=await fetch(`${API}/lesson/complete`,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    Authorization:`Bearer ${TOKEN}`
   },
   body:JSON.stringify({
    course:COURSE,
    lesson_number:currentLesson
   })
  });

  const d=await r.json();

  if(d.success){
   completed.add(currentLesson);
   loadProgress();
   loadLessons();
   $("completeBtn").textContent="✓ Completed";
  }else{
   alert(d.message||"Unable to save progress");
  }

 }catch(e){
  alert("Unable to save progress");
 }
}

async function loadProgress(){

 try{

  const r=await fetch(
   `${API}/progress?course=${COURSE}`,
   {headers:{Authorization:`Bearer ${TOKEN}`}}
  );

  const d=await r.json();

  const list=d.progress||d.lessons||[];

  completed=new Set(
   list.map(x=>Number(x.lesson_number))
  );

  const count=completed.size;

  $("progressText").textContent=
   `${count} of 100`;

  $("progressFill").style.width=
   `${count}%`;

 }catch(e){}
}

async function buyPremium(){

 try{

  const r=await fetch(`${PAY}/premium-checkout`,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    Authorization:`Bearer ${TOKEN}`
   },
   body:JSON.stringify({
    course:COURSE
   })
  });

  const d=await r.json();

  if(!d.success){
   alert(d.message||"Unable to start payment");
   return;
  }

  const form=document.createElement("form");

  form.method="POST";
  form.action="https://www.payhere.lk/pay/checkout";

  Object.entries(d).forEach(([key,value])=>{

   if(key==="success")return;

   const input=document.createElement("input");

   input.type="hidden";
   input.name=key;
   input.value=value;

   form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();

 }catch(e){
  console.error(e);
  alert("Payment could not be started.");
 }
}

function closeLesson(){
 $("modal").style.display="none";
 speechSynthesis.cancel();
}

function closeModal(e){
 if(e.target.id==="modal")closeLesson();
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

loadProgress();
loadLessons();
</script>

</body>
</html>
