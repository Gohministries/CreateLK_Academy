<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#071b3a;color:#fff;padding:15px 18px;display:flex;justify-content:space-between}
header b{font-size:20px}
button{border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer}
.logout{background:none;color:#fff;border:1px solid #ffffff55}
main{max-width:850px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#1264d6,#063c82);color:white;padding:25px;border-radius:17px;margin-bottom:15px}
.hero h1{margin:5px 0}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 18px #0000000b}
.premium{background:#eef6ff}
.price{font-size:25px;font-weight:bold;color:#1264d6;margin:7px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px}
.primary{background:#1264d6;color:white}
.progress{height:9px;background:#e5e9ef;border-radius:20px;margin-top:9px}
.fill{height:100%;background:#1264d6;border-radius:20px}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e2e6ec;border-radius:10px;margin:7px 0}
.num{font-size:11px;color:#1264d6;font-weight:bold}
.title{font-weight:bold;margin:3px 0}
.status{font-size:11px;color:#687386}
.open{background:#edf4ff;color:#1264d6}
.lock{font-size:12px;color:#888}
.hidden{display:none}
.dialogue{padding:14px;border:1px solid #e2e6ec;border-radius:11px;margin:9px 0}
.lang{margin-top:10px;line-height:1.5}
.lang b{font-size:11px;color:#687386}
.controls{display:flex;gap:8px;margin:15px 0}
.stop{background:#eee}
.complete{width:100%;background:#138544;color:white;margin-top:12px}
.back{background:none;color:#1264d6;padding:0}
</style>
</head>

<body>

<header>
  <b>CreateLK Academy</b>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div id="dashboard">

  <div class="hero">
    <small>ONLINE COURSE</small>
    <h1>Spoken English</h1>
    <p>Build confidence through practical conversations and real-life situations.</p>
  </div>

  <div class="card premium">
    <div class="row">
      <div>
        <b>Premium Membership</b>
        <div id="premiumStatus">Checking...</div>
        <div class="price" id="price">LKR 999</div>
        <small id="expiry">30 days access</small>
      </div>
      <button id="premiumBtn" class="primary" onclick="premium()">
        Get Premium
      </button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <b>Your Progress</b>
      <span id="progressText">0 of 100</span>
    </div>
    <div class="progress">
      <div id="fill" class="fill"></div>
    </div>
  </div>

  <div class="card">
    <h3>Spoken English — 100 Lessons</h3>
    <div id="lessons">Loading...</div>
  </div>

</div>


<div id="lesson" class="card hidden">
  <button class="back" onclick="back()">← Back</button>
  <div id="lessonContent"></div>
</div>

</main>

<script>

const ACADEMY="https://createlk-academy-api.createlk.workers.dev";
const PAYHERE="https://createlk-payhere.createlk.workers.dev";
const token=localStorage.getItem("createlk_token");

if(!token) location.href="/auth/login.html";

const titles=[
"Introducing Yourself","Greetings and Small Talk","Talking About Your Family",
"Talking About Your Home","Daily Routine","Morning Activities","Talking About Your Job",
"Talking About School","Talking About Friends","Asking for Personal Information",
"Meeting Someone New","Making a Phone Call","Sending a Message","Talking About the Time",
"Talking About the Date","Making Plans","Weekend Plans","Invitations",
"Accepting an Invitation","Refusing Politely","At the Restaurant","Ordering Food",
"Asking About a Menu","Paying the Bill","At a Café","Buying Groceries",
"At a Supermarket","Shopping for Clothes","Asking the Price","Returning an Item",
"At the Bus Stop","Taking a Bus","Taking a Taxi","Asking for Directions","Finding a Place",
"At the Train Station","Buying a Ticket","At the Airport","Checking Into a Hotel",
"Hotel Problems","Talking About Weather","Talking About Hobbies","Sports and Games",
"Music","Movies and TV","Reading Books","Weekend Activities","Holidays",
"Birthday Conversations","Celebrations","At the Doctor","Describing Symptoms",
"At the Pharmacy","Healthy Habits","Exercise and Fitness","Asking for Help",
"Offering Help","Giving Advice","Asking for Permission","Saying Sorry",
"Thanking Someone","Compliments","Agreeing and Disagreeing","Expressing Opinions",
"Making Suggestions","Making Decisions","Solving a Problem","Making a Complaint",
"Apologizing Professionally","Workplace Conversations","Job Interviews",
"Talking With a Customer","Talking With a Manager","Making an Appointment",
"Office Phone Calls","Meetings","Giving Instructions","Asking Questions at Work",
"Discussing a Project","Talking About Money","Banking","Using an ATM","Online Shopping",
"Using the Internet","Social Media Conversations","Learning English","Practicing English",
"Common English Mistakes","Understanding Fast English","Everyday Expressions",
"Making Conversation","Keeping a Conversation Going","Speaking Politely",
"Speaking Confidently","Natural English","Travel Conversations","Emergency Conversations",
"Real-Life Situations","Advanced Everyday Conversations","Speaking English Confidently"
];

async function api(url,opt={}){
  opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};
  const r=await fetch(url,opt),d=await r.json();
  if(!r.ok)throw Error(d.error||"Request failed");
  return d;
}

async function load(){

  try{
    const p=await api(PAYHERE+"/premium-status");
    document.getElementById("price").textContent="LKR "+Number(p.price_lkr||999).toLocaleString();

    if(p.active){
      premiumStatus.innerHTML='<b style="color:#138544">✓ PREMIUM ACTIVE</b>';
      premiumBtn.textContent="Premium Active";
      premiumBtn.disabled=true;
      expiry.textContent="Expires: "+new Date(p.subscription.expires_at).toLocaleDateString();
    }else{
      premiumStatus.innerHTML='<span style="color:#c62828">Premium not active</span>';
    }
  }catch(e){console.log(e)}

  try{
    const p=await api(ACADEMY+"/progress?course=spoken-english");
    const n=Number(p.completed||p.completed_lessons||0);
    progressText.textContent=n+" of 100";
    fill.style.width=n+"%";
  }catch(e){}

  try{
    const d=await api(ACADEMY+"/lessons?course=spoken-english&language=en");
    const available=d.lessons||[];

    lessons.innerHTML=titles.map((t,i)=>{
      const n=i+1,l=available.find(x=>Number(x.lesson_number)===n);
      const done=l&&(l.completed||l.is_completed);
      const free=n===1||(l&&l.is_free);

      return `<div class="lesson">
        <div>
          <div class="num">LESSON ${n}</div>
          <div class="title">${t}</div>
          <div class="status">${
            done?"✓ COMPLETED":free?"FREE":"PREMIUM"
          }</div>
        </div>
        ${
          l||free
          ?`<button class="open" onclick="openLesson(${n})">Open</button>`
          :`<span class="lock">🔒 Locked</span>`
        }
      </div>`;
    }).join("");

  }catch(e){lessons.innerHTML="Unable to load lessons."}
}

async function premium(){

  premiumBtn.disabled=true;
  premiumBtn.textContent="Preparing...";

  try{
    const d=await api(PAYHERE+"/premium-checkout",{method:"POST"});
    const c=d.checkout;

    const form=document.createElement("form");
    form.method="POST";
    form.action="https://www.payhere.lk/pay/checkout";

    Object.entries(c).forEach(([k,v])=>{
      const i=document.createElement("input");
      i.type="hidden";i.name=k;i.value=v||"";
      form.appendChild(i);
    });

    document.body.appendChild(form);
    form.submit();

  }catch(e){
    alert(e.message);
    premiumBtn.disabled=false;
    premiumBtn.textContent="Get Premium";
  }
}

async function openLesson(n){

  dashboard.classList.add("hidden");
  lesson.classList.remove("hidden");
  lessonContent.innerHTML="Loading...";

  try{
    const d=await api(
      ACADEMY+"/lesson?course=spoken-english&lesson="+n+"&language=en"
    );

    const l=d.lesson||d;
    const ds=d.dialogues||[];

    lessonContent.innerHTML=`
      <h2>Lesson ${n}: ${l.title||titles[n-1]}</h2>
      ${l.objectives?`<p>${l.objectives}</p>`:""}

      <div class="controls">
        <button class="primary" onclick="play()">▶ Play All</button>
        <button class="stop" onclick="stop()">■ Stop</button>
      </div>

      ${ds.map((x,i)=>`
        <div class="dialogue" id="d${i}">
          <b>DIALOGUE ${i+1}</b>

          <div class="lang">
            <b>ENGLISH</b><br>
            ${x.speaker_a}: ${x.text_a}<br>
            ${x.speaker_b}: ${x.text_b}
          </div>

          ${x.sinhala_a?`
          <div class="lang">
            <b>SINHALA</b><br>
            A: ${x.sinhala_a}<br>
            B: ${x.sinhala_b}
          </div>`:""}

          ${x.tamil_a?`
          <div class="lang">
            <b>TAMIL</b><br>
            A: ${x.tamil_a}<br>
            B: ${x.tamil_b}
          </div>`:""}
        </div>
      `).join("")}

      <button class="complete" onclick="complete(${n})">
        ✓ Mark Lesson ${n} Complete
      </button>
    `;

  }catch(e){
    lessonContent.innerHTML="<p>"+e.message+"</p>";
  }
}

let speech=[];

function play(){

  stop();

  speech=[
    ...document.querySelectorAll(".dialogue")
  ].map(x=>x.innerText);

  speech.forEach((text,i)=>{
    setTimeout(()=>{
      if(!speech.length)return;

      document.getElementById("d"+i)?.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

      speechSynthesis.speak(
        new SpeechSynthesisUtterance(text)
      );
    },i*5000);
  });
}

function stop(){
  speech=[];
  speechSynthesis.cancel();
}

async function complete(n){

  try{
    await api(
      ACADEMY+"/lesson/complete",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          course:"spoken-english",
          lesson_number:n
        })
      }
    );

    alert("Lesson completed!");
    back();
    load();

  }catch(e){
    alert(e.message);
  }
}

function back(){
  stop();
  lesson.classList.add("hidden");
  dashboard.classList.remove("hidden");
  window.scrollTo(0,0);
}

function logout(){
  localStorage.removeItem("createlk_token");
  location.href="/auth/login.html";
}

load();

</script>

</body>
</html>
