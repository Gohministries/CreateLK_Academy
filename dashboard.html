<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;padding:16px 20px}
.head,.wrap{max-width:1050px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}.logo b{color:#fbbf24}
.logout{background:#ffffff20;color:#fff;border:0;padding:9px 13px;border-radius:9px}
.wrap{padding:25px 15px 50px}
.hero{padding:30px;border-radius:23px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#4f46e5);box-shadow:0 10px 30px #2563eb33}
.hero h1{font-size:31px;margin:8px 0}
.hero p{line-height:1.6;opacity:.9}
.badge{display:inline-block;margin-top:15px;background:#ffffff20;padding:7px 12px;border-radius:20px;font-size:13px}
.card{background:#fff;padding:20px;border-radius:18px;margin-top:18px;box-shadow:0 5px 20px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.status{font-size:14px;color:#64748b;margin-top:5px}
.active{color:#16a34a;font-weight:bold}
.premium{background:#f59e0b;color:#fff;padding:10px 15px;border:0;border-radius:10px;font-weight:bold}
.progress{height:10px;background:#e5e7eb;border-radius:20px;margin-top:12px;overflow:hidden}
.fill{height:100%;width:0;background:#2563eb;transition:.4s}
.section{margin:30px 0 15px}
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lesson{background:#fff;padding:16px;border-radius:15px;border:1px solid #e5e7eb;box-shadow:0 3px 12px #00000008}
.lesson-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-size:12px;color:#2563eb;font-weight:bold}
.lesson h3{margin:7px 0 0;font-size:16px}
.status2{font-size:11px;font-weight:bold}
.free{color:#16a34a}.locked{color:#f59e0b}.done{color:#16a34a}
.open,.lock{border:0;padding:8px 12px;border-radius:8px;font-weight:bold}
.open{background:#2563eb;color:#fff}
.lock{background:#e5e7eb;color:#64748b}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;padding:15px;overflow:auto;z-index:10}
.modal{background:#fff;max-width:760px;margin:20px auto;border-radius:20px;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:22px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#ffffff20;color:#fff;border:0;font-size:22px;border-radius:8px;padding:3px 10px}
.modal-body{padding:20px}
.objective{background:#f8fafc;padding:15px;border-radius:12px;margin-bottom:15px;line-height:1.6}
.controls{display:flex;gap:10px;margin-bottom:15px}
.play,.stop{flex:1;border:0;padding:12px;border-radius:10px;font-weight:bold}
.play{background:#1e3a8a;color:#fff}
.stop{background:#e5e7eb;color:#172033}
.dialogue{padding:17px;margin:12px 0;border:1px solid #e5e7eb;border-radius:15px;transition:.3s}
.dialogue.playing{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.lang{font-size:11px;font-weight:bold;color:#2563eb;margin-top:12px}
.text{margin-top:4px;line-height:1.55}
.complete{width:100%;margin-top:15px;background:#16a34a;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:bold}
.loading{text-align:center;padding:35px;color:#64748b}
.error{text-align:center;padding:30px;color:#dc2626}

@media(max-width:600px){
 .lessons{grid-template-columns:1fr}
 .hero h1{font-size:26px}
 .modal{margin:5px auto}
 .controls{position:sticky;top:0;background:#fff;padding-bottom:8px;z-index:2}
}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">CreateLK <b>Academy</b></div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<small>ONLINE COURSE</small>
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<span class="badge">100 Lessons • 1,000 Practical Dialogues</span>
</section>

<section class="card row">
<div>
<b>Premium Membership</b>
<div id="premiumStatus" class="status">Checking...</div>
</div>
<button id="premiumBtn" class="premium" onclick="premiumPage()">Get Premium</button>
</section>

<section class="card">
<div class="row">
<b>Your Progress</b>
<b id="progressText">0 of 100</b>
</div>
<div class="progress">
<div id="fill" class="fill"></div>
</div>
</section>

<h2 class="section">Lessons</h2>

<div id="lessons" class="lessons">
<div class="loading">Loading lessons...</div>
</div>

</main>

<div id="modalBg" class="modal-bg">

<div class="modal">

<div class="modal-head">
<button class="close" onclick="closeLesson()">×</button>
<small id="modalNum">LESSON</small>
<h2 id="modalTitle">Loading...</h2>
</div>

<div id="modalBody" class="modal-body">
<div class="loading">Loading lesson...</div>
</div>

</div>
</div>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const COURSE="spoken-english";
const token=localStorage.getItem("createlk_token");

let premium=false;
let completed=[];
let dialogues=[];
let playing=false;

if(!token)location.href="/auth/login.html";

const headers={
 "Content-Type":"application/json",
 "Authorization":"Bearer "+token
};

const $=id=>document.getElementById(id);


/* LOAD LESSON LIST */

async function loadLessons(){

 try{

  const r=await fetch(
   `${API}/lessons?course=${COURSE}&language=en`,
   {headers}
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error(d.message);

  premium=!!d.premium;

  $("premiumStatus").innerHTML=premium
   ?'<span class="active">✓ Premium Active</span>'
   :"Premium not active";

  $("premiumBtn").style.display=
   premium?"none":"block";


  $("lessons").innerHTML=(d.lessons||[])
   .map(x=>{

    const n=+x.lesson_number;
    const free=+x.is_free===1;
    const unlocked=free||premium;
    const done=completed.includes(n);

    return `
    <article class="lesson">

      <div class="lesson-top">

        <div>
          <div class="num">LESSON ${n}</div>
          <h3>${esc(x.title||"Lesson "+n)}</h3>
        </div>

        <div class="status2 ${
          done?"done":free?"free":"locked"
        }">
          ${
            done
            ?"✓ COMPLETED"
            :free
            ?"FREE"
            :"PREMIUM"
          }
        </div>

      </div>

      <div style="margin-top:12px;text-align:right">

        <button
          class="${unlocked?"open":"lock"}"
          onclick="${
            unlocked
            ?`openLesson(${n})`
            :"premiumPage()"
          }">

          ${unlocked?"Open":"🔒 Locked"}

        </button>

      </div>

    </article>
    `;

   }).join("");

 }catch(e){

  console.error(e);

  $("lessons").innerHTML=
   '<div class="error">Unable to load lessons.</div>';

 }

}


/* LOAD ONE LANGUAGE */

async function getLesson(n,language){

 const r=await fetch(
  `${API}/lesson?course=${COURSE}&lesson=${n}&language=${language}`,
  {headers}
 );

 const d=await r.json();

 if(!r.ok||!d.success)
  throw Error(d.message);

 return d;
}


/* OPEN LESSON */

async function openLesson(n){

 stopSpeech();

 $("modalBg").style.display="block";
 $("modalNum").textContent="LESSON "+n;
 $("modalTitle").textContent="Loading...";
 $("modalBody").innerHTML=
  '<div class="loading">Loading lesson...</div>';

 try{

  const [en,si,ta]=await Promise.all([
   getLesson(n,"en"),
   getLesson(n,"si"),
   getLesson(n,"ta")
  ]);

  const l=en.lesson;

  $("modalTitle").textContent=l.title;

  const enD=en.lesson.dialogues||[];
  const siD=si.lesson.dialogues||[];
  const taD=ta.lesson.dialogues||[];

  dialogues=[];

  for(let i=0;i<enD.length;i++){

   dialogues.push({

    number:enD[i].dialogue_number,

    lines:[

     {
      language:"English",
      speaker:enD[i].speaker_a,
      text:enD[i].text_a
     },

     {
      language:"English",
      speaker:enD[i].speaker_b,
      text:enD[i].text_b
     },

     {
      language:"Sinhala",
      speaker:siD[i]?.speaker_a||"",
      text:siD[i]?.text_a||""
     },

     {
      language:"Sinhala",
      speaker:siD[i]?.speaker_b||"",
      text:siD[i]?.text_b||""
     },

     {
      language:"Tamil",
      speaker:taD[i]?.speaker_a||"",
      text:taD[i]?.text_a||""
     },

     {
      language:"Tamil",
      speaker:taD[i]?.speaker_b||"",
      text:taD[i]?.text_b||""
     }

    ]

   });

  }


  let html="";


  if(l.objectives){

   html+=`
   <div class="objective">
   ${esc(l.objectives)}
   </div>
   `;

  }


  html+=`
  <div class="controls">
   <button class="play" onclick="playAll()">
    ▶ Play All
   </button>

   <button class="stop" onclick="stopSpeech()">
    ■ Stop
   </button>
  </div>
  `;


  html+=dialogues.map((d,i)=>`

   <div class="dialogue" id="dialogue-${i}">

    <div class="num">
     DIALOGUE ${d.number}
    </div>

    ${d.lines.map(x=>`

      <div class="lang">
       ${x.language}
      </div>

      <div class="text">
       <b>${esc(x.speaker)}:</b>
       ${esc(x.text)}
      </div>

    `).join("")}

   </div>

  `).join("");


  html+=`
  <button class="complete"
   onclick="completeLesson(${n})">

   ${
    completed.includes(n)
    ?"✓ Lesson Completed"
    :"Mark Lesson Complete"
   }

  </button>
  `;


  $("modalBody").innerHTML=html;

 }catch(e){

  console.error(e);

  $("modalBody").innerHTML=
   '<div class="error">Unable to load this lesson.</div>';

 }

}


/* PLAY ALL */

function playAll(){

 stopSpeech();

 playing=true;

 let dialogueIndex=0;

 function nextDialogue(){

  if(!playing||dialogueIndex>=dialogues.length){

   playing=false;
   return;

  }

  const box=$(`dialogue-${dialogueIndex}`);

  document.querySelectorAll(".dialogue")
   .forEach(x=>x.classList.remove("playing"));

  box.classList.add("playing");

  box.scrollIntoView({
   behavior:"smooth",
   block:"center"
  });

  speakLines(
   dialogues[dialogueIndex].lines,
   0,
   ()=>{

    dialogueIndex++;
    nextDialogue();

   }
  );

 }

 nextDialogue();

}


/* SPEAK EACH LANGUAGE */

const voiceLang={
 English:"en-US",
 Sinhala:"si-LK",
 Tamil:"ta-LK"
};


function speakLines(lines,index,done){

 if(!playing||index>=lines.length){

  done();
  return;

 }

 const line=lines[index];

 if(!line.text){

  speakLines(lines,index+1,done);
  return;

 }

 const u=new SpeechSynthesisUtterance(line.text);

 u.lang=voiceLang[line.language];
 u.rate=.88;

 u.onend=()=>{
  speakLines(lines,index+1,done);
 };

 u.onerror=()=>{
  speakLines(lines,index+1,done);
 };

 speechSynthesis.speak(u);

}


/* STOP */

function stopSpeech(){

 playing=false;

 speechSynthesis.cancel();

 document.querySelectorAll(".dialogue")
  .forEach(x=>x.classList.remove("playing"));

}


/* COMPLETE */

async function completeLesson(n){

 try{

  const r=await fetch(
   `${API}/lesson/complete`,
   {
    method:"POST",
    headers,
    body:JSON.stringify({
     course:COURSE,
     lesson_number:n
    })
   }
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error(d.message);

  if(!completed.includes(n))
   completed.push(n);

  updateProgress(
   d.completed_count||completed.length
  );

  closeLesson();

  await loadLessons();

 }catch(e){

  alert(
   e.message||
   "Unable to complete lesson."
  );

 }

}


/* PROGRESS */

async function loadProgress(){

 try{

  const r=await fetch(
   `${API}/progress?course=${COURSE}`,
   {headers}
  );

  const d=await r.json();

  if(d.success){

   completed=(d.lessons||[])
    .map(x=>+x.lesson_number);

   updateProgress(
    d.completed_count||completed.length
   );

  }

 }catch(e){

  console.error(e);

 }

}


function updateProgress(n){

 n=Math.min(100,+n||0);

 $("progressText").textContent=
  `${n} of 100`;

 $("fill").style.width=
  n+"%";

}


/* CLOSE */

function closeLesson(){

 stopSpeech();

 $("modalBg").style.display="none";

}


/* PREMIUM */

function premiumPage(){

 location.href="/premium/";

}


/* LOGOUT */

function logout(){

 localStorage.removeItem("createlk_token");

 location.href="/auth/login.html";

}


/* HTML ESCAPE */

function esc(v){

 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* CLOSE WHEN CLICK OUTSIDE */

$("modalBg").onclick=e=>{

 if(e.target===$("modalBg"))
  closeLesson();

};


/* START */

async function init(){

 await loadProgress();

 await loadLessons();

}

init();

</script>

</body>
</html>
