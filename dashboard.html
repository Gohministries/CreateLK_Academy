<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#0b1f3a;color:white;padding:16px 20px;display:flex;justify-content:space-between}
button,select{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
.logout{background:white;color:#0b1f3a}
main{max-width:1000px;margin:auto;padding:20px}
.card,.premium,.lesson{background:white;border-radius:14px;padding:18px;margin-bottom:16px}
.premium{background:#fff8e6}
.status{font-weight:bold}
.active{color:#087443}.inactive{color:#b42318}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lesson{margin:0;border:1px solid #e4e7ec}
.lesson button{width:100%;background:#0b1f3a;color:white}
.free{color:#087443;font-size:12px;font-weight:bold}
.locked{color:#b42318;font-size:12px;font-weight:bold}
.progress{height:10px;background:#ddd;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#0b1f3a}
.modal{display:none;position:fixed;inset:0;background:#0009;padding:15px;overflow:auto}
.modal.show{display:block}
.modal-box{max-width:800px;margin:30px auto;background:white;border-radius:15px;padding:20px}
.close{float:right;background:#eee}
.dialogue{background:#f8f9fb;border-radius:10px;padding:12px;margin:10px 0}
.complete{width:100%;background:#087443;color:white;margin-top:15px}
.error{color:#b42318;padding:15px}
</style>
</head>

<body>

<header>
<strong>CreateLK Academy</strong>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div class="card">
<h1>Spoken English</h1>
<p>100 Lessons • 1,000 Practical Dialogues</p>

<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="si">සිංහල</option>
<option value="ta">தமிழ்</option>
</select>
</div>

<div class="premium">
<h3>Premium Membership</h3>
<div id="premiumStatus" class="status inactive">
PREMIUM NOT ACTIVE
</div>
<p id="premiumMessage">Lessons 2–100 require Premium.</p>
<button onclick="getPremium()">Get Premium</button>
</div>

<div class="card">
<strong id="progressText">Your Progress — 0 of 100 lessons completed</strong>
<br><br>
<div class="progress">
<div id="progressFill" class="fill"></div>
</div>
</div>

<h2>100 Spoken English Lessons</h2>

<div id="lessons" class="lessons">
Loading lessons...
</div>

</main>

<div id="lessonModal" class="modal">
<div class="modal-box">

<button class="close" onclick="closeLesson()">×</button>

<div id="modalNumber"></div>
<h2 id="modalTitle">Lesson</h2>

<div id="lessonContent">Loading...</div>

<button id="completeButton"
class="complete"
onclick="completeLesson()">
Mark Lesson Complete
</button>

</div>
</div>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const COURSE="spoken-english";

let token=localStorage.getItem("createlk_token");
let language=localStorage.getItem("createlk_language")||"en";
let premium=false;
let currentLesson=null;
let completed=new Set();

if(!token){
location.href="/auth/login.html";
}

document.getElementById("language").value=language;

function headers(){
return{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
};
}

/* PREMIUM */

async function loadPremium(){
try{
let r=await fetch(
`${API}/premium/status?course=${COURSE}`,
{headers:headers()}
);
let d=await r.json();

premium=!!(d.active||d.premium||d.subscription);

let s=document.getElementById("premiumStatus");
let m=document.getElementById("premiumMessage");

if(premium){
s.textContent="PREMIUM ACTIVE";
s.className="status active";
m.textContent="All 100 lessons are unlocked.";
}else{
s.textContent="PREMIUM NOT ACTIVE";
s.className="status inactive";
m.textContent="Lessons 2–100 require Premium.";
}
}catch(e){
console.error(e);
}
}

/* PROGRESS */

async function loadProgress(){
try{
let r=await fetch(
`${API}/progress?course=${COURSE}`,
{headers:headers()}
);
let d=await r.json();

let list=d.lessons||d.completed_lessons||[];

completed=new Set(
list.map(x=>Number(
typeof x==="number"?x:x.lesson_number
))
);

let count=d.completed_count??completed.size;

document.getElementById("progressText").textContent=
`Your Progress — ${count} of 100 lessons completed`;

document.getElementById("progressFill").style.width=
(count)+"%";

}catch(e){
console.error(e);
}
}

/* LESSON LIST */

async function loadLessons(){

let box=document.getElementById("lessons");
box.innerHTML="Loading lessons...";

try{

let r=await fetch(
`${API}/lessons?course=${COURSE}&language=${language}`,
{headers:headers()}
);

let d=await r.json();

if(!r.ok||!d.success)
throw new Error(d.message||"Unable to load lessons.");

box.innerHTML="";

(d.lessons||[]).forEach(l=>{

let n=Number(l.lesson_number);
let free=Number(l.is_free)===1;
let unlocked=free||premium;
let done=completed.has(n);

let div=document.createElement("div");
div.className="lesson";

div.innerHTML=`

<div class="free">
${free?"FREE FOREVER":!premium?"PREMIUM":""}
</div>

<div>LESSON ${n}</div>

<h3>${escape(l.title||"Lesson "+n)}</h3>

<button ${unlocked?"":"disabled"}
onclick="openLesson(${n})">
${done?"Completed ✓":unlocked?"Open":"🔒 Premium"}
</button>
`;

box.appendChild(div);

});

}catch(e){
box.innerHTML=`<div class="error">${escape(e.message)}</div>`;
}
}

/* OPEN LESSON */

async function openLesson(number){

currentLesson=number;

let modal=document.getElementById("lessonModal");
let content=document.getElementById("lessonContent");

modal.classList.add("show");

document.getElementById("modalNumber").textContent=
"LESSON "+number;

content.innerHTML="Loading lesson...";

document.getElementById("completeButton").style.display="none";

try{

let r=await fetch(
`${API}/lesson?course=${COURSE}&lesson=${number}&language=${language}`,
{
method:"GET",
headers:headers()
}
);

let d=await r.json();

if(!r.ok||!d.success)
throw new Error(d.message||"Unable to load lesson.");

let l=d.lesson||d;

document.getElementById("modalTitle").textContent=
l.title||"Lesson "+number;

let html="";

if(l.objectives)
html+=`<p><strong>Objectives:</strong><br>${escape(l.objectives)}</p>`;

if(l.summary)
html+=`<p><strong>Summary:</strong><br>${escape(l.summary)}</p>`;

html+="<h3>Practical Dialogues</h3>";

(l.dialogues||[]).forEach((d,i)=>{

html+=`
<div class="dialogue">
<strong>Dialogue ${i+1}</strong>
<p><strong>${escape(d.speaker_a)}:</strong>
${escape(d.text_a)}</p>
<p><strong>${escape(d.speaker_b)}:</strong>
${escape(d.text_b)}</p>
</div>
`;

});

content.innerHTML=html;

document.getElementById("completeButton").style.display="block";

}catch(e){

console.error(e);

content.innerHTML=
`<div class="error">Unable to load this lesson.<br>${escape(e.message)}</div>`;
}
}

/* COMPLETE */

async function completeLesson(){

if(!currentLesson)return;

let button=document.getElementById("completeButton");
button.disabled=true;

try{

let r=await fetch(
`${API}/lesson/complete`,
{
method:"POST",
headers:headers(),
body:JSON.stringify({
course:COURSE,
lesson_number:currentLesson
})
}
);

let d=await r.json();

if(!r.ok||!d.success)
throw new Error(d.message||"Unable to save progress.");

completed.add(currentLesson);

button.textContent="Lesson Completed ✓";

await loadProgress();
await loadLessons();

}catch(e){

alert(e.message);
button.disabled=false;

}
}

/* LANGUAGE */

function changeLanguage(){

language=document.getElementById("language").value;

localStorage.setItem(
"createlk_language",
language
);

loadLessons();
}

/* PREMIUM */

function getPremium(){
location.href="/premium.html";
}

/* CLOSE */

function closeLesson(){
document.getElementById("lessonModal").classList.remove("show");
}

/* LOGOUT */

function logout(){
localStorage.removeItem("createlk_token");
location.href="/auth/login.html";
}

/* ESCAPE */

function escape(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* START */

(async function(){
await loadPremium();
await loadProgress();
await loadLessons();
})();

</script>

</body>
</html>
