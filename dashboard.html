<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial;background:#f5f7fb;color:#172033}
header{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;padding:16px 20px}
.head,.wrap{max-width:1050px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:800}.logo b{color:#fbbf24}
select,button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
select{margin-right:6px}.logout{background:#ffffff20;color:#fff}
.wrap{padding:25px 15px 50px}
.hero{padding:30px;border-radius:23px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#4f46e5);box-shadow:0 10px 30px #2563eb33}
.hero h1{margin:8px 0;font-size:31px}.hero p{line-height:1.6;opacity:.9}
.badge{display:inline-block;margin-top:15px;background:#ffffff20;padding:7px 12px;border-radius:20px;font-size:13px}
.card{background:#fff;padding:20px;border-radius:18px;margin-top:18px;box-shadow:0 5px 20px #0000000d}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-weight:800;font-size:18px}.status{font-size:14px;color:#64748b;margin-top:5px}
.active,.free{color:#15803d;font-weight:700}
.premium{background:#f59e0b;color:#fff;font-weight:700}
.progress{height:10px;background:#e5e7eb;border-radius:20px;margin-top:12px;overflow:hidden}
.fill{height:100%;width:0;background:#2563eb}
.section{margin:30px 0 15px}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.lesson{background:#fff;padding:18px;border-radius:17px;border:1px solid #e5e7eb;box-shadow:0 4px 15px #00000008}
.num{font-size:12px;color:#2563eb;font-weight:800}.lesson h3{margin:8px 0}
.lesson p{font-size:13px;color:#64748b;line-height:1.5;min-height:38px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}
.open{background:#2563eb;color:#fff;font-weight:700}.lock{background:#e5e7eb;color:#64748b}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;padding:15px;overflow:auto}
.modal{background:#fff;max-width:700px;margin:30px auto;border-radius:20px;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:22px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#ffffff20;color:#fff;font-size:20px}
.modal-body{padding:20px}.objective{background:#f8fafc;padding:14px;border-radius:12px;margin-bottom:15px}
.dialogue{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:10px 0}
.line{margin:10px 0;line-height:1.5}.speaker{font-weight:700;color:#1e3a8a}
.listen{background:#eff6ff;color:#2563eb;padding:6px 9px;font-size:12px;margin-left:5px}
.play{width:100%;background:#1e3a8a;color:#fff;font-weight:700;margin-bottom:8px}
.stop{width:100%;background:#f1f5f9;margin-bottom:10px}
.complete{width:100%;background:#16a34a;color:#fff;font-weight:700;margin-top:10px}
.loading{text-align:center;padding:35px;color:#64748b}
.error{text-align:center;padding:30px;color:#dc2626}

@media(max-width:750px){.lessons{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){
 .lessons{grid-template-columns:1fr}.head{align-items:flex-start}
 .hero h1{font-size:26px}.row{flex-direction:column;align-items:flex-start}
 .premium{width:100%}.modal{margin:5px auto}
}
</style>
</head>

<body>

<header>
<div class="head">
  <div class="logo">CreateLK <b>Academy</b></div>
  <div>
    <select id="lang">
      <option value="en">Option 1</option>
      <option value="si">Option 2</option>
      <option value="ta">Option 3</option>
    </select>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>
</header>

<main class="wrap">

<section class="hero">
  <small>ONLINE COURSE</small>
  <h1>Spoken English</h1>
  <p>Build confidence through practical conversations and real-life situations.</p>
  <span class="badge">100 Lessons • 1,000 Practical Dialogues</span>
</section>

<section class="card row">
  <div>
    <div class="title">Premium Membership</div>
    <div id="premiumStatus" class="status">Checking...</div>
  </div>
  <button id="premiumBtn" class="premium" onclick="premiumPage()">Get Premium</button>
</section>

<section class="card">
  <div class="row">
    <b>Your Progress</b>
    <b id="progressText">0 of 100</b>
  </div>
  <div class="progress"><div id="fill" class="fill"></div></div>
</section>

<h2 class="section">100 Spoken English Lessons</h2>

<div id="lessons" class="lessons">
  <div class="loading">Loading...</div>
</div>

</main>

<div id="modalBg" class="modal-bg">
<div class="modal">

<div class="modal-head">
<button class="close" onclick="closeLesson()">×</button>
<small id="modalNum">LESSON</small>
<h2 id="modalTitle">Loading...</h2>
</div>

<div id="modalBody" class="modal-body">
<div class="loading">Loading lesson...</div>
</div>

</div>
</div>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const COURSE="spoken-english";
const token=localStorage.getItem("createlk_token");

let lang=localStorage.getItem("createlk_language")||"en";
let premium=false;
let completed=[];

if(!token)location.href="/auth/login.html";

const headers=()=>({
 "Content-Type":"application/json",
 "Authorization":"Bearer "+token
});

const $=id=>document.getElementById(id);

$("lang").value=lang;

$("lang").onchange=()=>{
 lang=$("lang").value;
 localStorage.setItem("createlk_language",lang);
 loadLessons();
};

async function loadLessons(){
 try{
  const r=await fetch(`${API}/lessons?course=${COURSE}&language=${lang}`,{headers:headers()});
  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.message);

  premium=!!d.premium;

  $("premiumStatus").innerHTML=premium?
   '<span class="active">✓ Premium Active</span>':
   "Premium not active";

  $("premiumBtn").style.display=premium?"none":"block";

  $("lessons").innerHTML=d.lessons.map(x=>{
   const n=+x.lesson_number;
   const free=+x.is_free===1;
   const unlocked=free||premium;
   const done=completed.includes(n);

   return `<article class="lesson">
    <div class="num">LESSON ${n}</div>
    <h3>${esc(x.title||"Lesson "+n)}</h3>
    <p>${esc(x.summary||x.objectives||"")}</p>
    <div class="bottom">
     <span class="${done||free?'free':'locked'}">
      ${done?"✓ COMPLETED":free?"FREE FOREVER":"PREMIUM"}
     </span>
     <button class="${unlocked?"open":"lock"}"
      onclick="${unlocked?`openLesson(${n})`:"premiumPage()"}">
      ${unlocked?"Open":"🔒 Locked"}
     </button>
    </div>
   </article>`;
  }).join("");
 }catch(e){
  console.error(e);
  $("lessons").innerHTML='<div class="error">Unable to load lessons.</div>';
 }
}

async function openLesson(n){
 speechSynthesis.cancel();
 $("modalBg").style.display="block";
 $("modalNum").textContent="LESSON "+n;
 $("modalTitle").textContent="Loading...";
 $("modalBody").innerHTML='<div class="loading">Loading lesson...</div>';

 try{
  const r=await fetch(`${API}/lesson?course=${COURSE}&lesson=${n}&language=${lang}`,{headers:headers()});
  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.message);

  const l=d.lesson;
  $("modalTitle").textContent=l.title;

  let html="";

  if(l.objectives)
   html+=`<div class="objective">${esc(l.objectives)}</div>`;

  html+=`
   <button class="play" onclick="playAll()">▶ Play Dialogue</button>
   <button class="stop" onclick="stopSpeech()">■ Stop</button>`;

  html+=(l.dialogues||[]).map(x=>`
   <div class="dialogue">
    <div class="num">DIALOGUE ${x.dialogue_number}</div>

    <div class="line">
     <span class="speaker">${esc(x.speaker_a)}:</span>
     ${esc(x.text_a)}
     <button class="listen" onclick='speak(${JSON.stringify(x.text_a)})'>🔊</button>
    </div>

    <div class="line">
     <span class="speaker">${esc(x.speaker_b)}:</span>
     ${esc(x.text_b)}
     <button class="listen" onclick='speak(${JSON.stringify(x.text_b)})'>🔊</button>
    </div>
   </div>
  `).join("");

  html+=`<button class="complete" onclick="completeLesson(${n})">
    ${completed.includes(n)?"✓ Lesson Completed":"Mark Lesson Complete"}
  </button>`;

  $("modalBody").innerHTML=html;

 }catch(e){
  $("modalBody").innerHTML=
   `<div class="error">${esc(e.message||"Unable to load lesson.")}</div>`;
 }
}

function speak(text){
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.rate=.9;
 speechSynthesis.speak(u);
}

function playAll(){
 const lines=[...document.querySelectorAll(".dialogue .line")];
 let i=0;

 function next(){
  if(i>=lines.length)return;
  const text=lines[i++].innerText.replace("🔊","").trim();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.9;
  u.onend=next;
  speechSynthesis.speak(u);
 }

 speechSynthesis.cancel();
 next();
}

function stopSpeech(){
 speechSynthesis.cancel();
}

async function completeLesson(n){
 try{
  const r=await fetch(`${API}/lesson/complete`,{
   method:"POST",
   headers:headers(),
   body:JSON.stringify({
    course:COURSE,
    lesson_number:n
   })
  });

  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.message);

  if(!completed.includes(n))completed.push(n);

  updateProgress(d.completed_count);
  closeLesson();
  await loadLessons();

 }catch(e){
  alert(e.message||"Unable to complete lesson.");
 }
}

async function loadProgress(){
 try{
  const r=await fetch(`${API}/progress?course=${COURSE}`,{headers:headers()});
  const d=await r.json();

  if(d.success){
   completed=(d.lessons||[]).map(x=>+x.lesson_number);
   updateProgress(d.completed_count||0);
  }
 }catch(e){
  console.error(e);
 }
}

function updateProgress(n){
 n=Math.min(100,+n||0);
 $("progressText").textContent=`${n} of 100`;
 $("fill").style.width=n+"%";
}

function closeLesson(){
 stopSpeech();
 $("modalBg").style.display="none";
}

function premiumPage(){
 location.href="/premium/";
}

function logout(){
 localStorage.removeItem("createlk_token");
 location.href="/auth/login.html";
}

function esc(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

$("modalBg").onclick=e=>{
 if(e.target===$("modalBg"))closeLesson();
};

async function init(){
 await loadProgress();
 await loadLessons();
}

init();
</script>

</body>
</html>
