<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Create Account | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --b:#155eef;--p:#7c3aed;--d:#172033;
 --m:#667085;--l:#e5e7eb;--bg:#f5f7ff
}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:radial-gradient(circle at 10% 10%,#dbeafe 0,transparent 28%),
 radial-gradient(circle at 90% 20%,#fce7f3 0,transparent 28%),var(--bg);
 color:var(--d);min-height:100vh
}
a{text-decoration:none}
header{background:#ffffffee;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:10}
.nav{max-width:900px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:900;color:var(--b)}
.logo span{color:var(--p)}
.home{font-size:14px;font-weight:700;color:#475467}
main{min-height:calc(100vh - 70px);display:flex;justify-content:center;align-items:center;padding:30px 15px}
.card{
 width:100%;max-width:460px;background:#fff;border-radius:24px;padding:30px;
 box-shadow:0 20px 55px #1018281f;position:relative;overflow:hidden
}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;z-index:0}
.card:before{width:150px;height:150px;right:-75px;top:-75px;background:#dbeafe}
.card:after{width:130px;height:130px;left:-65px;bottom:-65px;background:#fce7f3}
.header,form,.message,.referral,.student-id,.login,.terms{position:relative;z-index:1}
.header{text-align:center;margin-bottom:22px}
.icon{
 width:68px;height:68px;margin:auto;border-radius:20px;display:flex;
 align-items:center;justify-content:center;font-size:32px;
 background:linear-gradient(135deg,#eef4ff,#f5f0ff)
}
h1{font-size:27px;margin:14px 0 7px}
.subtitle{font-size:14px;line-height:1.5;color:var(--m)}
.message{
 display:none;padding:12px;border-radius:10px;margin-bottom:16px;
 font-size:13px;text-align:center;line-height:1.5
}
.message.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}
.message.success{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534}
.message.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
.referral{
 display:none;margin-bottom:16px;padding:10px;border-radius:10px;
 background:#ecfdf5;border:1px solid #bbf7d0;color:#047857;
 font-size:12px;text-align:center
}
.student-id{
 display:none;margin-bottom:18px;padding:17px;border-radius:15px;
 background:linear-gradient(135deg,#eef4ff,#f5f0ff);
 border:1px solid #dbe7ff;text-align:center
}
.student-id small{display:block;color:var(--m);font-size:12px;font-weight:700;margin-bottom:5px}
.student-id strong{font-size:22px;color:var(--b)}
.group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
input{
 width:100%;height:49px;padding:0 14px;border:1px solid #d0d5dd;
 border-radius:10px;font-size:14px;outline:none;background:#fff
}
input:focus{border-color:var(--b);box-shadow:0 0 0 3px #155eef1a}
button{
 width:100%;height:51px;border:0;border-radius:11px;
 background:linear-gradient(135deg,var(--b),var(--p));color:#fff;
 font-size:15px;font-weight:900;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.login{text-align:center;margin-top:18px;font-size:14px;color:var(--m)}
.login a{color:var(--b);font-weight:800}
.terms{text-align:center;font-size:11px;color:#98a2b3;margin-top:17px;line-height:1.5}
.terms a{color:#667085;font-weight:700}
footer{text-align:center;padding:18px;font-size:11px;color:#98a2b3}
.whatsapp{
 position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;
 background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:28px;box-shadow:0 8px 25px #0003;z-index:99
}
@media(max-width:500px){
 .card{padding:25px 18px;border-radius:20px}
 h1{font-size:25px}.nav{padding:14px 15px}.logo{font-size:18px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">📚 CreateLK <span>Academy</span></a>
<a href="index.html" class="home">← Home</a>
</div>
</header>

<main>
<div class="card">

<div class="header">
<div class="icon">👤</div>
<h1>Create Account</h1>
<div class="subtitle">
Join CreateLK Academy and start your 365-day English learning journey.
</div>
</div>

<div id="message" class="message"></div>

<div id="referralBox" class="referral"></div>

<div id="studentIdBox" class="student-id">
<small>Your Student ID</small>
<strong id="studentId"></strong>
</div>

<form id="registerForm">

<div class="group">
<label for="firstName">First Name</label>
<input id="firstName" type="text" placeholder="Enter your first name"
required autocomplete="given-name">
</div>

<div class="group">
<label for="lastName">Last Name</label>
<input id="lastName" type="text" placeholder="Enter your last name"
required autocomplete="family-name">
</div>

<div class="group">
<label for="email">Email Address</label>
<input id="email" type="email" placeholder="you@example.com"
required autocomplete="email">
</div>

<div class="group">
<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="+9477XXXXXXX"
required autocomplete="tel">
</div>

<div class="group">
<label for="password">Password</label>
<input id="password" type="password" placeholder="Create a password"
required minlength="6" autocomplete="new-password">
</div>

<div class="group">
<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" type="password" placeholder="Confirm your password"
required minlength="6" autocomplete="new-password">
</div>

<button id="registerButton" type="submit">
🚀 Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

<div class="terms">
By creating an account, you agree to our
<a href="terms.html">Terms</a>,
<a href="privacy.html">Privacy Policy</a>
and
<a href="refund.html">Refund Policy</a>.
</div>

</div>
</main>

<footer>© 2026 CreateLK Academy. All rights reserved.</footer>

<a class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="WhatsApp">💬</a>

<script>
const ACCOUNT_API="https://createlk-auth.createlk.workers.dev";

const form=document.getElementById("registerForm");
const message=document.getElementById("message");
const button=document.getElementById("registerButton");
const referralBox=document.getElementById("referralBox");
const studentIdBox=document.getElementById("studentIdBox");
const studentIdElement=document.getElementById("studentId");

function showMessage(text,type){
 message.className="message "+type;
 message.textContent=text;
 message.style.display="block";
}

function formatStudentId(id){
 return "CLA-"+new Date().getFullYear()+"-"+String(id).padStart(4,"0");
}

/* =========================
   REFERRAL
========================= */

const params=new URLSearchParams(location.search);
const urlReferral=(params.get("ref")||"").trim();

let referral=urlReferral;

if(urlReferral){
 localStorage.setItem("createlk_referral",urlReferral);
}else{
 referral=(localStorage.getItem("createlk_referral")||"").trim();
}

if(referral){
 referralBox.textContent="🎁 Referred by: "+referral;
 referralBox.style.display="block";
}

/* =========================
   REGISTER
========================= */

form.addEventListener("submit",async e=>{
 e.preventDefault();

 const first_name=document.getElementById("firstName").value.trim();
 const last_name=document.getElementById("lastName").value.trim();
 const email=document.getElementById("email").value.trim().toLowerCase();
 const phone=document.getElementById("phone").value.trim();
 const password=document.getElementById("password").value;
 const confirmPassword=document.getElementById("confirmPassword").value;

 /* Always read the latest saved referral */
 referral=(
  new URLSearchParams(location.search).get("ref")||
  localStorage.getItem("createlk_referral")||
  ""
 ).trim();

 if(!first_name||!last_name||!email||!phone||!password||!confirmPassword){
  showMessage("Please complete all fields.","error");
  return;
 }

 if(password.length<6){
  showMessage("Password must contain at least 6 characters.","error");
  return;
 }

 if(password!==confirmPassword){
  showMessage("Passwords do not match.","error");
  return;
 }

 button.disabled=true;
 button.textContent="⏳ Creating Account...";
 showMessage("Creating your account...","info");

 try{

  const payload={
   first_name,
   last_name,
   email,
   phone,
   password,

   /* Referral sent to Cloudflare */
   referral_code:referral||null
  };

  console.log("REGISTER PAYLOAD:",{
   ...payload,
   password:"********"
  });

  const response=await fetch(
   ACCOUNT_API+"/api/register",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Accept":"application/json"
    },
    body:JSON.stringify(payload)
   }
  );

  const raw=await response.text();

  console.log("REGISTER RESPONSE:",raw);

  let data;

  try{
   data=JSON.parse(raw);
  }catch{
   throw new Error("Server returned an invalid response.");
  }

  if(!response.ok||data.success!==true){
   throw new Error(data.message||"Registration failed.");
  }

  /* =========================
     STUDENT ID
  ========================= */

  const databaseId=
   data.id||
   data.database_id||
   data.student_id_number||
   data.student?.id||
   null;

  let finalStudentId=
   data.student_id||
   data.studentId||
   data.student?.student_id||
   null;

  if(!finalStudentId&&databaseId){
   finalStudentId=formatStudentId(databaseId);
  }

  if(!finalStudentId){
   finalStudentId="Created successfully";
  }

  /* =========================
     SAVE LOGIN DATA
  ========================= */

  const studentData={
   id:data.id||databaseId||null,
   student_id:finalStudentId,
   first_name,
   last_name,
   email,
   phone,
   membership_status:
    data.membership_status||
    data.membershipStatus||
    "FREE",
   membership_expiry:
    data.membership_expiry||
    data.membershipExpiry||
    null,

   /* Keep referral information */
   referral_code:referral||null
  };

  localStorage.setItem(
   "createlk_student",
   JSON.stringify(studentData)
  );

  /* Registration succeeded */
  form.style.display="none";

  studentIdElement.textContent=finalStudentId;
  studentIdBox.style.display="block";

  showMessage(
   "✅ Account created successfully!",
   "success"
  );

  button.textContent="✓ Account Created";

  /*
   Remove referral only AFTER the server
   has accepted the registration.
  */
  localStorage.removeItem("createlk_referral");

  setTimeout(()=>{
   location.href="login.html";
  },2500);

 }catch(error){

  console.error("REGISTER ERROR:",error);

  showMessage(
   error.message||
   "Unable to connect to CreateLK Academy.",
   "error"
  );

  button.disabled=false;
  button.textContent="🚀 Create Account";
 }
});
</script>

</body>
</html>
