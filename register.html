<script>

const API_URL =
"https://createlk-api.createlk.workers.dev";

const AFFILIATE_API =
"https://createlk-affiliate-referral.createlk.workers.dev";


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const button =
document.getElementById("registerButton");


/* =====================================
   SAVE REFERRAL CODE
===================================== */

const urlParams =
new URLSearchParams(window.location.search);

const referralFromURL =
urlParams.get("ref");


if(referralFromURL){

    const code =
        referralFromURL
        .trim()
        .toUpperCase();

    if(/^CLK[0-9]{5}$/.test(code)){

        localStorage.setItem(
            "createlk_referral_code",
            code
        );

        console.log(
            "Referral saved:",
            code
        );

    }

}


/* =====================================
   REGISTER
===================================== */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    hideMessage();

    const firstName =
        document.getElementById("firstName")
        .value.trim();

    const lastName =
        document.getElementById("lastName")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;


    /* =================================
       VALIDATION
    ================================= */

    if(
        !firstName ||
        !lastName ||
        !email ||
        !phone ||
        !password
    ){

        showError(
            "Please complete all required fields."
        );

        return;
    }


    if(password.length < 8){

        showError(
            "Password must contain at least 8 characters."
        );

        return;
    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{


        /* =============================
           GET REFERRAL
        ============================= */

        const referralCode =
            localStorage.getItem(
                "createlk_referral_code"
            );


        console.log(
            "Referral code:",
            referralCode
        );


        /* =============================
           CREATE STUDENT
        ============================= */

        const response =
            await fetch(
                API_URL + "/api/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        firstName:
                            firstName,

                        lastName:
                            lastName,

                        email:
                            email,

                        phone:
                            phone,

                        password:
                            password

                    })
                }
            );


        let data;


        try{

            data =
                await response.json();

        }catch(error){

            data = {
                success:false,
                message:
                    "Invalid server response."
            };

        }


        console.log(
            "REGISTRATION RESPONSE:",
            data
        );


        /* =============================
           REGISTRATION FAILED
        ============================= */

        if(
            !response.ok ||
            !data.success
        ){

            showError(
                data.message ||
                "Registration failed."
            );

            button.disabled = false;

            button.textContent =
                "Create Student Account";

            return;
        }


        /* =============================
           GET STUDENT ID
        ============================= */

        const studentId =
            data.student_id ||
            data.studentId ||
            (
                data.student &&
                data.student.id
            );


        console.log(
            "STUDENT ID:",
            studentId
        );


        /* =============================
           REFERRAL REGISTRATION
        ============================= */

        if(
            referralCode &&
            studentId
        ){

            try{

                const referralResponse =
                    await fetch(
                        AFFILIATE_API +
                        "/api/register-referral",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:JSON.stringify({

                                affiliate_code:
                                    referralCode,

                                student_id:
                                    Number(studentId)

                            })
                        }
                    );


                const referralData =
                    await referralResponse.json();


                console.log(
                    "AFFILIATE RESPONSE:",
                    referralData
                );


                if(
                    referralResponse.ok &&
                    referralData.success
                ){

                    console.log(
                        "Referral recorded successfully."
                    );


                    localStorage.removeItem(
                        "createlk_referral_code"
                    );

                }else{

                    console.error(
                        "Referral failed:",
                        referralData
                    );

                }


            }catch(error){

                console.error(
                    "Affiliate API error:",
                    error
                );

            }

        }else{

            console.warn(
                "Referral was not submitted.",
                {
                    referralCode:
                        referralCode,

                    studentId:
                        studentId
                }
            );

        }


        /* =============================
           SUCCESS
        ============================= */

        showSuccess(
            "Account created successfully. Redirecting to login..."
        );


        button.textContent =
            "Account Created";


        setTimeout(
            function(){

                window.location.href =
                    "login.html";

            },
            1200
        );


    }catch(error){

        console.error(
            "Registration error:",
            error
        );


        showError(
            "Unable to connect to the server. Please try again."
        );


        button.disabled = false;

        button.textContent =
            "Create Student Account";

    }

});


/* =====================================
   ERROR
===================================== */

function showError(text){

    message.className =
        "message error";

    message.textContent =
        text;

    message.style.display =
        "block";

}


/* =====================================
   SUCCESS
===================================== */

function showSuccess(text){

    message.className =
        "message success";

    message.textContent =
        text;

    message.style.display =
        "block";

}


/* =====================================
   HIDE MESSAGE
===================================== */

function hideMessage(){

    message.className =
        "message";

    message.textContent =
        "";

    message.style.display =
        "none";

}

</script>
