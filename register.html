<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Create Account | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--blue:#155eef;--purple:#7c3aed;--dark:#172033;
--muted:#667085;--line:#e5e7eb;--bg:#f5f7ff
}
body{
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at 10% 10%,#dbeafe 0,transparent 28%),
radial-gradient(circle at 90% 20%,#fce7f3 0,transparent 28%),var(--bg);
color:var(--dark);min-height:100vh
}
a{text-decoration:none}
header{
background:#ffffffee;backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10
}
.nav{
max-width:900px;margin:auto;padding:14px 18px;
display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:20px;font-weight:900;color:var(--blue)}
.logo span{color:var(--purple)}
.home{font-size:14px;font-weight:700;color:#475467}
main{
min-height:calc(100vh - 70px);display:flex;
justify-content:center;align-items:center;padding:35px 15px
}
.card{
width:100%;max-width:460px;background:#fff;border-radius:24px;
padding:30px;box-shadow:0 20px 55px #1018281f;
position:relative;overflow:hidden
}
.card:before,.card:after{
content:"";position:absolute;border-radius:50%
}
.card:before{
width:150px;height:150px;right:-75px;top:-75px;background:#dbeafe
}
.card:after{
width:130px;height:130px;left:-65px;bottom:-65px;background:#fce7f3
}
.header{text-align:center;position:relative;z-index:1;margin-bottom:25px}
.icon{
width:68px;height:68px;margin:auto;border-radius:20px;
display:flex;align-items:center;justify-content:center;font-size:32px;
background:linear-gradient(135deg,#eef4ff,#f5f0ff)
}
h1{font-size:28px;margin:15px 0 7px}
.subtitle{font-size:14px;line-height:1.5;color:var(--muted)}
.message{
display:none;padding:13px;border-radius:11px;margin-bottom:18px;
font-size:13px;line-height:1.5;text-align:center;position:relative;z-index:2
}
.message.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}
.message.success{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534}
.message.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
.referral{
display:none;margin-bottom:18px;padding:12px;border-radius:11px;
background:#ecfdf5;border:1px solid #bbf7d0;color:#047857;
font-size:12px;text-align:center;position:relative;z-index:2
}
.student-id{
display:none;margin-bottom:20px;padding:18px;border-radius:16px;
background:linear-gradient(135deg,#eef4ff,#f5f0ff);
border:1px solid #dbe7ff;text-align:center;position:relative;z-index:2
}
.student-id small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}
.student-id strong{display:block;font-size:22px;color:var(--blue)}
form{position:relative;z-index:2}
.group{margin-bottom:15px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input{
width:100%;height:50px;padding:0 14px;border:1px solid #d0d5dd;
border-radius:10px;font-size:14px;outline:none;background:#fff
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #155eef1a}
button{
width:100%;height:52px;border:0;border-radius:11px;
background:linear-gradient(135deg,var(--blue),var(--purple));
color:#fff;font-size:15px;font-weight:900;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.login{
position:relative;z-index:2;text-align:center;margin-top:20px;
font-size:14px;color:var(--muted)
}
.login a{color:var(--blue);font-weight:800}
.terms{
position:relative;z-index:2;text-align:center;font-size:11px;
color:#98a2b3;margin-top:18px;line-height:1.5
}
.terms a{color:#667085;font-weight:700}
footer{text-align:center;padding:20px;font-size:11px;color:#98a2b3}
.whatsapp{
position:fixed;right:18px;bottom:18px;width:58px;height:58px;
border-radius:50%;background:#25d366;color:#fff;display:flex;
align-items:center;justify-content:center;font-size:29px;
box-shadow:0 8px 25px #0003;z-index:999
}
@media(max-width:500px){
.card{padding:25px 18px;border-radius:20px}
h1{font-size:25px}.nav{padding:14px 15px}.logo{font-size:18px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">📚 CreateLK <span>Academy</span></a>
<a href="index.html" class="home">← Home</a>
</div>
</header>

<main>
<div class="card">

<div class="header">
<div class="icon">👤</div>
<h1>Create Account</h1>
<div class="subtitle">
Join CreateLK Academy and start your 365-day English learning journey.
</div>
</div>

<div id="message" class="message"></div>

<div id="referralBox" class="referral"></div>

<div id="studentIdBox" class="student-id">
<small>Your Student ID</small>
<strong id="studentId"></strong>
</div>

<form id="registerForm">

<div class="group">
<label for="firstName">First Name</label>
<input id="firstName" type="text"
placeholder="Enter your first name"
required autocomplete="given-name">
</div>

<div class="group">
<label for="lastName">Last Name</label>
<input id="lastName" type="text"
placeholder="Enter your last name"
required autocomplete="family-name">
</div>

<div class="group">
<label for="email">Email Address</label>
<input id="email" type="email"
placeholder="you@example.com"
required autocomplete="email">
</div>

<div class="group">
<label for="phone">Phone Number</label>
<input id="phone" type="tel"
placeholder="+9477XXXXXXX"
required autocomplete="tel">
</div>

<div class="group">
<label for="password">Password</label>
<input id="password" type="password"
placeholder="Create a password"
required autocomplete="new-password">
</div>

<div class="group">
<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" type="password"
placeholder="Confirm your password"
required autocomplete="new-password">
</div>

<button id="registerButton" type="submit">
🚀 Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

<div class="terms">
By creating an account, you agree to our
<a href="terms.html">Terms</a>,
<a href="privacy.html">Privacy Policy</a>
and
<a href="refund.html">Refund Policy</a>.
</div>

</div>
</main>

<footer>© 2026 CreateLK Academy. All rights reserved.</footer>

<a class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="WhatsApp">💬</a>

<script>

/* ==============================
   WORKERS
============================== */

const ACCOUNT_API =
"https://createlk-auth.createlk.workers.dev";

const REFERRAL_API =
"https://createlk-referral-register.createlk.workers.dev";


/* ==============================
   ELEMENTS
============================== */

const form=document.getElementById("registerForm");
const message=document.getElementById("message");
const button=document.getElementById("registerButton");
const referralBox=document.getElementById("referralBox");
const studentIdBox=document.getElementById("studentIdBox");
const studentIdElement=document.getElementById("studentId");


/* ==============================
   REFERRAL
============================== */

const params=new URLSearchParams(location.search);

let referralCode=params.get("ref");

if(referralCode){

 referralCode=referralCode.trim();

 if(/^\d+$/.test(referralCode)){
  localStorage.setItem("createlk_referral",referralCode);
 }

}else{

 referralCode=
  localStorage.getItem("createlk_referral")||"";

}

if(referralCode){

 referralBox.textContent=
  "🎁 Referred by Student ID: "+referralCode;

 referralBox.style.display="block";

}


/* ==============================
   MESSAGE
============================== */

function showMessage(text,type){

 message.className="message "+type;
 message.textContent=text;
 message.style.display="block";

}


/* ==============================
   STUDENT ID
============================== */

function formatStudentId(id){

 return "CLA-"+
 new Date().getFullYear()+
 "-"+
 String(id).padStart(4,"0");

}


/* ==============================
   GET NUMERIC DATABASE ID
============================== */

function getDatabaseId(data){

 return Number(
  data.id ||
  data.student_id_number ||
  data.database_id ||
  data.studentIdNumber ||
  data.student?.id ||
  data.user?.id ||
  0
 );

}


/* ==============================
   REGISTER
============================== */

form.addEventListener("submit",async e=>{

 e.preventDefault();

 const first_name=
  document.getElementById("firstName").value.trim();

 const last_name=
  document.getElementById("lastName").value.trim();

 const email=
  document.getElementById("email").value.trim().toLowerCase();

 const phone=
  document.getElementById("phone").value.trim();

 const password=
  document.getElementById("password").value;

 const confirmPassword=
  document.getElementById("confirmPassword").value;

 const referral=
  referralCode ||
  localStorage.getItem("createlk_referral") ||
  "";


 if(!first_name||!last_name||!email||!phone||!password){

  showMessage("Please complete all fields.","error");
  return;

 }

 if(password.length<6){

  showMessage(
   "Password must contain at least 6 characters.",
   "error"
  );
  return;

 }

 if(password!==confirmPassword){

  showMessage("Passwords do not match.","error");
  return;

 }

 if(referral && !/^\d+$/.test(referral)){

  showMessage(
   "Invalid referral code.",
   "error"
  );
  return;

 }


 button.disabled=true;
 button.textContent="⏳ Creating Account...";

 showMessage(
  "Creating your account...",
  "info"
 );


 try{

  /* ==============================
     1. CREATE ACCOUNT
  ============================== */

  const response=await fetch(
   ACCOUNT_API+"/api/register",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Accept":"application/json"
    },
    body:JSON.stringify({
     first_name,
     last_name,
     email,
     phone,
     password
    })
   }
  );


  const raw=await response.text();

  let data={};

  try{
   data=JSON.parse(raw);
  }catch{
   throw new Error(
    "Registration server returned an invalid response."
   );
  }


  if(!response.ok || data.success!==true){

   throw new Error(
    data.message || "Registration failed."
   );

  }


  /* ==============================
     2. GET NEW STUDENT ID
  ============================== */

  const databaseId=getDatabaseId(data);

  if(!databaseId){

   console.error(
    "AUTH RESPONSE DOES NOT CONTAIN NUMERIC ID:",
    data
   );

   throw new Error(
    "Account created, but the student ID was not returned by the Auth Worker."
   );

  }


  const finalStudentId=
   data.student_id ||
   data.studentId ||
   data.student?.student_id ||
   formatStudentId(databaseId);


  /* ==============================
     3. SAVE LOGIN DATA
  ============================== */

  const studentData={

   id:databaseId,

   student_id:finalStudentId,

   first_name,
   last_name,
   email,
   phone,

   membership_status:
    data.membership_status ||
    data.student?.membership_status ||
    "FREE",

   membership_expiry:
    data.membership_expiry ||
    data.student?.membership_expiry ||
    null,

   referral_code:
    referral || null

  };


  localStorage.setItem(
   "createlk_student",
   JSON.stringify(studentData)
  );


  /* ==============================
     4. REGISTER REFERRAL
  ============================== */

  if(referral){

   const referrerId=Number(referral);

   if(referrerId===databaseId){

    console.warn("Self referral blocked.");

   }else{

    showMessage(
     "Account created. Saving referral...",
     "info"
    );


    const referralResponse=
     await fetch(
      REFERRAL_API,
      {
       method:"POST",
       headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
       },
       body:JSON.stringify({

        referrer_id:referrerId,

        referred_id:databaseId

       })
      }
     );


    const referralRaw=
     await referralResponse.text();

    let referralData={};

    try{
     referralData=JSON.parse(referralRaw);
    }catch{
     referralData={};
    }


    console.log(
     "REFERRAL RESPONSE:",
     referralData
    );


    if(
     !referralResponse.ok ||
     referralData.success!==true
    ){

     console.error(
      "REFERRAL FAILED:",
      referralData
     );

     /*
       DO NOT silently pretend referral
       was tracked.
     */

     showMessage(
      "Account created, but the referral could not be recorded.",
      "error"
     );

     button.disabled=false;
     button.textContent="🚀 Create Account";

     return;

    }

   }

  }


  /* ==============================
     5. SUCCESS
  ============================== */

  localStorage.removeItem(
   "createlk_referral"
  );

  form.style.display="none";

  studentIdElement.textContent=
   finalStudentId;

  studentIdBox.style.display="block";

  showMessage(
   "✅ Account created successfully!",
   "success"
  );

  button.textContent="✓ Account Created";


  setTimeout(()=>{
   location.href="login.html";
  },2000);


 }catch(error){

  console.error(
   "REGISTER ERROR:",
   error
  );

  showMessage(
   error.message ||
   "Unable to connect to CreateLK Academy.",
   "error"
  );

  button.disabled=false;
  button.textContent="🚀 Create Account";

 }

});

</script>

</body>
</html>
