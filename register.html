<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Account | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
min-height:100vh;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
text-decoration:none;
}

.home{
font-size:14px;
font-weight:600;
color:#475467;
text-decoration:none;
}

main{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:35px 15px;
}

.card{
width:100%;
max-width:450px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.header{
text-align:center;
margin-bottom:25px;
}

.icon{
width:60px;
height:60px;
margin:auto;
border-radius:16px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:27px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.5;
}

.group{
margin-bottom:16px;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

input{
width:100%;
height:49px;
padding:0 13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:14px;
outline:none;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

button{
width:100%;
height:50px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:18px;
font-size:13px;
line-height:1.5;
text-align:center;
}

.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.message.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

.message.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.login{
text-align:center;
margin-top:20px;
font-size:14px;
color:#667085;
}

.login a{
color:#155eef;
font-weight:700;
text-decoration:none;
}

footer{
text-align:center;
padding:20px;
font-size:11px;
color:#98a2b3;
}

</style>

</head>

<body>

<header>

<div class="nav">

<a href="index.html" class="logo">
📚 CreateLK Academy
</a>

<a href="index.html" class="home">
← Home
</a>

</div>

</header>


<main>

<div class="card">

<div class="header">

<div class="icon">
👤
</div>

<h1>Create Account</h1>

<div class="subtitle">
Join CreateLK Academy and start improving your English.
</div>

</div>


<div id="message" class="message"></div>


<form id="registerForm">


<div class="group">

<label for="firstName">
First Name
</label>

<input
id="firstName"
type="text"
placeholder="First Name"
required
autocomplete="given-name">

</div>


<div class="group">

<label for="lastName">
Last Name
</label>

<input
id="lastName"
type="text"
placeholder="Last Name"
required
autocomplete="family-name">

</div>


<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email">

</div>


<div class="group">

<label for="phone">
Phone Number
</label>

<input
id="phone"
type="tel"
placeholder="+9477XXXXXXX"
required
autocomplete="tel">

</div>


<div class="group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Create a password"
required
autocomplete="new-password">

</div>


<div class="group">

<label for="confirmPassword">
Confirm Password
</label>

<input
id="confirmPassword"
type="password"
placeholder="Confirm password"
required
autocomplete="new-password">

</div>


<button
id="registerButton"
type="submit">

📝 Create Account

</button>

</form>


<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

</main>


<footer>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

/* ==========================================
   CREATE LK ACADEMY MAIN API
========================================== */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const button =
document.getElementById("registerButton");


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


/* ==========================================
   REGISTER
========================================== */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


const first_name =
document.getElementById("firstName")
.value.trim();

const last_name =
document.getElementById("lastName")
.value.trim();

const email =
document.getElementById("email")
.value.trim()
.toLowerCase();

const phone =
document.getElementById("phone")
.value.trim();

const password =
document.getElementById("password")
.value;

const confirmPassword =
document.getElementById("confirmPassword")
.value;


/* Validation */

if(
!first_name ||
!last_name ||
!email ||
!phone ||
!password
){

showMessage(
"Please complete all fields.",
"error"
);

return;

}


if(password.length < 6){

showMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}


if(password !== confirmPassword){

showMessage(
"Passwords do not match.",
"error"
);

return;

}


button.disabled = true;

button.textContent =
"Creating Account...";


showMessage(
"Creating your CreateLK Academy account...",
"info"
);


try{


/* ==========================================
   REGISTER REQUEST
========================================== */

const response =
await fetch(
API_URL + "/api/register",
{
method:"POST",

headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},

body:JSON.stringify({

first_name:first_name,

last_name:last_name,

email:email,

phone:phone,

password:password

})

});


const raw =
await response.text();


console.log(
"REGISTER RESPONSE:",
raw
);


let data;

try{

data =
JSON.parse(raw);

}catch(error){

console.error(
"Invalid JSON:",
raw
);

throw new Error(
"Server returned an invalid response."
);

}


/* ==========================================
   ERROR
========================================== */

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Registration failed."
);

}


/* ==========================================
   SUCCESS
========================================== */

showMessage(
"✅ Account created successfully! Redirecting to login...",
"success"
);

button.textContent =
"✓ Account Created";


setTimeout(
function(){

window.location.href =
"login.html";

},
1200
);


}catch(error){

console.error(
"Registration error:",
error
);

showMessage(
error.message ||
"Unable to connect to CreateLK Academy API.",
"error"
);

button.disabled =
false;

button.textContent =
"📝 Create Account";

}

});

</script>

</body>

</html>
