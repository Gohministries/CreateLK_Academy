<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | CreateLK Academy</title><meta name="description"
content="Create your CreateLK Academy student account.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e9f0;
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#155eef;
    text-decoration:none;
}

.home{
    color:#475467;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.home:hover{
    color:#155eef;
}

main{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:45px 20px;
}

.register-box{
    width:100%;
    max-width:500px;
    background:#fff;
    border:1px solid #e4e8ef;
    border-radius:16px;
    padding:35px;
    box-shadow:0 10px 35px rgba(20,40,80,.06);
}

.register-header{
    text-align:center;
    margin-bottom:28px;
}

.register-header h1{
    font-size:28px;
    margin-bottom:8px;
}

.register-header p{
    color:#667085;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    outline:none;
    font-size:15px;
    background:#fff;
}

input:focus{
    border-color:#155eef;
    box-shadow:0 0 0 3px rgba(21,94,239,.10);
}

.name-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.password-note{
    color:#667085;
    font-size:12px;
    margin-top:5px;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin:20px 0;
    font-size:12px;
    color:#667085;
}

.terms input{
    width:16px;
    height:16px;
    margin-top:2px;
    flex-shrink:0;
}

.terms label{
    font-size:12px;
    font-weight:normal;
    margin:0;
}

.terms a{
    color:#155eef;
}

.register-btn{
    width:100%;
    border:0;
    background:#155eef;
    color:white;
    padding:14px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#0d4dcc;
}

.register-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:18px;
    border-radius:8px;
    font-size:13px;
    text-align:center;
}

.message.error{
    display:block;
    background:#fff1f2;
    color:#be123c;
    border:1px solid #fecdd3;
}

.message.success{
    display:block;
    background:#ecfdf3;
    color:#027a48;
    border:1px solid #abefc6;
}

.login-link{
    text-align:center;
    margin-top:22px;
    font-size:14px;
    color:#667085;
}

.login-link a{
    color:#155eef;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:20px;
    color:#98a2b3;
    font-size:12px;
}

@media(max-width:550px){

    .register-box{
        padding:25px 20px;
    }

    .name-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .register-header h1{
        font-size:25px;
    }

}

</style></head><body><header><div class="nav"><a href="index.html" class="logo">
📚 CreateLK Academy
</a><a href="index.html" class="home">
← Back to Home
</a></div></header><main><div class="register-box"><div class="register-header"><h1>Create Your Account</h1><p>
Join CreateLK Academy and start your English learning journey.
</p></div><div
id="message"
class="message">
</div><form
id="registerForm"
autocomplete="on"><div class="name-row"><div class="form-group"><label for="firstName">
First Name
</label><input
type="text"
id="firstName"
name="firstName"
placeholder="First name"
required
autocomplete="given-name">

</div><div class="form-group"><label for="lastName">
Last Name
</label><input
type="text"
id="lastName"
name="lastName"
placeholder="Last name"
required
autocomplete="family-name">

</div></div><div class="form-group"><label for="email">
Email Address
</label><input
type="email"
id="email"
name="email"
placeholder="you@example.com"
required
autocomplete="email">

</div><div class="form-group"><label for="phone">
Phone Number
</label><input
type="tel"
id="phone"
name="phone"
placeholder="07XXXXXXXX"
required
autocomplete="tel">

</div><div class="form-group"><label for="password">
Password
</label><input
type="password"
id="password"
name="password"
placeholder="Create a password"
required
minlength="8"
autocomplete="new-password">

<p class="password-note">
Password must contain at least 8 characters.
</p></div><div class="form-group"><label for="confirmPassword">
Confirm Password
</label><input
type="password"
id="confirmPassword"
name="confirmPassword"
placeholder="Enter password again"
required
minlength="8"
autocomplete="new-password">

</div><div class="terms"><input
type="checkbox"
id="agree"
required>

<label for="agree">I agree to the
<a href="terms.html" target="_blank">
Terms & Conditions
</a>
and
<a href="privacy.html" target="_blank">
Privacy Policy
</a>.

</label></div><button
type="submit"
class="register-btn"
id="registerButton">

Create Student Account

</button></form><div class="login-link">Already have an account?

<a href="login.html">
Login here
</a></div></div></main><footer>© 2026 CreateLK Academy. All rights reserved.

</footer><script>

/* =====================================================
   CREATE LK ACADEMY
   REGISTRATION API
   ===================================================== */

const API_URL =
    "https://createlk-api.createlk.workers.dev";


const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const button =
    document.getElementById("registerButton");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage();


        const firstName =
            document
            .getElementById("firstName")
            .value
            .trim();


        const lastName =
            document
            .getElementById("lastName")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        /* VALIDATION */

        if(
            !firstName ||
            !lastName ||
            !email ||
            !phone ||
            !password
        ){

            showError(
                "Please complete all required fields."
            );

            return;
        }


        if(password.length < 8){

            showError(
                "Password must contain at least 8 characters."
            );

            return;
        }


        if(password !== confirmPassword){

            showError(
                "Passwords do not match."
            );

            return;
        }


        /* BUTTON */

        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try{


            const response =
                await fetch(
                    API_URL + "/api/register",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            firstName:
                                firstName,

                            lastName:
                                lastName,

                            email:
                                email,

                            phone:
                                phone,

                            password:
                                password

                        })
                    }
                );


            let data;


            try{

                data =
                    await response.json();

            }catch{

                data = {
                    success:false,
                    message:
                    "Invalid server response."
                };

            }


            /* SERVER ERROR */

            if(
                !response.ok ||
                !data.success
            ){

                showError(
                    data.message ||
                    "Registration failed."
                );

                button.disabled = false;

                button.textContent =
                    "Create Student Account";

                return;
            }


            /* SUCCESS */

            showSuccess(
                "Account created successfully. Redirecting to login..."
            );


            button.textContent =
                "Account Created";


            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1200
            );


        }catch(error){

            console.error(
                "Registration error:",
                error
            );


            showError(
                "Unable to connect to the server. Please try again."
            );


            button.disabled = false;

            button.textContent =
                "Create Student Account";

        }

    }
);


/* =====================================================
   MESSAGE FUNCTIONS
   ===================================================== */

function showError(text){

    message.className =
        "message error";

    message.textContent =
        text;

    message.style.display =
        "block";

}


function showSuccess(text){

    message.className =
        "message success";

    message.textContent =
        text;

    message.style.display =
        "block";

}


function hideMessage(){

    message.className =
        "message";

    message.textContent =
        "";

    message.style.display =
        "none";

}

</script></body>
</html>
