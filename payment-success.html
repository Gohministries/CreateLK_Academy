<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Verification | CreateLK Academy">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#155eef;
  --primary-dark:#1247b8;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --text:#172033;
  --muted:#667085;
  --border:#e4e7ec;
  --soft:#f8fafc;
  --bg:#f5f7fb;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at top,
      #eef4ff 0,
      var(--bg) 45%,
      #f5f7fb 100%
    );
  color:var(--text);
}

.card{
  width:100%;
  max-width:440px;
  background:#fff;
  padding:32px 24px 26px;
  border:1px solid var(--border);
  border-radius:20px;
  text-align:center;
  box-shadow:
    0 15px 40px rgba(16,24,40,.08),
    0 2px 8px rgba(16,24,40,.04);
}

.icon{
  width:72px;
  height:72px;
  margin:0 auto 18px;
  border-radius:50%;
  background:var(--green-bg);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  border:5px solid #f0fdf4;
}

h1{
  margin:0 0 8px;
  font-size:24px;
  line-height:1.25;
  font-weight:800;
  color:var(--text);
}

p{
  margin:0;
  font-size:13px;
  line-height:1.6;
  color:var(--muted);
}

.status{
  min-height:48px;
  margin:22px 0 16px;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--soft);
  border:1px solid #eaecf0;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
  color:#344054;
}

.loader{
  width:28px;
  height:28px;
  margin:16px auto 20px;
  border:3px solid #dbe5ff;
  border-top:3px solid var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.btn{
  display:block;
  width:100%;
  padding:12px 16px;
  margin-top:4px;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  transition:
    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease;
  box-shadow:0 4px 10px rgba(21,94,239,.18);
}

.btn:hover{
  background:var(--primary-dark);
  box-shadow:0 6px 14px rgba(21,94,239,.22);
}

.btn:active{
  transform:scale(.98);
}

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{
    max-width:100%;
    padding:28px 18px 22px;
    border-radius:18px;
  }

  .icon{
    width:66px;
    height:66px;
    font-size:30px;
  }

  h1{
    font-size:22px;
  }

  p{
    font-size:12px;
  }

  .status{
    font-size:11px;
  }

  .btn{
    font-size:12px;
  }
}

@media(prefers-reduced-motion:reduce){

  .loader{
    animation:none;
  }

  .btn{
    transition:none;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">✓</div>

  <h1>Payment Received</h1>

  <p>
    Thank you for your CreateLK Premium payment.
  </p>

  <div class="status" id="status">
    Verifying your payment...
  </div>

  <div class="loader"></div>

  <a href="dashboard.html" class="btn">
    Go to Dashboard
  </a>

</div>

<script>

const VERIFY_URL =
"https://createlk-premium-verify.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student = null;

try{

  student = JSON.parse(
    sessionStorage.getItem(STUDENT_KEY)
  );

}catch(error){

  console.error(
    "Student session error:",
    error
  );

}

const studentId =
  student?.id ||
  student?.student_id;

const status =
  document.getElementById("status");


/* CHECK LOGIN SESSION */

if(!studentId){

  status.textContent =
    "Payment session not found. Please return to your dashboard.";

}else{

  verifyPayment();

}


/* VERIFY PAYMENT */

async function verifyPayment(){

  try{

    const response =
      await fetch(
        VERIFY_URL +
        "/verify?student_id=" +
        encodeURIComponent(studentId)
      );

    const data =
      await response.json();

    console.log(
      "Payment verification:",
      data
    );


    /* PREMIUM VERIFIED */

    if(
      response.ok &&
      data.success === true &&
      data.premium === true
    ){

      status.innerHTML =
        "✅ Premium payment verified. Redirecting...";

      setTimeout(function(){

        location.replace(
          "dashboard.html"
        );

      },1500);

      return;
    }


    /* NOT VERIFIED YET */

    status.textContent =
      data.message ||
      "Payment is still being verified. Please check your dashboard shortly.";

    setTimeout(function(){

      location.replace(
        "dashboard.html"
      );

    },3000);


  }catch(error){

    console.error(
      "Verification error:",
      error
    );

    status.textContent =
      "Payment received. Please check your dashboard.";

    setTimeout(function(){

      location.replace(
        "dashboard.html"
      );

    },3000);

  }

}

</script>

</body>
</html>
