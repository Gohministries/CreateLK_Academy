<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Verification | CreateLK Academy">

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

.card{
width:100%;
max-width:430px;
background:#fff;
padding:30px 22px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
width:70px;
height:70px;
margin:0 auto 18px;
border-radius:50%;
background:#dcfce7;
color:#16a34a;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
}

h1{
font-size:23px;
margin:0 0 10px;
}

p{
font-size:13px;
line-height:1.6;
color:#667085;
}

.status{
margin:20px 0;
padding:14px;
border-radius:10px;
background:#f8fafc;
font-size:12px;
}

.loader{
width:25px;
height:25px;
margin:15px auto;
border:3px solid #dbe5ff;
border-top-color:#155eef;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.btn{
display:block;
padding:12px;
margin-top:15px;
border-radius:9px;
background:#155eef;
color:white;
text-decoration:none;
font-weight:bold;
font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">✓</div>

<h1>Payment Received</h1>

<p>
Thank you for your CreateLK Premium payment.
</p>

<div class="status" id="status">
Verifying your payment...
</div>

<div class="loader"></div>

<a href="dashboard.html" class="btn">
Go to Dashboard
</a>

</div>

<script>

const VERIFY_URL =
"https://createlk-premium-verify.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student=null;

try{
student=JSON.parse(
sessionStorage.getItem(STUDENT_KEY)
);
}catch(e){}

const studentId =
student?.id ||
student?.student_id;

const status =
document.getElementById("status");

if(!studentId){

status.textContent =
"Payment session not found. Please return to your dashboard.";

}else{

verifyPayment();

}

async function verifyPayment(){

try{

const response =
await fetch(
VERIFY_URL+
"/verify?student_id="+
encodeURIComponent(studentId)
);

const data =
await response.json();

if(
response.ok &&
data.success===true &&
data.premium===true
){

status.innerHTML =
"✅ Premium payment verified. Redirecting...";

setTimeout(function(){

location.replace(
"dashboard.html"
);

},1500);

}else{

status.textContent =
data.message ||
"Payment is still being verified. Please check your dashboard shortly.";

setTimeout(function(){

location.replace(
"dashboard.html"
);

},3000);

}

}catch(error){

console.error(error);

status.textContent =
"Payment received. Please check your dashboard.";

setTimeout(function(){

location.replace(
"dashboard.html"
);

},3000);

}

}

</script>

</body>
</html>
