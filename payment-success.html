<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment Verification | CreateLK Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#155eef;
  --primary-dark:#1247b8;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --orange:#f59e0b;
  --orange-bg:#fffbeb;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --text:#172033;
  --muted:#667085;
  --border:#e4e7ec;
  --soft:#f8fafc;
  --bg:#f5f7fb;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #eef4ff 0,
      #f5f7fb 50%,
      #f5f7fb 100%
    );

  color:var(--text);
}

.card{
  width:100%;
  max-width:440px;

  padding:32px 22px 25px;

  background:#fff;

  border:1px solid var(--border);

  border-radius:20px;

  text-align:center;

  box-shadow:
    0 12px 35px rgba(16,24,40,.08);
}

.logo{
  margin-bottom:25px;

  color:var(--primary);

  font-size:16px;

  font-weight:800;
}

.icon{
  width:72px;
  height:72px;

  margin:0 auto 18px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--green-bg);

  border:5px solid #f0fdf4;

  color:var(--green);

  font-size:34px;

  font-weight:900;
}

.icon.direct{
  background:#eef4ff;
  border-color:#e0eaff;
  color:var(--primary);
}

.icon.pending{
  background:var(--orange-bg);
  border-color:#fef3c7;
  color:var(--orange);
}

.icon.error{
  background:var(--red-bg);
  border-color:#fee2e2;
  color:var(--red);
}

h1{
  margin-bottom:9px;

  font-size:24px;

  line-height:1.25;

  font-weight:800;
}

.subtitle{
  color:var(--muted);

  font-size:13px;

  line-height:1.6;
}

.status{
  min-height:52px;

  margin:21px 0 16px;

  padding:13px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--soft);

  color:#344054;

  font-size:12px;

  line-height:1.55;
}

.status.success{
  background:#f0fdf4;
  border-color:#bbf7d0;
  color:#166534;
}

.status.pending{
  background:#fffbeb;
  border-color:#fde68a;
  color:#92400e;
}

.status.error{
  background:#fef2f2;
  border-color:#fecaca;
  color:#991b1b;
}

.loader{
  width:28px;
  height:28px;

  margin:15px auto 20px;

  border:3px solid #dbe5ff;

  border-top-color:var(--primary);

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.btn{
  display:block;

  width:100%;

  padding:12px 15px;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  text-decoration:none;

  font-size:13px;

  font-weight:800;

  box-shadow:
    0 4px 10px rgba(21,94,239,.18);
}

.btn:hover{
  background:var(--primary-dark);
}

.secondary{
  margin-top:9px;

  display:block;

  width:100%;

  padding:11px 15px;

  border-radius:10px;

  background:#fff;

  border:1px solid var(--border);

  color:#344054;

  text-decoration:none;

  font-size:12px;

  font-weight:700;
}

.note{
  margin-top:15px;

  color:#98a2b3;

  font-size:10px;

  line-height:1.5;
}

.hidden{
  display:none !important;
}

@media(max-width:480px){

  .card{
    padding:28px 18px 22px;
    border-radius:18px;
  }

  h1{
    font-size:22px;
  }

  .logo{
    margin-bottom:22px;
  }

}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    📚 CreateLK Academy
  </div>


  <!-- ICON -->

  <div
    id="icon"
    class="icon direct"
  >
    🔐
  </div>


  <!-- TITLE -->

  <h1 id="title">
    Payment Verification
  </h1>


  <!-- SUBTITLE -->

  <p
    id="subtitle"
    class="subtitle"
  >
    This page is used to process your CreateLK Premium payment return.
  </p>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Checking payment session...
  </div>


  <!-- LOADER -->

  <div
    id="loader"
    class="loader hidden"
  ></div>


  <!-- DASHBOARD -->

  <a
    id="dashboardButton"
    class="btn"
    href="dashboard.html"
  >
    Go to Dashboard
  </a>


  <!-- PREMIUM -->

  <a
    id="premiumButton"
    class="secondary"
    href="https://payhere.lk/pay/oa930eb39"
  >
    ⭐ Premium Membership
  </a>


  <p class="note">
    Premium access is activated only after
    secure server-side payment verification.
  </p>

</div>


<script>

/*
==================================================
CREATE LK ACADEMY
PAYMENT SUCCESS / RETURN PAGE
==================================================

DIRECT OPEN
-----------
If there is no logged-in student session,
the page shows a "Direct Open" message.

PAYHERE RETURN
--------------
If the customer has a valid login session,
the page checks the Return Worker.

ACTIVATION
----------
Premium is NOT activated by this HTML page.

The Notify Worker must verify the actual PayHere
payment and update D1 first.

==================================================
*/


const RETURN_API =
"https://createlk-payment-return.createlk.workers.dev";


const STUDENT_KEY =
"createlk_student";


const icon =
document.getElementById("icon");

const title =
document.getElementById("title");

const subtitle =
document.getElementById("subtitle");

const status =
document.getElementById("status");

const loader =
document.getElementById("loader");

const dashboardButton =
document.getElementById("dashboardButton");

const premiumButton =
document.getElementById("premiumButton");


/*
==================================================
GET LOGIN SESSION
==================================================
*/

let student = null;

try{

  student =
    JSON.parse(
      sessionStorage.getItem(
        STUDENT_KEY
      ) || "null"
    );

}catch(error){

  console.error(
    "Session error:",
    error
  );

}


const studentId =
  student?.id ||
  student?.student_id;


/*
==================================================
DIRECT OPEN
==================================================

No student session means this page was opened
directly or outside the logged-in payment flow.
==================================================
*/

if(!studentId){

  icon.textContent = "🔐";

  icon.className =
    "icon direct";

  title.textContent =
    "Payment Verification";

  subtitle.textContent =
    "This page is available after returning from a CreateLK Premium payment.";

  status.className =
    "status";

  status.textContent =
    "Please sign in to your CreateLK Academy account before making a Premium payment.";

  loader.classList.add("hidden");

  dashboardButton.textContent =
    "Go to Login";

  dashboardButton.href =
    "login.html";

  premiumButton.style.display =
    "block";

}


/*
==================================================
CUSTOMER RETURN / LOGGED-IN USER
==================================================
*/

else{

  startVerification();

}


/*
==================================================
CHECK D1 MEMBERSHIP
==================================================
*/

async function startVerification(){

  icon.textContent = "✓";

  icon.className =
    "icon";

  title.textContent =
    "Payment Received";

  subtitle.textContent =
    "Thank you for your CreateLK Premium payment.";

  status.className =
    "status";

  status.textContent =
    "Checking your Premium membership...";

  loader.classList.remove("hidden");

  premiumButton.style.display =
    "none";


  try{

    const response =
      await fetch(
        RETURN_API +
        "/check?student_id=" +
        encodeURIComponent(studentId),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    console.log(
      "Premium verification:",
      data
    );


    /*
    ==============================================
    PREMIUM ACTIVE
    ==============================================
    */

    if(
      response.ok &&
      data.success === true &&
      data.premium === true
    ){

      loader.classList.add("hidden");

      icon.textContent =
        "✓";

      icon.className =
        "icon";

      title.textContent =
        "Premium Activated";

      subtitle.textContent =
        "Your CreateLK Premium membership is now active.";

      status.className =
        "status success";

      status.innerHTML =
        "⭐ Premium membership activated successfully.";

      setTimeout(function(){

        location.replace(
          "dashboard.html"
        );

      },1500);

      return;
    }


    /*
    ==============================================
    PAYMENT RETURNED
    BUT NOT ACTIVATED YET
    ==============================================
    */

    loader.classList.add("hidden");

    icon.textContent =
      "⏳";

    icon.className =
      "icon pending";

    title.textContent =
      "Payment Received";

    subtitle.textContent =
      "Your payment has been received by PayHere.";

    status.className =
      "status pending";

    status.innerHTML =
      "⏳ Premium activation is still being processed. Please check your dashboard shortly.";

  }


  catch(error){

    console.error(
      "Verification error:",
      error
    );


    loader.classList.add("hidden");

    icon.textContent =
      "!";

    icon.className =
      "icon error";

    title.textContent =
      "Verification Pending";

    subtitle.textContent =
      "Your payment may still be processing.";

    status.className =
      "status error";

    status.textContent =
      "We could not check your Premium status right now. Please check your dashboard shortly.";

  }

}

</script>

</body>
</html>
