<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Digital Learning Shop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#222}
header{background:#111827;color:white;padding:15px}
nav{max-width:900px;margin:auto;display:flex;gap:18px;align-items:center;justify-content:space-between}
nav button{background:none;border:0;color:white;cursor:pointer}
main{max-width:900px;margin:auto;padding:25px 15px}
h1{text-align:center}
.box{background:white;padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #ddd}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}
button{padding:10px 15px;border:0;border-radius:7px;cursor:pointer}
.primary{background:#2563eb;color:white}
.danger{background:#dc2626;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.card{background:white;padding:18px;border-radius:10px;box-shadow:0 2px 8px #ddd}
.price{font-size:20px;font-weight:bold;margin:12px 0}
.msg{padding:10px;border-radius:7px;margin:10px 0}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.hidden{display:none!important}
.status{font-size:12px;font-weight:bold}
.lesson{line-height:1.7}
footer{text-align:center;background:#111827;color:white;padding:20px;margin-top:30px}
</style>
</head>

<body>

<header>
<nav>
<b>CreateLK</b>
<div>
<button onclick="shop()">Shop</button>
<button onclick="account()">Account</button>
<button id="loginBtn" onclick="loginBox()">Login</button>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</div>
</nav>
</header>

<main>

<h1>Digital Learning Shop</h1>
<p style="text-align:center">
Quality resources for learning, practice and exam preparation.
</p>

<div id="msg"></div>

<!-- LOGIN -->
<div id="login" class="box hidden">

<h2>Login</h2>

<input id="le" type="email" placeholder="Email">
<input id="lp" type="password" placeholder="Password">

<button class="primary" onclick="doLogin()">Login</button>

<hr>

<h2>Create Account</h2>

<input id="fn" placeholder="First name">
<input id="ln" placeholder="Last name">
<input id="re" type="email" placeholder="Email">
<input id="ph" placeholder="Phone">
<input id="rp" type="password" placeholder="Password">

<button class="primary" onclick="register()">Create Account</button>

</div>

<!-- SHOP -->
<div id="shop">

<div class="box">
<input id="search" placeholder="Search learning resources..." oninput="render()">
<select id="subject" onchange="render()">
<option value="">All Subjects</option>
</select>
</div>

<div id="count"></div>
<br>
<div id="products" class="grid">Loading...</div>

</div>

<!-- ACCOUNT -->
<div id="account" class="box hidden">

<h2>My Account</h2>

<div id="userInfo"></div>

<h2>My Learning Resources</h2>

<div id="purchases">Loading...</div>

</div>

<!-- LESSON -->
<div id="lesson" class="box hidden"></div>

</main>

<footer>
CreateLK Digital Learning Shop
</footer>

<script>

const API="https://createlk-digital-shop.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";

let products=[];
let customer=null;

const $=id=>document.getElementById(id);

function msg(text,error=false){
  $("msg").innerHTML=
    `<div class="msg ${error?"error":"success"}">${text}</div>`;
}

function token(){
  return localStorage.getItem("createlk_token");
}

function esc(x){
  return String(x??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* NAVIGATION */

function hideAll(){
  $("login").classList.add("hidden");
  $("shop").classList.add("hidden");
  $("account").classList.add("hidden");
  $("lesson").classList.add("hidden");
}

function shop(){
  hideAll();
  $("shop").classList.remove("hidden");
}

function loginBox(){
  hideAll();
  $("login").classList.remove("hidden");
}

async function account(){
  hideAll();
  $("account").classList.remove("hidden");

  if(!await auth()){
    $("userInfo").innerHTML=
      `Please login.<br><br>
       <button class="primary" onclick="loginBox()">Login</button>`;
    $("purchases").innerHTML="";
    return;
  }

  $("userInfo").innerHTML=`
    <p><b>Name:</b> ${esc(customer.first_name)} ${esc(customer.last_name)}</p>
    <p><b>Email:</b> ${esc(customer.email)}</p>
    <p><b>Phone:</b> ${esc(customer.phone||"-")}</p>
  `;

  loadPurchases();
}


/* AUTH */

async function auth(){

  const t=token();

  if(!t){
    customer=null;
    updateNav();
    return false;
  }

  try{

    const r=await fetch(API+"/auth/me",{
      headers:{Authorization:"Bearer "+t},
      cache:"no-store"
    });

    const d=await r.json();

    if(!r.ok||!d.success){
      localStorage.removeItem("createlk_token");
      customer=null;
      updateNav();
      return false;
    }

    customer=d.customer;
    updateNav();
    return true;

  }catch{
    customer=null;
    updateNav();
    return false;
  }
}

function updateNav(){
  $("loginBtn").classList.toggle("hidden",!!customer);
  $("logoutBtn").classList.toggle("hidden",!customer);
}

function logout(){
  localStorage.removeItem("createlk_token");
  customer=null;
  updateNav();
  msg("Logged out.");
  shop();
}


/* LOGIN */

async function doLogin(){

  try{

    const r=await fetch(API+"/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:$("le").value.trim(),
        password:$("lp").value
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Login failed.");

    localStorage.setItem("createlk_token",d.token);

    customer=d.customer;
    updateNav();

    msg("Login successful.");
    account();

  }catch(e){
    msg(e.message,true);
  }
}


/* REGISTER */

async function register(){

  try{

    const r=await fetch(API+"/auth/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        first_name:$("fn").value.trim(),
        last_name:$("ln").value.trim(),
        email:$("re").value.trim(),
        phone:$("ph").value.trim(),
        password:$("rp").value
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Registration failed.");

    localStorage.setItem("createlk_token",d.token);

    customer=d.customer;
    updateNav();

    msg("Account created.");
    account();

  }catch(e){
    msg(e.message,true);
  }
}


/* PRODUCTS */

async function loadProducts(){

  try{

    const r=await fetch(API+"/products",{
      cache:"no-store"
    });

    const d=await r.json();

    if(!d.success)
      throw Error(d.error);

    products=d.products||[];

    const subjects=[
      ...new Set(
        products
        .map(x=>x.subject)
        .filter(Boolean)
      )
    ];

    subjects.forEach(x=>{
      $("subject").innerHTML+=
        `<option value="${esc(x)}">${esc(x)}</option>`;
    });

    render();

  }catch(e){

    $("products").innerHTML=
      `<p>Unable to load resources.</p>`;
  }
}


function render(){

  const q=$("search").value.toLowerCase();
  const s=$("subject").value.toLowerCase();

  const list=products.filter(p=>
    (!q||
      String(p.title).toLowerCase().includes(q)||
      String(p.description||"").toLowerCase().includes(q)
    )&&
    (!s||
      String(p.subject||"").toLowerCase()===s
    )
  );

  $("count").textContent=
    list.length+
    (list.length===1?" resource":" resources");

  $("products").innerHTML=list.length
    ?list.map(p=>`

      <div class="card">

        <small>
          CreateLK • ${esc(p.subject||"Learning")}
        </small>

        <h3>${esc(p.title)}</h3>

        <p>${esc(p.description||"")}</p>

        <div class="price">
          LKR ${Number(p.price||0).toFixed(0)}
        </div>

        <button
          class="primary"
          style="width:100%"
          onclick="buy(${Number(p.id)},this)"
        >
          Buy Now
        </button>

      </div>

    `).join("")
    :"<p>No resources found.</p>";
}


/* BUY */

async function buy(id,button){

  if(!await auth()){

    loginBox();

    msg(
      "Please login or create an account before purchasing.",
      true
    );

    return;
  }

  button.disabled=true;
  button.textContent="Preparing payment...";

  try{

    const r=await fetch(PAY+"/checkout",{
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token()
      },

      body:JSON.stringify({
        product_id:Number(id)
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(
        d.error||"Unable to start payment."
      );

    const form=document.createElement("form");

    form.method="POST";
    form.action="https://www.payhere.lk/pay/checkout";

    Object.entries(d.checkout).forEach(([k,v])=>{

      const i=document.createElement("input");

      i.type="hidden";
      i.name=k;
      i.value=v??"";

      form.appendChild(i);

    });

    document.body.appendChild(form);
    form.submit();

  }catch(e){

    button.disabled=false;
    button.textContent="Buy Now";

    msg(e.message,true);
  }
}


/* PURCHASES */

async function loadPurchases(){

  try{

    const r=await fetch(API+"/my-purchases",{
      headers:{
        Authorization:"Bearer "+token()
      },
      cache:"no-store"
    });

    const d=await r.json();

    if(!d.success)
      throw Error(d.error);

    const list=d.purchases||[];

    if(!list.length){
      $("purchases").innerHTML=
        "<p>No purchases yet.</p>";
      return;
    }

    $("purchases").innerHTML=list.map(p=>{

      const status=
        String(p.status||"").toUpperCase();

      return `

        <div class="box">

          <b>${esc(p.title)}</b>

          <p>
            LKR ${Number(p.amount||0).toFixed(2)}
          </p>

          <p class="status">
            Status: ${esc(status)}
          </p>

          ${
            status==="PAID"
            ?`
              <button
                class="primary"
                onclick="lesson(${Number(p.product_id)})"
              >
                Open Lesson
              </button>
            `
            :""
          }

        </div>

      `;

    }).join("");

  }catch(e){

    $("purchases").innerHTML=
      "<p>Unable to load purchases.</p>";
  }
}


/* LESSON */

async function lesson(id){

  if(!await auth()){
    loginBox();
    return;
  }

  hideAll();

  $("lesson").classList.remove("hidden");

  $("lesson").innerHTML=
    "Loading lesson...";

  try{

    const r=await fetch(
      API+"/content/"+Number(id),
      {
        headers:{
          Authorization:"Bearer "+token()
        },
        cache:"no-store"
      }
    );

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(
        d.error||"Unable to open lesson."
      );

    const p=d.product;

    $("lesson").innerHTML=`

      <h2>${esc(p.title)}</h2>

      <small>${esc(p.subject||"")}</small>

      <div style="margin-top:20px">
        ${p.content||
          "<p>Lesson content is not available.</p>"}
      </div>

      <br>

      <button onclick="account()">
        Back to Account
      </button>

    `;

  }catch(e){

    $("lesson").innerHTML=
      `<p>${esc(e.message)}</p>
       <button onclick="account()">Back</button>`;
  }
}


/* START */

(async()=>{

  await auth();
  await loadProducts();
  shop();

})();

</script>

</body>
</html>
