<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163A63">

<title>CreateLK Digital Learning Shop</title>
<meta name="description" content="CreateLK Digital Learning Shop - Quality digital educational resources.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#163A63;
  --navy-dark:#102E50;
  --blue:#2563EB;
  --blue-dark:#1D4ED8;
  --blue-light:#EFF6FF;
  --white:#fff;
  --soft:#F7F9FC;
  --heading:#172B3A;
  --text:#263238;
  --muted:#6B7785;
  --border:#E2E8F0;
  --success:#15803D;
  --danger:#DC2626;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--soft);
  color:var(--text);
  line-height:1.5;
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

header{
  background:var(--white);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:50;
}

.nav{
  max-width:1180px;
  margin:auto;
  min-height:68px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:var(--navy);
  white-space:nowrap;
}

.brand img{
  width:38px;
  height:38px;
  object-fit:contain;
}

.brand span{
  font-size:17px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-links a{
  padding:9px 12px;
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  font-weight:600;
}

.nav-links a:hover,
.nav-links a.active{
  background:var(--blue-light);
  color:var(--blue);
}

/* MAIN */

main{
  max-width:1180px;
  margin:auto;
  padding:32px 20px 60px;
}

.page-title{
  text-align:center;
  margin-bottom:26px;
}

.page-title h1{
  color:var(--heading);
  font-size:32px;
  margin-bottom:7px;
}

.page-title p{
  color:var(--muted);
  font-size:15px;
}

/* CONTROLS */

.controls{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  display:flex;
  gap:10px;
  margin-bottom:24px;
}

.search{
  flex:1;
  min-width:0;
}

.search input,
.controls select{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 13px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.search input:focus,
.controls select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.card-image{
  width:100%;
  aspect-ratio:16/9;
  background:var(--blue-light);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  color:var(--blue);
  font-weight:800;
  font-size:24px;
}

.card-body{
  padding:16px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.subject{
  color:var(--blue);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:6px;
}

.card h2{
  color:var(--heading);
  font-size:17px;
  line-height:1.35;
  margin-bottom:7px;
}

.description{
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
  flex:1;
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.price{
  color:var(--navy);
  font-size:18px;
  font-weight:800;
}

.buy{
  border:0;
  background:var(--blue);
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
}

.buy:hover{
  background:var(--blue-dark);
}

.buy:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:40px 20px;
  color:var(--muted);
}

/* MESSAGE */

.message{
  display:none;
  margin-bottom:18px;
  padding:12px 15px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
}

.message.success{
  display:block;
  background:#ECFDF5;
  color:var(--success);
  border:1px solid #BBF7D0;
}

.message.error{
  display:block;
  background:#FEF2F2;
  color:var(--danger);
  border:1px solid #FECACA;
}

/* FOOTER */

footer{
  background:var(--navy-dark);
  color:#D9E4F0;
  padding:28px 20px;
}

.footer-inner{
  max-width:1180px;
  margin:auto;
  text-align:center;
  font-size:13px;
}

.footer-links{
  margin-top:8px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
}

.footer-links a:hover{
  color:#fff;
}

/* MOBILE */

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:680px){

  .nav{
    min-height:62px;
    padding:0 14px;
  }

  .brand img{
    width:34px;
    height:34px;
  }

  .brand span{
    font-size:15px;
  }

  .nav-links a{
    padding:7px 8px;
    font-size:12px;
  }

  main{
    padding:25px 14px 45px;
  }

  .page-title h1{
    font-size:26px;
  }

  .controls{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card-body{
    padding:12px;
  }

  .card h2{
    font-size:15px;
  }

  .description{
    font-size:12px;
  }

  .bottom{
    flex-direction:column;
    align-items:stretch;
  }

  .price{
    font-size:16px;
  }

  .buy{
    width:100%;
  }
}

@media(max-width:390px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <nav class="nav">

    <a href="/index.html" class="brand">
      <img
        src="https://assets.createlk.com/file_000000003e448207b8c6a7ecc4a7e1d4.png"
        alt="CreateLK"
      >
      <span>CreateLK Digital Learning Shop</span>
    </a>

    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/shop.html" class="active">Shop</a>
      <a href="/account.html">Account</a>
    </div>

  </nav>
</header>


<main>

  <section class="page-title">
    <h1>Digital Learning Shop</h1>
    <p>Quality educational resources for learning, practice and exam preparation.</p>
  </section>


  <div id="message" class="message"></div>


  <section class="controls">

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Search learning resources..."
        autocomplete="off"
      >
    </div>

    <div style="width:220px">
      <select id="subject">
        <option value="">All Subjects</option>
        <option value="English">English</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Science">Science</option>
        <option value="ICT">ICT</option>
        <option value="History">History</option>
        <option value="Geography">Geography</option>
        <option value="Tamil">Tamil</option>
        <option value="Sinhala">Sinhala</option>
        <option value="Exam Preparation">Exam Preparation</option>
      </select>
    </div>

  </section>


  <section id="products" class="grid"></section>

  <div id="empty" class="empty">
    No learning resources found.
  </div>

</main>


<footer>

  <div class="footer-inner">

    <div>
      © 2026 CreateLK Digital Learning Shop
    </div>

    <div class="footer-links">
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/refund.html">Refund Policy</a>
      <a href="/contact.html">Contact</a>
    </div>

  </div>

</footer>


<script>

const API =
  "https://createlk-digital-shop.createlk.workers.dev";

const PAYHERE_API =
  "https://createlk-payhere.createlk.workers.dev";

let products = [];


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  try{

    const response =
      await fetch(API + "/products");

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.error || "Unable to load products."
      );
    }

    products =
      Array.isArray(data.products)
        ? data.products
        : [];

    renderProducts();

  }catch(error){

    console.error(error);

    document.getElementById("products")
      .innerHTML = "";

    showMessage(
      "Unable to load the shop. Please try again.",
      "error"
    );
  }
}


/* =========================================================
   RENDER
========================================================= */

function renderProducts(){

  const container =
    document.getElementById("products");

  const empty =
    document.getElementById("empty");

  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const subject =
    document.getElementById("subject")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    products.filter(product => {

      const title =
        String(product.title || "")
          .toLowerCase();

      const description =
        String(product.description || "")
          .toLowerCase();

      const productSubject =
        String(product.subject || "")
          .toLowerCase();

      const matchesSearch =
        !search ||
        title.includes(search) ||
        description.includes(search) ||
        productSubject.includes(search);

      const matchesSubject =
        !subject ||
        productSubject === subject;

      return matchesSearch && matchesSubject;
    });


  container.innerHTML =
    filtered.map(product => {

      const image =
        product.image
          ? `
            <img
              src="${escapeHtml(product.image)}"
              alt="${escapeHtml(product.title)}"
              loading="lazy"
            >
          `
          : `
            <div class="placeholder">
              CreateLK
            </div>
          `;

      return `
        <article class="card">

          <div class="card-image">
            ${image}
          </div>

          <div class="card-body">

            <div class="subject">
              ${escapeHtml(product.subject || "Learning")}
            </div>

            <h2>
              ${escapeHtml(product.title)}
            </h2>

            <p class="description">
              ${escapeHtml(
                product.description ||
                "Digital educational resource."
              )}
            </p>

            <div class="bottom">

              <div class="price">
                LKR ${Number(product.price || 0).toLocaleString()}
              </div>

              <button
                class="buy"
                onclick="buyProduct(${Number(product.id)})"
              >
                Buy Now
              </button>

            </div>

          </div>

        </article>
      `;

    }).join("");


  empty.style.display =
    filtered.length
      ? "none"
      : "block";
}


/* =========================================================
   BUY PRODUCT
========================================================= */

async function buyProduct(productId){

  const token =
    localStorage.getItem("createlk_token");

  if(!token){

    const go =
      confirm(
        "Please login or create an account before purchasing.\n\nGo to login?"
      );

    if(go){

      location.href =
        "/login.html?redirect=" +
        encodeURIComponent(
          "/shop.html"
        );
    }

    return;
  }


  const button =
    event && event.target
      ? event.target
      : null;

  if(button){
    button.disabled = true;
    button.textContent = "Preparing...";
  }


  try{

    const response =
      await fetch(
        PAYHERE_API + "/checkout",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Authorization":
              "Bearer " + token
          },

          body:JSON.stringify({
            product_id:Number(productId)
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Unable to start payment."
      );
    }


    /* Already purchased */

    if(data.already_purchased){

      showMessage(
        "You already purchased this resource. Open your account to access it.",
        "success"
      );

      setTimeout(() => {

        location.href =
          "/account.html";

      },1200);

      return;
    }


    /* PayHere form */

    if(
      !data.action ||
      !data.fields
    ){

      throw new Error(
        "Invalid payment response."
      );
    }


    const form =
      document.createElement("form");

    form.method = "POST";
    form.action = data.action;
    form.style.display = "none";


    Object.entries(data.fields)
      .forEach(([name,value]) => {

        const input =
          document.createElement("input");

        input.type = "hidden";
        input.name = name;
        input.value = value ?? "";

        form.appendChild(input);
      });


    document.body.appendChild(form);

    form.submit();


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Payment could not be started.",
      "error"
    );

    if(button){

      button.disabled = false;
      button.textContent = "Buy Now";
    }
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   SEARCH / FILTER
========================================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );

document
  .getElementById("subject")
  .addEventListener(
    "change",
    renderProducts
);


/* =========================================================
   URL SUBJECT
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const subjectParam =
  params.get("subject");

if(subjectParam){

  const select =
    document.getElementById("subject");

  const option =
    [...select.options]
      .find(
        o =>
          o.value.toLowerCase() ===
          subjectParam.toLowerCase()
      );

  if(option){
    select.value = option.value;
  }
}


/* =========================================================
   PAYHERE RETURN / CANCEL
========================================================= */

const payment =
  params.get("payment");


if(payment === "success"){

  showMessage(
    "Payment submitted successfully. Your purchase will appear in your account after PayHere payment verification.",
    "success"
  );

  history.replaceState(
    {},
    "",
    "/shop.html"
  );
}


if(payment === "cancelled"){

  showMessage(
    "Payment cancelled. No payment was completed.",
    "error"
  );

  history.replaceState(
    {},
    "",
    "/shop.html"
  );
}


/* =========================================================
   START
========================================================= */

loadProducts();

</script>

</body>
</html>
