<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>CreateLK Digital Learning Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .hero {
      background: white;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .hero p {
      margin: 0;
      color: #666;
    }

    .filters {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
      background: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .product-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category {
      font-size: 12px;
      color: #666;
      margin-bottom: 7px;
    }

    .product h2 {
      font-size: 19px;
      margin: 0 0 9px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    .access {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .buy-btn {
      background: #111827;
      color: white;
    }

    .read-btn {
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .message {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      max-width: 420px;
      margin: 100px auto;
      background: white;
      border-radius: 16px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      background: #eee;
      color: #222;
    }

    .verify {
      background: #111827;
      color: white;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
      }

      nav a {
        margin: 0 7px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CreateLK</div>

    <nav>
      <a href="/">Home</a>
      <a href="/shop.html">Shop</a>
      <a href="#" onclick="openAccess(); return false;">
        Already Purchased?
      </a>
    </nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Digital Learning Shop</h1>
    <p>Learn online with affordable digital learning resources.</p>
  </section>

  <div id="message" class="message"></div>

  <section class="filters">

    <div>
      <label for="category">Category</label>

      <select id="category" onchange="loadProducts()">
        <option value="">All Categories</option>
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
        <option value="Sinhala">Sinhala</option>
        <option value="Mathematics">Mathematics</option>
        <option value="ICT">ICT</option>
      </select>
    </div>

    <div>
      <label for="language">Language</label>

      <select id="language" onchange="loadProducts()">
        <option value="">All Languages</option>
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
        <option value="Sinhala">Sinhala</option>
      </select>
    </div>

    <div>
      <label for="search">Search</label>

      <input
        id="search"
        type="search"
        placeholder="Search learning resources..."
        oninput="filterProducts()"
      >
    </div>

  </section>

  <div id="status" class="status">
    Loading products...
  </div>

  <section id="products" class="products"></section>

</main>

<footer>
  © 2026 CreateLK. All rights reserved.
</footer>


<!-- ACCESS MODAL -->

<div id="accessModal" class="modal">

  <div class="modal-box">

    <h2>Already Purchased?</h2>

    <p>
      Enter your PayHere Order ID to access your learning content.
    </p>

    <input
      id="orderId"
      type="text"
      placeholder="Example: CLK-123456789"
      autocomplete="off"
    >

    <button class="verify" onclick="verifyAccess()">
      Verify Purchase
    </button>

    <button class="close" onclick="closeAccess()">
      Cancel
    </button>

    <div id="accessMessage"
         style="margin-top:15px;font-size:14px;">
    </div>

  </div>

</div>


<script>

const API =
  "https://createlk-digital-shop.createlk.workers.dev";

const PAYHERE_API =
  "https://createlk-payhere.createlk.workers.dev";

let allProducts = [];


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("products");

  status.style.display = "block";
  status.textContent = "Loading products...";

  container.innerHTML = "";

  const category =
    document.getElementById("category").value;

  const language =
    document.getElementById("language").value;

  try {

    let url = API + "/products";

    const params = new URLSearchParams();

    /*
      Your current Worker uses "subject".
      Therefore category is sent as subject.
    */

    if (category) {
      params.set("subject", category);
    }

    if (params.toString()) {
      url += "?" + params.toString();
    }

    const res =
      await fetch(url);

    const data =
      await res.json();

    if (!data.success) {
      throw new Error(
        data.error || "Could not load products."
      );
    }

    allProducts =
      data.products || [];

    /*
      Language filtering is done on the
      client because the current products
      endpoint doesn't have a language field.
    */

    if (language) {

      allProducts =
        allProducts.filter(product => {

          const text = (
            product.title +
            " " +
            product.description +
            " " +
            product.subject
          ).toLowerCase();

          return text.includes(
            language.toLowerCase()
          );

        });

    }

    renderProducts(allProducts);

    status.style.display =
      allProducts.length ? "none" : "block";

    if (!allProducts.length) {
      status.textContent =
        "No products found.";
    }

  } catch (error) {

    console.error(error);

    status.style.display = "block";

    status.textContent =
      error.message ||
      "Unable to load products.";

  }
}


/* =========================
   SEARCH
========================= */

function filterProducts() {

  const query =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  if (!query) {
    renderProducts(allProducts);
    return;
  }

  const filtered =
    allProducts.filter(product => {

      const text = [
        product.title,
        product.description,
        product.subject
      ]
      .join(" ")
      .toLowerCase();

      return text.includes(query);

    });

  renderProducts(filtered);

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products) {

  const container =
    document.getElementById("products");

  container.innerHTML = "";

  products.forEach(product => {

    const card =
      document.createElement("article");

    card.className = "product";

    const image =
      product.image ||
      "https://placehold.co/600x400?text=CreateLK";

    card.innerHTML = `

      <img
        class="product-image"
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.title)}"
        loading="lazy"
      >

      <div class="product-body">

        <div class="category">
          ${escapeHtml(product.subject || "Learning")}
        </div>

        <h2>
          ${escapeHtml(product.title)}
        </h2>

        <div class="description">
          ${escapeHtml(
            product.description ||
            "Digital learning resource."
          )}
        </div>

        <div class="price">
          LKR ${Number(product.price).toFixed(2)}
        </div>

        <div class="access">
          30 days online access
        </div>

        <button
          class="buy-btn"
          onclick="buy(${Number(product.id)})"
        >
          Buy Now
        </button>

        <button
          class="read-btn"
          onclick="openAccess(${Number(product.id)})"
        >
          Already Purchased? Read
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}


/* =========================
   BUY
========================= */

async function buy(productId) {

  try {

    const response =
      await fetch(
        PAYHERE_API + "/checkout",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            product_id: productId
          })
        }
      );

    const data =
      await response.json();

    /*
      Your current PayHere Worker expects
      an authenticated customer token.

      If you are moving to the new
      no-login system, replace the checkout
      authentication with your new
      payment-token/order system.
    */

    if (!data.success) {

      alert(
        data.error ||
        "Unable to start payment."
      );

      return;
    }

    /*
      Create PayHere form.
    */

    const form =
      document.createElement("form");

    form.method = "POST";

    form.action =
      "https://www.payhere.lk/pay/checkout";

    form.style.display = "none";


    const fields = {

      merchant_id: data.merchant_id,

      return_url:
        data.return_url,

      cancel_url:
        data.cancel_url,

      notify_url:
        data.notify_url,

      first_name:
        data.first_name || "Customer",

      last_name:
        data.last_name || "",

      email:
        data.email || "",

      phone:
        data.phone || "",

      address:
        data.address || "Sri Lanka",

      city:
        data.city || "Kandy",

      country:
        data.country || "Sri Lanka",

      order_id:
        data.order_id,

      items:
        data.items,

      currency:
        data.currency,

      amount:
        Number(data.amount).toFixed(2),

      hash:
        data.hash

    };


    Object.entries(fields)
      .forEach(([name, value]) => {

        if (
          value === undefined ||
          value === null
        ) {
          return;
        }

        const input =
          document.createElement("input");

        input.type = "hidden";
        input.name = name;
        input.value = value;

        form.appendChild(input);

      });


    document.body.appendChild(form);

    form.submit();

  } catch (error) {

    console.error(error);

    alert(
      "Payment could not be started. Please try again."
    );

  }

}


/* =========================
   ACCESS MODAL
========================= */

function openAccess(productId) {

  document.getElementById(
    "accessModal"
  ).style.display = "block";

  document.getElementById(
    "accessMessage"
  ).textContent = "";

  document.getElementById(
    "orderId"
  ).value = "";

  document.getElementById(
    "orderId"
  ).focus();

}


function closeAccess() {

  document.getElementById(
    "accessModal"
  ).style.display = "none";

}


/* =========================
   VERIFY ORDER
========================= */

async function verifyAccess() {

  const orderId =
    document.getElementById(
      "orderId"
    ).value.trim();

  const message =
    document.getElementById(
      "accessMessage"
    );

  if (!orderId) {

    message.textContent =
      "Please enter your Order ID.";

    return;
  }

  message.textContent =
    "Checking your purchase...";


  try {

    /*
      This endpoint will be added to
      your Cloudflare Worker.

      Example:
      POST /access/verify
    */

    const response =
      await fetch(
        API + "/access/verify",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            order_id: orderId
          })
        }
      );

    const data =
      await response.json();


    if (!data.success) {

      message.textContent =
        data.error ||
        "Purchase could not be verified.";

      return;
    }


    /*
      Save access token for this browser.
    */

    if (data.access_token) {

      localStorage.setItem(
        "createlk_access_token",
        data.access_token
      );

    }


    /*
      Open reading page.
    */

    if (data.product_id) {

      window.location.href =
        "/read.html?product_id=" +
        encodeURIComponent(
          data.product_id
        );

    } else {

      message.textContent =
        "Purchase verified, but reading page is unavailable.";

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to verify your purchase.";

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   CLOSE MODAL WHEN CLICKING
   OUTSIDE
========================= */

window.addEventListener(
  "click",
  function(event) {

    const modal =
      document.getElementById(
        "accessModal"
      );

    if (event.target === modal) {
      closeAccess();
    }

  }
);


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
