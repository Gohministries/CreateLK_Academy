<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreateLK Digital Learning Shop</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:22px;
  font-weight:700;
}

nav{
  display:flex;
  gap:18px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{
  text-decoration:underline;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:35px 20px 50px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  margin:0;
  color:#6b7280;
}

.auth-status{
  max-width:700px;
  margin:0 auto 22px;
  padding:12px 15px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
  display:none;
}

.auth-status.show{
  display:block;
}

.auth-status.warning{
  background:#fff7ed;
  color:#9a3412;
  border:1px solid #fed7aa;
}

.auth-status.success{
  background:#ecfdf5;
  color:#065f46;
  border:1px solid #a7f3d0;
}

.controls{
  display:flex;
  gap:12px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

select{
  padding:12px 14px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:white;
  font-size:15px;
}

.count{
  margin-bottom:15px;
  color:#6b7280;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:1px solid #e5e7eb;
  display:flex;
  flex-direction:column;
}

.card-image{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#e5e7eb;
}

.card-body{
  padding:18px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.brand{
  font-size:12px;
  color:#6b7280;
  margin-bottom:5px;
}

.subject{
  display:inline-block;
  font-size:12px;
  color:#2563eb;
  margin-bottom:8px;
}

.card h2{
  margin:0 0 10px;
  font-size:19px;
}

.description{
  color:#6b7280;
  font-size:14px;
  line-height:1.5;
  flex:1;
}

.price{
  margin-top:18px;
  font-size:20px;
  font-weight:700;
}

.buy{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.buy:hover{
  background:#1d4ed8;
}

.buy:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#6b7280;
  background:white;
  border-radius:10px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
}

footer{
  background:#111827;
  color:#d1d5db;
  text-align:center;
  padding:25px 20px;
  margin-top:30px;
}

footer a{
  color:#d1d5db;
  text-decoration:none;
  margin:0 8px;
}

footer a:hover{
  text-decoration:underline;
}

@media(max-width:600px){
  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    width:100%;
    justify-content:space-between;
  }

  .hero h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CreateLK</div>

    <nav>
      <a href="/index.html">Home</a>
      <a href="/shop.html">Shop</a>
      <a href="/account.html">Account</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Digital Learning Shop</h1>
    <p>Quality resources for learning, practice and exam preparation.</p>
  </section>

  <div id="authStatus" class="auth-status"></div>

  <div class="controls">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search learning resources..."
    >

    <select id="subject">
      <option value="">All Subjects</option>
    </select>
  </div>

  <div id="count" class="count">Loading resources...</div>

  <div id="products" class="grid">
    <div class="loading">Loading learning resources...</div>
  </div>

</main>

<footer>
  <div>CreateLK Digital Learning Shop</div>

  <div style="margin-top:10px;">
    <a href="/terms.html">Terms</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/refund.html">Refund</a>
    <a href="/contact.html">Contact</a>
  </div>
</footer>

<script>
const API = "https://createlk-digital-shop.createlk.workers.dev";
const PAYHERE_API = "https://createlk-payhere.createlk.workers.dev";

let products = [];
let currentCustomer = null;

const productsEl = document.getElementById("products");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
const subjectEl = document.getElementById("subject");
const authStatusEl = document.getElementById("authStatus");


function showAuthStatus(message, type="warning"){
  authStatusEl.textContent = message;
  authStatusEl.className = "auth-status show " + type;
}


function hideAuthStatus(){
  authStatusEl.className = "auth-status";
  authStatusEl.textContent = "";
}


function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/*
  IMPORTANT:
  The token is stored under exactly the same key used by login.html
  and account.html.
*/
function getToken(){
  return localStorage.getItem("createlk_token");
}


/*
  Verify the login token directly against the Shop API.
*/
async function checkLogin(){

  const token = getToken();

  if(!token){
    currentCustomer = null;

    showAuthStatus(
      "Please login before purchasing.",
      "warning"
    );

    return false;
  }

  try{

    const response = await fetch(
      API + "/auth/me",
      {
        method:"GET",
        headers:{
          "Authorization":"Bearer " + token
        },
        cache:"no-store"
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success || !data.customer){

      localStorage.removeItem("createlk_token");
      currentCustomer = null;

      showAuthStatus(
        "Your login session has expired. Please login again.",
        "warning"
      );

      return false;
    }

    currentCustomer = data.customer;

    showAuthStatus(
      "Logged in as " + (
        data.customer.first_name ||
        data.customer.email ||
        "Customer"
      ),
      "success"
    );

    return true;

  }catch(error){

    console.error("Authentication check failed:",error);

    currentCustomer = null;

    showAuthStatus(
      "Unable to verify your login. Please refresh the page.",
      "warning"
    );

    return false;
  }
}


/*
  Load products from the Shop Worker.
*/
async function loadProducts(){

  productsEl.innerHTML =
    '<div class="loading">Loading learning resources...</div>';

  try{

    const response = await fetch(
      API + "/products",
      {
        method:"GET",
        cache:"no-store"
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "Unable to load products."
      );
    }

    products = Array.isArray(data.products)
      ? data.products
      : [];

    buildSubjects();
    renderProducts();

  }catch(error){

    console.error(error);

    productsEl.innerHTML = `
      <div class="empty">
        Unable to load learning resources.
        <br><br>
        Please refresh the page and try again.
      </div>
    `;

    countEl.textContent = "Unable to load resources.";
  }
}


/*
  Build subject filter.
*/
function buildSubjects(){

  const subjects = [
    ...new Set(
      products
        .map(p => String(p.subject || "").trim())
        .filter(Boolean)
    )
  ].sort();

  subjectEl.innerHTML =
    '<option value="">All Subjects</option>';

  subjects.forEach(subject => {

    const option = document.createElement("option");

    option.value = subject;
    option.textContent = subject;

    subjectEl.appendChild(option);
  });
}


/*
  Render product cards.
*/
function renderProducts(){

  const search =
    searchEl.value.trim().toLowerCase();

  const subject =
    subjectEl.value.trim().toLowerCase();

  const filtered = products.filter(product => {

    const title =
      String(product.title || "").toLowerCase();

    const description =
      String(product.description || "").toLowerCase();

    const productSubject =
      String(product.subject || "").toLowerCase();

    const matchesSearch =
      !search ||
      title.includes(search) ||
      description.includes(search);

    const matchesSubject =
      !subject ||
      productSubject === subject;

    return matchesSearch && matchesSubject;
  });

  countEl.textContent =
    filtered.length +
    (filtered.length === 1 ? " resource" : " resources");

  if(!filtered.length){

    productsEl.innerHTML = `
      <div class="empty">
        No learning resources found.
      </div>
    `;

    return;
  }

  productsEl.innerHTML =
    filtered.map(product => {

      const image = product.image
        ? `<img class="card-image"
             src="${esc(product.image)}"
             alt="${esc(product.title)}"
             onerror="this.style.display='none'">`
        : "";

      return `
        <article class="card">

          ${image}

          <div class="card-body">

            <div class="brand">CreateLK</div>

            <div class="subject">
              ${esc(product.subject || "Learning")}
            </div>

            <h2>${esc(product.title)}</h2>

            <div class="description">
              ${esc(product.description || "")}
            </div>

            <div class="price">
              LKR ${Number(product.price || 0).toFixed(0)}
            </div>

            <button
              class="buy"
              onclick="buy(${Number(product.id)}, this)"
            >
              Buy Now
            </button>

          </div>
        </article>
      `;
    }).join("");
}


/*
  Purchase / PayHere checkout.
*/
async function buy(id, button){

  /*
    Always read the token again at the moment of purchase.
    This prevents an old value from being cached in JavaScript.
  */
  const token = getToken();

  if(!token){

    showAuthStatus(
      "Please login before purchasing.",
      "warning"
    );

    if(confirm(
      "Please login or create an account before purchasing.\n\nGo to login?"
    )){
      location.href =
        "/login.html?redirect=" +
        encodeURIComponent("/shop.html");
    }

    return;
  }


  /*
    Verify the token one more time before payment.
  */
  try{

    const authResponse = await fetch(
      API + "/auth/me",
      {
        method:"GET",
        headers:{
          "Authorization":"Bearer " + token
        },
        cache:"no-store"
      }
    );

    const authData = await authResponse.json();

    if(!authResponse.ok || !authData.success){

      localStorage.removeItem("createlk_token");

      alert(
        "Your login session has expired. Please login again."
      );

      location.href =
        "/login.html?redirect=" +
        encodeURIComponent("/shop.html");

      return;
    }

    currentCustomer = authData.customer;

  }catch(error){

    console.error(error);

    alert(
      "Unable to verify your login. Please try again."
    );

    return;
  }


  const product =
    products.find(p => Number(p.id) === Number(id));

  if(!product){

    alert("Product not found.");

    return;
  }


  if(button){

    button.disabled = true;
    button.textContent = "Preparing payment...";
  }


  try{

    const response = await fetch(
      PAYHERE_API + "/checkout",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },

        body:JSON.stringify({
          product_id:Number(id)
        })
      }
    );


    const data = await response.json();


    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Unable to start payment."
      );
    }


    if(
      !data.checkout ||
      !data.checkout.merchant_id ||
      !data.checkout.hash
    ){

      throw new Error(
        "Invalid PayHere checkout response."
      );
    }


    /*
      Submit the checkout fields directly to PayHere.
    */
    const form =
      document.createElement("form");

    form.method = "POST";

    form.action =
      "https://www.payhere.lk/pay/checkout";

    form.style.display = "none";


    Object.entries(data.checkout)
      .forEach(([name,value]) => {

        const input =
          document.createElement("input");

        input.type = "hidden";
        input.name = name;
        input.value = value ?? "";

        form.appendChild(input);
      });


    document.body.appendChild(form);

    form.submit();

  }catch(error){

    console.error("Checkout error:",error);

    alert(
      error.message ||
      "Unable to start payment."
    );

    if(button){

      button.disabled = false;
      button.textContent = "Buy Now";
    }
  }
}


/*
  Search/filter events.
*/
searchEl.addEventListener(
  "input",
  renderProducts
);

subjectEl.addEventListener(
  "change",
  renderProducts
);


/*
  IMPORTANT:
  Run authentication and product loading when Shop opens.
*/
(async function init(){

  await checkLogin();

  await loadProducts();

})();
</script>

</body>
</html>
