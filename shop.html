<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163A63">
<title>CreateLK Digital Learning Shop</title>
<meta name="description" content="CreateLK Digital Learning Shop"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#163A63;--blue:#2563EB;--light:#EFF6FF;
--bg:#F7F9FC;--text:#263238;--muted:#6B7785;
--border:#E2E8F0;--white:#fff
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.nav{max-width:1150px;margin:auto;height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;color:var(--navy);font-weight:800;font-size:15px}
.brand img{width:36px;height:36px;object-fit:contain}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 10px;border-radius:7px;font-size:13px;font-weight:700}
.nav-links a:hover,.nav-links .active{background:var(--light);color:var(--blue)}

main{max-width:1150px;margin:auto;padding:30px 16px 55px}
.title{margin-bottom:22px}
.title h1{font-size:29px;color:#172B3A;margin-bottom:5px}
.title p{font-size:14px;color:var(--muted)}

.controls{display:grid;grid-template-columns:1fr 210px;gap:10px;margin-bottom:22px}
input,select{
width:100%;height:44px;border:1px solid var(--border);
border-radius:9px;background:#fff;padding:0 13px;
font-size:14px;outline:none
}
input:focus,select:focus{border-color:var(--blue)}

.results{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{
background:#fff;border:1px solid var(--border);border-radius:12px;
overflow:hidden;display:flex;flex-direction:column;
transition:.2s;box-shadow:0 3px 12px #163a6310
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #163a6318}
.card-image{aspect-ratio:16/10;background:var(--light);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-image img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:21px;font-weight:800;color:var(--navy)}
.body{padding:14px;display:flex;flex-direction:column;flex:1}
.subject{
display:inline-block;align-self:flex-start;background:var(--light);
color:var(--blue);font-size:10px;font-weight:800;
padding:4px 7px;border-radius:5px;margin-bottom:7px
}
.card h2{font-size:16px;line-height:1.35;color:#172B3A;margin-bottom:6px}
.desc{
font-size:12.5px;color:var(--muted);line-height:1.45;
margin-bottom:15px;display:-webkit-box;-webkit-line-clamp:3;
-webkit-box-orient:vertical;overflow:hidden;flex:1
}
.bottom{border-top:1px solid #EEF1F5;padding-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap}
.buy{
border:0;background:var(--blue);color:#fff;border-radius:7px;
padding:10px 13px;font-size:12px;font-weight:800;cursor:pointer
}
.buy:hover{background:#1D4ED8}
.buy:disabled{opacity:.6}

.empty{
display:none;background:#fff;border:1px solid var(--border);
border-radius:12px;text-align:center;padding:45px 20px
}
.empty h2{font-size:18px;color:#172B3A;margin-bottom:5px}
.empty p{font-size:13px;color:var(--muted)}

.message{display:none;margin-bottom:16px;padding:11px 13px;border-radius:8px;font-size:13px;font-weight:700}
.success{display:block!important;background:#ECFDF5;color:#15803D;border:1px solid #BBF7D0}
.error{display:block!important;background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}

footer{background:#102E50;color:#D9E4F0;text-align:center;padding:25px 15px;font-size:12px}
.footer-links{margin-top:9px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}

@media(max-width:650px){
.nav{height:58px;padding:0 12px}
.brand{font-size:12px;max-width:180px}
.brand img{width:33px;height:33px}
.nav-links a{font-size:11px;padding:7px 7px}
main{padding:24px 12px 45px}
.title h1{font-size:25px}
.title p{font-size:13px}
.controls{grid-template-columns:1fr}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.body{padding:10px}
.card h2{font-size:14px}
.desc{font-size:11.5px}
.bottom{display:block}
.price{font-size:15px;margin-bottom:8px}
.buy{width:100%;padding:9px}
}

@media(max-width:380px){
.brand{max-width:145px}
.nav-links a{font-size:10px;padding:6px}
.grid{gap:8px}
}
</style></head><body><header>
<nav class="nav">
<a href="/index.html" class="brand">
<img src="https://assets.createlk.com/file_000000003e448207b8c6a7ecc4a7e1d4.png" alt="CreateLK">
<span>CreateLK Digital Learning Shop</span>
</a>
<div class="nav-links">
<a href="/index.html">Home</a>
<a href="/shop.html" class="active">Shop</a>
<a href="/account.html">Account</a>
</div>
</nav>
</header><main><section class="title">
<h1>Digital Learning Shop</h1>
<p>Quality resources for learning, practice and exam preparation.</p>
</section><div id="message" class="message"></div><div class="controls">
<input id="search" type="search" placeholder="Search learning resources..." autocomplete="off">
<select id="subject">
<option value="">All Subjects</option>
<option>English</option>
<option>Mathematics</option>
<option>Science</option>
<option>ICT</option>
<option>History</option>
<option>Geography</option>
<option>Tamil</option>
<option>Sinhala</option>
<option>Exam Preparation</option>
</select>
</div><div id="results" class="results"></div><section id="products" class="grid"></section><div id="empty" class="empty">
<h2>No learning resources found</h2>
<p>Try another search or subject.</p>
</div></main><footer>
<div>CreateLK Digital Learning Shop</div>
<div class="footer-links">
<a href="/terms.html">Terms</a>
<a href="/privacy.html">Privacy</a>
<a href="/refund.html">Refund</a>
<a href="/contact.html">Contact</a>
</div>
</footer><script>
const API="https://createlk-digital-shop.createlk.workers.dev";
const PAYHERE_API="https://createlk-payhere.createlk.workers.dev";
let products=[];

const $=id=>document.getElementById(id);

function msg(text,type){
$("message").textContent=text;
$("message").className="message "+type;
scrollTo({top:0,behavior:"smooth"});
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[m]));
}

async function load(){
try{
const r=await fetch(API+"/products");
const d=await r.json();
if(!r.ok||!d.success)throw Error(d.error||"Unable to load shop.");
products=Array.isArray(d.products)?d.products:[];
render();
}catch(e){
console.error(e);
msg("Unable to load the shop. Please try again.","error");
}
}

function render(){
const q=$("search").value.trim().toLowerCase();
const s=$("subject").value.toLowerCase();

const list=products.filter(p=>{
const text=(p.title+" "+(p.description||"")+" "+(p.subject||"")).toLowerCase();
return (!q||text.includes(q))&&(!s||(p.subject||"").toLowerCase()===s);
});

$("results").textContent=list.length+" resource"+(list.length===1?"":"s");
$("empty").style.display=list.length?"none":"block";

$("products").innerHTML=list.map(p=>`
<article class="card">
<div class="card-image">
${p.image
?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`
:`<div class="placeholder">CreateLK</div>`}
</div>
<div class="body">
<div class="subject">${esc(p.subject||"Learning")}</div>
<h2>${esc(p.title)}</h2>
<p class="desc">${esc(p.description||"Digital educational resource.")}</p>
<div class="bottom">
<div class="price">LKR ${Number(p.price||0).toLocaleString("en-LK")}</div>
<button class="buy" onclick="buy(${Number(p.id)},this)">Buy Now</button>
</div>
</div>
</article>
`).join("");
}

async function buy(id,button){
const token=localStorage.getItem("createlk_token");

if(!token){
if(confirm("Please login or create an account before purchasing.\n\nGo to login?"))
location.href="/login.html?redirect=/shop.html";
return;
}

button.disabled=true;
button.textContent="Preparing...";

try{
const r=await fetch(PAYHERE_API+"/checkout",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({product_id:id})
});

const d=await r.json();

if(!r.ok||!d.success)throw Error(d.error||"Unable to start payment.");

if(d.already_purchased){
msg("You already purchased this resource. Open your account to access it.","success");
setTimeout(()=>location.href="/account.html",1200);
return;
}

const form=document.createElement("form");
form.method="POST";
form.action=d.action;
form.style.display="none";

Object.entries(d.fields).forEach(([name,value])=>{
const input=document.createElement("input");
input.type="hidden";
input.name=name;
input.value=value??"";
form.appendChild(input);
});

document.body.appendChild(form);
form.submit();

}catch(e){
console.error(e);
msg(e.message||"Payment could not be started.","error");
button.disabled=false;
button.textContent="Buy Now";
}
}

$("search").addEventListener("input",render);
$("subject").addEventListener("change",render);

const params=new URLSearchParams(location.search);
const subject=params.get("subject");
if(subject){
const option=[...$("subject").options].find(
o=>o.value.toLowerCase()===subject.toLowerCase()
);
if(option)$("subject").value=option.value;
}

const payment=params.get("payment");

if(payment==="success"){
msg("Payment submitted successfully. Your purchase will appear in your account after verification.","success");
history.replaceState({}, "", "/shop.html");
}

if(payment==="cancelled"){
msg("Payment cancelled. No payment was completed.","error");
history.replaceState({}, "", "/shop.html");
}

load();
</script></body>
</html>
