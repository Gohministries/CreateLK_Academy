<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Digital Learning Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#222}
header{background:#111827;color:#fff;padding:15px}
nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
nav button{background:none;color:#fff;border:0;cursor:pointer;margin-left:10px}
main{max-width:900px;margin:auto;padding:25px 15px}
.box,.card{background:#fff;padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}
button{padding:10px 15px;border:0;border-radius:7px;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.hidden{display:none!important}
.msg{padding:10px;margin:10px 0;border-radius:7px;background:#dcfce7}
.error{background:#fee2e2;color:#991b1b}
.price{font-size:20px;font-weight:bold;margin:12px 0}
footer{text-align:center;background:#111827;color:#fff;padding:20px;margin-top:30px}
</style>
</head>

<body>

<header>
<nav>
<b>CreateLK</b>
<div>
<button onclick="show('shop')">Shop</button>
<button onclick="account()">Account</button>
<button id="loginBtn" onclick="show('login')">Login</button>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</div>
</nav>
</header>

<main>

<h1>Digital Learning Shop</h1>
<p style="text-align:center">Quality resources for learning, practice and exam preparation.</p>

<div id="msg"></div>

<!-- LOGIN -->
<section id="login" class="box hidden">
<h2>Login</h2>

<input id="le" type="email" placeholder="Email">
<input id="lp" type="password" placeholder="Password">

<button class="primary" onclick="login()">Login</button>

<hr>

<h2>Create Account</h2>

<input id="fn" placeholder="First name">
<input id="ln" placeholder="Last name">
<input id="re" type="email" placeholder="Email">
<input id="ph" placeholder="Phone">
<input id="rp" type="password" placeholder="Password">

<button class="primary" onclick="register()">Create Account</button>
</section>

<!-- SHOP -->
<section id="shop">

<div class="box">
<input id="search" placeholder="Search learning resources..." oninput="render()">

<select id="subject" onchange="render()">
<option value="">All Subjects</option>
</select>
</div>

<div id="count"></div>
<div id="products" class="grid">Loading...</div>

</section>

<!-- ACCOUNT -->
<section id="account" class="box hidden">

<h2>My Account</h2>
<div id="userInfo"></div>

<h2>My Learning Resources</h2>
<div id="purchases">Loading...</div>

</section>

<!-- LESSON -->
<section id="lesson" class="box hidden"></section>

</main>

<footer>CreateLK Digital Learning Shop</footer>

<script>

const API="https://createlk-digital-shop.createlk.workers.dev";
const PAY="https://createlk-payhere.createlk.workers.dev";

let products=[];
let customer=null;

const $=id=>document.getElementById(id);

function token(){
  return localStorage.getItem("createlk_token");
}

function esc(x){
  return String(x??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function message(text,error=false){
  $("msg").innerHTML=
    `<div class="msg ${error?"error":""}">${esc(text)}</div>`;
}

function show(id){
  ["login","shop","account","lesson"].forEach(x=>
    $(x).classList.add("hidden")
  );
  $(id).classList.remove("hidden");
}


/* AUTH CHECK */

async function auth(){

  const t=token();

  if(!t){
    customer=null;
    nav();
    return false;
  }

  try{

    const r=await fetch(API+"/auth/me",{
      headers:{Authorization:"Bearer "+t},
      cache:"no-store"
    });

    const d=await r.json();

    if(!r.ok||!d.success){
      localStorage.removeItem("createlk_token");
      customer=null;
      nav();
      return false;
    }

    customer=d.customer;
    nav();
    return true;

  }catch(e){
    return false;
  }
}

function nav(){
  $("loginBtn").classList.toggle("hidden",!!customer);
  $("logoutBtn").classList.toggle("hidden",!customer);
}

function logout(){
  localStorage.removeItem("createlk_token");
  customer=null;
  nav();
  message("Logged out.");
  show("shop");
}


/* LOGIN */

async function login(){

  try{

    const r=await fetch(API+"/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:$("le").value.trim(),
        password:$("lp").value
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Login failed.");

    localStorage.setItem("createlk_token",d.token);

    customer=d.customer;
    nav();

    message("Login successful.");
    show("shop");

  }catch(e){
    message(e.message,true);
  }
}


/* REGISTER */

async function register(){

  try{

    const r=await fetch(API+"/auth/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        first_name:$("fn").value.trim(),
        last_name:$("ln").value.trim(),
        email:$("re").value.trim(),
        phone:$("ph").value.trim(),
        password:$("rp").value
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Registration failed.");

    localStorage.setItem("createlk_token",d.token);

    customer=d.customer;
    nav();

    message("Account created.");
    show("shop");

  }catch(e){
    message(e.message,true);
  }
}


/* PRODUCTS */

async function loadProducts(){

  try{

    const r=await fetch(API+"/products",{cache:"no-store"});
    const d=await r.json();

    if(!d.success) throw Error(d.error);

    products=d.products||[];

    const subjects=[
      ...new Set(products.map(p=>p.subject).filter(Boolean))
    ];

    subjects.forEach(s=>{
      $("subject").innerHTML+=
        `<option value="${esc(s)}">${esc(s)}</option>`;
    });

    render();

  }catch(e){

    $("products").innerHTML="Unable to load resources.";
  }
}

function render(){

  const q=$("search").value.trim().toLowerCase();
  const s=$("subject").value.toLowerCase();

  const list=products.filter(p=>
    (!q ||
      String(p.title).toLowerCase().includes(q) ||
      String(p.description||"").toLowerCase().includes(q)
    ) &&
    (!s ||
      String(p.subject||"").toLowerCase()===s
    )
  );

  $("count").textContent=
    `${list.length} resource${list.length===1?"":"s"}`;

  $("products").innerHTML=list.length
    ?list.map(p=>`

      <div class="card">

        <small>CreateLK • ${esc(p.subject||"Learning")}</small>

        <h3>${esc(p.title)}</h3>

        <p>${esc(p.description||"")}</p>

        <div class="price">
          LKR ${Number(p.price||0).toFixed(0)}
        </div>

        <button
          class="primary"
          style="width:100%"
          onclick="buy(${Number(p.id)},this)"
        >
          Buy Now
        </button>

      </div>

    `).join("")
    :"No resources found.";
}


/* BUY */

async function buy(id,button){

  const t=token();

  if(!t){
    show("login");
    message("Please login first.",true);
    return;
  }

  button.disabled=true;
  button.textContent="Preparing payment...";

  try{

    const r=await fetch(PAY+"/checkout",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+t
      },
      body:JSON.stringify({
        product_id:Number(id)
      })
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Unable to start payment.");

    const form=document.createElement("form");

    form.method="POST";
    form.action="https://www.payhere.lk/pay/checkout";

    Object.entries(d.checkout).forEach(([k,v])=>{
      const input=document.createElement("input");
      input.type="hidden";
      input.name=k;
      input.value=v??"";
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

  }catch(e){

    button.disabled=false;
    button.textContent="Buy Now";
    message(e.message,true);
  }
}


/* ACCOUNT */

async function account(){

  show("account");

  if(!await auth()){

    $("userInfo").innerHTML=
      `Please login.<br><br>
       <button class="primary" onclick="show('login')">
       Login
       </button>`;

    $("purchases").innerHTML="";
    return;
  }

  $("userInfo").innerHTML=`
    <p><b>Name:</b>
    ${esc(customer.first_name)} ${esc(customer.last_name)}</p>

    <p><b>Email:</b> ${esc(customer.email)}</p>

    <p><b>Phone:</b> ${esc(customer.phone||"-")}</p>
  `;

  loadPurchases();
}


/* PURCHASES */

async function loadPurchases(){

  try{

    const r=await fetch(API+"/my-purchases",{
      headers:{Authorization:"Bearer "+token()},
      cache:"no-store"
    });

    const d=await r.json();

    if(!d.success) throw Error(d.error);

    const list=d.purchases||[];

    $("purchases").innerHTML=list.length
      ?list.map(p=>`

        <div class="box">

          <b>${esc(p.title)}</b>

          <p>LKR ${Number(p.amount||0).toFixed(2)}</p>

          <p>Status: ${esc(p.status)}</p>

          ${
            p.status==="PAID"
            ?`
              <button
                class="primary"
                onclick="lesson(${Number(p.product_id)})">
                Open Lesson
              </button>
            `
            :""
          }

        </div>

      `).join("")
      :"No purchases yet.";

  }catch(e){

    $("purchases").innerHTML="Unable to load purchases.";
  }
}


/* LESSON */

async function lesson(id){

  if(!await auth()){
    show("login");
    return;
  }

  show("lesson");
  $("lesson").innerHTML="Loading lesson...";

  try{

    const r=await fetch(API+"/content/"+Number(id),{
      headers:{Authorization:"Bearer "+token()},
      cache:"no-store"
    });

    const d=await r.json();

    if(!r.ok||!d.success)
      throw Error(d.error||"Unable to open lesson.");

    const p=d.product;

    $("lesson").innerHTML=`

      <h2>${esc(p.title)}</h2>

      <p><b>${esc(p.subject||"")}</b></p>

      <div class="lesson">
        ${p.content||"Lesson content unavailable."}
      </div>

      <br>

      <button onclick="account()">Back to Account</button>

    `;

  }catch(e){

    $("lesson").innerHTML=`
      <p>${esc(e.message)}</p>
      <button onclick="account()">Back</button>
    `;
  }
}


/* START */

(async()=>{
  await auth();
  await loadProducts();
  show("shop");
})();

</script>

</body>
</html>
