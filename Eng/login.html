<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Drive Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f5f7fb;color:#222;min-height:100vh;display:grid;place-items:center}
.box{width:min(380px,92%);background:#fff;padding:30px;border-radius:16px;box-shadow:0 15px 50px #0002;text-align:center}
.logo{width:58px;height:58px;margin:auto auto 15px;background:#102a56;color:#fff;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:bold}
h2{color:#102a56;margin:8px}
p{color:#707784}
input{width:100%;padding:12px;border:1px solid #e1e5eb;border-radius:8px;outline:0;margin:8px 0}
button{width:100%;padding:12px;border-radius:8px;cursor:pointer;font:inherit}
.login{border:0;background:#102a56;color:#fff;margin-top:5px}
.google{margin-top:12px;background:#fff;border:1px solid #dadce0;color:#3c4043;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500}
.google svg{width:19px;height:19px}
.or{color:#999;font-size:11px;margin:15px 0}
.error{color:#c62828;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<div class="box">
<div class="logo">D</div>
<h2>CreateLK Drive</h2>
<p>Secure Admin File Manager</p>

<button class="google" onclick="googleLogin()">
<svg viewBox="0 0 24 24">
<path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.96h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.24z"/>
<path fill="#34A853" d="M12 21.73c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.52A9.74 9.74 0 0 0 12 21.73z"/>
<path fill="#FBBC05" d="M6.53 13.82A5.85 5.85 0 0 1 6.22 12c0-.63.11-1.24.31-1.82V7.66H3.29A9.74 9.74 0 0 0 2.27 12c0 1.57.38 3.06 1.02 4.34l3.24-2.52z"/>
<path fill="#EA4335" d="M12 6.15c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.23 14.63 2.27 12 2.27a9.74 9.74 0 0 0-8.71 5.39l3.24 2.52C7.3 7.87 9.46 6.15 12 6.15z"/>
</svg>
Sign in with Google
</button>

<div class="or">OR</div>

<input id="password" type="password" placeholder="Admin password">
<button class="login" onclick="login()">Login</button>
<div id="error" class="error"></div>
</div>

<script>
const API="https://drive.createlk.workers.dev";

async function login(){
 const p=document.getElementById("password").value.trim();
 if(!p)return error("Enter password.");
 try{
  const r=await fetch(API+"/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});
  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.error||"Login failed");
  localStorage.setItem("drive_token",d.token);
  location.href="/drive.html";
 }catch(e){error(e.message)}
}

function googleLogin(){
 location.href=API+"/auth/google";
}

function error(x){
 document.getElementById("error").textContent=x;
}

document.getElementById("password").onkeydown=e=>{
 if(e.key==="Enter")login();
};
</script>

</body>
</html>
