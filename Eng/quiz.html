<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">

<title>CreateLK Academy</title>

<style>

:root{
--navy:#102a56;
--gold:#d69b16;
--gold2:#f4c64e;
--bg:#f4f7fb;
--text:#172033;
--muted:#687386;
--white:#fff;
--green:#15965a;
--red:#d9363e;
--border:#e3e8f0;

--c1:#3867d6;
--c2:#20bf6b;
--c3:#fa8231;
--c4:#8854d0;
--c5:#eb3b5a;
--c6:#0fb9b1;
--c7:#4b7bec;
--c8:#a55eea;
}

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text)
}

button,
a{
font:inherit
}

button{
cursor:pointer
}

a{
text-decoration:none
}


/* =========================
   HEADER
========================= */

header{
background:var(--navy);
color:white;
padding:12px 16px;
box-shadow:0 2px 10px #0002
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}


/* LOGO + ACADEMY */

.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.logo{
width:44px;
height:44px;
object-fit:contain;
background:white;
border-radius:8px;
padding:3px
}

.brand-text{
min-width:0
}

.brand-name{
font-size:16px;
font-weight:bold;
white-space:nowrap
}

.brand-sub{
font-size:11px;
color:#dbe4f4;
margin-top:3px;
white-space:nowrap
}


/* NAVIGATION */

.nav{
display:flex;
align-items:center;
gap:6px
}

.nav a,
.nav button{
color:white;
background:transparent;
border:1px solid #ffffff35;
border-radius:7px;
padding:8px 11px;
font-size:13px;
transition:.2s
}

.nav a:hover,
.nav button:hover{
background:#ffffff18;
border-color:#ffffff70
}

.nav .premium{
background:var(--gold);
border-color:var(--gold);
color:#111;
font-weight:bold
}


/* =========================
   MAIN
========================= */

main{
max-width:1000px;
margin:auto;
padding:30px 14px 45px
}

.hero{
text-align:center;
margin-bottom:20px
}

.hero h1{
margin:0;
font-size:29px;
color:var(--navy)
}

.hero p{
margin:8px 0 0;
font-size:14px;
color:var(--muted)
}


/* =========================
   ACCOUNT / PREMIUM STATUS
========================= */

.status{
max-width:650px;
margin:0 auto 27px;
background:white;
border-radius:12px;
padding:14px 18px;
text-align:center;
border:2px solid var(--gold);
box-shadow:0 3px 12px #00000008
}

.status.active{
border-color:var(--green)
}

.status-title{
font-weight:bold;
font-size:15px;
color:var(--navy)
}

.status.active .status-title{
color:var(--green)
}

.status-text{
font-size:12px;
color:var(--muted);
margin-top:4px
}


/* =========================
   LESSON AREA
========================= */

.section-title{
text-align:center;
margin:0 0 16px;
color:var(--navy);
font-size:21px
}

.lessons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px
}


/* =========================
   COLORFUL LESSON BUTTONS
========================= */

.lesson{
border:0;
border-radius:13px;
padding:17px 18px;
min-height:72px;
display:flex;
align-items:center;
gap:13px;
text-align:left;
color:white;
font-weight:bold;
box-shadow:0 4px 10px #0002;
transition:
transform .15s,
box-shadow .15s
}

.lesson:hover{
transform:translateY(-2px);
box-shadow:0 7px 16px #0003
}

.lesson:active{
transform:translateY(0)
}

.lesson-number{
width:38px;
height:38px;
flex:0 0 38px;
border-radius:10px;
background:#ffffff25;
border:1px solid #ffffff45;
display:grid;
place-items:center;
font-size:14px
}

.lesson-name{
font-size:15px;
line-height:1.3
}


/* COLOR ROTATION */

.lesson:nth-child(8n+1){
background:var(--c1)
}

.lesson:nth-child(8n+2){
background:var(--c2)
}

.lesson:nth-child(8n+3){
background:var(--c3)
}

.lesson:nth-child(8n+4){
background:var(--c4)
}

.lesson:nth-child(8n+5){
background:var(--c5)
}

.lesson:nth-child(8n+6){
background:var(--c6)
}

.lesson:nth-child(8n+7){
background:var(--c7)
}

.lesson:nth-child(8n+8){
background:var(--c8)
}


/* =========================
   LOADING / ERROR
========================= */

.loading,
.error{
background:white;
border:1px solid var(--border);
border-radius:11px;
padding:20px;
text-align:center;
color:var(--muted);
grid-column:1/-1
}

.error{
color:var(--red)
}


/* =========================
   FOOTER
========================= */

footer{
text-align:center;
font-size:12px;
color:var(--muted);
padding:20px
}


/* =========================
   QUIZ MODAL
========================= */

.modal{
display:none;
position:fixed;
inset:0;
z-index:20;
background:#0009;
padding:12px;
overflow:auto
}

.modal.show{
display:flex;
align-items:center;
justify-content:center
}

.box{
position:relative;
background:white;
width:min(700px,100%);
max-height:94vh;
overflow:auto;
border-radius:14px;
padding:20px
}

.close{
position:absolute;
right:10px;
top:10px;
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#edf0f4;
font-size:22px;
color:#333
}

.quiz-title{
margin:0 45px 4px 0;
color:var(--navy);
font-size:21px
}

.quiz-sub{
font-size:12px;
color:var(--muted);
margin-bottom:18px
}

.qnum{
font-size:12px;
font-weight:bold;
color:var(--gold);
margin-bottom:8px
}

.question{
font-size:18px;
font-weight:bold;
line-height:1.5;
margin-bottom:15px
}

.options{
display:grid;
gap:9px
}

.option{
width:100%;
padding:12px;
text-align:left;
background:white;
border:1px solid var(--border);
border-radius:9px;
color:var(--text)
}

.option:hover:not(:disabled){
border-color:var(--navy);
background:#f5f7fb
}

.option.correct{
background:#edf9f2;
border-color:var(--green)
}

.option.wrong{
background:#fff0f1;
border-color:var(--red)
}

.option:disabled{
cursor:default
}

.feedback{
display:none;
margin-top:13px;
padding:12px;
border-radius:9px;
font-size:13px;
line-height:1.5
}

.feedback.show{
display:block
}

.feedback.ok{
background:#edf9f2;
color:#126b43
}

.feedback.bad{
background:#fff0f1;
color:#a82028
}

.progress{
height:6px;
background:#e9edf3;
border-radius:10px;
overflow:hidden;
margin:15px 0
}

.bar{
height:100%;
width:0;
background:var(--gold)
}

.next,
.retry{
width:100%;
border:0;
border-radius:9px;
padding:11px;
background:var(--navy);
color:white;
font-weight:bold
}

.next:disabled{
opacity:.45;
cursor:not-allowed
}

.score{
text-align:center;
padding:20px
}

.score strong{
display:block;
font-size:36px;
color:var(--navy);
margin:9px
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

header{
padding:10px 12px
}

.header{
gap:10px
}

.brand-sub{
display:none
}

.brand-name{
font-size:14px
}

.logo{
width:40px;
height:40px
}

.nav{
gap:4px
}

.nav a,
.nav button{
padding:7px 8px;
font-size:12px
}

main{
padding-top:25px
}

.hero h1{
font-size:24px
}

.hero p{
font-size:13px;
line-height:1.4
}

.lessons{
grid-template-columns:1fr;
gap:10px
}

.lesson{
min-height:68px;
padding:15px
}

.lesson-name{
font-size:14px
}

.box{
padding:17px
}

.question{
font-size:17px
}

}


/* VERY SMALL SCREENS */

@media(max-width:390px){

.nav a,
.nav button{
padding:7px 6px;
font-size:11px
}

.brand-name{
font-size:13px
}

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header">


<!-- LEFT: LOGO + ACADEMY -->

<a href="/Eng/quiz.html" class="brand">

<img
class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

<div class="brand-text">

<div class="brand-name">
CreateLK Academy
</div>

<div class="brand-sub">
Speak English With Confidence
</div>

</div>

</a>


<!-- RIGHT: PROFESSIONAL MENU -->

<nav class="nav">

<a href="/">
Home
</a>

<a href="/Eng/free.html">
Free
</a>

<a href="/Eng/quiz.html" class="premium">
Premium
</a>

<button id="logout">
Logout
</button>

</nav>


</div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


<section class="hero">

<h1>
Speak English With Confidence
</h1>

<p>
20 premium lessons · 50 MCQs per lesson · 1,000 MCQs
</p>

</section>


<!-- PREMIUM STATUS -->

<div id="status" class="status">

<div id="statusTitle" class="status-title">
Checking Premium Status...
</div>

<div id="statusText" class="status-text">
Please wait...
</div>

</div>


<!-- LESSONS -->

<h2 class="section-title">
Premium Lessons
</h2>

<div id="lessons" class="lessons">

<div class="loading">
Loading lessons...
</div>

</div>


</main>


<footer>
© CreateLK Academy
</footer>


<!-- =========================
     QUIZ MODAL
========================= -->

<div id="quizModal" class="modal">

<div class="box">

<button
class="close"
id="quizClose"
aria-label="Close quiz">
×
</button>

<h2
id="quizTitle"
class="quiz-title">
Lesson
</h2>

<div
id="quizSub"
class="quiz-sub">
50 spoken-English MCQs
</div>

<div id="quiz"></div>

</div>

</div>


<script>

const API=
"https://eng-login.createlk.workers.dev";

const PAYMENT=
"https://eng-payment.createlk.workers.dev/";


let questions=[];
let current=0;
let score=0;
let answered=false;
let premiumActive=false;


/* =========================
   API
========================= */

async function api(path){

const response=
await fetch(API+path,{
method:"GET",
credentials:"include",
headers:{
Accept:"application/json"
}
});

let data={};

try{
data=await response.json();
}catch{}

if(!response.ok){

const error=
new Error(
data.error||
"Request failed"
);

error.status=
response.status;

throw error;
}

return data;
}


/* =========================
   ACCOUNT
========================= */

async function account(){

try{

const data=
await api("/api/me");

if(!data.user){

location.href=
"/Eng/login.html";

return;
}

premiumActive=
data.subscription?.active===true;

const status=
document.getElementById("status");

const title=
document.getElementById("statusTitle");

const text=
document.getElementById("statusText");


if(premiumActive){

status.className=
"status active";

title.textContent=
"Premium Active";

text.textContent=
"Your premium access is active. All 20 lessons are available.";

}else{

status.className=
"status";

title.textContent=
"Premium Not Activated";

text.textContent=
"Activate Premium to access all 20 lessons and 1,000 MCQs.";

}

}catch(error){

document.getElementById("statusTitle")
.textContent=
"Unable to check Premium status";

document.getElementById("statusText")
.textContent=
"Please refresh the page and try again.";

}

}


/* =========================
   LOAD 20 LESSONS
========================= */

async function loadLessons(){

const container=
document.getElementById("lessons");

try{

const data=
await api("/api/titles");

const list=
Array.isArray(data)
?data
:(data.lessons||[]);


if(!list.length){

container.innerHTML=
'<div class="loading">No lessons available.</div>';

return;
}


container.innerHTML="";


list.slice(0,20).forEach((lesson,index)=>{

const id=
Number(
lesson.id ??
lesson.lesson_id ??
index+1
);

const title=
lesson.title ||
`Lesson ${index+1}`;


const button=
document.createElement("button");

button.type="button";

button.className="lesson";


button.innerHTML=`

<span class="lesson-number">
${index+1}
</span>

<span class="lesson-name">
${esc(title)}
</span>

`;


button.onclick=()=>{
openLesson(id,title);
};


container.appendChild(button);

});


}catch(error){

if(error.status===401){

location.href=
"/Eng/login.html";

return;
}


container.innerHTML=
'<div class="error">Unable to load lessons. Please refresh and try again.</div>';

}

}


/* =========================
   OPEN LESSON
========================= */

async function openLesson(id,title){

/*
Premium is checked locally first.
If inactive, send directly to PayHere.
*/

if(!premiumActive){

location.href=
PAYMENT;

return;
}


try{

const data=
await api(
"/api/questions?lesson="+
encodeURIComponent(id)
);


questions=
Array.isArray(data)
?data
:(data.questions||[]);


if(!questions.length){

alert(
"No questions are available for this lesson yet."
);

return;
}


current=0;
score=0;


document.getElementById("quizTitle")
.textContent=
title;


document.getElementById("quizSub")
.textContent=
questions.length+
" spoken-English MCQs";


document.getElementById("quizModal")
.classList.add("show");


render();


}catch(error){

if(error.status===401){

location.href=
"/Eng/login.html";

return;
}


if(error.status===403){

location.href=
PAYMENT;

return;
}


alert(
"Unable to load this lesson."
);

}

}


/* =========================
   RENDER QUESTION
========================= */

function render(){

const question=
questions[current];

answered=false;


const options=
question.options ||
[
question.option_a,
question.option_b,
question.option_c,
question.option_d
];


document.getElementById("quiz")
.innerHTML=`

<div class="qnum">
Question ${current+1} of ${questions.length}
</div>

<div class="question">
${esc(question.question)}
</div>

<div class="options">

${options.map((option,index)=>`

<button
type="button"
class="option"
data-i="${index}">

${esc(option)}

</button>

`).join("")}

</div>


<div
id="feedback"
class="feedback">
</div>


<div class="progress">

<div
id="bar"
class="bar">
</div>

</div>


<button
type="button"
id="next"
class="next"
disabled>

${
current===questions.length-1
?"Finish Quiz"
:"Next Question"
}

</button>

`;


document
.querySelectorAll(".option")
.forEach(button=>{

button.onclick=()=>{
answer(
Number(button.dataset.i)
);
};

});


document.getElementById("next")
.onclick=next;


document.getElementById("bar")
.style.width=
(
current/
questions.length*
100
)+"%";

}


/* =========================
   ANSWER
========================= */

function answer(selected){

if(answered)
return;


answered=true;


const question=
questions[current];

const correct=
Number(question.answer);


const buttons=
document.querySelectorAll(".option");


buttons.forEach((button,index)=>{

button.disabled=true;


if(index===correct)
button.classList.add("correct");


if(
index===selected &&
index!==correct
)
button.classList.add("wrong");

});


const feedback=
document.getElementById("feedback");


feedback.innerHTML=
(
selected===correct
?"✓ Correct"
:"✗ Not quite"
)+
"<br>"+
esc(
question.explanation||
"Review the answer carefully."
);


feedback.className=
"feedback show "+
(
selected===correct
?"ok"
:"bad"
);


if(selected===correct)
score++;


document.getElementById("next")
.disabled=false;

}


/* =========================
   NEXT
========================= */

function next(){

if(!answered)
return;


current++;


if(current>=questions.length){

finish();

return;
}


render();

}


/* =========================
   FINISH
========================= */

function finish(){

const percent=
Math.round(
score/
questions.length*
100
);


document.getElementById("quiz")
.innerHTML=`

<div class="score">

<div>
Lesson Complete
</div>

<strong>
${score} / ${questions.length}
</strong>

<div>
Score: ${percent}%
</div>

</div>


<button
type="button"
class="retry"
id="retry">

Try Again

</button>

`;


document.getElementById("retry")
.onclick=()=>{

current=0;
score=0;

render();

};

}


/* =========================
   CLOSE QUIZ
========================= */

document.getElementById("quizClose")
.onclick=()=>{

document
.getElementById("quizModal")
.classList.remove("show");

};


/* CLOSE WHEN CLICKING OUTSIDE */

document.getElementById("quizModal")
.addEventListener("click",(event)=>{

if(event.target===event.currentTarget){

event.currentTarget
.classList.remove("show");

}

});


/* =========================
   LOGOUT
========================= */

document.getElementById("logout")
.onclick=async()=>{

try{

await api("/auth/logout");

}catch{}

location.href=
"/Eng/login.html";

};


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

account();
loadLessons();

</script>

</body>
</html>
