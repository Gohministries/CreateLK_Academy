<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<meta name="description" content="Speak English With Confidence - CreateLK Academy">
<title>English Quiz | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

:root{
--navy:#102a56;
--gold:#d69b16;
--bg:#f5f7fb;
--text:#172033;
--muted:#687386;
--white:#fff;
--green:#15965a;
--red:#d9363e;
--border:#e5e9f0;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

button{
font:inherit;
}

.top{
background:#fff;
border-bottom:1px solid var(--border);
padding:14px 16px;
}

.top-inner{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.brand{
display:flex;
align-items:center;
gap:9px;
font-size:18px;
font-weight:700;
color:var(--navy);
}

.brand img{
width:38px;
height:38px;
object-fit:contain;
}

.top-buttons{
display:flex;
gap:8px;
}

.top-btn{
border:0;
border-radius:9px;
padding:10px 14px;
font-weight:700;
cursor:pointer;
}

.back-btn{
background:#edf1f7;
color:var(--navy);
}

.logout-btn{
background:var(--navy);
color:#fff;
}

main{
max-width:900px;
margin:auto;
padding:22px 14px 45px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(16,42,86,.08);
}

/* ACCOUNT */

.account{
display:flex;
align-items:center;
gap:13px;
}

.account img{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
background:#edf1f7;
}

.account-name{
font-size:17px;
font-weight:700;
color:var(--navy);
}

.account-email{
font-size:13px;
color:var(--muted);
margin-top:4px;
}

/* LESSON */

.lesson-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.level{
font-size:13px;
font-weight:700;
color:var(--gold);
text-transform:uppercase;
}

h1{
margin:5px 0 0;
font-size:27px;
color:var(--navy);
}

.progress-box{
width:230px;
}

.progress-text{
display:flex;
justify-content:space-between;
font-size:13px;
color:var(--muted);
margin-bottom:6px;
}

.progress{
height:8px;
background:#e9edf3;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0;
background:var(--gold);
transition:.3s;
}

/* QUIZ */

.question-no{
font-size:14px;
font-weight:700;
color:var(--gold);
margin-bottom:12px;
}

.question{
font-size:22px;
line-height:1.45;
font-weight:700;
color:var(--navy);
margin-bottom:20px;
}

.options{
display:grid;
gap:11px;
}

.option{
width:100%;
padding:14px 15px;
text-align:left;
border:2px solid var(--border);
border-radius:11px;
background:#fff;
color:var(--text);
cursor:pointer;
transition:.15s;
}

.option:hover{
border-color:var(--gold);
background:#fffaf0;
}

.option:disabled{
cursor:default;
}

.option.correct{
border-color:var(--green);
background:#eaf8f1;
}

.option.wrong{
border-color:var(--red);
background:#fff0f1;
}

.letter{
display:inline-flex;
width:30px;
height:30px;
align-items:center;
justify-content:center;
border-radius:50%;
background:#edf1f7;
color:var(--navy);
font-weight:700;
margin-right:9px;
}

.correct .letter{
background:var(--green);
color:#fff;
}

.wrong .letter{
background:var(--red);
color:#fff;
}

.feedback{
display:none;
margin-top:16px;
padding:14px;
border-radius:10px;
line-height:1.5;
}

.feedback.show{
display:block;
}

.feedback.ok{
background:#eaf8f1;
color:#126d43;
}

.feedback.no{
background:#fff0f1;
color:#a5222b;
}

.controls{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:23px;
}

.btn{
border:0;
border-radius:9px;
padding:12px 18px;
font-weight:700;
cursor:pointer;
}

.previous{
background:#edf1f7;
color:var(--navy);
}

.next{
background:var(--navy);
color:#fff;
}

.btn:disabled{
opacity:.45;
cursor:not-allowed;
}

/* LOADING */

.loading{
text-align:center;
padding:45px 10px;
color:var(--muted);
}

.spinner{
width:28px;
height:28px;
border:3px solid #e3e7ed;
border-top-color:var(--gold);
border-radius:50%;
animation:spin .8s linear infinite;
margin:0 auto 12px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* ERROR */

.error{
display:none;
text-align:center;
padding:30px 10px;
}

.error.show{
display:block;
}

.error h2{
color:var(--navy);
margin-top:0;
}

.error p{
color:var(--muted);
line-height:1.5;
}

.error-btn{
background:var(--navy);
color:#fff;
}

/* RESULT */

.result{
display:none;
text-align:center;
}

.result.show{
display:block;
}

.result-icon{
font-size:44px;
}

.result h2{
color:var(--navy);
}

.score{
font-size:42px;
font-weight:800;
color:var(--gold);
}

.result-text{
color:var(--muted);
}

.result-actions{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

footer{
background:var(--navy);
color:#dbe4f2;
text-align:center;
padding:25px 15px;
font-size:13px;
}

footer strong{
color:#f4c64e;
}

/* MOBILE */

@media(max-width:650px){

.top-inner{
align-items:center;
}

.brand span{
font-size:16px;
}

.brand img{
width:34px;
height:34px;
}

.top-btn{
padding:9px 11px;
font-size:13px;
}

.lesson-top{
display:block;
}

.progress-box{
width:100%;
margin-top:18px;
}

.card{
padding:18px;
}

h1{
font-size:23px;
}

.question{
font-size:19px;
}

.controls .btn{
padding:11px 14px;
}

}
</style>
</head>

<body>

<header class="top">

<div class="top-inner">

<div class="brand">
<img
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">
<span>CreateLK Academy</span>
</div>

<div class="top-buttons">

<button
class="top-btn back-btn"
onclick="location.href='/index.html'">
← Back
</button>

<button
class="top-btn logout-btn"
id="logoutBtn"
style="display:none">
Logout
</button>

</div>

</div>

</header>


<main>

<!-- GOOGLE ACCOUNT -->

<div
class="card"
id="accountCard"
style="display:none">

<div class="account">

<img
id="userPhoto"
src=""
alt="Google Profile">

<div>

<div
class="account-name"
id="userName">
</div>

<div
class="account-email"
id="userEmail">
</div>

</div>

</div>

</div>


<!-- LESSON INFORMATION -->

<div class="card">

<div class="lesson-top">

<div>

<div
class="level"
id="level">
Level
</div>

<h1 id="title">
Loading...
</h1>

</div>

<div class="progress-box">

<div class="progress-text">

<span>Progress</span>

<span id="progressText">
0 / 0
</span>

</div>

<div class="progress">

<div
class="bar"
id="bar">
</div>

</div>

</div>

</div>

</div>


<!-- QUIZ -->

<div class="card">

<div
class="loading"
id="loading">

<div class="spinner"></div>

Loading lesson...

</div>


<div
class="error"
id="error">

<h2>
Unable to load quiz
</h2>

<p id="errorText">
Please try again.
</p>

<button
class="btn error-btn"
id="errorBtn">
Try Again
</button>

</div>


<div
id="quiz"
style="display:none">

<div
class="question-no"
id="number">
</div>

<div
class="question"
id="question">
</div>

<div
class="options"
id="options">
</div>

<div
class="feedback"
id="feedback">

<strong id="feedbackTitle">
</strong>

<div id="explanation">
</div>

</div>

<div class="controls">

<button
class="btn previous"
id="prev">
← Previous
</button>

<button
class="btn next"
id="next"
disabled>
Next →
</button>

</div>

</div>


<!-- RESULT -->

<div
class="result"
id="result">

<div class="result-icon">
🎉
</div>

<h2>
Lesson Complete!
</h2>

<div
class="score"
id="score">
0%
</div>

<p
class="result-text"
id="scoreText">
</p>

<div class="result-actions">

<button
class="btn previous"
onclick="restart()">
🔄 Try Again
</button>

<button
class="btn next"
onclick="location.href='/index.html'">
← Back Home
</button>

</div>

</div>

</div>

</main>


<footer>

<strong>CreateLK Academy</strong>

<br><br>

Speak English With Confidence

<br><br>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

const API="https://eng-login.createlk.workers.dev";

const params=new URLSearchParams(location.search);

const lessonId=Math.max(
1,
parseInt(params.get("lesson"))||1
);

let questions=[];
let current=0;
let score=0;
let answered=false;


/* SELECTOR */

const $=id=>document.getElementById(id);


/* API */

async function api(path){

let response;

try{

response=await fetch(API+path,{
method:"GET",
credentials:"include",
headers:{
"Accept":"application/json"
}
});

}catch(error){

throw new Error(
"Could not connect to the learning server. Please check your internet connection or Cloudflare Worker."
);

}

let data={};

try{
data=await response.json();
}catch(e){}

if(!response.ok){

if(response.status===401){
data.requiresLogin=true;
}

throw Object.assign(
new Error(
data.error||
"Unable to load data."
),
{data}
);

}

return data;

}


/* GOOGLE USER */

async function loadUser(){

try{

const data=await api("/api/me");

if(data.loggedIn&&data.user){

const user=data.user;

$("accountCard").style.display="block";

$("logoutBtn").style.display="block";

$("userName").textContent=
user.name||"Google User";

$("userEmail").textContent=
user.email||"";

if(user.photo_url){

$("userPhoto").src=user.photo_url;

}

return true;

}

return false;

}catch(error){

console.log(
"Login check:",
error.message
);

return false;

}


/* LOGOUT */

$("logoutBtn").onclick=async()=>{

$("logoutBtn").disabled=true;

try{

await fetch(
API+"/auth/logout",
{
method:"GET",
credentials:"include"
}
);

}catch(e){}

location.href="/index.html";

};


/* LOAD LESSON */

async function load(){

$("loading").style.display="block";
$("error").classList.remove("show");
$("quiz").style.display="none";

try{

/*
Load lesson titles
*/

const titleData=
await api("/api/titles");

const lessons=
titleData.lessons||
titleData.titles||
[];

const lesson=
lessons.find(
x=>Number(x.id)===lessonId
);

$("level").textContent=
"Level "+lessonId;

$("title").textContent=
lesson?.title||
"English Lesson";


/*
Load questions
*/

const data=
await api(
"/api/questions?lesson="+lessonId
);

questions=
data.questions||
data||
[];

if(
!Array.isArray(questions)||
questions.length===0
){

throw new Error(
"No questions were found for this lesson."
);

}


/*
Show quiz
*/

$("loading").style.display="none";
$("quiz").style.display="block";

render();

}catch(error){

console.error(error);

$("loading").style.display="none";
$("error").classList.add("show");


if(error.data?.requiresLogin){

$("errorText").textContent=
"Please sign in with Google to continue this lesson.";

$("errorBtn").textContent=
"🔐 Sign in with Google";

$("errorBtn").onclick=()=>{

location.href=
"/Eng/login.html?return="+
encodeURIComponent(
"/Eng/quiz.html?lesson="+lessonId
);

};

}else{

$("errorText").textContent=
error.message||
"Unable to connect to the learning server.";

$("errorBtn").textContent=
"↻ Try Again";

$("errorBtn").onclick=load;

}

}


/* ANSWER VALUE */

function answerValue(value){

if(typeof value==="number"){
return value;
}

value=
String(value)
.trim()
.toUpperCase();

if(
"ABCD".includes(value)
){
return "ABCD".indexOf(value);
}

const n=parseInt(value);

if(n>=1&&n<=4){
return n-1;
}

if(n>=0&&n<=3){
return n;
}

return -1;

}


/* OPTIONS */

function getOptions(q){

if(Array.isArray(q.options)){

return q.options.map(
x=>
typeof x==="string"
?x
:x.label||
x.text||
x.value||
""
);

}

return[
q.option_a||"",
q.option_b||"",
q.option_c||"",
q.option_d||""
];

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* RENDER */

function render(){

const q=questions[current];

answered=false;

$("number").textContent=
`Question ${current+1} of ${questions.length}`;

$("question").textContent=
q.question||"";

$("options").innerHTML="";

getOptions(q).forEach(
(text,i)=>{

const button=
document.createElement("button");

button.type="button";

button.className="option";

button.innerHTML=
`<span class="letter">${
"ABCD"[i]
}</span>${escapeHtml(text)}`;

button.onclick=()=>{
selectAnswer(
i,
button,
q
);
};

$("options").appendChild(button);

});


$("feedback").className="feedback";

$("feedbackTitle").textContent="";

$("explanation").textContent="";

$("prev").disabled=
current===0;

$("next").disabled=true;

updateProgress();

}


/* SELECT ANSWER */

function selectAnswer(
selected,
button,
q
){

if(answered){
return;
}

answered=true;

const correct=
answerValue(q.answer);

const buttons=
[
...document.querySelectorAll(".option")
];

buttons.forEach(
b=>b.disabled=true
);


if(selected===correct){

score++;

button.classList.add(
"correct"
);

$("feedback").className=
"feedback show ok";

$("feedbackTitle").textContent=
"✓ Correct!";

}else{

button.classList.add(
"wrong"
);

if(buttons[correct]){
buttons[correct].classList.add(
"correct"
);
}

$("feedback").className=
"feedback show no";

$("feedbackTitle").textContent=
"✗ Not quite";

}

$("explanation").textContent=
q.explanation||
"Review the correct answer and try again.";

$("next").disabled=false;

}


/* NEXT */

$("next").onclick=()=>{

if(!answered){
return;
}

if(
current<
questions.length-1
){

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}else{

showResult();

}

};


/* PREVIOUS */

$("prev").onclick=()=>{

if(current>0){

current--;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

};


/* PROGRESS */

function updateProgress(){

const total=
questions.length;

$("progressText").textContent=
`${current+1} / ${total}`;

$("bar").style.width=
`${((current+1)/total)*100}%`;

}


/* RESULT */

function showResult(){

$("quiz").style.display="none";

$("result").classList.add(
"show"
);

const percent=
Math.round(
score/questions.length*100
);

$("score").textContent=
percent+"%";

$("scoreText").textContent=
`You answered ${score} out of ${questions.length} correctly.`;

}


/* RESTART */

function restart(){

current=0;

score=0;

$("result").classList.remove(
"show"
);

$("quiz").style.display="block";

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* START */

(async()=>{

/*
Premium lessons:
Load Google account details.

Free lessons:
No login required.
*/

if(lessonId>2){

await loadUser();

}

await load();

})();

</script>

</body>
</html>
