<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK English</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;color:#171923;background:linear-gradient(135deg,#f5f8ff,#fffdf7,#f1f5fb)}
button,input{font:inherit}button{border:0;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid #e3e8f0}
nav,main{max-width:1000px;margin:auto}
nav{padding:9px 15px;display:flex;align-items:center;gap:8px}
.logo{font-size:20px;font-weight:900;margin-right:auto;color:#102a56}
.logo span{color:#d69b16}
.right{display:flex;align-items:center;gap:7px}
.btn{height:40px;padding:0 14px;border-radius:9px;background:#102a56;color:#fff;font-weight:800}
.gold{background:#d69b16}.light{background:#edf1f7;color:#102a56}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover}
.menu-wrap{position:relative}
.menu-btn{width:40px;height:40px;border-radius:9px;background:#edf1f7;color:#102a56;font-size:19px}
.menu{display:none;position:absolute;right:0;top:47px;width:220px;background:#fff;border:1px solid #ddd;border-radius:13px;padding:6px;box-shadow:0 15px 35px #102a5622}
.menu.show{display:block}
.menu a,.menu button{display:block;width:100%;padding:9px 10px;background:none;text-align:left;color:#292b39;text-decoration:none;border-radius:7px}
.menu a:hover,.menu button:hover{background:#f3f6fa}
.title{padding:7px 10px 3px;color:#999;font-size:10px;font-weight:bold}
main{padding:0 15px}

.hero{
margin:18px auto 20px;
padding:35px 20px 30px;
border-radius:23px;
background:linear-gradient(135deg,#102a56,#183c76,#d69b16);
color:#fff;
text-align:center;
box-shadow:0 15px 35px #102a5625
}
.hero img{
width:95px;
height:95px;
object-fit:contain;
background:#fff;
border-radius:22px;
padding:8px;
margin-bottom:15px
}
.hero h1{margin:0 0 10px;font-size:clamp(34px,6vw,52px)}
.hero h1 span{color:#fde68a}
.hero p{max-width:650px;margin:auto;line-height:1.55}
.actions{margin-top:17px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.actions .light{background:#ffffff22;color:#fff;border:1px solid #ffffff55}

.account{
display:flex;
justify-content:space-between;
align-items:center;
max-width:900px;
margin:0 auto 15px;
padding:12px 14px;
background:#fff;
border:1px solid #e3e8f0;
border-radius:12px
}
.account b{display:block}.account small{color:#667085}

.grid{
max-width:900px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:14px
}
.card,.question-card{
background:#fff;
border:1px solid #e3e8f0;
border-radius:16px;
box-shadow:0 7px 22px #102a560b
}
.card{overflow:hidden}
.bar{height:7px;background:#102a56}
.premium .bar{background:#d69b16}
.card-body{padding:17px}
.label{font-size:10px;font-weight:bold;letter-spacing:1px;color:#d69b16}
.card h3{margin:8px 0;color:#102a56}
.card p{margin:0;color:#697184;line-height:1.5}
.badge{display:inline-block;margin-top:11px;padding:5px 9px;border-radius:15px;font-size:10px;font-weight:bold}
.free{background:#eaf7ef;color:#18794e}
.pro{background:#fff6dc;color:#9a7000}
.card button{
width:100%;
height:39px;
margin-top:14px;
border-radius:8px;
background:#102a56;
color:#fff;
font-weight:bold
}
.premium button{background:#d69b16}

.quiz{display:none;max-width:900px;margin:auto}
.quizhead{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
margin:12px 0
}
.quiztitle{font-size:21px;font-weight:bold;color:#102a56}
.progress{font-size:12px;color:#667085;margin-top:3px}
.question-card{padding:20px}
.question{
font-size:18px;
font-weight:bold;
line-height:1.5;
color:#102a56;
margin-bottom:15px
}
.option{
width:100%;
padding:12px;
margin:7px 0;
text-align:left;
border:1px solid #dce2eb;
background:#fff;
border-radius:8px
}
.option.selected{
background:#edf2f8;
border-color:#102a56;
font-weight:bold
}
.quizbuttons{
display:flex;
justify-content:space-between;
margin-top:15px
}
.premiumbox{
text-align:center;
padding:20px;
background:#fffaf0;
border:1px solid #ead7a5;
border-radius:12px
}
.result{text-align:center}
.score{font-size:48px;font-weight:bold;color:#102a56}

.referral{
display:none;
max-width:900px;
margin:8px auto 15px;
padding:14px;
background:#fff;
border:1px solid #e3e8f0;
border-radius:12px
}
.referral input{
width:100%;
height:38px;
margin:8px 0;
padding:0 8px;
border:1px solid #ddd;
border-radius:7px
}

.notice{
display:none;
max-width:900px;
margin:8px auto;
padding:10px;
background:#fff0f0;
color:#a52f2f;
border-radius:8px
}
.notice.show{display:block}

footer{
margin-top:40px;
padding:22px;
text-align:center;
background:#102a56;
color:#cbd5e1
}

@media(max-width:600px){
nav{padding:7px 10px}
.logo{font-size:17px}
.hero{padding:28px 15px}
.hero h1{font-size:32px}
.grid{grid-template-columns:1fr}
.account{align-items:flex-start}
.menu{width:210px}
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">Create<span>LK</span> English</div>

<div class="right">
<img id="avatar" class="avatar" style="display:none" alt="">

<button id="login" class="btn" onclick="login()">Sign in</button>

<div class="menu-wrap">
<button class="menu-btn" onclick="menu.classList.toggle('show')">☰</button>

<div id="menu" class="menu">
<div class="title">English</div>
<a href="/Eng/">Lessons</a>
<a href="#" onclick="referral();return false">Referral</a>

<div class="title">Account</div>
<a id="logout" href="#" style="display:none" onclick="location.href=API+'/auth/logout';return false">Logout</a>
</div>
</div>
</div>
</nav>
</header>

<main>

<section class="hero">

<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png" alt="CreateLK English">

<h1>Learn English <span>with confidence.</span></h1>

<p>
Simple English lessons, practice questions and MCQ exercises to help you improve step by step.
</p>

<div class="actions">
<button class="btn gold" onclick="lessons.scrollIntoView({behavior:'smooth'})">
Start Learning
</button>

<button id="heroLogin" class="btn light" onclick="login()">
Google Login
</button>
</div>

</section>

<div id="notice" class="notice"></div>

<div id="account" class="account" style="display:none">
<div>
<b id="name"></b>
<small id="status"></small>
</div>

<button class="btn light" onclick="location.href=API+'/auth/logout'">
Logout
</button>
</div>

<div id="ref" class="referral">
<b>Your Referral Link</b>
<input id="refUrl" readonly>
<button class="btn" onclick="copyRef()">Copy Link</button>
</div>

<section id="lessons">
<div id="list"></div>
</section>

<section id="quiz" class="quiz">

<div class="quizhead">
<div>
<div id="quiztitle" class="quiztitle"></div>
<div id="progress" class="progress"></div>
</div>

<button class="btn light" onclick="back()">← Lessons</button>
</div>

<div id="quizbody"></div>

</section>

</main>

<footer>
<small>CreateLK English · CreateLK © 2026</small>
</footer>

<script>
const API="https://eng.createlk.workers.dev";
const LOGO="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png";

let data=[],qs=[],n=0,answers=[],premium=false;

const $=x=>document.getElementById(x);

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));

function login(){
let r=localStorage.getItem("english_referral");
location.href=API+"/auth/google"+(r?"?ref="+encodeURIComponent(r):"");
}

async function api(p){
let r=await fetch(API+p,{credentials:"include",cache:"no-store"});
let d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||"Request failed");
return d;
}

async function init(){

let r=new URLSearchParams(location.search).get("ref");
if(r&&/^[A-Za-z0-9_-]{3,100}$/.test(r))
localStorage.setItem("english_referral",r);

try{
let d=await api("/api/me");

if(d.logged_in){
premium=!!d.premium;

let u=d.user||{};

$("login").style.display="none";
$("heroLogin").style.display="none";
$("logout").style.display="block";
$("account").style.display="flex";

$("name").textContent=u.name||u.email||"User";
$("status").textContent=premium?"Premium Member":"Free Member";

$("avatar").src=u.picture||u.photo||LOGO;
$("avatar").style.display="block";
}
}catch(e){}

try{
let d=await api("/api/titles");
data=Array.isArray(d)?d:(d.titles||d.lessons||d.data||[]);
render();
}catch(e){
$("list").innerHTML=
'<div class="question-card" style="text-align:center;padding:30px">Unable to load lessons.</div>';
}
}

function premiumLesson(x){
if(x.access_type&&String(x.access_type).toUpperCase()=="FREE")return false;
if(x.is_free===true||x.free===true||x.premium===false)return false;
return Number(x.id||x.lesson_id)!=1;
}

function render(){

let a=data;

$("list").innerHTML=a.length?
'<div class="grid">'+a.map(card).join("")+'</div>':
'<div class="question-card" style="text-align:center;padding:30px">No lessons found.</div>';
}

function card(x){

let id=x.id||x.lesson_id||x.title_id;
let title=x.title||x.name||x.lesson_title||"English Lesson";
let desc=x.description||x.subtitle||"Practice English with MCQ questions.";
let pro=premiumLesson(x);

return `<article class="card ${pro?"premium":""}">
<div class="bar"></div>
<div class="card-body">

<div class="label">${pro?"PREMIUM LESSON":"FREE LESSON"}</div>

<h3>${esc(title)}</h3>

<p>${esc(desc)}</p>

<span class="badge ${pro?"pro":"free"}">
${pro?"PREMIUM 🔒":"FREE"}
</span>

<button onclick="openLesson(${JSON.stringify(id)},${JSON.stringify(title)},${pro})">
${pro?"Unlock":"Start Lesson"}
</button>

</div>
</article>`;
}

async function openLesson(id,title,pro){

if(pro&&!premium){

$("quiz").style.display="block";
$("lessons").style.display="none";

$("quiztitle").textContent="Premium Lesson";

$("quizbody").innerHTML=`
<div class="question-card premiumbox">
<h2>Premium Lesson 🔒</h2>
<p>Login with your Premium account to access this lesson.</p>
<button class="btn gold" onclick="login()">Login / Upgrade</button>
</div>`;

return;
}

$("lessons").style.display="none";
$("quiz").style.display="block";

$("quiztitle").textContent=title;
$("quizbody").innerHTML='<div class="question-card">Loading questions...</div>';

try{

let d=await api("/api/questions?lesson_id="+encodeURIComponent(id));

qs=Array.isArray(d)?d:(d.questions||d.data||[]);

n=0;
answers=[];

show();

}catch(e){

$("quizbody").innerHTML=
'<div class="question-card">Unable to load questions.</div>';

}
}

function show(){

let q=qs[n];

if(!q){
$("quizbody").innerHTML=
'<div class="question-card">No questions available.</div>';
return;
}

let o=[
["a",q.option_a],
["b",q.option_b],
["c",q.option_c],
["d",q.option_d]
];

$("progress").textContent=`Question ${n+1} of ${qs.length}`;

$("quizbody").innerHTML=`
<div class="question-card">

<div class="question">${esc(q.question)}</div>

${o.map(x=>`
<button class="option ${answers[n]==x[0]?"selected":""}"
onclick="answer('${x[0]}')">
<b>${x[0].toUpperCase()}.</b> ${esc(x[1])}
</button>
`).join("")}

<div class="quizbuttons">

<button class="btn light" onclick="prev()" ${n==0?"disabled":""}>
← Previous
</button>

<button class="btn" onclick="next()">
${n==qs.length-1?"Finish":"Next →"}
</button>

</div>

</div>`;
}

function answer(x){
answers[n]=x;
show();
}

function next(){

if(!answers[n])
return notice("Please select an answer.");

if(n<qs.length-1){
n++;
show();
}else{
finish();
}
}

function prev(){
if(n){
n--;
show();
}
}

function finish(){

let score=qs.reduce(
(s,q,i)=>s+
(String(answers[i]).toLowerCase()==
String(q.correct_answer).toLowerCase()?1:0),0
);

let pc=Math.round(score/qs.length*100);

$("quizbody").innerHTML=`
<div class="question-card result">

<div class="score">${pc}%</div>

<h2>${score} / ${qs.length}</h2>

<p>Lesson completed. Keep practising to improve your English.</p>

<button class="btn" onclick="n=0;answers=[];show()">
Try Again
</button>

</div>`;
}

function back(){

$("quiz").style.display="none";
$("lessons").style.display="block";

$("lessons").scrollIntoView({behavior:"smooth"});
}

async function referral(){

$("menu").classList.remove("show");
$("ref").style.display="block";

try{

let d=await api("/api/referral");
let code=d.code||d.referral_code||"";

$("refUrl").value=
d.url||
location.origin+"/Eng/"+
(code?"?ref="+encodeURIComponent(code):"");

}catch{

$("refUrl").value=location.origin+"/Eng/";

}
}

async function copyRef(){

try{

await navigator.clipboard.writeText($("refUrl").value);

notice("Referral link copied.");

}catch{}

}

function notice(x){

$("notice").textContent=x;
$("notice").classList.add("show");

setTimeout(
()=>$("notice").classList.remove("show"),
2200
);
}

init();
</script>

</body>
</html>
