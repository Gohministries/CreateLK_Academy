<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#102a56">

<title>CreateLK Academy Admin</title>

<style>
:root{
  --navy:#102a56;
  --gold:#d69b16;
  --gold2:#f4c64e;
  --bg:#f5f7fb;
  --text:#172033;
  --muted:#687386;
  --white:#fff;
  --green:#15965a;
  --red:#d9363e;
  --border:#e5e9f0;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 24px;
  box-shadow:0 8px 30px rgba(16,42,86,.08);
}

.header{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  width:72px;
  height:72px;
  object-fit:contain;
  display:block;
  margin:0 auto 12px;
}

h1{
  margin:0;
  color:var(--navy);
  font-size:22px;
  line-height:1.3;
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}

.hidden{
  display:none !important;
}


/* LOGIN */

.login-section{
  text-align:center;
}

.google-btn{
  width:100%;
  min-height:48px;
  border:1px solid var(--border);
  background:#fff;
  color:#202124;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google-btn:hover{
  background:#f8f9fa;
}

.google-icon{
  width:20px;
  height:20px;
}


/* ADMIN */

.admin-section{
  width:100%;
}

.admin-label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.admin-email{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  background:#f8f9fb;
  border-radius:8px;
  color:var(--navy);
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-bottom:20px;
}

.field-label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
  color:var(--text);
}

input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 2px rgba(16,42,86,.08);
}

.activate-btn{
  width:100%;
  height:46px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:var(--gold);
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.activate-btn:hover{
  background:#c58d0d;
}

.activate-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* RESULT */

.result{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  line-height:1.4;
}

.result.success{
  color:var(--green);
}

.result.error{
  color:var(--red);
}

.logout{
  display:block;
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  text-decoration:none;
  font-size:12px;
}

.logout:hover{
  color:var(--navy);
}


/* FOOTER */

.footer{
  margin-top:16px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}


/* MOBILE */

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{
    padding:24px 18px;
    border-radius:14px;
  }

  h1{
    font-size:20px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">

      <img
        class="logo"
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK Academy"
      >

      <h1>CreateLK Academy Admin</h1>

      <div class="subtitle">
        Premium activation
      </div>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div
      id="loginSection"
      class="login-section"
    >

      <button
        id="googleLoginBtn"
        class="google-btn"
        type="button"
      >

        <svg
          class="google-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="#4285F4"
            d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"
          />
          <path
            fill="#34A853"
            d="M12 21.72c2.63 0 4.84-.87 6.45-2.34l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.72z"
          />
          <path
            fill="#FBBC05"
            d="M6.54 13.83A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.83V7.65H3.3A9.74 9.74 0 0 0 2.26 12c0 1.57.38 3.05 1.04 4.35l3.24-2.52z"
          />
          <path
            fill="#EA4335"
            d="M12 6.14c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.27 14.63 2.28 12 2.28a9.74 9.74 0 0 0-8.7 5.37l3.24 2.52c.77-2.31 2.92-4.03 5.46-4.03z"
          />
        </svg>

        Sign in with Google

      </button>

    </div>


    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <div
      id="adminSection"
      class="admin-section hidden"
    >

      <label class="admin-label">
        Administrator
      </label>

      <div
        id="adminEmail"
        class="admin-email"
      >
        Checking...
      </div>


      <label
        class="field-label"
        for="customerEmail"
      >
        Customer Google email
      </label>

      <input
        id="customerEmail"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="customer@gmail.com"
      >


      <button
        id="activateBtn"
        class="activate-btn"
        type="button"
      >
        Activate Premium
      </button>


      <div
        id="result"
        class="result"
        aria-live="polite"
      ></div>


      <a
        class="logout"
        href="https://eng-login.createlk.workers.dev/auth/logout"
      >
        Sign out
      </a>

    </div>

  </div>


  <div class="footer">
    CreateLK Academy · Premium Administration
  </div>

</div>


<script>

const API =
  "https://eng-login.createlk.workers.dev";

const LOGIN_URL =
  API +
  "/auth/google?next=/Eng/admin.html";


const loginSection =
  document.getElementById(
    "loginSection"
  );

const adminSection =
  document.getElementById(
    "adminSection"
  );

const adminEmail =
  document.getElementById(
    "adminEmail"
  );

const customerEmail =
  document.getElementById(
    "customerEmail"
  );

const activateBtn =
  document.getElementById(
    "activateBtn"
  );

const result =
  document.getElementById(
    "result"
  );


/* =========================
   GOOGLE LOGIN
========================= */

document
  .getElementById("googleLoginBtn")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        LOGIN_URL;

    }
  );


/* =========================
   RESULT
========================= */

function showResult(
  message,
  type
){

  result.textContent =
    message;

  result.className =
    "result " +
    (type || "");

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  showResult(
    "",
    ""
  );

  try{

    const response =
      await fetch(
        API + "/api/admin/me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Admin check failed"
      );

    }

    const data =
      await response.json();


    if(
      data.loggedIn === true &&
      data.admin === true
    ){

      loginSection
        .classList
        .add("hidden");

      adminSection
        .classList
        .remove("hidden");

      adminEmail.textContent =
        data.email || "";

      customerEmail.focus();

    }else{

      loginSection
        .classList
        .remove("hidden");

      adminSection
        .classList
        .add("hidden");

    }

  }catch(error){

    console.error(
      "ADMIN CHECK:",
      error
    );

    loginSection
      .classList
      .remove("hidden");

    adminSection
      .classList
      .add("hidden");

  }

}


/* =========================
   ACTIVATE PREMIUM
========================= */

async function activatePremium(){

  const email =
    customerEmail.value
      .trim()
      .toLowerCase();


  if(!email){

    showResult(
      "Please enter the customer's Google email.",
      "error"
    );

    customerEmail.focus();

    return;
  }


  /*
    Basic email validation
  */

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(email)
  ){

    showResult(
      "Please enter a valid email address.",
      "error"
    );

    customerEmail.focus();

    return;
  }


  activateBtn.disabled =
    true;

  activateBtn.textContent =
    "Activating...";

  showResult(
    "",
    ""
  );


  try{

    const response =
      await fetch(
        API + "/api/admin/activate",
        {
          method:"POST",

          credentials:"include",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email
          })
        }
      );


    let data;

    try{

      data =
        await response.json();

    }catch{

      data = {
        success:false,
        error:"Invalid server response."
      };

    }


    if(
      response.ok &&
      data.success === true
    ){

      showResult(
        "Premium activated successfully for " +
        email +
        ".",
        "success"
      );

      customerEmail.value = "";

    }else{

      showResult(
        data.error ||
        "Premium activation failed.",
        "error"
      );

    }

  }catch(error){

    console.error(
      "ACTIVATION ERROR:",
      error
    );

    showResult(
      "Unable to connect to the server.",
      "error"
    );

  }finally{

    activateBtn.disabled =
      false;

    activateBtn.textContent =
      "Activate Premium";

  }

}


/* =========================
   BUTTON
========================= */

activateBtn.addEventListener(
  "click",
  activatePremium
);


/* =========================
   ENTER KEY
========================= */

customerEmail.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      activatePremium();

    }

  }
);


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
