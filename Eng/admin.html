<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Academy Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:390px;
}

.card{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:16px;
  padding:25px;
  box-shadow:0 8px 30px rgba(16,42,86,.08);
}

.logo{
  display:block;
  width:58px;
  height:58px;
  object-fit:contain;
  margin:0 auto 14px;
}

h1{
  margin:0;
  text-align:center;
  color:#102a56;
  font-size:22px;
}

.subtitle{
  margin:7px 0 22px;
  text-align:center;
  color:#687386;
  font-size:13px;
}

input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #dce1e8;
  border-radius:9px;
  outline:none;
  font-size:15px;
  color:#172033;
  background:#fff;
}

input:focus{
  border-color:#102a56;
}

button{
  width:100%;
  height:48px;
  border:0;
  border-radius:9px;
  background:#102a56;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.94;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.google-btn{
  background:#fff;
  color:#172033;
  border:1px solid #dce1e8;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google-icon{
  width:19px;
  height:19px;
}

.activate-btn{
  margin-top:10px;
  background:#d69b16;
}

#adminBox{
  display:none;
}

.result{
  min-height:20px;
  margin-top:15px;
  text-align:center;
  font-size:14px;
  font-weight:700;
}

.success{
  color:#15965a;
}

.error{
  color:#d9363e;
}

.loading{
  color:#687386;
}

.admin-email{
  margin-bottom:15px;
  padding:10px;
  border-radius:8px;
  background:#f5f7fb;
  color:#687386;
  font-size:12px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout{
  display:block;
  margin-top:14px;
  text-align:center;
  color:#687386;
  font-size:12px;
  text-decoration:none;
}

.logout:hover{
  color:#102a56;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <img
      class="logo"
      src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
      alt="CreateLK Academy"
    >

    <h1>CreateLK Academy Admin</h1>

    <div class="subtitle">
      Premium activation
    </div>


    <!-- LOGIN -->

    <div id="loginBox">

      <a
        href="https://eng-login.createlk.workers.dev/auth/google?next=/Eng/admin.html"
        style="text-decoration:none"
      >
        <button
          type="button"
          class="google-btn"
        >

          <svg
            class="google-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="#4285F4"
              d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
            />
            <path
              fill="#34A853"
              d="M12 21.99c2.63 0 4.84-.87 6.45-2.34l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.99z"
            />
            <path
              fill="#FBBC05"
              d="M6.54 14.09a5.86 5.86 0 0 1 0-4.18V7.38H3.3a9.75 9.75 0 0 0 0 9.24l3.24-2.53z"
            />
            <path
              fill="#EA4335"
              d="M12 5.88c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 2.95 14.63 2 12 2a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.6 9.46 5.88 12 5.88z"
            />
          </svg>

          Sign in with Google

        </button>
      </a>

    </div>


    <!-- ADMIN -->

    <div id="adminBox">

      <div
        id="adminEmail"
        class="admin-email"
      ></div>

      <input
        id="customerEmail"
        type="email"
        placeholder="Customer Google email"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      >

      <button
        id="activateBtn"
        class="activate-btn"
        type="button"
      >
        Activate Premium
      </button>

      <div
        id="result"
        class="result"
        aria-live="polite"
      ></div>

      <a
        class="logout"
        href="https://eng-login.createlk.workers.dev/auth/logout"
      >
        Sign out
      </a>

    </div>

  </div>

</div>


<script>

const LOGIN_API =
  "https://eng-login.createlk.workers.dev";

const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const adminEmail =
  document.getElementById("adminEmail");

const customerEmail =
  document.getElementById("customerEmail");

const activateBtn =
  document.getElementById("activateBtn");

const result =
  document.getElementById("result");


async function checkAdmin(){

  try{

    const response =
      await fetch(
        LOGIN_API + "/api/admin/me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      data.loggedIn &&
      data.admin
    ){

      loginBox.style.display="none";

      adminBox.style.display="block";

      adminEmail.textContent =
        data.email || "Administrator";

      customerEmail.focus();

      return;
    }

    loginBox.style.display="block";
    adminBox.style.display="none";

  }catch(error){

    console.error(error);

    loginBox.style.display="block";
    adminBox.style.display="none";

  }

}


async function activate(){

  const email =
    customerEmail.value.trim();

  result.className="result";

  if(!email){

    result.textContent =
      "Enter customer email.";

    result.classList.add("error");

    customerEmail.focus();

    return;
  }


  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
  ){

    result.textContent =
      "Enter a valid email address.";

    result.classList.add("error");

    customerEmail.focus();

    return;
  }


  activateBtn.disabled=true;

  result.textContent =
    "Activating...";

  result.className =
    "result loading";


  try{

    const response =
      await fetch(
        LOGIN_API + "/api/admin/activate",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            email:email
          })
        }
      );


    const data =
      await response.json();


    if(data.success){

      result.textContent =
        "✓ Premium activated for 30 days.";

      result.className =
        "result success";

      customerEmail.value="";

    }else{

      result.textContent =
        data.error ||
        "Activation failed.";

      result.className =
        "result error";
    }


  }catch(error){

    console.error(error);

    result.textContent =
      "Connection error. Please try again.";

    result.className =
      "result error";

  }


  activateBtn.disabled=false;

}


/*
  Activate with Enter key
*/

customerEmail.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){

      event.preventDefault();

      activate();

    }

  }
);


activateBtn.addEventListener(
  "click",
  activate
);


checkAdmin();

</script>

</body>
</html>
