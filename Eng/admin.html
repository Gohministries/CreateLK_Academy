<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Academy Admin</title>

<style>
:root{
  --navy:#102a56;
  --gold:#d69b16;
  --bg:#f5f7fb;
  --text:#172033;
  --muted:#687386;
  --border:#e5e9f0;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px;
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  margin:8px 0 24px;
  color:var(--muted);
  font-size:14px;
}

.login-btn,
.activate-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  font-weight:800;
  cursor:pointer;
  font-size:14px;
}

.login-btn{
  background:var(--navy);
  color:#fff;
}

.activate-btn{
  background:var(--gold);
  color:#fff;
  margin-top:12px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:9px;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:var(--navy);
}

.hidden{
  display:none;
}

.admin-email{
  font-size:13px;
  font-weight:700;
  margin-bottom:18px;
  color:var(--navy);
  word-break:break-word;
}

.result{
  margin-top:15px;
  font-size:13px;
  font-weight:700;
  min-height:20px;
}

.logout{
  display:inline-block;
  margin-top:18px;
  color:var(--muted);
  font-size:12px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
    alt="CreateLK Academy"
  >

  <h1>CreateLK Academy Admin</h1>

  <div class="subtitle">
    Premium activation
  </div>


  <!-- LOGIN -->

  <div id="loginBox">

    <button
      class="login-btn"
      id="loginBtn"
      type="button"
    >
      Sign in with Google
    </button>

  </div>


  <!-- ADMIN -->

  <div id="adminBox" class="hidden">

    <div
      class="admin-email"
      id="adminEmail"
    ></div>

    <input
      id="customerEmail"
      type="email"
      placeholder="Customer Google email"
      autocomplete="email"
    >

    <button
      class="activate-btn"
      id="activateBtn"
      type="button"
    >
      Activate Premium
    </button>

    <div
      class="result"
      id="result"
    ></div>

    <a
      class="logout"
      href="https://eng-login.createlk.workers.dev/auth/logout"
    >
      Sign out
    </a>

  </div>

</div>


<script>

const API =
  "https://eng-login.createlk.workers.dev";


const LOGIN =
  API +
  "/auth/google?next=/Eng/admin.html";


const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const adminEmail =
  document.getElementById("adminEmail");

const customerEmail =
  document.getElementById("customerEmail");

const activateBtn =
  document.getElementById("activateBtn");

const result =
  document.getElementById("result");


/* =========================
   GOOGLE LOGIN
========================= */

document
  .getElementById("loginBtn")
  .addEventListener("click",function(){

    location.href = LOGIN;

  });


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  try{

    const response =
      await fetch(
        API + "/api/admin/me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      data.loggedIn &&
      data.admin
    ){

      loginBox.classList.add(
        "hidden"
      );

      adminBox.classList.remove(
        "hidden"
      );

      adminEmail.textContent =
        data.email;

    }else{

      loginBox.classList.remove(
        "hidden"
      );

      adminBox.classList.add(
        "hidden"
      );

    }

  }catch(error){

    console.error(error);

    result.textContent =
      "Unable to check admin login.";

  }

}


/* =========================
   ACTIVATE PREMIUM
========================= */

async function activatePremium(){

  const email =
    customerEmail.value
      .trim()
      .toLowerCase();

  result.textContent = "";


  if(!email){

    result.textContent =
      "Enter customer Google email.";

    customerEmail.focus();

    return;
  }


  activateBtn.disabled = true;

  activateBtn.textContent =
    "Activating...";


  try{

    const response =
      await fetch(
        API + "/api/admin/activate",
        {
          method:"POST",

          credentials:"include",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email
          })
        }
      );


    const data =
      await response.json();


    if(data.success){

      result.textContent =
        "Premium activated successfully.";

      customerEmail.value = "";

    }else{

      result.textContent =
        data.error ||
        "Activation failed.";

    }

  }catch(error){

    console.error(error);

    result.textContent =
      "Server error.";

  }finally{

    activateBtn.disabled = false;

    activateBtn.textContent =
      "Activate Premium";

  }

}


/* =========================
   EVENTS
========================= */

activateBtn.addEventListener(
  "click",
  activatePremium
);


customerEmail.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      activatePremium();

    }

  }
);


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
