<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Lesson | Facebook Creator Study</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7fb;
color:#101828;
font:15px Arial,sans-serif;
line-height:1.6
}

header{
background:linear-gradient(135deg,#155eef,#7c3aed);
color:#fff;
padding:20px 16px;
text-align:center
}

header h1{
margin:0;
font-size:21px
}

header p{
margin:5px 0 0;
opacity:.9
}

.container{
max-width:850px;
margin:auto;
padding:18px
}

.back{
display:inline-block;
margin-bottom:15px;
color:#155eef;
font-weight:700
}

.card{
background:#fff;
border-radius:18px;
padding:22px;
box-shadow:0 5px 20px rgba(16,24,40,.07)
}

.number{
display:inline-block;
background:#eef4ff;
color:#155eef;
font-weight:800;
padding:7px 12px;
border-radius:10px;
margin-bottom:12px
}

h2{
margin:0 0 18px;
font-size:25px;
color:#101828;
line-height:1.3
}

.content{
font-size:16px;
color:#344054;
white-space:pre-line
}

.loading,
.error{
text-align:center;
padding:45px 20px;
color:#667085
}

.error{
color:#b42318
}

.retry{
margin-top:15px;
border:0;
background:#155eef;
color:#fff;
padding:11px 18px;
border-radius:10px;
font-weight:700;
cursor:pointer
}

.lang{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px
}

.lang button{
border:1px solid #d0d5dd;
background:#fff;
padding:8px 12px;
border-radius:9px;
cursor:pointer
}

.lang button.active{
background:#155eef;
border-color:#155eef;
color:#fff
}

footer{
text-align:center;
padding:30px 15px;
color:#667085;
font-size:13px
}
</style>
</head>

<body>

<header>
<h1>📱 Facebook Creator Study</h1>
<p>Learn. Create. Grow.</p>
</header>

<main class="container">

<a href="/fb/dashboard.html" class="back">
← Back to Study
</a>

<div class="lang">

<button data-lang="en" onclick="changeLanguage('en')">
🇬🇧 English
</button>

<button data-lang="ta" onclick="changeLanguage('ta')">
🇱🇰 தமிழ்
</button>

<button data-lang="si" onclick="changeLanguage('si')">
🇱🇰 සිංහල
</button>

</div>

<section id="lessonBox" class="card">

<div class="loading">
Loading lesson...
</div>

</section>

</main>

<footer>
Facebook Creator Study<br>
Independent online education platform
</footer>

<script>

const API="https://lesson.createlk.workers.dev";

const params=
new URLSearchParams(location.search);

const lessonNumber=
Number(params.get("lesson")||"1");

let language=
params.get("language") ||
localStorage.getItem("fb_language") ||
"en";

function setLanguageButtons(){

document.querySelectorAll(".lang button")
.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.lang===language
);

});

}

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function getContent(lesson){

if(language==="ta"){

return lesson.content_ta ||
lesson.content ||
"";

}

if(language==="si"){

return lesson.content_si ||
lesson.content ||
"";

}

return lesson.content_en ||
lesson.content ||
"";

}

function getTitle(lesson){

if(language==="ta"){

return lesson.title_ta ||
lesson.title ||
"";

}

if(language==="si"){

return lesson.title_si ||
lesson.title ||
"";

}

return lesson.title_en ||
lesson.title ||
"";

}

async function loadLesson(){

const box=
document.getElementById("lessonBox");

box.innerHTML=`
<div class="loading">
⏳ Loading lesson...
</div>
`;

if(!lessonNumber){

box.innerHTML=`
<div class="error">
❌ Invalid lesson
</div>
`;

return;

}

try{

/*
 Cloudflare Worker API
*/

const url=
`${API}/lesson?course=facebook-creator&lesson=${encodeURIComponent(lessonNumber)}&language=${encodeURIComponent(language)}`;

const response=
await fetch(url,{
method:"GET",
cache:"no-store"
});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Lesson could not be loaded"
);

}

if(!data.success){

throw new Error(
data.error ||
"Lesson could not be loaded"
);

}

const lesson=
data.lesson ||
data.data;

if(!lesson){

throw new Error(
"Lesson data is empty"
);

}

const title=
getTitle(lesson);

const content=
getContent(lesson);

box.innerHTML=`

<div class="number">
Lesson ${lessonNumber}
</div>

<h2>
${escapeHtml(title)}
</h2>

<div class="content">
${escapeHtml(content)}
</div>

`;

document.title=
`${title} | Facebook Creator Study`;

}catch(error){

console.error(error);

box.innerHTML=`

<div class="error">

❌ Unable to load this lesson.

<br><br>

Please check your internet connection
and try again.

<br>

<button
class="retry"
onclick="loadLesson()">
Try Again
</button>

</div>

`;

}

}

function changeLanguage(lang){

language=lang;

localStorage.setItem(
"fb_language",
lang
);

const url=
new URL(location.href);

url.searchParams.set(
"language",
lang
);

history.replaceState(
null,
"",
url
);

setLanguageButtons();

loadLesson();

}

setLanguageButtons();

loadLesson();

</script>

</body>
</html>
