<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Calendar</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,sans-serif
}

header{
 background:#1e3a8a;
 color:white;
 text-align:center;
 padding:15px
}

header h2,
header p{
 margin:0
}

header p{
 font-size:12px;
 margin-top:4px
}

main{
 max-width:850px;
 margin:15px auto;
 padding:0 10px
}

.box{
 background:white;
 padding:14px;
 border-radius:12px;
 margin-bottom:12px;
 box-shadow:0 2px 8px #0001
}

.search{
 display:flex;
 gap:7px
}

.search input{
 flex:1;
 width:100%;
 padding:9px;
 border:1px solid #cbd5e1;
 border-radius:7px;
 font:inherit
}

.search select{
 width:140px;
 padding:9px;
 border:1px solid #cbd5e1;
 border-radius:7px;
 font:inherit
}

.progress{
 margin-top:10px;
 font-size:13px;
 font-weight:bold
}

.bar{
 height:7px;
 background:#e2e8f0;
 border-radius:10px;
 margin-top:5px
}

.fill{
 height:100%;
 width:0;
 background:#2563eb;
 border-radius:10px
}

.sync{
 text-align:center;
 font-size:11px;
 color:#64748b;
 margin-top:7px
}

.calendar-head{
 display:flex;
 gap:7px;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px
}

.calendar-head button{
 background:#e2e8f0;
 border:0;
 padding:8px 12px;
 border-radius:7px;
 cursor:pointer
}

.calendar-head select{
 width:90px;
 padding:8px;
 border:1px solid #cbd5e1;
 border-radius:7px
}

.title{
 font-weight:bold;
 font-size:18px
}

.weekdays,
.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px
}

.weekday{
 text-align:center;
 font-size:11px;
 color:#64748b;
 padding:5px
}

.day{
 min-height:55px;
 border:0;
 border-radius:7px;
 background:#e2e8f0;
 padding:5px;
 cursor:pointer
}

.day:hover{
 background:#cbd5e1
}

.day.saved{
 background:#bbf7d0;
 color:#166534
}

.day.active{
 background:#2563eb;
 color:white
}

.day.empty{
 visibility:hidden
}

.num{
 display:block;
 font-weight:bold
}

.bday{
 font-size:9px;
 opacity:.7
}

.verse-title{
 margin:0 0 12px;
 font-size:18px
}

.language{
 margin-top:14px;
 padding:12px;
 background:#f8fafc;
 border-radius:9px;
 border:1px solid #e2e8f0
}

.language strong{
 display:block;
 margin-bottom:7px
}

.verse-text{
 line-height:1.7;
 white-space:pre-wrap;
 font-size:15px
}

.copy{
 margin-top:9px;
 background:#2563eb;
 color:white;
 padding:8px 13px;
 border:0;
 border-radius:7px;
 cursor:pointer;
 font-weight:bold
}

.copy:active{
 transform:scale(.98)
}

.status{
 display:none;
 padding:9px;
 margin-top:10px;
 border-radius:7px;
 font-size:13px;
 background:#dcfce7;
 color:#166534
}

.status.show{
 display:block
}

.nav{
 display:flex;
 gap:7px;
 margin-top:10px
}

.nav button{
 flex:1;
 background:#e2e8f0;
 border:0;
 border-radius:7px;
 padding:9px;
 cursor:pointer;
 font-weight:bold
}

@media(max-width:600px){

 .search{
  flex-direction:column
 }

 .search select{
  width:100%
 }

 .calendar-head{
  flex-wrap:wrap
 }

 .title{
  width:100%;
  text-align:center;
  order:2
 }

 .calendar-head button:first-child{
  order:1
 }

 .calendar-head select{
  order:3
 }

 .calendar-head button:last-child{
  order:4
 }

 .day{
  min-height:45px
 }

 .bday{
  font-size:8px
 }

 .verse-text{
  font-size:14px
 }
}
</style>
</head>

<body>

<header>
<h2>📖 365 Bible Calendar</h2>
<p>365 Daily Bible Verses</p>
</header>

<main>

<!-- SEARCH -->

<div class="box">

<div class="search">

<input
 id="search"
 placeholder="Search verse..."
 oninput="render()"
>

<select
 id="daySelect"
 onchange="goDay(this.value)"
>
<option value="">Select Day</option>
</select>

</div>

<div class="progress">

<span id="count">Loading...</span>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

</div>

<div id="sync" class="sync">
Loading Cloudflare...
</div>

</div>


<!-- CALENDAR -->

<div class="box">

<div class="calendar-head">

<button onclick="changeMonth(-1)">
←
</button>

<div id="title" class="title"></div>

<select
 id="year"
 onchange="changeYear()"
></select>

<button onclick="changeMonth(1)">
→
</button>

</div>

<div class="weekdays">

<div class="weekday">Sun</div>
<div class="weekday">Mon</div>
<div class="weekday">Tue</div>
<div class="weekday">Wed</div>
<div class="weekday">Thu</div>
<div class="weekday">Fri</div>
<div class="weekday">Sat</div>

</div>

<div id="calendar" class="calendar"></div>

</div>


<!-- VERSE VIEW -->

<div class="box">

<h3 class="verse-title">
Day <span id="day">1</span>
</h3>

<div id="verseContent"></div>

<div class="nav">

<button onclick="moveDay(-1)">
← Previous
</button>

<button onclick="moveDay(1)">
Next →
</button>

</div>

<div id="status" class="status"></div>

</div>

</main>


<script>

const API="https://bible.createlk.workers.dev";

const MONTHS=[
 "January","February","March","April",
 "May","June","July","August",
 "September","October","November","December"
];

let data=[];

let date=new Date();

let year=date.getFullYear();

let month=date.getMonth();

let current=dayOfYear(date);


/* ELEMENT */

const $=id=>document.getElementById(id);


/* LEAP YEAR */

function isLeap(y){

 return y%4===0 &&
        (y%100!==0 || y%400===0);

}


/* 365 DAY NUMBER */

function dayOfYear(d){

 let n=Math.floor(

  (
   Date.UTC(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
   ) -
   Date.UTC(
    d.getFullYear(),
    0,
    1
   )
  ) / 86400000

 )+1;


 /*
   Keep the plan at 365 days.
   February 29 is skipped.
 */

 if(
  isLeap(d.getFullYear()) &&
  d.getMonth()>1
 ){

  n--;

 }

 return n;

}


/* DAY NUMBER TO DATE */

function dateFromDay(day,y){

 let d=new Date(y,0,day);

 if(
  isLeap(y) &&
  day>=60
 ){

  d.setDate(
   d.getDate()+1
  );

 }

 return d;

}


/* INITIALIZE */

function init(){

 /*
   Day list
 */

 for(let i=1;i<=365;i++){

  $("daySelect").innerHTML+=
   `<option value="${i}">
    Day ${i}
   </option>`;

 }


 /*
   Years
 */

 let now=new Date().getFullYear();

 for(
  let y=now-10;
  y<=now+10;
  y++
 ){

  $("year").innerHTML+=
   `<option value="${y}">
    ${y}
   </option>`;

 }


 if(
  current<1 ||
  current>365
 ){

  current=365;

  date=dateFromDay(
   365,
   year
  );

 }


 render();

 loadVerse();

 loadCloud();

}


/* CALENDAR */

function render(){

 $("title").textContent=
  MONTHS[month]+" "+year;

 $("year").value=year;

 let calendar=$("calendar");

 calendar.innerHTML="";


 let first=
  new Date(
   year,
   month,
   1
  ).getDay();


 let total=
  new Date(
   year,
   month+1,
   0
  ).getDate();


 /*
   Empty cells
 */

 for(
  let i=0;
  i<first;
  i++
 ){

  calendar.innerHTML+=
   `<div class="day empty"></div>`;

 }


 let search=
  $("search").value
   .trim()
   .toLowerCase();


 /*
   Dates
 */

 for(
  let n=1;
  n<=total;
  n++
 ){

  let d=new Date(
   year,
   month,
   n
  );


  let day=dayOfYear(d);


  /*
    Hide February 29
  */

  if(
   isLeap(year) &&
   month===1 &&
   n===29
  ){

   calendar.innerHTML+=
    `<div class="day empty"></div>`;

   continue;

  }


  if(day>365)
   continue;


  let verse=
   data.find(
    x=>Number(x.day)===day
   );


  let searchText=(

   day+" "+
   n+" "+
   (verse?.english||"")+" "+
   (verse?.sinhala||"")+" "+
   (verse?.tamil||"")

  ).toLowerCase();


  if(
   search &&
   !searchText.includes(search)
  ){

   calendar.innerHTML+=
    `<div class="day empty"></div>`;

   continue;

  }


  let active=
   d.toDateString()===
   date.toDateString();


  let classes=
   "day"+
   (verse?" saved":"")+
   (active?" active":"");


  calendar.innerHTML+=`

   <button
    class="${classes}"
    onclick="selectDate(${n})"
   >

    <span class="num">
     ${n}
    </span>

    <span class="bday">
     Day ${day}
    </span>

   </button>

  `;

 }


 updateProgress();

}


/* SELECT DATE */

function selectDate(n){

 date=new Date(
  year,
  month,
  n
 );

 current=dayOfYear(date);

 if(
  current<1 ||
  current>365
 )
  return;

 loadVerse();

 render();

}


/* SELECT DAY */

function goDay(value){

 if(!value)
  return;

 current=Number(value);

 date=dateFromDay(
  current,
  year
 );

 year=date.getFullYear();

 month=date.getMonth();

 loadVerse();

 render();

}


/* PREVIOUS / NEXT */

function moveDay(amount){

 let next=
  current+amount;

 if(
  next<1 ||
  next>365
 )
  return;

 goDay(next);

}


/* MONTH */

function changeMonth(amount){

 month+=amount;


 if(month<0){

  month=11;
  year--;

 }


 if(month>11){

  month=0;
  year++;

 }


 render();

}


/* YEAR */

function changeYear(){

 year=
  Number(
   $("year").value
  );

 render();

}


/* LOAD VERSE */

function loadVerse(){

 $("day").textContent=
  current;

 $("daySelect").value=
  current;


 let verse=
  data.find(
   x=>Number(x.day)===current
  );


 let container=
  $("verseContent");


 if(!verse){

  container.innerHTML=`

   <div class="language">

    <div class="verse-text">
     Verse not available yet.
    </div>

   </div>

  `;

  return;

 }


 container.innerHTML=`

  <div class="language">

   <strong>🇬🇧 English</strong>

   <div
    class="verse-text"
    id="englishText"
   ></div>

   <button
    class="copy"
    onclick="copyVerse('english')"
   >
    📋 Copy English
   </button>

  </div>


  <div class="language">

   <strong>🇱🇰 සිංහල</strong>

   <div
    class="verse-text"
    id="sinhalaText"
   ></div>

   <button
    class="copy"
    onclick="copyVerse('sinhala')"
   >
    📋 Copy සිංහල
   </button>

  </div>


  <div class="language">

   <strong>🇱🇰 தமிழ்</strong>

   <div
    class="verse-text"
    id="tamilText"
   ></div>

   <button
    class="copy"
    onclick="copyVerse('tamil')"
   >
    📋 Copy தமிழ்
   </button>

  </div>

 `;


 $("englishText").textContent=
  verse.english || "";

 $("sinhalaText").textContent=
  verse.sinhala || "";

 $("tamilText").textContent=
  verse.tamil || "";

}


/* COPY */

async function copyVerse(language){

 let verse=
  data.find(
   x=>Number(x.day)===current
  );


 if(!verse)
  return;


 let text=
  verse[language] || "";


 if(!text)
  return;


 try{

  await navigator.clipboard.writeText(text);

  showStatus(
   "✓ Copied to clipboard",
   "ok"
  );

 }catch{

  /*
    Fallback for older browsers
  */

  let textarea=
   document.createElement("textarea");

  textarea.value=text;

  document.body.appendChild(
   textarea
  );

  textarea.select();

  document.execCommand("copy");

  textarea.remove();

  showStatus(
   "✓ Copied to clipboard",
   "ok"
  );

 }

}


/* PROGRESS */

function updateProgress(){

 let count=
  data.filter(
   x=>
    Number(x.day)>=1 &&
    Number(x.day)<=365
  ).length;


 $("count").textContent=
  count+" / 365";


 $("fill").style.width=
  (count/365*100)+"%";

}


/* STATUS */

function showStatus(text,type){

 $("status").textContent=
  text;

 $("status").className=
  "status show "+type;


 setTimeout(()=>{

  $("status").className=
   "status";

 },2000);

}


/* LOAD CLOUD DATA */

async function loadCloud(){

 try{

  $("sync").textContent=
   "Loading Cloudflare...";


  let response=
   await fetch(
    API+"/api/verses",
    {
     cache:"no-store"
    }
   );


  if(!response.ok)
   throw new Error();


  let cloud=
   await response.json();


  if(!Array.isArray(cloud))
   throw new Error();


  data=
   cloud.filter(
    verse=>{

     let day=
      Number(verse.day);

     return day>=1 &&
            day<=365;

    }
   );


  data.sort(
   (a,b)=>
    Number(a.day)-
    Number(b.day)
  );


  loadVerse();

  render();


  $("sync").textContent=
   "✓ 365 Bible verses loaded";


 }catch(error){

  $("sync").textContent=
   "⚠ Unable to load verses";

  loadVerse();

 }

}


init();

</script>

</body>
</html>
