<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Verses</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#172033;
    font-family:Arial,sans-serif;
}

header{
    background:linear-gradient(135deg,#14213d,#243b64);
    color:#fff;
    text-align:center;
    padding:28px 15px 24px;
}

header h1{
    margin:0;
    font-size:30px;
    font-weight:700;
}

header p{
    margin:8px 0 0;
    opacity:.9;
    font-size:15px;
}

.container{
    width:min(100%,1000px);
    margin:auto;
    padding:18px 14px 40px;
}

.top-controls{
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.top-controls button{
    width:45px;
    height:45px;
    border:0;
    border-radius:10px;
    background:#172b4d;
    color:white;
    font-size:23px;
    cursor:pointer;
}

#daySelect{
    height:45px;
    min-width:170px;
    border:1px solid #d4d9e0;
    border-radius:10px;
    padding:0 12px;
    background:white;
    font-size:16px;
}

.search-box{
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    height:46px;
    border:1px solid #d5dbe3;
    border-radius:10px;
    padding:0 14px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#486da8;
}

.day-title{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.day-title .day{
    font-size:15px;
    font-weight:600;
    color:#60708a;
}

.day-title h2{
    margin:5px 0 0;
    font-size:25px;
}

.verse-card{
    background:#fff;
    border-radius:15px;
    margin-bottom:18px;
    padding:20px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
    border:1px solid #edf0f4;
}

.verse-card h3{
    margin:0 0 14px;
    font-size:19px;
}

.verse-text{
    font-size:20px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:normal;
    overflow-wrap:anywhere;
    margin-bottom:13px;
}

.sinhala{
    font-family:"Noto Sans Sinhala",Arial,sans-serif;
}

.tamil{
    font-family:"Noto Sans Tamil",Arial,sans-serif;
}

.reference{
    display:block;
    font-size:15px;
    font-weight:700;
    margin-bottom:15px;
    color:#394b66;
}

.copy-btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    background:#172b4d;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.copy-btn:active{
    transform:scale(.98);
}

.status{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#172033;
    color:white;
    padding:11px 18px;
    border-radius:25px;
    display:none;
    z-index:1000;
    font-size:14px;
}

.loading{
    text-align:center;
    padding:50px 15px;
    color:#64748b;
}

.error{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    color:#a32929;
}

.no-result{
    text-align:center;
    padding:30px;
    color:#65748b;
    display:none;
}

footer{
    text-align:center;
    color:#718096;
    font-size:13px;
    padding:20px 10px 35px;
}

@media(max-width:600px){

    header{
        padding:22px 12px;
    }

    header h1{
        font-size:25px;
    }

    .container{
        padding:14px 10px 30px;
    }

    .verse-card{
        padding:17px;
    }

    .verse-text{
        font-size:18px;
        line-height:1.7;
    }

    .day-title h2{
        font-size:22px;
    }

    .copy-btn{
        width:100%;
    }
}

</style>
</head>

<body>

<header>

    <h1>365 Bible Verses</h1>

    <p>Daily Bible Verses — English • Sinhala • Tamil</p>

</header>

<div class="container">

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search day or Bible reference..."
            autocomplete="off"
        >

    </div>

    <div class="top-controls">

        <button
            type="button"
            onclick="previousDay()"
            aria-label="Previous day">
            ‹
        </button>

        <select
            id="daySelect"
            onchange="showDay(this.value)">
        </select>

        <button
            type="button"
            onclick="nextDay()"
            aria-label="Next day">
            ›
        </button>

    </div>

    <div id="content">

        <div class="loading">
            Loading Bible verses...
        </div>

    </div>

    <div id="noResult" class="no-result">
        No matching day or Bible reference found.
    </div>

</div>

<div id="status" class="status">
    Copied!
</div>

<footer>
    365 Bible Verses
</footer>

<script>

/* =========================================================
   CLOUDFLARE WORKER URL
   ========================================================= */

const API_URL =
    "https://YOUR-WORKER-DOMAIN.workers.dev";


/* =========================================================
   VARIABLES
   ========================================================= */

let verses = [];

let currentDay = 1;

let filteredDays = [];


/* =========================================================
   LOAD VERSES
   ========================================================= */

async function loadVerses(){

    const content =
        document.getElementById("content");

    try{

        const response =
            await fetch(API_URL + "/api/verses");

        if(!response.ok){

            throw new Error(
                "Unable to load verses"
            );

        }

        const data =
            await response.json();

        verses =
            Array.isArray(data) ? data : [];

        verses.sort(
            (a,b) =>
                Number(a.day) - Number(b.day)
        );

        createDaySelector();

        if(verses.length > 0){

            showDay(1);

        }else{

            content.innerHTML = `
                <div class="error">
                    No Bible verses have been added yet.
                </div>
            `;

        }

    }catch(error){

        console.error(error);

        content.innerHTML = `
            <div class="error">
                Unable to load Bible verses.
                <br><br>
                Please check your Cloudflare Worker connection.
            </div>
        `;

    }

}


/* =========================================================
   CREATE DAY SELECTOR
   ========================================================= */

function createDaySelector(){

    const select =
        document.getElementById("daySelect");

    select.innerHTML = "";

    for(let i=1;i<=365;i++){

        const option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            "Day " + i;

        select.appendChild(option);

    }

}


/* =========================================================
   FIND VERSE
   ========================================================= */

function getVerse(day){

    return verses.find(
        verse =>
            Number(verse.day) === Number(day)
    );

}


/* =========================================================
   SHOW DAY
   ========================================================= */

function showDay(day){

    day =
        Number(day);

    const verse =
        getVerse(day);

    if(!verse){

        document.getElementById("content").innerHTML = `
            <div class="error">
                Day ${day} has not been added yet.
            </div>
        `;

        return;

    }

    currentDay =
        day;

    document.getElementById("daySelect").value =
        day;

    document.getElementById("searchInput").value =
        "";

    document.getElementById("noResult").style.display =
        "none";

    renderVerse(verse);

}


/* =========================================================
   RENDER VERSE
   ========================================================= */

function renderVerse(verse){

    const content =
        document.getElementById("content");

    const reference =
        escapeHTML(
            verse.reference || ""
        );

    const english =
        escapeHTML(
            verse.english || ""
        );

    const sinhala =
        escapeHTML(
            verse.sinhala || ""
        );

    const tamil =
        escapeHTML(
            verse.tamil || ""
        );

    content.innerHTML = `

        <div class="day-title">

            <div class="day">
                DAY ${verse.day}
            </div>

            <h2>
                ${reference}
            </h2>

        </div>


        <div class="verse-card">

            <h3>
                🇬🇧 English — NIV
            </h3>

            <div
                class="verse-text"
                id="englishText">
                ${english}
            </div>

            <span
                class="reference">
                ${reference}
            </span>

            <button
                class="copy-btn"
                onclick="copyVerse('english')">
                📋 Copy English
            </button>

        </div>


        <div class="verse-card">

            <h3>
                🇱🇰 සිංහල — ROV
            </h3>

            <div
                class="verse-text sinhala"
                id="sinhalaText">
                ${sinhala}
            </div>

            <span
                class="reference">
                ${reference}
            </span>

            <button
                class="copy-btn"
                onclick="copyVerse('sinhala')">
                📋 Copy Sinhala
            </button>

        </div>


        <div class="verse-card">

            <h3>
                🇱🇰 தமிழ் — 1984
            </h3>

            <div
                class="verse-text tamil"
                id="tamilText">
                ${tamil}
            </div>

            <span
                class="reference">
                ${reference}
            </span>

            <button
                class="copy-btn"
                onclick="copyVerse('tamil')">
                📋 Copy Tamil
            </button>

        </div>

    `;

}


/* =========================================================
   COPY VERSE
   ========================================================= */

async function copyVerse(language){

    const verse =
        getVerse(currentDay);

    if(!verse)
        return;

    let text = "";

    if(language === "english"){

        text =
            (verse.english || "") +
            "\n\n" +
            (verse.reference || "");

    }

    if(language === "sinhala"){

        text =
            (verse.sinhala || "") +
            "\n\n" +
            (verse.reference || "");

    }

    if(language === "tamil"){

        text =
            (verse.tamil || "") +
            "\n\n" +
            (verse.reference || "");

    }

    try{

        await navigator.clipboard.writeText(text);

        showStatus("Copied!");

    }catch(error){

        fallbackCopy(text);

    }

}


/* =========================================================
   FALLBACK COPY
   ========================================================= */

function fallbackCopy(text){

    const textarea =
        document.createElement("textarea");

    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    document.body.appendChild(textarea);

    textarea.select();

    try{

        document.execCommand("copy");

        showStatus("Copied!");

    }catch(error){

        showStatus(
            "Copy failed"
        );

    }

    textarea.remove();

}


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function showStatus(message){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.style.display =
        "block";

    clearTimeout(
        window.copyTimer
    );

    window.copyTimer =
        setTimeout(
            () => {
                status.style.display =
                    "none";
            },
            1800
        );

}


/* =========================================================
   PREVIOUS DAY
   ========================================================= */

function previousDay(){

    if(currentDay > 1){

        showDay(
            currentDay - 1
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   NEXT DAY
   ========================================================= */

function nextDay(){

    if(currentDay < 365){

        showDay(
            currentDay + 1
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   SEARCH
   ========================================================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const query =
            this.value
            .trim()
            .toLowerCase();

        const noResult =
            document.getElementById(
                "noResult"
            );

        if(!query){

            noResult.style.display =
                "none";

            showDay(currentDay);

            return;

        }

        filteredDays =
            verses.filter(
                verse => {

                    const day =
                        String(
                            verse.day || ""
                        );

                    const reference =
                        String(
                            verse.reference || ""
                        ).toLowerCase();

                    return (
                        day.includes(query) ||
                        reference.includes(query)
                    );

                }
            );

        if(filteredDays.length === 0){

            document.getElementById(
                "content"
            ).innerHTML = "";

            noResult.style.display =
                "block";

            return;

        }

        noResult.style.display =
            "none";

        renderSearchResults(
            filteredDays
        );

    }
);


/* =========================================================
   SEARCH RESULTS
   ========================================================= */

function renderSearchResults(results){

    const content =
        document.getElementById(
            "content"
        );

    let html = "";

    results.forEach(verse => {

        html += `

            <div
                class="verse-card"
                onclick="showDay(${Number(verse.day)})"
                style="cursor:pointer">

                <h3>
                    Day ${Number(verse.day)}
                </h3>

                <div class="reference">
                    ${escapeHTML(
                        verse.reference || ""
                    )}
                </div>

                <div class="verse-text">
                    ${escapeHTML(
                        verse.english || ""
                    )}
                </div>

            </div>

        `;

    });

    content.innerHTML =
        html;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

loadVerses();

</script>

</body>
</html>
