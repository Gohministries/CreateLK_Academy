<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | AI Practice</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#155eef;--text:#172033;--muted:#667085;--b:#e4e7ec}
html,body{height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:var(--text)}

header{
height:48px;background:#fff;border-bottom:1px solid var(--b)
}
.header{
height:100%;max-width:500px;margin:auto;padding:0 12px;
display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:15px;font-weight:800;color:var(--p)}
.nav a{font-size:12px;font-weight:bold;color:var(--p);text-decoration:none}

main{
height:calc(100vh - 48px);
max-width:500px;margin:auto;padding:8px;
display:flex;flex-direction:column;gap:7px
}

.card{
background:#fff;border:1px solid var(--b);border-radius:13px;
padding:10px
}

/* TOP */

.top{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px
}

.box{
background:#f8faff;border:1px solid var(--b);
border-radius:10px;padding:8px;text-align:center
}

.box strong{display:block;font-size:18px}
.box span{font-size:9px;color:var(--muted)}

.plan{
margin-top:6px;text-align:center;
font-size:10px;font-weight:bold;
color:var(--p)
}

/* AI */

.ai{
display:flex;align-items:center;gap:9px
}

.ai img{
width:62px;height:62px;object-fit:cover;
border-radius:50%;border:2px solid #fff;
box-shadow:0 3px 10px #ccd5e8
}

.ai h3{font-size:13px;margin-bottom:3px}
.ai p{font-size:10px;color:var(--muted);line-height:1.3}

.speak{
width:auto;margin-top:5px;padding:5px 8px;
font-size:9px;background:#eef4ff;color:var(--p)
}

/* SETTINGS */

label{
font-size:10px;font-weight:bold;display:block;margin-bottom:5px
}

select{
width:100%;padding:9px;border:1px solid #d0d5dd;
border-radius:8px;background:#fff;font-size:12px
}

button{
border:0;border-radius:8px;padding:10px;
font-weight:bold;font-size:11px;cursor:pointer
}

.generate,.next{
width:100%;background:var(--p);color:#fff;margin-top:7px
}

button:disabled{opacity:.55}

/* QUESTION */

#questionCard{
display:none;flex:1;min-height:0
}

#questionArea{display:none}

.loading{
text-align:center;color:var(--muted);font-size:11px;padding:15px
}

.question{
font-size:15px;font-weight:bold;line-height:1.35;
margin-bottom:7px
}

.option{
width:100%;text-align:left;
background:#fff;border:1px solid #d0d5dd;
margin-top:5px;padding:8px
}

.option.correct{
background:#ecfdf3;border-color:#12b76a;color:#027a48
}

.option.wrong{
background:#fef3f2;border-color:#f04438;color:#b42318
}

.result{
display:none;margin-top:7px;padding:8px;
border-radius:8px;font-size:10px;line-height:1.4
}

.result.show{display:block}
.result.correct{background:#ecfdf3;color:#027a48}
.result.wrong{background:#fef3f2;color:#b42318}

/* PREMIUM */

.premium{
display:none;margin-top:7px;padding:10px;
border-radius:10px;background:#172554;color:#fff
}

.premium.show{display:block}
.premium h3{font-size:12px}
.premium p{font-size:9px;margin:3px 0}
.price{font-size:15px;font-weight:bold}

.premium button{
width:100%;margin-top:6px;background:#fff;color:var(--p)
}

.limit{
margin-top:5px;font-size:9px;text-align:center;color:#fed7aa
}

/* ERROR */

.error{
display:none;background:#fef3f2;color:#b42318;
padding:7px;border-radius:7px;font-size:9px
}

.error.show{display:block}

/* MOBILE */

@media(max-width:380px){
.ai img{width:52px;height:52px}
.question{font-size:14px}
.box strong{font-size:16px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<nav><a href="dashboard.html">Dashboard</a></nav>
</div>
</header>

<main>

<!-- PROGRESS -->
<div class="card">

<div class="top">

<div class="box">
<strong id="used">0</strong>
<span>Used</span>
</div>

<div class="box">
<strong id="remaining">10</strong>
<span>Remaining</span>
</div>

<div class="box">
<strong id="correct">0</strong>
<span>Correct</span>
</div>

</div>

<div class="plan" id="plan">FREE PLAN</div>

</div>

<!-- AI TEACHER -->
<div class="card">

<div class="ai">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI Teacher">

<div>
<h3>🤖 AI English Teacher</h3>

<p id="teacherMessage">
Hello! Let's practise English together.
</p>

<button class="speak" id="speakButton">
🔊 Speak
</button>
</div>

</div>

</div>

<!-- SETTINGS -->
<div class="card">

<label>CATEGORY</label>

<select id="category">
<option value="Mixed">🎯 Mixed</option>
<option>Adjectives</option>
<option>Adverbs</option>
<option>Articles</option>
<option>Conjunctions</option>
<option>Nouns</option>
<option>Prepositions</option>
<option>Pronouns</option>
<option>Tenses</option>
<option>Verbs</option>
<option>Vocabulary</option>
</select>

<button class="generate" id="generateBtn">
🤖 Generate Question
</button>

<div class="premium" id="premiumBox">

<h3>⭐ CreateLK Premium</h3>
<p>Unlock 100 AI questions every day.</p>
<div class="price">LKR 1,500</div>

<button id="premiumButton">
⭐ Get Premium
</button>

<div class="limit">
Daily free limit reached.
</div>

</div>

<div class="error" id="error"></div>

</div>

<!-- MCQ -->
<div class="card" id="questionCard">

<div class="loading" id="loading">
🤖 Generating question...
</div>

<div id="questionArea">

<div class="question" id="question"></div>

<div id="options"></div>

<div class="result" id="result"></div>

<button class="next" id="nextBtn" style="display:none">
Next Question →
</button>

</div>

</div>

</main>

<script>

const API="https://createlk-ai-mcq.createlk.workers.dev";
const CHECKOUT_API="https://createlk-payhere-checkout.createlk.workers.dev";
const KEY="createlk_student";

let student=null,studentId=null,currentQuestion=null,answered=false;
const $=id=>document.getElementById(id);

function error(x){
$("error").textContent=x;
$("error").classList.add("show");
}

function clearError(){
$("error").classList.remove("show");
}

function loadStudent(){

let s=sessionStorage.getItem(KEY)||localStorage.getItem(KEY);

if(!s){
location.replace("login.html");
return false;
}

try{

student=JSON.parse(s);

studentId=String(
student.id||
student.student_id||
student.user_id||
""
);

return !!studentId;

}catch{
location.replace("login.html");
return false;
}

}

loadStudent();

async function api(url,opt={}){

const r=await fetch(url,{
...opt,
headers:{
"Accept":"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
});

let d;

try{d=await r.json()}
catch{throw Error("Invalid server response")}

if(!r.ok){

let e=Error(d.message||d.error||"Request failed");
e.status=r.status;
throw e;

}

return d;
}

/* VOICE */

let lastSpeech="";

function speak(text){

if(!text)return;

lastSpeech=text;

if(!window.speechSynthesis)return;

speechSynthesis.cancel();

let u=new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=.92;

speechSynthesis.speak(u);

}

$("speakButton").onclick=()=>{

speak(
lastSpeech||
"Hello! I'm your AI English teacher. Let's practise English together."
);

};

/* PROGRESS */

function update(data){

let status=String(data.membership_status||"").toUpperCase();
let plan=String(data.plan||"").toUpperCase();

let premium=
data.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
plan==="PREMIUM";

$("plan").textContent=
premium?"⭐ PREMIUM":"FREE PLAN";

$("used").textContent=
Number(data.daily_used||0);

$("remaining").textContent=
Number(data.remaining||0);

$("correct").textContent=
Number(
data.correct_answers||
data.correct_count||
0
);

if(premium){

$("premiumBox").classList.remove("show");
$("generateBtn").disabled=false;
$("generateBtn").textContent="🤖 Generate Question";

}else if(Number(data.remaining)<=0){

$("premiumBox").classList.add("show");
$("generateBtn").disabled=true;
$("generateBtn").textContent="Daily Limit Reached";

}else{

$("premiumBox").classList.remove("show");
$("generateBtn").disabled=false;
$("generateBtn").textContent="🤖 Generate Question";

}

}

async function progress(){

try{

let d=await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);

if(d.success)update(d);

}catch(e){

console.log(e);

}

}

/* GENERATE */

async function generate(){

if(!studentId||$("generateBtn").disabled)return;

clearError();

let btn=$("generateBtn");

btn.disabled=true;
btn.textContent="⏳ Generating...";

$("questionCard").style.display="block";
$("loading").style.display="block";
$("questionArea").style.display="none";

answered=false;

try{

let category=$("category").value;

let d=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(studentId)}&category=${encodeURIComponent(category)}`
);

if(!d.success)
throw Error(d.message||"Could not generate question");

currentQuestion=d.question;

update(d);

showQuestion();

$("questionCard").scrollIntoView({
behavior:"smooth",
block:"nearest"
});

}catch(e){

if(
e.status===429||
/daily limit|limit of 10/i.test(e.message)
){

$("premiumBox").classList.add("show");
$("questionCard").style.display="none";

}else{

error(e.message||"Could not generate question");

}

btn.disabled=false;
btn.textContent="🤖 Generate Question";

}

}

/* SHOW QUESTION */

function showQuestion(){

$("loading").style.display="none";
$("questionArea").style.display="block";

$("question").textContent=
currentQuestion.question;

$("options").innerHTML="";

currentQuestion.options.forEach((text,i)=>{

let b=document.createElement("button");

b.className="option";

b.textContent=
`${String.fromCharCode(65+i)}. ${text}`;

b.onclick=()=>answer(i);

$("options").appendChild(b);

});

speak(currentQuestion.question);

}

/* ANSWER */

async function answer(selected){

if(answered)return;

answered=true;

let buttons=document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

try{

let d=await api(`${API}/api/mcq`,{
method:"POST",
body:JSON.stringify({
student_id:studentId,
question_id:currentQuestion.id,
answer:selected
})
});

if(!d.success)
throw Error(d.message||"Answer failed");

buttons.forEach((b,i)=>{

if(i===Number(d.correct_answer))
b.classList.add("correct");

if(i===selected&&!d.correct)
b.classList.add("wrong");

});

let ok=d.correct===true;

$("result").className=
"result show "+(ok?"correct":"wrong");

$("result").innerHTML=
`<b>${ok?"✓ Correct!":"✗ Incorrect"}</b><br>
${escapeHTML(d.explanation||"Review the correct answer.")}`;

$("nextBtn").style.display="block";

speak(
ok?
"Excellent! Your answer is correct.":
"Good try. Review the correct answer."
);

await progress();

}catch(e){

answered=false;
buttons.forEach(b=>b.disabled=false);
error(e.message||"Could not submit answer");

}

}

function escapeHTML(x){

let d=document.createElement("div");
d.textContent=String(x);
return d.innerHTML;

}

/* PAYMENT */

async function payment(){

if(!student?.email){

error("Please log in again.");
return;

}

let b=$("premiumButton");

b.disabled=true;
b.textContent="Connecting...";

try{

let r=await fetch(CHECKOUT_API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({

student_id:String(studentId),
first_name:student.first_name||student.name||"Student",
last_name:student.last_name||"",
email:student.email||"",
phone:student.phone||""

})
});

let d=await r.json();

if(!r.ok||!d.success)
throw Error(d.message||"Payment unavailable");

let form=document.createElement("form");

form.method="POST";
form.action=d.action||
"https://www.payhere.lk/pay/checkout";

Object.entries(d.payment||{}).forEach(([k,v])=>{

let input=document.createElement("input");

input.type="hidden";
input.name=k;
input.value=v??"";

form.appendChild(input);

});

document.body.appendChild(form);
form.submit();

}catch(e){

error(e.message||"Unable to start payment");

b.disabled=false;
b.textContent="⭐ Get Premium";

}

}

/* EVENTS */

$("generateBtn").onclick=generate;
$("nextBtn").onclick=generate;
$("premiumButton").onclick=payment;

/* START */

progress();

</script>

</body>
</html>
