<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English Practice</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--p:#155eef;
--v:#6d5dfc;
--t:#172033;
--m:#667085;
--b:#e4e7ec
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:var(--t);
overflow-x:hidden
}

.app{
width:100%;
max-width:430px;
min-height:100svh;
margin:auto;
padding:8px 10px 14px;
display:flex;
flex-direction:column;
gap:8px
}

header{
height:34px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:800;
color:var(--p)
}

.nav{
font-size:12px;
font-weight:bold;
color:var(--p);
text-decoration:none
}

.card{
background:#fff;
border:1px solid var(--b);
border-radius:14px;
padding:10px;
box-shadow:0 2px 10px #10182808
}

/* AI TEACHER */

.ai{
display:flex;
align-items:center;
gap:11px;
background:linear-gradient(135deg,#eef2ff,#f7f5ff);
border-color:#d9d6fe
}

.video{
width:112px;
height:112px;
flex:none;
border-radius:50%;
overflow:visible;
border:4px solid #fff;
box-shadow:0 0 0 2px #6d5dfc33,0 4px 15px #503cb433;
position:relative
}

.video img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
display:block
}

.live{
position:absolute;
right:-8px;
bottom:7px;
padding:4px 7px;
background:#fff;
border-radius:20px;
font-size:8px;
font-weight:800;
color:#12b76a;
box-shadow:0 2px 7px #0002
}

.live-dot{
display:inline-block;
width:6px;
height:6px;
border-radius:50%;
background:#12b76a;
margin-right:3px
}

.ai-info{
min-width:0
}

.ai-info h3{
font-size:15px;
color:#4338ca;
margin-bottom:5px
}

.ai-info p{
font-size:11px;
line-height:1.4;
color:var(--m)
}

.speak{
margin-top:7px;
padding:6px 9px;
border:0;
border-radius:7px;
background:#eef2ff;
color:#5b4ee8;
font-size:10px;
font-weight:bold
}

/* SETTINGS */

label{
display:block;
font-size:10px;
font-weight:800;
margin-bottom:5px
}

select{
width:100%;
height:36px;
padding:0 9px;
border:1px solid #d0d5dd;
border-radius:8px;
background:#fff;
font-size:12px
}

.help{
font-size:9px;
color:var(--m);
margin-top:4px
}

/* PROGRESS */

.daily{
margin-top:8px;
padding:8px;
border:1px solid #dce4ff;
border-radius:9px;
background:#f8f9ff
}

.progress-head,
.progress-sub{
display:flex;
justify-content:space-between;
font-size:10px
}

.progress-head{
font-weight:800;
color:#4338ca;
margin-bottom:5px
}

.progress-sub{
margin-top:4px;
color:var(--m)
}

.track{
height:7px;
background:#e4e7ec;
border-radius:20px;
overflow:hidden
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--v),#8b5cf6);
transition:.3s
}

.generate{
width:100%;
height:37px;
margin-top:8px;
border:0;
border-radius:8px;
background:var(--p);
color:#fff;
font-size:12px;
font-weight:bold
}

/* PREMIUM */

.premium{
display:none;
margin-top:7px;
padding:9px;
border-radius:9px;
background:#172554;
color:#fff;
font-size:10px
}

.premium.show{
display:block
}

.premium b{
font-size:12px
}

.premium button{
width:100%;
height:32px;
margin-top:6px;
border:0;
border-radius:7px;
background:#fff;
color:var(--p);
font-weight:bold;
font-size:10px
}

/* QUESTION */

.question-card{
min-height:210px
}

.loading{
padding:22px 8px;
text-align:center;
font-size:11px;
color:var(--m)
}

.meta{
display:flex;
justify-content:space-between;
font-size:9px;
font-weight:bold;
color:var(--m);
margin-bottom:7px
}

.meta span:last-child{
background:#f2f4f7;
padding:3px 6px;
border-radius:15px
}

.question{
font-size:16px;
font-weight:800;
line-height:1.4;
margin-bottom:9px
}

.options{
display:flex;
flex-direction:column;
gap:6px
}

.option{
width:100%;
min-height:41px;
padding:8px 10px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:12px;
text-align:left;
line-height:1.3
}

.option.correct{
background:#ecfdf3;
border-color:#12b76a;
color:#027a48
}

.option.wrong{
background:#fef3f2;
border-color:#f04438;
color:#b42318
}

.result{
display:none;
margin-top:7px;
padding:8px;
border-radius:8px;
font-size:10px;
line-height:1.45
}

.result.show{
display:block
}

.result.correct{
background:#ecfdf3;
color:#027a48
}

.result.wrong{
background:#fef3f2;
color:#b42318
}

.next{
display:none;
width:100%;
height:35px;
margin-top:7px;
border:0;
border-radius:8px;
background:var(--p);
color:#fff;
font-size:11px;
font-weight:bold
}

.error{
display:none;
margin-top:7px;
padding:7px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
font-size:10px
}

.error.show{
display:block
}

button:disabled{
opacity:.6
}

@media(max-width:370px){

.video{
width:96px;
height:96px
}

.ai-info h3{
font-size:13px
}

.ai-info p{
font-size:10px
}

.question{
font-size:15px
}

.option{
font-size:11px;
min-height:38px
}

}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="nav">Dashboard</a>
</header>


<!-- AI TEACHER -->

<div class="card ai">

<div class="video">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div class="live">
<span class="live-dot"></span>LIVE
</div>

</div>

<div class="ai-info">

<h3>🤖 AI English Teacher</h3>

<p id="teacherMessage">
Let's practise English together.
</p>

<button
class="speak"
id="speakButton"
type="button">
🔊 Speak
</button>

</div>

</div>


<!-- SETTINGS -->

<div class="card">

<label>CHOOSE LESSON</label>

<select id="category">

<option value="Mixed">🎯 Mixed English</option>
<option value="Adjectives">Adjectives</option>
<option value="Adverbs">Adverbs</option>
<option value="Articles">Articles</option>
<option value="Conjunctions">Conjunctions</option>
<option value="Nouns">Nouns</option>
<option value="Prepositions">Prepositions</option>
<option value="Pronouns">Pronouns</option>
<option value="Tenses">Tenses</option>
<option value="Verbs">Verbs</option>
<option value="Vocabulary">Vocabulary</option>

</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>


<!-- DAILY PROGRESS -->

<div class="daily">

<div class="progress-head">
<span>📊 Daily AI Progress</span>
<b id="progressText">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="progressFill"></div>
</div>

<div class="progress-sub">
<span id="usedText">0 used</span>
<span id="remainingText">10 remaining</span>
</div>

</div>


<button
class="generate"
id="generateBtn"
type="button">
🤖 Generate Question
</button>


<div
class="premium"
id="premiumBox">

<b>⭐ CreateLK Premium</b>

<div>100 AI questions/day • 30 Days</div>

<button
id="premiumButton"
type="button">
⭐ Get Premium — LKR 1,500
</button>

</div>


<div class="error" id="error"></div>

</div>


<!-- QUESTION -->

<div class="card question-card">

<div class="loading" id="loading">
Generate a question to begin.
</div>

<div id="questionArea" style="display:none">

<div class="meta">
<span id="questionNumber">Question</span>
<span id="questionCategory">Mixed</span>
</div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

<button
class="next"
id="nextBtn"
type="button">
Next Question →
</button>

</div>

</div>

</div>


<script>

const API=
"https://createlk-ai-mcq.createlk.workers.dev";

const CHECKOUT=
"https://createlk-payhere-checkout.createlk.workers.dev";

const KEY="createlk_student";

const $=id=>document.getElementById(id);

let student=null;
let studentId="";
let current=null;
let answered=false;
let speechText="";
let questionNo=0;


/* STUDENT */

function loadStudent(){

const saved=
sessionStorage.getItem(KEY)||
localStorage.getItem(KEY);

if(!saved)return false;

try{

student=JSON.parse(saved);

studentId=String(
student.id||
student.student_id||
student.user_id||
""
);

return !!studentId;

}catch{

return false;

}

}

if(!loadStudent())
location.replace("login.html");


/* API */

async function api(url,opt={}){

const res=await fetch(url,{
...opt,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
});

let data={};

try{
data=await res.json();
}catch{}

if(!res.ok)
throw new Error(
data.message||
data.error||
`Request failed (${res.status})`
);

return data;

}


/* ERROR */

function error(msg){

$("error").textContent=msg;
$("error").classList.add("show");

}

function clearError(){

$("error").classList.remove("show");

}


/* VOICE */

function speak(text){

speechText=String(text||"");

if(!("speechSynthesis" in window))
return;

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(
speechText.replace(/\s+/g," ").trim()
);

voice.lang="en-US";
voice.rate=.88;

setTimeout(
()=>speechSynthesis.speak(voice),
80
);

}

function teacher(text){

$("teacherMessage").textContent=text;
speak(text);

}

$("speakButton").onclick=
()=>speak(
speechText||
"Hello! I'm your AI English teacher. Let's practise English together."
);


/* CATEGORY */

const help={
Mixed:"Grammar, vocabulary and sentence practice.",
Adjectives:"Practise words that describe people and things.",
Adverbs:"Practise words that describe actions.",
Articles:"Practise a, an and the.",
Conjunctions:"Practise connecting words and sentences.",
Nouns:"Practise names of people, places and things.",
Prepositions:"Practise in, on, at, by and between.",
Pronouns:"Practise he, she, it, they and them.",
Tenses:"Practise past, present and future tenses.",
Verbs:"Practise action words and verb usage.",
Vocabulary:"Build stronger English vocabulary."
};

$("category").onchange=()=>{
$("help").textContent=
help[$("category").value]||help.Mixed;
};


/* PROGRESS */

function updateProgress(data){

const status=
String(data.membership_status||"").toUpperCase();

const plan=
String(data.plan||"").toUpperCase();

const premium=
data.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
plan==="PREMIUM";

let limit=Number(
data.daily_limit??
data.limit??
(premium?100:10)
);

let used=Number(
data.daily_used??
data.used??
data.today_used
);

let remaining=Number(
data.remaining??
data.remaining_today
);

if(!Number.isFinite(limit)||limit<1)
limit=premium?100:10;

if(!Number.isFinite(used)&&Number.isFinite(remaining))
used=limit-remaining;

if(!Number.isFinite(remaining)&&Number.isFinite(used))
remaining=limit-used;

if(!Number.isFinite(used)||
!Number.isFinite(remaining))
return;

used=Math.max(0,Math.min(limit,used));
remaining=Math.max(0,Math.min(limit,remaining));

$("progressText").textContent=
`${used} / ${limit}`;

$("progressFill").style.width=
`${Math.round(used/limit*100)}%`;

$("usedText").textContent=
`${used} used`;

$("remainingText").textContent=
`${remaining} remaining`;

if(!premium&&remaining<=0){

$("premiumBox").classList.add("show");
$("generateBtn").disabled=true;
$("generateBtn").textContent="Daily Limit Reached";

}else{

$("premiumBox").classList.remove("show");
$("generateBtn").disabled=false;
$("generateBtn").textContent="🤖 Generate Question";

}

return premium;

}


/* LOAD PROGRESS */

async function loadProgress(){

try{

const data=await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);

if(data.success!==true)
throw new Error(data.message||"Progress unavailable.");

updateProgress(data);

return data;

}catch(e){

console.error(e);
return null;

}

}

loadProgress();


/* GENERATE */

async function generate(){

if(!studentId||
$("generateBtn").disabled)
return;

clearError();

const btn=$("generateBtn");

btn.disabled=true;
btn.textContent="⏳ Generating...";

$("loading").style.display="block";
$("loading").textContent="Creating your question...";
$("questionArea").style.display="none";

answered=false;

try{

const progress=
await loadProgress();

if(progress){

const status=
String(progress.membership_status||"").toUpperCase();

const premium=
progress.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
String(progress.plan||"").toUpperCase()==="PREMIUM";

const remaining=
Number(progress.remaining??progress.remaining_today);

if(!premium&&
Number.isFinite(remaining)&&
remaining<=0){

$("premiumBox").classList.add("show");
$("generateBtn").disabled=true;
$("generateBtn").textContent="Daily Limit Reached";

teacher(
"You have reached your free daily limit. Upgrade to Premium to continue practising."
);

$("loading").textContent=
"Your free daily limit has been reached.";

return;

}

}

const category=
$("category").value;

const data=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(studentId)}&category=${encodeURIComponent(category)}`
);

if(!data.success||!data.question)
throw new Error(
data.message||"Question could not be generated."
);

current=data.question;
questionNo++;

showQuestion();

teacher(
"Here is your English question. Choose the best answer."
);

await loadProgress();

}catch(e){

console.error(e);

if(e.message.includes("429")){

await loadProgress();

$("premiumBox").classList.add("show");

teacher(
"You have reached your free daily limit. Upgrade to Premium to continue practising."
);

$("loading").textContent=
"Your free daily limit has been reached.";

}else{

error(e.message||"Could not generate question.");

btn.disabled=false;
btn.textContent="🤖 Generate Question";

}

}

}


/* SHOW QUESTION */

function showQuestion(){

$("loading").style.display="none";
$("questionArea").style.display="block";

$("questionNumber").textContent=
`Question ${questionNo}`;

$("questionCategory").textContent=
$("category").value;

$("question").textContent=
current.question;

$("options").innerHTML="";

$("result").className="result";
$("result").innerHTML="";

$("nextBtn").style.display="none";

if(!Array.isArray(current.options))
throw new Error("Invalid options.");

let read=
`Question. ${current.question}. `;

current.options.forEach(
(text,i)=>{

const b=
document.createElement("button");

b.className="option";
b.type="button";
b.textContent=
`${String.fromCharCode(65+i)}. ${text}`;

b.onclick=()=>answer(i);

$("options").appendChild(b);

read+=
`Option ${String.fromCharCode(65+i)}. ${text}. `;

});

speak(read);

}


/* ANSWER */

async function answer(selected){

if(answered||!current)
return;

answered=true;
clearError();

const buttons=
document.querySelectorAll(".option");

buttons.forEach(
b=>b.disabled=true
);

try{

const data=await api(
`${API}/api/mcq`,
{
method:"POST",
body:JSON.stringify({
student_id:studentId,
question_id:current.id,
answer:selected
})
}
);

if(!data.success)
throw new Error(
data.message||"Could not submit answer."
);

buttons.forEach(
(b,i)=>{

if(i===Number(data.correct_answer))
b.classList.add("correct");

if(i===selected&&data.correct!==true)
b.classList.add("wrong");

});

const correct=
data.correct===true;

const explanation=
data.explanation||
"Review the correct answer.";

$("result").className=
`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${escapeHTML(explanation)}`;

teacher(
`${correct?"Correct!":"Incorrect."} ${explanation}`
);

$("nextBtn").style.display="block";

await loadProgress();

}catch(e){

answered=false;

buttons.forEach(
b=>b.disabled=false
);

error(
e.message||"Could not submit answer."
);

}

}


/* ESCAPE */

function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=
String(text);

return div.innerHTML;

}


/* PREMIUM */

async function premiumPayment(){

if(!studentId||!student?.email){

error("Please log in again.");
return;

}

const btn=$("premiumButton");

btn.disabled=true;
btn.textContent="Connecting...";

const name=
student.name||
`${student.first_name||""} ${student.last_name||""}`.trim()||
"Student";

try{

const res=await fetch(
CHECKOUT,
{
method:"POST",
cache:"no-store",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
student_id:String(studentId),
first_name:student.first_name||name.split(" ")[0],
last_name:student.last_name||"",
email:student.email,
phone:student.phone||""
})
}
);

const data=await res.json();

if(!res.ok||data.success!==true)
throw new Error(
data.message||"Unable to create payment."
);

const form=
document.createElement("form");

form.method="POST";
form.action=
data.action||
"https://www.payhere.lk/pay/checkout";

Object.entries(data.payment||{}).forEach(
([key,value])=>{

const input=
document.createElement("input");

input.type="hidden";
input.name=key;
input.value=value??"";

form.appendChild(input);

});

document.body.appendChild(form);
form.submit();

}catch(e){

error(
"Unable to start payment. "+e.message
);

btn.disabled=false;
btn.textContent=
"⭐ Get Premium — LKR 1,500";

}

}


/* EVENTS */

$("generateBtn").onclick=
generate;

$("nextBtn").onclick=
generate;

$("premiumButton").onclick=
premiumPayment;

</script>

</body>
</html>
