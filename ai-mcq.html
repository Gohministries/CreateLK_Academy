<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Academy | Dashboard</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.5;
}

.app{
max-width:600px;
margin:auto;
min-height:100vh;
padding:14px;
}

header{
height:42px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.logo{
font-size:17px;
font-weight:900;
color:#155eef;
}

.logout{
border:0;
background:transparent;
color:#b42318;
font-size:12px;
font-weight:800;
cursor:pointer;
}

.card{
background:#fff;
border:1px solid #e4e7ec;
border-radius:16px;
padding:20px;
margin-bottom:12px;
box-shadow:0 5px 20px #1018280a;
}

.welcome h1{
font-size:23px;
margin-bottom:5px;
}

.welcome p{
font-size:13px;
color:#667085;
}

.course-icon{
font-size:38px;
margin-bottom:10px;
}

.course h2{
font-size:19px;
margin-bottom:5px;
}

.course p{
font-size:12px;
color:#667085;
margin-bottom:16px;
}

.btn{
width:100%;
height:43px;
display:flex;
align-items:center;
justify-content:center;
border-radius:9px;
background:#155eef;
color:#fff;
text-decoration:none;
font-size:13px;
font-weight:900;
}

.account-title{
font-size:17px;
margin-bottom:14px;
}

.account-row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #f2f4f7;
font-size:12px;
}

.account-row:last-child{
border-bottom:0;
}

.account-label{
color:#667085;
}

.account-value{
font-weight:800;
text-align:right;
word-break:break-word;
}

.active{
color:#027a48;
}

.inactive{
color:#b42318;
}

.error{
display:none;
margin-top:12px;
padding:10px;
border-radius:9px;
background:#fef3f2;
color:#b42318;
font-size:11px;
}

.error.show{
display:block;
}

footer{
text-align:center;
font-size:10px;
color:#98a2b3;
padding:20px 0;
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
📚 CreateLK Academy
</div>

<button
id="logout"
class="logout"
type="button">
Logout
</button>

</header>


<!-- WELCOME -->

<section class="card welcome">

<h1 id="welcome">
Welcome 👋
</h1>

<p>
Continue your English learning journey
with CreateLK Academy.
</p>

</section>


<!-- ONLY ONE COURSE NAVIGATION -->

<section class="card course">

<div class="course-icon">
📖
</div>

<h2>
365-Day English Course
</h2>

<p>
Daily English learning with lessons
from Day 1 to Day 365.
</p>

<a
href="365.html"
class="btn">
Open Course →
</a>

</section>


<!-- ACCOUNT -->

<section class="card">

<h2 class="account-title">
👤 My Account
</h2>

<div class="account-row">

<span class="account-label">
Student ID
</span>

<span
class="account-value"
id="studentId">
-
</span>

</div>


<div class="account-row">

<span class="account-label">
Email
</span>

<span
class="account-value"
id="email">
-
</span>

</div>


<div class="account-row">

<span class="account-label">
Membership
</span>

<span
class="account-value"
id="membership">
Checking...
</span>

</div>


<div class="account-row">

<span class="account-label">
Expiry
</span>

<span
class="account-value"
id="expiry">
-
</span>

</div>


<div
class="error"
id="error">
</div>

</section>


<footer>
© 2026 CreateLK Academy
</footer>

</div>


<script>

/* =========================
   CONFIG
========================= */

const API =
"https://createlk-course-api.createlk.workers.dev";

const STORAGE_KEY =
"createlk_student";


/* =========================
   HELPER
========================= */

const $ =
id => document.getElementById(id);


/* =========================
   GET LOGGED-IN STUDENT
========================= */

let student = null;

try{

student =
JSON.parse(
sessionStorage.getItem(STORAGE_KEY) ||
localStorage.getItem(STORAGE_KEY) ||
"null"
);

}catch(error){

student = null;

}


/* =========================
   STUDENT ID
========================= */

const studentId =
String(
student?.id ||
student?.student_id ||
student?.user_id ||
""
);


/* =========================
   LOGIN REQUIRED
========================= */

if(!studentId){

location.replace("login.html");

}


/* =========================
   BASIC INFORMATION
========================= */

$("studentId").textContent =
studentId;

$("email").textContent =
student?.email || "-";


const firstName =
student?.first_name ||
student?.name?.split(" ")[0] ||
"Student";


$("welcome").textContent =
`Welcome, ${firstName} 👋`;


/* =========================
   ERROR
========================= */

function showError(message){

$("error").textContent =
message;

$("error").classList.add("show");

}


/* =========================
   CHECK MEMBERSHIP
========================= */

async function checkMembership(){

try{

const response =
await fetch(
API +
"/api/course-access?student_id=" +
encodeURIComponent(studentId),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


let data;

try{

data =
await response.json();

}catch(error){

throw new Error(
"Invalid response from Course API."
);

}


if(!response.ok){

throw new Error(
data.message ||
"Unable to check membership."
);

}


if(data.success !== true){

throw new Error(
data.message ||
"Unable to check membership."
);

}


/* =========================
   MEMBERSHIP STATUS
========================= */

const status =
String(
data.membership_status || ""
).toUpperCase();


if(
status === "ACTIVE" ||
status === "PREMIUM"
){

$("membership").textContent =
status;

$("membership").className =
"account-value active";

}else{

/*
NONE, empty, expired, etc.
are displayed as INACTIVE.
*/

$("membership").textContent =
"INACTIVE";

$("membership").className =
"account-value inactive";

}


/* =========================
   EXPIRY
========================= */

if(data.membership_expiry){

const date =
new Date(
data.membership_expiry
);

if(
!isNaN(date.getTime())
){

$("expiry").textContent =
date.toLocaleString();

}else{

$("expiry").textContent =
data.membership_expiry;

}

}else{

$("expiry").textContent =
"Not active";

}

}catch(error){

$("membership").textContent =
"Unable to check";

$("membership").className =
"account-value inactive";

$("expiry").textContent =
"-";

showError(
error.message ||
"Unable to connect to Course API."
);

}

}


/* =========================
   LOGOUT
========================= */

$("logout").onclick =
function(){

sessionStorage.removeItem(
STORAGE_KEY
);

localStorage.removeItem(
STORAGE_KEY
);

location.replace(
"login.html"
);

};


/* =========================
   START
========================= */

checkMembership();

</script>

</body>
</html>
