<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English Practice</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--p:#155eef;
--text:#172033;
--muted:#667085;
--border:#e4e7ec;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:var(--text);
}

.app{
width:100%;
max-width:430px;
height:100svh;
margin:auto;
padding:7px 10px;
display:flex;
flex-direction:column;
gap:7px;
overflow:hidden;
}

/* HEADER */

header{
height:34px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5px;
}

.logo{
font-size:15px;
font-weight:800;
color:var(--p);
}

.nav{
font-size:11px;
font-weight:bold;
color:var(--p);
text-decoration:none;
}

/* CARDS */

.card{
background:#fff;
border:1px solid var(--border);
border-radius:15px;
padding:9px;
box-shadow:0 2px 8px rgba(16,24,40,.04);
}

/* PROGRESS */

.progress{
flex:none;
padding:8px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.stat{
text-align:center;
background:#f8faff;
border:1px solid var(--border);
border-radius:10px;
padding:6px 3px;
}

.stat strong{
display:block;
font-size:18px;
line-height:20px;
}

.stat span{
font-size:9px;
color:var(--muted);
}

.plan{
display:block;
text-align:center;
font-size:10px;
font-weight:bold;
color:var(--p);
margin-top:5px;
}

/* AI SECTION */

.ai{
flex:none;
display:flex;
align-items:center;
gap:9px;
padding:7px;
}

.video{
width:105px;
height:105px;
flex:none;
border-radius:12px;
overflow:hidden;
background:#111;
}

.video video{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.ai-info{
min-width:0;
}

.ai-info h3{
font-size:14px;
margin-bottom:4px;
}

.ai-info p{
font-size:10px;
line-height:1.35;
color:var(--muted);
}

.speak{
width:auto;
padding:6px 9px;
margin-top:6px;
font-size:10px;
background:#eef4ff;
color:var(--p);
border-radius:7px;
}

/* SETTINGS */

.settings{
flex:none;
padding:8px;
}

label{
display:block;
font-size:10px;
font-weight:bold;
margin-bottom:4px;
}

select{
width:100%;
height:35px;
border:1px solid #d0d5dd;
border-radius:9px;
padding:0 9px;
font-size:12px;
background:#fff;
}

button{
border:0;
font-weight:bold;
cursor:pointer;
}

.generate{
width:100%;
height:36px;
margin-top:6px;
border-radius:9px;
background:var(--p);
color:#fff;
font-size:12px;
}

/* QUESTION */

.question-card{
flex:1;
min-height:0;
overflow:hidden;
padding:10px;
display:flex;
flex-direction:column;
}

.question{
font-size:16px;
font-weight:800;
line-height:1.3;
margin-bottom:6px;
}

.options{
display:flex;
flex-direction:column;
gap:5px;
}

.option{
width:100%;
min-height:39px;
padding:6px 9px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:11px;
text-align:left;
line-height:1.25;
}

.option.correct{
background:#ecfdf3;
border-color:#12b76a;
color:#027a48;
}

.option.wrong{
background:#fef3f2;
border-color:#f04438;
color:#b42318;
}

.result{
display:none;
margin-top:6px;
padding:7px;
border-radius:8px;
font-size:10px;
line-height:1.35;
}

.result.show{
display:block;
}

.result.correct{
background:#ecfdf3;
color:#027a48;
}

.result.wrong{
background:#fef3f2;
color:#b42318;
}

.next{
width:100%;
height:34px;
margin-top:6px;
border-radius:8px;
background:var(--p);
color:#fff;
font-size:11px;
display:none;
}

.loading{
text-align:center;
color:var(--muted);
font-size:11px;
padding:15px;
}

/* ERROR */

.error{
display:none;
font-size:10px;
padding:7px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
}

.error.show{
display:block;
}

/* PREMIUM */

.premium{
display:none;
padding:8px;
margin-top:6px;
border-radius:9px;
background:#172554;
color:#fff;
font-size:10px;
}

.premium.show{
display:block;
}

.premium button{
margin-top:6px;
width:100%;
height:32px;
border-radius:7px;
color:var(--p);
background:#fff;
font-size:10px;
}

/* SMALL HEIGHT PHONES */

@media(max-height:700px){

.app{
gap:5px;
padding:5px 8px;
}

header{
height:28px;
}

.video{
width:88px;
height:88px;
}

.ai{
padding:5px;
}

.card{
border-radius:12px;
padding:7px;
}

.question{
font-size:14px;
}

.option{
min-height:34px;
font-size:10px;
}

.generate{
height:33px;
}

}

</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a class="nav" href="dashboard.html">Dashboard</a>
</header>

<!-- PROGRESS -->

<div class="card progress">

<div class="stats">

<div class="stat">
<strong id="used">0</strong>
<span>Used</span>
</div>

<div class="stat">
<strong id="remaining">10</strong>
<span>Remaining</span>
</div>

<div class="stat">
<strong id="correct">0</strong>
<span>Correct</span>
</div>

</div>

<span class="plan" id="plan">FREE PLAN</span>

</div>


<!-- AI TEACHER + 1:1 VIDEO -->

<div class="card ai">

<div class="video">

<video
id="teacherVideo"
src="https://assets.createlk.com/InShot_20260816_123502666.mp4"
muted
loop
playsinline
preload="auto">
</video>

</div>

<div class="ai-info">

<h3>🤖 AI English Teacher</h3>

<p id="teacherMessage">
Hello! Let's practise English together.
</p>

<button
class="speak"
id="speakButton"
type="button">
🔊 Speak
</button>

</div>

</div>


<!-- SETTINGS -->

<div class="card settings">

<label>CATEGORY</label>

<select id="category">

<option value="Mixed">🎯 Mixed</option>
<option value="Adjectives">Adjectives</option>
<option value="Adverbs">Adverbs</option>
<option value="Articles">Articles</option>
<option value="Conjunctions">Conjunctions</option>
<option value="Nouns">Nouns</option>
<option value="Prepositions">Prepositions</option>
<option value="Pronouns">Pronouns</option>
<option value="Tenses">Tenses</option>
<option value="Verbs">Verbs</option>
<option value="Vocabulary">Vocabulary</option>

</select>

<button
class="generate"
id="generateBtn">
🤖 Generate Question
</button>

<div class="premium" id="premiumBox">

<b>⭐ CreateLK Premium</b>

<div style="margin-top:3px">
100 AI questions/day • Certificate • 30 Days
</div>

<button id="premiumButton">
⭐ Get Premium — LKR 1,500
</button>

</div>

<div class="error" id="error"></div>

</div>


<!-- QUESTION -->

<div class="card question-card" id="questionCard">

<div class="loading" id="loading">
Generate a question to begin.
</div>

<div id="questionArea" style="display:none">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

<button
class="next"
id="nextBtn">
Next Question
</button>

</div>

</div>

</div>


<script>

const API=
"https://createlk-ai-mcq.createlk.workers.dev";

const CHECKOUT_API=
"https://createlk-payhere-checkout.createlk.workers.dev";

const STUDENT_KEY="createlk_student";

let student=null;
let studentId=null;
let currentQuestion=null;
let answered=false;

const $=id=>document.getElementById(id);


/* STUDENT */

function loadStudent(){

const stored=
sessionStorage.getItem(STUDENT_KEY)||
localStorage.getItem(STUDENT_KEY);

if(!stored)return false;

try{

student=JSON.parse(stored);

studentId=
student?.id||
student?.student_id||
student?.user_id||
null;

if(studentId)
studentId=String(studentId);

return !!studentId;

}catch{

return false;

}

}

if(!loadStudent()){
location.replace("login.html");
}


/* API */

async function api(url,options={}){

const res=await fetch(url,{
...options,
headers:{
"Accept":"application/json",
"Content-Type":"application/json",
...(options.headers||{})
}
});

let data;

try{
data=await res.json();
}catch{
throw new Error("Invalid server response.");
}

if(!res.ok){

const e=new Error(
data.message||
data.error||
`Request failed (${res.status})`
);

e.status=res.status;

throw e;

}

return data;

}


/* ERROR */

function showError(text){

$("error").textContent=text;
$("error").classList.add("show");

}

function hideError(){

$("error").classList.remove("show");

}


/* VIDEO */

const video=$("teacherVideo");

video.play().catch(()=>{});

document.addEventListener("visibilitychange",()=>{

if(document.hidden){

video.pause();

}else{

video.play().catch(()=>{});

}

});


/* VOICE */

let lastSpeech="";

function speak(text){

if(!text)return;

lastSpeech=String(text);

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(lastSpeech);

u.lang="en-US";
u.rate=.92;
u.pitch=1;

speechSynthesis.speak(u);

}

function teacherSpeak(text){

$("teacherMessage").textContent=text;
speak(text);

}

$("speakButton").onclick=()=>{

speak(
lastSpeech||
"Hello! I'm your AI English teacher. Let's practise English together."
);

};


/* STATS */

function updateStats(data){

const status=
String(data.membership_status||"").toUpperCase();

const plan=
String(data.plan||"").toUpperCase();

const premium=
data.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
plan==="PREMIUM";

$("plan").textContent=
premium?"PREMIUM PLAN":"FREE PLAN";

$("used").textContent=
Number(data.daily_used||0);

$("remaining").textContent=
Number(data.remaining||0);

$("correct").textContent=
Number(
data.correct_answers??
data.correct_count??
0
);

if(!premium&&Number(data.remaining)<=0){

$("premiumBox").classList.add("show");

$("generateBtn").disabled=true;

$("generateBtn").textContent=
"Daily Limit Reached";

}else{

$("premiumBox").classList.remove("show");

$("generateBtn").disabled=false;

$("generateBtn").textContent=
"🤖 Generate Question";

}

}


/* PROGRESS */

async function loadProgress(){

try{

const data=await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);

if(data.success)
updateStats(data);

}catch(e){

console.error(e);

}

}


/* GENERATE */

async function generateQuestion(){

if(
!studentId||
$("generateBtn").disabled
)return;

hideError();

const btn=$("generateBtn");

btn.disabled=true;
btn.textContent="⏳ Generating...";

$("questionCard").style.display="flex";

$("loading").style.display="block";

$("questionArea").style.display="none";

answered=false;

try{

const category=
$("category").value;

const data=await api(

`${API}/api/mcq?student_id=${
encodeURIComponent(studentId)
}&category=${
encodeURIComponent(category)
}`

);

if(!data.success){

throw new Error(
data.message||
"Could not generate question."
);

}

currentQuestion=data.question;

updateStats(data);

displayQuestion();

teacherSpeak(
"Here is your English question. Choose the best answer."
);

}catch(e){

console.error(e);

if(
e.status===429||
String(e.message).toLowerCase().includes("limit")
){

$("premiumBox").classList.add("show");

}

showError(
e.message||
"Could not generate question."
);

btn.disabled=false;
btn.textContent="🤖 Generate Question";

}

}


/* DISPLAY */

function displayQuestion(){

$("loading").style.display="none";

$("questionArea").style.display="block";

$("question").textContent=
currentQuestion.question;

$("options").innerHTML="";

$("result").className="result";

$("nextBtn").style.display="none";

currentQuestion.options.forEach(
(text,index)=>{

const b=
document.createElement("button");

b.className="option";

b.textContent=
`${String.fromCharCode(65+index)}. ${text}`;

b.onclick=()=>submitAnswer(index);

$("options").appendChild(b);

});

speak(currentQuestion.question);

}


/* ANSWER */

async function submitAnswer(selected){

if(answered||!currentQuestion)return;

answered=true;

const buttons=
document.querySelectorAll(".option");

buttons.forEach(
b=>b.disabled=true
);

try{

const data=await api(

`${API}/api/mcq`,

{
method:"POST",

body:JSON.stringify({

student_id:studentId,

question_id:currentQuestion.id,

answer:selected

})

}

);

if(!data.success){

throw new Error(
data.message||
"Could not submit answer."
);

}

buttons.forEach(
(button,index)=>{

if(
index===Number(data.correct_answer)
)
button.classList.add("correct");

if(
index===selected&&
data.correct!==true
)
button.classList.add("wrong");

});

const correct=
data.correct===true;

$("result").className=
"result show "+
(correct?"correct":"wrong");

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>
${escapeHTML(
data.explanation||
"Review the correct answer."
)}`;

teacherSpeak(
correct?
"Excellent! Your answer is correct.":
"Good try. Review the correct answer."
);

$("nextBtn").style.display="block";

await loadProgress();

}catch(e){

answered=false;

buttons.forEach(
b=>b.disabled=false
);

showError(
e.message||
"Could not submit answer."
);

}

}


/* ESCAPE */

function escapeHTML(text){

const d=document.createElement("div");

d.textContent=String(text);

return d.innerHTML;

}


/* PAYHERE */

async function startPremiumPayment(){

loadStudent();

if(!student?.email){

showError("Please log in again.");

return;

}

const button=$("premiumButton");

button.disabled=true;
button.textContent="Connecting...";

const name=
student.name||
`${student.first_name||""} ${student.last_name||""}`
.trim()||
"Student";

try{

const res=await fetch(
CHECKOUT_API,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

student_id:String(studentId),

first_name:
student.first_name||
name.split(" ")[0]||
"Student",

last_name:
student.last_name||"",

email:
student.email||"",

phone:
student.phone||""

})
}
);

const data=await res.json();

if(!res.ok||data.success!==true)
throw new Error(
data.message||
"Unable to create payment."
);

const form=
document.createElement("form");

form.method="POST";

form.action=
data.action||
"https://www.payhere.lk/pay/checkout";

Object.entries(data.payment||{})
.forEach(([key,value])=>{

const input=
document.createElement("input");

input.type="hidden";
input.name=key;
input.value=value??"";

form.appendChild(input);

});

document.body.appendChild(form);

form.submit();

}catch(e){

showError(
"Unable to start payment. "+e.message
);

button.disabled=false;

button.textContent=
"⭐ Get Premium — LKR 1,500";

}

}


/* EVENTS */

$("generateBtn").onclick=
generateQuestion;

$("nextBtn").onclick=
generateQuestion;

$("premiumButton").onclick=
startPremiumPayment;


/* START */

loadProgress();

</script>

</body>
</html>
