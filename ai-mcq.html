<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | English Mastery</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#155eef;--p:#7c3aed;--g:#12b76a;--r:#f04438;--t:#172033;--m:#667085;--bd:#e4e7ec;--bg:#f5f7fb}
body{font-family:Arial;background:var(--bg);color:var(--t)}
.app{max-width:430px;margin:auto;padding:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:15px;padding:13px;margin-bottom:10px}
.logo{font-size:16px;font-weight:900;color:var(--b);margin-bottom:12px}
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#eef2ff,#faf5ff)}
.hero img{width:65px;height:65px;border-radius:50%;object-fit:cover}
h1{font-size:17px;color:#4338ca}
p,small{font-size:10px;color:var(--m);line-height:1.5}
.title{font-size:15px;font-weight:900;margin-bottom:10px}
.head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.bar{height:8px;background:#e4e7ec;border-radius:20px;margin-top:7px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--b),var(--p));width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.stat{text-align:center;background:#f8f9fc;padding:8px;border-radius:9px}
.stat b{display:block;font-size:14px}
.months{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{cursor:pointer}
.month,.lesson,.option{
 width:100%;background:#fff;border:1px solid var(--bd);
 border-radius:9px;padding:10px;text-align:left
}
.month b,.lesson b{font-size:11px}
.month small,.lesson small{display:block;margin-top:3px}
.lesson{margin-top:6px}
.lesson.done{background:#ecfdf3;border-color:#a6f4c5}
.lesson.current{background:#f5f3ff;border-color:#a5b4fc}
.lesson.locked{opacity:.5}
.back{border:0;background:#eef2ff;color:#5146d8;padding:8px 12px;border-radius:8px;font-weight:900}
#lessonList,#lessonPage{display:none}
.lessonTitle{font-size:19px;font-weight:900;margin-top:10px}
.tabs{display:flex;gap:5px;margin:12px 0}
.tab{flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-weight:900}
.tab.active{background:var(--b);color:#fff}
.panel{display:none}.panel.show{display:block}
.learn{background:#f8f9ff;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}
.word{padding:9px;border:1px solid var(--bd);border-radius:8px;margin-top:6px}
.word b{color:var(--b)}
.question{background:#f8f9fc;padding:11px;border-radius:10px;margin-bottom:8px}
.question p{font-size:12px;font-weight:900;color:var(--t)}
.option{margin-top:5px;font-size:10px}
.correct{background:#ecfdf3!important;border-color:var(--g)!important}
.wrong{background:#fef3f2!important;border-color:var(--r)!important}
.btn{width:100%;border:0;border-radius:9px;padding:12px;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;font-weight:900;margin-top:8px}
.result{display:none;padding:10px;text-align:center;font-size:10px;margin-top:8px;border-radius:8px}
.result.show{display:block}
.good{background:#ecfdf3;color:#027a48}
.bad{background:#fef3f2;color:#b42318}
</style>
</head>

<body>
<div class="app">

<div class="logo">📚 CreateLK Academy</div>

<div id="home">

<section class="card hero">
<img src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png">
<div>
<h1>🤖 English Mastery</h1>
<p>365 daily English lessons with a daily assessment.</p>
</div>
</section>

<section class="card">
<div class="title">📈 Course Progress</div>

<div class="head">
<span>Completed</span>
<span id="progressText">0 / 365</span>
</div>

<div class="bar">
<div class="fill" id="courseFill"></div>
</div>

<div class="stats">
<div class="stat"><b id="completed">0</b><small>Lessons</small></div>
<div class="stat"><b id="questions">0</b><small>Questions</small></div>
<div class="stat"><b id="average">0%</b><small>Average</small></div>
<div class="stat"><b id="daysLeft">365</b><small>Days Left</small></div>
</div>
</section>

<section class="card">
<div class="title">📅 Today's Assessment</div>

<div class="head">
<span id="todayTitle">Day 1</span>
<span id="todayStatus">Not completed</span>
</div>

<div class="bar">
<div class="fill" id="dailyFill"></div>
</div>
</section>

<section class="card">
<div class="title">📚 12-Month Programme</div>
<div class="months" id="months"></div>
</section>

</div>

<section class="card" id="lessonList">
<button class="back" onclick="home()">← Back</button>
<div class="title" id="monthTitle"></div>
<div id="lessonItems"></div>
</section>

<section class="card" id="lessonPage">

<button class="back" onclick="month()">← Lessons</button>

<div class="lessonTitle" id="lessonTitle"></div>
<small id="lessonMeta"></small>

<div class="tabs">
<button class="tab active" onclick="tab('learn',this)">📖 Learn</button>
<button class="tab" onclick="tab('vocab',this)">🧠 Words</button>
<button class="tab" onclick="tab('quiz',this)">✍️ Daily Assessment</button>
</div>

<div class="panel show" id="learn">
<div class="learn">
<b id="explanation">Loading...</b>
<div id="examples"></div>
</div>
</div>

<div class="panel" id="vocab"></div>

<div class="panel" id="quiz">
<div id="questionsBox"></div>
<div class="result" id="result"></div>
<button class="btn" id="complete" disabled>
Complete Daily Assessment
</button>
</div>

</section>

</div>

<script>

const API="https://createlk-ai-mcq.createlk.workers.dev";
const KEY="createlk_student";
const DAYS=365;

let student,currentDay=0,currentMonth=0;
let progress={};
let lesson=null;
let score=0;
let answered=0;

const $=x=>document.getElementById(x);

try{
 student=JSON.parse(
  sessionStorage.getItem(KEY)||
  localStorage.getItem(KEY)||"null"
 );
}catch(e){}

if(!student)location.href="login.html";

const studentId=String(
 student?.id||student?.student_id||student?.user_id||""
);

const months=[
["Month 1","Beginner English",1,30],
["Month 2","Grammar Foundations",31,60],
["Month 3","Nouns & Pronouns",61,90],
["Month 4","Verbs & Tenses",91,120],
["Month 5","Adjectives & Adverbs",121,150],
["Month 6","Prepositions",151,180],
["Month 7","Sentence Building",181,210],
["Month 8","Conversation",211,240],
["Month 9","Vocabulary",241,270],
["Month 10","Reading",271,300],
["Month 11","Writing",301,330],
["Month 12","Review",331,365]
];

const topics=[
"Introducing Yourself","Greetings","Family","Daily Routine",
"Time and Dates","Numbers","Food and Drinks","Places",
"Shopping","Weather","Common Questions","Everyday Verbs",
"Nouns","Pronouns","Articles","Plural Nouns","Possessives",
"Present Simple","Present Continuous","Past Simple","Past Continuous",
"Future Forms","Modal Verbs","Adjectives","Adverbs",
"Comparatives","Superlatives","Prepositions","Conjunctions",
"Sentence Structure","Questions","Negative Sentences","Conversation",
"Travel English","Workplace English","Telephone English",
"Vocabulary Building","Reading Practice","Writing Practice","Review"
];

async function api(url,opt={}){
 const r=await fetch(url,{
  ...opt,
  cache:"no-store",
  headers:{
   "Content-Type":"application/json",
   ...(opt.headers||{})
  }
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.message||d.error||"Request failed");
 return d;
}

async function load(){
 try{
  progress=await api(
   `${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
  );
  update();
 }catch(e){
  console.log(e);
 }
}

function completed(){
 return Number(
  progress.completed_days||
  progress.completed||
  progress.completedLessons||
  progress.progress?.completed_days||
  0
 );
}

function update(){

 const done=Math.min(DAYS,completed());
 const percent=Math.round(done/DAYS*100);

 $("progressText").textContent=`${done} / ${DAYS}`;
 $("courseFill").style.width=percent+"%";
 $("completed").textContent=done;
 $("questions").textContent=
  progress.questions||
  progress.total_questions||
  0;
 $("average").textContent=
  Math.round(progress.average_score||progress.average||0)+"%";
 $("daysLeft").textContent=DAYS-done;

 $("todayTitle").textContent=`Day ${Math.min(DAYS,done+1)}`;

 const today=
  progress.today_completed===true||
  progress.daily_completed===true;

 $("todayStatus").textContent=
  today?"Completed ✓":"Not completed";

 $("dailyFill").style.width=today?"100%":"0%";
}

function renderMonths(){

 $("months").innerHTML="";

 months.forEach((m,i)=>{
  const b=document.createElement("button");
  b.className="month";
  b.innerHTML=`<b>${m[0]}</b><small>${m[1]} · Days ${m[2]}–${m[3]}</small>`;
  b.onclick=()=>openMonth(i);
  $("months").appendChild(b);
 });

}

function openMonth(i){

 currentMonth=i;

 $("home").style.display="none";
 $("lessonList").style.display="block";
 $("lessonPage").style.display="none";

 const m=months[i];

 $("monthTitle").textContent=`${m[0]} — ${m[1]}`;

 const list=$("lessonItems");
 list.innerHTML="";

 const done=completed();
 const next=done+1;

 for(let d=m[2];d<=m[3];d++){

  const b=document.createElement("button");
  b.className="lesson";

  if(d<=done)b.classList.add("done");
  if(d===next)b.classList.add("current");
  if(d>next)b.classList.add("locked");

  b.innerHTML=
   `<b>${d<=done?"✓ ":d>next?"🔒 ":""}Day ${d} — ${topic(d)}</b>
    <small>${d<=done?"Completed":d===next?"Start lesson":"Locked"}</small>`;

  b.onclick=()=>{
   if(d<=next)openLesson(d);
   else alert("Complete the previous daily assessment first.");
  };

  list.appendChild(b);
 }
}

async function openLesson(day){

 currentDay=day;
 score=0;
 answered=0;
 lesson=null;

 $("lessonList").style.display="none";
 $("lessonPage").style.display="block";

 $("lessonTitle").textContent=
  `Day ${day} — ${topic(day)}`;

 $("lessonMeta").textContent=
  `Daily English Lesson ${day} / ${DAYS}`;

 $("explanation").textContent="Loading...";
 $("examples").innerHTML="";
 $("vocab").innerHTML="";
 $("questionsBox").innerHTML="";
 $("result").className="result";
 $("complete").disabled=true;

 try{

  lesson=await api(
   `${API}/api/lesson?student_id=${encodeURIComponent(studentId)}&day=${day}`
  );

  $("explanation").textContent=
   lesson.explanation||
   lesson.lesson||
   lesson.content||
   `Learn about ${topic(day)}.`;

  $("examples").innerHTML=
   lesson.example||
   lesson.examples||
   "";

  renderVocab(lesson.vocabulary||lesson.words||[]);
  renderQuiz(
   lesson.questions||
   lesson.quiz||
   []
  );

 }catch(e){

  $("explanation").textContent=
   `Today's lesson: ${topic(day)}.`;

  $("questionsBox").innerHTML=
   "<p>Daily assessment is unavailable right now.</p>";
 }
}

function renderVocab(words){

 const box=$("vocab");
 box.innerHTML="";

 words.forEach(w=>{
  const d=document.createElement("div");
  d.className="word";
  d.innerHTML=
   `<b>${w.word||w.term||""}</b>
    <p>${w.meaning||w.definition||""}</p>`;
  box.appendChild(d);
 });
}

function renderQuiz(qs){

 const box=$("questionsBox");
 box.innerHTML="";

 if(!qs.length){
  box.innerHTML="<p>No assessment questions available.</p>";
  return;
 }

 qs.forEach((q,i)=>{

  const div=document.createElement("div");
  div.className="question";

  div.innerHTML=
   `<p>${i+1}. ${q.question}</p>`;

  (q.options||[]).forEach((option,j)=>{

   const b=document.createElement("button");
   b.className="option";
   b.textContent=option;

   b.onclick=()=>answer(
    b,
    q,
    option,
    div
   );

   div.appendChild(b);
  });

  box.appendChild(div);
 });
}

function answer(button,q,answer,box){

 if(box.dataset.done)return;

 box.dataset.done="1";
 answered++;

 const correct=
  String(answer).trim().toLowerCase()===
  String(
   q.answer||
   q.correct_answer||
   q.correct||
   ""
  ).trim().toLowerCase();

 if(correct){
  button.classList.add("correct");
  score++;
 }else{
  button.classList.add("wrong");

  [...box.querySelectorAll(".option")].forEach(b=>{
   if(b.textContent.trim().toLowerCase()===
      String(q.answer||q.correct_answer||"").trim().toLowerCase())
    b.classList.add("correct");
  });
 }

 if(answered>=
    document.querySelectorAll(".question").length){

  const total=document.querySelectorAll(".question").length;
  const percent=Math.round(score/total*100);

  $("result").textContent=
   `Daily Assessment: ${score}/${total} (${percent}%)`;

  $("result").className=
   "result show "+(percent>=70?"good":"bad");

  $("complete").disabled=false;
 }
}

$("complete").onclick=async()=>{

 if(!lesson)return;

 const total=document.querySelectorAll(".question").length;
 const percent=Math.round(score/total*100);

 if(percent<70){
  alert("You need at least 70% to complete today's assessment.");
  return;
 }

 try{

  await api(`${API}/api/progress`,{
   method:"POST",
   body:JSON.stringify({
    student_id:studentId,
    day:currentDay,
    score:percent,
    questions:total,
    completed:true,
    assessment:"daily"
   })
  });

  alert(`Day ${currentDay} completed ✓`);

  await load();
  openMonth(currentMonth);

 }catch(e){
  alert(e.message);
 }
};

function tab(name,button){

 document.querySelectorAll(".panel")
  .forEach(x=>x.classList.remove("show"));

 document.querySelectorAll(".tab")
  .forEach(x=>x.classList.remove("active"));

 $(name).classList.add("show");
 button.classList.add("active");
}

function home(){

 $("lessonList").style.display="none";
 $("lessonPage").style.display="none";
 $("home").style.display="block";
 load();
}

function month(){

 $("lessonPage").style.display="none";
 $("lessonList").style.display="block";
 openMonth(currentMonth);
}

renderMonths();
load();

</script>
</body>
</html>
