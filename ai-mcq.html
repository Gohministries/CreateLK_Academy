<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#155eef;
--purple:#6941c6;
--text:#172033;
--muted:#667085;
--border:#e4e7ec;
--green:#12b76a;
--red:#f04438;
--bg:#f3f5f9
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text)
}

.app{
width:100%;
max-width:430px;
height:100svh;
margin:auto;
padding:8px 10px;
display:flex;
flex-direction:column;
gap:7px;
overflow:hidden
}

/* HEADER */

header{
height:32px;
min-height:32px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:16px;
font-weight:900;
color:var(--blue)
}

.nav{
color:var(--blue);
font-size:11px;
font-weight:800;
text-decoration:none
}

/* TEACHER */

.teacher{
height:76px;
min-height:76px;
display:flex;
align-items:center;
gap:10px;
padding:8px 10px;
border:1px solid #d9d6fe;
border-radius:13px;
background:linear-gradient(135deg,#eef4ff,#f8f5ff)
}

.teacher img{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
border:3px solid #fff;
flex:none
}

.teacher-info{
min-width:0
}

.teacher h2{
font-size:14px;
color:#4338ca;
white-space:nowrap
}

.teacher p{
font-size:10px;
color:var(--muted);
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.listen{
margin-top:4px;
height:24px;
padding:0 9px;
border:0;
border-radius:7px;
background:#fff;
color:var(--purple);
font-size:9px;
font-weight:800;
cursor:pointer
}

/* MIDDLE WHITE BOARD */

.board{
flex:1;
min-height:0;
background:#fff;
border:1px solid var(--border);
border-radius:15px;
box-shadow:0 3px 14px rgba(16,24,40,.07);
display:flex;
flex-direction:column;
overflow:hidden
}

.board-head{
height:36px;
min-height:36px;
padding:0 12px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #f0f1f3
}

.qnum{
font-size:10px;
font-weight:900;
color:var(--muted)
}

.badge{
font-size:9px;
font-weight:900;
padding:4px 8px;
border-radius:20px;
background:#f2f4f7;
color:#475467
}

.board-body{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
padding:13px
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
font-size:11px
}

.question{
font-size:17px;
font-weight:800;
line-height:1.45;
margin-bottom:14px
}

.options{
display:flex;
flex-direction:column;
gap:8px
}

.option{
width:100%;
min-height:43px;
padding:9px 11px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
color:var(--text);
font-size:12px;
line-height:1.4;
text-align:left;
cursor:pointer
}

.option:active{
transform:scale(.99)
}

.option:disabled{
cursor:default
}

.option.correct{
background:#ecfdf3;
border-color:var(--green);
color:#027a48
}

.option.wrong{
background:#fef3f2;
border-color:var(--red);
color:#b42318
}

.result{
display:none;
margin-top:10px;
padding:10px;
border-radius:9px;
font-size:10px;
line-height:1.55
}

.result.show{
display:block
}

.result.correct{
background:#ecfdf3;
color:#027a48
}

.result.wrong{
background:#fef3f2;
color:#b42318
}

/* NEXT BUTTON ALWAYS INSIDE BOARD */

.next{
display:none;
height:38px;
min-height:38px;
margin:0 12px 10px;
border:0;
border-radius:9px;
background:var(--purple);
color:#fff;
font-size:11px;
font-weight:900;
cursor:pointer
}

.next.show{
display:block
}

/* CONTROLS */

.controls{
flex:none;
background:#fff;
border:1px solid var(--border);
border-radius:13px;
padding:9px
}

label{
display:block;
font-size:9px;
font-weight:900;
margin-bottom:4px
}

select{
width:100%;
height:34px;
border:1px solid #d0d5dd;
border-radius:8px;
padding:0 8px;
background:#fff;
font-size:11px;
color:var(--text)
}

.help{
font-size:9px;
color:var(--muted);
margin-top:3px
}

/* DAILY */

.daily{
margin-top:6px;
padding:7px 8px;
border-radius:9px;
background:#f8f9ff;
border:1px solid #dce4ff
}

.row{
display:flex;
justify-content:space-between;
font-size:9px
}

.row:first-child{
font-weight:800;
color:#4338ca
}

.track{
height:6px;
margin-top:4px;
border-radius:20px;
background:#e4e7ec;
overflow:hidden
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--blue),var(--purple));
transition:width .25s
}

/* GENERATE */

.generate{
width:100%;
height:36px;
margin-top:6px;
border:0;
border-radius:9px;
background:linear-gradient(135deg,var(--blue),var(--purple));
color:#fff;
font-size:11px;
font-weight:900;
cursor:pointer
}

.generate:disabled{
opacity:.55;
cursor:not-allowed
}

.limit{
display:none;
margin-top:5px;
padding:6px;
border-radius:8px;
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
font-size:9px;
font-weight:800;
text-align:center
}

.limit.show{
display:block
}

.error{
display:none;
margin-top:5px;
padding:6px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
font-size:9px
}

.error.show{
display:block
}

/* SMALL SCREENS */

@media(max-height:700px){

.app{
gap:5px;
padding:6px 8px
}

header{
height:28px;
min-height:28px
}

.teacher{
height:66px;
min-height:66px
}

.teacher img{
width:50px;
height:50px
}

.question{
font-size:15px
}

.board-head{
height:32px;
min-height:32px
}

.board-body{
padding:10px
}

.option{
min-height:38px
}

}

@media(max-width:360px){

.logo{
font-size:14px
}

.teacher h2{
font-size:13px
}

.teacher p{
font-size:9px
}

.question{
font-size:14px
}

}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a class="nav" href="dashboard.html">Dashboard</a>
</header>

<!-- FIXED TEACHER -->
<section class="teacher">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher"
>

<div class="teacher-info">
<h2>🤖 AI English Teacher</h2>

<p id="teacherMessage">
Let's practise English together.
</p>

<button class="listen" id="listen">
🔊 Listen
</button>
</div>

</section>

<!-- FIXED MIDDLE WHITE BOARD -->
<section class="board">

<div class="board-head">
<span class="qnum" id="number">Question</span>
<span class="badge" id="qcategory">Mixed</span>
</div>

<div class="board-body" id="boardBody">

<div class="empty" id="empty">
Generate a question to begin.
</div>

<div id="questionContent" style="display:none">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

</div>

</div>

<button class="next" id="next">
Next Question →
</button>

</section>

<!-- FIXED CONTROLS -->
<section class="controls">

<label>CHOOSE A LESSON</label>

<select id="category">
<option value="Mixed">Mixed</option>
<option value="Adjectives">Adjectives</option>
<option value="Adverbs">Adverbs</option>
<option value="Articles">Articles</option>
<option value="Conjunctions">Conjunctions</option>
<option value="Nouns">Nouns</option>
<option value="Prepositions">Prepositions</option>
<option value="Pronouns">Pronouns</option>
<option value="Tenses">Tenses</option>
<option value="Verbs">Verbs</option>
<option value="Vocabulary">Vocabulary</option>
</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>

<div class="daily">

<div class="row">
<span>📊 Daily AI Progress</span>
<b id="progress">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="fill"></div>
</div>

<div class="row" style="margin-top:4px">
<span id="used">0 used</span>
<span id="remaining">10 remaining</span>
</div>

</div>

<button class="generate" id="generate">
🤖 Generate Question
</button>

<div class="limit" id="limit">
🔒 Your daily AI limit has been reached.
</div>

<div class="error" id="error"></div>

</section>

</div>

<script>

const API="https://createlk-ai-mcq.createlk.workers.dev";
const KEY="createlk_student";

const $=id=>document.getElementById(id);

let student=null;
let studentId="";
let current=null;
let answered=false;
let questionNumber=0;
let speechText="";

try{
student=JSON.parse(
sessionStorage.getItem(KEY) ||
localStorage.getItem(KEY) ||
"null"
);
}catch(e){
student=null;
}

if(!student){
location.replace("login.html");
}

studentId=String(
student?.id ||
student?.student_id ||
student?.user_id ||
""
);

if(!studentId){
location.replace("login.html");
}

/* API */

async function api(url,options={}){

const response=await fetch(url,{
...options,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(options.headers||{})
}
});

let data={};

try{
data=await response.json();
}catch(e){}

if(!response.ok){
throw new Error(
data.message ||
data.error ||
`Request failed (${response.status})`
);
}

return data;
}

/* ERROR */

function showError(message){
$("error").textContent=message;
$("error").classList.add("show");
}

function clearError(){
$("error").classList.remove("show");
}

/* SPEECH */

function listen(){

if(!speechText){
return;
}

if(!("speechSynthesis" in window)){
showError("Voice is not supported on this browser.");
return;
}

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(
speechText.replace(/\s+/g," ").trim()
);

voice.lang="en-US";
voice.rate=.88;
voice.pitch=1;

$("listen").textContent="🔊 Playing...";

voice.onend=()=>{
$("listen").textContent="🔊 Listen";
};

voice.onerror=()=>{
$("listen").textContent="🔊 Listen";
};

speechSynthesis.speak(voice);
}

$("listen").onclick=listen;

/* LESSON HELP */

const helpText={
Mixed:"Grammar, vocabulary and sentence practice.",
Adjectives:"Words that describe people and things.",
Adverbs:"Words that describe actions.",
Articles:"Practise a, an and the.",
Conjunctions:"Connect words and sentences.",
Nouns:"Names of people, places and things.",
Prepositions:"Practise in, on, at, by and between.",
Pronouns:"Practise he, she, it, they and them.",
Tenses:"Practise past, present and future.",
Verbs:"Practise action words.",
Vocabulary:"Build stronger English vocabulary."
};

$("category").onchange=()=>{
$("help").textContent=
helpText[$("category").value] ||
helpText.Mixed;
};

/* SOURCES */

function sources(data){

return[
data,
data?.progress,
data?.stats,
data?.statistics,
data?.data,
data?.data?.progress,
data?.data?.stats
].filter(Boolean);

}

/* NUMBER */

function getNumber(data,keys){

for(const source of sources(data)){

for(const key of keys){

if(
source[key] !== undefined &&
source[key] !== null &&
source[key] !== ""
){

const n=Number(source[key]);

if(Number.isFinite(n)){
return n;
}

}

}

}

return NaN;
}

/* PREMIUM */

function isPremium(data){

return sources(data).some(source=>{

const status=String(
source.membership_status ||
source.membershipStatus ||
""
).toUpperCase();

const plan=String(
source.plan ||
source.membership_plan ||
""
).toUpperCase();

return(
source.premium===true ||
status==="ACTIVE" ||
status==="PREMIUM" ||
status==="ACTIVE_PREMIUM" ||
plan==="PREMIUM"
);

});
}

/* PROGRESS */

async function loadProgress(){

try{

const data=await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);

if(data.success===false){
throw new Error(
data.message ||
"Could not load progress."
);
}

const premium=isPremium(data);
const limit=premium?100:10;

let used=getNumber(data,[
"daily_used",
"used",
"today_used",
"used_today",
"dailyUsage",
"todayUsage",
"questions_today",
"today_questions",
"practice_today"
]);

let remaining=getNumber(data,[
"remaining",
"daily_remaining",
"remaining_today",
"remainingToday"
]);

if(
!Number.isFinite(used) &&
Number.isFinite(remaining)
){
used=limit-remaining;
}

if(
!Number.isFinite(remaining) &&
Number.isFinite(used)
){
remaining=limit-used;
}

if(!Number.isFinite(used)){
used=0;
}

if(!Number.isFinite(remaining)){
remaining=limit-used;
}

used=Math.max(
0,
Math.min(limit,used)
);

remaining=Math.max(
0,
Math.min(limit,remaining)
);

$("progress").textContent=
`${used} / ${limit}`;

$("used").textContent=
`${used} used`;

$("remaining").textContent=
`${remaining} remaining`;

$("fill").style.width=
`${Math.min(100,(used/limit)*100)}%`;

if(!premium && remaining<=0){

$("generate").disabled=true;
$("generate").textContent=
"Daily Limit Reached";

$("limit").classList.add("show");

}else{

$("generate").disabled=false;
$("generate").textContent=
"🤖 Generate Question";

$("limit").classList.remove("show");

}

return{
premium,
limit,
used,
remaining
};

}catch(error){

console.error("Progress:",error);

return null;
}
}

/* NORMALISE QUESTION */

function getQuestion(data){

let q=
data?.question ||
data?.data?.question ||
data?.mcq ||
data?.data?.mcq;

if(
!q &&
(
data?.question_text ||
data?.text ||
data?.prompt ||
Array.isArray(data?.options)
)
){
q=data;
}

if(!q){
return null;
}

const question=
q.question ||
q.question_text ||
q.text ||
q.prompt ||
"";

const options=
q.options ||
q.choices ||
q.answers ||
[];

if(
!question ||
!Array.isArray(options) ||
options.length<2
){
return null;
}

return{
id:
q.id ||
q.question_id ||
q.questionId ||
"",
question,
options
};

}

/* GENERATE */

async function generate(){

if($("generate").disabled){
return;
}

clearError();

$("generate").disabled=true;
$("generate").textContent=
"⏳ Generating...";

const progress=await loadProgress();

if(
progress &&
!progress.premium &&
progress.remaining<=0
){
return;
}

answered=false;
current=null;

$("next").classList.remove("show");

try{

const category=
$("category").value;

const data=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(studentId)}&category=${encodeURIComponent(category)}`
);

console.log("MCQ API:",data);

const question=getQuestion(data);

if(!question){

throw new Error(
data.message ||
"AI returned an invalid question."
);
}

current=question;
questionNumber++;

renderQuestion();

await loadProgress();

$("generate").disabled=false;
$("generate").textContent=
"🤖 Generate Question";

}catch(error){

console.error("Generate:",error);

showError(
error.message ||
"Could not generate question."
);

$("generate").disabled=false;
$("generate").textContent=
"🤖 Generate Question";
}
}

/* RENDER */

function renderQuestion(){

$("empty").style.display="none";
$("questionContent").style.display="block";

$("number").textContent=
`Question ${questionNumber}`;

$("qcategory").textContent=
$("category").value;

$("question").textContent=
current.question;

$("options").innerHTML="";

$("result").className="result";
$("result").innerHTML="";

let voice=
`Question ${questionNumber}. ${current.question}. `;

current.options.forEach((option,index)=>{

const button=
document.createElement("button");

button.type="button";
button.className="option";

const letter=
String.fromCharCode(65+index);

button.textContent=
`${letter}. ${option}`;

button.onclick=()=>{
submitAnswer(index);
};

$("options").appendChild(button);

voice+=
`Option ${letter}. ${option}. `;
});

speechText=voice;

$("teacherMessage").textContent=
"Choose the best answer.";

$("boardBody").scrollTop=0;
}

/* ANSWER */

async function submitAnswer(selected){

if(answered || !current){
return;
}

answered=true;
clearError();

const buttons=
document.querySelectorAll(".option");

buttons.forEach(button=>{
button.disabled=true;
});

try{

const data=await api(
`${API}/api/mcq`,
{
method:"POST",
body:JSON.stringify({
student_id:studentId,
question_id:current.id,
answer:selected
})
}
);

if(data.success===false){
throw new Error(
data.message ||
"Answer could not be submitted."
);
}

let correctAnswer=
data.correct_answer ??
data.answer ??
data.data?.correct_answer;

let correct=
data.correct===true ||
data.is_correct===true;

if(
!correct &&
correctAnswer!==undefined
){

const value=String(correctAnswer);

correct=
value===String(selected) ||
value===String.fromCharCode(65+selected) ||
(
current.options[selected] &&
value===String(current.options[selected])
);

}

buttons.forEach((button,index)=>{

if(correctAnswer!==undefined){

const value=String(correctAnswer);

const isCorrect=
value===String(index) ||
value===String.fromCharCode(65+index) ||
(
current.options[index] &&
value===String(current.options[index])
);

if(isCorrect){
button.classList.add("correct");
}
}

if(index===selected && !correct){
button.classList.add("wrong");
}

});

const explanation=
data.explanation ||
data.data?.explanation ||
"Review the correct answer and try again.";

$("result").className=
`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${escapeHTML(explanation)}`;

speechText=
`${correct?"Correct!":"Incorrect."} ${explanation}`;

$("teacherMessage").textContent=
correct
?"Excellent! Keep going. ⭐"
:"Keep practising. You can improve! 💪";

$("next").classList.add("show");

$("boardBody").scrollTop=0;

await loadProgress();

}catch(error){

console.error("Answer:",error);

answered=false;

buttons.forEach(button=>{
button.disabled=false;
});

showError(
error.message ||
"Could not submit answer."
);
}
}

/* NEXT */

$("next").onclick=async function(){

if(this.disabled){
return;
}

this.disabled=true;
this.textContent="Loading...";

await generate();

this.disabled=false;
this.textContent="Next Question →";
};

/* GENERATE */

$("generate").onclick=generate;

/* ESCAPE */

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=String(text);

return div.innerHTML;
}

/* START */

loadProgress();

</script>

</body>
</html>
