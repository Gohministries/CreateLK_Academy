<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CreateLK Academy | AI English Practice</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--p:#155eef;
--v:#6d5dfc;
--t:#172033;
--m:#667085;
--b:#e4e7ec
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:var(--t);
overflow-x:hidden
}

.app{
width:100%;
max-width:430px;
min-height:100svh;
margin:auto;
padding:10px 11px 16px;
display:flex;
flex-direction:column;
gap:10px
}

header{
height:36px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:17px;
font-weight:800;
color:var(--p)
}

.nav{
font-size:13px;
font-weight:700;
color:var(--p);
text-decoration:none
}

.card{
background:#fff;
border:1px solid var(--b);
border-radius:14px;
padding:12px;
box-shadow:0 2px 10px #10182808
}

/* AI */

.ai{
display:flex;
align-items:center;
gap:12px;
background:linear-gradient(135deg,#eef2ff,#f7f5ff);
border-color:#d9d6fe;
padding:13px 12px
}

.video{
width:112px;
height:112px;
flex:none;
border-radius:50%;
overflow:visible;
border:4px solid #fff;
box-shadow:0 0 0 2px #6d5dfc33,0 4px 15px #503cb433;
position:relative
}

.video img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
display:block
}

.live{
position:absolute;
right:-8px;
bottom:7px;
padding:5px 8px;
background:#fff;
border-radius:20px;
font-size:9px;
font-weight:800;
color:#12b76a;
box-shadow:0 2px 7px #0002
}

.live-dot{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#12b76a;
margin-right:3px
}

.ai-info{min-width:0}

.ai-info h3{
font-size:17px;
line-height:1.25;
color:#4338ca;
margin-bottom:6px
}

.ai-info p{
font-size:13px;
line-height:1.45;
color:var(--m)
}

.speak{
margin-top:8px;
padding:7px 11px;
border:0;
border-radius:8px;
background:#eef2ff;
color:#5b4ee8;
font-size:12px;
font-weight:700
}

/* SETTINGS */

label{
display:block;
font-size:11px;
font-weight:800;
margin-bottom:6px
}

select{
width:100%;
height:40px;
padding:0 10px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:14px;
color:var(--t)
}

.help{
font-size:11px;
line-height:1.35;
color:var(--m);
margin-top:5px
}

/* PROGRESS */

.daily{
margin-top:10px;
padding:10px;
border:1px solid #dce4ff;
border-radius:9px;
background:#f8f9ff
}

.progress-head,
.progress-sub{
display:flex;
justify-content:space-between;
font-size:12px
}

.progress-head{
font-weight:800;
color:#4338ca;
margin-bottom:6px
}

.progress-sub{
margin-top:5px;
color:var(--m)
}

.track{
height:8px;
background:#e4e7ec;
border-radius:20px;
overflow:hidden
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--v),#8b5cf6);
transition:.3s
}

.generate{
width:100%;
height:42px;
margin-top:10px;
border:0;
border-radius:9px;
background:var(--p);
color:#fff;
font-size:14px;
font-weight:700
}

/* PREMIUM */

.premium{
display:none;
margin-top:8px;
padding:10px;
border-radius:9px;
background:#172554;
color:#fff;
font-size:11px;
line-height:1.4
}

.premium.show{display:block}

.premium b{font-size:13px}

.premium button{
width:100%;
height:36px;
margin-top:7px;
border:0;
border-radius:8px;
background:#fff;
color:var(--p);
font-weight:700;
font-size:12px
}

/* QUESTION */

.question-card{min-height:220px}

.loading{
padding:25px 8px;
text-align:center;
font-size:12px;
line-height:1.4;
color:var(--m)
}

.meta{
display:flex;
justify-content:space-between;
font-size:11px;
font-weight:700;
color:var(--m);
margin-bottom:9px
}

.meta span:last-child{
background:#f2f4f7;
padding:4px 7px;
border-radius:15px
}

.question{
font-size:18px;
font-weight:800;
line-height:1.45;
margin-bottom:11px
}

.options{
display:flex;
flex-direction:column;
gap:8px
}

.option{
width:100%;
min-height:44px;
padding:9px 11px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:14px;
font-weight:500;
text-align:left;
line-height:1.4;
color:var(--t)
}

.option.correct{
background:#ecfdf3;
border-color:#12b76a;
color:#027a48
}

.option.wrong{
background:#fef3f2;
border-color:#f04438;
color:#b42318
}

.result{
display:none;
margin-top:8px;
padding:10px;
border-radius:8px;
font-size:12px;
line-height:1.5
}

.result.show{display:block}

.result.correct{
background:#ecfdf3;
color:#027a48
}

.result.wrong{
background:#fef3f2;
color:#b42318
}

.next{
display:none;
width:100%;
height:39px;
margin-top:8px;
border:0;
border-radius:9px;
background:var(--p);
color:#fff;
font-size:13px;
font-weight:700
}

.error{
display:none;
margin-top:8px;
padding:9px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
font-size:11px;
line-height:1.4
}

.error.show{display:block}

button{
font-family:inherit;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

@media(max-width:370px){

.app{
padding-left:9px;
padding-right:9px
}

.video{
width:96px;
height:96px
}

.ai{
gap:10px;
padding:11px
}

.ai-info h3{font-size:15px}

.ai-info p{font-size:12px}

.speak{
font-size:11px;
padding:6px 9px
}

.question{font-size:17px}

.option{
font-size:13px;
min-height:41px
}

}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="nav">Dashboard</a>
</header>

<!-- AI TEACHER -->

<div class="card ai">

<div class="video">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div class="live">
<span class="live-dot"></span>LIVE
</div>

</div>

<div class="ai-info">

<h3>🤖 AI English Teacher</h3>

<p id="teacherMessage">
Let's practise English together.
</p>

<button class="speak" id="speakButton" type="button">
🔊 Speak
</button>

</div>

</div>


<!-- LESSON -->

<div class="card">

<label>CHOOSE A LESSON</label>

<select id="category">

<option value="Mixed">🎯 Mixed English</option>
<option value="Adjectives">Adjectives</option>
<option value="Adverbs">Adverbs</option>
<option value="Articles">Articles</option>
<option value="Conjunctions">Conjunctions</option>
<option value="Nouns">Nouns</option>
<option value="Prepositions">Prepositions</option>
<option value="Pronouns">Pronouns</option>
<option value="Tenses">Tenses</option>
<option value="Verbs">Verbs</option>
<option value="Vocabulary">Vocabulary</option>

</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>


<!-- DAILY PROGRESS -->

<div class="daily">

<div class="progress-head">
<span>📊 Daily AI Progress</span>
<b id="progressText">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="progressFill"></div>
</div>

<div class="progress-sub">
<span id="usedText">0 used</span>
<span id="remainingText">10 remaining</span>
</div>

</div>


<button class="generate" id="generateBtn" type="button">
🤖 Generate Question
</button>


<!-- PREMIUM -->

<div class="premium" id="premiumBox">

<b>⭐ CreateLK Premium</b>

<div>100 AI questions/day • 30 Days</div>

<button id="premiumButton" type="button">
⭐ Get Premium — LKR 1,500
</button>

</div>


<div class="error" id="error"></div>

</div>


<!-- QUESTION -->

<div class="card question-card">

<div class="loading" id="loading">
Generate a question to begin.
</div>

<div id="questionArea" style="display:none">

<div class="meta">

<span id="questionNumber">Question</span>

<span id="questionCategory">Mixed</span>

</div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

<button class="next" id="nextBtn" type="button">
Next Question →
</button>

</div>

</div>

</div>


<script>

/* =========================
   API
========================= */

const API="https://createlk-ai-mcq.createlk.workers.dev";
const CHECKOUT="https://createlk-payhere-checkout.createlk.workers.dev";
const KEY="createlk_student";

const $=id=>document.getElementById(id);


/* =========================
   STATE
========================= */

let student=null;
let studentId="";
let current=null;
let answered=false;
let questionNo=0;
let speechVoice=null;
let speechText="";


/* =========================
   STUDENT
========================= */

function loadStudent(){

const saved=
sessionStorage.getItem(KEY)||
localStorage.getItem(KEY);

if(!saved)return false;

try{

student=JSON.parse(saved);

studentId=String(
student.id||
student.student_id||
student.user_id||
""
);

return !!studentId;

}catch{

return false;

}

}

if(!loadStudent()){
location.replace("login.html");
}


/* =========================
   API
========================= */

async function api(url,opt={}){

const res=await fetch(
url,
{
...opt,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
}
);

let data={};

try{
data=await res.json();
}catch{}

if(!res.ok){

throw new Error(
data.message||
data.error||
`Request failed (${res.status})`
);

}

return data;

}


/* =========================
   ERROR
========================= */

function error(msg){

$("error").textContent=msg;
$("error").classList.add("show");

}

function clearError(){
$("error").classList.remove("show");
}


/* =========================
   SPEECH
========================= */

function loadSpeechVoice(){

if(!("speechSynthesis" in window))return;

const voices=speechSynthesis.getVoices();

speechVoice=
voices.find(v=>v.lang==="en-US")||
voices.find(v=>v.lang.startsWith("en"))||
voices[0]||
null;

}

if("speechSynthesis" in window){

loadSpeechVoice();

speechSynthesis.onvoiceschanged=
loadSpeechVoice;

}


function speak(text){

if(
!text||
!("speechSynthesis" in window)
)return;

loadSpeechVoice();

speechSynthesis.cancel();

const clean=
String(text)
.replace(/\s+/g," ")
.trim();

if(!clean)return;

const u=
new SpeechSynthesisUtterance(clean);

u.lang="en-US";
u.rate=.88;
u.pitch=1;
u.volume=1;

if(speechVoice)
u.voice=speechVoice;

setTimeout(()=>{
speechSynthesis.speak(u);
},80);

}


function teacher(text){

speechText=String(text||"");

$("teacherMessage").textContent=
speechText;

speak(speechText);

}


$("speakButton").onclick=()=>{

speak(
speechText||
"Hello! I'm your AI English teacher. Let's practise English together."
);

};


/* =========================
   CATEGORY
========================= */

const help={

Mixed:"Grammar, vocabulary and sentence practice.",

Adjectives:
"Practise words that describe people and things.",

Adverbs:
"Practise words that describe actions.",

Articles:
"Practise a, an and the.",

Conjunctions:
"Practise connecting words and sentences.",

Nouns:
"Practise names of people, places and things.",

Prepositions:
"Practise in, on, at, by and between.",

Pronouns:
"Practise he, she, it, they and them.",

Tenses:
"Practise past, present and future tenses.",

Verbs:
"Practise action words and verb usage.",

Vocabulary:
"Build stronger English vocabulary."

};

$("category").onchange=()=>{

$("help").textContent=
help[$("category").value]||
help.Mixed;

};


/* =========================
   PROGRESS
========================= */

function updateProgress(data){

const status=
String(data.membership_status||"").toUpperCase();

const plan=
String(data.plan||"").toUpperCase();

const premium=
data.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
plan==="PREMIUM";

let limit=Number(
data.daily_limit??
data.limit??
(premium?100:10)
);

let used=Number(
data.daily_used??
data.used??
data.today_used
);

let remaining=Number(
data.remaining??
data.remaining_today
);

if(!Number.isFinite(limit)||limit<1)
limit=premium?100:10;

if(
!Number.isFinite(used)&&
Number.isFinite(remaining)
)
used=limit-remaining;

if(
!Number.isFinite(remaining)&&
Number.isFinite(used)
)
remaining=limit-used;

if(
!Number.isFinite(used)||
!Number.isFinite(remaining)
)return;

used=Math.max(0,Math.min(limit,used));
remaining=Math.max(0,Math.min(limit,remaining));

$("progressText").textContent=
`${used} / ${limit}`;

$("progressFill").style.width=
`${Math.round(used/limit*100)}%`;

$("usedText").textContent=
`${used} used`;

$("remainingText").textContent=
`${remaining} remaining`;

if(!premium&&remaining<=0){

$("premiumBox").classList.add("show");
$("generateBtn").disabled=true;
$("generateBtn").textContent=
"Daily Limit Reached";

}else{

$("premiumBox").classList.remove("show");
$("generateBtn").disabled=false;
$("generateBtn").textContent=
"🤖 Generate Question";

}

return premium;

}


/* =========================
   LOAD PROGRESS
========================= */

async function loadProgress(){

try{

const data=await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);

if(data.success!==true)
throw new Error(data.message||"Progress unavailable.");

updateProgress(data);

return data;

}catch(e){

console.error(e);
return null;

}

}

loadProgress();


/* =========================
   GENERATE
========================= */

async function generate(){

if(
!studentId||
$("generateBtn").disabled
)return;

clearError();

const btn=$("generateBtn");

btn.disabled=true;
btn.textContent="⏳ Generating...";

$("loading").style.display="block";
$("loading").textContent="Creating your question...";
$("questionArea").style.display="none";

answered=false;

try{

const progress=await loadProgress();

if(progress){

const status=
String(progress.membership_status||"").toUpperCase();

const premium=
progress.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
String(progress.plan||"").toUpperCase()==="PREMIUM";

const remaining=Number(
progress.remaining??
progress.remaining_today
);

if(
!premium&&
Number.isFinite(remaining)&&
remaining<=0
){

$("premiumBox").classList.add("show");

$("generateBtn").disabled=true;
$("generateBtn").textContent=
"Daily Limit Reached";

$("teacherMessage").textContent=
"You have reached your free daily limit. Upgrade to Premium to continue practising.";

$("loading").textContent=
"Your free daily limit has been reached.";

return;

}

}

const category=$("category").value;

const data=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(studentId)}&category=${encodeURIComponent(category)}`
);

if(!data.success||!data.question){

throw new Error(
data.message||
"Question could not be generated."
);

}

current=data.question;
questionNo++;

showQuestion();

await loadProgress();

}catch(e){

console.error(e);

if(String(e.message).includes("429")){

await loadProgress();

$("premiumBox").classList.add("show");

$("teacherMessage").textContent=
"You have reached your free daily limit. Upgrade to Premium to continue practising.";

$("loading").textContent=
"Your free daily limit has been reached.";

}else{

error(e.message||"Could not generate question.");

btn.disabled=false;
btn.textContent="🤖 Generate Question";

}

}

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

$("loading").style.display="none";
$("questionArea").style.display="block";

$("questionNumber").textContent=
`Question ${questionNo}`;

$("questionCategory").textContent=
$("category").value;

$("question").textContent=
current.question;

$("options").innerHTML="";

$("result").className="result";
$("result").innerHTML="";

$("nextBtn").style.display="none";

if(!Array.isArray(current.options))
throw new Error("Invalid options.");

const voice=[];

voice.push(
`Question. ${current.question}`
);

current.options.forEach((text,i)=>{

const letter=
String.fromCharCode(65+i);

const b=
document.createElement("button");

b.className="option";
b.type="button";

b.textContent=
`${letter}. ${text}`;

b.onclick=()=>answer(i);

$("options").appendChild(b);

voice.push(
`Option ${letter}. ${text}`
);

});

speechText=voice.join(". ");

$("teacherMessage").textContent=
"Choose the best answer.";

setTimeout(()=>{
speak(speechText);
},150);

}


/* =========================
   ANSWER
========================= */

async function answer(selected){

if(answered||!current)return;

answered=true;

clearError();

const buttons=
document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

try{

const data=await api(
`${API}/api/mcq`,
{
method:"POST",
body:JSON.stringify({

student_id:studentId,
question_id:current.id,
answer:selected

})
}
);

if(!data.success){

throw new Error(
data.message||
"Could not submit answer."
);

}

buttons.forEach((b,i)=>{

if(i===Number(data.correct_answer))
b.classList.add("correct");

if(i===selected&&data.correct!==true)
b.classList.add("wrong");

});

const correct=data.correct===true;

const explanation=
data.explanation||
"Review the correct answer.";

$("result").className=
`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${escapeHTML(explanation)}`;

speechText=
`${correct?"Correct!":"Incorrect."} ${explanation}`;

$("teacherMessage").textContent=
speechText;

setTimeout(()=>{
speak(speechText);
},100);

$("nextBtn").style.display="block";

await loadProgress();

}catch(e){

answered=false;

buttons.forEach(b=>b.disabled=false);

error(
e.message||
"Could not submit answer."
);

}

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=String(text);

return div.innerHTML;

}


/* =========================
   PREMIUM
========================= */

async function premiumPayment(){

if(
!studentId||
!student?.email
){

error("Please log in again.");
return;

}

const btn=$("premiumButton");

btn.disabled=true;
btn.textContent="Connecting...";

const name=
student.name||
`${student.first_name||""} ${student.last_name||""}`.trim()||
"Student";

try{

const res=await fetch(
CHECKOUT,
{
method:"POST",
cache:"no-store",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

student_id:String(studentId),

first_name:
student.first_name||
name.split(" ")[0],

last_name:
student.last_name||
"",

email:
student.email,

phone:
student.phone||
""

})
}
);

const data=await res.json();

if(
!res.ok||
data.success!==true
){

throw new Error(
data.message||
"Unable to create payment."
);

}

const form=
document.createElement("form");

form.method="POST";

form.action=
data.action||
"https://www.payhere.lk/pay/checkout";

Object.entries(data.payment||{}).forEach(
([key,value])=>{

const input=
document.createElement("input");

input.type="hidden";
input.name=key;
input.value=value??"";

form.appendChild(input);

}
);

document.body.appendChild(form);

form.submit();

}catch(e){

error(
"Unable to start payment. "+
e.message
);

btn.disabled=false;

btn.textContent=
"⭐ Get Premium — LKR 1,500";

}

}


/* =========================
   EVENTS
========================= */

$("generateBtn").onclick=generate;
$("nextBtn").onclick=generate;
$("premiumButton").onclick=premiumPayment;

</script>

</body>
</html>
