<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CreateLK Academy | AI English Practice</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--p:#155eef;
--ai:#6d5dfc;
--ai2:#8b5cf6;
--text:#172033;
--muted:#667085;
--border:#e4e7ec;
}

html,body{
width:100%;
min-height:100%;
overflow-x:hidden;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:var(--text);
}

.app{
width:100%;
max-width:430px;
min-height:100svh;
margin:auto;
padding:7px 10px;
display:flex;
flex-direction:column;
gap:7px;
overflow:visible;
}

/* HEADER */

header{
height:34px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5px;
}

.logo{
font-size:15px;
font-weight:800;
color:var(--p);
}

.nav{
font-size:11px;
font-weight:bold;
color:var(--p);
text-decoration:none;
}

/* CARDS */

.card{
background:#fff;
border:1px solid var(--border);
border-radius:15px;
padding:9px;
box-shadow:0 2px 8px rgba(16,24,40,.04);
}

/* AI TEACHER */

.ai{
flex:none;
display:flex;
align-items:center;
gap:12px;
padding:10px;
background:linear-gradient(
135deg,
#eef2ff,
#f5f3ff,
#eff6ff
);
border:1px solid #d9d6fe;
box-shadow:0 3px 12px rgba(109,93,252,.10);
overflow:visible;
}

.video{
width:125px;
height:125px;
flex:none;
border-radius:50%;
background:#111;
border:4px solid #fff;
box-shadow:
0 0 0 2px rgba(109,93,252,.25),
0 5px 18px rgba(80,60,180,.20);
position:relative;
overflow:visible;
}

.video img{
width:100%;
height:100%;
display:block;
object-fit:cover;
border-radius:50%;
}

/* LIVE */

.live{
position:absolute;
right:-8px;
bottom:8px;
display:flex;
align-items:center;
gap:4px;
padding:4px 7px;
border-radius:20px;
background:#fff;
font-size:8px;
font-weight:800;
color:#12b76a;
box-shadow:0 2px 8px rgba(0,0,0,.15);
z-index:5;
white-space:nowrap;
}

.live-dot{
width:7px;
height:7px;
flex:none;
border-radius:50%;
background:#12b76a;
box-shadow:0 0 0 3px rgba(18,183,106,.15);
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.25);
opacity:.7;
}
}

.ai-info{
min-width:0;
flex:1;
}

.ai-info h3{
font-size:14px;
margin-bottom:5px;
color:#4338ca;
}

.ai-info p{
font-size:10px;
line-height:1.35;
color:var(--muted);
}

.speak{
width:auto;
padding:6px 9px;
margin-top:6px;
font-size:10px;
background:#eef2ff;
color:#5b4ee8;
border-radius:7px;
}

/* SETTINGS */

.settings{
flex:none;
padding:8px;
}

label{
display:block;
font-size:10px;
font-weight:bold;
margin-bottom:4px;
}

select{
width:100%;
height:35px;
border:1px solid #d0d5dd;
border-radius:9px;
padding:0 9px;
font-size:12px;
background:#fff;
}

button{
border:0;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.65;
cursor:not-allowed;
}

.generate{
width:100%;
height:36px;
margin-top:6px;
border-radius:9px;
background:var(--p);
color:#fff;
font-size:12px;
}

/* DAILY AI PROGRESS */

.daily-progress{
margin-top:7px;
padding:8px;
border:1px solid #e0e7ff;
border-radius:9px;
background:#f8f9ff;
}

.progress-head{
display:flex;
align-items:center;
justify-content:space-between;
font-size:10px;
font-weight:800;
color:#4338ca;
margin-bottom:6px;
}

.progress-head b{
font-size:10px;
color:#172033;
}

.progress-track{
width:100%;
height:7px;
background:#e4e7ec;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
width:0%;
height:100%;
background:linear-gradient(
90deg,
#6d5dfc,
#8b5cf6
);
border-radius:20px;
transition:width:.35s ease;
}

.progress-sub{
display:flex;
justify-content:space-between;
margin-top:5px;
font-size:9px;
color:#667085;
}

/* QUESTION */

.question-card{
flex:1;
min-height:0;
overflow:visible;
padding:10px;
display:flex;
flex-direction:column;
}

.question{
font-size:16px;
font-weight:800;
line-height:1.3;
margin-bottom:6px;
}

.options{
display:flex;
flex-direction:column;
gap:5px;
}

.option{
width:100%;
min-height:39px;
padding:6px 9px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:11px;
text-align:left;
line-height:1.25;
}

.option.correct{
background:#ecfdf3;
border-color:#12b76a;
color:#027a48;
}

.option.wrong{
background:#fef3f2;
border-color:#f04438;
color:#b42318;
}

.result{
display:none;
margin-top:6px;
padding:7px;
border-radius:8px;
font-size:10px;
line-height:1.35;
}

.result.show{
display:block;
}

.result.correct{
background:#ecfdf3;
color:#027a48;
}

.result.wrong{
background:#fef3f2;
color:#b42318;
}

.next{
width:100%;
height:34px;
margin-top:6px;
border-radius:8px;
background:var(--p);
color:#fff;
font-size:11px;
display:none;
}

.loading{
text-align:center;
color:var(--muted);
font-size:11px;
padding:15px;
}

/* ERROR */

.error{
display:none;
font-size:10px;
padding:7px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
margin-top:6px;
}

.error.show{
display:block;
}

/* PREMIUM */

.premium{
display:none;
padding:8px;
margin-top:6px;
border-radius:9px;
background:#172554;
color:#fff;
font-size:10px;
}

.premium.show{
display:block;
}

.premium button{
margin-top:6px;
width:100%;
height:32px;
border-radius:7px;
color:var(--p);
background:#fff;
font-size:10px;
}

/* SMALL HEIGHT PHONES */

@media(max-height:700px){

.app{
gap:5px;
padding:5px 8px;
}

header{
height:28px;
}

.video{
width:105px;
height:105px;
}

.ai{
padding:7px;
gap:9px;
}

.card{
border-radius:12px;
padding:7px;
}

.question{
font-size:14px;
}

.option{
min-height:34px;
font-size:10px;
}

.generate{
height:33px;
}

.live{
right:-7px;
bottom:5px;
font-size:7px;
padding:3px 6px;
}

.live-dot{
width:6px;
height:6px;
}

.daily-progress{
margin-top:5px;
padding:7px;
}

.progress-track{
height:6px;
}

}

/* SMALL WIDTH */

@media(max-width:350px){

.video{
width:92px;
height:92px;
}

.ai{
gap:7px;
}

.ai-info h3{
font-size:12px;
}

.live{
right:-6px;
}

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
📚 CreateLK Academy
</div>

<a class="nav" href="dashboard.html">
Dashboard
</a>

</header>


<!-- AI TEACHER -->

<div class="card ai">

<div class="video">

<img
id="teacherPhoto"
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div class="live">

<span class="live-dot"></span>

LIVE

</div>

</div>


<div class="ai-info">

<h3>
🤖 AI English Teacher
</h3>

<p id="teacherMessage">
Hello! Let's practise English together.
</p>

<button
class="speak"
id="speakButton"
type="button">

🔊 Speak

</button>

</div>

</div>


<!-- SETTINGS -->

<div class="card settings">

<label>
CATEGORY
</label>

<select id="category">

<option value="Mixed">
🎯 Mixed
</option>

<option value="Adjectives">
Adjectives
</option>

<option value="Adverbs">
Adverbs
</option>

<option value="Articles">
Articles
</option>

<option value="Conjunctions">
Conjunctions
</option>

<option value="Nouns">
Nouns
</option>

<option value="Prepositions">
Prepositions
</option>

<option value="Pronouns">
Pronouns
</option>

<option value="Tenses">
Tenses
</option>

<option value="Verbs">
Verbs
</option>

<option value="Vocabulary">
Vocabulary
</option>

</select>


<!-- DAILY PROGRESS -->

<div
class="daily-progress"
id="dailyProgress">

<div class="progress-head">

<span>
📊 Daily AI Progress
</span>

<b id="progressText">
0 / 10
</b>

</div>


<div class="progress-track">

<div
class="progress-fill"
id="progressFill">
</div>

</div>


<div class="progress-sub">

<span id="usedText">
0 used
</span>

<span id="remainingText">
10 remaining
</span>

</div>

</div>


<!-- GENERATE -->

<button
class="generate"
id="generateBtn"
type="button">

🤖 Generate Question

</button>


<!-- PREMIUM -->

<div
class="premium"
id="premiumBox">

<b>
⭐ CreateLK Premium
</b>

<div style="margin-top:3px">

100 AI questions/day • 30 Days

</div>

<button
id="premiumButton"
type="button">

⭐ Get Premium — LKR 1,500

</button>

</div>


<div
class="error"
id="error">
</div>

</div>


<!-- QUESTION -->

<div
class="card question-card"
id="questionCard">

<div
class="loading"
id="loading">

Generate a question to begin.

</div>


<div
id="questionArea"
style="display:none">

<div
class="question"
id="question">
</div>


<div
class="options"
id="options">
</div>


<div
class="result"
id="result">
</div>


<button
class="next"
id="nextBtn"
type="button">

Next Question

</button>

</div>

</div>

</div>


<script>

const API =
"https://createlk-ai-mcq.createlk.workers.dev";

const CHECKOUT_API =
"https://createlk-payhere-checkout.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student = null;

let studentId = null;

let currentQuestion = null;

let answered = false;

let lastSpeech = "";


const $ =
id => document.getElementById(id);


/* STUDENT */

function loadStudent(){

const stored =
sessionStorage.getItem(STUDENT_KEY) ||
localStorage.getItem(STUDENT_KEY);

if(!stored){

return false;

}

try{

student =
JSON.parse(stored);

studentId =
student?.id ||
student?.student_id ||
student?.user_id ||
null;

if(studentId){

studentId =
String(studentId);

}

return !!studentId;

}catch(e){

console.error(e);

return false;

}

}


if(!loadStudent()){

location.replace("login.html");

}


/* API */

async function api(url,options={}){

const res =
await fetch(url,{

...options,

cache:"no-store",

headers:{

"Accept":
"application/json",

"Content-Type":
"application/json",

...(options.headers||{})

}

});


let data;

try{

data =
await res.json();

}catch{

throw new Error(
"Invalid server response."
);

}


if(!res.ok){

const e =
new Error(

data.message ||
data.error ||
`Request failed (${res.status})`

);

e.status =
res.status;

throw e;

}


return data;

}


/* ERROR */

function showError(text){

$("error").textContent =
text;

$("error").classList.add("show");

}


function hideError(){

$("error").classList.remove("show");

}


/* VOICE */

function speak(text){

if(!text){

return;

}

lastSpeech =
String(text);


if(!("speechSynthesis" in window)){

return;

}


/*
 Stop previous voice.
*/

speechSynthesis.cancel();


const u =
new SpeechSynthesisUtterance(
lastSpeech
);


u.lang =
"en-US";

u.rate =
.92;

u.pitch =
1;


/*
 Speech finished.
*/

u.onend = () => {

};


/*
 Speech stopped/error.
*/

u.onerror = () => {

};


speechSynthesis.speak(u);

}


/* TEACHER SPEAK */

function teacherSpeak(text){

$("teacherMessage").textContent =
text;

speak(text);

}


/* SPEAK BUTTON */

$("speakButton").onclick =
()=>{

speak(

lastSpeech ||

"Hello! I'm your AI English teacher. Let's practise English together."

);

};


/* DAILY PROGRESS */

function updateStats(data){

const status =
String(
data.membership_status || ""
).toUpperCase();


const plan =
String(
data.plan || ""
).toUpperCase();


const premium =
data.premium === true ||

status === "ACTIVE" ||

status === "PREMIUM" ||

plan === "PREMIUM";


let limit =
Number(

data.limit ??

data.daily_limit ??

data.dailyLimit ??

(premium ? 100 : 10)

);


let remaining =
Number(

data.remaining ??

data.remaining_today ??

data.remainingToday ??

limit

);


if(
!Number.isFinite(limit) ||
limit < 1
){

limit =
premium ? 100 : 10;

}


if(
!Number.isFinite(remaining)
){

remaining =
limit;

}


remaining =
Math.max(
0,
Math.min(limit,remaining)
);


const used =
Math.max(
0,
limit - remaining
);


const percent =
Math.min(
100,
Math.round(
(used / limit) * 100
)
);


/* UPDATE */

$("progressText").textContent =
`${used} / ${limit}`;


$("progressFill").style.width =
`${percent}%`;


$("usedText").textContent =
`${used} used`;


$("remainingText").textContent =
`${remaining} remaining`;


/* DAILY LIMIT */

if(
!premium &&
remaining <= 0
){

$("premiumBox")
.classList.add("show");

$("generateBtn").disabled =
true;

$("generateBtn").textContent =
"Daily Limit Reached";

}else{

$("premiumBox")
.classList.remove("show");

$("generateBtn").disabled =
false;

$("generateBtn").textContent =
"🤖 Generate Question";

}

}


/* GENERATE */

async function generateQuestion(){

if(
!studentId ||
$("generateBtn").disabled
){

return;

}


hideError();


const btn =
$("generateBtn");


btn.disabled =
true;

btn.textContent =
"⏳ Generating...";


$("loading").style.display =
"block";


$("questionArea").style.display =
"none";


answered =
false;


try{

const category =
$("category").value;


const data =
await api(

`${API}/api/mcq?student_id=${
encodeURIComponent(studentId)
}&category=${
encodeURIComponent(category)
}`

);


if(!data.success){

throw new Error(

data.message ||
"Could not generate question."

);

}


if(!data.question){

throw new Error(
"Question was not returned by the server."
);

}


currentQuestion =
data.question;


/*
 Update progress.
*/

updateStats(data);


displayQuestion();


teacherSpeak(
"Here is your English question. Choose the best answer."
);


}catch(e){

console.error(
"Generate error:",
e
);


if(

e.status === 429 ||

String(e.message)
.toLowerCase()
.includes("limit")

){

$("premiumBox")
.classList.add("show");

}


showError(

e.message ||
"Could not generate question."

);


btn.disabled =
false;

btn.textContent =
"🤖 Generate Question";

}

}


/* DISPLAY QUESTION */

function displayQuestion(){

$("loading").style.display =
"none";


$("questionArea").style.display =
"block";


$("question").textContent =
currentQuestion.question;


$("options").innerHTML =
"";


$("result").className =
"result";


$("result").innerHTML =
"";


$("nextBtn").style.display =
"none";


if(
!Array.isArray(
currentQuestion.options
)
){

throw new Error(
"Invalid question options."
);

}


currentQuestion.options.forEach(

(text,index)=>{

const b =
document.createElement(
"button"
);


b.type =
"button";


b.className =
"option";


b.textContent =
`${String.fromCharCode(65+index)}. ${text}`;


b.onclick =
()=>submitAnswer(index);


$("options")
.appendChild(b);

}

);


/*
 Speak the question.
*/

speak(
currentQuestion.question
);

}


/* ANSWER */

async function submitAnswer(selected){

if(
answered ||
!currentQuestion
){

return;

}


answered =
true;


hideError();


const buttons =
document.querySelectorAll(
".option"
);


buttons.forEach(
b =>
b.disabled = true
);


try{

const data =
await api(

`${API}/api/mcq`,

{

method:"POST",

body:JSON.stringify({

student_id:
studentId,

question_id:
currentQuestion.id,

answer:
selected

})

}

);


if(!data.success){

throw new Error(

data.message ||
"Could not submit answer."

);

}


buttons.forEach(

(button,index)=>{

if(
index ===
Number(data.correct_answer)
){

button.classList.add(
"correct"
);

}


if(

index === selected &&
data.correct !== true

){

button.classList.add(
"wrong"
);

}

}

);


const correct =
data.correct === true;


$("result").className =
"result show " +
(correct ? "correct" : "wrong");


$("result").innerHTML =

`<b>${
correct
? "✓ Correct!"
: "✗ Incorrect"
}</b><br>
${escapeHTML(
data.explanation ||
"Review the correct answer."
)}`;


teacherSpeak(

correct

?

"Excellent! Your answer is correct."

:

"Good try. Review the correct answer."

);


$("nextBtn").style.display =
"block";


/*
 Update progress if the
 POST response contains it.
*/

if(

data.remaining !== undefined ||

data.limit !== undefined ||

data.daily_limit !== undefined

){

updateStats(data);

}


}catch(e){

console.error(
"Answer error:",
e
);


answered =
false;


buttons.forEach(
b =>
b.disabled = false
);


showError(

e.message ||
"Could not submit answer."

);

}

}


/* ESCAPE */

function escapeHTML(text){

const d =
document.createElement(
"div"
);

d.textContent =
String(text);

return d.innerHTML;

}


/* PAYHERE */

async function startPremiumPayment(){

loadStudent();


if(
!studentId ||
!student?.email
){

showError(
"Please log in again."
);

return;

}


const button =
$("premiumButton");


button.disabled =
true;


button.textContent =
"Connecting...";


const name =

student.name ||

`${student.first_name || ""} ${
student.last_name || ""
}`
.trim() ||

"Student";


try{

const res =
await fetch(

CHECKOUT_API,

{

method:"POST",

cache:"no-store",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

student_id:
String(studentId),

first_name:

student.first_name ||

name.split(" ")[0] ||

"Student",

last_name:

student.last_name ||
"",

email:

student.email ||
"",

phone:

student.phone ||
""

})

}

);


const data =
await res.json();


if(
!res.ok ||
data.success !== true
){

throw new Error(

data.message ||
"Unable to create payment."

);

}


const form =
document.createElement(
"form"
);


form.method =
"POST";


form.action =

data.action ||

"https://www.payhere.lk/pay/checkout";


Object.entries(
data.payment || {}
)
.forEach(
([key,value])=>{

const input =
document.createElement(
"input"
);

input.type =
"hidden";

input.name =
key;

input.value =
value ?? "";

form.appendChild(
input
);

}
);


document.body.appendChild(
form
);


form.submit();


}catch(e){

console.error(
"Payment error:",
e
);


showError(

"Unable to start payment. " +
e.message

);


button.disabled =
false;


button.textContent =
"⭐ Get Premium — LKR 1,500";

}

}


/* EVENTS */

$("generateBtn")
.addEventListener(
"click",
generateQuestion
);


$("nextBtn")
.addEventListener(
"click",
generateQuestion
);


$("premiumButton")
.addEventListener(
"click",
startPremiumPayment
);

</script>

</body>
</html>
