<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#155eef;
--purple:#7c3aed;
--text:#172033;
--muted:#667085;
--border:#e4e7ec;
--green:#12b76a;
--red:#f04438;
--bg:#f5f7fb
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text)
}

.app{
width:100%;
max-width:430px;
height:100svh;
margin:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
overflow:hidden
}

/* HEADER */

header{
height:36px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:17px;
font-weight:900;
color:var(--blue)
}

.nav{
font-size:12px;
font-weight:800;
color:var(--blue);
text-decoration:none
}

/* TEACHER */

.teacher{
height:82px;
flex:none;
display:flex;
align-items:center;
gap:10px;
padding:10px;
background:linear-gradient(135deg,#eef2ff,#faf5ff);
border:1px solid #d9d6fe;
border-radius:14px
}

.teacher img{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
border:3px solid #fff;
flex:none
}

.teacher h2{
font-size:15px;
color:#4338ca
}

.teacher p{
font-size:10px;
color:var(--muted);
margin-top:3px
}

.listen{
margin-top:5px;
border:0;
border-radius:7px;
padding:5px 9px;
background:#fff;
color:var(--purple);
font-size:10px;
font-weight:800;
cursor:pointer
}

/* WHITE QUESTION BOARD */

.board{
flex:1;
min-height:0;
background:#fff;
border:1px solid var(--border);
border-radius:15px;
padding:12px;
box-shadow:0 3px 12px #1018280d;
display:flex;
flex-direction:column;
overflow:hidden
}

.board-top{
height:28px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between
}

.qnum{
font-size:10px;
font-weight:900;
color:var(--muted)
}

.category-badge{
font-size:9px;
font-weight:900;
background:#f2f4f7;
padding:5px 8px;
border-radius:20px;
color:#475467
}

.question-area{
flex:1;
min-height:0;
overflow-y:auto;
padding:10px 2px
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
font-size:12px
}

.question{
font-size:17px;
font-weight:800;
line-height:1.4;
margin-bottom:12px
}

.options{
display:flex;
flex-direction:column;
gap:7px
}

.option{
width:100%;
min-height:42px;
padding:9px 10px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:12px;
text-align:left;
color:var(--text);
cursor:pointer
}

.option:hover{
border-color:var(--blue);
background:#f8faff
}

.option:disabled{
cursor:default;
opacity:1
}

.option.correct{
background:#ecfdf3;
border-color:var(--green);
color:#027a48
}

.option.wrong{
background:#fef3f2;
border-color:var(--red);
color:#b42318
}

.result{
display:none;
margin-top:9px;
padding:9px;
border-radius:8px;
font-size:10px;
line-height:1.5
}

.result.show{display:block}
.result.correct{background:#ecfdf3;color:#027a48}
.result.wrong{background:#fef3f2;color:#b42318}

/* BOARD BUTTON */

.next{
display:none;
flex:none;
height:38px;
margin-top:8px;
border:0;
border-radius:9px;
background:var(--blue);
color:#fff;
font-size:12px;
font-weight:900;
cursor:pointer
}

.next.show{display:block}

/* LESSON */

.controls{
flex:none;
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:10px
}

label{
display:block;
font-size:9px;
font-weight:900;
margin-bottom:5px
}

select{
width:100%;
height:36px;
border:1px solid #d0d5dd;
border-radius:8px;
padding:0 8px;
background:#fff;
font-size:12px
}

.help{
font-size:9px;
color:var(--muted);
margin-top:4px
}

/* PROGRESS */

.daily{
margin-top:7px;
padding:8px;
border-radius:9px;
background:#f8f9ff;
border:1px solid #dce4ff
}

.row{
display:flex;
justify-content:space-between;
font-size:10px
}

.row:first-child{
font-weight:800;
color:#4338ca
}

.track{
height:6px;
background:#e4e7ec;
border-radius:20px;
overflow:hidden;
margin-top:5px
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--purple),#a855f7);
transition:.3s
}

/* GENERATE */

.generate{
width:100%;
height:38px;
margin-top:7px;
border:0;
border-radius:9px;
background:var(--blue);
color:#fff;
font-size:12px;
font-weight:900;
cursor:pointer
}

.generate:disabled{
opacity:.6
}

.limit{
display:none;
margin-top:6px;
padding:7px;
border-radius:8px;
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
font-size:10px;
font-weight:800;
text-align:center
}

.limit.show{display:block}

.error{
display:none;
padding:7px;
margin-top:5px;
border-radius:8px;
background:#fef3f2;
color:#b42318;
font-size:10px
}

.error.show{display:block}

/* MOBILE */

@media(max-height:700px){
.teacher{height:72px}
.teacher img{width:52px;height:52px}
.question{font-size:15px}
}

@media(max-width:360px){
.app{padding:7px}
.teacher h2{font-size:14px}
.question{font-size:15px}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="nav">Dashboard</a>
</header>

<!-- TEACHER STAYS FIXED -->
<section class="teacher">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div>
<h2>🤖 AI English Teacher</h2>
<p id="teacherMessage">Let's practise English together.</p>
<button class="listen" id="listen">🔊 Listen</button>
</div>

</section>

<!-- WHITE BOARD STAYS IN MIDDLE -->
<section class="board">

<div class="board-top">
<span class="qnum" id="number">Question</span>
<span class="category-badge" id="qcategory">Mixed</span>
</div>

<div class="question-area" id="questionArea">

<div class="empty" id="empty">
Generate a question to begin.
</div>

<div id="questionContent" style="display:none">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

</div>

</div>

<button class="next" id="next">
Next Question →
</button>

</section>

<!-- CONTROLS STAY FIXED -->
<section class="controls">

<label>CHOOSE A LESSON</label>

<select id="category">
<option>Mixed</option>
<option>Adjectives</option>
<option>Adverbs</option>
<option>Articles</option>
<option>Conjunctions</option>
<option>Nouns</option>
<option>Prepositions</option>
<option>Pronouns</option>
<option>Tenses</option>
<option>Verbs</option>
<option>Vocabulary</option>
</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>

<div class="daily">

<div class="row">
<span>📊 Daily AI Progress</span>
<b id="progress">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="fill"></div>
</div>

<div class="row" style="margin-top:4px">
<span id="used">0 used</span>
<span id="remaining">10 remaining</span>
</div>

</div>

<button class="generate" id="generate">
🤖 Generate Question
</button>

<div class="limit" id="limit">
🔒 Your daily AI limit has been reached.
</div>

<div class="error" id="error"></div>

</section>

</div>

<script>

const API="https://createlk-ai-mcq.createlk.workers.dev";
const KEY="createlk_student";

const $=id=>document.getElementById(id);

let student=null;
let id="";
let current=null;
let answered=false;
let number=0;
let speech="";

try{
student=JSON.parse(
sessionStorage.getItem(KEY) ||
localStorage.getItem(KEY) ||
"null"
);
}catch(e){}

if(!student){
location.replace("login.html");
}

id=String(
student?.id ||
student?.student_id ||
student?.user_id ||
""
);

if(!id){
location.replace("login.html");
}

/* API */

async function api(url,opt={}){
const r=await fetch(url,{
...opt,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
});

let d={};

try{d=await r.json()}catch(e){}

if(!r.ok){
throw Error(
d.message ||
d.error ||
`Request failed (${r.status})`
);
}

return d;
}

/* ERROR */

function showError(t){
$("error").textContent=t;
$("error").classList.add("show");
}

function clearError(){
$("error").classList.remove("show");
}

/* SPEECH */

function listen(){
if(!speech || !("speechSynthesis" in window))return;

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(
speech.replace(/\s+/g," ").trim()
);

u.lang="en-US";
u.rate=.9;

$("listen").textContent="🔊 Playing...";

u.onend=()=>{
$("listen").textContent="🔊 Listen";
};

speechSynthesis.speak(u);
}

$("listen").onclick=listen;

/* HELP */

const helps={
Mixed:"Grammar, vocabulary and sentence practice.",
Adjectives:"Words that describe people and things.",
Adverbs:"Words that describe actions.",
Articles:"Practise a, an and the.",
Conjunctions:"Connect words and sentences.",
Nouns:"Names of people, places and things.",
Prepositions:"Practise in, on, at, by and between.",
Pronouns:"Practise he, she, it, they and them.",
Tenses:"Practise past, present and future.",
Verbs:"Practise action words.",
Vocabulary:"Build stronger English vocabulary."
};

$("category").onchange=()=>{
$("help").textContent=helps[$("category").value];
};

/* SOURCES */

function sources(d){
return[
d,
d?.progress,
d?.stats,
d?.statistics,
d?.data,
d?.data?.progress,
d?.data?.stats
].filter(Boolean);
}

/* NUMBER */

function getNumber(d,keys){

for(const s of sources(d)){
for(const k of keys){

if(
s[k]!==undefined &&
s[k]!==null &&
s[k]!==""
){

const n=Number(s[k]);

if(Number.isFinite(n))return n;

}

}
}

return NaN;
}

/* PREMIUM */

function premium(d){

return sources(d).some(s=>{

const status=String(
s.membership_status ||
s.membershipStatus ||
""
).toUpperCase();

const plan=String(
s.plan ||
s.membership_plan ||
""
).toUpperCase();

return(
s.premium===true ||
status==="ACTIVE" ||
status==="PREMIUM" ||
status==="ACTIVE_PREMIUM" ||
plan==="PREMIUM"
);

});
}

/* PROGRESS */

async function loadProgress(){

try{

const d=await api(
`${API}/api/progress?student_id=${encodeURIComponent(id)}`
);

const isPro=premium(d);
const limit=isPro?100:10;

let used=getNumber(d,[
"daily_used",
"used",
"today_used",
"used_today",
"dailyUsage",
"todayUsage",
"questions_today",
"today_questions",
"practice_today"
]);

let remaining=getNumber(d,[
"remaining",
"daily_remaining",
"remaining_today",
"remainingToday"
]);

if(!Number.isFinite(used)&&Number.isFinite(remaining))
used=limit-remaining;

if(!Number.isFinite(remaining)&&Number.isFinite(used))
remaining=limit-used;

if(!Number.isFinite(used))used=0;
if(!Number.isFinite(remaining))remaining=limit-used;

used=Math.max(0,Math.min(limit,used));
remaining=Math.max(0,Math.min(limit,remaining));

$("progress").textContent=`${used} / ${limit}`;
$("used").textContent=`${used} used`;
$("remaining").textContent=`${remaining} remaining`;
$("fill").style.width=`${used/limit*100}%`;

if(!isPro&&remaining<=0){

$("limit").classList.add("show");
$("generate").disabled=true;
$("generate").textContent="Daily Limit Reached";

}else{

$("limit").classList.remove("show");
$("generate").disabled=false;
$("generate").textContent="🤖 Generate Question";

}

return{used,remaining,limit,isPro};

}catch(e){

console.error(e);
return null;

}
}

/* GENERATE */

async function generate(){

if($("generate").disabled)return;

clearError();

$("generate").disabled=true;
$("generate").textContent="⏳ Generating...";

const p=await loadProgress();

if(p&&!p.isPro&&p.remaining<=0)return;

answered=false;

$("empty").style.display="none";
$("questionContent").style.display="none";
$("next").classList.remove("show");

try{

const category=$("category").value;

const d=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(id)}&category=${encodeURIComponent(category)}`
);

console.log("MCQ:",d);

let q=
d.question ||
d.data?.question ||
d.mcq ||
d.data?.mcq;

if(!q&&(
d.question_text||
d.text||
d.prompt||
Array.isArray(d.options)
)){
q=d;
}

if(!q){
throw Error("AI did not return a question.");
}

current={
id:q.id||q.question_id||q.questionId||"",
question:q.question||q.question_text||q.text||q.prompt||"",
options:q.options||q.choices||q.answers||[]
};

if(
!current.question||
!Array.isArray(current.options)||
current.options.length<2
){
throw Error("AI returned an invalid question.");
}

number++;

showQuestion();

await loadProgress();

$("generate").disabled=false;
$("generate").textContent="🤖 Generate Question";

}catch(e){

console.error(e);

showError(e.message||"Could not generate question.");

$("generate").disabled=false;
$("generate").textContent="🤖 Generate Question";

$("empty").style.display="flex";

}
}

/* SHOW */

function showQuestion(){

$("number").textContent=`Question ${number}`;
$("qcategory").textContent=$("category").value;

$("question").textContent=current.question;
$("options").innerHTML="";
$("result").className="result";
$("result").innerHTML="";

let text=`Question. ${current.question}. `;

current.options.forEach((option,i)=>{

const b=document.createElement("button");

b.className="option";
b.textContent=
`${String.fromCharCode(65+i)}. ${option}`;

b.onclick=()=>answer(i);

$("options").appendChild(b);

text+=`Option ${String.fromCharCode(65+i)}. ${option}. `;

});

speech=text;

$("teacherMessage").textContent="Choose the best answer.";

$("empty").style.display="none";
$("questionContent").style.display="block";
}

/* ANSWER */

async function answer(selected){

if(answered||!current)return;

answered=true;
clearError();

const buttons=
document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

try{

const d=await api(
`${API}/api/mcq`,
{
method:"POST",
body:JSON.stringify({
student_id:id,
question_id:current.id,
answer:selected
})
}
);

if(d.success===false){
throw Error(d.message||"Answer could not be submitted.");
}

let correctAnswer=
d.correct_answer ??
d.answer ??
d.data?.correct_answer;

const correct=
d.correct===true||
d.is_correct===true||
(
correctAnswer!==undefined &&
Number(correctAnswer)===selected
);

buttons.forEach((b,i)=>{

if(
correctAnswer!==undefined &&
Number(correctAnswer)===i
){
b.classList.add("correct");
}

if(i===selected&&!correct){
b.classList.add("wrong");
}

});

const explanation=
d.explanation||
d.data?.explanation||
"Review the correct answer.";

$("result").className=
`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${safe(explanation)}`;

speech=
`${correct?"Correct!":"Incorrect."} ${explanation}`;

$("teacherMessage").textContent=
correct?"Excellent! ⭐":"Keep practising! 💪";

$("next").classList.add("show");

await loadProgress();

}catch(e){

answered=false;

buttons.forEach(b=>b.disabled=false);

showError(
e.message||"Could not submit answer."
);

}
}

/* NEXT */

$("next").onclick=()=>{

if($("next").disabled)return;

$("next").disabled=true;

generate().finally(()=>{
$("next").disabled=false;
});

};

/* GENERATE BUTTON */

$("generate").onclick=generate;

/* SAFE */

function safe(text){

const d=document.createElement("div");
d.textContent=String(text);
return d.innerHTML;

}

/* INITIAL */

loadProgress();

</script>

</body>
</html>
