<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI MCQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--p:#155eef;--v:#6d5dfc;--t:#172033;--m:#667085;
--b:#e4e7ec;--green:#12b76a;--red:#f04438
}
body{
font-family:Arial,sans-serif;background:#f5f7fb;color:var(--t);
}
.app{
max-width:430px;min-height:100svh;margin:auto;
padding:10px;display:flex;flex-direction:column;gap:10px
}
header{
height:38px;display:flex;align-items:center;
justify-content:space-between
}
.logo{font-size:17px;font-weight:900;color:var(--p)}
.nav{font-size:12px;font-weight:800;color:var(--p);text-decoration:none}
.card{
background:#fff;border:1px solid var(--b);border-radius:14px;
padding:13px;box-shadow:0 2px 10px #10182808
}

/* TEACHER */
.teacher{
display:flex;gap:12px;align-items:center;
background:linear-gradient(135deg,#eef2ff,#faf5ff);
border-color:#d9d6fe
}
.teacher img{
width:92px;height:92px;border-radius:50%;object-fit:cover;
border:3px solid #fff;box-shadow:0 0 0 2px #6d5dfc33
}
.teacher h2{font-size:17px;color:#4338ca;margin-bottom:4px}
.teacher p{font-size:11px;color:var(--m);line-height:1.45}
.speak{
margin-top:7px;border:0;border-radius:8px;padding:7px 10px;
background:#eef2ff;color:#5146d8;font-weight:800;font-size:11px
}

/* LESSON */
label{
display:block;font-size:10px;font-weight:900;margin-bottom:6px
}
select{
width:100%;height:40px;border:1px solid #d0d5dd;
border-radius:9px;padding:0 9px;background:#fff;font-size:13px
}
.help{font-size:10px;color:var(--m);margin-top:5px}

.daily{
margin-top:10px;padding:10px;border-radius:9px;
background:#f8f9ff;border:1px solid #dce4ff
}
.row{display:flex;justify-content:space-between;font-size:11px}
.row:first-child{font-weight:800;color:#4338ca}
.track{
height:8px;background:#e4e7ec;border-radius:20px;
overflow:hidden;margin-top:7px
}
.fill{
height:100%;width:0;
background:linear-gradient(90deg,var(--v),#8b5cf6);
transition:.3s
}
.generate,.next{
width:100%;height:40px;border:0;border-radius:9px;
background:var(--p);color:#fff;font-size:13px;font-weight:800;
margin-top:10px
}

/* PREMIUM */
.premium{
display:none;margin-top:9px;padding:10px;border-radius:9px;
background:#172554;color:#fff;font-size:11px;line-height:1.4
}
.premium.show{display:block}
.premium b{font-size:13px}
.premium button{
width:100%;height:35px;margin-top:7px;border:0;border-radius:8px;
background:#fff;color:var(--p);font-weight:800
}

/* QUESTION */
.question-card{min-height:220px}
.loading{text-align:center;padding:35px 5px;color:var(--m);font-size:12px}
.meta{
display:flex;justify-content:space-between;
font-size:10px;font-weight:800;color:var(--m);margin-bottom:9px
}
.meta span:last-child{
background:#f2f4f7;padding:4px 7px;border-radius:15px
}
.question{font-size:18px;font-weight:800;line-height:1.45;margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:8px}
.option{
width:100%;min-height:43px;padding:9px 11px;
border:1px solid #d0d5dd;border-radius:9px;background:#fff;
font-size:13px;text-align:left;line-height:1.4;color:var(--t)
}
.option.correct{background:#ecfdf3;border-color:var(--green);color:#027a48}
.option.wrong{background:#fef3f2;border-color:var(--red);color:#b42318}
.result{
display:none;margin-top:9px;padding:10px;border-radius:8px;
font-size:11px;line-height:1.5
}
.result.show{display:block}
.result.correct{background:#ecfdf3;color:#027a48}
.result.wrong{background:#fef3f2;color:#b42318}

.error{
display:none;margin-top:8px;padding:8px;border-radius:8px;
background:#fef3f2;color:#b42318;font-size:10px
}
.error.show{display:block}

button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}

@media(max-width:360px){
.teacher img{width:78px;height:78px}
.teacher h2{font-size:15px}
.question{font-size:16px}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="nav">Dashboard</a>
</header>

<!-- AI TEACHER -->
<section class="card teacher">
<img src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">
<div>
<h2>🤖 AI English Teacher</h2>
<p id="teacherMessage">Let's practise English together.</p>
<button class="speak" id="speak">🔊 Speak</button>
</div>
</section>

<!-- SETTINGS -->
<section class="card">

<label>CHOOSE A LESSON</label>

<select id="category">
<option>Mixed</option>
<option>Adjectives</option>
<option>Adverbs</option>
<option>Articles</option>
<option>Conjunctions</option>
<option>Nouns</option>
<option>Prepositions</option>
<option>Pronouns</option>
<option>Tenses</option>
<option>Verbs</option>
<option>Vocabulary</option>
</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>

<!-- DAILY -->
<div class="daily">

<div class="row">
<span>📊 Daily AI Progress</span>
<b id="progress">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="fill"></div>
</div>

<div class="row" style="margin-top:5px">
<span id="used">0 used</span>
<span id="remaining">10 remaining</span>
</div>

</div>

<button class="generate" id="generate">
🤖 Generate Question
</button>

<div class="premium" id="premium">
<b>⭐ CreateLK Premium</b>
<div>100 AI questions/day • 30 Days</div>
<button id="pay">⭐ Get Premium — LKR 1,500</button>
</div>

<div class="error" id="error"></div>

</section>

<!-- QUESTION -->
<section class="card question-card">

<div class="loading" id="loading">
Generate a question to begin.
</div>

<div id="questionArea" style="display:none">

<div class="meta">
<span id="number">Question</span>
<span id="qcategory">Mixed</span>
</div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

<button class="next" id="next">
Next Question →
</button>

</div>

</section>

</div>

<script>

const API="https://createlk-ai-mcq.createlk.workers.dev";
const CHECKOUT="https://createlk-payhere-checkout.createlk.workers.dev";
const KEY="createlk_student";

const $=id=>document.getElementById(id);

let student=null;
let id="";
let current=null;
let answered=false;
let number=0;
let speech="";

try{
student=JSON.parse(sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||"null");
}catch{}

if(!student){
location.replace("login.html");
}

id=String(student?.id||student?.student_id||student?.user_id||"");

if(!id){
location.replace("login.html");
}


/* API */
async function api(url,opt={}){
const r=await fetch(url,{
...opt,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
});

let d={};
try{d=await r.json()}catch{}

if(!r.ok)
throw Error(d.message||d.error||`Request failed (${r.status})`);

return d;
}


/* ERROR */
function showError(x){
$("error").textContent=x;
$("error").classList.add("show");
}
function clearError(){
$("error").classList.remove("show");
}


/* SPEECH */
function speak(text){
if(!("speechSynthesis"in window)||!text)return;
speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(
String(text).replace(/\s+/g," ").trim()
);

u.lang="en-US";
u.rate=.88;
speechSynthesis.speak(u);
}

$("speak").onclick=()=>speak(speech);


/* CATEGORY HELP */
const helps={
Mixed:"Grammar, vocabulary and sentence practice.",
Adjectives:"Words that describe people and things.",
Adverbs:"Words that describe actions.",
Articles:"Practise a, an and the.",
Conjunctions:"Connect words and sentences.",
Nouns:"Names of people, places and things.",
Prepositions:"Practise in, on, at, by and between.",
Pronouns:"Practise he, she, it, they and them.",
Tenses:"Practise past, present and future.",
Verbs:"Practise action words.",
Vocabulary:"Build stronger English vocabulary."
};

$("category").onchange=()=>{
$("help").textContent=helps[$("category").value];
};


/* PROGRESS */
function updateProgress(d){

const status=String(d.membership_status||"").toUpperCase();
const plan=String(d.plan||"").toUpperCase();

const premium=
d.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
plan==="PREMIUM";

let limit=Number(
d.daily_limit??d.limit??(premium?100:10)
);

let used=Number(
d.daily_used??d.used??d.today_used
);

let remaining=Number(
d.remaining??d.remaining_today
);

if(!Number.isFinite(limit)||limit<1)
limit=premium?100:10;

if(!Number.isFinite(used)&&Number.isFinite(remaining))
used=limit-remaining;

if(!Number.isFinite(remaining)&&Number.isFinite(used))
remaining=limit-used;

if(!Number.isFinite(used))used=0;
if(!Number.isFinite(remaining))remaining=limit-used;

used=Math.max(0,Math.min(limit,used));
remaining=Math.max(0,Math.min(limit,remaining));

$("progress").textContent=`${used} / ${limit}`;
$("fill").style.width=`${used/limit*100}%`;
$("used").textContent=`${used} used`;
$("remaining").textContent=`${remaining} remaining`;

if(!premium&&remaining<=0){
$("premium").classList.add("show");
$("generate").disabled=true;
$("generate").textContent="Daily Limit Reached";
}else{
$("premium").classList.remove("show");
$("generate").disabled=false;
$("generate").textContent="🤖 Generate Question";
}

return {premium,remaining};
}


/* LOAD PROGRESS */
async function progress(){
try{
const d=await api(
`${API}/api/progress?student_id=${encodeURIComponent(id)}`
);
if(d.success!==false)updateProgress(d);
return d;
}catch(e){
console.log(e);
return null;
}
}

progress();


/* GENERATE */
async function generate(){

if(!id||$("generate").disabled)return;

clearError();

const btn=$("generate");
btn.disabled=true;
btn.textContent="⏳ Generating...";

$("loading").style.display="block";
$("loading").textContent="Creating your AI question...";
$("questionArea").style.display="none";
answered=false;

try{

const p=await progress();

if(p&&p.remaining<=0&&!p.premium){
$("premium").classList.add("show");
$("loading").textContent="Your free daily limit has been reached.";
return;
}

const category=$("category").value;

const d=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(id)}&category=${encodeURIComponent(category)}`
);

if(!d.success||!d.question)
throw Error(d.message||"Question could not be generated.");

current=d.question;
number++;

showQuestion();
await progress();

}catch(e){

showError(e.message||"Could not generate question.");
btn.disabled=false;
btn.textContent="🤖 Generate Question";

}

}


/* SHOW QUESTION */
function showQuestion(){

if(!Array.isArray(current.options)||!current.question)
throw Error("Invalid AI question.");

$("loading").style.display="none";
$("questionArea").style.display="block";

$("number").textContent=`Question ${number}`;
$("qcategory").textContent=$("category").value;
$("question").textContent=current.question;

$("options").innerHTML="";
$("result").className="result";
$("result").innerHTML="";
$("next").style.display="none";

let voice=`Question. ${current.question}.`;

current.options.forEach((text,i)=>{

const letter=String.fromCharCode(65+i);

const b=document.createElement("button");

b.className="option";
b.textContent=`${letter}. ${text}`;
b.type="button";

b.onclick=()=>answer(i);

$("options").appendChild(b);

voice+=` Option ${letter}. ${text}.`;

});

speech=voice;

$("teacherMessage").textContent="Choose the best answer.";

setTimeout(()=>speak(voice),150);
}


/* ANSWER */
async function answer(selected){

if(answered||!current)return;

answered=true;
clearError();

const buttons=document.querySelectorAll(".option");
buttons.forEach(b=>b.disabled=true);

try{

const d=await api(`${API}/api/mcq`,{
method:"POST",
body:JSON.stringify({
student_id:id,
question_id:current.id,
answer:selected
})
});

if(!d.success)
throw Error(d.message||"Could not submit answer.");

const correct=d.correct===true;

buttons.forEach((b,i)=>{
if(i===Number(d.correct_answer))
b.classList.add("correct");

if(i===selected&&!correct)
b.classList.add("wrong");
});

const explanation=d.explanation||"Review the correct answer.";

$("result").className=`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${safe(explanation)}`;

speech=`${correct?"Correct!":"Incorrect."} ${explanation}`;

$("teacherMessage").textContent=speech;
setTimeout(()=>speak(speech),100);

$("next").style.display="block";

await progress();

}catch(e){

answered=false;
buttons.forEach(b=>b.disabled=false);
showError(e.message||"Could not submit answer.");

}

}


/* SAFE TEXT */
function safe(text){
const d=document.createElement("div");
d.textContent=String(text);
return d.innerHTML;
}


/* PAYHERE */
async function payment(){

if(!id||!student?.email){
showError("Please log in again.");
return;
}

const b=$("pay");
b.disabled=true;
b.textContent="Connecting to PayHere...";

const name=
student.name||
`${student.first_name||""} ${student.last_name||""}`.trim()||
"Student";

try{

const r=await fetch(CHECKOUT,{
method:"POST",
cache:"no-store",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
student_id:id,
first_name:student.first_name||name.split(" ")[0],
last_name:student.last_name||"",
email:student.email,
phone:student.phone||""
})
});

const d=await r.json();

if(!r.ok||d.success!==true)
throw Error(d.message||"Unable to create payment.");

const form=document.createElement("form");

form.method="POST";
form.action=d.action||"https://www.payhere.lk/pay/checkout";

Object.entries(d.payment||{}).forEach(([k,v])=>{
const input=document.createElement("input");
input.type="hidden";
input.name=k;
input.value=v??"";
form.appendChild(input);
});

document.body.appendChild(form);
form.submit();

}catch(e){

showError("Unable to start payment. "+e.message);

b.disabled=false;
b.textContent="⭐ Get Premium — LKR 1,500";

}

}


/* EVENTS */
$("generate").onclick=generate;
$("next").onclick=generate;
$("pay").onclick=payment;

</script>

</body>
</html>
