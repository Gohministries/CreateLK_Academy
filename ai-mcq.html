<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#155eef;
--purple:#7c3aed;
--text:#172033;
--muted:#667085;
--border:#e4e7ec;
--green:#12b76a;
--red:#f04438;
--bg:#f5f7fb
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text)
}

.app{
width:100%;
max-width:430px;
min-height:100svh;
margin:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:10px
}

header{
height:38px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:17px;
font-weight:900;
color:var(--blue)
}

.nav{
font-size:12px;
font-weight:800;
color:var(--blue);
text-decoration:none
}

.card{
background:#fff;
border:1px solid var(--border);
border-radius:15px;
padding:13px;
box-shadow:0 3px 12px #1018280d
}

/* TEACHER */

.teacher{
display:flex;
gap:12px;
align-items:center;
background:linear-gradient(135deg,#eef4ff,#faf5ff);
border-color:#d9d6fe;
min-height:108px
}

.teacher img{
width:82px;
height:82px;
border-radius:50%;
object-fit:cover;
border:3px solid #fff;
flex-shrink:0
}

.teacher h2{
font-size:16px;
color:#4338ca;
margin-bottom:4px
}

.teacher p{
font-size:11px;
color:var(--muted);
line-height:1.45
}

/* LESSON */

label{
display:block;
font-size:10px;
font-weight:900;
margin-bottom:6px
}

select{
width:100%;
height:40px;
border:1px solid #d0d5dd;
border-radius:9px;
padding:0 9px;
background:#fff;
font-size:13px;
color:var(--text)
}

.help{
font-size:10px;
color:var(--muted);
margin-top:5px
}

/* PROGRESS */

.daily{
margin-top:10px;
padding:10px;
border-radius:10px;
background:#f8f9ff;
border:1px solid #dce4ff
}

.row{
display:flex;
justify-content:space-between;
font-size:11px
}

.row:first-child{
font-weight:800;
color:#4338ca
}

.track{
height:8px;
background:#e4e7ec;
border-radius:20px;
overflow:hidden;
margin-top:7px
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--blue),var(--purple));
transition:.3s
}

/* GENERATE */

.generate{
width:100%;
height:42px;
border:0;
border-radius:9px;
background:linear-gradient(135deg,var(--blue),var(--purple));
color:#fff;
font-size:13px;
font-weight:800;
margin-top:10px
}

.generate:disabled{
opacity:.6
}

/* WHITEBOARD */

.question-board{
min-height:300px;
background:#fff;
border:2px solid #dbe4ff;
border-radius:16px;
padding:15px;
box-shadow:0 5px 20px #155eef12;
display:flex;
flex-direction:column
}

.board-top{
display:flex;
justify-content:space-between;
align-items:center;
font-size:10px;
font-weight:800;
color:var(--muted);
margin-bottom:14px
}

.board-top span:last-child{
background:#eef4ff;
color:var(--blue);
padding:5px 8px;
border-radius:20px
}

.placeholder{
flex:1;
min-height:240px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
font-size:12px;
line-height:1.5
}

.question-area{
display:none
}

.question{
font-size:18px;
font-weight:800;
line-height:1.45;
margin-bottom:14px
}

.options{
display:flex;
flex-direction:column;
gap:8px
}

.option{
width:100%;
min-height:43px;
padding:9px 11px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
font-size:13px;
text-align:left;
line-height:1.4;
color:var(--text);
cursor:pointer
}

.option:hover{
border-color:#98b5ff;
background:#f8faff
}

.option.correct{
background:#ecfdf3;
border-color:var(--green);
color:#027a48
}

.option.wrong{
background:#fef3f2;
border-color:var(--red);
color:#b42318
}

.option:disabled{
cursor:default
}

/* LISTEN */

.listen{
width:100%;
height:38px;
margin-top:11px;
border:1px solid #c7d7fe;
border-radius:9px;
background:#eef4ff;
color:var(--blue);
font-size:11px;
font-weight:800;
cursor:pointer
}

.listen.speaking{
background:#ede9fe;
color:#6d28d9
}

/* RESULT */

.result{
display:none;
margin-top:10px;
padding:10px;
border-radius:9px;
font-size:11px;
line-height:1.5
}

.result.show{
display:block
}

.result.correct{
background:#ecfdf3;
color:#027a48
}

.result.wrong{
background:#fef3f2;
color:#b42318
}

.next{
width:100%;
height:40px;
border:0;
border-radius:9px;
background:var(--blue);
color:#fff;
font-size:12px;
font-weight:800;
margin-top:10px;
cursor:pointer
}

/* ERROR */

.error{
display:none;
padding:9px;
border-radius:9px;
background:#fef3f2;
color:#b42318;
font-size:10px
}

.error.show{
display:block
}

/* PREMIUM */

.limit{
display:none;
padding:10px;
border-radius:9px;
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
text-align:center;
font-size:11px;
font-weight:800
}

.limit.show{
display:block
}

@media(max-width:360px){
.teacher img{width:72px;height:72px}
.teacher h2{font-size:15px}
.question{font-size:16px}
.question-board{min-height:285px}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="nav">Dashboard</a>
</header>

<!-- TEACHER: FIXED POSITION -->
<section class="card teacher">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div>
<h2>🤖 AI English Teacher</h2>
<p id="teacherMessage">Let's practise English together.</p>
</div>

</section>

<!-- LESSON + PROGRESS + GENERATE: FIXED POSITION -->
<section class="card">

<label>CHOOSE A LESSON</label>

<select id="category">
<option>Mixed</option>
<option>Adjectives</option>
<option>Adverbs</option>
<option>Articles</option>
<option>Conjunctions</option>
<option>Nouns</option>
<option>Prepositions</option>
<option>Pronouns</option>
<option>Tenses</option>
<option>Verbs</option>
<option>Vocabulary</option>
</select>

<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>

<div class="daily">

<div class="row">
<span>📊 Daily AI Progress</span>
<b id="progress">0 / 10</b>
</div>

<div class="track">
<div class="fill" id="fill"></div>
</div>

<div class="row" style="margin-top:5px">
<span id="used">0 used</span>
<span id="remaining">10 remaining</span>
</div>

</div>

<button class="generate" id="generate">
🤖 Generate Question
</button>

</section>

<div class="limit" id="limit">
🔒 Your daily AI limit has been reached.
</div>

<div class="error" id="error"></div>

<!-- ONE FIXED WHITEBOARD -->
<section class="question-board">

<div class="board-top">
<span id="number">Question</span>
<span id="qcategory">Mixed</span>
</div>

<div class="placeholder" id="placeholder">
Generate a question to begin.
</div>

<div class="question-area" id="questionArea">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<button class="listen" id="listen">
🔊 Listen to Question
</button>

<div class="result" id="result"></div>

<button class="next" id="next" style="display:none">
Next Question →
</button>

</div>

</section>

</div>

<script>
const API="https://createlk-ai-mcq.createlk.workers.dev";
const KEY="createlk_student";

const $=id=>document.getElementById(id);

let student=null;
let id="";
let current=null;
let answered=false;
let number=0;
let voiceText="";

try{
student=JSON.parse(
sessionStorage.getItem(KEY)||
localStorage.getItem(KEY)||
"null"
);
}catch(e){}

if(!student){
location.replace("login.html");
}

id=String(
student?.id||
student?.student_id||
student?.user_id||
""
);

if(!id){
location.replace("login.html");
}

/* HELP */

const helps={
Mixed:"Grammar, vocabulary and sentence practice.",
Adjectives:"Words that describe people and things.",
Adverbs:"Words that describe actions.",
Articles:"Practise a, an and the.",
Conjunctions:"Connect words and sentences.",
Nouns:"Names of people, places and things.",
Prepositions:"Practise in, on, at, by and between.",
Pronouns:"Practise he, she, it, they and them.",
Tenses:"Practise past, present and future.",
Verbs:"Practise action words.",
Vocabulary:"Build stronger English vocabulary."
};

$("category").onchange=()=>{
$("help").textContent=helps[$("category").value];
};

/* API */

async function api(url,opt={}){
const r=await fetch(url,{
...opt,
cache:"no-store",
headers:{
Accept:"application/json",
"Content-Type":"application/json",
...(opt.headers||{})
}
});

let d={};

try{
d=await r.json();
}catch(e){}

if(!r.ok){
throw Error(
d.message||
d.error||
`Request failed (${r.status})`
);
}

return d;
}

/* DATA */

function sources(d){
return[
d,
d?.progress,
d?.stats,
d?.statistics,
d?.data,
d?.data?.progress,
d?.data?.stats
].filter(Boolean);
}

function num(d,keys){
for(const s of sources(d)){
for(const k of keys){
if(s[k]!==undefined&&s[k]!==null&&s[k]!==""){
const n=Number(s[k]);
if(Number.isFinite(n))return n;
}
}
}
return NaN;
}

function premium(d){
return sources(d).some(s=>{
const status=String(
s.membership_status||
s.membershipStatus||
""
).toUpperCase();

const plan=String(
s.plan||
s.membership_plan||
""
).toUpperCase();

return s.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
status==="ACTIVE_PREMIUM"||
plan==="PREMIUM";
});
}

/* DAILY */

function updateProgress(d){

const isPro=premium(d);
const limit=isPro?100:10;

let used=num(d,[
"daily_used",
"used",
"today_used",
"used_today",
"dailyUsage",
"todayUsage",
"questions_today",
"today_questions",
"practice_today"
]);

let remaining=num(d,[
"remaining",
"daily_remaining",
"remaining_today",
"remainingToday"
]);

if(!Number.isFinite(used)&&Number.isFinite(remaining))
used=limit-remaining;

if(!Number.isFinite(remaining)&&Number.isFinite(used))
remaining=limit-used;

if(!Number.isFinite(used))used=0;
if(!Number.isFinite(remaining))remaining=limit-used;

used=Math.max(0,Math.min(limit,used));
remaining=Math.max(0,Math.min(limit,remaining));

$("progress").textContent=`${used} / ${limit}`;
$("used").textContent=`${used} used`;
$("remaining").textContent=`${remaining} remaining`;

$("fill").style.width=
`${Math.min(100,used/limit*100)}%`;

if(!isPro&&remaining<=0){
$("limit").classList.add("show");
$("generate").disabled=true;
$("generate").textContent="Daily Limit Reached";
}else{
$("limit").classList.remove("show");
$("generate").disabled=false;
$("generate").textContent="🤖 Generate Question";
}

return{isPro,limit,used,remaining};
}

async function loadProgress(){
try{
const d=await api(
`${API}/api/progress?student_id=${encodeURIComponent(id)}`
);

console.log("Progress:",d);
return updateProgress(d);

}catch(e){
console.error("Progress error:",e);
return null;
}
}

/* GENERATE */

async function generate(){

if($("generate").disabled)return;

clearError();

const btn=$("generate");

btn.disabled=true;
btn.textContent="⏳ Generating...";

answered=false;
current=null;

try{

const p=await loadProgress();

if(p&&!p.isPro&&p.remaining<=0)return;

const category=$("category").value;

const d=await api(
`${API}/api/mcq?student_id=${encodeURIComponent(id)}&category=${encodeURIComponent(category)}`
);

console.log("MCQ:",d);

let q=
d.question||
d.data?.question||
d.mcq||
d.data?.mcq;

if(!q&&(
d.question_text||
d.text||
d.prompt||
Array.isArray(d.options)
)){
q=d;
}

if(!q){
throw Error("AI did not return a question.");
}

current={
id:q.id||q.question_id||q.questionId||"",
question:q.question||q.question_text||q.text||q.prompt||"",
options:q.options||q.choices||q.answers||[]
};

if(
!current.question||
!Array.isArray(current.options)||
current.options.length<2
){
throw Error("AI returned an invalid question. Please try again.");
}

number++;
showQuestion();
await loadProgress();

}catch(e){

console.error(e);
showError(e.message||"Could not generate question.");

btn.disabled=false;
btn.textContent="🤖 Generate Question";
}
}

/* SHOW */

function showQuestion(){

$("placeholder").style.display="none";
$("questionArea").style.display="block";

$("number").textContent=`Question ${number}`;
$("qcategory").textContent=$("category").value;

$("question").textContent=current.question;

$("options").innerHTML="";
$("result").className="result";
$("result").innerHTML="";
$("next").style.display="none";

voiceText=`${current.question}. `;

current.options.forEach((text,i)=>{

const b=document.createElement("button");

b.className="option";
b.textContent=
`${String.fromCharCode(65+i)}. ${text}`;

b.onclick=()=>answer(i);

$("options").appendChild(b);

voiceText+=
`Option ${String.fromCharCode(65+i)}. ${text}. `;
});

$("teacherMessage").textContent=
"Choose the best answer.";
}

/* VOICE */

function listen(){

if(!voiceText)return;

if(!("speechSynthesis" in window)){
showError("Voice is not supported by this browser.");
return;
}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(voiceText);

u.lang="en-US";
u.rate=.88;
u.pitch=1;

$("listen").classList.add("speaking");
$("listen").textContent="🔊 Reading...";

u.onend=()=>{
$("listen").classList.remove("speaking");
$("listen").textContent="🔊 Listen to Question";
};

u.onerror=()=>{
$("listen").classList.remove("speaking");
$("listen").textContent="🔊 Listen to Question";
};

speechSynthesis.speak(u);
}

$("listen").onclick=listen;

/* ANSWER */

async function answer(selected){

if(answered||!current)return;

answered=true;
clearError();

const buttons=document.querySelectorAll(".option");
buttons.forEach(b=>b.disabled=true);

try{

const d=await api(
`${API}/api/mcq`,
{
method:"POST",
body:JSON.stringify({
student_id:id,
question_id:current.id,
answer:selected
})
}
);

if(d.success===false){
throw Error(d.message||"Could not submit answer.");
}

let correctAnswer=
d.correct_answer ??
d.answer ??
d.data?.correct_answer;

const correct=
d.correct===true||
d.is_correct===true;

buttons.forEach((b,i)=>{

if(
correctAnswer!==undefined&&
i===Number(correctAnswer)
){
b.classList.add("correct");
}

if(i===selected&&!correct){
b.classList.add("wrong");
}

});

const explanation=
d.explanation||
d.data?.explanation||
"Review the correct answer.";

$("result").className=
`result show ${correct?"correct":"wrong"}`;

$("result").innerHTML=
`<b>${correct?"✓ Correct!":"✗ Incorrect"}</b><br>${safe(explanation)}`;

$("teacherMessage").textContent=
correct?"Excellent work!":"Keep practising!";

$("next").style.display="block";

await loadProgress();

}catch(e){

answered=false;
buttons.forEach(b=>b.disabled=false);

showError(e.message||"Could not submit answer.");
}
}

/* NEXT */

$("next").onclick=generate;
$("generate").onclick=generate;

function safe(text){
const d=document.createElement("div");
d.textContent=String(text);
return d.innerHTML;
}

/* START */

loadProgress();
</script>

</body>
</html>
