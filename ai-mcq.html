<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CreateLK Academy | AI English</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#2563eb;
--purple:#7c3aed;
--navy:#172033;
--muted:#667085;
--border:#cbd5e1;
--green:#16a34a;
--red:#dc2626;
--bg:#f3f6fc
}

html,body{width:100%;height:100%}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--navy)
}

button,select{font-family:inherit}
button{cursor:pointer}

/* APP */
.app{
width:100%;
max-width:430px;
height:100svh;
margin:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:9px;
overflow:hidden
}

/* HEADER */
header{
height:36px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
color:var(--blue);
font-size:17px;
font-weight:900
}

.nav{
color:var(--blue);
font-size:12px;
font-weight:900;
text-decoration:none
}

/* TEACHER */
.teacher{
height:94px;
flex:none;
display:flex;
align-items:center;
gap:12px;
padding:10px 12px;
border:1px solid #dbe3ff;
border-radius:17px;
background:linear-gradient(135deg,#eef5ff,#f5f0ff);
box-shadow:0 4px 14px rgba(37,99,235,.07)
}

.teacher img{
width:70px;
height:70px;
flex:none;
object-fit:cover;
border-radius:50%;
border:3px solid #fff;
box-shadow:0 3px 10px rgba(16,24,40,.1)
}

.teacher-info{
min-width:0
}

.teacher h2{
color:var(--navy);
font-size:16px;
line-height:1.2
}

.teacher p{
margin-top:4px;
color:var(--muted);
font-size:11px
}

.listen{
margin-top:6px;
height:29px;
min-width:82px;
padding:0 12px;
border:1px solid #dbe3ff;
border-radius:8px;
background:#fff;
color:#4f46a5;
font-size:11px;
font-weight:900;
box-shadow:0 2px 5px rgba(16,24,40,.06)
}

.listen:active{
transform:scale(.98)
}

/* QUESTION BOARD */
.board{
flex:1;
min-height:0;
display:flex;
flex-direction:column;
background:#fff;
border:1.5px solid #cbd5e1;
border-radius:18px;
box-shadow:0 6px 22px rgba(16,24,40,.06);
overflow:hidden;
position:relative
}

/* SMALL TOP ACCENT */
.board:before{
content:"";
position:absolute;
top:0;
left:14px;
right:14px;
height:2px;
border-radius:10px;
background:linear-gradient(90deg,var(--blue),var(--purple));
z-index:2
}

/* BOARD HEADER */
.board-head{
height:52px;
flex:none;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
border-bottom:1px solid #edf0f4
}

.qnum{
font-size:12px;
font-weight:900;
color:var(--blue)
}

.badge{
padding:6px 10px;
border-radius:20px;
background:#f2f4f7;
color:#475467;
font-size:10px;
font-weight:900
}

/* QUESTION AREA */
.question-scroll{
flex:1;
min-height:0;
overflow-y:auto;
padding:17px
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
font-size:12px
}

/* QUESTION CONTENT */
.question-content{
display:none;
height:100%;
flex-direction:column;
justify-content:center
}

.question{
margin-bottom:17px;
color:var(--navy);
font-size:18px;
font-weight:800;
line-height:1.5
}

/* OPTIONS */
.options{
display:flex;
flex-direction:column;
gap:9px
}

.option{
width:100%;
min-height:50px;
padding:11px 13px;
border:2px solid #dfe5ee;
border-radius:12px;
background:#fff;
color:var(--navy);
font-size:13px;
line-height:1.4;
text-align:left;
transition:.15s
}

.option:hover{
border-color:#9db9f8;
background:#f7faff
}

.option:active{
transform:scale(.995)
}

.option:disabled{
cursor:default
}

/* RESULT */
.result{
display:none;
margin:0;
padding:16px;
border-radius:12px;
font-size:12px;
line-height:1.6;
text-align:center;
width:100%
}

.result.show{
display:block
}

.result.correct{
background:#ecfdf3;
border:1px solid #abefc6;
color:#087443
}

.result.wrong{
background:#fef3f2;
border:1px solid #fecdca;
color:#b42318
}

.explain-title{
margin-bottom:6px;
font-size:14px;
font-weight:900
}

/* CONTROLS */
.controls{
flex:none;
padding:11px;
background:#fff;
border:1px solid var(--border);
border-radius:16px;
box-shadow:0 3px 12px rgba(16,24,40,.04)
}

label{
display:block;
margin-bottom:6px;
color:#344054;
font-size:10px;
font-weight:900
}

select{
width:100%;
height:40px;
padding:0 10px;
border:1px solid #d0d5dd;
border-radius:9px;
background:#fff;
color:var(--navy);
font-size:13px;
outline:none
}

select:focus{
border-color:#8fb0f5
}

.help{
margin-top:5px;
color:var(--muted);
font-size:10px
}

/* DAILY */
.daily{
margin-top:8px;
padding:10px;
border:1px solid #dce5ff;
border-radius:11px;
background:linear-gradient(135deg,#f7f9ff,#faf8ff)
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
color:var(--muted);
font-size:10px
}

.row:first-child{
color:#4338a8;
font-weight:900
}

.track{
height:7px;
margin-top:7px;
overflow:hidden;
border-radius:20px;
background:#e5e7eb
}

.fill{
width:0;
height:100%;
border-radius:20px;
background:linear-gradient(90deg,var(--blue),var(--purple));
transition:.3s
}

/* GENERATE */
.generate{
width:100%;
height:44px;
margin-top:8px;
border:0;
border-radius:10px;
background:linear-gradient(135deg,var(--blue),var(--purple));
color:#fff;
font-size:13px;
font-weight:900;
box-shadow:0 5px 12px rgba(37,99,235,.2)
}

.generate:active{
transform:scale(.99)
}

.generate:disabled{
opacity:.6;
cursor:not-allowed
}

/* MESSAGES */
.limit,.error{
display:none;
margin-top:6px;
padding:7px;
border-radius:8px;
font-size:10px
}

.limit{
border:1px solid #fed7aa;
background:#fff7ed;
color:#9a3412;
font-weight:800;
text-align:center
}

.error{
background:#fef3f2;
color:#b42318
}

.limit.show,.error.show{
display:block
}

/* SMALL HEIGHT */
@media(max-height:720px){

.teacher{
height:84px
}

.teacher img{
width:60px;
height:60px
}

.teacher h2{
font-size:15px
}

.teacher p{
font-size:10px
}

.question{
font-size:16px;
margin-bottom:12px
}

.option{
min-height:43px;
padding:9px 11px
}

.controls{
padding:9px
}

.daily{
margin-top:6px;
padding:8px
}

.generate{
height:40px
}
}

/* SMALL WIDTH */
@media(max-width:360px){

.app{
padding:7px;
gap:7px
}

.logo{
font-size:15px
}

.teacher{
height:80px;
padding:8px 10px
}

.teacher img{
width:56px;
height:56px
}

.teacher h2{
font-size:14px
}

.teacher p{
font-size:10px
}

.listen{
height:27px
}

.question-scroll{
padding:13px
}

.question{
font-size:15px
}

.option{
min-height:41px;
font-size:12px
}

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="nav">
Dashboard
</a>

</header>


<section class="teacher">

<img
src="https://assets.createlk.com/file_0000000018e08208b00cf7445bca7027.png"
alt="AI English Teacher">

<div class="teacher-info">

<h2>
🤖 AI English Teacher
</h2>

<p id="teacherMessage">
Let's practise English together.
</p>

<button class="listen" id="listen">
🔊 Listen
</button>

</div>

</section>


<section class="board">

<div class="board-head">

<span class="qnum" id="number">
Question
</span>

<span class="badge" id="qcategory">
Mixed
</span>

</div>


<div class="question-scroll" id="questionScroll">

<div class="empty" id="empty">
Generate a question to begin.
</div>


<div class="question-content" id="questionContent">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<div class="result" id="result"></div>

</div>

</div>

</section>


<section class="controls">

<label>
CHOOSE A LESSON
</label>


<select id="category">

<option>Mixed</option>
<option>Adjectives</option>
<option>Adverbs</option>
<option>Articles</option>
<option>Conjunctions</option>
<option>Nouns</option>
<option>Prepositions</option>
<option>Pronouns</option>
<option>Tenses</option>
<option>Verbs</option>
<option>Vocabulary</option>

</select>


<div class="help" id="help">
Grammar, vocabulary and sentence practice.
</div>


<div class="daily">

<div class="row">

<span>
📊 Daily AI Progress
</span>

<b id="progress">
0 / 10
</b>

</div>


<div class="track">

<div class="fill" id="fill"></div>

</div>


<div class="row" style="margin-top:5px">

<span id="used">
0 used
</span>

<span id="remaining">
10 remaining
</span>

</div>

</div>


<button class="generate" id="generate">
✨ Generate Question
</button>


<div class="limit" id="limit">
🔒 Your daily AI limit has been reached.
</div>


<div class="error" id="error"></div>

</section>

</div>


<script>

const API=
"https://createlk-ai-mcq.createlk.workers.dev";

const KEY=
"createlk_student";

const $=
id=>document.getElementById(id);


let student=null;
let current=null;
let answered=false;
let questionNumber=0;
let speechText="";


/* LOGIN */

try{

student=JSON.parse(
sessionStorage.getItem(KEY)||
localStorage.getItem(KEY)||
"null"
);

}catch(e){}

if(!student)
location.replace("login.html");


const studentId=String(
student?.id||
student?.student_id||
student?.user_id||
""
);

if(!studentId)
location.replace("login.html");


/* API */

async function api(url,options={}){

const r=await fetch(url,{

...options,

cache:"no-store",

headers:{

Accept:"application/json",

"Content-Type":
"application/json",

...(options.headers||{})

}

});


let d={};

try{
d=await r.json();
}catch(e){}


if(!r.ok){

throw new Error(
d.message||
d.error||
`Request failed (${r.status})`
);

}

return d;

}


/* ERROR */

function showError(msg){

$("error").textContent=msg;

$("error").classList.add("show");

}


function clearError(){

$("error").textContent="";

$("error").classList.remove("show");

}


/* SPEECH
   Reads only what is currently visible
   inside the question board.
*/

function updateSpeech(){

if(
$("questionContent").style.display==="none"||
!$("questionContent").style.display
){

speechText="";

return;

}


const result=
$("result");


/* After answering:
   read only the visible explanation.
*/

if(
result.classList.contains("show")
){

speechText=
result.innerText
.replace(/\s+/g," ")
.trim();

return;

}


/* Before answering:
   read question + visible options.
*/

const question=
$("question").innerText.trim();


const options=
[...$("options").children]
.map(b=>b.innerText.trim())
.join(". ");


speechText=
`${question}. ${options}`.trim();

}


/* LISTEN */

$("listen").onclick=()=>{

if(!speechText)
return;

if(!("speechSynthesis" in window))
return;


/* Stop previous speech immediately */

speechSynthesis.cancel();


const text=
speechText;


const u=
new SpeechSynthesisUtterance(text);


/* QUICK START + NATURAL SPEED */

u.lang="en-US";
u.rate=1.15;
u.pitch=1;
u.volume=1;


/* Show status immediately */

$("listen").textContent=
"🔊 Playing...";


u.onend=()=>{

$("listen").textContent=
"🔊 Listen";

};


u.onerror=()=>{

$("listen").textContent=
"🔊 Listen";

};


/*
Small delay helps Android Chrome
start the speech engine quickly.
*/

setTimeout(()=>{

speechSynthesis.speak(u);

},30);

};


/* LESSON HELP */

const help={

Mixed:
"Grammar, vocabulary and sentence practice.",

Adjectives:
"Words that describe people and things.",

Adverbs:
"Words that describe actions.",

Articles:
"Practise a, an and the.",

Conjunctions:
"Connect words and sentences.",

Nouns:
"Names of people, places and things.",

Prepositions:
"Practise in, on, at, by and between.",

Pronouns:
"Practise he, she, it, they and them.",

Tenses:
"Practise past, present and future.",

Verbs:
"Practise action words.",

Vocabulary:
"Build stronger English vocabulary."

};


$("category").onchange=()=>{

$("help").textContent=
help[$("category").value];

};


/* DATA */

function sources(d){

return[
d,
d?.progress,
d?.stats,
d?.statistics,
d?.data,
d?.data?.progress,
d?.data?.stats
].filter(Boolean);

}


function num(d,keys){

for(const s of sources(d)){

for(const k of keys){

if(
s[k]!==undefined&&
s[k]!==null&&
s[k]!==""
){

const n=
Number(s[k]);

if(Number.isFinite(n))
return n;

}

}

}

return NaN;

}


function premium(d){

return sources(d).some(s=>{

const status=
String(
s.membership_status||
s.membershipStatus||
""
).toUpperCase();


const plan=
String(
s.plan||
s.membership_plan||
""
).toUpperCase();


return(
s.premium===true||
status==="ACTIVE"||
status==="PREMIUM"||
status==="ACTIVE_PREMIUM"||
plan==="PREMIUM"
);

});

}


/* PROGRESS */

function updateProgress(d){

const pro=
premium(d);

const limit=
pro?100:10;


let used=
num(d,[

"daily_used",
"used",
"today_used",
"used_today",
"dailyUsage",
"todayUsage",
"questions_today",
"today_questions",
"practice_today"

]);


let remaining=
num(d,[

"remaining",
"daily_remaining",
"remaining_today",
"remainingToday"

]);


if(
!Number.isFinite(used)&&
Number.isFinite(remaining)
)
used=limit-remaining;


if(
!Number.isFinite(remaining)&&
Number.isFinite(used)
)
remaining=limit-used;


if(!Number.isFinite(used))
used=0;


if(!Number.isFinite(remaining))
remaining=limit-used;


used=
Math.max(
0,
Math.min(limit,used)
);


remaining=
Math.max(
0,
Math.min(limit,remaining)
);


$("progress").textContent=
`${used} / ${limit}`;


$("used").textContent=
`${used} used`;


$("remaining").textContent=
`${remaining} remaining`;


$("fill").style.width=
`${Math.min(100,used/limit*100)}%`;


const locked=
!pro&&remaining<=0;


$("limit").classList.toggle(
"show",
locked
);


$("generate").disabled=
locked;


$("generate").textContent=
locked?
"Daily Limit Reached":
"✨ Generate Question";


return{
premium:pro,
limit,
used,
remaining
};

}


async function loadProgress(){

try{

const d=
await api(
`${API}/api/progress?student_id=${encodeURIComponent(studentId)}`
);


if(d.success===false)

throw new Error(
d.message||
"Progress could not be loaded."
);


return updateProgress(d);


}catch(e){

console.error(e);

return null;

}

}


/* QUESTION */

function extractQuestion(d){

let q=
d?.question||
d?.data?.question||
d?.mcq||
d?.data?.mcq;


if(
!q&&
(
d?.question_text||
d?.text||
d?.prompt||
Array.isArray(d?.options)
)
)
q=d;


if(!q)
return null;


return{

id:
q.id||
q.question_id||
q.questionId||
"",

question:
String(
q.question||
q.question_text||
q.text||
q.prompt||
""
),

options:

Array.isArray(q.options)?
q.options:

Array.isArray(q.choices)?
q.choices:

Array.isArray(q.answers)?
q.answers:
[],

answer:
q.answer||
q.correct_answer||
q.correctAnswer||
q.correct||
"",

correct_index:
q.correct_index,

correctOption:
q.correctOption,

explanation:
q.explanation||
q.explain||
""

};

}


/* GENERATE */

async function generate(){

if($("generate").disabled)
return;


clearError();


$("generate").disabled=
true;

$("generate").textContent=
"⏳ Generating...";


const p=
await loadProgress();


if(
p&&
!p.premium&&
p.remaining<=0
)
return;


answered=false;
current=null;


/* Reset board */

$("empty").style.display=
"none";

$("questionContent").style.display=
"flex";

$("question").style.display=
"block";

$("options").style.display=
"flex";

$("result").className=
"result";

$("result").innerHTML="";

$("question").textContent="";

$("options").innerHTML="";

$("questionScroll").scrollTop=0;


try{

const category=
$("category").value;


const d=
await api(

`${API}/api/mcq?student_id=${encodeURIComponent(studentId)}&category=${encodeURIComponent(category)}`

);


const q=
extractQuestion(d);


if(
!q||
!q.question||
q.options.length<2
){

throw new Error(
d.message||
"AI returned an invalid question."
);

}


current=q;

questionNumber++;


showQuestion();


await loadProgress();


}catch(e){

console.error(e);


$("questionContent").style.display=
"none";

$("empty").style.display=
"flex";

$("empty").textContent=
"Generate a question to begin.";


showError(
e.message||
"Could not generate question."
);


}finally{


if(
!$("limit").classList.contains("show")
){

$("generate").disabled=
false;

$("generate").textContent=
"✨ Generate Question";

}

}

}


/* SHOW QUESTION */

function showQuestion(){

$("empty").style.display=
"none";


$("questionContent").style.display=
"flex";


/* Restore after previous answer */

$("question").style.display=
"block";

$("options").style.display=
"flex";


$("number").textContent=
`Question ${questionNumber}`;


$("qcategory").textContent=
$("category").value;


$("question").textContent=
current.question;


const box=
$("options");


box.innerHTML="";


$("result").className=
"result";

$("result").innerHTML="";


current.options.forEach((text,i)=>{

const b=
document.createElement("button");


b.className=
"option";


b.type=
"button";


b.textContent=
String(text);


b.onclick=
()=>answer(i,b);


box.appendChild(b);

});


/* Update visible board speech */

updateSpeech();

}


/* ANSWER */

function answer(index,button){

if(answered)
return;


answered=true;


const selected=
String(
current.options[index]
).trim();


let correct=
current.answer;


if(typeof correct==="number"){

correct=
String(
current.options[correct]||
correct
);

}


correct=
String(correct||"").trim();


let correctIndex=
-1;


/* Find correct answer */

current.options.forEach(
(option,i)=>{

if(
String(option)
.trim()
.toLowerCase()===
correct.toLowerCase()
){

correctIndex=i;

}

});


if(
correctIndex<0&&
current.correct_index!==undefined
){

correctIndex=
Number(current.correct_index);

}


if(
correctIndex<0&&
current.correctOption!==undefined
){

correctIndex=
Number(current.correctOption);

}


const isCorrect=
correctIndex>=0?

index===correctIndex:

selected.toLowerCase()===
correct.toLowerCase();


const explanation=
current.explanation||

(
correct?

`The correct answer is "${correct}".`:

"Review the sentence and try to remember the correct form."
);


/*
Hide question and options.
Only result remains.
*/

$("question").style.display=
"none";

$("options").style.display=
"none";


/* Show explanation in middle */

const result=
$("result");


result.className=
`result show ${
isCorrect?
"correct":
"wrong"
}`;


result.innerHTML=`

<div class="explain-title">
${isCorrect?
"✓ Correct!":
"✕ Not quite."}
</div>

${escapeHtml(explanation)}

`;


/*
Voice now reads exactly
what is visible.
*/

updateSpeech();


/* Generate button becomes next-question button */

$("generate").disabled=
false;

$("generate").textContent=
"✨ Generate Question";


$("teacherMessage").textContent=
isCorrect?

"Excellent! Keep going. 🌟":

"Good try! Learn from the explanation. 💪";


$("questionScroll").scrollTop=0;

}


/* SAFE TEXT */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* GENERATE BUTTON */

$("generate").onclick=
generate;


/* START */

loadProgress();

</script>

</body>
</html>
