
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK V2 Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font:15px Arial}
header{background:#102a56;color:white;padding:18px}main{max-width:850px;margin:18px auto;padding:0 12px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;border:1px solid #ddd}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;color:#102a56}
label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccd4df;border-radius:7px;font:inherit}
textarea{min-height:75px}button{padding:10px 13px;margin:5px 3px 5px 0;border:0;border-radius:7px;background:#102a56;color:white;cursor:pointer}
.gold{background:#f4bd35;color:#102a56}.red{background:#b42318}.item{padding:12px;border:1px solid #ddd;border-radius:8px;margin:9px 0;overflow-wrap:anywhere}
small,.muted{color:#667085}#app{display:none}#msg{white-space:pre-wrap}
.lang{border-top:1px solid #eee;margin-top:12px;padding-top:5px}
@media(max-width:500px){.card{padding:12px}}
</style>
</head>
<body>
<header><b>CreateLK V2 Admin</b><div><small style="color:white">Multilingual Category & Content Manager</small></div></header>
<main>
<section class="card" id="login">
<h2>Admin Login</h2><div id="google"></div><p id="err"></p>
</section>

<div id="app">
<section class="card">
<b id="email"></b>
<button onclick="load()">Refresh</button><button onclick="logout()">Logout</button>
<p id="msg"></p>
<div id="stats"></div>
</section>

<section class="card" id="catForm">
<h2 id="ch">Add Category</h2>
<input type="hidden" id="cid">
<label>Parent Category</label><select id="parent"><option value="">Main Category</option></select>
<div class="lang"><h3>English</h3>
<label>Category Name</label><input id="cn" placeholder="English name">
</div>
<div class="lang"><h3>Tamil</h3>
<label>வகை பெயர்</label><input id="ct" placeholder="தமிழ் பெயர்">
</div>
<div class="lang"><h3>Sinhala</h3>
<label>ප්‍රවර්ග නාමය</label><input id="cs" placeholder="සිංහල නම">
</div>
<label>Description (optional)</label><textarea id="cd"></textarea>
<label>Order</label><input id="co" type="number" value="0">
<button class="gold" onclick="saveCat()">Save Category</button>
<button onclick="clearCat()">Clear</button>
</section>

<section class="card">
<h2>Categories</h2><input id="csearch" placeholder="Search..." oninput="renderCats()">
<div id="cats"></div>
</section>

<section class="card" id="contentForm">
<h2 id="th">Add Content</h2><input type="hidden" id="tid">
<label>Category</label><select id="tc"></select>

<div class="lang"><h3>English</h3>
<label>Title</label><input id="enT">
<label>Description</label><textarea id="enD"></textarea>
<label>Explanation</label><textarea id="enE"></textarea>
</div>
<div class="lang"><h3>Tamil</h3>
<label>தலைப்பு</label><input id="taT">
<label>விளக்கம்</label><textarea id="taD"></textarea>
<label>விரிவான விளக்கம்</label><textarea id="taE"></textarea>
</div>
<div class="lang"><h3>Sinhala</h3>
<label>මාතෘකාව</label><input id="siT">
<label>විස්තරය</label><textarea id="siD"></textarea>
<label>පැහැදිලි කිරීම</label><textarea id="siE"></textarea>
</div>

<label>Photo (JPG, PNG, WEBP, GIF; max 10 MB)</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<img id="preview" style="display:none;max-width:150px;margin-top:8px" alt="Photo preview">
<input type="hidden" id="image">
<small id="uploadStatus">Optional photo</small>
<label>Order</label><input id="to" type="number" value="0">
<button class="gold" onclick="saveContent()">Save Content</button>
<button onclick="clearContent()">Clear</button>
</section>

<section class="card">
<h2>Content Items</h2><input id="tsearch" placeholder="Search..." oninput="renderContents()">
<div id="contents"></div>
</section>
</div>
</main>

<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const ADMIN="gateofheavensl1@gmail.com";
const $=id=>document.getElementById(id);
let token="",cats=[],items=[],uploading=false;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(s,bad=false){$("msg").textContent=s;$("msg").style.color=bad?"#b42318":"#16803d"}
async function req(path,opts={}){
 let h=new Headers(opts.headers||{});h.set("Authorization","Bearer "+token);
 if(opts.body&&!(opts.body instanceof ArrayBuffer))h.set("Content-Type","application/json");
 let r=await fetch(API+path,{...opts,headers:h}),d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||"Request failed: "+r.status);return d;
}
function googleLogin(r){
 token=r.credential;
 try{let p=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
 if(p.email!==ADMIN||!p.email_verified)throw Error("Unauthorized account");}
 catch(e){token="";$("err").textContent="Please use the authorized Google account.";return}
 start().catch(e=>{$("err").textContent=e.message});
}
async function start(){await load();$("login").style.display="none";$("app").style.display="block";$("email").textContent=ADMIN}
function logout(){token="";$("app").style.display="none";$("login").style.display="block";$("err").textContent="Logged out."}
async function load(){let d=await req("/api/bootstrap");cats=d.categories||[];items=d.contents||[];render();say("Data loaded successfully.")}
function name(c){return c.name_en||c.name||c.name_ta||c.name_si||("Category "+c.id)}
function path(id,n=0){
 let c=cats.find(x=>+x.id===+id);if(!c)return "Unknown";
 return c.parent_id?path(c.parent_id,n+1)+" › "+name(c):name(c)
}
function render(){
 $("stats").textContent=`Categories: ${cats.length} | Subcategories: ${cats.filter(c=>c.parent_id).length} | Content: ${items.length}`;
 let old=$("tc").value;
 $("tc").innerHTML='<option value="">Select category</option>'+cats.map(c=>`<option value="${c.id}">${esc(path(c.id))}</option>`).join("");
 if(cats.some(c=>String(c.id)===old))$("tc").value=old;
 parentOptions();renderCats();renderContents();
}
function parentOptions(selected=$("parent").value,exclude=+$("cid").value||0){
 let opts='<option value="">Main Category</option>';
 function walk(pid,depth,seen){
 cats.filter(c=>+(c.parent_id||0)===+(pid||0)).sort((a,b)=>a.id-b.id).forEach(c=>{
 if(+c.id===exclude||seen.has(+c.id))return;
 opts+=`<option value="${c.id}">${"— ".repeat(depth)}${esc(name(c))}</option>`;
 let next=new Set(seen);next.add(+c.id);walk(c.id,depth+1,next);
 })}
 walk(null,0,new Set());$("parent").innerHTML=opts;$("parent").value=selected||"";
}
function renderCats(){
 let q=$("csearch").value.toLowerCase();
 let arr=cats.filter(c=>[c.name,c.name_en,c.name_ta,c.name_si].some(v=>(v||"").toLowerCase().includes(q)));
 $("cats").innerHTML=arr.map(c=>`<div class="item"><b>${esc(path(c.id))}</b>
 <p><small>EN: ${esc(c.name_en||c.name||"—")} | TA: ${esc(c.name_ta||"—")} | SI: ${esc(c.name_si||"—")}</small></p>
 <button onclick="editCat(${c.id})">Edit</button><button class="red" onclick="delCat(${c.id})">Delete</button></div>`).join("")||"<p>No categories.</p>";
}
function renderContents(){
 let q=$("tsearch").value.toLowerCase();
 let arr=items.filter(c=>[c.title,c.title_en,c.title_ta,c.title_si,c.description_en,c.description_ta,c.description_si].some(v=>(v||"").toLowerCase().includes(q)));
 $("contents").innerHTML=arr.map(c=>`<div class="item"><b>${esc(c.title_en||c.title||c.title_ta||c.title_si||"Untitled")}</b>
 <p><small>${esc(path(c.category_id))} | TA: ${esc(c.title_ta||"—")} | SI: ${esc(c.title_si||"—")}</small></p>
 ${c.image_url?`<a target="_blank" rel="noopener" href="${esc(c.image_url)}">View photo</a><br>`:""}
 <button onclick="editContent(${c.id})">Edit</button><button class="red" onclick="delContent(${c.id})">Delete</button></div>`).join("")||"<p>No content.</p>";
}
function clearCat(){["cid","cn","ct","cs","cd"].forEach(id=>$(id).value="");$("co").value=0;$("ch").textContent="Add Category";parentOptions("")}
function editCat(id){
 let c=cats.find(x=>+x.id===+id);if(!c)return;
 $("cid").value=c.id;$("cn").value=c.name_en||c.name||"";$("ct").value=c.name_ta||"";$("cs").value=c.name_si||"";$("cd").value=c.description||"";$("co").value=c.sort_order||0;$("ch").textContent="Edit Category";parentOptions(c.parent_id||"",+c.id);$("catForm").scrollIntoView();
}
async function saveCat(){
 let id=$("cid").value,b={name_en:$("cn").value.trim(),name_ta:$("ct").value.trim(),name_si:$("cs").value.trim(),description:$("cd").value,parent_id:$("parent").value||null,sort_order:+$("co").value||0};
 if(!b.name_en&&!b.name_ta&&!b.name_si)return say("Enter a name in at least one language.",true);
 try{await req(id?"/api/categories/"+id:"/api/categories",{method:id?"PUT":"POST",body:JSON.stringify(b)});clearCat();await load();say("Category saved successfully.");}catch(e){say(e.message,true)}
}
async function delCat(id){if(!confirm("Delete category? Categories with children or content must be emptied first."))return;try{await req("/api/categories/"+id,{method:"DELETE"});await load();say("Category deleted.");}catch(e){say(e.message,true)}}
function clearContent(){
 $("tid").value="";["enT","taT","siT","enD","taD","siD","enE","taE","siE","image"].forEach(id=>$(id).value="");
 $("to").value=0;$("tc").value="";$("photo").value="";$("preview").style.display="none";$("uploadStatus").textContent="Optional photo";$("th").textContent="Add Content";
}
function editContent(id){
 let c=items.find(x=>+x.id===+id);if(!c)return;
 $("tid").value=c.id;$("tc").value=c.category_id;$("th").textContent="Edit Content";
 $("enT").value=c.title_en||c.title||"";$("taT").value=c.title_ta||"";$("siT").value=c.title_si||"";
 $("enD").value=c.description_en||c.description||"";$("taD").value=c.description_ta||"";$("siD").value=c.description_si||"";
 $("enE").value=c.explanation_en||c.explanation||"";$("taE").value=c.explanation_ta||"";$("siE").value=c.explanation_si||"";
 $("image").value=c.image_url||"";$("to").value=c.sort_order||0;$("photo").value="";
 $("preview").style.display=c.image_url?"block":"none";if(c.image_url)$("preview").src=c.image_url;
 $("uploadStatus").textContent=c.image_url?"Current photo":"Optional photo";$("contentForm").scrollIntoView();
}
$("photo").addEventListener("change",async()=>{
 let f=$("photo").files[0];if(!f)return;
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(f.type)||f.size>10*1024*1024){say("Choose JPG, PNG, WEBP, or GIF under 10 MB.",true);$("photo").value="";return}
 $("preview").src=URL.createObjectURL(f);$("preview").style.display="block";uploading=true;$("uploadStatus").textContent="Uploading...";
 try{let d=await req("/api/content-images",{method:"POST",headers:{"Content-Type":f.type},body:await f.arrayBuffer()});$("image").value=d.url;$("uploadStatus").textContent="Upload successful";say("Photo uploaded.");}
 catch(e){$("uploadStatus").textContent=e.message;say(e.message,true)}
 finally{uploading=false}
});
async function saveContent(){
 if(uploading)return say("Wait for the image upload.",true);
 let id=$("tid").value,b={category_id:$("tc").value,title_en:$("enT").value.trim(),title_ta:$("taT").value.trim(),title_si:$("siT").value.trim(),description_en:$("enD").value,description_ta:$("taD").value,description_si:$("siD").value,explanation_en:$("enE").value,explanation_ta:$("taE").value,explanation_si:$("siE").value,image_url:$("image").value,sort_order:+$("to").value||0};
 if(!b.category_id||!(b.title_en||b.title_ta||b.title_si))return say("Choose a category and enter a title.",true);
 try{await req(id?"/api/contents/"+id:"/api/contents",{method:id?"PUT":"POST",body:JSON.stringify(b)});clearContent();await load();say("Content saved successfully.");}catch(e){say(e.message,true)}
}
async function delContent(id){if(!confirm("Delete this content?"))return;try{await req("/api/contents/"+id,{method:"DELETE"});await load();say("Content deleted.");}catch(e){say(e.message,true)}}
window.addEventListener("load",()=>{
 if(!window.google?.accounts?.id){$("err").textContent="Google sign-in failed to load. Refresh the page.";return}
 google.accounts.id.initialize({client_id:CLIENT,callback:googleLogin});
 google.accounts.id.renderButton($("google"),{theme:"outline",size:"large",text:"signin_with",width:260});
});
</script>
</body>
</html>
