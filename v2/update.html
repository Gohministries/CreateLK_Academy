<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>Facebook Monetization Guide — Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16;--bg:#f3f6fb;--line:#dbe3ef}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#152238}
header{background:var(--n);color:white;padding:20px}
header div,main{max-width:950px;margin:auto}
h1{font-size:23px;margin:0 0 6px}
main{padding:18px 14px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 14px}
label{display:block;font-weight:bold;font-size:13px;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit}
textarea{min-height:120px;resize:vertical}
button{padding:12px 15px;border:0;border-radius:9px;background:var(--b);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e8eef8;color:var(--n)}
button.danger{background:#b42318}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#message{padding:11px;background:#eef4ff;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
#preview{max-width:100%;max-height:240px;border-radius:10px;margin-top:10px}
.muted{font-size:13px;color:#68768b}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>

<header>
<div>
<h1>CreateLK Academy</h1>
Facebook Monetization Guide — Admin Panel
</div>
</header>

<main>

<section class="card">
<h2>Admin Login</h2>
<p class="muted">Sign in using an authorized Google account.</p>
<div id="googleButton"></div>
<div id="message">Please sign in to manage lessons.</div>
</section>

<div id="admin" hidden>

<section class="card">
<h2>Select Lesson</h2>

<label for="lessonSelect">Lesson</label>
<select id="lessonSelect"></select>

<div class="actions">
<button id="newButton" type="button">+ Add Lesson</button>
<button class="secondary" id="refreshButton" type="button">Refresh</button>
</div>

<label for="language">Language</label>
<select id="language">
<option value="en">English</option>
<option value="ta">தமிழ் — Tamil</option>
<option value="si">සිංහල — Sinhala</option>
</select>
<p class="muted">Each lesson has separate English, Tamil and Sinhala content.</p>
</section>

<section class="card">
<h2>Lesson Settings</h2>

<div class="grid">
<div>
<label for="lessonOrder">Lesson Order</label>
<input id="lessonOrder" type="number" min="1" step="1" value="1">
</div>
<div>
<label for="access">Access Type</label>
<select id="access">
<option value="FREE">Free</option>
<option value="PREMIUM">Premium</option>
</select>
</div>
</div>

<label for="status">Publishing Status</label>
<select id="status">
<option value="DRAFT">Draft</option>
<option value="PUBLISHED">Published</option>
<option value="HIDDEN">Hidden</option>
</select>

<label for="title">Lesson Title</label>
<input id="title" maxlength="250" placeholder="Enter lesson title">

<label for="description">Lesson Description</label>
<textarea id="description" placeholder="Explain what the student will learn"></textarea>

<label for="photoFile">Lesson Photo</label>
<input id="photoFile" type="file" accept="image/*">

<div class="actions">
<button id="uploadButton" type="button">Upload Photo</button>
</div>

<label for="photoUrl">Photo URL</label>
<input id="photoUrl" placeholder="Uploaded photo URL">

<img id="preview" hidden alt="Lesson photo preview">

<label for="content">Lesson Content</label>
<textarea id="content" style="min-height:280px" placeholder="Write the full lesson content here"></textarea>

<div class="actions">
<button id="saveButton" type="button">Save Lesson</button>
<button class="secondary" id="clearButton" type="button">Clear Form</button>
<button class="danger" id="deleteButton" type="button">Delete Lesson</button>
</div>
</section>

</div>
</main>

<script>
const API="https://facebook-guide-v1.createlk.workers.dev";
const GOOGLE_CLIENT_ID="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";

const $=id=>document.getElementById(id);

let token="";
let lessons=[];
let currentId=null;
let creating=false;

function message(text){
  $("message").textContent=text;
}

async function api(path,options={}){
  const headers=new Headers(options.headers||{});

  if(token){
    headers.set("Authorization","Bearer "+token);
  }

  if(options.body && !(options.body instanceof FormData)){
    headers.set("Content-Type","application/json");
  }

  const response=await fetch(API+path,{
    ...options,
    headers
  });

  const data=await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(data.error||"Request failed: "+response.status);
  }

  return data;
}

function selectedLesson(){
  return lessons.find(x=>String(x.id)===String(currentId));
}

function clearForm(){
  $("lessonOrder").value=lessons.length
    ?Math.max(...lessons.map(x=>Number(x.lesson_order)||0))+1
    :1;

  $("access").value="FREE";
  $("status").value="DRAFT";
  $("title").value="";
  $("description").value="";
  $("photoFile").value="";
  $("photoUrl").value="";
  $("content").value="";
  $("preview").hidden=true;
  $("preview").removeAttribute("src");
}

function displayLesson(){
  const lesson=selectedLesson();

  if(!lesson){
    clearForm();
    return;
  }

  $("lessonOrder").value=lesson.lesson_order||1;
  $("access").value=lesson.access_type||"FREE";
  $("status").value=lesson.status||"DRAFT";
  $("title").value=lesson.title||"";
  $("description").value=lesson.description||"";
  $("photoUrl").value=lesson.photo_url||"";
  $("content").value=lesson.content||"";
  $("photoFile").value="";

  updatePreview();
}

function updatePreview(){
  const url=$("photoUrl").value.trim();

  $("preview").hidden=!url;

  if(url){
    $("preview").src=url;
  }else{
    $("preview").removeAttribute("src");
  }
}

async function loadLessons(preferredId=null){
  const language=$("language").value;

  const data=await api(
    "/api/admin/lessons?language="+encodeURIComponent(language)
  );

  lessons=data.lessons||[];

  const select=$("lessonSelect");
  select.innerHTML="";

  if(!lessons.length){
    select.add(new Option("No lessons available",""));
    currentId=null;
    creating=true;
    clearForm();
    return;
  }

  lessons.sort((a,b)=>a.lesson_order-b.lesson_order);

  lessons.forEach(lesson=>{
    const title=lesson.title||"Translation not added";

    select.add(new Option(
      "Lesson "+lesson.lesson_order+" — "+title,
      String(lesson.id)
    ));
  });

  const found=lessons.find(
    x=>String(x.id)===String(preferredId)
  );

  currentId=found?found.id:lessons[0].id;
  select.value=String(currentId);
  creating=false;
  displayLesson();
}

async function startAdmin(){
  $("admin").hidden=false;

  try{
    await loadLessons();
    message("Admin login successful. Select a lesson and language.");
  }catch(error){
    message("Unable to load lessons: "+error.message);
  }
}

function initGoogle(){
  if(!window.google?.accounts?.id){
    setTimeout(initGoogle,300);
    return;
  }

  if(GOOGLE_CLIENT_ID.startsWith("YOUR_")){
    message("Setup required: replace GOOGLE_CLIENT_ID with your Google OAuth Web Client ID.");
    return;
  }

  google.accounts.id.initialize({
    client_id:GOOGLE_CLIENT_ID,
    callback:async response=>{
      token=response.credential;
      await startAdmin();
    }
  });

  google.accounts.id.renderButton(
    $("googleButton"),
    {
      theme:"outline",
      size:"large",
      text:"signin_with",
      shape:"rectangular"
    }
  );
}

$("language").addEventListener("change",async()=>{
  try{
    await loadLessons(currentId);
    message("Language loaded. Edit and save its translation.");
  }catch(error){
    message(error.message);
  }
});

$("lessonSelect").addEventListener("change",()=>{
  currentId=Number($("lessonSelect").value)||null;
  creating=false;
  displayLesson();
});

$("newButton").addEventListener("click",()=>{
  currentId=null;
  creating=true;
  $("lessonSelect").value="";
  clearForm();
  $("title").focus();
  message("Enter the lesson details, then select Save Lesson.");
});

$("refreshButton").addEventListener("click",async()=>{
  try{
    await loadLessons(currentId);
    message("Lessons refreshed.");
  }catch(error){
    message(error.message);
  }
});

$("clearButton").addEventListener("click",clearForm);
$("photoUrl").addEventListener("input",updatePreview);

$("uploadButton").addEventListener("click",async()=>{
  const file=$("photoFile").files[0];

  if(!file){
    message("Please choose a photo first.");
    return;
  }

  if(!file.type.startsWith("image/")){
    message("Please select an image file.");
    return;
  }

  if(file.size>5*1024*1024){
    message("Image must be 5 MB or smaller.");
    return;
  }

  try{
    message("Uploading photo...");

    const form=new FormData();
    form.append("file",file);

    const data=await api("/api/admin/upload",{
      method:"POST",
      body:form
    });

    $("photoUrl").value=data.url;
    updatePreview();
    message("Photo uploaded. Save the lesson to store the photo URL.");
  }catch(error){
    message("Upload failed: "+error.message);
  }
});

$("saveButton").addEventListener("click",async()=>{
  const title=$("title").value.trim();
  const order=Number($("lessonOrder").value);

  if(!title){
    message("Please enter a lesson title for this language.");
    $("title").focus();
    return;
  }

  if(!Number.isInteger(order)||order<1){
    message("Lesson order must be a positive whole number.");
    return;
  }

  $("saveButton").disabled=true;

  try{
    let id=currentId;

    if(creating||!id){
      const created=await api("/api/admin/lessons",{
        method:"POST",
        body:JSON.stringify({
          lesson_order:order,
          access_type:$("access").value,
          status:$("status").value
        })
      });

      id=created.id;
      currentId=id;
      creating=false;
    }

    await api("/api/admin/lessons/"+id,{
      method:"PUT",
      body:JSON.stringify({
        lesson_order:order,
        access_type:$("access").value,
        status:$("status").value
      })
    });

    await api("/api/admin/translation",{
      method:"PUT",
      body:JSON.stringify({
        lesson_id:id,
        language:$("language").value,
        title,
        description:$("description").value,
        photo_url:$("photoUrl").value.trim(),
        content:$("content").value
      })
    });

    await loadLessons(id);

    message(
      "Lesson saved successfully.\n"+
      "To provide all three languages, select English, Tamil and Sinhala "+
      "and save each translation."
    );

  }catch(error){
    message("Save failed: "+error.message);
  }finally{
    $("saveButton").disabled=false;
  }
});

$("deleteButton").addEventListener("click",async()=>{
  if(!currentId){
    message("Select a saved lesson first.");
    return;
  }

  if(!confirm(
    "Delete this lesson and all its language translations? This cannot be undone."
  )){
    return;
  }

  try{
    await api("/api/admin/lessons/"+currentId,{
      method:"DELETE"
    });

    currentId=null;
    await loadLessons();

    message("Lesson deleted.");
  }catch(error){
    message("Delete failed: "+error.message);
  }
});

initGoogle();
</script>
</body>
</html>
