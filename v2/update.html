<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Academy — Admin V2</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16;--bd:#dfe6f0}
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f3f6fb;color:#17243a}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--n);color:white;padding:16px;z-index:5;overflow:auto}
h1{font-size:23px;margin:5px 0}h2{font-size:18px;color:var(--n)}
nav button{display:block;width:100%;text-align:left;background:none;color:white;margin:5px 0}
main{margin-left:220px;padding:20px;max-width:1150px}
header{display:none}
.card{background:white;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:15px}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;background:white}
input[type=checkbox]{width:auto}
textarea{min-height:80px}
button{border:0;border-radius:7px;padding:10px 12px;background:var(--b);color:white;font-weight:bold;cursor:pointer;margin:3px}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#eaf0fa;color:var(--n)}
.danger{background:#b42318}
.gold{background:var(--g);color:#102a56}
.item{background:#f8fafc;border:1px solid var(--bd);padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.small{font-size:12px;color:#64748b;line-height:1.5}
#status{padding:10px;background:#eaf2ff;border-radius:7px;margin-bottom:12px;white-space:pre-wrap}
.error{background:#fff0ee!important;color:#a32118}
.ok{background:#e7f8ed!important;color:#146c37}
.view{display:none}
.view.active{display:block}
.editor{min-height:180px;background:white;border:1px solid #cbd5e1;border-radius:7px;padding:12px;overflow-wrap:anywhere}
.editor img{max-width:100%;height:auto;border-radius:8px}
.thumb{max-width:100%;max-height:220px;border-radius:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
@media(max-width:700px){
 aside{transform:translateX(-100%);transition:.2s}
 aside.open{transform:translateX(0)}
 header{display:flex;position:fixed;inset:0 0 auto;background:var(--n);color:white;padding:10px;justify-content:space-between;align-items:center;z-index:4}
 main{margin:0;padding:65px 12px}
}
</style>
</head>
<body>
<header><b>CreateLK Academy</b><button onclick="$('aside').classList.toggle('open')">☰</button></header>

<aside id="aside">
<h1>CreateLK</h1>
<p>Academy Admin V2</p>
<nav>
<button onclick="tab('dash',this)">📊 Dashboard</button>
<button onclick="tab('subs',this)">📁 Subjects</button>
<button onclick="tab('les',this)">📚 Lessons</button>
<button onclick="tab('content',this)">📝 Lesson Editor</button>
</nav>
<hr>
<div id="uEmail" class="small"></div>
<button class="danger" onclick="logout()">Sign Out</button>
</aside>

<main>
<section id="login" class="card">
<h2>Admin Sign In</h2>
<p class="small">Sign in with your authorized Google account.</p>
<div id="googleButton"></div>
<label><input id="stay" type="checkbox" checked> Stay logged in</label>
</section>

<div id="app" class="view">
<div id="status">Ready</div>

<section id="t-dash" class="view active card">
<h2>Dashboard</h2>
<div class="item"><b id="sSub">0</b> Subjects</div>
<div class="item"><b id="sLes">0</b> Lessons</div>
<button onclick="loadAll()">Refresh Data</button>
</section>

<section id="t-subs" class="view card">
<h2>Subjects</h2>
<form id="subF">
<label>Subject Name</label><input id="subN" required>
<label>Slug (optional)</label><input id="subS" placeholder="mathematics">
<button type="submit">Add Subject</button>
</form>
<hr><div id="subL"></div>
</section>

<section id="t-les" class="view card">
<h2>Lessons</h2>
<form id="lesF">
<label>Subject</label><select id="lSub" required></select>
<label>Lesson Title</label><input id="lTitle" required>
<button type="submit">Add Lesson</button>
</form>
<hr>
<label>Filter Subject</label><select id="fSub"></select>
<div id="lesL"></div>
</section>

<section id="t-content" class="view card">
<h2>Lesson Editor</h2>
<label>Subject</label><select id="cSub"></select>
<label>Lesson</label><select id="cLes" disabled></select>
<label>Title</label><input id="cTitle">
<label>Description</label><textarea id="cDesc"></textarea>

<hr>
<h3>Lesson Photo</h3>
<label>Choose Photo (JPG, PNG, WEBP or GIF; max 10 MB)</label>
<input id="imgFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<button id="imgBtn" type="button" onclick="uploadPhoto()">Upload Photo</button>
<div id="photoOut"></div>
<label>Photo URL</label><input id="cPhoto" placeholder="Upload a photo or enter an HTTPS URL">
<div class="toolbar">
<button class="secondary" type="button" onclick="copyPhoto()">Copy URL</button>
<button type="button" onclick="insertPhoto()">Insert Photo into Notes</button>
</div>

<hr>
<label>Notes / Learning Content</label>
<div class="toolbar">
<button type="button" onclick="fmt('bold')"><b>B</b></button>
<button type="button" onclick="fmt('italic')"><i>I</i></button>
<button type="button" onclick="fmt('underline')"><u>U</u></button>
<button type="button" onclick="fmt('insertUnorderedList')">• Bullets</button>
<button type="button" onclick="fmt('insertOrderedList')">1. Numbers</button>
<button type="button" onclick="addHeading()">Heading</button>
<button class="secondary" type="button" onclick="removeFormat()">Clear Formatting</button>
</div>
<div id="cExplain" class="editor" contenteditable="true"></div>

<label>Access</label>
<select id="cFree">
<option value="1">Free</option>
<option value="0">Premium</option>
</select>
<label>Status</label>
<select id="cStat">
<option value="PUBLISHED">Published</option>
<option value="DRAFT">Draft</option>
<option value="COMING_SOON">Coming Soon</option>
</select>
<button id="saveBtn" class="gold" type="button" onclick="saveAll()">Save All Changes</button>
<button class="secondary" type="button" onclick="clearEditor()">Clear Editor</button>
</section>
</div>
</main>

<script>
"use strict";
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const ADMIN="gateofheavensl1@gmail.com";
const $=id=>document.getElementById(id);
let token="",subs=[],les=[],contentRequest=0;

function msg(s,type=""){
$("status").textContent=s;
$("status").className=type;
}
function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function tab(id,el){
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
if(el)el.classList.add("active");
document.querySelectorAll("#app > .view").forEach(v=>v.classList.remove("active"));
$("t-"+id).classList.add("active");
$("aside").classList.remove("open");
}
async function api(path,opts={}){
let h=new Headers(opts.headers||{});
h.set("Authorization","Bearer "+token);
if(opts.body&&!(opts.body instanceof FormData))h.set("Content-Type","application/json");
let r=await fetch(API+path,{...opts,headers:h});
let d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||"Request failed: "+r.status);
return d;
}
function authOk(jwt,email){
token=jwt;
let storage=$("stay").checked?localStorage:sessionStorage;
let other=storage===localStorage?sessionStorage:localStorage;
storage.setItem("admin_token",jwt);
storage.setItem("admin_email",email);
other.removeItem("admin_token");
other.removeItem("admin_email");
$("login").style.display="none";
$("app").classList.add("active");
$("uEmail").textContent=email;
loadAll();
}
function handleCred(r){
try{
let p=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
if(p.email?.toLowerCase()!==ADMIN||!p.email_verified)throw Error("Unauthorized account.");
authOk(r.credential,p.email);
}catch(e){alert(e.message);}
}
function initG(){
if(!window.google?.accounts?.id)return setTimeout(initG,300);
google.accounts.id.initialize({client_id:CLIENT,callback:handleCred});
$("googleButton").innerHTML="";
google.accounts.id.renderButton($("googleButton"),{theme:"outline",size:"large"});
}
function logout(){
token="";
["admin_token","admin_email"].forEach(k=>{
localStorage.removeItem(k);sessionStorage.removeItem(k);
});
$("app").classList.remove("active");
$("login").style.display="block";
initG();
}
function restore(){
let t=localStorage.getItem("admin_token")||sessionStorage.getItem("admin_token");
let e=localStorage.getItem("admin_email")||sessionStorage.getItem("admin_email");
if(!t||!e)return initG();
try{
let p=JSON.parse(atob(t.split(".")[1].split(".")[0].replace(/-/g,"+").replace(/_/g,"/")));
if(p.exp*1000>Date.now()&&p.email?.toLowerCase()===ADMIN){
token=t;
$("login").style.display="none";
$("app").classList.add("active");
$("uEmail").textContent=e;
loadAll();
}else logout();
}catch{logout();}
}
async function loadAll(){
try{
msg("Loading...");
let d=await api("/api/bootstrap");
subs=d.subjects||[];
les=d.lessons||[];
$("sSub").textContent=subs.length;
$("sLes").textContent=les.length;
renderSubs();options();renderLessons();
msg("Data loaded.","ok");
}catch(e){msg(e.message,"error");}
}
function renderSubs(){
$("subL").innerHTML=subs.map(s=>`
<div class="item"><b>${esc(s.name)}</b>
<p class="small">ID ${+s.id} · ${esc(s.slug)}</p>
<button class="secondary" onclick="editSub(${+s.id})">Edit</button>
<button class="secondary" onclick="toggleSub(${+s.id})">${+s.is_active?"Hide":"Show"}</button>
<button class="danger" onclick="delSub(${+s.id})">Delete</button></div>
`).join("")||"No subjects.";
}
function options(){
let opts=subs.map(s=>`<option value="${+s.id}">${esc(s.name)}</option>`).join("");
let old=$("cSub").value;
$("lSub").innerHTML='<option value="">Select subject</option>'+opts;
$("fSub").innerHTML='<option value="all">All Subjects</option>'+opts;
$("cSub").innerHTML='<option value="">Select subject</option>'+opts;
if(subs.some(s=>String(s.id)===old))$("cSub").value=old;
$("fSub").onchange=renderLessons;
renderLessonOptions();
}
function renderLessonOptions(){
let sid=$("cSub").value,old=$("cLes").value;
$("cLes").innerHTML='<option value="">Select lesson</option>'+
les.filter(l=>!sid||String(l.subject_id)===sid)
.map(l=>`<option value="${+l.id}">${esc(l.title)} (#${+l.id})</option>`).join("");
$("cLes").disabled=!sid;
if([...$("cLes").options].some(o=>o.value===old))$("cLes").value=old;
}
function renderLessons(){
let f=$("fSub").value||"all";
$("lesL").innerHTML=les.filter(l=>f==="all"||String(l.subject_id)===f).map(l=>{
let s=subs.find(x=>+x.id===+l.subject_id);
return `<div class="item"><b>${esc(l.title)}</b>
<p class="small">${esc(s?.name)} · ID ${+l.id} · ${+l.is_free?"FREE":"PREMIUM"} · ${esc(l.status)}</p>
<button onclick="openContent(${+l.subject_id},${+l.id})">Edit Content</button>
<button class="secondary" onclick="editLes(${+l.id})">Quick Edit</button>
<button class="danger" onclick="delLes(${+l.id})">Delete</button></div>`;
}).join("")||"No lessons.";
renderLessonOptions();
}
function clearEditor(){
contentRequest++;
["cTitle","cPhoto","cDesc"].forEach(k=>$(k).value="");
$("cExplain").innerHTML="";
$("cFree").value="1";
$("cStat").value="PUBLISHED";
$("photoOut").innerHTML="";
$("imgFile").value="";
}
$("cSub").onchange=()=>{
renderLessonOptions();
clearEditor();
};
$("cLes").onchange=()=>{
if($("cLes").value)loadContent();
else clearEditor();
};
function openContent(sid,lid){
tab("content",document.querySelectorAll("nav button")[3]);
$("cSub").value=String(sid);
renderLessonOptions();
$("cLes").value=String(lid);
loadContent();
}
$("subF").onsubmit=async e=>{
e.preventDefault();
try{
await api("/api/subjects",{method:"POST",body:JSON.stringify({
name:$("subN").value.trim(),slug:$("subS").value.trim()
})});
e.target.reset();
await loadAll();
msg("Subject added.","ok");
}catch(x){msg(x.message,"error");}
};
async function editSub(id){
let s=subs.find(x=>+x.id===id);if(!s)return;
let name=prompt("Subject name:",s.name);if(name===null)return;
let slug=prompt("Slug:",s.slug);if(slug===null)return;
try{
await api("/api/subjects/"+id,{method:"PUT",body:JSON.stringify({
name,slug,is_active:!!+s.is_active
})});
await loadAll();
}catch(e){msg(e.message,"error");}
}
async function toggleSub(id){
let s=subs.find(x=>+x.id===id);if(!s)return;
try{
await api("/api/subjects/"+id,{method:"PUT",body:JSON.stringify({
name:s.name,slug:s.slug,is_active:!+s.is_active
})});
await loadAll();
}catch(e){msg(e.message,"error");}
}
async function delSub(id){
if(!confirm("Delete this subject?"))return;
try{
await api("/api/subjects/"+id,{method:"DELETE"});
await loadAll();
}catch(e){msg(e.message,"error");}
}
$("lesF").onsubmit=async e=>{
e.preventDefault();
try{
await api("/api/lessons",{method:"POST",body:JSON.stringify({
subject_id:+$("lSub").value,
title:$("lTitle").value.trim(),
description:"",
is_free:true,status:"PUBLISHED"
})});
e.target.reset();
await loadAll();
msg("Lesson added. Select it in Lesson Editor.","ok");
}catch(x){msg(x.message,"error");}
};
async function editLes(id){
let l=les.find(x=>+x.id===id);if(!l)return;
let title=prompt("Title:",l.title);if(title===null)return;
let description=prompt("Description:",l.description||"");if(description===null)return;
let subject_id=Number(prompt("Subject ID:",l.subject_id));if(!subject_id)return;
let order=Number(prompt("Display order:",l.sort_order??l.display_order??1));
let is_free=confirm("OK = Free. Cancel = Premium.");
let status=prompt("PUBLISHED, DRAFT, or COMING_SOON:",l.status||"PUBLISHED");
if(!status)return;
status=status.toUpperCase();
if(!["PUBLISHED","DRAFT","COMING_SOON"].includes(status))return alert("Invalid status.");
try{
await api("/api/lessons/"+id,{method:"PUT",body:JSON.stringify({
title,description,subject_id,sort_order:order,display_order:order,is_free,status
})});
await loadAll();
msg("Lesson updated.","ok");
}catch(e){msg(e.message,"error");}
}
async function delLes(id){
if(!confirm("Delete this lesson?"))return;
try{
await api("/api/lessons/"+id,{method:"DELETE"});
await loadAll();
clearEditor();
}catch(e){msg(e.message,"error");}
}
async function loadContent(){
let id=$("cLes").value,l=les.find(x=>+x.id===+id);
if(!l)return;
let request=++contentRequest;
$("cTitle").value=l.title||"";
$("cDesc").value=l.description||"";
$("cFree").value=+l.is_free?"1":"0";
$("cStat").value=l.status||"PUBLISHED";
$("cExplain").innerHTML="";
$("cPhoto").value="";
$("photoOut").innerHTML="";
try{
let d=await api("/api/notes/"+id);
if(request!==contentRequest||$("cLes").value!==id)return;
let content=d.content||"";
$("cExplain").innerHTML=content;
let m=content.match(/<img[^>]+src=["'](https:\/\/[^"']+)["']/i);
if(m){
$("cPhoto").value=m[1];
$("photoOut").innerHTML='<img class="thumb" src="'+esc(m[1])+'" alt="Lesson photo">';
}
msg("Lesson loaded.","ok");
}catch(e){
if(request===contentRequest)msg("Lesson loaded. No saved notes found yet.");
}
}
async function saveAll(){
let id=$("cLes").value,l=les.find(x=>+x.id===+id);
if(!l)return msg("Select a lesson.","error");
let title=$("cTitle").value.trim();
if(!title)return msg("Enter a title.","error");
$("saveBtn").disabled=true;
try{
await api("/api/lessons/"+id,{method:"PUT",body:JSON.stringify({
title,description:$("cDesc").value,subject_id:+$("cSub").value,
sort_order:Number(l.sort_order??l.display_order??1),
display_order:Number(l.display_order??l.sort_order??1),
is_free:$("cFree").value==="1",status:$("cStat").value
})});
await api("/api/notes/"+id,{method:"PUT",body:JSON.stringify({
content:$("cExplain").innerHTML
})});
await loadAll();
msg("Lesson and notes saved successfully.","ok");
}catch(e){msg("Save error: "+e.message,"error");}
finally{$("saveBtn").disabled=false;}
}
function fmt(command){
$("cExplain").focus();
document.execCommand(command,false,null);
}
function addHeading(){
$("cExplain").focus();
document.execCommand("formatBlock",false,"h3");
}
function removeFormat(){
$("cExplain").focus();
document.execCommand("removeFormat",false,null);
}
function insertPhoto(){
let u=$("cPhoto").value.trim();
if(!/^https:\/\/\S+$/i.test(u))return msg("Enter a valid HTTPS photo URL.","error");
$("cExplain").focus();
document.execCommand("insertHTML",false,
'<p><img src="'+esc(u)+'" alt="Lesson photo" style="max-width:100%;height:auto;border-radius:8px"></p>');
msg("Photo inserted. Click Save All Changes.","ok");
}
async function uploadPhoto(){
let file=$("imgFile").files[0],id=$("cLes").value;
if(!id)return msg("Select a lesson first.","error");
if(!file)return msg("Choose a photo first.","error");
if(file.size>10*1024*1024)return msg("Maximum photo size is 10 MB.","error");
if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))
return msg("Use JPG, PNG, WEBP or GIF.","error");
$("imgBtn").disabled=true;
try{
let fd=new FormData();
fd.append("lesson_id",id);
fd.append("file",file);
let d=await api("/api/lesson-images",{method:"POST",body:fd});
if(!d.url)throw Error("The server did not return a photo URL.");
$("cPhoto").value=d.url;
$("photoOut").innerHTML='<img class="thumb" src="'+esc(d.url)+'" alt="Uploaded lesson photo">';
try{await navigator.clipboard.writeText(d.url);}catch{}
$("imgFile").value="";
msg("Photo uploaded. Click Insert Photo, then Save All Changes.","ok");
}catch(e){msg("Photo upload failed: "+e.message,"error");}
finally{$("imgBtn").disabled=false;}
}
async function copyPhoto(){
let u=$("cPhoto").value.trim();
if(!u)return msg("No photo URL to copy.","error");
try{
await navigator.clipboard.writeText(u);
msg("Photo URL copied.","ok");
}catch{
$("cPhoto").focus();
$("cPhoto").select();
msg("URL selected. Copy it manually.");
}
}
$("cPhoto").oninput=()=>{
let u=$("cPhoto").value.trim();
$("photoOut").innerHTML=/^https:\/\/\S+$/i.test(u)
?'<img class="thumb" src="'+esc(u)+'" alt="Lesson photo preview">':"";
};
restore();
</script>
</body>
</html>
