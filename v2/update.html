<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateLK Admin Dashboard</title>
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">CreateLK Admin Panel</h1>
            <div id="auth-section">
                <!-- Google Sign-In Button Container -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="medium"></div>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4">
                <span id="admin-email" class="text-sm font-medium text-gray-600"></span>
                <button onclick="signOut()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-100 transition">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        
        <!-- Login Prompt View -->
        <div id="login-prompt" class="flex flex-col items-center justify-center h-96 bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
            <h2 class="text-2xl font-semibold mb-2">Welcome Back</h2>
            <p class="text-gray-500 mb-6">Please sign in with your authorized administrator Google account to continue.</p>
            <div class="flex justify-center">
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
            </div>
        </div>

        <!-- Dashboard View (Hidden until signed in) -->
        <div id="dashboard" class="hidden space-y-6">
            
            <!-- Navigation Tabs -->
            <div class="flex border-b border-gray-200 space-x-8">
                <button onclick="switchTab('subjects')" id="tab-subjects" class="pb-3 border-b-2 border-indigo-600 font-medium text-indigo-600 transition">Subjects</button>
                <button onclick="switchTab('categories')" id="tab-categories" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">Categories</button>
                <button onclick="switchTab('lessons')" id="tab-lessons" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">Lessons</button>
            </div>

            <!-- Tab Content: Subjects -->
            <section id="section-subjects" class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold">Manage Subjects</h2>
                    <button onclick="openSubjectModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">+ Add Subject</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Title</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subjects-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Tab Content: Categories -->
            <section id="section-categories" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold">Manage Categories</h2>
                    <button onclick="openCategoryModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">+ Add Category</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Name</th>
                                <th class="p-4">Level</th>
                                <th class="p-4">Lessons</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Tab Content: Lessons -->
            <section id="section-lessons" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold">Manage Lessons</h2>
                    <button onclick="openLessonModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">+ Add Lesson</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Title</th>
                                <th class="p-4">Subject ID</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="lessons-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <!-- Global Application Scripts -->
    <script>
        // Set your backend Worker URL here
        const API_BASE = "https://your-worker-subdomain.workers.dev";
        let idToken = localStorage.getItem("admin_token") || "";
        let cacheData = { subjects: [], categories: [], lessons: [] };

        document.addEventListener("DOMContentLoaded", () => {
            if (idToken) {
                verifyAndLoadDashboard();
            }
        });

        function handleCredentialResponse(response) {
            idToken = response.credential;
            localStorage.setItem("admin_token", idToken);
            verifyAndLoadDashboard();
        }

        async function verifyAndLoadDashboard() {
            try {
                await fetchBootstrap();
                document.getElementById("login-prompt").classList.add("hidden");
                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");
                document.getElementById("user-info").classList.remove("hidden");
            } catch (err) {
                alert(err.message || "Authentication failed.");
                signOut();
            }
        }

        function signOut() {
            idToken = "";
            localStorage.removeItem("admin_token");
            window.location.reload();
        }

        async function apiFetch(endpoint, options = {}) {
            headers = options.headers || {};
            headers["Authorization"] = `Bearer ${idToken}`;
            if (options.body && !(options.body instanceof FormData)) {
                headers["Content-Type"] = "application/json";
            }
            options.headers = headers;

            const res = await fetch(`${API_BASE}${endpoint}`, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Request failed.");
            return data;
        }

        async function fetchBootstrap() {
            const data = await apiFetch("/api/bootstrap");
            cacheData.subjects = data.subjects || [];
            cacheData.categories = data.categories || [];
            cacheData.lessons = data.lessons || [];
            renderSubjects();
            renderCategories();
            renderLessons();
        }

        function switchTab(tab) {
            ["subjects", "categories", "lessons"].forEach(t => {
                document.getElementById(`section-${t}`).classList.add("hidden");
                document.getElementById(`tab-${t}`).classList.remove("border-indigo-600", "text-indigo-600");
                document.getElementById(`tab-${t}`).classList.add("border-transparent", "text-gray-500");
            });
            document.getElementById(`section-${tab}`).classList.remove("hidden");
            document.getElementById(`tab-${tab}`).classList.add("border-indigo-600", "text-indigo-600");
            document.getElementById(`tab-${tab}`).classList.remove("border-transparent", "text-gray-500");
        }

        function renderSubjects() {
            const tbody = document.getElementById("subjects-table-body");
            tbody.innerHTML = cacheData.subjects.map(s => `
                <tr>
                    <td class="p-4">${s.id}</td>
                    <td class="p-4 font-medium">${s.title}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs bg-gray-100">${s.status}</span></td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="deleteSubject(${s.id})" class="text-red-600 hover:underline">Delete</button>
                    </td>
                </tr>
            `).join("");
        }

        function renderCategories() {
            const tbody = document.getElementById("categories-table-body");
            tbody.innerHTML = cacheData.categories.map(c => `
                <tr>
                    <td class="p-4">${c.id}</td>
                    <td class="p-4 font-medium">${c.name}</td>
                    <td class="p-4">${c.level}</td>
                    <td class="p-4">${c.lesson_count}</td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="deleteCategory(${c.id})" class="text-red-600 hover:underline">Delete</button>
                    </td>
                </tr>
            `).join("");
        }

        function renderLessons() {
            const tbody = document.getElementById("lessons-table-body");
            tbody.innerHTML = cacheData.lessons.map(l => `
                <tr>
                    <td class="p-4">${l.id}</td>
                    <td class="p-4 font-medium">${l.title}</td>
                    <td class="p-4">${l.subject_id || '-'}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs bg-gray-100">${l.status || 'PUBLISHED'}</span></td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="deleteLesson(${l.id})" class="text-red-600 hover:underline">Delete</button>
                    </td>
                </tr>
            `).join("");
        }

        async function deleteSubject(id) {
            if (!confirm("Are you sure?")) return;
            try {
                await apiFetch(`/api/subjects/${id}`, { method: "DELETE" });
                fetchBootstrap();
            } catch(e) { alert(e.message); }
        }

        async function deleteCategory(id) {
            if (!confirm("Are you sure?")) return;
            try {
                await apiFetch(`/api/categories/${id}`, { method: "DELETE" });
                fetchBootstrap();
            } catch(e) { alert(e.message); }
        }

        async function deleteLesson(id) {
            if (!confirm("Are you sure?")) return;
            try {
                await apiFetch(`/api/lessons/${id}`, { method: "DELETE" });
                fetchBootstrap();
            } catch(e) { alert(e.message); }
        }

        function openSubjectModal() {
            const title = prompt("Enter Subject Title:");
            if (!title) return;
            apiFetch("/api/subjects", { method: "POST", body: JSON.stringify({ title }) }).then(() => fetchBootstrap()).catch(e => alert(e.message));
        }

        function openCategoryModal() {
            const name = prompt("Enter Category Name:");
            if (!name) return;
            apiFetch("/api/categories", { method: "POST", body: JSON.stringify({ name }) }).then(() => fetchBootstrap()).catch(e => alert(e.message));
        }

        function openLessonModal() {
            const title = prompt("Enter Lesson Title:");
            const subject_id = prompt("Enter Subject ID for this lesson:");
            if (!title || !subject_id) return;
            apiFetch("/api/lessons", { method: "POST", body: JSON.stringify({ title, subject_id: Number(subject_id) }) }).then(() => fetchBootstrap()).catch(e => alert(e.message));
        }
    </script>
</body>
</html>
