
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<meta name="description" content="CreateLK Academy lesson administration">
<title>Facebook Monetization Guide — Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--navy:#102a56;--blue:#155eef;--gold:#d69b16;--bg:#f3f6fb;--line:#dbe3ef}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#17243b}
header{background:var(--navy);color:white;padding:20px}
header>div,main{max-width:1000px;margin:auto}
h1{font-size:23px;margin:0 0 6px}
main{padding:18px 12px}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 14px}
label{display:block;font-weight:bold;font-size:13px;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;color:#17243b}
textarea{min-height:130px;resize:vertical;line-height:1.6}
button{padding:12px 15px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e8eef8;color:var(--navy)}
button.danger{background:#b42318}
button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.muted{font-size:13px;color:#65748b;line-height:1.5}
#message{padding:12px;background:#eef4ff;border-radius:9px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
#preview{max-width:100%;max-height:240px;display:block;margin-top:12px;border-radius:10px}
#admin[hidden], [hidden]{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<header>
<div>
<h1>CreateLK Academy</h1>
Facebook Monetization Guide — Admin Panel
</div>
</header>

<main>
<section class="card">
<h2>Administrator Login</h2>
<p class="muted">Sign in with your authorized Google administrator account.</p>
<div id="googleButton"></div>
<div class="actions">
<button type="button" class="secondary" id="logout" hidden>Sign Out</button>
</div>
<div id="message" role="status">Connecting to update-v2.</div>
</section>

<div id="admin" hidden>

<section class="card">
<h2>Subject Management</h2>
<label for="subjectSelect">Select Subject</label>
<select id="subjectSelect"></select>
<div class="actions">
<button type="button" id="refresh">Refresh Data</button>
<button type="button" class="secondary" id="addSubject">+ Add Subject</button>
<button type="button" class="secondary" id="editSubject">Edit Subject</button>
<button type="button" class="danger" id="deleteSubject">Delete Subject</button>
</div>

<div id="subjectEditor" hidden>
<label for="subjectName">Subject Title</label>
<input id="subjectName" maxlength="200" placeholder="Facebook Monetization Guide">
<label for="subjectDescription">Subject Description</label>
<textarea id="subjectDescription" placeholder="Describe the subject"></textarea>
<div class="actions">
<button type="button" id="saveSubject">Save Subject</button>
<button type="button" class="secondary" id="cancelSubject">Cancel</button>
</div>
</div>
</section>

<section class="card">
<h2>Lesson Management</h2>
<label for="lessonSelect">Select Lesson</label>
<select id="lessonSelect"></select>
<div class="actions">
<button type="button" id="newLesson">+ New Lesson</button>
<button type="button" class="secondary" id="refreshLessons">Refresh Lessons</button>
</div>

<label for="language">Content Language</label>
<select id="language">
<option value="en">English</option>
<option value="ta">Tamil — தமிழ்</option>
<option value="si">Sinhala — සිංහල</option>
</select>
<p class="muted">Save each language translation separately for the same lesson.</p>
</section>

<section class="card">
<h2>Lesson Details</h2>
<label for="baseTitle">Main Lesson Title</label>
<input id="baseTitle" maxlength="250" placeholder="Introduction to Facebook Monetization">

<div class="grid">
<div>
<label for="access">Access Type</label>
<select id="access">
<option value="FREE">Free</option>
<option value="PREMIUM">Premium</option>
</select>
</div>
<div>
<label for="status">Publication Status</label>
<select id="status">
<option value="DRAFT">Draft</option>
<option value="PUBLISHED">Published</option>
</select>
</div>
</div>

<label for="title">Title in Selected Language</label>
<input id="title" maxlength="250" placeholder="Lesson title">

<label for="description">Description in Selected Language</label>
<textarea id="description" placeholder="Lesson description"></textarea>

<label for="content">Lesson Content</label>
<textarea id="content" style="min-height:280px" placeholder="Write your lesson content here"></textarea>

<hr>
<h2>Lesson Image</h2>
<label for="photo">Select Image</label>
<input id="photo" type="file" accept="image/*">
<div class="actions">
<button type="button" id="upload">Upload Image</button>
</div>
<label for="photoUrl">Image URL</label>
<input id="photoUrl" readonly placeholder="Image URL after upload">
<img id="preview" hidden alt="Lesson image preview">

<div class="actions">
<button type="button" id="saveLesson">Save Lesson</button>
<button type="button" class="secondary" id="clear">Clear Form</button>
<button type="button" class="danger" id="deleteLesson">Delete Lesson</button>
</div>
</section>
</div>
</main>

<script>
"use strict";

const API="https://update-v2.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";

const $=id=>document.getElementById(id);

let token="";
let subjects=[];
let lessons=[];
let translations=[];
let currentId=null;
let creating=false;
let editingSubject=false;

function msg(s){$("message").textContent=s}

function busy(button,on,label){
 if(on){
  button.dataset.old=button.textContent;
  button.textContent=label||"Please wait...";
  button.disabled=true;
 }else{
  button.disabled=false;
  if(button.dataset.old){
   button.textContent=button.dataset.old;
   delete button.dataset.old;
  }
 }
}

async function api(path,options={}){
 const headers=new Headers(options.headers||{});
 if(token)headers.set("Authorization","Bearer "+token);
 if(options.body&&!(options.body instanceof FormData))
  headers.set("Content-Type","application/json");

 const response=await fetch(API+path,{
  ...options,headers,cache:"no-store"
 });
 const data=await response.json().catch(()=>({}));

 if(!response.ok){
  throw new Error(data.error||("HTTP "+response.status+" at "+path));
 }
 return data;
}

function subjectNow(){
 return subjects.find(s=>String(s.id)===$("subjectSelect").value)||null;
}

function lessonNow(){
 return lessons.find(l=>String(l.id)===String(currentId))||null;
}

function translationNow(){
 return translations.find(t=>t.language===$("language").value)||null;
}

function renderSubjects(preferred){
 const select=$("subjectSelect");
 select.innerHTML="";
 subjects.forEach(s=>{
  select.add(new Option(s.title||s.name||("Subject "+s.id),String(s.id)));
 });
 if(!subjects.length){
  select.add(new Option("No subjects available",""));
  return;
 }
 if(preferred&&subjects.some(s=>String(s.id)===String(preferred)))
  select.value=String(preferred);
}

function renderLessons(preferred){
 const select=$("lessonSelect");
 select.innerHTML="";
 const subject=subjectNow();
 const rows=lessons.filter(l=>subject&&String(l.subject_id)===String(subject.id));

 if(!rows.length){
  select.add(new Option("No lessons in this subject",""));
  currentId=null;
  return;
 }

 rows.forEach(l=>{
  const free=Number(l.is_free)===1;
  select.add(new Option(
   (free?"FREE":"PREMIUM")+" · "+(l.title||("Lesson "+l.id))+
   (l.status==="DRAFT"?" · DRAFT":""),
   String(l.id)
  ));
 });

 const found=rows.find(l=>String(l.id)===String(preferred));
 currentId=found?found.id:rows[0].id;
 select.value=String(currentId);
}

function clearForm(){
 $("baseTitle").value="";
 $("access").value="FREE";
 $("status").value="DRAFT";
 $("title").value="";
 $("description").value="";
 $("content").value="";
 $("photo").value="";
 $("photoUrl").value="";
 $("preview").hidden=true;
 $("preview").removeAttribute("src");
}

function showTranslation(){
 const lesson=lessonNow();
 if(!lesson){clearForm();return}

 const tr=translationNow();
 $("baseTitle").value=lesson.title||"";
 $("access").value=Number(lesson.is_free)===1?"FREE":"PREMIUM";
 $("status").value=lesson.status==="DRAFT"?"DRAFT":"PUBLISHED";
 $("title").value=tr?.title||"";
 $("description").value=tr?.description||"";
 $("content").value=tr?.content||"";

 $("photoUrl").value=lesson.image_url||lesson.photo_url||"";
 showImage();
}

function showImage(){
 const url=$("photoUrl").value.trim();
 $("preview").hidden=!url;
 if(url){
  $("preview").src=url;
  $("preview").onerror=()=>{$("preview").hidden=true};
 }else{
  $("preview").removeAttribute("src");
 }
}

async function loadTranslations(id){
 const data=await api("/api/translations/lesson/"+encodeURIComponent(id));
 translations=data.translations||[];
 showTranslation();
}

async function loadAll(preferredSubject,preferredLesson){
 msg("Loading subjects and lessons...");
 const data=await api("/api/bootstrap");
 subjects=data.subjects||[];
 lessons=data.lessons||[];

 renderSubjects(preferredSubject||$("subjectSelect").value);
 renderLessons(preferredLesson||currentId);

 if(currentId)await loadTranslations(currentId);
 else{translations=[];clearForm()}

 $("admin").hidden=false;
 msg("Connected. Data loaded.");
}

async function subjectChanged(){
 renderLessons(null);
 translations=[];
 if(currentId)await loadTranslations(currentId);
 else clearForm();
}

async function lessonChanged(){
 currentId=Number($("lessonSelect").value)||null;
 creating=false;
 if(currentId){
  await loadTranslations(currentId);
  msg("Lesson loaded.");
 }else{
  translations=[];
  clearForm();
 }
}

async function languageChanged(){
 if(!currentId){
  $("title").value="";
  $("description").value="";
  $("content").value="";
  return;
 }
 await loadTranslations(currentId);
 msg("Language translation loaded.");
}

function newLesson(){
 if(!subjectNow()){
  msg("Create or select a subject first.");
  return;
 }
 currentId=null;
 creating=true;
 translations=[];
 $("lessonSelect").value="";
 clearForm();
 msg("Enter the lesson details and click Save Lesson.");
}

function openSubjectEditor(edit){
 const subject=subjectNow();
 if(edit&&!subject){msg("Select a subject first.");return}
 editingSubject=Boolean(edit);
 $("subjectEditor").hidden=false;
 $("subjectName").value=edit?(subject.title||subject.name||""):"";
 $("subjectDescription").value=edit?(subject.description||""):"";
 $("saveSubject").textContent=edit?"Update Subject":"Save Subject";
}

async function saveSubject(){
 const title=$("subjectName").value.trim();
 if(!title){msg("Enter a subject title.");return}
 const button=$("saveSubject");
 busy(button,true,"Saving...");

 try{
  const subject=subjectNow();
  const body={
   title,
   description:$("subjectDescription").value.trim()
  };
  let preferred=null;

  if(editingSubject&&subject){
   await api("/api/subjects/"+subject.id,{
    method:"PUT",body:JSON.stringify(body)
   });
   preferred=subject.id;
  }else{
   const result=await api("/api/subjects",{
    method:"POST",body:JSON.stringify(body)
   });
   preferred=result.id;
  }

  $("subjectEditor").hidden=true;
  await loadAll(preferred,null);
  msg("Subject saved.");
 }catch(e){
  msg("Subject save failed: "+e.message);
 }finally{
  busy(button,false);
 }
}

async function saveLesson(){
 const subject=subjectNow();
 const baseTitle=$("baseTitle").value.trim();
 const title=$("title").value.trim();
 const language=$("language").value;

 if(!subject){msg("Select a subject first.");return}
 if(!baseTitle){msg("Enter the main lesson title.");return}
 if(!title){msg("Enter the title in the selected language.");return}

 const button=$("saveLesson");
 busy(button,true,"Saving lesson...");

 try{
  const body={
   title:baseTitle,
   subject_id:Number(subject.id),
   description:$("description").value.trim(),
   is_free:$("access").value==="FREE"?1:0,
   status:$("status").value
  };

  let id=currentId;
  if(creating||!id){
   const result=await api("/api/lessons",{
    method:"POST",body:JSON.stringify(body)
   });
   id=result.id;
   if(!id)throw new Error("Worker did not return the new lesson ID.");
   currentId=id;
   creating=false;
  }else{
   await api("/api/lessons/"+id,{
    method:"PUT",body:JSON.stringify(body)
   });
  }

  await api("/api/translations",{
   method:"POST",
   body:JSON.stringify({
    lesson_id:Number(id),
    language,
    title,
    description:$("description").value.trim(),
    content:$("content").value
   })
  });

  await loadAll(subject.id,id);
  $("language").value=language;
  await loadTranslations(id);
  msg("Lesson and "+language.toUpperCase()+" translation saved.");
 }catch(e){
  msg("Save failed: "+e.message);
 }finally{
  busy(button,false);
 }
}

async function uploadImage(){
 if(!currentId){
  msg("Save the lesson before uploading its image.");
  return;
 }

 const file=$("photo").files[0];
 if(!file){msg("Choose an image first.");return}
 if(!file.type.startsWith("image/")){msg("Choose a valid image.");return}
 if(file.size>5*1024*1024){msg("Image must be 5 MB or smaller.");return}

 const button=$("upload");
 busy(button,true,"Uploading...");

 try{
  const form=new FormData();
  form.append("file",file);
  form.append("lesson_id",String(currentId));

  const result=await api("/api/lesson-images",{
   method:"POST",body:form
  });

  $("photoUrl").value=result.url||"";
  showImage();
  $("photo").value="";
  await loadAll(subjectNow()?.id,currentId);
  msg("Image uploaded.");
 }catch(e){
  msg("Image upload failed: "+e.message);
 }finally{
  busy(button,false);
 }
}

async function removeLesson(){
 if(!currentId){msg("Select a saved lesson first.");return}
 if(!confirm("Delete this lesson? This action cannot be undone."))return;

 try{
  await api("/api/lessons/"+currentId,{method:"DELETE"});
  currentId=null;
  await loadAll(subjectNow()?.id,null);
  msg("Lesson deleted.");
 }catch(e){
  msg("Delete failed: "+e.message);
 }
}

async function removeSubject(){
 const subject=subjectNow();
 if(!subject){msg("Select a subject first.");return}
 if(!confirm("Delete this subject? The Worker may reject deletion if lessons are still linked."))return;

 try{
  await api("/api/subjects/"+subject.id,{method:"DELETE"});
  currentId=null;
  await loadAll(null,null);
  msg("Subject deleted.");
 }catch(e){
  msg("Subject deletion failed: "+e.message);
 }
}

function logout(){
 token="";
 subjects=[];
 lessons=[];
 translations=[];
 currentId=null;
 $("admin").hidden=true;
 $("logout").hidden=true;
 $("googleButton").hidden=false;
 msg("Signed out.");
}

function initGoogle(){
 if(!window.google?.accounts?.id){
  setTimeout(initGoogle,300);
  return;
 }

 google.accounts.id.initialize({
  client_id:GOOGLE_CLIENT_ID,
  callback:async response=>{
   token=response.credential||"";
   if(!token){msg("Google sign-in failed.");return}
   $("googleButton").hidden=true;
   $("logout").hidden=false;

   try{
    await loadAll();
   }catch(e){
    $("admin").hidden=true;
    msg("Login or API error: "+e.message);
   }
  }
 });

 google.accounts.id.renderButton($("googleButton"),{
  theme:"outline",size:"large",text:"signin_with",shape:"rectangular"
 });
}

$("subjectSelect").addEventListener("change",()=>{
 subjectChanged().catch(e=>msg("Subject load failed: "+e.message));
});
$("lessonSelect").addEventListener("change",()=>{
 lessonChanged().catch(e=>msg("Lesson load failed: "+e.message));
});
$("language").addEventListener("change",()=>{
 languageChanged().catch(e=>msg("Translation load failed: "+e.message));
});
$("addSubject").addEventListener("click",()=>openSubjectEditor(false));
$("editSubject").addEventListener("click",()=>openSubjectEditor(true));
$("deleteSubject").addEventListener("click",removeSubject);
$("cancelSubject").addEventListener("click",()=>{$("subjectEditor").hidden=true});
$("saveSubject").addEventListener("click",saveSubject);
$("newLesson").addEventListener("click",newLesson);
$("saveLesson").addEventListener("click",saveLesson);
$("deleteLesson").addEventListener("click",removeLesson);
$("upload").addEventListener("click",uploadImage);
$("photoUrl").addEventListener("input",showImage);
$("logout").addEventListener("click",logout);
$("clear").addEventListener("click",()=>{
 clearForm();
 msg("Form cleared. Saved data is unchanged.");
});

async function refresh(){
 try{await loadAll(subjectNow()?.id,currentId)}
 catch(e){msg("Refresh failed: "+e.message)}
}
$("refresh").addEventListener("click",refresh);
$("refreshLessons").addEventListener("click",refresh);

initGoogle();
</script>
</body>
</html>
