
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Academy Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:var(--n);color:white;padding:18px}
main{max-width:950px;margin:20px auto;padding:15px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #102a5612}
input,select,textarea,button{font:inherit;padding:11px;border-radius:7px;border:1px solid #ccd3df;width:100%;margin:5px 0}
button{background:var(--n);color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{opacity:.9}
button.gold{background:var(--g);color:#111}
button.red{background:#c62828}
button.gray{background:#596579}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.lesson{border:1px solid #e0e5ee;border-radius:9px;padding:12px;margin:10px 0}
.small{font-size:13px;color:#647084}
#status{padding:10px;border-radius:7px;margin:10px 0;display:none}
.ok{background:#e4f8eb;color:#176b37}
.err{background:#ffebeb;color:#a21d1d}
.hidden{display:none}
h2{font-size:19px}
</style>
</head>
<body>
<header>
<h2>CreateLK Academy Admin</h2>
<div>Manage lessons, translations and photos</div>
</header>

<main>
<div class="card" id="loginBox">
<h2>Administrator Login</h2>
<p class="small">Sign in with your authorized Google administrator account.</p>
<div id="googleButton"></div>
</div>

<div id="app" class="hidden">
<div class="card">
<div class="row">
<div>
<h2>Lessons</h2>
<div class="small" id="lessonCount">Loading lessons...</div>
</div>
<div><button class="gray" onclick="loadLessons()">Refresh Lessons</button></div>
</div>
<div id="status"></div>
<div id="lessonList"></div>
</div>

<div class="card" id="editor">
<h2 id="editorHeading">Edit Lesson</h2>
<input type="hidden" id="lessonId">

<label>Language</label>
<select id="language">
<option value="en">English</option>
<option value="ta">Tamil</option>
<option value="si">Sinhala</option>
</select>

<label>Lesson Title</label>
<input id="title" placeholder="Enter lesson title">

<label>Description / Explanation</label>
<textarea id="description" rows="5" placeholder="Enter lesson description"></textarea>

<label>Lesson Photo</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<div id="photoPreview" class="small"></div>

<div class="row">
<button onclick="saveLesson()">Save Changes</button>
<button class="gray" onclick="clearEditor()">Cancel</button>
</div>
</div>
</div>
</main>

<script>
const API="https://update-v2.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
let token=localStorage.getItem("createlk_admin_token")||"";
let lessons=[];

function message(text,error=false){
 const el=document.getElementById("status");
 el.textContent=text;
 el.className=error?"err":"ok";
 el.style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function request(path,options={}){
 const response=await fetch(API+path,{
  ...options,
  headers:{
   "Authorization":"Bearer "+token,
   ...(options.body instanceof FormData?{}:{"Content-Type":"application/json"}),
   ...(options.headers||{})
  }
 });
 const text=await response.text();
 let data={};
 try{data=text?JSON.parse(text):{}}catch{data={message:text}}
 if(!response.ok)throw new Error(data.error||data.message||"Request failed ("+response.status+")");
 return data;
}

function showApp(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 loadLessons();
}

function handleCredential(response){
 token=response.credential;
 localStorage.setItem("createlk_admin_token",token);
 showApp();
}

window.addEventListener("load",()=>{
 if(window.google){
  google.accounts.id.initialize({
   client_id:GOOGLE_CLIENT_ID,
   callback:handleCredential
  });
  google.accounts.id.renderButton(
   document.getElementById("googleButton"),
   {theme:"outline",size:"large",text:"signin_with"}
  );
 }
 if(token)showApp();
});

async function loadLessons(){
 const list=document.getElementById("lessonList");
 list.innerHTML="Loading...";
 try{
  const data=await request("/api/bootstrap");
  lessons=data.lessons||data.data?.lessons||[];
  renderLessons();
 }catch(error){
  list.innerHTML="";
  message("Could not load lessons: "+error.message,true);
 }
}

function renderLessons(){
 document.getElementById("lessonCount").textContent=lessons.length+" lessons";
 const list=document.getElementById("lessonList");
 if(!lessons.length){
  list.innerHTML='<p class="small">No lessons found.</p>';
  return;
 }
 list.innerHTML="";
 lessons.forEach((lesson,index)=>{
  const item=document.createElement("div");
  item.className="lesson";
  const heading=document.createElement("strong");
  heading.textContent=(lesson.title||lesson.name||"Untitled lesson");
  const detail=document.createElement("div");
  detail.className="small";
  detail.textContent="Lesson ID: "+lesson.id;
  const buttons=document.createElement("div");
  buttons.className="row";
  const edit=document.createElement("button");
  edit.textContent="Edit / Rename";
  edit.onclick=()=>editLesson(lesson);
  const rename=document.createElement("button");
  rename.className="gold";
  rename.textContent="Rename";
  rename.onclick=()=>renameLesson(lesson);
  const del=document.createElement("button");
  del.className="red";
  del.textContent="Delete";
  del.onclick=()=>deleteLesson(lesson);
  buttons.append(edit,rename,del);
  item.append(heading,detail,buttons);
  list.appendChild(item);
 });
}

async function editLesson(lesson){
 document.getElementById("lessonId").value=lesson.id;
 document.getElementById("editorHeading").textContent="Edit Lesson";
 document.getElementById("title").value=lesson.title||"";
 document.getElementById("description").value=lesson.description||"";
 document.getElementById("photoPreview").textContent="";
 document.getElementById("editor").scrollIntoView({behavior:"smooth"});
 try{
  const lang=document.getElementById("language").value;
  const data=await request("/api/translation?lesson="+encodeURIComponent(lesson.id)+"&language="+encodeURIComponent(lang));
  const tr=data.translation||data.data?.translation||data;
  if(tr.title)document.getElementById("title").value=tr.title;
  if(tr.description)document.getElementById("description").value=tr.description;
 }catch(e){
  // Continue editing using the lesson's available details.
 }
}

async function renameLesson(lesson){
 const oldTitle=lesson.title||lesson.name||"";
 const newTitle=prompt("Enter the new lesson title:",oldTitle);
 if(newTitle===null)return;
 if(!newTitle.trim()){
  alert("Lesson title cannot be empty.");
  return;
 }
 if(newTitle.trim()===oldTitle.trim())return;
 if(!confirm('Rename "'+oldTitle+'" to "'+newTitle.trim()+'"?'))return;
 try{
  await request("/api/lessons/"+encodeURIComponent(lesson.id),{
   method:"PUT",
   body:JSON.stringify({...lesson,title:newTitle.trim()})
  });
  message("Lesson renamed successfully.");
  await loadLessons();
 }catch(error){
  message("Rename failed: "+error.message,true);
 }
}

async function deleteLesson(lesson){
 const title=lesson.title||lesson.name||"this lesson";
 if(!confirm('Delete "'+title+'"? This action cannot be undone.'))return;
 if(!confirm("Confirm permanent deletion of this lesson?"))return;
 try{
  await request("/api/lessons/"+encodeURIComponent(lesson.id),{
   method:"DELETE"
  });
  clearEditor();
  message("Lesson deleted successfully.");
  await loadLessons();
 }catch(error){
  message("Delete failed: "+error.message,true);
 }
}

async function saveLesson(){
 const id=document.getElementById("lessonId").value;
 if(!id){
  message("Select a lesson first.",true);
  return;
 }
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();
 const language=document.getElementById("language").value;
 if(!title){
  message("Enter a lesson title.",true);
  return;
 }
 try{
  const photo=document.getElementById("photo").files[0];
  let imageUrl="";
  if(photo){
   if(photo.size>10*1024*1024)throw new Error("Photo must be 10 MB or smaller.");
   const form=new FormData();
   form.append("file",photo);
   form.append("lessonId",id);
   const uploaded=await request("/api/upload",{
    method:"POST",body:form
   });
   imageUrl=uploaded.url||uploaded.imageUrl||uploaded.data?.url||"";
  }

  await request("/api/translation",{
   method:"PUT",
   body:JSON.stringify({
    lesson_id:id,
    lessonId:id,
    language,
    title,
    description,
    explanation:description,
    ...(imageUrl?{image:imageUrl,image_url:imageUrl}: {})
   })
  });

  message("Lesson changes saved successfully.");
  clearEditor();
  await loadLessons();
 }catch(error){
  message("Save failed: "+error.message,true);
 }
}

function clearEditor(){
 document.getElementById("lessonId").value="";
 document.getElementById("title").value="";
 document.getElementById("description").value="";
 document.getElementById("photo").value="";
 document.getElementById("photoPreview").textContent="";
 document.getElementById("editorHeading").textContent="Edit Lesson";
}

document.getElementById("language").addEventListener("change",()=>{
 const id=document.getElementById("lessonId").value;
 if(id){
  const lesson=lessons.find(item=>String(item.id)===String(id));
  if(lesson)editLesson(lesson);
 }
});
</script>
</body>
</html>
