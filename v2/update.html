<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreateLK Admin Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services (GIS) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <!-- TOP BAR -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold text-blue-600">CreateLK Admin</h1>
    </div>
    <div id="auth-section" class="flex items-center space-x-4">
      <!-- Google Sign-In Button container -->
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER (Hidden until logged in) -->
  <main id="app-container" class="hidden flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
    
    <!-- SIDEBAR: Subjects & Lessons Tree -->
    <aside class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col h-[calc(100vh-8rem)] sticky top-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-gray-700">Subjects & Lessons</h2>
        <button onclick="openSubjectModal()" class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-medium hover:bg-blue-100">+ Subject</button>
      </div>
      
      <div id="sidebar-list" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm">
        <!-- Dynamically populated -->
      </div>
    </aside>

    <!-- CONTENT PANEL -->
    <section id="content-panel" class="lg:col-span-3 bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col">
      <div class="text-center text-gray-400 my-auto">
        <p class="text-lg">Select a lesson from the sidebar to manage notes, questions, and resources.</p>
      </div>
    </section>

  </main>

  <!-- MODALS CONTAINER -->
  <div id="modal-root"></div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Configuration - Point to your Worker API base URL
    const API_BASE = window.location.origin; // Update if frontend and worker are hosted separately
    let authToken = localStorage.getItem("auth_token") || "";
    let bootstrapData = { subjects: [], lessons: [] };
    let currentLessonId = null;

    // Initialize UI on load
    window.addEventListener("DOMContentLoaded", () => {
      if (authToken) {
        verifyAndLoad();
      }
    });

    function handleCredentialResponse(response) {
      authToken = response.credential;
      localStorage.setItem("auth_token", authToken);
      verifyAndLoad();
    }

    async function apiRequest(endpoint, method = "GET", body = null, isFormData = false) {
      const headers = { "Authorization": `Bearer ${authToken}` };
      if (!isFormData && body) headers["Content-Type"] = "application/json";

      const res = await fetch(`${API_BASE}${endpoint}`, {
        method,
        headers,
        body: isFormData ? body : (body ? JSON.stringify(body) : null)
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    async function verifyAndLoad() {
      try {
        const data = await apiRequest("/api/bootstrap");
        bootstrapData = data;
        document.getElementById("auth-section").innerHTML = `
          <span class="text-sm text-green-600 font-medium">Signed In</span>
          <button onclick="logout()" class="text-xs bg-gray-100 px-3 py-1.5 rounded hover:bg-gray-200">Sign Out</button>
        `;
        document.getElementById("app-container").classList.remove("hidden");
        renderSidebar();
      } catch (err) {
        alert(err.message);
        logout();
      }
    }

    function logout() {
      localStorage.removeItem("auth_token");
      authToken = "";
      window.location.reload();
    }

    // Render Sidebar Tree
    function renderSidebar() {
      const container = document.getElementById("sidebar-list");
      container.innerHTML = "";

      bootstrapData.subjects.forEach(subject => {
        const subjectLessons = bootstrapData.lessons.filter(l => l.subject_id === subject.id);
        
        const subDiv = document.createElement("div");
        subDiv.className = "border-b border-gray-100 pb-2";
        subDiv.innerHTML = `
          <div class="flex items-center justify-between font-medium text-gray-800 py-1">
            <span>${subject.name}</span>
            <div class="space-x-1">
              <button onclick="openLessonModal(${subject.id})" class="text-xs text-blue-600 hover:underline">+ Lesson</button>
            </div>
          </div>
          <div class="pl-3 space-y-1 mt-1">
            ${subjectLessons.length === 0 ? '<p class="text-xs text-gray-400 italic">No lessons</p>' : ''}
            ${subjectLessons.map(lesson => `
              <div onclick="selectLesson(${lesson.id})" class="cursor-pointer text-xs p-1.5 rounded hover:bg-blue-50 transition ${currentLessonId === lesson.id ? 'bg-blue-100 text-blue-700 font-semibold' : 'text-gray-600'}">
                ${lesson.title}
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(subDiv);
      });
    }

    async function selectLesson(id) {
      currentLessonId = id;
      renderSidebar();
      const lesson = bootstrapData.lessons.find(l => l.id === id);
      const panel = document.getElementById("content-panel");

      panel.innerHTML = `
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <div>
            <h2 class="text-xl font-bold text-gray-800">${lesson.title}</h2>
            <p class="text-xs text-gray-500">${lesson.description || 'No description'}</p>
          </div>
          <button onclick="deleteLesson(${lesson.id})" class="text-xs text-red-600 hover:bg-red-50 px-3 py-1.5 rounded border border-red-200">Delete Lesson</button>
        </div>

        <!-- TABS -->
        <div class="flex space-x-2 border-b border-gray-200 mb-4 text-sm">
          <button onclick="switchTab('notes')" id="tab-notes" class="pb-2 px-3 border-b-2 font-medium border-blue-600 text-blue-600">Notes</button>
          <button onclick="switchTab('questions')" id="tab-questions" class="pb-2 px-3 border-b-2 font-medium border-transparent text-gray-500">Questions (MCQ)</button>
          <button onclick="switchTab('resources')" id="tab-resources" class="pb-2 px-3 border-b-2 font-medium border-transparent text-gray-500">PDF Resources</button>
        </div>

        <div id="tab-content" class="flex-1 overflow-y-auto">
          <!-- Loaded dynamically -->
        </div>
      `;

      loadTab("notes");
    }

    async function switchTab(tabName) {
      ["notes", "questions", "resources"].forEach(t => {
        document.getElementById(`tab-${t}`).className = t === tabName 
          ? "pb-2 px-3 border-b-2 font-medium border-blue-600 text-blue-600" 
          : "pb-2 px-3 border-b-2 font-medium border-transparent text-gray-500";
      });
      loadTab(tabName);
    }

    async function loadTab(tabName) {
      const container = document.getElementById("tab-content");
      container.innerHTML = `<p class="text-gray-400 text-sm">Loading...</p>`;

      if (tabName === "notes") {
        const data = await apiRequest(`/api/notes/${currentLessonId}`);
        container.innerHTML = `
          <div class="flex flex-col h-full space-y-3">
            <textarea id="note-content" class="w-full h-96 p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">${data.content || ""}</textarea>
            <button onclick="saveNotes()" class="self-end bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">Save Notes</button>
          </div>
        `;
      } else if (tabName === "questions") {
        const data = await apiRequest(`/api/questions/lesson/${currentLessonId}`);
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="font-semibold text-gray-700">MCQ Questions</h3>
              <button onclick="openQuestionModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded">+ Add Question</button>
            </div>
            <div class="space-y-3">
              ${data.questions.map((q, idx) => `
                <div class="p-3 border rounded bg-gray-50 text-sm flex justify-between items-start">
                  <div>
                    <span class="font-bold">Q${idx+1}:</span>${q.question}
                    <div class="text-xs text-gray-500 mt-1">Correct: <strong>${q.correct_answer}</strong></div>
                  </div>
                  <button onclick="deleteQuestion(${q.id})" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (tabName === "resources") {
        const data = await apiRequest(`/api/resources/lesson/${currentLessonId}`);
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="font-semibold text-gray-700">PDF Files</h3>
              <button onclick="openResourceModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded">+ Upload PDF</button>
            </div>
            <div class="space-y-2">
              ${data.resources.map(r => `
                <div class="p-3 border rounded bg-gray-50 text-sm flex justify-between items-center">
                  <span>${r.title} (${r.file_name})</span>
                  <button onclick="deleteResource(${r.id})" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    async function saveNotes() {
      const content = document.getElementById("note-content").value;
      await apiRequest(`/api/notes/${currentLessonId}`, "PUT", { content });
      alert("Notes saved successfully!");
    }

    async function deleteLesson(id) {
      if (!confirm("Are you sure you want to delete this lesson?")) return;
      await apiRequest(`/api/lessons/${id}`, "DELETE");
      currentLessonId = null;
      await verifyAndLoad();
      document.getElementById("content-panel").innerHTML = `<div class="text-center text-gray-400 my-auto"><p class="text-lg">Select a lesson from the sidebar.</p></div>`;
    }

    async function deleteQuestion(id) {
      if (!confirm("Delete question?")) return;
      await apiRequest(`/api/questions/${id}`, "DELETE");
      loadTab("questions");
    }

    async function deleteResource(id) {
      if (!confirm("Delete resource?")) return;
      await apiRequest(`/api/resources/${id}`, "DELETE");
      loadTab("resources");
    }

    // Modal Helpers for Adding Subjects / Lessons / Questions / Resources
    function openSubjectModal() {
      showModal(`
        <h3 class="font-bold text-lg mb-3">Add Subject</h3>
        <input id="sub-name" type="text" placeholder="Subject Name" class="w-full p-2 border rounded mb-3 text-sm">
        <div class="flex justify-end space-x-2">
          <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Cancel</button>
          <button onclick="submitSubject()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Create</button>
        </div>
      `);
    }

    async function submitSubject() {
      const name = document.getElementById("sub-name").value;
      await apiRequest("/api/subjects", "POST", { name });
      closeModal();
      verifyAndLoad();
    }

    function openLessonModal(subjectId) {
      showModal(`
        <h3 class="font-bold text-lg mb-3">Add Lesson</h3>
        <input id="less-title" type="text" placeholder="Lesson Title" class="w-full p-2 border rounded mb-3 text-sm">
        <textarea id="less-desc" placeholder="Description" class="w-full p-2 border rounded mb-3 text-sm"></textarea>
        <div class="flex justify-end space-x-2">
          <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Cancel</button>
          <button onclick="submitLesson(${subjectId})" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Create</button>
        </div>
      `);
    }

    async function submitLesson(subjectId) {
      const title = document.getElementById("less-title").value;
      const description = document.getElementById("less-desc").value;
      await apiRequest("/api/lessons", "POST", { title, description, subject_id: subjectId });
      closeModal();
      verifyAndLoad();
    }

    function openQuestionModal() {
      showModal(`
        <h3 class="font-bold text-lg mb-3">Add MCQ Question</h3>
        <textarea id="q-text" placeholder="Question text" class="w-full p-2 border rounded mb-2 text-sm"></textarea>
        <input id="q-a" type="text" placeholder="Option A" class="w-full p-2 border rounded mb-2 text-sm">
        <input id="q-b" type="text" placeholder="Option B" class="w-full p-2 border rounded mb-2 text-sm">
        <input id="q-c" type="text" placeholder="Option C" class="w-full p-2 border rounded mb-2 text-sm">
        <input id="q-d" type="text" placeholder="Option D" class="w-full p-2 border rounded mb-2 text-sm">
        <select id="q-ans" class="w-full p-2 border rounded mb-3 text-sm">
          <option value="A">Correct: A</option>
          <option value="B">Correct: B</option>
          <option value="C">Correct: C</option>
          <option value="D">Correct: D</option>
        </select>
        <div class="flex justify-end space-x-2">
          <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Cancel</button>
          <button onclick="submitQuestion()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Save</button>
        </div>
      `);
    }

    async function submitQuestion() {
      const body = {
        lesson_id: currentLessonId,
        question: document.getElementById("q-text").value,
        option_a: document.getElementById("q-a").value,
        option_b: document.getElementById("q-b").value,
        option_c: document.getElementById("q-c").value,
        option_d: document.getElementById("q-d").value,
        correct_answer: document.getElementById("q-ans").value
      };
      await apiRequest("/api/questions", "POST", body);
      closeModal();
      loadTab("questions");
    }

    function openResourceModal() {
      showModal(`
        <h3 class="font-bold text-lg mb-3">Upload PDF Resource</h3>
        <input id="res-title" type="text" placeholder="Resource Title" class="w-full p-2 border rounded mb-2 text-sm">
        <input id="res-file" type="file" accept="application/pdf" class="w-full p-2 border rounded mb-3 text-sm">
        <div class="flex justify-end space-x-2">
          <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Cancel</button>
          <button onclick="submitResource()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Upload</button>
        </div>
      `);
    }

    async function submitResource() {
      const title = document.getElementById("res-title").value;
      const fileInput = document.getElementById("res-file").files[0];
      const formData = new FormData();
      formData.append("lesson_id", currentLessonId);
      formData.append("title", title);
      formData.append("file", fileInput);

      await apiRequest("/api/resources", "POST", formData, true);
      closeModal();
      loadTab("resources");
    }

    function showModal(html) {
      const root = document.getElementById("modal-root");
      root.innerHTML = `
        <div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4">
          <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg">
            ${html}
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
    }
  </script>
</body>
</html>
