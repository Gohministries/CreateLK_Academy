
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK English V2 Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font:15px Arial,sans-serif}header{background:#102a56;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #102a5612}h2{font-size:18px;margin:0 0 14px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5e3;border-radius:7px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:7px;padding:11px 14px;background:#102a56;color:white;font-weight:bold;cursor:pointer;margin:3px}button.gold{background:#d69b16;color:#102039}button.red{background:#b42318}button.light{background:#e8eef8;color:#102a56}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1}.item{border:1px solid #e1e7f0;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}.item strong{display:block;margin-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.muted{color:#66758b;font-size:13px}#msg{position:sticky;top:0;padding:10px;background:#e8eef8;color:#102a56;z-index:5;display:none;white-space:pre-wrap}.status{font-size:12px;color:#66758b}@media(max-width:600px){.row{grid-template-columns:1fr}main{padding:10px}header{padding:14px}}
</style>
</head>
<body>
<header><div><b>CreateLK English V2</b><div class="muted" style="color:#dce6f7">Admin Panel</div></div><button id="logout" class="light hide" onclick="logout()">Sign out</button></header>
<div id="msg"></div>
<main>
<section id="login" class="card">
<h2>Administrator Login</h2>
<p>Sign in with your authorized Google account.</p>
<div id="gbtn"></div>
<p class="muted">Only the configured administrator email is permitted.</p>
</section>
<section id="app" class="hide">
<div class="card">
<div class="tabs">
<button onclick="tab('dashboard')">Dashboard</button>
<button onclick="tab('subjects')">Subjects</button>
<button onclick="tab('lessons')">Lessons</button>
<button onclick="tab('notes')">Notes</button>
<button onclick="tab('translations')">Translations</button>
<button onclick="tab('images')">Images</button>
</div>
</div>

<section id="dashboard" class="panel card">
<h2>Dashboard</h2><div id="stats">Loading...</div>
<button onclick="loadAll()">Refresh</button>
</section>

<section id="subjects" class="panel card hide">
<h2 id="stitle">Add Subject</h2>
<input id="sid" type="hidden">
<label>Subject title</label><input id="sname" placeholder="Subject name">
<label>Slug (optional)</label><input id="sslug" placeholder="facebook-marketing">
<label>Description</label><textarea id="sdesc" placeholder="Subject description"></textarea>
<label>Subtitle</label><input id="ssub" placeholder="Subtitle">
<label>Image URL</label><input id="simage" placeholder="https://...">
<div class="row"><div><label>Display order</label><input id="sorder" type="number" value="1"></div><div><label>Status</label><select id="sstatus"><option>PUBLISHED</option><option>DRAFT</option><option>COMING_SOON</option></select></div></div>
<button class="gold" onclick="saveSubject()">Save Subject</button><button class="light" onclick="clearSubject()">Clear</button>
<h2>Existing Subjects</h2><div id="subjectList"></div>
</section>

<section id="lessons" class="panel card hide">
<h2 id="ltitle">Add Lesson</h2>
<input id="lid" type="hidden">
<label>Subject</label><select id="lsubject"></select>
<label>Lesson title</label><input id="lname" placeholder="Lesson title">
<label>Main title</label><input id="lmain" placeholder="Main title">
<label>Subtitle</label><input id="lsub" placeholder="Subtitle">
<label>Description</label><textarea id="ldesc" placeholder="Lesson description"></textarea>
<label>Lesson content</label><textarea id="lcontent" placeholder="Lesson content"></textarea>
<div class="row"><div><label>Display order</label><input id="lorder" type="number" value="1"></div><div><label>Status</label><select id="lstatus"><option>PUBLISHED</option><option>DRAFT</option><option>COMING_SOON</option></select></div></div>
<label><input id="lfree" type="checkbox" style="width:auto;margin:0 7px 0 0">Free lesson</label>
<p><button class="gold" onclick="saveLesson()">Save Lesson</button><button class="light" onclick="clearLesson()">Clear</button></p>
<h2>Existing Lessons</h2><input id="search" placeholder="Search lessons..." oninput="renderLessons()"><div id="lessonList"></div>
</section>

<section id="notes" class="panel card hide">
<h2>Lesson Notes</h2><label>Lesson</label><select id="nlesson" onchange="loadNote()"></select>
<textarea id="ncontent" placeholder="Write notes for this lesson"></textarea>
<button class="gold" onclick="saveNote()">Save Notes</button>
</section>

<section id="translations" class="panel card hide">
<h2>Lesson Translations</h2><label>Lesson</label><select id="tlesson" onchange="loadTranslation()"></select>
<label>Language</label><select id="tlang" onchange="loadTranslation()"><option value="ta">Tamil</option><option value="si">Sinhala</option><option value="en">English</option></select>
<label>Translated title</label><input id="ttitle">
<label>Translated description</label><textarea id="tdesc"></textarea>
<label>Translated content</label><textarea id="tcontent"></textarea>
<button class="gold" onclick="saveTranslation()">Save Translation</button>
</section>

<section id="images" class="panel card hide">
<h2>Lesson Image Upload</h2><label>Lesson</label><select id="ilesson"></select>
<label>Choose image (JPG, PNG, WEBP, GIF; maximum 5 MB)</label><input id="ifile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<button class="gold" onclick="uploadImage()">Upload Image</button><div id="imageResult"></div>
</section>
</section>
</main>
<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
let token="",subjects=[],lessons=[];
const $=id=>document.getElementById(id);
function message(s,ok=true){$("msg").style.display="block";$("msg").style.background=ok?"#e4f7eb":"#fde8e7";$("msg").style.color=ok?"#17663a":"#a12622";$("msg").textContent=s;window.scrollTo({top:0,behavior:"smooth"})}
async function api(path,options={}){
 const headers={...(options.body instanceof FormData?{}:{"Content-Type":"application/json"}),...(options.headers||{})};
 if(token)headers.Authorization="Bearer "+token;
 const r=await fetch(API+path,{...options,headers});
 const d=await r.json().catch(()=>({error:"Invalid server response"}));
 if(!r.ok)throw Error(d.error||"Request failed ("+r.status+")");
 return d;
}
function handleCredential(response){
 token=response.credential;
 api("/api/bootstrap").then(d=>{
  $("login").classList.add("hide");$("app").classList.remove("hide");$("logout").classList.remove("hide");subjects=d.subjects||[];lessons=d.lessons||[];renderAll();message("Login successful.");
 }).catch(e=>{token="";message(e.message,false)});
}
window.addEventListener("load",()=>{
 const wait=()=>{if(window.google?.accounts?.id){google.accounts.id.initialize({client_id:CLIENT_ID,callback:handleCredential});google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",text:"signin_with",width:280})}else setTimeout(wait,300)};
 wait();
});
function logout(){token="";$("app").classList.add("hide");$("login").classList.remove("hide");$("logout").classList.add("hide");$("gbtn").innerHTML="";location.reload()}
function tab(id){document.querySelectorAll(".panel").forEach(x=>x.classList.add("hide"));$(id).classList.remove("hide");if(id==="notes")loadNote();if(id==="translations")loadTranslation()}
function renderAll(){renderSubjects();renderLessons();fillLessonSelects();$("stats").textContent=`Subjects: ${subjects.length} | Lessons: ${lessons.length} | Published lessons: ${lessons.filter(x=>(x.status||"PUBLISHED")==="PUBLISHED").length}`}
function fillLessonSelects(){
 const sub=subjects.map(s=>`<option value="${s.id}">${esc(s.title||s.name||("Subject "+s.id))}</option>`).join("");
 $("lsubject").innerHTML=sub;
 const opts=lessons.map(l=>`<option value="${l.id}">${esc(l.title||("Lesson "+l.id))}</option>`).join("");
 ["nlesson","tlesson","ilesson"].forEach(id=>$(id).innerHTML=opts||'<option value="">No lessons</option>');
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderSubjects(){
 $("subjectList").innerHTML=subjects.map(s=>`<div class="item"><strong>${esc(s.title||s.name)}</strong><div class="muted">ID ${s.id} · ${esc(s.status||"PUBLISHED")} · Order ${s.display_order??0}</div><p>${esc(s.description||"")}</p><button onclick="editSubject(${s.id})">Edit</button><button class="red" onclick="deleteSubject(${s.id})">Delete</button></div>`).join("")||"No subjects yet.";
}
function renderLessons(){
 const q=$("search").value.toLowerCase();
 $("lessonList").innerHTML=lessons.filter(l=>(l.title||"").toLowerCase().includes(q)).map(l=>`<div class="item"><strong>${esc(l.title)}</strong><div class="muted">ID ${l.id} · Subject ${l.subject_id||"-"} · ${esc(l.status||"PUBLISHED")} · ${Number(l.is_free)?"Free":"Premium"}</div><p>${esc(l.description||"")}</p>${l.image_url?`<img src="${esc(l.image_url)}" style="max-width:120px;max-height:90px">`:""}<p><button onclick="editLesson(${l.id})">Edit</button><button class="red" onclick="deleteLesson(${l.id})">Delete</button></p></div>`).join("")||"No lessons found.";
}
async function loadAll(){try{const d=await api("/api/bootstrap");subjects=d.subjects||[];lessons=d.lessons||[];renderAll();message("Data refreshed.")}catch(e){message(e.message,false)}}
function clearSubject(){["sid","sname","sslug","sdesc","ssub","simage"].forEach(x=>$(x).value="");$("sorder").value=subjects.length+1;$("sstatus").value="PUBLISHED";$("stitle").textContent="Add Subject"}
function editSubject(id){const s=subjects.find(x=>x.id===id);if(!s)return;tab("subjects");$("sid").value=id;$("sname").value=s.title||s.name||"";$("sslug").value=s.slug||"";$("sdesc").value=s.description||"";$("ssub").value=s.subtitle||"";$("simage").value=s.image_url||"";$("sorder").value=s.display_order??0;$("sstatus").value=s.status||"PUBLISHED";$("stitle").textContent="Edit Subject";window.scrollTo(0,0)}
async function saveSubject(){try{const id=$("sid").value,b={title:$("sname").value,slug:$("sslug").value,description:$("sdesc").value,subtitle:$("ssub").value,image_url:$("simage").value,display_order:Number($("sorder").value),status:$("sstatus").value};await api("/api/subjects"+(id?"/"+id:""),{method:id?"PUT":"POST",body:JSON.stringify(b)});clearSubject();await loadAll();message("Subject saved successfully.")}catch(e){message(e.message,false)}}
async function deleteSubject(id){if(!confirm("Delete this subject? Subjects with lessons cannot be deleted."))return;try{await api("/api/subjects/"+id,{method:"DELETE"});await loadAll();message("Subject deleted.")}catch(e){message(e.message,false)}}
function clearLesson(){["lid","lname","lmain","lsub","ldesc","lcontent"].forEach(x=>$(x).value="");$("lorder").value=lessons.length+1;$("lstatus").value="PUBLISHED";$("lfree").checked=false;$("ltitle").textContent="Add Lesson"}
function editLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;tab("lessons");$("lid").value=id;$("lsubject").value=l.subject_id||"";$("lname").value=l.title||"";$("lmain").value=l.main_title||"";$("lsub").value=l.subtitle||"";$("ldesc").value=l.description||"";$("lcontent").value=l.content||"";$("lorder").value=l.display_order??l.sort_order??1;$("lstatus").value=l.status||"PUBLISHED";$("lfree").checked=Number(l.is_free)===1;$("ltitle").textContent="Edit Lesson";window.scrollTo(0,0)}
async function saveLesson(){try{const id=$("lid").value,b={subject_id:Number($("lsubject").value),title:$("lname").value,main_title:$("lmain").value,subtitle:$("lsub").value,description:$("ldesc").value,content:$("lcontent").value,display_order:Number($("lorder").value),status:$("lstatus").value,is_free:$("lfree").checked?1:0};await api("/api/lessons"+(id?"/"+id:""),{method:id?"PUT":"POST",body:JSON.stringify(b)});clearLesson();await loadAll();message("Lesson saved successfully.")}catch(e){message(e.message,false)}}
async function deleteLesson(id){if(!confirm("Permanently delete this lesson and its notes/translations?"))return;try{await api("/api/lessons/"+id,{method:"DELETE"});await loadAll();message("Lesson deleted.")}catch(e){message(e.message,false)}}
async function loadNote(){const id=$("nlesson").value;if(!id)return $("ncontent").value="";try{$("ncontent").value=(await api("/api/notes/"+id)).content||""}catch(e){message(e.message,false)}}
async function saveNote(){try{await api("/api/notes/"+$("nlesson").value,{method:"PUT",body:JSON.stringify({content:$("ncontent").value})});message("Notes saved successfully.")}catch(e){message(e.message,false)}}
async function loadTranslation(){const id=$("tlesson").value;if(!id)return;try{const d=await api("/api/translations/lesson/"+id);const t=(d.translations||[]).find(x=>x.language===$("tlang").value)||{};$("ttitle").value=t.title||"";$("tdesc").value=t.description||"";$("tcontent").value=t.content||""}catch(e){message(e.message,false)}}
async function saveTranslation(){try{await api("/api/translations",{method:"POST",body:JSON.stringify({lesson_id:Number($("tlesson").value),language:$("tlang").value,title:$("ttitle").value,description:$("tdesc").value,content:$("tcontent").value})});message("Translation saved successfully.")}catch(e){message(e.message,false)}}
async function uploadImage(){try{const file=$("ifile").files[0],id=$("ilesson").value;if(!file||!id)throw Error("Select a lesson and image.");const f=new FormData();f.append("file",file);f.append("lesson_id",id);const d=await api("/api/lesson-images",{method:"POST",body:f});$("imageResult").innerHTML=`<p>Uploaded successfully.</p><input value="${esc(d.url)}" readonly><img src="${esc(d.url)}" style="display:block;max-width:220px;margin-top:10px">`;await loadAll();message("Image uploaded successfully.")}catch(e){message(e.message,false)}}
</script>
</body>
</html>
