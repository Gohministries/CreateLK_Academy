

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK V2 Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f3f6fb;color:#18253b}
header{background:#102a56;color:white;padding:18px}main{max-width:850px;margin:20px auto;padding:12px}
section{background:white;padding:18px;margin-bottom:16px;border-radius:12px}
h2{font-size:19px;color:#102a56}input,select,textarea,button{font:inherit;padding:11px;width:100%;margin:5px 0;border:1px solid #ccd5e2;border-radius:7px}
textarea{min-height:90px}button{background:#102a56;color:white;cursor:pointer}button.alt{background:#f0b92f;color:#102a56}
.item{border:1px solid #ddd;padding:12px;margin:9px 0;border-radius:8px;overflow-wrap:anywhere}
.sub{margin-left:18px;border-left:3px solid #f0b92f}
.actions{display:flex;gap:6px}.actions button{flex:1}
small{color:#68758a}#app{display:none}#msg{padding:10px;display:none}
img{max-width:100%;max-height:220px;margin-top:8px}
</style>
</head>
<body>
<header><b>CreateLK V2 Admin</b><button class="alt" id="logout" hidden onclick="location.reload()">Sign Out</button></header>

<main>
<section id="login">
<h2>Administrator Login</h2>
<div id="google"></div><p id="loginmsg">Loading Google login...</p>
</section>

<div id="app">
<section>
<h2>Categories</h2>
<form id="catForm">
<input type="hidden" id="catId">
<input id="catName" placeholder="Category name" required maxlength="120">
<select id="parent"><option value="">Main Category</option></select>
<button id="catSave">Save Category</button>
<button type="button" class="alt" onclick="resetCat()">Cancel</button>
</form>
<div id="cats"></div>
</section>

<section>
<h2 id="formTitle">Add Content</h2>
<form id="contentForm">
<input type="hidden" id="contentId">
<input type="hidden" id="imageUrl">
<select id="category" required><option value="">Select category</option></select>
<input id="title" placeholder="Title (automatic)" readonly>
<textarea id="description" placeholder="Description"></textarea>
<textarea id="explanation" placeholder="Explanation or content"></textarea>
<label>Upload photo</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<small>JPG, PNG, WEBP, GIF · Maximum 10 MB</small>
<img id="preview" hidden>
<button id="contentSave">Save Content</button>
<button type="button" class="alt" onclick="resetContent()">Clear</button>
</form>
</section>

<section><h2>Saved Content</h2><div id="contents"></div></section>
</div>
<p id="msg"></p>
</main>

<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const ADMIN="gateofheavensl1@gmail.com";
let token="",cats=[],items=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(s,error=false){$("msg").textContent=s;$("msg").style.display="block";$("msg").style.color=error?"#b00020":"#18794e"}
async function api(path,opt={}){
 opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};
 if(opt.body&&!(opt.body instanceof FormData))opt.headers["Content-Type"]="application/json";
 let r;try{r=await fetch(API+path,opt)}catch{throw Error("Cannot connect to Worker. Check deployment and CORS.")}
 let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;
}
function login(res){
 token=res.credential;
 const p=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
 if(p.email?.toLowerCase()!==ADMIN||p.email_verified!==true){token="";return msg("Use the authorized admin account.",true)}
 $("login").hidden=true;$("app").style.display="block";$("logout").hidden=false;
 refresh().catch(e=>msg(e.message,true));
}
function init(){
 if(!window.google?.accounts?.id)return;
 google.accounts.id.initialize({client_id:CLIENT,callback:login});
 google.accounts.id.renderButton($("google"),{theme:"outline",size:"large",text:"signin_with"});
 $("loginmsg").textContent="Sign in as "+ADMIN;
}
window.addEventListener("load",()=>{let n=0;let t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);init()}else if(++n>40){clearInterval(t);$("loginmsg").textContent="Google login failed to load. Reload the page."}},250)});

function main(c){return c.parent_id==null||c.parent_id===""}
function byId(id){return cats.find(c=>+c.id===+id)}
function kids(id){return cats.filter(c=>+c.parent_id===+id)}
async function refresh(){
 let d=await api("/api/bootstrap");cats=d.categories||[];
 $("parent").innerHTML='<option value="">Main Category</option>'+cats.filter(main).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
 $("category").innerHTML='<option value="">Select category</option>'+cats.map(c=>`<option value="${c.id}">${esc(main(c)?c.name:(byId(c.parent_id)?.name||"Main")+" → "+c.name)}</option>`).join("");
 renderCats();await loadContent();
}
function renderCats(){
 $("cats").innerHTML=cats.filter(main).map(c=>`<div class="item"><b>${esc(c.name)}</b> — Main Category
<div class="actions"><button onclick="editCat(${c.id})">Edit</button><button onclick="delCat(${c.id})">Delete</button><button onclick="newSub(${c.id})">+ Subcategory</button></div>
${kids(c.id).map(s=>`<div class="item sub"><b>${esc(s.name)}</b> — Subcategory<div class="actions"><button onclick="editCat(${s.id})">Edit</button><button onclick="delCat(${s.id})">Delete</button></div></div>`).join("")}</div>`).join("")||"No categories yet.";
}
function resetCat(){$("catForm").reset();$("catId").value="";$("catSave").textContent="Save Category"}
function newSub(id){resetCat();$("parent").value=id;$("catName").focus()}
function editCat(id){let c=byId(id);$("catId").value=id;$("catName").value=c.name;$("parent").value=c.parent_id||"";$("catSave").textContent="Update Category"}
$("catForm").onsubmit=async e=>{
 e.preventDefault();let id=$("catId").value;
 try{await api(id?"/api/categories/"+id:"/api/categories",{method:id?"PUT":"POST",body:JSON.stringify({name:$("catName").value.trim(),parent_id:$("parent").value?+$("parent").value:null})});resetCat();await refresh();msg("Category saved successfully")}
 catch(e){msg(e.message,true)}
};
async function delCat(id){if(!confirm("Delete this category?"))return;try{await api("/api/categories/"+id,{method:"DELETE"});await refresh();msg("Category deleted")}catch(e){msg(e.message,true)}}

$("category").onchange=()=>$("title").value=byId($("category").value)?.name||"";
$("photo").onchange=()=>{
 let f=$("photo").files[0];if(!f){$("preview").hidden=true;return}
 if(f.size>10485760||!["image/jpeg","image/png","image/webp","image/gif"].includes(f.type)){ $("photo").value="";return msg("Use JPG, PNG, WEBP or GIF up to 10 MB.",true)}
 $("preview").src=URL.createObjectURL(f);$("preview").hidden=false;
};
async function upload(f){let form=new FormData();form.append("image",f);return (await api("/api/content-images",{method:"POST",body:form})).image_url}
function resetContent(){$("contentForm").reset();$("contentId").value="";$("imageUrl").value="";$("preview").hidden=true;$("formTitle").textContent="Add Content";$("contentSave").textContent="Save Content";$("title").value=""}
$("contentForm").onsubmit=async e=>{
 e.preventDefault();let id=$("contentId").value;
 try{
 let image_url=$("imageUrl").value,f=$("photo").files[0];if(f)image_url=await upload(f);
 await api(id?"/api/contents/"+id:"/api/contents",{method:id?"PUT":"POST",body:JSON.stringify({category_id:+$("category").value,description:$("description").value,explanation:$("explanation").value,image_url})});
 resetContent();await refresh();msg("Content saved successfully");
 }catch(e){msg(e.message,true)}
};
async function loadContent(){
 let d=await api("/api/contents");items=d.contents||[];
 $("contents").innerHTML=items.map(x=>`<div class="item"><b>${esc(x.title||x.category_name)}</b><p>${esc(x.description)}</p>${x.image_url?`<img src="${esc(x.image_url)}" alt="Content photo">`:""}<details><summary>Explanation</summary><p>${esc(x.explanation)}</p></details><div class="actions"><button onclick="editContent(${x.id})">Edit</button><button onclick="delContent(${x.id})">Delete</button></div></div>`).join("")||"No content yet.";
}
async function editContent(id){
 let x=items.find(a=>+a.id===+id);if(!x)return;
 $("contentId").value=x.id;$("category").value=x.category_id;$("title").value=x.title;
 $("description").value=x.description||"";$("explanation").value=x.explanation||"";$("imageUrl").value=x.image_url||"";
 $("preview").hidden=!x.image_url;if(x.image_url)$("preview").src=x.image_url;
 $("formTitle").textContent="Edit Content";$("contentSave").textContent="Update Content";$("contentForm").scrollIntoView({behavior:"smooth"});
}
async function delContent(id){if(!confirm("Delete this content?"))return;try{await api("/api/contents/"+id,{method:"DELETE"});await refresh();msg("Content deleted")}catch(e){msg(e.message,true)}}
</script>
</body>
</html>
