
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--g:#d69b16}
*{box-sizing:border-box}
body{margin:0;font:15px Arial;background:#f3f6fb;color:#172033}
header{background:var(--n);color:white;padding:14px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:19px}
button,input,select,textarea{font:inherit;padding:11px;border:1px solid #ccd3df;border-radius:7px;width:100%;margin:5px 0}
button{background:var(--n);color:white;border:0;font-weight:bold;cursor:pointer}
.gold{background:var(--g);color:#111}.red{background:#c62828}.gray{background:#596579}
main{max-width:900px;margin:auto;padding:12px}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 3px 14px #102a5612}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
label{display:block;font-weight:bold;margin-top:10px}
.small{font-size:13px;color:#647084}
.lesson,.subject{border:1px solid #ddd;padding:12px;border-radius:8px;margin:8px 0}
.hidden{display:none!important}
#status{padding:10px;border-radius:7px;display:none}
.ok{background:#e4f8eb;color:#176b37}.err{background:#ffebeb;color:#a21d1d}
.tag{display:inline-block;padding:5px 8px;border-radius:5px;font-size:12px;font-weight:bold}
.free{background:#e4f8eb;color:#176b37}.premium{background:#fff1cc;color:#825600}
#menu{display:none;position:fixed;inset:0;background:#0007;z-index:10}
#menu.open{display:block}
.menuBox{background:white;width:280px;max-width:85%;height:100%;padding:16px}
#photoPreview img{max-width:130px;max-height:100px}
</style>
</head>
<body>
<header>
<button style="width:45px;font-size:22px;margin:0" onclick="menu(true)">☰</button>
<div><h2>CreateLK Academy Admin</h2><div class="small" style="color:white">Manage Academy</div></div>
</header>

<div id="menu" onclick="if(event.target===this)menu(false)">
<div class="menuBox">
<h3>☰ Admin Menu</h3>
<button class="gray" onclick="menu(false)">Close Menu ✕</button>
<button onclick="go('dashboard')">🏠 Dashboard</button>
<button onclick="go('subjects')">📚 Add Subjects</button>
<button onclick="go('addLesson')">➕ Add Lesson</button>
<button onclick="go('lessons')">📝 Manage Lessons</button>
<button onclick="go('editor')">🌐 Edit / Translate</button>
<button class="red" onclick="signOut()">Sign Out</button>
</div>
</div>

<main>
<div class="card" id="login">
<h3>Administrator Login</h3>
<p class="small">Sign in using your authorized Google account.</p>
<div id="googleButton"></div>
</div>

<div id="app" class="hidden">
<div class="card" id="dashboard">
<h3>Dashboard</h3>
<div class="row"><div>Subjects: <b id="sc">0</b></div><div>Lessons: <b id="lc">0</b></div></div>
<div id="status"></div>
<div class="row">
<button onclick="go('subjects')">+ Subject</button>
<button class="gold" onclick="go('addLesson')">+ Lesson</button>
<button class="gray" onclick="load()">Refresh</button>
</div>
</div>

<div class="card" id="subjects">
<h3>Add Subject</h3>
<input id="st" placeholder="Subject name">
<textarea id="sd" placeholder="Subject description"></textarea>
<button onclick="addSubject()">Save Subject</button>
<div id="subjectList"></div>
</div>

<div class="card" id="addLesson">
<h3>Add New Lesson</h3>
<label>Subject</label><select id="ns"></select>
<label>Lesson Title</label><input id="nt" placeholder="Lesson title">
<label>Description</label><textarea id="nd" placeholder="Description"></textarea>
<label>Access</label>
<select id="na"><option value="1">Free Lesson</option><option value="0">Premium Lesson</option></select>
<label>Status</label>
<select id="nst"><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option></select>
<button onclick="addLesson()">Create Lesson</button>
</div>

<div class="card" id="lessons">
<h3>Manage Lessons</h3>
<div id="lessonList"></div>
</div>

<div class="card" id="editor">
<h3 id="eh">Edit Lesson</h3>
<input type="hidden" id="id">
<label>Language</label>
<select id="lang"><option value="en">English</option><option value="ta">Tamil</option><option value="si">Sinhala</option></select>
<label>Title</label><input id="title" placeholder="Lesson title">
<label>Description</label><textarea id="desc" rows="4"></textarea>
<label>Access</label>
<select id="access"><option value="1">Free Lesson</option><option value="0">Premium Lesson</option></select>
<label>Subject</label><select id="es"></select>
<label>Status</label>
<select id="statusSelect"><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option></select>
<label>Photo (max 5 MB)</label><input id="photo" type="file" accept="image/*">
<div id="photoPreview" class="small"></div>
<div class="row"><button onclick="save()">Save Changes</button><button class="gray" onclick="clearEditor()">Cancel</button></div>
</div>
</div>
</main>

<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
let token=localStorage.getItem("createlk_admin_token")||"",lessons=[],subjects=[];

function menu(v){document.getElementById("menu").classList.toggle("open",v)}
function go(id){menu(false);document.getElementById(id).scrollIntoView({behavior:"smooth"})}
function popup(t,e=false){alert((e?"Error: ":"Success: ")+t)}
function msg(t,e=false){let x=document.getElementById("status");x.textContent=t;x.className=e?"err":"ok";x.style.display="block"}
function free(l){return l.is_free===true||Number(l.is_free)===1}

async function req(path,opt={}){
 let r=await fetch(API+path,{...opt,headers:{"Authorization":"Bearer "+token,...(opt.body instanceof FormData?{}:{"Content-Type":"application/json"}),...(opt.headers||{})}});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed ("+r.status+")");
 return d;
}

function signin(r){token=r.credential;localStorage.setItem("createlk_admin_token",token);show()}
function show(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");load()}
function signOut(){token="";localStorage.removeItem("createlk_admin_token");location.reload()}
window.addEventListener("load",()=>{
 if(window.google){google.accounts.id.initialize({client_id:CLIENT,callback:signin});google.accounts.id.renderButton(document.getElementById("googleButton"),{theme:"outline",size:"large"})}
 if(token)show();
});

async function load(){
 try{
  let d=await req("/api/bootstrap");subjects=d.subjects||[];lessons=d.lessons||[];
  document.getElementById("sc").textContent=subjects.length;document.getElementById("lc").textContent=lessons.length;
  renderSubjects();renderLessons();subjectOptions();
 }catch(e){msg(e.message,true)}
}
function subjectOptions(){
 ["ns","es"].forEach(id=>{
  let s=document.getElementById(id),old=s.value;s.innerHTML='<option value="">Select subject</option>';
  subjects.forEach(x=>s.add(new Option(x.title||x.name,x.id)));
  if([...s.options].some(o=>o.value===old))s.value=old;
 });
}
function renderSubjects(){
 let box=document.getElementById("subjectList");box.innerHTML="<h4>Existing Subjects</h4>";
 subjects.forEach(s=>{
  let d=document.createElement("div");d.className="subject";
  let t=document.createElement("b");t.textContent=s.title||s.name;
  let b=document.createElement("button");b.className="gold";b.textContent="Edit Subject";b.onclick=()=>editSubject(s);
  d.append(t,b);box.append(d);
 });
}
async function addSubject(){
 let title=st.value.trim(),description=sd.value.trim();
 if(!title)return popup("Enter subject name.",true);
 try{await req("/api/subjects",{method:"POST",body:JSON.stringify({title,description})});st.value=sd.value="";await load();popup("Subject added")}
 catch(e){popup(e.message,true)}
}
async function editSubject(s){
 let title=prompt("Subject name:",s.title||s.name);if(title===null||!title.trim())return;
 let description=prompt("Description:",s.description||"");if(description===null)return;
 try{await req("/api/subjects/"+s.id,{method:"PUT",body:JSON.stringify({title:title.trim(),description,slug:s.slug||"",sort_order:Number(s.sort_order)||0})});await load();popup("Subject updated")}
 catch(e){popup(e.message,true)}
}
async function addLesson(){
 let subject_id=Number(ns.value),title=nt.value.trim(),description=nd.value.trim();
 if(!subject_id||!title)return popup("Choose a subject and enter a title.",true);
 try{
  let d=await req("/api/lessons",{method:"POST",body:JSON.stringify({subject_id,title,description,is_free:Number(na.value),status:nst.value})});
  if(d.id)await req("/api/translations",{method:"POST",body:JSON.stringify({lesson_id:d.id,language:"en",title,description,content:""})});
  nt.value=nd.value="";await load();popup("Lesson added");
 }catch(e){popup(e.message,true)}
}
function renderLessons(){
 let box=document.getElementById("lessonList");box.innerHTML="";
 lessons.forEach(l=>{
  let d=document.createElement("div");d.className="lesson";
  let t=document.createElement("b");t.textContent=l.title||l.name||"Untitled";
  let tag=document.createElement("div");tag.className="tag "+(free(l)?"free":"premium");tag.textContent=free(l)?"FREE":"PREMIUM";
  let info=document.createElement("div");info.className="small";info.textContent="ID "+l.id+" · "+(subjects.find(s=>String(s.id)===String(l.subject_id))?.title||"Subject") ;
  let row=document.createElement("div");row.className="row";
  let e=document.createElement("button");e.textContent="Edit";e.onclick=()=>edit(l);
  let rn=document.createElement("button");rn.className="gold";rn.textContent="Rename";rn.onclick=()=>rename(l);
  let del=document.createElement("button");del.className="red";del.textContent="Delete";del.onclick=()=>removeLesson(l);
  row.append(e,rn,del);d.append(t,tag,info,row);box.append(d);
 });
}
async function edit(l){
 id.value=l.id;eh.textContent="Edit Lesson #"+l.id;title.value=l.title||l.name||"";desc.value=l.description||"";
 access.value=free(l)?"1":"0";statusSelect.value=l.status==="DRAFT"?"DRAFT":"PUBLISHED";subjectOptions();es.value=l.subject_id||"";
 photo.value="";photoPreview.innerHTML="";
 let url=l.image_url||l.photo_url||l.image||l.photo;
 if(url){let im=document.createElement("img");im.src=url;photoPreview.append(im)}
 go("editor");
 try{
  let d=await req("/api/translations/lesson/"+l.id),tr=(d.translations||[]).find(x=>x.language===lang.value);
  if(tr){title.value=tr.title||"";desc.value=tr.description||""}
  else if(lang.value!=="en")title.value=desc.value="";
 }catch(e){}
}
async function rename(l){
 let t=prompt("New lesson title:",l.title||l.name||"");if(t===null||!t.trim())return;
 try{await req("/api/lessons/"+l.id,{method:"PUT",body:JSON.stringify({title:t.trim(),description:l.description||"",subject_id:l.subject_id,is_free:free(l)?1:0,status:l.status==="DRAFT"?"DRAFT":"PUBLISHED"})});await load();popup("Lesson renamed")}
 catch(e){popup(e.message,true)}
}
async function removeLesson(l){
 if(!confirm("Permanently delete "+(l.title||l.name)+"?"))return;
 try{await req("/api/lessons/"+l.id,{method:"DELETE"});clearEditor();await load();popup("Lesson deleted")}
 catch(e){popup(e.message,true)}
}
async function save(){
 let l=lessons.find(x=>String(x.id)===id.value),t=title.value.trim(),description=desc.value.trim(),subject_id=Number(es.value);
 if(!l||!t||!subject_id)return popup("Choose a lesson, title and subject.",true);
 try{
  let p=photo.files[0];
  if(p){
   if(p.size>5*1024*1024)throw Error("Photo must be 5 MB or smaller.");
   let f=new FormData();f.append("file",p);f.append("lesson_id",id.value);
   await req("/api/lesson-images",{method:"POST",body:f});
  }
  await req("/api/lessons/"+id.value,{method:"PUT",body:JSON.stringify({
   title:lang.value==="en"?t:(l.title||l.name||t),
   description:lang.value==="en"?description:(l.description||""),
   subject_id,is_free:Number(access.value),status:statusSelect.value
  })});
  await req("/api/translations",{method:"POST",body:JSON.stringify({lesson_id:Number(id.value),language:lang.value,title:t,description,content:""})});
  clearEditor();await load();msg("Saved successfully.");popup("Lesson updated");
 }catch(e){popup(e.message,true);msg(e.message,true)}
}
function clearEditor(){id.value="";title.value=desc.value="";photo.value="";photoPreview.innerHTML="";access.value="1";eh.textContent="Edit Lesson"}
lang.addEventListener("change",()=>{let l=lessons.find(x=>String(x.id)===id.value);if(l)edit(l)});
photo.addEventListener("change",()=>{
 let f=photo.files[0];if(!f)return;photoPreview.innerHTML="";
 let im=document.createElement("img");im.src=URL.createObjectURL(f);photoPreview.append(im);
});
</script>
</body>
</html>
