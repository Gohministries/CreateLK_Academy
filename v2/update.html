<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy Admin V2</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16}
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font:15px Arial;color:#172033}
header{background:var(--n);color:white;padding:16px;display:flex;justify-content:space-between}
main{max-width:950px;margin:auto;padding:12px}.card{background:white;padding:15px;margin-bottom:12px;border-radius:12px}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4e1;border-radius:7px;font:inherit}
textarea{min-height:75px}button{padding:10px 12px;margin:3px;border:0;border-radius:7px;background:var(--b);color:white;font-weight:bold}
.secondary{background:#e7edf7;color:var(--n)}.gold{background:var(--g);color:#172033}
.row,.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.item{padding:10px;border:1px solid #ddd;border-radius:8px;margin:7px 0}
.hidden{display:none!important}#editor{min-height:180px;padding:12px;border:1px solid #ccd4e1;border-radius:8px}
#editor img{max-width:100%}#msg{padding:10px}small{color:#64748b}
</style></head>
<body>
<header><b>CreateLK Academy Admin V2</b><button id="out" class="secondary hidden" onclick="logout()">Logout</button></header>
<main>
<div id="msg"></div>
<section id="login" class="card"><h3>Admin Login</h3><div id="google"></div></section>
<section id="app" class="hidden">
<div class="tabs"><button onclick="tab('dash')">Dashboard</button><button onclick="tab('subs')">Subjects</button><button onclick="tab('list')">Lessons</button><button onclick="tab('edit')">Editor</button></div>
<div id="dash" class="card"><h3>Dashboard</h3><div id="stats"></div><button onclick="load()">Refresh</button></div>
<div id="subs" class="card hidden"><h3>Subjects</h3><input id="sid" type="hidden"><label>Name</label><input id="sn"><label>Slug</label><input id="slug"><label>Description</label><textarea id="sd"></textarea><button onclick="saveSubject()">Save Subject</button><button class="secondary" onclick="clearSubject()">New</button><div id="subjectList"></div></div>
<div id="list" class="card hidden"><h3>Lessons</h3><button onclick="fresh()">+ New Lesson</button><div id="lessonList"></div></div>
<div id="edit" class="card hidden"><h3>Lesson Editor</h3><input id="lid" type="hidden">
<div class="row"><div><label>Subject</label><select id="subject"></select></div><div><label>Order</label><input id="ord" type="number" value="1"></div></div>
<div class="row"><div><label>Access</label><select id="access"><option>FREE</option><option>PREMIUM</option></select></div><div><label>Status</label><select id="status"><option>PUBLISHED</option><option>DRAFT</option><option>COMING_SOON</option></select></div></div>
<label>Language</label><select id="lang" onchange="loadTranslation()"><option value="en">English</option><option value="ta">Tamil</option><option value="si">Sinhala</option></select>
<label>Title</label><input id="title"><label>Subtitle</label><input id="subtitle"><label>Description</label><textarea id="desc"></textarea><label>Introduction</label><textarea id="intro"></textarea>
<label>Lesson Content</label><div class="actions">
<button class="secondary" onclick="fmt('bold')">B</button><button class="secondary" onclick="fmt('italic')">I</button><button class="secondary" onclick="fmt('underline')">U</button><button class="secondary" onclick="fmt('justifyLeft')">Left</button><button class="secondary" onclick="fmt('justifyCenter')">Center</button><button class="secondary" onclick="fmt('justifyRight')">Right</button><button class="secondary" onclick="fmt('justifyFull')">Justify</button><button class="secondary" onclick="fmt('insertUnorderedList')">List</button></div>
<div id="editor" contenteditable="true"></div>
<label>Photo</label><input id="photo" type="file" accept="image/*"><button class="gold" onclick="upload()">Upload & Insert</button>
<div class="actions"><button onclick="saveLesson()">Save Lesson</button><button class="secondary" onclick="fresh()">New</button></div>
<hr><h3>Subtitles</h3><input id="subid" type="hidden">
<div class="row"><div><label>Language</label><select id="slang"><option value="en">English</option><option value="ta">Tamil</option><option value="si">Sinhala</option></select></div><div><label>Time (seconds)</label><input id="stime" type="number" value="0"></div></div>
<label>Text</label><textarea id="stext"></textarea><button onclick="saveSubtitle()">Save Subtitle</button><button class="secondary" onclick="clearSub()">New</button><div id="subtitleList"></div>
</div></section></main>
<script>
const API="https://update-v2.createlk.workers.dev",ADMIN="gateofheavensl1@gmail.com",CID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem("createlk_admin_token")||"",subjects=[],lessons=[],subtitles=[],translations={},current=null;
function msg(s){$("msg").textContent=s}
function tab(id){["dash","subs","list","edit"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
async function api(path,opt={}){let h=new Headers(opt.headers||{});if(token)h.set("Authorization","Bearer "+token);if(opt.body&&!(opt.body instanceof FormData))h.set("Content-Type","application/json");let r=await fetch(API+path,{...opt,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||"API error "+r.status);return d}
function fail(e){msg("Error: "+e.message)}
function initGoogle(){if(!window.google?.accounts?.id)return setTimeout(initGoogle,300);google.accounts.id.initialize({client_id:CID,callback:login});google.accounts.id.renderButton($("google"),{theme:"outline",size:"large"})}
async function login(r){try{token=r.credential;let p=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));if(p.email?.toLowerCase()!==ADMIN||!p.email_verified)throw Error("Unauthorized Google account");sessionStorage.setItem("createlk_admin_token",token);await load();$("login").classList.add("hidden");$("app").classList.remove("hidden");$("out").classList.remove("hidden");msg("Signed in")}catch(e){token="";sessionStorage.removeItem("createlk_admin_token");fail(e)}}
function logout(){sessionStorage.removeItem("createlk_admin_token");location.reload()}
async function load(){let d=await api("/api/bootstrap");subjects=d.subjects||d.data?.subjects||[];lessons=d.lessons||d.data?.lessons||[];render();$("stats").textContent=subjects.length+" subjects · "+lessons.length+" lessons"}
function render(){ $("subjectList").innerHTML=subjects.map(s=>`<div class="item"><b>${esc(s.title||s.name)}</b><br>${esc(s.slug||"")}<button onclick="editSubject('${esc(s.id)}')">Edit</button></div>`).join("");$("subject").innerHTML=subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.title||s.name)}</option>`).join("");$("lessonList").innerHTML=lessons.map(l=>`<div class="item"><b>${esc(l.title||l.main_title||"Lesson")}</b><br><small>${esc(l.access_type||"")} · ${esc(l.status||"")}</small><button onclick="editLesson('${esc(l.id)}')">Edit</button></div>`).join("")}
function clearSubject(){$("sid").value=$("sn").value=$("slug").value=$("sd").value=""}
function editSubject(id){let s=subjects.find(x=>String(x.id)===String(id));if(!s)return;$("sid").value=id;$("sn").value=s.name||s.title||"";$("slug").value=s.slug||"";$("sd").value=s.description||"";tab("subs")}
async function saveSubject(){try{let id=$("sid").value,n=$("sn").value.trim();if(!n)throw Error("Enter subject name");await api(id?"/api/subjects/"+id:"/api/subjects",{method:id?"PUT":"POST",body:JSON.stringify({name:n,title:n,slug:$("slug").value||n.toLowerCase().replace(/[^a-z0-9]+/g,"-"),description:$("sd").value})});await load();clearSubject();msg("Subject saved")}catch(e){fail(e)}}
function fields(){return{main_title:$("title").value,sub_title:$("subtitle").value,description:$("desc").value,introduction:$("intro").value,content:$("editor").innerHTML}}
function setFields(t={}){$("title").value=t.main_title||t.title||"";$("subtitle").value=t.sub_title||t.subtitle||"";$("desc").value=t.description||"";$("intro").value=t.introduction||"";$("editor").innerHTML=t.content||t.explanation||""}
function fresh(){current=null;translations={};$("lid").value="";$("ord").value=lessons.length+1;$("access").value="FREE";$("status").value="DRAFT";$("lang").value="en";setFields();$("subtitleList").innerHTML="";clearSub();tab("edit")}
async function editLesson(id){current=lessons.find(x=>String(x.id)===String(id));if(!current)return;translations={};$("lid").value=id;$("subject").value=current.subject_id??current.subjectId??"";$("ord").value=current.sort_order??current.lesson_order??1;$("access").value=current.access_type||(current.is_free?"FREE":"PREMIUM");$("status").value=current.status||"PUBLISHED";$("lang").value="en";setFields({main_title:current.main_title||current.title,sub_title:current.sub_title||current.subtitle,...current});tab("edit");await loadTranslation();await loadSubtitles()}
async function loadTranslation(){let id=$("lid").value,lang=$("lang").value;if(!id)return setFields(translations[lang]||{});try{let d=await api("/api/lessons/"+id+"/translations"),a=d.translations||d.data||[],t=Array.isArray(a)?a.find(x=>(x.language||x.lang)===lang):a[lang];if(t)translations[lang]=t;setFields(translations[lang]||(lang==="en"?current||{}:{}))}catch(e){msg("Translation load failed: "+e.message)}}
async function saveLesson(){try{let id=$("lid").value,lang=$("lang").value,f=fields();translations[lang]=f;let b={subject_id:$("subject").value,sort_order:+$("ord").value||1,access_type:$("access").value,is_free:$("access").value==="FREE",status:$("status").value,title:f.main_title,main_title:f.main_title,sub_title:f.sub_title,description:f.description,introduction:f.introduction,content:f.content,explanation:f.content};if(!b.subject_id||!b.title.trim())throw Error("Choose subject and enter title");if(!id){let d=await api("/api/lessons",{method:"POST",body:JSON.stringify(b)});id=d.id||d.lesson?.id||d.data?.id;if(!id)throw Error("Worker did not return lesson ID");$("lid").value=id}else await api("/api/lessons/"+id,{method:"PUT",body:JSON.stringify(b)});await api("/api/lessons/"+id+"/translations/"+lang,{method:"PUT",body:JSON.stringify({language:lang,...f})});await load();msg("Lesson saved")}catch(e){fail(e)}}
function fmt(c){$("editor").focus();document.execCommand(c,false,null)}
async function upload(){try{let f=$("photo").files[0],id=$("lid").value;if(!f||!id)throw Error("Save lesson and choose photo first");let d=await api("/api/lesson-images",{method:"POST",body:(()=>{let x=new FormData();x.append("file",f);x.append("lesson_id",id);return x})()}),url=d.url||d.image_url||d.data?.url;if(!url)throw Error("Worker returned no image URL");$("editor").focus();document.execCommand("insertHTML",false,`<p><img src="${esc(url)}" alt=""></p>`);$("photo").value="";msg("Photo inserted. Save lesson")}catch(e){fail(e)}}
async function loadSubtitles(){try{let d=await api("/api/lesson-subtitles/lesson/"+$("lid").value);subtitles=d.subtitles||d.data||[];renderSubtitles()}catch(e){msg("Subtitle load failed: "+e.message)}}
function renderSubtitles(){$("subtitleList").innerHTML=subtitles.map(s=>`<div class="item">${esc((s.language||s.lang||"en").toUpperCase())} · ${esc(s.time_seconds??s.start_time??0)}s<br>${esc(s.text||s.subtitle||"")}<button onclick="editSub('${esc(s.id)}')">Edit</button><button onclick="delSub('${esc(s.id)}')">Delete</button></div>`).join("")}
function clearSub(){$("subid").value="";$("slang").value="en";$("stime").value=0;$("stext").value=""}
function editSub(id){let s=subtitles.find(x=>String(x.id)===String(id));if(!s)return;$("subid").value=id;$("slang").value=s.language||s.lang||"en";$("stime").value=s.time_seconds??s.start_time??0;$("stext").value=s.text||s.subtitle||""}
async function saveSubtitle(){try{let id=$("subid").value;if(!$("lid").value||!$("stext").value.trim())throw Error("Save lesson and enter subtitle");await api(id?"/api/lesson-subtitles/"+id:"/api/lesson-subtitles",{method:id?"PUT":"POST",body:JSON.stringify({lesson_id:$("lid").value,language:$("slang").value,time_seconds:+$("stime").value||0,text:$("stext").value})});clearSub();await loadSubtitles();msg("Subtitle saved")}catch(e){fail(e)}}
async function delSub(id){if(!confirm("Delete subtitle?"))return;try{await api("/api/lesson-subtitles/"+id,{method:"DELETE"});await loadSubtitles()}catch(e){fail(e)}}
initGoogle();
if(token){try{let p=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));if(p.email?.toLowerCase()===ADMIN&&p.email_verified){load().then(()=>{$("login").classList.add("hidden");$("app").classList.remove("hidden");$("out").classList.remove("hidden")}).catch(e=>{token="";sessionStorage.removeItem("createlk_admin_token");fail(e)})}else logout()}catch(e){logout()}}
</script></body></html>
