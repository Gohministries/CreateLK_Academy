
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK English V2 Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16}
*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f3f6fb;color:#172033}
header{background:var(--n);color:white;padding:16px;display:flex;justify-content:space-between;flex-wrap:wrap}
main{max-width:950px;margin:auto;padding:14px}.card{background:white;padding:16px;border-radius:10px;margin-bottom:14px}
h3{color:var(--n);margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4e0;border-radius:7px;font:inherit}
label{display:block;margin:10px 0 5px;font-weight:bold;font-size:13px}
textarea{min-height:90px}button{padding:10px 13px;margin:4px 2px;border:0;border-radius:7px;background:var(--b);color:white;cursor:pointer;font-weight:bold}
.secondary{background:#e8edf6;color:var(--n)}.danger{background:#dc2626}.gold{background:var(--g);color:#172033}
.item{padding:12px;border:1px solid #e1e6ef;border-radius:8px;margin:8px 0}
.small{font-size:12px;color:#667085}.hidden{display:none!important}
#toast{display:none;position:fixed;top:12px;left:5%;width:90%;padding:13px;border-radius:8px;background:#166534;color:white;text-align:center;z-index:9}
</style>
</head>
<body>
<div id="toast"></div>
<header><b>CreateLK English V2 Admin</b><button class="gold" onclick="loadAll()">Refresh</button></header>
<main>
<div id="login" class="card">
<h3>Administrator Login</h3><div id="google"></div>
<p class="small">Authorized account required.</p>
</div>

<div id="app" class="hidden">
<div class="card">
<button onclick="tab('subjects')">Subjects</button>
<button onclick="tab('lessons')">Lessons</button>
<button onclick="tab('translations')">Translations</button>
<button onclick="tab('notes')">Notes</button>
<button onclick="tab('images')">Images</button>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<section id="subjects" class="card">
<h3>Manage Subjects</h3><input id="sid" type="hidden">
<div class="grid">
<div><label>Name</label><input id="sn"></div>
<div><label>Slug</label><input id="slug"></div>
<div><label>Icon</label><input id="icon"></div>
<div><label>Order</label><input id="so" type="number" value="1"></div>
<div><label>Status</label><select id="sa"><option value="1">Active</option><option value="0">Inactive</option></select></div>
</div>
<label>Description</label><textarea id="sd"></textarea>
<label>Image URL</label><input id="si">
<button onclick="saveSubject()">Save Subject</button><button class="secondary" onclick="clearSubject()">Clear</button>
<h3>Subjects</h3><div id="subjectList"></div>
</section>

<section id="lessons" class="card hidden">
<h3>Manage Lessons</h3><input id="lid" type="hidden">
<div class="grid">
<div><label>Subject</label><select id="ls"></select></div>
<div><label>Lesson Title</label><input id="lt"></div>
<div><label>Order</label><input id="lo" type="number" value="1"></div>
<div><label>Access</label><select id="lf"><option value="1">Free</option><option value="0">Premium</option></select></div>
<div><label>Status</label><select id="status"><option>PUBLISHED</option><option>DRAFT</option><option>COMING_SOON</option></select></div>
</div>
<label>Description</label><textarea id="ld"></textarea>
<label>Content</label><textarea id="lc" style="min-height:140px"></textarea>
<label>Image URL</label><input id="li">
<button onclick="saveLesson()">Save Lesson</button><button class="secondary" onclick="clearLesson()">Clear</button>
<h3>Lessons</h3><select id="filter" onchange="renderLessons()"></select>
<div id="lessonList"></div>
</section>

<section id="translations" class="card hidden">
<h3>Translations</h3><label>Lesson</label><select id="tl"></select>
<label>Language</label><select id="lang"><option value="ta">Tamil</option><option value="si">Sinhala</option><option value="en">English</option></select>
<label>Title</label><input id="tt">
<label>Content</label><textarea id="tc"></textarea>
<button onclick="saveTranslation()">Save Translation</button>
</section>

<section id="notes" class="card hidden">
<h3>Lesson Notes</h3><label>Lesson</label><select id="nl" onchange="loadNotes()"></select>
<label>Notes</label><textarea id="nc" style="min-height:180px"></textarea>
<button onclick="saveNotes()">Save Notes</button>
</section>

<section id="images" class="card hidden">
<h3>Upload Image</h3><input id="file" type="file" accept="image/*">
<label>Lesson (optional)</label><select id="il"></select>
<button onclick="upload()">Upload</button><div id="result"></div>
</section>
</div>
</main>
<script>
const API="https://update-v2.createlk.workers.dev";
const ADMIN="gateofheavensl1@gmail.com";
let token="",subjects=[],lessons=[];

function msg(s,err=false){let e=document.getElementById("toast");e.textContent=s;e.style.background=err?"#b42318":"#166534";e.style.display="block";setTimeout(()=>e.style.display="none",3000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,opt={}){
 opt.headers={Authorization:"Bearer "+token,...opt.headers};
 if(opt.body&&!(opt.body instanceof FormData)){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}
 let r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||d.message||"Request failed");return d;
}
function tab(id){document.querySelectorAll("#app section").forEach(e=>e.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function logout(){token="";document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function initGoogle(){
 if(!window.google?.accounts?.id)return setTimeout(initGoogle,300);
 google.accounts.id.initialize({client_id:"582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com",callback:async r=>{
 try{
  let p=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
  if(p.email.toLowerCase()!==ADMIN)throw Error("Unauthorized Google account");
  token=r.credential;await loadAll();
  document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");msg("Login successful");
 }catch(e){msg(e.message,true)}
 }});
 google.accounts.id.renderButton(document.getElementById("google"),{theme:"outline",size:"large"});
}
window.addEventListener("load",initGoogle);
async function loadAll(){
 try{
 let d=await api("/api/bootstrap");subjects=d.subjects||[];lessons=d.lessons||[];
 renderSubjects();options();renderLessons();
 }catch(e){msg(e.message,true);throw e}
}
function options(){
 let s=subjects.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 ["ls","filter"].forEach(id=>document.getElementById(id).innerHTML=(id==="filter"?'<option value="">All Subjects</option>':"")+s);
 let l=lessons.map(x=>`<option value="${esc(x.id)}">${esc(x.title||x.name||x.id)}</option>`).join("");
 ["tl","nl","il"].forEach(id=>document.getElementById(id).innerHTML=(id==="il"?'<option value="">No lesson selected</option>':"")+l);
}
function renderSubjects(){
 document.getElementById("subjectList").innerHTML=subjects.map(s=>`<div class="item"><b>${esc(s.icon)} ${esc(s.name)}</b><p>${esc(s.description)}</p><button onclick="editSubject('${esc(s.id)}')">Edit</button><button class="danger" onclick="delSubject('${esc(s.id)}')">Delete</button></div>`).join("")||"No subjects";
}
function clearSubject(){["sid","sn","slug","icon","sd","si"].forEach(id=>document.getElementById(id).value="");so.value=subjects.length+1;sa.value="1"}
function editSubject(id){
 let s=subjects.find(x=>String(x.id)===String(id));if(!s)return;
 sid.value=s.id;sn.value=s.name||"";slug.value=s.slug||"";icon.value=s.icon||"";sd.value=s.description||"";si.value=s.image_url||"";so.value=s.display_order??s.sort_order??1;sa.value=s.is_active??1;tab("subjects");
}
async function saveSubject(){
 try{
 let id=sid.value,b={name:sn.value,slug:slug.value,icon:icon.value,description:sd.value,image_url:si.value,display_order:+so.value||1,is_active:+sa.value};
 if(!b.name.trim())return msg("Enter subject name",true);
 await api(id?"/api/subjects/"+id:"/api/subjects",{method:id?"PUT":"POST",body:b});
 msg("Subject saved successfully");clearSubject();await loadAll();
 }catch(e){msg(e.message,true)}
}
async function delSubject(id){if(!confirm("Delete this subject?"))return;try{await api("/api/subjects/"+id,{method:"DELETE"});await loadAll();msg("Subject deleted")}catch(e){msg(e.message,true)}}
function renderLessons(){
 let f=document.getElementById("filter").value;
 document.getElementById("lessonList").innerHTML=lessons.filter(l=>!f||String(l.subject_id)===f).sort((a,b)=>(a.display_order||a.sort_order||0)-(b.display_order||b.sort_order||0)).map(l=>`<div class="item"><b>${esc(l.title||l.name)}</b><p>${esc(l.status||"PUBLISHED")} · ${Number(l.is_free??l.free??1)?"Free":"Premium"} · Order ${esc(l.display_order??l.sort_order??0)}</p><button onclick="editLesson('${esc(l.id)}')">Edit</button><button onclick="move('${esc(l.id)}',-1)">↑</button><button onclick="move('${esc(l.id)}',1)">↓</button><button class="danger" onclick="delLesson('${esc(l.id)}')">Delete</button></div>`).join("")||"No lessons";
}
function clearLesson(){["lid","lt","ld","lc","li"].forEach(id=>document.getElementById(id).value="");lo.value=lessons.length+1;lf.value="1";status.value="PUBLISHED"}
function editLesson(id){
 let l=lessons.find(x=>String(x.id)===String(id));if(!l)return;
 lid.value=l.id;ls.value=l.subject_id;lt.value=l.title||l.name||"";lo.value=l.display_order??l.sort_order??1;lf.value=l.is_free??l.free??1;status.value=l.status||"PUBLISHED";ld.value=l.description||"";lc.value=l.content||"";li.value=l.image_url||"";tab("lessons");
}
async function saveLesson(){
 try{
 let id=lid.value,b={subject_id:ls.value,title:lt.value,name:lt.value,display_order:+lo.value||1,sort_order:+lo.value||1,is_free:+lf.value,status:status.value,description:ld.value,content:lc.value,image_url:li.value};
 if(!b.subject_id||!b.title.trim())return msg("Choose subject and enter title",true);
 await api(id?"/api/lessons/"+id:"/api/lessons",{method:id?"PUT":"POST",body:b});msg("Lesson saved");clearLesson();await loadAll();
 }catch(e){msg(e.message,true)}
}
async function move(id,n){let l=lessons.find(x=>String(x.id)===String(id));try{let o=+(l.display_order??l.sort_order??1)+n;await api("/api/lessons/"+id,{method:"PUT",body:{display_order:o,sort_order:o}});await loadAll();msg("Order updated")}catch(e){msg(e.message,true)}}
async function delLesson(id){if(!confirm("Delete this lesson?"))return;try{await api("/api/lessons/"+id,{method:"DELETE"});await loadAll();msg("Lesson deleted")}catch(e){msg(e.message,true)}}
async function saveTranslation(){try{await api("/api/translations",{method:"POST",body:{lesson_id:tl.value,language:lang.value,lang:lang.value,title:tt.value,content:tc.value}});msg("Translation saved")}catch(e){msg(e.message,true)}}
async function loadNotes(){try{let d=await api("/api/lessons/"+nl.value+"/notes");nc.value=d.content||d.notes||""}catch(e){msg(e.message,true)}}
async function saveNotes(){try{await api("/api/lessons/"+nl.value+"/notes",{method:"PUT",body:{content:nc.value,notes:nc.value}});msg("Notes saved")}catch(e){msg(e.message,true)}}
async function upload(){
 let f=file.files[0];if(!f)return msg("Choose an image",true);if(f.size>5*1024*1024)return msg("Maximum image size is 5 MB",true);
 let d=new FormData();d.append("file",f);
 try{
 let r=await api("/api/lesson-images",{method:"POST",body:d}),url=r.url||r.image_url||(r.key?API+"/images/"+r.key:"");
 if(!url)throw Error("No image URL returned");
 result.innerHTML=`<input id="imageUrl" value="${esc(url)}" readonly><button onclick="navigator.clipboard.writeText(imageUrl.value).then(()=>msg('URL copied'))">Copy URL</button>`;
 if(il.value){let l=lessons.find(x=>String(x.id)===il.value);if(l){li.value=url;lid.value=l.id;}}
 msg("Image uploaded");
 }catch(e){msg(e.message,true)}
}
</script>
</body>
</html>
