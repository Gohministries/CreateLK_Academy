
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Academy Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16}
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#18243a;font:15px Arial}
header{background:var(--n);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
button{border:0;border-radius:8px;padding:10px 13px;background:var(--b);color:white;font-weight:bold;cursor:pointer}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8dfeb;border-radius:8px;background:white}
textarea{min-height:120px}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:bold}
main{max-width:950px;margin:18px auto;padding:0 12px}.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:#69778e}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}
.menu{position:relative}.menuBox{display:none;position:absolute;right:0;top:42px;background:white;padding:8px;border-radius:9px;box-shadow:0 5px 20px #0002;min-width:140px;z-index:5}
.menuBox button{width:100%;margin:3px 0;background:#eaf0fb;color:var(--n)}
.menuBox.open{display:block}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
nav button{background:#e5ebf6;color:var(--n)}nav button.active{background:var(--n);color:white}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#f4f7fc;padding:12px;border-radius:9px}.stat b{display:block;font-size:23px;color:var(--n)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e4e9f1}
.tablewrap{overflow:auto}.small{padding:7px;font-size:12px;margin:2px}.gray{background:#e5ebf6;color:var(--n)}.red{background:#b42318}.gold{background:var(--g);color:#17243b}
#app,#signOut{display:none}#login{max-width:420px;margin:45px auto;text-align:center}
#popup{display:none;position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:20;background:#176c42;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 5px 25px #0003;max-width:90%;text-align:center}
#popup.error{background:#b42318}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}header{gap:8px}.card{padding:13px}}
</style>
</head>
<body>
<header>
  <b>CreateLK Academy Admin</b>
  <div class="menu">
    <button class="gold" onclick="document.getElementById('menu').classList.toggle('open')">☰ Menu</button>
    <div id="menu" class="menuBox">
      <button onclick="refreshData()">Refresh</button>
      <button id="signOut" onclick="logout()">Sign Out</button>
    </div>
  </div>
</header>

<div id="popup"></div>

<main>
<section id="login" class="card">
  <h2>Admin Sign In</h2>
  <p class="muted">Sign in with your administrator Google account.</p>
  <div id="googleButton"></div>
  <label><input id="stay" type="checkbox" checked style="width:auto"> Stay logged in</label>
  <p id="loginError" class="muted"></p>
</section>

<section id="app">
  <div class="card">
    <div class="grid">
      <div class="stat"><b id="ns">0</b><span class="muted">Subjects</span></div>
      <div class="stat"><b id="nl">0</b><span class="muted">Lessons</span></div>
      <div class="stat"><b id="nf">0</b><span class="muted">Free</span></div>
      <div class="stat"><b id="np">0</b><span class="muted">Published</span></div>
    </div>
  </div>

  <nav>
    <button class="active" onclick="panel('subjects',this)">Subjects</button>
    <button onclick="panel('lessons',this)">Lessons</button>
    <button onclick="panel('translations',this)">Languages</button>
    <button onclick="panel('notes',this)">Content</button>
    <button onclick="panel('subtitles',this)">Subtitles</button>
  </nav>

  <section id="subjects" class="panel active">
    <div class="card">
      <h2 id="stitle">Add Subject</h2>
      <input id="sid" type="hidden">
      <label>Subject name</label><input id="sname" placeholder="Subject name">
      <label>Slug</label><input id="sslug" placeholder="subject-name">
      <label>Description</label><textarea id="sdesc"></textarea>
      <label>Display order</label><input id="sorder" type="number" value="1">
      <div class="row"><button onclick="saveSubject()">Save Subject</button><button class="gray" onclick="resetSubject()">Clear</button></div>
    </div>
    <div class="card"><h2>Subjects</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="srows"></tbody></table></div></div>
  </section>

  <section id="lessons" class="panel">
    <div class="card">
      <h2 id="ltitle">Add Lesson</h2><input id="lid" type="hidden">
      <label>Subject</label><select id="lsubject"></select>
      <label>Lesson title</label><input id="lname">
      <label>Description</label><textarea id="ldesc"></textarea>
      <label>Display order</label><input id="lorder" type="number" value="1">
      <label>Status</label><select id="lstatus"><option>PUBLISHED</option><option>DRAFT</option><option>COMING_SOON</option></select>
      <label><input id="lfree" type="checkbox" style="width:auto"> Free lesson</label>
      <div class="row"><button onclick="saveLesson()">Save Lesson</button><button class="gray" onclick="resetLesson()">Clear</button></div>
    </div>
    <div class="card"><h2>Lessons</h2><div class="tablewrap"><table><thead><tr><th>Lesson</th><th>Status</th><th>Actions</th></tr></thead><tbody id="lrows"></tbody></table></div></div>
  </section>

  <section id="translations" class="panel">
    <div class="card">
      <h2>Lesson Languages</h2>
      <label>Lesson</label><select id="tlesson" onchange="loadTranslation()"></select>
      <label>Language</label><select id="tlang" onchange="loadTranslation()"><option value="en">English</option><option value="ta">Tamil</option><option value="si">Sinhala</option></select>
      <label>Translated title</label><input id="ttitle">
      <label>Translated description</label><textarea id="tdesc"></textarea>
      <label>Translated content</label><textarea id="tcontent" style="min-height:220px"></textarea>
      <button onclick="saveTranslation()">Save Translation</button>
    </div>
  </section>

  <section id="notes" class="panel">
    <div class="card">
      <h2>Lesson Content</h2>
      <label>Lesson</label><select id="nlesson" onchange="loadNotes()"></select>
      <label>Content / HTML</label><textarea id="ncontent" style="min-height:240px"></textarea>
      <div class="row"><button onclick="saveNotes()">Save Content</button><button class="gray" onclick="document.getElementById('photo').click()">Upload Photo</button><input id="photo" type="file" accept="image/*" hidden onchange="uploadPhoto(event)"></div>
    </div>
  </section>

  <section id="subtitles" class="panel">
    <div class="card">
      <h2>Subtitles</h2>
      <label>Lesson</label><select id="ulesson" onchange="loadSubtitles()"></select>
      <input id="uid" type="hidden">
      <label>Language</label><select id="ulang"><option value="en">English</option><option value="ta">Tamil</option><option value="si">Sinhala</option></select>
      <label>Subtitle title</label><input id="utitle">
      <label>Subtitle content</label><textarea id="ucontent"></textarea>
      <label>Display order</label><input id="uorder" type="number" value="1">
      <div class="row"><button onclick="saveSubtitle()">Save Subtitle</button><button class="gray" onclick="resetSubtitle()">Clear</button></div>
      <div class="tablewrap" style="margin-top:14px"><table><tbody id="urows"></tbody></table></div>
    </div>
  </section>
</section>
</main>

<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const ADMIN="gateofheavensl1@gmail.com";
let token="",subjects=[],lessons=[],subtitles=[],popupTimer;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function notice(message,error=false){
  clearTimeout(popupTimer);
  $("popup").textContent=message;
  $("popup").className=error?"error":"";
  $("popup").style.display="block";
  popupTimer=setTimeout(()=>$("popup").style.display="none",2800);
}
function panel(id,btn){
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  $(id).classList.add("active");btn.classList.add("active");
}
async function api(path,options={}){
  const headers=new Headers(options.headers||{});
  headers.set("Authorization","Bearer "+token);
  if(options.body&&!(options.body instanceof FormData))headers.set("Content-Type","application/json");
  const r=await fetch(API+path,{...options,headers});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401)logout();throw Error(d.error||"Request failed");}
  return d;
}
function credential(r){
  try{
    const p=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(p.email.toLowerCase()!==ADMIN||!p.email_verified||p.exp*1000<Date.now())throw Error("Unauthorized Google account");
    token=r.credential;
    const store=$("stay").checked?localStorage:sessionStorage;
    const other=$("stay").checked?sessionStorage:localStorage;
    store.setItem("createlk_admin_token",token);other.removeItem("createlk_admin_token");
    openAdmin();
  }catch(e){$("loginError").textContent=e.message;}
}
function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,500);return;}
  google.accounts.id.initialize({client_id:CLIENT,callback:credential});
  google.accounts.id.renderButton($("googleButton"),{theme:"outline",size:"large",text:"signin_with",width:260});
}
function openAdmin(){
  $("login").style.display="none";$("app").style.display="block";$("signOut").style.display="block";
  refreshData().catch(e=>notice(e.message,true));
}
function logout(){
  token="";localStorage.removeItem("createlk_admin_token");sessionStorage.removeItem("createlk_admin_token");
  $("app").style.display="none";$("login").style.display="block";$("signOut").style.display="none";
  $("menu").classList.remove("open");
}
async function refreshData(){
  const d=await api("/api/bootstrap");
  subjects=d.subjects||[];lessons=d.lessons||[];
  render();
}
function render(){
  $("ns").textContent=subjects.length;$("nl").textContent=lessons.length;
  $("nf").textContent=lessons.filter(x=>+x.is_free===1).length;
  $("np").textContent=lessons.filter(x=>(x.status||"PUBLISHED")==="PUBLISHED").length;
  $("srows").innerHTML=subjects.map(s=>`<tr><td>${esc(s.title||s.name)}</td><td>${esc(s.slug)}</td><td><button class="small" onclick="editSubject(${s.id})">Edit</button><button class="small red" onclick="deleteSubject(${s.id})">Delete</button></td></tr>`).join("")||"<tr><td>No subjects</td></tr>";
  $("lsubject").innerHTML='<option value="">Choose subject</option>'+subjects.map(s=>`<option value="${s.id}">${esc(s.title||s.name)}</option>`).join("");
  const opts='<option value="">Choose lesson</option>'+lessons.map(l=>`<option value="${l.id}">${esc(l.title)} (#${l.id})</option>`).join("");
  ["tlesson","nlesson","ulesson"].forEach(id=>$(id).innerHTML=opts);
  $("lrows").innerHTML=lessons.map(l=>`<tr><td>${esc(l.title)}<br><small>${esc(subjects.find(s=>+s.id===+l.subject_id)?.title||"Unassigned")}</small></td><td>${esc(l.status||"PUBLISHED")}</td><td><button class="small" onclick="editLesson(${l.id})">Edit</button><button class="small" onclick="openTranslation(${l.id})">Translate</button><button class="small red" onclick="deleteLesson(${l.id})">Delete</button></td></tr>`).join("")||"<tr><td>No lessons</td></tr>";
}
$("sname").addEventListener("input",()=>{if(!$("sid").value)$("sslug").value=slug($("sname").value)});

function resetSubject(){["sid","sname","sslug","sdesc"].forEach(id=>$(id).value="");$("sorder").value=subjects.length+1;$("stitle").textContent="Add Subject";}
function editSubject(id){
  const s=subjects.find(x=>+x.id===id);if(!s)return;
  $("sid").value=id;$("sname").value=s.title||s.name;$("sslug").value=s.slug||slug(s.title||s.name);$("sdesc").value=s.description||"";$("sorder").value=s.sort_order||0;$("stitle").textContent="Edit Subject";
  panel("subjects",document.querySelector('nav button'));
}
async function saveSubject(){
  try{
    const id=$("sid").value,name=$("sname").value.trim();if(!name)return notice("Enter subject name",true);
    await api(id?"/api/subjects/"+id:"/api/subjects",{method:id?"PUT":"POST",body:JSON.stringify({title:name,name,slug:$("sslug").value||slug(name),description:$("sdesc").value,sort_order:+$("sorder").value||0})});
    resetSubject();await refreshData();notice("Subject saved successfully");
  }catch(e){notice(e.message,true);}
}
async function deleteSubject(id){
  if(!confirm("Delete this subject?"))return;
  try{await api("/api/subjects/"+id,{method:"DELETE"});await refreshData();notice("Subject deleted");}catch(e){notice(e.message,true);}
}
function resetLesson(){["lid","lname","ldesc"].forEach(id=>$(id).value="");$("lorder").value=lessons.length+1;$("lfree").checked=false;$("lstatus").value="PUBLISHED";$("ltitle").textContent="Add Lesson";}
function editLesson(id){
  const l=lessons.find(x=>+x.id===id);if(!l)return;
  $("lid").value=id;$("lsubject").value=l.subject_id||"";$("lname").value=l.title;$("ldesc").value=l.description||"";$("lorder").value=l.sort_order||0;$("lstatus").value=l.status||"PUBLISHED";$("lfree").checked=+l.is_free===1;$("ltitle").textContent="Edit Lesson";
  panel("lessons",document.querySelectorAll("nav button")[1]);
}
async function saveLesson(){
  try{
    const id=$("lid").value,title=$("lname").value.trim();if(!title)return notice("Enter lesson title",true);
    await api(id?"/api/lessons/"+id:"/api/lessons",{method:id?"PUT":"POST",body:JSON.stringify({title,subject_id:$("lsubject").value||null,description:$("ldesc").value,sort_order:+$("lorder").value||0,is_free:$("lfree").checked?1:0,status:$("lstatus").value})});
    resetLesson();await refreshData();notice("Lesson saved successfully");
  }catch(e){notice(e.message,true);}
}
async function deleteLesson(id){
  if(!confirm("Delete this lesson and its content?"))return;
  try{await api("/api/lessons/"+id,{method:"DELETE"});await refreshData();notice("Lesson deleted");}catch(e){notice(e.message,true);}
}
function openTranslation(id){$("tlesson").value=id;panel("translations",document.querySelectorAll("nav button")[2]);loadTranslation();}
async function loadTranslation(){
  $("ttitle").value=$("tdesc").value=$("tcontent").value="";
  if(!$("tlesson").value)return;
  try{const d=await api("/api/translations/lesson/"+$("tlesson").value);const t=(d.translations||[]).find(x=>x.language===$("tlang").value);if(t){$("ttitle").value=t.title||"";$("tdesc").value=t.description||"";$("tcontent").value=t.content||"";}}catch(e){notice(e.message,true);}
}
async function saveTranslation(){
  try{if(!$("tlesson").value)return notice("Choose a lesson",true);
    await api("/api/translations",{method:"POST",body:JSON.stringify({lesson_id:+$("tlesson").value,language:$("tlang").value,title:$("ttitle").value,description:$("tdesc").value,content:$("tcontent").value})});
    notice("Translation saved successfully");
  }catch(e){notice(e.message,true);}
}
async function loadNotes(){
  $("ncontent").value="";if(!$("nlesson").value)return;
  try{const d=await api("/api/notes/"+$("nlesson").value);$("ncontent").value=d.content??d.note?.content??"";}catch(e){notice(e.message,true);}
}
async function saveNotes(){
  try{if(!$("nlesson").value)return notice("Choose a lesson",true);
    await api("/api/notes/"+$("nlesson").value,{method:"PUT",body:JSON.stringify({content:$("ncontent").value})});
    notice("Lesson content saved successfully");
  }catch(e){notice(e.message,true);}
}
async function uploadPhoto(e){
  const file=e.target.files?.[0];e.target.value="";if(!file)return;
  if(!$("nlesson").value)return notice("Choose a lesson first",true);
  try{
    const f=new FormData();f.append("file",file);f.append("lesson_id",$("nlesson").value);
    const d=await api("/api/lesson-images",{method:"POST",body:f});
    const src=d.url||API+d.key;
    $("ncontent").value+='\n<img src="'+esc(src)+'" alt="'+esc(file.name)+'" style="max-width:100%;height:auto">\n';
    notice("Photo uploaded. Save Content to keep it in the lesson.");
  }catch(err){notice(err.message,true);}
}
function resetSubtitle(){["uid","utitle","ucontent"].forEach(id=>$(id).value="");$("uorder").value=1;}
async function loadSubtitles(){
  $("urows").innerHTML="";if(!$("ulesson").value)return;
  try{const d=await api("/api/lesson-subtitles/lesson/"+$("ulesson").value);subtitles=d.subtitles||d.items||[];
    $("urows").innerHTML=subtitles.map(s=>`<tr><td>${esc(s.language)} — ${esc(s.title)}</td><td><button class="small" onclick="editSubtitle(${s.id})">Edit</button><button class="small red" onclick="deleteSubtitle(${s.id})">Delete</button></td></tr>`).join("")||"<tr><td>No subtitles</td></tr>";
  }catch(e){notice(e.message,true);}
}
function editSubtitle(id){
  const s=subtitles.find(x=>+x.id===id);if(!s)return;
  $("uid").value=id;$("ulang").value=s.language;$("utitle").value=s.title;$("ucontent").value=s.content||"";$("uorder").value=s.sort_order||0;
}
async function saveSubtitle(){
  try{if(!$("ulesson").value)return notice("Choose a lesson",true);
    const id=$("uid").value;
    await api(id?"/api/lesson-subtitles/"+id:"/api/lesson-subtitles",{method:id?"PUT":"POST",body:JSON.stringify({lesson_id:+$("ulesson").value,language:$("ulang").value,title:$("utitle").value,content:$("ucontent").value,sort_order:+$("uorder").value||0})});
    resetSubtitle();await loadSubtitles();notice("Subtitle saved successfully");
  }catch(e){notice(e.message,true);}
}
async function deleteSubtitle(id){
  if(!confirm("Delete subtitle?"))return;
  try{await api("/api/lesson-subtitles/"+id,{method:"DELETE"});await loadSubtitles();notice("Subtitle deleted");}catch(e){notice(e.message,true);}
}
async function restore(){
  const t=localStorage.getItem("createlk_admin_token")||sessionStorage.getItem("createlk_admin_token");
  if(!t)return;
  try{
    const p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(p.email.toLowerCase()!==ADMIN||p.exp*1000<Date.now())throw Error();
    token=t;openAdmin();
  }catch{logout();}
}
initGoogle();restore();
</script>
</body>
</html>
