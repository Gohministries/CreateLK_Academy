<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Academy Admin V2</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#102a56;--b:#155eef;--g:#d69b16;--bd:#dfe6f0}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#17243a;font:14px Arial}
header{display:flex;align-items:center;gap:7px;padding:12px;background:var(--n);color:white;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;flex:1}
button{border:0;border-radius:7px;padding:10px 12px;background:var(--b);color:white;font-weight:bold;cursor:pointer;margin:3px}
header button{margin:0;white-space:nowrap}
.menu-btn{background:var(--g);color:var(--n)}
.card{background:white;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:15px}
main{max-width:1000px;margin:auto;padding:14px}
h2{color:var(--n);font-size:19px;margin:0 0 14px}
h3{color:var(--n)}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;background:white}
input[type=checkbox]{width:auto}
textarea{min-height:80px}
.menu{display:none;position:fixed;top:65px;right:10px;left:auto;z-index:100;width:250px;max-width:90vw;padding:10px;background:white;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 25px #0003}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;margin:4px 0}
.secondary{background:#eaf0fa;color:var(--n)}
.gold{background:var(--g);color:var(--n)}
.danger{background:#b42318}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:15px;background:white;border:1px solid var(--bd);border-radius:10px}
.stat b{display:block;font-size:27px;color:var(--n);margin-top:7px}
.item{padding:12px;background:#f8fafc;border:1px solid var(--bd);border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.small{font-size:12px;color:#64748b}
#status{padding:12px;background:#eaf2ff;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
.error{background:#fff0ee!important;color:#a32118}
.ok{background:#e7f8ed!important;color:#146c37}
.thumb{max-width:100%;max-height:220px;border-radius:8px}
.editor{min-height:180px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;border-radius:8px;overflow-wrap:anywhere}
.editor img{max-width:100%;height:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:3px}
.toolbar button{margin:2px}
section[id]{scroll-margin-top:75px}
#app{display:none}
@media(max-width:500px){
 main{padding:9px}
 header{padding:9px 6px;gap:5px}
 header h1{font-size:14px}
 header button{font-size:11px;padding:9px 7px}
 .card{padding:12px}
}
</style>
</head>
<body>

<header>
<h1>CreateLK Academy Admin</h1>
<button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
<button onclick="logout()">Sign Out</button>
</header>

<div id="menu" class="menu">
<button onclick="goTo('overview')">📊 Dashboard</button>
<button onclick="showSubjects()">📁 Subjects</button>
<button onclick="showLessons()">📚 Lessons</button>
<button onclick="goTo('editor')">📝 Lesson Editor</button>
<button onclick="refreshAll()">🔄 Refresh Data</button>
</div>

<main>
<section id="login" class="card">
<h2>Admin Sign In</h2>
<p class="small">Sign in with your authorized Google account.</p>
<div id="googleButton"></div>
<label><input type="checkbox" id="stay" checked> Stay logged in</label>
</section>

<div id="app">
<div id="status">Loading academy data...</div>

<section id="overview" class="card">
<h2>Academy Overview</h2>
<div class="stats">
<div class="stat">Subjects<b id="sSub">0</b></div>
<div class="stat">Total Lessons<b id="sLes">0</b></div>
<div class="stat">Free Lessons<b id="sFree">0</b></div>
<div class="stat">Premium Lessons<b id="sPremium">0</b></div>
</div>
</section>

<section id="subjects" class="card" style="display:none">
<h2>📁 Subjects</h2>
<form id="subForm">
<label>Subject Name</label><input id="subName" required>
<label>Slug (optional)</label><input id="subSlug" placeholder="facebook-monetization">
<button type="submit">Add Subject</button>
</form>
<hr>
<h3>Select a subject</h3>
<div id="subjectList"></div>
</section>

<section id="lessons" class="card" style="display:none">
<h2 id="lessonHeading">📚 Lessons</h2>
<button class="secondary" onclick="showSubjects()">← Back to Subjects</button>
<form id="lessonForm">
<label>Subject</label><select id="newSubject" required></select>
<label>Lesson Title</label><input id="newTitle" required>
<label>Access</label>
<select id="newFree"><option value="1">Free</option><option value="0">Premium</option></select>
<label>Status</label>
<select id="newStatus">
<option value="PUBLISHED">Published</option>
<option value="DRAFT">Draft</option>
<option value="COMING_SOON">Coming Soon</option>
</select>
<button type="submit">Add Lesson</button>
</form>
<hr>
<div id="lessonList"></div>
</section>

<section id="editor" class="card" style="display:none">
<h2>📝 Lesson Editor</h2>
<button class="secondary" onclick="showLessons()">← Back to Lessons</button>
<label>Subject</label><select id="editSubject"></select>
<label>Lesson</label><select id="editLesson"></select>
<label>Title</label><input id="editTitle">
<label>Description</label><textarea id="editDescription"></textarea>

<h3>Lesson Photo</h3>
<label>Choose photo (max 10 MB)</label>
<input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp,image/gif">
<button id="uploadBtn" type="button" onclick="uploadPhoto()">Upload Photo</button>
<div id="photoPreview"></div>
<label>Photo URL</label><input id="photoUrl" placeholder="https://...">
<button type="button" class="secondary" onclick="copyPhoto()">Copy URL</button>
<button type="button" onclick="insertPhoto()">Insert Photo into Notes</button>

<h3>Lesson Content</h3>
<div class="toolbar">
<button type="button" onclick="formatText('bold')"><b>B</b></button>
<button type="button" onclick="formatText('italic')"><i>I</i></button>
<button type="button" onclick="formatText('underline')"><u>U</u></button>
<button type="button" onclick="formatText('insertUnorderedList')">• Bullets</button>
<button type="button" onclick="formatText('insertOrderedList')">1. Numbers</button>
<button type="button" onclick="formatHeading()">Heading</button>
</div>
<div id="notes" class="editor" contenteditable="true"></div>

<label>Access</label>
<select id="editFree"><option value="1">Free</option><option value="0">Premium</option></select>
<label>Status</label>
<select id="editStatus">
<option value="PUBLISHED">Published</option>
<option value="DRAFT">Draft</option>
<option value="COMING_SOON">Coming Soon</option>
</select>
<button class="gold" id="saveBtn" type="button" onclick="saveLesson()">Save All Changes</button>
</section>
</div>
</main>

<script>
"use strict";
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const ADMIN="gateofheavensl1@gmail.com";
const $=id=>document.getElementById(id);
let token="",subjects=[],lessons=[],activeSubject=null,requestNo=0;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function status(t,type=""){$("status").textContent=t;$("status").className=type;}
function toggleMenu(){$("menu").classList.toggle("open");}
function closeMenu(){$("menu").classList.remove("open");}
function goTo(id){
closeMenu();
["overview","subjects","lessons","editor"].forEach(k=>$(k).style.display=k===id?"block":"none");
$(id).scrollIntoView({behavior:"smooth",block:"start"});
}
function showSubjects(){goTo("subjects");renderSubjects();}
function showLessons(){
goTo("lessons");
if(activeSubject!==null){
$("newSubject").value=String(activeSubject);
renderLessons();
}
}
async function refreshAll(){closeMenu();await loadAll();}
async function api(path,options={}){
let headers=new Headers(options.headers||{});
headers.set("Authorization","Bearer "+token);
if(options.body&&!(options.body instanceof FormData))headers.set("Content-Type","application/json");
let r=await fetch(API+path,{...options,headers});
let d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||"Request failed: "+r.status);
return d;
}
function initGoogle(){
if(!window.google?.accounts?.id)return setTimeout(initGoogle,300);
google.accounts.id.initialize({client_id:CLIENT,callback:googleLogin});
$("googleButton").innerHTML="";
google.accounts.id.renderButton($("googleButton"),{theme:"outline",size:"large"});
}
function googleLogin(r){
try{
let p=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
if(p.email?.toLowerCase()!==ADMIN||!p.email_verified)throw Error("Unauthorized Google account.");
token=r.credential;
let keep=$("stay").checked?localStorage:sessionStorage;
let other=keep===localStorage?sessionStorage:localStorage;
keep.setItem("admin_token",token);keep.setItem("admin_email",p.email);
other.removeItem("admin_token");other.removeItem("admin_email");
$("login").style.display="none";$("app").style.display="block";
loadAll();
}catch(e){alert(e.message);}
}
function logout(){
token="";
[localStorage,sessionStorage].forEach(s=>{s.removeItem("admin_token");s.removeItem("admin_email");});
$("app").style.display="none";$("login").style.display="block";
closeMenu();initGoogle();
}
function restore(){
let t=localStorage.getItem("admin_token")||sessionStorage.getItem("admin_token");
let e=localStorage.getItem("admin_email")||sessionStorage.getItem("admin_email");
if(!t||!e)return initGoogle();
try{
let p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
if(p.exp*1000>Date.now()&&p.email?.toLowerCase()===ADMIN){
token=t;$("login").style.display="none";$("app").style.display="block";loadAll();
}else logout();
}catch{logout();}
}
async function loadAll(){
try{
status("Refreshing academy data...");
let d=await api("/api/bootstrap");
subjects=d.subjects||[];lessons=d.lessons||[];
$("sSub").textContent=subjects.length;
$("sLes").textContent=lessons.length;
$("sFree").textContent=lessons.filter(l=>+l.is_free===1||l.is_free===true).length;
$("sPremium").textContent=lessons.length-Number($("sFree").textContent);
renderSubjects();fillSubjectOptions();renderLessons();
status("Academy data loaded.","ok");
}catch(e){status("Loading failed: "+e.message,"error");}
}
function fillSubjectOptions(){
let old=$("editSubject").value;
let html=subjects.map(s=>`<option value="${+s.id}">${esc(s.name)}</option>`).join("");
$("newSubject").innerHTML='<option value="">Select subject</option>'+html;
$("editSubject").innerHTML=html;
if(subjects.some(s=>String(s.id)===old))$("editSubject").value=old;
if(activeSubject!==null&&subjects.some(s=>+s.id===+activeSubject))$("newSubject").value=String(activeSubject);
fillLessonOptions();
}
function renderSubjects(){
$("subjectList").innerHTML=subjects.map(s=>`
<div class="item">
<b>${esc(s.name)}</b><p class="small">ID ${+s.id} · ${esc(s.slug||"")}</p>
<button onclick="selectSubject(${+s.id})">Open Subject →</button>
<button class="secondary" onclick="editSubject(${+s.id})">Edit</button>
<button class="secondary" onclick="toggleSubject(${+s.id})">${+s.is_active?"Hide":"Show"}</button>
<button class="danger" onclick="deleteSubject(${+s.id})">Delete</button>
</div>`).join("")||"No subjects yet.";
}
function selectSubject(id){
activeSubject=id;
$("newSubject").value=String(id);
let s=subjects.find(x=>+x.id===id);
$("lessonHeading").textContent="📚 "+(s?.name||"Lessons");
renderLessons();goTo("lessons");
}
$("subForm").onsubmit=async e=>{
e.preventDefault();
try{
await api("/api/subjects",{method:"POST",body:JSON.stringify({name:$("subName").value.trim(),slug:$("subSlug").value.trim()})});
e.target.reset();await loadAll();showSubjects();status("Subject added.","ok");
}catch(x){status(x.message,"error");}
};
async function editSubject(id){
let s=subjects.find(x=>+x.id===id);if(!s)return;
let name=prompt("Subject name:",s.name);if(name===null)return;
let slug=prompt("Subject slug:",s.slug||"");if(slug===null)return;
try{
await api("/api/subjects/"+id,{method:"PUT",body:JSON.stringify({name,slug,is_active:!!+s.is_active})});
await loadAll();showSubjects();
}catch(e){status(e.message,"error");}
}
async function toggleSubject(id){
let s=subjects.find(x=>+x.id===id);if(!s)return;
try{
await api("/api/subjects/"+id,{method:"PUT",body:JSON.stringify({name:s.name,slug:s.slug,is_active:!+s.is_active})});
await loadAll();showSubjects();
}catch(e){status(e.message,"error");}
}
async function deleteSubject(id){
if(!confirm("Delete this subject?"))return;
try{await api("/api/subjects/"+id,{method:"DELETE"});activeSubject=null;await loadAll();showSubjects();}
catch(e){status(e.message,"error");}
}
$("lessonForm").onsubmit=async e=>{
e.preventDefault();
try{
await api("/api/lessons",{method:"POST",body:JSON.stringify({
subject_id:+$("newSubject").value,title:$("newTitle").value.trim(),
is_free:$("newFree").value==="1",status:$("newStatus").value,description:""
})});
$("newTitle").value="";
await loadAll();selectSubject(+$("newSubject").value);status("Lesson added.","ok");
}catch(x){status(x.message,"error");}
};
function renderLessons(){
let sid=activeSubject!==null?activeSubject:$("newSubject").value;
let filtered=lessons.filter(l=>sid===""||+l.subject_id===+sid);
$("lessonList").innerHTML=filtered.map(l=>{
let s=subjects.find(x=>+x.id===+l.subject_id);
return `<div class="item"><b>${esc(l.title||"Untitled")}</b>
<p class="small">${esc(s?.name)} · ID ${+l.id} · ${+l.is_free?"FREE":"PREMIUM"} · ${esc(l.status||"PUBLISHED")}</p>
<button onclick="openEditor(${+l.subject_id},${+l.id})">Edit Content</button>
<button class="secondary" onclick="quickEdit(${+l.id})">Quick Edit</button>
<button class="danger" onclick="deleteLesson(${+l.id})">Delete</button>
</div>`;
}).join("")||"No lessons in this subject.";
fillLessonOptions();
}
$("newSubject").onchange=()=>{activeSubject=$("newSubject").value?+$("newSubject").value:null;renderLessons();};
function fillLessonOptions(){
let sid=$("editSubject").value;
let old=$("editLesson").value;
$("editLesson").innerHTML=lessons.filter(l=>!sid||+l.subject_id===+sid)
.map(l=>`<option value="${+l.id}">${esc(l.title||"Untitled")} (#${+l.id})</option>`).join("");
if([...$("editLesson").options].some(o=>o.value===old))$("editLesson").value=old;
}
$("editSubject").onchange=()=>{fillLessonOptions();clearEditorFields();};
$("editLesson").onchange=()=>{if($("editLesson").value)loadLesson();else clearEditorFields();};
function openEditor(sid,id){
activeSubject=sid;fillSubjectOptions();$("editSubject").value=String(sid);
fillLessonOptions();$("editLesson").value=String(id);
loadLesson();goTo("editor");
}
function clearEditorFields(){
requestNo++;
["editTitle","editDescription","photoUrl"].forEach(k=>$(k).value="");
$("notes").innerHTML="";$("photoPreview").innerHTML="";
$("editFree").value="1";$("editStatus").value="PUBLISHED";
}
async function loadLesson(){
let id=$("editLesson").value,l=lessons.find(x=>+x.id===+id);if(!l)return;
let req=++requestNo;
$("editTitle").value=l.title||"";
$("editDescription").value=l.description||"";
$("editFree").value=+l.is_free?"1":"0";
$("editStatus").value=l.status||"PUBLISHED";
$("notes").innerHTML="";$("photoUrl").value="";$("photoPreview").innerHTML="";
try{
let d=await api("/api/notes/"+id);
if(req!==requestNo||$("editLesson").value!==id)return;
$("notes").innerHTML=d.content||"";
let m=(d.content||"").match(/<img[^>]+src=["'](https:\/\/[^"']+)["']/i);
if(m){$("photoUrl").value=m[1];$("photoPreview").innerHTML=`<img class="thumb" src="${esc(m[1])}" alt="Lesson photo">`;}
status("Lesson loaded.","ok");
}catch(e){if(req===requestNo)status("Lesson opened. No saved notes were returned.");}
}
async function quickEdit(id){
let l=lessons.find(x=>+x.id===id);if(!l)return;
let title=prompt("Lesson title:",l.title);if(title===null)return;
let free=confirm("OK = Free lesson. Cancel = Premium lesson.");
let st=prompt("Status: PUBLISHED, DRAFT, or COMING_SOON",l.status||"PUBLISHED");
if(!st)return;st=st.toUpperCase();
if(!["PUBLISHED","DRAFT","COMING_SOON"].includes(st))return alert("Invalid status.");
try{
await api("/api/lessons/"+id,{method:"PUT",body:JSON.stringify({
title,description:l.description||"",subject_id:+l.subject_id,
is_free:free,status:st,
sort_order:l.sort_order??l.display_order??1,
display_order:l.display_order??l.sort_order??1
})});
await loadAll();status("Lesson updated.","ok");
}catch(e){status(e.message,"error");}
}
async function deleteLesson(id){
if(!confirm("Delete this lesson?"))return;
try{await api("/api/lessons/"+id,{method:"DELETE"});await loadAll();status("Lesson deleted.","ok");}
catch(e){status(e.message,"error");}
}
async function saveLesson(){
let id=$("editLesson").value,l=lessons.find(x=>+x.id===+id);
if(!l)return status("Select a lesson first.","error");
let title=$("editTitle").value.trim();
if(!title)return status("Enter a lesson title.","error");
$("saveBtn").disabled=true;
try{
await api("/api/lessons/"+id,{method:"PUT",body:JSON.stringify({
title,description:$("editDescription").value,subject_id:+$("editSubject").value,
is_free:$("editFree").value==="1",status:$("editStatus").value,
sort_order:l.sort_order??l.display_order??1,
display_order:l.display_order??l.sort_order??1
})});
await api("/api/notes/"+id,{method:"PUT",body:JSON.stringify({content:$("notes").innerHTML})});
await loadAll();status("Lesson and notes saved successfully.","ok");
}catch(e){status("Save failed: "+e.message,"error");}
finally{$("saveBtn").disabled=false;}
}
function formatText(c){$("notes").focus();document.execCommand(c,false,null);}
function formatHeading(){$("notes").focus();document.execCommand("formatBlock",false,"h3");}
function insertPhoto(){
let u=$("photoUrl").value.trim();
if(!/^https:\/\/\S+$/i.test(u))return status("Enter a valid HTTPS photo URL.","error");
$("notes").focus();
document.execCommand("insertHTML",false,'<p><img src="'+esc(u)+'" alt="Lesson photo" style="max-width:100%;height:auto"></p>');
status("Photo inserted. Save All Changes to keep it.","ok");
}
async function uploadPhoto(){
let file=$("photoFile").files[0],id=$("editLesson").value;
if(!id)return status("Select a lesson first.","error");
if(!file)return status("Choose a photo first.","error");
if(file.size>10*1024*1024)return status("Photo must be 10 MB or smaller.","error");
if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))return status("Use JPG, PNG, WEBP or GIF.","error");
$("uploadBtn").disabled=true;
try{
let fd=new FormData();fd.append("lesson_id",id);fd.append("file",file);
let d=await api("/api/lesson-images",{method:"POST",body:fd});
if(!d.url)throw Error("Worker did not return a photo URL.");
$("photoUrl").value=d.url;
$("photoPreview").innerHTML=`<img class="thumb" src="${esc(d.url)}" alt="Photo preview">`;
$("photoFile").value="";
status("Photo uploaded. Insert Photo into Notes, then Save All Changes.","ok");
}catch(e){status("Photo upload failed: "+e.message,"error");}
finally{$("uploadBtn").disabled=false;}
}
async function copyPhoto(){
let u=$("photoUrl").value.trim();if(!u)return status("No photo URL.","error");
try{await navigator.clipboard.writeText(u);status("Photo URL copied.","ok");}
catch{$("photoUrl").select();status("URL selected. Copy it manually.");}
}
$("photoUrl").oninput=()=>{
let u=$("photoUrl").value.trim();
$("photoPreview").innerHTML=/^https:\/\/\S+$/i.test(u)?`<img class="thumb" src="${esc(u)}" alt="Photo preview">`:"";
};
restore();
</script>
</body>
</html>
