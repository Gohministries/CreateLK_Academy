<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f6fa;color:#182238}
header{background:#102a56;color:white;padding:15px;display:flex;gap:15px;align-items:center}
button{padding:10px;border:0;border-radius:7px;background:#102a56;color:white;cursor:pointer;margin:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4e0;border-radius:7px;margin:5px 0 12px}
nav{display:none;background:white;padding:10px}nav.open{display:block}nav button{width:100%;text-align:left}
main{padding:15px;max-width:1000px;margin:auto}.card{background:white;padding:15px;border-radius:10px;margin:12px 0}
.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}
.wrap{overflow:auto}.danger{background:#b42318}.light{background:#e9edf5;color:#102a56}
#msg{position:fixed;bottom:10px;left:10px;background:#102a56;color:white;padding:12px;border-radius:8px}
</style>
</head>
<body>
<header>
<button onclick="nav.classList.toggle('open')">☰</button>
<strong>CreateLK Academy Admin</strong>
<button style="margin-left:auto" onclick="logout()">Logout</button>
</header>

<div id="login" class="card" style="max-width:400px;margin:35px auto;text-align:center">
<h2>Admin Login</h2><div id="google"></div>
</div>

<nav id="nav" class="hidden">
<button onclick="page('home')">Dashboard</button>
<button onclick="page('categories')">Categories</button>
<button onclick="page('contents')">Lessons / Content</button>
<button onclick="load()">Refresh</button>
</nav>

<main id="app" class="hidden">
<section id="home" class="page">
<div class="card"><h2>Dashboard</h2>
<p>Categories: <b id="nc">0</b></p>
<p>Lessons / Content: <b id="nn">0</b></p>
<button onclick="page('categories')">Manage Categories</button>
<button onclick="page('contents')">Manage Lessons</button>
</div></section>

<section id="categories" class="page hidden">
<div class="card"><h2>Categories</h2>
<button onclick="edit('category')">+ Add Category</button>
<input id="cs" placeholder="Search categories" oninput="render()">
<div class="wrap"><table><tbody id="cr"></tbody></table></div>
</div></section>

<section id="contents" class="page hidden">
<div class="card"><h2>Lessons / Content</h2>
<button onclick="edit('content')">+ Add Content</button>
<input id="ns" placeholder="Search content" oninput="render()">
<div class="wrap"><table><tbody id="nr"></tbody></table></div>
</div></section>

<div id="form" class="card hidden">
<h2 id="ft">Edit</h2><form id="editor"></form>
</div>
</main>
<div id="msg" class="hidden"></div>

<script>
const API="https://update-v2.createlk.workers.dev";
const CLIENT="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
let token=sessionStorage.token||"",cats=[],items=[],kind="",current=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(s){$("msg").textContent=s;$("msg").classList.remove("hidden");setTimeout(()=>$("msg").classList.add("hidden"),3500)}
async function api(path,opts={}){
 let h={Authorization:"Bearer "+token,...opts.headers};
 if(opts.body&&!(opts.body instanceof FormData))h["Content-Type"]="application/json";
 let r=await fetch(API+path,{...opts,headers:h}),d;
 try{d=await r.json()}catch{d={}}
 if(!r.ok||d.ok===false)throw Error(d.error||d.message||"Request failed");
 return d
}
function id(x){return x.id??x.category_id??x.content_id}
function cname(x){return x?.name_en||x?.name_ta||x?.name_si||"Category"}
function title(x){return x?.title_en||x?.title_ta||x?.title_si||"Content"}
function auth(){
 $("login").classList.add("hidden");$("app").classList.remove("hidden");
 $("nav").classList.remove("hidden");load()
}
function logout(){token="";sessionStorage.removeItem("token");$("app").classList.add("hidden");$("nav").classList.add("hidden");$("login").classList.remove("hidden")}
function init(){
 if(!window.google?.accounts?.id)return setTimeout(init,300);
 google.accounts.id.initialize({client_id:CLIENT,callback:async r=>{
 token=r.credential;sessionStorage.token=token;
 try{await api("/api/bootstrap");auth()}catch(e){logout();say(e.message)}
 }});
 google.accounts.id.renderButton($("google"),{theme:"outline",size:"large"});
 if(token)api("/api/bootstrap").then(auth).catch(logout)
}
async function load(){try{let d=await api("/api/bootstrap");cats=d.categories||[];items=d.contents||[];render()}catch(e){say(e.message)}}
function render(){
 $("nc").textContent=cats.length;$("nn").textContent=items.length;
 $("cr").innerHTML="<tr><th>Category</th><th>Actions</th></tr>"+cats.filter(x=>JSON.stringify(x).toLowerCase().includes(($("cs").value||"").toLowerCase())).map(x=>`<tr><td>${esc(cname(x))}</td><td><button onclick="edit('category','${esc(id(x))}')">Edit/Rename</button><button class="danger" onclick="del('category','${esc(id(x))}')">Delete</button></td></tr>`).join("");
 $("nr").innerHTML="<tr><th>Content</th><th>Actions</th></tr>"+items.filter(x=>JSON.stringify(x).toLowerCase().includes(($("ns").value||"").toLowerCase())).map(x=>`<tr><td>${esc(title(x))}</td><td><button onclick="edit('content','${esc(id(x))}')">Edit/Rename</button><button class="danger" onclick="del('content','${esc(id(x))}')">Delete</button></td></tr>`).join("");
}
function page(p){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(p).classList.remove("hidden");$("nav").classList.remove("open");$("form").classList.add("hidden")}
function field(label,name,value="",type="text"){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}">`}
function area(label,name,value=""){return `<label>${label}</label><textarea name="${name}">${esc(value)}</textarea>`}
function edit(type,key){
 kind=type;current=key?((type==="category"?cats:items).find(x=>String(id(x))===String(key))||null):null;
 let x=current||{},f="";
 if(type==="category"){
 ["en","ta","si"].forEach(l=>f+=field("Name ("+l+")","name_"+l,x["name_"+l]||""));
 }else{
 f+='<label>Category</label><select name="category_id" required><option value="">Select</option>'+cats.map(c=>`<option value="${esc(id(c))}" ${String(x.category_id)===String(id(c))?"selected":""}>${esc(cname(c))}</option>`).join("")+'</select>';
 ["en","ta","si"].forEach(l=>f+=field("Title ("+l+")","title_"+l,x["title_"+l]||""));
 ["description","explanation"].forEach(a=>["en","ta","si"].forEach(l=>f+=area(a+" ("+l+")",a+"_"+l,x[a+"_"+l]||"")));
 f+=field("Image URL","image_url",x.image_url||"");
 f+='<label>Upload image</label><input type="file" name="image" accept="image/*">';
 }
 f+=field("Display order","sort_order",x.sort_order??0,"number");
 $("ft").textContent=(current?"Edit / Rename ":"Add ")+type;
 $("editor").innerHTML=f+'<button type="submit">Save</button><button type="button" class="light" onclick="$(\'form\').classList.add(\'hidden\')">Cancel</button>';
 $("form").classList.remove("hidden");$("form").scrollIntoView({behavior:"smooth"});
}
$("editor").onsubmit=async e=>{
 e.preventDefault();let fd=new FormData(e.target),body=Object.fromEntries(fd.entries());
 delete body.image;body.sort_order=Number(body.sort_order||0);
 try{
 let file=e.target.elements.image?.files?.[0];
 if(file){let im=new FormData();im.append("image",file);let d=await api("/api/content-images",{method:"POST",body:im});body.image_url=d.image_url}
 let base=kind==="category"?"/api/categories":"/api/contents";
 await api(base+(current?"/"+encodeURIComponent(id(current)):""),{method:current?"PUT":"POST",body:JSON.stringify(body)});
 $("form").classList.add("hidden");await load();say("Saved successfully")
 }catch(e){say(e.message)}
};
async function del(type,key){
 let x=(type==="category"?cats:items).find(x=>String(id(x))===String(key));
 if(!confirm("Delete "+(type==="category"?cname(x):title(x))+"?"))return;
 try{await api((type==="category"?"/api/categories/":"/api/contents/")+encodeURIComponent(key),{method:"DELETE"});await load();say("Deleted")}catch(e){say(e.message)}
}
init();
</script>
</body>
</html>
