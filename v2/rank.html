<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English - Global Leaderboard</title><style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#0b1628;
 color:#dbe4f0;
 min-height:100vh;
}

button{
 font:inherit;
}

.header{
 padding:22px 16px 10px;
 text-align:center;
}

.logo{
 font-size:27px;
 font-weight:800;
 color:#fff;
}

.logo span{
 color:#f0b92f;
}

.sub{
 margin-top:5px;
 color:#91a3b8;
 font-size:14px;
}

.container{
 width:min(900px,94%);
 margin:20px auto 40px;
}

.card{
 background:#101f34;
 border:1px solid #203451;
 border-radius:18px;
 padding:20px;
 box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.title{
 font-size:22px;
 font-weight:800;
 color:#fff;
}

.description{
 margin-top:6px;
 color:#91a3b8;
 font-size:14px;
 line-height:1.5;
}

.actions{
 display:flex;
 gap:10px;
 margin-top:18px;
}

.btn{
 flex:1;
 border:0;
 border-radius:12px;
 padding:12px 16px;
 font-weight:800;
 cursor:pointer;
 background:#f0b92f;
 color:#081321;
}

.btn:active{
 transform:scale(.98);
}

.tableWrap{
 margin-top:18px;
 overflow-x:auto;
 border-radius:14px;
 border:1px solid #203451;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:420px;
}

th{
 text-align:left;
 padding:13px 14px;
 background:#0d1a2c;
 color:#91a3b8;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.5px;
}

td{
 padding:13px 14px;
 border-top:1px solid #203451;
 font-size:14px;
}

td.top{
 width:70px;
 text-align:center;
}

td.points{
 text-align:right;
 font-weight:800;
 color:#f0b92f;
}

.rankBadge{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:40px;
 height:40px;
 border-radius:50%;
 font-size:23px;
 line-height:1;
}

.gold{
 background:rgba(240,185,47,.18);
 border:2px solid #f0b92f;
}

.silver{
 background:rgba(190,200,210,.15);
 border:2px solid #bfc7d1;
}

.bronze{
 background:rgba(180,110,60,.15);
 border:2px solid #b87333;
}

.normalRank{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:40px;
 height:40px;
 font-weight:800;
 color:#91a3b8;
}

.empty{
 text-align:center;
 padding:30px!important;
 color:#91a3b8;
}

.myRank{
 margin-top:18px;
 padding:15px;
 border-radius:14px;
 background:#0d1a2c;
 border:1px solid #203451;
}

.myRankTitle{
 color:#91a3b8;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.5px;
}

.myRankValue{
 margin-top:5px;
 color:#fff;
 font-size:18px;
 font-weight:800;
}

.note{
 margin-top:16px;
 text-align:center;
 color:#71849b;
 font-size:12px;
 line-height:1.5;
}

.loading{
 text-align:center;
 padding:30px;
 color:#91a3b8;
}

.error{
 text-align:center;
 padding:25px;
 color:#ff9b9b;
}

@media(max-width:520px){
 .card{
  padding:15px;
  border-radius:15px;
 }

 .logo{
  font-size:24px;
 }

 .title{
  font-size:20px;
 }

 th,td{
  padding:11px 10px;
 }

 .rankBadge,
 .normalRank{
  width:36px;
  height:36px;
 }
}
</style></head><body><header class="header">
 <div class="logo">Create<span>LK</span> English</div>
 <div class="sub">Global Premium Leaderboard</div>
</header><main class="container"> <section class="card">  <div class="title">🏆 Top 100 Students</div>  <div class="description">
   Active Premium students ranked by XP
  </div>  <div class="actions">
   <button class="btn" onclick="loadLeaderboard()">↻ Refresh</button>
  </div>  <div class="tableWrap">
   <table>
    <thead>
     <tr>
      <th>#</th>
      <th>Student</th>
      <th style="text-align:right">XP</th>
     </tr>
    </thead><tbody id="leaderboard">
 <tr>
  <td colspan="3" class="loading">
   Loading leaderboard...
  </td>
 </tr>
</tbody>

   </table>
  </div>  <div class="myRank" id="myRank" style="display:none">
   <div class="myRankTitle">My Global Rank</div>
   <div class="myRankValue" id="myRankValue">-</div>
  </div>  <div class="note">
   Only active Premium students are included in the global ranking.
  </div> </section></main><script>
const API="https://rank-v2.createlk.workers.dev";

const list=document.getElementById("leaderboard");
const myRank=document.getElementById("myRank");
const myRankValue=document.getElementById("myRankValue");

function esc(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

async function loadLeaderboard(){

 list.innerHTML=`
  <tr>
   <td colspan="3" class="loading">
    Loading leaderboard...
   </td>
  </tr>
 `;

 try{

  const res=await fetch(
   API+"/api/leaderboard",
   {
    credentials:"include"
   }
  );

  const data=await res.json();

  if(!res.ok || data.success===false){
   throw new Error(data.error||"Failed to load leaderboard");
  }

  const board=Array.isArray(data)
   ? data
   : (
      data.leaderboard ||
      data.students ||
      data.data ||
      []
     );

  if(!board.length){

   list.innerHTML=`
    <tr>
     <td colspan="3" class="empty">
      No Premium students yet.
     </td>
    </tr>
   `;

  }else{

   list.innerHTML=board.slice(0,100).map((u,index)=>{

    const rank=Number(u.rank||index+1);

    let badge="";

    if(rank===1){

     badge=`
      <span class="rankBadge gold" title="1st Place">
       🥇
      </span>
     `;

    }else if(rank===2){

     badge=`
      <span class="rankBadge silver" title="2nd Place">
       🥈
      </span>
     `;

    }else if(rank===3){

     badge=`
      <span class="rankBadge bronze" title="3rd Place">
       🥉
      </span>
     `;

    }else{

     badge=`
      <span class="normalRank">
       ${rank}
      </span>
     `;
    }

    return `
     <tr>
      <td class="top">
       ${badge}
      </td>

      <td>
       ${esc(u.name||u.student_name||"Student")}
      </td>

      <td class="points">
       ${Number(
        u.points ??
        u.xp ??
        u.XP ??
        0
       ).toLocaleString()}
      </td>
     </tr>
    `;

   }).join("");
  }

  loadMyRank();

 }catch(err){

  list.innerHTML=`
   <tr>
    <td colspan="3" class="error">
     ${esc(err.message||"Unable to load leaderboard")}
    </td>
   </tr>
  `;
 }
}

async function loadMyRank(){

 try{

  const res=await fetch(
   API+"/api/leaderboard/me",
   {
    credentials:"include"
   }
  );

  if(!res.ok)return;

  const data=await res.json();

  if(data.success===false)return;

  const rank=
   data.rank ??
   data.global_rank ??
   data.position ??
   data.data?.rank;

  if(rank!==undefined && rank!==null){

   myRank.style.display="block";

   myRankValue.textContent=
    "#"+Number(rank).toLocaleString();

  }

 }catch(e){}
}

loadLeaderboard();
</script></body>
</html>
