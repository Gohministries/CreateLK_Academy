<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English - Affiliate</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#0b1628;
 color:#dbe4f0;
}

.wrap{
 max-width:700px;
 margin:auto;
 padding:20px 14px 50px;
}

header{
 text-align:center;
 padding:15px 0 25px;
}

.logo{
 font-size:27px;
 font-weight:800;
 color:#f0b92f;
}

.sub{
 color:#91a3b8;
 margin-top:6px;
}

.card{
 background:#101f35;
 border:1px solid #213653;
 border-radius:16px;
 padding:18px;
 margin-bottom:14px;
}

h2{
 margin:0 0 14px;
 font-size:18px;
}

.link{
 background:#0b1628;
 border:1px solid #29415f;
 border-radius:10px;
 padding:13px;
 word-break:break-all;
 color:#f0b92f;
 font-size:14px;
}

button{
 width:100%;
 border:0;
 border-radius:10px;
 padding:12px;
 margin-top:10px;
 font-weight:700;
 cursor:pointer;
}

.copy{
 background:#f0b92f;
 color:#08111f;
}

.share{
 background:#18365d;
 color:white;
}

.withdraw{
 background:#1e9b68;
 color:white;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.stat{
 background:#0b1628;
 border-radius:12px;
 padding:15px;
 text-align:center;
}

.num{
 font-size:24px;
 font-weight:800;
 color:#f0b92f;
}

.label{
 color:#91a3b8;
 font-size:12px;
 margin-top:5px;
}

.money{
 text-align:center;
 font-size:30px;
 font-weight:800;
 color:#f0b92f;
}

.note{
 text-align:center;
 color:#91a3b8;
 font-size:13px;
 line-height:1.5;
}

.error{
 text-align:center;
 color:#ff9999;
 padding:25px;
}

.code{
 text-align:center;
 font-size:22px;
 font-weight:800;
 color:#f0b92f;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:20;
}

.modalbox{
 width:100%;
 max-width:430px;
 background:#101f35;
 border:1px solid #29415f;
 border-radius:16px;
 padding:18px;
}

.modalbox h2{
 color:#fff;
}

label{
 display:block;
 color:#91a3b8;
 font-size:12px;
 margin:10px 0 5px;
}

input{
 width:100%;
 padding:12px;
 border:1px solid #29415f;
 border-radius:10px;
 background:#0b1628;
 color:#fff;
 outline:none;
}

input:focus{
 border-color:#f0b92f;
}

.msg{
 display:none;
 margin-top:10px;
 padding:10px;
 border-radius:9px;
 font-size:13px;
}

.ok{
 background:#123c2e;
 color:#8fe0bb;
}

.err{
 background:#431f29;
 color:#ff9eaa;
}

@media(max-width:500px){
 .grid{
  grid-template-columns:1fr 1fr;
 }
}
</style>
</head>

<body>

<div class="wrap">

<header>
 <div class="logo">CreateLK English</div>
 <div class="sub">Affiliate Dashboard</div>
</header>

<div id="app">

 <div class="card">
  <div class="note">Loading...</div>
 </div>

</div>

</div>


<!-- WITHDRAW MODAL -->

<div id="withdrawModal" class="modal">

 <div class="modalbox">

  <h2>Withdraw Commission</h2>

  <div class="note" style="margin-bottom:12px">
   Available Commission:
   <b style="color:#f0b92f" id="withdrawAmount">
    LKR 0
   </b>
  </div>

  <label>Account / Customer Name</label>
  <input id="accountName"
         type="text"
         placeholder="Enter account name">

  <label>Bank</label>
  <input id="bankName"
         type="text"
         placeholder="Enter bank name">

  <label>Branch</label>
  <input id="branchName"
         type="text"
         placeholder="Enter branch">

  <label>Account Number</label>
  <input id="accountNumber"
         type="text"
         inputmode="numeric"
         placeholder="Enter account number">

  <div id="withdrawMsg" class="msg"></div>

  <button class="withdraw"
          onclick="submitWithdrawal()">
   Submit Withdrawal Request
  </button>

  <button style="background:#26364d;color:#fff"
          onclick="closeWithdraw()">
   Cancel
  </button>

 </div>

</div>


<script>

const API="https://affiliate-v2.createlk.workers.dev";

const MINIMUM_WITHDRAWAL=2000;

let referralLink="";
let availableCommission=0;


/* LOAD DASHBOARD */

async function load(){

 try{

  const r=await fetch(
   API+"/api/dashboard",
   {
    credentials:"include",
    cache:"no-store"
   }
  );

  const d=await r.json();

  /*
   * Do not send user to another login page.
   * The English session cookie is used directly.
   */

  if(!d.success){

   document.getElementById("app").innerHTML=`
    <div class="card error">
     Please login to CreateLK English first.
    </div>`;

   return;
  }


  referralLink=d.referral_link||"";

  availableCommission=
   Number(d.available_commission||0);


  const canWithdraw=
   availableCommission>=MINIMUM_WITHDRAWAL;


  document.getElementById("app").innerHTML=`

   <div class="card">

    <h2>🔗 Your Affiliate Code</h2>

    <div class="code">
     ${esc(d.affiliate_code||"-")}
    </div>

   </div>


   <div class="card">

    <h2>📣 Your Referral Link</h2>

    <div class="link">
     ${esc(referralLink)}
    </div>

    <button class="copy"
            onclick="copyLink()">
     📋 Copy Link
    </button>

    <button class="share"
            onclick="shareLink()">
     📤 Share Link
    </button>

   </div>


   <div class="card">

    <h2>📊 Performance</h2>

    <div class="grid">

     <div class="stat">
      <div class="num">
       ${Number(d.clicks||0).toLocaleString()}
      </div>
      <div class="label">
       Total Clicks
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.referrals||0).toLocaleString()}
      </div>
      <div class="label">
       Referrals
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.approved_sales||0).toLocaleString()}
      </div>
      <div class="label">
       Approved Sales
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.commission_rate||20)}%
      </div>
      <div class="label">
       Commission
      </div>
     </div>

    </div>

   </div>


   <div class="card">

    <h2>💰 Earnings</h2>

    <div class="money">
     LKR ${availableCommission.toLocaleString()}
    </div>

    <div class="note">
     Available Commission
    </div>


    <div class="grid"
         style="margin-top:12px">

     <div class="stat">

      <div class="num">
       ${Number(d.pending_commission||0).toLocaleString()}
      </div>

      <div class="label">
       Pending
      </div>

     </div>


     <div class="stat">

      <div class="num">
       ${Number(d.paid||0).toLocaleString()}
      </div>

      <div class="label">
       Paid
      </div>

     </div>

    </div>


    ${
     canWithdraw
     ?
     `
      <button class="withdraw"
              onclick="openWithdraw()">
       💳 Withdraw Commission
      </button>
     `
     :
     `
      <div class="note"
           style="margin-top:15px">
       Minimum withdrawal:
       <b style="color:#f0b92f">
        LKR ${MINIMUM_WITHDRAWAL.toLocaleString()}
       </b>
      </div>
     `
    }

   </div>


   <div class="card">

    <div class="note">

     Earn ${Number(d.commission_rate||20)}%
     from approved Premium sales.

     <br><br>

     Minimum withdrawal:
     <b style="color:#f0b92f">
      LKR ${MINIMUM_WITHDRAWAL.toLocaleString()}
     </b>

    </div>

   </div>

  `;

 }catch(e){

  document.getElementById("app").innerHTML=`
   <div class="card error">
    Unable to load affiliate dashboard.
   </div>`;

 }

}


/* COPY */

function copyLink(){

 navigator.clipboard
 .writeText(referralLink)
 .then(()=>{
  alert("Referral link copied!");
 })
 .catch(()=>{
  alert("Copy failed.");
 });

}


/* SHARE */

async function shareLink(){

 if(navigator.share){

  try{

   await navigator.share({
    title:"CreateLK English",
    text:"Join CreateLK English",
    url:referralLink
   });

  }catch(e){}

 }else{

  copyLink();

 }

}


/* WITHDRAW */

function openWithdraw(){

 if(availableCommission<MINIMUM_WITHDRAWAL){

  alert(
   "Minimum withdrawal is LKR "+
   MINIMUM_WITHDRAWAL.toLocaleString()
  );

  return;
 }


 document.getElementById("withdrawAmount")
 .textContent=
  "LKR "+
  availableCommission.toLocaleString();


 document.getElementById("accountName").value="";
 document.getElementById("bankName").value="";
 document.getElementById("branchName").value="";
 document.getElementById("accountNumber").value="";

 document.getElementById("withdrawMsg")
 .style.display="none";

 document.getElementById("withdrawModal")
 .style.display="flex";

}


function closeWithdraw(){

 document.getElementById("withdrawModal")
 .style.display="none";

}


/* SUBMIT WITHDRAWAL */

async function submitWithdrawal(){

 const name=
  document.getElementById("accountName")
  .value.trim();

 const bank=
  document.getElementById("bankName")
  .value.trim();

 const branch=
  document.getElementById("branchName")
  .value.trim();

 const account=
  document.getElementById("accountNumber")
  .value.trim();

 const msg=
  document.getElementById("withdrawMsg");


 if(!name||!bank||!branch||!account){

  msg.className="msg err";
  msg.textContent=
   "Please fill all bank details.";
  msg.style.display="block";

  return;
 }


 try{

  msg.style.display="none";


  const r=await fetch(
   API+"/api/withdraw",
   {
    method:"POST",
    credentials:"include",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     amount:availableCommission,
     account_name:name,
     bank:bank,
     branch:branch,
     account_number:account
    })
   }
  );


  const d=await r.json();


  if(!r.ok||!d.success){

   throw new Error(
    d.error||"Withdrawal request failed"
   );

  }


  msg.className="msg ok";

  msg.textContent=
   "Withdrawal request submitted successfully.";

  msg.style.display="block";


  setTimeout(()=>{

   closeWithdraw();
   load();

  },1200);


 }catch(e){

  msg.className="msg err";
  msg.textContent=e.message;
  msg.style.display="block";

 }

}


/* ESCAPE */

function esc(s){

 return String(s??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* CLOSE MODAL */

document.getElementById("withdrawModal")
 .addEventListener("click",e=>{

  if(e.target.id==="withdrawModal")
   closeWithdraw();

 });


load();

</script>

</body>
</html>
