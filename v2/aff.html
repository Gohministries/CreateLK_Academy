<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English - Affiliate</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#0b1628;
 color:#dbe4f0
}
.wrap{
 max-width:700px;
 margin:auto;
 padding:20px 14px 50px
}
header{
 text-align:center;
 padding:15px 0 25px
}
.logo{
 font-size:27px;
 font-weight:800;
 color:#f0b92f
}
.sub{
 color:#91a3b8;
 margin-top:6px
}
.card{
 background:#101f35;
 border:1px solid #213653;
 border-radius:16px;
 padding:18px;
 margin-bottom:14px
}
h2{
 margin:0 0 14px;
 font-size:18px
}
.link{
 background:#0b1628;
 border:1px solid #29415f;
 border-radius:10px;
 padding:13px;
 word-break:break-all;
 color:#f0b92f;
 font-size:14px
}
button{
 width:100%;
 border:0;
 border-radius:10px;
 padding:12px;
 margin-top:10px;
 font-weight:700;
 cursor:pointer
}
.copy{
 background:#f0b92f;
 color:#08111f
}
.share{
 background:#18365d;
 color:white
}
.withdraw{
 background:#19a974;
 color:white
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.stat{
 background:#0b1628;
 border-radius:12px;
 padding:15px;
 text-align:center
}
.num{
 font-size:24px;
 font-weight:800;
 color:#f0b92f
}
.label{
 color:#91a3b8;
 font-size:12px;
 margin-top:5px
}
.money{
 text-align:center;
 font-size:30px;
 font-weight:800;
 color:#f0b92f
}
.note{
 text-align:center;
 color:#91a3b8;
 font-size:13px;
 line-height:1.5
}
.error{
 text-align:center;
 color:#ff9999;
 padding:25px
}
.code{
 text-align:center;
 font-size:22px;
 font-weight:800;
 color:#f0b92f
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.78);
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:100
}
.modal.show{
 display:flex
}
.box{
 width:100%;
 max-width:430px;
 background:#101f35;
 border:1px solid #29415f;
 border-radius:16px;
 padding:20px
}
input{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:9px;
 border:1px solid #29415f;
 background:#0b1628;
 color:white;
 outline:none
}
input:focus{
 border-color:#f0b92f
}
.submit{
 background:#f0b92f;
 color:#08111f
}
.close{
 background:#29415f;
 color:white
}
.success{
 color:#8ff0b5;
 text-align:center;
 padding:10px
}
</style>
</head>

<body>

<div class="wrap">

<header>
 <div class="logo">CreateLK English</div>
 <div class="sub">Affiliate Dashboard</div>
</header>

<div id="app">
 <div class="card">
  <div class="note">Loading...</div>
 </div>
</div>

</div>

<div class="modal" id="withdrawModal">
 <div class="box">

  <h2>💰 Withdraw Commission</h2>

  <div class="note">
   Your available commission has reached
   LKR 2,000.
  </div>

  <input
   id="accountName"
   type="text"
   placeholder="Customer / Account Name"
   autocomplete="name">

  <input
   id="bank"
   type="text"
   placeholder="Bank">

  <input
   id="branch"
   type="text"
   placeholder="Branch">

  <input
   id="accountNumber"
   type="text"
   inputmode="numeric"
   placeholder="Account Number">

  <button
   class="submit"
   id="submitBtn"
   onclick="submitWithdrawal()">
   Submit Withdrawal Request
  </button>

  <button
   class="close"
   onclick="closeWithdraw()">
   Cancel
  </button>

 </div>
</div>

<script>

const ENGLISH_API=
 "https://createlk-english-v2.createlk.workers.dev";

const AFFILIATE_API=
 "https://affiliate-v2.createlk.workers.dev";

const MINIMUM=2000;

let authToken="";
let referralLink="";
let availableCommission=0;

/* GET SECURE TOKEN FROM ENGLISH WORKER */

async function getToken(){

 const r=await fetch(
  ENGLISH_API+"/api/affiliate/token",
  {
   method:"GET",
   credentials:"include",
   cache:"no-store"
  }
 );

 const d=await r.json().catch(()=>({}));

 if(!r.ok||!d.success){
  throw new Error(
   d.error||
   "Please login to CreateLK English first."
  );
 }

 authToken=d.token;

 if(!authToken)
  throw new Error("Authentication token missing.");

 return authToken;
}

/* LOAD DASHBOARD */

async function load(){

 try{

  await getToken();

  const r=await fetch(
   AFFILIATE_API+"/api/dashboard",
   {
    method:"GET",
    headers:{
     "Authorization":"Bearer "+authToken
    },
    cache:"no-store"
   }
  );

  const d=await r.json().catch(()=>({}));

  if(!r.ok||!d.success)
   throw new Error(
    d.error||"Unable to load affiliate dashboard."
   );

  referralLink=d.referral_link||"";

  availableCommission=
   Number(d.available_commission||0);

  const pending=
   Number(d.pending_commission||0);

  const paid=
   Number(d.paid||0);

  document.getElementById("app").innerHTML=`

   <div class="card">

    <h2>🔗 Your Affiliate Code</h2>

    <div class="code">
     ${esc(d.affiliate_code)}
    </div>

   </div>

   <div class="card">

    <h2>📣 Your Referral Link</h2>

    <div class="link">
     ${esc(referralLink)}
    </div>

    <button
     class="copy"
     onclick="copyLink()">
     📋 Copy Link
    </button>

    <button
     class="share"
     onclick="shareLink()">
     📤 Share Link
    </button>

   </div>

   <div class="card">

    <h2>📊 Performance</h2>

    <div class="grid">

     <div class="stat">
      <div class="num">
       ${Number(d.clicks||0).toLocaleString()}
      </div>
      <div class="label">
       Total Clicks
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.referrals||0).toLocaleString()}
      </div>
      <div class="label">
       Referrals
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.approved_sales||0).toLocaleString()}
      </div>
      <div class="label">
       Approved Sales
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${Number(d.commission_rate||20)}%
      </div>
      <div class="label">
       Commission
      </div>
     </div>

    </div>

   </div>

   <div class="card">

    <h2>💰 Earnings</h2>

    <div class="money">
     LKR ${availableCommission.toLocaleString()}
    </div>

    <div class="note">
     Available Commission
    </div>

    ${
     availableCommission>=MINIMUM
     ?`
      <button
       class="withdraw"
       onclick="openWithdraw()">
       💸 Withdraw Commission
      </button>
     `
     :""
    }

    <div
     class="grid"
     style="margin-top:12px">

     <div class="stat">
      <div class="num">
       ${pending.toLocaleString()}
      </div>
      <div class="label">
       Pending
      </div>
     </div>

     <div class="stat">
      <div class="num">
       ${paid.toLocaleString()}
      </div>
      <div class="label">
       Paid
      </div>
     </div>

    </div>

   </div>

   <div class="card">

    <div class="note">

     Earn ${Number(
      d.commission_rate||20
     )}% from approved Premium sales.

     <br>

     Minimum withdrawal:
     LKR ${Number(
      d.minimum_payout||MINIMUM
     ).toLocaleString()}.

    </div>

   </div>
  `;

  /*
   OPEN AUTOMATICALLY WHEN
   COMMISSION REACHES 2000
  */

  if(availableCommission>=MINIMUM){

   setTimeout(()=>{
    openWithdraw();
   },600);

  }

 }catch(e){

  document.getElementById("app").innerHTML=`

   <div class="card error">

    ${esc(e.message)}

    <br><br>

    <button
     class="copy"
     onclick="location.reload()">
     🔄 Try Again
    </button>

   </div>

  `;
 }
}

/* COPY */

async function copyLink(){

 try{

  await navigator.clipboard.writeText(
   referralLink
  );

  alert("Referral link copied!");

 }catch{

  alert("Copy failed.");

 }
}

/* SHARE */

async function shareLink(){

 if(navigator.share){

  try{

   await navigator.share({
    title:"CreateLK English",
    text:"Join CreateLK English",
    url:referralLink
   });

  }catch{}

 }else{

  copyLink();

 }
}

/* OPEN */

function openWithdraw(){

 if(availableCommission<MINIMUM){

  alert(
   "Minimum withdrawal is LKR 2,000."
  );

  return;
 }

 document
  .getElementById("withdrawModal")
  .classList.add("show");
}

/* CLOSE */

function closeWithdraw(){

 document
  .getElementById("withdrawModal")
  .classList.remove("show");

}

/* SUBMIT */

async function submitWithdrawal(){

 const accountName=
  document
  .getElementById("accountName")
  .value.trim();

 const bank=
  document
  .getElementById("bank")
  .value.trim();

 const branch=
  document
  .getElementById("branch")
  .value.trim();

 const accountNumber=
  document
  .getElementById("accountNumber")
  .value.trim();

 if(
  !accountName||
  !bank||
  !branch||
  !accountNumber
 ){

  alert(
   "Please complete all bank details."
  );

  return;
 }

 const btn=
  document.getElementById("submitBtn");

 btn.disabled=true;
 btn.textContent="Submitting...";

 try{

  const r=await fetch(
   AFFILIATE_API+"/api/withdraw",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+authToken
    },
    body:JSON.stringify({
     account_name:accountName,
     bank:bank,
     branch:branch,
     account_number:accountNumber
    })
   }
  );

  const d=await r.json().catch(()=>({}));

  if(!r.ok||!d.success){

   alert(
    d.error||
    "Withdrawal request failed."
   );

   btn.disabled=false;
   btn.textContent=
    "Submit Withdrawal Request";

   return;
  }

  alert(
   "Withdrawal request submitted successfully!\n\n"+
   "Amount: LKR "+
   Number(d.amount||0).toLocaleString()
  );

  closeWithdraw();

  document
   .getElementById("accountName")
   .value="";

  document
   .getElementById("bank")
   .value="";

  document
   .getElementById("branch")
   .value="";

  document
   .getElementById("accountNumber")
   .value="";

  btn.disabled=false;
  btn.textContent=
   "Submit Withdrawal Request";

  await load();

 }catch{

  alert(
   "Unable to submit withdrawal request."
  );

  btn.disabled=false;
  btn.textContent=
   "Submit Withdrawal Request";
 }
}

/* ESCAPE HTML */

function esc(s){

 return String(s??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}

/* START */

load();

</script>

</body>
</html>
