<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English Admin</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#0b1628;
 color:#e8eef8;
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{
 max-width:1100px;
 margin:auto;
 padding:16px;
}
header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:8px 0 18px;
}
.logo{
 font-size:21px;
 font-weight:800;
}
.logo span{color:#f0b92f}
.small{
 color:#91a1b8;
 font-size:13px;
}
.card{
 background:#111f34;
 border:1px solid #203451;
 border-radius:16px;
 padding:16px;
 margin-bottom:14px;
}
.login{
 max-width:430px;
 margin:70px auto;
 text-align:center;
}
input,select{
 width:100%;
 padding:12px;
 border:1px solid #304763;
 border-radius:10px;
 background:#0b1628;
 color:#fff;
 outline:none;
}
input:focus,select:focus{
 border-color:#f0b92f;
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.btn{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 font-weight:700;
}
.gold{
 background:#f0b92f;
 color:#08111f;
}
.blue{
 background:#246bdb;
 color:#fff;
}
.red{
 background:#c93c4d;
 color:#fff;
}
.gray{
 background:#26364d;
 color:#fff;
}
.green{
 background:#1e9b68;
 color:#fff;
}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:10px;
}
.user{
 display:grid;
 grid-template-columns:1fr auto;
 gap:12px;
 align-items:center;
}
.name{
 font-size:17px;
 font-weight:800;
}
.email{
 color:#91a1b8;
 font-size:13px;
 word-break:break-all;
 margin-top:3px;
}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:800;
 margin-top:7px;
}
.premium{
 background:#f0b92f;
 color:#111;
}
.free{
 background:#293a51;
 color:#cbd6e6;
}
.expired{
 background:#8d3442;
 color:#fff;
}
.meta{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:12px;
}
.stat{
 background:#0b1628;
 border-radius:10px;
 padding:9px;
}
.stat b{
 display:block;
 font-size:15px;
}
.stat span{
 color:#91a1b8;
 font-size:11px;
}
.ref{
 margin-top:10px;
 padding:9px;
 border-radius:9px;
 background:#0d2630;
 color:#8fe0bb;
 font-size:12px;
 word-break:break-all;
}
#app{display:none}
#users{margin-top:12px}
.center{text-align:center}
.loading{
 color:#91a1b8;
 padding:20px;
 text-align:center;
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 display:none;
 align-items:center;
 justify-content:center;
 padding:16px;
 z-index:10;
}
.modalbox{
 width:100%;
 max-width:430px;
 background:#111f34;
 border:1px solid #304763;
 border-radius:16px;
 padding:18px;
}
.modalbox h3{margin-top:0}
label{
 display:block;
 color:#aab8cb;
 font-size:12px;
 margin:10px 0 5px;
}
.message{
 margin-top:10px;
 padding:10px;
 border-radius:9px;
 display:none;
 font-size:13px;
}
.ok{
 background:#123c2e;
 color:#8fe0bb;
}
.err{
 background:#431f29;
 color:#ff9eaa;
}
@media(max-width:650px){
 .row{grid-template-columns:1fr}
 .user{grid-template-columns:1fr}
 .meta{grid-template-columns:1fr 1fr}
 .actions .btn{flex:1}
}
</style>
</head>

<body>

<div id="loginBox" class="wrap">
 <div class="card login">
  <div class="logo">CreateLK <span>English Admin</span></div>
  <p class="small">Administrator access</p>

  <button class="btn gold" style="width:100%;margin-top:10px"
          onclick="googleLogin()">
   Continue with Google
  </button>

  <div class="small" style="margin:15px 0">or</div>

  <input id="password"
         type="password"
         placeholder="Admin password">

  <button class="btn blue"
          style="width:100%;margin-top:10px"
          onclick="passwordLogin()">
   Login with Password
  </button>

  <div id="loginMsg" class="message"></div>
 </div>
</div>


<div id="app" class="wrap">

<header>
 <div>
  <div class="logo">CreateLK <span>English Admin</span></div>
  <div id="adminEmail" class="small"></div>
 </div>

 <button class="btn red" onclick="logout()">Logout</button>
</header>


<div class="card">

 <div class="row">

  <div>
   <label>Search student</label>
   <input id="search"
          placeholder="Name, email or ID"
          onkeydown="if(event.key==='Enter')loadUsers()">
  </div>

  <div>
   <label>Membership</label>
   <select id="membership" onchange="loadUsers()">
    <option value="">All students</option>
    <option value="free">Free</option>
    <option value="premium">Premium</option>
   </select>
  </div>

 </div>

 <div class="actions">
  <button class="btn blue" onclick="loadUsers()">Search</button>
  <button class="btn gray" onclick="loadUsers()">Refresh</button>
 </div>

</div>


<div id="users"></div>

</div>


<!-- PREMIUM MODAL -->

<div id="premiumModal" class="modal">
 <div class="modalbox">

  <h3>Activate Premium</h3>

  <div id="premiumStudent" class="small"></div>

  <label>Premium days</label>
  <input id="premiumDays"
         type="number"
         min="1"
         max="3650"
         value="30">

  <label>Sale amount (LKR)</label>
  <input id="premiumAmount"
         type="number"
         min="0"
         value="1000">

  <div class="small" style="margin-top:8px">
   Affiliate commission: <b>20%</b>
  </div>

  <div id="premiumMsg" class="message"></div>

  <div class="actions">
   <button class="btn gold" onclick="activatePremium()">
    Activate
   </button>
   <button class="btn gray" onclick="closeModal()">
    Cancel
   </button>
  </div>

 </div>
</div>


<!-- EXPIRY MODAL -->

<div id="expiryModal" class="modal">
 <div class="modalbox">

  <h3>Update Premium Expiry</h3>

  <div id="expiryStudent" class="small"></div>

  <label>Expiry date and time</label>
  <input id="expiryDate" type="datetime-local">

  <div id="expiryMsg" class="message"></div>

  <div class="actions">
   <button class="btn gold" onclick="saveExpiry()">
    Save
   </button>
   <button class="btn gray" onclick="closeExpiry()">
    Cancel
   </button>
  </div>

 </div>
</div>


<script>

const API="https://admin-v2.createlk.workers.dev";

let selectedUser=null;


/* REQUEST */

async function api(path,options={}){

 options.credentials="include";

 options.headers={
  "Content-Type":"application/json",
  ...(options.headers||{})
 };

 const r=await fetch(API+path,options);

 let data={};

 try{
  data=await r.json();
 }catch{}

 if(!r.ok){
  throw new Error(
   data.error||"Request failed"
  );
 }

 return data;
}


/* LOGIN */

function googleLogin(){
 location.href=API+"/auth/google";
}

async function passwordLogin(){

 const msg=document.getElementById("loginMsg");

 try{

  msg.style.display="none";

  await api(
   "/api/admin/login",
   {
    method:"POST",
    body:JSON.stringify({
     password:
      document.getElementById("password").value
    })
   }
  );

  showApp();

 }catch(e){

  msg.className="message err";
  msg.textContent=e.message;
  msg.style.display="block";

 }

}


/* STATUS */

async function checkLogin(){

 try{

  const d=await api(
   "/api/admin/status"
  );

  if(d.logged_in){
   showApp(d);
  }else{
   showLogin();
  }

 }catch{
  showLogin();
 }

}

function showLogin(){

 document.getElementById("loginBox").style.display="block";
 document.getElementById("app").style.display="none";

}

function showApp(d){

 document.getElementById("loginBox").style.display="none";
 document.getElementById("app").style.display="block";

 if(d?.admin_email)
  document.getElementById("adminEmail").textContent=
   d.admin_email;

 loadUsers();

}


/* LOGOUT */

async function logout(){

 try{
  await api(
   "/api/admin/logout",
   {method:"POST"}
  );
 }catch{}

 location.reload();

}


/* USERS */

async function loadUsers(){

 const box=document.getElementById("users");

 box.innerHTML=
  '<div class="card loading">Loading students...</div>';

 try{

  const search=
   encodeURIComponent(
    document.getElementById("search").value.trim()
   );

  const membership=
   encodeURIComponent(
    document.getElementById("membership").value
   );

  const d=await api(
   `/api/admin/users?search=${search}&membership=${membership}`
  );

  renderUsers(d.users||[]);

 }catch(e){

  box.innerHTML=
   `<div class="card message err" style="display:block">
    ${esc(e.message)}
   </div>`;

 }

}


/* RENDER */

function renderUsers(list){

 const box=document.getElementById("users");

 if(!list.length){

  box.innerHTML=
   '<div class="card loading">No students found.</div>';

  return;
 }

 box.innerHTML=list.map(u=>{

  const premium=
   String(u.membership||"").toLowerCase()==="premium";

  const expiry=u.membership_expiry
   ? new Date(u.membership_expiry)
   : null;

  const active=
   premium &&
   expiry &&
   expiry.getTime()>Date.now();

  let badge="free";
  let text="FREE";

  if(active){
   badge="premium";
   text="PREMIUM";
  }else if(premium){
   badge="expired";
   text="EXPIRED";
  }

  const commissionInfo=
   u.referred_by
    ? `<div class="ref">
        Referred by:
        <b>${esc(u.referred_by)}</b>
       </div>`
    : "";

  return `
   <div class="card">

    <div class="user">

     <div>

      <div class="name">
       ${esc(u.name||"No name")}
      </div>

      <div class="email">
       ${esc(u.email||"")}
      </div>

      <span class="badge ${badge}">
       ${text}
      </span>

      ${expiry
       ? `<div class="small" style="margin-top:6px">
           Expiry:
           ${formatDate(u.membership_expiry)}
          </div>`
       : ""
      }

     </div>

     <div class="small">
      ID: ${esc(u.id||"")}
     </div>

    </div>


    <div class="meta">

     <div class="stat">
      <b>${Number(u.xp||0)}</b>
      <span>XP</span>
     </div>

     <div class="stat">
      <b>${Number(u.coins||0)}</b>
      <span>Coins</span>
     </div>

     <div class="stat">
      <b>${Number(u.questions_answered||0)}</b>
      <span>Questions</span>
     </div>

     <div class="stat">
      <b>${Number(u.correct_answers||0)}</b>
      <span>Correct</span>
     </div>

     <div class="stat">
      <b>${Number(u.lessons_completed||0)}</b>
      <span>Lessons</span>
     </div>

     <div class="stat">
      <b>${esc(u.affiliate_code||"-")}</b>
      <span>Affiliate Code</span>
     </div>

    </div>

    ${commissionInfo}

    <div class="actions">

     ${
      active
      ? `
       <button class="btn blue"
        onclick='openExpiry(${JSON.stringify(u)})'>
        Change Expiry
       </button>

       <button class="btn red"
        onclick='removePremium("${escAttr(u.id)}")'>
        Remove Premium
       </button>
      `
      : `
       <button class="btn gold"
        onclick='openPremium(${JSON.stringify(u)})'>
        Activate Premium
       </button>
      `
     }

    </div>

   </div>
  `;

 }).join("");

}


/* PREMIUM */

function openPremium(u){

 selectedUser=u;

 document.getElementById("premiumStudent").textContent=
  `${u.name||""} — ${u.email||""}`;

 document.getElementById("premiumDays").value=30;
 document.getElementById("premiumAmount").value=1000;

 document.getElementById("premiumMsg").style.display="none";

 document.getElementById("premiumModal").style.display="flex";

}

function closeModal(){
 document.getElementById("premiumModal").style.display="none";
}

async function activatePremium(){

 if(!selectedUser)return;

 const msg=document.getElementById("premiumMsg");

 try{

  msg.style.display="none";

  const days=Math.max(
   1,
   Math.min(
    3650,
    Number(document.getElementById("premiumDays").value)||30
   )
  );

  const amount=Math.max(
   0,
   Number(document.getElementById("premiumAmount").value)||1000
  );

  const d=await api(
   "/api/admin/premium",
   {
    method:"POST",
    body:JSON.stringify({
     user_id:selectedUser.id,
     days,
     amount
    })
   }
  );

  msg.className="message ok";
  msg.textContent=
   `Premium activated. Commission: LKR ${Number(d.affiliate_commission||0).toLocaleString()}`;

  msg.style.display="block";

  setTimeout(()=>{
   closeModal();
   loadUsers();
  },900);

 }catch(e){

  msg.className="message err";
  msg.textContent=e.message;
  msg.style.display="block";

 }

}


/* REMOVE PREMIUM */

async function removePremium(id){

 if(!confirm(
  "Remove Premium from this student?"
 ))return;

 try{

  await api(
   "/api/admin/premium/remove",
   {
    method:"POST",
    body:JSON.stringify({
     user_id:id
    })
   }
  );

  loadUsers();

 }catch(e){

  alert(e.message);

 }

}


/* EXPIRY */

function openExpiry(u){

 selectedUser=u;

 document.getElementById("expiryStudent").textContent=
  `${u.name||""} — ${u.email||""}`;

 let d=u.membership_expiry
  ? new Date(u.membership_expiry)
  : new Date(Date.now()+30*86400000);

 const local=new Date(
  d.getTime()-d.getTimezoneOffset()*60000
 ).toISOString().slice(0,16);

 document.getElementById("expiryDate").value=local;

 document.getElementById("expiryMsg").style.display="none";

 document.getElementById("expiryModal").style.display="flex";

}

function closeExpiry(){
 document.getElementById("expiryModal").style.display="none";
}

async function saveExpiry(){

 if(!selectedUser)return;

 const msg=document.getElementById("expiryMsg");

 try{

  msg.style.display="none";

  const value=
   document.getElementById("expiryDate").value;

  if(!value)
   throw new Error("Expiry date required");

  const iso=
   new Date(value).toISOString();

  await api(
   "/api/admin/premium/expiry",
   {
    method:"POST",
    body:JSON.stringify({
     user_id:selectedUser.id,
     membership_expiry:iso
    })
   }
  );

  msg.className="message ok";
  msg.textContent="Premium expiry updated.";
  msg.style.display="block";

  setTimeout(()=>{
   closeExpiry();
   loadUsers();
  },700);

 }catch(e){

  msg.className="message err";
  msg.textContent=e.message;
  msg.style.display="block";

 }

}


/* HELPERS */

function formatDate(x){

 const d=new Date(x);

 if(Number.isNaN(d.getTime()))
  return "-";

 return d.toLocaleString();

}

function esc(x){

 return String(x??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function escAttr(x){
 return String(x??"")
  .replace(/\\/g,"\\\\")
  .replace(/"/g,'\\"');
}


/* CLOSE MODALS */

document.getElementById("premiumModal")
 .addEventListener("click",e=>{
  if(e.target.id==="premiumModal")
   closeModal();
 });

document.getElementById("expiryModal")
 .addEventListener("click",e=>{
  if(e.target.id==="expiryModal")
   closeExpiry();
 });


checkLogin();

</script>

</body>
</html>
