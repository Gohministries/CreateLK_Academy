<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English — Quiz</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1628;
  color:#e8edf5;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0b1628;
  border-bottom:1px solid #26344a;
  padding:14px 18px;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:18px;
}

.logo img{
  width:38px;
  height:38px;
  border-radius:10px;
}

.back{
  color:#d9b85c;
  text-decoration:none;
  font-size:14px;
}

main{
  max-width:760px;
  margin:auto;
  padding:28px 16px 50px;
}

.top{
  text-align:center;
  margin-bottom:22px;
}

.top h1{
  margin:0 0 8px;
  font-size:28px;
}

.top p{
  margin:0;
  color:#9eabbc;
}

.progress-box{
  margin:22px 0;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:#aeb9c8;
  margin-bottom:8px;
}

.progress{
  height:8px;
  background:#1c293c;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:#d9b85c;
  transition:.3s;
}

.card{
  background:#111f33;
  border:1px solid #26364d;
  border-radius:18px;
  padding:24px;
}

.number{
  color:#d9b85c;
  font-size:14px;
  font-weight:700;
  margin-bottom:14px;
}

.question{
  font-size:21px;
  line-height:1.5;
  margin-bottom:22px;
}

.options{
  display:grid;
  gap:12px;
}

.option{
  width:100%;
  text-align:left;
  border:1px solid #304158;
  background:#17263b;
  color:#eef3f9;
  padding:15px 16px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  transition:.2s;
}

.option:hover{
  border-color:#d9b85c;
}

.option:disabled{
  cursor:default;
}

.option.correct{
  border-color:#4caf76;
  background:#173626;
}

.option.wrong{
  border-color:#d65c5c;
  background:#3a1e25;
}

.result{
  display:none;
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  background:#17263b;
  border:1px solid #304158;
}

.result-title{
  font-weight:700;
  margin-bottom:7px;
}

.explanation{
  color:#b8c3d1;
  line-height:1.5;
}

.next{
  display:none;
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#d9b85c;
  color:#0b1628;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.loading,
.error,
.finished{
  text-align:center;
  padding:40px 15px;
}

.error{
  color:#ff8d8d;
}

.finished h2{
  margin-top:0;
  color:#d9b85c;
}

.score{
  font-size:24px;
  margin:20px 0;
}

.home{
  display:inline-block;
  text-decoration:none;
  background:#d9b85c;
  color:#0b1628;
  padding:13px 22px;
  border-radius:10px;
  font-weight:700;
}

.login-btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 20px;
  background:#d9b85c;
  color:#0b1628;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

@media(max-width:600px){
  main{padding:22px 12px 40px}
  .card{padding:18px}
  .question{font-size:19px}
}
</style>
</head>

<body>

<header>
  <div class="header">

    <a class="logo" href="/v2/">
      <img
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK English"
      >
      <span>CreateLK English</span>
    </a>

    <a class="back" href="/v2/lessons.html">
      ← Lessons
    </a>

  </div>
</header>

<main>

  <div id="loading" class="loading">
    Loading quiz...
  </div>

  <div id="error" class="error" style="display:none"></div>

  <section id="quiz" style="display:none">

    <div class="top">

      <h1 id="lessonTitle">
        Quiz
      </h1>

      <p id="lessonDescription"></p>

    </div>

    <div class="progress-box">

      <div class="progress-text">

        <span id="progressText">
          Question 1 of 50
        </span>

        <span id="xpText">
          XP: 0
        </span>

      </div>

      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar">
        </div>

      </div>

    </div>

    <div class="card">

      <div
        id="questionNumber"
        class="number">
        Question 1
      </div>

      <div
        id="question"
        class="question">
      </div>

      <div
        id="options"
        class="options">
      </div>

      <div
        id="result"
        class="result">

        <div
          id="resultTitle"
          class="result-title">
        </div>

        <div
          id="explanation"
          class="explanation">
        </div>

      </div>

      <button
        id="nextBtn"
        class="next">
        Next Question →
      </button>

    </div>

  </section>

  <section
    id="finished"
    class="finished"
    style="display:none">

    <h2>
      Quiz Complete 🎉
    </h2>

    <div
      id="score"
      class="score">
    </div>

    <p id="finishedText"></p>

    <a
      class="home"
      href="/v2/lessons.html">
      Back to Lessons
    </a>

  </section>

</main>

<script>

const API =
  "https://createlk-english-v2.createlk.workers.dev";

const params =
  new URLSearchParams(location.search);

const lessonId =
  Number(params.get("lesson") || 1);

let questions = [];
let current = 0;
let score = 0;
let xp = 0;
let answered = false;

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const quiz =
  document.getElementById("quiz");

const finished =
  document.getElementById("finished");

const questionNumber =
  document.getElementById("questionNumber");

const question =
  document.getElementById("question");

const options =
  document.getElementById("options");

const result =
  document.getElementById("result");

const resultTitle =
  document.getElementById("resultTitle");

const explanation =
  document.getElementById("explanation");

const nextBtn =
  document.getElementById("nextBtn");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");

const xpText =
  document.getElementById("xpText");


function showError(message){

  loading.style.display = "none";

  quiz.style.display = "none";

  finished.style.display = "none";

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


function showLoginMessage(){

  loading.style.display = "none";

  quiz.style.display = "none";

  finished.style.display = "none";

  errorBox.innerHTML =
    'Please sign in first.<br><br>' +

    '<a class="login-btn" href="' +
    API +
    '/auth/google">' +

    'Sign in with Google' +

    '</a>';

  errorBox.style.display = "block";

}


async function loadQuiz(){

  try{

    /*
      Check current session.
      IMPORTANT:
      Do not automatically redirect to Google.
      This prevents a repeated login loop.
    */

    const me =
      await fetch(
        API + "/api/me",
        {
          credentials:"include",
          cache:"no-store"
        }
      );

    const meData =
      await me.json();

    if(!me.ok || !meData.logged_in){

      showLoginMessage();

      return;

    }


    /*
      Load quiz.
    */

    const response =
      await fetch(
        API +
        "/api/quiz?lesson=" +
        encodeURIComponent(lessonId),
        {
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();


    if(!response.ok || !data.success){

      showError(
        data.error ||
        "Unable to load quiz."
      );

      return;

    }


    questions =
      data.questions || [];


    if(!questions.length){

      showError(
        "No questions found."
      );

      return;

    }


    document.getElementById(
      "lessonTitle"
    ).textContent =
      data.lesson.title;


    document.getElementById(
      "lessonDescription"
    ).textContent =
      data.lesson.description || "";


    xp =
      Number(
        meData.user?.xp || 0
      );


    loading.style.display =
      "none";

    quiz.style.display =
      "block";


    renderQuestion();


  }catch(e){

    showError(
      "Unable to connect to the quiz."
    );

  }

}


function renderQuestion(){

  answered = false;

  const q =
    questions[current];


  questionNumber.textContent =
    "Question " +
    (current + 1);


  progressText.textContent =
    "Question " +
    (current + 1) +
    " of " +
    questions.length;


  progressBar.style.width =
    (
      (current + 1) /
      questions.length *
      100
    ) +
    "%";


  xpText.textContent =
    "XP: " +
    xp;


  question.textContent =
    q.question;


  options.innerHTML = "";


  const choices = [

    ["A", q.option_a],

    ["B", q.option_b],

    ["C", q.option_c],

    ["D", q.option_d]

  ];


  choices.forEach(
    ([letter,text]) => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "option";


      button.textContent =
        letter +
        ". " +
        text;


      button.onclick = () =>
        submitAnswer(
          q.id,
          letter,
          button
        );


      options.appendChild(
        button
      );

    }
  );


  result.style.display =
    "none";


  nextBtn.style.display =
    "none";

}


async function submitAnswer(
  questionId,
  answer,
  clickedButton
){

  if(answered) return;

  answered = true;


  const buttons =
    [
      ...document.querySelectorAll(
        ".option"
      )
    ];


  buttons.forEach(
    b => {
      b.disabled = true;
    }
  );


  try{

    const response =
      await fetch(
        API +
        "/api/quiz/answer",
        {
          method:"POST",

          credentials:"include",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question_id:
              questionId,

            answer:
              answer
          })

        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      answered = false;


      buttons.forEach(
        b => {
          b.disabled = false;
        }
      );


      /*
        If the session has expired,
        show login instead of creating
        a repeated redirect loop.
      */

      if(
        response.status === 401 ||
        data.error === "Not logged in"
      ){

        showLoginMessage();

        return;

      }


      alert(
        data.error ||
        "Unable to submit answer."
      );


      return;

    }


    if(data.already_answered){

      resultTitle.textContent =
        data.correct
          ? "Already answered — Correct"
          : "Already answered — Incorrect";


      explanation.textContent =
        "This question has already been answered.";


      result.style.display =
        "block";


      nextBtn.style.display =
        "block";


      return;

    }


    if(data.correct){

      clickedButton.classList.add(
        "correct"
      );


      score++;


      xp =
        Number(
          data.total_xp || xp
        );


      resultTitle.textContent =
        "Correct! 🎉 +" +
        data.xp_awarded +
        " XP";

    }else{

      clickedButton.classList.add(
        "wrong"
      );


      resultTitle.textContent =
        "Incorrect";

    }


    xp =
      Number(
        data.total_xp || xp
      );


    xpText.textContent =
      "XP: " +
      xp;


    explanation.textContent =
      data.explanation ||
      "";


    result.style.display =
      "block";


    nextBtn.style.display =
      "block";


    if(
      current ===
      questions.length - 1
    ){

      nextBtn.textContent =
        "View Results →";

    }else{

      nextBtn.textContent =
        "Next Question →";

    }


  }catch(e){

    answered = false;


    buttons.forEach(
      b => {
        b.disabled = false;
      }
    );


    alert(
      "Connection error. Please try again."
    );

  }

}


nextBtn.onclick =
  function(){

    if(
      current <
      questions.length - 1
    ){

      current++;

      renderQuestion();


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


    }else{

      finishQuiz();

    }

  };


function finishQuiz(){

  quiz.style.display =
    "none";


  finished.style.display =
    "block";


  const percent =
    Math.round(
      (
        score /
        questions.length
      ) *
      100
    );


  document.getElementById(
    "score"
  ).textContent =

    score +
    " / " +
    questions.length +
    " correct (" +
    percent +
    "%)";


  document.getElementById(
    "finishedText"
  ).textContent =

    "You earned XP and completed this quiz.";

}


loadQuiz();

</script>

</body>
</html>
