<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>My Account | CreateLK English</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1628;
  color:#dbe4f0
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0a1527f5;
  border-bottom:1px solid #243753
}
nav{
  max-width:1000px;
  height:60px;
  margin:auto;
  padding:7px 15px;
  display:flex;
  align-items:center
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  text-decoration:none;
  font-weight:900
}
.logo{
  width:38px;
  height:38px;
  object-fit:contain
}
.brand span{
  color:#d9b85c
}
main{
  max-width:900px;
  margin:auto;
  padding:20px 15px
}
.card{
  background:#13233b;
  border:1px solid #243753;
  border-radius:14px;
  padding:18px;
  margin-bottom:12px
}
.profile{
  text-align:center
}
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #c5a64b;
  object-fit:cover
}
h1{
  margin:10px 0 3px
}
.email{
  color:#8799b0;
  font-size:13px
}
.membership{
  display:inline-block;
  margin-top:10px;
  padding:7px 14px;
  border-radius:20px;
  background:#172942;
  border:1px solid #c5a64b;
  color:#d9b85c;
  font-weight:bold
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}
.stat{
  background:#172942;
  border:1px solid #30435e;
  border-radius:9px;
  padding:12px;
  text-align:center
}
.stat strong{
  display:block;
  font-size:21px;
  color:#d9b85c
}
.stat small{
  color:#8799b0;
  font-size:10px
}
.referral{
  display:flex;
  gap:8px;
  align-items:center
}
.referral input{
  flex:1;
  min-width:0;
  padding:11px;
  border-radius:8px;
  border:1px solid #30435e;
  background:#0b1628;
  color:#fff
}
button,.btn{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  background:#c5a64b;
  color:#101b2c;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-block
}
.secondary{
  background:#172942;
  color:#dbe4f0;
  border:1px solid #30435e
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.loading{
  text-align:center;
  color:#8799b0
}
.error{
  color:#edb9bf;
  text-align:center
}
@media(max-width:600px){
  .stats{
    grid-template-columns:1fr 1fr
  }
  .referral{
    flex-direction:column
  }
  .referral input,
  .referral button{
    width:100%
  }
}
</style>
</head>

<body>

<header>
<nav>

<a class="brand" href="/">

<img
class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK">

CreateLK <span>English</span>

</a>

</nav>
</header>

<main>

<div id="loading" class="card loading">
Loading account...
</div>

<div id="account" style="display:none">

<section class="card profile">

<img
id="avatar"
class="avatar"
alt="Profile">

<h1 id="name">
-
</h1>

<div
id="email"
class="email">
-
</div>

<div
id="membership"
class="membership">
FREE
</div>

</section>


<section class="card">

<h2>📊 My Progress</h2>

<div class="stats">

<div class="stat">
<strong id="xp">0</strong>
<small>XP</small>
</div>

<div class="stat">
<strong id="correct">0</strong>
<small>CORRECT</small>
</div>

<div class="stat">
<strong id="answered">0</strong>
<small>QUESTIONS</small>
</div>

<div class="stat">
<strong id="completed">0</strong>
<small>LESSONS</small>
</div>

<div class="stat">
<strong id="coins">0</strong>
<small>COINS</small>
</div>

<div class="stat">
<strong id="membership2">FREE</strong>
<small>MEMBERSHIP</small>
</div>

</div>

</section>


<section class="card">

<h2>🔗 Referral Code</h2>

<p>
Share your referral code with friends.
</p>

<div class="referral">

<input
id="referralCode"
readonly
value="">

<button
onclick="copyCode()">
📋 Copy
</button>

</div>

<p
id="copyMessage"
style="color:#9eacc2;font-size:12px">
</p>

</section>


<section class="card">

<h2>🚀 Quick Access</h2>

<div class="actions">

<a
class="btn"
href="/lessons.html">
📚 Lessons
</a>

<a
class="btn secondary"
href="/rank.html">
🏆 Leaderboard
</a>

<a
class="btn secondary"
href="/aff.html">
💰 Affiliate
</a>

<a
class="btn secondary"
href="/pay.html">
⭐ Premium
</a>

<button
onclick="logout()"
class="secondary">
🚪 Logout
</button>

</div>

</section>

</div>


<div
id="error"
class="card error"
style="display:none">
Unable to load account.
</div>

</main>


<script>

const API =
"https://createlk-english-v2.createlk.workers.dev";


async function loadAccount(){

  try{

    const response =
      await fetch(
        API +
        "/api/me?_=" +
        Date.now(),
        {
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !data.success ||
      !data.logged_in ||
      !data.user
    ){

      window.location.href =
        API + "/auth/google";

      return;

    }

    const user =
      data.user;


    document.getElementById(
      "loading"
    ).style.display="none";


    document.getElementById(
      "account"
    ).style.display="block";


    document.getElementById(
      "name"
    ).textContent =
      user.name || "User";


    document.getElementById(
      "email"
    ).textContent =
      user.email || "";


    if(user.avatar_url){

      document.getElementById(
        "avatar"
      ).src =
        user.avatar_url;

    }


    const membership =
      user.membership === "premium"
        ? "PREMIUM"
        : "FREE";


    document.getElementById(
      "membership"
    ).textContent =
      membership;


    document.getElementById(
      "membership2"
    ).textContent =
      membership;


    document.getElementById(
      "xp"
    ).textContent =
      Number(user.xp || 0);


    document.getElementById(
      "correct"
    ).textContent =
      Number(user.correct_answers || 0);


    document.getElementById(
      "answered"
    ).textContent =
      Number(user.questions_answered || 0);


    document.getElementById(
      "completed"
    ).textContent =
      Number(user.lessons_completed || 0);


    document.getElementById(
      "coins"
    ).textContent =
      Number(user.coins || 0);


    document.getElementById(
      "referralCode"
    ).value =
      user.affiliate_code || "";

  }catch(error){

    console.error(error);

    document.getElementById(
      "loading"
    ).style.display="none";

    const box =
      document.getElementById("error");

    box.style.display="block";

    box.textContent =
      "Unable to load account: " +
      error.message;

  }

}


async function copyCode(){

  const input =
    document.getElementById(
      "referralCode"
    );

  if(!input.value){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      input.value
    );

  }catch(e){

    input.select();
    document.execCommand("copy");

  }

  document.getElementById(
    "copyMessage"
  ).textContent =
    "✅ Referral code copied.";

}


function logout(){

  window.location.href =
    API + "/auth/logout";

}


loadAccount();

</script>

</body>
</html>
