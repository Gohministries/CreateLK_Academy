<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>Lessons | CreateLK English</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1628;
  color:#dbe4f0
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0a1527f5;
  border-bottom:1px solid #243753;
  backdrop-filter:blur(10px)
}

nav{
  max-width:1000px;
  height:60px;
  margin:auto;
  padding:7px 15px;
  display:flex;
  align-items:center
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  text-decoration:none;
  font-size:18px;
  font-weight:900
}

.brand span{
  color:#d9b85c
}

.logo{
  width:38px;
  height:38px;
  object-fit:contain
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px 15px 30px
}

.hero{
  text-align:center;
  background:#13233b;
  border:1px solid #243753;
  border-radius:14px;
  padding:20px 14px;
  margin-bottom:14px
}

.hero h1{
  margin:5px 0;
  font-size:clamp(27px,6vw,40px)
}

.hero p{
  color:#9eacc2;
  margin:5px auto;
  max-width:650px;
  line-height:1.4
}

.gold{
  color:#d9b85c;
  font-weight:bold
}

.userbar{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px
}

.pill{
  background:#172942;
  border:1px solid #30435e;
  border-radius:20px;
  padding:7px 12px;
  font-size:12px
}

.pill strong{
  color:#d9b85c
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:10px
}

.card{
  background:#13233b;
  border:1px solid #243753;
  border-radius:13px;
  overflow:hidden
}

.top{
  height:3px;
  background:#c5a64b
}

.body{
  padding:13px
}

.number{
  color:#d9b85c;
  font-size:12px;
  font-weight:bold
}

.emoji{
  font-size:29px;
  margin-top:3px
}

h2{
  font-size:18px;
  margin:5px 0
}

.desc{
  color:#9eacc2;
  font-size:13px;
  line-height:1.4;
  min-height:38px
}

.badge{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:5px;
  font-size:9px;
  font-weight:bold
}

.free{
  background:#193b32;
  color:#b8e4d1
}

.premium{
  background:#332d1c;
  color:#d9b85c
}

button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:11px;
  margin-top:9px;
  background:#c5a64b;
  color:#101b2c;
  font-weight:800;
  cursor:pointer
}

button.locked{
  background:#172942;
  color:#dbe4f0;
  border:1px solid #30435e
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.loading{
  text-align:center;
  color:#8799b0;
  padding:30px
}

.error{
  text-align:center;
  color:#edb9bf;
  padding:25px
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#d9b85c;
  text-decoration:none
}

footer{
  border-top:1px solid #243753;
  padding:18px;
  text-align:center;
  color:#74869e;
  font-size:11px
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
<nav>

<a class="brand" href="/">

<img
class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK">

CreateLK <span>English</span>

</a>

</nav>
</header>


<main>

<section class="hero">

<div class="gold">
CREATE LK ACADEMY
</div>

<h1>📚 English Lessons</h1>

<p>
Build your English step by step with structured lessons
and MCQ practice.
</p>

<div class="userbar">

<div class="pill">
Membership:
<strong id="membership">GUEST</strong>
</div>

<div class="pill">
XP:
<strong id="xp">0</strong>
</div>

<div class="pill">
Questions:
<strong id="answered">0</strong>
</div>

</div>

</section>


<section
id="lessons"
class="grid">

<div class="card">

<div class="top"></div>

<div class="body loading">
Loading lessons...
</div>

</div>

</section>


<a
class="back"
href="/">
← Back to Home
</a>

</main>


<footer>
© <span id="year"></span> CreateLK English
</footer>


<script>

const API =
"https://createlk-english-v2.createlk.workers.dev";


const emojis = [
"📚","🔤","📝","💬","🎯",
"🌟","🧠","✍️","🗣️","👂",
"📖","🏆","🌍","💡","🚀",
"🎓","🧩","🔎","🕊️","👑"
];


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

}


async function loadPage(){

  try{

    /*
      Load current user.
    */

    const userResponse =
      await fetch(
        API +
        "/api/me?_=" +
        Date.now(),
        {
          credentials:"include",
          cache:"no-store"
        }
      );

    const userData =
      await userResponse.json();


    if(
      !userData.success ||
      !userData.logged_in
    ){

      window.location.href =
        API + "/auth/google";

      return;

    }


    const user =
      userData.user;


    const membership =
      user.membership === "premium"
        ? "PREMIUM"
        : "FREE";


    document.getElementById(
      "membership"
    ).textContent =
      membership;


    document.getElementById(
      "xp"
    ).textContent =
      Number(user.xp || 0);


    document.getElementById(
      "answered"
    ).textContent =
      Number(user.questions_answered || 0);


    /*
      Load lessons.
    */

    const lessonResponse =
      await fetch(
        API +
        "/api/lessons?_=" +
        Date.now(),
        {
          credentials:"include",
          cache:"no-store"
        }
      );


    const lessonData =
      await lessonResponse.json();


    if(!lessonData.success){

      throw new Error(
        lessonData.error ||
        "Unable to load lessons."
      );

    }


    const lessons =
      lessonData.lessons || [];


    if(!lessons.length){

      document.getElementById(
        "lessons"
      ).innerHTML = `

        <div class="card">

          <div class="top"></div>

          <div class="body loading">

            <div style="font-size:35px">
              📚
            </div>

            <h2>
              Lessons Coming Soon
            </h2>

            <p>
              Lesson content is being prepared.
            </p>

          </div>

        </div>

      `;

      return;

    }


    document.getElementById(
      "lessons"
    ).innerHTML =
      lessons.map(
        (lesson,index) => {

          const isFree =
            Number(lesson.is_free) === 1;

          const isPremium =
            !isFree;


          /*
            Backend can provide accessible.
            If not provided, calculate from
            membership + free status.
          */

          const accessible =
            typeof lesson.accessible === "boolean"
              ? lesson.accessible
              : (
                  isFree ||
                  membership === "PREMIUM"
                );


          const emoji =
            emojis[index % emojis.length];


          let badge;

          if(isFree){

            badge = `
              <span class="badge free">
                FREE
              </span>
            `;

          }else{

            badge = `
              <span class="badge premium">
                ⭐ PREMIUM
              </span>
            `;

          }


          let buttonText;

          if(accessible){

            buttonText =
              "▶ Start Lesson";

          }else{

            buttonText =
              "🔒 Premium Required";

          }


          return `

            <article class="card">

              <div class="top"></div>

              <div class="body">

                <div class="number">
                  LESSON ${
                    Number(
                      lesson.sort_order ||
                      index + 1
                    )
                  }
                </div>

                <div class="emoji">
                  ${emoji}
                </div>

                <h2>
                  ${esc(
                    lesson.title ||
                    "Lesson " +
                    (index + 1)
                  )}
                </h2>

                <div class="desc">
                  ${esc(
                    lesson.description ||
                    "Practice English and improve your skills."
                  )}
                </div>

                ${badge}

                <button
                  class="${
                    accessible
                      ? ""
                      : "locked"
                  }"
                  onclick="openLesson(
                    ${Number(lesson.id)},
                    ${isFree},
                    ${accessible}
                  )">

                  ${buttonText}

                </button>

              </div>

            </article>

          `;

        }
      ).join("");


  }catch(error){

    console.error(error);

    document.getElementById(
      "lessons"
    ).innerHTML = `

      <div class="card">

        <div class="top"></div>

        <div class="body error">

          <div style="font-size:35px">
            ⚠️
          </div>

          <h2>
            Unable to Load Lessons
          </h2>

          <p>
            ${esc(error.message)}
          </p>

          <button
            onclick="loadPage()">
            🔄 Try Again
          </button>

        </div>

      </div>

    `;

  }

}


function openLesson(
  lessonId,
  isFree,
  accessible
){

  if(!accessible){

    alert(
      "⭐ This lesson requires Premium membership."
    );

    window.location.href =
      "/pay.html";

    return;

  }


  /*
    Quiz/lesson content page will be
    connected after the lesson database
    and question API are completed.
  */

  window.location.href =
    "/quiz.html?lesson=" +
    encodeURIComponent(lessonId);

}


document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();


loadPage();

</script>

</body>
</html>
