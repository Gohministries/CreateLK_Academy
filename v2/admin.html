<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English — Admin</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1628;
  color:#e8eef7
}
button,input,select{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0b1628ee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #26364d
}
.head{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.logo{
  font-size:20px;
  font-weight:800
}
.logo span{color:#d69b16}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px
}

.card{
  background:#101f34;
  border:1px solid #273953;
  border-radius:16px;
  padding:20px;
  margin:18px 0
}

.login{
  max-width:430px;
  margin:70px auto
}

h1,h2,h3{margin-top:0}
.muted{color:#91a0b6}
.small{font-size:12px}

button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  font-weight:700
}
.gold{background:#d69b16;color:#081426}
.dark{background:#17263d;color:#fff}
.red{background:#b83232;color:#fff}
.green{background:#20844a;color:#fff}
.blue{background:#155eef;color:#fff}

input,select{
  width:100%;
  background:#0b1628;
  color:#fff;
  border:1px solid #30435f;
  border-radius:10px;
  padding:12px;
  outline:none
}
input:focus,select:focus{
  border-color:#d69b16
}

.google{
  width:100%;
  background:#fff;
  color:#222;
  padding:13px;
  margin-bottom:12px
}

.divider{
  text-align:center;
  color:#728199;
  margin:16px 0
}

.formRow{
  display:flex;
  gap:10px
}

.formRow input{
  flex:1
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 180px auto auto;
  gap:10px;
  align-items:center
}

.user{
  background:#0d1a2c;
  border:1px solid #273952;
  border-radius:14px;
  padding:15px;
  margin:10px 0
}

.userTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start
}

.name{
  font-size:17px;
  font-weight:800
}

.email{
  color:#9caac0;
  font-size:13px;
  margin-top:4px;
  word-break:break-all
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase
}

.free{
  background:#25344a;
  color:#b8c4d5
}

.premium{
  background:#d69b16;
  color:#081426
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:14px 0
}

.stat{
  background:#13233a;
  border-radius:10px;
  padding:9px
}

.stat b{
  display:block;
  font-size:16px;
  margin-top:3px
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}

.actions input{
  width:120px
}

.expiry{
  color:#d69b16;
  font-size:13px;
  margin-top:8px
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364d
}

.userInfo{
  display:flex;
  gap:10px;
  align-items:center
}

.message{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  z-index:100;
  background:#182a43;
  border:1px solid #344a69;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  max-width:90%;
  text-align:center
}

.loading{
  text-align:center;
  padding:30px;
  color:#8fa0b8
}

.empty{
  text-align:center;
  padding:35px;
  color:#91a0b6
}

#app{display:none}

@media(max-width:800px){
  .toolbar{
    grid-template-columns:1fr 1fr
  }
  .toolbar button{
    width:100%
  }
  .stats{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:520px){
  .wrap{padding:12px}
  .card{padding:15px}
  .toolbar{
    grid-template-columns:1fr
  }
  .formRow{
    flex-direction:column
  }
  .userTop{
    align-items:flex-start
  }
  .actions button,
  .actions input{
    width:100%
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <div class="logo">CreateLK <span>English</span> — Admin</div>
    <button id="logoutBtn" class="red" onclick="logout()" style="display:none">
      Logout
    </button>
  </div>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <section id="loginBox" class="card login">

    <h1>Admin Login</h1>
    <p class="muted">
      CreateLK English administration panel
    </p>

    <button class="google" onclick="googleLogin()">
      🔐 Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="formRow">
      <input
        id="password"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
      >
      <button class="gold" onclick="passwordLogin()">
        Login
      </button>
    </div>

    <p id="loginError" class="small" style="color:#ff7777"></p>

  </section>

  <!-- ADMIN APP -->
  <section id="app">

    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
        <div>
          <h1>Dashboard</h1>
          <div class="muted">
            Logged in as <b id="adminEmail"></b>
          </div>
          <div class="muted small" id="sessionExpiry"></div>
        </div>

        <button class="dark" onclick="loadUsers()">
          ↻ Refresh
        </button>
      </div>
    </div>

    <div class="card">

      <h2>Users</h2>

      <div class="toolbar">

        <input
          id="search"
          placeholder="Search name, email or ID"
          onkeydown="if(event.key==='Enter')loadUsers()"
        >

        <select id="membership" onchange="loadUsers()">
          <option value="">All Members</option>
          <option value="free">Free</option>
          <option value="premium">Premium</option>
        </select>

        <button class="gold" onclick="loadUsers()">
          Search
        </button>

        <button class="dark" onclick="clearSearch()">
          Clear
        </button>

      </div>

      <div id="users" class="loading">
        Loading users...
      </div>

    </div>

  </section>

</div>

<div id="message" class="message"></div>

<script>
const API="https://admin-v2.createlk.workers.dev";

const $=id=>document.getElementById(id);

function showMessage(text){
  const box=$("message");
  box.textContent=text;
  box.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=setTimeout(()=>{
    box.style.display="none";
  },3000);
}

function showLoginError(text){
  $("loginError").textContent=text||"";
}

function googleLogin(){
  location.href=API+"/auth/google";
}

async function request(path,options={}){
  const res=await fetch(
    API+path,
    {
      ...options,
      credentials:"include",
      headers:{
        "Content-Type":"application/json",
        ...(options.headers||{})
      }
    }
  );

  let data={};

  try{
    data=await res.json();
  }catch{}

  if(!res.ok){
    throw new Error(
      data.error||"Request failed"
    );
  }

  return data;
}

async function passwordLogin(){

  const password=$("password").value;

  if(!password){
    showLoginError("Enter admin password.");
    return;
  }

  showLoginError("");

  try{

    const data=await request(
      "/api/admin/login",
      {
        method:"POST",
        body:JSON.stringify({password})
      }
    );

    if(data.success){
      $("password").value="";
      await checkStatus();
    }else{
      showLoginError(data.error||"Login failed");
    }

  }catch(e){
    showLoginError(e.message);
  }
}

async function checkStatus(){

  try{

    const data=await request(
      "/api/admin/status"
    );

    if(data.logged_in){

      $("loginBox").style.display="none";
      $("app").style.display="block";
      $("logoutBtn").style.display="block";

      $("adminEmail").textContent=
        data.admin_email||"";

      if(data.expires_at){

        const d=new Date(data.expires_at);

        $("sessionExpiry").textContent=
          "Session expires: "+d.toLocaleString();

      }

      await loadUsers();

    }else{

      $("loginBox").style.display="block";
      $("app").style.display="none";
      $("logoutBtn").style.display="none";

    }

  }catch(e){

    $("loginBox").style.display="block";
    $("app").style.display="none";

  }
}

async function logout(){

  try{
    await request(
      "/api/admin/logout",
      {method:"POST"}
    );
  }catch{}

  location.reload();
}

function clearSearch(){

  $("search").value="";
  $("membership").value="";
  loadUsers();

}

async function loadUsers(){

  $("users").innerHTML=
    '<div class="loading">Loading users...</div>';

  const search=
    encodeURIComponent(
      $("search").value.trim()
    );

  const membership=
    encodeURIComponent(
      $("membership").value
    );

  try{

    const data=await request(
      `/api/admin/users?search=${search}&membership=${membership}`
    );

    const list=data.users||[];

    if(!list.length){

      $("users").innerHTML=
        '<div class="empty">No users found.</div>';

      return;
    }

    $("users").innerHTML=
      list.map(userHTML).join("");

  }catch(e){

    if(e.message.includes("Admin login")){
      location.reload();
      return;
    }

    $("users").innerHTML=
      `<div class="empty">${esc(e.message)}</div>`;

  }
}

function userHTML(u){

  const isPremium=
    String(u.membership||"").toLowerCase()==="premium";

  const avatar=
    u.avatar_url||
    "";

  const expiry=
    u.membership_expiry
      ? formatDate(u.membership_expiry)
      : "No expiry";

  return `
    <div class="user">

      <div class="userTop">

        <div class="userInfo">

          ${
            avatar
            ? `<img class="avatar" src="${esc(avatar)}" alt="">`
            : `<div class="avatar"></div>`
          }

          <div>
            <div class="name">
              ${esc(u.name||"No name")}
            </div>

            <div class="email">
              ${esc(u.email||"")}
            </div>

            <div class="small muted">
              ID: ${esc(u.id||"")}
            </div>
          </div>

        </div>

        <span class="badge ${isPremium?"premium":"free"}">
          ${isPremium?"Premium":"Free"}
        </span>

      </div>

      <div class="expiry">
        ${
          isPremium
          ? "Premium expiry: "+esc(expiry)
          : "Free member"
        }
      </div>

      <div class="stats">

        <div class="stat">
          <span class="small muted">XP</span>
          <b>${num(u.xp)}</b>
        </div>

        <div class="stat">
          <span class="small muted">Coins</span>
          <b>${num(u.coins)}</b>
        </div>

        <div class="stat">
          <span class="small muted">Correct</span>
          <b>${num(u.correct_answers)}</b>
        </div>

        <div class="stat">
          <span class="small muted">Attempts</span>
          <b>${num(u.questions_answered)}</b>
        </div>

        <div class="stat">
          <span class="small muted">Lessons</span>
          <b>${num(u.lessons_completed)}</b>
        </div>

      </div>

      <div class="actions">

        ${
          !isPremium
          ? `
            <input
              id="days_${escAttr(u.id)}"
              type="number"
              min="1"
              max="3650"
              value="30"
              placeholder="Days"
            >

            <button
              class="gold"
              onclick="activatePremium('${escAttr(u.id)}')"
            >
              👑 Activate Premium
            </button>
          `
          : `
            <input
              id="expiry_${escAttr(u.id)}"
              type="datetime-local"
            >

            <button
              class="gold"
              onclick="setExpiry('${escAttr(u.id)}')"
            >
              📅 Set Expiry
            </button>

            <button
              class="red"
              onclick="removePremium('${escAttr(u.id)}')"
            >
              Remove Premium
            </button>
          `
        }

      </div>

    </div>
  `;
}

async function activatePremium(id){

  const input=$("days_"+id);

  let days=
    Number(input?.value||30);

  if(!Number.isFinite(days)||days<1)
    days=30;

  days=Math.min(3650,Math.floor(days));

  if(!confirm(
    "Activate Premium for "+days+" days?"
  ))return;

  try{

    const data=await request(
      "/api/admin/premium",
      {
        method:"POST",
        body:JSON.stringify({
          user_id:id,
          days
        })
      }
    );

    showMessage(
      data.message||"Premium activated"
    );

    await loadUsers();

  }catch(e){
    showMessage(e.message);
  }
}

async function removePremium(id){

  if(!confirm(
    "Remove Premium from this user?"
  ))return;

  try{

    const data=await request(
      "/api/admin/premium/remove",
      {
        method:"POST",
        body:JSON.stringify({
          user_id:id
        })
      }
    );

    showMessage(
      data.message||"Premium removed"
    );

    await loadUsers();

  }catch(e){
    showMessage(e.message);
  }
}

async function setExpiry(id){

  const input=$("expiry_"+id);

  if(!input||!input.value){
    showMessage("Select an expiry date.");
    return;
  }

  const date=
    new Date(input.value);

  if(Number.isNaN(date.getTime())){
    showMessage("Invalid expiry date.");
    return;
  }

  if(date<=new Date()){
    showMessage("Expiry must be in the future.");
    return;
  }

  try{

    const data=await request(
      "/api/admin/premium/expiry",
      {
        method:"POST",
        body:JSON.stringify({
          user_id:id,
          membership_expiry:date.toISOString()
        })
      }
    );

    showMessage(
      data.message||"Expiry updated"
    );

    await loadUsers();

  }catch(e){
    showMessage(e.message);
  }
}

function formatDate(value){

  const d=new Date(value);

  if(Number.isNaN(d.getTime()))
    return value||"";

  return d.toLocaleString();

}

function num(value){

  const n=Number(value||0);

  return Number.isFinite(n)
    ? n.toLocaleString()
    : "0";

}

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escAttr(value){
  return String(value??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

checkStatus();
</script>

</body>
</html>
