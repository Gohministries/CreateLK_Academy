<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:15px}
.header,main{max-width:1100px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:17px}
.back{color:#fff;text-decoration:none;font-size:12px}
main{padding:18px 12px}
h1{font-size:23px;margin:0}
.sub{color:#667085;font-size:12px;margin:5px 0 18px}

.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:14px;margin-bottom:12px}

.login,.toolbar{display:flex;gap:8px}
input,select,button{border:1px solid #d0d5dd;border-radius:8px;padding:10px;font-size:12px}
input{flex:1}
button{cursor:pointer;font-weight:700}
.primary{background:#155eef;color:#fff;border:0}
.green{background:#dcfce7;color:#166534;border:0}
.red{background:#fee2e2;color:#991b1b;border:0}
.gray{background:#f2f4f7;color:#344054;border:0}

.status{font-size:11px;color:#667085;margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:13px}
.stat b{display:block;font-size:23px;margin-top:4px}
.orange{color:#d97706}.greenText{color:#16a34a}.redText{color:#dc2626}

.message{text-align:center;color:#667085;padding:22px}
.error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:11px;border-radius:9px;margin-bottom:12px;font-size:12px}

.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th{background:#f8fafc;color:#667085;font-size:10px;text-align:left;padding:10px}
td{padding:10px;border-top:1px solid #e4e7ec;font-size:11px}
.name{font-weight:700}
.small{font-size:9px;color:#667085;margin-top:3px}
.amount{font-weight:700;color:#155eef}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:700}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}

.actions{display:flex;gap:4px}
.actions button{padding:6px 8px;font-size:9px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:12px;z-index:99}
.modal.open{display:flex}
.modalBox{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:13px;padding:15px}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.details{background:#f8fafc;border:1px solid #e4e7ec;border-radius:9px;padding:11px;font-size:11px;line-height:1.8}
.slip{width:100%;max-height:60vh;object-fit:contain;margin-top:10px;border:1px solid #e4e7ec;border-radius:7px}
.modalActions{display:flex;gap:7px;margin-top:10px}
.modalActions button{flex:1}

@media(max-width:650px){
.login,.toolbar{flex-direction:column}
.login>* ,.toolbar>*{width:100%}
.stats{grid-template-columns:1fr}
}
</style></head><body><header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<a href="/admin.html" class="back">← Admin Dashboard</a>
</div>
</header><main><h1>💳 Payment Administration</h1>
<div class="sub">Review bank payments and activate Premium memberships.</div><div class="card">
<div class="login">
<input id="password" type="password" placeholder="Enter admin password">
<button id="loginBtn" class="primary">🔐 Login</button>
</div>
<div id="loginStatus" class="status">Not authenticated</div>
</div><div class="stats">
<div class="stat">Pending<b id="pending" class="orange">0</b></div>
<div class="stat">Approved<b id="approved" class="greenText">0</b></div>
<div class="stat">Rejected<b id="rejected" class="redText">0</b></div>
</div><br><div id="error" class="error"></div><div class="card">
<div class="toolbar">
<select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select><input id="search" type="search" placeholder="Search student, phone or ID"><button id="refresh" class="primary">🔄 Refresh</button>

</div>
</div><div id="message" class="card message">
Enter your admin password to load payments.
</div><div id="tableWrap" class="card tableWrap" style="display:none">
<table>
<thead>
<tr>
<th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>METHOD</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div></main><div id="modal" class="modal">
<div class="modalBox"><div class="modalHead">
<b>Payment Details</b>
<button id="close" class="gray">✕</button>
</div><div id="details" class="details"></div>
<div id="slip"></div><div id="modalActions" class="modalActions">
<button id="approveBtn" class="green">✓ Approve & Activate</button>
<button id="rejectBtn" class="red">✕ Reject</button>
</div></div>
</div><script>

/* =========================
   CORRECT WORKER
========================= */

const API =
"https://createlk-premium-payments.createlk.workers.dev";

const KEY =
"createlk_admin_password";

let payments=[];
let current=null;

const $=id=>document.getElementById(id);


/* =========================
   AUTH
========================= */

function password(){
return sessionStorage.getItem(KEY)||"";
}

async function api(path,options={}){

const p=password();

if(!p)
throw new Error("Please enter admin password.");

const headers={
"X-Admin-Password":p
};

if(options.body)
headers["Content-Type"]="application/json";

const res=await fetch(
API+path,
{
method:options.method||"GET",
headers,
body:options.body||undefined
}
);

const text=await res.text();

let data={};

try{
data=text?JSON.parse(text):{};
}catch{
data={error:text};
}

if(!res.ok){

if(res.status===401||res.status===403){
sessionStorage.removeItem(KEY);
throw new Error("Invalid admin password.");
}

throw new Error(
data.error||
data.message||
"Request failed: "+res.status
);

}

return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

const p=$("password").value.trim();

if(!p){
$("loginStatus").textContent="Please enter password.";
return;
}

sessionStorage.setItem(KEY,p);
await loadPayments();

}


/* =========================
   LOAD PAYMENTS
========================= */

async function loadPayments(){

$("error").style.display="none";
$("tableWrap").style.display="none";
$("message").style.display="block";
$("message").textContent="⏳ Loading payments...";

try{

const data=
await api("/api/admin/payments");

payments=
Array.isArray(data)
?data
:data.payments||data.data||[];

$("loginStatus").textContent="✓ Authenticated";

updateStats();
render();

}catch(e){

console.error(e);

$("message").textContent=
"Unable to load payments.";

$("error").textContent=
"⚠️ "+e.message;

$("error").style.display="block";

$("loginStatus").textContent=
"❌ "+e.message;

}

}


/* =========================
   STATUS / STATS
========================= */

function status(p){
return String(p.status||"PENDING").toUpperCase();
}

function updateStats(){

let a=0,b=0,c=0;

payments.forEach(p=>{

const s=status(p);

if(s==="PENDING")a++;
else if(s==="APPROVED"||s==="ACTIVE")b++;
else if(s==="REJECTED")c++;

});

$("pending").textContent=a;
$("approved").textContent=b;
$("rejected").textContent=c;

}


/* =========================
   HELPERS
========================= */

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function name(p){
return p.student_name||"Unknown Student";
}


/* =========================
   RENDER
========================= */

function render(){

const filter=$("filter").value;
const search=$("search").value.trim().toLowerCase();

const list=payments.filter(p=>{

const s=status(p);

const filterOK=
filter==="ALL"||
s===filter||
(filter==="APPROVED"&&s==="ACTIVE");

const text=(
name(p)+" "+
(p.student_id||"")+" "+
(p.phone||"")
).toLowerCase();

return filterOK&&
(!search||text.includes(search));

});

$("rows").innerHTML="";

if(!list.length){

$("message").style.display="block";
$("message").textContent="No payments found.";
return;

}

$("message").style.display="none";
$("tableWrap").style.display="block";

list.forEach(p=>{

const s=status(p);

const badge=
s==="REJECTED"
?"rejected":
(s==="APPROVED"||s==="ACTIVE"
?"approved":"pending");

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
<div class="name">${esc(name(p))}</div>
<div class="small">Student ID: ${esc(p.student_id)}</div>
</td>

<td>${esc(p.phone||"-")}</td>

<td>
<div class="amount">
${esc(p.currency||"LKR")} ${esc(p.amount||0)}
</div>
</td>

<td>${esc(p.method||"Bank Transfer")}</td>

<td>${esc(p.created_at||"-")}</td>

<td>
<span class="badge ${badge}">
${esc(s)}
</span>
</td>

<td>
<div class="actions">

<button class="view gray">👁</button>

<button
class="approve green"
${s==="PENDING"?"":"disabled"}>
✓
</button>

<button
class="reject red"
${s==="PENDING"?"":"disabled"}>
✕
</button>

</div>
</td>
`;

const btn=tr.querySelectorAll("button");

btn[0].onclick=()=>viewPayment(p);
btn[1].onclick=()=>approvePayment(p);
btn[2].onclick=()=>rejectPayment(p);

$("rows").appendChild(tr);

});

}


/* =========================
   VIEW
========================= */

async function viewPayment(p){

current=p;

$("details").innerHTML=`

<b>Record ID:</b> ${esc(p.id)}<br>
<b>Student:</b> ${esc(name(p))}<br>
<b>Student ID:</b> ${esc(p.student_id)}<br>
<b>Phone:</b> ${esc(p.phone||"-")}<br>
<b>Amount:</b> ${esc(p.currency||"LKR")} ${esc(p.amount||0)}<br>
<b>Method:</b> ${esc(p.method||"Bank Transfer")}<br>
<b>Order ID:</b> ${esc(p.order_id||"-")}<br>
<b>Payment ID:</b> ${esc(p.payment_id||"-")}<br>
<b>Date:</b> ${esc(p.created_at||"-")}<br>
<b>Status:</b> ${esc(status(p))}<br>
<b>Note:</b> ${esc(p.admin_note||"-")}

`;

$("slip").innerHTML=
"<div class='message'>⏳ Loading slip...</div>";

$("modalActions").style.display=
status(p)==="PENDING"?"flex":"none";

$("modal").classList.add("open");

try{

const res=await fetch(
API+
"/api/admin/slip?id="+
encodeURIComponent(p.id),
{
headers:{
"X-Admin-Password":password()
}
}
);

if(!res.ok){

const text=await res.text();

let d={};

try{d=JSON.parse(text)}catch{}

throw new Error(
d.error||"Unable to load payment slip."
);

}

const blob=await res.blob();
const url=URL.createObjectURL(blob);

if(
(res.headers.get("content-type")||"")
.includes("pdf")
){

$("slip").innerHTML=`
<iframe
src="${url}"
style="width:100%;height:60vh;border:0;margin-top:10px">
</iframe>`;

}else{

$("slip").innerHTML=`
<img class="slip" src="${url}" alt="Payment Slip">`;

}

}catch(e){

$("slip").innerHTML=`
<div style="
margin-top:10px;
padding:10px;
background:#fef2f2;
color:#991b1b;
border-radius:8px;
font-size:11px">
⚠️ ${esc(e.message)}
</div>`;

}

}


/* =========================
   APPROVE
========================= */

async function approvePayment(p){

if(status(p)!=="PENDING")return;

if(!confirm(
"Approve this payment and activate Premium for 30 days?"
))return;

try{

await api(
"/api/admin/approve",
{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:"Approved by administrator"
})
}
);

alert(
"✓ Payment approved and Premium activated."
);

closeModal();
await loadPayments();

}catch(e){

alert("⚠️ "+e.message);

}

}


/* =========================
   REJECT
========================= */

async function rejectPayment(p){

if(status(p)!=="PENDING")return;

const note=prompt(
"Enter rejection reason:",
"Payment slip could not be verified."
);

if(note===null)return;

try{

await api(
"/api/admin/reject",
{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:note.trim()||"Payment rejected"
})
}
);

alert("✓ Payment rejected.");

closeModal();
await loadPayments();

}catch(e){

alert("⚠️ "+e.message);

}

}


/* =========================
   CLOSE
========================= */

function closeModal(){

$("modal").classList.remove("open");
current=null;

}


/* =========================
   EVENTS
========================= */

$("loginBtn").onclick=login;
$("refresh").onclick=loadPayments;
$("filter").onchange=render;
$("search").oninput=render;
$("close").onclick=closeModal;

$("approveBtn").onclick=()=>{
if(current)approvePayment(current);
};

$("rejectBtn").onclick=()=>{
if(current)rejectPayment(current);
};

$("password").onkeydown=e=>{
if(e.key==="Enter")login();
};

$("modal").onclick=e=>{
if(e.target===$("modal"))closeModal();
};


/* =========================
   AUTO LOGIN
========================= */

if(password()){

$("password").value=password();
loadPayments();

}

</script></body>
</html>
