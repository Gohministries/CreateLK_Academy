<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy</title><style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#155eef;
--b2:#104dcc;
--g:#16a34a;
--r:#dc2626;
--o:#d97706;
--d:#172033;
--m:#667085;
--bg:#f6f8fc;
--l:#e4e7ec;
--white:#fff
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--d);
min-height:100vh
}

header{
background:linear-gradient(135deg,var(--b),var(--b2));
color:#fff;
padding:16px
}

.header-inner{
max-width:1050px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:18px;
font-weight:900
}

.back{
font-size:12px;
font-weight:800;
color:#fff
}

.container{
max-width:1050px;
margin:auto;
padding:18px 14px 35px
}

.title{
margin-bottom:18px
}

.title h1{
font-size:25px
}

.title p{
color:var(--m);
font-size:13px;
margin-top:4px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px
}

.stat{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:15px
}

.stat-label{
font-size:11px;
color:var(--m);
font-weight:800
}

.stat-value{
font-size:25px;
font-weight:900;
margin-top:4px
}

.pending{
color:var(--o)
}

.approved{
color:var(--g)
}

.rejected{
color:var(--r)
}

.toolbar{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:12px;
display:flex;
gap:8px;
margin-bottom:14px
}

select,
input{
border:1px solid var(--l);
border-radius:8px;
padding:10px;
font-size:12px;
background:#fff
}

select{
min-width:130px
}

.refresh{
border:0;
border-radius:8px;
background:var(--b);
color:#fff;
padding:10px 14px;
font-size:12px;
font-weight:800;
cursor:pointer
}

.loading,
.empty,
.error{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:25px;
text-align:center;
font-size:13px;
color:var(--m)
}

.error{
display:none;
background:#fef2f2;
border-color:#fecaca;
color:#991b1b
}

.table-wrap{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:800px
}

th{
background:#f8fafc;
text-align:left;
font-size:10px;
color:var(--m);
padding:12px;
border-bottom:1px solid var(--l);
white-space:nowrap
}

td{
padding:13px 12px;
border-bottom:1px solid var(--l);
font-size:12px;
vertical-align:middle
}

tr:last-child td{
border-bottom:0
}

.student{
font-weight:900
}

.small{
font-size:10px;
color:var(--m);
margin-top:2px
}

.amount{
font-weight:900;
color:var(--b)
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:999px;
font-size:9px;
font-weight:900
}

.status-pending{
background:#fef3c7;
color:#92400e
}

.status-approved{
background:#dcfce7;
color:#166534
}

.status-rejected{
background:#fee2e2;
color:#991b1b
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.action{
border:0;
border-radius:7px;
padding:7px 9px;
font-size:10px;
font-weight:900;
cursor:pointer
}

.view{
background:#eff6ff;
color:var(--b)
}

.approve{
background:#dcfce7;
color:#166534
}

.reject{
background:#fee2e2;
color:#991b1b
}

.action:disabled{
opacity:.5;
cursor:not-allowed
}

.modal{
position:fixed;
inset:0;
background:rgba(15,23,42,.65);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
border-radius:15px;
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
padding:18px
}

.modal-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.modal-title{
font-size:17px;
font-weight:900
}

.close{
border:0;
background:#f1f5f9;
border-radius:8px;
padding:7px 10px;
cursor:pointer;
font-weight:900
}

.slip{
width:100%;
border-radius:10px;
border:1px solid var(--l);
display:block;
margin-top:10px
}

.details{
background:#f8fafc;
border:1px solid var(--l);
border-radius:10px;
padding:12px;
font-size:12px;
line-height:1.8
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr
}

.toolbar{
flex-direction:column
}

select,
input,
.refresh{
width:100%
}

.title h1{
font-size:22px
}

}
</style></head><body><header>
<div class="header-inner"><div class="logo">
📚 CreateLK Academy
</div><a class="back" href="/admin.html">
← Admin Dashboard
</a></div>
</header><main class="container"><div class="title">
<h1>💳 Payment Administration</h1>
<p>Review manual bank payments and activate Premium memberships.</p>
</div><div class="stats"><div class="stat">
<div class="stat-label">PENDING</div>
<div id="pendingCount" class="stat-value pending">0</div>
</div><div class="stat">
<div class="stat-label">APPROVED</div>
<div id="approvedCount" class="stat-value approved">0</div>
</div><div class="stat">
<div class="stat-label">REJECTED</div>
<div id="rejectedCount" class="stat-value rejected">0</div>
</div></div><div class="toolbar"><select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select><input
id="search"
type="search"
placeholder="Search student...">

<button
class="refresh"
onclick="loadPayments()">
🔄 Refresh
</button>

</div><div id="loading" class="loading">
⏳ Loading payments...
</div><div id="error" class="error"></div><div id="empty" class="empty" style="display:none">
No payments found.
</div><div
id="tableWrap"
class="table-wrap"
style="display:none"><table><thead>
<tr>
<th>STUDENT</th>
<th>AMOUNT</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead><tbody id="paymentRows"></tbody></table></div></main><div id="modal" class="modal"><div class="modal-box"><div class="modal-top"><div class="modal-title">
Payment Details
</div><button
class="close"
onclick="closeModal()">
✕
</button>

</div><div id="modalDetails" class="details"></div><div id="slipContainer"></div></div></div><script>

/*
==================================================
CONNECT YOUR EXISTING ADMIN PAYMENT WORKER HERE
==================================================

Replace this URL with the Worker that already
handles your payment approval/admin API.

Do NOT create another Worker just for this page.
==================================================
*/

const ADMIN_API =
"https://YOUR-EXISTING-ADMIN-WORKER.workers.dev";


const ADMIN_KEY =
"YOUR_ADMIN_KEY";


let payments = [];


const $ =
id => document.getElementById(id);


function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function statusName(payment){

return String(
payment.status ||
payment.payment_status ||
payment.paymentStatus ||
"PENDING"
)
.toUpperCase();

}


function studentName(payment){

return (
payment.student_name ||
payment.name ||
payment.full_name ||
(
(payment.first_name || "") +
" " +
(payment.last_name || "")
).trim() ||
"Unknown Student"
);

}


function studentId(payment){

return (
payment.student_id ||
payment.studentId ||
payment.student ||
"-"
);

}


function amount(payment){

return (
payment.amount ||
payment.payment_amount ||
"499"
);

}


function dateValue(payment){

return (
payment.created_at ||
payment.createdAt ||
payment.date ||
payment.payment_date ||
"-"
);

}


function slipUrl(payment){

return (
payment.slip_url ||
payment.slipUrl ||
payment.receipt_url ||
payment.receiptUrl ||
payment.file_url ||
payment.fileUrl ||
""
);

}


function updateStats(){

let pending = 0;
let approved = 0;
let rejected = 0;

payments.forEach(p => {

const s = statusName(p);

if(s === "PENDING")
pending++;

else if(
s === "APPROVED" ||
s === "ACTIVE"
)
approved++;

else if(s === "REJECTED")
rejected++;

});

$("pendingCount").textContent = pending;
$("approvedCount").textContent = approved;
$("rejectedCount").textContent = rejected;

}


function render(){

const filter =
$("filter").value;

const search =
$("search").value
.trim()
.toLowerCase();

const list =
payments.filter(p => {

const status =
statusName(p);

const matchesFilter =
filter === "ALL" ||
status === filter ||
(
filter === "APPROVED" &&
status === "ACTIVE"
);

const name =
studentName(p).toLowerCase();

const sid =
String(studentId(p)).toLowerCase();

const matchesSearch =
!search ||
name.includes(search) ||
sid.includes(search);

return matchesFilter && matchesSearch;

});


$("paymentRows").innerHTML = "";

if(!list.length){

$("tableWrap").style.display = "none";
$("empty").style.display = "block";

return;

}

$("empty").style.display = "none";
$("tableWrap").style.display = "block";


list.forEach(payment => {

const tr =
document.createElement("tr");

const status =
statusName(payment);

const pending =
status === "PENDING";


let statusClass =
"status-pending";

if(
status === "APPROVED" ||
status === "ACTIVE"
)
statusClass =
"status-approved";

if(status === "REJECTED")
statusClass =
"status-rejected";


tr.innerHTML = `

<td>

<div class="student">
${esc(studentName(payment))}
</div>

<div class="small">
Student ID: ${esc(studentId(payment))}
</div>

</td>

<td>
<div class="amount">
LKR ${esc(amount(payment))}
</div>
</td>

<td>
${esc(dateValue(payment))}
</td>

<td>
<span class="status ${statusClass}">
${esc(status)}
</span>
</td>

<td>

<div class="actions">

<button
class="action view"
onclick='viewPayment(${JSON.stringify(payment)})'>
👁 View
</button>

<button
class="action approve"
${pending ? "" : "disabled"}
onclick='approvePayment(${JSON.stringify(payment)})'>
✓ Approve
</button>

<button
class="action reject"
${pending ? "" : "disabled"}
onclick='rejectPayment(${JSON.stringify(payment)})'>
✕ Reject
</button>

</div>

</td>

`;

$("paymentRows").appendChild(tr);

});

}


async function api(path,options={}){

const headers = {

"Content-Type":"application/json",

"X-Admin-Key":ADMIN_KEY,

...(options.headers || {})

};

const response =
await fetch(
ADMIN_API + path,
{
...options,
headers
}
);

const text =
await response.text();

let data;

try{
data = JSON.parse(text);
}catch{
data = {raw:text};
}

if(!response.ok){

throw new Error(
data.message ||
data.error ||
"Request failed."
);

}

return data;

}


async function loadPayments(){

$("loading").style.display = "block";
$("error").style.display = "none";
$("tableWrap").style.display = "none";
$("empty").style.display = "none";


try{

/*
Expected response examples:

[
 {...},
 {...}
]

or:

{
 payments:[...]
}

or:

{
 data:[...]
}
*/

const data =
await api("/api/payments");


payments =
Array.isArray(data)
? data
: (
data.payments ||
data.data ||
[]
);

updateStats();
render();

}catch(error){

console.error(error);

$("error").textContent =
"⚠️ " + error.message;

$("error").style.display =
"block";

}

$("loading").style.display =
"none";

}


function viewPayment(payment){

const slip =
slipUrl(payment);


$("modalDetails").innerHTML = `

<strong>Student:</strong>
${esc(studentName(payment))}<br>

<strong>Student ID:</strong>
${esc(studentId(payment))}<br>

<strong>Amount:</strong>
LKR ${esc(amount(payment))}<br>

<strong>Date:</strong>
${esc(dateValue(payment))}<br>

<strong>Status:</strong>
${esc(statusName(payment))}

`;


if(slip){

$("slipContainer").innerHTML = `

<img
class="slip"
src="${esc(slip)}"
alt="Payment Slip"
onerror="this.outerHTML='<p style=&quot;margin-top:12px;color:#991b1b;font-size:12px&quot;>Unable to display the payment slip.</p>'">

`;

}else{

$("slipContainer").innerHTML = `

<p style="
margin-top:12px;
font-size:12px;
color:#64748b">
No payment slip URL was provided.
</p>

`;

}


$("modal").classList.add("show");

}


function closeModal(){

$("modal").classList.remove("show");

}


async function approvePayment(payment){

if(
!confirm(
"Approve this payment and activate Premium?"
)
)
return;


try{

await api(
"/api/payments/" +
encodeURIComponent(
payment.id ||
payment.payment_id
) +
"/approve",
{
method:"POST"
}
);

alert(
"Payment approved. Premium should now be activated."
);

await loadPayments();

}catch(error){

console.error(error);

alert(
"Unable to approve payment: " +
error.message
);

}

}


async function rejectPayment(payment){

if(
!confirm(
"Reject this payment?"
)
)
return;


try{

await api(
"/api/payments/" +
encodeURIComponent(
payment.id ||
payment.payment_id
) +
"/reject",
{
method:"POST"
}
);

alert(
"Payment rejected."
);

await loadPayments();

}catch(error){

console.error(error);

alert(
"Unable to reject payment: " +
error.message
);

}

}


$("filter").addEventListener(
"change",
render
);

$("search").addEventListener(
"input",
render
);


$("modal").addEventListener(
"click",
event => {

if(event.target === $("modal"))
closeModal();

}
);


loadPayments();

</script></body>
</html>
