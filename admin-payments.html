<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy</title><style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#155eef;
--b2:#104dcc;
--g:#16a34a;
--r:#dc2626;
--o:#d97706;
--d:#172033;
--m:#667085;
--bg:#f6f8fc;
--l:#e4e7ec;
--white:#fff
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--d);
min-height:100vh
}

button,input,select{font:inherit}

.header{
background:linear-gradient(135deg,var(--b),var(--b2));
color:#fff;
padding:16px
}

.header-inner{
max-width:1050px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:18px;
font-weight:900
}

.back{
font-size:12px;
font-weight:800;
color:#fff
}

.container{
max-width:1050px;
margin:auto;
padding:18px 14px 35px
}

.title{
margin-bottom:18px
}

.title h1{
font-size:25px
}

.title p{
color:var(--m);
font-size:13px;
margin-top:4px
}

/* ADMIN LOGIN */

.login-box{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:15px;
margin-bottom:18px;
display:flex;
gap:8px;
align-items:center
}

.login-box input{
flex:1;
min-width:0;
border:1px solid var(--l);
border-radius:8px;
padding:10px;
font-size:12px;
outline:none
}

.login-box input:focus{
border-color:var(--b)
}

.login-btn{
border:0;
border-radius:8px;
background:var(--b);
color:#fff;
padding:10px 15px;
font-size:12px;
font-weight:900;
cursor:pointer
}

.login-status{
font-size:11px;
color:var(--m);
margin-left:3px
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px
}

.stat{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:15px
}

.stat-label{
font-size:11px;
color:var(--m);
font-weight:800
}

.stat-value{
font-size:25px;
font-weight:900;
margin-top:4px
}

.pending{color:var(--o)}
.approved{color:var(--g)}
.rejected{color:var(--r)}

/* TOOLBAR */

.toolbar{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:12px;
display:flex;
gap:8px;
margin-bottom:14px
}

select,input{
border:1px solid var(--l);
border-radius:8px;
padding:10px;
font-size:12px;
background:#fff;
outline:none
}

select{min-width:130px}

.toolbar input{
flex:1;
min-width:150px
}

.refresh{
border:0;
border-radius:8px;
background:var(--b);
color:#fff;
padding:10px 14px;
font-size:12px;
font-weight:800;
cursor:pointer
}

/* MESSAGES */

.loading,
.empty,
.error{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:25px;
text-align:center;
font-size:13px;
color:var(--m)
}

.error{
display:none;
background:#fef2f2;
border-color:#fecaca;
color:#991b1b
}

/* TABLE */

.table-wrap{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
overflow:auto;
display:none
}

table{
width:100%;
border-collapse:collapse;
min-width:850px
}

th{
background:#f8fafc;
text-align:left;
font-size:10px;
color:var(--m);
padding:12px;
border-bottom:1px solid var(--l);
white-space:nowrap
}

td{
padding:13px 12px;
border-bottom:1px solid var(--l);
font-size:12px;
vertical-align:middle
}

tr:last-child td{
border-bottom:0
}

.student{
font-weight:900
}

.small{
font-size:10px;
color:var(--m);
margin-top:2px
}

.amount{
font-weight:900;
color:var(--b)
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:999px;
font-size:9px;
font-weight:900
}

.status-pending{
background:#fef3c7;
color:#92400e
}

.status-approved{
background:#dcfce7;
color:#166534
}

.status-rejected{
background:#fee2e2;
color:#991b1b
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.action{
border:0;
border-radius:7px;
padding:7px 9px;
font-size:10px;
font-weight:900;
cursor:pointer
}

.view{
background:#eff6ff;
color:var(--b)
}

.approve{
background:#dcfce7;
color:#166534
}

.reject{
background:#fee2e2;
color:#991b1b
}

.action:disabled{
opacity:.5;
cursor:not-allowed
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(15,23,42,.65);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
border-radius:15px;
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
padding:18px
}

.modal-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.modal-title{
font-size:17px;
font-weight:900
}

.close{
border:0;
background:#f1f5f9;
border-radius:8px;
padding:7px 10px;
cursor:pointer;
font-weight:900
}

.slip{
width:100%;
max-height:65vh;
object-fit:contain;
border-radius:10px;
border:1px solid var(--l);
display:block;
margin-top:10px
}

.details{
background:#f8fafc;
border:1px solid var(--l);
border-radius:10px;
padding:12px;
font-size:12px;
line-height:1.8
}

.modal-actions{
display:flex;
gap:8px;
margin-top:12px
}

.modal-actions button{
flex:1;
border:0;
border-radius:9px;
padding:11px;
font-size:12px;
font-weight:900;
cursor:pointer
}

.modal-approve{
background:#dcfce7;
color:#166534
}

.modal-reject{
background:#fee2e2;
color:#991b1b
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr
}

.login-box{
flex-direction:column;
align-items:stretch
}

.login-box input,
.login-btn{
width:100%
}

.toolbar{
flex-direction:column
}

select,
.toolbar input,
.refresh{
width:100%
}

.title h1{
font-size:22px
}

}
</style></head><body><header>
<div class="header-inner"><div class="logo">
📚 CreateLK Academy
</div><a class="back" href="/admin.html">
← Admin Dashboard
</a></div>
</header><main class="container"><div class="title"><h1>💳 Payment Administration</h1><p>
Review manual bank payments and activate Premium memberships.
</p></div><!-- ADMIN PASSWORD --><div class="login-box"><input
id="adminPassword"
type="password"
placeholder="Enter admin password"
autocomplete="current-password">

<button
class="login-btn"
onclick="loginAdmin()">
🔐 Admin Login
</button>

<div
id="loginStatus"
class="login-status">
Not authenticated
</div></div><!-- STATS --><div class="stats"><div class="stat"><div class="stat-label">
PENDING
</div><div
id="pendingCount"
class="stat-value pending">
0
</div></div><div class="stat"><div class="stat-label">
APPROVED
</div><div
id="approvedCount"
class="stat-value approved">
0
</div></div><div class="stat"><div class="stat-label">
REJECTED
</div><div
id="rejectedCount"
class="stat-value rejected">
0
</div></div></div><!-- TOOLBAR --><div class="toolbar"><select id="filter"><option value="ALL">
All Payments
</option><option value="PENDING">
Pending
</option><option value="APPROVED">
Approved
</option><option value="REJECTED">
Rejected
</option></select><input
id="search"
type="search"
placeholder="Search student or ID...">

<button
class="refresh"
onclick="loadPayments()">
🔄 Refresh
</button>

</div><div
id="loading"
class="loading"
style="display:none">
⏳ Loading payments...
</div><div
id="error"
class="error">
</div><div
id="empty"
class="empty"
style="display:none">
No payments found.
</div><div
id="tableWrap"
class="table-wrap"><table><thead><tr><th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th></tr></thead><tbody id="paymentRows"></tbody></table></div></main><!-- MODAL --><div
id="modal"
class="modal"><div class="modal-box"><div class="modal-top"><div class="modal-title">
Payment Details
</div><button
class="close"
onclick="closeModal()">
✕
</button>

</div><div
id="modalDetails"
class="details">
</div><div id="slipContainer">
</div><div
id="modalActions"
class="modal-actions"
style="display:none"><button
class="modal-approve"
onclick="approveCurrent()">
✓ Approve & Activate
</button>

<button
class="modal-reject"
onclick="rejectCurrent()">
✕ Reject
</button>

</div></div></div><script>

const API =
"https://createlk-bank-payments.createlk.workers.dev";

const PASSWORD_KEY =
"createlk_admin_password";

let payments = [];

let currentPayment = null;


const $ =
id => document.getElementById(id);


/* =========================
   ADMIN PASSWORD
========================= */

function getPassword(){

return sessionStorage.getItem(
PASSWORD_KEY
) || "";

}


function loginAdmin(){

const password =
$("adminPassword").value.trim();

if(!password){

$("loginStatus").textContent =
"Enter admin password.";

return;

}

sessionStorage.setItem(
PASSWORD_KEY,
password
);

$("loginStatus").textContent =
"🔄 Checking...";

loadPayments(true);

}


function logoutAdmin(){

sessionStorage.removeItem(
PASSWORD_KEY
);

$("loginStatus").textContent =
"Not authenticated";

payments = [];

render();

}


/* =========================
   API
========================= */

async function api(
path,
options={}
){

const password =
getPassword();

if(!password){

throw new Error(
"Please enter the admin password."
);

}


const headers = {

"X-Admin-Password":
password,

...(options.headers || {})

};


/*
Do not send Content-Type for
GET requests unless needed.
*/

if(
options.body &&
!headers["Content-Type"]
){

headers["Content-Type"] =
"application/json";

}


const response =
await fetch(
API + path,
{
...options,
headers
}
);


const text =
await response.text();

let data = {};

try{

data =
JSON.parse(text);

}catch{

data = {
message:text
};

}


if(!response.ok){

throw new Error(
data.message ||
data.error ||
`Request failed (${response.status})`
);

}


return data;

}


/* =========================
   LOAD PAYMENTS
========================= */

async function loadPayments(
fromLogin=false
){

$("loading").style.display =
"block";

$("error").style.display =
"none";

$("tableWrap").style.display =
"none";

$("empty").style.display =
"none";


try{

const data =
await api(
"/api/admin/payments"
);


payments =
Array.isArray(data)
? data
: (
data.payments ||
data.data ||
[]
);


$("loginStatus").textContent =
"✓ Authenticated";

updateStats();

render();


}catch(error){

console.error(error);

$("error").textContent =
"⚠️ " +
(error.message ||
"Unable to load payments.");

$("error").style.display =
"block";


if(
error.message.includes(
"Unauthorized"
) ||
error.message.includes(
"password"
)
){

$("loginStatus").textContent =
"❌ Authentication failed";

}

}


$("loading").style.display =
"none";

}


/* =========================
   STATS
========================= */

function updateStats(){

let pending = 0;
let approved = 0;
let rejected = 0;


payments.forEach(p=>{

const s =
statusName(p);


if(s === "PENDING")
pending++;

else if(
s === "APPROVED" ||
s === "ACTIVE"
)
approved++;

else if(s === "REJECTED")
rejected++;

});


$("pendingCount").textContent =
pending;

$("approvedCount").textContent =
approved;

$("rejectedCount").textContent =
rejected;

}


/* =========================
   HELPERS
========================= */

function statusName(p){

return String(
p.status ||
"PENDING"
).toUpperCase();

}


function studentName(p){

return p.student_name ||
p.name ||
"Unknown Student";

}


function studentId(p){

return p.student_id ||
"-";

}


function phone(p){

return p.phone ||
"-";

}


function amount(p){

return p.amount ||
999;

}


function dateValue(p){

return p.created_at ||
"-";

}


function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   RENDER
========================= */

function render(){

const filter =
$("filter").value;

const search =
$("search").value
.trim()
.toLowerCase();


const list =
payments.filter(p=>{

const status =
statusName(p);

const filterMatch =
filter === "ALL" ||
status === filter ||
(
filter === "APPROVED" &&
status === "ACTIVE"
);


const name =
studentName(p)
.toLowerCase();

const id =
String(studentId(p))
.toLowerCase();

const phoneNumber =
phone(p)
.toLowerCase();


const searchMatch =
!search ||
name.includes(search) ||
id.includes(search) ||
phoneNumber.includes(search);


return filterMatch &&
searchMatch;

});


$("paymentRows").innerHTML =
"";


if(!list.length){

$("tableWrap").style.display =
"none";

$("empty").style.display =
"block";

return;

}


$("empty").style.display =
"none";

$("tableWrap").style.display =
"block";


list.forEach(p=>{

const tr =
document.createElement("tr");

const status =
statusName(p);

const pending =
status === "PENDING";


let statusClass =
"status-pending";


if(
status === "APPROVED" ||
status === "ACTIVE"
)
statusClass =
"status-approved";


if(status === "REJECTED")
statusClass =
"status-rejected";


tr.innerHTML = `

<td>

<div class="student">
${esc(studentName(p))}
</div>

<div class="small">
Student ID: ${esc(studentId(p))}
</div>

</td>


<td>
${esc(phone(p))}
</td>


<td>

<div class="amount">
LKR ${esc(amount(p))}
</div>

</td>


<td>
${esc(dateValue(p))}
</td>


<td>

<span class="status ${statusClass}">
${esc(status)}
</span>

</td>


<td>

<div class="actions">

<button
class="action view"
type="button">
👁 View
</button>


<button
class="action approve"
type="button"
${pending ? "" : "disabled"}>
✓ Approve
</button>


<button
class="action reject"
type="button"
${pending ? "" : "disabled"}>
✕ Reject
</button>

</div>

</td>

`;


const buttons =
tr.querySelectorAll("button");


buttons[0].onclick =
()=>viewPayment(p);

buttons[1].onclick =
()=>approvePayment(p);

buttons[2].onclick =
()=>rejectPayment(p);


$("paymentRows")
.appendChild(tr);

});

}


/* =========================
   VIEW PAYMENT
========================= */

async function viewPayment(payment){

currentPayment =
payment;


$("modalDetails").innerHTML = `

<strong>Student:</strong>
${esc(studentName(payment))}<br>

<strong>Student ID:</strong>
${esc(studentId(payment))}<br>

<strong>Phone:</strong>
${esc(phone(payment))}<br>

<strong>Amount:</strong>
LKR ${esc(amount(payment))}<br>

<strong>Date:</strong>
${esc(dateValue(payment))}<br>

<strong>Status:</strong>
${esc(statusName(payment))}

`;


$("slipContainer").innerHTML = `

<div style="
text-align:center;
padding:18px;
font-size:12px;
color:#667085">
⏳ Loading payment slip...
</div>

`;


$("modal").classList.add("show");


const pending =
statusName(payment) === "PENDING";


$("modalActions").style.display =
pending ? "flex" : "none";


try{

const password =
getPassword();


const response =
await fetch(
API +
"/api/admin/slip?id=" +
encodeURIComponent(payment.id),
{
headers:{
"X-Admin-Password":
password
}
}
);


if(!response.ok){

const text =
await response.text();

let message =
"Unable to load payment slip.";

try{

const data =
JSON.parse(text);

message =
data.message ||
message;

}catch{}

throw new Error(message);

}


const contentType =
response.headers.get(
"content-type"
) || "";


if(
contentType.includes(
"application/pdf"
)
){

const blob =
await response.blob();

const url =
URL.createObjectURL(blob);


$("slipContainer").innerHTML = `

<iframe
src="${url}"
style="
width:100%;
height:65vh;
border:1px solid #e4e7ec;
border-radius:10px;
margin-top:10px">
</iframe>

`;

}else{

const blob =
await response.blob();

const url =
URL.createObjectURL(blob);


$("slipContainer").innerHTML = `

<img
class="slip"
src="${url}"
alt="Payment Slip">

`;

}

}catch(error){

console.error(error);

$("slipContainer").innerHTML = `

<div style="
margin-top:12px;
background:#fef2f2;
border:1px solid #fecaca;
border-radius:10px;
padding:13px;
color:#991b1b;
font-size:12px;
text-align:center">

⚠️ ${esc(error.message)}

</div>

`;

}

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

$("modal").classList.remove("show");

currentPayment =
null;

}


$("modal").addEventListener(
"click",
function(e){

if(e.target === $("modal")){
closeModal();
}

}
);


/* =========================
   APPROVE
========================= */

async function approvePayment(
payment
){

if(
statusName(payment) !==
"PENDING"
)
return;


if(
!confirm(
"Approve this payment and activate Premium for 30 days?"
)
)
return;


try{

await api(
"/api/admin/approve",
{
method:"POST",
body:JSON.stringify({
payment_id:
Number(payment.id),
admin_note:
"Approved by administrator"
})
}
);


alert(
"✓ Payment approved. Premium activated for 30 days."
);


closeModal();

await loadPayments();


}catch(error){

console.error(error);

alert(
"⚠️ Unable to approve payment:\n" +
error.message
);

}

}


/* =========================
   REJECT
========================= */

async function rejectPayment(
payment
){

if(
statusName(payment) !==
"PENDING"
)
return;


const note =
prompt(
"Enter rejection reason:",
"Payment slip could not be verified."
);


if(note === null)
return;


try{

await api(
"/api/admin/reject",
{
method:"POST",
body:JSON.stringify({
payment_id:
Number(payment.id),
admin_note:
note.trim() ||
"Payment rejected"
})
}
);


alert(
"✓ Payment rejected."
);


closeModal();

await loadPayments();


}catch(error){

console.error(error);

alert(
"⚠️ Unable to reject payment:\n" +
error.message
);

}

}


/* =========================
   MODAL BUTTONS
========================= */

function approveCurrent(){

if(currentPayment)
approvePayment(
currentPayment
);

}


function rejectCurrent(){

if(currentPayment)
rejectPayment(
currentPayment
);

}


/* =========================
   FILTER / SEARCH
========================= */

$("filter").addEventListener(
"change",
render
);

$("search").addEventListener(
"input",
render
);


/* =========================
   ENTER PASSWORD
========================= */

$("adminPassword").addEventListener(
"keydown",
function(e){

if(e.key === "Enter"){
loginAdmin();
}

});


/* =========================
   AUTO LOAD IF PASSWORD
   EXISTS IN SESSION
========================= */

if(getPassword()){

$("adminPassword").value =
getPassword();

loadPayments();

}

</script></body>
</html>
