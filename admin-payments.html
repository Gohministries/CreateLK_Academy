<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#155eef;--b2:#104dcc;--g:#16a34a;--r:#dc2626;
--o:#d97706;--d:#172033;--m:#667085;--bg:#f6f8fc;--l:#e4e7ec
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--d);
min-height:100vh
}

button,input,select{font:inherit}

header{
background:linear-gradient(135deg,var(--b),var(--b2));
color:#fff;padding:15px
}

.header{
max-width:1050px;margin:auto;
display:flex;justify-content:space-between;
align-items:center
}

.logo{font-weight:900;font-size:18px}
.back{color:#fff;font-size:12px;font-weight:800}

main{max-width:1050px;margin:auto;padding:18px 14px 35px}

h1{font-size:24px}
.subtitle{font-size:13px;color:var(--m);margin-top:4px;margin-bottom:18px}

.login,.toolbar,.stat,.message,.table{
background:#fff;border:1px solid var(--l);
border-radius:12px
}

.login{
padding:12px;display:flex;gap:8px;
margin-bottom:15px
}

input,select{
border:1px solid var(--l);
border-radius:8px;
padding:10px;
font-size:12px;
outline:0
}

.login input{flex:1}

button{
border:0;border-radius:8px;
padding:10px 14px;
font-size:12px;font-weight:800;
cursor:pointer
}

.login button,.refresh{
background:var(--b);color:#fff
}

.login-status{
font-size:11px;color:var(--m);
display:flex;align-items:center
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;margin-bottom:15px
}

.stat{padding:14px}

.label{
font-size:10px;color:var(--m);
font-weight:800
}

.value{
font-size:24px;
font-weight:900;
margin-top:4px
}

.pending{color:var(--o)}
.approved{color:var(--g)}
.rejected{color:var(--r)}

.toolbar{
padding:10px;
display:flex;
gap:8px;
margin-bottom:14px
}

.toolbar input{flex:1}

.message{
padding:25px;
text-align:center;
font-size:13px;
color:var(--m);
display:none
}

.error{
background:#fef2f2;
border-color:#fecaca;
color:#991b1b
}

.table{
overflow:auto;
display:none
}

table{
width:100%;
border-collapse:collapse;
min-width:800px
}

th{
background:#f8fafc;
font-size:10px;
color:var(--m);
text-align:left;
padding:11px;
white-space:nowrap
}

td{
font-size:12px;
padding:12px;
border-top:1px solid var(--l);
vertical-align:middle
}

.student{font-weight:900}

.small{
font-size:10px;
color:var(--m);
margin-top:2px
}

.amount{
font-weight:900;color:var(--b)
}

.status{
display:inline-block;
padding:5px 8px;
border-radius:20px;
font-size:9px;
font-weight:900
}

.s-pending{background:#fef3c7;color:#92400e}
.s-approved{background:#dcfce7;color:#166534}
.s-rejected{background:#fee2e2;color:#991b1b}

.actions{
display:flex;
gap:5px
}

.view{background:#eff6ff;color:var(--b)}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}

.action:disabled{
opacity:.4;
cursor:not-allowed
}

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:10
}

.modal.show{display:flex}

.modal-box{
background:#fff;
width:100%;
max-width:650px;
max-height:90vh;
overflow:auto;
border-radius:14px;
padding:16px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.modal-head strong{font-size:17px}

.close{
background:#f1f5f9;
color:#172033;
padding:7px 10px
}

.details{
background:#f8fafc;
border:1px solid var(--l);
border-radius:9px;
padding:12px;
font-size:12px;
line-height:1.8
}

.slip{
width:100%;
max-height:65vh;
object-fit:contain;
margin-top:10px;
border:1px solid var(--l);
border-radius:9px
}

.modal-actions{
display:flex;
gap:8px;
margin-top:10px
}

.modal-actions button{flex:1}

@media(max-width:700px){
.stats{grid-template-columns:1fr}
.login,.toolbar{flex-direction:column}
.login input,.login button,
.toolbar input,.toolbar select,.toolbar button{width:100%}
.login-status{justify-content:center}
h1{font-size:21px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<a class="back" href="/admin.html">← Admin Dashboard</a>
</div>
</header>

<main>

<h1>💳 Payment Administration</h1>
<p class="subtitle">
Review manual bank payments and activate Premium memberships.
</p>

<div class="login">
<input id="password" type="password" placeholder="Enter admin password">
<button id="login">🔐 Admin Login</button>
<span id="loginStatus" class="login-status">Not authenticated</span>
</div>

<div class="stats">

<div class="stat">
<div class="label">PENDING</div>
<div id="pending" class="value pending">0</div>
</div>

<div class="stat">
<div class="label">APPROVED</div>
<div id="approved" class="value approved">0</div>
</div>

<div class="stat">
<div class="label">REJECTED</div>
<div id="rejected" class="value rejected">0</div>
</div>

</div>

<div class="toolbar">

<select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select>

<input id="search" type="search"
placeholder="Search student or ID...">

<button id="refresh" class="refresh">🔄 Refresh</button>

</div>

<div id="loading" class="message">
⏳ Loading payments...
</div>

<div id="error" class="message error"></div>

<div id="empty" class="message">
No payments found.
</div>

<div id="table" class="table">

<table>

<thead>
<tr>
<th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>METHOD</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">
<strong>Payment Details</strong>
<button id="close" class="close">✕</button>
</div>

<div id="details" class="details"></div>

<div id="slip"></div>

<div id="modalActions" class="modal-actions">

<button id="modalApprove" class="approve">
✓ Approve & Activate
</button>

<button id="modalReject" class="reject">
✕ Reject
</button>

</div>

</div>

</div>

<script>

const API="https://createlk-bank-payments.createlk.workers.dev";
const KEY="createlk_admin_password";

let payments=[];
let current=null;

const $=id=>document.getElementById(id);

function password(){
return sessionStorage.getItem(KEY)||"";
}

async function api(path,options={}){

const pass=password();

if(!pass) throw new Error("Enter admin password.");

const headers={
"X-Admin-Password":pass
};

if(options.body)
headers["Content-Type"]="application/json";

const res=await fetch(API+path,{
...options,
headers
});

const text=await res.text();

let data={};

try{
data=text?JSON.parse(text):{};
}catch{
data={message:text};
}

if(!res.ok){

if(res.status===401||res.status===403){
sessionStorage.removeItem(KEY);
throw new Error("Invalid admin password.");
}

throw new Error(
data.message||data.error||"Request failed."
);

}

return data;
}

async function login(){

const pass=$("password").value.trim();

if(!pass){
$("loginStatus").textContent="Enter admin password.";
return;
}

sessionStorage.setItem(KEY,pass);
$("loginStatus").textContent="🔄 Checking...";

await load();
}

async function load(){

$("loading").style.display="block";
$("error").style.display="none";
$("table").style.display="none";
$("empty").style.display="none";

try{

const data=await api("/api/admin/payments");

payments=Array.isArray(data)
?data
:(data.payments||data.data||[]);

$("loginStatus").textContent="✓ Authenticated";

stats();
render();

}catch(e){

console.error(e);

$("error").textContent="⚠️ "+e.message;
$("error").style.display="block";
$("loginStatus").textContent="❌ "+e.message;

}

$("loading").style.display="none";
}

function status(p){
return String(p.status||"PENDING").toUpperCase();
}

function name(p){
return p.student_name||"Unknown Student";
}

function id(p){
return p.id||p.payment_id||"";
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function stats(){

let p=0,a=0,r=0;

payments.forEach(x=>{

const s=status(x);

if(s==="PENDING")p++;
else if(s==="APPROVED"||s==="ACTIVE")a++;
else if(s==="REJECTED")r++;

});

$("pending").textContent=p;
$("approved").textContent=a;
$("rejected").textContent=r;
}

function render(){

const filter=$("filter").value;
const search=$("search").value.trim().toLowerCase();

const list=payments.filter(p=>{

const s=status(p);

const okFilter=
filter==="ALL"||
s===filter||
(filter==="APPROVED"&&s==="ACTIVE");

const text=(
name(p)+" "+
(p.student_id||"")+" "+
(p.phone||"")
).toLowerCase();

return okFilter&&(!search||text.includes(search));
});

$("rows").innerHTML="";

if(!list.length){

$("table").style.display="none";
$("empty").style.display="block";
return;
}

$("empty").style.display="none";
$("table").style.display="block";

list.forEach(p=>{

const s=status(p);
const tr=document.createElement("tr");

let cls="s-pending";

if(s==="APPROVED"||s==="ACTIVE")
cls="s-approved";

if(s==="REJECTED")
cls="s-rejected";

const pending=s==="PENDING";

tr.innerHTML=`

<td>
<div class="student">${esc(name(p))}</div>
<div class="small">
Student ID: ${esc(p.student_id||"-")}
</div>
</td>

<td>${esc(p.phone||"-")}</td>

<td>
<div class="amount">
${esc(p.currency||"LKR")} ${esc(p.amount||0)}
</div>
</td>

<td>${esc(p.method||"Bank Transfer")}</td>

<td>${esc(p.created_at||"-")}</td>

<td>
<span class="status ${cls}">
${esc(s)}
</span>
</td>

<td>
<div class="actions">

<button class="action view">👁 View</button>

<button class="action approve"
${pending?"":"disabled"}>
✓ Approve
</button>

<button class="action reject"
${pending?"":"disabled"}>
✕ Reject
</button>

</div>
</td>
`;

const b=tr.querySelectorAll("button");

b[0].onclick=()=>view(p);
b[1].onclick=()=>approve(p);
b[2].onclick=()=>reject(p);

$("rows").appendChild(tr);
});
}

async function view(p){

current=p;

$("details").innerHTML=`
<strong>Payment ID:</strong> ${esc(id(p))}<br>
<strong>Student:</strong> ${esc(name(p))}<br>
<strong>Student ID:</strong> ${esc(p.student_id||"-")}<br>
<strong>Phone:</strong> ${esc(p.phone||"-")}<br>
<strong>Amount:</strong> ${esc(p.currency||"LKR")} ${esc(p.amount||0)}<br>
<strong>Method:</strong> ${esc(p.method||"-")}<br>
<strong>Date:</strong> ${esc(p.created_at||"-")}<br>
<strong>Status:</strong> ${esc(status(p))}<br>
<strong>Admin Note:</strong> ${esc(p.admin_note||"-")}
`;

$("slip").innerHTML="<p style='text-align:center;padding:18px;font-size:12px'>⏳ Loading slip...</p>";

$("modalActions").style.display=
status(p)==="PENDING"?"flex":"none";

$("modal").classList.add("show");

try{

const res=await fetch(
API+"/api/admin/slip?id="+encodeURIComponent(id(p)),
{
headers:{
"X-Admin-Password":password()
}
});

if(!res.ok)
throw new Error("Unable to load payment slip.");

const blob=await res.blob();
const url=URL.createObjectURL(blob);

if((res.headers.get("content-type")||"").includes("pdf")){

$("slip").innerHTML=`
<iframe src="${url}"
style="width:100%;height:65vh;border:0;margin-top:10px">
</iframe>`;

}else{

$("slip").innerHTML=`
<img class="slip" src="${url}" alt="Payment Slip">
`;

}

}catch(e){

$("slip").innerHTML=`
<div style="
margin-top:10px;
padding:12px;
border-radius:8px;
background:#fef2f2;
color:#991b1b;
font-size:12px;
text-align:center">
⚠️ ${esc(e.message)}
</div>`;
}
}

async function approve(p){

if(status(p)!=="PENDING")return;

if(!confirm("Approve this payment and activate Premium for 30 days?"))
return;

try{

await api("/api/admin/approve",{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:"Approved by administrator"
})
});

alert("✓ Payment approved and Premium activated.");
close();
load();

}catch(e){

alert("⚠️ "+e.message);
}
}

async function reject(p){

if(status(p)!=="PENDING")return;

const note=prompt(
"Enter rejection reason:",
"Payment slip could not be verified."
);

if(note===null)return;

try{

await api("/api/admin/reject",{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:note.trim()||"Payment rejected"
})
});

alert("✓ Payment rejected.");
close();
load();

}catch(e){

alert("⚠️ "+e.message);
}
}

function close(){
$("modal").classList.remove("show");
current=null;
}

$("login").onclick=login;
$("refresh").onclick=load;
$("close").onclick=close;

$("modalApprove").onclick=()=>{
if(current)approve(current);
};

$("modalReject").onclick=()=>{
if(current)reject(current);
};

$("filter").onchange=render;
$("search").oninput=render;

$("password").onkeydown=e=>{
if(e.key==="Enter")login();
};

$("modal").onclick=e=>{
if(e.target===$("modal"))close();
};

if(password()){

$("password").value=password();
load();

}

</script>

</body>
</html>
