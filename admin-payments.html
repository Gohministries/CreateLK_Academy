<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f6f8fc;
 color:#172033
}
header{
 background:#155eef;
 color:white;
 padding:16px
}
.header{
 max-width:1050px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{font-weight:900}
.back{color:white;text-decoration:none;font-size:13px}
main{
 max-width:1050px;
 margin:auto;
 padding:20px 14px
}
h1{font-size:24px;margin:0 0 5px}
.sub{color:#667085;font-size:13px;margin-bottom:18px}

.login,.toolbar,.card,.table-box,.message{
 background:white;
 border:1px solid #e4e7ec;
 border-radius:12px
}

.login{
 padding:12px;
 display:flex;
 gap:8px;
 margin-bottom:15px
}
input,select,button{
 padding:10px;
 border:1px solid #e4e7ec;
 border-radius:8px;
 font-size:12px
}
.login input{flex:1}
button{
 cursor:pointer;
 font-weight:800
}
.login button,.refresh{
 background:#155eef;
 color:white;
 border:0
}
#loginStatus{
 font-size:11px;
 display:flex;
 align-items:center;
 color:#667085
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-bottom:15px
}
.card{padding:15px}
.label{
 font-size:10px;
 font-weight:bold;
 color:#667085
}
.number{
 font-size:25px;
 font-weight:900;
 margin-top:5px
}
.p{color:#d97706}
.a{color:#16a34a}
.r{color:#dc2626}

.toolbar{
 padding:10px;
 display:flex;
 gap:8px;
 margin-bottom:15px
}
.toolbar input{flex:1}

.message{
 padding:25px;
 text-align:center;
 color:#667085;
 margin-bottom:15px
}
.error{
 display:none;
 color:#991b1b;
 background:#fef2f2;
 border-color:#fecaca
}
.empty{display:none}

.table-box{
 display:none;
 overflow:auto
}
table{
 width:100%;
 min-width:750px;
 border-collapse:collapse
}
th{
 text-align:left;
 background:#f8fafc;
 color:#667085;
 font-size:10px;
 padding:12px
}
td{
 padding:12px;
 border-top:1px solid #e4e7ec;
 font-size:12px
}
.name{font-weight:900}
.small{font-size:10px;color:#667085;margin-top:3px}
.amount{font-weight:900;color:#155eef}

.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:9px;
 font-weight:900
}
.pending{
 background:#fef3c7;
 color:#92400e
}
.approved{
 background:#dcfce7;
 color:#166534
}
.rejected{
 background:#fee2e2;
 color:#991b1b
}

.actions{
 display:flex;
 gap:5px
}
.view{
 background:#eff6ff;
 color:#155eef
}
.ok{
 background:#dcfce7;
 color:#166534
}
.no{
 background:#fee2e2;
 color:#991b1b
}
.actions button{
 border:0;
 padding:7px 9px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 align-items:center;
 justify-content:center;
 padding:15px
}
.modal.show{display:flex}
.modal-box{
 background:white;
 width:100%;
 max-width:650px;
 max-height:90vh;
 overflow:auto;
 border-radius:14px;
 padding:16px
}
.modal-head{
 display:flex;
 justify-content:space-between;
 margin-bottom:12px
}
.details{
 background:#f8fafc;
 padding:12px;
 border-radius:9px;
 font-size:12px;
 line-height:1.8
}
.slip{
 width:100%;
 max-height:65vh;
 object-fit:contain;
 margin-top:10px
}
.modal-actions{
 display:flex;
 gap:8px;
 margin-top:10px
}
.modal-actions button{flex:1}

@media(max-width:700px){
 .stats{grid-template-columns:1fr}
 .login,.toolbar{flex-direction:column}
 .login input,.login button,
 .toolbar input,.toolbar select,
 .toolbar button{width:100%}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<a class="back" href="/admin.html">← Admin Dashboard</a>
</div>
</header>

<main>

<h1>💳 Payment Administration</h1>
<div class="sub">
Review manual bank payments and activate Premium memberships.
</div>

<div class="login">
<input id="password" type="password" placeholder="Enter admin password">
<button id="loginBtn">🔐 Admin Login</button>
<div id="loginStatus">Not authenticated</div>
</div>

<div class="stats">

<div class="card">
<div class="label">PENDING</div>
<div id="pending" class="number p">0</div>
</div>

<div class="card">
<div class="label">APPROVED</div>
<div id="approved" class="number a">0</div>
</div>

<div class="card">
<div class="label">REJECTED</div>
<div id="rejected" class="number r">0</div>
</div>

</div>

<div class="toolbar">

<select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select>

<input id="search" placeholder="Search student or ID...">

<button id="refresh" class="refresh">🔄 Refresh</button>

</div>

<div id="loading" class="message">
⏳ Loading payments...
</div>

<div id="error" class="message error"></div>

<div id="empty" class="message">
No payments found.
</div>

<div id="tableBox" class="table-box">

<table>

<thead>
<tr>
<th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>METHOD</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">
<strong>Payment Details</strong>
<button id="close">✕</button>
</div>

<div id="details" class="details"></div>

<div id="slip"></div>

<div id="modalActions" class="modal-actions">
<button id="approveBtn" class="ok">
✓ Approve & Activate
</button>
<button id="rejectBtn" class="no">
✕ Reject
</button>
</div>

</div>
</div>

<script>

const API =
"https://createlk-bank-payments.createlk.workers.dev";

const KEY =
"createlk_admin_password";

let payments=[];
let current=null;

const $=id=>document.getElementById(id);

function getPassword(){
 return sessionStorage.getItem(KEY)||"";
}

async function request(path,options={}){

 const pass=getPassword();

 if(!pass)
  throw new Error("Enter admin password.");

 const headers={
  "X-Admin-Password":pass
 };

 if(options.body)
  headers["Content-Type"]="application/json";

 const response=await fetch(API+path,{
  ...options,
  headers:headers
 });

 const text=await response.text();

 let data={};

 try{
  data=text?JSON.parse(text):{};
 }catch{
  data={message:text};
 }

 if(!response.ok){

  if(response.status===401||response.status===403){
   sessionStorage.removeItem(KEY);
   throw new Error("Invalid admin password.");
  }

  throw new Error(
   data.message||
   data.error||
   "Request failed: "+response.status
  );
 }

 return data;
}

async function login(){

 const pass=$("password").value.trim();

 if(!pass){
  $("loginStatus").textContent="Enter admin password.";
  return;
 }

 sessionStorage.setItem(KEY,pass);

 await loadPayments();
}

async function loadPayments(){

 $("loading").style.display="block";
 $("error").style.display="none";
 $("empty").style.display="none";
 $("tableBox").style.display="none";

 try{

  const data=
   await request("/api/admin/payments");

  payments=
   Array.isArray(data)
   ?data
   :(data.payments||data.data||[]);

  $("loginStatus").textContent="✓ Authenticated";

  updateStats();
  render();

 }catch(error){

  console.error(error);

  $("error").textContent="⚠️ "+error.message;
  $("error").style.display="block";
  $("loginStatus").textContent="❌ "+error.message;

 }

 $("loading").style.display="none";
}

function getStatus(p){
 return String(p.status||"PENDING").toUpperCase();
}

function esc(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function updateStats(){

 let p=0,a=0,r=0;

 payments.forEach(x=>{

  const s=getStatus(x);

  if(s==="PENDING")p++;
  else if(s==="APPROVED"||s==="ACTIVE")a++;
  else if(s==="REJECTED")r++;

 });

 $("pending").textContent=p;
 $("approved").textContent=a;
 $("rejected").textContent=r;
}

function render(){

 const filter=$("filter").value;
 const search=$("search").value.toLowerCase().trim();

 const list=payments.filter(p=>{

  const s=getStatus(p);

  const filterOK=
   filter==="ALL"||
   s===filter||
   (filter==="APPROVED"&&s==="ACTIVE");

  const text=(
   p.student_name||""+
   " "+(p.student_id||"")+
   " "+(p.phone||"")
  ).toLowerCase();

  return filterOK&&(!search||text.includes(search));
 });

 $("rows").innerHTML="";

 if(!list.length){
  $("empty").style.display="block";
  return;
 }

 $("tableBox").style.display="block";

 list.forEach(p=>{

  const s=getStatus(p);
  const pending=s==="PENDING";

  let cls="pending";

  if(s==="APPROVED"||s==="ACTIVE")
   cls="approved";

  if(s==="REJECTED")
   cls="rejected";

  const tr=document.createElement("tr");

  tr.innerHTML=`

  <td>
   <div class="name">
   ${esc(p.student_name||"Unknown Student")}
   </div>
   <div class="small">
   Student ID: ${esc(p.student_id||"-")}
   </div>
  </td>

  <td>${esc(p.phone||"-")}</td>

  <td>
   <div class="amount">
   ${esc(p.currency||"LKR")} ${esc(p.amount||0)}
   </div>
  </td>

  <td>${esc(p.method||"Bank Transfer")}</td>

  <td>${esc(p.created_at||"-")}</td>

  <td>
   <span class="status ${cls}">
   ${esc(s)}
   </span>
  </td>

  <td>
   <div class="actions">

   <button class="view">👁 View</button>

   <button class="ok"
   ${pending?"":"disabled"}>
   ✓ Approve
   </button>

   <button class="no"
   ${pending?"":"disabled"}>
   ✕ Reject
   </button>

   </div>
  </td>
  `;

  const buttons=tr.querySelectorAll("button");

  buttons[0].onclick=()=>viewPayment(p);
  buttons[1].onclick=()=>approvePayment(p);
  buttons[2].onclick=()=>rejectPayment(p);

  $("rows").appendChild(tr);

 });
}

async function viewPayment(p){

 current=p;

 $("details").innerHTML=`
 <strong>Payment ID:</strong> ${esc(p.id)}<br>
 <strong>Student:</strong> ${esc(p.student_name||"-")}<br>
 <strong>Student ID:</strong> ${esc(p.student_id||"-")}<br>
 <strong>Phone:</strong> ${esc(p.phone||"-")}<br>
 <strong>Amount:</strong> ${esc(p.currency||"LKR")} ${esc(p.amount||0)}<br>
 <strong>Method:</strong> ${esc(p.method||"-")}<br>
 <strong>Date:</strong> ${esc(p.created_at||"-")}<br>
 <strong>Status:</strong> ${esc(getStatus(p))}<br>
 <strong>Note:</strong> ${esc(p.admin_note||"-")}
 `;

 $("slip").innerHTML=
 "<div style='text-align:center;padding:15px'>⏳ Loading slip...</div>";

 $("modalActions").style.display=
  getStatus(p)==="PENDING"?"flex":"none";

 $("modal").classList.add("show");

 try{

  const response=await fetch(
   API+"/api/admin/slip?id="+encodeURIComponent(p.id),
   {
    headers:{
     "X-Admin-Password":getPassword()
    }
   }
  );

  if(!response.ok)
   throw new Error("Unable to load payment slip.");

  const blob=await response.blob();
  const url=URL.createObjectURL(blob);

  if(
   (response.headers.get("content-type")||"")
   .toLowerCase()
   .includes("pdf")
  ){

   $("slip").innerHTML=`
   <iframe src="${url}"
   style="width:100%;height:60vh;border:0;margin-top:10px">
   </iframe>`;

  }else{

   $("slip").innerHTML=
   `<img class="slip" src="${url}" alt="Payment Slip">`;

  }

 }catch(error){

  $("slip").innerHTML=
  `<div style="padding:15px;color:#991b1b;text-align:center">
  ⚠️ ${esc(error.message)}
  </div>`;

 }
}

async function approvePayment(p){

 if(getStatus(p)!=="PENDING")return;

 if(!confirm(
  "Approve this payment and activate Premium for 30 days?"
 ))return;

 try{

  await request("/api/admin/approve",{
   method:"POST",
   body:JSON.stringify({
    payment_id:Number(p.id),
    admin_note:"Approved by administrator"
   })
  });

  alert("✓ Payment approved.");

  closeModal();
  await loadPayments();

 }catch(error){

  alert("⚠️ "+error.message);

 }
}

async function rejectPayment(p){

 if(getStatus(p)!=="PENDING")return;

 const note=prompt(
  "Enter rejection reason:",
  "Payment slip could not be verified."
 );

 if(note===null)return;

 try{

  await request("/api/admin/reject",{
   method:"POST",
   body:JSON.stringify({
    payment_id:Number(p.id),
    admin_note:note.trim()||"Payment rejected"
   })
  });

  alert("✓ Payment rejected.");

  closeModal();
  await loadPayments();

 }catch(error){

  alert("⚠️ "+error.message);

 }
}

function closeModal(){
 $("modal").classList.remove("show");
 current=null;
}

$("loginBtn").onclick=login;
$("refresh").onclick=loadPayments;
$("close").onclick=closeModal;

$("approveBtn").onclick=()=>{
 if(current)approvePayment(current);
};

$("rejectBtn").onclick=()=>{
 if(current)rejectPayment(current);
};

$("filter").onchange=render;
$("search").oninput=render;

$("password").onkeydown=e=>{
 if(e.key==="Enter")login();
};

$("modal").onclick=e=>{
 if(e.target===$("modal"))closeModal();
};

if(getPassword()){
 $("password").value=getPassword();
 loadPayments();
}

</script>

</body>
</html>
