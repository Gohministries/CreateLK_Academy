<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--b:#155eef;
--b2:#104dcc;
--g:#16a34a;
--r:#dc2626;
--o:#d97706;
--d:#172033;
--m:#667085;
--bg:#f6f8fc;
--l:#e4e7ec;
--w:#fff
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--d);
min-height:100vh
}

button,input,select{font:inherit}

header{
background:linear-gradient(135deg,var(--b),var(--b2));
color:#fff;
padding:16px
}

.header{
max-width:1050px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:18px;
font-weight:900
}

.back{
color:#fff;
font-size:12px;
font-weight:800
}

.container{
max-width:1050px;
margin:auto;
padding:18px 14px 40px
}

h1{
font-size:25px
}

.subtitle{
font-size:13px;
color:var(--m);
margin-top:5px;
margin-bottom:18px
}

.login{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:14px;
display:flex;
gap:8px;
margin-bottom:18px
}

.login input{
flex:1;
padding:11px;
border:1px solid var(--l);
border-radius:8px;
outline:0
}

.login button,
.refresh{
border:0;
background:var(--b);
color:#fff;
padding:11px 15px;
border-radius:8px;
font-size:12px;
font-weight:900;
cursor:pointer
}

.login-status{
display:flex;
align-items:center;
font-size:11px;
color:var(--m)
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px
}

.stat{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:15px
}

.label{
font-size:10px;
font-weight:900;
color:var(--m)
}

.number{
font-size:25px;
font-weight:900;
margin-top:4px
}

.pending{color:var(--o)}
.approved{color:var(--g)}
.rejected{color:var(--r)}

.toolbar{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:12px;
display:flex;
gap:8px;
margin-bottom:14px
}

select,
.toolbar input{
padding:10px;
border:1px solid var(--l);
border-radius:8px;
outline:0;
font-size:12px
}

.toolbar input{
flex:1
}

.box{
background:#fff;
border:1px solid var(--l);
border-radius:13px;
padding:25px;
text-align:center;
font-size:13px;
color:var(--m)
}

.error{
display:none;
background:#fef2f2;
border-color:#fecaca;
color:#991b1b;
margin-bottom:14px
}

.empty{display:none}

.table{
display:none;
background:#fff;
border:1px solid var(--l);
border-radius:13px;
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:900px
}

th{
background:#f8fafc;
font-size:10px;
color:var(--m);
padding:12px;
text-align:left;
white-space:nowrap
}

td{
padding:12px;
font-size:12px;
border-top:1px solid var(--l)
}

.student{
font-weight:900
}

.small{
font-size:10px;
color:var(--m);
margin-top:3px
}

.amount{
font-weight:900;
color:var(--b)
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:9px;
font-weight:900
}

.s-pending{
background:#fef3c7;
color:#92400e
}

.s-approved{
background:#dcfce7;
color:#166534
}

.s-rejected{
background:#fee2e2;
color:#991b1b
}

.actions{
display:flex;
gap:5px
}

.action{
border:0;
border-radius:7px;
padding:7px 9px;
font-size:10px;
font-weight:900;
cursor:pointer
}

.view{
background:#eff6ff;
color:var(--b)
}

.approve{
background:#dcfce7;
color:#166534
}

.reject{
background:#fee2e2;
color:#991b1b
}

.action:disabled{
opacity:.4;
cursor:not-allowed
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100
}

.modal.show{
display:flex
}

.modal-box{
background:#fff;
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
border-radius:15px;
padding:18px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.modal-title{
font-weight:900;
font-size:17px
}

.close{
border:0;
background:#f1f5f9;
padding:7px 10px;
border-radius:8px;
cursor:pointer
}

.details{
background:#f8fafc;
border:1px solid var(--l);
border-radius:10px;
padding:12px;
font-size:12px;
line-height:1.8
}

.slip{
width:100%;
max-height:65vh;
object-fit:contain;
margin-top:12px;
border:1px solid var(--l);
border-radius:10px
}

.modal-actions{
display:flex;
gap:8px;
margin-top:12px
}

.modal-actions button{
flex:1;
border:0;
border-radius:9px;
padding:11px;
font-weight:900;
cursor:pointer
}

.ma{
background:#dcfce7;
color:#166534
}

.mr{
background:#fee2e2;
color:#991b1b
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr
}

.login{
flex-direction:column
}

.login input,
.login button{
width:100%
}

.login-status{
justify-content:center
}

.toolbar{
flex-direction:column
}

.toolbar>*{
width:100%
}

h1{
font-size:22px
}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<a class="back" href="/admin.html">← Admin Dashboard</a>
</div>
</header>

<main class="container">

<h1>💳 Payment Administration</h1>

<p class="subtitle">
Review bank payments and activate Premium memberships.
</p>

<div class="login">

<input
id="password"
type="password"
placeholder="Enter admin password"
autocomplete="current-password">

<button id="login">
🔐 Admin Login
</button>

<div id="loginStatus" class="login-status">
Not authenticated
</div>

</div>

<div class="stats">

<div class="stat">
<div class="label">PENDING</div>
<div id="pending" class="number pending">0</div>
</div>

<div class="stat">
<div class="label">APPROVED</div>
<div id="approved" class="number approved">0</div>
</div>

<div class="stat">
<div class="label">REJECTED</div>
<div id="rejected" class="number rejected">0</div>
</div>

</div>

<div class="toolbar">

<select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select>

<input
id="search"
type="search"
placeholder="Search student, phone or ID...">

<button id="refresh" class="refresh">
🔄 Refresh
</button>

</div>

<div id="error" class="box error"></div>

<div id="loading" class="box">
Enter your admin password to load payments.
</div>

<div id="empty" class="box empty">
No payments found.
</div>

<div id="table" class="table">

<table>

<thead>
<tr>
<th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>METHOD</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title">
Payment Details
</div>

<button id="close" class="close">
✕
</button>

</div>

<div id="details" class="details"></div>

<div id="slip"></div>

<div id="modalActions" class="modal-actions" style="display:none">

<button id="modalApprove" class="ma">
✓ Approve & Activate
</button>

<button id="modalReject" class="mr">
✕ Reject
</button>

</div>

</div>

</div>

<script>

const API =
"https://createlk-bank-payments.createlk.workers.dev";

const KEY =
"createlk_admin_password";

let payments=[];
let current=null;

const $=id=>document.getElementById(id);


/* =========================
   PASSWORD
========================= */

function password(){
return sessionStorage.getItem(KEY)||"";
}


/* =========================
   API
========================= */

async function request(
path,
options={}
){

const p=password();

if(!p)
throw new Error("Please enter the admin password.");

const headers={
"X-Admin-Password":p
};

if(options.body)
headers["Content-Type"]="application/json";

const response=await fetch(
API+path,
{
...options,
headers:{
...headers,
...(options.headers||{})
}
}
);

const text=await response.text();

let data={};

try{
data=text?JSON.parse(text):{};
}catch{
data={error:text};
}

if(!response.ok){

if(
response.status===401 ||
response.status===403
){
sessionStorage.removeItem(KEY);
throw new Error("Invalid admin password.");
}

throw new Error(
data.error ||
data.message ||
"Request failed."
);

}

return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

const p=$("password").value.trim();

if(!p){
$("loginStatus").textContent=
"Enter admin password.";
return;
}

sessionStorage.setItem(KEY,p);

$("loginStatus").textContent=
"🔄 Checking...";

await load();

}


/* =========================
   LOAD
========================= */

async function load(){

$("loading").style.display="block";
$("error").style.display="none";
$("table").style.display="none";
$("empty").style.display="none";

try{

const data=
await request("/api/admin/payments");

payments=
Array.isArray(data)
?data
:(data.payments||data.data||[]);

$("loginStatus").textContent=
"✓ Authenticated";

stats();
render();

}catch(e){

console.error(e);

$("loading").textContent=
"⚠️ "+e.message;

$("loading").style.color="#991b1b";

$("loginStatus").textContent=
"❌ Authentication failed";

}

$("loading").style.display="block";

if(payments.length){
$("loading").style.display="none";
}

}


/* =========================
   STATUS
========================= */

function status(p){
return String(
p.status||"PENDING"
).toUpperCase();
}


/* =========================
   STATS
========================= */

function stats(){

let a=0;
let b=0;
let c=0;

payments.forEach(p=>{

const s=status(p);

if(s==="PENDING")a++;

if(s==="APPROVED"||s==="ACTIVE")b++;

if(s==="REJECTED")c++;

});

$("pending").textContent=a;
$("approved").textContent=b;
$("rejected").textContent=c;

}


/* =========================
   HELPERS
========================= */

function name(p){
return p.student_name||
"Unknown Student";
}

function id(p){
return p.student_id||"-";
}

function phone(p){
return p.phone||"-";
}

function amount(p){
return p.amount??0;
}

function method(p){
return p.method||"Bank Transfer";
}

function date(p){
return p.created_at||"-";
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* =========================
   RENDER
========================= */

function render(){

const filter=$("filter").value;

const q=$("search")
.value
.trim()
.toLowerCase();

const list=payments.filter(p=>{

const s=status(p);

const filterOK=
filter==="ALL"||
s===filter||
(
filter==="APPROVED"&&
s==="ACTIVE"
);

const text=(
name(p)+" "+
id(p)+" "+
phone(p)
).toLowerCase();

return filterOK &&
(!q||text.includes(q));

});

$("rows").innerHTML="";

if(!list.length){

$("table").style.display="none";
$("empty").style.display="block";
return;

}

$("empty").style.display="none";
$("table").style.display="block";

list.forEach(p=>{

const tr=document.createElement("tr");

const s=status(p);
const pending=s==="PENDING";

let cls="s-pending";

if(s==="APPROVED"||s==="ACTIVE")
cls="s-approved";

if(s==="REJECTED")
cls="s-rejected";

tr.innerHTML=`

<td>
<div class="student">
${esc(name(p))}
</div>
<div class="small">
ID: ${esc(id(p))}
</div>
</td>

<td>${esc(phone(p))}</td>

<td>
<div class="amount">
${esc(p.currency||"LKR")}
 ${esc(amount(p))}
</div>
</td>

<td>${esc(method(p))}</td>

<td>${esc(date(p))}</td>

<td>
<span class="status ${cls}">
${esc(s)}
</span>
</td>

<td>

<div class="actions">

<button class="action view">
👁 View
</button>

<button class="action approve"
${pending?"":"disabled"}>
✓ Approve
</button>

<button class="action reject"
${pending?"":"disabled"}>
✕ Reject
</button>

</div>

</td>
`;

const buttons=
tr.querySelectorAll("button");

buttons[0].onclick=
()=>view(p);

buttons[1].onclick=
()=>approve(p);

buttons[2].onclick=
()=>reject(p);

$("rows").appendChild(tr);

});

}


/* =========================
   VIEW
========================= */

async function view(p){

current=p;

$("details").innerHTML=`

<strong>Payment ID:</strong>
${esc(p.id)}<br>

<strong>Student:</strong>
${esc(name(p))}<br>

<strong>Student ID:</strong>
${esc(id(p))}<br>

<strong>Phone:</strong>
${esc(phone(p))}<br>

<strong>Amount:</strong>
${esc(p.currency||"LKR")}
 ${esc(amount(p))}<br>

<strong>Method:</strong>
${esc(method(p))}<br>

<strong>Date:</strong>
${esc(date(p))}<br>

<strong>Status:</strong>
${esc(status(p))}<br>

<strong>Order ID:</strong>
${esc(p.order_id||"-")}<br>

<strong>Payment ID:</strong>
${esc(p.payment_id||"-")}<br>

<strong>Admin Note:</strong>
${esc(p.admin_note||"-")}

`;

$("slip").innerHTML=
"<div style='padding:15px;text-align:center'>⏳ Loading slip...</div>";

$("modal").classList.add("show");

$("modalActions").style.display=
status(p)==="PENDING"?"flex":"none";

try{

const response=
await fetch(
API+
"/api/admin/slip?id="+
encodeURIComponent(p.id),
{
headers:{
"X-Admin-Password":
password()
}
}
);

if(!response.ok){

const text=await response.text();

let d={};

try{
d=JSON.parse(text);
}catch{}

throw new Error(
d.error||
d.message||
"Unable to load slip."
);

}

const type=
(
response.headers.get("content-type")||""
).toLowerCase();

const blob=
await response.blob();

const url=
URL.createObjectURL(blob);

if(type.includes("pdf")){

$("slip").innerHTML=`

<iframe
src="${url}"
style="
width:100%;
height:65vh;
border:1px solid #e4e7ec;
border-radius:10px;
margin-top:10px">
</iframe>

`;

}else{

$("slip").innerHTML=`

<img
class="slip"
src="${url}"
alt="Payment Slip">

`;

}

}catch(e){

$("slip").innerHTML=`

<div style="
margin-top:12px;
padding:13px;
border-radius:10px;
background:#fef2f2;
color:#991b1b;
text-align:center;
font-size:12px">

⚠️ ${esc(e.message)}

</div>

`;

}

}


/* =========================
   APPROVE
========================= */

async function approve(p){

if(status(p)!=="PENDING")return;

if(!confirm(
"Approve this payment and activate Premium for 30 days?"
))return;

try{

await request(
"/api/admin/approve",
{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:
"Approved by administrator"
})
}
);

alert(
"✓ Payment approved and Premium activated."
);

close();
await load();

}catch(e){

alert(
"⚠️ "+e.message
);

}

}


/* =========================
   REJECT
========================= */

async function reject(p){

if(status(p)!=="PENDING")return;

const note=
prompt(
"Enter rejection reason:",
"Payment slip could not be verified."
);

if(note===null)return;

try{

await request(
"/api/admin/reject",
{
method:"POST",
body:JSON.stringify({
payment_id:Number(p.id),
admin_note:
note.trim()||
"Payment rejected"
})
}
);

alert("✓ Payment rejected.");

close();
await load();

}catch(e){

alert(
"⚠️ "+e.message
);

}

}


/* =========================
   EVENTS
========================= */

$("login").onclick=login;

$("refresh").onclick=load;

$("filter").onchange=render;

$("search").oninput=render;

$("password").onkeydown=e=>{
if(e.key==="Enter")login();
};

$("close").onclick=close;

$("modalApprove").onclick=()=>{
if(current)approve(current);
};

$("modalReject").onclick=()=>{
if(current)reject(current);
};

$("modal").onclick=e=>{
if(e.target===$("modal"))
close();
};


function close(){

$("modal").classList.remove("show");
current=null;

}


/* =========================
   AUTO LOGIN
========================= */

if(password()){

$("password").value=password();
load();

}

</script>

</body>
</html>
