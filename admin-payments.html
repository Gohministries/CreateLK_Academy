<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>Payment Administration | CreateLK Academy">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:16px}
.header,main{max-width:1100px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:bold}
.back{color:#fff;text-decoration:none;font-size:13px}
main{padding:20px 14px}
h1{margin:0;font-size:24px}
.sub{color:#667085;font-size:13px;margin:6px 0 20px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:15px;margin-bottom:15px}
.login,.toolbar{display:flex;gap:8px}
input,select{border:1px solid #d0d5dd;border-radius:8px;padding:11px;font-size:13px;outline:none}
.login input,.toolbar input{flex:1}
button{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#155eef;color:#fff}
.green{background:#dcfce7;color:#166534}
.red{background:#fee2e2;color:#991b1b}
.gray{background:#f2f4f7;color:#344054}
.status{font-size:12px;margin-top:10px;color:#667085}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:15px}
.stat b{display:block;font-size:25px;margin-top:5px}
.orange{color:#d97706}.greenText{color:#16a34a}.redText{color:#dc2626}
.message{text-align:center;padding:25px;color:#667085}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px;border-radius:10px;display:none;margin-bottom:15px}
.tableWrap{overflow:auto;display:none}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#f8fafc;color:#667085;font-size:11px;text-align:left;padding:12px}
td{padding:12px;border-top:1px solid #e4e7ec;font-size:12px}
.name{font-weight:bold}.small{font-size:10px;color:#667085;margin-top:3px}
.amount{font-weight:bold;color:#155eef}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:bold}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:5px}
.actions button{padding:7px 9px;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:15px;z-index:99}
.modal.open{display:flex}
.modalBox{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:14px;padding:18px}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.details{background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:12px;font-size:12px;line-height:1.8}
.slip{width:100%;max-height:65vh;object-fit:contain;margin-top:12px;border:1px solid #e4e7ec;border-radius:8px}
.modalActions{display:flex;gap:8px;margin-top:12px}
.modalActions button{flex:1}

@media(max-width:700px){
.login,.toolbar{flex-direction:column}
.login input,.login button,.toolbar>*{width:100%}
.stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">📚 CreateLK Academy</div>
<a href="/admin.html" class="back">← Admin Dashboard</a>
</div>
</header>

<main>

<h1>💳 Payment Administration</h1>
<div class="sub">
Review bank payments and activate Premium memberships.
</div>

<div class="card">
<div class="login">

<input
id="password"
type="password"
placeholder="Enter admin password">

<button
id="loginBtn"
class="primary"
type="button">
🔐 Login
</button>

</div>

<div id="loginStatus" class="status">
Not authenticated
</div>
</div>

<div class="stats">

<div class="stat">
<div>Pending</div>
<b id="pending" class="orange">0</b>
</div>

<div class="stat">
<div>Approved</div>
<b id="approved" class="greenText">0</b>
</div>

<div class="stat">
<div>Rejected</div>
<b id="rejected" class="redText">0</b>
</div>

</div>

<br>

<div id="error" class="error"></div>

<div class="card">

<div class="toolbar">

<select id="filter">
<option value="ALL">All Payments</option>
<option value="PENDING">Pending</option>
<option value="APPROVED">Approved</option>
<option value="REJECTED">Rejected</option>
</select>

<input
id="search"
type="search"
placeholder="Search student, phone or ID">

<button
id="refresh"
class="primary"
type="button">
🔄 Refresh
</button>

</div>

</div>

<div id="message" class="card message">
Enter your admin password to load payments.
</div>

<div id="tableWrap" class="card tableWrap">

<table>

<thead>
<tr>
<th>STUDENT</th>
<th>PHONE</th>
<th>AMOUNT</th>
<th>METHOD</th>
<th>DATE</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</main>

<div id="modal" class="modal">

<div class="modalBox">

<div class="modalHead">

<b>Payment Details</b>

<button
id="close"
class="gray"
type="button">
✕
</button>

</div>

<div id="details" class="details"></div>

<div id="slip"></div>

<div id="modalActions" class="modalActions">

<button
id="approveBtn"
class="green"
type="button">
✓ Approve & Activate
</button>

<button
id="rejectBtn"
class="red"
type="button">
✕ Reject
</button>

</div>

</div>

</div>

<script>

/* =========================
   CORRECT WORKER
========================= */

const API =
"https://createlk-premium-payments.createlk.workers.dev";

const KEY =
"createlk_admin_password";

let payments=[];
let current=null;

const $ =
id => document.getElementById(id);


/* =========================
   AUTH
========================= */

function getPassword(){

return sessionStorage.getItem(KEY)||"";

}

function setPassword(password){

sessionStorage.setItem(
KEY,
password
);

}


/* =========================
   API
========================= */

async function api(
path,
options={}
){

const password =
getPassword();

if(!password){

throw new Error(
"Please enter admin password."
);

}

const headers={
"X-Admin-Password":
password
};

if(options.body){

headers["Content-Type"]=
"application/json";

}

const response =
await fetch(
API+path,
{
method:
options.method||"GET",
headers,
body:
options.body||undefined
}
);

const text =
await response.text();

let data={};

try{

data =
text
? JSON.parse(text)
: {};

}catch{

data={
error:text
};

}

if(!response.ok){

if(
response.status===401||
response.status===403
){

sessionStorage.removeItem(
KEY
);

throw new Error(
"Invalid admin password."
);

}

throw new Error(
data.error||
data.message||
"Request failed: "+
response.status
);

}

return data;

}


/* =========================
   LOGIN
========================= */

async function login(){

const password =
$("password")
.value
.trim();

if(!password){

$("loginStatus")
.textContent=
"Please enter password.";

return;

}

setPassword(password);

$("loginStatus")
.textContent=
"Checking...";

await loadPayments();

}


/* =========================
   LOAD PAYMENTS
========================= */

async function loadPayments(){

$("error").style.display=
"none";

$("message").style.display=
"block";

$("message").textContent=
"⏳ Loading payments...";

$("tableWrap").style.display=
"none";

try{

const data =
await api(
"/api/admin/payments"
);

payments =
Array.isArray(data)
? data
: (
data.payments||
data.data||
[]
);

$("loginStatus")
.textContent=
"✓ Authenticated";

updateStats();

render();

}catch(error){

console.error(error);

$("message").style.display=
"block";

$("message").textContent=
"Unable to load payments.";

$("error").textContent=
"⚠️ "+error.message;

$("error").style.display=
"block";

$("loginStatus").textContent=
"❌ "+error.message;

}

}


/* =========================
   STATUS
========================= */

function getStatus(payment){

return String(
payment.status||
"PENDING"
)
.toUpperCase();

}


/* =========================
   STATS
========================= */

function updateStats(){

let pending=0;
let approved=0;
let rejected=0;

payments.forEach(payment=>{

const status =
getStatus(payment);

if(status==="PENDING")
pending++;

if(
status==="APPROVED"||
status==="ACTIVE"
)
approved++;

if(status==="REJECTED")
rejected++;

});

$("pending").textContent=
pending;

$("approved").textContent=
approved;

$("rejected").textContent=
rejected;

}


/* =========================
   HELPERS
========================= */

function studentName(payment){

return payment.student_name||
"Unknown Student";

}

function studentId(payment){

return payment.student_id??"-";

}

function phone(payment){

return payment.phone||"-";

}

function amount(payment){

return payment.amount??0;

}

function method(payment){

return payment.method||
"Bank Transfer";

}

function date(payment){

return payment.created_at||"-";

}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   RENDER
========================= */

function render(){

const filter =
$("filter").value;

const search =
$("search")
.value
.trim()
.toLowerCase();

const list =
payments.filter(payment=>{

const status =
getStatus(payment);

const filterOK =
filter==="ALL"||
status===filter||
(
filter==="APPROVED"&&
status==="ACTIVE"
);

const text =
(
studentName(payment)+" "+
studentId(payment)+" "+
phone(payment)
)
.toLowerCase();

return (
filterOK &&
(!search||
text.includes(search))
);

});

$("rows").innerHTML="";

if(!list.length){

$("message").style.display=
"block";

$("message").textContent=
"No payments found.";

$("tableWrap").style.display=
"none";

return;

}

$("message").style.display=
"none";

$("tableWrap").style.display=
"block";

list.forEach(payment=>{

const status =
getStatus(payment);

let badge =
"pending";

if(
status==="APPROVED"||
status==="ACTIVE"
)
badge="approved";

if(status==="REJECTED")
badge="rejected";

const tr =
document.createElement("tr");

tr.innerHTML=`

<td>
<div class="name">
${esc(studentName(payment))}
</div>
<div class="small">
Student ID: ${esc(studentId(payment))}
</div>
</td>

<td>
${esc(phone(payment))}
</td>

<td>
<div class="amount">
${esc(payment.currency||"LKR")}
 ${esc(amount(payment))}
</div>
</td>

<td>
${esc(method(payment))}
</td>

<td>
${esc(date(payment))}
</td>

<td>
<span class="badge ${badge}">
${esc(status)}
</span>
</td>

<td>

<div class="actions">

<button
class="view gray"
type="button">
👁 View
</button>

<button
class="approve green"
type="button"
${status==="PENDING"?"":"disabled"}>
✓ Approve
</button>

<button
class="reject red"
type="button"
${status==="PENDING"?"":"disabled"}>
✕ Reject
</button>

</div>

</td>
`;

const buttons =
tr.querySelectorAll("button");

buttons[0].onclick =
()=>viewPayment(payment);

buttons[1].onclick =
()=>approvePayment(payment);

buttons[2].onclick =
()=>rejectPayment(payment);

$("rows").appendChild(tr);

});

}


/* =========================
   VIEW PAYMENT
========================= */

async function viewPayment(payment){

current =
payment;

$("details").innerHTML=`

<b>Payment Record ID:</b>
${esc(payment.id)}<br>

<b>Student:</b>
${esc(studentName(payment))}<br>

<b>Student ID:</b>
${esc(studentId(payment))}<br>

<b>Phone:</b>
${esc(phone(payment))}<br>

<b>Amount:</b>
${esc(payment.currency||"LKR")}
${esc(amount(payment))}<br>

<b>Method:</b>
${esc(method(payment))}<br>

<b>Order ID:</b>
${esc(payment.order_id||"-")}<br>

<b>Payment ID:</b>
${esc(payment.payment_id||"-")}<br>

<b>Date:</b>
${esc(date(payment))}<br>

<b>Status:</b>
${esc(getStatus(payment))}<br>

<b>Admin Note:</b>
${esc(payment.admin_note||"-")}

`;

$("slip").innerHTML =
"<div class='message'>⏳ Loading payment slip...</div>";

$("modalActions").style.display =
getStatus(payment)==="PENDING"
? "flex"
: "none";

$("modal").classList.add("open");

try{

const response =
await fetch(
API+
"/api/admin/slip?id="+
encodeURIComponent(payment.id),
{
headers:{
"X-Admin-Password":
getPassword()
}
}
);

if(!response.ok){

const text =
await response.text();

let data={};

try{
data=JSON.parse(text);
}catch{}

throw new Error(
data.error||
data.message||
"Unable to load payment slip."
);

}

const type =
(
response.headers
.get("content-type")||
""
)
.toLowerCase();

const blob =
await response.blob();

const url =
URL.createObjectURL(blob);

if(type.includes("pdf")){

$("slip").innerHTML=`

<iframe
src="${url}"
style="
width:100%;
height:65vh;
border:1px solid #e4e7ec;
border-radius:8px;
margin-top:12px">
</iframe>

`;

}else{

$("slip").innerHTML=`

<img
class="slip"
src="${url}"
alt="Payment Slip">

`;

}

}catch(error){

$("slip").innerHTML=`

<div style="
margin-top:12px;
padding:12px;
background:#fef2f2;
border:1px solid #fecaca;
border-radius:8px;
color:#991b1b;
font-size:12px">

⚠️ ${esc(error.message)}

</div>

`;

}

}


/* =========================
   APPROVE
========================= */

async function approvePayment(payment){

if(
getStatus(payment)!=="PENDING"
)
return;

if(!confirm(
"Approve this payment and activate Premium for 30 days?"
))
return;

try{

await api(
"/api/admin/approve",
{
method:"POST",
body:JSON.stringify({
payment_id:
Number(payment.id),
admin_note:
"Approved by administrator"
})
}
);

alert(
"✓ Payment approved and Premium activated."
);

closeModal();

await loadPayments();

}catch(error){

alert(
"⚠️ "+error.message
);

}

}


/* =========================
   REJECT
========================= */

async function rejectPayment(payment){

if(
getStatus(payment)!=="PENDING"
)
return;

const note =
prompt(
"Enter rejection reason:",
"Payment slip could not be verified."
);

if(note===null)
return;

try{

await api(
"/api/admin/reject",
{
method:"POST",
body:JSON.stringify({
payment_id:
Number(payment.id),
admin_note:
note.trim()||
"Payment rejected"
})
}
);

alert(
"✓ Payment rejected."
);

closeModal();

await loadPayments();

}catch(error){

alert(
"⚠️ "+error.message
);

}

}


/* =========================
   CLOSE
========================= */

function closeModal(){

$("modal")
.classList.remove("open");

current=null;

}


/* =========================
   EVENTS
========================= */

$("loginBtn").onclick =
login;

$("refresh").onclick =
loadPayments;

$("filter").onchange =
render;

$("search").oninput =
render;

$("close").onclick =
closeModal;

$("approveBtn").onclick =
()=>{
if(current)
approvePayment(current);
};

$("rejectBtn").onclick =
()=>{
if(current)
rejectPayment(current);
};

$("password").onkeydown =
event=>{
if(event.key==="Enter")
login();
};

$("modal").onclick =
event=>{
if(
event.target===
$("modal")
)
closeModal();
};


/* =========================
   AUTO LOGIN
========================= */

const saved =
getPassword();

if(saved){

$("password").value =
saved;

loadPayments();

}

</script>

</body>
</html>
