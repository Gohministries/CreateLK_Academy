<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>Post an Ad | CreateLK</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182337;font:15px Arial}
header{background:#102a56;color:white;padding:16px;font-size:22px;font-weight:bold}
header span{color:#d69b16}
main{max-width:700px;margin:24px auto;padding:0 12px}
.card{background:white;padding:20px;margin-bottom:14px;border-radius:12px;border:1px solid #dce2eb}
h1,h2{color:#102a56;margin-top:0}
h1{font-size:27px}
h2{font-size:18px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}
textarea{min-height:100px}
button{padding:12px 16px;border:0;border-radius:8px;background:#102a56;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.gold{background:#d69b16;color:#102a56}
.hidden{display:none!important}
.notice{padding:12px;border-radius:8px;background:#edf3ff;margin:12px 0;overflow-wrap:anywhere}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.package{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #dce2eb;border-radius:8px;margin:8px 0}
.package input{width:auto}
.package label{flex:1;margin:0}
#photosPreview img{width:65px;height:65px;object-fit:cover;margin:5px;border-radius:6px}
small{color:#68758a}
@media(max-width:500px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><header>Create<span>LK</span></header><main>
<h1>Post an Ad</h1>
<div id="status" class="notice hidden" role="status"></div><section id="login" class="card">
<h2>Sign in</h2>
<div id="googleButton"></div>
<div id="loginMessage" class="notice hidden"></div>
</section><section id="account" class="card hidden">
<strong id="userName"></strong>
<span id="userEmail"></span>
<button type="button" id="logout" style="float:right">Sign out</button>
<div style="clear:both"></div>
</section><form id="form" class="hidden">
<section class="card">
<h2>Ad details</h2><label for="title">Title *</label>
<input id="title" required maxlength="150">

<label for="description">Description *</label>

<textarea id="description" required maxlength="2000"></textarea><div class="row">
<div>
<label for="category">Category *</label>
<select id="category" required>
<option value="">Loading...</option>
</select>
</div>
<div>
<label for="district">District *</label>
<select id="district" required>
<option value="">Loading...</option>
</select>
</div>
</div><label for="city">City *</label>
<select id="city" required disabled>

<option value="">Select district first</option>
</select>
</section><section class="card">
<h2>Contact details</h2><label for="contactName">Name</label>
<input id="contactName" maxlength="100">

<div class="row">
<div>
<label for="phone">Phone *</label>
<input id="phone" type="tel" required maxlength="30">
</div>
<div>
<label for="whatsapp">WhatsApp</label>
<input id="whatsapp" type="tel" maxlength="30">
</div>
</div>
</section><section class="card">
<h2>Photos *</h2>
<input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required>
<small>Choose 1–5 images, up to 5 MB each.</small>
<div id="photosPreview"></div>
</section><section class="card">
<h2>Package</h2><div class="package">
<input type="radio" id="pkgFree" name="package" value="FREE" checked>
<label for="pkgFree">Free Ad — LKR 0</label>
</div><div class="package">
<input type="radio" id="pkgUrgent" name="package" value="URGENT">
<label for="pkgUrgent">Urgent — LKR 500</label>
</div><div class="package">
<input type="radio" id="pkgFeatured" name="package" value="FEATURED">
<label for="pkgFeatured">Featured — LKR 500</label>
</div><div class="package">
<input type="radio" id="pkgTop" name="package" value="TOP_AD">
<label for="pkgTop">Top Ad — LKR 500</label>
</div><div class="package">
<input type="radio" id="pkgAll" name="package" value="ALL_3">
<label for="pkgAll">All 3 — LKR 1,500</label>
</div><div id="paymentBox" class="hidden">
<label for="paymentSlip">Payment slip *</label>
<input id="paymentSlip" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
<small>Upload your payment confirmation.</small>
</div>
</section><section class="card">
<p>Your ad will be reviewed before publication.</p>
<button id="submit" class="gold" type="submit" style="width:100%">Submit Ad</button>
</section>
</form>
</main><script>
"use strict";

const API="https://create-post.createlk.workers.dev";
const AUTH="https://create-public.createlk.workers.dev";
const CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";

const KEY="createlk_public_token";
const USER="createlk_public_user";
const $=id=>document.getElementById(id);

let token=localStorage.getItem(KEY)||"";
let currentUser={};
let googleInitialized=false;
let googleTimer=null;
let previewUrls=[];

function status(message){
 $("status").textContent=message;
 $("status").classList.remove("hidden");
}

function loginMessage(message){
 $("loginMessage").textContent=message;
 $("loginMessage").classList.toggle("hidden",!message);
}

async function api(base,path,options={},auth=false){
 const headers=new Headers(options.headers||{});

 if(auth){
  if(!token)throw Error("Please sign in first.");
  headers.set("Authorization","Bearer "+token);
 }

 if(options.body && !(options.body instanceof FormData)){
  headers.set("Content-Type","application/json");
 }

 let response;
 try{
  response=await fetch(base+path,{...options,headers});
 }catch{
  throw Error("Cannot connect to the server. Please check your internet connection.");
 }

 const data=await response.json().catch(()=>({}));

 if(!response.ok){
  if(response.status===401&&auth){
   signOut(false);
  }
  throw Error(data.error||data.message||"Request failed ("+response.status+")");
 }

 return data;
}

function signedIn(user){
 currentUser=user||{};

 $("login").classList.add("hidden");
 $("account").classList.remove("hidden");
 $("form").classList.remove("hidden");

 $("userName").textContent=currentUser.name||"Signed in";
 $("userEmail").textContent=currentUser.email||"";

 if(!$("contactName").value){
  $("contactName").value=currentUser.name||"";
 }

 loadOptions().catch(e=>status(e.message));
}

function signedOut(){
 $("login").classList.remove("hidden");
 $("account").classList.add("hidden");
 $("form").classList.add("hidden");
}

function signOut(show=true){
 token="";
 currentUser={};

 localStorage.removeItem(KEY);
 localStorage.removeItem(USER);

 signedOut();

 if(show)status("Signed out successfully.");
}

async function restore(){
 if(!token){
  signedOut();
  initGoogle();
  return;
 }

 try{
  const data=await api(AUTH,"/api/auth/me",{},true);
  currentUser=data.user||{};

  localStorage.setItem(USER,JSON.stringify(currentUser));
  signedIn(currentUser);
 }catch(e){
  signOut(false);
  loginMessage("Your session has expired. Please sign in again.");
  initGoogle();
 }
}

async function googleLogin(credential){
 if(!credential){
  loginMessage("Google did not return a credential. Please try again.");
  return;
 }

 loginMessage("Signing in...");

 try{
  // Correct endpoint from the create-public Worker.
  const data=await api(AUTH,"/api/auth/google",{
   method:"POST",
   body:JSON.stringify({credential})
  });

  if(!data.token){
   throw Error("The authentication server did not return a token.");
  }

  token=data.token;
  localStorage.setItem(KEY,token);

  // Validate the token against the authentication Worker.
  const check=await api(AUTH,"/api/auth/me",{},true);

  currentUser=check.user||data.user||{};
  localStorage.setItem(USER,JSON.stringify(currentUser));

  loginMessage("");
  signedIn(currentUser);
  status("Signed in successfully.");

 }catch(e){
  loginMessage(e.message||"Google sign-in failed. Please try again.");
 }
}

function initGoogle(){
 if(!window.google?.accounts?.id)return false;

 if(!googleInitialized){
  google.accounts.id.initialize({
   client_id:CLIENT_ID,
   callback:response=>googleLogin(response.credential),
   auto_select:false
  });
  googleInitialized=true;
 }

 if(!$("googleButton").hasChildNodes()){
  google.accounts.id.renderButton($("googleButton"),{
   theme:"outline",
   size:"large",
   text:"signin_with",
   shape:"rectangular",
   width:260
  });
 }

 return true;
}

function fill(select,items,label){
 select.replaceChildren();
 select.add(new Option(label,""));

 for(const item of items||[]){
  const id=item.id??item.category_id??item.district_id??item.city_id;
  const name=item.name??item.title??item.category_name??"";

  if(id!=null&&name){
   select.add(new Option(name,String(id)));
  }
 }
}

function unwrap(data,keys){
 if(Array.isArray(data))return data;
 for(const key of keys){
  if(Array.isArray(data?.[key]))return data[key];
 }
 return [];
}

async function loadOptions(){
 const [categories,districts]=await Promise.all([
  api(AUTH,"/api/categories"),
  api(AUTH,"/api/locations")
 ]);

 fill($("category"),unwrap(categories,["categories","results","data"]),"Select category");
 fill($("district"),unwrap(districts,["locations","districts","results","data"]),"Select district");
}

$("district").onchange=async()=>{
 const districtId=$("district").value;

 $("city").disabled=true;
 fill($("city"),[],"Loading cities...");

 if(!districtId){
  fill($("city"),[],"Select district first");
  return;
 }

 try{
  const data=await api(AUTH,"/api/cities?district_id="+encodeURIComponent(districtId));
  fill($("city"),unwrap(data,["cities","results","data"]),"Select city");
  $("city").disabled=false;
 }catch(e){
  fill($("city"),[],"Could not load cities");
  status(e.message);
 }
};

function packageChange(){
 const paid=document.querySelector('[name="package"]:checked').value!=="FREE";

 $("paymentBox").classList.toggle("hidden",!paid);
 $("paymentSlip").required=paid;

 if(!paid)$("paymentSlip").value="";
}

document.querySelectorAll('[name="package"]').forEach(input=>{
 input.addEventListener("change",packageChange);
});

$("photos").onchange=()=>{
 previewUrls.forEach(url=>URL.revokeObjectURL(url));
 previewUrls=[];
 $("photosPreview").replaceChildren();

 const files=[...$("photos").files];

 if(files.length<1||files.length>5||
    files.some(file=>file.size>5*1024*1024||
      !["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))){
  $("photos").value="";
  status("Select 1–5 JPG, PNG, WEBP or GIF photos, each no larger than 5 MB.");
  return;
 }

 files.forEach(file=>{
  const image=document.createElement("img");
  const url=URL.createObjectURL(file);
  previewUrls.push(url);
  image.src=url;
  image.alt=file.name;
  $("photosPreview").append(image);
 });
};

async function upload(file,purpose){
 const form=new FormData();
 form.append("file",file);
 form.append("purpose",purpose);

 const data=await api(API,"/api/upload",{
  method:"POST",
  body:form
 },true);

 if(!data.key)throw Error("Upload did not return a file key.");
 return data.key;
}

$("form").onsubmit=async event=>{
 event.preventDefault();

 if(!token){
  signedOut();
  status("Please sign in before posting.");
  return;
 }

 const files=[...$("photos").files];
 const pack=document.querySelector('[name="package"]:checked').value;
 const slip=$("paymentSlip").files[0];

 if(files.length<1||files.length>5){
  status("Please select 1–5 photos.");
  return;
 }

 if(pack!=="FREE"&&!slip){
  status("Please upload your payment slip.");
  return;
 }

 if(!$("category").value||!$("district").value||!$("city").value){
  status("Please select a category, district and city.");
  return;
 }

 $("submit").disabled=true;
 $("submit").textContent="Submitting...";

 try{
  // Check the login session.
  await api(AUTH,"/api/auth/me",{},true);

  const photos=[];
  for(const file of files){
   photos.push(await upload(file,"ad-photo"));
  }

  const paymentSlipKey=pack==="FREE"?"":await upload(slip,"payment-slip");

  const body={
   title:$("title").value.trim(),
   description:$("description").value.trim(),
   category_id:$("category").value,
   district_id:$("district").value,
   city_id:$("city").value,
   contact_name:$("contactName").value.trim(),
   phone:$("phone").value.trim(),
   whatsapp:$("whatsapp").value.trim(),
   package:pack,
   photos,
   payment_slip_key:paymentSlipKey
  };

  const data=await api(API,"/api/ads",{
   method:"POST",
   body:JSON.stringify(body)
  },true);

  status(data.message||"Your ad was submitted.");
  $("form").reset();

  previewUrls.forEach(url=>URL.revokeObjectURL(url));
  previewUrls=[];
  $("photosPreview").replaceChildren();

  packageChange();

 }catch(error){
  status(error.message||"Unable to submit your ad.");
 }finally{
  $("submit").disabled=false;
  $("submit").textContent="Submit Ad";
 }
};

$("logout").onclick=()=>{
 signOut();
 loginMessage("");
};

restore();

let attempts=0;
googleTimer=setInterval(()=>{
 attempts++;

 if(initGoogle()||attempts>=40){
  clearInterval(googleTimer);

  if(attempts>=40&&!window.google?.accounts?.id){
   loginMessage("Google Sign-In could not load. Check your internet connection and refresh.");
  }
 }
},300);
</script></body>
</html>
