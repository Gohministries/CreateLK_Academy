<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy V2 Admin</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#155eef;
color:#fff;
padding:20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

button{
cursor:pointer;
border:0;
border-radius:8px;
padding:10px 15px;
font-weight:bold;
}

.logout{
display:none;
background:#fff;
color:#155eef;
}

main{
max-width:1100px;
margin:30px auto;
padding:15px;
}

.login,
.dashboard{
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login{
max-width:400px;
margin:50px auto;
}

input{
width:100%;
height:48px;
padding:0 12px;
margin:10px 0 15px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

.loginBtn{
width:100%;
background:#155eef;
color:#fff;
}

.dashboard{
display:none;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin:25px 0;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:10px;
}

.number{
font-size:27px;
font-weight:bold;
margin-top:5px;
}

.refresh{
background:#155eef;
color:white;
margin-bottom:20px;
}

.message{
margin:15px 0;
padding:12px;
border-radius:8px;
display:none;
}

.success{
display:block;
background:#ecfdf3;
color:#027a48;
}

.error{
display:block;
background:#fff1f2;
color:#b42318;
}

.table{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:850px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
font-size:13px;
}

th{
background:#f8fafc;
}

.approve{
background:#12b76a;
color:#fff;
}

.reject{
background:#f04438;
color:#fff;
}

.view{
background:#eef4ff;
color:#155eef;
}

@media(max-width:700px){
.stats{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
📚 CreateLK Academy V2
</div>

<button
id="logout"
class="logout"
onclick="logout()">
Logout
</button>

</div>
</header>

<main>

<!-- LOGIN -->

<div
id="loginBox"
class="login">

<h2>🔐 Admin Login</h2>

<p>
CreateLK Academy V2 Administration
</p>

<input
type="password"
id="adminKey"
placeholder="Admin key">

<button
id="loginBtn"
class="loginBtn"
onclick="login()">

Login

</button>

<div
id="loginMessage"
class="message">
</div>

</div>


<!-- DASHBOARD -->

<div
id="dashboard"
class="dashboard">

<h2>
Admin Dashboard
</h2>

<p>
Student payments and affiliate payout management
</p>


<div class="stats">

<div class="stat">
Students
<div
id="students"
class="number">
0
</div>
</div>

<div class="stat">
Pending Payments
<div
id="pending"
class="number">
0
</div>
</div>

<div class="stat">
Approved Payments
<div
id="approved"
class="number">
0
</div>
</div>

</div>


<button
class="refresh"
onclick="loadPayments()">

🔄 Refresh Payments

</button>


<div
id="message"
class="message">
</div>


<div class="table">

<table>

<thead>
<tr>
<th>ID</th>
<th>Student</th>
<th>Email</th>
<th>Amount</th>
<th>Reference</th>
<th>Status</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="payments">

<tr>
<td
colspan="8"
style="text-align:center">

Loading...

</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>


<script>

/* =========================================
   WORKERS
========================================= */

const ADMIN_API =
"https://createlk-admin-v2.createlk.workers.dev";

const MEMBERSHIP_API =
"https://createlk-v2-membership.createlk.workers.dev";


let ADMIN_KEY =
sessionStorage.getItem(
"createlk_admin_key"
);


/* =========================================
   LOGIN
========================================= */

async function login(){

const key =
document
.getElementById("adminKey")
.value
.trim();


if(!key){

showLogin(
"Enter admin key.",
"error"
);

return;

}


const button =
document.getElementById(
"loginBtn"
);

button.disabled = true;

button.textContent =
"Checking...";


try{

const response =
await fetch(
ADMIN_API +
"/api/v2/admin/payments",
{

headers:{
"X-Admin-Key":key
}

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Invalid admin key."
);

}


ADMIN_KEY =
key;

sessionStorage.setItem(
"createlk_admin_key",
key
);


document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"dashboard"
).style.display =
"block";

document.getElementById(
"logout"
).style.display =
"block";


renderPayments(
data.payments || []
);


}catch(error){

showLogin(
error.message,
"error"
);

button.disabled =
false;

button.textContent =
"Login";

}

}


/* =========================================
   LOAD PAYMENTS
========================================= */

async function loadPayments(){

try{

const response =
await fetch(
ADMIN_API +
"/api/v2/admin/payments",
{

headers:{
"X-Admin-Key":
ADMIN_KEY
}

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to load payments."
);

}


renderPayments(
data.payments || []
);


}catch(error){

showMessage(
error.message,
"error"
);

}

}


/* =========================================
   RENDER
========================================= */

function renderPayments(
payments
){

const tbody =
document.getElementById(
"payments"
);

let pending = 0;
let approved = 0;

const students =
new Set();


if(!payments.length){

tbody.innerHTML = `
<tr>
<td colspan="8"
style="text-align:center;padding:30px">
No payment records found.
</td>
</tr>
`;

updateStats(
0,
0,
0
);

return;

}


payments.forEach(
p => {

const status =
String(
p.status || "PENDING"
).toUpperCase();


if(status === "PENDING")
pending++;

if(status === "APPROVED")
approved++;

if(p.student_id)
students.add(
p.student_id
);

});


updateStats(
students.size,
pending,
approved
);


tbody.innerHTML =
payments.map(
p => {

const status =
String(
p.status || "PENDING"
).toUpperCase();


const student =
(
p.first_name || ""
) +
" " +
(
p.last_name || ""
);


let action = "";


if(status === "PENDING"){

action += `
<button
class="approve"
onclick="changeStatus(
${Number(p.id)},
'APPROVED'
)">
Approve
</button>

<button
class="reject"
onclick="changeStatus(
${Number(p.id)},
'REJECTED'
)">
Reject
</button>
`;

}


if(p.receipt_key){

action += `
<button
class="view"
onclick="viewReceipt(
'${encodeURIComponent(
p.receipt_key
)}'
)">
Receipt
</button>
`;

}


return `
<tr>

<td>${esc(p.id)}</td>

<td>${esc(
student.trim()
)}</td>

<td>${esc(
p.email
)}</td>

<td>
LKR ${esc(
p.amount
)}</td>

<td>${esc(
p.payment_reference
)}</td>

<td>
${esc(status)}
</td>

<td>${esc(
p.created_at
)}</td>

<td>${action || "-"}</td>

</tr>
`;

}).join("");

}


/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
paymentId,
status
){

if(
!confirm(
"Confirm " +
status +
" payment #" +
paymentId +
"? "
)
){

return;

}


try{

const response =
await fetch(
ADMIN_API +
"/api/v2/admin/payment-status",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"X-Admin-Key":
ADMIN_KEY

},

body:JSON.stringify({

payment_id:
paymentId,

status:
status

})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to update payment."
);

}


/* =========================================
   MEMBERSHIP ACTIVATION
========================================= */

if(status === "APPROVED"){

const membershipResponse =
await fetch(
MEMBERSHIP_API +
"/api/v2/process-payment",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"X-Admin-Key":
ADMIN_KEY

},

body:JSON.stringify({

payment_id:
paymentId

})

}
);


const membership =
await membershipResponse.json();


if(
!membershipResponse.ok ||
!membership.success
){

throw new Error(
"Payment approved, but membership activation failed: " +
(
membership.message ||
"Unknown error"
)
);

}


let msg =
"✅ Payment approved. Membership activated for 30 days.";


if(
membership.commission_created
){

msg +=
" Affiliate commission: LKR " +
membership.commission_amount;

}


showMessage(
msg,
"success"
);


}else{

showMessage(
"Payment rejected.",
"success"
);

}


loadPayments();


}catch(error){

showMessage(
error.message,
"error"
);

}

}


/* =========================================
   RECEIPT
========================================= */

function viewReceipt(
key
){

window.open(
ADMIN_API +
"/api/v2/admin/receipt?key=" +
key,
"_blank"
);

}


/* =========================================
   STATS
========================================= */

function updateStats(
students,
pending,
approved
){

document.getElementById(
"students"
).textContent =
students;

document.getElementById(
"pending"
).textContent =
pending;

document.getElementById(
"approved"
).textContent =
approved;

}


/* =========================================
   MESSAGES
========================================= */

function showLogin(
text,
type
){

const box =
document.getElementById(
"loginMessage"
);

box.textContent =
text;

box.className =
"message " + type;

}


function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =========================================
   ESCAPE
========================================= */

function esc(value){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

sessionStorage.removeItem(
"createlk_admin_key"
);

location.reload();

}


/* =========================================
   EXISTING SESSION
========================================= */

async function checkSession(){

if(!ADMIN_KEY)
return;


try{

const response =
await fetch(
ADMIN_API +
"/api/v2/admin/payments",
{

headers:{
"X-Admin-Key":
ADMIN_KEY
}

}
);


const data =
await response.json();


if(
response.ok &&
data.success
){

document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"dashboard"
).style.display =
"block";

document.getElementById(
"logout"
).style.display =
"block";

renderPayments(
data.payments || []
);

}else{

sessionStorage.removeItem(
"createlk_admin_key"
);

ADMIN_KEY = "";

}

}catch(error){

console.log(error);

}

}


checkSession();

</script>

</body>
</html>
