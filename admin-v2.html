<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Payments | CreateLK Academy V2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
padding:15px
}

.container{
max-width:850px;
margin:auto
}

.header{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:20px;
margin-bottom:18px;
text-align:center
}

.logo{
font-size:21px;
font-weight:800;
color:#155eef
}

h1{
font-size:25px;
margin:10px 0 5px
}

.subtitle{
color:#667085;
font-size:14px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:20px;
margin-bottom:18px;
box-shadow:0 3px 10px rgba(0,0,0,.04)
}

input{
width:100%;
padding:14px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:15px;
margin:10px 0
}

button{
border:0;
border-radius:9px;
padding:12px 15px;
font-weight:bold;
cursor:pointer;
font-size:14px
}

.login{
width:100%;
background:#155eef;
color:white
}

.refresh{
background:#eef4ff;
color:#155eef;
margin-bottom:15px
}

.approve{
background:#16a34a;
color:white
}

.reject{
background:#dc2626;
color:white
}

.receipt{
background:#f3f4f6;
color:#344054
}

.logout{
background:#fff1f2;
color:#dc2626
}

.actions{
display:flex;
gap:8px;
margin-top:18px;
flex-wrap:wrap
}

.actions button{
flex:1;
min-width:120px
}

.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:15px;
font-size:14px;
font-weight:bold
}

.success{
background:#ecfdf3;
color:#027a48
}

.error{
background:#fff1f2;
color:#be123c
}

.payment{
border:1px solid #e5e7eb;
border-radius:14px;
padding:18px;
margin-bottom:15px;
background:#fff
}

.payment h3{
margin:0 0 15px;
font-size:17px
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #f0f2f5;
font-size:14px
}

.row:last-child{
border-bottom:0
}

.label{
color:#667085
}

.value{
font-weight:bold;
text-align:right;
word-break:break-word
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:11px
}

.pending{
background:#fff7ed;
color:#c2410c
}

.approved{
background:#ecfdf3;
color:#15803d
}

.rejected{
background:#fff1f2;
color:#be123c
}

.empty{
text-align:center;
padding:30px;
color:#667085
}

#dashboard{
display:none
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px
}

.stat{
background:#f8fafc;
border:1px solid #eaecf0;
border-radius:10px;
padding:14px;
text-align:center
}

.stat-number{
font-size:24px;
font-weight:800;
margin-top:5px
}

footer{
text-align:center;
font-size:11px;
color:#98a2b3;
padding:20px
}

@media(max-width:600px){

body{
padding:10px
}

.card{
padding:15px
}

.row{
display:block
}

.value{
text-align:left;
margin-top:3px
}

.actions{
flex-direction:column
}

.actions button{
width:100%
}

.stats{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
📚 CreateLK Academy V2
</div>

<h1>💳 Student Payments</h1>

<div class="subtitle">
View, approve or reject Premium membership payments.
</div>

</div>

<div id="message" class="message"></div>


<!-- LOGIN -->

<div id="loginCard" class="card">

<h3>🔐 Admin Access</h3>

<p class="subtitle">
Enter your CreateLK Academy V2 Admin Key.
</p>

<input
id="adminKey"
type="password"
placeholder="Enter Admin Key"
autocomplete="off"
>

<button
class="login"
id="loginButton"
onclick="login()">

🔐 Load Payments

</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div class="card">

<div class="stats">

<div class="stat">
Students
<div
id="studentsCount"
class="stat-number">
0
</div>
</div>

<div class="stat">
Pending
<div
id="pendingCount"
class="stat-number">
0
</div>
</div>

<div class="stat">
Approved
<div
id="approvedCount"
class="stat-number">
0
</div>
</div>

</div>

<button
class="refresh"
onclick="loadPayments()">
🔄 Refresh Payments
</button>

<button
class="logout"
onclick="logout()">
🚪 Logout
</button>

</div>


<div id="payments">

<div class="empty">
⏳ Loading payments...
</div>

</div>

</div>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

</div>


<script>

/* ==================================
   CREATELK ADMIN V2 WORKER
================================== */

const API =
"https://createlk-admin-v2.createlk.workers.dev";


let ADMIN_KEY = "";


/* ==================================
   MESSAGE
================================== */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message " + type;

box.style.display = "block";

}


/* ==================================
   LOGIN
================================== */

async function login(){

const key =
document.getElementById("adminKey")
.value.trim();

if(!key){

showMessage(
"Please enter your Admin Key.",
"error"
);

return;
}

ADMIN_KEY = key;

const button =
document.getElementById("loginButton");

button.disabled = true;

button.textContent =
"⏳ Checking...";


try{

/*
  Test the real V2 payment endpoint.
*/

const response =
await fetch(
API + "/api/v2/admin/payments",
{
method:"GET",
headers:{
"X-Admin-Key":ADMIN_KEY,
"Accept":"application/json"
}
}
);


const text =
await response.text();

let data;

try{

data = JSON.parse(text);

}catch(e){

throw new Error(
"Admin Worker returned an invalid response."
);

}


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"Invalid Admin Key."
);

}


if(!response.ok ||
data.success === false
){

throw new Error(
data.message ||
"Unable to load payments."
);

}


/* LOGIN SUCCESS */

document.getElementById(
"loginCard"
).style.display = "none";

document.getElementById(
"dashboard"
).style.display = "block";


renderPayments(
data.payments || []
);

showMessage(
"Payments loaded successfully.",
"success"
);


}catch(error){

ADMIN_KEY = "";

showMessage(
error.message ||
"Unable to authenticate.",
"error"
);

button.disabled = false;

button.textContent =
"🔐 Load Payments";

}

}


/* ==================================
   LOAD PAYMENTS
================================== */

async function loadPayments(){

const box =
document.getElementById("payments");

box.innerHTML =
'<div class="empty">⏳ Loading payments...</div>';


try{

const response =
await fetch(
API + "/api/v2/admin/payments",
{
method:"GET",
headers:{
"X-Admin-Key":ADMIN_KEY,
"Accept":"application/json"
}
}
);


const text =
await response.text();

let data;

try{

data = JSON.parse(text);

}catch(e){

throw new Error(
"Worker returned an invalid response."
);

}


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"Admin session expired. Please login again."
);

}


if(!response.ok ||
data.success === false
){

throw new Error(
data.message ||
"Unable to load payments."
);

}


renderPayments(
data.payments || []
);


}catch(error){

console.error(error);

box.innerHTML =
'<div class="card empty">❌ ' +
escapeHTML(error.message) +
'</div>';

}

}


/* ==================================
   RENDER
================================== */

function renderPayments(list){

const box =
document.getElementById("payments");

box.innerHTML = "";


if(
!Array.isArray(list) ||
!list.length
){

updateStats(
0,
0,
0
);

box.innerHTML =
'<div class="card empty">' +
'📭 No student payments found.' +
'</div>';

return;

}


let pending = 0;
let approved = 0;

const students = new Set();


list.forEach(payment => {

const status =
String(
payment.status || "PENDING"
).toUpperCase();


if(status === "PENDING")
pending++;

if(status === "APPROVED")
approved++;

if(payment.student_id)
students.add(
payment.student_id
);


box.appendChild(
createPaymentCard(payment)
);

});


updateStats(
students.size,
pending,
approved
);

}


/* ==================================
   PAYMENT CARD
================================== */

function createPaymentCard(p){

const card =
document.createElement("div");

card.className = "payment";


const id =
p.id || "";


const studentId =
p.student_id || "";


const name =
(
(p.first_name || "") +
" " +
(p.last_name || "")
).trim() ||
p.student_name ||
"Not available";


const email =
p.email ||
"Not available";


const phone =
p.phone ||
"Not available";


const amount =
Number(
p.amount || 1500
);


const reference =
p.payment_reference ||
p.transaction_reference ||
p.reference ||
"-";


const date =
p.created_at ||
p.payment_date ||
"-";


const status =
String(
p.status || "PENDING"
).toUpperCase();


const receiptKey =
p.receipt_key ||
"";


let statusClass =
"pending";


if(status === "APPROVED")
statusClass = "approved";


if(status === "REJECTED")
statusClass = "rejected";


let buttons = "";


/* RECEIPT */

if(receiptKey){

buttons += `
<button
class="receipt"
onclick="viewReceipt(${JSON.stringify(receiptKey)})">

👁 View Receipt

</button>
`;

}


/* APPROVE / REJECT */

if(status === "PENDING"){

buttons += `
<button
class="approve"
onclick="approvePayment(${Number(id)},this)">

✅ Approve Payment

</button>

<button
class="reject"
onclick="rejectPayment(${Number(id)},this)">

❌ Reject Payment

</button>
`;

}


card.innerHTML = `

<h3>
💳 Payment #${escapeHTML(id)}
</h3>

<div class="row">

<div class="label">
Student
</div>

<div class="value">
${escapeHTML(name)}
</div>

</div>


<div class="row">

<div class="label">
Email
</div>

<div class="value">
${escapeHTML(email)}
</div>

</div>


<div class="row">

<div class="label">
Phone
</div>

<div class="value">
${escapeHTML(phone)}
</div>

</div>


<div class="row">

<div class="label">
Student ID
</div>

<div class="value">
${escapeHTML(studentId)}
</div>

</div>


<div class="row">

<div class="label">
Amount
</div>

<div class="value">
LKR ${amount.toLocaleString()}
</div>

</div>


<div class="row">

<div class="label">
Payment Reference
</div>

<div class="value">
${escapeHTML(reference)}
</div>

</div>


<div class="row">

<div class="label">
Payment Date
</div>

<div class="value">
${escapeHTML(date)}
</div>

</div>


<div class="row">

<div class="label">
Status
</div>

<div class="value">

<span class="status ${statusClass}">

${escapeHTML(status)}

</span>

</div>

</div>


<div class="actions">

${buttons}

</div>

`;

return card;

}


/* ==================================
   RECEIPT
================================== */

function viewReceipt(key){

if(!key){

showMessage(
"Receipt is not available.",
"error"
);

return;

}


const url =
API +
"/api/v2/admin/receipt?key=" +
encodeURIComponent(key);


window.open(
url,
"_blank"
);

}


/* ==================================
   APPROVE
================================== */

async function approvePayment(
paymentId,
button
){

if(!confirm(
"Approve payment #" +
paymentId +
"?\n\nThis will mark the payment as APPROVED."
)){

return;

}


await updatePayment(
paymentId,
"APPROVED",
button
);

}


/* ==================================
   REJECT
================================== */

async function rejectPayment(
paymentId,
button
){

if(!confirm(
"Reject payment #" +
paymentId +
"?")){

return;

}


await updatePayment(
paymentId,
"REJECTED",
button
);

}


/* ==================================
   UPDATE PAYMENT
================================== */

async function updatePayment(
paymentId,
status,
button
){

button.disabled = true;

button.textContent =
"⏳ Processing...";


try{

const response =
await fetch(
API +
"/api/v2/admin/payment-status",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
ADMIN_KEY
},

body:JSON.stringify({

payment_id:
Number(paymentId),

status:
status

})

}
);


const text =
await response.text();

let data;

try{

data = JSON.parse(text);

}catch(e){

throw new Error(
"Worker returned an invalid response."
);

}


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"Invalid Admin Key."
);

}


if(
!response.ok ||
data.success === false
){

throw new Error(
data.message ||
"Unable to update payment."
);

}


showMessage(
status === "APPROVED"
?
"✅ Payment approved successfully."
:
"❌ Payment rejected successfully.",
"success"
);


await loadPayments();


}catch(error){

showMessage(
error.message ||
"Unable to update payment.",
"error"
);

button.disabled = false;

button.textContent =
status === "APPROVED"
?
"✅ Approve Payment"
:
"❌ Reject Payment";

}

}


/* ==================================
   STATS
================================== */

function updateStats(
students,
pending,
approved
){

document.getElementById(
"studentsCount"
).textContent =
students;

document.getElementById(
"pendingCount"
).textContent =
pending;

document.getElementById(
"approvedCount"
).textContent =
approved;

}


/* ==================================
   LOGOUT
================================== */

function logout(){

ADMIN_KEY = "";

document.getElementById(
"dashboard"
).style.display =
"none";

document.getElementById(
"loginCard"
).style.display =
"block";

document.getElementById(
"adminKey"
).value = "";

document.getElementById(
"payments"
).innerHTML = "";

showMessage(
"Logged out.",
"success"
);

}


/* ==================================
   ESCAPE HTML
================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================
   ENTER KEY
================================== */

document.getElementById(
"adminKey"
).addEventListener(
"keydown",
function(e){

if(e.key === "Enter"){
login();
}

});

</script>

</body>
</html>
