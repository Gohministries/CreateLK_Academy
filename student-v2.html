<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Dashboard | CreateLK Academy</title>

<meta name="description"
content="CreateLK Academy student dashboard.">

<meta name="theme-color" content="#155eef">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f8ff;
color:#172033;
min-height:100vh;
}

a{
text-decoration:none;
}

header{
background:#fff;
border-bottom:1px solid #e5e9f0;
position:sticky;
top:0;
z-index:1000;
}

.nav{
max-width:1150px;
margin:auto;
min-height:70px;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
display:flex;
align-items:center;
gap:9px;
font-size:20px;
font-weight:800;
color:#155eef;
}

.logo-icon{
width:40px;
height:40px;
border-radius:11px;
background:linear-gradient(135deg,#155eef,#4f8cff);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.logout{
border:0;
background:#fff1f2;
color:#be123c;
padding:9px 14px;
border-radius:8px;
font-size:13px;
font-weight:700;
cursor:pointer;
}

main{
max-width:1100px;
margin:auto;
padding:40px 20px 70px;
}

.welcome{
margin-bottom:28px;
}

.welcome-badge{
display:inline-block;
background:#eaf2ff;
color:#155eef;
font-size:11px;
font-weight:800;
padding:6px 10px;
border-radius:20px;
margin-bottom:10px;
}

.welcome h1{
font-size:32px;
margin-bottom:6px;
}

.welcome p{
color:#687386;
font-size:14px;
}

.profile-card{
background:#fff;
border:1px solid #e1e7f0;
border-radius:16px;
padding:24px;
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-bottom:22px;
box-shadow:0 8px 25px rgba(20,40,80,.05);
}

.profile-item{
padding:14px;
background:#f8fafc;
border-radius:10px;
}

.profile-label{
font-size:11px;
color:#7b8494;
font-weight:700;
margin-bottom:5px;
text-transform:uppercase;
}

.profile-value{
font-size:14px;
font-weight:700;
color:#172033;
word-break:break-word;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
border:1px solid #e1e7f0;
border-radius:16px;
padding:25px;
box-shadow:0 8px 25px rgba(20,40,80,.05);
}

.card-icon{
font-size:30px;
margin-bottom:13px;
}

.card h2{
font-size:19px;
margin-bottom:8px;
}

.card p{
font-size:13px;
color:#687386;
line-height:1.6;
margin-bottom:18px;
}

.status{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:800;
background:#fef3c7;
color:#92400e;
}

.status.active{
background:#dcfce7;
color:#166534;
}

.status.inactive{
background:#f1f5f9;
color:#475569;
}

.status.pending{
background:#fff7ed;
color:#9a3412;
}

.btn{
display:block;
width:100%;
padding:12px 15px;
border-radius:9px;
text-align:center;
font-size:13px;
font-weight:800;
border:0;
cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.primary:hover{
background:#0d4dcc;
}

.secondary{
background:#eef4ff;
color:#155eef;
}

.premium{
background:
linear-gradient(135deg,#155eef,#254edb);
color:#fff;
border:0;
}

.premium h2{
color:#fff;
}

.premium p{
color:#dbe7ff;
}

.premium .btn{
background:#fff;
color:#155eef;
}

.membership{
background:#fff;
border:1px solid #e1e7f0;
border-radius:16px;
padding:25px;
margin-bottom:25px;
}

.membership-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:20px;
}

.membership-header h2{
font-size:21px;
}

.membership-info{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.membership-item{
background:#f8fafc;
border-radius:10px;
padding:15px;
}

.membership-item small{
display:block;
font-size:11px;
color:#7b8494;
margin-bottom:5px;
}

.membership-item strong{
font-size:14px;
}

.help{
background:#111827;
color:#fff;
border-radius:16px;
padding:32px 25px;
text-align:center;
}

.help h2{
margin-bottom:8px;
}

.help p{
color:#cbd5e1;
font-size:13px;
margin-bottom:18px;
}

.whatsapp{
display:inline-block;
background:#25D366;
color:#fff;
padding:12px 20px;
border-radius:9px;
font-size:14px;
font-weight:800;
}

.loading{
text-align:center;
padding:80px 20px;
color:#687386;
}

.error-box{
max-width:500px;
margin:70px auto;
background:#fff;
border:1px solid #fecdd3;
border-radius:14px;
padding:25px;
text-align:center;
color:#be123c;
}

footer{
text-align:center;
padding:25px 20px;
font-size:12px;
color:#8994a7;
}

@media(max-width:800px){

.cards{
grid-template-columns:1fr;
}

.profile-card{
grid-template-columns:1fr;
}

}

@media(max-width:550px){

.nav{
padding:0 15px;
}

.logo{
font-size:17px;
}

.logo-icon{
width:36px;
height:36px;
}

main{
padding:30px 15px 55px;
}

.welcome h1{
font-size:27px;
}

.membership-info{
grid-template-columns:1fr;
}

.membership-header{
align-items:flex-start;
flex-direction:column;
}

}

</style>

</head>

<body>


<header>

<div class="nav">

<a href="index.html" class="logo">

<span class="logo-icon">
📚
</span>

<span>
CreateLK Academy
</span>

</a>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</header>


<main id="app">

<div class="loading">

Loading your student dashboard...

</div>

</main>


<footer>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

/* =========================================================
   CREATE LK ACADEMY
   STUDENT DASHBOARD V2
========================================================= */


/*
   This is the same V2 session key used
   by the dashboard system.
*/

const SESSION_KEY =
"createlk_v2_student";


/*
   WhatsApp support only.
*/

const WHATSAPP_NUMBER =
"94771190395";


/* =========================================================
   GET STUDENT SESSION
========================================================= */

function getStudent(){

const possibleKeys = [

"createlk_v2_student",
"createlk_student_v2",
"student_v2",
"student"

];

for(
const key of possibleKeys
){

const saved =
localStorage.getItem(key);

if(!saved){
continue;
}

try{

const student =
JSON.parse(saved);

if(
student &&
(
student.id ||
student.email
)
){

return student;

}

}catch(error){

console.warn(
"Invalid session:",
key
);

}

}

return null;

}


/* =========================================================
   FORMAT STATUS
========================================================= */

function formatStatus(status){

if(!status){
return "INACTIVE";
}

return String(status)
.trim()
.toUpperCase();

}


/* =========================================================
   STATUS CLASS
========================================================= */

function statusClass(status){

const value =
formatStatus(status);

if(value === "ACTIVE"){
return "active";
}

if(
value === "PENDING" ||
value === "PENDING_PAYMENT"
){

return "pending";

}

return "inactive";

}


/* =========================================================
   MEMBERSHIP EXPIRY
========================================================= */

function expiryText(expiry){

if(!expiry){
return "Not activated";
}

const date =
new Date(expiry);

if(
Number.isNaN(
date.getTime()
)
){

return expiry;

}

return date.toLocaleDateString(
"en-GB",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}


/* =========================================================
   DASHBOARD
========================================================= */

function showDashboard(student){

const app =
document.getElementById(
"app"
);


const firstName =
student.first_name || "";

const lastName =
student.last_name || "";

const fullName =
(
firstName +
" " +
lastName
).trim() ||
"Student";


const email =
student.email ||
"Not available";


const phone =
student.phone ||
"Not available";


const membershipStatus =
formatStatus(
student.membership_status
);


const expiry =
student.membership_expiry;


const active =
membershipStatus ===
"ACTIVE";


app.innerHTML = `

<section class="welcome">

<div class="welcome-badge">
STUDENT DASHBOARD
</div>

<h1>
Welcome, ${escapeHTML(firstName || "Student")} 👋
</h1>

<p>
Continue your English learning journey with CreateLK Academy.
</p>

</section>


<section class="profile-card">

<div class="profile-item">

<div class="profile-label">
Student Name
</div>

<div class="profile-value">
${escapeHTML(fullName)}
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Email Address
</div>

<div class="profile-value">
${escapeHTML(email)}
</div>

</div>


<div class="profile-item">

<div class="profile-label">
WhatsApp / Phone
</div>

<div class="profile-value">
${escapeHTML(phone)}
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Account Status
</div>

<div class="profile-value">

<span class="status active">
REGISTERED
</span>

</div>

</div>

</section>


<section class="cards">


<div class="card">

<div class="card-icon">
🤖
</div>

<h2>
AI English Practice
</h2>

<p>
Practise English grammar, vocabulary and comprehension through interactive questions.
</p>

<a
href="ai-mcq-v2.html"
class="btn primary">

Start Practice

</a>

</div>


<div class="card">

<div class="card-icon">
📊
</div>

<h2>
Learning Progress
</h2>

<p>
Your learning progress and practice activity will appear here.
</p>

<button
class="btn secondary"
onclick="comingSoon()">

View Progress

</button>

</div>


<div class="card premium">

<div class="card-icon">
⭐
</div>

<h2>
Premium Membership
</h2>

<p>
Get 30 days of premium English learning access.
</p>

<a
href="payment-v2.html"
class="btn">

Premium Access

</a>

</div>


</section>


<section class="membership">

<div class="membership-header">

<h2>
⭐ Membership Status
</h2>

<span
class="status ${statusClass(membershipStatus)}">

${escapeHTML(membershipStatus)}

</span>

</div>


<div class="membership-info">

<div class="membership-item">

<small>
Current Status
</small>

<strong>
${escapeHTML(membershipStatus)}
</strong>

</div>


<div class="membership-item">

<small>
Membership Expiry
</small>

<strong>
${escapeHTML(expiryText(expiry))}
</strong>

</div>

</div>

</section>


<section class="help">

<h2>
Need Help?
</h2>

<p>
Contact CreateLK Academy support through WhatsApp.
</p>

<a
class="whatsapp"
target="_blank"
rel="noopener"
href="https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20CreateLK%20Academy%2C%20I%20need%20help%20with%20my%20student%20account.">

💬 WhatsApp Support

</a>

</section>

`;

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   COMING SOON
========================================================= */

function comingSoon(){

alert(
"Learning progress will be available soon."
);

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

const keys = [

"createlk_v2_student",
"createlk_student_v2",
"student_v2",
"student"

];

keys.forEach(
function(key){

localStorage.removeItem(key);

}
);

sessionStorage.clear();

window.location.href =
"login-v2.html";

}


/* =========================================================
   INITIALIZE
========================================================= */

const student =
getStudent();


if(!student){

document.getElementById(
"app"
).innerHTML = `

<div class="error-box">

<h2>
🔐 Login Required
</h2>

<p style="margin:10px 0 18px;">
Please log in to access your CreateLK Academy student dashboard.
</p>

<a
href="login-v2.html"
class="btn primary">

Student Login

</a>

</div>

`;

}else{

showDashboard(student);

}

</script>

</body>

</html>
