

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post an Ad | CreateLK</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182337;font:15px Arial,sans-serif}
header{background:#102a56;color:white;padding:16px;font-size:22px;font-weight:bold}
header span{color:#d69b16}
main{max-width:700px;margin:24px auto;padding:0 12px}
.card{background:white;padding:20px;margin-bottom:14px;border-radius:12px;border:1px solid #dce2eb}
h1,h2{color:#102a56;margin-top:0}
h1{font-size:27px} h2{font-size:18px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}
textarea{min-height:100px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:8px;background:#102a56;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.gold{background:#d69b16;color:#102a56}
.hidden{display:none!important}
.notice{padding:12px;border-radius:8px;background:#edf3ff;margin:12px 0;overflow-wrap:anywhere}
.error{background:#fff0f0;color:#9a2020}
.success{background:#e9f9ed;color:#17652b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.package{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #dce2eb;border-radius:8px;margin:8px 0}
.package input{width:auto}
.package label{flex:1;margin:0}
#photosPreview img{width:65px;height:65px;object-fit:cover;margin:5px;border-radius:6px}
small{color:#68758a}
@media(max-width:500px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>Create<span>LK</span></header>

<main>
<h1>Post an Ad</h1>
<div id="status" class="notice hidden" role="status"></div>

<section id="loginCard" class="card">
<h2>Sign in with Google</h2>
<div id="googleButton"></div>
<div id="loginMessage"></div>
</section>

<section id="account" class="card hidden">
<strong id="userName"></strong>
<div id="userEmail"></div>
<button type="button" id="logout" style="margin-top:12px">Sign out</button>
</section>

<form id="form" class="hidden">
<section class="card">
<h2>Ad details</h2>
<label for="title">Title *</label>
<input id="title" required minlength="3" maxlength="100">

<label for="description">Description</label>
<textarea id="description" maxlength="2000"></textarea>

<div class="row">
<div>
<label for="category">Category *</label>
<select id="category" required>
<option value="">Loading categories...</option>
</select>
</div>
<div>
<label for="district">District *</label>
<select id="district" required>
<option value="">Loading districts...</option>
</select>
</div>
</div>

<label for="town">Town *</label>
<input id="town" required maxlength="100" placeholder="Enter town or city">
</section>

<section class="card">
<h2>Price and contact</h2>
<label for="price">Price (LKR)</label>
<input id="price" type="number" min="0" step="1" placeholder="Leave blank if negotiable">

<label for="contactName">Contact name</label>
<input id="contactName" maxlength="100">

<label for="phone">Phone number *</label>
<input id="phone" type="tel" required maxlength="30" placeholder="e.g. 0771234567">
</section>

<section class="card">
<h2>Photos *</h2>
<input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required>
<small>Choose 1–5 images. Each image must be 5 MB or smaller.</small>
<div id="photosPreview"></div>
</section>

<section class="card">
<h2>Package</h2>
<div class="package">
<input type="radio" name="package" value="FREE" checked>
<label>Free Ad — LKR 0</label>
</div>
<div class="package">
<input type="radio" name="package" value="URGENT">
<label>Urgent — LKR 500 (not yet available)</label>
</div>
<div class="package">
<input type="radio" name="package" value="FEATURED">
<label>Featured — LKR 500 (not yet available)</label>
</div>
<div class="package">
<input type="radio" name="package" value="TOP_AD">
<label>Top Ad — LKR 500 (not yet available)</label>
</div>
<div class="package">
<input type="radio" name="package" value="ALL_3">
<label>All 3 — LKR 1,500 (not yet available)</label>
</div>
<small>Only free ads can currently be submitted through this page.</small>
</section>

<section class="card">
<p>Your free ad will be reviewed before publication.</p>
<button id="submit" class="gold" type="submit" style="width:100%">Submit Ad</button>
</section>
</form>
</main>

<script>
"use strict";

/*
  Main API: market-public.createlk.workers.dev

  Expected backend endpoints:
    POST /api/auth/google
    GET  /api/auth/me
    GET  /api/categories
    GET  /api/locations
    POST /api/upload
    POST /api/listings

  The last two endpoints must be implemented in the Worker
  before photo uploads and ad submissions can succeed.
*/
const API = "https://market-public.createlk.workers.dev";
const CLIENT_ID =
  "582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";

const TOKEN_KEY = "marketplace_session_token";
const USER_KEY = "marketplace_profile";

let token = sessionStorage.getItem(TOKEN_KEY) || "";
let currentUser = null;
let googleInitialized = false;

const $ = id => document.getElementById(id);

function showStatus(message, type = "info") {
  const el = $("status");
  el.textContent = message;
  el.classList.remove("hidden", "error", "success");
  if (type === "error") el.classList.add("error");
  if (type === "success") el.classList.add("success");
}

function hideStatus() {
  $("status").classList.add("hidden");
}

async function api(path, options = {}, authenticated = false) {
  const headers = new Headers(options.headers || {});

  if (authenticated) {
    if (!token) throw new Error("Please sign in first.");
    headers.set("Authorization", "Bearer " + token);
  }

  if (options.body && !(options.body instanceof FormData)) {
    headers.set("Content-Type", "application/json");
  }

  let response;
  try {
    response = await fetch(API + path, {...options, headers});
  } catch {
    throw new Error("Network error. Check your internet connection.");
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    if (response.status === 401 && authenticated) {
      signOut(false);
    }

    if (response.status === 404) {
      throw new Error(
        "This API endpoint is not available in market-public yet: " + path
      );
    }

    throw new Error(
      data.error || data.message || `Request failed (${response.status})`
    );
  }

  return data;
}

function normalizeUser(user) {
  if (!user) return {};
  return {
    ...user,
    name: user.name || user.display_name || user.displayName || "",
    email: user.email || "",
    picture: user.picture || user.avatar_url || user.avatarUrl || ""
  };
}

function showSignedOut() {
  $("loginCard").classList.remove("hidden");
  $("account").classList.add("hidden");
  $("form").classList.add("hidden");
}

function signedIn(user) {
  currentUser = normalizeUser(user);
  $("loginCard").classList.add("hidden");
  $("account").classList.remove("hidden");
  $("form").classList.remove("hidden");

  $("userName").textContent = currentUser.name || "Signed in";
  $("userEmail").textContent = currentUser.email || "";

  if (!$("contactName").value) {
    $("contactName").value = currentUser.name;
  }

  loadOptions().catch(error => showStatus(error.message, "error"));
}

function signOut(showMessage = true) {
  token = "";
  currentUser = null;
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USER_KEY);

  $("form").reset();
  $("photosPreview").replaceChildren();
  showSignedOut();

  if (showMessage) showStatus("You have signed out.", "success");
}

async function restoreSession() {
  try {
    // First use the same session token as the homepage.
    token = sessionStorage.getItem(TOKEN_KEY) || "";

    if (!token) {
      showSignedOut();
      return;
    }

    const data = await api("/api/auth/me", {}, true);
    currentUser = normalizeUser(data.user || data);
    sessionStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    signedIn(currentUser);
  } catch (error) {
    signOut(false);
    $("loginMessage").textContent =
      "Please sign in again. " + error.message;
  }
}

async function googleLogin(credential) {
  $("loginMessage").textContent = "Signing in...";

  try {
    const data = await api("/api/auth/google", {
      method: "POST",
      body: JSON.stringify({credential})
    });

    token = data.token || data.access_token;
    if (!token) throw new Error("The server did not return a login token.");

    sessionStorage.setItem(TOKEN_KEY, token);

    const me = await api("/api/auth/me", {}, true);
    currentUser = normalizeUser(me.user || data.user || me);

    sessionStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    $("loginMessage").textContent = "";
    signedIn(currentUser);
    showStatus("Signed in successfully.", "success");
  } catch (error) {
    token = "";
    sessionStorage.removeItem(TOKEN_KEY);
    $("loginMessage").textContent = error.message;
  }
}

function initGoogle() {
  if (googleInitialized) return true;
  if (!window.google?.accounts?.id) return false;

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: response => {
      if (response.credential) {
        googleLogin(response.credential);
      } else {
        $("loginMessage").textContent =
          "Google did not return a login credential.";
      }
    },
    auto_select: false
  });

  google.accounts.id.renderButton($("googleButton"), {
    theme: "outline",
    size: "large",
    text: "signin_with",
    shape: "rectangular",
    width: 250
  });

  googleInitialized = true;
  return true;
}

function extractItems(data, keys) {
  if (Array.isArray(data)) return data;
  for (const key of keys) {
    if (Array.isArray(data?.[key])) return data[key];
  }
  return [];
}

function fillSelect(select, items, placeholder) {
  select.replaceChildren(new Option(placeholder, ""));

  for (const item of items) {
    if (item.id != null && item.name) {
      select.add(new Option(item.name, String(item.id)));
    }
  }
}

async function loadOptions() {
  const [categoriesData, districtsData] = await Promise.all([
    api("/api/categories"),
    api("/api/locations")
  ]);

  fillSelect(
    $("category"),
    extractItems(categoriesData, ["categories", "results"]),
    "Select category"
  );

  fillSelect(
    $("district"),
    extractItems(districtsData, ["districts", "locations", "results"]),
    "Select district"
  );
}

const allowedTypes = [
  "image/jpeg", "image/png", "image/webp", "image/gif"
];

$("photos").addEventListener("change", () => {
  $("photosPreview").replaceChildren();
  hideStatus();

  const files = Array.from($("photos").files);

  if (
    files.length < 1 ||
    files.length > 5 ||
    files.some(file =>
      !allowedTypes.includes(file.type) ||
      file.size > 5 * 1024 * 1024
    )
  ) {
    $("photos").value = "";
    showStatus(
      "Choose 1–5 JPG, PNG, WEBP or GIF images, each no larger than 5 MB.",
      "error"
    );
    return;
  }

  for (const file of files) {
    const image = document.createElement("img");
    image.alt = file.name;
    image.src = URL.createObjectURL(file);
    image.onload = () => URL.revokeObjectURL(image.src);
    $("photosPreview").appendChild(image);
  }
});

async function uploadPhoto(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("purpose", "ad-photo");

  const data = await api(
    "/api/upload",
    {method: "POST", body: formData},
    true
  );

  const key = data.key || data.r2_key;
  if (!key) {
    throw new Error("Photo upload did not return an R2 file key.");
  }
  return key;
}

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  hideStatus();

  const selectedPackage =
    document.querySelector('[name="package"]:checked')?.value || "FREE";

  if (selectedPackage !== "FREE") {
    showStatus(
      "Paid packages are not enabled yet. Please select Free Ad.",
      "error"
    );
    return;
  }

  const files = Array.from($("photos").files);

  if (files.length < 1 || files.length > 5) {
    showStatus("Please select 1–5 photos.", "error");
    return;
  }

  if (!$("category").value || !$("district").value || !$("town").value.trim()) {
    showStatus("Please select a category and district, and enter a town.", "error");
    return;
  }

  $("submit").disabled = true;
  $("submit").textContent = "Submitting...";

  try {
    await api("/api/auth/me", {}, true);

    const photoKeys = [];
    for (const file of files) {
      photoKeys.push(await uploadPhoto(file));
    }

    const body = {
      title: $("title").value.trim(),
      description: $("description").value.trim(),
      price_lkr: $("price").value === "" ? null : Number($("price").value),
      category_id: Number($("category").value),
      district_id: Number($("district").value),
      town: $("town").value.trim(),
      seller_name: $("contactName").value.trim() || currentUser?.name || "",
      contact_phone: $("phone").value.trim(),
      photos: photoKeys
    };

    const result = await api("/api/listings", {
      method: "POST",
      body: JSON.stringify(body)
    }, true);

    showStatus(
      result.message || "Your ad was submitted for review.",
      "success"
    );

    $("form").reset();
    $("photosPreview").replaceChildren();
    $("contactName").value = currentUser?.name || "";
  } catch (error) {
    showStatus(error.message, "error");
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = "Submit Ad";
  }
});

$("logout").addEventListener("click", () => signOut());

showSignedOut();
restoreSession();

let googleAttempts = 0;
const googleTimer = setInterval(() => {
  googleAttempts++;

  if (initGoogle() || googleAttempts >= 30) {
    clearInterval(googleTimer);

    if (!googleInitialized) {
      $("loginMessage").textContent =
        "Google sign-in could not load. Check your connection and refresh.";
    }
  }
}, 300);
</script>
</body>
</html>
