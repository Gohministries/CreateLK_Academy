<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Final Assessment | CreateLK Academy</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    padding:18px 20px;
}

header h1{
    margin:0;
    font-size:22px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 16px;
}

.card{
    background:#ffffff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h2{
    margin-top:0;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 20px;
    font-size:15px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

.hidden{
    display:none;
}

.info{
    background:#eff6ff;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
}
</style>
</head>

<body>

<header>
    <h1>📚 CreateLK Academy</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Final Assessment</h2>

        <div class="info">
            Complete the final assessment to receive your certificate.
        </div>

        <p>
            This is your final examination area.
        </p>

        <button onclick="startExam()">
            Start Final Assessment
        </button>

    </div>

</div>

<script>
function startExam(){
    alert("Final Assessment will start here.");
}
</script>

</body>
</html>
