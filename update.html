<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Verses</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#f1f5f9;
color:#1e293b;
font-family:Arial,sans-serif
}

header{
background:linear-gradient(135deg,#172554,#1e3a8a);
color:white;
text-align:center;
padding:22px 12px
}

header h1{
margin:0;
font-size:27px
}

header p{
margin:7px 0 0;
font-size:14px;
opacity:.9
}

main{
max-width:900px;
margin:auto;
padding:15px
}


/* SEARCH */

.search-box{
background:white;
padding:12px;
border-radius:12px;
box-shadow:0 2px 10px #0001;
display:flex;
gap:8px;
margin-bottom:15px
}

.search-box input{
flex:1;
padding:12px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px
}

.search-box button{
width:45px;
border:0;
border-radius:8px;
background:#e2e8f0;
font-size:20px;
cursor:pointer
}


/* DAY SELECTOR */

.day-selector{
background:white;
padding:12px;
border-radius:12px;
box-shadow:0 2px 10px #0001;
margin-bottom:15px
}

.days{
display:grid;
grid-template-columns:repeat(15,1fr);
gap:4px;
max-height:210px;
overflow:auto
}

.day{
border:0;
background:#e2e8f0;
border-radius:6px;
padding:7px 2px;
font-size:12px;
cursor:pointer
}

.day:hover{
background:#cbd5e1
}

.day.active{
background:#2563eb;
color:white
}

.day.empty{
opacity:.45
}


/* VERSE */

.verse-card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 3px 14px #0001
}

.day-title{
text-align:center;
margin-bottom:18px
}

.day-number{
font-size:14px;
font-weight:bold;
color:#64748b
}

.reference{
font-size:24px;
font-weight:700;
color:#172554;
margin-top:5px
}


/* LANGUAGE */

.language{
margin-top:20px;
border-top:1px solid #e2e8f0;
padding-top:15px
}

.language-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:7px
}

.language-title{
font-weight:700;
font-size:15px
}

.copy{
border:0;
background:#e2e8f0;
padding:6px 10px;
border-radius:6px;
font-size:12px;
font-weight:bold;
cursor:pointer
}

.text{
font-size:17px;
line-height:1.8;
white-space:pre-wrap
}

.sinhala{
font-family:"Noto Sans Sinhala",sans-serif
}

.tamil{
font-family:"Noto Sans Tamil",sans-serif
}


/* NAVIGATION */

.navigation{
display:flex;
gap:10px;
margin-bottom:15px
}

.navigation button{
flex:1;
padding:12px;
border:0;
border-radius:9px;
background:#172554;
color:white;
font-weight:bold;
cursor:pointer
}

.navigation button:disabled{
background:#cbd5e1;
cursor:not-allowed
}


/* STATUS */

.loading,
.error,
.empty{
background:white;
border-radius:12px;
padding:25px;
text-align:center;
box-shadow:0 2px 10px #0001
}

.error{
color:#991b1b;
background:#fee2e2
}


/* FOOTER */

footer{
text-align:center;
padding:25px 10px;
font-size:12px;
color:#64748b
}


/* MOBILE */

@media(max-width:600px){

header h1{
font-size:22px
}

main{
padding:10px
}

.days{
grid-template-columns:repeat(10,1fr)
}

.reference{
font-size:21px
}

.text{
font-size:16px
}

.verse-card{
padding:15px
}

}

</style>

</head>


<body>


<header>

<h1>365 Bible Verses</h1>

<p>
Daily Bible Verses — English • Sinhala • Tamil
</p>

</header>


<main>


<!-- SEARCH -->

<div class="search-box">

<input
id="search"
type="search"
placeholder="Search day or Bible reference..."
oninput="searchDays()"
>

<button onclick="clearSearch()">×</button>

</div>


<!-- DAYS -->

<div class="day-selector">

<div
id="days"
class="days"
>
</div>

</div>


<!-- VERSE -->

<div id="content">

<div class="loading">
Loading Bible verses...
</div>

</div>


<!-- NAVIGATION -->

<div class="navigation">

<button
id="previous"
onclick="previousDay()"
>
‹ Previous
</button>

<button
id="next"
onclick="nextDay()"
>
Next ›
</button>

</div>


</main>


<footer>

365 Bible Verses

</footer>


<script>


/* =========================================
   CLOUDFLARE WORKER
========================================= */

const API =
"https://bible.createlk.workers.dev";


/* =========================================
   VARIABLES
========================================= */

let verses = [];

let currentDay = 1;


/* =========================================
   START
========================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

createDays();

loadVerses();

});


/* =========================================
   CREATE 365 DAYS
========================================= */

function createDays(){

const container =
document.getElementById("days");

container.innerHTML="";

for(let i=1;i<=365;i++){

const button =
document.createElement("button");

button.className="day";

button.id="day-"+i;

button.textContent=i;

button.onclick=function(){

showDay(i);

};

container.appendChild(button);

}

}


/* =========================================
   LOAD FROM CLOUDFLARE
========================================= */

async function loadVerses(){

try{

const response =
await fetch(
API+"/api/verses",
{
method:"GET",
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"Invalid API response"
);

}


verses=data;


markSavedDays();

showDay(1);


}catch(error){

console.error(
"Bible API error:",
error
);


document.getElementById(
"content"
).innerHTML=`

<div class="error">

<strong>
Unable to load Bible verses.
</strong>

<br><br>

Please check your Cloudflare Worker connection.

<br><br>

<small>
${escapeHTML(error.message)}
</small>

</div>

`;

}

}


/* =========================================
   MARK AVAILABLE DAYS
========================================= */

function markSavedDays(){

for(let i=1;i<=365;i++){

const button =
document.getElementById(
"day-"+i
);

const exists =
verses.some(
v=>Number(v.day)===i
);

button.classList.toggle(
"empty",
!exists
);

}

}


/* =========================================
   SHOW DAY
========================================= */

function showDay(day){

currentDay=Number(day);


const verse =
verses.find(
v=>Number(v.day)===currentDay
);


document.querySelectorAll(
".day"
).forEach(
b=>b.classList.remove("active")
);


const selected =
document.getElementById(
"day-"+currentDay
);

if(selected){

selected.classList.add(
"active"
);

}


if(!verse){

document.getElementById(
"content"
).innerHTML=`

<div class="empty">

<strong>
Day ${currentDay}
</strong>

<br><br>

No Bible verse has been added yet.

</div>

`;

updateNavigation();

return;

}


/* =========================================
   DISPLAY VERSE
========================================= */

document.getElementById(
"content"
).innerHTML=`

<div class="verse-card">

<div class="day-title">

<div class="day-number">
DAY ${verse.day}
</div>

<div class="reference">
${escapeHTML(verse.reference)}
</div>

</div>


<!-- ENGLISH -->

<div class="language">

<div class="language-head">

<div class="language-title">
🇬🇧 English
</div>

<button
class="copy"
onclick="copyVerse('english')"
>
Copy
</button>

</div>

<div
id="english"
class="text"
>${escapeHTML(verse.english)}</div>

</div>


<!-- SINHALA -->

<div class="language">

<div class="language-head">

<div class="language-title">
🇱🇰 සිංහල
</div>

<button
class="copy"
onclick="copyVerse('sinhala')"
>
Copy
</button>

</div>

<div
id="sinhala"
class="text sinhala"
>${escapeHTML(verse.sinhala)}</div>

</div>


<!-- TAMIL -->

<div class="language">

<div class="language-head">

<div class="language-title">
🇱🇰 தமிழ்
</div>

<button
class="copy"
onclick="copyVerse('tamil')"
>
Copy
</button>

</div>

<div
id="tamil"
class="text tamil"
>${escapeHTML(verse.tamil)}</div>

</div>

</div>

`;


updateNavigation();

}


/* =========================================
   NAVIGATION
========================================= */

function updateNavigation(){

document.getElementById(
"previous"
).disabled =
currentDay<=1;


document.getElementById(
"next"
).disabled =
currentDay>=365;

}


function previousDay(){

if(currentDay>1){

showDay(
currentDay-1
);

}

}


function nextDay(){

if(currentDay<365){

showDay(
currentDay+1
);

}

}


/* =========================================
   SEARCH
========================================= */

function searchDays(){

const query =
document.getElementById(
"search"
).value
.trim()
.toLowerCase();


for(let i=1;i<=365;i++){

const button =
document.getElementById(
"day-"+i
);

const verse =
verses.find(
v=>Number(v.day)===i
);


if(!query){

button.style.display="";
continue;

}


const matchDay =
String(i).includes(query);


const matchReference =
verse &&
String(verse.reference)
.toLowerCase()
.includes(query);


const matchEnglish =
verse &&
String(verse.english)
.toLowerCase()
.includes(query);


const matchSinhala =
verse &&
String(verse.sinhala)
.toLowerCase()
.includes(query);


const matchTamil =
verse &&
String(verse.tamil)
.toLowerCase()
.includes(query);


button.style.display =
(
matchDay ||
matchReference ||
matchEnglish ||
matchSinhala ||
matchTamil
)
? ""
: "none";

}

}


function clearSearch(){

document.getElementById(
"search"
).value="";

searchDays();

}


/* =========================================
   COPY
========================================= */

async function copyVerse(id){

const element =
document.getElementById(id);

if(!element)return;


const text =
element.innerText;


try{

await navigator.clipboard.writeText(
text
);

alert("Copied");

}catch(error){

const area =
document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

alert("Copied");

}

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
