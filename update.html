<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Control</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f1f5f9;
color:#1e293b;
font-family:Arial,"Noto Sans Sinhala","Noto Sans Tamil",sans-serif
}

header{
background:linear-gradient(135deg,#172554,#1e3a8a);
color:#fff;
text-align:center;
padding:15px;
position:sticky;
top:0;
z-index:10
}

header h2{margin:0;font-size:21px}
header p{margin:5px 0 0;font-size:12px}

main{
max-width:850px;
margin:15px auto;
padding:0 10px
}

.box{
background:#fff;
padding:14px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 2px 8px #0001
}

.search{display:flex;gap:8px}
.search input{flex:1}

input,textarea{
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:14px
}

textarea{
height:135px;
resize:vertical;
line-height:1.7
}

.sinhala{font-family:"Noto Sans Sinhala",sans-serif}
.tamil{font-family:"Noto Sans Tamil",sans-serif}

.progress{
margin-top:10px;
font-size:13px;
font-weight:bold
}

.bar{
height:7px;
background:#e2e8f0;
border-radius:10px;
margin-top:5px;
overflow:hidden
}

.fill{
height:100%;
width:0;
background:#2563eb;
transition:width .3s
}

.calendar-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px
}

.calendar-header button{
background:#e2e8f0;
font-size:18px;
width:42px;
height:38px
}

#calendarMonth{
font-size:18px;
color:#172554
}

.weekdays,.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px
}

.weekdays{
margin-bottom:4px;
text-align:center;
font-size:11px;
font-weight:bold;
color:#64748b
}

.calendar-day{
min-height:42px;
border:0;
border-radius:7px;
background:#e2e8f0;
cursor:pointer;
font-size:13px;
font-weight:bold;
position:relative
}

.calendar-day:hover{background:#bfdbfe}
.calendar-day.empty{background:transparent;cursor:default}
.calendar-day.saved{background:#bbf7d0;color:#166534}
.calendar-day.active{background:#2563eb;color:#fff}
.calendar-day.today{outline:2px solid #f59e0b;outline-offset:-2px}

.mark{
position:absolute;
bottom:3px;
left:50%;
transform:translateX(-50%);
font-size:8px
}

h3{margin:0 0 12px;font-size:18px}

label{
display:block;
font-weight:bold;
font-size:13px;
margin:10px 0 5px
}

.lang{
display:flex;
justify-content:space-between;
align-items:center
}

button{
border:0;
border-radius:8px;
padding:9px 13px;
cursor:pointer;
font-weight:bold
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.copy{
background:#e2e8f0;
font-size:11px;
padding:5px 9px
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px
}

.save{background:#2563eb;color:#fff}
.delete{background:#dc2626;color:#fff}
.clear{background:#64748b;color:#fff}
.prev,.next{background:#e2e8f0}

.nav{
display:flex;
gap:7px;
margin-top:8px
}

.nav button{flex:1}

.status{
display:none;
padding:9px;
margin-top:10px;
border-radius:7px;
font-size:13px;
font-weight:bold
}

.status.show{display:block}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.warning{background:#fef3c7;color:#92400e}

.sync{
margin-top:8px;
font-size:11px;
color:#64748b;
text-align:center
}

@media(max-width:600px){
.calendar-day{min-height:40px;font-size:12px}
.weekdays{font-size:10px}
textarea{height:150px}
}

@media(max-width:380px){
.calendar-day{min-height:36px;font-size:11px}
.calendar,.weekdays{gap:3px}
}
</style>
</head>

<body>

<header>
<h2>📖 365 Bible Control</h2>
<p>365 Daily Bible Verses</p>
</header>

<main>

<div class="box">

<div class="search">
<input
id="search"
placeholder="Search date or verse..."
oninput="searchCalendar()">
</div>

<div class="progress">
<span id="count">0 / 365</span>

<div class="bar">
<div id="fill" class="fill"></div>
</div>
</div>

<div id="syncStatus" class="sync">
Local storage ready
</div>

</div>

<div class="box">

<h3>📅 Bible Calendar</h3>

<div class="calendar-header">

<button
onclick="previousMonth()"
aria-label="Previous month">
←
</button>

<strong id="calendarMonth">January</strong>

<button
onclick="nextMonth()"
aria-label="Next month">
→
</button>

</div>

<div class="weekdays">
<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>
</div>

<div id="calendar" class="calendar"></div>

</div>

<div class="box">

<h3>
Date:
<span id="selectedDate">January 1</span>
</h3>

<div class="lang">
<label>English</label>
<button
class="copy"
onclick="copyField('english')">
Copy
</button>
</div>

<textarea
id="english"
placeholder="English Bible verse..."></textarea>

<div class="lang">
<label>සිංහල</label>
<button
class="copy"
onclick="copyField('sinhala')">
Copy
</button>
</div>

<textarea
id="sinhala"
class="sinhala"
placeholder="සිංහල බයිබල් පදය..."></textarea>

<div class="lang">
<label>தமிழ்</label>
<button
class="copy"
onclick="copyField('tamil')">
Copy
</button>
</div>

<textarea
id="tamil"
class="tamil"
placeholder="தமிழ் வேதாகம வசனம்..."></textarea>

<div class="actions">

<button
id="saveButton"
class="save"
onclick="saveVerse()">
💾 Save / Update
</button>

<button
class="delete"
onclick="deleteVerse()">
🗑 Delete
</button>

<button
class="clear"
onclick="clearForm()">
Clear
</button>

</div>

<div class="nav">

<button
class="prev"
onclick="previousDay()">
← Previous
</button>

<button
class="next"
onclick="nextDay()">
Next →
</button>

</div>

<div id="status" class="status"></div>

</div>

</main>

<script>
const API="https://bible.createlk.workers.dev";

const STORAGE_KEY="365_bible_control_verses";
const CURRENT_DAY_KEY="365_bible_current_day";

let data=[];
let current=1;
let calendarMonth=0;
let calendarYear=2027;

window.addEventListener("load",init);

async function init(){
loadLocalStorage();
loadDay(getLastSessionDay());
renderCalendar();
updateDays();
await loadAll();
}

function loadLocalStorage(){
try{
const saved=localStorage.getItem(STORAGE_KEY);

if(!saved){
data=[];
setSyncStatus("Local storage ready");
return;
}

const parsed=JSON.parse(saved);

if(!Array.isArray(parsed)){
throw new Error("Invalid local storage");
}

data=parsed;

setSyncStatus("✓ Loaded from local storage");

}catch(error){
console.error("LocalStorage error:",error);
data=[];
setSyncStatus("Local storage error");
}
}

function saveLocalStorage(){
try{
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

setSyncStatus("✓ Saved locally");

return true;

}catch(error){
console.error("LocalStorage save error:",error);

statusMessage(
"Unable to save to local storage.",
"error"
);

return false;
}
}

function saveLastSession(){
try{
localStorage.setItem(
CURRENT_DAY_KEY,
String(current)
);

return true;

}catch(error){
return false;
}
}

function getLastSessionDay(){
try{
const day=Number(
localStorage.getItem(CURRENT_DAY_KEY)
);

if(
Number.isInteger(day)&&
day>=1&&
day<=365
){
return day;
}

}catch(error){}

return 1;
}

async function loadAll(){

try{

statusMessage(
"Connecting to Cloudflare...",
"info"
);

const response=await fetch(
API+"/api/verses",
{
method:"GET",
mode:"cors",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!response.ok){
throw new Error(
"Server returned HTTP "+
response.status
);
}

const result=await response.json();

if(!Array.isArray(result)){
throw new Error("Invalid API response");
}

const sessionDay=current;
const merged={};

data.forEach(v=>{

if(v&&v.day){

const day=Number(v.day);

if(day>=1&&day<=365){
merged[day]=v;
}

}

});

result.forEach(v=>{

if(v&&v.day){

const day=Number(v.day);

if(day>=1&&day<=365){
merged[day]=v;
}

}

});

data=Object.values(merged)
.sort(
(a,b)=>Number(a.day)-Number(b.day)
);

saveLocalStorage();

updateDays();

setSyncStatus(
"✓ Cloudflare synchronized"
);

statusMessage(
"✓ Connected to Bible database",
"success"
);

loadDay(sessionDay);

}catch(error){

console.error(
"Cloudflare error:",
error
);

updateDays();

setSyncStatus(
"⚠ Offline — using local storage"
);

statusMessage(
"Cloudflare unavailable. Local data is still available.",
"warning"
);

loadDay(
getLastSessionDay()
);

}

}

function dayToDate(day){

const date=new Date(
2027,
0,
1
);

date.setDate(
date.getDate()+day-1
);

return date;
}

function dateToDay(
year,
month,
date
){

const start=new Date(
2027,
0,
1
);

const selected=new Date(
year,
month,
date
);

return Math.floor(
(selected-start)/
(1000*60*60*24)
)+1;
}

function formatDate(date){

return date.toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}

function formatVisibleDate(date){

return date.toLocaleDateString(
"en-US",
{
month:"long",
day:"numeric"
}
);

}

function loadDay(day){

current=Number(day);

if(!Number.isInteger(current)){
current=1;
}

if(current<1){
current=1;
}

if(current>365){
current=365;
}

saveLastSession();

const date=dayToDate(current);

calendarYear=date.getFullYear();
calendarMonth=date.getMonth();

document.getElementById(
"selectedDate"
).textContent=
formatVisibleDate(date);

const verse=data.find(
x=>Number(x.day)===current
);

document.getElementById(
"english"
).value=
verse?.english||"";

document.getElementById(
"sinhala"
).value=
verse?.sinhala||"";

document.getElementById(
"tamil"
).value=
verse?.tamil||"";

renderCalendar();
}

function updateDays(){

const count=data.filter(
x=>
x&&
Number.isInteger(Number(x.day))&&
Number(x.day)>=1&&
Number(x.day)<=365
).length;

document.getElementById(
"count"
).textContent=
count+" / 365";

document.getElementById(
"fill"
).style.width=
(count/365*100)+"%";

renderCalendar();
}

function renderCalendar(){

const calendar=
document.getElementById("calendar");

const title=
document.getElementById("calendarMonth");

if(!calendar||!title){
return;
}

calendar.innerHTML="";

const months=[
"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"
];

title.textContent=
months[calendarMonth];

const firstDay=
new Date(
calendarYear,
calendarMonth,
1
).getDay();

const daysInMonth=
new Date(
calendarYear,
calendarMonth+1,
0
).getDate();

for(
let i=0;
i<firstDay;
i++
){

const empty=
document.createElement("div");

empty.className=
"calendar-day empty";

calendar.appendChild(empty);

}

for(
let date=1;
date<=daysInMonth;
date++
){

const button=
document.createElement("button");

button.className=
"calendar-day";

button.textContent=date;

const day=dateToDay(
calendarYear,
calendarMonth,
date
);

if(
day<1||
day>365
){

button.disabled=true;
button.classList.add("empty");

calendar.appendChild(button);

continue;
}

if(
data.some(
x=>Number(x.day)===day
)
){

button.classList.add("saved");

const mark=
document.createElement("span");

mark.className="mark";
mark.textContent="✓";

button.appendChild(mark);

}

if(day===current){
button.classList.add("active");
}

const now=new Date();

if(
now.getFullYear()===calendarYear&&
now.getMonth()===calendarMonth&&
now.getDate()===date
){

button.classList.add("today");

}

button.onclick=()=>{
loadDay(day);
};

calendar.appendChild(button);

}

}

function previousMonth(){

if(
calendarYear===2027&&
calendarMonth===0
){
return;
}

calendarMonth--;

if(calendarMonth<0){

calendarMonth=11;
calendarYear--;

}

renderCalendar();
}

function nextMonth(){

if(
calendarYear===2027&&
calendarMonth===11
){
return;
}

calendarMonth++;

if(calendarMonth>11){

calendarMonth=0;
calendarYear++;

}

renderCalendar();
}

async function saveVerse(){

const english=
document.getElementById(
"english"
).value.trim();

const sinhala=
document.getElementById(
"sinhala"
).value.trim();

const tamil=
document.getElementById(
"tamil"
).value.trim();

if(
!english||
!sinhala||
!tamil
){

statusMessage(
"Please fill English, Sinhala and Tamil.",
"error"
);

return;
}

const saveButton=
document.getElementById(
"saveButton"
);

saveButton.disabled=true;

saveLastSession();

const verse={
day:current,
english,
sinhala,
tamil
};

const index=data.findIndex(
x=>Number(x.day)===current
);

if(index>=0){

data[index]=verse;

}else{

data.push(verse);

}

data.sort(
(a,b)=>Number(a.day)-Number(b.day)
);

const localSaved=
saveLocalStorage();

updateDays();

if(localSaved){

statusMessage(
"✓ "+
formatDate(dayToDate(current))+
" saved locally. Syncing Cloudflare...",
"info"
);

}

try{

const response=await fetch(
API+"/api/verses",
{
method:"POST",
mode:"cors",
headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},
body:JSON.stringify(verse)
}
);

let result={};

try{
result=await response.json();
}catch(e){}

if(!response.ok){

throw new Error(
result.error||
"Cloudflare save failed"
);

}

setSyncStatus(
"✓ Saved locally + Cloudflare"
);

statusMessage(
"✓ "+
formatDate(dayToDate(current))+
" saved successfully.",
"success"
);

if(current<365){

const savedDay=current;

setTimeout(
()=>{
loadDay(savedDay+1);

statusMessage(
"✓ "+
formatDate(dayToDate(savedDay))+
" saved. Now editing "+
formatDate(
dayToDate(savedDay+1)
)+".",
"success"
);
},
700
);

}else{

statusMessage(
"✓ December 31 saved successfully. All 365 days completed!",
"success"
);

}

}catch(error){

console.error(
"Cloudflare save error:",
error
);

setSyncStatus(
"⚠ Saved locally — Cloudflare sync failed"
);

statusMessage(
"✓ Saved locally. Cloudflare sync failed.",
"warning"
);

if(current<365){

const savedDay=current;

setTimeout(
()=>loadDay(savedDay+1),
700
);

}

}finally{

saveButton.disabled=false;

}

}

async function deleteVerse(){

const index=data.findIndex(
x=>Number(x.day)===current
);

if(index===-1){

statusMessage(
"No verse saved for "+
formatDate(dayToDate(current))+
".",
"info"
);

return;
}

if(
!confirm(
"Delete the verse for "+
formatDate(dayToDate(current))+
" permanently?"
)
){
return;
}

data.splice(index,1);

saveLocalStorage();

updateDays();

clearForm();

saveLastSession();

statusMessage(
formatDate(dayToDate(current))+
" deleted locally. Syncing Cloudflare...",
"info"
);

try{

const response=await fetch(
API+"/api/verses/"+current,
{
method:"DELETE",
mode:"cors",
headers:{
"Accept":"application/json"
}
}
);

let result={};

try{
result=await response.json();
}catch(e){}

if(!response.ok){

throw new Error(
result.error||
"Cloudflare delete failed"
);

}

setSyncStatus(
"✓ Deleted locally + Cloudflare"
);

statusMessage(
"✓ Verse deleted successfully.",
"success"
);

}catch(error){

console.error(
"Cloudflare delete error:",
error
);

setSyncStatus(
"⚠ Deleted locally — Cloudflare delete failed"
);

statusMessage(
"✓ Deleted locally. Cloudflare could not be updated.",
"warning"
);

}

}

function clearForm(){

document.getElementById(
"english"
).value="";

document.getElementById(
"sinhala"
).value="";

document.getElementById(
"tamil"
).value="";

}

async function copyField(id){

const field=
document.getElementById(id);

if(!field.value){

statusMessage(
"Nothing to copy.",
"info"
);

return;
}

try{

await navigator.clipboard.writeText(
field.value
);

}catch(error){

field.select();

document.execCommand("copy");

}

statusMessage(
"✓ Copied",
"success"
);

}

function previousDay(){

if(current>1){
loadDay(current-1);
}

}

function nextDay(){

if(current<365){
loadDay(current+1);
}

}

function searchCalendar(){

const query=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

if(!query){

renderCalendar();
return;

}

const calendar=
document.getElementById("calendar");

calendar.innerHTML="";

const matches=[];

for(
let day=1;
day<=365;
day++
){

const verse=data.find(
x=>Number(x.day)===day
);

const date=dayToDate(day);

const dateText=
formatVisibleDate(date)
.toLowerCase();

const fullDate=
formatDate(date)
.toLowerCase();

const english=
String(
verse?.english||""
).toLowerCase();

const sinhala=
String(
verse?.sinhala||""
).toLowerCase();

const tamil=
String(
verse?.tamil||""
).toLowerCase();

if(
dateText.includes(query)||
fullDate.includes(query)||
String(day).includes(query)||
english.includes(query)||
sinhala.includes(query)||
tamil.includes(query)
){

matches.push(day);

}

}

if(!matches.length){

const message=
document.createElement("div");

message.style.gridColumn=
"1 / -1";

message.style.textAlign=
"center";

message.style.padding=
"20px";

message.style.color=
"#64748b";

message.textContent=
"No matching date or verse found.";

calendar.appendChild(message);

return;
}

matches.forEach(day=>{

const date=
dayToDate(day);

const button=
document.createElement("button");

button.className=
"calendar-day";

button.textContent=
date.getDate();

button.title=
formatVisibleDate(date);

if(day===current){

button.classList.add(
"active"
);

}

if(
data.some(
x=>Number(x.day)===day
)
){

button.classList.add(
"saved"
);

}

button.onclick=()=>{

loadDay(day);

document.getElementById(
"search"
).value="";

};

calendar.appendChild(button);

});

}

function statusMessage(
text,
type
){

const box=
document.getElementById(
"status"
);

box.textContent=text;

box.className=
"status show "+type;

if(type!=="error"){

setTimeout(
()=>{
box.className="status";
},
4000
);

}

}

function setSyncStatus(text){

const box=
document.getElementById(
"syncStatus"
);

if(box){
box.textContent=text;
}

}

document.addEventListener(
"visibilitychange",
()=>{

if(
document.visibilityState===
"hidden"
){

saveLastSession();

}

}
);

window.addEventListener(
"beforeunload",
saveLastSession
);
</script>

</body>
</html>
