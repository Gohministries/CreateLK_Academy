<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Control</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}
header{background:#1e3a8a;color:white;text-align:center;padding:15px}
header h2,header p{margin:0} header p{font-size:12px;margin-top:4px}
main{max-width:850px;margin:15px auto;padding:0 10px}
.box{background:white;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px}
textarea{height:120px;resize:vertical;line-height:1.6}
.search,.actions,.nav,.calendar-head{display:flex;gap:7px}
.search input{flex:1}.search select{width:140px}
.progress{margin-top:10px;font-size:13px;font-weight:bold}
.bar{height:7px;background:#e2e8f0;border-radius:10px;margin-top:5px}
.fill{height:100%;width:0;background:#2563eb;border-radius:10px}
.sync{text-align:center;font-size:11px;color:#64748b;margin-top:7px}
.calendar-head{justify-content:space-between;align-items:center;margin-bottom:10px}
.calendar-head button{background:#e2e8f0;border:0;padding:8px 12px;border-radius:7px}
.calendar-head select{width:90px}
.title{font-weight:bold;font-size:18px}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekday{text-align:center;font-size:11px;color:#64748b;padding:5px}
.day{min-height:55px;border:0;border-radius:7px;background:#e2e8f0;padding:5px;cursor:pointer}
.day:hover{background:#cbd5e1}
.day.saved{background:#bbf7d0;color:#166534}
.day.active{background:#2563eb;color:white}
.day.empty{visibility:hidden}
.num{display:block;font-weight:bold}.bday{font-size:9px;opacity:.7}
label{font-weight:bold;font-size:13px;display:block;margin:9px 0 4px}
button{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:bold}
.actions{margin-top:10px;flex-wrap:wrap}
.save{background:#2563eb;color:white}.delete{background:#dc2626;color:white}
.clear{background:#64748b;color:white}
.nav{margin-top:7px}.nav button{flex:1;background:#e2e8f0}
.status{display:none;padding:9px;margin-top:10px;border-radius:7px;font-size:13px}
.status.show{display:block}.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
@media(max-width:600px){
.search{flex-direction:column}.search select{width:100%}
.calendar-head{flex-wrap:wrap}.title{width:100%}
.day{min-height:45px}.bday{font-size:8px}
}
</style>
</head>

<body>

<header>
<h2>📖 365 Bible Control</h2>
<p>365 Daily Bible Verses</p>
</header>

<main>

<div class="box">
<div class="search">
<input id="search" placeholder="Search verse..." oninput="render()">
<select id="daySelect" onchange="goDay(this.value)">
<option value="">Select Day</option>
</select>
</div>

<div class="progress">
<span id="count">0 / 365</span>
<div class="bar"><div id="fill" class="fill"></div></div>
</div>
<div id="sync" class="sync">Local storage</div>
</div>


<div class="box">

<div class="calendar-head">
<button onclick="month(-1)">←</button>
<div id="title" class="title"></div>
<select id="year" onchange="changeYear()"></select>
<button onclick="month(1)">→</button>
</div>

<div class="weekdays">
<div class="weekday">Sun</div><div class="weekday">Mon</div>
<div class="weekday">Tue</div><div class="weekday">Wed</div>
<div class="weekday">Thu</div><div class="weekday">Fri</div>
<div class="weekday">Sat</div>
</div>

<div id="calendar" class="calendar"></div>

</div>


<div class="box">

<h3>Day <span id="day">1</span></h3>

<label>English</label>
<textarea id="english"></textarea>

<label>සිංහල</label>
<textarea id="sinhala"></textarea>

<label>தமிழ்</label>
<textarea id="tamil"></textarea>

<div class="actions">
<button class="save" onclick="save()">💾 Save / Update</button>
<button class="delete" onclick="remove()">🗑 Delete</button>
<button class="clear" onclick="clearForm()">Clear</button>
</div>

<div class="nav">
<button onclick="move(-1)">← Previous</button>
<button onclick="move(1)">Next →</button>
</div>

<div id="status" class="status"></div>

</div>

</main>


<script>

const API="https://bible.createlk.workers.dev";
const KEY="365_bible_control_verses";

let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let date=new Date();
let year=date.getFullYear();
let mon=date.getMonth();
let current=dayOfYear(date);

const $=id=>document.getElementById(id);
const months=["January","February","March","April","May","June",
"July","August","September","October","November","December"];

function leap(y){return y%4===0&&(y%100!==0||y%400===0)}

function dayOfYear(d){
let n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-
Date.UTC(d.getFullYear(),0,1))/86400000)+1;
if(leap(d.getFullYear())&&d.getMonth()>1)n--;
return n;
}

function dateOfDay(day,y){
let d=new Date(y,0,day);
if(leap(y)&&day>=60)d.setDate(d.getDate()+1);
return d;
}

function init(){
for(let i=1;i<=365;i++)
$("daySelect").innerHTML+=`<option value="${i}">Day ${i}</option>`;

let now=new Date().getFullYear();
for(let y=now-10;y<=now+10;y++)
$("year").innerHTML+=`<option>${y}</option>`;

render();
load();
}

function render(){
$("title").textContent=months[mon]+" "+year;
$("year").value=year;

let cal=$("calendar");
cal.innerHTML="";

let first=new Date(year,mon,1).getDay();
let total=new Date(year,mon+1,0).getDate();

for(let i=0;i<first;i++)
cal.innerHTML+=`<div class="day empty"></div>`;

let q=$("search").value.toLowerCase();

for(let n=1;n<=total;n++){

let d=new Date(year,mon,n);
let day=dayOfYear(d);

if(day>365)continue;

let v=data.find(x=>+x.day===day);

let text=`${day} ${n} ${v?.english||""} ${v?.sinhala||""} ${v?.tamil||""}`.toLowerCase();

if(q&&!text.includes(q)){
cal.innerHTML+=`<div class="day empty"></div>`;
continue;
}

let cls="day"+(v?" saved":"")+
(day===current&&d.getFullYear()===date.getFullYear()&&
d.getMonth()===date.getMonth()&&d.getDate()===date.getDate()?" active":"");

cal.innerHTML+=`
<button class="${cls}" onclick="select(${n})">
<span class="num">${n}</span>
<span class="bday">Day ${day}</span>
</button>`;
}

updateProgress();
}

function select(n){
date=new Date(year,mon,n);
current=dayOfYear(date);
load();
render();
}

function goDay(n){
if(!n)return;
date=dateOfDay(+n,year);
year=date.getFullYear();
mon=date.getMonth();
current=+n;
load();
render();
}

function month(x){
mon+=x;
if(mon<0){mon=11;year--}
if(mon>11){mon=0;year++}
render();
}

function changeYear(){
year=+$("year").value;
render();
}

function move(x){
if(current+x<1||current+x>365)return;
goDay(current+x);
}

function load(){
$("day").textContent=current;
$("daySelect").value=current;

let v=data.find(x=>+x.day===current)||{};
$("english").value=v.english||"";
$("sinhala").value=v.sinhala||"";
$("tamil").value=v.tamil||"";
}

function updateProgress(){
let n=data.filter(x=>+x.day>=1&&+x.day<=365).length;
$("count").textContent=`${n} / 365`;
$("fill").style.width=(n/365*100)+"%";
}

function localSave(){
localStorage.setItem(KEY,JSON.stringify(data));
$("sync").textContent="✓ Saved locally";
render();
}

async function save(){

let v={
day:current,
english:$("english").value.trim(),
sinhala:$("sinhala").value.trim(),
tamil:$("tamil").value.trim()
};

if(!v.english||!v.sinhala||!v.tamil){
msg("Fill all three languages.","err");
return;
}

let i=data.findIndex(x=>+x.day===current);
if(i<0)data.push(v);else data[i]=v;

localSave();
msg("✓ Saved","ok");

try{
let r=await fetch(API+"/api/verses",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(v)
});

if(!r.ok)throw Error();

$("sync").textContent="✓ Cloudflare synced";
}catch{
$("sync").textContent="⚠ Saved locally";
}
}

async function remove(){

if(!confirm("Delete Day "+current+"?"))return;

data=data.filter(x=>+x.day!==current);
localSave();
clearForm();
msg("✓ Deleted","ok");

try{
await fetch(API+"/api/verses/"+current,{method:"DELETE"});
$("sync").textContent="✓ Deleted from Cloudflare";
}catch{
$("sync").textContent="⚠ Deleted locally";
}
}

function clearForm(){
$("english").value="";
$("sinhala").value="";
$("tamil").value="";
}

function msg(t,c){
$("status").textContent=t;
$("status").className="status show "+c;
setTimeout(()=>$("status").className="status",3000);
}

async function load(){

try{
let r=await fetch(API+"/api/verses",{cache:"no-store"});
if(!r.ok)throw Error();

let cloud=await r.json();

if(Array.isArray(cloud)){
cloud.forEach(v=>{
let i=data.findIndex(x=>+x.day===+v.day);
if(i<0)data.push(v);else data[i]=v;
});
}

localSave();
$("sync").textContent="✓ Cloudflare synced";
}catch{
$("sync").textContent="⚠ Offline / local data";
}

}

init();

</script>

</body>
</html>
