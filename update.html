<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Control</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#f1f5f9;
color:#1e293b;
font-family:Arial,"Noto Sans Sinhala","Noto Sans Tamil",sans-serif
}

header{
background:linear-gradient(135deg,#172554,#1e3a8a);
color:#fff;
text-align:center;
padding:15px;
position:sticky;
top:0;
z-index:10
}

header h2{
margin:0;
font-size:21px
}

header p{
margin:5px 0 0;
font-size:12px
}

main{
max-width:850px;
margin:15px auto;
padding:0 10px
}

.box{
background:#fff;
padding:14px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 2px 8px #0001
}

.search{
display:flex;
gap:8px
}

.search input{
flex:1
}

.search select{
width:125px
}

input,textarea,select{
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:14px
}

textarea{
height:135px;
resize:vertical;
line-height:1.7
}

.sinhala{
font-family:"Noto Sans Sinhala",sans-serif
}

.tamil{
font-family:"Noto Sans Tamil",sans-serif
}

.progress{
margin-top:10px;
font-size:13px;
font-weight:bold
}

.bar{
height:7px;
background:#e2e8f0;
border-radius:10px;
margin-top:5px;
overflow:hidden
}

.fill{
height:100%;
width:0;
background:#2563eb
}

.days{
display:grid;
grid-template-columns:repeat(15,1fr);
gap:4px;
max-height:210px;
overflow:auto
}

.day{
border:0;
padding:7px 2px;
border-radius:6px;
background:#e2e8f0;
cursor:pointer;
font-size:12px
}

.day.saved{
background:#bbf7d0;
color:#166534
}

.day.active{
background:#2563eb;
color:#fff
}

h3{
margin:0 0 12px;
font-size:18px
}

label{
display:block;
font-weight:bold;
font-size:13px;
margin:10px 0 5px
}

.lang{
display:flex;
justify-content:space-between;
align-items:center
}

.copy{
background:#e2e8f0;
font-size:11px;
padding:5px 9px
}

button{
border:0;
border-radius:8px;
padding:9px 13px;
cursor:pointer;
font-weight:bold
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px
}

.save{
background:#2563eb;
color:#fff
}

.delete{
background:#dc2626;
color:#fff
}

.clear{
background:#64748b;
color:#fff
}

.prev,.next{
background:#e2e8f0
}

.nav{
display:flex;
gap:7px;
margin-top:8px
}

.nav button{
flex:1
}

.status{
display:none;
padding:9px;
margin-top:10px;
border-radius:7px;
font-size:13px;
font-weight:bold
}

.status.show{
display:block
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

.info{
background:#dbeafe;
color:#1e40af
}

@media(max-width:600px){

.days{
grid-template-columns:repeat(10,1fr)
}

.search select{
width:105px
}

textarea{
height:150px
}

}

</style>
</head>

<body>

<header>

<h2>📖 365 Bible Control</h2>

<p>365 Daily Bible Verses</p>

</header>


<main>


<!-- SEARCH -->

<div class="box">

<div class="search">

<input
id="search"
placeholder="Search day or reference..."
oninput="searchDays()"
>

<select
id="select"
onchange="loadDay(Number(this.value))"
></select>

</div>


<div class="progress">

<span id="count">0 / 365</span>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

</div>

</div>


<!-- DAYS -->

<div class="box">

<h3>Days</h3>

<div
id="days"
class="days"
></div>

</div>


<!-- EDITOR -->

<div class="box">

<h3>
Day <span id="day">1</span>
</h3>


<label>
Bible Reference
</label>

<input
id="reference"
placeholder="Example: John 3:16"
>


<!-- ENGLISH -->

<div class="lang">

<label>English</label>

<button
class="copy"
onclick="copyField('english')"
>
Copy
</button>

</div>

<textarea
id="english"
placeholder="English Bible verse..."
></textarea>


<!-- SINHALA -->

<div class="lang">

<label>සිංහල</label>

<button
class="copy"
onclick="copyField('sinhala')"
>
Copy
</button>

</div>

<textarea
id="sinhala"
class="sinhala"
placeholder="සිංහල බයිබල් පදය..."
></textarea>


<!-- TAMIL -->

<div class="lang">

<label>தமிழ்</label>

<button
class="copy"
onclick="copyField('tamil')"
>
Copy
</button>

</div>

<textarea
id="tamil"
class="tamil"
placeholder="தமிழ் வேதாகம வசனம்..."
></textarea>


<!-- ACTIONS -->

<div class="actions">

<button
class="save"
onclick="saveVerse()"
>
💾 Save / Update
</button>

<button
class="delete"
onclick="deleteVerse()"
>
🗑 Delete
</button>

<button
class="clear"
onclick="clearForm()"
>
Clear
</button>

</div>


<!-- NAVIGATION -->

<div class="nav">

<button
class="prev"
onclick="previousDay()"
>
← Previous
</button>

<button
class="next"
onclick="nextDay()"
>
Next →
</button>

</div>


<div
id="status"
class="status"
></div>

</div>

</main>


<script>


/* =========================================
   CLOUDFLARE WORKER
========================================= */

const API =
"https://bible.createlk.workers.dev";


let data=[];

let current=1;


/* =========================================
   START
========================================= */

window.addEventListener(
"load",
init
);


async function init(){

createDays();

createSelect();

await loadAll();

loadDay(1);

}


/* =========================================
   CREATE DAY BUTTONS
========================================= */

function createDays(){

const container=
document.getElementById("days");

for(let i=1;i<=365;i++){

const button=
document.createElement("button");

button.className="day";

button.id="d"+i;

button.textContent=i;

button.onclick=function(){

loadDay(i);

};

container.appendChild(button);

}

}


/* =========================================
   CREATE SELECT
========================================= */

function createSelect(){

const select=
document.getElementById("select");

for(let i=1;i<=365;i++){

const option=
document.createElement("option");

option.value=i;

option.textContent=
"Day "+i;

select.appendChild(option);

}

}


/* =========================================
   LOAD ALL
========================================= */

async function loadAll(){

try{

statusMessage(
"Loading Bible verses...",
"info"
);


const response=
await fetch(
API+"/api/verses",
{
method:"GET",
mode:"cors",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


if(!response.ok){

throw new Error(
"Server returned HTTP "+
response.status
);

}


const result=
await response.json();


if(!Array.isArray(result)){

throw new Error(
"Invalid API response"
);

}


data=result;


updateDays();


statusMessage(
"✓ Connected to Bible database",
"success"
);


}catch(error){

console.error(error);


statusMessage(
"Unable to connect: "+
error.message,
"error"
);

}

}


/* =========================================
   LOAD DAY
========================================= */

function loadDay(day){

current=Number(day);

document.getElementById(
"day"
).textContent=current;

document.getElementById(
"select"
).value=current;


const verse=
data.find(
x=>Number(x.day)===current
);


document.getElementById(
"reference"
).value=
verse?.reference || "";


document.getElementById(
"english"
).value=
verse?.english || "";


document.getElementById(
"sinhala"
).value=
verse?.sinhala || "";


document.getElementById(
"tamil"
).value=
verse?.tamil || "";


document.querySelectorAll(
".day"
).forEach(
x=>x.classList.remove("active")
);


const button=
document.getElementById(
"d"+current
);


if(button){

button.classList.add(
"active"
);

}

}


/* =========================================
   UPDATE DAYS
========================================= */

function updateDays(){

const count=
data.length;


document.getElementById(
"count"
).textContent=
count+" / 365";


document.getElementById(
"fill"
).style.width=
(count/365*100)+"%";


for(let i=1;i<=365;i++){

const button=
document.getElementById(
"d"+i
);


const exists=
data.some(
x=>Number(x.day)===i
);


button.classList.toggle(
"saved",
exists
);

}

}


/* =========================================
   SAVE
========================================= */

async function saveVerse(){

const reference=
document.getElementById(
"reference"
).value.trim();


const english=
document.getElementById(
"english"
).value.trim();


const sinhala=
document.getElementById(
"sinhala"
).value.trim();


const tamil=
document.getElementById(
"tamil"
).value.trim();


if(
!reference||
!english||
!sinhala||
!tamil
){

statusMessage(
"Please fill all four fields.",
"error"
);

return;

}


statusMessage(
"Saving Day "+current+"...",
"info"
);


try{

const response=
await fetch(
API+"/api/verses",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

day:current,

reference:reference,

english:english,

sinhala:sinhala,

tamil:tamil

})

}
);


const result=
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"Save failed"
);

}


statusMessage(
"✓ Day "+current+
" saved successfully.",
"success"
);


await loadAll();

loadDay(current);


}catch(error){

statusMessage(
error.message,
"error"
);

}

}


/* =========================================
   DELETE
========================================= */

async function deleteVerse(){

const exists=
data.some(
x=>Number(x.day)===current
);


if(!exists){

statusMessage(
"Nothing saved for Day "+current+".",
"info"
);

return;

}


if(
!confirm(
"Delete Day "+
current+
" permanently?"
)
){

return;

}


statusMessage(
"Deleting Day "+current+"...",
"info"
);


try{

const response=
await fetch(
API+"/api/verses/"+current,
{
method:"DELETE"
}
);


const result=
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"Delete failed"
);

}


statusMessage(
"✓ Day "+current+
" deleted.",
"success"
);


await loadAll();

clearForm();

loadDay(current);


}catch(error){

statusMessage(
error.message,
"error"
);

}

}


/* =========================================
   CLEAR
========================================= */

function clearForm(){

document.getElementById(
"reference"
).value="";


document.getElementById(
"english"
).value="";


document.getElementById(
"sinhala"
).value="";


document.getElementById(
"tamil"
).value="";

}


/* =========================================
   COPY
========================================= */

async function copyField(id){

const field=
document.getElementById(id);


if(!field.value){

statusMessage(
"Nothing to copy.",
"info"
);

return;

}


try{

await navigator.clipboard.writeText(
field.value
);


statusMessage(
"✓ Copied",
"success"
);


}catch(error){

field.select();

document.execCommand(
"copy"
);


statusMessage(
"✓ Copied",
"success"
);

}

}


/* =========================================
   PREVIOUS
========================================= */

function previousDay(){

if(current>1){

loadDay(
current-1
);

}

}


/* =========================================
   NEXT
========================================= */

function nextDay(){

if(current<365){

loadDay(
current+1
);

}

}


/* =========================================
   SEARCH
========================================= */

function searchDays(){

const query=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


for(let i=1;i<=365;i++){

const button=
document.getElementById(
"d"+i
);


const verse=
data.find(
x=>Number(x.day)===i
);


if(!query){

button.style.display="";

continue;

}


const match=
String(i).includes(query) ||

(
verse &&
String(
verse.reference||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.english||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.sinhala||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.tamil||""
)
.toLowerCase()
.includes(query)
);


button.style.display=
match ? "" : "none";

}

}


/* =========================================
   STATUS
========================================= */

function statusMessage(
text,
type
){

const box=
document.getElementById(
"status"
);


box.textContent=text;

box.className=
"status show "+type;


if(type!=="error"){

setTimeout(
function(){

box.className=
"status";

},
3000
);

}

}

</script>

</body>
</html>
