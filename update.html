<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Bible Control</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;background:#f1f5f9;color:#1e293b;
 font-family:Arial,sans-serif
}

header{
 background:#1e3a8a;color:white;text-align:center;padding:15px
}
header h2,header p{margin:0}
header p{font-size:12px;margin-top:4px}

main{max-width:850px;margin:15px auto;padding:0 10px}

.box{
 background:white;padding:14px;border-radius:12px;
 margin-bottom:12px;box-shadow:0 2px 8px #0001
}

input,select,textarea,button{font:inherit}

input,select,textarea{
 width:100%;padding:9px;border:1px solid #cbd5e1;
 border-radius:7px
}

textarea{
 height:120px;resize:vertical;line-height:1.6
}

.search,.actions,.nav,.calendar-head{
 display:flex;gap:7px
}

.search input{flex:1}
.search select{width:140px}

.progress{
 margin-top:10px;font-size:13px;font-weight:bold
}

.bar{
 height:7px;background:#e2e8f0;border-radius:10px;margin-top:5px
}

.fill{
 height:100%;width:0;background:#2563eb;border-radius:10px
}

.sync{
 text-align:center;font-size:11px;color:#64748b;margin-top:7px
}

.calendar-head{
 justify-content:space-between;align-items:center;margin-bottom:10px
}

.calendar-head button{
 background:#e2e8f0;border:0;padding:8px 12px;border-radius:7px
}

.calendar-head select{width:90px}

.title{font-weight:bold;font-size:18px}

.weekdays,.calendar{
 display:grid;grid-template-columns:repeat(7,1fr);gap:4px
}

.weekday{
 text-align:center;font-size:11px;color:#64748b;padding:5px
}

.day{
 min-height:55px;border:0;border-radius:7px;
 background:#e2e8f0;padding:5px;cursor:pointer
}

.day:hover{background:#cbd5e1}

.day.saved{
 background:#bbf7d0;color:#166534
}

.day.active{
 background:#2563eb;color:white
}

.day.empty{
 visibility:hidden
}

.num{
 display:block;font-weight:bold
}

.bday{
 font-size:9px;opacity:.7
}

label{
 font-weight:bold;font-size:13px;
 display:block;margin:9px 0 4px
}

button{
 border:0;border-radius:7px;
 padding:9px 13px;cursor:pointer;font-weight:bold
}

.actions{
 margin-top:10px;flex-wrap:wrap
}

.save{
 background:#2563eb;color:white
}

.delete{
 background:#dc2626;color:white
}

.clear{
 background:#64748b;color:white
}

.nav{
 margin-top:7px
}

.nav button{
 flex:1;background:#e2e8f0
}

.status{
 display:none;padding:9px;margin-top:10px;
 border-radius:7px;font-size:13px
}

.status.show{display:block}

.ok{
 background:#dcfce7;color:#166534
}

.err{
 background:#fee2e2;color:#991b1b
}

@media(max-width:600px){
 .search{flex-direction:column}
 .search select{width:100%}
 .calendar-head{flex-wrap:wrap}
 .title{width:100%}
 .day{min-height:45px}
 .bday{font-size:8px}
}
</style>
</head>

<body>

<header>
<h2>📖 365 Bible Control</h2>
<p>365 Daily Bible Verses</p>
</header>

<main>

<!-- SEARCH -->

<div class="box">

<div class="search">

<input
 id="search"
 placeholder="Search verse..."
 oninput="render()"
>

<select
 id="daySelect"
 onchange="goDay(this.value)"
>
<option value="">Select Day</option>
</select>

</div>

<div class="progress">

<span id="count">0 / 365</span>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

</div>

<div id="sync" class="sync">
Local storage
</div>

</div>


<!-- CALENDAR -->

<div class="box">

<div class="calendar-head">

<button onclick="changeMonth(-1)">←</button>

<div id="title" class="title"></div>

<select id="year" onchange="changeYear()"></select>

<button onclick="changeMonth(1)">→</button>

</div>


<div class="weekdays">

<div class="weekday">Sun</div>
<div class="weekday">Mon</div>
<div class="weekday">Tue</div>
<div class="weekday">Wed</div>
<div class="weekday">Thu</div>
<div class="weekday">Fri</div>
<div class="weekday">Sat</div>

</div>


<div id="calendar" class="calendar"></div>

</div>


<!-- EDITOR -->

<div class="box">

<h3>
Day <span id="day">1</span>
</h3>

<label>English</label>

<textarea
 id="english"
 placeholder="English Bible verse..."
></textarea>


<label>සිංහල</label>

<textarea
 id="sinhala"
 placeholder="සිංහල බයිබල් පදය..."
></textarea>


<label>தமிழ்</label>

<textarea
 id="tamil"
 placeholder="தமிழ் வேதாகம வசனம்..."
></textarea>


<div class="actions">

<button
 class="save"
 onclick="saveVerse()"
>
💾 Save / Update
</button>

<button
 class="delete"
 onclick="deleteVerse()"
>
🗑 Delete
</button>

<button
 class="clear"
 onclick="clearForm()"
>
Clear
</button>

</div>


<div class="nav">

<button onclick="moveDay(-1)">
← Previous
</button>

<button onclick="moveDay(1)">
Next →
</button>

</div>


<div id="status" class="status"></div>

</div>

</main>


<script>

const API="https://bible.createlk.workers.dev";

const DATA_KEY="365_bible_control_verses";
const DATE_KEY="365_bible_current_date";

const MONTHS=[
 "January","February","March","April",
 "May","June","July","August",
 "September","October","November","December"
];

let data=[];

let date=new Date(
 localStorage.getItem(DATE_KEY) || Date.now()
);

let year=date.getFullYear();
let month=date.getMonth();
let current=dayOfYear(date);


/* ELEMENT */

const $=id=>document.getElementById(id);


/* LEAP YEAR */

function isLeap(y){
 return y%4===0 &&
       (y%100!==0 || y%400===0);
}


/* 365-DAY NUMBER */

function dayOfYear(d){

 let n=Math.floor(
  (
   Date.UTC(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
   ) -
   Date.UTC(d.getFullYear(),0,1)
  ) / 86400000
 )+1;

 /*
   Skip February 29.
   This keeps the Bible plan at 365 days.
 */
 if(isLeap(d.getFullYear()) && d.getMonth()>1)
  n--;

 return n;
}


/* DAY NUMBER -> DATE */

function dateFromDay(day,y){

 let d=new Date(y,0,day);

 if(isLeap(y) && day>=60)
  d.setDate(d.getDate()+1);

 return d;
}


/* SAVE SELECTED DATE */

function saveDate(){

 localStorage.setItem(
  DATE_KEY,
  date.toISOString()
 );
}


/* INITIALIZE */

function init(){

 data=JSON.parse(
  localStorage.getItem(DATA_KEY) || "[]"
 );

 /* Day list */

 for(let i=1;i<=365;i++){

  $("daySelect").innerHTML+=
   `<option value="${i}">Day ${i}</option>`;

 }


 /* Years */

 let now=new Date().getFullYear();

 for(let y=now-10;y<=now+10;y++){

  $("year").innerHTML+=
   `<option value="${y}">${y}</option>`;

 }


 /*
   Safety check
 */

 if(current<1 || current>365){

  current=365;

  date=dateFromDay(
   365,
   year
  );

 }


 render();
 loadVerse();
 loadCloud();
}


/* CALENDAR */

function render(){

 $("title").textContent=
  MONTHS[month]+" "+year;

 $("year").value=year;

 let calendar=$("calendar");

 calendar.innerHTML="";


 let first=
  new Date(year,month,1).getDay();

 let total=
  new Date(year,month+1,0).getDate();


 /* Empty cells */

 for(let i=0;i<first;i++){

  calendar.innerHTML+=
   `<div class="day empty"></div>`;

 }


 let search=
  $("search").value
  .trim()
  .toLowerCase();


 /* Dates */

 for(let n=1;n<=total;n++){

  let d=new Date(
   year,
   month,
   n
  );

  let day=dayOfYear(d);


  /*
    February 29
  */

  if(
   isLeap(year) &&
   month===1 &&
   n===29
  ){

   calendar.innerHTML+=
    `<div class="day empty"></div>`;

   continue;
  }


  if(day>365)continue;


  let verse=
   data.find(
    x=>Number(x.day)===day
   );


  let searchText=(
   day+" "+
   n+" "+
   (verse?.english||"")+" "+
   (verse?.sinhala||"")+" "+
   (verse?.tamil||"")
  ).toLowerCase();


  if(
   search &&
   !searchText.includes(search)
  ){

   calendar.innerHTML+=
    `<div class="day empty"></div>`;

   continue;
  }


  let active=
   d.toDateString()===
   date.toDateString();


  let classes=
   "day"+
   (verse?" saved":"")+
   (active?" active":"");


  calendar.innerHTML+=`

   <button
    class="${classes}"
    onclick="selectDate(${n})"
   >

    <span class="num">
     ${n}
    </span>

    <span class="bday">
     Day ${day}
    </span>

   </button>
  `;
 }


 updateProgress();
}


/* SELECT CALENDAR DATE */

function selectDate(n){

 date=new Date(
  year,
  month,
  n
 );

 current=dayOfYear(date);

 if(current<1 || current>365)return;

 saveDate();

 loadVerse();

 render();
}


/* SELECT DAY */

function goDay(value){

 if(!value)return;

 current=Number(value);

 date=dateFromDay(
  current,
  year
 );

 year=date.getFullYear();
 month=date.getMonth();

 saveDate();

 loadVerse();

 render();
}


/* PREVIOUS / NEXT */

function moveDay(amount){

 let next=current+amount;

 if(next<1 || next>365)
  return;

 goDay(next);
}


/* MONTH */

function changeMonth(amount){

 month+=amount;

 if(month<0){

  month=11;
  year--;

 }

 if(month>11){

  month=0;
  year++;

 }

 render();
}


/* YEAR */

function changeYear(){

 year=Number(
  $("year").value
 );

 render();
}


/* LOAD SAVED VERSE */

function loadVerse(){

 $("day").textContent=current;

 $("daySelect").value=current;


 let verse=data.find(
  x=>Number(x.day)===current
 );


 $("english").value=
  verse?.english || "";

 $("sinhala").value=
  verse?.sinhala || "";

 $("tamil").value=
  verse?.tamil || "";
}


/* PROGRESS */

function updateProgress(){

 let count=data.filter(
  x=>Number(x.day)>=1 &&
     Number(x.day)<=365
 ).length;

 $("count").textContent=
  count+" / 365";

 $("fill").style.width=
  (count/365*100)+"%";
}


/* LOCAL SAVE */

function saveLocal(){

 localStorage.setItem(
  DATA_KEY,
  JSON.stringify(data)
 );

 updateProgress();
 render();
}


/* SAVE VERSE */

async function saveVerse(){

 let verse={

  day:current,

  english:
   $("english").value.trim(),

  sinhala:
   $("sinhala").value.trim(),

  tamil:
   $("tamil").value.trim()

 };


 if(
  !verse.english ||
  !verse.sinhala ||
  !verse.tamil
 ){

  showStatus(
   "Please fill all three languages.",
   "err"
  );

  return;
 }


 let index=data.findIndex(
  x=>Number(x.day)===current
 );


 if(index===-1)
  data.push(verse);
 else
  data[index]=verse;


 saveLocal();
 saveDate();


 showStatus(
  "✓ Saved successfully",
  "ok"
 );


 try{

  let response=await fetch(
   API+"/api/verses",
   {
    method:"POST",
    headers:{
     "Content-Type":
      "application/json"
    },
    body:
     JSON.stringify(verse)
   }
  );


  if(!response.ok)
   throw new Error();


  $("sync").textContent=
   "✓ Cloudflare synced";

 }catch(error){

  $("sync").textContent=
   "⚠ Saved locally";
 }
}


/* DELETE */

async function deleteVerse(){

 if(
  !confirm(
   "Delete Day "+current+"?"
  )
 )return;


 data=data.filter(
  x=>Number(x.day)!==current
 );


 saveLocal();

 loadVerse();


 showStatus(
  "✓ Deleted",
  "ok"
 );


 try{

  let response=await fetch(
   API+"/api/verses/"+current,
   {
    method:"DELETE"
   }
  );

  if(!response.ok)
   throw new Error();

  $("sync").textContent=
   "✓ Deleted from Cloudflare";

 }catch{

  $("sync").textContent=
   "⚠ Deleted locally";
 }
}


/* CLEAR */

function clearForm(){

 $("english").value="";
 $("sinhala").value="";
 $("tamil").value="";
}


/* STATUS */

function showStatus(text,type){

 $("status").textContent=text;

 $("status").className=
  "status show "+type;

 setTimeout(()=>{
  $("status").className="status";
 },3000);
}


/* LOAD CLOUD DATA */

async function loadCloud(){

 try{

  $("sync").textContent=
   "Loading Cloudflare...";


  let response=await fetch(
   API+"/api/verses",
   {
    cache:"no-store"
   }
  );


  if(!response.ok)
   throw new Error();


  let cloud=await response.json();


  if(!Array.isArray(cloud))
   throw new Error();


  /*
    Cloud verses update local data.
  */

  cloud.forEach(verse=>{

   let day=Number(verse.day);

   if(day<1 || day>365)
    return;


   let index=data.findIndex(
    x=>Number(x.day)===day
   );


   if(index===-1)
    data.push(verse);
   else
    data[index]=verse;

  });


  data.sort(
   (a,b)=>
    Number(a.day)-
    Number(b.day)
  );


  localStorage.setItem(
   DATA_KEY,
   JSON.stringify(data)
  );


  /*
    IMPORTANT:
    Keep the selected date.
  */

  loadVerse();

  render();

  saveDate();


  $("sync").textContent=
   "✓ Cloudflare synced";


 }catch(error){

  $("sync").textContent=
   "⚠ Offline / local data";

  /*
    Still load local saved verse.
  */

  loadVerse();
 }
}


init();

</script>

</body>
</html>
