<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy — Spoken English</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
min-height:100vh
}

header{
background:#fff;
border-bottom:1px solid #e5e9f0;
padding:16px 20px;
position:sticky;
top:0;
z-index:50
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:700;
color:#111827
}

.logo{
width:42px;
height:42px;
object-fit:contain;
border-radius:10px
}

.back-btn{
text-decoration:none;
color:#374151;
font-size:14px;
font-weight:600;
padding:9px 14px;
border:1px solid #dbe1ea;
border-radius:10px;
background:#fff
}

.container{
max-width:1100px;
margin:auto;
padding:25px 18px 50px
}

.hero{
background:linear-gradient(135deg,#111827,#263b64);
color:#fff;
border-radius:20px;
padding:30px 25px;
margin-bottom:22px;
box-shadow:0 10px 30px rgba(0,0,0,.08)
}

.hero small{
display:block;
font-size:12px;
letter-spacing:1.5px;
opacity:.75;
margin-bottom:8px;
font-weight:700
}

.hero h1{
font-size:32px;
margin-bottom:8px
}

.hero p{
font-size:16px;
line-height:1.6;
opacity:.9
}

.stats{
margin-top:18px;
font-weight:700;
font-size:14px
}

.ad-card{
background:#fff;
border:1px solid #e5e9f0;
border-radius:16px;
padding:12px;
margin:20px 0;
min-height:90px;
overflow:hidden
}

.ad-label{
text-align:center;
font-size:10px;
color:#9ca3af;
letter-spacing:1px;
margin-bottom:6px
}

.progress-card{
background:#fff;
border:1px solid #e5e9f0;
border-radius:18px;
padding:22px;
margin-bottom:24px
}

.progress-top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px
}

.progress-title{
font-weight:700;
font-size:18px
}

.progress-count{
font-weight:700;
color:#2563eb
}

.progress-bar{
height:12px;
background:#e9eef5;
border-radius:20px;
overflow:hidden
}

.progress-fill{
height:100%;
width:0;
background:#2563eb;
border-radius:20px;
transition:width .3s
}

.section-title{
font-size:22px;
margin-bottom:15px
}

.lessons{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px
}

.lesson{
background:#fff;
border:1px solid #e1e6ee;
border-radius:14px;
padding:15px 12px;
cursor:pointer;
transition:.2s;
min-height:105px;
position:relative
}

.lesson:hover{
transform:translateY(-2px);
box-shadow:0 7px 20px rgba(0,0,0,.08)
}

.lesson.completed{
border-color:#22c55e;
background:#f0fdf4
}

.lesson-number{
font-size:11px;
color:#6b7280;
font-weight:700;
margin-bottom:7px
}

.lesson-title{
font-size:14px;
line-height:1.4;
font-weight:700
}

.lesson-check{
position:absolute;
right:9px;
top:9px;
color:#16a34a;
font-weight:700;
display:none
}

.lesson.completed .lesson-check{
display:block
}

.loading{
text-align:center;
padding:30px;
color:#6b7280
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
padding:16px;
border-radius:12px;
margin-bottom:20px;
line-height:1.5
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(15,23,42,.7);
z-index:100;
padding:20px;
overflow:auto
}

.modal.show{
display:block
}

.modal-box{
max-width:850px;
margin:30px auto;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.25)
}

.modal-header{
padding:20px;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px
}

.modal-header h2{
font-size:22px;
line-height:1.4
}

.close{
border:0;
background:#f1f5f9;
width:38px;
height:38px;
border-radius:50%;
font-size:22px;
cursor:pointer
}

.modal-body{
padding:22px
}

.language-tabs{
display:flex;
gap:8px;
margin-bottom:20px;
flex-wrap:wrap
}

.lang-btn{
border:1px solid #dbe2eb;
background:#fff;
padding:9px 14px;
border-radius:9px;
cursor:pointer;
font-weight:600
}

.lang-btn.active{
background:#2563eb;
color:#fff;
border-color:#2563eb
}

.lesson-content{
line-height:1.7
}

.dialogue{
border:1px solid #e5e7eb;
border-radius:13px;
padding:15px;
margin-bottom:12px;
background:#f8fafc
}

.speaker{
font-size:12px;
font-weight:700;
color:#2563eb;
margin-bottom:5px
}

.text{
font-size:16px
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px
}

.btn{
border:0;
border-radius:10px;
padding:11px 16px;
font-weight:700;
cursor:pointer;
font-size:14px
}

.btn-primary{background:#2563eb;color:#fff}
.btn-secondary{background:#e8eef8;color:#1e3a5f}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}

.status{
margin-top:12px;
font-size:13px;
color:#6b7280
}

footer{
text-align:center;
padding:30px 15px;
color:#7b8494;
font-size:13px
}

@media(max-width:900px){
.lessons{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:650px){
.hero h1{font-size:27px}
.lessons{grid-template-columns:repeat(2,1fr)}
.container{padding:18px 12px 40px}
.modal{padding:10px}
.modal-box{margin:10px auto}
}

@media(max-width:380px){
.lessons{grid-template-columns:1fr 1fr;gap:8px}
.lesson{padding:12px 9px}
.lesson-title{font-size:13px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">
<div class="brand">
<img class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">
<span>CreateLK Academy</span>
</div>

<a class="back-btn" href="../index.html">Home</a>
</div>
</header>

<main class="container">

<section class="hero">
<small>ONLINE COURSE</small>
<h1>Spoken English</h1>
<p>Build confidence through practical conversations and real-life situations.</p>
<div class="stats">100 Lessons • 1,000 Practical Dialogues</div>
</section>

<section class="ad-card">
<div class="ad-label">ADVERTISEMENT</div>

<script
async="async"
data-cfasync="false"
src="https://pl31237872.profitableratecpmnetwork.com/1568df789be0eb4e4fd608fce183e518/invoke.js">
</script>

<div id="container-1568df789be0eb4e4fd608fce183e518"></div>
</section>

<section class="progress-card">
<div class="progress-top">
<div class="progress-title">Your Progress</div>
<div class="progress-count" id="progressCount">0 of 100</div>
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>
</section>

<section>
<h2 class="section-title">100 Spoken English Lessons</h2>

<div id="errorBox"></div>

<div class="lessons" id="lessonGrid">
<div class="loading">Loading lessons...</div>
</div>
</section>

</main>

<footer>© 2026 CreateLK Academy</footer>


<div class="modal" id="lessonModal">

<div class="modal-box">

<div class="modal-header">
<h2 id="modalTitle">Lesson</h2>

<button class="close" onclick="closeLesson()">×</button>
</div>

<div class="modal-body">

<div class="language-tabs">

<button class="lang-btn active"
id="langEn"
onclick="changeLanguage('en')">
English
</button>

<button class="lang-btn"
id="langSi"
onclick="changeLanguage('si')">
සිංහල
</button>

<button class="lang-btn"
id="langTa"
onclick="changeLanguage('ta')">
தமிழ்
</button>

</div>

<div id="lessonContent" class="lesson-content">
Loading...
</div>

<div class="controls">

<button class="btn btn-primary" onclick="playAll()">
▶ Play All
</button>

<button class="btn btn-danger" onclick="stopSpeech()">
■ Stop
</button>

<button class="btn btn-success"
id="completeBtn"
onclick="completeLesson()">
✓ Mark Lesson Complete
</button>

</div>

<div class="status" id="lessonStatus"></div>

</div>
</div>
</div>


<script>

const API="https://ads.createlk.workers.dev";
const COURSE="spoken-english";

let lessons=[];
let currentLesson=null;
let currentLanguage="en";
let currentLessonData={};
let completedLessons=new Set();


function escapeHtml(v){
return v==null?"":String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


async function apiRequest(url,options={}){

const response=await fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(options.headers||{})
}
});

const text=await response.text();

if(!response.ok)
throw new Error("HTTP "+response.status+": "+text);

try{
const data=JSON.parse(text);

if(data&&data.success===false)
throw new Error(data.message||data.error||"API request failed");

return data;

}catch(e){
if(e.message.includes("API request failed"))
throw e;

throw new Error("Invalid JSON response: "+text);
}

}


async function loadLessons(){

const grid=document.getElementById("lessonGrid");
const error=document.getElementById("errorBox");

grid.innerHTML='<div class="loading">Loading lessons...</div>';
error.innerHTML="";

try{

const data=await apiRequest(
API+"/lessons?course="+encodeURIComponent(COURSE)
);

let result=
data.lessons||
data.results||
data.data||
data;

if(result&&Array.isArray(result.lessons))
result=result.lessons;

if(!Array.isArray(result))
throw new Error("Lessons data was not found.");

lessons=result;
renderLessons();

}catch(e){

console.error(e);

grid.innerHTML=
'<div class="loading">Not found.</div>';

error.innerHTML=
'<div class="error"><strong>Unable to load lessons.</strong><br>'+
escapeHtml(e.message)+
'</div>';

}

}


function renderLessons(){

const grid=document.getElementById("lessonGrid");

if(!lessons.length){
grid.innerHTML='<div class="loading">No lessons found.</div>';
return;
}

grid.innerHTML="";

lessons.forEach((lesson,index)=>{

const number=Number(
lesson.lesson||
lesson.lesson_number||
lesson.number||
index+1
);

const title=
lesson.title||
lesson.name||
"Lesson "+number;

const div=document.createElement("div");

div.className=
"lesson"+
(completedLessons.has(number)?" completed":"");

div.onclick=()=>openLesson(number,title);

div.innerHTML=`
<div class="lesson-check">✓</div>
<div class="lesson-number">LESSON ${number}</div>
<div class="lesson-title">${escapeHtml(title)}</div>
`;

grid.appendChild(div);

});

}


async function loadProgress(){

try{

const data=await apiRequest(
API+"/progress?course="+encodeURIComponent(COURSE)
);

let p=data.progress||data.completed||data.data||[];

if(p&&Array.isArray(p.completedLessons))
p=p.completedLessons;

if(Array.isArray(p))
completedLessons=new Set(p.map(Number));

updateProgress();

}catch(e){

loadLocalProgress();

}

}


function loadLocalProgress(){

try{

const saved=JSON.parse(
localStorage.getItem("createlk_completed_lessons")||"[]"
);

if(Array.isArray(saved))
completedLessons=new Set(saved.map(Number));

}catch(e){}

updateProgress();

}


function saveLocalProgress(){

localStorage.setItem(
"createlk_completed_lessons",
JSON.stringify([...completedLessons])
);

}


function updateProgress(){

const count=completedLessons.size;

document.getElementById("progressCount").textContent=
count+" of 100";

document.getElementById("progressFill").style.width=
Math.min(100,count)+"%";

renderLessons();

}


async function getLesson(number,language){

return apiRequest(
API+
"/lesson?course="+encodeURIComponent(COURSE)+
"&lesson="+encodeURIComponent(number)+
"&language="+encodeURIComponent(language)
);

}


async function openLesson(number,title){

currentLesson=number;
currentLanguage="en";
currentLessonData={};

document.getElementById("modalTitle").textContent=
"Lesson "+number+(title?" — "+title:"");

document.getElementById("lessonModal").classList.add("show");

document.getElementById("lessonContent").innerHTML=
'<div class="loading">Loading lesson...</div>';

setLanguageButtons("en");

try{

currentLessonData.en=
await getLesson(number,"en");

renderLesson("en");

try{
currentLessonData.si=
await getLesson(number,"si");
}catch(e){}

try{
currentLessonData.ta=
await getLesson(number,"ta");
}catch(e){}

updateCompleteButton();

}catch(e){

document.getElementById("lessonContent").innerHTML=
'<div class="error"><strong>Lesson not found.</strong><br>'+
escapeHtml(e.message)+
'</div>';

}

}


function extractDialogues(data){

if(!data)return[];

let r=data.lesson||data.data||data;

if(r&&Array.isArray(r.dialogues))
return r.dialogues;

if(r&&Array.isArray(r.conversations))
return r.conversations;

if(r&&Array.isArray(r.content))
return r.content;

if(Array.isArray(r))
return r;

return [];

}


function renderLesson(language){

currentLanguage=language;

const data=currentLessonData[language];

if(!data){

document.getElementById("lessonContent").innerHTML=
'<div class="loading">Translation not available.</div>';

return;
}

const dialogues=extractDialogues(data);

let html="";

if(dialogues.length){

dialogues.forEach((item,i)=>{

const speaker=
item.speaker||
item.role||
item.person||
(i%2?"B":"A");

const text=
item.text||
item.dialogue||
item.sentence||
item.content||
"";

html+=`
<div class="dialogue">
<div class="speaker">${escapeHtml(speaker)}</div>
<div class="text">${escapeHtml(text)}</div>
</div>
`;

});

}else{

const text=
data.text||
data.content||
data.lesson_text||
data.description||
(typeof data.data==="string"?data.data:"");

html=text?
`<div class="dialogue"><div class="text">${escapeHtml(text)}</div></div>`:
'<div class="loading">Lesson content not found.</div>';

}

document.getElementById("lessonContent").innerHTML=html;

updateCompleteButton();

}


function changeLanguage(language){

currentLanguage=language;
setLanguageButtons(language);

if(currentLessonData[language])
renderLesson(language);
else
document.getElementById("lessonContent").innerHTML=
'<div class="loading">Translation not available.</div>';

}


function setLanguageButtons(language){

["En","Si","Ta"].forEach(x=>{
document.getElementById("lang"+x)
.classList.toggle(
"active",
language===x.toLowerCase()
);
});

}


function playAll(){

if(!("speechSynthesis" in window)){
alert("Speech synthesis is not supported.");
return;
}

stopSpeech();

const text=
document.getElementById("lessonContent").innerText;

if(!text)return;

const speech=
new SpeechSynthesisUtterance(text);

speech.lang=
currentLanguage==="si"?"si-LK":
currentLanguage==="ta"?"ta-LK":
"en-US";

speech.rate=.9;

speechSynthesis.speak(speech);

}


function stopSpeech(){

if("speechSynthesis" in window)
speechSynthesis.cancel();

}


async function completeLesson(){

if(!currentLesson)return;

completedLessons.add(Number(currentLesson));

saveLocalProgress();
updateProgress();
updateCompleteButton();

try{

await apiRequest(
API+"/lesson/complete",
{
method:"POST",
body:JSON.stringify({
course:COURSE,
lesson:Number(currentLesson)
})
}
);

}catch(e){}

}


function updateCompleteButton(){

const btn=document.getElementById("completeBtn");

if(completedLessons.has(Number(currentLesson))){

btn.textContent="✓ Lesson Completed";
btn.className="btn btn-secondary";

}else{

btn.textContent="✓ Mark Lesson Complete";
btn.className="btn btn-success";

}

}


function closeLesson(){

stopSpeech();

document.getElementById("lessonModal")
.classList.remove("show");

}


document.getElementById("lessonModal")
.addEventListener("click",function(e){

if(e.target===this)
closeLesson();

});


document.addEventListener("keydown",e=>{

if(e.key==="Escape")
closeLesson();

});


async function init(){

loadLocalProgress();
await loadProgress();
await loadLessons();

}

init();

</script>

</body>
</html>
