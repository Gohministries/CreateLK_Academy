<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;padding:16px 20px}
.head,.wrap{max-width:1050px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}.logo b{color:#fbbf24}
.wrap{padding:25px 15px 50px}
.hero{padding:30px;border-radius:23px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#4f46e5);box-shadow:0 10px 30px #2563eb33}
.hero h1{font-size:31px;margin:8px 0}.hero p{line-height:1.6;opacity:.9}
.badge{display:inline-block;margin-top:15px;background:#ffffff20;padding:7px 12px;border-radius:20px;font-size:13px}

/* AD */

.ad-card{
background:#fff;
padding:15px;
border-radius:18px;
margin-top:18px;
box-shadow:0 5px 20px #0001;
text-align:center;
overflow:hidden
}

.ad-label{
font-size:11px;
color:#94a3b8;
margin-bottom:7px;
font-weight:bold;
letter-spacing:.5px
}

.card{background:#fff;padding:20px;border-radius:18px;margin-top:18px;box-shadow:0 5px 20px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{color:#64748b;font-size:14px;margin-top:5px}
.active{color:#16a34a;font-weight:bold}
.progress{height:10px;background:#e5e7eb;border-radius:20px;margin-top:12px;overflow:hidden}
.fill{height:100%;width:0;background:#2563eb;transition:.3s}
.section{margin:30px 0 15px}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.lesson{background:#fff;padding:18px;border-radius:17px;border:1px solid #e5e7eb}
.num{font-size:12px;color:#2563eb;font-weight:bold}
.lesson h3{margin:8px 0}
.lesson p{font-size:13px;color:#64748b;min-height:38px;line-height:1.5}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}
.open,.complete{background:#2563eb;color:#fff;border:0;padding:9px 13px;border-radius:9px;font-weight:bold;cursor:pointer}
.free{color:#16a34a;font-weight:bold;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;padding:15px;overflow:auto;z-index:10}
.modal{background:#fff;max-width:760px;margin:25px auto;border-radius:20px;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:22px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#ffffff20;color:#fff;border:0;font-size:22px;border-radius:8px;padding:4px 10px;cursor:pointer}
.modal-body{padding:20px}
.controls{display:flex;gap:10px;margin-bottom:18px}
.play,.stop{flex:1;border:0;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer}
.play{background:#1e3a8a;color:#fff}
.stop{background:#dc2626;color:#fff}
.language-select{flex:1;border:1px solid #e5e7eb;border-radius:10px;padding:12px;background:#fff;font-weight:bold;color:#172033}
.dialogue{padding:17px;margin:12px 0;border:1px solid #e5e7eb;border-radius:15px}
.dialogue.playing{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.lang{font-size:11px;font-weight:bold;color:#2563eb;margin-top:12px}
.text{margin-top:4px;line-height:1.55}
.complete{width:100%;margin-top:15px}
.loading{text-align:center;padding:35px;color:#64748b}
.error{text-align:center;padding:30px;color:#dc2626}

@media(max-width:750px){
 .lessons{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:520px){
 .lessons{grid-template-columns:1fr}
 .hero h1{font-size:26px}
 .controls{position:sticky;top:0;background:#fff;padding-bottom:8px;z-index:2;flex-wrap:wrap}
 .language-select{width:100%;flex:none}
 .play,.stop{min-width:0}
}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">CreateLK <b>Academy</b></div>
</div>
</header>

<main class="wrap">

<section class="hero">
<small>ONLINE COURSE</small>

<h1>
Spoken English
</h1>

<p>
Build confidence through practical conversations and real-life situations.
</p>

<span class="badge">
100 Lessons • 1,000 Practical Dialogues
</span>

</section>


<!-- ADVERTISEMENT -->

<section class="ad-card">

<div class="ad-label">
ADVERTISEMENT
</div>

<script
async="async"
data-cfasync="false"
src="https://pl31237872.profitableratecpmnetwork.com/1568df789be0eb4e4fd608fce183e518/invoke.js">
</script>

<div id="container-1568df789be0eb4e4fd608fce183e518"></div>

</section>


<section class="card">

<div class="row">

<b>
Your Progress
</b>

<b id="progressText">
0 of 100
</b>

</div>

<div class="progress">

<div id="fill" class="fill"></div>

</div>

</section>


<h2 class="section">
100 Spoken English Lessons
</h2>


<div id="lessons">

<div class="loading">
Loading...
</div>

</div>


</main>


<div id="modalBg" class="modal-bg">


<div class="modal">


<div class="modal-head">

<button
class="close"
onclick="closeLesson()">
×
</button>

<small id="modalNum">
LESSON
</small>

<h2 id="modalTitle">
Loading...
</h2>

</div>


<div id="modalBody" class="modal-body">

<div class="loading">
Loading lesson...
</div>

</div>


</div>

</div>


<script>

/*
========================================
WORKER URL
========================================
*/

const API="https://bible.createlk.workers.dev";

const COURSE="spoken-english";


/*
========================================
NO LOGIN
NO PREMIUM
NO PAYMENT
========================================
*/

let completed=[];
let dialogues=[];
let playing=false;
let selectedLanguage="en";


/*
========================================
HEADERS
========================================
*/

const headers={
"Content-Type":"application/json"
};


/*
========================================
HELPER
========================================
*/

const $=id=>document.getElementById(id);


/*
========================================
LESSON TITLES
========================================
*/

const titles=[

"Introducing Yourself",
"Greetings and Small Talk",
"Talking About Your Family",
"Talking About Your Home",
"Daily Routine",
"Morning Activities",
"Talking About Your Job",
"Talking About School",
"Talking About Friends",
"Asking for Personal Information",
"Meeting Someone New",
"Making a Phone Call",
"Sending a Message",
"Talking About the Time",
"Talking About the Date",
"Making Plans",
"Weekend Plans",
"Invitations",
"Accepting an Invitation",
"Refusing Politely",
"At the Restaurant",
"Ordering Food",
"Asking About a Menu",
"Paying the Bill",
"At a Café",
"Buying Groceries",
"At a Supermarket",
"Shopping for Clothes",
"Asking the Price",
"Returning an Item",
"At the Bus Stop",
"Taking a Bus",
"Taking a Taxi",
"Asking for Directions",
"Finding a Place",
"At the Train Station",
"Buying a Ticket",
"At the Airport",
"Checking Into a Hotel",
"Hotel Problems",
"Talking About Weather",
"Talking About Hobbies",
"Sports and Games",
"Music",
"Movies and TV",
"Reading Books",
"Weekend Activities",
"Holidays",
"Birthday Conversations",
"Celebrations",
"At the Doctor",
"Describing Symptoms",
"At the Pharmacy",
"Healthy Habits",
"Exercise and Fitness",
"Asking for Help",
"Offering Help",
"Giving Advice",
"Asking for Permission",
"Saying Sorry",
"Thanking Someone",
"Compliments",
"Agreeing and Disagreeing",
"Expressing Opinions",
"Making Suggestions",
"Making Decisions",
"Solving a Problem",
"Making a Complaint",
"Apologizing Professionally",
"Workplace Conversations",
"Job Interviews",
"Talking With a Customer",
"Talking With a Manager",
"Making an Appointment",
"Office Phone Calls",
"Meetings",
"Giving Instructions",
"Asking Questions at Work",
"Discussing a Project",
"Talking About Money",
"Banking",
"Using an ATM",
"Online Shopping",
"Using the Internet",
"Social Media Conversations",
"Learning English",
"Practicing English",
"Common English Mistakes",
"Understanding Fast English",
"Everyday Expressions",
"Making Conversation",
"Keeping a Conversation Going",
"Speaking Politely",
"Speaking Confidently",
"Natural English",
"Travel Conversations",
"Emergency Conversations",
"Real-Life Situations",
"Advanced Everyday Conversations",
"Speaking English Confidently"

];


/*
========================================
LOAD LESSONS
========================================
*/

async function loadLessons(){

try{

const r=await fetch(
`${API}/lessons?course=${COURSE}&language=en`,
{headers}
);

const text=await r.text();

let d;

try{

d=JSON.parse(text);

}catch{

throw Error(
`Lessons server error (${r.status})`
);

}

if(!r.ok||!d.success)

throw Error(
d.error||
d.message||
"Unable to load lessons."
);


const apiLessons=d.lessons||[];


$("lessons").innerHTML=

titles.map((title,i)=>{

const n=i+1;

const api=apiLessons.find(
x=>+x.lesson_number===n
);

const done=completed.includes(n);

return `

<article class="lesson">

<div class="num">
LESSON ${n}
</div>

<h3>
${esc(api?.title||title)}
</h3>

<p>
${esc(
api?.summary||
api?.objectives||
"Practical English conversation"
)}
</p>

<div class="bottom">

<span class="free">

${done
?"✓ COMPLETED"
:"FREE"}

</span>


<button
class="open"
onclick="openLesson(${n})">

Open

</button>

</div>

</article>

`;

}).join("");


}catch(e){

console.error(e);

$("lessons").innerHTML=

`<div class="error">

${esc(
e.message||
"Unable to load lessons."
)}

</div>`;

}

}


/*
========================================
OPEN LESSON
========================================
*/

async function openLesson(n){

stopSpeech();

$("modalBg").style.display="block";

$("modalNum").textContent=
"LESSON "+n;

$("modalTitle").textContent=
"Loading...";

$("modalBody").innerHTML=
'<div class="loading">Loading lesson...</div>';


try{


/*
========================================
ENGLISH FIRST
========================================
*/

const en=await getLesson(n,"en");

const l=en.lesson;

if(!l)
throw Error(
"Lesson data not found."
);


/*
========================================
OPTIONAL TRANSLATIONS
========================================
*/

let si=null;
let ta=null;

try{

si=await getLesson(n,"si");

}catch(e){

console.warn(
"Sinhala translation unavailable:",
e
);

}

try{

ta=await getLesson(n,"ta");

}catch(e){

console.warn(
"Tamil translation unavailable:",
e
);

}


/*
========================================
BUILD DIALOGUES
========================================
*/

dialogues=[];

const enD=l.dialogues||[];

const siD=
si?.lesson?.dialogues||[];

const taD=
ta?.lesson?.dialogues||[];


for(let i=0;i<enD.length;i++){

dialogues.push({

number:
enD[i].dialogue_number,

lines:[

{

language:"English",

speaker:
enD[i].speaker_a||"",

text:
enD[i].text_a||""

},

{

language:"English",

speaker:
enD[i].speaker_b||"",

text:
enD[i].text_b||""

},

{

language:"Sinhala",

speaker:
siD[i]?.speaker_a||"",

text:
siD[i]?.text_a||""

},

{

language:"Sinhala",

speaker:
siD[i]?.speaker_b||"",

text:
siD[i]?.text_b||""

},

{

language:"Tamil",

speaker:
taD[i]?.speaker_a||"",

text:
taD[i]?.text_a||""

},

{

language:"Tamil",

speaker:
taD[i]?.speaker_b||"",

text:
taD[i]?.text_b||""

}

]

});

}


$("modalTitle").textContent=
l.title||titles[n-1];


let html="";


if(l.objectives){

html+=`

<div
class="card"
style="margin:0 0 15px">

${esc(l.objectives)}

</div>

`;

}


html+=`

<div class="controls">

<select
id="languageSelect"
class="language-select"
onchange="changeLanguage()">

<option value="en">
English Only
</option>

<option value="ta">
English → Tamil
</option>

<option value="si">
English → Sinhala
</option>

</select>


<button
id="playBtn"
class="play"
onclick="playAll()">

▶️ Play All

</button>


<button
class="stop"
onclick="stopSpeech()">

⏹️ Stop

</button>

</div>

`;


html+=

dialogues.map((d,i)=>`

<div
class="dialogue"
id="dialogue-${i}">

<div class="num">

DIALOGUE ${d.number}

</div>

${renderLines(d)}

</div>

`).join("");


html+=`

<button
class="complete"
onclick="completeLesson(${n})">

${completed.includes(n)
?"✓ Lesson Completed"
:"Mark Lesson Complete"}

</button>

`;


$("modalBody").innerHTML=
html;


}catch(e){

console.error(
"OPEN LESSON ERROR:",
e
);

$("modalBody").innerHTML=

`<div class="error">

${esc(
e.message||
"Unable to load this lesson."
)}

<br><br>

<button
class="open"
onclick="openLesson(${n})">

Try Again

</button>

</div>`;

}

}


/*
========================================
RENDER LANGUAGE LINES
========================================
*/

function renderLines(d){

return d.lines.map(x=>{

const show=

selectedLanguage==="en"

?x.language==="English"

:selectedLanguage==="ta"

?x.language==="English"||
 x.language==="Tamil"

:x.language==="English"||
 x.language==="Sinhala";


return show&&x.text?`

<div class="lang">
${x.language}
</div>

<div class="text">

<b>
${esc(x.speaker)}:
</b>

${esc(x.text)}

</div>

`:"";

}).join("");

}


/*
========================================
CHANGE LANGUAGE
========================================
*/

function changeLanguage(){

selectedLanguage=
$("languageSelect").value;


stopSpeech();


dialogues.forEach((d,i)=>{

const box=
$("dialogue-"+i);


if(box){

box.innerHTML=`

<div class="num">

DIALOGUE ${d.number}

</div>

${renderLines(d)}

`;

}

});

}


/*
========================================
GET LESSON
========================================
*/

async function getLesson(n,language){

const url=
`${API}/lesson?course=${COURSE}&lesson=${n}&language=${language}`;

console.log(
"Loading lesson:",
url
);


const r=await fetch(
url,
{headers}
);


const text=
await r.text();


console.log(
"Lesson response:",
language,
r.status,
text
);


let d;


try{

d=JSON.parse(text);

}catch{

throw Error(
`Lesson server error (${r.status}): ${text.substring(0,150)}`
);

}


if(!r.ok||!d.success)

throw Error(
d.error||
d.message||
`Unable to load ${language} lesson. Server status: ${r.status}`
);


return d;

}


/*
========================================
SPEECH
========================================
*/

const voiceLang={

English:"en-US",

Sinhala:"si-LK",

Tamil:"ta-LK"

};


function playAll(){

stopSpeech();


playing=true;


if($("playBtn")){

$("playBtn").textContent=
"⏸️ Playing...";

}


let index=0;


function next(){


if(
!playing||
index>=dialogues.length
){

playing=false;


if($("playBtn")){

$("playBtn").textContent=
"▶️ Play All";

}


return;

}


const box=
$("dialogue-"+index);


document
.querySelectorAll(".dialogue")
.forEach(x=>
x.classList.remove("playing")
);


box.classList.add("playing");


box.scrollIntoView({

behavior:"smooth",

block:"center"

});


const allowed=

selectedLanguage==="en"

?["English"]

:selectedLanguage==="ta"

?["English","Tamil"]

:["English","Sinhala"];


const lines=

dialogues[index].lines.filter(
x=>allowed.includes(x.language)
);


speakLines(

lines,

0,

()=>{

index++;

next();

}

);

}


next();

}


function speakLines(lines,i,done){


if(
!playing||
i>=lines.length
){

done();

return;

}


const line=
lines[i];


if(!line.text){

speakLines(
lines,
i+1,
done
);

return;

}


const u=
new SpeechSynthesisUtterance(
line.text
);


u.lang=
voiceLang[line.language];


u.rate=.88;


u.onend=()=>{

speakLines(
lines,
i+1,
done
);

};


speechSynthesis.speak(u);

}


/*
========================================
STOP SPEECH
========================================
*/

function stopSpeech(){

playing=false;


speechSynthesis.cancel();


document
.querySelectorAll(".dialogue")
.forEach(x=>
x.classList.remove("playing")
);


if($("playBtn")){

$("playBtn").textContent=
"▶️ Play All";

}

}


/*
========================================
COMPLETE LESSON
========================================
*/

async function completeLesson(n){

try{


const r=await fetch(

`${API}/lesson/complete`,

{

method:"POST",

headers,

body:JSON.stringify({

course:COURSE,

lesson_number:n

})

}

);


const text=
await r.text();


let d;


try{

d=JSON.parse(text);

}catch{

throw Error(
`Completion server error (${r.status})`
);

}


if(!r.ok||!d.success)

throw Error(
d.error||
d.message||
"Unable to complete lesson."
);


if(!completed.includes(n))

completed.push(n);


updateProgress(

d.completed_count||
completed.length

);


closeLesson();


loadLessons();


}catch(e){

alert(

e.message||
"Unable to complete lesson."

);

}

}


/*
========================================
LOAD PROGRESS
========================================
*/

async function loadProgress(){

try{


const r=await fetch(

`${API}/progress?course=${COURSE}`,

{headers}

);


const text=
await r.text();


let d;


try{

d=JSON.parse(text);

}catch{

throw Error(
`Progress server error (${r.status})`
);

}


if(d.success){

completed=
(d.lessons||[])
.map(
x=>+x.lesson_number
);


updateProgress(

d.completed_count||
completed.length

);

}


}catch(e){

console.error(
"Progress:",
e
);

}

}


/*
========================================
UPDATE PROGRESS
========================================
*/

function updateProgress(n){

n=Math.min(

100,

+n||0

);


$("progressText").textContent=

n+" of 100";


$("fill").style.width=

n+"%";

}


/*
========================================
CLOSE LESSON
========================================
*/

function closeLesson(){

stopSpeech();


$("modalBg").style.display=
"none";

}


/*
========================================
ESCAPE HTML
========================================
*/

function esc(v){

return String(v??"")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/*
========================================
CLOSE MODAL ON BACKGROUND CLICK
========================================
*/

$("modalBg").onclick=e=>{

if(
e.target===
$("modalBg")
)

closeLesson();

};


/*
========================================
INITIALIZE
========================================
*/

async function init(){

await loadProgress();

await loadLessons();

}


init();

</script>

</body>
</html>
