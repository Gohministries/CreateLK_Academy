<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Account | CreateLK Academy</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
min-height:100vh;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
text-decoration:none;
}

.back{
font-size:14px;
font-weight:600;
color:#475467;
text-decoration:none;
}

main{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:35px 15px;
}

.card{
width:100%;
max-width:500px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.header{
text-align:center;
margin-bottom:25px;
}

.icon{
width:60px;
height:60px;
margin:auto;
border-radius:16px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:27px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.5;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.group{
margin-bottom:16px;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

input{
width:100%;
height:48px;
padding:0 13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:14px;
outline:none;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

.note{
font-size:11px;
color:#667085;
margin-top:5px;
}

.terms{
display:flex;
gap:8px;
align-items:flex-start;
margin:18px 0;
font-size:12px;
color:#667085;
line-height:1.5;
}

.terms input{
width:16px;
height:16px;
margin-top:2px;
flex-shrink:0;
}

.terms label{
font-size:12px;
font-weight:normal;
margin:0;
}

.terms a{
color:#155eef;
font-weight:700;
text-decoration:none;
}

button{
width:100%;
height:50px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

button:hover{
background:#0d4dcc;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:18px;
font-size:13px;
line-height:1.5;
text-align:center;
}

.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.message.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

.message.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.login{
text-align:center;
margin-top:20px;
font-size:14px;
color:#667085;
}

.login a{
color:#155eef;
font-weight:700;
text-decoration:none;
}

footer{
text-align:center;
padding:20px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:550px){

.card{
padding:22px 18px;
}

.row{
grid-template-columns:1fr;
gap:0;
}

h1{
font-size:24px;
}

.logo{
font-size:17px;
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<a href="index.html" class="logo">
📚 CreateLK Academy
</a>

<a href="index.html" class="back">
← Home
</a>

</div>

</header>


<main>

<div class="card">

<div class="header">

<div class="icon">
👤
</div>

<h1>Create Your Account</h1>

<div class="subtitle">
Create your CreateLK Academy student account.
</div>

</div>


<div id="message" class="message"></div>


<form id="registerForm">


<div class="row">

<div class="group">

<label for="firstName">
First Name
</label>

<input
id="firstName"
type="text"
placeholder="First name"
required
autocomplete="given-name">

</div>


<div class="group">

<label for="lastName">
Last Name
</label>

<input
id="lastName"
type="text"
placeholder="Last name"
required
autocomplete="family-name">

</div>

</div>


<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email">

</div>


<div class="group">

<label for="phone">
Phone Number
</label>

<input
id="phone"
type="tel"
placeholder="07XXXXXXXX"
required
autocomplete="tel">

</div>


<div class="group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Minimum 8 characters"
required
minlength="8"
autocomplete="new-password">

<div class="note">
Password must contain at least 8 characters.
</div>

</div>


<div class="group">

<label for="confirmPassword">
Confirm Password
</label>

<input
id="confirmPassword"
type="password"
placeholder="Enter password again"
required
minlength="8"
autocomplete="new-password">

</div>


<div class="terms">

<input
id="agree"
type="checkbox"
required>

<label for="agree">

I agree to the
<a href="terms.html" target="_blank">
Terms & Conditions
</a>
and
<a href="privacy.html" target="_blank">
Privacy Policy
</a>.

</label>

</div>


<button
id="registerButton"
type="submit">

Create Student Account

</button>


</form>


<div class="login">

Already have an account?

<a href="login-v2.html">
Login here
</a>

</div>

</div>

</main>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

const API_URL =
"https://createlk-academy-v2-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_v2_logged_in";


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const button =
document.getElementById("registerButton");


function showMessage(text,type){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


function hideMessage(){

message.className =
"message";

message.textContent =
"";

message.style.display =
"none";

}


form.addEventListener(
"submit",
async function(e){

e.preventDefault();

hideMessage();


const firstName =
document.getElementById("firstName")
.value.trim();

const lastName =
document.getElementById("lastName")
.value.trim();

const email =
document.getElementById("email")
.value.trim()
.toLowerCase();

const phone =
document.getElementById("phone")
.value.trim();

const password =
document.getElementById("password")
.value;

const confirmPassword =
document.getElementById("confirmPassword")
.value;


if(password.length < 8){

showMessage(
"Password must contain at least 8 characters.",
"error"
);

return;

}


if(password !== confirmPassword){

showMessage(
"Passwords do not match.",
"error"
);

return;

}


button.disabled = true;

button.textContent =
"Creating Account...";


showMessage(
"Creating your account...",
"info"
);


try{

const response =
await fetch(
API_URL + "/api/register",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

firstName:firstName,
lastName:lastName,
email:email,
phone:phone,
password:password

})
}
);


const raw =
await response.text();

console.log(
"REGISTER RESPONSE:",
raw
);


let data;

try{

data =
JSON.parse(raw);

}catch(e){

throw new Error(
"Invalid response from V2 registration server."
);

}


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Registration failed."
);

}


const s =
data.student || {};


const studentId =
data.student_id ||
data.studentId ||
s.id;


if(
!studentId ||
!Number.isInteger(
Number(studentId)
)
){

console.error(
"Missing student ID:",
data
);

throw new Error(
"Account created but student ID was not returned by the server."
);

}


const studentData = {

id:Number(studentId),

student_id:Number(studentId),

first_name:
data.first_name ||
data.firstName ||
s.first_name ||
s.firstName ||
firstName,

last_name:
data.last_name ||
data.lastName ||
s.last_name ||
s.lastName ||
lastName,

email:
data.email ||
s.email ||
email,

phone:
data.phone ||
s.phone ||
phone,

membership_status:
data.membership_status ||
s.membership_status ||
"NONE",

membership_expiry:
data.membership_expiry ||
s.membership_expiry ||
null

};


sessionStorage.setItem(
STUDENT_KEY,
JSON.stringify(studentData)
);

sessionStorage.setItem(
LOGIN_KEY,
"true"
);

sessionStorage.setItem(
"createlk_student_id",
String(studentId)
);

sessionStorage.setItem(
"createlk_student_email",
email
);


showMessage(
"✅ Account created successfully. Opening your dashboard...",
"success"
);

button.textContent =
"✓ Account Created";


setTimeout(
function(){

window.location.href =
"dashboard-v2.html";

},
1000
);


}catch(error){

console.error(
"Registration error:",
error
);

showMessage(
error.message ||
"Unable to connect to the V2 server.",
"error"
);

button.disabled = false;

button.textContent =
"Create Student Account";

}

});

</script>

</body>
</html>
