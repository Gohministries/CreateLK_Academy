<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Jobs | Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  padding:20px
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px 22px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px #00000012
}

.logo{
  width:70px;
  height:70px;
  border-radius:16px;
  object-fit:cover
}

h1{
  margin:15px 0 7px;
  color:#102a56
}

p{
  color:#687386;
  line-height:1.5
}

.login{
  display:block;
  margin-top:22px;
  padding:14px;
  border-radius:11px;
  background:#102a56;
  color:#fff;
  text-decoration:none;
  font-weight:700
}

.back{
  display:block;
  margin-top:15px;
  color:#102a56;
  text-decoration:none;
  font-size:14px
}

#status{
  margin-top:15px;
  color:#687386;
  font-size:14px
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
    alt="CreateLK Jobs">

  <h1>CreateLK Jobs</h1>

  <p>
    Login to post jobs, manage your advertisements
    and view applications.
  </p>

  <a
    class="login"
    href="https://createlk-jobs-auth-v2.createlk.workers.dev/login">
    Continue with Google
  </a>

  <a
    class="back"
    href="/jobs/index.html">
    ← Browse Jobs
  </a>

  <div id="status">
    Checking login...
  </div>

</div>

<script>

const AUTH =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

async function checkLogin(){

  try{

    const response=await fetch(
      AUTH+"/api/me",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(!response.ok){

      document.getElementById("status").textContent=
        "Please login to continue.";

      return;
    }

    const data=await response.json();

    if(data.ok && data.user){

      document.getElementById("status").textContent=
        "Already logged in. Opening dashboard...";

      location.replace("/jobs/dashboard.html");

      return;
    }

    document.getElementById("status").textContent=
      "Please login to continue.";

  }catch(error){

    document.getElementById("status").textContent=
      "Please login to continue.";

  }

}

checkLogin();

</script>

</body>
</html>
