<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#102a56">

<title>CreateLK Jobs | Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#102a56;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:32px 24px;
  box-shadow:0 12px 40px rgba(16,42,86,.12);
  text-align:center;
}

.logo{
  width:80px;
  height:80px;
  object-fit:contain;
  border-radius:18px;
  margin-bottom:15px;
}

h1{
  margin:0 0 8px;
  font-size:27px;
}

.subtitle{
  margin:0 0 28px;
  color:#667085;
  line-height:1.5;
}

.google-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px 18px;
  background:#102a56;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.google-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.status{
  margin-top:18px;
  min-height:22px;
  color:#667085;
  font-size:14px;
}

.back{
  display:block;
  margin-top:22px;
  color:#102a56;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  text-decoration:underline;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid #d0d5dd;
  border-top-color:#102a56;
  border-radius:50%;
  display:inline-block;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
    alt="CreateLK Jobs"
  >

  <h1>CreateLK Jobs</h1>

  <p class="subtitle">
    Sign in to manage your jobs, applications and account.
  </p>

  <button
    id="loginBtn"
    class="google-btn"
    type="button"
    onclick="login()"
  >
    Continue with Google
  </button>

  <div id="status" class="status">
    Checking login...
  </div>

  <a class="back" href="/jobs/">
    ← Back to Jobs
  </a>

</div>

<script>

const AUTH_API =
  "https://createlk-jobs-auth-v2.createlk.workers.dev";

const DASHBOARD =
  "https://createlk.com/jobs/dashboard.html";

let checkingLogin = false;


function setStatus(text, loading = false){

  const status =
    document.getElementById("status");

  if(loading){

    status.innerHTML =
      '<span class="spinner"></span>' + text;

  }else{

    status.textContent = text;

  }

}


function login(){

  if(checkingLogin){
    return;
  }

  setStatus(
    "Redirecting to Google...",
    true
  );

  document.getElementById(
    "loginBtn"
  ).disabled = true;

  window.location.href =
    AUTH_API + "/login?return_to=" +
    encodeURIComponent(DASHBOARD);

}


async function checkLogin(){

  if(checkingLogin){
    return;
  }

  checkingLogin = true;

  try{

    const response = await fetch(
      AUTH_API + "/api/me",
      {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!response.ok){

      setStatus(
        "Please sign in with Google."
      );

      return;
    }

    const data =
      await response.json();

    if(data.ok && data.user){

      setStatus(
        "Already signed in. Opening dashboard...",
        true
      );

      window.location.replace(
        DASHBOARD
      );

      return;
    }

    setStatus(
      "Please sign in with Google."
    );

  }catch(error){

    console.error(
      "Login check error:",
      error
    );

    setStatus(
      "Please sign in with Google."
    );

  }finally{

    checkingLogin = false;

  }

}


checkLogin();

</script>

</body>
</html>
