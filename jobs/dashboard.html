<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobs Dashboard Test</title>
<style>
body{
  font-family:Arial;
  padding:20px;
  background:#f5f7fb;
}
button{
  padding:12px 18px;
  margin:6px 0;
  border:0;
  border-radius:8px;
  background:#1769e0;
  color:white;
  font-weight:bold;
}
pre{
  background:white;
  padding:15px;
  border-radius:10px;
  overflow:auto;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<h2>CreateLK Jobs Dashboard Test</h2>

<button onclick="testMe()">Test Login</button>
<button onclick="testAds()">Test My Ads</button>
<button onclick="testApplications()">Test Applications</button>

<pre id="result">Click a button to test.</pre>

<script>

const AUTH_API =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

const JOBS_API =
"https://createlk-jobs-api-v2.createlk.workers.dev";

const result =
document.getElementById("result");

async function testMe(){

  result.textContent="Testing login...";

  try{

    const r=await fetch(
      AUTH_API+"/api/me",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    const data=await r.json();

    result.textContent=
      "AUTH /api/me\n\n"+
      "Status: "+r.status+
      "\n\n"+
      JSON.stringify(data,null,2);

  }catch(e){

    result.textContent=
      "ERROR:\n"+e;
  }
}


async function testAds(){

  result.textContent="Testing My Ads...";

  try{

    const r=await fetch(
      JOBS_API+"/api/my-ads",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    const text=await r.text();

    result.textContent=
      "JOBS API /api/my-ads\n\n"+
      "Status: "+r.status+
      "\n\n"+text;

  }catch(e){

    result.textContent=
      "ERROR:\n"+e;
  }
}


async function testApplications(){

  result.textContent="Testing Applications...";

  try{

    const r=await fetch(
      JOBS_API+"/api/my-applications",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    const text=await r.text();

    result.textContent=
      "JOBS API /api/my-applications\n\n"+
      "Status: "+r.status+
      "\n\n"+text;

  }catch(e){

    result.textContent=
      "ERROR:\n"+e;
  }
}

</script>

</body>
</html>
