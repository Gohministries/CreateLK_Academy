<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Jobs Dashboard</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f6f8ff,#eef2ff);
  color:#172033;
  min-height:100vh;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
  color:#1747d1;
}

.brand span{
  display:block;
  font-size:11px;
  color:#6b7280;
  margin-top:2px;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-photo{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.user-name{
  font-weight:700;
  font-size:14px;
}

.user-role{
  font-size:11px;
  color:#6b7280;
  margin-top:2px;
}

.logout{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:24px 16px 50px;
}

.welcome{
  background:linear-gradient(135deg,#1747d1,#315ee8);
  color:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(23,71,209,.15);
}

.welcome h1{
  font-size:25px;
  margin-bottom:7px;
}

.welcome p{
  opacity:.9;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px;
}

.action{
  border:0;
  border-radius:12px;
  padding:15px 10px;
  font-weight:800;
  background:#fff;
  color:#1747d1;
  border:1px solid #dbe3ff;
  box-shadow:0 5px 18px rgba(20,40,100,.05);
}

.action.primary{
  background:#1747d1;
  color:#fff;
  border-color:#1747d1;
}

.section{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.section-head h2{
  font-size:18px;
}

.refresh{
  border:1px solid #dbe3ff;
  background:#f5f7ff;
  color:#1747d1;
  border-radius:8px;
  padding:7px 11px;
  font-weight:700;
}

.status{
  padding:12px;
  background:#f8fafc;
  border-radius:10px;
  color:#64748b;
  font-size:13px;
  text-align:center;
}

.card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:10px;
}

.card:last-child{
  margin-bottom:0;
}

.card-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:7px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  background:#eef2ff;
  color:#315ee8;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.badge.pending{
  background:#fff7ed;
  color:#c2410c;
}

.badge.approved{
  background:#ecfdf5;
  color:#047857;
}

.badge.rejected{
  background:#fef2f2;
  color:#b91c1c;
}

.badge.payment{
  background:#fefce8;
  color:#a16207;
}

.card-info{
  color:#64748b;
  font-size:13px;
  line-height:1.6;
}

.empty{
  text-align:center;
  padding:22px 10px;
  color:#64748b;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#64748b;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:15px;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){

  .header-inner{
    padding:11px 12px;
  }

  .brand{
    font-size:17px;
  }

  .user-name,
  .user-role{
    display:none;
  }

  .user-photo{
    width:36px;
    height:36px;
  }

  .logout{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    padding:16px 12px 40px;
  }

  .welcome{
    padding:20px;
    border-radius:15px;
  }

  .welcome h1{
    font-size:21px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .action{
    width:100%;
  }

  .section{
    padding:14px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="/jobs/" class="brand">
      CreateLK Jobs
      <span>Find Jobs. Build Your Future.</span>
    </a>

    <div class="user-area">

      <div>
        <div id="userName" class="user-name">
          Loading...
        </div>

        <div id="userRole" class="user-role">
          Job Seeker
        </div>
      </div>

      <img
        id="userPhoto"
        class="user-photo"
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="Profile">

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>
</header>


<main class="container">

  <div id="errorBox"
       class="error hidden"></div>


  <section class="welcome">

    <h1>
      Welcome, <span id="welcomeName">User</span> 👋
    </h1>

    <p>
      Manage your job advertisements and applications from your dashboard.
    </p>

  </section>


  <section class="actions">

    <button
      class="action primary"
      onclick="window.location.href='/jobs/post.html'">
      ＋ Post a Job
    </button>

    <button
      class="action"
      onclick="loadAds()">
      My Ads
    </button>

    <button
      class="action"
      onclick="loadApplications()">
      My Applications
    </button>

  </section>


  <!-- MY ADS -->

  <section class="section">

    <div class="section-head">

      <h2>My Job Ads</h2>

      <button
        class="refresh"
        onclick="loadAds()">
        Refresh
      </button>

    </div>

    <div id="adsList">
      <div class="loading">
        Loading your ads...
      </div>
    </div>

  </section>


  <!-- APPLICATIONS -->

  <section class="section">

    <div class="section-head">

      <h2>My Applications</h2>

      <button
        class="refresh"
        onclick="loadApplications()">
        Refresh
      </button>

    </div>

    <div id="applicationsList">
      <div class="loading">
        Loading your applications...
      </div>
    </div>

  </section>

</main>


<script>

/* =========================================
   API
========================================= */

const AUTH_API =
  "https://createlk.com/jobs-auth";

const JOBS_API =
  "https://createlk.com/jobs-api";


/* =========================================
   ELEMENTS
========================================= */

const userName =
  document.getElementById("userName");

const welcomeName =
  document.getElementById("welcomeName");

const userRole =
  document.getElementById("userRole");

const userPhoto =
  document.getElementById("userPhoto");

const adsList =
  document.getElementById("adsList");

const applicationsList =
  document.getElementById("applicationsList");

const errorBox =
  document.getElementById("errorBox");


/* =========================================
   ERROR
========================================= */

function showError(message){

  errorBox.textContent = message;

  errorBox.classList.remove("hidden");
}


function hideError(){

  errorBox.textContent = "";

  errorBox.classList.add("hidden");
}


/* =========================================
   AUTH CHECK
========================================= */

async function checkLogin(){

  try{

    const response =
      await fetch(
        AUTH_API + "/api/me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok ||
      !data.user
    ){

      window.location.href =
        "/jobs/login.html";

      return null;
    }

    displayUser(data.user);

    return data.user;

  }catch(error){

    console.error(error);

    showError(
      "Unable to connect to the login service."
    );

    return null;
  }
}


/* =========================================
   DISPLAY USER
========================================= */

function displayUser(user){

  const name =
    user.name ||
    user.email ||
    "User";

  userName.textContent =
    name;

  welcomeName.textContent =
    name;

  userRole.textContent =
    user.role ||
    "Job Seeker";

  if(user.photo_url){

    userPhoto.src =
      user.photo_url;

  }
}


/* =========================================
   LOAD ADS
========================================= */

async function loadAds(){

  adsList.innerHTML =
    '<div class="loading">Loading your ads...</div>';

  try{

    const response =
      await fetch(
        JOBS_API + "/api/my-ads",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(response.status === 401){

      window.location.href =
        "/jobs/login.html";

      return;
    }

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Unable to load ads."
      );
    }

    renderAds(
      data.ads || []
    );

  }catch(error){

    console.error(error);

    adsList.innerHTML =
      `<div class="status">
        ${escapeHtml(error.message)}
      </div>`;
  }
}


/* =========================================
   RENDER ADS
========================================= */

function renderAds(ads){

  if(!ads.length){

    adsList.innerHTML =
      `<div class="empty">
        You have not posted any jobs yet.
      </div>`;

    return;
  }

  adsList.innerHTML =
    ads.map(ad => {

      const status =
        String(
          ad.status || "pending"
        ).toLowerCase();

      let badgeClass =
        "";

      if(status === "approved"){
        badgeClass = "approved";
      }
      else if(status === "rejected"){
        badgeClass = "rejected";
      }
      else if(
        status === "pending_payment"
      ){
        badgeClass = "payment";
      }
      else{
        badgeClass = "pending";
      }

      return `
        <div class="card">

          <div class="card-title">
            ${escapeHtml(
              ad.title || "Untitled Job"
            )}
          </div>

          <div class="meta">

            <span class="badge">
              ${escapeHtml(
                ad.category || "Job"
              )}
            </span>

            <span class="badge">
              ${escapeHtml(
                ad.location || "Location not specified"
              )}
            </span>

            <span class="badge ${badgeClass}">
              ${escapeHtml(
                ad.status || "Pending"
              )}
            </span>

          </div>

          <div class="card-info">

            ${
              ad.company
                ? "Company: " +
                  escapeHtml(ad.company) +
                  "<br>"
                : ""
            }

            ${
              ad.salary
                ? "Salary: " +
                  escapeHtml(ad.salary) +
                  "<br>"
                : ""
            }

            ${
              ad.ad_type
                ? "Ad Type: " +
                  escapeHtml(ad.ad_type)
                : ""
            }

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================
   LOAD APPLICATIONS
========================================= */

async function loadApplications(){

  applicationsList.innerHTML =
    '<div class="loading">Loading your applications...</div>';

  try{

    const response =
      await fetch(
        JOBS_API + "/api/my-applications",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(response.status === 401){

      window.location.href =
        "/jobs/login.html";

      return;
    }

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Unable to load applications."
      );
    }

    renderApplications(
      data.applications || []
    );

  }catch(error){

    console.error(error);

    applicationsList.innerHTML =
      `<div class="status">
        ${escapeHtml(error.message)}
      </div>`;
  }
}


/* =========================================
   RENDER APPLICATIONS
========================================= */

function renderApplications(applications){

  if(!applications.length){

    applicationsList.innerHTML =
      `<div class="empty">
        You have not submitted any applications yet.
      </div>`;

    return;
  }

  applicationsList.innerHTML =
    applications.map(application => {

      const status =
        String(
          application.status ||
          "Submitted"
        ).toLowerCase();

      let badgeClass =
        "pending";

      if(
        status === "approved" ||
        status === "accepted"
      ){
        badgeClass = "approved";
      }

      if(
        status === "rejected"
      ){
        badgeClass = "rejected";
      }

      return `
        <div class="card">

          <div class="card-title">
            ${escapeHtml(
              application.title ||
              "Job Application"
            )}
          </div>

          <div class="meta">

            ${
              application.company
                ? `
                  <span class="badge">
                    ${escapeHtml(
                      application.company
                    )}
                  </span>
                `
                : ""
            }

            ${
              application.location
                ? `
                  <span class="badge">
                    ${escapeHtml(
                      application.location
                    )}
                  </span>
                `
                : ""
            }

            <span class="badge ${badgeClass}">
              ${escapeHtml(
                application.status ||
                "Submitted"
              )}
            </span>

          </div>

          <div class="card-info">

            ${
              application.created_at
                ? "Applied: " +
                  escapeHtml(
                    formatDate(
                      application.created_at
                    )
                  )
                : ""
            }

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await fetch(
      AUTH_API + "/api/logout",
      {
        method:"POST",
        credentials:"include",
        headers:{
          "Content-Type":
            "application/json"
        }
      }
    );

  }catch(error){

    console.error(error);

  }

  window.location.href =
    "/jobs/login.html";
}


/* =========================================
   DATE
========================================= */

function formatDate(value){

  try{

    return new Date(value)
      .toLocaleDateString(
        undefined,
        {
          year:"numeric",
          month:"short",
          day:"numeric"
        }
      );

  }catch{

    return value;
  }
}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================
   START
========================================= */

async function start(){

  hideError();

  const user =
    await checkLogin();

  if(!user){
    return;
  }

  await loadAds();

  await loadApplications();
}


start();

</script>

</body>
</html>
