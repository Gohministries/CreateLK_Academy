<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Jobs Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e9f0;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:800;
  color:#1769e0;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.user img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
}

.user-info{
  font-size:13px;
}

.user-name{
  font-weight:700;
}

.user-role{
  color:#6b7280;
  margin-top:2px;
}

.logout{
  border:0;
  background:#eef3ff;
  color:#1769e0;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.container{
  width:min(1100px,94%);
  margin:25px auto;
}

.welcome{
  background:linear-gradient(135deg,#1769e0,#4d8df7);
  color:#fff;
  padding:25px;
  border-radius:16px;
  margin-bottom:20px;
}

.welcome h1{
  font-size:25px;
  margin-bottom:7px;
}

.welcome p{
  opacity:.92;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}

.action{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:15px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:12px;
  color:#1769e0;
  font-weight:700;
  box-shadow:0 3px 12px rgba(20,40,80,.04);
}

.section{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

.section h2{
  font-size:19px;
  margin-bottom:15px;
}

.loading{
  color:#6b7280;
  padding:10px 0;
}

.error{
  color:#b42318;
  background:#fff1f0;
  border:1px solid #ffd5d1;
  padding:12px;
  border-radius:8px;
}

.empty{
  color:#6b7280;
  padding:10px 0;
}

.card{
  border:1px solid #e5e9f0;
  border-radius:11px;
  padding:15px;
  margin-bottom:12px;
}

.card:last-child{
  margin-bottom:0;
}

.card h3{
  font-size:16px;
  margin-bottom:6px;
}

.meta{
  color:#667085;
  font-size:13px;
  line-height:1.7;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  background:#eef3ff;
  color:#1769e0;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}

@media(max-width:700px){
  header{
    padding:12px 14px;
  }

  .user-info{
    display:none;
  }

  .logo{
    font-size:18px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .welcome{
    padding:20px;
  }

  .welcome h1{
    font-size:22px;
  }

  .section{
    padding:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CreateLK Jobs</div>

  <div class="user">
    <div class="user-info">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-role" id="userRole"></div>
    </div>

    <img id="userPhoto"
         src=""
         alt="Profile">

    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<main class="container">

  <section class="welcome">
    <h1>Welcome, <span id="welcomeName">...</span>!</h1>
    <p>Manage your CreateLK Jobs account.</p>
  </section>

  <section class="actions">
    <a class="action" href="/jobs/post.html">
      + Post a Job
    </a>

    <a class="action" href="/jobs/">
      Find Jobs
    </a>

    <a class="action" href="/jobs/dashboard.html">
      Dashboard
    </a>
  </section>

  <section class="section">
    <h2>My Job Posts</h2>

    <div id="adsList" class="loading">
      Loading job posts...
    </div>
  </section>

  <section class="section">
    <h2>My Applications</h2>

    <div id="applicationsList" class="loading">
      Loading applications...
    </div>
  </section>

</main>

<script>

const AUTH_API =
  "https://createlk-jobs-auth-v2.createlk.workers.dev";

const JOBS_API =
  "https://createlk-jobs-api-v2.createlk.workers.dev";


function redirectToLogin(){
  window.location.href =
    "/jobs/login.html?redirect=" +
    encodeURIComponent("/jobs/dashboard.html");
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  try{

    const response = await fetch(
      AUTH_API + "/api/me",
      {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    const data = await response.json();

    console.log("AUTH /api/me:",data);

    if(
      !response.ok ||
      !data.ok ||
      !data.user
    ){
      redirectToLogin();
      return false;
    }

    const user = data.user;

    const name =
      user.name ||
      user.email ||
      "User";

    document.getElementById("userName").textContent =
      name;

    document.getElementById("welcomeName").textContent =
      name;

    document.getElementById("userRole").textContent =
      user.role || "Job Seeker";

    if(user.photo_url){

      document.getElementById("userPhoto").src =
        user.photo_url;

    }else{

      document.getElementById("userPhoto").style.display =
        "none";
    }

    return true;

  }catch(error){

    console.error("loadUser error:",error);

    redirectToLogin();

    return false;
  }
}


/* =========================
   LOAD MY JOB POSTS
========================= */

async function loadAds(){

  const box =
    document.getElementById("adsList");

  try{

    const response = await fetch(
      JOBS_API + "/api/my-ads",
      {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    console.log(
      "JOBS API /api/my-ads:",
      response.status
    );

    if(response.status === 401){

      box.innerHTML =
        '<div class="error">' +
        'Unable to load job posts. ' +
        'Your login is active, but the Jobs API did not accept the session.' +
        '</div>';

      return;
    }

    if(!response.ok){

      box.innerHTML =
        '<div class="error">' +
        'Unable to load job posts right now.' +
        '</div>';

      return;
    }

    const data =
      await response.json();

    console.log("MY ADS:",data);

    const jobs =
      Array.isArray(data)
        ? data
        : (
            data.jobs ||
            data.ads ||
            data.data ||
            []
          );

    if(!jobs.length){

      box.innerHTML =
        '<div class="empty">' +
        'No job posts found.' +
        '</div>';

      return;
    }

    box.innerHTML = "";

    jobs.forEach(job => {

      const title =
        job.title ||
        job.job_title ||
        "Untitled Job";

      const location =
        job.location ||
        job.location_name ||
        "";

      const type =
        job.job_type ||
        job.type ||
        "";

      const status =
        job.status ||
        "Published";

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>${escapeHtml(title)}</h3>

        <div class="meta">
          ${escapeHtml(location)}
          ${location && type ? " • " : ""}
          ${escapeHtml(type)}
        </div>

        <span class="status">
          ${escapeHtml(status)}
        </span>
      `;

      box.appendChild(card);

    });

  }catch(error){

    console.error(
      "loadAds error:",
      error
    );

    box.innerHTML =
      '<div class="error">' +
      'Could not connect to the Jobs API.' +
      '</div>';
  }
}


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications(){

  const box =
    document.getElementById("applicationsList");

  try{

    const response = await fetch(
      JOBS_API + "/api/my-applications",
      {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    console.log(
      "JOBS API /api/my-applications:",
      response.status
    );

    if(response.status === 401){

      box.innerHTML =
        '<div class="error">' +
        'Unable to load applications. ' +
        'Your login is active, but the Jobs API did not accept the session.' +
        '</div>';

      return;
    }

    if(!response.ok){

      box.innerHTML =
        '<div class="error">' +
        'Unable to load applications right now.' +
        '</div>';

      return;
    }

    const data =
      await response.json();

    console.log(
      "MY APPLICATIONS:",
      data
    );

    const applications =
      Array.isArray(data)
        ? data
        : (
            data.applications ||
            data.data ||
            []
          );

    if(!applications.length){

      box.innerHTML =
        '<div class="empty">' +
        'No applications found.' +
        '</div>';

      return;
    }

    box.innerHTML = "";

    applications.forEach(application => {

      const title =
        application.job_title ||
        application.title ||
        "Job Application";

      const company =
        application.company_name ||
        application.company ||
        "";

      const status =
        application.status ||
        "Submitted";

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>${escapeHtml(title)}</h3>

        <div class="meta">
          ${escapeHtml(company)}
        </div>

        <span class="status">
          ${escapeHtml(status)}
        </span>
      `;

      box.appendChild(card);

    });

  }catch(error){

    console.error(
      "loadApplications error:",
      error
    );

    box.innerHTML =
      '<div class="error">' +
      'Could not connect to the Jobs API.' +
      '</div>';
  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{

    await fetch(
      AUTH_API + "/api/logout",
      {
        method:"POST",
        credentials:"include",
        cache:"no-store"
      }
    );

  }catch(error){

    console.error(
      "Logout error:",
      error
    );
  }

  window.location.href =
    "/jobs/login.html";
}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

async function start(){

  const loggedIn =
    await loadUser();

  if(!loggedIn){
    return;
  }

  /*
    IMPORTANT:
    Do NOT redirect to login if the
    Jobs API returns 401 here.
    The Auth API already confirmed
    that the user is logged in.
  */

  await Promise.allSettled([
    loadAds(),
    loadApplications()
  ]);
}


start();

</script>

</body>
</html>
