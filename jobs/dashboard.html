<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Jobs Test</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f6f8fc;
  font-family:Arial,sans-serif;
  color:#172033;
}

.box{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:15px;
  box-shadow:0 5px 20px #0001;
}

h1{
  color:#102a56;
  font-size:22px;
}

button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:9px;
  background:#102a56;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

pre{
  margin-top:18px;
  padding:15px;
  background:#f1f4f8;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>CreateLK Jobs Dashboard Test</h1>

<button onclick="testLogin()">
Test Login / Session
</button>

<button onclick="testAds()">
Test My Ads
</button>

<button onclick="testApplications()">
Test Applications
</button>

<pre id="result">Ready to test.</pre>

</div>

<script>

const AUTH_API =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

const JOBS_API =
"https://createlk-jobs-api-v2.createlk.workers.dev";


async function testLogin(){

  show("Testing Auth Worker...");

  try{

    const response =
      await fetch(
        AUTH_API + "/api/me",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    show(
      "AUTH /api/me\n\n" +
      "HTTP STATUS: " +
      response.status +
      "\n\n" +
      JSON.stringify(data,null,2)
    );

  }catch(error){

    show(
      "AUTH ERROR\n\n" +
      error
    );

  }
}


async function testAds(){

  show("Testing Jobs API /api/my-ads...");

  try{

    const response =
      await fetch(
        JOBS_API + "/api/my-ads",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    show(
      "JOBS API /api/my-ads\n\n" +
      "HTTP STATUS: " +
      response.status +
      "\n\n" +
      text
    );

  }catch(error){

    show(
      "MY ADS ERROR\n\n" +
      error
    );

  }
}


async function testApplications(){

  show(
    "Testing Jobs API /api/my-applications..."
  );

  try{

    const response =
      await fetch(
        JOBS_API + "/api/my-applications",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    show(
      "JOBS API /api/my-applications\n\n" +
      "HTTP STATUS: " +
      response.status +
      "\n\n" +
      text
    );

  }catch(error){

    show(
      "APPLICATIONS ERROR\n\n" +
      error
    );

  }
}


function show(text){

  document.getElementById(
    "result"
  ).textContent = text;

}

</script>

</body>
</html>
