<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>CreateLK Jobs | Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#102a56;
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700
}

.logo img{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover
}

.menu{
  font-size:24px;
  cursor:pointer
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px
}

.hero{
  background:linear-gradient(135deg,#155eef,#7c3aed);
  color:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:18px
}

.hero h1{
  margin:0 0 8px;
  font-size:28px
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #0000000d
}

.profile{
  display:flex;
  align-items:center;
  gap:15px
}

.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  background:#e8edf7
}

.profile h2{
  margin:0 0 5px;
  font-size:18px
}

.muted{
  color:#687386;
  font-size:14px
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px
}

.section-title h2{
  margin:0;
  font-size:20px
}

.btn{
  display:inline-block;
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#155eef;
  color:white;
  text-decoration:none;
  font-weight:700;
  cursor:pointer
}

.btn.gold{
  background:#d69b16
}

.btn.gray{
  background:#e9edf4;
  color:#172033
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.stat{
  padding:16px;
  border-radius:14px;
  background:#f3f6fb;
  text-align:center
}

.stat strong{
  display:block;
  font-size:25px;
  color:#155eef
}

.stat span{
  font-size:13px;
  color:#687386
}

.ad{
  border:1px solid #e3e7ef;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}

.ad-top{
  display:flex;
  gap:14px
}

.ad-photo{
  width:120px;
  height:90px;
  border-radius:10px;
  object-fit:cover;
  background:#edf1f7;
  flex:none
}

.ad-info{
  min-width:0
}

.ad-info h3{
  margin:0 0 6px;
  font-size:17px
}

.ad-info p{
  margin:0 0 8px;
  color:#596477;
  font-size:14px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  background:#fff3d6;
  color:#9a6a00
}

.badge.pending{
  background:#fff3d6;
  color:#9a6a00
}

.badge.approved{
  background:#dcfce7;
  color:#166534
}

.badge.rejected{
  background:#fee2e2;
  color:#991b1b
}

.application{
  padding:14px;
  border:1px solid #e3e7ef;
  border-radius:14px;
  margin-bottom:10px
}

.application h3{
  margin:0 0 5px
}

.empty{
  text-align:center;
  color:#687386;
  padding:20px
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.actions a{
  text-align:center
}

.loading{
  text-align:center;
  padding:20px;
  color:#687386
}

@media(max-width:650px){
  main{padding:14px}

  .stats{
    grid-template-columns:1fr 1fr
  }

  .actions{
    grid-template-columns:1fr
  }

  .ad-photo{
    width:95px;
    height:75px
  }

  .hero h1{
    font-size:24px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
         alt="CreateLK Jobs">
    <span>CreateLK Jobs</span>
  </div>

  <div class="menu" onclick="logout()">☰</div>
</header>

<main>

  <section class="hero">
    <h1>My Dashboard</h1>
    <div>Manage your ads and job applications.</div>
  </section>

  <section class="card">
    <div class="profile">
      <img id="avatar" class="avatar" alt="Profile">
      <div>
        <h2 id="name">Loading...</h2>
        <div id="email" class="muted"></div>
        <div id="role" class="muted"></div>
      </div>
    </div>
  </section>

  <section class="card">

    <div class="section-title">
      <h2>Ad Summary</h2>
      <a class="btn" href="/jobs/post.html">+ Post Ad</a>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="freeRemaining">-</strong>
        <span>Free Ads Remaining</span>
      </div>

      <div class="stat">
        <strong id="myAdsCount">-</strong>
        <span>My Ads</span>
      </div>

      <div class="stat">
        <strong id="applicationsCount">-</strong>
        <span>Applications</span>
      </div>
    </div>

  </section>

  <section class="card">

    <div class="section-title">
      <h2>My Ads</h2>
      <a class="btn" href="/jobs/post.html">Post New Ad</a>
    </div>

    <div id="ads">
      <div class="loading">Loading ads...</div>
    </div>

  </section>

  <section class="card">

    <div class="section-title">
      <h2>My Applications</h2>
    </div>

    <div id="applications">
      <div class="loading">Loading applications...</div>
    </div>

  </section>

  <section class="actions">
    <a class="btn" href="/jobs/index.html">Find Jobs</a>
    <a class="btn gold" href="/jobs/post.html">Post Ad</a>
    <a class="btn gray" href="#" onclick="logout();return false">Sign Out</a>
  </section>

</main>

<script>

const AUTH_API =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

const JOBS_API =
"https://createlk-jobs-api-v2.createlk.workers.dev";

async function loadUser(){

  const response = await fetch(
    AUTH_API + "/api/me",
    {
      credentials:"include",
      cache:"no-store"
    }
  );

  if(!response.ok){
    location.href="/jobs/login.html";
    return null;
  }

  const data = await response.json();

  if(!data.ok || !data.user){
    location.href="/jobs/login.html";
    return null;
  }

  const user=data.user;

  document.getElementById("name").textContent =
    user.name || "User";

  document.getElementById("email").textContent =
    user.email || "";

  document.getElementById("role").textContent =
    user.role || "Job Seeker";

  if(user.photo_url){
    document.getElementById("avatar").src=user.photo_url;
  }

  return user;
}


async function loadAds(){

  const box=document.getElementById("ads");

  try{

    const response=await fetch(
      JOBS_API + "/api/my-ads",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(response.status===401){
      location.href="/jobs/login.html";
      return;
    }

    const data=await response.json();

    if(!data.ok){
      throw new Error(data.error || "Failed");
    }

    document.getElementById("freeRemaining").textContent =
      data.free_ads_remaining;

    document.getElementById("myAdsCount").textContent =
      data.ads.length;

    if(!data.ads.length){
      box.innerHTML=`
        <div class="empty">
          You have not posted any ads yet.<br><br>
          <a class="btn" href="/jobs/post.html">Post Your First Ad</a>
        </div>`;
      return;
    }

    box.innerHTML=data.ads.map(ad=>{

      const status =
        ad.approval_status || "pending";

      const statusClass =
        status==="approved"
          ? "approved"
          : status==="rejected"
          ? "rejected"
          : "pending";

      const photo =
        ad.photo_url
          ? JOBS_API + "/files/" +
            encodeURIComponent(ad.photo_url)
          : "";

      return `
        <div class="ad">

          <div class="ad-top">

            ${
              photo
              ? `<img class="ad-photo"
                       src="${photo}"
                       alt="">`
              : `<div class="ad-photo"></div>`
            }

            <div class="ad-info">

              <h3>
                ${escapeHTML(ad.title)}
              </h3>

              <p>
                ${escapeHTML(ad.description)}
              </p>

              <span class="badge ${statusClass}">
                ${escapeHTML(status)}
              </span>

              ${
                ad.ad_type==="Premium"
                ? `<span class="badge">⭐ Premium</span>`
                : `<span class="badge">Free</span>`
              }

            </div>

          </div>

        </div>
      `;

    }).join("");

  }catch(error){

    box.innerHTML=
      `<div class="empty">Unable to load ads.</div>`;

  }
}


async function loadApplications(){

  const box=document.getElementById("applications");

  try{

    const response=await fetch(
      JOBS_API + "/api/my-applications",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(response.status===401){
      location.href="/jobs/login.html";
      return;
    }

    const data=await response.json();

    if(!data.ok){
      throw new Error(data.error || "Failed");
    }

    document.getElementById("applicationsCount").textContent =
      data.applications.length;

    if(!data.applications.length){

      box.innerHTML=
        `<div class="empty">
          You have not applied for any jobs yet.
        </div>`;

      return;
    }

    box.innerHTML=data.applications.map(app=>`

      <div class="application">

        <h3>
          ${escapeHTML(app.title || "Job")}
        </h3>

        <div class="muted">
          ${escapeHTML(app.company_name || "")}
        </div>

        <div class="muted">
          ${escapeHTML(app.location || "")}
        </div>

        <br>

        <span class="badge">
          ${escapeHTML(app.status || "Applied")}
        </span>

      </div>

    `).join("");

  }catch(error){

    box.innerHTML=
      `<div class="empty">
        Unable to load applications.
      </div>`;

  }
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function logout(){

  try{

    await fetch(
      AUTH_API + "/logout",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

  }catch(e){}

  location.href="/jobs/login.html";
}


async function init(){

  const user=await loadUser();

  if(!user)return;

  await Promise.all([
    loadAds(),
    loadApplications()
  ]);

}

init();

</script>

</body>
</html>
