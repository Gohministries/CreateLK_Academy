<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>Dashboard | CreateLK Jobs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f8fc;
  color:#172033;
  font-family:Arial,sans-serif
}

header{
  background:#fff;
  border-bottom:1px solid #e5eaf2
}

.nav{
  max-width:1180px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#102a56;
  font-weight:800;
  font-size:18px
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:9px
}

.nav-links{
  display:flex;
  gap:20px;
  align-items:center
}

.nav-links a{
  color:#24324a;
  text-decoration:none;
  font-size:14px;
  font-weight:700
}

.hero{
  background:linear-gradient(135deg,#102a56,#174d91);
  color:#fff;
  padding:42px 18px;
  text-align:center
}

.hero h1{
  margin:0 0 7px;
  font-family:"Playfair Display",serif;
  font-size:36px
}

.hero p{
  margin:0;
  opacity:.9
}

.container{
  max-width:1050px;
  margin:30px auto;
  padding:0 18px
}

.profile{
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:16px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 8px 25px #102a5610
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  background:#e8eef8
}

.profile h2{
  margin:0 0 4px;
  color:#102a56;
  font-family:"Playfair Display",serif
}

.email{
  color:#64748b;
  font-size:14px
}

.role{
  display:inline-block;
  margin-top:7px;
  padding:5px 10px;
  border-radius:20px;
  background:#eef4ff;
  color:#174d91;
  font-size:12px;
  font-weight:700
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px
}

.stat{
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 25px #102a5610
}

.stat-title{
  color:#64748b;
  font-size:14px
}

.stat-number{
  margin-top:7px;
  color:#102a56;
  font-size:30px;
  font-weight:800
}

.section{
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 8px 25px #102a5610
}

.section h2{
  margin:0 0 15px;
  color:#102a56;
  font-family:"Playfair Display",serif
}

.ad{
  border:1px solid #e5eaf2;
  border-radius:13px;
  padding:14px;
  margin-top:12px;
  overflow:hidden
}

.ad-photo{
  width:150px;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  float:left;
  margin-right:15px
}

.ad-title{
  font-weight:800;
  color:#102a56;
  font-size:18px
}

.ad-description{
  color:#475569;
  font-size:14px;
  line-height:1.5;
  margin:8px 0
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  margin:3px 3px 0 0
}

.basic{
  background:#eef4ff;
  color:#174d91
}

.premium{
  background:#fff0c2;
  color:#825b00
}

.pending{
  background:#fff3d6;
  color:#8a6100
}

.approved{
  background:#dcfce7;
  color:#166534
}

.rejected{
  background:#fee2e2;
  color:#991b1b
}

.application{
  border:1px solid #e5eaf2;
  border-radius:12px;
  padding:14px;
  margin-top:10px
}

.application strong{
  color:#102a56
}

.application-info{
  color:#64748b;
  font-size:13px;
  margin-top:5px;
  line-height:1.6
}

.empty{
  padding:20px 5px;
  color:#64748b;
  text-align:center
}

.loading{
  padding:20px;
  text-align:center;
  color:#64748b
}

.error{
  padding:15px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap
}

.action{
  display:inline-block;
  padding:11px 16px;
  border-radius:10px;
  background:#102a56;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:14px
}

.admin{
  background:#d69b16
}

.logout{
  width:100%;
  margin-top:20px;
  border:0;
  padding:14px;
  border-radius:10px;
  background:#102a56;
  color:#fff;
  font-weight:800;
  cursor:pointer
}

.clear{
  clear:both
}

@media(max-width:700px){

  .nav-links{
    display:none
  }

  .stats{
    grid-template-columns:1fr
  }

  .ad-photo{
    float:none;
    width:100%;
    height:190px;
    margin:0 0 12px
  }

  .hero h1{
    font-size:31px
  }
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="brand" href="/">
<img
src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">
<span>CreateLK Jobs</span>
</a>

<nav class="nav-links">
<a href="/">Home</a>
<a href="/jobs/post.html">Post a Job</a>
</nav>

</div>
</header>


<section class="hero">
<h1>My Dashboard</h1>
<p>Manage your CreateLK Jobs account.</p>
</section>


<main class="container">

<div id="loading" class="loading">
Loading your account...
</div>


<div id="dashboard" style="display:none">

<!-- PROFILE -->

<div class="profile">

<img
id="avatar"
class="avatar"
alt="Profile">

<div>

<h2 id="name">User</h2>

<div id="email" class="email"></div>

<div id="role" class="role"></div>

</div>

</div>


<!-- CLOUDFLARE STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Free Ads Remaining
</div>

<div
id="freeAds"
class="stat-number">
—
</div>

</div>


<div class="stat">

<div class="stat-title">
My Ads
</div>

<div
id="myAdsCount"
class="stat-number">
—
</div>

</div>


<div class="stat">

<div class="stat-title">
Applications
</div>

<div
id="applicationsCount"
class="stat-number">
—
</div>

</div>

</div>


<!-- ACTIONS -->

<div class="actions">

<a
class="action"
href="/jobs/post.html">
➕ Post a Job
</a>

<div id="adminButton"></div>

</div>


<!-- MY ADS -->

<section class="section">

<h2>My Ads</h2>

<div id="ads">
<div class="loading">
Loading your ads...
</div>
</div>

</section>


<!-- APPLICATIONS -->

<section class="section">

<h2>My Applications</h2>

<div id="applications">
<div class="loading">
Loading applications...
</div>
</div>

</section>


<button
class="logout"
onclick="logout()">
🚪 Sign Out
</button>

</div>


<div
id="error"
class="error"
style="display:none">
</div>

</main>


<script>

const AUTH_API =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

const JOBS_API =
"https://createlk-jobs-api-v2.createlk.workers.dev";


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function loadDashboard(){

try{

/* AUTH */

const authResponse =
await fetch(
AUTH_API + "/api/me",
{
method:"GET",
credentials:"include",
cache:"no-store"
}
);


if(!authResponse.ok){

window.location.replace(
"/jobs/login.html"
);

return;

}


const authData =
await authResponse.json();


if(
!authData.ok ||
!authData.user
){

window.location.replace(
"/jobs/login.html"
);

return;

}


const user=authData.user;


/* PROFILE */

document.getElementById("name").textContent =
user.name || "CreateLK User";

document.getElementById("email").textContent =
user.email || "";

document.getElementById("role").textContent =
user.role || "Job Seeker";


if(user.photo_url){

document.getElementById("avatar").src =
user.photo_url;

}else{

document.getElementById("avatar").style.display =
"none";

}


/* ADMIN */

if(user.role==="Admin"){

document.getElementById("adminButton").innerHTML=`

<a
class="action admin"
href="/jobs/admin.html">
⚙️ Admin Panel
</a>

`;

}


/* SHOW */

document.getElementById("loading").style.display =
"none";

document.getElementById("dashboard").style.display =
"block";


/* LOAD CLOUDFLARE DATA */

await Promise.all([
loadAds(),
loadApplications()
]);


}catch(error){

console.error(error);

document.getElementById("loading").style.display =
"none";

const box =
document.getElementById("error");

box.textContent =
"Unable to load your account. Please try again.";

box.style.display =
"block";

}

}


/* MY ADS FROM CLOUDFLARE D1 */

async function loadAds(){

const response =
await fetch(
JOBS_API + "/api/my-ads",
{
method:"GET",
credentials:"include",
cache:"no-store"
}
);


if(response.status===401){

window.location.replace(
"/jobs/login.html"
);

return;

}


const data =
await response.json();


if(!response.ok || !data.ok){

throw new Error(
data.error || "Unable to load ads"
);

}


const ads =
data.ads || [];


/* FREE ADS REMAINING */

document.getElementById("freeAds").textContent =
data.free_ads_remaining ?? 0;


/* TOTAL ADS */

document.getElementById("myAdsCount").textContent =
ads.length;


const box =
document.getElementById("ads");


if(!ads.length){

box.innerHTML=`

<div class="empty">
You have not posted any advertisements yet.
</div>

`;

return;

}


box.innerHTML =
ads.map(ad=>{

let statusClass="pending";

if(ad.approval_status==="approved")
statusClass="approved";

if(ad.approval_status==="rejected")
statusClass="rejected";


return `

<div class="ad">

${
ad.photo_url
?
`
<img
class="ad-photo"
src="${JOBS_API}/files/${encodeURIComponent(ad.photo_url)}"
alt="${escapeHTML(ad.title)}">
`
:
""
}

<div class="ad-title">
${escapeHTML(ad.title)}
</div>

<div class="ad-description">
${escapeHTML(ad.description)}
</div>

<div>

<span class="badge ${
ad.ad_type==="Premium"
? "premium"
: "basic"
}">
${escapeHTML(ad.ad_type || "Basic")}
</span>

<span class="badge ${statusClass}">
${escapeHTML(
ad.approval_status || "pending"
)}
</span>

</div>

<div class="application-info">

${
ad.company_name
?
"Company: "+escapeHTML(ad.company_name)
:
""
}

${
ad.location
?
"<br>Location: "+escapeHTML(ad.location)
:
""
}

</div>

<div class="clear"></div>

</div>

`;

}).join("");

}


/* APPLICATIONS FROM CLOUDFLARE D1 */

async function loadApplications(){

const response =
await fetch(
JOBS_API + "/api/my-applications",
{
method:"GET",
credentials:"include",
cache:"no-store"
}
);


if(response.status===401){

window.location.replace(
"/jobs/login.html"
);

return;

}


const data =
await response.json();


if(!response.ok || !data.ok){

throw new Error(
data.error || "Unable to load applications"
);

}


const applications =
data.applications || [];


document.getElementById(
"applicationsCount"
).textContent =
applications.length;


const box =
document.getElementById(
"applications"
);


if(!applications.length){

box.innerHTML=`

<div class="empty">
You have not submitted any applications yet.
</div>

`;

return;

}


box.innerHTML =
applications.map(app=>`

<div class="application">

<strong>
${escapeHTML(
app.job_title ||
app.title ||
"Job"
)}
</strong>

<div class="application-info">

${
app.company_name
?
escapeHTML(app.company_name)
:
""
}

${
app.location
?
"<br>📍 "+escapeHTML(app.location)
:
""
}

<br>

Status:
<b>
${escapeHTML(
app.status || "Applied"
)}
</b>

${
app.created_at
?
"<br>Applied: "+
escapeHTML(app.created_at)
:
""
}

</div>

</div>

`).join("");

}


/* LOGOUT */

async function logout(){

try{

await fetch(
AUTH_API + "/logout",
{
method:"GET",
credentials:"include",
cache:"no-store"
}
);

}catch(error){

console.error(error);

}

window.location.replace(
"/jobs/login.html"
);

}


loadDashboard();

</script>

</body>
</html>
