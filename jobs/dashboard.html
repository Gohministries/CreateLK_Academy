<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Jobs | Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:#102a56;
  color:#fff;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700
}

.logo img{
  width:40px;
  height:40px;
  border-radius:10px;
  object-fit:cover
}

nav{
  display:flex;
  gap:7px
}

nav a,
nav button{
  border:0;
  color:#fff;
  background:#ffffff18;
  padding:9px 11px;
  border-radius:8px;
  text-decoration:none;
  cursor:pointer;
  font-size:14px
}

main{
  max-width:1050px;
  margin:auto;
  padding:20px 15px
}

.welcome{
  background:#fff;
  padding:20px;
  border-radius:17px;
  margin-bottom:15px
}

.welcome h1{
  margin:0 0 6px
}

.muted{
  color:#687386;
  font-size:14px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:15px;
  box-shadow:0 4px 18px #00000008
}

.stat strong{
  display:block;
  font-size:26px;
  margin-top:6px;
  color:#102a56
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px
}

.action{
  background:#102a56;
  color:#fff;
  text-decoration:none;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700
}

.admin{
  background:#d69b16
}

.card{
  background:#fff;
  padding:18px;
  border-radius:17px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #00000008
}

.card h2{
  margin:0 0 10px
}

.ad{
  border:1px solid #e2e6ee;
  border-radius:13px;
  padding:13px;
  margin-top:12px;
  min-height:105px
}

.ad img{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:9px;
  float:left;
  margin-right:13px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:15px;
  background:#edf3ff;
  color:#2458b8;
  font-size:12px;
  font-weight:700;
  margin:2px
}

.pending{
  background:#fff3d6;
  color:#8a6100
}

.approved{
  background:#dcfce7;
  color:#166534
}

.rejected{
  background:#fee2e2;
  color:#991b1b
}

.premium{
  background:#fff0c2;
  color:#825b00
}

.app{
  border-top:1px solid #e5e7eb;
  padding:13px 0
}

.clear{
  clear:both
}

.loading{
  color:#687386;
  padding:15px 0
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:13px;
  border-radius:10px
}

@media(max-width:650px){

  header{
    flex-wrap:wrap
  }

  nav{
    width:100%
  }

  nav a,
  nav button{
    flex:1;
    text-align:center
  }

  .stats{
    grid-template-columns:1fr
  }

  .actions{
    flex-direction:column
  }

  .action{
    text-align:center
  }

  .ad img{
    width:100%;
    height:190px;
    float:none;
    margin:0 0 10px
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    <img
      src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
      alt="CreateLK Jobs">
    <span>CreateLK Jobs</span>
  </div>

  <nav>
    <a href="/jobs/index.html">Jobs</a>
    <button onclick="logout()">Logout</button>
  </nav>

</header>

<main>

  <div id="page">
    <div class="loading">
      Checking your account...
    </div>
  </div>

</main>

<script>

const AUTH =
"https://createlk-jobs-auth-v2.createlk.workers.dev";

const API =
"https://createlk-jobs-api-v2.createlk.workers.dev";


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function checkUser(){

  try{

    const response=await fetch(
      AUTH+"/api/me",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(!response.ok){

      location.replace("/jobs/login.html");
      return;

    }

    const data=await response.json();

    if(!data.ok || !data.user){

      location.replace("/jobs/login.html");
      return;

    }

    showDashboard(data.user);

    loadAds();

    loadApplications();

  }catch(error){

    location.replace("/jobs/login.html");

  }

}


function showDashboard(user){

  document.getElementById("page").innerHTML=`

    <section class="welcome">

      <h1>
        Welcome, ${escapeHTML(user.name || "User")} 👋
      </h1>

      <div class="muted">
        ${escapeHTML(user.email || "")}
      </div>

    </section>

    <section class="stats">

      <div class="stat">
        Free Ads Remaining
        <strong id="freeCount">—</strong>
      </div>

      <div class="stat">
        My Ads
        <strong id="adCount">—</strong>
      </div>

      <div class="stat">
        Applications
        <strong id="appCount">—</strong>
      </div>

    </section>

    <div class="actions">

      <a
        class="action"
        href="/jobs/post.html">
        + Post Ad
      </a>

      <a
        class="action"
        href="/jobs/index.html">
        Browse Jobs
      </a>

      ${
        user.role==="Admin"
        ? `
          <a
            class="action admin"
            href="/jobs/admin.html">
            Admin Panel
          </a>
        `
        : ""
      }

    </div>

    <section class="card">

      <h2>My Ads</h2>

      <div id="myAds">
        <div class="loading">
          Loading ads...
        </div>
      </div>

    </section>

    <section class="card">

      <h2>My Applications</h2>

      <div id="applications">
        <div class="loading">
          Loading applications...
        </div>
      </div>

    </section>
  `;

}


async function loadAds(){

  try{

    const response=await fetch(
      API+"/api/my-ads",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(response.status===401){

      location.replace("/jobs/login.html");
      return;

    }

    const data=await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error || "Unable to load ads."
      );

    }

    const ads=data.ads || [];

    document.getElementById("freeCount").textContent=
      data.free_ads_remaining ?? 0;

    document.getElementById("adCount").textContent=
      ads.length;

    const box=document.getElementById("myAds");

    if(!ads.length){

      box.innerHTML=`
        <div class="loading">
          You have not posted any ads yet.
        </div>
      `;

      return;
    }

    box.innerHTML=ads.map(ad=>{

      let statusClass="pending";

      if(ad.approval_status==="approved")
        statusClass="approved";

      if(ad.approval_status==="rejected")
        statusClass="rejected";

      return `

        <div class="ad">

          ${
            ad.photo_url
            ? `
              <img
                src="${API}/files/${encodeURIComponent(ad.photo_url)}"
                alt="">
            `
            : ""
          }

          <strong>
            ${escapeHTML(ad.title)}
          </strong>

          <p class="muted">
            ${escapeHTML(ad.company_name || "")}
          </p>

          <span class="badge ${
            ad.ad_type==="Premium" ? "premium" : ""
          }">
            ${escapeHTML(ad.ad_type || "Basic")}
          </span>

          <span class="badge ${statusClass}">
            ${escapeHTML(
              ad.approval_status || "pending"
            )}
          </span>

          <div class="clear"></div>

        </div>

      `;

    }).join("");

  }catch(error){

    document.getElementById("myAds").innerHTML=`
      <div class="error">
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


async function loadApplications(){

  try{

    const response=await fetch(
      API+"/api/my-applications",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

    if(response.status===401){

      location.replace("/jobs/login.html");
      return;

    }

    const data=await response.json();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error || "Unable to load applications."
      );

    }

    const applications=data.applications || [];

    document.getElementById("appCount").textContent=
      applications.length;

    const box=document.getElementById("applications");

    if(!applications.length){

      box.innerHTML=`
        <div class="loading">
          No applications yet.
        </div>
      `;

      return;

    }

    box.innerHTML=applications.map(app=>`

      <div class="app">

        <strong>
          ${escapeHTML(
            app.job_title || app.title || "Job"
          )}
        </strong>

        <div class="muted">
          ${escapeHTML(app.company_name || "")}
        </div>

        <span class="badge">
          ${escapeHTML(app.status || "Applied")}
        </span>

      </div>

    `).join("");

  }catch(error){

    document.getElementById("applications").innerHTML=`
      <div class="error">
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


async function logout(){

  try{

    await fetch(
      AUTH+"/logout",
      {
        credentials:"include",
        cache:"no-store"
      }
    );

  }catch(error){

  }

  location.replace("/jobs/login.html");

}


checkUser();

</script>

</body>
</html>
