<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f8faff,#eef3ff);color:#172033}
header{background:linear-gradient(135deg,#111827,#1e293b);color:#fff;padding:20px}
header>div,main{max-width:1000px;margin:auto}
h1{margin:0;font-size:23px}.sub{color:#cbd5e1;font-size:13px;margin-top:4px}
main{padding:18px}.hidden{display:none!important}
button,input,select{font:inherit}button{border:0;cursor:pointer}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin-top:7px}
label{display:block;font-size:13px;font-weight:bold;margin-top:14px}
.btn{padding:10px 13px;border-radius:10px;font-weight:bold}
.primary{background:#111827;color:#fff}
.logout{float:right;background:#374151;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 5px 20px #00000008}
.login{max-width:400px;margin:70px auto}
.actions,.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.message{background:#f3f4f6;padding:11px;border-radius:9px;font-size:13px;margin-top:10px}
.filehead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.views{background:#e5e7eb;padding:3px;border-radius:9px}
.views button{padding:6px 9px;border-radius:7px;background:transparent;font-size:12px}
.views .active{background:#fff}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.files.list{display:flex;flex-direction:column}
.file{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:13px;overflow:hidden}
.files.list .file{display:flex;gap:12px;align-items:center}
.files.list .preview{width:70px;height:70px;flex:none;margin:0}
.preview{height:140px;background:#f1f5f9;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}
.icon{font-size:38px}.name{font-weight:bold;margin-top:9px;word-break:break-word}
.info{font-size:12px;color:#6b7280;margin-top:4px}
.status{font-size:12px;font-weight:bold;margin-top:6px}.pending{color:#b45309}.done{color:#15803d}
.small{padding:7px 9px;border-radius:8px;background:#eef2f7;font-size:11px;font-weight:bold}
.view{background:#dbeafe;color:#1d4ed8}.download{background:#dcfce7;color:#166534}
.drive{background:#111827;color:#fff}.delete{background:#fee2e2;color:#b91c1c}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal>div{background:#fff;border-radius:16px;width:min(900px,100%);max-height:95vh;overflow:auto}
.modalhead{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.modalbody{padding:15px;text-align:center;background:#f8fafc}
.modalbody img{max-width:100%;max-height:75vh;border-radius:10px}
.modalbody iframe{width:100%;height:75vh;border:0}
.modalbody video{max-width:100%;max-height:75vh}
@media(max-width:600px){.files{grid-template-columns:repeat(2,1fr)}.files.list .file{display:flex}.files.list .buttons{flex-direction:column}.preview{height:115px}}
</style>
</head>

<body>

<header>
<div>
<button class="logout" onclick="logout()">Logout</button>
<h1>🔐 Personal Vault</h1>
<div class="sub">Secure encrypted storage</div>
</div>
</header>

<main>

<div id="login" class="card login">
<h2>🔐 Unlock Vault</h2>
<label>Username</label>
<input id="user" autocomplete="username">
<label>Password</label>
<input id="pass" type="password" autocomplete="current-password">
<button class="btn primary" style="width:100%;margin-top:16px" onclick="login()">Unlock</button>
<div id="loginMsg" class="message hidden"></div>
</div>

<div id="app" class="hidden">

<section class="card">
<h3 style="margin:0">☁️ Google Drive Backup</h3>
<div id="driveStatus" class="info">Checking...</div>
<div class="actions">
<button class="btn primary" onclick="connectGoogle()">🔗 Connect Google Drive</button>
<button class="btn" onclick="backupAll()">☁️ Backup All</button>
<button class="btn" onclick="refresh()">🔄 Refresh</button>
</div>
</section>

<section class="card">
<h3>Upload File</h3>
<input id="file" type="file">
<select id="cat">
<option>Other</option><option>Family</option><option>Church</option>
<option>Ministry</option><option>Personal</option><option>Documents</option>
<option>Travel</option><option>Memories</option><option>Backup</option>
</select>
<button class="btn primary" style="margin-top:10px" onclick="upload()">🔐 Encrypt & Upload</button>
<div id="msg" class="message hidden"></div>
</section>

<div class="filehead">
<h3 style="margin:0">My Files</h3>
<div class="views">
<button id="grid" class="active" onclick="viewMode('grid')">▦ Grid</button>
<button id="list" onclick="viewMode('list')">☷ List</button>
</div>
</div>

<div id="files" class="files"></div>

</div>
</main>

<div id="modal" class="modal hidden" onclick="closeView()">
<div onclick="event.stopPropagation()">
<div class="modalhead">
<b id="modalTitle"></b>
<button class="small" onclick="closeView()">✕</button>
</div>
<div id="modalBody" class="modalbody"></div>
</div>
</div>

<script>
const API="https://personal.createlk.workers.dev";
let files=[],keyPromise;

const key=()=>keyPromise||(keyPromise=crypto.subtle.digest(
"SHA-256",new TextEncoder().encode("personal-vault-key")
).then(x=>crypto.subtle.importKey("raw",x,"AES-GCM",false,["encrypt","decrypt"])));

async function login(){
 try{
  const r=await fetch(API+"/api/login",{method:"POST",credentials:"include",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:user.value,password:pass.value})});
  const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");
  show();
 }catch(e){loginMsg.classList.remove("hidden");loginMsg.textContent=e.message}
}

async function logout(){await fetch(API+"/api/logout",{method:"POST",credentials:"include"});location.reload()}

async function check(){
 try{
  const r=await fetch(API+"/api/login/status",{credentials:"include"});
  if((await r.json()).authenticated)show();
 }catch{}
}

function show(){
 login.classList.add("hidden");app.classList.remove("hidden");
 viewMode(localStorage.vault_view||"grid");load();status();
}

async function load(){
 try{
  const r=await fetch(API+"/api/photos",{credentials:"include"});
  if(!r.ok)return;
  files=(await r.json()).files||[];render();
 }catch(e){console.error(e)}
}

function render(){
 if(!files.length){filesBox().innerHTML='<div class="message">No files yet.</div>';return}
 filesBox().innerHTML=files.map(f=>{
  const image=f.file_type?.startsWith("image/");
  return `<div class="file">
   <div class="preview">${image?`<img id="i${f.id}" style="display:none">`:`<span class="icon">${icon(f.file_type)}</span>`}</div>
   <div style="flex:1">
    <div class="name">${esc(f.filename)}</div>
    <div class="info">${esc(f.category||"Other")} • ${size(f.file_size)}</div>
    <div class="status ${f.google_drive_file_id?"done":"pending"}">${f.google_drive_file_id?"☁️ Backed up":"⏳ Backup pending"}</div>
    <div class="buttons">
     <button class="small view" onclick="openFile(${f.id})">👁 View</button>
     <button class="small download" onclick="download(${f.id})">⬇ Download</button>
     ${f.google_drive_file_id?
      `<button class="small drive" onclick="window.open('${attr(f.google_drive_url)}','_blank')">☁ Drive</button>`:
      `<button class="small drive" onclick="backup(${f.id})">☁ Backup</button>`}
     <button class="small delete" onclick="del(${f.id})">🗑 Delete</button>
    </div>
   </div>
  </div>`
 }).join("");

 files.filter(f=>f.file_type?.startsWith("image/")).forEach(preview);
}

function filesBox(){return document.getElementById("files")}

async function encrypted(id){
 const r=await fetch(API+"/api/photos/"+id+"/download",{credentials:"include"});
 if(!r.ok)throw Error("Unable to get file");
 return r.blob();
}

async function decrypt(blob){
 const a=new Uint8Array(await blob.arrayBuffer());
 const iv=a.slice(0,12),data=a.slice(12);
 return new Blob([await crypto.subtle.decrypt({name:"AES-GCM",iv},await key(),data)]);
}

async function preview(f){
 try{
  const img=document.getElementById("i"+f.id);if(!img)return;
  const b=await decrypt(await encrypted(f.id));
  const u=URL.createObjectURL(new Blob([b],{type:f.file_type}));
  img.src=u;img.style.display="block";img.onload=()=>URL.revokeObjectURL(u);
 }catch(e){console.log(e)}
}

async function openFile(id){
 const f=files.find(x=>x.id==id);if(!f)return;
 modal.classList.remove("hidden");modalTitle.textContent=f.filename;
 modalBody.innerHTML='<div class="message">🔐 Decrypting...</div>';
 try{
  const b=await decrypt(await encrypted(id));
  const u=URL.createObjectURL(new Blob([b],{type:f.file_type||"application/octet-stream"}));
  if(f.file_type?.startsWith("image/"))modalBody.innerHTML=`<img src="${u}">`;
  else if(f.file_type==="application/pdf")modalBody.innerHTML=`<iframe src="${u}"></iframe>`;
  else if(f.file_type?.startsWith("video/"))modalBody.innerHTML=`<video controls autoplay src="${u}"></video>`;
  else modalBody.innerHTML=`<button class="btn primary" onclick="download(${id})">⬇ Download File</button>`;
 }catch(e){modalBody.innerHTML='<div class="message">❌ Unable to decrypt file.</div>'}
}

function closeView(){modal.classList.add("hidden");modalBody.innerHTML=""}

async function download(id){
 try{
  const f=files.find(x=>x.id==id),b=await decrypt(await encrypted(id));
  const u=URL.createObjectURL(new Blob([b],{type:f.file_type||"application/octet-stream"}));
  const a=document.createElement("a");a.href=u;a.download=f.filename||"file";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
 }catch(e){alert("Download failed: "+e.message)}
}

async function upload(){
 const f=file.files[0];if(!f)return alert("Please select a file.");
 if(f.size>60*1024*1024)return alert("Maximum file size is 60 MB.");
 msg.classList.remove("hidden");msg.textContent="🔐 Encrypting...";
 try{
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},await key(),await f.arrayBuffer());
  const out=new Uint8Array(12+enc.byteLength);out.set(iv);out.set(new Uint8Array(enc),12);
  const r=await fetch(API+"/api/photos",{method:"POST",credentials:"include",
   headers:{"Content-Type":"application/octet-stream","X-Filename":encodeURIComponent(f.name),
   "X-File-Type":f.type||"application/octet-stream","X-Category":encodeURIComponent(cat.value)},body:out});
  const d=await r.json();if(!r.ok)throw Error(d.error||"Upload failed");
  msg.textContent="✓ Saved • ⏳ Drive backup pending";file.value="";
  try{const b=await fetch(API+"/api/google/backup/"+d.id,{method:"POST",credentials:"include"});const x=await b.json();
   if(b.ok&&x.success)msg.textContent=x.duplicate?"✓ Saved • Already backed up":"✓ Saved • ☁️ Backed up";
  }catch{}
  await refresh();
 }catch(e){msg.textContent="Error: "+e.message}
}

async function del(id){
 if(!confirm("Delete this file?"))return;
 const r=await fetch(API+"/api/photos/"+id,{method:"DELETE",credentials:"include"});
 if(r.ok)refresh();
}

async function backup(id){
 try{
  const r=await fetch(API+"/api/google/backup/"+id,{method:"POST",credentials:"include"});
  const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Backup failed");
  alert(d.duplicate?"✓ Already backed up":"☁️ Backup completed");refresh();
 }catch(e){alert("Backup failed: "+e.message)}
}

async function backupAll(){
 const p=files.filter(f=>!f.google_drive_file_id);
 if(!p.length)return alert("✓ All files are already backed up.");
 let ok=0;
 for(const f of p)try{
  const r=await fetch(API+"/api/google/backup/"+f.id,{method:"POST",credentials:"include"});
  if(r.ok&&(await r.json()).success)ok++;
 }catch{}
 alert(`☁️ Backup finished\n\n✓ Successful: ${ok}\n⏳ Remaining: ${p.length-ok}`);
 refresh();
}

async function status(){
 try{
  const r=await fetch(API+"/api/google/status",{credentials:"include"}),d=await r.json();
  if(!d.connected)return driveStatus.textContent="Not connected";
  const total=Number(d.total||0),backed=Number(d.backedUp??d.backed_up??0);
  driveStatus.textContent=`✓ Connected • ${backed} backed up • ${Math.max(0,total-backed)} pending`;
 }catch{driveStatus.textContent="Unable to check Drive"}
}

function connectGoogle(){location.href=API+"/api/google/connect"}

async function refresh(){await load();await status()}

function viewMode(m){
 localStorage.vault_view=m;
 filesBox().classList.toggle("list",m==="list");
 grid.classList.toggle("active",m==="grid");
 list.classList.toggle("active",m==="list");
}

function icon(t){
 if(!t)return"📄";if(t.startsWith("image/"))return"🖼️";
 if(t.startsWith("video/"))return"🎬";if(t.startsWith("audio/"))return"🎵";
 if(t.includes("pdf"))return"📕";return"📄";
}

function size(n){
 if(!n)return"0 B";let u=["B","KB","MB","GB"],i=0;
 while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i];
}

function esc(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function attr(x){return String(x||"").replace(/'/g,"\\'")}

check();
</script>
</body>
</html>
