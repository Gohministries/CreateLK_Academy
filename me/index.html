<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(180deg,#f8faff,#eef3ff);color:#172033}
button,input,select{font:inherit}button{border:0;cursor:pointer}
header{background:linear-gradient(135deg,#111827,#1e293b);color:white;padding:18px}
.head,main{max-width:1000px;margin:auto}.sub{color:#cbd5e1;font-size:13px;margin-top:4px}
main{padding:18px}.hidden{display:none!important}
.card,.file,.empty{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:0 5px 20px #00000008}
.login{max-width:400px;margin:60px auto}
h1{margin:0;font-size:23px}label{display:block;font-size:13px;font-weight:bold;margin-top:13px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #d1d5db;border-radius:10px}
.btn{padding:10px 13px;border-radius:10px;font-weight:bold;background:#e5e7eb}
.primary,.drive{background:#111827;color:white}.logout{float:right;background:#374151;color:white;padding:7px 10px;border-radius:8px;font-size:12px}
.message{background:#f3f4f6;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.actions,.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.filehead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.views{background:#e5e7eb;padding:3px;border-radius:9px}.views button{padding:6px 9px;background:transparent;border-radius:7px}
.views .active{background:white}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.files.list{display:flex;flex-direction:column}.files.list .file{display:flex;gap:12px}.files.list .preview{width:70px;height:70px;flex:none}
.preview{height:140px;background:#f1f5f9;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}.icon{font-size:38px}
.name{font-weight:bold;margin-top:9px;word-break:break-word}.info{font-size:12px;color:#6b7280;margin-top:4px}
.status{font-size:12px;font-weight:bold;margin-top:6px}.pending{color:#b45309}.done{color:#15803d}
.small{padding:7px 9px;border-radius:8px;background:#eef2f7;font-size:11px;font-weight:bold}
.view{background:#dbeafe;color:#1d4ed8}.download{background:#dcfce7;color:#166534}.delete{background:#fee2e2;color:#b91c1c}
.empty{text-align:center;color:#6b7280}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.modalbox{background:white;border-radius:16px;width:min(900px,100%);max-height:95vh;overflow:auto}
.modalhead{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.modalbody{padding:15px;text-align:center;background:#f8fafc}.modalbody img{max-width:100%;max-height:75vh;border-radius:10px}
.modalbody iframe{width:100%;height:75vh;border:0}.modalbody video{max-width:100%;max-height:75vh}.modalbody audio{width:100%}
@media(max-width:600px){.files{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<header><div class="head">
<button id="logoutBtn" class="logout hidden" onclick="logout()">Logout</button>
<h1>🔐 Personal Vault</h1>
<div class="sub">Secure encrypted storage</div>
</div></header>

<main>
<section id="loginScreen" class="card login">
<h2>🔐 Unlock Vault</h2>
<label>Username</label>
<input id="username" autocomplete="username">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" class="btn primary" style="width:100%;margin-top:16px" onclick="login()">🔓 Unlock</button>
<div id="loginMsg" class="message hidden"></div>
</section>

<section id="appScreen" class="hidden">

<div class="card">
<h3 style="margin:0">☁️ Google Drive Backup</h3>
<div id="driveStatus" class="info">Checking...</div>
<div class="actions">
<button class="btn" onclick="backupAll()">☁️ Backup All</button>
<button class="btn" onclick="refreshFiles()">🔄 Refresh</button>
</div>
</div>

<div class="card">
<h3 style="margin:0">Upload File</h3>
<input id="fileInput" type="file">
<select id="category">
<option>Other</option><option>Family</option><option>Church</option>
<option>Ministry</option><option>Personal</option><option>Documents</option>
<option>Travel</option><option>Memories</option><option>Backup</option>
</select>
<button class="btn primary" style="margin-top:10px" onclick="uploadFile()">🔐 Encrypt & Upload</button>
<div id="uploadMsg" class="message hidden"></div>
</div>

<div class="filehead">
<h3 style="margin:0">My Files</h3>
<div class="views">
<button id="gridBtn" class="active" onclick="setView('grid')">▦ Grid</button>
<button id="listBtn" onclick="setView('list')">☷ List</button>
</div>
</div>

<div id="filesBox" class="files"></div>
</section>
</main>

<div id="viewer" class="modal hidden">
<div class="modalbox">
<div class="modalhead"><b id="viewerTitle"></b><button class="small" onclick="closeViewer()">✕</button></div>
<div id="viewerBody" class="modalbody"></div>
</div>
</div>

<script>
const API="https://personal.createlk.workers.dev";
let files=[],key=null;

const $=id=>document.getElementById(id);
const loginScreen=$("loginScreen"),appScreen=$("appScreen"),logoutBtn=$("logoutBtn");
const username=$("username"),password=$("password"),loginMsg=$("loginMsg");
const uploadMsg=$("uploadMsg"),fileInput=$("fileInput"),category=$("category");
const filesBox=$("filesBox"),driveStatus=$("driveStatus");
const viewer=$("viewer"),viewerTitle=$("viewerTitle"),viewerBody=$("viewerBody");

async function getKey(){
 if(key)return key;
 const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("personal-vault-key"));
 return key=await crypto.subtle.importKey("raw",h,"AES-GCM",false,["encrypt","decrypt"]);
}

function msg(el,text,error=false){
 el.textContent=text;
 el.className="message "+(error?"error":"success");
 el.classList.remove("hidden");
}

async function login(){
 const u=username.value.trim(),p=password.value;
 if(!u||!p)return msg(loginMsg,"Please enter username and password.",true);
 $("loginBtn").disabled=true;
 try{
  const r=await fetch(API+"/api/login",{
   method:"POST",credentials:"include",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:u,password:p})
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.authenticated)throw Error(d.error||"Login failed");
  localStorage.setItem("vault_logged_in","1");
  showApp();
 }catch(e){msg(loginMsg,e.message==="Failed to fetch"?"Unable to connect to Personal Vault.":e.message,true)}
 $("loginBtn").disabled=false;
}

function showApp(){
 loginScreen.classList.add("hidden");
 appScreen.classList.remove("hidden");
 logoutBtn.classList.remove("hidden");
 setView(localStorage.getItem("vault_view")||"grid");
 refreshFiles();
}

async function restoreSession(){
 if(localStorage.getItem("vault_logged_in")!=="1")return;
 try{
  const r=await fetch(API+"/api/auth/status",{credentials:"include"});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.authenticated)return showApp();
 }catch(e){}
 localStorage.removeItem("vault_logged_in");
}

async function logout(){
 try{await fetch(API+"/api/logout",{method:"POST",credentials:"include"})}catch(e){}
 localStorage.removeItem("vault_logged_in");
 location.reload();
}

async function loadFiles(){
 filesBox.innerHTML='<div class="message">🔄 Loading...</div>';
 try{
  const r=await fetch(API+"/api/items",{credentials:"include",cache:"no-store"});
  if(r.status===401)return logout();
  const d=await r.json();
  if(!r.ok)throw Error(d.error||"Unable to load files");
  files=Array.isArray(d.items)?d.items:[];
  renderFiles();
 }catch(e){
  filesBox.innerHTML='<div class="message error">❌ Unable to load files.</div>';
 }
}

function renderFiles(){
 if(!files.length){
  filesBox.innerHTML='<div class="empty">📁<br><b>No files yet</b></div>';
  return;
 }

 filesBox.innerHTML=files.map(f=>{
  const image=(f.file_type||"").startsWith("image/");
  const backed=!!f.google_drive_file_id;

  return `<div class="file">
   <div class="preview">
    ${image?`<img id="thumb-${f.id}" style="display:none">`:`<span class="icon">${fileIcon(f.file_type)}</span>`}
   </div>
   <div style="flex:1">
    <div class="name">${escapeHTML(f.filename)}</div>
    <div class="info">${escapeHTML(f.category||"Other")} • ${formatSize(f.file_size)}</div>
    <div class="status ${backed?"done":"pending"}">${backed?"☁️ Backed up":"⏳ Backup pending"}</div>
    <div class="buttons">
     <button class="small view" onclick="viewFile(${f.id})">👁 View</button>
     <button class="small download" onclick="downloadFile(${f.id})">⬇ Download</button>
     ${backed
      ?`<button class="small drive" onclick="openDrive('${escapeAttr(f.google_drive_url)}')">☁ Drive</button>`
      :`<button class="small drive" onclick="backupFile(${f.id})">☁ Backup</button>`}
     <button class="small delete" onclick="deleteFile(${f.id})">🗑 Delete</button>
    </div>
   </div>
  </div>`;
 }).join("");

 files.filter(f=>(f.file_type||"").startsWith("image/")).forEach(loadThumbnail);
}

async function getEncryptedFile(id){
 const r=await fetch(API+"/api/photos/"+id+"/download",{credentials:"include",cache:"no-store"});
 if(r.status===401){logout();throw Error("Session expired")}
 if(!r.ok)throw Error("Unable to get file");
 return r.blob();
}

async function decryptBlob(blob,type){
 const b=new Uint8Array(await blob.arrayBuffer());
 if(b.length<13)throw Error("Invalid encrypted file");
 const data=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv:b.slice(0,12)},await getKey(),b.slice(12)
 );
 return new Blob([data],{type:type||"application/octet-stream"});
}

async function loadThumbnail(f){
 try{
  const img=$("thumb-"+f.id);
  if(!img)return;
  const b=await decryptBlob(await getEncryptedFile(f.id),f.file_type);
  const url=URL.createObjectURL(b);
  img.src=url;
  img.style.display="block";
  img.onload=()=>URL.revokeObjectURL(url);
 }catch(e){}
}

async function viewFile(id){
 const f=files.find(x=>String(x.id)===String(id));
 if(!f)return;

 viewer.classList.remove("hidden");
 viewerTitle.textContent=f.filename;
 viewerBody.innerHTML='<div class="message">🔐 Decrypting...</div>';

 try{
  const b=await decryptBlob(await getEncryptedFile(id),f.file_type);
  const url=URL.createObjectURL(b),t=f.file_type||"";

  viewerBody.innerHTML=
   t.startsWith("image/")?`<img src="${url}">`:
   t==="application/pdf"?`<iframe src="${url}"></iframe>`:
   t.startsWith("video/")?`<video controls autoplay src="${url}"></video>`:
   t.startsWith("audio/")?`<audio controls src="${url}"></audio>`:
   `<button class="btn primary" onclick="downloadFile(${id})">⬇ Download File</button>`;
 }catch(e){
  viewerBody.innerHTML='<div class="message error">❌ Unable to decrypt file.</div>';
 }
}

function closeViewer(){
 viewer.classList.add("hidden");
 viewerBody.innerHTML="";
}

async function downloadFile(id){
 try{
  const f=files.find(x=>String(x.id)===String(id));
  if(!f)return;
  const b=await decryptBlob(await getEncryptedFile(id),f.file_type);
  const url=URL.createObjectURL(b),a=document.createElement("a");
  a.href=url;a.download=f.filename||"file";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
 }catch(e){alert("Download failed: "+e.message)}
}

async function uploadFile(){
 const f=fileInput.files[0];
 if(!f)return alert("Please select a file.");
 if(f.size>60*1024*1024)return alert("Maximum file size is 60 MB.");

 msg(uploadMsg,"🔐 Encrypting...");
 try{
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encrypted=await crypto.subtle.encrypt(
   {name:"AES-GCM",iv},await getKey(),await f.arrayBuffer()
  );

  const out=new Uint8Array(12+encrypted.byteLength);
  out.set(iv);out.set(new Uint8Array(encrypted),12);

  uploadMsg.textContent="☁️ Uploading...";

  const r=await fetch(API+"/api/photos",{
   method:"POST",credentials:"include",
   headers:{
    "Content-Type":"application/octet-stream",
    "X-Filename":encodeURIComponent(f.name),
    "X-File-Type":encodeURIComponent(f.type||"application/octet-stream"),
    "X-Category":encodeURIComponent(category.value)
   },
   body:out
  });

  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||"Upload failed");

  fileInput.value="";
  msg(uploadMsg,"✓ Saved • ⏳ Drive backup");
  await refreshFiles();
 }catch(e){msg(uploadMsg,"❌ "+e.message,true)}
}

async function deleteFile(id){
 if(!confirm("Delete this file?"))return;
 try{
  const r=await fetch(API+"/api/photos/"+id,{method:"DELETE",credentials:"include"});
  if(!r.ok)throw Error("Delete failed");
  refreshFiles();
 }catch(e){alert(e.message)}
}

async function backupFile(id){
 try{
  const r=await fetch(API+"/api/google/backup/"+id,{
   method:"POST",credentials:"include"
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok)throw Error(d.error||"Backup failed");
  alert(d.duplicate?"✓ Already backed up":"☁️ Backup completed");
  refreshFiles();
 }catch(e){alert("Backup failed: "+e.message)}
}

async function backupAll(){
 const pending=files.filter(f=>!f.google_drive_file_id);
 if(!pending.length)return alert("✓ All files are already backed up.");

 let success=0;
 for(const f of pending){
  try{
   const r=await fetch(API+"/api/google/backup/"+f.id,{
    method:"POST",credentials:"include"
   });
   const d=await r.json().catch(()=>({}));
   if(r.ok&&d.ok)success++;
  }catch(e){}
 }

 alert(`☁️ Backup finished\n\n✓ Successful: ${success}\n⏳ Remaining: ${pending.length-success}`);
 refreshFiles();
}

async function googleStatus(){
 try{
  const r=await fetch(API+"/api/google/status",{credentials:"include"});
  const d=await r.json();
  driveStatus.textContent=d.connected?"✓ Google Drive connected":"Not connected";
 }catch(e){driveStatus.textContent="Unable to check Drive"}
}

async function refreshFiles(){
 await loadFiles();
 await googleStatus();
}

function setView(mode){
 localStorage.setItem("vault_view",mode);
 filesBox.classList.toggle("list",mode==="list");
 $("gridBtn").classList.toggle("active",mode==="grid");
 $("listBtn").classList.toggle("active",mode==="list");
}

function fileIcon(t){
 if(!t)return"📄";
 if(t.startsWith("image/"))return"🖼️";
 if(t.startsWith("video/"))return"🎬";
 if(t.startsWith("audio/"))return"🎵";
 if(t.includes("pdf"))return"📕";
 if(t.includes("zip"))return"📦";
 return"📄";
}

function formatSize(n){
 n=Number(n)||0;
 const u=["B","KB","MB","GB"];let i=0;
 while(n>=1024&&i<3)n/=1024,i++;
 return n.toFixed(i?1:0)+" "+u[i];
}

function escapeHTML(v){
 return String(v||"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function escapeAttr(v){
 return String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function openDrive(url){
 if(url)window.open(url,"_blank","noopener");
}

restoreSession();
</script>
</body>
</html>
