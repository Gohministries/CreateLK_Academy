<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font:15px Arial}
header{background:#111827;color:white;padding:12px 15px;display:flex;justify-content:space-between}
main{max-width:850px;margin:auto;padding:10px}
.card{background:white;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 7px #0001}
h2,h3{margin:0 0 10px}
input,textarea,select{width:100%;padding:11px;margin:4px 0 9px;border:1px solid #ddd;border-radius:8px}
textarea{min-height:70px}
button{border:0;border-radius:8px;padding:10px 14px;min-height:40px;background:#111827;color:white;font-weight:bold}
.hidden{display:none!important}
.msg{color:#dc2626;margin-top:7px}
.small{font-size:12px;color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:#f8fafc;padding:10px;text-align:center;border-radius:8px}
.stat b{display:block;font-size:20px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.danger{background:#dc2626}
.item,.file{border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin:7px 0}
.viewbar{display:flex;justify-content:space-between;align-items:center}
.viewbuttons{display:flex;gap:5px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.files.list{display:block}
.file{padding:0;overflow:hidden;background:white}
.preview{height:105px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:32px}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.fileinfo{padding:9px}
.filename{font-weight:bold;font-size:13px;word-break:break-word}
.filecategory{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px}
.files.list .file{display:flex;padding:7px}
.files.list .preview{width:65px;height:65px;flex:none;border-radius:6px}
.files.list .fileinfo{flex:1}
.progress{height:5px;background:#ddd;border-radius:5px;margin-top:7px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#111827}
.session-loading{text-align:center;padding:25px}
@media(max-width:500px){.files{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>

<header>
<b>🔐 Personal Vault</b>
<div>
<button id="lock" class="hidden">Lock</button>
<button id="logout" class="hidden">Logout</button>
</div>
</header>

<main>

<div id="sessionLoading" class="card session-loading">
Checking secure session...
</div>

<div id="login" class="card hidden">
<h2>🔐 Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Login Password">
<button id="loginBtn">Login</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="master" class="card hidden">
<h2>🔑 Master Password</h2>
<div class="small">Used only in this browser.</div>
<input id="masterPass" type="password" placeholder="Master Password">
<button id="unlockBtn">Unlock Vault</button>
<div id="masterMsg" class="msg"></div>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>🔐 Vault</h2>
<div class="stats">
<div class="stat"><b id="itemCount">0</b>Items</div>
<div class="stat"><b id="catCount">0</b>Categories</div>
<div class="stat"><b id="fileCount">0</b>Files</div>
</div>
</div>

<div class="card">
<h3>➕ Add Item</h3>

<select id="category"></select>
<input id="title" placeholder="Title">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<textarea id="backup" placeholder="Backup Codes"></textarea>
<textarea id="notes" placeholder="Notes"></textarea>

<button id="saveItem">Save Item</button>
<div id="itemMsg" class="msg"></div>
</div>

<div class="card">
<h3>📁 Categories</h3>
<input id="newCategory" placeholder="New category">
<button id="addCategory">Add Category</button>
<div id="categories"></div>
</div>

<div class="card">
<h3>🔐 Vault Items</h3>
<div id="items"></div>
</div>

<div class="card">

<div class="viewbar">
<h3>🖼️ Files</h3>
<div class="viewbuttons">
<button id="grid">Grid</button>
<button id="list">List</button>
</div>
</div>

<div class="small">Encrypted before upload • Maximum 60 MB</div>

<input id="file" type="file">

<div id="progress" class="progress hidden">
<i id="progressBar"></i>
</div>

<div id="fileMsg" class="msg"></div>

<input id="fileSearch" placeholder="🔎 Search files...">

<select id="fileCategoryFilter">
<option value="">All categories</option>
<option>General</option>
<option>Photos</option>
<option>Documents</option>
<option>Videos</option>
<option>Other</option>
</select>

<div id="files" class="files"></div>

</div>

</div>
</main>

<script>

const API="https://personal.createlk.workers.dev";
const DB="personal-vault-key";

let key=null,meta=null,files=[];

const $=id=>document.getElementById(id);
const say=(id,t)=>$(id).textContent=t;

function b64(a){
 let s="";
 for(let i=0;i<a.length;i+=32768)
  s+=String.fromCharCode(...a.subarray(i,i+32768));
 return btoa(s);
}

function un64(s){
 const x=atob(s),a=new Uint8Array(x.length);
 for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
 return a;
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[m]);
}

async function api(p,o={}){
 o.credentials="include";
 o.headers={...(o.headers||{})};

 const r=await fetch(API+p,o);
 let d={};

 try{d=await r.json()}catch{}

 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}


/* CRYPTO */

async function derive(p,s){
 const b=await crypto.subtle.importKey(
  "raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]
 );

 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},
  b,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]
 );
}

async function enc(t){
 const iv=crypto.getRandomValues(new Uint8Array(12));

 const d=await crypto.subtle.encrypt(
  {name:"AES-GCM",iv},
  key,new TextEncoder().encode(t||"")
 );

 return JSON.stringify({
  iv:b64(iv),
  data:b64(new Uint8Array(d))
 });
}

async function dec(v){
 if(!v)return"";

 const x=JSON.parse(v);

 const d=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv:un64(x.iv)},
  key,un64(x.data)
 );

 return new TextDecoder().decode(d);
}


/* KEY STORAGE */

function keyDB(){
 return new Promise((ok,no)=>{
  const r=indexedDB.open(DB,1);

  r.onupgradeneeded=()=>{
   r.result.createObjectStore("k");
  };

  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);
 });
}

async function saveKey(){
 const d=await keyDB();

 const raw=await crypto.subtle.exportKey("raw",key);

 d.transaction("k","readwrite")
 .objectStore("k")
 .put(b64(new Uint8Array(raw)),"key");
}

async function getKey(){
 try{
  const d=await keyDB();

  const v=await new Promise(ok=>{
   const r=d.transaction("k").objectStore("k").get("key");
   r.onsuccess=()=>ok(r.result);
   r.onerror=()=>ok(null);
  });

  return v?crypto.subtle.importKey(
   "raw",un64(v),{name:"AES-GCM"},true,["encrypt","decrypt"]
  ):null;

 }catch{
  return null;
 }
}

async function clearKey(){
 try{
  const d=await keyDB();
  d.transaction("k","readwrite").objectStore("k").delete("key");
 }catch{}
}


/* SESSION */

async function status(){

try{

 const s=await api("/api/login/status");

 if(s.logged_in===false||s.authenticated===false){
  $("login").classList.remove("hidden");
  return;
 }

 $("logout").classList.remove("hidden");

 meta=await api("/api/vault/meta");
 key=await getKey();

 if(key&&meta){

  try{
   if(meta.verifier&&await dec(meta.verifier)==="VAULT-CHECK"){
    openApp();
    return;
   }
  }catch{}
 }

 key=null;
 $("master").classList.remove("hidden");

}catch(e){

 $("login").classList.remove("hidden");
 say("loginMsg","Unable to check session.");

}finally{

 $("sessionLoading").classList.add("hidden");

}
}


/* LOGIN */

$("loginBtn").onclick=async()=>{

try{

 const r=await fetch(API+"/api/login",{
  method:"POST",
  credentials:"include",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   username:$("user").value.trim(),
   password:$("pass").value
  })
 });

 let d={};
 try{d=await r.json()}catch{}

 if(!r.ok)throw Error(d.error||"Login failed");

 $("login").classList.add("hidden");
 $("master").classList.remove("hidden");
 $("logout").classList.remove("hidden");

 meta=await api("/api/vault/meta");
 $("pass").value="";

}catch(e){

 say("loginMsg",e.message);

}
};


/* MASTER */

$("unlockBtn").onclick=async()=>{

try{

 const p=$("masterPass").value;
 if(!p)throw Error("Enter Master Password.");

 if(meta&&meta.initialized===false){

  const salt=crypto.getRandomValues(new Uint8Array(16));

  key=await derive(p,salt);

  const verifier=await enc("VAULT-CHECK");

  await api("/api/vault/meta",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    salt:b64(salt),
    verifier
   })
  });

  meta={initialized:true,salt:b64(salt),verifier};

 }else if(meta?.salt&&meta?.verifier){

  key=await derive(p,un64(meta.salt));

  if(await dec(meta.verifier)!=="VAULT-CHECK")
   throw Error("Incorrect master password.");

 }else{

  key=await derive(
   p,new TextEncoder().encode("personal-vault")
  );

 }

 await saveKey();

 $("masterPass").value="";
 openApp();

}catch(e){

 key=null;
 say("masterMsg",e.message);

}
};


function openApp(){

 $("master").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("lock").classList.remove("hidden");
 load();

}

$("lock").onclick=async()=>{
 key=null;
 await clearKey();
 $("app").classList.add("hidden");
 $("master").classList.remove("hidden");
 $("lock").classList.add("hidden");
};

$("logout").onclick=async()=>{
 key=null;
 await clearKey();

 try{
  await api("/api/logout",{method:"POST"});
 }catch{}

 location.reload();
};


/* CATEGORIES */

async function cats(){

try{

 const r=await api("/api/categories");
 const c=Array.isArray(r)?r:(r.categories||[]);

 $("catCount").textContent=c.length;

 $("category").innerHTML=c.map(x=>{
  const n=typeof x==="string"?x:x.name||x.category;
  return `<option>${esc(n)}</option>`;
 }).join("")||"<option>General</option>";

 $("categories").innerHTML=c.map(x=>{
  const n=typeof x==="string"?x:x.name||x.category;
  return `<div class="small">📁 ${esc(n)}</div>`;
 }).join("");

}catch{}

}

$("addCategory").onclick=async()=>{

 const n=$("newCategory").value.trim();
 if(!n)return;

 try{

  await api("/api/categories",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name:n})
  });

  $("newCategory").value="";
  await cats();

 }catch(e){
  alert(e.message);
 }

};


/* ITEMS */

async function items(){

try{

 const r=await api("/api/items");
 const a=Array.isArray(r)?r:(r.items||[]);

 $("itemCount").textContent=a.length;
 $("items").innerHTML="";

 for(const x of a){

  let u="",p="",b="",n="";

  try{
   u=await dec(x.username||x.encrypted_username);
   p=await dec(x.encrypted_password);
   b=await dec(x.encrypted_backup_codes);
   n=await dec(x.encrypted_notes);
  }catch{}

  const d=document.createElement("div");
  d.className="item";

  d.innerHTML=`
   <b>${esc(x.title)}</b>
   <div class="small">📁 ${esc(x.category)}</div>

   <div class="actions">
    <button>Show</button>
    <button class="danger">Delete</button>
   </div>

   <div class="secret hidden">
    <p><b>Username</b><br>${esc(u)}</p>
    <p><b>Password</b><br>${esc(p)}</p>
    <p><b>Backup Codes</b><br>${esc(b).replace(/\n/g,"<br>")}</p>
    <p><b>Notes</b><br>${esc(n).replace(/\n/g,"<br>")}</p>
   </div>
  `;

  const show=d.querySelector("button");

  show.onclick=function(){
   const s=d.querySelector(".secret");
   s.classList.toggle("hidden");
   this.textContent=s.classList.contains("hidden")?"Show":"Hide";
  };

  d.querySelector(".danger").onclick=async()=>{

   if(!confirm("Delete this item?"))return;

   try{
    await api("/api/items/"+x.id,{method:"DELETE"});
    await items();
   }catch(e){
    alert(e.message);
   }
  };

  $("items").append(d);
 }

}catch(e){
 console.error(e);
}

}


$("saveItem").onclick=async()=>{

try{

 if(!$("title").value.trim())
  throw Error("Enter a title.");

 await api("/api/items",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   category:$("category").value||"General",
   title:$("title").value,
   username:await enc($("username").value),
   encrypted_password:await enc($("password").value),
   encrypted_backup_codes:await enc($("backup").value),
   encrypted_notes:await enc($("notes").value)
  })
 });

 ["title","username","password","backup","notes"]
 .forEach(x=>$(x).value="");

 say("itemMsg","Item saved.");
 await items();

}catch(e){

 say("itemMsg",e.message);

}
};


/* FILE DATA */

async function fileData(f){

 const r=await fetch(
  API+"/api/photos/"+f.id+"/download",
  {credentials:"include",cache:"no-store"}
 );

 if(!r.ok)throw Error("File unavailable.");

 const a=new Uint8Array(await r.arrayBuffer());

 return crypto.subtle.decrypt(
  {name:"AES-GCM",iv:a.slice(0,12)},
  key,a.slice(12)
 );
}

async function fileURL(f){

 return URL.createObjectURL(
  new Blob([await fileData(f)],{
   type:f.file_type||"application/octet-stream"
  })
 );
}


/* LOCAL FILE FEATURES */

const FEATURE_DB="personal-vault-file-features";

function featureDB(){

 return new Promise((ok,no)=>{

  const r=indexedDB.open(FEATURE_DB,1);

  r.onupgradeneeded=()=>{
   r.result.createObjectStore("files",{keyPath:"id"});
  };

  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);

 });
}

async function feature(id){

 const db=await featureDB();

 return new Promise(ok=>{

  const r=db.transaction("files")
  .objectStore("files")
  .get(+id);

  r.onsuccess=()=>ok(r.result||null);
  r.onerror=()=>ok(null);

 });
}

async function saveFeature(x){

 const db=await featureDB();

 db.transaction("files","readwrite")
 .objectStore("files")
 .put(x);
}

async function getFeature(f){

 let x=await feature(f.id);

 if(!x){

  x={
   id:+f.id,
   name:f.filename,
   category:f.file_type?.startsWith("image/")
    ?"Photos"
    :f.file_type?.startsWith("video/")
    ?"Videos"
    :"General"
  };

  await saveFeature(x);
 }

 return x;
}


/* RENAME */

async function renameFile(f){

 const x=await getFeature(f);

 const n=prompt("File name:",x.name);

 if(n===null)return;

 x.name=n.trim()||f.filename;

 await saveFeature(x);
 renderFiles();

}


/* CATEGORY */

async function categoryFile(f){

 const x=await getFeature(f);

 const c=prompt(
  "Category: General, Photos, Documents, Videos, Other",
  x.category
 );

 if(c===null)return;

 if(!["General","Photos","Documents","Videos","Other"].includes(c))
  return alert("Invalid category");

 x.category=c;

 await saveFeature(x);
 renderFiles();

}


/* FILE LIST */

async function renderFiles(){

 const search=$("fileSearch").value.toLowerCase();
 const filter=$("fileCategoryFilter").value;

 $("files").innerHTML="";

 for(const f of files){

  const x=await getFeature(f);
  const name=x.name||f.filename;

  if(search&&!name.toLowerCase().includes(search))continue;
  if(filter&&x.category!==filter)continue;

  const d=document.createElement("div");
  d.className="file";

  d.innerHTML=`
   <div class="preview">📄</div>
   <div class="fileinfo">

    <div class="filename">${esc(name)}</div>
    <div class="filecategory">${esc(x.category)}</div>

    <div class="small">
     ${Math.round((f.file_size||0)/1024)} KB
    </div>

    <div class="actions">
     <button>View</button>
     <button>Download</button>
     <button>Rename</button>
     <button>Category</button>
     <button class="danger">Delete</button>
    </div>

   </div>
  `;

  const p=d.querySelector(".preview");

  if(f.file_type?.startsWith("image/")){
   fileURL(f).then(u=>{
    p.innerHTML=`<img src="${u}">`;
   });
  }

  if(f.file_type?.startsWith("video/")){
   fileURL(f).then(u=>{
    p.innerHTML=`<video src="${u}" muted playsinline></video>`;
   });
  }

  const b=d.querySelectorAll("button");

  b[0].onclick=()=>view(f);
  b[1].onclick=()=>download(f);
  b[2].onclick=()=>renameFile(f);
  b[3].onclick=()=>categoryFile(f);

  b[4].onclick=async()=>{

   if(!confirm("Delete this file?"))return;

   try{

    await api("/api/photos/"+f.id,{method:"DELETE"});
    await loadFiles();

   }catch(e){

    say("fileMsg",e.message);

   }
  };

  $("files").append(d);
 }
}


/* LOAD FILES */

async function loadFiles(){

 try{

  const r=await api("/api/photos");

  files=Array.isArray(r)?r:(r.files||[]);

  $("fileCount").textContent=files.length;

  await renderFiles();

 }catch(e){

  say("fileMsg",e.message);

 }
}


/* VIEW */

async function view(f){

 const u=await fileURL(f);
 const w=window.open("","_blank");

 if(!w)return;

 if(f.file_type?.startsWith("image/")){

  w.document.body.innerHTML=
   `<img src="${u}" style="max-width:100%">`;

 }else if(f.file_type?.startsWith("video/")){

  w.document.body.innerHTML=
   `<video src="${u}" controls autoplay style="width:100%"></video>`;

 }else{

  const x=await getFeature(f);

  w.document.body.innerHTML=
   `<a href="${u}" download="${esc(x.name)}">Download ${esc(x.name)}</a>`;
 }
}


/* DOWNLOAD */

async function download(f){

 try{

  const u=await fileURL(f);
  const x=await getFeature(f);

  const a=document.createElement("a");

  a.href=u;
  a.download=x.name||f.filename;

  document.body.append(a);
  a.click();
  a.remove();

 }catch(e){

  say("fileMsg",e.message);

 }
}


/* UPLOAD */

$("file").onchange=async()=>{

 const f=$("file").files[0];

 if(!f)return;

 if(f.size>60*1024*1024){

  $("file").value="";
  return say("fileMsg","Maximum 60 MB.");

 }

 $("progress").classList.remove("hidden");

 try{

  say("fileMsg","Encrypting...");

  const iv=crypto.getRandomValues(new Uint8Array(12));

  const d=new Uint8Array(
   await crypto.subtle.encrypt(
    {name:"AES-GCM",iv},
    key,
    await f.arrayBuffer()
   )
  );

  const a=new Uint8Array(12+d.length);

  a.set(iv);
  a.set(d,12);

  $("progressBar").style.width="50%";

  const r=await fetch(API+"/api/photos",{
   method:"POST",
   credentials:"include",
   headers:{
    "Content-Type":"application/octet-stream",
    "X-Filename":encodeURIComponent(f.name),
    "X-File-Type":f.type||"application/octet-stream"
   },
   body:a
  });

  if(!r.ok)throw Error("Upload failed.");

  $("progressBar").style.width="100%";
  $("file").value="";

  say("fileMsg","File uploaded.");

  await loadFiles();

 }catch(e){

  say("fileMsg",e.message);

 }finally{

  setTimeout(()=>{
   $("progress").classList.add("hidden");
   $("progressBar").style.width="0";
  },500);

 }
};


/* SEARCH / VIEW */

$("fileSearch").oninput=renderFiles;
$("fileCategoryFilter").onchange=renderFiles;

function mode(x){
 $("files").classList.toggle("list",x==="list");
 localStorage.fileView=x;
}

$("grid").onclick=()=>mode("grid");
$("list").onclick=()=>mode("list");

mode(localStorage.fileView||"grid");


/* START */

async function load(){

 await cats();
 await items();
 await loadFiles();

}

status();

</script>

</body>
</html>
