<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:14px Arial}
header{background:#111827;color:#fff;padding:12px 15px;display:flex;justify-content:space-between}
button{border:0;border-radius:7px;padding:8px 11px;background:#111827;color:#fff}
header button{background:#fff;color:#111;margin-left:4px}
main{max-width:850px;margin:auto;padding:12px}.card{background:#fff;padding:14px;border-radius:11px;margin-bottom:12px;box-shadow:0 2px 7px #0001}
h2,h3{margin:0 0 10px}input,textarea,select{width:100%;padding:9px;margin:4px 0 9px;border:1px solid #ddd;border-radius:7px;font:inherit}
textarea{min-height:70px}.hidden{display:none!important}.msg{color:#dc2626;margin-top:7px}.small{font-size:12px;color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;padding:10px;text-align:center;border-radius:8px}.stat b{display:block;font-size:20px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.danger{background:#dc2626}.gray{background:#6b7280}
.item{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin:7px 0}.item-title{font-weight:bold}
.viewbar{display:flex;justify-content:space-between;align-items:center}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin-top:10px}.files.list{display:block}
.file{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff}.list .file{display:flex;padding:7px;margin:6px 0}
.preview{height:115px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}.list .preview{width:55px;height:55px;flex:none;border-radius:6px}
.file-info{padding:8px}.list .file-info{padding:0 8px;flex:1}.file-name{font-weight:bold;font-size:12px;word-break:break-word}
.file button{padding:6px 8px;font-size:11px}.icon{font-size:30px}
.progress{height:4px;background:#ddd;margin-top:7px}.progress i{display:block;height:100%;width:0;background:#111}
@media(max-width:500px){.files{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<b>🔐 Personal Vault</b>
<div>
<button id="lock" class="hidden" onclick="lock()">Lock</button>
<button id="logout" class="hidden" onclick="logout()">Logout</button>
</div>
</header>

<main>

<section id="login" class="card">
<h2>🔐 Login</h2>
<input id="user" placeholder="Username" autocomplete="username">
<input id="pass" type="password" placeholder="Login Password">
<button onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="master" class="card hidden">
<h2>🔑 Master Password</h2>
<div class="small">Used only in this browser.</div>
<input id="masterPass" type="password" placeholder="Master Password">
<button onclick="unlock()">Unlock</button>
<div id="masterMsg" class="msg"></div>
</section>

<section id="app" class="hidden">

<div class="card">
<h2>🔐 Vault</h2>
<div class="stats">
<div class="stat"><b id="itemCount">0</b>Items</div>
<div class="stat"><b id="catCount">0</b>Categories</div>
<div class="stat"><b id="fileCount">0</b>Files</div>
</div>
</div>

<div class="card">
<h3>➕ Add Item</h3>
<select id="category"></select>
<input id="title" placeholder="Title">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<textarea id="backup" placeholder="Backup Codes"></textarea>
<textarea id="notes" placeholder="Notes"></textarea>
<button onclick="addItem()">Save</button>
<div id="itemMsg" class="msg"></div>
</div>

<div class="card">
<h3>📁 Categories</h3>
<input id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add</button>
<div id="categories"></div>
</div>

<div class="card">
<h3>🔐 Vault Items</h3>
<div id="items"></div>
</div>

<div class="card">
<div class="viewbar">
<h3>🖼️ Files</h3>
<div>
<button id="gridBtn" onclick="fileView('grid')">▦</button>
<button id="listBtn" onclick="fileView('list')">☷</button>
</div>
</div>
<div class="small">Encrypted in browser • Maximum 60 MB</div>
<input id="fileInput" type="file" onchange="uploadFile()">
<div id="uploadProgress" class="progress hidden"><i id="uploadBar"></i></div>
<div id="fileMsg" class="msg"></div>
<div id="files" class="files"></div>
</div>

</section>
</main>

<script>
const API="https://personal.createlk.workers.dev",DBN="personal-vault-key";
let key=null,meta=null,files=[],$=id=>document.getElementById(id);

async function api(p,o={}){
 o.credentials="include";o.headers={...(o.headers||{})};
 let r=await fetch(API+p,o),d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed.");return d
}
const text=t=>new TextEncoder().encode(t||"");
function b64(a){let s="";for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}
function ub64(s){let x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function msg(id,x){$(id).textContent=x||""}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function derive(p,s){
 let b=await crypto.subtle.importKey("raw",text(p),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])
}
async function enc(t){
 let iv=crypto.getRandomValues(new Uint8Array(12)),d=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,text(t));
 return JSON.stringify({iv:b64(iv),data:b64(new Uint8Array(d))})
}
async function dec(v){
 if(!v)return"";let x=JSON.parse(v),d=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(x.iv)},key,ub64(x.data));
 return new TextDecoder().decode(d)
}
async function encFile(f){
 let iv=crypto.getRandomValues(new Uint8Array(12)),d=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,await f.arrayBuffer())),o=new Uint8Array(12+d.length);
 o.set(iv);o.set(d,12);return o
}
async function decFile(d){return crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12))}

/* KEY STORAGE */
function odb(){
 return new Promise((res,rej)=>{
  let r=indexedDB.open(DBN,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("k");
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)
 })
}
async function saveKey(k){
 let db=await odb(),raw=await crypto.subtle.exportKey("raw",k);
 return new Promise((res,rej)=>{
  let t=db.transaction("k","readwrite");t.objectStore("k").put(b64(new Uint8Array(raw)),"key");
  t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)
 })
}
async function getKey(){
 try{
  let db=await odb();
  return new Promise(res=>{
   let q=db.transaction("k").objectStore("k").get("key");
   q.onsuccess=async()=>{
    db.close();if(!q.result)return res(null);
    try{res(await crypto.subtle.importKey("raw",ub64(q.result),{name:"AES-GCM"},true,["encrypt","decrypt"]))}
    catch{res(null)}
   };q.onerror=()=>{db.close();res(null)}
  })
 }catch{return null}
}
async function clearKey(){
 try{let db=await odb();db.transaction("k","readwrite").objectStore("k").delete("key")}catch{}
}

/* LOGIN */
async function loginStatus(){
 try{
  let s=await api("/api/login/status");if(!s.logged_in)return;
  $("login").classList.add("hidden");$("logout").classList.remove("hidden");
  await loadMeta();let k=await getKey();
  if(k){
   try{
    key=k;if(await dec(meta.verifier)==="VAULT-CHECK"){
     $("master").classList.add("hidden");$("app").classList.remove("hidden");$("lock").classList.remove("hidden");
     return loadAll()
    }
   }catch{}
   key=null;await clearKey()
  }
  $("master").classList.remove("hidden")
 }catch{}
}

async function login(){
 msg("loginMsg","");
 let u=$("user").value.trim(),p=$("pass").value;
 if(!u||!p)return msg("loginMsg","Enter username and password.");
 try{
  let r=await fetch(API+"/api/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}),d={};
  try{d=await r.json()}catch{}
  if(!r.ok)throw Error(d.error||"Login failed.");
  let s=await fetch(API+"/api/login/status",{credentials:"include"}).then(r=>r.json());
  if(!s.logged_in)throw Error("Session cookie was not accepted.");
  $("pass").value="";$("login").classList.add("hidden");$("master").classList.remove("hidden");$("logout").classList.remove("hidden");
  await loadMeta()
 }catch(e){msg("loginMsg",e.message)}
}

async function loadMeta(){meta=await api("/api/vault/meta")}

async function unlock(){
 let p=$("masterPass").value;msg("masterMsg","");
 if(!p)return msg("masterMsg","Enter Master Password.");
 try{
  if(!meta.initialized){
   let salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);
   let verifier=await enc("VAULT-CHECK");
   await api("/api/vault/meta",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({salt:b64(salt),verifier})});
   meta={initialized:true,salt:b64(salt),verifier}
  }else{
   key=await derive(p,ub64(meta.salt));
   if(await dec(meta.verifier)!=="VAULT-CHECK")throw Error("Incorrect master password.")
  }
  await saveKey(key);$("masterPass").value="";$("master").classList.add("hidden");$("app").classList.remove("hidden");$("lock").classList.remove("hidden");await loadAll()
 }catch(e){key=null;msg("masterMsg",e.message)}
}
async function lock(){
 key=null;await clearKey();$("app").classList.add("hidden");$("master").classList.remove("hidden");$("lock").classList.add("hidden")
}
async function logout(){
 key=null;await clearKey();try{await api("/api/logout",{method:"POST"})}catch{}location.reload()
}

/* CATEGORIES */
async function loadCategories(){
 let c=(await api("/api/categories")).categories||[];$("catCount").textContent=c.length;
 $("category").innerHTML=c.map(x=>`<option>${esc(x.name)}</option>`).join("")||"<option>General</option>";
 $("categories").innerHTML=c.map(x=>`<div class="small">📁 ${esc(x.name)}</div>`).join("")
}
async function addCategory(){
 let name=$("newCategory").value.trim();if(!name)return;
 try{await api("/api/categories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});$("newCategory").value="";loadCategories()}catch(e){alert(e.message)}
}

/* ITEMS */
async function loadItems(){
 let a=(await api("/api/items")).items||[];$("itemCount").textContent=a.length;
 if(!a.length)return $("items").innerHTML='<span class="small">No items yet.</span>';
 $("items").innerHTML="";
 for(let x of a){
  let u="",p="",b="",n="";try{u=await dec(x.username);p=await dec(x.encrypted_password);b=await dec(x.encrypted_backup_codes);n=await dec(x.encrypted_notes)}catch{}
  $("items").insertAdjacentHTML("beforeend",`
  <div class="item">
   <b>${esc(x.title)}</b><div class="small">📁 ${esc(x.category)}</div>
   <div class="actions"><button onclick="showSecret(this)">Show</button><button class="danger" onclick="deleteItem(${x.id})">Delete</button></div>
   <div class="secret hidden">
   <p><b>Username:</b><br>${esc(u)}</p>
   <p><b>Password:</b><br>${esc(p)}</p>
   <p><b>Backup:</b><br>${esc(b).replace(/\n/g,"<br>")}</p>
   <p><b>Notes:</b><br>${esc(n).replace(/\n/g,"<br>")}</p>
   </div>
  </div>`)
 }
}
function showSecret(b){let s=b.parentNode.nextElementSibling;s.classList.toggle("hidden");b.textContent=s.classList.contains("hidden")?"Show":"Hide"}
async function addItem(){
 let title=$("title").value.trim();if(!title)return msg("itemMsg","Enter a title.");
 try{
  await api("/api/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   category:$("category").value||"General",title,
   username:await enc($("username").value),encrypted_password:await enc($("password").value),
   encrypted_backup_codes:await enc($("backup").value),encrypted_notes:await enc($("notes").value)
  })});
  ["title","username","password","backup","notes"].forEach(x=>$(x).value="");msg("itemMsg","Saved.");loadItems()
 }catch(e){msg("itemMsg",e.message)}
}
async function deleteItem(id){
 if(!confirm("Delete this item?"))return;
 try{await api("/api/items/"+id,{method:"DELETE"});loadItems()}catch(e){alert(e.message)}
}

/* FILES */
async function uploadFile(){
 let f=$("fileInput").files[0];if(!f)return;
 if(f.size>60*1024*1024)return msg("fileMsg","Maximum 60 MB.");
 $("uploadProgress").classList.remove("hidden");
 try{
  $("uploadBar").style.width="40%";let data=await encFile(f);
  $("uploadBar").style.width="70%";
  let r=await fetch(API+"/api/photos",{method:"POST",credentials:"include",headers:{
   "Content-Type":"application/octet-stream","X-Filename":encodeURIComponent(f.name),"X-File-Type":f.type||"application/octet-stream"
  },body:data}),d={};try{d=await r.json()}catch{}
  if(!r.ok)throw Error(d.error||"Upload failed.");
  $("uploadBar").style.width="100%";$("fileInput").value="";msg("fileMsg","Uploaded.");loadFiles()
 }catch(e){msg("fileMsg",e.message)}
 setTimeout(()=>{$("uploadProgress").classList.add("hidden");$("uploadBar").style.width=0},500)
}

async function getFile(id){
 let r=await fetch(API+"/api/photos/"+id+"/download",{credentials:"include"});
 if(!r.ok)throw Error("File unavailable.");
 return new Uint8Array(await r.arrayBuffer())
}
async function fileURL(f){
 return URL.createObjectURL(new Blob([await decFile(await getFile(f.id))],{type:f.file_type||"application/octet-stream"}))
}

function fileView(m){
 $("files").classList.toggle("list",m==="list");
 $("gridBtn").classList.toggle("gray",m==="list");
 $("listBtn").classList.toggle("gray",m==="grid");
 localStorage.setItem("fv",m)
}

async function viewFile(id){
 try{
  let f=files.find(x=>x.id==id),u=await fileURL(f),w=window.open("","_blank");
  if(!w)return location.href=u;
  w.document.write(
   f.file_type?.startsWith("image/")
   ?`<body style="margin:0;background:#111;text-align:center"><img src="${u}" style="max-width:100%;max-height:100vh"></body>`
   :f.file_type?.startsWith("video/")
   ?`<body style="margin:0;background:#111"><video src="${u}" controls autoplay style="width:100%;height:100vh"></video></body>`
   :`<body><a href="${u}" download="${esc(f.filename)}">Download ${esc(f.filename)}</a></body>`
  )
 }catch(e){alert(e.message)}
}

async function preview(f,p){
 try{
  let u=await fileURL(f);
  if(f.file_type?.startsWith("image/"))p.innerHTML=`<img src="${u}">`;
  else if(f.file_type?.startsWith("video/"))p.innerHTML=`<video src="${u}" muted playsinline preload="metadata"></video>`;
 }catch{}
}

async function loadFiles(){
 try{
  files=(await api("/api/photos")).files||[];$("fileCount").textContent=files.length;
  if(!files.length)return $("files").innerHTML='<span class="small">No files yet.</span>';
  $("files").innerHTML="";
  files.forEach(f=>{
   let p=document.createElement("div");p.className="preview";p.innerHTML='<span class="icon">📄</span>';
   let c=document.createElement("div");c.className="file";
   c.append(p);
   c.insertAdjacentHTML("beforeend",`
    <div class="file-info"><div class="file-name">${esc(f.filename)}</div>
    <div class="small">${size(f.file_size)}</div>
    <div class="actions">
    <button onclick="viewFile(${f.id})">View</button>
    <button onclick="downloadFile(${f.id})">↓</button>
    <button class="danger" onclick="deleteFile(${f.id})">×</button>
    </div></div>`);
   $("files").append(c);
   if(f.file_type?.startsWith("image/")||f.file_type?.startsWith("video/"))preview(f,p)
  })
 }catch(e){$("files").innerHTML=`<span class="msg">${esc(e.message)}</span>`}
}

/* DOWNLOAD */
async function downloadFile(id){
 try{
  let f=files.find(x=>x.id==id),u=await fileURL(f),a=document.createElement("a");
  a.href=u;a.download=f.filename;a.style.display="none";document.body.append(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},3000);msg("fileMsg","Download started.")
 }catch(e){msg("fileMsg","Download failed: "+e.message)}
}
async function deleteFile(id){
 if(!confirm("Delete this file?"))return;
 try{await api("/api/photos/"+id,{method:"DELETE"});loadFiles()}catch(e){alert(e.message)}
}
function size(n){n=+n||0;return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}

fileView(localStorage.getItem("fv")||"grid");
async function loadAll(){await loadCategories();await loadItems();await loadFiles()}
loginStatus();
</script>
</body>
</html>
