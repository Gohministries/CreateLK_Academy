<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Vault</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#111827,#263b70);color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.8}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #0000000d}
h2{font-size:18px;margin:0 0 14px}
input,select,textarea,button{width:100%;padding:12px;border:1px solid #d7deea;border-radius:10px;font:inherit}
textarea{min-height:90px;resize:vertical}
button{border:0;background:#263b70;color:#fff;font-weight:700;cursor:pointer;margin-top:9px}
button.secondary{background:#e9edf5;color:#172033}
button.danger{background:#c62828}
button:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item,.file{border:1px solid #e1e6ef;border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row button{width:auto;margin:0;padding:8px 12px}
.small{font-size:13px;color:#687386}
.status{padding:10px;border-radius:10px;margin-top:10px;font-size:14px}
.ok{background:#e8f7ed;color:#16713a}.error{background:#fdecec;color:#a11}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f1f4fa;padding:14px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:22px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>

<body>
<header>
<h1>🔐 Personal Vault</h1>
<p>Private encrypted storage</p>
</header>

<main>

<div id="loading" class="card">Loading...</div>

<section id="login" class="card hidden">
<h2>🔑 Login</h2>
<input id="pass" type="password" placeholder="Account password">
<button id="loginBtn">Login</button>
<div id="loginMsg"></div>
</section>

<section id="master" class="card hidden">
<h2>🔐 Master Password</h2>
<input id="masterPass" type="password" placeholder="Master password">
<button id="unlockBtn">Unlock Vault</button>
<div id="masterMsg"></div>
</section>

<section id="app" class="hidden">

<div class="card">
<div class="row">
<h2>Vault</h2>
<button id="lockBtn" class="secondary">🔒 Lock</button>
</div>

<div class="stats">
<div class="stat"><b id="itemCount">0</b>Items</div>
<div class="stat"><b id="fileCount">0</b>Files</div>
<div class="stat"><b id="catCount">0</b>Categories</div>
</div>
</div>

<div class="card">
<h2>➕ Add Secure Item</h2>

<div class="grid">
<input id="category" placeholder="Category">
<input id="title" placeholder="Title">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
</div>

<textarea id="codes" placeholder="Backup codes"></textarea>
<textarea id="notes" placeholder="Notes"></textarea>

<button id="addBtn">Save Item</button>
<div id="addMsg"></div>
</div>

<div class="card">
<h2>📋 Vault Items</h2>
<div id="items"></div>
</div>

<div class="card">
<h2>📁 Encrypted Files</h2>
<input id="fileInput" type="file">
<button id="uploadBtn">🔒 Encrypt & Upload</button>
<div id="fileMsg"></div>
<div id="files"></div>
</div>

<div class="card">
<h2>☁️ Google Drive Backup</h2>
<p class="small">
Your backup contains encrypted vault data. Your master password is never uploaded.
</p>

<button id="driveLogin">☁️ Connect Google Drive</button>
<button id="saveDrive" class="hidden">☁️ Save Backup</button>

<div id="driveStatus" class="status"></div>
<div id="driveMsg"></div>
</div>

</section>
</main>

<script>
const API="https://personal.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-e15mcm3vfl5ni38smv7h96cob9tng6p3.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file";
const DB="personal-vault-key";

const $=id=>document.getElementById(id);
let key=null,meta=null,googleClient=null,googleToken=null,driveFolderId=null;

function msg(id,text,type=""){ 
  $(id).innerHTML=text?`<div class="status ${type}">${text}</div>`:"";
}

function b64(a){
  let s="";
  for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));
  return btoa(s);
}

function ub64(s){
  let x=atob(s),a=new Uint8Array(x.length);
  for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
  return a;
}

async function derive(password,salt){
  let e=new TextEncoder();
  let base=await crypto.subtle.importKey("raw",e.encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]
  );
}

async function enc(text){
  let iv=crypto.getRandomValues(new Uint8Array(12));
  let data=await crypto.subtle.encrypt(
    {name:"AES-GCM",iv},key,new TextEncoder().encode(text)
  );
  let out=new Uint8Array(12+data.byteLength);
  out.set(iv);out.set(new Uint8Array(data),12);
  return b64(out);
}

async function dec(value){
  let a=ub64(value);
  let data=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)
  );
  return new TextDecoder().decode(data);
}

function db(){
  return new Promise((resolve,reject)=>{
    let r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore("k");
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

async function saveKey(k){
  let d=await db(),t=d.transaction("k","readwrite");
  t.objectStore("k").put(await crypto.subtle.exportKey("raw",k),"key");
}

async function loadKey(){
  try{
    let d=await db(),t=d.transaction("k","readonly");
    return new Promise(resolve=>{
      let r=t.objectStore("k").get("key");
      r.onsuccess=async()=>{
        if(!r.result)return resolve(null);
        resolve(crypto.subtle.importKey("raw",r.result,{name:"AES-GCM"},false,["encrypt","decrypt"]));
      };
      r.onerror=()=>resolve(null);
    });
  }catch{return null}
}

async function clearKey(){
  let d=await db(),t=d.transaction("k","readwrite");
  t.objectStore("k").delete("key");
  key=null;
}

async function api(path,opt={}){
  opt.credentials="include";
  opt.headers={...(opt.headers||{})};
  let r=await fetch(API+path,opt);

  if(r.status===401){
    await clearKey();
    showLogin();
    throw Error("Session expired. Please login again.");
  }

  let text=await r.text(),data={};
  try{data=JSON.parse(text)}catch{}

  if(!r.ok)throw Error(data.error||text||"Request failed");
  return data;
}

function showLogin(){
  $("loading").classList.add("hidden");
  $("app").classList.add("hidden");
  $("master").classList.add("hidden");
  $("login").classList.remove("hidden");
}

async function start(){
  try{
    let s=await api("/api/login/status");
    if(!s.logged_in){showLogin();return}

    $("loading").classList.add("hidden");

    meta=await api("/api/vault/meta");
    let k=await loadKey();

    if(k){
      try{
        key=k;
        await dec(meta.verifier);
        openApp();
        return;
      }catch{
        await clearKey();
      }
    }

    $("master").classList.remove("hidden");
  }catch(e){
    $("loading").textContent=e.message;
  }
}

$("loginBtn").onclick=async()=>{
  try{
    let password=$("pass").value;
    if(!password)return msg("loginMsg","Enter your password.","error");

    await api("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password})
    });

    $("pass").value="";
    $("login").classList.add("hidden");
    meta=await api("/api/vault/meta");
    $("master").classList.remove("hidden");
    msg("loginMsg","");
  }catch(e){msg("loginMsg",e.message,"error")}
};

$("unlockBtn").onclick=async()=>{
  try{
    let p=$("masterPass").value;
    if(!p)return msg("masterMsg","Enter a master password.","error");

    let salt,verifier;

    if(!meta.initialized){
      salt=crypto.getRandomValues(new Uint8Array(16));
      key=await derive(p,salt);
      verifier=await enc("VAULT-CHECK");

      await api("/api/vault/meta",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({salt:b64(salt),verifier})
      });

      await saveKey(key);
    }else{
      salt=ub64(meta.salt);
      key=await derive(p,salt);

      if(await dec(meta.verifier)!=="VAULT-CHECK")
        throw Error("Wrong master password.");

      await saveKey(key);
    }

    $("masterPass").value="";
    openApp();
  }catch(e){
    msg("masterMsg",e.message,"error");
  }
};

async function openApp(){
  $("master").classList.add("hidden");
  $("app").classList.remove("hidden");
  await refresh();
}

async function refresh(){
  try{
    let [items,cats,files]=await Promise.all([
      api("/api/items"),api("/api/categories"),api("/api/photos")
    ]);

    let il=items.items||[],cl=cats.categories||[],fl=files.files||[];

    $("itemCount").textContent=il.length;
    $("catCount").textContent=cl.length;
    $("fileCount").textContent=fl.length;

    $("items").innerHTML=il.length?il.map(x=>`
      <div class="item">
        <div class="row">
          <b>${esc(x.title)}</b>
          <button class="secondary" onclick="showItem('${x.id}')">Show</button>
        </div>
        <div class="small">${esc(x.category||"General")}</div>
      </div>`).join(""):"<p class=small>No items yet.</p>";

    $("files").innerHTML=fl.length?fl.map(x=>`
      <div class="file">
        <div class="row">
          <div><b>${esc(x.filename)}</b><div class=small>${x.file_size||0} bytes</div></div>
          <button class="secondary" onclick="viewFile('${x.id}','${esc(x.filename)}')">View</button>
        </div>
      </div>`).join(""):"<p class=small>No files yet.</p>";
  }catch(e){console.error(e)}
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

window.showItem=async id=>{
  try{
    let r=await api("/api/items");
    let x=(r.items||[]).find(i=>i.id===id);
    if(!x)return;

    let username=x.username?await dec(x.username):"";
    let password=x.encrypted_password?await dec(x.encrypted_password):"";
    let codes=x.encrypted_backup_codes?await dec(x.encrypted_backup_codes):"";
    let notes=x.encrypted_notes?await dec(x.encrypted_notes):"";

    alert(
      "Title: "+(x.title||"")+
      "\nCategory: "+(x.category||"")+
      "\nUsername: "+username+
      "\nPassword: "+password+
      "\nBackup Codes: "+codes+
      "\nNotes: "+notes
    );
  }catch(e){alert(e.message)}
};

$("addBtn").onclick=async()=>{
  try{
    let title=$("title").value.trim();
    if(!title)return msg("addMsg","Title is required.","error");

    await api("/api/items",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        category:$("category").value.trim()||"General",
        title,
        username:await enc($("username").value),
        encrypted_password:await enc($("password").value),
        encrypted_backup_codes:await enc($("codes").value),
        encrypted_notes:await enc($("notes").value)
      })
    });

    ["category","title","username","password","codes","notes"]
      .forEach(x=>$(x).value="");

    msg("addMsg","Item saved.","ok");
    await refresh();
  }catch(e){msg("addMsg",e.message,"error")}
};

$("uploadBtn").onclick=async()=>{
  try{
    let f=$("fileInput").files[0];
    if(!f)return msg("fileMsg","Select a file.","error");
    if(f.size>60*1024*1024)throw Error("Maximum file size is 60 MB.");

    msg("fileMsg","Encrypting...");

    let iv=crypto.getRandomValues(new Uint8Array(12));
    let data=new Uint8Array(await crypto.subtle.encrypt(
      {name:"AES-GCM",iv},key,await f.arrayBuffer()
    ));

    let out=new Uint8Array(12+data.length);
    out.set(iv);out.set(data,12);

    await api("/api/photos",{
      method:"POST",
      headers:{
        "Content-Type":"application/octet-stream",
        "X-Filename":encodeURIComponent(f.name),
        "X-File-Type":f.type||"application/octet-stream"
      },
      body:out
    });

    $("fileInput").value="";
    msg("fileMsg","Encrypted file uploaded.","ok");
    await refresh();
  }catch(e){msg("fileMsg",e.message,"error")}
};

window.viewFile=async(id,name)=>{
  try{
    let r=await fetch(API+"/api/photos/"+id+"/download",{
      credentials:"include",cache:"no-store"
    });
    if(!r.ok)throw Error("Download failed.");

    let a=new Uint8Array(await r.arrayBuffer());
    let data=await crypto.subtle.decrypt(
      {name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)
    );

    let blob=new Blob([data]);
    let u=URL.createObjectURL(blob);
    let a1=document.createElement("a");
    a1.href=u;a1.download=name;a1.click();
    setTimeout(()=>URL.revokeObjectURL(u),3000);
  }catch(e){alert(e.message)}
};

$("lockBtn").onclick=async()=>{
  await clearKey();
  location.reload();
};

/* GOOGLE DRIVE */

function initGoogle(){
  if(!window.google?.accounts?.oauth2){
    setTimeout(initGoogle,500);
    return;
  }

  googleClient=window.google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:DRIVE_SCOPE,
    callback:()=>{}
  });
}

initGoogle();

$("driveLogin").onclick=()=>{
  if(!googleClient)return msg("driveMsg","Google is loading...","error");

  googleClient.callback=r=>{
    if(r.error){
      msg("driveMsg","Google Drive connection failed.","error");
      return;
    }

    googleToken=r.access_token;
    driveFolderId=null;

    $("driveLogin").classList.add("hidden");
    $("saveDrive").classList.remove("hidden");

    $("driveStatus").textContent="✓ Google Drive connected";
    $("driveStatus").className="status ok";
    msg("driveMsg","Ready to save backup.","ok");
  };

  googleClient.requestAccessToken({prompt:"consent"});
};

async function driveAPI(url,opt={}){
  if(!googleToken)throw Error("Connect Google Drive first.");

  opt.headers={
    ...(opt.headers||{}),
    Authorization:"Bearer "+googleToken
  };

  let r=await fetch(url,opt);

  if(r.status===401){
    googleToken=null;
    driveFolderId=null;
    $("driveLogin").classList.remove("hidden");
    $("saveDrive").classList.add("hidden");
    throw Error("Please reconnect Google Drive.");
  }

  let d={};
  try{d=await r.json()}catch{}

  if(!r.ok)throw Error(d.error?.message||"Google Drive error");
  return d;
}

async function getFolder(){
  if(driveFolderId)return driveFolderId;

  let q=encodeURIComponent(
    "name='Personal Vault Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false"
  );

  let r=await driveAPI(
    "https://www.googleapis.com/drive/v3/files?q="+q+
    "&fields=files(id,name)"
  );

  if(r.files?.length)return driveFolderId=r.files[0].id;

  let x=await driveAPI(
    "https://www.googleapis.com/drive/v3/files",
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:"Personal Vault Backups",
        mimeType:"application/vnd.google-apps.folder"
      })
    }
  );

  return driveFolderId=x.id;
}

async function makeBackup(){
  let categories=(await api("/api/categories")).categories||[];
  let items=(await api("/api/items")).items||[];
  let photos=(await api("/api/photos")).files||[];
  let files=[];

  for(let f of photos){
    try{
      let r=await fetch(
        API+"/api/photos/"+f.id+"/download",
        {credentials:"include",cache:"no-store"}
      );

      if(r.ok){
        files.push({
          id:f.id,
          filename:f.filename,
          file_type:f.file_type,
          file_size:f.file_size,
          created_at:f.created_at,
          encrypted_data:b64(new Uint8Array(await r.arrayBuffer()))
        });
      }
    }catch(e){console.error(e)}
  }

  return {
    backup_type:"Personal Vault Backup",
    backup_version:1,
    created_at:new Date().toISOString(),
    categories,
    items,
    files
  };
}

$("saveDrive").onclick=async()=>{
  let b=$("saveDrive");

  try{
    b.disabled=true;
    b.textContent="⏳ Saving...";
    msg("driveMsg","Creating encrypted backup...");

    let backup=await makeBackup();
    let parent=await getFolder();
    let boundary="Vault"+Date.now();

    let metadata={
      name:"Personal-Vault-"+Date.now()+".json",
      parents:[parent],
      mimeType:"application/json"
    };

    let body=
      "--"+boundary+"\r\n"+
      "Content-Type: application/json\r\n\r\n"+
      JSON.stringify(metadata)+"\r\n"+
      "--"+boundary+"\r\n"+
      "Content-Type: application/json\r\n\r\n"+
      JSON.stringify(backup)+"\r\n"+
      "--"+boundary+"--";

    await driveAPI(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {
        method:"POST",
        headers:{
          "Content-Type":"multipart/related; boundary="+boundary
        },
        body
      }
    );

    b.textContent="✓ Saved";
    b.disabled=false;

    $("driveStatus").textContent="✓ Backup saved to Google Drive";
    $("driveStatus").className="status ok";
    msg("driveMsg","Saved in Personal Vault Backups.","ok");

  }catch(e){
    b.disabled=false;
    b.textContent="☁️ Save Backup";
    $("driveStatus").textContent="Backup failed";
    $("driveStatus").className="status error";
    msg("driveMsg",e.message,"error");
  }
};

start();
</script>
</body>
</html>
