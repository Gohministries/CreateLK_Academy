<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111827"
>

<title>Personal Vault</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    linear-gradient(
      180deg,
      #f8faff,
      #eef3ff
    );
  color:#172033;
}

header{
  background:
    linear-gradient(
      135deg,
      #111827,
      #1e293b
    );
  color:white;
  padding:22px 18px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
}

h1{
  margin:0;
  font-size:24px;
}

.subtitle{
  margin-top:5px;
  color:#cbd5e1;
  font-size:13px;
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px;
}


/* LOGIN */

.login{
  max-width:400px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 40px #0001;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin-top:8px;
  outline:none;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
  font-size:13px;
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}


/* BUTTON */

.primary{
  background:#111827;
  color:white;
}

.btn{
  padding:11px 15px;
  border-radius:11px;
  font-weight:bold;
}

.btn:active{
  transform:scale(.98);
}


/* DRIVE */

.drive{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 25px #00000008;
}

.drive-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.drive h2{
  margin:0;
  font-size:18px;
}

.drive-status{
  margin-top:6px;
  color:#6b7280;
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}


/* UPLOAD */

.upload{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  border:1px solid #e5e7eb;
}

.file-input{
  margin-bottom:10px;
}


/* FILES */

.files{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.file{
  background:white;
  border-radius:18px;
  padding:16px;
  border:1px solid #e5e7eb;
  box-shadow:0 5px 20px #00000008;
}

.file-icon{
  font-size:35px;
}

.file-name{
  margin-top:10px;
  font-weight:bold;
  word-break:break-word;
}

.file-info{
  margin-top:5px;
  color:#6b7280;
  font-size:12px;
}

.file-buttons{
  display:flex;
  gap:6px;
  margin-top:13px;
  flex-wrap:wrap;
}

.small{
  padding:8px 10px;
  border-radius:9px;
  background:#eef2f7;
  font-size:12px;
  font-weight:bold;
}

.drive-small{
  background:#111827;
  color:white;
}

.logout{
  float:right;
  background:#374151;
  color:white;
  padding:8px 12px;
  border-radius:9px;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.message{
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:#f3f4f6;
  font-size:13px;
}

@media(max-width:600px){

  .drive-top{
    display:block;
  }

  .files{
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<button
  class="logout"
  onclick="logout()">
  Logout
</button>

<h1>🔐 Personal Vault</h1>

<div class="subtitle">
  Secure encrypted storage
</div>

</div>

</header>


<main>


<!-- LOGIN -->

<div
  id="loginBox"
  class="login">

<h2>🔐 Unlock Vault</h2>

<label>
Username
</label>

<input
  id="username"
  autocomplete="username"
>

<label>
Password
</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<button
  class="btn primary"
  style="width:100%;margin-top:18px"
  onclick="login()">
  Unlock
</button>

<div
  id="loginMessage"
  class="message hidden">
</div>

</div>


<!-- APP -->

<div
  id="app"
  class="hidden">


<!-- GOOGLE DRIVE -->

<section class="drive">

<div class="drive-top">

<div>

<h2>☁️ Google Drive Backup</h2>

<div
  id="driveStatus"
  class="drive-status">
  Checking...
</div>

</div>

</div>


<div class="actions">

<button
  class="btn primary"
  onclick="connectGoogle()">
  🔗 Connect Google Drive
</button>

<button
  class="btn"
  style="background:#e5e7eb"
  onclick="backupAll()">
  ☁️ Backup All
</button>

<button
  class="btn"
  style="background:#e5e7eb"
  onclick="driveStatus()">
  🔄 Refresh
</button>

</div>

</section>


<!-- UPLOAD -->

<section class="upload">

<h3>Upload File</h3>

<input
  class="file-input"
  id="fileInput"
  type="file"
>

<select id="category">

<option>Other</option>
<option>Family</option>
<option>Church</option>
<option>Ministry</option>
<option>Personal</option>
<option>Documents</option>
<option>Travel</option>
<option>Memories</option>
<option>Backup</option>

</select>

<button
  class="btn primary"
  style="margin-top:10px"
  onclick="upload()">
  🔐 Encrypt & Upload
</button>

<div
  id="message"
  class="message hidden">
</div>

</section>


<!-- FILES -->

<h3>My Files</h3>

<div
  id="files"
  class="files"
  style="margin-top:12px">
</div>


</div>

</main>


<script>

const API =
  "https://personal.createlk.workers.dev";


let files = [];


/* ================= LOGIN ================= */

async function login(){

  const username =
    document.getElementById(
      "username"
    ).value;

  const password =
    document.getElementById(
      "password"
    ).value;

  const box =
    document.getElementById(
      "loginMessage"
    );


  try{

    const r =
      await fetch(
        API + "/api/login",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            username,
            password
          })
        }
      );


    const d =
      await r.json();


    if(!r.ok){
      throw new Error(
        d.error ||
        "Login failed."
      );
    }


    showApp();


  }catch(e){

    box.classList.remove(
      "hidden"
    );

    box.textContent =
      e.message;
  }
}


async function logout(){

  await fetch(
    API + "/api/logout",
    {
      method:"POST",
      credentials:"include"
    }
  );

  location.reload();
}


async function checkLogin(){

  try{

    const r =
      await fetch(
        API + "/api/login/status",
        {
          credentials:"include"
        }
      );

    const d =
      await r.json();


    if(d.authenticated){
      showApp();
    }

  }catch{}

}


function showApp(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  loadFiles();

  driveStatus();
}


/* ================= FILES ================= */

async function loadFiles(){

  const r =
    await fetch(
      API + "/api/photos",
      {
        credentials:"include"
      }
    );


  if(!r.ok) return;


  const d =
    await r.json();


  files =
    d.files || [];


  renderFiles();
}


function renderFiles(){

  const box =
    document.getElementById(
      "files"
    );


  if(!files.length){

    box.innerHTML =
      `<div class="message">
        No files yet.
      </div>`;

    return;
  }


  box.innerHTML =
    files.map(f=>{

      const backed =
        !!f.google_drive_file_id;


      return `
      <div class="file">

        <div class="file-icon">
          ${getIcon(f.file_type)}
        </div>

        <div class="file-name">
          ${escapeHtml(f.filename)}
        </div>

        <div class="file-info">
          ${escapeHtml(
            f.category || "Other"
          )}
          •
          ${formatSize(f.file_size)}
        </div>

        <div class="file-info">
          ${
            backed
              ? "☁️ Backed up"
              : "⏳ Backup pending"
          }
        </div>

        <div class="file-buttons">

          <button
            class="small"
            onclick="downloadFile(${f.id})">
            Download
          </button>

          ${
            backed
            ? `
            <button
              class="small drive-small"
              onclick="openDrive('${escapeAttr(
                f.google_drive_url
              )}')">
              ☁️ Drive
            </button>
            `
            :
            `
            <button
              class="small drive-small"
              onclick="backupFile(${f.id})">
              ☁️ Backup
            </button>
            `
          }

          <button
            class="small"
            onclick="deleteFile(${f.id})">
            Delete
          </button>

        </div>

      </div>
      `;

    }).join("");
}


function getIcon(type){

  if(!type) return "📄";

  if(type.startsWith("image/"))
    return "🖼️";

  if(type.startsWith("video/"))
    return "🎬";

  if(type.startsWith("audio/"))
    return "🎵";

  if(type.includes("pdf"))
    return "📕";

  return "📄";
}


function formatSize(size){

  if(!size) return "0 B";

  const units=[
    "B","KB","MB","GB"
  ];

  let i=0;
  let n=size;

  while(
    n>=1024 &&
    i<units.length-1
  ){
    n/=1024;
    i++;
  }

  return n.toFixed(
    i ? 1 : 0
  )+" "+units[i];
}


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return String(value || "")
    .replace(/'/g,"\\'");
}


/* ================= UPLOAD ================= */

async function upload(){

  const input =
    document.getElementById(
      "fileInput"
    );

  const file =
    input.files[0];

  if(!file){

    alert(
      "Please select a file."
    );

    return;
  }


  if(
    file.size >
    60 * 1024 * 1024
  ){

    alert(
      "Maximum file size is 60 MB."
    );

    return;
  }


  const message =
    document.getElementById(
      "message"
    );

  message.classList.remove(
    "hidden"
  );

  message.textContent =
    "Encrypting and uploading...";


  try{

    /*
      Simple AES-GCM encryption.

      For production use, replace this
      with your existing Personal Vault
      encryption/key management code.
    */

    const raw =
      await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(
          "personal-vault-key"
        )
      );


    const key =
      await crypto.subtle.importKey(
        "raw",
        raw,
        "AES-GCM",
        false,
        ["encrypt"]
      );


    const data =
      await file.arrayBuffer();


    const iv =
      crypto.getRandomValues(
        new Uint8Array(12)
      );


    const encrypted =
      await crypto.subtle.encrypt(
        {
          name:"AES-GCM",
          iv
        },
        key,
        data
      );


    /*
      Store IV before encrypted data.
    */

    const output =
      new Uint8Array(
        iv.byteLength +
        encrypted.byteLength
      );


    output.set(iv,0);

    output.set(
      new Uint8Array(encrypted),
      iv.byteLength
    );


    const category =
      document.getElementById(
        "category"
      ).value;


    const r =
      await fetch(
        API + "/api/photos",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/octet-stream",
            "X-Filename":
              encodeURIComponent(
                file.name
              ),
            "X-File-Type":
              file.type ||
              "application/octet-stream",
            "X-Category":
              encodeURIComponent(
                category
              )
          },
          body:output
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        "Upload failed."
      );
    }


    message.textContent =
      "✓ Saved securely. " +
      "Starting Google Drive backup...";


    /*
      Automatically attempt Drive backup.
    */

    try{

      const backup =
        await fetch(
          API +
          "/api/google/backup/" +
          d.id,
          {
            method:"POST",
            credentials:"include"
          }
        );


      const bd =
        await backup.json();


      if(
        backup.ok &&
        bd.success
      ){

        message.textContent =
          bd.duplicate
            ? "✓ Saved • Already backed up"
            : "✓ Saved • ☁️ Backed up";

      }else{

        message.textContent =
          "✓ Saved • ⏳ Drive backup pending";

      }

    }catch{

      message.textContent =
        "✓ Saved • ⏳ Drive backup pending";
    }


    input.value = "";

    await loadFiles();

    await driveStatus();


  }catch(e){

    message.textContent =
      "Error: " + e.message;
  }
}


/* ================= DOWNLOAD ================= */

async function downloadFile(id){

  const r =
    await fetch(
      API +
      "/api/photos/" +
      id +
      "/download",
      {
        credentials:"include"
      }
    );


  if(!r.ok){

    alert(
      "Download failed."
    );

    return;
  }


  const blob =
    await r.blob();


  const file =
    files.find(
      x=>x.id===id
    );


  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    file?.filename ||
    "encrypted-file";

  a.click();

  URL.revokeObjectURL(
    a.href
  );
}


/* ================= DELETE ================= */

async function deleteFile(id){

  if(!confirm(
    "Delete this file?"
  )){
    return;
  }


  const r =
    await fetch(
      API +
      "/api/photos/" +
      id,
      {
        method:"DELETE",
        credentials:"include"
      }
    );


  if(r.ok){
    await loadFiles();
    await driveStatus();
  }
}


/* ================= GOOGLE ================= */

function connectGoogle(){

  window.location.href =
    API +
    "/api/google/connect";
}


async function driveStatus(){

  const box =
    document.getElementById(
      "driveStatus"
    );


  try{

    const r =
      await fetch(
        API +
        "/api/google/status",
        {
          credentials:"include"
        }
      );


    const d =
      await r.json();


    if(!d.connected){

      box.textContent =
        "Not connected";

      return;
    }


    box.textContent =
      `✓ Connected • ` +
      `${d.backedUp} backed up • ` +
      `${d.pending} pending`;

  }catch{

    box.textContent =
      "Unable to check Drive.";
  }
}


async function backupFile(id){

  try{

    const r =
      await fetch(
        API +
        "/api/google/backup/" +
        id,
        {
          method:"POST",
          credentials:"include"
        }
      );


    const d =
      await r.json();


    if(!r.ok ||
       !d.success){

      throw new Error(
        d.error ||
        "Backup failed."
      );
    }


    alert(
      d.duplicate
        ? "✓ Already backed up."
        : "☁️ Backup completed."
    );


    await loadFiles();

    await driveStatus();


  }catch(e){

    alert(
      "Backup failed:\n" +
      e.message
    );
  }
}


async function backupAll(){

  if(!confirm(
    "Backup all pending files?"
  )){
    return;
  }


  try{

    /*
      This example backs up files
      individually so one failure
      doesn't stop all backups.
    */

    const pending =
      files.filter(
        f=>!f.google_drive_file_id
      );


    let success=0;
    let failed=0;


    for(
      const file of pending
    ){

      try{

        const r =
          await fetch(
            API +
            "/api/google/backup/" +
            file.id,
            {
              method:"POST",
              credentials:"include"
            }
          );


        const d =
          await r.json();


        if(
          r.ok &&
          d.success
        ){
          success++;
        }else{
          failed++;
        }

      }catch{
        failed++;
      }
    }


    alert(
      "Google Drive backup finished.\n\n" +
      "✓ Successful: " +
      success +
      "\n" +
      "✕ Failed: " +
      failed
    );


    await loadFiles();

    await driveStatus();


  }catch(e){

    alert(
      "Backup failed:\n" +
      e.message
    );
  }
}


function openDrive(url){

  if(!url) return;

  window.open(
    url,
    "_blank",
    "noopener"
  );
}


/* START */

checkLogin();

</script>

</body>
</html>
