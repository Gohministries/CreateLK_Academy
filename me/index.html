<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827
}

button,input,select{font:inherit}

header{
background:linear-gradient(135deg,#111827,#1e3a8a);
color:#fff;
padding:18px
}

.head,.wrap{
max-width:1000px;
margin:auto
}

.head{
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:21px;
font-weight:800
}

.sub{
font-size:12px;
opacity:.8;
margin-top:3px
}

.wrap{
padding:18px
}

.card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:16px;
box-shadow:0 5px 20px #0001
}

.row,.status{
display:flex;
gap:10px;
align-items:center;
justify-content:space-between;
flex-wrap:wrap
}

.row input,.row select{
flex:1
}

h2{
font-size:18px;
margin:0 0 12px
}

input,select{
padding:11px;
border:1px solid #d1d5db;
border-radius:11px;
background:#fff
}

button{
border:0;
border-radius:11px;
padding:10px 14px;
font-weight:700;
cursor:pointer
}

.primary{
background:#2563eb;
color:#fff
}

.light{
background:#e5e7eb;
color:#111827
}

.danger{
background:#fee2e2;
color:#991b1b
}

.share{
background:#dcfce7;
color:#166534
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.badge{
display:inline-block;
background:#e5e7eb;
color:#374151;
padding:7px 12px;
border-radius:20px;
font-size:12px;
font-weight:700
}

.files{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:14px
}

.file{
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
background:#fff
}

.preview{
height:150px;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
cursor:pointer
}

.icon{
font-size:48px
}

.info{
padding:13px
}

.name{
font-weight:700;
word-break:break-word
}

.meta{
font-size:12px;
color:#6b7280;
margin:5px 0
}

.file-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:8px
}

.file-actions button{
padding:8px;
font-size:12px
}

.empty{
text-align:center;
padding:30px;
color:#6b7280
}

#msg{
margin-top:10px;
font-size:13px;
font-weight:700
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:10
}

.modalbox{
background:#fff;
width:min(900px,100%);
max-height:90vh;
overflow:auto;
border-radius:18px;
padding:15px
}

.modalhead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px
}

.modalbuttons{
display:flex;
gap:7px
}

#viewer{
display:block;
max-width:100%;
max-height:75vh;
margin:auto
}

pre{
white-space:pre-wrap;
word-break:break-word
}

.hidden{
display:none!important
}

@media(max-width:600px){
.row{
display:grid;
grid-template-columns:1fr
}

.files{
grid-template-columns:1fr
}

.head{
gap:10px
}
}
</style>
</head>

<body>

<header>
<div class="head">

<div>
<div class="logo">🔐 Personal Vault</div>
<div class="sub">Secure encrypted storage</div>
</div>

<button class="light" onclick="logout()">Logout</button>

</div>
</header>

<div class="wrap">

<div class="card">

<h2>Upload File</h2>

<div class="row">

<input id="fileInput" type="file">

<select id="category">
<option>General</option>
<option>Photos</option>
<option>Documents</option>
<option>Videos</option>
<option>Audio</option>
<option>Other</option>
</select>

</div>

<button
class="primary"
style="margin-top:10px"
onclick="uploadFile()">
🔐 Encrypt & Upload
</button>

<div id="msg"></div>

</div>


<div class="card">

<div class="status">

<h2>My Files</h2>

<div class="actions">

<button
class="light"
onclick="setView('grid')">
▦ Grid
</button>

<button
class="light"
onclick="setView('list')">
☷ List
</button>

<button
class="light"
onclick="loadFiles()">
🔄 Refresh
</button>

</div>

</div>

<div id="files" class="files"></div>

</div>

</div>


<div
id="modal"
class="modal hidden"
onclick="closeModal(event)">

<div class="modalbox">

<div class="modalhead">

<b id="modalTitle">Preview</b>

<div class="modalbuttons">

<button
class="danger"
onclick="hideModal()">
❌ Cancel
</button>

</div>

</div>

<div id="modalContent"></div>

</div>

</div>


<script>

const API="https://personal.createlk.workers.dev";

let files=[];
let viewMode="grid";
let keyCache=null;

const fileCache=new Map();


/* =========================
   ENCRYPTION
========================= */

async function getKey(){

if(keyCache)return keyCache;

const h=await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode("personal-vault-key")
);

keyCache=await crypto.subtle.importKey(
"raw",
h,
{name:"AES-GCM"},
false,
["encrypt","decrypt"]
);

return keyCache;
}


async function encryptData(buffer){

const key=await getKey();

const iv=crypto.getRandomValues(
new Uint8Array(12)
);

const encrypted=
await crypto.subtle.encrypt(
{
name:"AES-GCM",
iv
},
key,
buffer
);

const result=
new Uint8Array(
12+encrypted.byteLength
);

result.set(iv,0);

result.set(
new Uint8Array(encrypted),
12
);

return result;
}


async function decryptData(buffer){

const key=await getKey();

const data=new Uint8Array(buffer);

if(data.length<=12)
throw new Error("Invalid encrypted file");

return crypto.subtle.decrypt(
{
name:"AES-GCM",
iv:data.slice(0,12)
},
key,
data.slice(12)
);
}


/* =========================
   AUTH
========================= */

async function checkAuth(){

try{

const r=await fetch(
API+"/api/auth/status",
{
credentials:"include"
}
);

const d=await r.json();

if(d.authenticated===false){

location.href="/auth/login.html";

return false;
}

return true;

}catch(e){

location.href="/auth/login.html";

return false;
}

}


async function logout(){

try{

await fetch(
API+"/api/logout",
{
method:"POST",
credentials:"include"
}
);

}catch(e){}

location.href="/auth/login.html";
}


/* =========================
   FILE CACHE
========================= */

function clearFileCache(){

for(const item of fileCache.values()){

if(item.url){

URL.revokeObjectURL(item.url);

}

}

fileCache.clear();

}


async function getBlob(id){

if(fileCache.has(id))
return fileCache.get(id);

const f=files.find(
x=>Number(x.id)===Number(id)
);

if(!f)
throw new Error("File not found");

const data=await getFile(id);

const blob=new Blob(
[data],
{
type:f.file_type||
"application/octet-stream"
}
);

const url=URL.createObjectURL(blob);

const result={
blob,
url
};

fileCache.set(id,result);

return result;
}


/* =========================
   LOAD FILES
========================= */

async function loadFiles(){

const box=
document.getElementById("files");

box.innerHTML=
'<div class="empty">🔄 Loading files...</div>';

clearFileCache();

try{

const r=await fetch(
API+"/api/items",
{
credentials:"include"
}
);

if(r.status===401){

location.href="/auth/login.html";

return;
}

const d=await r.json();

if(!d.ok)
throw new Error(
d.error||"Unable to load files"
);

files=
Array.isArray(d.items)
?d.items
:[];

renderFiles();

}catch(e){

box.innerHTML=
'<div class="empty">❌ '+
esc(e.message)+
'</div>';

}

}


/* =========================
   RENDER
========================= */

function renderFiles(){

const box=
document.getElementById("files");

if(!files.length){

box.innerHTML=
'<div class="empty">No files yet.</div>';

return;
}

box.innerHTML=
files.map(card).join("");

files.forEach(f=>{

if(
(f.file_type||"")
.startsWith("image/")
){

loadThumbnail(
Number(f.id)
);

}

});

}


function card(f){

const id=Number(f.id);

const name=
esc(f.filename||"Unnamed file");

const type=f.file_type||"";

const size=
formatSize(f.file_size||0);

let icon="📄";

if(type.startsWith("image/"))
icon="🖼️";

else if(type.startsWith("video/"))
icon="🎬";

else if(type.startsWith("audio/"))
icon="🎵";

else if(type.includes("pdf"))
icon="📕";

return `

<div class="file">

<div
class="preview"
id="preview-${id}">

<div class="icon">
${icon}
</div>

</div>


<div class="info">

<div class="name">
${name}
</div>

<div class="meta">
${esc(f.category||"General")}
•
${size}
</div>


<div class="file-actions">

<button
class="light"
onclick="viewFile(${id})">
👁 View
</button>

<button
class="light"
onclick="downloadFile(${id})">
⬇ Download
</button>

<button
class="share"
onclick="shareFile(${id})">
📤 Share
</button>

<button
class="danger"
onclick="deleteFile(${id})">
🗑 Delete
</button>

</div>

</div>

</div>

`;

}


/* =========================
   THUMBNAIL
========================= */

async function loadThumbnail(id){

const f=files.find(
x=>Number(x.id)===id
);

if(!f)return;

if(
!(f.file_type||"")
.startsWith("image/")
)
return;

const box=
document.getElementById(
"preview-"+id
);

if(!box)return;

try{

const item=
await getBlob(id);

box.innerHTML=
`
<img
src="${item.url}"
alt="Thumbnail"
onclick="viewFile(${id})">
`;

}catch(e){

box.innerHTML=
'<div class="icon">🖼️</div>';

}

}


/* =========================
   UPLOAD
========================= */

async function uploadFile(){

const input=
document.getElementById("fileInput");

const msg=
document.getElementById("msg");

if(!input.files.length){

msg.textContent=
"Please select a file.";

msg.style.color="#b91c1c";

return;
}

const f=input.files[0];

try{

msg.textContent=
"🔐 Encrypting...";

msg.style.color="#2563eb";

const encrypted=
await encryptData(
await f.arrayBuffer()
);

msg.textContent=
"☁️ Uploading...";

const r=await fetch(
API+"/api/photos",
{
method:"POST",
credentials:"include",

headers:{
"Content-Type":
"application/octet-stream",

"X-Filename":
encodeURIComponent(f.name),

"X-File-Type":
encodeURIComponent(
f.type||
"application/octet-stream"
),

"X-Category":
encodeURIComponent(
document.getElementById(
"category"
).value
)
},

body:encrypted
}
);

if(r.status===401){

location.href="/auth/login.html";

return;
}

const d=await r.json();

if(!d.ok)
throw new Error(
d.error||"Upload failed"
);

input.value="";

msg.textContent=
"✅ Uploaded successfully.";

msg.style.color="#15803d";

await loadFiles();

}catch(e){

msg.textContent=
"❌ "+e.message;

msg.style.color="#b91c1c";

}

}


/* =========================
   GET / DECRYPT
========================= */

async function getFile(id){

const r=await fetch(
API+"/api/photos/"+id+"/download",
{
credentials:"include"
}
);

if(r.status===401){

location.href="/auth/login.html";

throw new Error(
"Session expired"
);

}

if(!r.ok)
throw new Error(
"Unable to retrieve file"
);

return decryptData(
await r.arrayBuffer()
);

}


/* =========================
   VIEW
========================= */

async function viewFile(id){

const f=files.find(
x=>Number(x.id)===id
);

if(!f)return;

showModal(
f.filename||"Preview",
'<div class="empty">🔐 Opening...</div>'
);

try{

const item=
await getBlob(id);

const type=
f.file_type||
"application/octet-stream";

const url=item.url;

if(type.startsWith("image/")){

showModal(
f.filename,
`
<img
id="viewer"
src="${url}"
alt="Preview">
`
);

}

else if(type.startsWith("video/")){

showModal(
f.filename,
`
<video
id="viewer"
controls
style="width:100%">
<source src="${url}">
</video>
`
);

}

else if(type.startsWith("audio/")){

showModal(
f.filename,
`
<audio
controls
style="width:100%">
<source src="${url}">
</audio>
`
);

}

else if(type==="application/pdf"){

showModal(
f.filename,
`
<iframe
src="${url}"
style="
width:100%;
height:70vh;
border:0
"></iframe>
`
);

}

else if(
type.startsWith("text/")||
type==="application/json"
){

const data=
await getFile(id);

showModal(
f.filename,
"<pre>"+
esc(
new TextDecoder().decode(data)
)+
"</pre>"
);

}

else{

showModal(
f.filename,
`
<div class="empty">

📄

<br><br>

This file cannot be previewed.

<br><br>

<button
class="primary"
onclick="downloadFile(${id})">
⬇ Download
</button>

</div>
`
);

}

}catch(e){

showModal(
f.filename||"File",
`
<div class="empty">
❌ Unable to open file.
</div>
`
);

}

}


/* =========================
   DOWNLOAD
========================= */

async function downloadFile(id){

const f=files.find(
x=>Number(x.id)===id
);

if(!f)return;

try{

const item=
await getBlob(id);

const a=
document.createElement("a");

a.href=item.url;

a.download=
f.filename||"download";

document.body.appendChild(a);

a.click();

a.remove();

}catch(e){

alert(
"❌ Unable to decrypt file."
);

}

}


/* =========================
   SHARE
========================= */

async function shareFile(id){

const f=files.find(
x=>Number(x.id)===id
);

if(!f)return;

try{

const item=
await getBlob(id);

const file=
new File(
[item.blob],
f.filename||"file",
{
type:
f.file_type||
"application/octet-stream"
}
);


/*
   Android / browser native
   share menu
*/

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
f.filename||"Personal Vault",

text:
"Shared from Personal Vault",

files:[file]

});

return;

}


/*
   Fallback
*/

const a=
document.createElement("a");

a.href=item.url;

a.download=
f.filename||"file";

document.body.appendChild(a);

a.click();

a.remove();

alert(
"📤 Your device does not support direct file sharing here. The file was downloaded. You can select Google Drive from your device's share/upload options."
);

}catch(e){

if(e.name==="AbortError")
return;

console.error(e);

alert(
"❌ Unable to share this file."
);

}

}


/* =========================
   DELETE
========================= */

async function deleteFile(id){

const f=files.find(
x=>Number(x.id)===id
);

if(!f)return;

if(!confirm(
"Delete this file?\n\n"+
(f.filename||"Unnamed file")
))
return;

try{

const r=await fetch(
API+"/api/photos/"+id,
{
method:"DELETE",
credentials:"include"
}
);

const d=await r.json();

if(!d.ok)
throw new Error(
d.error||"Delete failed"
);

await loadFiles();

}catch(e){

alert(
"❌ "+e.message
);

}

}


/* =========================
   MODAL
========================= */

function showModal(
title,
content
){

document.getElementById(
"modalTitle"
).textContent=title;

document.getElementById(
"modalContent"
).innerHTML=content;

document.getElementById(
"modal"
).classList.remove("hidden");

}


function hideModal(){

document.getElementById(
"modal"
).classList.add("hidden");

document.getElementById(
"modalContent"
).innerHTML="";

}


function closeModal(e){

if(e.target.id==="modal")
hideModal();

}


/* =========================
   VIEW MODE
========================= */

function setView(mode){

viewMode=mode;

const box=
document.getElementById("files");

if(mode==="list"){

box.style.gridTemplateColumns=
"1fr";

}else{

box.style.gridTemplateColumns=
"";

}

}


/* =========================
   HELPERS
========================= */

function formatSize(n){

if(!n)return"0 B";

const units=[
"B",
"KB",
"MB",
"GB"
];

let i=0;

while(
n>=1024 &&
i<3
){

n/=1024;
i++;

}

return(
n.toFixed(i?1:0)+
" "+
units[i]
);

}


function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


/* =========================
   START
========================= */

(async()=>{

if(await checkAuth()){

await loadFiles();

}

})();

</script>

</body>
</html>
