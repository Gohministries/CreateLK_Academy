<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:linear-gradient(180deg,#f8faff,#eef3ff);
 color:#172033
}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
header{
 background:linear-gradient(135deg,#111827,#1e293b);
 color:#fff;padding:18px
}
.head{max-width:1000px;margin:auto}
h1{margin:0;font-size:23px}
.sub{color:#cbd5e1;font-size:13px;margin-top:4px}
main{max-width:1000px;margin:auto;padding:18px}
.hidden{display:none!important}

.card{
 background:#fff;border:1px solid #e5e7eb;border-radius:17px;
 padding:16px;margin-bottom:16px;
 box-shadow:0 5px 20px #00000008
}
.login{max-width:400px;margin:60px auto}
label{
 display:block;font-size:13px;font-weight:bold;margin-top:13px
}
input,select{
 width:100%;padding:11px;margin-top:6px;
 border:1px solid #d1d5db;border-radius:10px;
 background:#fff
}
.btn{
 padding:10px 13px;border-radius:10px;
 font-weight:bold;background:#e5e7eb
}
.primary{background:#111827;color:white}
.logout{
 float:right;background:#374151;color:#fff;
 padding:7px 10px;border-radius:8px;font-size:12px
}
.message{
 background:#f3f4f6;padding:10px;border-radius:9px;
 font-size:13px;margin-top:10px
}
.actions,.buttons{
 display:flex;gap:7px;flex-wrap:wrap;margin-top:11px
}
.filehead{
 display:flex;align-items:center;
 justify-content:space-between;margin:18px 0 10px
}
.views{
 background:#e5e7eb;padding:3px;border-radius:9px
}
.views button{
 padding:6px 9px;background:transparent;border-radius:7px;
 font-size:12px
}
.views .active{background:white}

.files{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
 gap:12px
}
.files.list{display:flex;flex-direction:column}

.file{
 background:#fff;border:1px solid #e5e7eb;
 border-radius:16px;padding:13px;
 overflow:hidden
}
.files.list .file{
 display:flex;gap:12px;align-items:center
}
.files.list .preview{
 width:70px;height:70px;flex:none;margin:0
}

.preview{
 height:140px;background:#f1f5f9;
 border-radius:11px;
 display:flex;align-items:center;
 justify-content:center;overflow:hidden
}
.preview img{
 width:100%;height:100%;object-fit:cover
}
.icon{font-size:38px}
.name{
 font-weight:bold;margin-top:9px;
 word-break:break-word
}
.info{
 font-size:12px;color:#6b7280;margin-top:4px
}
.status{
 font-size:12px;font-weight:bold;margin-top:6px
}
.pending{color:#b45309}
.done{color:#15803d}

.small{
 padding:7px 9px;border-radius:8px;
 background:#eef2f7;font-size:11px;font-weight:bold
}
.view{background:#dbeafe;color:#1d4ed8}
.download{background:#dcfce7;color:#166534}
.drive{background:#111827;color:#fff}
.delete{background:#fee2e2;color:#b91c1c}

.modal{
 position:fixed;inset:0;background:#000b;
 display:flex;align-items:center;justify-content:center;
 padding:12px;z-index:20
}
.modalbox{
 background:#fff;border-radius:16px;
 width:min(900px,100%);
 max-height:95vh;overflow:auto
}
.modalhead{
 padding:12px 15px;
 display:flex;justify-content:space-between;
 border-bottom:1px solid #ddd
}
.modalbody{
 padding:15px;text-align:center;
 background:#f8fafc
}
.modalbody img{
 max-width:100%;max-height:75vh;border-radius:10px
}
.modalbody iframe{
 width:100%;height:75vh;border:0
}
.modalbody video{
 max-width:100%;max-height:75vh
}

@media(max-width:600px){
 .files{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
<div class="head">
<button id="logoutBtn" class="logout hidden" onclick="logout()">Logout</button>
<h1>🔐 Personal Vault</h1>
<div class="sub">Secure encrypted storage</div>
</div>
</header>

<main>

<!-- LOGIN -->
<section id="loginScreen" class="card login">
<h2>🔐 Unlock Vault</h2>

<label>Username</label>
<input id="username" autocomplete="username">

<label>Password</label>
<input id="password" type="password" autocomplete="current-password">

<button id="loginBtn"
 class="btn primary"
 style="width:100%;margin-top:16px"
 onclick="login()">
 Unlock
</button>

<div id="loginMsg" class="message hidden"></div>
</section>


<!-- APP -->
<section id="appScreen" class="hidden">

<div class="card">
<h3 style="margin:0">☁️ Google Drive Backup</h3>

<div id="driveStatus" class="info">
Checking...
</div>

<div class="actions">
<button class="btn primary" onclick="connectGoogle()">
🔗 Connect Google Drive
</button>

<button class="btn" onclick="backupAll()">
☁️ Backup All
</button>

<button class="btn" onclick="refreshFiles()">
🔄 Refresh
</button>
</div>
</div>


<div class="card">
<h3 style="margin:0">Upload File</h3>

<input id="fileInput" type="file">

<select id="category">
<option>Other</option>
<option>Family</option>
<option>Church</option>
<option>Ministry</option>
<option>Personal</option>
<option>Documents</option>
<option>Travel</option>
<option>Memories</option>
<option>Backup</option>
</select>

<button class="btn primary"
 style="margin-top:10px"
 onclick="uploadFile()">
 🔐 Encrypt & Upload
</button>

<div id="uploadMsg" class="message hidden"></div>
</div>


<div class="filehead">
<h3 style="margin:0">My Files</h3>

<div class="views">
<button id="gridBtn"
 class="active"
 onclick="setView('grid')">
 ▦ Grid
</button>

<button id="listBtn"
 onclick="setView('list')">
 ☷ List
</button>
</div>
</div>

<div id="filesBox" class="files"></div>

</section>
</main>


<!-- VIEWER -->
<div id="viewer" class="modal hidden">
<div class="modalbox">

<div class="modalhead">
<b id="viewerTitle"></b>
<button class="small" onclick="closeViewer()">✕</button>
</div>

<div id="viewerBody" class="modalbody"></div>

</div>
</div>


<script>
const API="https://personal.createlk.workers.dev";

let files=[];
let encryptionKey=null;


/* ELEMENTS */
const loginScreen=document.getElementById("loginScreen");
const appScreen=document.getElementById("appScreen");
const logoutBtn=document.getElementById("logoutBtn");
const username=document.getElementById("username");
const password=document.getElementById("password");
const loginMsg=document.getElementById("loginMsg");
const uploadMsg=document.getElementById("uploadMsg");
const fileInput=document.getElementById("fileInput");
const category=document.getElementById("category");
const filesBox=document.getElementById("filesBox");
const driveStatus=document.getElementById("driveStatus");
const viewer=document.getElementById("viewer");
const viewerTitle=document.getElementById("viewerTitle");
const viewerBody=document.getElementById("viewerBody");


/* ENCRYPTION KEY
   Compatible with your existing files */
async function getKey(){

 if(encryptionKey)return encryptionKey;

 const hash=await crypto.subtle.digest(
  "SHA-256",
  new TextEncoder().encode("personal-vault-key")
 );

 encryptionKey=await crypto.subtle.importKey(
  "raw",
  hash,
  "AES-GCM",
  false,
  ["encrypt","decrypt"]
 );

 return encryptionKey;
}


/* LOGIN */
async function login(){

 loginMsg.classList.add("hidden");

 const u=username.value.trim();
 const p=password.value;

 if(!u||!p){
  showLoginMessage("Please enter username and password.");
  return;
 }

 try{

  const r=await fetch(API+"/api/login",{
   method:"POST",
   credentials:"include",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    username:u,
    password:p
   })
  });

  const d=await r.json().catch(()=>({}));

  if(!r.ok){
   throw new Error(d.error||"Login failed");
  }

  /* KEEP LOGIN AFTER REFRESH */
  localStorage.setItem("vault_logged_in","1");

  showApp();

 }catch(e){

  showLoginMessage(e.message);

 }
}


function showLoginMessage(text){

 loginMsg.textContent=text;
 loginMsg.classList.remove("hidden");

}


function showApp(){

 loginScreen.classList.add("hidden");
 appScreen.classList.remove("hidden");
 logoutBtn.classList.remove("hidden");

 setView(
  localStorage.getItem("vault_view")||"grid"
 );

 refreshFiles();

}


/* SESSION RESTORE */
async function restoreSession(){

 const saved=localStorage.getItem("vault_logged_in");

 if(saved==="1"){

  try{

   const r=await fetch(
    API+"/api/login/status",
    {credentials:"include"}
   );

   const d=await r.json();

   if(d.authenticated){
    showApp();
    return;
   }

  }catch(e){}

  /*
   If server session temporarily cannot be checked,
   keep the local login state so refresh does not
   immediately return to the login screen.
  */
  showApp();
 }

}


/* LOGOUT */
async function logout(){

 try{
  await fetch(API+"/api/logout",{
   method:"POST",
   credentials:"include"
  });
 }catch(e){}

 localStorage.removeItem("vault_logged_in");

 loginScreen.classList.remove("hidden");
 appScreen.classList.add("hidden");
 logoutBtn.classList.add("hidden");

 password.value="";

}


/* LOAD FILES */
async function loadFiles(){

 try{

  const r=await fetch(
   API+"/api/photos",
   {credentials:"include"}
  );

  if(r.status===401){

   localStorage.removeItem("vault_logged_in");
   location.reload();
   return;
  }

  if(!r.ok)throw new Error("Unable to load files");

  const d=await r.json();

  files=d.files||[];

  renderFiles();

 }catch(e){

  filesBox.innerHTML=
   '<div class="message">Unable to load files.</div>';

 }

}


/* RENDER */
function renderFiles(){

 if(!files.length){

  filesBox.innerHTML=
   '<div class="message">No files yet.</div>';

  return;
 }

 filesBox.innerHTML=files.map(f=>{

  const image=(f.file_type||"").startsWith("image/");

  return `
  <div class="file">

   <div class="preview">
    ${
     image
     ? `<img id="thumb-${f.id}" style="display:none">`
     : `<span class="icon">${fileIcon(f.file_type)}</span>`
    }
   </div>

   <div style="flex:1">

    <div class="name">
     ${escapeHTML(f.filename)}
    </div>

    <div class="info">
     ${escapeHTML(f.category||"Other")}
     • ${formatSize(f.file_size)}
    </div>

    <div class="status ${
     f.google_drive_file_id
     ?"done"
     :"pending"
    }">

     ${
      f.google_drive_file_id
      ?"☁️ Backed up"
      :"⏳ Backup pending"
     }

    </div>

    <div class="buttons">

     <button class="small view"
      onclick="viewFile(${f.id})">
      👁 View
     </button>

     <button class="small download"
      onclick="downloadFile(${f.id})">
      ⬇ Download
     </button>

     ${
      f.google_drive_file_id
      ?
      `<button class="small drive"
       onclick="openDrive('${escapeAttr(f.google_drive_url||"")}')">
       ☁ Drive
      </button>`
      :
      `<button class="small drive"
       onclick="backupFile(${f.id})">
       ☁ Backup
      </button>`
     }

     <button class="small delete"
      onclick="deleteFile(${f.id})">
      🗑 Delete
     </button>

    </div>

   </div>

  </div>
  `;

 }).join("");

 /* IMAGE THUMBNAILS */
 files
 .filter(f=>(f.file_type||"").startsWith("image/"))
 .forEach(loadThumbnail);

}


/* GET ENCRYPTED FILE */
async function getEncryptedFile(id){

 const r=await fetch(
  API+"/api/photos/"+id+"/download",
  {credentials:"include"}
 );

 if(!r.ok)throw new Error("Unable to get file");

 return r.blob();

}


/* DECRYPT */
async function decryptBlob(blob,type){

 const bytes=new Uint8Array(
  await blob.arrayBuffer()
 );

 const iv=bytes.slice(0,12);
 const encrypted=bytes.slice(12);

 const decrypted=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv},
  await getKey(),
  encrypted
 );

 return new Blob(
  [decrypted],
  {type:type||"application/octet-stream"}
 );

}


/* THUMBNAIL */
async function loadThumbnail(f){

 try{

  const img=document.getElementById(
   "thumb-"+f.id
  );

  if(!img)return;

  const encrypted=await getEncryptedFile(f.id);

  const blob=await decryptBlob(
   encrypted,
   f.file_type
  );

  const url=URL.createObjectURL(blob);

  img.src=url;
  img.style.display="block";

 }catch(e){

  console.log("Thumbnail:",e);

 }

}


/* VIEW */
async function viewFile(id){

 const f=files.find(x=>String(x.id)===String(id));

 if(!f)return;

 viewer.classList.remove("hidden");

 viewerTitle.textContent=f.filename;

 viewerBody.innerHTML=
  '<div class="message">🔐 Decrypting...</div>';

 try{

  const encrypted=await getEncryptedFile(id);

  const blob=await decryptBlob(
   encrypted,
   f.file_type
  );

  const url=URL.createObjectURL(blob);
  const type=f.file_type||"";

  if(type.startsWith("image/")){

   viewerBody.innerHTML=
    `<img src="${url}">`;

  }else if(type==="application/pdf"){

   viewerBody.innerHTML=
    `<iframe src="${url}"></iframe>`;

  }else if(type.startsWith("video/")){

   viewerBody.innerHTML=
    `<video controls autoplay src="${url}"></video>`;

  }else if(type.startsWith("audio/")){

   viewerBody.innerHTML=
    `<audio controls src="${url}"></audio>`;

  }else{

   viewerBody.innerHTML=
    `<button class="btn primary"
     onclick="downloadFile(${id})">
     ⬇ Download File
     </button>`;

  }

 }catch(e){

  viewerBody.innerHTML=
   `<div class="message">
    ❌ Unable to decrypt file.
   </div>`;

 }

}


function closeViewer(){

 viewer.classList.add("hidden");
 viewerBody.innerHTML="";

}


/* DOWNLOAD ORIGINAL */
async function downloadFile(id){

 try{

  const f=files.find(x=>String(x.id)===String(id));

  if(!f)return;

  const encrypted=await getEncryptedFile(id);

  const blob=await decryptBlob(
   encrypted,
   f.file_type
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=f.filename||"file";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
   ()=>URL.revokeObjectURL(url),
   2000
  );

 }catch(e){

  alert("Download failed: "+e.message);

 }

}


/* UPLOAD */
async function uploadFile(){

 const f=fileInput.files[0];

 if(!f){
  alert("Please select a file.");
  return;
 }

 if(f.size>60*1024*1024){

  alert("Maximum file size is 60 MB.");
  return;

 }

 uploadMsg.classList.remove("hidden");
 uploadMsg.textContent="🔐 Encrypting...";

 try{

  const iv=crypto.getRandomValues(
   new Uint8Array(12)
  );

  const encrypted=
   await crypto.subtle.encrypt(
    {name:"AES-GCM",iv},
    await getKey(),
    await f.arrayBuffer()
   );

  const output=new Uint8Array(
   12+encrypted.byteLength
  );

  output.set(iv,0);

  output.set(
   new Uint8Array(encrypted),
   12
  );

  uploadMsg.textContent="☁️ Uploading...";

  const r=await fetch(
   API+"/api/photos",
   {
    method:"POST",
    credentials:"include",
    headers:{
     "Content-Type":
      "application/octet-stream",

     "X-Filename":
      encodeURIComponent(f.name),

     "X-File-Type":
      f.type||"application/octet-stream",

     "X-Category":
      encodeURIComponent(category.value)
    },
    body:output
   }
  );

  const d=await r.json().catch(()=>({}));

  if(!r.ok){

   throw new Error(
    d.error||"Upload failed"
   );

  }

  uploadMsg.textContent=
   "✓ Saved • ⏳ Drive backup";

  fileInput.value="";

  /* AUTOMATIC BACKUP */
  try{

   const b=await fetch(
    API+"/api/google/backup/"+d.id,
    {
     method:"POST",
     credentials:"include"
    }
   );

   const bd=await b.json().catch(()=>({}));

   if(b.ok&&bd.success){

    uploadMsg.textContent=
     bd.duplicate
     ?"✓ Saved • Already backed up"
     :"✓ Saved • ☁️ Backed up";

   }

  }catch(e){}

  await refreshFiles();

 }catch(e){

  uploadMsg.textContent=
   "❌ "+e.message;

 }

}


/* DELETE */
async function deleteFile(id){

 if(!confirm("Delete this file?"))return;

 try{

  const r=await fetch(
   API+"/api/photos/"+id,
   {
    method:"DELETE",
    credentials:"include"
   }
  );

  if(!r.ok)throw new Error("Delete failed");

  await refreshFiles();

 }catch(e){

  alert(e.message);

 }

}


/* GOOGLE BACKUP */
async function backupFile(id){

 try{

  const r=await fetch(
   API+"/api/google/backup/"+id,
   {
    method:"POST",
    credentials:"include"
   }
  );

  const d=await r.json().catch(()=>({}));

  if(!r.ok||!d.success){

   throw new Error(
    d.error||"Backup failed"
   );

  }

  alert(
   d.duplicate
   ?"✓ Already backed up"
   :"☁️ Backup completed"
  );

  refreshFiles();

 }catch(e){

  alert("Backup failed: "+e.message);

 }

}


/* BACKUP ALL */
async function backupAll(){

 const pending=files.filter(
  f=>!f.google_drive_file_id
 );

 if(!pending.length){

  alert("✓ All files are already backed up.");
  return;

 }

 let success=0;

 for(const f of pending){

  try{

   const r=await fetch(
    API+"/api/google/backup/"+f.id,
    {
     method:"POST",
     credentials:"include"
    }
   );

   const d=await r.json().catch(()=>({}));

   if(r.ok&&d.success)success++;

  }catch(e){}

 }

 alert(
  "☁️ Backup finished\n\n"+
  "✓ Successful: "+success+
  "\n⏳ Remaining: "+(pending.length-success)
 );

 refreshFiles();

}


/* GOOGLE STATUS */
async function googleStatus(){

 try{

  const r=await fetch(
   API+"/api/google/status",
   {credentials:"include"}
  );

  const d=await r.json();

  if(!d.connected){

   driveStatus.textContent=
    "Not connected";

   return;

  }

  const total=Number(d.total||0);

  const backed=Number(
   d.backed_up??d.backedUp??0
  );

  driveStatus.textContent=
   "✓ Connected • "+
   backed+" backed up • "+
   Math.max(0,total-backed)+
   " pending";

 }catch(e){

  driveStatus.textContent=
   "Unable to check Drive";

 }

}


/* CONNECT */
function connectGoogle(){

 location.href=
  API+"/api/google/connect";

}


/* REFRESH */
async function refreshFiles(){

 await loadFiles();
 await googleStatus();

}


/* GRID / LIST */
function setView(mode){

 localStorage.setItem(
  "vault_view",
  mode
 );

 filesBox.classList.toggle(
  "list",
  mode==="list"
 );

 document.getElementById("gridBtn")
  .classList.toggle(
   "active",
   mode==="grid"
  );

 document.getElementById("listBtn")
  .classList.toggle(
   "active",
   mode==="list"
  );

}


/* HELPERS */
function fileIcon(type){

 if(!type)return"📄";

 if(type.startsWith("image/"))
  return"🖼️";

 if(type.startsWith("video/"))
  return"🎬";

 if(type.startsWith("audio/"))
  return"🎵";

 if(type.includes("pdf"))
  return"📕";

 if(type.includes("zip"))
  return"📦";

 return"📄";

}


function formatSize(n){

 n=Number(n)||0;

 const units=["B","KB","MB","GB"];

 let i=0;

 while(n>=1024&&i<3){

  n/=1024;
  i++;

 }

 return n.toFixed(
  i?1:0
 )+" "+units[i];

}


function escapeHTML(value){

 return String(value||"")
 .replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));

}


function escapeAttr(value){

 return String(value||"")
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'");

}


function openDrive(url){

 if(url)window.open(url,"_blank");

}


/* START */
restoreSession();

</script>

</body>
</html>
