<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Personal Vault</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;background:#102a56;color:white;font-weight:bold}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 14px}
.screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:white;padding:28px;border-radius:20px;box-shadow:0 10px 40px #0002}
.logo{text-align:center;font-size:40px}
h1{text-align:center}
.muted{text-align:center;color:#718096}
.msg{text-align:center;color:#b42318;min-height:20px}
.top{height:60px;background:white;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}
main{max-width:900px;margin:auto;padding:20px 15px 85px}
.hero{background:#102a56;color:white;padding:25px;border-radius:18px}
.stats,.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.stat,.quick button,.item,.photo{background:white;padding:16px;border-radius:14px;border:1px solid #e2e7ef}
.stat{text-align:center}
.stat b{font-size:25px;display:block}
.quick button{color:#172033;min-height:100px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.item{margin-bottom:10px}
.item-title{font-weight:bold;font-size:18px}
.small{font-size:13px;padding:8px 11px}
.secret{background:#f5f7fa;padding:10px;border-radius:8px;margin:5px 0;white-space:pre-wrap}
.actions{display:flex;gap:7px;margin-top:10px}
.danger{background:#b42318}
.upload{display:block;text-align:center;background:white;border:2px dashed #aaa;padding:35px;border-radius:15px;margin-bottom:15px}
.upload input{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:white;border-top:1px solid #ddd;display:flex}
.bottom button{flex:1;background:white;color:#555;border-radius:0}
.empty{text-align:center;background:white;padding:25px;border-radius:14px;color:#718096}
#app{display:none}
@media(max-width:600px){
.stats{gap:5px}.stat{padding:12px 3px}.stat b{font-size:20px}
.quick{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="lock" class="screen">
<div class="card">

<div class="logo">🔐</div>
<h1>Personal Vault</h1>
<p class="muted">Private encrypted storage</p>

<div id="setup">
<h2>Create Your Vault</h2>
<input id="p1" type="password" placeholder="Create master password">
<input id="p2" type="password" placeholder="Confirm master password">
<button id="create" style="width:100%">Create Vault</button>
</div>

<div id="unlock" hidden>
<h2>Unlock Vault</h2>
<input id="mp" type="password" placeholder="Master password">
<button id="open" style="width:100%">Unlock Vault</button>
</div>

<p id="msg" class="msg"></p>

</div>
</section>


<section id="app">

<header class="top">
<b>🔐 Personal Vault</b>
<button id="lockBtn" class="danger small">Lock</button>
</header>

<main>

<section id="home">

<div class="hero">
<h2>My Vault</h2>
<p>Your private encrypted information.</p>
</div>

<div class="stats">
<div class="stat"><b id="ic">0</b>Items</div>
<div class="stat"><b id="pc">0</b>Photos</div>
<div class="stat"><b id="cc">0</b>Categories</div>
</div>

<div class="quick">
<button id="itemsBtn">🔑<br>Secure Items</button>
<button id="photosBtn">🖼️<br>Photos</button>
<button id="addBtn">➕<br>Add Secure Item</button>
</div>

</section>


<section id="items" hidden>

<div class="head">
<h2>Secure Items</h2>
<button id="add2">+ Add</button>
</div>

<input id="search" placeholder="Search secure items...">

<div id="itemList"></div>

</section>


<section id="form" hidden>

<h2 id="formTitle">Add Secure Item</h2>

<input type="hidden" id="id">

<label>Category</label>
<select id="cat"></select>

<label>Title</label>
<input id="title" required>

<label>Username / Email</label>
<input id="user">

<label>Password</label>
<input id="pass" type="password">

<label>Backup Codes</label>
<textarea id="codes" rows="4"></textarea>

<label>Private Notes</label>
<textarea id="notes" rows="5"></textarea>

<div class="actions">
<button id="cancel">Cancel</button>
<button id="save">Save</button>
</div>

</section>


<section id="photos" hidden>

<h2>Photos</h2>

<label class="upload">
📷 Select Photos
<input id="photoInput" type="file" accept="image/*" multiple>
</label>

<div id="uploadStatus"></div>
<div id="photoList"></div>

</section>

</main>


<nav class="bottom">
<button id="homeNav">🏠<br>Home</button>
<button id="itemsNav">🔑<br>Items</button>
<button id="photosNav">🖼️<br>Photos</button>
</nav>

</section>


<script>

const API="https://personal.createlk.workers.dev";
let KEY=null,SALT=null,ITEMS=[];

const $=x=>document.getElementById(x);

const b64=a=>btoa(String.fromCharCode(...a));
const bin=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));


async function api(p,o={}){
 const r=await fetch(API+p,{
  ...o,
  headers:{
   "Content-Type":"application/json",
   ...(o.headers||{})
  }
 });

 const d=await r.json();

 if(!r.ok)throw Error(d.error||"Request failed");

 return d;
}


async function makeKey(p,s){
 const k=await crypto.subtle.importKey(
  "raw",
  new TextEncoder().encode(p),
  "PBKDF2",
  false,
  ["deriveKey"]
 );

 return crypto.subtle.deriveKey(
  {
   name:"PBKDF2",
   salt:s,
   iterations:600000,
   hash:"SHA-256"
  },
  k,
  {
   name:"AES-GCM",
   length:256
  },
  false,
  ["encrypt","decrypt"]
 );
}


async function enc(t){

 if(!t)return"";

 const iv=crypto.getRandomValues(
  new Uint8Array(12)
 );

 const x=await crypto.subtle.encrypt(
  {
   name:"AES-GCM",
   iv
  },
  KEY,
  new TextEncoder().encode(t)
 );

 const a=new Uint8Array(
  12+x.byteLength
 );

 a.set(iv);
 a.set(new Uint8Array(x),12);

 return b64(a);
}


async function dec(v){

 if(!v)return"";

 try{

  const a=bin(v);

  const x=await crypto.subtle.decrypt(
   {
    name:"AES-GCM",
    iv:a.slice(0,12)
   },
   KEY,
   a.slice(12)
  );

  return new TextDecoder().decode(x);

 }catch{

  return"[Unable to decrypt]";

 }
}


/* VAULT */

async function init(){

 try{

  const d=await api("/api/vault/meta");

  SALT=bin(d.salt);

  $("setup").hidden=!!d.verifier;
  $("unlock").hidden=!d.verifier;

 }catch(e){

  $("msg").textContent=e.message;

 }

}


function openApp(){

 $("lock").style.display="none";
 $("app").style.display="block";

 show("home");
 stats();

}


function lock(){

 KEY=null;
 ITEMS=[];

 $("app").style.display="none";
 $("lock").style.display="grid";

 $("setup").hidden=true;
 $("unlock").hidden=false;

 $("mp").value="";
 $("msg").textContent="";

}


/* NAVIGATION */

function show(id){

 ["home","items","form","photos"]
 .forEach(x=>{
  $(x).hidden=x!==id;
 });

 if(id==="items")loadItems();
 if(id==="photos")loadPhotos();

 window.scrollTo(0,0);

}


/* CREATE */

async function createVault(){

 const a=$("p1").value;
 const b=$("p2").value;

 if(a.length<12)
  return $("msg").textContent=
   "Use at least 12 characters.";

 if(a!==b)
  return $("msg").textContent=
   "Passwords do not match.";

 try{

  $("create").disabled=true;

  KEY=await makeKey(a,SALT);

  await api("/api/vault/verifier",{
   method:"POST",
   body:JSON.stringify({
    verifier:await enc(
     "PERSONAL_VAULT_VERIFICATION_V1"
    )
   })
  });

  $("p1").value="";
  $("p2").value="";

  openApp();

 }catch(e){

  KEY=null;
  $("msg").textContent=e.message;

 }finally{

  $("create").disabled=false;

 }

}


/* LOGIN */

async function unlock(){

 const password=$("mp").value;

 if(!password)
  return $("msg").textContent=
   "Enter your master password.";

 try{

  $("open").disabled=true;

  const d=await api("/api/vault/meta");

  SALT=bin(d.salt);

  KEY=await makeKey(password,SALT);

  const check=await dec(d.verifier);

  if(check!=="PERSONAL_VAULT_VERIFICATION_V1")
   throw Error("Incorrect master password.");

  $("mp").value="";

  openApp();

 }catch(e){

  KEY=null;

  $("msg").textContent=e.message;

 }finally{

  $("open").disabled=false;

 }

}


/* DASHBOARD */

async function stats(){

 try{

  const d=await api("/api/stats");

  $("ic").textContent=d.items||0;
  $("pc").textContent=d.photos||0;
  $("cc").textContent=d.categories||0;

 }catch{}

}


/* CATEGORIES */

async function categories(){

 try{

  const d=await api("/api/categories");
  const a=d.categories||d||[];

  $("cat").innerHTML="";

  a.forEach(x=>{

   const n=typeof x==="string"?x:x.name;

   $("cat").add(
    new Option(n,n)
   );

  });

 }catch{

  $("cat").innerHTML=
   '<option>Other</option>';

 }

}


/* ITEMS */

async function loadItems(){

 try{

  const d=await api("/api/items");

  ITEMS=d.items||d||[];

  render();

 }catch{

  $("itemList").innerHTML=
   '<div class="empty">Unable to load items.</div>';

 }

}


function render(){

 const q=$("search").value.toLowerCase();

 const a=ITEMS.filter(x=>
  !q ||
  `${x.title} ${x.username} ${x.category}`
  .toLowerCase()
  .includes(q)
 );

 $("itemList").innerHTML="";

 if(!a.length){

  $("itemList").innerHTML=
   '<div class="empty">No secure items found.</div>';

  return;

 }

 a.forEach(x=>{

  const d=document.createElement("div");

  d.className="item";

  d.innerHTML=`
   <div class="item-title"></div>
   <small></small>
   <button class="small">Open</button>
  `;

  d.querySelector(".item-title")
   .textContent=x.title;

  d.querySelector("small")
   .textContent=x.category;

  d.querySelector("button").onclick=
   async()=>{

    const old=d.querySelector(".secretBox");

    if(old){
     old.remove();
     return;
    }

    const box=document.createElement("div");

    box.className="secretBox";

    box.innerHTML=`
     <div class="secret"></div>
     <div class="secret"></div>
     <div class="secret"></div>
     <div class="actions">
      <button>Edit</button>
      <button class="danger">Delete</button>
     </div>
    `;

    const s=box.querySelectorAll(".secret");

    s[0].textContent=
     "Username: "+(x.username||"")+
     "\nPassword: "+
     await dec(x.encrypted_password);

    s[1].textContent=
     "Backup Codes:\n"+
     await dec(x.encrypted_backup_codes);

    s[2].textContent=
     "Notes:\n"+
     await dec(x.encrypted_notes);

    box.querySelector(".actions button")
     .onclick=()=>edit(x);

    box.querySelector(".danger")
     .onclick=()=>del(x.id);

    d.append(box);

   };

  $("itemList").append(d);

 });

}


/* ADD */

async function add(){

 await categories();

 $("formTitle").textContent=
  "Add Secure Item";

 ["id","title","user","pass","codes","notes"]
 .forEach(x=>$(x).value="");

 show("form");

}


/* EDIT */

async function edit(x){

 await categories();

 $("formTitle").textContent=
  "Edit Secure Item";

 $("id").value=x.id;
 $("cat").value=x.category||"Other";
 $("title").value=x.title||"";
 $("user").value=x.username||"";

 $("pass").value=
  await dec(x.encrypted_password);

 $("codes").value=
  await dec(x.encrypted_backup_codes);

 $("notes").value=
  await dec(x.encrypted_notes);

 show("form");

}


/* SAVE */

async function save(){

 try{

  const id=$("id").value;

  const title=$("title").value.trim();

  if(!title)
   return alert("Enter a title.");

  const body={

   category:$("cat").value,

   title:title,

   username:$("user").value.trim(),

   encrypted_password:
    await enc($("pass").value),

   encrypted_backup_codes:
    await enc($("codes").value),

   encrypted_notes:
    await enc($("notes").value)

  };

  await api(
   id?"/api/items/"+id:"/api/items",
   {
    method:id?"PUT":"POST",
    body:JSON.stringify(body)
   }
  );

  await loadItems();

  stats();

  show("items");

 }catch(e){

  alert(e.message);

 }

}


/* DELETE ITEM */

async function del(id){

 if(!confirm("Delete this secure item?"))
  return;

 try{

  await api("/api/items/"+id,{
   method:"DELETE"
  });

  await loadItems();
  stats();

 }catch(e){

  alert(e.message);

 }

}


/* PHOTOS */

async function loadPhotos(){

 try{

  const d=await api("/api/photos");
  const a=d.photos||d||[];

  $("photoList").innerHTML=
   a.length?
   "":
   '<div class="empty">No photos found.</div>';

  a.forEach(x=>{

   const p=document.createElement("div");

   p.className="photo";

   p.innerHTML=`
    <b></b>
    <div class="actions">
     <button>Download</button>
     <button class="danger">Delete</button>
    </div>
   `;

   p.querySelector("b")
    .textContent=x.filename;

   p.querySelector("button")
    .onclick=()=>downloadPhoto(x.id);

   p.querySelector(".danger")
    .onclick=async()=>{

     if(!confirm("Delete photo?"))
      return;

     await api("/api/photos/"+x.id,{
      method:"DELETE"
     });

     loadPhotos();
     stats();

   };

   $("photoList").append(p);

  });

 }catch{

  $("photoList").innerHTML=
   '<div class="empty">Unable to load photos.</div>';

 }

}


/* DOWNLOAD PHOTO */

async function downloadPhoto(id){

 try{

  const r=await fetch(
   API+"/api/photos/"+id+"/download"
  );

  if(!r.ok)
   throw Error("Download failed.");

  const a=new Uint8Array(
   await r.arrayBuffer()
  );

  const n=new DataView(a.buffer)
   .getUint32(0,true);

  const name=new TextDecoder()
   .decode(a.slice(4,4+n));

  const p=4+n;

  const iv=a.slice(p,p+12);

  const data=
   await crypto.subtle.decrypt(
    {
     name:"AES-GCM",
     iv
    },
    KEY,
    a.slice(p+12)
   );

  const url=URL.createObjectURL(
   new Blob([data])
  );

  const link=document.createElement("a");

  link.href=url;
  link.download=name;
  link.click();

  URL.revokeObjectURL(url);

 }catch(e){

  alert(e.message);

 }

}


/* UPLOAD */

async function upload(files){

 for(const f of files){

  if(f.size>52428800){

   alert("Maximum photo size is 50 MB.");
   return;

  }

  try{

   $("uploadStatus").textContent=
    "Encrypting "+f.name+"...";

   const data=new Uint8Array(
    await f.arrayBuffer()
   );

   const iv=crypto.getRandomValues(
    new Uint8Array(12)
   );

   const encrypted=
    new Uint8Array(
     await crypto.subtle.encrypt(
      {
       name:"AES-GCM",
       iv
      },
      KEY,
      data
     )
    );

   const name=
    new TextEncoder().encode(f.name);

   const out=new Uint8Array(
    4+name.length+12+encrypted.length
   );

   new DataView(out.buffer)
    .setUint32(0,name.length,true);

   let p=4;

   out.set(name,p);
   p+=name.length;

   out.set(iv,p);
   p+=12;

   out.set(encrypted,p);

   const r=await fetch(
    API+"/api/photos",
    {
     method:"POST",
     headers:{
      "Content-Type":
       "application/octet-stream",
      "X-File-Name":
       encodeURIComponent(f.name),
      "X-File-Type":
       f.type||"application/octet-stream"
     },
     body:out
    }
   );

   if(!r.ok)
    throw Error("Upload failed.");

  }catch(e){

   $("uploadStatus").textContent=
    e.message;

   return;

  }

 }

 $("uploadStatus").textContent=
  "Upload complete.";

 $("photoInput").value="";

 loadPhotos();
 stats();

}


/* EVENTS */

$("create").onclick=createVault;
$("open").onclick=unlock;
$("lockBtn").onclick=lock;

$("itemsBtn").onclick=
 ()=>show("items");

$("itemsNav").onclick=
 ()=>show("items");

$("photosBtn").onclick=
 ()=>show("photos");

$("photosNav").onclick=
 ()=>show("photos");

$("addBtn").onclick=add;
$("add2").onclick=add;

$("homeNav").onclick=
 ()=>show("home");

$("cancel").onclick=
 ()=>show("items");

$("save").onclick=save;

$("search").oninput=render;

$("photoInput").onchange=
 e=>upload(e.target.files);


/* ENTER KEY */

$("mp").onkeydown=e=>{
 if(e.key==="Enter")unlock();
};

$("p2").onkeydown=e=>{
 if(e.key==="Enter")createVault();
};


/* START */

init();

</script>

</body>
</html>
