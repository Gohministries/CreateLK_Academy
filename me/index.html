<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Personal Vault</title>

<style>
*{box-sizing:border-box;margin:0}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#f7faff,#edf3fb);
color:#172033
}

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */

#loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.login-card{
width:100%;
max-width:380px;
padding:28px;
background:#fff;
border:1px solid #dce4ef;
border-radius:20px;
box-shadow:0 18px 45px #1e375f1a
}

.logo{
width:60px;
height:60px;
margin:0 auto 16px;
display:flex;
align-items:center;
justify-content:center;
border-radius:17px;
background:#edf4ff;
color:#2563eb;
font-size:27px
}

.login-card h1{
text-align:center;
font-size:24px
}

.subtitle{
margin:7px 0 24px;
text-align:center;
color:#718096;
font-size:14px
}

.field{
margin-bottom:15px
}

.field label{
display:block;
margin-bottom:6px;
font-size:13px;
font-weight:700
}

.field input{
width:100%;
height:45px;
padding:0 12px;
border:1px solid #ccd7e5;
border-radius:9px;
outline:0
}

.field input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px #2563eb12
}

.primary-btn,
.upload-btn{
height:43px;
border:1px solid #2563eb;
border-radius:9px;
background:#fff;
color:#2563eb;
font-weight:700
}

.primary-btn{
width:100%
}

.primary-btn:hover,
.upload-btn:hover{
background:#eff5ff
}

.login-error{
min-height:18px;
margin-top:12px;
text-align:center;
color:#dc2626;
font-size:13px
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:10;
background:#fffffff5;
border-bottom:1px solid #dce4ef;
backdrop-filter:blur(10px)
}

.header-inner,
main{
max-width:1100px;
margin:auto
}

.header-inner{
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px;
font-weight:800
}

.brand-icon{
width:37px;
height:37px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:#edf4ff;
color:#2563eb
}

.outline-btn{
height:39px;
padding:0 14px;
border:1px solid #cbd5e1;
border-radius:9px;
background:#fff;
color:#334155;
font-weight:700
}

.outline-btn:hover{
border-color:#2563eb;
color:#2563eb
}

/* MAIN */

main{
padding:22px 20px 50px
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:19px
}

.topbar h2{
font-size:22px
}

.upload-btn{
padding:0 16px
}

#fileInput{
display:none
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:23px
}

.stat{
padding:15px;
background:#fff;
border:1px solid #dce4ef;
border-radius:14px
}

.stat-title{
margin-bottom:6px;
color:#718096;
font-size:12px
}

.stat-value{
font-size:21px;
font-weight:800
}

/* SEARCH */

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px
}

.section-head h3{
font-size:17px
}

#search{
width:200px;
height:37px;
padding:0 11px;
border:1px solid #ccd7e5;
border-radius:9px;
outline:0
}

#search:focus{
border-color:#2563eb
}

/* FILE GRID */

.files{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(210px,1fr));
gap:13px
}

.file-card{
overflow:hidden;
background:#fff;
border:1px solid #dce4ef;
border-radius:14px
}

.thumb{
height:150px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#f1f5f9
}

.thumb img{
width:100%;
height:100%;
object-fit:cover
}

.file-icon{
font-size:40px
}

.file-info{
padding:12px
}

.filename{
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
font-size:14px;
font-weight:700
}

.meta{
margin-top:5px;
color:#718096;
font-size:11px
}

/* BUTTONS 2 + 1 + 2 */

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:10px
}

.action{
height:33px;
border:1px solid #cbd5e1;
border-radius:8px;
background:#fff;
color:#334155;
font-size:12px;
font-weight:700
}

.action:hover{
border-color:#2563eb;
color:#2563eb
}

/* SAVE IS CENTER */

.actions .action:nth-child(3){
grid-column:1 / -1;
width:50%;
justify-self:center
}

.delete:hover{
border-color:#dc2626;
color:#dc2626
}

.empty{
grid-column:1/-1;
padding:45px 20px;
border:1px dashed #cbd5e1;
border-radius:14px;
background:#fff;
text-align:center;
color:#718096
}

/* PROGRESS */

.progress-wrap{
position:fixed;
left:50%;
bottom:20px;
z-index:50;
width:min(400px,calc(100% - 30px));
transform:translateX(-50%);
padding:12px;
border:1px solid #dce4ef;
border-radius:11px;
background:#fff;
box-shadow:0 10px 30px #0002
}

.progress-text{
margin-bottom:7px;
text-align:center;
font-size:12px
}

.progress{
height:6px;
overflow:hidden;
border-radius:10px;
background:#e5e7eb
}

.progress-bar{
width:0;
height:100%;
background:#2563eb;
transition:.2s
}

/* MOBILE */

@media(max-width:600px){

.header-inner{
padding:11px 14px
}

main{
padding:18px 14px 45px
}

.files{
grid-template-columns:
repeat(2,minmax(0,1fr));
gap:8px
}

.thumb{
height:115px
}

.file-info{
padding:9px
}

#search{
width:145px
}

.action{
font-size:11px
}
}

@media(max-width:380px){

.files{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">

<div class="login-card">

<div class="logo">🔐</div>

<h1>Personal Vault</h1>

<div class="subtitle">
Private encrypted storage
</div>

<form id="loginForm">

<div class="field">
<label>Username</label>
<input
id="username"
autocomplete="username"
required>
</div>

<div class="field">
<label>Password</label>
<input
id="password"
type="password"
autocomplete="current-password"
required>
</div>

<button
id="loginBtn"
class="primary-btn"
type="submit">
Sign In
</button>

<div
id="loginError"
class="login-error">
</div>

</form>

</div>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

<header>

<div class="header-inner">

<div class="brand">

<div class="brand-icon">
🔐
</div>

Personal Vault

</div>

<button
id="logoutBtn"
class="outline-btn">
Logout
</button>

</div>

</header>


<main>

<div class="topbar">

<h2>My Files</h2>

<button
id="uploadBtn"
class="upload-btn">
＋ Upload
</button>

<input
id="fileInput"
type="file"
multiple>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Files
</div>

<div
id="fileCount"
class="stat-value">
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Storage
</div>

<div
id="storageUsed"
class="stat-value">
0 B
</div>

</div>

</div>


<!-- SEARCH -->

<div class="section-head">

<h3>Vault</h3>

<input
id="search"
type="search"
placeholder="Search files...">

</div>


<!-- FILES -->

<div
id="files"
class="files">
</div>

</main>

</section>


<!-- PROGRESS -->

<div
id="progressWrap"
class="progress-wrap hidden">

<div
id="progressText"
class="progress-text">
</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

</div>


<script>

const API=
"https://personal.createlk.workers.dev";

let keyCache=null;
let allFiles=[];


/* ENCRYPTION */

async function getKey(){

if(keyCache)
return keyCache;

const hash=
await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(
"personal-vault-key"
)
);

return keyCache=
await crypto.subtle.importKey(
"raw",
hash,
{name:"AES-GCM"},
false,
["encrypt","decrypt"]
);
}


async function encryptData(buffer){

const key=await getKey();

const iv=
crypto.getRandomValues(
new Uint8Array(12)
);

const encrypted=
await crypto.subtle.encrypt(
{
name:"AES-GCM",
iv
},
key,
buffer
);

const result=
new Uint8Array(
12+encrypted.byteLength
);

result.set(iv,0);

result.set(
new Uint8Array(encrypted),
12
);

return result;
}


async function decryptData(buffer){

const key=await getKey();

const data=
new Uint8Array(buffer);

return crypto.subtle.decrypt(
{
name:"AES-GCM",
iv:data.slice(0,12)
},
key,
data.slice(12)
);
}


/* HELPERS */

function bytes(n){

n=Number(n||0);

if(!n)
return"0 B";

const units=[
"B","KB","MB","GB","TB"
];

const i=
Math.floor(
Math.log(n)/Math.log(1024)
);

return(
n/Math.pow(1024,i)
).toFixed(i?1:0)
+" "+units[i];
}


function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


function typeIcon(type){

if(type?.startsWith("image/"))
return"🖼️";

if(type?.startsWith("video/"))
return"🎬";

if(type?.startsWith("audio/"))
return"🎵";

if(type==="application/pdf")
return"📄";

return"📁";
}


function category(type){

if(type?.startsWith("image/"))
return"Photos";

if(type?.startsWith("video/"))
return"Videos";

if(type?.startsWith("audio/"))
return"Audio";

if(type==="application/pdf")
return"Documents";

return"General";
}


/* API */

async function api(path,options={}){

const response=
await fetch(
API+path,
{
...options,
credentials:"include"
}
);

let data=null;

try{
data=await response.json();
}catch{}

if(response.status===401){

showLogin();

throw Error(
"Session expired"
);
}

if(!response.ok){

throw Error(
data?.error||
"Request failed"
);
}

return data;
}


/* LOGIN */

function showLogin(){

loginPage.classList.remove(
"hidden"
);

dashboard.classList.add(
"hidden"
);
}


async function showDashboard(){

loginPage.classList.add(
"hidden"
);

dashboard.classList.remove(
"hidden"
);

await loadAll();
}


async function loadAll(){

await Promise.all([
loadStats(),
loadFiles()
]);
}


loginForm.onsubmit=
async e=>{

e.preventDefault();

loginBtn.disabled=true;
loginBtn.textContent=
"Signing in...";

loginError.textContent="";

try{

await api(
"/api/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
username:
username.value.trim(),

password:
password.value
})
}
);

password.value="";

await showDashboard();

}catch(err){

loginError.textContent=
err.message;

}finally{

loginBtn.disabled=false;

loginBtn.textContent=
"Sign In";
}
};


/* AUTH */

async function checkAuth(){

try{

const result=
await api(
"/api/auth/status"
);

if(result.authenticated)
await showDashboard();
else
showLogin();

}catch{

showLogin();
}
}


logoutBtn.onclick=
async()=>{

try{

await api(
"/api/logout",
{method:"POST"}
);

}catch{}

allFiles=[];

showLogin();
};


/* UPLOAD */

uploadBtn.onclick=()=>
fileInput.click();


fileInput.onchange=
async()=>{

const list=[
...fileInput.files
];

if(!list.length)
return;

progressWrap.classList.remove(
"hidden"
);

for(let i=0;i<list.length;i++){

const file=list[i];

try{

progressText.textContent=
`Encrypting ${i+1} of ${list.length}`;

progressBar.style.width="25%";

const encrypted=
await encryptData(
await file.arrayBuffer()
);

progressText.textContent=
`Uploading ${i+1} of ${list.length}`;

progressBar.style.width="65%";

await api(
"/api/photos",
{
method:"POST",

headers:{
"Content-Type":
"application/octet-stream",

"X-Filename":
file.name,

"X-File-Type":
file.type||
"application/octet-stream",

"X-Category":
category(file.type)
},

body:encrypted
}
);

progressBar.style.width="100%";

}catch(err){

alert(
file.name+
"\n\n"+
err.message
);
}
}

fileInput.value="";

await loadAll();

progressText.textContent=
"Completed";

setTimeout(()=>{

progressWrap.classList.add(
"hidden"
);

progressBar.style.width="0";

},600);
};


/* STATS */

async function loadStats(){

try{

const data=
await api("/api/stats");

fileCount.textContent=
data.count??0;

storageUsed.textContent=
bytes(data.total_size);

}catch(err){

console.error(err);
}
}


/* FILES */

async function loadFiles(){

files.innerHTML=
`<div class="empty">
Loading files...
</div>`;

try{

const data=
await api("/api/items");

allFiles=
Array.isArray(data.items)
?data.items
:Array.isArray(data)
?data
:[];

renderFiles();

}catch(err){

files.innerHTML=
`<div class="empty">
${esc(err.message)}
</div>`;
}
}


function renderFiles(){

const query=
search.value.trim().toLowerCase();

const list=
allFiles.filter(file=>
String(
file.filename||""
)
.toLowerCase()
.includes(query)
);

if(!list.length){

files.innerHTML=
`<div class="empty">
${
query
?"No matching files"
:"Your vault is empty"
}
</div>`;

return;
}


files.innerHTML=
list.map(file=>{

const image=
String(file.file_type||"")
.startsWith("image/");

return`

<div class="file-card">

<div class="thumb">

${
image
?
`
<img
class="thumb-image"
data-id="${file.id}"
alt=""
>
`
:
`
<div class="file-icon">
${typeIcon(file.file_type)}
</div>
`
}

</div>


<div class="file-info">

<div
class="filename"
title="${esc(file.filename)}">

${esc(file.filename)}

</div>


<div class="meta">

${esc(
file.category||
"General"
)}

·

${bytes(
file.file_size
)}

</div>


<div class="actions">

<button
class="action"
onclick="openFile(${file.id})">
Open
</button>

<button
class="action"
onclick="shareFile(${file.id})">
Share
</button>

<button
class="action"
onclick="saveFile(${file.id})">
Save
</button>

<button
class="action"
onclick="renameFile(${file.id})">
Rename
</button>

<button
class="action delete"
onclick="deleteFile(${file.id})">
Delete
</button>

</div>

</div>

</div>

`;

}).join("");


loadThumbnails();
}


/* FILE DOWNLOAD */

async function getFile(id){

const item=
allFiles.find(
x=>String(x.id)===
String(id)
);

if(!item)
throw Error(
"File information not found"
);

const response=
await fetch(
`${API}/api/photos/${id}/download`,
{
credentials:"include"
}
);

if(!response.ok)
throw Error(
"Unable to load file"
);

const encrypted=
await response.arrayBuffer();

const decrypted=
await decryptData(
encrypted
);

const type=
item.file_type||
"application/octet-stream";

return{

blob:new Blob(
[decrypted],
{type}
),

name:
item.filename||
"file",

type

};
}


/* THUMBNAILS */

async function loadThumbnails(){

const images=[
...document.querySelectorAll(
".thumb-image"
)
];

await Promise.allSettled(

images.map(
async img=>{

try{

const file=
await getFile(
img.dataset.id
);

const url=
URL.createObjectURL(
file.blob
);

img.onload=()=>
URL.revokeObjectURL(
url
);

img.src=url;

}catch(err){

console.error(
"Thumbnail failed:",
img.dataset.id,
err
);

}
}
)

);
}


/* OPEN */

async function openFile(id){

try{

const file=
await getFile(id);

const previewable=
file.type.startsWith("image/")||
file.type==="application/pdf"||
file.type.startsWith("video/")||
file.type.startsWith("audio/");

if(!previewable){

alert(
"This file type cannot be previewed. Use Save or Share."
);

return;
}

const url=
URL.createObjectURL(
file.blob
);

const win=
window.open();

if(!win){

URL.revokeObjectURL(url);

throw Error(
"Please allow pop-ups for Personal Vault."
);
}

win.location.href=url;

setTimeout(
()=>URL.revokeObjectURL(url),
60000
);

}catch(err){

alert(err.message);
}
}


/* SAVE */

async function saveFile(id){

try{

const file=
await getFile(id);

const url=
URL.createObjectURL(
file.blob
);

const a=
document.createElement("a");

a.href=url;
a.download=file.name;
a.style.display="none";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
10000
);

}catch(err){

alert(err.message);
}
}


/* SHARE */

async function shareFile(id){

try{

const file=
await getFile(id);

const shared=
new File(
[file.blob],
file.name,
{
type:file.type,
lastModified:Date.now()
}
);

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({
files:[shared]
})
){

await navigator.share({
title:file.name,
files:[shared]
});

return;
}

alert(
"File sharing is not supported on this browser."
);

}catch(err){

if(err.name!=="AbortError"){

alert(
"Share failed: "+
err.message
);

}
}
}


/* RENAME */

async function renameFile(id){

const item=
allFiles.find(
x=>String(x.id)===
String(id)
);

if(!item)
return;

const newName=
prompt(
"Enter new filename:",
item.filename||""
);

if(newName===null)
return;

const name=
newName.trim();

if(!name){

alert(
"Filename cannot be empty."
);

return;
}

if(name===item.filename)
return;

try{

await api(
`/api/photos/${id}`,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
filename:name
})
}
);

item.filename=name;

renderFiles();

}catch(err){

alert(
"Rename failed: "+
err.message
);
}
}


/* DELETE */

async function deleteFile(id){

const item=
allFiles.find(
x=>String(x.id)===
String(id)
);

if(!item)
return;

if(!confirm(
`Delete "${item.filename}"?`
))
return;

try{

await api(
`/api/photos/${id}`,
{
method:"DELETE"
}
);

await loadAll();

}catch(err){

alert(err.message);
}
}


/* SEARCH */

search.oninput=
renderFiles;


/* START */

checkAuth();

</script>

</body>
</html>
