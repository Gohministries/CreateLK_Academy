<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Vault</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font:14px Arial;color:#111827}
header{background:#111827;color:white;padding:12px;display:flex;justify-content:space-between}
main{max-width:800px;margin:auto;padding:10px}.card{background:white;padding:12px;margin:8px 0;border-radius:10px}
input,textarea,select,button{width:100%;padding:10px;margin:4px 0;border-radius:7px}
input,textarea,select{border:1px solid #ddd}textarea{min-height:65px}
button{border:0;background:#111827;color:white;font-weight:bold;cursor:pointer}
.hidden{display:none!important}.msg{color:#dc2626}.small{font-size:12px;color:#6b7280}
.row{display:flex;gap:6px}.row>*{flex:1}.item,.file{border:1px solid #ddd;padding:9px;margin:6px 0;border-radius:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.preview{height:100px;background:#eee;display:flex;align-items:center;justify-content:center}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}.danger{background:#dc2626}
.progress{height:6px;background:#ddd;margin:6px 0}.progress i{display:block;height:100%;width:0;background:#111827}
</style>
</head>

<body>
<header>
<b>🔐 Personal Vault</b>
<div class="row">
<button id="lock" class="hidden">Lock</button>
<button id="logout" class="hidden">Logout</button>
</div>
</header>

<main>
<div id="loading" class="card">Checking session...</div>

<div id="login" class="card hidden">
<h3>Login</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="master" class="card hidden">
<h3>🔑 Master Password</h3>
<input id="masterPass" type="password" placeholder="Master Password">
<button onclick="unlock()">Unlock</button>
<div id="masterMsg" class="msg"></div>
</div>

<div id="app" class="hidden">

<div class="card">
<b>Vault</b>
<div id="stats" class="small"></div>
</div>

<div class="card">
<h3>Add Item</h3>
<select id="cat"></select>
<input id="title" placeholder="Title">
<input id="uname" placeholder="Username">
<input id="pwd" type="password" placeholder="Password">
<textarea id="backup" placeholder="Backup Codes"></textarea>
<textarea id="notes" placeholder="Notes"></textarea>
<button onclick="addItem()">Save</button>
<div id="itemMsg" class="msg"></div>
</div>

<div class="card">
<h3>Categories</h3>
<div class="row">
<input id="newCat" placeholder="New category">
<button onclick="addCat()">Add</button>
</div>
<div id="cats"></div>
</div>

<div class="card">
<h3>🔐 Items</h3>
<div id="items"></div>
</div>

<div class="card">
<h3>🖼️ Photos / Videos</h3>
<select id="fileCat"></select>
<input id="file" type="file" accept="image/*,video/*">
<div class="small">Encrypted locally • Maximum 60 MB</div>
<div class="progress"><i id="bar"></i></div>
<div id="uploadMsg" class="msg"></div>
<div id="files" class="files"></div>
</div>

</div>
</main>

<script>
const API="https://personal.createlk.workers.dev";
const CID="582157960266-e15mcm3vfl5ni38smv7h96cob9tng6p3.apps.googleusercontent.com";
const DB="personal-vault-key";
let key=null,meta=null,token=null;

const $=x=>document.getElementById(x);
const msg=(x,t)=>$(x).textContent=t;

function b64(a){
 let s="";
 for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));
 return btoa(s);
}
function u64(s){
 let x=atob(s),a=new Uint8Array(x.length);
 for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
 return a;
}
function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
async function api(p,o={}){
 o.credentials="include";
 const r=await fetch(API+p,o);
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

async function derive(p,s){
 let b=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},
  b,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]
 );
}
async function enc(t){
 let iv=crypto.getRandomValues(new Uint8Array(12));
 let d=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(t||""));
 return JSON.stringify({iv:b64(iv),data:b64(new Uint8Array(d))});
}
async function dec(v){
 let x=JSON.parse(v);
 let d=await crypto.subtle.decrypt({name:"AES-GCM",iv:u64(x.iv)},key,u64(x.data));
 return new TextDecoder().decode(d);
}

function db(){
 return new Promise((ok,no)=>{
  let r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("k");
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
 });
}
async function saveKey(){
 let d=await db(),r=await crypto.subtle.exportKey("raw",key);
 d.transaction("k","readwrite").objectStore("k").put(b64(new Uint8Array(r)),"key");
}
async function getKey(){
 try{
  let d=await db(),v=await new Promise(ok=>{
   let r=d.transaction("k").objectStore("k").get("key");
   r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null);
  });
  return v?crypto.subtle.importKey("raw",u64(v),{name:"AES-GCM"},true,["encrypt","decrypt"]):null;
 }catch{return null}
}
async function clearKey(){
 try{(await db()).transaction("k","readwrite").objectStore("k").delete("key")}catch{}
}

async function login(){
 msg("loginMsg","");
 try{
  let r=await fetch(API+"/api/login",{
   method:"POST",credentials:"include",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:$("user").value,password:$("pass").value})
  });
  if(!r.ok)throw Error((await r.json()).error||"Login failed");
  location.reload();
 }catch(e){msg("loginMsg",e.message)}
}

async function unlock(){
 msg("masterMsg","");
 try{
  let p=$("masterPass").value;
  if(!p)throw Error("Enter master password");

  if(!meta.initialized){
   let salt=crypto.getRandomValues(new Uint8Array(16));
   key=await derive(p,salt);
   let verifier=await enc("VAULT-CHECK");
   await api("/api/vault/meta",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({salt:b64(salt),verifier})
   });
   meta={initialized:true,salt:b64(salt),verifier};
  }else{
   key=await derive(p,u64(meta.salt));
   if(await dec(meta.verifier)!=="VAULT-CHECK")throw Error("Wrong password");
  }

  await saveKey();$("masterPass").value="";openApp();
 }catch(e){key=null;msg("masterMsg",e.message)}
}

async function check(){
 try{
  let s=await api("/api/login/status");
  if(!s.logged_in){$("login").classList.remove("hidden");return}

  $("logout").classList.remove("hidden");
  meta=await api("/api/vault/meta");
  key=await getKey();

  if(key){
   try{if(await dec(meta.verifier)==="VAULT-CHECK"){openApp();return}}catch{}
  }

  key=null;$("master").classList.remove("hidden");
 }catch(e){$("login").classList.remove("hidden")}
 finally{$("loading").classList.add("hidden")}
}

function openApp(){
 $("master").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("lock").classList.remove("hidden");
 load();
}

$("lock").onclick=async()=>{
 key=null;await clearKey();
 $("app").classList.add("hidden");
 $("master").classList.remove("hidden");
 $("lock").classList.add("hidden");
};

$("logout").onclick=async()=>{
 key=null;await clearKey();
 try{await api("/api/logout",{method:"POST"})}catch{}
 location.reload();
};

async function cats(){
 let a=(await api("/api/categories")).categories||[];
 let o=a.map(x=>`<option>${esc(x.name)}</option>`).join("")||"<option>General</option>";
 $("cat").innerHTML=o;$("fileCat").innerHTML=o;
 $("cats").innerHTML=a.map(x=>`📁 ${esc(x.name)}`).join("<br>");
 $("stats").textContent=`Categories: ${a.length}`;
}

async function addCat(){
 let n=$("newCat").value.trim();
 if(!n)return;
 try{
  await api("/api/categories",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name:n})
  });
  $("newCat").value="";cats();
 }catch(e){alert(e.message)}
}

async function items(){
 let a=(await api("/api/items")).items||[];
 $("items").innerHTML="";

 for(let x of a){
  let u="",p="",b="",n="";
  try{
   u=await dec(x.username);p=await dec(x.encrypted_password);
   b=await dec(x.encrypted_backup_codes);n=await dec(x.encrypted_notes);
  }catch{}

  let d=document.createElement("div");
  d.className="item";
  d.innerHTML=`
   <b>${esc(x.title)}</b><div class="small">${esc(x.category)}</div>
   <button>Show</button><button class="danger">Delete</button>
   <div class="secret hidden">
   Username: ${esc(u)}<br>Password: ${esc(p)}<br>
   Backup: ${esc(b)}<br>Notes: ${esc(n)}
   </div>`;

  d.children[2].onclick=()=>{
   d.querySelector(".secret").classList.toggle("hidden");
  };
  d.children[3].onclick=async()=>{
   if(confirm("Delete item?")){
    await api("/api/items/"+x.id,{method:"DELETE"});items();
   }
  };
  $("items").append(d);
 }
 $("stats").textContent+=" • Items: "+a.length;
}

async function addItem(){
 try{
  if(!$("title").value.trim())throw Error("Enter title");
  await api("/api/items",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    category:$("cat").value,title:$("title").value,
    username:await enc($("uname").value),
    encrypted_password:await enc($("pwd").value),
    encrypted_backup_codes:await enc($("backup").value),
    encrypted_notes:await enc($("notes").value)
   })
  });
  ["title","uname","pwd","backup","notes"].forEach(x=>$(x).value="");
  msg("itemMsg","Saved");items();
 }catch(e){msg("itemMsg",e.message)}
}

async function upload(file){
 if(!key)return msg("uploadMsg","Unlock vault first");
 if(file.size>60*1024*1024)return msg("uploadMsg","Maximum 60 MB");

 $("bar").style.width="10%";
 try{
  let iv=crypto.getRandomValues(new Uint8Array(12));
  let d=new Uint8Array(await crypto.subtle.encrypt(
   {name:"AES-GCM",iv},key,await file.arrayBuffer()
  ));
  let body=new Uint8Array(12+d.length);
  body.set(iv);body.set(d,12);

  $("bar").style.width="50%";

  let r=await fetch(API+"/api/photos",{
   method:"POST",credentials:"include",
   headers:{
    "Content-Type":"application/octet-stream",
    "X-Filename":encodeURIComponent(file.name),
    "X-File-Type":file.type||"application/octet-stream",
    "X-File-Size":file.size,
    "X-Category":encodeURIComponent($("fileCat").value||"General")
   },
   body
  });

  let x={};try{x=await r.json()}catch{}
  if(!r.ok)throw Error(x.error||"Upload failed");

  $("bar").style.width="100%";
  msg("uploadMsg","✓ Encrypted file saved");
  $("file").value="";
  files();
 }catch(e){msg("uploadMsg",e.message)}
 setTimeout(()=>$("bar").style.width="0",1000);
}

$("file").onchange=e=>{
 let f=e.target.files[0];
 if(f)upload(f);
};

async function fileBlob(f){
 let r=await fetch(API+"/api/photos/"+f.id+"/download",{credentials:"include"});
 if(!r.ok)throw Error("File unavailable");
 let a=new Uint8Array(await r.arrayBuffer());
 let d=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)
 );
 return new Blob([d],{type:f.file_type||"application/octet-stream"});
}

async function files(){
 try{
  let a=(await api("/api/photos")).files||[];
  $("files").innerHTML="";

  for(let f of a){
   let d=document.createElement("div");
   d.className="file";
   d.innerHTML=`
    <div class="preview">📄</div>
    <div>${esc(f.filename)}</div>
    <button>Open</button><button>Download</button>
    <button class="danger">Delete</button>`;

   let pv=d.querySelector(".preview");

   if(f.file_type?.startsWith("image/")){
    fileBlob(f).then(b=>pv.innerHTML=`<img src="${URL.createObjectURL(b)}">`);
   }else if(f.file_type?.startsWith("video/")){
    fileBlob(f).then(b=>pv.innerHTML=`<video controls src="${URL.createObjectURL(b)}"></video>`);
   }

   d.children[1].onclick=async()=>{
    let u=URL.createObjectURL(await fileBlob(f));
    window.open(u,"_blank");
   };

   d.children[2].onclick=async()=>{
    let u=URL.createObjectURL(await fileBlob(f));
    let a=document.createElement("a");
    a.href=u;a.download=f.filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),3000);
   };

   d.children[3].onclick=async()=>{
    if(confirm("Delete file?")){
     await api("/api/photos/"+f.id,{method:"DELETE"});
     files();
    }
   };

   $("files").append(d);
  }
 }catch(e){msg("uploadMsg",e.message)}
}

async function load(){
 await cats();
 await items();
 await files();
}

check();
</script>
</body>
</html>
