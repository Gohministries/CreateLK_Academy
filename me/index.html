<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Personal Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font:14px Arial}
header{background:#111827;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
header button,button{border:0;border-radius:7px;padding:8px 11px;background:#111827;color:white;cursor:pointer}
header button{background:white;color:#111827;margin-left:4px}
main{max-width:850px;margin:auto;padding:12px}
.card{background:white;padding:14px;border-radius:11px;margin-bottom:12px;box-shadow:0 2px 7px #0001}
h2,h3{margin:0 0 10px}
input,textarea,select{width:100%;padding:9px;margin:4px 0 9px;border:1px solid #d1d5db;border-radius:7px;font:inherit}
textarea{min-height:75px}
.hidden{display:none!important}
.msg{color:#dc2626;margin-top:7px}
.small{font-size:12px;color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:#f9fafb;padding:10px;text-align:center;border-radius:8px}
.stat b{display:block;font-size:20px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.danger{background:#dc2626!important}
.gray{background:#6b7280!important}
.item{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin:7px 0}
.item-title{font-weight:bold}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.files.list{display:block}
.file{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff}
.list .file{display:flex;align-items:center;margin:6px 0;padding:8px}
.preview{height:125px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.list .preview{width:55px;height:55px;flex:none;border-radius:6px}
.icon{font-size:35px}
.file-info{padding:8px}
.list .file-info{padding:0 8px;flex:1}
.file-name{font-weight:bold;font-size:12px;word-break:break-word}
.file button{padding:6px 8px;font-size:11px}
.viewbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress{height:4px;background:#ddd;border-radius:5px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;width:0;background:#111827}
@media(max-width:500px){
 .files{grid-template-columns:repeat(2,1fr)}
 .preview{height:110px}
}
</style>
</head>

<body>

<header>
<b>🔐 Personal Vault</b>
<div>
<button id="lock" class="hidden" onclick="lock()">Lock</button>
<button id="logout" class="hidden" onclick="logout()">Logout</button>
</div>
</header>

<main>

<section id="login" class="card">
<h2>🔐 Login</h2>
<input id="user" placeholder="Username" autocomplete="username">
<input id="pass" type="password" placeholder="Login Password">
<button onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="master" class="card hidden">
<h2>🔑 Master Password</h2>
<div class="small">Used only in your browser.</div>
<input id="masterPass" type="password" placeholder="Master Password">
<button onclick="unlock()">Unlock</button>
<div id="masterMsg" class="msg"></div>
</section>

<section id="app" class="hidden">

<div class="card">
<h2>🔐 Vault</h2>
<div class="stats">
<div class="stat"><b id="itemCount">0</b>Items</div>
<div class="stat"><b id="catCount">0</b>Categories</div>
<div class="stat"><b id="fileCount">0</b>Files</div>
</div>
</div>

<div class="card">
<h3>➕ Add Item</h3>
<select id="category"></select>
<input id="title" placeholder="Title">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<textarea id="backup" placeholder="Backup Codes"></textarea>
<textarea id="notes" placeholder="Notes"></textarea>
<button onclick="addItem()">Save</button>
<div id="itemMsg" class="msg"></div>
</div>

<div class="card">
<h3>📁 Categories</h3>
<input id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add</button>
<div id="categories"></div>
</div>

<div class="card">
<h3>🔐 Vault Items</h3>
<div id="items"><span class="small">Loading...</span></div>
</div>

<div class="card">
<div class="viewbar">
<h3>🖼️ Files</h3>
<div>
<button id="gridBtn" onclick="fileView('grid')">▦</button>
<button id="listBtn" onclick="fileView('list')">☷</button>
</div>
</div>

<div class="small">Encrypted in browser • Maximum 60 MB</div>

<input id="fileInput" type="file" onchange="uploadFile()">

<div class="progress hidden" id="uploadProgress">
<i id="uploadBar"></i>
</div>

<div id="fileMsg" class="msg"></div>
<div id="files" class="files"></div>
</div>

</section>
</main>

<script>
const API="https://personal.createlk.workers.dev";
let key=null,meta=null,files=[];
const $=id=>document.getElementById(id);

async function api(path,opt={}){
 opt.credentials="include";
 opt.headers={...(opt.headers||{})};
 const r=await fetch(API+path,opt);
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed.");
 return d;
}

const msg=(id,x)=>$(id).textContent=x||"";

function b64(a){
 let s="";
 for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));
 return btoa(s);
}

function ub64(s){
 const x=atob(s),a=new Uint8Array(x.length);
 for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);
 return a;
}

async function derive(p,s){
 const b=await crypto.subtle.importKey(
  "raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]
 );
 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},
  b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]
 );
}

async function encryptText(t){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt(
  {name:"AES-GCM",iv},key,new TextEncoder().encode(t||"")
 );
 return JSON.stringify({iv:b64(iv),data:b64(new Uint8Array(d))});
}

async function decryptText(v){
 if(!v)return"";
 const x=JSON.parse(v);
 const d=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv:ub64(x.iv)},key,ub64(x.data)
 );
 return new TextDecoder().decode(d);
}

async function encryptFile(f){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt(
  {name:"AES-GCM",iv},key,await f.arrayBuffer()
 );
 const o=new Uint8Array(12+d.byteLength);
 o.set(iv);o.set(new Uint8Array(d),12);
 return o;
}

async function decryptFile(d){
 return crypto.subtle.decrypt(
  {name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12)
 );
}

/* KEY STORAGE */

const KEY_DB="personal-vault-key";

function openKeyDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(KEY_DB,1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains("keys"))
    r.result.createObjectStore("keys");
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

async function saveKey(k){
 const db=await openKeyDB();
 return new Promise((resolve,reject)=>{
  const t=db.transaction("keys","readwrite");
  t.objectStore("keys").put(k,"master");
  t.oncomplete=()=>{db.close();resolve()};
  t.onerror=()=>{db.close();reject(t.error)};
 });
}

async function getKey(){
 try{
  const db=await openKeyDB();
  return await new Promise(resolve=>{
   const t=db.transaction("keys","readonly");
   const q=t.objectStore("keys").get("master");
   q.onsuccess=()=>{db.close();resolve(q.result||null)};
   q.onerror=()=>{db.close();resolve(null)};
  });
 }catch{return null}
}

async function clearKey(){
 try{
  const db=await openKeyDB();
  await new Promise(resolve=>{
   const t=db.transaction("keys","readwrite");
   t.objectStore("keys").delete("master");
   t.oncomplete=()=>{db.close();resolve()};
   t.onerror=()=>{db.close();resolve()};
  });
 }catch{}
}

/* LOGIN */

async function loginStatus(){
 try{
  const s=await api("/api/login/status");
  if(!s.logged_in)return;

  $("login").classList.add("hidden");
  $("logout").classList.remove("hidden");

  await loadMeta();

  const saved=await getKey();

  if(saved){
   try{
    key=saved;
    await decryptText(meta.verifier);

    $("master").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("lock").classList.remove("hidden");

    await loadAll();
    return;
   }catch{
    key=null;
    await clearKey();
   }
  }

  $("master").classList.remove("hidden");
 }catch{}
}

async function login(){
 const username=$("user").value.trim();
 const password=$("pass").value;

 if(!username||!password)
  return msg("loginMsg","Enter username and password.");

 try{
  const r=await fetch(API+"/api/login",{
   method:"POST",
   credentials:"include",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username,password})
  });

  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw Error(d.error||"Login failed.");

  const s=await fetch(API+"/api/login/status",{
   credentials:"include",cache:"no-store"
  }).then(r=>r.json());

  if(!s.logged_in)throw Error("Session cookie was not accepted.");

  $("pass").value="";
  $("login").classList.add("hidden");
  $("master").classList.remove("hidden");
  $("logout").classList.remove("hidden");

  await loadMeta();
 }catch(e){msg("loginMsg",e.message)}
}

/* MASTER */

async function loadMeta(){
 meta=await api("/api/vault/meta");
}

async function unlock(){
 const p=$("masterPass").value;

 if(!p)return msg("masterMsg","Enter Master Password.");

 try{
  if(!meta.initialized){
   const salt=crypto.getRandomValues(new Uint8Array(16));
   key=await derive(p,salt);
   const verifier=await encryptText("VAULT-CHECK");

   await api("/api/vault/meta",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     salt:b64(salt),
     verifier
    })
   });

   meta={initialized:true,salt:b64(salt),verifier};
  }else{
   key=await derive(p,ub64(meta.salt));

   try{
    if(await decryptText(meta.verifier)!=="VAULT-CHECK")
     throw Error();
   }catch{
    key=null;
    return msg("masterMsg","Incorrect master password.");
   }
  }

  await saveKey(key);

  $("masterPass").value="";
  $("master").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("lock").classList.remove("hidden");

  await loadAll();

 }catch(e){
  key=null;
  msg("masterMsg",e.message||"Unable to unlock.");
 }
}

async function lock(){
 key=null;
 await clearKey();

 $("app").classList.add("hidden");
 $("master").classList.remove("hidden");
 $("lock").classList.add("hidden");
 $("masterPass").value="";
}

async function logout(){
 key=null;
 await clearKey();

 try{await api("/api/logout",{method:"POST"})}catch{}
 location.reload();
}

/* CATEGORIES */

async function loadCategories(){
 const d=await api("/api/categories");
 const c=d.categories||[];

 $("catCount").textContent=c.length;

 $("category").innerHTML=c.length
  ?c.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("")
  :'<option>General</option>';

 $("categories").innerHTML=c.map(x=>
  `<div class="small">📁 ${esc(x.name)}</div>`
 ).join("");
}

async function addCategory(){
 const name=$("newCategory").value.trim();
 if(!name)return;

 try{
  await api("/api/categories",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name})
  });

  $("newCategory").value="";
  await loadCategories();
 }catch(e){alert(e.message)}
}

/* ITEMS */

async function loadItems(){
 const d=await api("/api/items");
 const items=d.items||[];

 $("itemCount").textContent=items.length;

 if(!items.length){
  $("items").innerHTML='<span class="small">No items yet.</span>';
  return;
 }

 $("items").innerHTML="";

 for(const x of items){
  let u="",p="",b="",n="";

  try{
   u=await decryptText(x.username);
   p=await decryptText(x.encrypted_password);
   b=await decryptText(x.encrypted_backup_codes);
   n=await decryptText(x.encrypted_notes);
  }catch{}

  const box=document.createElement("div");
  box.className="item";

  box.innerHTML=`
   <div class="item-title">${esc(x.title)}</div>
   <div class="small">📁 ${esc(x.category)}</div>
   <div class="actions">
    <button onclick="showSecret(this)">Show</button>
    <button class="danger" onclick="deleteItem(${x.id})">Delete</button>
   </div>
   <div class="secret hidden">
    <p><b>Username:</b><br>${esc(u)}</p>
    <p><b>Password:</b><br>${esc(p)}</p>
    <p><b>Backup:</b><br>${esc(b).replace(/\n/g,"<br>")}</p>
    <p><b>Notes:</b><br>${esc(n).replace(/\n/g,"<br>")}</p>
   </div>
  `;

  $("items").appendChild(box);
 }
}

function showSecret(b){
 const s=b.closest(".item").querySelector(".secret");
 s.classList.toggle("hidden");
 b.textContent=s.classList.contains("hidden")?"Show":"Hide";
}

async function addItem(){
 const title=$("title").value.trim();

 if(!title)return msg("itemMsg","Enter a title.");

 try{
  await api("/api/items",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    category:$("category").value||"General",
    title,
    username:await encryptText($("username").value),
    encrypted_password:await encryptText($("password").value),
    encrypted_backup_codes:await encryptText($("backup").value),
    encrypted_notes:await encryptText($("notes").value)
   })
  });

  ["title","username","password","backup","notes"]
   .forEach(x=>$(x).value="");

  msg("itemMsg","Saved.");
  await loadItems();
 }catch(e){msg("itemMsg",e.message)}
}

async function deleteItem(id){
 if(!confirm("Delete this item?"))return;

 try{
  await api("/api/items/"+id,{method:"DELETE"});
  await loadItems();
 }catch(e){alert(e.message)}
}

/* FILES */

async function uploadFile(){
 const f=$("fileInput").files[0];
 if(!f)return;

 if(f.size>60*1024*1024)
  return msg("fileMsg","Maximum 60 MB.");

 $("uploadProgress").classList.remove("hidden");

 try{
  $("uploadBar").style.width="25%";

  const data=await encryptFile(f);

  $("uploadBar").style.width="60%";

  const r=await fetch(API+"/api/photos",{
   method:"POST",
   credentials:"include",
   headers:{
    "Content-Type":"application/octet-stream",
    "X-Filename":encodeURIComponent(f.name),
    "X-File-Type":f.type||"application/octet-stream"
   },
   body:data
  });

  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw Error(d.error||"Upload failed.");

  $("uploadBar").style.width="100%";
  $("fileInput").value="";
  msg("fileMsg","Uploaded securely.");

  await loadFiles();
 }catch(e){
  msg("fileMsg",e.message);
 }

 setTimeout(()=>{
  $("uploadProgress").classList.add("hidden");
  $("uploadBar").style.width="0";
 },500);
}

async function getDecrypted(id){
 const r=await fetch(
  API+"/api/photos/"+id+"/download",
  {credentials:"include"}
 );

 if(!r.ok)throw Error("File unavailable.");

 return new Uint8Array(await r.arrayBuffer());
}

async function makeFileURL(f){
 const encrypted=await getDecrypted(f.id);
 const plain=await decryptFile(encrypted);

 return URL.createObjectURL(
  new Blob([plain],{
   type:f.file_type||"application/octet-stream"
  })
 );
}

async function previewFile(f,box){
 try{
  const url=await makeFileURL(f);
  const type=f.file_type||"";

  if(type.startsWith("image/")){
   const img=document.createElement("img");
   img.src=url;
   img.alt=f.filename;
   box.innerHTML="";
   box.appendChild(img);
  }else if(type.startsWith("video/")){
   const v=document.createElement("video");
   v.src=url;
   v.muted=true;
   v.playsInline=true;
   v.preload="metadata";
   box.innerHTML="";
   box.appendChild(v);
  }
 }catch{
  box.innerHTML='<div class="icon">🔒</div>';
 }
}

/* FILE VIEW */

function fileView(mode){
 const box=$("files");

 if(mode==="list"){
  box.classList.add("list");
  $("listBtn").classList.add("gray");
  $("gridBtn").classList.remove("gray");
 }else{
  box.classList.remove("list");
  $("gridBtn").classList.add("gray");
  $("listBtn").classList.remove("gray");
 }
}

async function viewFile(id){
 try{
  const f=files.find(x=>x.id==id);
  if(!f)return;

  const url=await makeFileURL(f);
  const w=window.open("","_blank");

  if(!w)return;

  const type=f.file_type||"";

  if(type.startsWith("image/")){
   w.document.write(`
    <title>${esc(f.filename)}</title>
    <style>
    body{margin:0;background:#111;display:flex;
    align-items:center;justify-content:center;height:100vh}
    img{max-width:100%;max-height:100%;object-fit:contain}
    </style>
    <img src="${url}">
   `);
  }else if(type.startsWith("video/")){
   w.document.write(`
    <title>${esc(f.filename)}</title>
    <style>body{margin:0;background:#111;text-align:center}
    video{width:100%;height:100vh}</style>
    <video src="${url}" controls autoplay></video>
   `);
  }else{
   w.location.href=url;
  }

 }catch(e){alert(e.message)}
}

async function loadFiles(){
 try{
  const d=await api("/api/photos");
  files=d.files||[];

  $("fileCount").textContent=files.length;

  if(!files.length){
   $("files").innerHTML=
    '<span class="small">No files yet.</span>';
   return;
  }

  $("files").innerHTML="";

  files.forEach(f=>{
   const card=document.createElement("div");
   card.className="file";

   const preview=document.createElement("div");
   preview.className="preview";

   const type=f.file_type||"";

   preview.innerHTML=type.startsWith("image/")
    ?'<div class="icon">🖼️</div>'
    :type.startsWith("video/")
    ?'<div class="icon">🎬</div>'
    :'<div class="icon">📄</div>';

   card.appendChild(preview);

   const info=document.createElement("div");
   info.className="file-info";

   info.innerHTML=`
    <div class="file-name">${esc(f.filename)}</div>
    <div class="small">${size(f.file_size)}</div>
    <div class="actions">
     <button onclick="viewFile(${f.id})">View</button>
     <button onclick="downloadFile(${f.id})">↓</button>
     <button class="danger" onclick="deleteFile(${f.id})">×</button>
    </div>
   `;

   card.appendChild(info);
   $("files").appendChild(card);

   if(type.startsWith("image/")||type.startsWith("video/"))
    previewFile(f,preview);
  });

 }catch(e){
  $("files").innerHTML=
   `<span class="msg">${esc(e.message)}</span>`;
 }
}

async function downloadFile(id){
 try{
  const f=files.find(x=>x.id==id);
  if(!f)return;

  const url=await makeFileURL(f);
  const a=document.createElement("a");

  a.href=url;
  a.download=f.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1500);
 }catch(e){alert(e.message)}
}

async function deleteFile(id){
 if(!confirm("Delete this file?"))return;

 try{
  await api("/api/photos/"+id,{method:"DELETE"});
  await loadFiles();
 }catch(e){alert(e.message)}
}

function size(n){
 n=Number(n||0);
 if(n<1024)return n+" B";
 if(n<1048576)return(n/1024).toFixed(1)+" KB";
 return(n/1048576).toFixed(1)+" MB";
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

async function loadAll(){
 await loadCategories();
 await loadItems();
 await loadFiles();
}

fileView("grid");
loginStatus();
</script>

</body>
</html>
