<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔐 Personal Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center;font-size:22px}
main{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,select,button{padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
input,select{width:100%;margin:6px 0 10px}
button{cursor:pointer;background:#111;color:#fff;border:0;margin:3px}
button.danger{background:#c62828}
.hidden{display:none}
.msg{margin:10px 0;color:#c62828}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.file{border:1px solid #ddd;border-radius:12px;padding:10px}
.preview{height:150px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:45px}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.filename{font-weight:bold;margin-top:10px;word-break:break-word}
.filecategory{font-size:12px;color:#666}
.small{font-size:12px;color:#777}
.actions{margin-top:8px}
.actions button{font-size:12px;padding:7px}
.row{display:flex;gap:8px;align-items:center}
#loading{text-align:center;padding:40px}
</style>
</head>

<body>

<header>🔐 Personal Vault</header>

<div id="loading">Checking secure session...</div>

<main id="login" class="hidden">
<div class="card">
<h2>Login</h2>
<input id="username" placeholder="Username" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>
</div>
</main>

<main id="app" class="hidden">

<div class="card">
<div class="row">
<h2 style="margin:0">🔐 Personal Vault</h2>
<button onclick="logout()">Logout</button>
</div>
<div id="appMsg" class="msg"></div>
</div>

<div class="card">
<h3>Master Password</h3>
<input id="master" type="password" placeholder="Master password">
<button onclick="unlock()">Unlock Vault</button>
<div id="masterMsg" class="msg"></div>
</div>

<div class="card">
<h3>Categories</h3>
<div id="categories"></div>
</div>

<div class="card">
<h3>Vault Items</h3>
<div id="items"></div>
</div>

<div class="card">
<h3>📁 Files (<span id="fileCount">0</span>)</h3>

<div class="row">
<input id="fileSearch" placeholder="Search files..." oninput="renderFiles()">
<select id="fileCategoryFilter" onchange="renderFiles()">
<option value="">All categories</option>
<option>General</option>
<option>Photos</option>
<option>Documents</option>
<option>Videos</option>
<option>Other</option>
</select>
</div>

<input id="fileInput" type="file">
<button onclick="uploadFile()">Upload File</button>

<div id="fileMsg" class="msg"></div>
<div id="files" class="grid"></div>
</div>

</main>

<script>

const API="https://personal.createlk.workers.dev";
const FEATURE_DB="personal-vault-file-features";

let key=null,files=[],vaultItems=[];

const $=id=>document.getElementById(id);

function show(id){
 $("loading").classList.add("hidden");
 $("login").classList.add("hidden");
 $("app").classList.add("hidden");
 $(id).classList.remove("hidden");
}

function say(id,msg){$(id).textContent=msg||""}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}

async function api(path,opt={}){
 const r=await fetch(API+path,{
  credentials:"include",
  cache:"no-store",
  ...opt
 });

 let d=null;
 try{d=await r.json()}catch{}

 if(!r.ok)throw Error(d?.error||"Request failed");
 return d;
}


/* SESSION */

async function status(){

 try{
  const s=await api("/api/login/status");

  if(!s.logged_in){
   show("login");
   return;
  }

  show("app");
  await loadAll();

 }catch(e){
  console.error(e);
  show("login");
  say("loginMsg","Unable to check secure session.");
 }
}

async function login(){

 try{

  say("loginMsg","");

  await api("/api/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username:$("username").value,
    password:$("password").value
   })
  });

  $("password").value="";
  show("app");
  await loadAll();

 }catch(e){
  say("loginMsg",e.message);
 }
}

async function logout(){

 try{
  await api("/api/logout",{method:"POST"});
 }catch{}

 key=null;
 show("login");
}


/* MASTER PASSWORD */

async function deriveKey(password,salt){

 const base=await crypto.subtle.importKey(
  "raw",
  new TextEncoder().encode(password),
  "PBKDF2",
  false,
  ["deriveKey"]
 );

 return crypto.subtle.deriveKey(
  {
   name:"PBKDF2",
   salt,
   iterations:200000,
   hash:"SHA-256"
  },
  base,
  {name:"AES-GCM",length:256},
  false,
  ["encrypt","decrypt"]
 );
}

async function unlock(){

 try{

  const v=await api("/api/vault/meta");

  if(!v.initialized){
   say("masterMsg","Vault is not initialized.");
   return;
  }

  const salt=Uint8Array.from(
   atob(v.salt),
   c=>c.charCodeAt(0)
  );

  key=await deriveKey($("master").value,salt);

  $("master").value="";

  await loadItems();
  await loadFiles();

  say("masterMsg","Vault unlocked.");

 }catch(e){
  key=null;
  say("masterMsg",e.message);
 }
}


/* LOAD */

async function loadAll(){
 try{
  await loadCategories();
  await loadItems();
  await loadFiles();
 }catch(e){
  say("appMsg",e.message);
 }
}

async function loadCategories(){

 try{

  const r=await api("/api/categories");
  const list=r.categories||[];

  $("categories").innerHTML=list.map(x=>
   `<button>${esc(x.name)}</button>`
  ).join("");

 }catch(e){
  console.log(e);
 }
}

async function loadItems(){

 try{

  const r=await api("/api/items");
  vaultItems=r.items||[];
  renderItems();

 }catch(e){
  console.log(e);
 }
}

function renderItems(){

 $("items").innerHTML=vaultItems.map(x=>`
  <div class="card">
   <b>${esc(x.title)}</b>
   <div class="small">${esc(x.category)}</div>
   <div>${esc(x.username)}</div>
  </div>
 `).join("");

}


/* FILE ENCRYPTED DATA */

async function fileData(f){

 if(!key)throw Error("Unlock vault first.");

 const r=await fetch(
  API+"/api/photos/"+f.id+"/download",
  {
   credentials:"include",
   cache:"no-store"
  }
 );

 if(!r.ok)throw Error("File unavailable.");

 const a=new Uint8Array(await r.arrayBuffer());

 return crypto.subtle.decrypt(
  {
   name:"AES-GCM",
   iv:a.slice(0,12)
  },
  key,
  a.slice(12)
 );
}

async function fileURL(f){

 return URL.createObjectURL(
  new Blob(
   [await fileData(f)],
   {type:f.file_type||"application/octet-stream"}
  )
 );
}


/* LOCAL FILE FEATURES */

function featureDB(){

 return new Promise((ok,no)=>{

  const r=indexedDB.open(FEATURE_DB,1);

  r.onupgradeneeded=()=>{
   r.result.createObjectStore("files",{keyPath:"id"});
  };

  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);

 });
}

async function feature(id){

 const db=await featureDB();

 return new Promise(ok=>{

  const r=db
   .transaction("files")
   .objectStore("files")
   .get(+id);

  r.onsuccess=()=>ok(r.result||null);
  r.onerror=()=>ok(null);

 });
}

async function saveFeature(x){

 const db=await featureDB();

 db.transaction("files","readwrite")
  .objectStore("files")
  .put(x);
}

async function getFeature(f){

 let x=await feature(f.id);

 if(!x){

  x={
   id:+f.id,
   name:f.filename,
   category:
    f.file_type?.startsWith("image/")?"Photos":
    f.file_type?.startsWith("video/")?"Videos":
    "General"
  };

  await saveFeature(x);
 }

 return x;
}


/* RENAME */

async function renameFile(f){

 const x=await getFeature(f);

 const n=prompt("File name:",x.name);

 if(n===null)return;

 x.name=n.trim()||f.filename;

 await saveFeature(x);
 await renderFiles();
}


/* CATEGORY */

async function categoryFile(f){

 const x=await getFeature(f);

 const c=prompt(
  "Category: General, Photos, Documents, Videos, Other",
  x.category
 );

 if(c===null)return;

 if(![
  "General",
  "Photos",
  "Documents",
  "Videos",
  "Other"
 ].includes(c)){
  alert("Invalid category");
  return;
 }

 x.category=c;

 await saveFeature(x);
 await renderFiles();
}


/* FILE LIST */

async function loadFiles(){

 try{

  const r=await api("/api/photos");

  files=Array.isArray(r)?r:(r.files||[]);

  $("fileCount").textContent=files.length;

  await renderFiles();

 }catch(e){
  say("fileMsg",e.message);
 }
}

async function renderFiles(){

 const search=$("fileSearch").value.toLowerCase();
 const filter=$("fileCategoryFilter").value;

 $("files").innerHTML="";

 for(const f of files){

  const x=await getFeature(f);
  const name=x.name||f.filename;

  if(
   search &&
   !name.toLowerCase().includes(search)
  )continue;

  if(filter && x.category!==filter)continue;

  const d=document.createElement("div");

  d.className="file";

  d.innerHTML=`
   <div class="preview">📄</div>

   <div class="fileinfo">

    <div class="filename">${esc(name)}</div>

    <div class="filecategory">
     ${esc(x.category)}
    </div>

    <div class="small">
     ${Math.round((f.file_size||0)/1024)} KB
    </div>

    <div class="actions">
     <button>View</button>
     <button>Download</button>
     <button>Rename</button>
     <button>Category</button>
     <button class="danger">Delete</button>
    </div>

   </div>
  `;

  const p=d.querySelector(".preview");

  if(f.file_type?.startsWith("image/")){
   fileURL(f).then(u=>{
    p.innerHTML=`<img src="${u}">`;
   }).catch(()=>{});
  }

  if(f.file_type?.startsWith("video/")){
   fileURL(f).then(u=>{
    p.innerHTML=
     `<video src="${u}" muted playsinline controls></video>`;
   }).catch(()=>{});
  }

  const b=d.querySelectorAll("button");

  b[0].onclick=()=>viewFile(f);
  b[1].onclick=()=>downloadFile(f);
  b[2].onclick=()=>renameFile(f);
  b[3].onclick=()=>categoryFile(f);

  b[4].onclick=async()=>{

   if(!confirm("Delete this file?"))return;

   try{

    await api("/api/photos/"+f.id,{
     method:"DELETE"
    });

    await loadFiles();

   }catch(e){
    say("fileMsg",e.message);
   }
  };

  $("files").append(d);
 }
}


/* VIEW */

async function viewFile(f){

 try{

  const u=await fileURL(f);

  window.open(u,"_blank");

 }catch(e){
  say("fileMsg",e.message);
 }
}


/* DOWNLOAD */

async function downloadFile(f){

 try{

  const data=await fileData(f);

  const u=URL.createObjectURL(
   new Blob([data],{
    type:f.file_type||"application/octet-stream"
   })
  );

  const a=document.createElement("a");

  a.href=u;
  a.download=f.filename||"download";

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(u),1000);

 }catch(e){
  say("fileMsg",e.message);
 }
}


/* UPLOAD */

async function uploadFile(){

 try{

  if(!key){
   say("fileMsg","Unlock vault first.");
   return;
  }

  const input=$("fileInput");
  const f=input.files[0];

  if(!f){
   say("fileMsg","Select a file first.");
   return;
  }

  if(f.size>60*1024*1024){
   say("fileMsg","Maximum file size is 60 MB.");
   return;
  }

  say("fileMsg","Encrypting and uploading...");

  const plain=await f.arrayBuffer();

  const iv=crypto.getRandomValues(
   new Uint8Array(12)
  );

  const encrypted=await crypto.subtle.encrypt(
   {name:"AES-GCM",iv},
   key,
   plain
  );

  const out=new Uint8Array(
   12+encrypted.byteLength
  );

  out.set(iv,0);
  out.set(new Uint8Array(encrypted),12);

  await fetch(API+"/api/photos",{
   method:"POST",
   credentials:"include",
   headers:{
    "X-Filename":f.name,
    "X-File-Type":f.type||"application/octet-stream"
   },
   body:out
  }).then(async r=>{
   if(!r.ok){
    let x={};
    try{x=await r.json()}catch{}
    throw Error(x.error||"Upload failed.");
   }
  });

  input.value="";

  say("fileMsg","Upload complete.");

  await loadFiles();

 }catch(e){

  say("fileMsg",e.message);

 }
}


/* START */

status();

</script>

</body>
</html>
