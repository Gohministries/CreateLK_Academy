</style></head><body><header><div class="nav"><div class="logo">
📚 CreateLK Academy
</div><a
href="dashboard.html"
class="back">

← Dashboard

</a></div></header><main class="container"><div class="title"><h1>
🤝 Affiliate Admin
</h1><p>
Review and approve affiliate referrals.
</p></div><div
id="message"
class="message">
</div><!-- ADMIN LOGIN --><div class="card"><h2>
🔐 Admin Access
</h2><p
style="color:#667085;font-size:14px;">Enter your affiliate admin key.

</p><input
id="adminKey"
type="password"
placeholder="Enter ADMIN_KEY">

<button
class="load"
onclick="loadReferrals()">

🔄 Load Pending Referrals

</button></div><!-- REFERRALS --><div
id="referralsCard"
class="card"
style="display:none;"><h2>
⏳ Pending Affiliate Referrals
</h2><div
id="referrals"></div></div></main><footer>© 2026 CreateLK Academy.
All rights reserved.

</footer><script>


/* =====================================
   SETTINGS
===================================== */

const API =
"https://createlk-affiliate-admin.createlk.workers.dev";


const COMMISSION_RATE = 20;


/* =====================================
   MESSAGE
===================================== */

function showMessage(text){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.style.display =
"block";

}


/* =====================================
   ADMIN KEY
===================================== */

function getAdminKey(){

return document
.getElementById(
"adminKey"
)
.value
.trim();

}


/* =====================================
   LOAD REFERRALS
===================================== */

async function loadReferrals(){

const key =
getAdminKey();


if(!key){

showMessage(
"Please enter the admin key."
);

return;

}


showMessage(
"Loading pending referrals..."
);


try{

const response =
await fetch(
API +
"/api/admin/pending-referrals",
{
method:"GET",

headers:{
"X-Admin-Key":key
}

}
);


const data =
await response.json();


if(!response.ok ||
!data.success){

showMessage(
data.message ||
"Unable to load referrals."
);

return;

}


document.getElementById(
"referralsCard"
).style.display =
"block";


renderReferrals(
data.referrals || []
);


showMessage(
"Pending referrals loaded."
);


}catch(error){

console.error(error);

showMessage(
"Unable to connect to Affiliate Admin API."
);

}

}


/* =====================================
   RENDER REFERRALS
===================================== */

function renderReferrals(
list
){

const container =
document.getElementById(
"referrals"
);


container.innerHTML = "";


if(!list.length){

container.innerHTML = `

<div class="empty">

✅ No pending affiliate referrals.

</div>

`;

return;

}


list.forEach(
referral => {

const card =
document.createElement(
"div"
);

card.className =
"referral";


const affiliateCode =
safe(
referral.affiliate_code
);


const studentName =
safe(
(
referral.first_name || ""
) +
" " +
(
referral.last_name || ""
)
);


const email =
safe(
referral.email
);


const referralId =
Number(
referral.referral_id
);


card.innerHTML = `

<h3>
🤝 Affiliate Referral #${referralId}
</h3>


<div class="row">

<div class="label">
Affiliate Code
</div>

<div class="value">
${affiliateCode}
</div>

</div>


<div class="row">

<div class="label">
Referred Student ID
</div>

<div class="value">
${Number(
referral.referred_student_id || 0
)}
</div>

</div>


<div class="row">

<div class="label">
Student
</div>

<div class="value">
${studentName}
</div>

</div>


<div class="row">

<div class="label">
Email
</div>

<div class="value">
${email}
</div>

</div>


<div class="row">

<div class="label">
Referral Date
</div>

<div class="value">
${safe(
referral.created_at || "-"
)}
</div>

</div>


<div class="row">

<div class="label">
Status
</div>

<div class="value">

<span class="badge pending">
PENDING
</span>

</div>

</div>


<div class="info">

💰 Commission is calculated at
<strong>20%</strong> of the student's
approved Premium payment.

<br><br>

For a LKR 1,500 Premium payment:

<strong>
LKR 300 commission
</strong>

</div>


<label
style="
display:block;
margin-top:15px;
font-size:13px;
font-weight:bold;
">

Approved Premium Payment Amount

</label>


<input
id="amount-${referralId}"
type="number"
min="1"
step="0.01"
value="1500"
placeholder="Example: 1500">


<div
id="commission-${referralId}"
style="
font-size:14px;
color:#16a34a;
font-weight:bold;
margin-top:4px;
">

Commission: LKR 300

</div>


<button
class="approve"
onclick="
approveReferral(
${referralId}
)">

✓ Approve Referral & Add Commission

</button>

`;


container.appendChild(
card
);


/* Commission preview */

const amountInput =
document.getElementById(
"amount-" +
referralId
);

const commissionText =
document.getElementById(
"commission-" +
referralId
);


amountInput.addEventListener(
"input",
function(){

const amount =
Number(
amountInput.value
) || 0;

const commission =
Math.round(
amount *
COMMISSION_RATE /
100 *
100
) / 100;

commissionText.textContent =
"Commission: LKR " +
commission.toLocaleString();

}
);

});

}


/* =====================================
   APPROVE
===================================== */

async function approveReferral(
referralId
){

const key =
getAdminKey();


if(!key){

alert(
"Admin key is required."
);

return;

}


const amountInput =
document.getElementById(
"amount-" +
referralId
);


const amount =
Number(
amountInput.value
);


if(!amount ||
amount <= 0){

alert(
"Enter a valid Premium payment amount."
);

return;

}


const commission =
Math.round(
amount *
COMMISSION_RATE /
100 *
100
) / 100;


const confirmed =
confirm(

"Approve this referral?\n\n" +

"Payment: LKR " +
amount.toLocaleString() +

"\nCommission: LKR " +
commission.toLocaleString()

);


if(!confirmed){

return;

}


showMessage(
"Approving affiliate referral..."
);


try{

const response =
await fetch(
API +
"/api/admin/approve-referral",
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Key":
key
},

body:JSON.stringify({

referral_id:
referralId,

payment_amount:
amount

})

}
);


const data =
await response.json();


if(!response.ok ||
!data.success){

alert(
data.message ||
"Unable to approve referral."
);

showMessage(
data.message ||
"Approval failed."
);

return;

}


alert(

"✅ Referral approved successfully!\n\n" +

"Commission: LKR " +
Number(
data.commission?.amount || commission
).toLocaleString()

);


showMessage(
"✅ Affiliate commission approved successfully."
);


/* Reload */

setTimeout(
function(){

loadReferrals();

},
500
);


}catch(error){

console.error(error);

showMessage(
"Unable to connect to Affiliate Admin API."
);

}

}


/* =====================================
   SECURITY
===================================== */

function safe(value){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


</script></body></html>
