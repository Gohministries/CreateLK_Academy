/* =====================================
   SETTINGS
===================================== */

const PAYOUT_API =
"https://createlk-affiliate-payout.createlk.workers.dev";


/* =====================================
   MESSAGE
===================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " +
(type || "");

box.style.display =
"block";

}


/* =====================================
   LOAD PAYOUT
===================================== */

async function loadPayout(){

const key =
document
.getElementById(
"adminKey"
)
.value
.trim();


const affiliateId =
Number(
document
.getElementById(
"affiliateId"
)
.value
);


if(!key){

showMessage(
"Please enter the Admin Key.",
"error"
);

return;

}


if(!affiliateId){

showMessage(
"Please enter an Affiliate ID.",
"error"
);

return;

}


const button =
document.getElementById(
"loginButton"
);

button.disabled =
true;

button.textContent =
"⏳ Loading...";


showMessage(
"Checking payout status...",
"success"
);


try{


/*
The status endpoint is confirmed
to work with your Worker.
*/

const response =
await fetch(

PAYOUT_API +
"/api/payout/status?affiliate_id=" +
encodeURIComponent(
affiliateId
),

{
method:"GET",

headers:{
"Accept":
"application/json"
}

}

);


let data = null;


try{

data =
await response.json();

}catch(error){

throw new Error(
"Worker returned an invalid response."
);

}


if(!response.ok){

throw new Error(
data.message ||
"Payout Worker returned an error."
);

}


if(!data.success){

throw new Error(
data.message ||
"Unable to load payout."
);

}


/*
Show payout.
*/

document.getElementById(
"payoutCard"
).style.display =
"block";


renderPayout(
data.payout,
affiliateId
);


showMessage(
"Payout information loaded successfully.",
"success"
);


}catch(error){

console.error(
"Payout error:",
error
);

showMessage(
error.message ||
"Unable to connect to Payout Worker.",
"error"
);

}finally{

button.disabled =
false;

button.textContent =
"🔓 Load Payout";

}

}


/* =====================================
   RENDER PAYOUT
===================================== */

function renderPayout(
payout,
affiliateId
){

const container =
document.getElementById(
"payoutContainer"
);


if(
!payout
){

container.innerHTML = `

<div class="empty">

✅ No pending payout found
for Affiliate ID
<strong>${affiliateId}</strong>.

</div>

`;

return;

}


const status =
String(
payout.status ||
"PENDING"
).toUpperCase();


let badgeClass =
"pending";


if(status === "PAID"){

badgeClass =
"paid";

}


if(status === "REJECTED"){

badgeClass =
"rejected";

}


container.innerHTML = `

<div class="payout">

<h2>
Payout #${safe(
payout.id
)}
</h2>


<div class="amount">

LKR ${Number(
payout.amount || 0
).toLocaleString()}

</div>


<div class="row">

<div class="label">
Affiliate ID
</div>

<div class="value">
${safe(
payout.affiliate_id
)}
</div>

</div>


<div class="row">

<div class="label">
Student ID
</div>

<div class="value">
${safe(
payout.student_id
)}
</div>

</div>


<div class="row">

<div class="label">
Payment Method
</div>

<div class="value">
${safe(
payout.payment_method ||
"BANK_TRANSFER"
)}
</div>

</div>


<div class="row">

<div class="label">
Status
</div>

<div class="value">

<span class="badge ${badgeClass}">

${safe(status)}

</span>

</div>

</div>


<div class="row">

<div class="label">
Requested At
</div>

<div class="value">
${safe(
payout.requested_at ||
"-"
)}
</div>

</div>


<div class="row">

<div class="label">
Paid At
</div>

<div class="value">
${safe(
payout.paid_at ||
"Not paid"
)}
</div>

</div>


<div class="row">

<div class="label">
Branch
</div>

<div class="value">
${safe(
payout.branch_name ||
"-"
)}
</div>

</div>


<div class="note">

${
status === "PENDING"

?

"⏳ This payout is waiting for admin processing."

:

status === "PAID"

?

"✅ This payout has already been marked as paid."

:

"❌ This payout has been rejected."

}

<br><br>

<strong>
Payout amount:
LKR ${Number(
payout.amount || 0
).toLocaleString()}
</strong>

</div>


</div>

`;

}


/* =====================================
   SECURITY
===================================== */

function safe(value){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
