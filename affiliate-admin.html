<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Payouts | CreateLK Academy</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e7eb}
.nav{max-width:1000px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:800;color:#155eef}
.back{background:#eef4ff;color:#155eef;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:14px}
.container{max-width:1000px;margin:auto;padding:25px 20px 50px}
.title{text-align:center;margin-bottom:25px}
.title h1{margin:0 0 8px;font-size:28px}
.title p{margin:0;color:#667085;font-size:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(16,24,40,.03)}
input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px;margin:8px 0 12px}
button{border:0;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:bold;cursor:pointer}
.login{background:#155eef;color:#fff}
.pay{border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:15px}
.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:14px}
.row:last-child{border-bottom:0}
.label{color:#667085}
.value{font-weight:bold;text-align:right;word-break:break-word}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:bold}
.paid{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.action{width:100%;margin-top:15px;background:#16a34a;color:#fff}
.reject{background:#dc2626}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:18px;font-size:14px;background:#eef4ff;color:#344054}
.empty{text-align:center;padding:30px;color:#667085}
footer{text-align:center;padding:30px;color:#98a2b3;font-size:12px}
@media(max-width:600px){
.nav{padding:14px 15px}
.container{padding:20px 15px 40px}
.row{display:block}
.value{text-align:left;margin-top:3px}
}
</style></head><body><header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header><main class="container"><div class="title">
<h1>💳 Affiliate Payouts</h1>
<p>View and manage affiliate payout requests.</p>
</div><div id="message" class="message"></div><div class="card">
<h2>🔐 Admin Access</h2>
<p style="color:#667085;font-size:14px">
Enter your Admin Key to access affiliate payout requests.
</p><input id="adminKey" type="password" placeholder="Enter Admin Key"><button class="login" onclick="loadPayouts()">
🔓 Login
</button>
</div><div id="payoutCard" class="card" style="display:none">
<h2>💳 Payout Requests</h2>
<div id="payouts"></div>
</div></main><footer>
© 2026 CreateLK Academy. All rights reserved.
</footer><script>

const PAYOUT_API =
"https://createlk-affiliate-payout.createlk.workers.dev";

let ADMIN_KEY = "";


/* =========================
MESSAGE
========================= */

function message(text){

const box =
document.getElementById("message");

box.textContent = text;
box.style.display = "block";

}


/* =========================
LOAD PAYOUTS
========================= */

async function loadPayouts(){

ADMIN_KEY =
document.getElementById("adminKey")
.value
.trim();

if(!ADMIN_KEY){

message("Please enter the Admin Key.");
return;

}

message("Loading payout requests...");

try{

const response =
await fetch(
PAYOUT_API + "/api/admin/payouts",
{
method:"GET",
headers:{
"X-Admin-Key":ADMIN_KEY,
"Accept":"application/json"
}
}
);

const text =
await response.text();

let data;

try{
data = JSON.parse(text);
}catch(e){
throw new Error(
"Server returned an invalid response."
);
}

if(!response.ok){

throw new Error(
data.message ||
"Unable to load payout requests."
);

}

if(!data.success){

throw new Error(
data.message ||
"Unable to load payout requests."
);

}

document.getElementById(
"payoutCard"
).style.display = "block";

renderPayouts(
data.payouts ||
data.requests ||
[]
);

message("Payout requests loaded.");

}catch(error){

console.error(error);

message(
error.message ||
"Failed to connect to Payout Worker."
);

}

}


/* =========================
RENDER
========================= */

function renderPayouts(list){

const box =
document.getElementById("payouts");

box.innerHTML = "";

if(!list.length){

box.innerHTML =
'<div class="empty">✅ No payout requests found.</div>';

return;

}

list.forEach(p => {

const card =
document.createElement("div");

card.className = "pay";

const status =
String(p.status || "PENDING")
.toUpperCase();

let badge = "badge";

if(status === "PAID")
badge += " paid";

if(status === "REJECTED")
badge += " rejected";

card.innerHTML = `

<h3>💳 Payout #${Number(p.id || 0)}</h3>

<div class="row">
<div class="label">Affiliate ID</div>
<div class="value">${Number(p.affiliate_id || 0)}</div>
</div>

<div class="row">
<div class="label">Student ID</div>
<div class="value">${Number(p.student_id || 0)}</div>
</div>

<div class="row">
<div class="label">Amount</div>
<div class="value">
LKR ${Number(p.amount || 0).toLocaleString()}
</div>
</div>

<div class="row">
<div class="label">Payment Method</div>
<div class="value">
${safe(p.payment_method || "-")}
</div>
</div>

<div class="row">
<div class="label">Account Name</div>
<div class="value">
${safe(p.account_name || "-")}
</div>
</div>

<div class="row">
<div class="label">Bank Name</div>
<div class="value">
${safe(p.bank_name || "-")}
</div>
</div>

<div class="row">
<div class="label">Account Number</div>
<div class="value">
${safe(p.account_number || "-")}
</div>
</div>

<div class="row">
<div class="label">Branch</div>
<div class="value">
${safe(p.branch_name || "-")}
</div>
</div>

<div class="row">
<div class="label">Requested</div>
<div class="value">
${safe(p.requested_at || "-")}
</div>
</div>

<div class="row">
<div class="label">Status</div>
<div class="value">
<span class="${badge}">
${safe(status)}
</span>
</div>
</div>

${
status === "PENDING"
?
`
<button
class="action"
onclick="markPaid(${Number(p.id)})">
✅ Mark as PAID
</button>

<button
class="action reject"
onclick="rejectPayout(${Number(p.id)})">
❌ Reject Payout
</button>
`
:
""
}

`;

box.appendChild(card);

});

}


/* =========================
MARK PAID
========================= */

async function markPaid(id){

if(!confirm(
"Mark payout #" + id + " as PAID?"
)) return;

await updatePayout(
id,
"PAID"
);

}


/* =========================
REJECT
========================= */

async function rejectPayout(id){

if(!confirm(
"Reject payout #" + id + "?"
)) return;

await updatePayout(
id,
"REJECTED"
);

}


/* =========================
UPDATE PAYOUT
========================= */

async function updatePayout(id,status){

message("Updating payout...");

try{

const response =
await fetch(
PAYOUT_API + "/api/admin/payout/update",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Admin-Key":ADMIN_KEY
},

body:JSON.stringify({
payout_id:id,
status:status
})

}
);

const text =
await response.text();

let data;

try{
data = JSON.parse(text);
}catch(e){
throw new Error(
"Server returned an invalid response."
);
}

if(!response.ok || !data.success){

throw new Error(
data.message ||
"Unable to update payout."
);

}

message(
"✅ Payout #" + id +
" updated to " + status + "."
);

loadPayouts();

}catch(error){

console.error(error);

message(
error.message ||
"Unable to update payout."
);

}

}


/* =========================
SAFE HTML
========================= */

function safe(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script></body>
</html>
