<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>365 Bible Verses</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#f1f5f9;
color:#1e293b;
font-family:Arial,sans-serif
}

header{
background:linear-gradient(135deg,#172554,#1e3a8a);
color:#fff;
text-align:center;
padding:20px 10px
}

header h1{
margin:0;
font-size:26px
}

header p{
margin:6px 0 0;
font-size:14px
}

main{
max-width:850px;
margin:auto;
padding:12px
}

.box{
background:#fff;
border-radius:12px;
padding:12px;
margin-bottom:12px;
box-shadow:0 2px 10px #0001
}

.search{
display:flex;
gap:8px
}

.search input{
flex:1;
padding:12px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px
}

.search button{
width:45px;
border:0;
border-radius:8px;
background:#e2e8f0;
font-size:18px;
cursor:pointer
}

.days{
display:grid;
grid-template-columns:repeat(15,1fr);
gap:4px;
max-height:210px;
overflow:auto
}

.day{
border:0;
background:#e2e8f0;
padding:7px 2px;
border-radius:6px;
font-size:12px;
cursor:pointer
}

.day.active{
background:#2563eb;
color:#fff
}

.day.saved{
background:#bbf7d0;
color:#166534
}

.verse{
background:#fff;
border-radius:15px;
padding:20px;
box-shadow:0 3px 14px #0001
}

.dayno{
text-align:center;
font-size:13px;
font-weight:bold;
color:#64748b
}

.reference{
text-align:center;
font-size:24px;
font-weight:bold;
color:#172554;
margin-top:5px
}

.section{
border-top:1px solid #e2e8f0;
margin-top:20px;
padding-top:15px
}

.head{
display:flex;
justify-content:flex-end;
align-items:center;
margin-bottom:8px
}

.copy{
border:0;
background:#e2e8f0;
padding:6px 10px;
border-radius:6px;
font-size:11px;
font-weight:bold;
cursor:pointer
}

.text{
font-size:17px;
line-height:1.8;
white-space:pre-wrap
}

.sinhala{
font-family:"Noto Sans Sinhala",sans-serif
}

.tamil{
font-family:"Noto Sans Tamil",sans-serif
}

.nav{
display:flex;
gap:8px;
margin-top:12px
}

.nav button{
flex:1;
border:0;
padding:12px;
border-radius:8px;
background:#172554;
color:#fff;
font-weight:bold;
cursor:pointer
}

.nav button:disabled{
background:#cbd5e1
}

.message{
background:#fff;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 10px #0001
}

.error{
background:#fee2e2;
color:#991b1b
}

footer{
text-align:center;
padding:25px;
font-size:12px;
color:#64748b
}

@media(max-width:600px){

.days{
grid-template-columns:repeat(10,1fr)
}

.reference{
font-size:21px
}

.text{
font-size:16px
}

.verse{
padding:15px
}

}

</style>

</head>

<body>

<header>

<h1>365 Bible Verses</h1>

<p>Daily Bible Verses</p>

</header>


<main>


<div class="box">

<div class="search">

<input
id="search"
type="search"
placeholder="Search day or Bible reference..."
oninput="searchDays"
>

<button onclick="clearSearch()">×</button>

</div>

</div>


<div class="box">

<div id="days" class="days"></div>

</div>


<div id="content">

<div class="message">
Connecting to Bible database...
</div>

</div>


<div class="nav">

<button
id="prev"
onclick="previousDay()"
>
‹ Previous
</button>

<button
id="next"
onclick="nextDay()"
>
Next ›
</button>

</div>


</main>


<footer>
365 Bible Verses
</footer>


<script>

const API_URL=
"https://bible.createlk.workers.dev";

let verses=[];
let currentDay=1;


window.addEventListener(
"load",
function(){

createDays();
loadBibleVerses();

});


function createDays(){

const container=
document.getElementById("days");

for(let i=1;i<=365;i++){

const button=
document.createElement("button");

button.className="day";

button.id="day"+i;

button.innerText=i;

button.onclick=function(){

showDay(i);

};

container.appendChild(button);

}

}


async function loadBibleVerses(){

const content=
document.getElementById("content");

try{

content.innerHTML=`
<div class="message">
Connecting to Bible database...
</div>
`;

const response=
await fetch(
API_URL+"/api/verses",
{
method:"GET",
mode:"cors",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!response.ok){

throw new Error(
"Server returned HTTP "+
response.status
);

}

const text=
await response.text();

if(!text){

throw new Error(
"Cloudflare returned an empty response"
);

}

let result;

try{

result=JSON.parse(text);

}catch(error){

throw new Error(
"Cloudflare did not return valid JSON"
);

}

if(!Array.isArray(result)){

throw new Error(
"API response is not a verse array"
);

}

verses=result;

for(let i=1;i<=365;i++){

const button=
document.getElementById(
"day"+i
);

const exists=
verses.some(
v=>Number(v.day)===i
);

if(exists){

button.classList.add("saved");

}

}

showDay(1);

}catch(error){

console.error(
"365 Bible API ERROR:",
error
);

content.innerHTML=`

<div class="message error">

<strong>
Unable to load Bible verses.
</strong>

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


function showDay(day){

currentDay=day;

document.querySelectorAll(
".day"
).forEach(function(button){

button.classList.remove("active");

});

const selected=
document.getElementById(
"day"+day
);

if(selected){

selected.classList.add("active");

}

const verse=
verses.find(
v=>Number(v.day)===day
);

const content=
document.getElementById("content");

if(!verse){

content.innerHTML=`

<div class="message">

<strong>Day ${day}</strong>

<br><br>

No Bible verse has been added yet.

</div>

`;

updateNavigation();

return;

}


content.innerHTML=`

<div class="verse">

<div class="dayno">
DAY ${escapeHTML(verse.day)}
</div>

<div class="reference">
${escapeHTML(verse.reference)}
</div>


<!-- SINHALA -->

<div class="section">

<div class="head">

<button
class="copy"
onclick="copyText('sinhala')"
>
Copy
</button>

</div>

<div
id="sinhala"
class="text sinhala"
>${escapeHTML(verse.sinhala)}</div>

</div>


<!-- TAMIL -->

<div class="section">

<div class="head">

<button
class="copy"
onclick="copyText('tamil')"
>
Copy
</button>

</div>

<div
id="tamil"
class="text tamil"
>${escapeHTML(verse.tamil)}</div>

</div>


<!-- ENGLISH -->

<div class="section">

<div class="head">

<button
class="copy"
onclick="copyText('english')"
>
Copy
</button>

</div>

<div
id="english"
class="text"
>${escapeHTML(verse.english)}</div>

</div>

</div>

`;

updateNavigation();

}


function updateNavigation(){

document.getElementById(
"prev"
).disabled=
currentDay<=1;

document.getElementById(
"next"
).disabled=
currentDay>=365;

}


function previousDay(){

if(currentDay>1){

showDay(
currentDay-1
);

}

}


function nextDay(){

if(currentDay<365){

showDay(
currentDay+1
);

}

}


function searchDays(){

const query=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

for(let i=1;i<=365;i++){

const button=
document.getElementById(
"day"+i
);

const verse=
verses.find(
v=>Number(v.day)===i
);

if(!query){

button.style.display="";

continue;

}

const match=
String(i).includes(query) ||

(
verse &&
String(
verse.reference||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.english||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.sinhala||""
)
.toLowerCase()
.includes(query)
) ||

(
verse &&
String(
verse.tamil||""
)
.toLowerCase()
.includes(query)
);

button.style.display=
match ? "" : "none";

}

}


function clearSearch(){

document.getElementById(
"search"
).value="";

searchDays();

}


async function copyText(id){

const element=
document.getElementById(id);

if(!element)return;

const text=
element.innerText;

try{

await navigator.clipboard.writeText(
text
);

alert("Copied");

}catch(error){

const textarea=
document.createElement("textarea");

textarea.value=text;

document.body.appendChild(
textarea
);

textarea.select();

document.execCommand("copy");

textarea.remove();

alert("Copied");

}

}


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
