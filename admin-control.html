<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e7eb}
.nav{max-width:900px;margin:auto;padding:15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:800;color:#155eef}
.back{background:#eef4ff;color:#155eef;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:13px}
.container{max-width:900px;margin:auto;padding:22px 14px 50px}
.title{text-align:center;margin-bottom:20px}
.title h1{font-size:25px;margin-bottom:7px}
.title p{font-size:13px;color:#667085}
.login,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.login{max-width:480px;margin-left:auto;margin-right:auto}
.login h2{font-size:18px;margin-bottom:7px}
.login p{font-size:13px;color:#667085;margin-bottom:12px}
input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px;margin-bottom:10px;font-size:14px}
button{border:0;border-radius:8px;padding:11px 13px;font-weight:bold;cursor:pointer}
.loginbtn{width:100%;background:#155eef;color:#fff}
.message{display:none;padding:11px;border-radius:8px;margin-bottom:15px;text-align:center;font-size:13px}
.ok{display:block;background:#ecfdf3;color:#027a48}
.err{display:block;background:#fff1f2;color:#be123c}
#panel{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{background:#eef4ff;color:#155eef}
.tab.active{background:#155eef;color:#fff}
.section{display:none}
.section.active{display:block}
.refresh{width:100%;background:#eef4ff;color:#155eef;margin-bottom:14px}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid #eee;margin-bottom:10px}
.card-title h3{font-size:16px}
.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold;background:#fff7ed;color:#c2410c}
.badge.approved,.badge.paid{background:#ecfdf3;color:#15803d}
.badge.rejected{background:#fff1f2;color:#be123c}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
.label{color:#667085}
.value{text-align:right;font-weight:bold;word-break:break-word}
.amount{font-size:20px;font-weight:800;color:#15803d;padding:12px 0}
.receipt{display:block;width:100%;text-align:center;text-decoration:none;background:#eef4ff;color:#155eef;padding:11px;border-radius:8px;font-weight:bold;margin-top:12px}
.copy{width:100%;margin-top:8px;background:#f2f4f7;color:#344054}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.approve{background:#16a34a;color:white}
.reject{background:#dc2626;color:white}
.bank{background:#f9fafb;border-radius:10px;padding:12px;margin-top:12px}
.bank h4{font-size:14px;margin-bottom:8px}
.bankrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:13px}
.bankrow:last-child{border-bottom:0}
.bankvalue{text-align:right;font-weight:bold;word-break:break-word}
.smallcopy{background:#eef4ff;color:#155eef;padding:5px 7px;font-size:10px;margin-left:5px}
.empty{text-align:center;padding:25px;color:#667085;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
.loading{text-align:center;padding:25px;color:#667085}
footer{text-align:center;padding:25px;color:#98a2b3;font-size:11px}

@media(max-width:600px){
.nav{padding:13px}
.container{padding:20px 12px 40px}
.tabs{grid-template-columns:1fr}
.row{display:block}
.value{text-align:left;margin-top:3px}
.actions{grid-template-columns:1fr}
.bankrow{align-items:flex-start}
.bankvalue{text-align:right}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a href="dashboard.html" class="back">← Dashboard</a>
</div>
</header>

<main class="container">

<div class="title">
<h1>🔐 Admin Control</h1>
<p>Student Payments & Affiliate Payouts</p>
</div>

<div id="message" class="message"></div>

<div id="loginBox" class="login">

<h2>🔐 Admin Access</h2>

<p>
Use the same Cloudflare Admin Key for payments and payouts.
</p>

<input
id="adminKey"
type="password"
placeholder="Enter Admin Key"
autocomplete="off">

<button class="loginbtn" onclick="login()">
🔐 Load Admin
</button>

</div>


<div id="panel">

<div class="tabs">

<button
id="tabPayments"
class="tab active"
onclick="openTab('payments')">
💳 Payments
</button>

<button
id="tabPayouts"
class="tab"
onclick="openTab('payouts')">
🤝 Affiliate Payouts
</button>

</div>


<!-- PAYMENTS -->

<section id="payments" class="section active">

<button class="refresh" onclick="loadPayments()">
🔄 Load Payments
</button>

<div id="paymentList">
<div class="loading">Loading...</div>
</div>

</section>


<!-- PAYOUTS -->

<section id="payouts" class="section">

<button class="refresh" onclick="loadPayouts()">
🔄 Load Payout Requests
</button>

<div id="payoutList">
<div class="loading">Loading...</div>
</div>

</section>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

const API =
"https://admin-approval.createlk.workers.dev";

let ADMIN_KEY = "";


/* MESSAGE */

function showMessage(text,error=false){

const box=document.getElementById("message");

box.textContent=text;

box.className=
"message " + (error ? "err" : "ok");

}


/* LOGIN */

async function login(){

const key=
document.getElementById("adminKey").value.trim();

if(!key){

showMessage("Please enter the Admin Key.",true);
return;

}

ADMIN_KEY=key;

try{

const response=
await fetch(
API+"/api/admin/check",
{
headers:{
"X-Admin-Key":ADMIN_KEY
}
}
);

const data=
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message || "Invalid Admin Key."
);

}

document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";

showMessage("Admin access granted.");

loadPayments();

}catch(error){

ADMIN_KEY="";

showMessage(
error.message || "Invalid Admin Key.",
true
);

}

}


/* TABS */

function openTab(tab){

document.getElementById("payments")
.classList.remove("active");

document.getElementById("payouts")
.classList.remove("active");

document.getElementById("tabPayments")
.classList.remove("active");

document.getElementById("tabPayouts")
.classList.remove("active");

if(tab==="payments"){

document.getElementById("payments")
.classList.add("active");

document.getElementById("tabPayments")
.classList.add("active");

loadPayments();

}else{

document.getElementById("payouts")
.classList.add("active");

document.getElementById("tabPayouts")
.classList.add("active");

loadPayouts();

}

}


/* PAYMENTS */

async function loadPayments(){

const box=
document.getElementById("paymentList");

box.innerHTML=
'<div class="loading">⏳ Loading payments...</div>';

try{

const response=
await fetch(
API+"/api/admin/payments",
{
headers:{
"X-Admin-Key":ADMIN_KEY
}
}
);

const data=
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message || "Unable to load payments."
);

}

renderPayments(
data.payments ||
data.results ||
data.data ||
[]
);

}catch(error){

box.innerHTML=
'<div class="empty">❌ '+
safe(error.message)+
'</div>';

}

}


/* RENDER PAYMENTS */

function renderPayments(list){

const box=
document.getElementById("paymentList");

box.innerHTML="";

if(!list.length){

box.innerHTML=
'<div class="empty">📭 No payments found.</div>';

return;

}

list.forEach(p=>{

const id=
p.id || p.payment_id || "";

const status=
String(p.status || "PENDING").toUpperCase();

const amount=
Number(p.amount || p.sale_amount || 1500);

const receipt=
p.receipt_url ||
p.receiptUrl ||
p.slip_url ||
p.payment_slip ||
"";

const name=
p.student_name ||
p.name ||
[p.first_name,p.last_name]
.filter(Boolean).join(" ") ||
"Not available";

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="card-title">

<h3>💳 Payment #${safe(id)}</h3>

<span class="badge ${status.toLowerCase()}">
${safe(status)}
</span>

</div>

${row("Student",name)}

${row("Email",p.email || "-")}

${row("Phone",p.phone || "-")}

${row("Student ID",p.student_id || "-")}

${row(
"Payment Reference",
p.payment_reference ||
p.transaction_reference ||
p.reference ||
"-"
)}

${row(
"Payment Date",
p.payment_date ||
p.created_at ||
"-"
)}

<div class="amount">
LKR ${amount.toLocaleString()}
</div>

${
receipt
?
`
<a
class="receipt"
href="${safe(receipt)}"
target="_blank"
rel="noopener">
👁️ View Receipt / Payment Slip
</a>

<button
class="copy"
onclick='copyText(${JSON.stringify(receipt)},this)'>
📋 Copy Receipt Link
</button>
`
:
'<div class="empty">⚠️ Receipt not available</div>'
}

${
status==="PENDING"
?
`
<div class="actions">

<button
class="approve"
onclick="updatePayment(${Number(id)},'APPROVED',this)">
✅ Approve Payment
</button>

<button
class="reject"
onclick="updatePayment(${Number(id)},'REJECTED',this)">
❌ Reject Payment
</button>

</div>
`
:
""
}

`;

box.appendChild(card);

});

}


/* UPDATE PAYMENT */

async function updatePayment(id,status,button){

if(!confirm(
status==="APPROVED"
?"Approve this payment?"
:"Reject this payment?"
)) return;

button.disabled=true;
button.textContent="⏳ Processing...";

try{

const response=
await fetch(
API+"/api/admin/payment/update",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":ADMIN_KEY
},
body:JSON.stringify({
payment_id:Number(id),
status:status
})
}
);

const data=
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message || "Unable to update payment."
);

}

showMessage(
status==="APPROVED"
?"✅ Payment approved. Affiliate commission processed."
:"❌ Payment rejected."
);

loadPayments();

}catch(error){

showMessage(
error.message || "Unable to update payment.",
true
);

button.disabled=false;

button.textContent=
status==="APPROVED"
?"✅ Approve Payment"
:"❌ Reject Payment";

}

}


/* PAYOUTS */

async function loadPayouts(){

const box=
document.getElementById("payoutList");

box.innerHTML=
'<div class="loading">⏳ Loading payout requests...</div>';

try{

const response=
await fetch(
API+"/api/admin/payouts",
{
headers:{
"X-Admin-Key":ADMIN_KEY
}
}
);

const data=
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message ||
"Unable to load payout requests."
);

}

renderPayouts(
data.payouts ||
data.requests ||
data.results ||
[]
);

}catch(error){

box.innerHTML=
'<div class="empty">❌ '+
safe(error.message)+
'</div>';

}

}


/* RENDER PAYOUTS */

function renderPayouts(list){

const box=
document.getElementById("payoutList");

box.innerHTML="";

if(!list.length){

box.innerHTML=
'<div class="empty">📭 No payout requests found.</div>';

return;

}

list.forEach(p=>{

const id=
p.id || p.payout_id || "";

const status=
String(p.status || "PENDING").toUpperCase();

const amount=
Number(p.amount || 0);

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="card-title">

<h3>💳 Payout #${safe(id)}</h3>

<span class="badge ${status.toLowerCase()}">
${safe(status)}
</span>

</div>

${row("Affiliate ID",p.affiliate_id || "-")}

${row("Affiliate Code",p.affiliate_code || "-")}

${row("Email",p.email || "-")}

<div class="amount">
LKR ${amount.toLocaleString()}
</div>

<div class="bank">

<h4>🏦 Bank Details Submitted by Affiliate</h4>

${bankRow(
"Account Name",
p.account_name ||
p.bank_account_name ||
"-"
)}

${bankRow(
"Bank Name",
p.bank_name ||
"-"
)}

${bankRow(
"Account Number",
p.account_number ||
p.bank_account_number ||
"-"
)}

${bankRow(
"Branch",
p.branch_name ||
p.branch ||
"-"
)}

</div>

${row(
"Requested",
p.requested_at ||
p.created_at ||
"-"
)}

${
status==="PENDING"
?
`
<div class="actions">

<button
class="approve"
onclick="updatePayout(${Number(id)},'PAID',this)">
✅ Mark as Paid
</button>

<button
class="reject"
onclick="updatePayout(${Number(id)},'REJECTED',this)">
❌ Reject Payout
</button>

</div>
`
:
""
}

`;

box.appendChild(card);

});

}


/* UPDATE PAYOUT */

async function updatePayout(id,status,button){

if(!confirm(
status==="PAID"
?"Mark this payout as PAID?"
:"Reject this payout?"
)) return;

button.disabled=true;
button.textContent="⏳ Processing...";

try{

const response=
await fetch(
API+"/api/admin/payout/update",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":ADMIN_KEY
},
body:JSON.stringify({
payout_id:Number(id),
status:status
})
}
);

const data=
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message ||
"Unable to update payout."
);

}

showMessage(
status==="PAID"
?"✅ Payout marked as PAID."
:"❌ Payout rejected."
);

loadPayouts();

}catch(error){

showMessage(
error.message ||
"Unable to update payout.",
true
);

button.disabled=false;

button.textContent=
status==="PAID"
?"✅ Mark as Paid"
:"❌ Reject Payout";

}

}


/* ROW */

function row(label,value){

return `
<div class="row">
<div class="label">${safe(label)}</div>
<div class="value">${safe(value)}</div>
</div>
`;

}


/* BANK ROW */

function bankRow(label,value){

const text=String(value ?? "-");

return `
<div class="bankrow">

<div>${safe(label)}</div>

<div class="bankvalue">

${safe(text)}

<button
class="smallcopy"
onclick='copyText(${JSON.stringify(text)},this)'>
📋 Copy
</button>

</div>

</div>
`;

}


/* COPY */

async function copyText(text,button){

try{

await navigator.clipboard.writeText(
String(text)
);

const old=button.textContent;

button.textContent="✅ Copied";

setTimeout(()=>{
button.textContent=old;
},1200);

}catch(e){

alert("Copy failed.");

}

}


/* SAFE HTML */

function safe(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ENTER KEY */

document.getElementById("adminKey")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){
login();
}

});

</script>

</body>
</html>
