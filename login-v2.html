<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Login | CreateLK Academy</title>

<meta name="description"
content="Login to your CreateLK Academy student account.">

<meta name="theme-color" content="#155eef">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#f5f8ff,#fff);
color:#172033;
min-height:100vh;
}

a{
text-decoration:none;
}

header{
background:#fff;
border-bottom:1px solid #e8ebf0;
}

.nav{
max-width:1150px;
min-height:70px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:9px;
font-size:20px;
font-weight:800;
color:#155eef;
}

.logo-icon{
width:40px;
height:40px;
border-radius:11px;
background:#155eef;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.back-link{
color:#475467;
font-size:14px;
font-weight:600;
}

.back-link:hover{
color:#155eef;
}

main{
padding:60px 15px;
}

.card{
max-width:450px;
margin:auto;
background:#fff;
border:1px solid #e4e9f2;
border-radius:22px;
padding:40px 35px;
box-shadow:0 20px 60px rgba(20,40,80,.09);
}

.icon{
text-align:center;
font-size:38px;
margin-bottom:15px;
}

.header{
text-align:center;
margin-bottom:28px;
}

.badge{
display:inline-block;
background:#eef4ff;
color:#155eef;
font-size:11px;
font-weight:800;
padding:6px 10px;
border-radius:20px;
margin-bottom:12px;
}

h1{
font-size:28px;
margin-bottom:8px;
color:#111827;
}

.subtitle{
font-size:14px;
color:#687386;
line-height:1.6;
}

.group{
margin-bottom:18px;
}

label{
display:block;
font-size:13px;
font-weight:700;
color:#344054;
margin-bottom:7px;
}

input{
width:100%;
height:48px;
border:1px solid #d9dee8;
border-radius:9px;
padding:0 13px;
font-size:14px;
outline:none;
background:#fff;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

.password{
position:relative;
}

.password input{
padding-right:65px;
}

.show{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:0;
background:none;
color:#155eef;
font-size:12px;
font-weight:700;
cursor:pointer;
padding:5px;
}

.login{
width:100%;
height:49px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

.login:hover{
background:#0d4dcc;
}

.login:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
font-size:13px;
line-height:1.5;
}

.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.message.success{
display:block;
background:#f0fdf4;
border:1px solid #bbf7d0;
color:#166534;
}

.note{
text-align:center;
font-size:13px;
color:#687386;
margin-top:22px;
}

.note a{
color:#155eef;
font-weight:700;
}

.help{
margin-top:22px;
padding:14px;
background:#f8fafc;
border:1px solid #eaecf0;
border-radius:10px;
text-align:center;
font-size:12px;
color:#667085;
}

.whatsapp{
display:inline-block;
margin-top:9px;
color:#16a34a;
font-weight:700;
}

footer{
text-align:center;
padding:25px;
font-size:12px;
color:#8994a7;
}

@media(max-width:480px){

.nav{
padding:0 15px;
}

.logo{
font-size:17px;
}

.logo-icon{
width:36px;
height:36px;
font-size:18px;
}

main{
padding:40px 15px;
}

.card{
padding:34px 20px;
}

h1{
font-size:25px;
}

}

</style>

</head>

<body>

<header>

<div class="nav">

<a href="index.html" class="logo">

<span class="logo-icon">
📚
</span>

<span>
CreateLK Academy
</span>

</a>

<a href="index.html" class="back-link">
← Home
</a>

</div>

</header>


<main>

<div class="card">

<div class="icon">
🔐
</div>


<div class="header">

<div class="badge">
STUDENT LOGIN
</div>

<h1>
Welcome Back
</h1>

<p class="subtitle">
Sign in to continue your CreateLK Academy learning journey.
</p>

</div>


<form id="loginForm">


<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
autocomplete="email"
maxlength="120"
required>

</div>


<div class="group">

<label for="password">
Password
</label>

<div class="password">

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
maxlength="100"
required>

<button
type="button"
class="show"
id="showPassword">

Show

</button>

</div>

</div>


<button
type="submit"
class="login"
id="loginButton">

Student Login

</button>


<div
id="message"
class="message">
</div>

</form>


<!-- CORRECT REGISTER LINK -->

<div class="note">

Don't have an account?

<a href="register.html">
Create Student Account
</a>

</div>


<div class="help">

<strong>
Need help?
</strong>

<br>

Contact CreateLK Academy through WhatsApp.

<br>

<a
class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener">

💬 WhatsApp Support

</a>

</div>

</div>

</main>


<footer>

© 2026 CreateLK Academy.
All rights reserved.

</footer>


<script>

/* =========================================================
   CREATE LK ACADEMY
   V2 STUDENT LOGIN
========================================================= */


/* =========================================================
   V2 API
========================================================= */

const API =
"https://createlk-academy-v2-api.createlk.workers.dev";


/* =========================================================
   CORRECT DASHBOARD
========================================================= */

const DASHBOARD =
"dashboard-v2.html";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const messageBox =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

messageBox.textContent =
text;

messageBox.className =
"message " + type;

}


/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

showPassword.addEventListener(
"click",
function(){

if(
passwordInput.type === "password"
){

passwordInput.type =
"text";

showPassword.textContent =
"Hide";

}else{

passwordInput.type =
"password";

showPassword.textContent =
"Show";

}

});


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;


/* =======================================================
   VALIDATION
======================================================= */

if(!email){

showMessage(
"Please enter your email address.",
"error"
);

emailInput.focus();

return;

}


if(!password){

showMessage(
"Please enter your password.",
"error"
);

passwordInput.focus();

return;

}


if(password.length < 8){

showMessage(
"Password must contain at least 8 characters.",
"error"
);

passwordInput.focus();

return;

}


/* =======================================================
   BUTTON
======================================================= */

loginButton.disabled =
true;

loginButton.textContent =
"Signing In...";


try{


/* =======================================================
   V2 LOGIN API
======================================================= */

const response =
await fetch(
API + "/api/v2/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}
);


/* =======================================================
   RESPONSE
======================================================= */

const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch(error){

console.error(
"API RESPONSE:",
text
);

throw new Error(
"Invalid response from Membership API."
);

}


/* =======================================================
   CHECK RESPONSE
======================================================= */

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* =======================================================
   STUDENT DATA
======================================================= */

if(!data.student){

throw new Error(
"Login successful, but student information was not returned."
);

}


/* =======================================================
   SAVE STUDENT
======================================================= */

const student =
JSON.stringify(
data.student
);


/* Session */

sessionStorage.setItem(
"createlk_student",
student
);

sessionStorage.setItem(
"createlk_logged_in",
"true"
);


/* Local storage */

localStorage.setItem(
"createlk_student",
student
);

localStorage.setItem(
"createlk_logged_in",
"true"
);


/* =======================================================
   TOKEN
======================================================= */

if(data.token){

sessionStorage.setItem(
"createlk_student_token",
data.token
);

localStorage.setItem(
"createlk_student_token",
data.token
);

}


/* =======================================================
   SUCCESS
======================================================= */

showMessage(
"Login successful! Opening your dashboard...",
"success"
);

loginButton.textContent =
"Opening Dashboard...";


/* =======================================================
   DIRECT DASHBOARD
======================================================= */

setTimeout(
function(){

window.location.replace(
DASHBOARD
);

},
700
);


}catch(error){

console.error(
"CREATE LK LOGIN ERROR:",
error
);

showMessage(
error.message ||
"Unable to login. Please try again.",
"error"
);

loginButton.disabled =
false;

loginButton.textContent =
"Student Login";

}

});


/* =========================================================
   DEBUG
========================================================= */

console.log(
"CreateLK Academy V2 Login loaded."
);

console.log(
"Login API:",
API + "/api/v2/login"
);

console.log(
"Register:",
"register.html"
);

console.log(
"Dashboard:",
DASHBOARD
);

</script>

</body>

</html>
