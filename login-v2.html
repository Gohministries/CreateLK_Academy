<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f5f8ff,#fff);
color:#172033;
min-height:100vh
}
header{
background:#fff;
border-bottom:1px solid #e8ebf0;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center
}
.logo{color:#155eef;font-weight:800;font-size:20px}
header a{text-decoration:none;color:#475467}
main{padding:60px 15px}
.card{
max-width:450px;
margin:auto;
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 15px 50px #14285018
}
.icon{text-align:center;font-size:38px}
h1{text-align:center;margin:12px 0 8px}
p{text-align:center;color:#687386;font-size:14px}
label{
display:block;
font-size:13px;
font-weight:bold;
margin:18px 0 7px
}
input{
width:100%;
height:48px;
padding:12px;
border:1px solid #d9dee8;
border-radius:8px;
font-size:14px
}
.password{position:relative}
.password button{
position:absolute;
right:8px;
top:9px;
height:30px;
border:0;
background:none;
color:#155eef;
font-weight:bold
}
.login{
width:100%;
height:48px;
margin-top:22px;
border:0;
border-radius:8px;
background:#155eef;
color:white;
font-weight:bold;
font-size:15px
}
.login:disabled{opacity:.6}
.msg{
margin-top:15px;
padding:12px;
border-radius:8px;
font-size:13px;
display:none
}
.error{display:block;background:#fff1f2;color:#be123c}
.success{display:block;background:#f0fdf4;color:#166534}
.note{text-align:center;margin-top:20px}
.note a{color:#155eef;font-weight:bold}
.help{
margin-top:20px;
padding:12px;
background:#f8fafc;
text-align:center;
font-size:12px
}
.help a{color:#16a34a;font-weight:bold}
footer{text-align:center;padding:25px;color:#8994a7;font-size:12px}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">📚 CreateLK Academy</a>
<a href="index.html">← Home</a>
</header>

<main>
<div class="card">

<div class="icon">🔐</div>

<h1>Welcome Back</h1>

<p>Sign in to continue your CreateLK Academy learning journey.</p>

<form id="loginForm">

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required>

<label>Password</label>

<div class="password">
<input id="password" type="password" placeholder="Enter your password" required>
<button type="button" id="show">Show</button>
</div>

<button class="login" id="loginButton" type="submit">
Student Login
</button>

<div id="message" class="msg"></div>

</form>

<div class="note">
Don't have an account?
<a href="register-v2.html">Create Student Account</a>
</div>

<div class="help">
Need help?<br>
<a href="https://wa.me/94771190395" target="_blank">
💬 WhatsApp Support
</a>
</div>

</div>
</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

const API="https://createlk-academy-v2-api.createlk.workers.dev";
const form=document.getElementById("loginForm");
const email=document.getElementById("email");
const password=document.getElementById("password");
const button=document.getElementById("loginButton");
const message=document.getElementById("message");

document.getElementById("show").onclick=()=>{
password.type=password.type==="password"?"text":"password";
document.getElementById("show").textContent=
password.type==="password"?"Show":"Hide";
};

function msg(text,type){
message.textContent=text;
message.className="msg "+type;
}

form.onsubmit=async(e)=>{
e.preventDefault();

const em=email.value.trim().toLowerCase();
const pw=password.value;

if(!em||!pw){
msg("Please enter your email and password.","error");
return;
}

if(pw.length<8){
msg("Password must contain at least 8 characters.","error");
return;
}

button.disabled=true;
button.textContent="Signing In...";

try{

const response=await fetch(API+"/api/v2/login",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
email:em,
password:pw
})
});

const data=await response.json();

if(!response.ok||data.success!==true){
throw new Error(data.message||"Invalid email or password.");
}

sessionStorage.setItem(
"createlk_student",
JSON.stringify(data.student)
);

if(data.token){
sessionStorage.setItem(
"createlk_student_token",
data.token
);
}

sessionStorage.setItem(
"createlk_logged_in",
"true"
);

msg("Login successful! Opening dashboard...","success");

button.textContent="Opening Dashboard...";

setTimeout(()=>{
window.location.href="dashboard-v2.html";
},700);

}catch(error){

console.error(error);

msg(
error.message||"Unable to login. Please try again.",
"error"
);

button.disabled=false;
button.textContent="Student Login";

}

};

</script>

</body>
</html>
