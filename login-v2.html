<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | CreateLK Academy</title>
<meta name="theme-color" content="#155eef">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#f5f8ff,#fff);
color:#172033;
min-height:100vh
}
a{text-decoration:none}
header{
background:#fff;
border-bottom:1px solid #e8ebf0
}
.nav{
max-width:1150px;
min-height:70px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between
}
.logo{
display:flex;
align-items:center;
gap:9px;
font-size:20px;
font-weight:800;
color:#155eef
}
.logo-icon{
width:40px;height:40px;border-radius:11px;
background:#155eef;
display:flex;align-items:center;justify-content:center;
font-size:20px
}
.back-link{color:#475467;font-size:14px;font-weight:600}
main{padding:60px 15px}
.card{
max-width:480px;
margin:auto;
background:#fff;
border:1px solid #e4e9f2;
border-radius:22px;
padding:40px 35px;
box-shadow:0 20px 60px rgba(20,40,80,.09)
}
.icon{
width:62px;height:62px;margin:0 auto 18px;
border-radius:17px;background:#eef4ff;
display:flex;align-items:center;justify-content:center;
font-size:30px
}
.header{text-align:center;margin-bottom:28px}
.badge{
display:inline-block;
background:#eef4ff;
color:#155eef;
font-size:11px;
font-weight:800;
padding:6px 10px;
border-radius:20px;
margin-bottom:12px
}
h1{font-size:28px;margin-bottom:8px}
.subtitle{font-size:14px;color:#687386;line-height:1.6}
.group{margin-bottom:18px}
label{
display:block;
font-size:13px;
font-weight:700;
color:#344054;
margin-bottom:7px
}
input{
width:100%;
height:48px;
border:1px solid #d9dee8;
border-radius:9px;
padding:0 13px;
font-size:14px;
outline:none
}
input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1)
}
.password{position:relative}
.password input{padding-right:65px}
.show{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:0;
background:none;
color:#155eef;
font-size:12px;
font-weight:bold;
cursor:pointer
}
button.login{
width:100%;
height:49px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer
}
button.login:disabled{opacity:.6}
.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:9px;
font-size:13px;
line-height:1.5
}
.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c
}
.message.success{
display:block;
background:#f0fdf4;
border:1px solid #bbf7d0;
color:#166534
}
.note{
text-align:center;
font-size:13px;
color:#687386;
margin-top:22px
}
.note a{color:#155eef;font-weight:700}
.help{
margin-top:25px;
padding:14px;
background:#f8fafc;
border:1px solid #eaecf0;
border-radius:10px;
text-align:center;
font-size:12px;
color:#667085
}
.whatsapp{
display:inline-block;
margin-top:10px;
color:#16a34a;
font-weight:700
}
footer{
text-align:center;
padding:25px;
font-size:12px;
color:#8994a7
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">
<span class="logo-icon">📚</span>
<span>CreateLK Academy</span>
</a>
<a href="index.html" class="back-link">← Home</a>
</div>
</header>

<main>
<div class="card">

<div class="icon">🔐</div>

<div class="header">
<div class="badge">STUDENT LOGIN</div>
<h1>Welcome Back</h1>
<p class="subtitle">
Sign in to continue your CreateLK Academy learning journey.
</p>
</div>

<form id="loginForm">

<div class="group">
<label>Email Address</label>
<input
id="email"
type="email"
placeholder="Enter your email address"
autocomplete="email"
required>
</div>

<div class="group">
<label>Password</label>

<div class="password">
<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="show"
onclick="togglePassword()">
Show
</button>
</div>
</div>

<button
type="submit"
class="login"
id="loginButton">
Student Login
</button>

<div id="message" class="message"></div>

</form>

<div class="note">
Don't have an account?
<a href="register-v2.html">Create Student Account</a>
</div>

<div class="help">
<strong>Need help?</strong><br>
Contact CreateLK Academy through WhatsApp.

<a
class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener">
💬 WhatsApp Support
</a>
</div>

</div>
</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

<script>

/* =========================================
   WORKING V2 LOGIN API
========================================= */

const API =
"https://createlk-academy-v2-api.createlk.workers.dev";


function togglePassword(){

const input =
document.getElementById("password");

const btn =
document.querySelector(".show");

if(input.type==="password"){

input.type="text";
btn.textContent="Hide";

}else{

input.type="password";
btn.textContent="Show";

}

}


function message(text,type){

const box =
document.getElementById("message");

box.textContent=text;
box.className="message "+type;

}


document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const button =
document.getElementById("loginButton");

const email =
document.getElementById("email")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value;


if(!email){

message(
"Please enter your email address.",
"error"
);

return;

}


if(!password){

message(
"Please enter your password.",
"error"
);

return;

}


button.disabled=true;
button.textContent="Signing In...";


try{

const response =
await fetch(
API+"/api/v2/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const text =
await response.text();

let data;

try{

data=JSON.parse(text);

}catch{

throw new Error(
"Invalid response from the API."
);

}


if(!response.ok ||
data.success!==true){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* SAVE STUDENT */

if(data.student){

sessionStorage.setItem(
"createlk_student",
JSON.stringify(data.student)
);

}


/* SAVE TOKEN IF PROVIDED */

if(data.token){

sessionStorage.setItem(
"createlk_student_token",
data.token
);

}


message(
"Login successful. Opening your dashboard...",
"success"
);


setTimeout(
()=>{
window.location.href=
"student-dashboard-v2.html";
},
800
);


}catch(error){

console.error(error);

message(
error.message ||
"Unable to login. Please try again.",
"error"
);

button.disabled=false;
button.textContent="Student Login";

}

});

</script>

</body>
</html>
