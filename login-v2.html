<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}
.box{
max-width:420px;
margin:70px auto;
padding:25px;
}
.card{
background:#fff;
padding:28px;
border-radius:16px;
border:1px solid #e5e7eb;
box-shadow:0 5px 20px rgba(0,0,0,.06);
}
h1{text-align:center;color:#155eef;margin-bottom:8px}
p{text-align:center;color:#667085}
label{
display:block;
font-weight:bold;
font-size:13px;
margin:18px 0 7px;
}
input{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:14px;
}
button{
width:100%;
margin-top:22px;
padding:13px;
border:0;
border-radius:9px;
background:#155eef;
color:white;
font-weight:bold;
cursor:pointer;
}
#status{
margin-top:15px;
padding:10px;
border-radius:8px;
text-align:center;
font-size:13px;
}
</style>
</head>

<body>

<div class="box">
<div class="card">

<h1>📚 CreateLK Academy</h1>
<p>Student Login</p>

<label>Email</label>
<input id="email" type="email" autocomplete="email">

<label>Password</label>
<input id="password" type="password" autocomplete="current-password">

<button onclick="login()">Login</button>

<div id="status"></div>

</div>
</div>

<script>

const API =
"https://createlk-academy-v2-api.createlk.workers.dev";

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const status =
document.getElementById("status");

if(!email || !password){

status.textContent =
"Please enter your email and password.";

return;
}

status.textContent="Logging in...";

try{

const response =
await fetch(API + "/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})

});

const data =
await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message || "Login failed."
);

}

/*
Expected response:

{
 success:true,
 token:"...",
 student:{
   id:1,
   first_name:"John",
   last_name:"Doe",
   email:"..."
 }
}
*/

const student =
data.student || data.user;

if(!student){

throw new Error(
"Student information was not returned."
);

}

const token =
data.token || data.access_token;

if(!token){

throw new Error(
"Login token was not returned."
);

}

sessionStorage.setItem(
"createlk_student",
JSON.stringify(student)
);

sessionStorage.setItem(
"createlk_student_token",
token
);

sessionStorage.setItem(
"createlk_v2_logged_in",
"true"
);

window.location.href =
"dashboard.html";

}catch(error){

console.error(error);

status.textContent =
error.message ||
"Unable to login.";

}

}

</script>

</body>
</html>
