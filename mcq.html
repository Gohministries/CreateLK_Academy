<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI MCQ | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.nav{
    max-width:900px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#155eef;
    font-size:20px;
    font-weight:800;
}

.back{
    color:#475467;
    text-decoration:none;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    border:1px solid #e5e7eb;
}

.status{
    color:#667085;
    font-size:14px;
    margin:12px 0 20px;
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:18px;
}

.option{
    width:100%;
    padding:14px;
    margin:8px 0;
    text-align:left;
    background:#f8fafc;
    border:1px solid #d0d5dd;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
}

.option:hover{
    background:#eef4ff;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}

.generate{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:9px;
    background:#155eef;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.generate:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.explanation{
    margin-top:18px;
    padding:14px;
    background:#f8fafc;
    border-radius:9px;
    line-height:1.5;
}

.hidden{
    display:none;
}

.locked{
    text-align:center;
    padding:20px;
}

.premium{
    color:#16a34a;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">
← Dashboard
</a>

</div>
</header>


<div class="container">

<div class="card">

<h1>🤖 AI English MCQ</h1>

<div
id="status"
class="status">
Checking Premium membership...
</div>


<div
id="locked"
class="locked hidden">

<h2>🔒 Premium Required</h2>

<p>
Premium membership is required to use
AI English MCQ.
</p>

<a href="premium.html">
Upgrade to Premium
</a>

</div>


<div
id="mcqArea"
class="hidden">

<div
id="question"
class="question">
</div>

<div id="options"></div>

<div
id="explanation"
class="explanation hidden">
</div>

<button
id="nextButton"
class="generate"
onclick="generateQuestion()">

Generate Question

</button>

</div>

</div>

</div>


<script>

const MEMBERSHIP_API =
"https://createlk-membership-api.createlk.workers.dev";

const AI_API =
"https://createlk-ai-mcq.createlk.workers.dev";


const token =
sessionStorage.getItem(
    "createlk_token"
);


const student =
JSON.parse(
    sessionStorage.getItem(
        "createlk_student"
    ) || "null"
);


if(!token || !student){

    window.location.href =
        "login.html";

}


/* ================================
   CHECK MEMBERSHIP
================================ */

async function checkMembership(){

    try{

        const response =
            await fetch(
                MEMBERSHIP_API +
                "/api/membership?student_id=" +
                encodeURIComponent(
                    student.id
                ),
                {
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            showLocked(
                "Unable to verify membership."
            );

            return;
        }


        if(!data.active){

            if(data.status === "pending"){

                showLocked(
                    "⏳ Your payment is waiting for administrator approval."
                );

            }else if(
                data.status === "expired"
            ){

                showLocked(
                    "⚠️ Your Premium membership has expired."
                );

            }else{

                showLocked(
                    "🔒 Premium membership is required."
                );

            }

            return;
        }


        document.getElementById(
            "mcqArea"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "status"
        ).innerHTML =
            '<span class="premium">' +
            '⭐ Premium Active' +
            '</span>';


    }catch(error){

        console.error(error);

        showLocked(
            "Unable to connect to membership server."
        );
    }
}


/* ================================
   GENERATE MCQ
================================ */

async function generateQuestion(){

    const button =
        document.getElementById(
            "nextButton"
        );

    const question =
        document.getElementById(
            "question"
        );

    const options =
        document.getElementById(
            "options"
        );

    const explanation =
        document.getElementById(
            "explanation"
        );


    button.disabled=true;

    button.textContent=
        "Generating...";


    question.textContent=
        "Creating your AI question...";

    options.innerHTML="";

    explanation.classList.add(
        "hidden"
    );


    try{

        const response =
            await fetch(
                AI_API + "/api/mcq",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:JSON.stringify({

                        student_id:
                            student.id

                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            question.textContent =
                data.message ||
                "Unable to generate question.";

            button.disabled=false;

            button.textContent =
                "Try Again";

            return;
        }


        question.textContent =
            data.question;


        Object.entries(
            data.options
        ).forEach(
            ([letter,text])=>{

                const option =
                    document.createElement(
                        "button"
                    );

                option.className =
                    "option";

                option.textContent =
                    letter + ". " + text;

                option.onclick =
                    function(){

                        checkAnswer(
                            option,
                            letter,
                            data.answer,
                            data.explanation
                        );

                    };

                options.appendChild(
                    option
                );

            }
        );


        document.getElementById(
            "status"
        ).textContent =
            "⭐ Premium Active • " +
            data.used +
            "/100 questions used today";


        button.disabled=true;

        button.textContent =
            "Choose an answer";


    }catch(error){

        console.error(error);

        question.textContent =
            "Unable to connect to AI server.";

        button.disabled=false;

        button.textContent =
            "Try Again";
    }
}


/* ================================
   ANSWER
================================ */

function checkAnswer(
    selectedButton,
    selected,
    correct,
    explanationText
){

    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        button =>
            button.disabled=true
    );


    if(selected === correct){

        selectedButton.classList.add(
            "correct"
        );

        document.getElementById(
            "status"
        ).textContent =
            "✅ Correct!";

    }else{

        selectedButton.classList.add(
            "wrong"
        );


        buttons.forEach(
            button => {

                if(
                    button.textContent
                    .startsWith(
                        correct + "."
                    )
                ){

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );


        document.getElementById(
            "status"
        ).textContent =
            "❌ Incorrect.";
    }


    const explanation =
        document.getElementById(
            "explanation"
        );


    explanation.textContent =
        "Explanation: " +
        explanationText;


    explanation.classList.remove(
        "hidden"
    );


    const next =
        document.getElementById(
            "nextButton"
        );


    next.disabled=false;

    next.textContent =
        "Next Question";
}


/* ================================
   LOCKED
================================ */

function showLocked(text){

    document.getElementById(
        "status"
    ).textContent=text;

    document.getElementById(
        "mcqArea"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "locked"
    ).classList.remove(
        "hidden"
    );
}


checkMembership();

</script>

</body>
</html>
