<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI English MCQ | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:19px;
font-weight:800;
color:#155eef;
}

.back{
text-decoration:none;
color:#475467;
font-size:13px;
font-weight:700;
}

.container{
max-width:700px;
margin:25px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.header{
text-align:center;
margin-bottom:25px;
}

.icon{
width:65px;
height:65px;
margin:auto;
border-radius:17px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

h1{
font-size:26px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.5;
}

.progress{
display:flex;
justify-content:space-between;
margin:20px 0;
font-size:13px;
font-weight:bold;
color:#667085;
}

.question{
font-size:20px;
font-weight:800;
line-height:1.5;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:14px;
margin-bottom:10px;
border:1px solid #d0d5dd;
border-radius:10px;
background:#fff;
text-align:left;
font-size:14px;
cursor:pointer;
transition:.15s;
}

.option:hover{
border-color:#155eef;
background:#f8faff;
}

.option.selected{
border-color:#155eef;
background:#eef4ff;
}

.option.correct{
border-color:#16a34a;
background:#ecfdf3;
color:#166534;
}

.option.wrong{
border-color:#dc2626;
background:#fff1f2;
color:#b91c1c;
}

button{
width:100%;
height:48px;
border:0;
border-radius:9px;
background:#155eef;
color:white;
font-size:15px;
font-weight:800;
cursor:pointer;
margin-top:12px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.result{
display:none;
margin-top:18px;
padding:15px;
border-radius:10px;
text-align:center;
font-size:14px;
line-height:1.6;
}

.result.correct{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

.result.wrong{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.stats{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px 8px;
text-align:center;
}

.stat strong{
display:block;
font-size:20px;
color:#155eef;
}

.stat span{
font-size:11px;
color:#667085;
}

.loading{
text-align:center;
padding:35px;
color:#667085;
}

.error{
padding:15px;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
border-radius:10px;
text-align:center;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:500px){

.card{
padding:20px 15px;
}

.question{
font-size:18px;
}

.stats{
grid-template-columns:1fr 1fr 1fr;
}

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>

</header>


<main class="container">

<div class="card">

<div class="header">

<div class="icon">
🤖
</div>

<h1>
AI English MCQ
</h1>

<div class="subtitle">
Practise English and build your correct-answer achievement.
</div>

</div>


<div id="loading" class="loading">
⏳ Loading question...
</div>


<div id="quiz" style="display:none;">

<div class="progress">

<span id="questionNumber">
Question 1
</span>

<span id="score">
Correct: 0
</span>

</div>


<div
id="question"
class="question">
</div>


<div id="options"></div>


<button
id="submitButton"
type="button"
onclick="submitAnswer()"
disabled>

Check Answer

</button>


<div
id="result"
class="result">
</div>


<div class="stats">

<div class="stat">

<strong id="correctCount">
0
</strong>

<span>
Correct Answers
</span>

</div>


<div class="stat">

<strong id="totalCount">
0
</strong>

<span>
Questions
</span>

</div>


<div class="stat">

<strong id="certificateCount">
0
</strong>

<span>
Certificate Progress
</span>

</div>

</div>

</div>

</div>

</main>


<footer>

© 2026 CreateLK Academy. All rights reserved.

</footer>


<script>

/* =========================================
   CONFIGURATION
========================================= */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* =========================================
   STUDENT
========================================= */

let student = null;

try{

const saved =
sessionStorage.getItem(
STUDENT_KEY
);

if(saved){
student = JSON.parse(saved);
}

}catch(error){

console.error(error);

}


if(
!student ||
sessionStorage.getItem(LOGIN_KEY) !== "true"
){

window.location.replace("login.html");

}


const studentId =
student?.id ||
student?.student_id;


if(!studentId){

window.location.replace("login.html");

}


/* =========================================
   QUIZ VARIABLES
========================================= */

let currentQuestion = null;

let selectedAnswer = null;

let correctAnswers = 0;

let totalQuestions = 0;


/* =========================================
   ELEMENTS
========================================= */

const loading =
document.getElementById("loading");

const quiz =
document.getElementById("quiz");

const question =
document.getElementById("question");

const options =
document.getElementById("options");

const submitButton =
document.getElementById("submitButton");

const result =
document.getElementById("result");


/* =========================================
   LOAD QUESTION
========================================= */

async function loadQuestion(){

loading.style.display = "block";

quiz.style.display = "none";

try{

const response =
await fetch(
API_URL +
"/api/mcq?student_id=" +
encodeURIComponent(studentId),
{
method:"GET",
headers:{
"Accept":"application/json"
}
}
);

const data =
await response.json();

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to load question."
);

}


currentQuestion =
data.question;


correctAnswers =
Number(
data.correct_answers || 0
);

totalQuestions =
Number(
data.total_questions || 0
);


document.getElementById(
"correctCount"
).textContent =
correctAnswers;


document.getElementById(
"totalCount"
).textContent =
totalQuestions;


document.getElementById(
"certificateCount"
).textContent =
Math.min(
correctAnswers,
1000
);


if(!currentQuestion){

throw new Error(
"No MCQ question is available."
);

}


renderQuestion();

loading.style.display = "none";

quiz.style.display = "block";


}catch(error){

loading.innerHTML =
'<div class="error">' +
escapeHtml(
error.message ||
"Unable to load MCQ."
) +
'</div>';

}

}


/* =========================================
   DISPLAY QUESTION
========================================= */

function renderQuestion(){

selectedAnswer = null;

submitButton.disabled = true;

submitButton.textContent =
"Check Answer";

result.className =
"result";

result.style.display =
"none";

document.getElementById(
"questionNumber"
).textContent =
"Question " +
(totalQuestions + 1);


document.getElementById(
"score"
).textContent =
"Correct: " +
correctAnswers;


question.textContent =
currentQuestion.question;


options.innerHTML = "";


const answers =
currentQuestion.options || [];


answers.forEach(
function(answer,index){

const button =
document.createElement("button");

button.type =
"button";

button.className =
"option";

button.textContent =
answer;

button.onclick =
function(){

selectAnswer(
index,
button
);

};

options.appendChild(
button
);

});

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(
index,
button
){

selectedAnswer = index;


document
.querySelectorAll(".option")
.forEach(
function(item){

item.classList.remove(
"selected"
);

});


button.classList.add(
"selected"
);

submitButton.disabled =
false;

}


/* =========================================
   SUBMIT
========================================= */

async function submitAnswer(){

if(
selectedAnswer === null ||
!currentQuestion
){

return;

}


submitButton.disabled =
true;

submitButton.textContent =
"Checking...";


try{

const response =
await fetch(
API_URL + "/api/mcq",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:
Number(studentId),

question_id:
Number(currentQuestion.id),

answer:
selectedAnswer

})
}
);


const data =
await response.json();


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to submit answer."
);

}


const buttons =
document.querySelectorAll(
".option"
);


buttons.forEach(
function(button,index){

button.disabled = true;

});


const correctIndex =
Number(
data.correct_answer
);


if(
data.correct === true
){

buttons[selectedAnswer]
?.classList.add(
"correct"
);

correctAnswers =
Number(
data.correct_answers ||
correctAnswers + 1
);


result.className =
"result correct";

result.innerHTML =
"✅ Correct! Well done.";


}else{

buttons[selectedAnswer]
?.classList.add(
"wrong"
);

if(
buttons[correctIndex]
){

buttons[correctIndex]
.classList.add(
"correct"
);

}

result.className =
"result wrong";

result.innerHTML =
"❌ Incorrect. The correct answer is highlighted.";

}


result.style.display =
"block";


document.getElementById(
"correctCount"
).textContent =
correctAnswers;


document.getElementById(
"totalCount"
).textContent =
Number(
data.total_questions ||
totalQuestions + 1
);


document.getElementById(
"certificateCount"
).textContent =
Math.min(
correctAnswers,
1000
);


submitButton.textContent =
"Next Question";


submitButton.disabled =
false;


submitButton.onclick =
function(){

submitButton.onclick =
null;

submitButton.setAttribute(
"onclick",
"submitAnswer()"
);

loadQuestion();

};


/* Certificate reached */

if(
correctAnswers >= 1000
){

result.innerHTML +=
"<br><br>🎓 Congratulations! You have reached 1,000 correct answers and are eligible for a certificate.";

}

}catch(error){

result.className =
"result wrong";

result.textContent =
error.message ||
"Unable to submit answer.";

result.style.display =
"block";

submitButton.disabled =
false;

submitButton.textContent =
"Try Again";

}

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadQuestion();

</script>

</body>
</html>
