<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI MCQ | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef
}

.back{
text-decoration:none;
color:#475467
}

.container{
max-width:700px;
margin:auto;
padding:25px 15px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:24px;
box-shadow:0 5px 20px rgba(0,0,0,.04)
}

h1{
margin-top:0;
font-size:26px
}

label{
display:block;
font-weight:bold;
margin-bottom:7px
}

select{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:15px;
background:#fff
}

.status{
margin:15px 0;
font-size:14px;
color:#667085
}

.generate,
.next{
width:100%;
padding:14px;
border:0;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer
}

.generate{
background:#155eef;
color:#fff
}

.next{
background:#16a34a;
color:#fff;
margin-top:15px
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.question{
font-size:19px;
font-weight:bold;
line-height:1.5;
margin:25px 0 15px
}

.option{
width:100%;
padding:14px;
margin:7px 0;
text-align:left;
border:1px solid #d0d5dd;
border-radius:9px;
background:#f8fafc;
cursor:pointer;
font-size:15px
}

.option.correct{
background:#dcfce7;
border-color:#16a34a
}

.option.wrong{
background:#fee2e2;
border-color:#dc2626
}

.explanation{
margin-top:18px;
padding:15px;
border-radius:9px;
background:#f8fafc;
line-height:1.5
}

.hidden{
display:none
}

.locked{
text-align:center;
padding:20px
}

.premium{
color:#16a34a;
font-weight:bold
}

.count{
margin-top:10px;
font-size:13px;
color:#667085
}

@media(max-width:500px){
.card{padding:20px}
h1{font-size:23px}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">
← Dashboard
</a>

</div>
</header>


<div class="container">

<div class="card">

<h1>🤖 AI English MCQ</h1>

<div
id="status"
class="status">
Checking Premium membership...
</div>


<div
id="locked"
class="locked hidden">

<h2>🔒 Premium Required</h2>

<p>
Premium membership is required to use
AI MCQ.
</p>

<a href="premium.html">
⭐ Upgrade to Premium
</a>

</div>


<div
id="app"
class="hidden">


<label for="subject">
📚 Select Subject
</label>

<select id="subject">

<option value="English Grammar">
📘 English Grammar
</option>

<option value="English Vocabulary">
📝 English Vocabulary
</option>

<option value="Tenses">
⏰ Tenses
</option>

<option value="Parts of Speech">
🔤 Parts of Speech
</option>

<option value="Nouns">
📖 Nouns
</option>

<option value="Pronouns">
👤 Pronouns
</option>

<option value="Verbs">
🏃 Verbs
</option>

<option value="Adjectives">
✨ Adjectives
</option>

<option value="Adverbs">
⚡ Adverbs
</option>

<option value="Prepositions">
📍 Prepositions
</option>

<option value="Conjunctions">
🔗 Conjunctions
</option>

<option value="Articles">
📄 Articles
</option>

<option value="Sentence Structure">
🏗️ Sentence Structure
</option>

<option value="Subject Verb Agreement">
🤝 Subject-Verb Agreement
</option>

<option value="Active and Passive Voice">
🔄 Active & Passive Voice
</option>

<option value="Direct and Indirect Speech">
💬 Direct & Indirect Speech
</option>

<option value="Conditionals">
🔀 Conditionals
</option>

<option value="Question Tags">
❓ Question Tags
</option>

<option value="Punctuation">
✍️ Punctuation
</option>

<option value="Spelling">
🔡 Spelling
</option>

<option value="Synonyms">
🔄 Synonyms
</option>

<option value="Antonyms">
↔️ Antonyms
</option>

<option value="Idioms">
💡 Idioms
</option>

<option value="Phrasal Verbs">
🧩 Phrasal Verbs
</option>

<option value="Reading Comprehension">
📚 Reading Comprehension
</option>

<option value="Business English">
💼 Business English
</option>

<option value="Academic English">
🎓 Academic English
</option>

<option value="Conversation English">
🗣️ Conversation English
</option>

<option value="Common Errors">
⚠️ Common English Errors
</option>

<option value="IELTS English">
🌍 IELTS English
</option>

<option value="Everyday English">
☀️ Everyday English
</option>

</select>


<div
id="count"
class="count">
0 / 100 questions today
</div>


<button
id="generate"
class="generate"
onclick="generateQuestion()">

🤖 Generate MCQ

</button>


<div
id="questionArea"
class="hidden">

<div
id="question"
class="question">
</div>

<div id="options"></div>

<div
id="explanation"
class="explanation hidden">
</div>

<button
id="next"
class="next hidden"
onclick="generateQuestion()">

➡️ Next Question

</button>

</div>

</div>

</div>

</div>


<script>

const MEMBERSHIP_API =
"https://createlk-membership-api.createlk.workers.dev";

const AI_API =
"https://createlk-ai-mcq.createlk.workers.dev";


const token =
sessionStorage.getItem(
"createlk_token"
);

const student =
JSON.parse(
sessionStorage.getItem(
"createlk_student"
)||"null"
);


if(!token || !student){

window.location.href="login.html";

}


/* =========================
CHECK PREMIUM
========================= */

async function checkMembership(){

try{

const response =
await fetch(
MEMBERSHIP_API+
"/api/membership?student_id="+
encodeURIComponent(student.id),
{
headers:{
"Authorization":
"Bearer "+token
}
}
);

const data =
await response.json();


if(
!response.ok ||
!data.success ||
!data.active
){

showLocked(
data.status==="pending"
?
"⏳ Payment is waiting for approval."
:
"🔒 Premium membership is required."
);

return;
}


document.getElementById(
"status"
).innerHTML=
'<span class="premium">'+
'⭐ Premium Active'+
'</span>';


document.getElementById(
"app"
).classList.remove(
"hidden"
);


}catch(error){

console.error(error);

showLocked(
"Unable to verify membership."
);

}

}


/* =========================
GENERATE
========================= */

async function generateQuestion(){

const generate =
document.getElementById(
"generate"
);

const next =
document.getElementById(
"next"
);

const subject =
document.getElementById(
"subject"
).value;

const question =
document.getElementById(
"question"
);

const options =
document.getElementById(
"options"
);

const explanation =
document.getElementById(
"explanation"
);


generate.disabled=true;

next.classList.add(
"hidden"
);

question.textContent=
"🤖 Creating your question...";

options.innerHTML="";

explanation.classList.add(
"hidden"
);


try{

const response =
await fetch(
AI_API+"/api/mcq",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer "+token
},

body:JSON.stringify({

student_id:
student.id,

subject:
subject

})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

question.textContent=
data.message ||
"Unable to generate question.";

generate.disabled=false;

return;
}


question.textContent=
data.question;


Object.entries(
data.options
).forEach(
([letter,text])=>{

const button =
document.createElement(
"button"
);

button.className=
"option";

button.textContent=
letter+". "+text;

button.onclick=()=>{

checkAnswer(
button,
letter,
data.answer,
data.explanation
);

};

options.appendChild(
button
);

}
);


document.getElementById(
"count"
).textContent=
(data.used||0)+
" / 100 questions today";


generate.textContent=
"Choose an answer";

}catch(error){

console.error(error);

question.textContent=
"Unable to connect to AI.";

generate.disabled=false;

}

}


/* =========================
ANSWER
========================= */

function checkAnswer(
button,
selected,
correct,
explanationText
){

const buttons =
document.querySelectorAll(
".option"
);


buttons.forEach(
b=>b.disabled=true
);


if(selected===correct){

button.classList.add(
"correct"
);

document.getElementById(
"status"
).textContent=
"✅ Correct!";

}else{

button.classList.add(
"wrong"
);

buttons.forEach(
b=>{

if(
b.textContent.startsWith(
correct+"."
)
){

b.classList.add(
"correct"
);

}

}
);

document.getElementById(
"status"
).textContent=
"❌ Incorrect.";

}


const explanation =
document.getElementById(
"explanation"
);

explanation.textContent=
"💡 Explanation: "+
explanationText;

explanation.classList.remove(
"hidden"
);


document.getElementById(
"next"
).classList.remove(
"hidden"
);


document.getElementById(
"generate"
).disabled=true;

}


/* =========================
LOCKED
========================= */

function showLocked(text){

document.getElementById(
"status"
).textContent=text;

document.getElementById(
"locked"
).classList.remove(
"hidden"
);

document.getElementById(
"app"
).classList.add(
"hidden"
);

}


checkMembership();

</script>

</body>
</html>
