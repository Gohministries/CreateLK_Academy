<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI English MCQ | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:850px;
margin:auto;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:18px;
font-weight:800;
color:#155eef;
}

.back{
color:#475467;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.container{
max-width:700px;
margin:25px auto;
padding:0 15px 50px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.hero{text-align:center}

.icon{
width:62px;
height:62px;
margin:auto;
border-radius:16px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:31px;
}

h1{
font-size:25px;
margin:14px 0 7px;
}

.subtitle{
font-size:14px;
color:#667085;
line-height:1.6;
}

.student{
margin-top:18px;
padding:12px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
text-align:center;
font-size:13px;
}

.question-box{
margin-top:22px;
}

.question-number{
font-size:12px;
font-weight:700;
color:#155eef;
margin-bottom:10px;
}

.question{
font-size:19px;
font-weight:800;
line-height:1.5;
margin-bottom:18px;
}

.option{
display:block;
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #d0d5dd;
background:#fff;
border-radius:10px;
text-align:left;
font-size:14px;
cursor:pointer;
}

.option:hover{
background:#f5f8ff;
border-color:#155eef;
}

.option.selected{
background:#eef4ff;
border-color:#155eef;
}

.option.correct{
background:#ecfdf3;
border-color:#16a34a;
color:#166534;
}

.option.wrong{
background:#fff1f2;
border-color:#dc2626;
color:#b91c1c;
}

.controls{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
flex:1;
height:48px;
border:0;
border-radius:9px;
font-weight:800;
cursor:pointer;
}

.primary{
background:#155eef;
color:#fff;
}

.secondary{
background:#eef2f7;
color:#344054;
}

.btn:disabled{
opacity:.55;
cursor:not-allowed;
}

.message{
display:none;
margin-top:16px;
padding:13px;
border-radius:9px;
font-size:13px;
line-height:1.5;
text-align:center;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
text-align:center;
}

.score{
font-size:34px;
font-weight:800;
color:#155eef;
margin:8px 0;
}

.loading{
text-align:center;
padding:25px;
color:#667085;
}

footer{
text-align:center;
padding:25px;
font-size:11px;
color:#98a2b3;
}

@media(max-width:500px){
.card{padding:20px 15px}
h1{font-size:23px}
.question{font-size:17px}
.controls{flex-direction:column}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>
</header>


<main class="container">

<div class="card">

<div class="hero">

<div class="icon">🤖</div>

<h1>AI English MCQ</h1>

<div class="subtitle">
Practice English grammar and vocabulary.
</div>

</div>


<div id="studentBox" class="student">
Checking membership...
</div>


<div id="loading" class="loading">
⏳ Loading your question...
</div>


<div
id="quiz"
style="display:none">

<div class="question-box">

<div
id="questionNumber"
class="question-number">
Question 1
</div>

<div
id="question"
class="question">
</div>

<div id="options"></div>

</div>


<div class="controls">

<button
id="nextButton"
class="btn primary"
disabled>

Next Question →

</button>

</div>

</div>


<div id="message" class="message"></div>


<div id="result" class="result">

<div>🎉 Quiz Completed</div>

<div
id="score"
class="score">
0 / 0
</div>

<div id="resultText"></div>

<br>

<button
class="btn primary"
onclick="location.reload()">

🔄 Try Again

</button>

</div>

</div>

</main>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

/* =========================================
   CREATE LK ACADEMY API
========================================= */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* =========================================
   GET STUDENT
========================================= */

let student = null;

try{

const saved =
sessionStorage.getItem(STUDENT_KEY);

if(saved){
student = JSON.parse(saved);
}

}catch(error){

console.error(error);

}


/* =========================================
   LOGIN CHECK
========================================= */

if(
!student ||
sessionStorage.getItem(LOGIN_KEY) !== "true"
){

window.location.replace("login.html");

}


/* =========================================
   STUDENT
========================================= */

const studentId =
student?.id ||
student?.student_id;

const firstName =
student?.first_name ||
student?.firstName ||
"Student";

document.getElementById(
"studentBox"
).textContent =
"👤 " + firstName;


/* =========================================
   QUIZ VARIABLES
========================================= */

let questions = [];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;


/* =========================================
   LOAD QUIZ
========================================= */

async function loadQuiz(){

try{

const response =
await fetch(
API_URL +
"/api/mcq?student_id=" +
encodeURIComponent(studentId)
);


const raw =
await response.text();

console.log(
"MCQ RESPONSE:",
raw
);


let data;

try{

data = JSON.parse(raw);

}catch(error){

throw new Error(
"Invalid response from MCQ server."
);

}


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Unable to load MCQ questions."
);

}


/* =========================================
   MEMBERSHIP CHECK
========================================= */

if(
data.active === false &&
data.membership_active === false
){

throw new Error(
"Premium membership is required to access AI MCQ."
);

}


/* =========================================
   QUESTIONS
========================================= */

questions =
data.questions ||
data.mcq ||
data.data ||
[];


if(!Array.isArray(questions) ||
questions.length === 0){

throw new Error(
"No MCQ questions are currently available."
);

}


document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"quiz"
).style.display =
"block";


showQuestion();


}catch(error){

console.error(
"MCQ error:",
error
);

document.getElementById(
"loading"
).style.display =
"none";

showMessage(
error.message ||
"Unable to load MCQ.",
"error"
);

}

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(){

selectedAnswer = null;


const q =
questions[currentQuestion];


document.getElementById(
"questionNumber"
).textContent =
"Question " +
(currentQuestion + 1) +
" of " +
questions.length;


document.getElementById(
"question"
).textContent =
q.question ||
q.text ||
q.question_text ||
"Question";


const optionsBox =
document.getElementById(
"options"
);

optionsBox.innerHTML =
"";


const options =
q.options ||
[
q.option_a,
q.option_b,
q.option_c,
q.option_d
].filter(Boolean);


options.forEach(
function(option,index){

const button =
document.createElement("button");

button.type =
"button";

button.className =
"option";

button.textContent =
String.fromCharCode(65 + index) +
". " +
option;


button.onclick =
function(){

selectAnswer(
button,
index,
option
);

};


optionsBox.appendChild(
button
);

});


const next =
document.getElementById(
"nextButton"
);

next.disabled = true;

next.textContent =
currentQuestion === questions.length - 1
? "Finish Quiz"
: "Next Question →";

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(
button,
index,
value
){

const buttons =
document.querySelectorAll(
".option"
);

buttons.forEach(
function(btn){
btn.classList.remove(
"selected"
);
});


button.classList.add(
"selected"
);


selectedAnswer = {
index:index,
value:value
};


document.getElementById(
"nextButton"
).disabled =
false;

}


/* =========================================
   NEXT
========================================= */

document.getElementById(
"nextButton"
).addEventListener(
"click",
async function(){

if(!selectedAnswer){
return;
}


const q =
questions[currentQuestion];


const correct =
q.correct_answer ??
q.correctAnswer ??
q.answer ??
q.correct;


if(
String(selectedAnswer.value).trim().toLowerCase() ===
String(correct).trim().toLowerCase() ||
String(selectedAnswer.index) ===
String(correct)
){

score++;

}


/* Last question */

if(
currentQuestion >=
questions.length - 1
){

await submitResult();

return;

}


currentQuestion++;

showQuestion();

});


/* =========================================
   SUBMIT RESULT
========================================= */

async function submitResult(){

document.getElementById(
"quiz"
).style.display =
"none";


document.getElementById(
"result"
).style.display =
"block";


document.getElementById(
"score"
).textContent =
score +
" / " +
questions.length;


const percentage =
Math.round(
(score / questions.length) * 100
);


document.getElementById(
"resultText"
).textContent =
"You scored " +
percentage +
"%. Keep practising!";


try{

await fetch(
API_URL + "/api/mcq",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:
Number(studentId),

score:score,

total:
questions.length,

percentage:
percentage

})

});

}catch(error){

console.error(
"Result save error:",
error
);

}

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =========================================
   START
========================================= */

if(studentId){

loadQuiz();

}

</script>

</body>
</html>
