<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>AI MCQ | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
}

.back{
text-decoration:none;
color:#475467;
font-weight:600;
}

.container{
max-width:700px;
margin:auto;
padding:25px 15px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
padding:24px;
box-shadow:0 5px 20px rgba(0,0,0,.04);
}

h1{
margin-top:0;
font-size:26px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

select{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:15px;
background:#fff;
}

.status{
margin:15px 0;
font-size:14px;
color:#667085;
}

.premium{
color:#16a34a;
font-weight:bold;
}

.generate,
.next{
width:100%;
padding:14px;
border:0;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.generate{
background:#155eef;
color:#fff;
}

.next{
background:#16a34a;
color:#fff;
margin-top:15px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.question{
font-size:19px;
font-weight:bold;
line-height:1.5;
margin:25px 0 15px;
}

.option{
width:100%;
padding:14px;
margin:7px 0;
text-align:left;
border:1px solid #d0d5dd;
border-radius:9px;
background:#f8fafc;
cursor:pointer;
font-size:15px;
}

.option:hover{
background:#eef4ff;
}

.option.correct{
background:#dcfce7;
border-color:#16a34a;
}

.option.wrong{
background:#fee2e2;
border-color:#dc2626;
}

.explanation{
margin-top:18px;
padding:15px;
border-radius:9px;
background:#f8fafc;
line-height:1.5;
}

.hidden{
display:none;
}

.locked{
text-align:center;
padding:20px;
}

.locked h2{
margin-top:0;
}

.locked a{
display:inline-block;
margin-top:10px;
background:#155eef;
color:#fff;
padding:11px 16px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.count{
margin-top:10px;
font-size:13px;
color:#667085;
}

.error{
margin-top:12px;
padding:12px;
background:#fee2e2;
color:#991b1b;
border-radius:8px;
font-size:13px;
display:none;
}

@media(max-width:500px){

.card{
padding:20px;
}

h1{
font-size:23px;
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<a
href="dashboard.html"
class="back">

← Dashboard

</a>

</div>

</header>


<div class="container">

<div class="card">


<h1>
🤖 AI English MCQ
</h1>


<div
id="status"
class="status">

Checking Premium membership...

</div>


<div
id="locked"
class="locked hidden">

<h2>
🔒 Premium Required
</h2>

<p id="lockedText">
Premium membership is required to use AI MCQ.
</p>

<a href="premium.html">
⭐ Upgrade to Premium
</a>

</div>


<div
id="app"
class="hidden">


<label for="subject">

📚 Select Subject

</label>


<select id="subject">

<option value="English Grammar">
📘 English Grammar
</option>

<option value="English Vocabulary">
📝 English Vocabulary
</option>

<option value="Tenses">
⏰ Tenses
</option>

<option value="Parts of Speech">
🔤 Parts of Speech
</option>

<option value="Nouns">
📖 Nouns
</option>

<option value="Pronouns">
👤 Pronouns
</option>

<option value="Verbs">
🏃 Verbs
</option>

<option value="Adjectives">
✨ Adjectives
</option>

<option value="Adverbs">
⚡ Adverbs
</option>

<option value="Prepositions">
📍 Prepositions
</option>

<option value="Conjunctions">
🔗 Conjunctions
</option>

<option value="Articles">
📄 Articles
</option>

<option value="Sentence Structure">
🏗️ Sentence Structure
</option>

<option value="Subject Verb Agreement">
🤝 Subject-Verb Agreement
</option>

<option value="Active and Passive Voice">
🔄 Active & Passive Voice
</option>

<option value="Direct and Indirect Speech">
💬 Direct & Indirect Speech
</option>

<option value="Conditionals">
🔀 Conditionals
</option>

<option value="Question Tags">
❓ Question Tags
</option>

<option value="Punctuation">
✍️ Punctuation
</option>

<option value="Spelling">
🔡 Spelling
</option>

<option value="Synonyms">
🔄 Synonyms
</option>

<option value="Antonyms">
↔️ Antonyms
</option>

<option value="Idioms">
💡 Idioms
</option>

<option value="Phrasal Verbs">
🧩 Phrasal Verbs
</option>

<option value="Reading Comprehension">
📚 Reading Comprehension
</option>

<option value="Business English">
💼 Business English
</option>

<option value="Academic English">
🎓 Academic English
</option>

<option value="Conversation English">
🗣️ Conversation English
</option>

<option value="Common Errors">
⚠️ Common English Errors
</option>

<option value="IELTS English">
🌍 IELTS English
</option>

<option value="Everyday English">
☀️ Everyday English
</option>

</select>


<div
id="count"
class="count">

0 / 100 questions today

</div>


<button
id="generate"
class="generate"
type="button">

🤖 Generate MCQ

</button>


<div
id="error"
class="error">
</div>


<div
id="questionArea"
class="hidden">


<div
id="question"
class="question">
</div>


<div id="options">
</div>


<div
id="explanation"
class="explanation hidden">
</div>


<button
id="next"
class="next hidden"
type="button">

➡️ Next Question

</button>


</div>


</div>

</div>

</div>


<script>

/* =========================================
   API SETTINGS
========================================= */

const MEMBERSHIP_API =
"https://createlk-membership-api.createlk.workers.dev";

const AI_API =
"https://createlk-ai-mcq.createlk.workers.dev";

const PROGRESS_API =
"https://createlk-progress.createlk.workers.dev";


/* =========================================
   V2 SESSION
========================================= */

function getStudent(){

let raw =
sessionStorage.getItem(
"createlk_student"
);

if(!raw){

raw =
localStorage.getItem(
"createlk_student"
);

}

if(!raw){

return null;

}

try{

return JSON.parse(raw);

}catch(error){

console.error(
"Student JSON error:",
error
);

return null;

}

}


function getToken(){

return (

sessionStorage.getItem(
"createlk_student_token"
)

||

localStorage.getItem(
"createlk_student_token"
)

||

sessionStorage.getItem(
"createlk_token"
)

||

localStorage.getItem(
"createlk_token"
)

||

""

);

}


const student =
getStudent();

const token =
getToken();


/* =========================================
   LOGIN CHECK
========================================= */

/*
   IMPORTANT:

   V2 uses:

   createlk_student
   createlk_student_token

   We do NOT redirect to old login.html.

   The page only requires a valid
   stored student account.
*/

if(
!student ||
!student.id
){

window.location.href =
"https://createlk.com/login-v2.html";

}


/* =========================================
   ELEMENTS
========================================= */

const status =
document.getElementById("status");

const app =
document.getElementById("app");

const locked =
document.getElementById("locked");

const lockedText =
document.getElementById("lockedText");

const generate =
document.getElementById("generate");

const next =
document.getElementById("next");

const questionArea =
document.getElementById("questionArea");

const question =
document.getElementById("question");

const options =
document.getElementById("options");

const explanation =
document.getElementById("explanation");

const count =
document.getElementById("count");

const errorBox =
document.getElementById("error");


/* =========================================
   ERROR MESSAGE
========================================= */

function showError(message){

errorBox.textContent =
message;

errorBox.style.display =
"block";

}


function hideError(){

errorBox.textContent =
"";

errorBox.style.display =
"none";

}


/* =========================================
   CHECK PREMIUM
========================================= */

async function checkMembership(){

try{

status.textContent =
"Checking Premium membership...";


const headers = {

"Accept":
"application/json"

};


if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

MEMBERSHIP_API +
"/api/membership?student_id=" +
encodeURIComponent(
student.id
),

{
method:"GET",
headers:headers
}

);


const data =
await response.json();


console.log(
"Membership:",
data
);


if(
!response.ok ||
!data.success
){

showLocked(
data.message ||
"Unable to verify membership."
);

return;

}


if(!data.active){

if(
data.status === "pending"
){

showLocked(
"⏳ Payment is waiting for administrator approval."
);

}else if(
data.status === "expired"
){

showLocked(
"⚠️ Your Premium membership has expired."
);

}else if(
data.status === "rejected"
){

showLocked(
"❌ Your payment was rejected."
);

}else{

showLocked(
"🔒 Premium membership is required."
);

}

return;

}


/* =========================================
   PREMIUM ACTIVE
========================================= */

status.innerHTML =
'<span class="premium">' +
'⭐ Premium Active' +
'</span>';

app.classList.remove(
"hidden"
);


/* LOAD DAILY COUNT */

await loadUsage();


}catch(error){

console.error(
"Membership error:",
error
);

showLocked(
"Unable to connect to membership server."
);

}

}


/* =========================================
   SHOW LOCKED
========================================= */

function showLocked(message){

status.textContent =
message;

lockedText.textContent =
message;

locked.classList.remove(
"hidden"
);

app.classList.add(
"hidden"
);

}


/* =========================================
   LOAD USAGE
========================================= */

async function loadUsage(){

try{

const headers = {

"Accept":
"application/json"

};


if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

AI_API +
"/api/mcq/usage?student_id=" +
encodeURIComponent(
student.id
),

{
method:"GET",
headers:headers
}

);


if(!response.ok){

console.log(
"Usage endpoint unavailable"
);

return;

}


const data =
await response.json();


if(data.success){

count.textContent =
(data.used || 0) +
" / 100 questions today";

}

}catch(error){

console.log(
"Usage check skipped:",
error
);

}

}


/* =========================================
   RECORD CERTIFICATE PROGRESS
========================================= */

async function recordCompletedQuestion(){

try{

const headers = {

"Content-Type":
"application/json",

"Accept":
"application/json"

};


if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

PROGRESS_API +
"/progress/complete",

{
method:"POST",

headers:headers,

body:JSON.stringify({

student_id:
student.id

})

}

);


let data;

try{

data =
await response.json();

}catch(e){

console.error(
"Progress server returned invalid JSON."
);

return;

}


console.log(
"Progress update:",
data
);


if(
!response.ok ||
!data.success
){

console.error(
"Progress update failed:",
data
);

return;

}


console.log(
"Certificate progress:",
data.completed_questions +
" / " +
data.required_questions
);


}catch(error){

/*
   Progress failure does NOT
   stop the MCQ system.
*/

console.error(
"Unable to update certificate progress:",
error
);

}

}


/* =========================================
   GENERATE MCQ
========================================= */

async function generateQuestion(){

hideError();


const subject =
document.getElementById(
"subject"
).value;


generate.disabled =
true;

next.classList.add(
"hidden"
);


questionArea.classList.remove(
"hidden"
);


question.textContent =
"🤖 Creating your question...";


options.innerHTML =
"";

explanation.classList.add(
"hidden"
);


status.innerHTML =
'<span class="premium">' +
'🤖 AI is generating your MCQ...' +
'</span>';


try{

const headers = {

"Content-Type":
"application/json",

"Accept":
"application/json"

};


if(token){

headers["Authorization"] =
"Bearer " + token;

}


const response =
await fetch(

AI_API +
"/api/mcq",

{
method:"POST",

headers:headers,

body:JSON.stringify({

student_id:
student.id,

subject:
subject

})

}

);


let data;

try{

data =
await response.json();

}catch(e){

throw new Error(
"AI server returned an invalid response."
);

}


console.log(
"AI MCQ response:",
data
);


if(
!response.ok ||
!data.success
){

question.textContent =
"Unable to generate MCQ.";

showError(
data.message ||
"AI MCQ generation failed."
);

generate.disabled =
false;

status.innerHTML =
'<span class="premium">' +
'⭐ Premium Active' +
'</span>';

return;

}


/* QUESTION */

question.textContent =
data.question;


/* OPTIONS */

if(
!data.options ||
typeof data.options !==
"object"
){

throw new Error(
"AI returned invalid answer options."
);

}


Object.entries(
data.options
).forEach(
([letter,text]) => {

const button =
document.createElement(
"button"
);

button.type =
"button";

button.className =
"option";

button.textContent =
letter +
". " +
text;


button.onclick =
function(){

checkAnswer(
button,
letter,
data.answer,
data.explanation ||
"No explanation available."
);

};


options.appendChild(
button
);

}
);


/* COUNT */

if(
typeof data.used !==
"undefined"
){

count.textContent =
data.used +
" / 100 questions today";

}


/* BUTTON */

generate.textContent =
"Choose an answer";


status.innerHTML =
'<span class="premium">' +
'⭐ Premium Active' +
'</span>';


}catch(error){

console.error(
"Generate MCQ error:",
error
);

question.textContent =
"Unable to generate question.";

showError(
error.message ||
"Unable to connect to AI server."
);

generate.disabled =
false;

status.innerHTML =
'<span class="premium">' +
'⭐ Premium Active' +
'</span>';

}

}


/* =========================================
   CHECK ANSWER
========================================= */

function checkAnswer(
button,
selected,
correct,
explanationText
){

const buttons =
document.querySelectorAll(
".option"
);


buttons.forEach(
b => {

b.disabled =
true;

}
);


/* NORMALIZE */

selected =
String(selected)
.trim()
.toUpperCase();

correct =
String(correct)
.trim()
.toUpperCase();


/* CORRECT */

if(
selected ===
correct
){

button.classList.add(
"correct"
);

status.innerHTML =
'<span class="premium">' +
'✅ Correct answer!' +
'</span>';

}else{

button.classList.add(
"wrong"
);


/* SHOW CORRECT */

buttons.forEach(
b => {

if(
b.textContent
.trim()
.toUpperCase()
.startsWith(
correct + "."
)
){

b.classList.add(
"correct"
);

}

}
);


status.innerHTML =
'<span class="premium">' +
'❌ Incorrect answer' +
'</span>';

}


/* EXPLANATION */

explanation.textContent =
"💡 Explanation: " +
explanationText;

explanation.classList.remove(
"hidden"
);


/*
   Count question for
   certificate progress.
*/

recordCompletedQuestion();


/* NEXT */

next.classList.remove(
"hidden"
);

generate.disabled =
true;

}


/* =========================================
   NEXT QUESTION
========================================= */

next.addEventListener(
"click",
function(){

generate.disabled =
false;

generate.textContent =
"🤖 Generate MCQ";

generateQuestion();

}
);


/* =========================================
   GENERATE BUTTON
========================================= */

generate.addEventListener(
"click",
function(){

generateQuestion();

}
);


/* =========================================
   START
========================================= */

if(
student &&
student.id
){

checkMembership();

}

</script>

</body>

</html>
