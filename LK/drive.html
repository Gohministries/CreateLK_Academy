<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Drive</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#222}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px
}
.loginbox{
 width:100%;max-width:380px;background:#fff;padding:30px;border-radius:16px;
 box-shadow:0 8px 30px #0001
}
.logo{
 width:60px;height:60px;margin:auto auto 15px;border-radius:15px;
 background:#102a56;color:#fff;display:grid;place-items:center;
 font-size:28px;font-weight:bold
}
h1{text-align:center;color:#102a56;font-size:24px;margin:0 0 7px}
.loginbox p{text-align:center;color:#777;margin:0 0 22px}
input{
 width:100%;padding:12px;border:1px solid #d8dde7;border-radius:9px;
 outline:0
}
input:focus{border-color:#102a56}
.primary{
 width:100%;margin-top:10px;padding:12px;border:0;border-radius:9px;
 background:#102a56;color:#fff;font-weight:bold
}
.error{color:#d93025;text-align:center;font-size:13px;margin-top:10px}

header{
 background:#102a56;color:#fff;padding:14px 20px;display:flex;
 justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5
}
.head{display:flex;align-items:center;gap:10px}
.headicon{
 width:40px;height:40px;background:#fff;color:#102a56;border-radius:10px;
 display:grid;place-items:center;font-weight:bold
}
header h2{margin:0;font-size:19px}
header small{opacity:.7}
.logout{
 background:transparent;color:#fff;border:1px solid #fff6;
 padding:8px 13px;border-radius:8px
}

main{max-width:1200px;margin:auto;padding:18px}

.toolbar,.upload,.files{
 background:#fff;border-radius:13px;box-shadow:0 3px 15px #0000000d
}
.toolbar{padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
 padding:9px 13px;border:1px solid #d8dde7;background:#fff;
 border-radius:8px
}
.btn.primary{width:auto;margin:0;background:#102a56;color:#fff;border-color:#102a56}
.path{margin-top:11px;color:#666;font-size:13px}
.path b{color:#102a56}

.upload{display:none;padding:15px;margin-bottom:14px}
.upload.show{display:block}

.filters{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.filter{
 padding:8px 13px;border:1px solid #d8dde7;background:#fff;border-radius:20px
}
.filter.active{background:#102a56;color:#fff}

.title{
 padding:14px 16px;border-bottom:1px solid #eee;
 color:#102a56;font-weight:bold
}
.grid{display:grid;grid-template-columns:repeat(4,1fr)}
.item{padding:15px;border-right:1px solid #eee;border-bottom:1px solid #eee}
.top{display:flex;gap:10px}
.icon{
 width:43px;height:43px;min-width:43px;border-radius:9px;
 background:#edf2fa;display:grid;place-items:center;font-size:22px
}
.folder .icon{background:#fff4d8}
.info{min-width:0;flex:1}
.name{font-weight:bold;word-break:break-word}
.meta{font-size:11px;color:#777;margin-top:5px}
.star{color:#d69b16}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.action{
 flex:1;padding:7px 6px;border:1px solid #d8dde7;background:#fff;
 border-radius:7px;font-size:11px
}
.action.open{background:#102a56;color:#fff;border-color:#102a56}
.action.delete{color:#c62828}
.empty,.loading{text-align:center;padding:40px;color:#777}

.modal{
 position:fixed;inset:0;background:#0008;display:none;
 align-items:center;justify-content:center;padding:20px;z-index:20
}
.modal.show{display:flex}
.modalbox{
 background:#fff;padding:20px;border-radius:14px;width:100%;max-width:400px
}
.modalbox h3{margin:0 0 14px;color:#102a56}
.modalactions{display:flex;gap:8px;margin-top:12px}
.modalactions button{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd}
.modalactions .ok{background:#102a56;color:#fff}

@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
 main{padding:12px}
 .grid{grid-template-columns:repeat(2,1fr)}
 header{padding:11px 13px}
 .headicon{display:none}
}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<div class="loginbox">
<div class="logo">D</div>
<h1>CreateLK Drive</h1>
<p>Admin File Manager</p>

<input id="password" type="password"
placeholder="Admin password" autocomplete="current-password">

<button class="primary" onclick="login()">Login</button>
<div id="loginError" class="error"></div>
</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<header>
<div class="head">
<div class="headicon">D</div>
<div>
<h2>CreateLK Drive</h2>
<small>Admin File Manager</small>
</div>
</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div class="toolbar">
<div class="row">
<button class="btn" onclick="back()">← Back</button>
<button class="btn primary" onclick="showUpload()">⬆ Upload</button>
<button class="btn" onclick="newFolder()">📁 New Folder</button>
<button class="btn" onclick="load()">↻ Refresh</button>
</div>
<div class="path">Location: <b id="path">Home</b></div>
</div>


<div id="upload" class="upload">
<div class="row">
<input id="files" type="file" multiple>
<button class="btn primary" onclick="upload()">Upload</button>
<button class="btn" onclick="hideUpload()">Cancel</button>
</div>
<div id="uploadStatus" class="meta"></div>
</div>


<div class="filters">
<button id="all" class="filter active" onclick="filter('all')">All</button>
<button id="saved" class="filter" onclick="filter('saved')">★ Saved</button>
<button id="unsaved" class="filter" onclick="filter('unsaved')">Not Saved</button>
</div>


<div class="files">
<div class="title">Files & Folders</div>
<div id="items" class="grid">
<div class="loading">Loading...</div>
</div>
</div>

</main>
</div>


<!-- MODAL -->
<div id="modal" class="modal">
<div class="modalbox">
<h3 id="modalTitle">Rename</h3>
<input id="modalInput">
<div class="modalactions">
<button onclick="closeModal()">Cancel</button>
<button class="ok" onclick="confirmModal()">Confirm</button>
</div>
</div>
</div>


<script>

const API="https://drive.createlk.workers.dev";
let TOKEN=localStorage.getItem("drive_token")||"";
let PREFIX="";
let FILTER="all";
let ACTION=null;


/* AUTH */

async function login(){

 const p=password.value;
 loginError.textContent="";

 if(!p){
  loginError.textContent="Enter your password.";
  return;
 }

 try{

  const r=await fetch(API+"/auth",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({password:p})
  });

  const d=await r.json();

  if(!r.ok||!d.success){
   loginError.textContent=d.error||"Login failed.";
   return;
  }

  TOKEN=d.token;
  localStorage.setItem("drive_token",TOKEN);
  show();

 }catch(e){
  loginError.textContent="Connection error.";
 }
}


function show(){
 loginPage.classList.add("hidden");
 app.classList.remove("hidden");
 load();
}


function logout(){
 TOKEN="";
 localStorage.removeItem("drive_token");
 location.reload();
}


/* API */

async function api(path,opt={}){

 opt.headers={
  ...(opt.headers||{}),
  Authorization:"Bearer "+TOKEN
 };

 const r=await fetch(API+path,opt);

 if(r.status===401){
  TOKEN="";
  localStorage.removeItem("drive_token");
  alert("Session expired. Please login again.");
  location.reload();
 }

 return r;
}


/* LOAD */

async function load(){

 items.innerHTML='<div class="loading">Loading...</div>';

 try{

  const r=await api(
   "/list?prefix="+encodeURIComponent(PREFIX)
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error(d.error||"Unable to load.");

  render(d);

 }catch(e){

  items.innerHTML=
   '<div class="empty">'+esc(e.message)+'</div>';

 }
}


/* RENDER */

function render(d){

 items.innerHTML="";
 updatePath();

 for(const f of d.folders||[]){

  const x=document.createElement("div");
  x.className="item folder";

  x.innerHTML=`
  <div class="top">
   <div class="icon">📁</div>
   <div class="info">
    <div class="name">${esc(f.name)}</div>
    <div class="meta">Folder</div>
   </div>
  </div>

  <div class="actions">
   <button class="action open"
   onclick="event.stopPropagation();openFolder('${js(f.key)}')">Open</button>

   <button class="action"
   onclick="event.stopPropagation();renameFolder('${js(f.key)}','${js(f.name)}')">Rename</button>

   <button class="action delete"
   onclick="event.stopPropagation();deleteFolder('${js(f.key)}')">Delete</button>
  </div>`;

  x.onclick=()=>openFolder(f.key);
  items.appendChild(x);
 }


 let files=d.files||[];

 if(FILTER==="saved") files=files.filter(x=>x.saved);
 if(FILTER==="unsaved") files=files.filter(x=>!x.saved);

 for(const f of files) items.appendChild(file(f));

 if(!items.children.length)
  items.innerHTML='<div class="empty">No files or folders found.</div>';
}


/* FILE */

function file(f){

 const x=document.createElement("div");
 x.className="item";

 x.innerHTML=`
 <div class="top">
  <div class="icon">${icon(f.name)}</div>
  <div class="info">
   <div class="name">
    ${esc(f.name)}
    ${f.saved?'<span class="star"> ★</span>':''}
   </div>
   <div class="meta">
    ${size(f.size)}
    ${f.uploaded?" • "+new Date(f.uploaded).toLocaleDateString():""}
   </div>
  </div>
 </div>

 <div class="actions">

  <button class="action open"
  onclick="openFile('${js(f.key)}')">Open</button>

  <button class="action"
  onclick="save('${js(f.key)}',${f.saved})">
  ${f.saved?"Unsave":"Save"}
  </button>

  <button class="action"
  onclick="renameFile('${js(f.key)}','${js(f.name)}')">
  Rename
  </button>

  <button class="action delete"
  onclick="deleteFile('${js(f.key)}')">
  Delete
  </button>

 </div>`;

 return x;
}


/* FOLDERS */

function openFolder(k){
 PREFIX=k;
 load();
}

function back(){

 if(!PREFIX)return;

 let p=PREFIX.replace(/\/$/,"");
 let i=p.lastIndexOf("/");

 PREFIX=i<0?"":p.slice(0,i+1);
 load();
}

function updatePath(){

 path.textContent=PREFIX
  ?"Home / "+PREFIX.replace(/\/$/,"").replaceAll("/"," / ")
  :"Home";
}


/* FOLDER CREATE */

function newFolder(){

 modal("Create Folder","",async name=>{

  if(!name.trim())return;

  const r=await api("/create-folder",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name,
    prefix:PREFIX
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Unable to create folder.");

  load();
 });
}


/* RENAME FILE */

function renameFile(oldKey,oldName){

 modal("Rename File",oldName,async newName=>{

  if(!newName.trim())return;

  const r=await api("/rename",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    oldKey,
    newName:newName.trim()
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Rename failed.");

  load();
 });
}


/* RENAME FOLDER */

function renameFolder(oldPrefix,oldName){

 modal("Rename Folder",oldName,async newName=>{

  if(!newName.trim())return;

  const r=await api("/rename-folder",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    oldPrefix,
    newName:newName.trim()
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Rename failed.");

  if(PREFIX.startsWith(oldPrefix))
   PREFIX=d.newPrefix+PREFIX.slice(oldPrefix.length);

  load();
 });
}


/* DELETE */

async function deleteFile(key){

 if(!confirm("Delete this file permanently?"))return;

 const r=await api("/delete",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({key})
 });

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Delete failed.");

 load();
}


async function deleteFolder(prefix){

 if(!confirm("Delete this folder and everything inside it?"))
  return;

 const r=await api("/delete-folder",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({prefix})
 });

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Delete failed.");

 load();
}


/* SAVE */

async function save(key,saved){

 const r=await api(saved?"/unsave":"/save",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({key})
 });

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Unable to update.");

 load();
}


/* OPEN FILE */

async function openFile(key){

 try{

  const r=await api(
   "/photo?key="+encodeURIComponent(key)
  );

  if(!r.ok)
   throw Error("Unable to open file.");

  const blob=await r.blob();
  const url=URL.createObjectURL(blob);

  window.open(url,"_blank");

  setTimeout(()=>URL.revokeObjectURL(url),60000);

 }catch(e){
  alert(e.message);
 }
}


/* UPLOAD */

function showUpload(){
 uploadBox(true);
}

function hideUpload(){
 uploadBox(false);
 files.value="";
 uploadStatus.textContent="";
}

function uploadBox(show){
 upload.classList.toggle("show",show);
}

async function upload(){

 const selected=[...files.files];

 if(!selected.length)
  return alert("Select a file.");

 try{

  for(let i=0;i<selected.length;i++){

   uploadStatus.textContent=
    "Uploading "+(i+1)+" of "+selected.length+
    ": "+selected[i].name;

   const form=new FormData();

   form.append("file",selected[i],selected[i].name);
   form.append("prefix",PREFIX);

   const r=await api("/upload",{
    method:"POST",
    body:form
   });

   const d=await r.json();

   if(!r.ok||!d.success)
    throw Error(d.error||"Upload failed.");
  }

  uploadStatus.textContent="Upload completed.";
  files.value="";
  load();

  setTimeout(hideUpload,800);

 }catch(e){
  uploadStatus.textContent="Error: "+e.message;
 }
}


/* FILTER */

function filter(v){

 FILTER=v;

 all.classList.toggle("active",v==="all");
 saved.classList.toggle("active",v==="saved");
 unsaved.classList.toggle("active",v==="unsaved");

 load();
}


/* MODAL */

function modal(title,value,fn){

 modalTitle.textContent=title;
 modalInput.value=value;
 ACTION=fn;
 modalEl().classList.add("show");

 setTimeout(()=>{
  modalInput.focus();
  modalInput.select();
 },50);
}

function modalEl(){
 return document.getElementById("modal");
}

function closeModal(){
 modalEl().classList.remove("show");
 ACTION=null;
}

async function confirmModal(){

 const fn=ACTION;
 const value=modalInput.value;

 closeModal();

 if(fn)await fn(value);
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
 if(e.key==="Enter"&&
    document.activeElement===password)login();
});


/* HELPERS */

function icon(n){

 const e=n.split(".").pop().toLowerCase();

 if(e==="apk")return"📱";
 if(["jpg","jpeg","png","gif","webp","svg"].includes(e))return"🖼️";
 if(e==="pdf")return"📕";
 if(["doc","docx"].includes(e))return"📘";
 if(["xls","xlsx","csv"].includes(e))return"📊";
 if(["ppt","pptx"].includes(e))return"📙";
 if(["zip","rar","7z"].includes(e))return"🗜️";
 if(["mp3","wav"].includes(e))return"🎵";
 if(["mp4","webm"].includes(e))return"🎬";
 if(e==="txt")return"📄";

 return"📎";
}

function size(n){

 if(n<1024)return n+" B";
 if(n<1048576)return(n/1024).toFixed(1)+" KB";
 if(n<1073741824)return(n/1048576).toFixed(1)+" MB";

 return(n/1073741824).toFixed(1)+" GB";
}

function esc(v){

 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function js(v){

 return String(v)
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'")
 .replace(/\n/g,"\\n")
 .replace(/\r/g,"\\r");
}


/* AUTO LOGIN */

if(TOKEN)show();

</script>
</body>
</html>
