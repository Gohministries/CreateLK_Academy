<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Drive Photo Manager</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f1f5f9;
  color:#172033;
  font-family:Arial,sans-serif;
}

header{
  background:#123b70;
  color:#fff;
  text-align:center;
  padding:20px 15px;
}

header h2{
  margin:0 0 5px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 3px 15px #0001;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccd5df;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 14px;
  margin:3px;
  border-radius:8px;
  color:#fff;
  background:#123b70;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.full{
  width:100%;
  margin:7px 0;
}

.green{background:#16a34a}
.orange{background:#f59e0b}
.blue{background:#2563eb}
.red{background:#dc2626}
.gray{background:#475569}

#manager{
  display:none;
}

.file{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e2e8f0;
}

.photo{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:9px;
  background:#e5e7eb;
  flex-shrink:0;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-weight:bold;
  word-break:break-all;
  margin-bottom:5px;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:15px;
  font-size:12px;
}

.saved{
  background:#dcfce7;
  color:#166534;
}

.unsaved{
  background:#fef3c7;
  color:#92400e;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.message{
  font-size:14px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:20px;
}

@media(max-width:650px){

  .file{
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    width:160px;
  }

  .photo{
    width:65px;
    height:65px;
  }
}
</style>
</head>

<body>

<header>
  <h2>📷 CreateLK Drive</h2>
  <div>Photo Manager</div>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="login" class="card">

    <h3>🔐 Admin Login</h3>

    <input
      id="password"
      type="password"
      placeholder="Enter admin password"
      autocomplete="current-password"
    >

    <button
      class="full"
      onclick="login()"
    >
      Login
    </button>

    <p id="loginMsg" class="message"></p>

  </div>


  <!-- MANAGER -->

  <div id="manager">

    <!-- UPLOAD -->

    <div class="card">

      <h3>📤 Upload Photo</h3>

      <input
        id="file"
        type="file"
        accept="image/*"
      >

      <input
        id="filename"
        type="text"
        placeholder="Optional filename, e.g. pastor.jpg"
      >

      <button
        class="full"
        onclick="upload()"
      >
        📤 Upload to Cloudflare
      </button>

      <p
        id="uploadMsg"
        class="message"
      ></p>

    </div>


    <!-- PHOTO LIST -->

    <div class="card">

      <h3>📁 Photos</h3>

      <div>

        <button onclick="setFilter('all')">
          All
        </button>

        <button
          class="green"
          onclick="setFilter('saved')"
        >
          ✓ Saved
        </button>

        <button
          class="orange"
          onclick="setFilter('unsaved')"
        >
          Not Saved
        </button>

        <button onclick="loadFiles()">
          🔄 Refresh
        </button>

      </div>

      <div id="files">
        <div class="empty">
          Loading...
        </div>
      </div>

    </div>


    <button
      class="gray full"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

const API =
  "https://drive.createlk.workers.dev";

let TOKEN =
  sessionStorage.getItem("drive_token") || "";

let FILES = [];

let FILTER = "all";


// ===========================
// AUTH HEADERS
// ===========================

function authHeaders(){

  return {
    "Authorization":
      "Bearer " + TOKEN
  };
}


// ===========================
// LOGIN
// ===========================

function login(){

  const password =
    document.getElementById(
      "password"
    ).value.trim();

  if(!password){

    document.getElementById(
      "loginMsg"
    ).textContent =
      "⚠️ Enter password.";

    return;
  }

  document.getElementById(
    "loginMsg"
  ).textContent =
    "Checking...";

  fetch(
    API + "/auth",
    {
      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        password:password
      })
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      document.getElementById(
        "loginMsg"
      ).textContent =
        "❌ " +
        (data.error ||
         "Login failed");

      return;
    }

    TOKEN = data.token;

    sessionStorage.setItem(
      "drive_token",
      TOKEN
    );

    showManager();

  })
  .catch(error=>{

    document.getElementById(
      "loginMsg"
    ).textContent =
      "❌ Connection error";

    console.error(error);

  });
}


// ===========================
// SHOW MANAGER
// ===========================

function showManager(){

  document.getElementById(
    "login"
  ).style.display = "none";

  document.getElementById(
    "manager"
  ).style.display = "block";

  loadFiles();
}


// ===========================
// UPLOAD
// ===========================

function upload(){

  const file =
    document.getElementById(
      "file"
    ).files[0];

  const filename =
    document.getElementById(
      "filename"
    ).value.trim();

  if(!file){

    alert(
      "Please select a photo."
    );

    return;
  }

  const form =
    new FormData();

  form.append(
    "file",
    file
  );

  if(filename){

    form.append(
      "filename",
      filename
    );

  }

  document.getElementById(
    "uploadMsg"
  ).textContent =
    "⏳ Uploading...";

  fetch(
    API + "/upload",
    {
      method:"POST",
      headers:authHeaders(),
      body:form
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      document.getElementById(
        "uploadMsg"
      ).textContent =
        "❌ " +
        (data.error ||
         "Upload failed");

      return;
    }

    document.getElementById(
      "uploadMsg"
    ).textContent =
      "✅ Uploaded: " +
      data.name;

    document.getElementById(
      "file"
    ).value = "";

    document.getElementById(
      "filename"
    ).value = "";

    loadFiles();

  })
  .catch(error=>{

    document.getElementById(
      "uploadMsg"
    ).textContent =
      "❌ Upload error";

    console.error(error);

  });
}


// ===========================
// LOAD FILES
// ===========================

function loadFiles(){

  document.getElementById(
    "files"
  ).innerHTML =
    '<div class="empty">Loading...</div>';

  fetch(
    API + "/list",
    {
      headers:authHeaders()
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      document.getElementById(
        "files"
      ).innerHTML =
        '<div class="empty">❌ ' +
        (data.error ||
         "Unable to load files") +
        '</div>';

      return;
    }

    FILES = data.files || [];

    renderFiles();

  })
  .catch(error=>{

    document.getElementById(
      "files"
    ).innerHTML =
      '<div class="empty">❌ Connection error</div>';

    console.error(error);

  });
}


// ===========================
// FILTER
// ===========================

function setFilter(value){

  FILTER = value;

  renderFiles();
}


// ===========================
// RENDER
// ===========================

function renderFiles(){

  const box =
    document.getElementById(
      "files"
    );

  box.innerHTML = "";

  let list = FILES;

  if(FILTER === "saved"){

    list =
      FILES.filter(
        file => file.saved
      );

  }

  if(FILTER === "unsaved"){

    list =
      FILES.filter(
        file => !file.saved
      );

  }

  if(!list.length){

    box.innerHTML =
      '<div class="empty">No photos found.</div>';

    return;
  }


  list.forEach(file=>{

    const row =
      document.createElement(
        "div"
      );

    row.className = "file";


    // PHOTO

    const img =
      document.createElement(
        "img"
      );

    img.className = "photo";

    img.src =
      API +
      "/photo?key=" +
      encodeURIComponent(
        file.name
      );

    img.loading = "lazy";


    // INFO

    const info =
      document.createElement(
        "div"
      );

    info.className = "info";


    const name =
      document.createElement(
        "div"
      );

    name.className = "name";

    name.textContent =
      file.name;


    const status =
      document.createElement(
        "span"
      );

    status.className =
      "status " +
      (
        file.saved
          ? "saved"
          : "unsaved"
      );

    status.textContent =
      file.saved
        ? "✓ Uploaded to Google Drive"
        : "Not uploaded to Google Drive";


    info.appendChild(name);

    info.appendChild(status);


    // ACTIONS

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    // SAVE BUTTON

    const save =
      document.createElement(
        "button"
      );

    if(file.saved){

      save.className =
        "orange";

      save.textContent =
        "Unmark Saved";

      save.onclick =
        () => setSaved(
          file.name,
          false
        );

    }else{

      save.className =
        "green";

      save.textContent =
        "📁 Uploaded to Drive";

      save.onclick =
        () => setSaved(
          file.name,
          true
        );
    }


    // RENAME

    const rename =
      document.createElement(
        "button"
      );

    rename.className =
      "blue";

    rename.textContent =
      "✏️ Rename";

    rename.onclick =
      () => renameFile(
        file.name
      );


    // DELETE

    const del =
      document.createElement(
        "button"
      );

    del.className =
      "red";

    del.textContent =
      "🗑 Delete";

    del.onclick =
      () => deleteFile(
        file.name
      );


    actions.appendChild(save);
    actions.appendChild(rename);
    actions.appendChild(del);


    row.appendChild(img);
    row.appendChild(info);
    row.appendChild(actions);

    box.appendChild(row);

  });
}


// ===========================
// SAVE / UNSAVE
// ===========================

function setSaved(name,saved){

  fetch(
    API +
    (
      saved
        ? "/save"
        : "/unsave"
    ),
    {
      method:"POST",

      headers:{
        ...authHeaders(),
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        name:name
      })
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      alert(
        "❌ " +
        (data.error ||
         "Action failed")
      );

      return;
    }

    loadFiles();

  });
}


// ===========================
// RENAME
// ===========================

function renameFile(oldName){

  const newName =
    prompt(
      "Enter new filename:",
      oldName
    );

  if(!newName ||
     newName.trim() === oldName){

    return;
  }

  fetch(
    API + "/rename",
    {
      method:"POST",

      headers:{
        ...authHeaders(),
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        oldName:oldName,
        newName:newName.trim()
      })
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      alert(
        "❌ " +
        (data.error ||
         "Rename failed")
      );

      return;
    }

    loadFiles();

  });
}


// ===========================
// DELETE
// ===========================

function deleteFile(name){

  if(!confirm(
    "Delete this photo?\n\n" +
    name
  )){

    return;
  }

  fetch(
    API + "/delete",
    {
      method:"POST",

      headers:{
        ...authHeaders(),
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        name:name
      })
    }
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data.success){

      alert(
        "❌ " +
        (data.error ||
         "Delete failed")
      );

      return;
    }

    loadFiles();

  });
}


// ===========================
// LOGOUT
// ===========================

function logout(){

  TOKEN = "";

  sessionStorage.removeItem(
    "drive_token"
  );

  location.reload();
}


// ===========================
// RESTORE LOGIN
// ===========================

if(TOKEN){

  showManager();

}

</script>

</body>
</html>
