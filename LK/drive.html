<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Drive</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#222}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--n:#102a56;--g:#d69b16;--b:#e1e5eb;--m:#707784;--r:#c62828}
.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(380px,92%);padding:30px;background:#fff;border-radius:16px;box-shadow:0 15px 50px #0002;text-align:center}.logo{margin:auto auto 15px;width:58px;height:58px;display:grid;place-items:center;background:var(--n);color:#fff;border-radius:14px;font-size:28px;font-weight:bold}.loginbox h2{color:var(--n);margin:8px}.loginbox p{color:var(--m)}input{border:1px solid var(--b);border-radius:8px;padding:11px;width:100%;outline:0}input:focus{border-color:var(--n)}.primary{background:var(--n)!important;color:#fff!important;border-color:var(--n)!important}.loginbtn{width:100%;padding:12px;margin-top:10px;border:0;border-radius:8px}.error{color:var(--r);font-size:12px;margin-top:8px}
.app{min-height:100vh}.side{position:fixed;width:225px;inset:0 auto 0 0;background:var(--n);color:#fff;padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 25px}.brand i{width:40px;height:40px;background:#fff;color:var(--n);border-radius:10px;display:grid;place-items:center;font-weight:bold;font-style:normal}.brand small{display:block;opacity:.6;font-size:10px}.nav button,.logout{display:block;width:100%;padding:11px;border:0;background:transparent;color:#fff;text-align:left;border-radius:7px;margin:3px 0}.nav button:hover,.nav .active{background:#ffffff18;border-left:3px solid var(--g)}.bottom{margin-top:auto}.storage{padding:11px;background:#ffffff0d;border-radius:9px;margin-bottom:10px;font-size:11px;color:#ffffff90}.bar{height:5px;background:#ffffff20;margin:7px 0;border-radius:5px}.bar i{display:block;width:35%;height:100%;background:var(--g)}.logout{border:1px solid #ffffff20}.main{margin-left:225px}.top{height:62px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.top b{color:var(--n);font-size:17px}.admin{background:#f3f5f8;padding:7px 10px;border-radius:7px;font-size:11px}.menu{display:none}.content{padding:18px;max-width:1400px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:13px}.stat,.toolbar,.upload,.files{background:#fff;border:1px solid var(--b);border-radius:11px}.stat{padding:14px}.stat strong{display:block;font-size:20px;color:var(--n)}.stat span{font-size:11px;color:var(--m)}
.toolbar{padding:11px;margin-bottom:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.filters button,.upload button,.modal button{padding:8px 11px;border:1px solid var(--b);background:#fff;border-radius:7px}.search{margin-top:9px}.breadcrumb{margin-top:9px;color:var(--n);font-size:12px}.breadcrumb button{border:0;background:none;color:var(--n);padding:0}
.upload{padding:14px;margin-bottom:12px}.upload-head{display:flex;justify-content:space-between;margin-bottom:10px}.upload-area{border:2px dashed #ccd4df;border-radius:9px;text-align:center;padding:18px}.upload-area p{color:var(--m);font-size:12px}.upload-status{color:var(--m);font-size:12px}
.filters{display:flex;justify-content:space-between;margin-bottom:12px}.filter.active,.view.active{background:var(--n);color:#fff}.files{overflow:visible}.files>header{padding:13px 15px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;color:var(--n)}.files>header span{color:var(--m);font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr)}.grid.list{display:block}.item{position:relative;padding:13px;border-bottom:1px solid #edf0f4;border-right:1px solid #edf0f4}.item:hover{background:#fafbfd}.file{display:flex;gap:9px;cursor:pointer}.icon{width:42px;height:42px;min-width:42px;background:#edf2fa;border-radius:9px;display:grid;place-items:center;font-size:20px}.folder .icon{background:#fff3d3}.name{font-weight:bold;font-size:12px;word-break:break-word}.meta{font-size:10px;color:var(--m);margin-top:4px}.star{color:var(--g)}.more{position:absolute;right:5px;top:5px;border:0;background:none;font-size:18px}.menu-box{display:none;position:absolute;right:8px;top:35px;background:#fff;border:1px solid var(--b);border-radius:8px;box-shadow:0 8px 25px #0002;z-index:20;width:150px;overflow:hidden}.menu-box.show{display:block}.menu-box button{display:block;width:100%;border:0;background:#fff;padding:9px;text-align:left;font-size:11px}.menu-box button:hover{background:#f4f6f8}.danger{color:var(--r)!important}.empty,.loading{text-align:center;padding:45px;color:var(--m)}
.modal,.preview{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:15px;z-index:100}.modal.show,.preview.show{display:grid}.modalbox{background:#fff;width:min(400px,100%);padding:20px;border-radius:12px}.modalbox h3{margin-top:0;color:var(--n)}.modal-actions{display:flex;gap:7px;margin-top:10px}.modal-actions button{flex:1}.previewbox{width:min(1000px,100%);height:90vh;background:#111;border-radius:10px;overflow:hidden}.previewhead{height:50px;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px}.previewhead button{background:#ffffff15;color:#fff;border:0;padding:8px}.previewbody{height:calc(100% - 50px);display:grid;place-items:center;overflow:auto;padding:10px}.previewbody img,.previewbody video{max-width:100%;max-height:100%}.previewbody iframe{width:100%;height:100%;border:0}.previewbody audio{width:80%}.toast{position:fixed;right:15px;bottom:15px;background:#222;color:#fff;padding:10px 14px;border-radius:7px;display:none;z-index:300}.toast.show{display:block}
@media(max-width:850px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin:0}.menu{display:block;border:0;background:#f1f3f6;padding:9px;border-radius:7px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.content{padding:10px}.stats{gap:7px}.grid{grid-template-columns:1fr}.actions button{flex:1}.admin{display:none}}
</style>
</head>

<body>

<section id="loginPage" class="login">
<div class="loginbox">
<div class="logo">D</div>
<h2>CreateLK Drive</h2>
<p>Secure Admin File Manager</p>
<input id="password" type="password" placeholder="Admin password">
<button id="loginBtn" class="loginbtn primary">Login</button>
<div id="loginError" class="error"></div>
</div>
</section>

<div id="app" class="app hidden">

<aside id="side" class="side">
<div class="brand">
<i>D</i><div><b>CreateLK Drive</b><small>Private File Manager</small></div>
</div>

<nav class="nav">
<button class="active" id="homeBtn">🏠 Home</button>
<button id="allBtn">📁 All Files</button>
<button id="savedBtn">⭐ Saved Files</button>
<button id="uploadNav">⬆ Upload Files</button>
</nav>

<div class="bottom">
<div class="storage">Drive<div class="bar"><i></i></div>Private storage</div>
<button id="logoutBtn" class="logout">⇥ Logout</button>
</div>
</aside>

<main class="main">

<header class="top">
<div><button id="menuBtn" class="menu">☰</button><b>CreateLK Drive</b></div>
<span class="admin">🔐 Admin</span>
</header>

<div class="content">

<div class="stats">
<div class="stat"><strong id="folderCount">0</strong><span>Folders</span></div>
<div class="stat"><strong id="fileCount">0</strong><span>Files</span></div>
<div class="stat"><strong id="savedCount">0</strong><span>Saved</span></div>
</div>

<section class="toolbar">
<div class="actions">
<button id="backBtn">← Back</button>
<button id="uploadBtn" class="primary">⬆ Upload</button>
<button id="newFolder">📁 New Folder</button>
<button id="refreshBtn">↻ Refresh</button>
</div>
<input id="search" class="search" placeholder="🔎 Search files and folders">
<div id="breadcrumb" class="breadcrumb"></div>
</section>

<section id="uploadBox" class="upload hidden">
<div class="upload-head"><b>Upload Files</b><button id="closeUpload">Close</button></div>
<div class="upload-area">
<p>Select files or drag them here</p>
<input id="filesInput" type="file" multiple>
<br><br>
<button id="startUpload" class="primary">Start Upload</button>
</div>
<div id="uploadStatus"></div>
</section>

<div class="filters">
<div>
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="saved">★ Saved</button>
<button class="filter" data-filter="unsaved">Not Saved</button>
</div>
<div>
<button class="view active" id="gridBtn">▦</button>
<button class="view" id="listBtn">☷</button>
</div>
</div>

<section class="files">
<header><b>Files & Folders</b><span id="countText">Loading...</span></header>
<div id="items" class="grid"><div class="loading">Loading...</div></div>
</section>

</div>
</main>
</div>

<div id="modal" class="modal">
<div class="modalbox">
<h3 id="modalTitle"></h3>
<input id="modalInput">
<div class="modal-actions">
<button id="cancelModal">Cancel</button>
<button id="confirmModal" class="primary">Confirm</button>
</div>
</div>
</div>

<div id="preview" class="preview">
<div class="previewbox">
<div class="previewhead"><span id="previewTitle"></span><button id="closePreview">✕</button></div>
<div id="previewBody" class="previewbody"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API="https://drive.createlk.workers.dev",$=id=>document.getElementById(id);
let TOKEN=localStorage.getItem("drive_token")||"",PREFIX="",FILTER="all",VIEW="grid",DATA={},ACTION=null;

$("password").onkeydown=e=>e.key==="Enter"&&login();
$("loginBtn").onclick=login;
$("logoutBtn").onclick=logout;
$("menuBtn").onclick=()=>$("side").classList.toggle("open");
$("homeBtn").onclick=()=>home();
$("allBtn").onclick=()=>home();
$("savedBtn").onclick=()=>{FILTER="saved";home(false)};
$("uploadNav").onclick=showUpload;
$("uploadBtn").onclick=showUpload;
$("closeUpload").onclick=()=>$("uploadBox").classList.add("hidden");
$("newFolder").onclick=()=>modal("Create Folder","",createFolder);
$("refreshBtn").onclick=load;
$("backBtn").onclick=back;
$("search").oninput=render;
$("startUpload").onclick=upload;
$("gridBtn").onclick=()=>view("grid");
$("listBtn").onclick=()=>view("list");
$("cancelModal").onclick=closeModal;
$("confirmModal").onclick=confirmModal;
$("closePreview").onclick=closePreview;

document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
 FILTER=b.dataset.filter;
 document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));
 render();
});

async function login(){
 let p=$("password").value.trim();
 if(!p)return $("loginError").textContent="Enter password.";
 $("loginBtn").disabled=true;
 try{
  let r=await fetch(API+"/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})}),d=await r.json();
  if(!r.ok||!d.success)throw Error(d.error||"Login failed");
  TOKEN=d.token;localStorage.setItem("drive_token",TOKEN);show();
 }catch(e){$("loginError").textContent=e.message}
 $("loginBtn").disabled=false;
}

function show(){
 $("loginPage").classList.add("hidden");
 $("app").classList.remove("hidden");
 load();
}

function logout(){
 localStorage.removeItem("drive_token");
 location.reload();
}

async function api(path,opt={}){
 opt.headers={...(opt.headers||{}),Authorization:"Bearer "+TOKEN};
 let r=await fetch(API+path,opt);
 if(r.status===401){localStorage.removeItem("drive_token");location.reload()}
 return r;
}

async function load(){
 $("items").innerHTML='<div class="loading">Loading...</div>';
 try{
  let r=await api("/list?prefix="+encodeURIComponent(PREFIX)),d=await r.json();
  if(!r.ok||!d.success)throw Error(d.error||"Load failed");
  DATA=d;render();
 }catch(e){$("items").innerHTML='<div class="empty">'+e.message+"</div>"}
}

function render(){
 breadcrumb();
 let fs=DATA.folders||[],xs=DATA.files||[],q=$("search").value.toLowerCase();
 if(FILTER==="saved")xs=xs.filter(x=>x.saved);
 if(FILTER==="unsaved")xs=xs.filter(x=>!x.saved);
 if(q){fs=fs.filter(x=>x.name.toLowerCase().includes(q));xs=xs.filter(x=>x.name.toLowerCase().includes(q))}
 $("folderCount").textContent=(DATA.folders||[]).length;
 $("fileCount").textContent=(DATA.files||[]).length;
 $("savedCount").textContent=(DATA.files||[]).filter(x=>x.saved).length;
 $("countText").textContent=fs.length+xs.length+" items";

 let box=$("items");box.classList.toggle("list",VIEW==="list");box.innerHTML="";
 fs.forEach(f=>addItem(f,true));
 xs.forEach(f=>addItem(f,false));
 if(!box.children.length)box.innerHTML='<div class="empty">📂<br>No files found.</div>';
}

function addItem(f,folder){
 let e=document.createElement("div");e.className="item "+(folder?"folder":"");
 let menu=folder?`
 <button onclick="openFolder('${j(f.key)}')">📂 Open</button>
 <button onclick="renameFolder('${j(f.key)}','${j(f.name)}')">✏ Rename</button>
 <button class="danger" onclick="delFolder('${j(f.key)}')">🗑 Delete</button>`
 :`
 <button onclick="openFile('${j(f.key)}','${j(f.name)}','${j(f.type||"")}')">👁 Preview</button>
 <button onclick="download('${j(f.key)}','${j(f.name)}')">⬇ Download</button>
 <button onclick="saveFile('${j(f.key)}',${!!f.saved})">${f.saved?"☆ Unsave":"★ Save"}</button>
 <button onclick="renameFile('${j(f.key)}','${j(f.name)}')">✏ Rename</button>
 <button class="danger" onclick="delFile('${j(f.key)}')">🗑 Delete</button>`;

 e.innerHTML=`<button class="more" onclick="menu(event,this)">⋮</button>
 <div class="menu-box">${menu}</div>
 <div class="file" onclick="${folder?`openFolder('${j(f.key)}')`:`openFile('${j(f.key)}','${j(f.name)}','${j(f.type||"")}')`}">
 <div class="icon">${folder?"📁":icon(f.name)}</div>
 <div><div class="name">${esc(f.name)} ${!folder&&f.saved?"<span class=star>★</span>":""}</div>
 <div class="meta">${folder?"Folder":size(f.size)}</div></div></div>`;
 $("items").appendChild(e);
}

function menu(e,b){
 e.stopPropagation();
 document.querySelectorAll(".menu-box.show").forEach(x=>x.classList.remove("show"));
 b.nextElementSibling.classList.toggle("show");
}
document.onclick=()=>document.querySelectorAll(".menu-box.show").forEach(x=>x.classList.remove("show"));

function home(reset=true){
 PREFIX="";
 if(reset)FILTER="all";
 $("search").value="";
 document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter===FILTER));
 load();
}

function openFolder(k){PREFIX=k;FILTER="all";$("search").value="";load();$("side").classList.remove("open")}
function back(){let p=PREFIX.replace(/\/$/,""),i=p.lastIndexOf("/");PREFIX=i<0?"":p.slice(0,i+1);load()}

function breadcrumb(){
 let b=$("breadcrumb");b.innerHTML="";
 let h=document.createElement("button");h.textContent="Home";h.onclick=home;b.appendChild(h);
 let cur="";
 PREFIX.replace(/\/$/,"").split("/").filter(Boolean).forEach(x=>{
  cur+=x+"/";b.innerHTML+=" › ";
  let z=document.createElement("button");z.textContent=x;z.onclick=()=>{PREFIX=cur;load()};b.appendChild(z);
 });
}

function showUpload(){$("uploadBox").classList.remove("hidden");$("side").classList.remove("open")}
function view(v){VIEW=v;$("gridBtn").classList.toggle("active",v==="grid");$("listBtn").classList.toggle("active",v==="list");render()}

function modal(title,value,fn){$("modalTitle").textContent=title;$("modalInput").value=value;ACTION=fn;$("modal").classList.add("show");$("modalInput").focus()}
function closeModal(){$("modal").classList.remove("show");ACTION=null}
async function confirmModal(){let f=ACTION,v=$("modalInput").value.trim();closeModal();if(f&&v)await f(v)}

async function createFolder(name){
 let r=await api("/create-folder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,prefix:PREFIX})});done(r,"Folder created.")
}
async function renameFile(k,n){modal("Rename File",n,async x=>{let r=await api("/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({oldKey:k,newName:x})});done(r,"File renamed.")})}
async function renameFolder(k,n){modal("Rename Folder",n,async x=>{let r=await api("/rename-folder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({oldPrefix:k,newName:x})});done(r,"Folder renamed.")})}

async function delFile(k){if(!confirm("Delete this file?"))return;let r=await api("/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k})});done(r,"File deleted.")}
async function delFolder(k){if(!confirm("Delete folder and its files?"))return;let r=await api("/delete-folder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prefix:k})});done(r,"Folder deleted.")}

async function saveFile(k,s){
 let r=await api(s?"/unsave":"/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k})});done(r,s?"Removed from saved.":"Saved.")
}

async function done(r,msg){
 let d=await r.json();
 if(!r.ok||!d.success)return toast(d.error||"Action failed");
 toast(msg);load();
}

async function upload(){
 let files=[...$("filesInput").files];
 if(!files.length)return toast("Select files first.");
 for(let i=0;i<files.length;i++){
  $("uploadStatus").textContent=`Uploading ${i+1}/${files.length}`;
  let f=new FormData();f.append("file",files[i],files[i].name);f.append("prefix",PREFIX);
  let r=await api("/upload",{method:"POST",body:f}),d=await r.json();
  if(!r.ok||!d.success)return toast(d.error||"Upload failed");
 }
 toast("Upload complete");$("filesInput").value="";load();
}

async function openFile(k,n,t){
 try{
  let r=await api("/photo?key="+encodeURIComponent(k)),b=await r.blob(),u=URL.createObjectURL(b);
  $("previewTitle").textContent=n;$("previewBody").innerHTML="";
  let x=t||b.type;
  if(x.startsWith("image/"))$("previewBody").innerHTML=`<img src="${u}">`;
  else if(x==="application/pdf")$("previewBody").innerHTML=`<iframe src="${u}"></iframe>`;
  else if(x.startsWith("video/"))$("previewBody").innerHTML=`<video controls src="${u}"></video>`;
  else if(x.startsWith("audio/"))$("previewBody").innerHTML=`<audio controls src="${u}"></audio>`;
  else $("previewBody").innerHTML=`<button class="primary" onclick="download('${j(k)}','${j(n)}')">⬇ Download</button>`;
  $("preview").dataset.url=u;$("preview").classList.add("show");
 }catch(e){toast("Preview failed")}
}

function closePreview(){
 let u=$("preview").dataset.url;if(u)URL.revokeObjectURL(u);
 $("preview").classList.remove("show");$("previewBody").innerHTML="";
}

async function download(k,n){
 let r=await api("/photo?key="+encodeURIComponent(k)),b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);
}

function icon(n){
 let e=n.split(".").pop().toLowerCase();
 return["jpg","jpeg","png","gif","webp","svg"].includes(e)?"🖼️":
 e==="pdf"?"📕":["mp4","webm"].includes(e)?"🎬":
 ["mp3","wav"].includes(e)?"🎵":["doc","docx"].includes(e)?"📘":
 ["xls","xlsx","csv"].includes(e)?"📊":"📎";
}
function size(n){n=+n||0;return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(1)+" GB"}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function j(x){return String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n")}
function toast(x){let t=$("toast");t.textContent=x;t.classList.add("show");clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove("show"),2500)}

if(TOKEN)show();
</script>
</body>
</html>
