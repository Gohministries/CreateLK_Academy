<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<meta name="description" content="CreateLK Drive">
<title>CreateLK Drive</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#202124}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login{
 min-height:100vh;display:grid;place-items:center;padding:20px
}
.loginbox{
 width:100%;max-width:390px;background:#fff;padding:30px;
 border-radius:18px;box-shadow:0 10px 35px #0001
}
.logo{
 width:60px;height:60px;margin:0 auto 15px;border-radius:15px;
 background:#102a56;color:#fff;display:grid;place-items:center;
 font-size:27px;font-weight:bold
}
.loginbox h1{text-align:center;color:#102a56;margin:0 0 7px}
.loginbox p{text-align:center;color:#777;margin:0 0 22px}
.input{
 width:100%;padding:13px;border:1px solid #d9dee8;
 border-radius:9px;outline:0
}
.input:focus{border-color:#102a56}
.loginbtn{
 width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;
 background:#102a56;color:#fff;font-weight:bold
}
.error{color:#d93025;text-align:center;font-size:13px;margin-top:10px}

/* HEADER */
header{
 position:sticky;top:0;z-index:20;background:#102a56;color:#fff;
 padding:13px 20px;display:flex;align-items:center;
 justify-content:space-between
}
.brand{display:flex;align-items:center;gap:10px}
.brandicon{
 width:40px;height:40px;background:#fff;color:#102a56;
 border-radius:10px;display:grid;place-items:center;font-weight:bold
}
.brand h2{font-size:19px;margin:0}
.brand small{opacity:.7}
.logout{
 color:#fff;background:transparent;border:1px solid #ffffff55;
 padding:8px 13px;border-radius:8px
}

/* MAIN */
main{max-width:1250px;margin:auto;padding:18px}
.toolbar{
 background:#fff;padding:14px;border-radius:13px;
 box-shadow:0 3px 15px #0000000d;margin-bottom:14px
}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
 padding:9px 13px;border:1px solid #d9dee8;
 background:#fff;border-radius:8px
}
.btn.primary{background:#102a56;color:#fff;border-color:#102a56}
.path{font-size:13px;color:#777;margin-top:11px}
.path b{color:#102a56}

/* UPLOAD */
.upload{
 display:none;background:#fff;padding:14px;border-radius:13px;
 box-shadow:0 3px 15px #0000000d;margin-bottom:14px
}
.upload.show{display:block}
.status{font-size:12px;color:#777;margin-top:8px}

/* FILTER */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.filter{
 padding:8px 14px;border:1px solid #d9dee8;
 background:#fff;border-radius:20px
}
.filter.active{background:#102a56;color:#fff;border-color:#102a56}

/* FILE AREA */
.files{
 background:#fff;border-radius:13px;
 box-shadow:0 3px 15px #0000000d;overflow:visible
}
.title{
 padding:14px 16px;border-bottom:1px solid #eee;
 color:#102a56;font-weight:bold
}
.grid{display:grid;grid-template-columns:repeat(4,1fr)}
.item{
 position:relative;min-width:0;padding:16px;
 border-right:1px solid #eee;border-bottom:1px solid #eee
}
.top{display:flex;gap:10px;align-items:flex-start}
.icon{
 width:45px;height:45px;min-width:45px;border-radius:10px;
 background:#edf2fa;display:grid;place-items:center;font-size:23px
}
.folder .icon{background:#fff4d8}
.info{min-width:0;flex:1;padding-right:25px}
.name{font-weight:bold;word-break:break-word;line-height:1.35}
.meta{font-size:11px;color:#777;margin-top:5px}
.star{color:#d69b16}

/* THREE DOT */
.menuBtn{
 position:absolute;right:10px;top:12px;width:34px;height:34px;
 border:0;background:transparent;border-radius:50%;
 font-size:20px;color:#555
}
.menuBtn:hover{background:#eef1f5}
.menu{
 display:none;position:absolute;right:10px;top:48px;width:170px;
 background:#fff;border:1px solid #ddd;border-radius:10px;
 box-shadow:0 8px 25px #0002;z-index:15;overflow:hidden
}
.menu.show{display:block}
.menu button{
 width:100%;padding:10px 13px;border:0;background:#fff;
 text-align:left;font-size:13px
}
.menu button:hover{background:#f3f5f8}
.menu .danger{color:#c62828}

.empty,.loading{text-align:center;padding:45px;color:#777}

/* MODAL */
.modal{
 position:fixed;inset:0;background:#0008;display:none;
 place-items:center;padding:20px;z-index:100
}
.modal.show{display:grid}
.modalbox{
 width:100%;max-width:410px;background:#fff;
 padding:20px;border-radius:14px
}
.modalbox h3{margin:0 0 14px;color:#102a56}
.modalactions{display:flex;gap:8px;margin-top:12px}
.modalactions button{
 flex:1;padding:10px;border-radius:8px;
 border:1px solid #ddd;background:#fff
}
.modalactions .ok{background:#102a56;color:#fff}

/* MOBILE */
@media(max-width:950px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:680px){
 main{padding:12px}
 .grid{grid-template-columns:repeat(2,1fr)}
 header{padding:11px 13px}
 .brandicon{display:none}
 .brand h2{font-size:17px}
}
@media(max-width:420px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<div class="loginbox">
<div class="logo">D</div>
<h1>CreateLK Drive</h1>
<p>Secure Admin File Manager</p>

<input id="password"
 class="input"
 type="password"
 placeholder="Admin password"
 autocomplete="current-password">

<button class="loginbtn" onclick="login()">Login</button>
<div id="loginError" class="error"></div>
</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<header>
<div class="brand">
<div class="brandicon">D</div>
<div>
<h2>CreateLK Drive</h2>
<small>Admin File Manager</small>
</div>
</div>

<button class="logout" onclick="logout()">Logout</button>
</header>


<main>

<div class="toolbar">
<div class="row">
<button class="btn" onclick="goBack()">← Back</button>
<button class="btn primary" onclick="showUpload()">⬆ Upload</button>
<button class="btn" onclick="createFolder()">📁 New Folder</button>
<button class="btn" onclick="loadFiles()">↻ Refresh</button>
</div>

<div class="path">
Location: <b id="path">Home</b>
</div>
</div>


<div id="uploadBox" class="upload">
<div class="row">
<input id="fileInput" type="file" multiple>
<button class="btn primary" onclick="uploadFiles()">Upload</button>
<button class="btn" onclick="hideUpload()">Cancel</button>
</div>
<div id="uploadStatus" class="status"></div>
</div>


<div class="filters">
<button id="filterAll" class="filter active"
onclick="setFilter('all')">All</button>

<button id="filterSaved" class="filter"
onclick="setFilter('saved')">★ Saved</button>

<button id="filterNotSaved" class="filter"
onclick="setFilter('unsaved')">Not Saved</button>
</div>


<div class="files">

<div class="title">Files & Folders</div>

<div id="items" class="grid">
<div class="loading">Loading...</div>
</div>

</div>

</main>
</div>


<!-- MODAL -->
<div id="modal" class="modal">
<div class="modalbox">

<h3 id="modalTitle">Rename</h3>

<input id="modalInput" class="input">

<div class="modalactions">
<button onclick="closeModal()">Cancel</button>
<button class="ok" onclick="confirmModal()">Confirm</button>
</div>

</div>
</div>


<script>

const API="https://drive.createlk.workers.dev";

let TOKEN=localStorage.getItem("drive_token")||"";
let PREFIX="";
let FILTER="all";
let MODAL_ACTION=null;


/* LOGIN */

password.addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

async function login(){

 loginError.textContent="";

 if(!password.value){
  loginError.textContent="Please enter your password.";
  return;
 }

 try{

  const r=await fetch(API+"/auth",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    password:password.value
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success){
   loginError.textContent=d.error||"Login failed.";
   return;
  }

  TOKEN=d.token;
  localStorage.setItem("drive_token",TOKEN);
  password.value="";
  showApp();

 }catch(e){

  loginError.textContent="Connection error. Please try again.";

 }
}


function showApp(){

 loginPage.classList.add("hidden");
 app.classList.remove("hidden");
 loadFiles();

}


function logout(){

 TOKEN="";
 localStorage.removeItem("drive_token");
 location.reload();

}


/* AUTHENTICATED REQUEST */

async function api(url,options={}){

 options.headers={
  ...(options.headers||{}),
  Authorization:"Bearer "+TOKEN
 };

 const r=await fetch(API+url,options);

 if(r.status===401){

  TOKEN="";
  localStorage.removeItem("drive_token");

  alert("Your session has expired. Please login again.");

  location.reload();

  throw new Error("Unauthorized");
 }

 return r;
}


/* LOAD */

async function loadFiles(){

 items.innerHTML='<div class="loading">Loading...</div>';

 try{

  const r=await api(
   "/list?prefix="+encodeURIComponent(PREFIX)
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error(d.error||"Unable to load files.");

  render(d);

 }catch(e){

  items.innerHTML=
   '<div class="empty">'+escapeHtml(e.message)+'</div>';

 }
}


/* RENDER */

function render(data){

 items.innerHTML="";
 updatePath();

 /* FOLDERS */

 for(const folder of data.folders||[]){

  const el=document.createElement("div");
  el.className="item folder";

  el.innerHTML=`

  <button class="menuBtn"
  onclick="toggleMenu(event,this)">
  ⋮
  </button>

  <div class="menu">

   <button onclick="openFolder('${js(folder.key)}')">
   📂 Open
   </button>

   <button onclick="renameFolder('${js(folder.key)}','${js(folder.name)}')">
   ✏️ Rename
   </button>

   <button class="danger"
   onclick="deleteFolder('${js(folder.key)}')">
   🗑 Delete
   </button>

  </div>

  <div class="top" onclick="openFolder('${js(folder.key)}')">

   <div class="icon">📁</div>

   <div class="info">
    <div class="name">${escapeHtml(folder.name)}</div>
    <div class="meta">Folder</div>
   </div>

  </div>`;

  items.appendChild(el);
 }


 /* FILES */

 let files=data.files||[];

 if(FILTER==="saved")
  files=files.filter(f=>f.saved);

 if(FILTER==="unsaved")
  files=files.filter(f=>!f.saved);


 for(const file of files){

  const el=document.createElement("div");
  el.className="item";

  el.innerHTML=`

  <button class="menuBtn"
  onclick="toggleMenu(event,this)">
  ⋮
  </button>

  <div class="menu">

   <button onclick="openFile('${js(file.key)}')">
   👁 Open
   </button>

   <button onclick="downloadFile('${js(file.key)}','${js(file.name)}')">
   ⬇ Download
   </button>

   <button onclick="toggleSave('${js(file.key)}',${file.saved})">
   ${file.saved?"☆ Unsave":"★ Save"}
   </button>

   <button onclick="renameFile('${js(file.key)}','${js(file.name)}')">
   ✏️ Rename
   </button>

   <button class="danger"
   onclick="deleteFile('${js(file.key)}')">
   🗑 Delete
   </button>

  </div>

  <div class="top">

   <div class="icon">${fileIcon(file.name)}</div>

   <div class="info">

    <div class="name">
     ${escapeHtml(file.name)}
     ${file.saved?'<span class="star"> ★</span>':''}
    </div>

    <div class="meta">
     ${formatSize(file.size)}
     ${file.uploaded?
       " • "+new Date(file.uploaded).toLocaleDateString():""}
    </div>

   </div>

  </div>`;

  items.appendChild(el);
 }


 if(!items.children.length)
  items.innerHTML='<div class="empty">No files or folders found.</div>';
}


/* MENU */

function toggleMenu(event,button){

 event.stopPropagation();

 document.querySelectorAll(".menu.show")
 .forEach(m=>m.classList.remove("show"));

 button.nextElementSibling.classList.toggle("show");

}


document.addEventListener("click",()=>{
 document.querySelectorAll(".menu.show")
 .forEach(m=>m.classList.remove("show"));
});


/* FOLDER */

function openFolder(key){

 PREFIX=key;
 loadFiles();

}


function goBack(){

 if(!PREFIX)return;

 const p=PREFIX.replace(/\/$/,"");
 const i=p.lastIndexOf("/");

 PREFIX=i<0?"":p.slice(0,i+1);

 loadFiles();

}


function updatePath(){

 path.textContent=PREFIX
 ?"Home / "+PREFIX.replace(/\/$/,"").replaceAll("/"," / ")
 :"Home";

}


/* CREATE FOLDER */

function createFolder(){

 openModal("Create Folder","",async name=>{

  name=name.trim();

  if(!name)return;

  const r=await api("/create-folder",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name,
    prefix:PREFIX
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Unable to create folder.");

  loadFiles();

 });
}


/* RENAME FILE */

function renameFile(key,name){

 openModal("Rename File",name,async newName=>{

  newName=newName.trim();

  if(!newName)return;

  const r=await api("/rename",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    oldKey:key,
    newName
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Unable to rename file.");

  loadFiles();

 });
}


/* RENAME FOLDER */

function renameFolder(key,name){

 openModal("Rename Folder",name,async newName=>{

  newName=newName.trim();

  if(!newName)return;

  const r=await api("/rename-folder",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    oldPrefix:key,
    newName
   })
  });

  const d=await r.json();

  if(!r.ok||!d.success)
   return alert(d.error||"Unable to rename folder.");

  if(PREFIX.startsWith(key))
   PREFIX=d.newPrefix+PREFIX.slice(key.length);

  loadFiles();

 });
}


/* DELETE FILE */

async function deleteFile(key){

 if(!confirm("Delete this file permanently?"))
  return;

 const r=await api("/delete",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({key})
 });

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Unable to delete file.");

 loadFiles();

}


/* DELETE FOLDER */

async function deleteFolder(prefix){

 if(!confirm("Delete this folder and all files inside it?"))
  return;

 const r=await api("/delete-folder",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({prefix})
 });

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Unable to delete folder.");

 loadFiles();

}


/* SAVE */

async function toggleSave(key,saved){

 const r=await api(
  saved?"/unsave":"/save",
  {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({key})
  }
 );

 const d=await r.json();

 if(!r.ok||!d.success)
  return alert(d.error||"Unable to update saved status.");

 loadFiles();

}


/* OPEN FILE */

async function openFile(key){

 try{

  const r=await api(
   "/photo?key="+encodeURIComponent(key)
  );

  if(!r.ok){

   let message="Unable to open file.";

   try{
    const d=await r.json();
    message=d.error||message;
   }catch{}

   throw Error(message);
  }

  const blob=await r.blob();
  const url=URL.createObjectURL(blob);

  const win=window.open("about:blank","_blank");

  if(!win){
   URL.revokeObjectURL(url);
   throw Error("Please allow pop-ups for CreateLK Drive.");
  }

  win.location.href=url;

  setTimeout(()=>{
   URL.revokeObjectURL(url);
  },60000);

 }catch(e){

  alert("Open failed: "+e.message);

 }
}


/* DOWNLOAD */

async function downloadFile(key,name){

 try{

  const r=await api(
   "/photo?key="+encodeURIComponent(key)
  );

  if(!r.ok){

   let message="Unable to download file.";

   try{
    const d=await r.json();
    message=d.error||message;
   }catch{}

   throw Error(message);
  }

  const blob=await r.blob();
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=name||"download";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>{
   URL.revokeObjectURL(url);
  },60000);

 }catch(e){

  alert("Download failed: "+e.message);

 }
}


/* UPLOAD */

function showUpload(){
 uploadBox.classList.add("show");
}

function hideUpload(){

 uploadBox.classList.remove("show");
 fileInput.value="";
 uploadStatus.textContent="";

}


async function uploadFiles(){

 const selected=[...fileInput.files];

 if(!selected.length)
  return alert("Please select a file.");

 try{

  for(let i=0;i<selected.length;i++){

   uploadStatus.textContent=
    "Uploading "+(i+1)+" of "+selected.length+
    ": "+selected[i].name;

   const form=new FormData();

   form.append("file",selected[i],selected[i].name);
   form.append("prefix",PREFIX);

   const r=await api("/upload",{
    method:"POST",
    body:form
   });

   const d=await r.json();

   if(!r.ok||!d.success)
    throw Error(d.error||"Upload failed.");

  }

  uploadStatus.textContent="Upload completed.";

  fileInput.value="";
  loadFiles();

  setTimeout(hideUpload,900);

 }catch(e){

  uploadStatus.textContent="Error: "+e.message;

 }
}


/* FILTER */

function setFilter(value){

 FILTER=value;

 filterAll.classList.toggle("active",value==="all");
 filterSaved.classList.toggle("active",value==="saved");
 filterNotSaved.classList.toggle("active",value==="unsaved");

 loadFiles();

}


/* MODAL */

function openModal(title,value,callback){

 modalTitle.textContent=title;
 modalInput.value=value;
 MODAL_ACTION=callback;

 modal.classList.add("show");

 setTimeout(()=>{
  modalInput.focus();
  modalInput.select();
 },50);

}


function closeModal(){

 modal.classList.remove("show");
 MODAL_ACTION=null;

}


async function confirmModal(){

 const callback=MODAL_ACTION;
 const value=modalInput.value;

 closeModal();

 if(callback)
  await callback(value);

}


document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
});


/* HELPERS */

function fileIcon(name){

 const e=name.split(".").pop().toLowerCase();

 if(e==="apk")return"📱";
 if(["jpg","jpeg","png","gif","webp","svg"].includes(e))return"🖼️";
 if(e==="pdf")return"📕";
 if(["doc","docx"].includes(e))return"📘";
 if(["xls","xlsx","csv"].includes(e))return"📊";
 if(["ppt","pptx"].includes(e))return"📙";
 if(["zip","rar","7z"].includes(e))return"🗜️";
 if(["mp3","wav"].includes(e))return"🎵";
 if(["mp4","webm"].includes(e))return"🎬";
 if(["txt","json"].includes(e))return"📄";

 return"📎";
}


function formatSize(n){

 if(n<1024)return n+" B";
 if(n<1048576)return(n/1024).toFixed(1)+" KB";
 if(n<1073741824)return(n/1048576).toFixed(1)+" MB";

 return(n/1073741824).toFixed(1)+" GB";
}


function escapeHtml(v){

 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function js(v){

 return String(v)
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'")
 .replace(/\n/g,"\\n")
 .replace(/\r/g,"\\r");

}


/* AUTO LOGIN */

if(TOKEN)showApp();

</script>

</body>
</html>
