<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Seeker Approval | CreateLK Jobs</title>
<meta name="theme-color" content="#102a56">
<link rel="icon" href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fa;
  color:#172033;
  line-height:1.5;
}

header{
  background:#102a56;
  color:#fff;
  padding:14px 16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  font-size:18px;
}

.brand img{
  width:34px;
  height:34px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
}

.logout{
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:700;
}

main{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px 50px;
}

h1{
  color:#102a56;
  font-size:25px;
  margin-bottom:4px;
}

.subtitle{
  color:#68758a;
  font-size:14px;
  margin-bottom:20px;
}

.toolbar{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:12px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.count{
  font-weight:800;
  color:#102a56;
}

.refresh{
  border:0;
  background:#102a56;
  color:#fff;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:700;
}

.message{
  display:none;
  padding:13px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
  font-weight:700;
}

.message.show{display:block}
.message.error{
  background:#fff0f0;
  color:#a32121;
  border:1px solid #f1caca;
}

.message.success{
  background:#edf9f1;
  color:#16733b;
  border:1px solid #c8ead4;
}

.card{
  background:#fff;
  border:1px solid #e2e6ed;
  border-radius:15px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(16,42,86,.05);
}

.card-head{
  background:#f8fafc;
  border-bottom:1px solid #e7ebf0;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.name{
  font-size:19px;
  font-weight:800;
  color:#102a56;
}

.position{
  color:#5c687a;
  font-size:14px;
  margin-top:2px;
}

.badge{
  white-space:nowrap;
  background:#fff4d7;
  color:#775600;
  border:1px solid #efd58d;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  font-weight:800;
}

.body{
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.item{
  background:#f8fafc;
  border:1px solid #e7ebf0;
  border-radius:9px;
  padding:10px;
}

.label{
  display:block;
  color:#758197;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.4px;
  margin-bottom:2px;
}

.value{
  font-size:13px;
  font-weight:700;
  word-break:break-word;
}

.section{
  margin-top:15px;
}

.section h3{
  color:#102a56;
  font-size:14px;
  margin-bottom:6px;
}

.text{
  background:#f8fafc;
  border:1px solid #e7ebf0;
  border-radius:9px;
  padding:10px;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}

.files{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:15px;
}

.file-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 13px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.cv{
  background:#102a56;
  color:#fff;
}

.slip{
  background:#d69b16;
  color:#fff;
}

.actions{
  border-top:1px solid #e7ebf0;
  margin-top:16px;
  padding-top:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.approve,
.reject{
  min-height:44px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
}

.approve{
  background:#168c4a;
  color:#fff;
}

.reject{
  background:#b83232;
  color:#fff;
}

.approve:disabled,
.reject:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.empty{
  background:#fff;
  border:1px solid #e2e6ed;
  border-radius:12px;
  padding:35px 15px;
  text-align:center;
  color:#68758a;
}

.spinner{
  text-align:center;
  padding:30px;
  color:#68758a;
}

@media(max-width:600px){

  main{
    margin-top:18px;
  }

  h1{
    font-size:22px;
  }

  .toolbar{
    align-items:stretch;
    flex-direction:column;
  }

  .refresh{
    width:100%;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card-head{
    flex-direction:column;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .files{
    flex-direction:column;
  }

  .file-btn{
    width:100%;
  }

  .brand{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <a class="brand" href="/jobs">
      <img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png" alt="CreateLK Jobs">
      <span>CreateLK Jobs</span>
    </a>

    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<main>

  <h1>Job Seeker Approval</h1>
  <p class="subtitle">
    Review submitted Job Seeker Profiles and verify payments before publication.
  </p>

  <div id="message" class="message"></div>

  <div class="toolbar">
    <div class="count" id="count">Loading...</div>
    <button class="refresh" onclick="loadProfiles()">Refresh</button>
  </div>

  <div id="list">
    <div class="spinner">Loading pending profiles...</div>
  </div>

</main>

<script>
const API = "https://wanted.createlk.workers.dev";

/*
  IMPORTANT:
  Do NOT put the real ADMIN_KEY in this HTML.
  This page asks for it only when needed and keeps it
  in browser memory for the current page session.
*/

let ADMIN_KEY = sessionStorage.getItem("createlk_wanted_admin_key") || "";

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function value(v, fallback="Not provided"){
  if(v === null || v === undefined || String(v).trim()===""){
    return fallback;
  }
  return String(v).trim();
}

function showMessage(text,type){
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message show " + type;
}

function clearMessage(){
  const box = document.getElementById("message");
  box.className = "message";
  box.textContent = "";
}

function askAdminKey(){

  if(ADMIN_KEY){
    return true;
  }

  const key = prompt("Enter Admin Key:");

  if(!key || !key.trim()){
    return false;
  }

  ADMIN_KEY = key.trim();

  sessionStorage.setItem(
    "createlk_wanted_admin_key",
    ADMIN_KEY
  );

  return true;
}

function headers(){
  return {
    "Accept":"application/json",
    "Authorization":"Bearer " + ADMIN_KEY
  };
}

function formatDate(date){
  if(!date) return "Not available";

  const d = new Date(date);

  if(Number.isNaN(d.getTime())){
    return date;
  }

  return d.toLocaleString("en-LK",{
    year:"numeric",
    month:"long",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function profileLocation(p){
  return [
    p.city,
    p.district,
    p.province
  ].filter(Boolean).join(" • ") || "Sri Lanka";
}

async function loadProfiles(){

  clearMessage();

  if(!askAdminKey()){
    showMessage("Admin key is required.","error");
    return;
  }

  const list = document.getElementById("list");
  const count = document.getElementById("count");

  list.innerHTML =
    '<div class="spinner">Loading pending profiles...</div>';

  try{

    const response = await fetch(
      API + "/api/admin/wanted?status=pending",
      {
        method:"GET",
        headers:headers()
      }
    );

    const data = await response.json();

    if(!response.ok){

      if(response.status === 401){
        sessionStorage.removeItem(
          "createlk_wanted_admin_key"
        );
        ADMIN_KEY = "";
      }

      throw new Error(
        data.error ||
        data.message ||
        "Unable to load profiles."
      );
    }

    const profiles =
      Array.isArray(data)
        ? data
        : Array.isArray(data.profiles)
          ? data.profiles
          : Array.isArray(data.wanted)
            ? data.wanted
            : [];

    count.textContent =
      profiles.length +
      (profiles.length === 1
        ? " pending profile"
        : " pending profiles");

    if(!profiles.length){

      list.innerHTML = `
        <div class="empty">
          <strong>No pending profiles</strong><br>
          New Job Seeker Profiles will appear here after submission.
        </div>
      `;

      return;
    }

    list.innerHTML =
      profiles.map(renderProfile).join("");

  }catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Unable to load pending profiles.<br>
        ${esc(error.message)}
      </div>`;

    count.textContent = "Unable to load";
  }
}

function renderProfile(p){

  const id = value(p.id,"");

  return `
    <div class="card" id="card-${esc(id)}">

      <div class="card-head">

        <div>
          <div class="name">${esc(value(p.name))}</div>
          <div class="position">
            ${esc(value(p.position))}
          </div>
        </div>

        <div class="badge">PENDING APPROVAL</div>

      </div>

      <div class="body">

        <div class="grid">

          <div class="item">
            <span class="label">Location</span>
            <span class="value">
              ${esc(profileLocation(p))}
            </span>
          </div>

          <div class="item">
            <span class="label">Expected Salary</span>
            <span class="value">
              ${esc(value(p.salary))}
            </span>
          </div>

          <div class="item">
            <span class="label">Phone</span>
            <span class="value">
              ${esc(value(p.phone))}
            </span>
          </div>

          <div class="item">
            <span class="label">WhatsApp</span>
            <span class="value">
              ${esc(value(p.whatsapp))}
            </span>
          </div>

          <div class="item">
            <span class="label">Experience</span>
            <span class="value">
              ${esc(value(p.experience))}
            </span>
          </div>

          <div class="item">
            <span class="label">Education</span>
            <span class="value">
              ${esc(value(p.education))}
            </span>
          </div>

          <div class="item">
            <span class="label">Amount</span>
            <span class="value">
              LKR ${esc(value(p.amount,"500"))}
            </span>
          </div>

          <div class="item">
            <span class="label">Submitted</span>
            <span class="value">
              ${esc(formatDate(p.created_at))}
            </span>
          </div>

        </div>

        <div class="section">
          <h3>Skills</h3>
          <div class="text">${esc(value(p.skills))}</div>
        </div>

        <div class="section">
          <h3>Short Introduction</h3>
          <div class="text">
            ${esc(value(p.description,"No introduction provided."))}
          </div>
        </div>

        <div class="files">

          <a
            class="file-btn cv"
            href="${API}/api/cv/${encodeURIComponent(id)}"
            target="_blank"
            rel="noopener">
            View CV
          </a>

          <button
            class="file-btn slip"
            type="button"
            onclick="viewSlip('${encodeURIComponent(id)}')">
            View Bank Slip
          </button>

        </div>

        <div class="actions">

          <button
            class="approve"
            id="approve-${esc(id)}"
            onclick="approveProfile('${encodeURIComponent(id)}')">
            ✓ Approve Profile
          </button>

          <button
            class="reject"
            id="reject-${esc(id)}"
            onclick="rejectProfile('${encodeURIComponent(id)}')">
            Reject
          </button>

        </div>

      </div>
    </div>
  `;
}

async function viewSlip(encodedId){

  if(!askAdminKey()){
    return;
  }

  const id = decodeURIComponent(encodedId);

  try{

    const response = await fetch(
      API + "/api/admin/slip/" +
      encodeURIComponent(id),
      {
        method:"GET",
        headers:headers()
      }
    );

    if(!response.ok){

      let data = {};

      try{
        data = await response.json();
      }catch(e){}

      throw new Error(
        data.error ||
        "Unable to open bank slip."
      );
    }

    const blob = await response.blob();

    const url = URL.createObjectURL(blob);

    window.open(url,"_blank","noopener");

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },60000);

  }catch(error){

    showMessage(
      error.message || "Unable to open bank slip.",
      "error"
    );
  }
}

async function approveProfile(encodedId){

  const id = decodeURIComponent(encodedId);

  if(!askAdminKey()){
    return;
  }

  if(!confirm(
    "Approve this Job Seeker Profile?\n\n" +
    "Payment will be marked as verified and the profile " +
    "will become public for 30 days."
  )){
    return;
  }

  const approve =
    document.getElementById("approve-" + id);

  const reject =
    document.getElementById("reject-" + id);

  if(approve) approve.disabled = true;
  if(reject) reject.disabled = true;

  try{

    const response = await fetch(
      API + "/api/admin/wanted/" +
      encodeURIComponent(id) +
      "/approve",
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":"application/json"
        },
        body:"{}"
      }
    );

    const data = await response.json();

    if(!response.ok){

      if(response.status === 401){
        sessionStorage.removeItem(
          "createlk_wanted_admin_key"
        );
        ADMIN_KEY = "";
      }

      throw new Error(
        data.error ||
        data.message ||
        "Approval failed."
      );
    }

    showMessage(
      "Profile approved successfully. It is now active for 30 days.",
      "success"
    );

    const card =
      document.getElementById("card-" + id);

    if(card){
      card.remove();
    }

    updateCount();

  }catch(error){

    showMessage(
      error.message || "Approval failed.",
      "error"
    );

    if(approve) approve.disabled = false;
    if(reject) reject.disabled = false;
  }
}

async function rejectProfile(encodedId){

  const id = decodeURIComponent(encodedId);

  if(!askAdminKey()){
    return;
  }

  const reason = prompt(
    "Optional rejection reason:"
  );

  if(reason === null){
    return;
  }

  if(!confirm(
    "Reject this Job Seeker Profile?"
  )){
    return;
  }

  const approve =
    document.getElementById("approve-" + id);

  const reject =
    document.getElementById("reject-" + id);

  if(approve) approve.disabled = true;
  if(reject) reject.disabled = true;

  try{

    const response = await fetch(
      API + "/api/admin/wanted/" +
      encodeURIComponent(id) +
      "/reject",
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          reason:reason.trim()
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      if(response.status === 401){
        sessionStorage.removeItem(
          "createlk_wanted_admin_key"
        );
        ADMIN_KEY = "";
      }

      throw new Error(
        data.error ||
        data.message ||
        "Rejection failed."
      );
    }

    showMessage(
      "Profile rejected successfully.",
      "success"
    );

    const card =
      document.getElementById("card-" + id);

    if(card){
      card.remove();
    }

    updateCount();

  }catch(error){

    showMessage(
      error.message || "Rejection failed.",
      "error"
    );

    if(approve) approve.disabled = false;
    if(reject) reject.disabled = false;
  }
}

function updateCount(){

  const cards =
    document.querySelectorAll(".card").length;

  const count =
    document.getElementById("count");

  count.textContent =
    cards +
    (cards === 1
      ? " pending profile"
      : " pending profiles");

  if(cards === 0){

    document.getElementById("list").innerHTML = `
      <div class="empty">
        <strong>No pending profiles</strong><br>
        All submitted profiles have been processed.
      </div>
    `;
  }
}

function logout(){

  sessionStorage.removeItem(
    "createlk_wanted_admin_key"
  );

  ADMIN_KEY = "";

  document.getElementById("list").innerHTML = `
    <div class="empty">
      Admin session cleared.<br>
      Click <strong>Refresh</strong> and enter the Admin Key again.
    </div>
  `;

  document.getElementById("count").textContent =
    "Admin session ended";

  clearMessage();
}

/* Load automatically */
loadProfiles();
</script>

</body>
</html>
