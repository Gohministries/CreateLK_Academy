<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Find Jobs | CreateLK Jobs</title>

<meta name="description"
content="Search approved jobs and career opportunities across Sri Lanka with CreateLK Jobs.">

<meta name="theme-color" content="#102a56">

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f7f9fc;
color:#172033;
line-height:1.5
}

a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

.container{
width:min(1120px,92%);
margin:auto
}

/* HEADER */

header{
background:#fff;
border-bottom:1px solid #e7ebf2;
position:sticky;
top:0;
z-index:1000
}

.header{
min-height:70px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
display:flex;
align-items:center;
gap:9px;
color:#102a56;
font-size:19px;
font-weight:800
}

.logo img{
width:40px;
height:40px;
object-fit:contain
}

.nav{
display:flex;
gap:10px;
align-items:center
}

.nav a{
font-size:12px;
font-weight:700;
color:#455168;
padding:9px 11px;
border-radius:7px
}

.nav a:hover{
background:#f1f4f8
}

.post{
background:#d69b16;
color:#fff!important
}

/* MAIN */

main{
padding:42px 0 60px
}

.heading{
text-align:center;
margin-bottom:25px
}

.heading h1{
font-family:"Playfair Display",serif;
color:#102a56;
font-size:34px;
margin-bottom:5px
}

.heading p{
color:#718096;
font-size:13px
}

/* SEARCH */

.search-box{
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
padding:15px;
margin-bottom:25px
}

.search-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
gap:8px
}

.search-row input,
.search-row select{
height:40px;
border:1px solid #dce2ea;
border-radius:7px;
padding:0 10px;
background:#fff;
color:#3e4a60;
font-size:12px;
outline:none
}

.search-row input:focus,
.search-row select:focus{
border-color:#102a56
}

.search-btn{
height:40px;
border:0;
border-radius:7px;
padding:0 17px;
background:#102a56;
color:#fff;
font-size:12px;
font-weight:800;
cursor:pointer
}

.search-btn:hover{
background:#173d78
}

.search-btn:active{
transform:scale(.98)
}

/* RESULT BAR */

.result-bar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
font-size:12px;
color:#718096
}

.clear{
border:0;
background:none;
color:#102a56;
font-size:12px;
font-weight:800;
cursor:pointer
}

/* JOBS */

.jobs{
display:flex;
flex-direction:column;
align-items:center;
gap:12px
}

.job{
width:100%;
max-width:850px;
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
overflow:hidden;
box-shadow:0 3px 12px rgba(16,42,86,.03)
}

.job-main{
display:grid;
grid-template-columns:200px 1fr
}

.photo-wrap,
.job-photo,
.no-photo{
width:200px;
height:200px;
aspect-ratio:1/1
}

.job-photo{
object-fit:cover;
display:block
}

.no-photo{
display:flex;
align-items:center;
justify-content:center;
background:#eef2f7;
color:#718096;
font-size:12px;
font-weight:700
}

.job-content{
padding:15px 20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

/* LABEL */

.ad-label{
display:inline-block;
margin-bottom:7px;
padding:5px 10px;
border-radius:20px;
background:#fff3d6;
border:1px solid #e6c46a;
color:#9a6800;
font-size:10px;
font-weight:800;
letter-spacing:.3px
}

/* LOCATION */

.job-location{
color:#6b7280;
font-size:10px;
font-weight:700;
margin-bottom:5px
}

/* TITLE */

.job-title{
font-family:"Playfair Display",serif;
color:#102a56;
font-size:19px;
font-weight:700;
line-height:1.25;
margin-bottom:5px
}

/* DESCRIPTION */

.description{
max-width:550px;
color:#68748a;
font-size:12px;
line-height:1.5;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden
}

/* BUTTONS */

.job-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:8px;
border-top:1px solid #edf0f4
}

.contact-btn{
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px;
border:0;
font-size:12px;
font-weight:800;
cursor:pointer
}

.whatsapp{
background:#168b45;
color:#fff
}

.call{
background:#102a56;
color:#fff
}

.disabled{
background:#e3e7ed;
color:#8993a4
}

/* STATUS */

.status{
width:100%;
max-width:850px;
text-align:center;
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
padding:25px;
color:#718096;
font-size:12px
}

.status strong{
display:block;
color:#102a56;
margin-bottom:3px
}

/* PAGINATION */

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:7px;
margin-top:22px;
flex-wrap:wrap
}

.pagination button{
min-width:36px;
height:36px;
padding:0 10px;
border:1px solid #d9e0ea;
border-radius:6px;
background:#fff;
color:#455168;
font-size:12px;
font-weight:800;
cursor:pointer
}

.pagination button:hover{
border-color:#102a56
}

.pagination button.active{
background:#102a56;
border-color:#102a56;
color:#fff
}

.pagination button:disabled{
opacity:.4;
cursor:not-allowed
}

/* MOBILE */

@media(max-width:1000px){

.search-row{
grid-template-columns:repeat(2,1fr)
}

.search-row input{
grid-column:1/-1
}

.search-btn{
width:100%
}

.nav{
gap:3px
}

}

@media(max-width:700px){

.container{
width:90%
}

.nav a{
display:none
}

.nav .post{
display:block
}

main{
padding-top:30px
}

.heading h1{
font-size:29px
}

.search-row{
grid-template-columns:1fr
}

.search-row input{
grid-column:auto
}

.job-main{
grid-template-columns:1fr
}

.photo-wrap,
.job-photo,
.no-photo{
width:100%;
height:auto;
aspect-ratio:1/1
}

.job-content{
padding:15px
}

}

@media(max-width:450px){

.heading h1{
font-size:26px
}

.job-title{
font-size:18px
}

.job-actions{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="container header">

<a href="../index.html" class="logo">

<img
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">

<span>CreateLK Jobs</span>

</a>

<nav class="nav">

<a href="../index.html">
Home
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="post-ad.html" class="post">
Post a Job
</a>

</nav>

</div>

</header>

<main>

<div class="container">

<div class="heading">

<h1>Find Jobs</h1>

<p>
Discover approved jobs and opportunities across Sri Lanka.
</p>

</div>

<div id="error" class="status" style="display:none;color:#991b1b">
<strong>Jobs could not be loaded.</strong>
</div>

<div class="search-box">

<div class="search-row">

<input
id="search"
type="search"
placeholder="Search jobs, titles or descriptions..."
autocomplete="off">

<select id="province">

<option value="">
All Provinces
</option>

</select>

<select id="district" disabled>

<option value="">
All Districts
</option>

</select>

<select id="city" disabled>

<option value="">
All Cities
</option>

</select>

<select id="type">

<option value="">
All Ad Types
</option>

<option value="free">
Free
</option>

<option value="featured">
Featured
</option>

<option value="urgent">
Urgent
</option>

<option value="top">
Top
</option>

<option value="featured_urgent_top">
Featured + Urgent + Top
</option>

</select>

<button
id="searchBtn"
class="search-btn">

Search

</button>

</div>

</div>

<div class="result-bar">

<span id="count">
Loading...
</span>

<button
id="clear"
class="clear">

Clear Filters

</button>

</div>

<div class="jobs" id="jobs">

<div class="status">

<strong>
Loading jobs...
</strong>

Please wait.

</div>

</div>

<div id="pagination" class="pagination"></div>

</div>

</main>

<script>

const API="https://ads.createlk.workers.dev";

const $=id=>document.getElementById(id);

let allAds=[];
let filteredAds=[];
let currentPage=1;

const PER_PAGE=10;

/* HELPERS */

function esc(v){

return String(v??"")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));

}

function normalize(v){

return String(v??"")
.trim()
.toLowerCase();

}

function valueText(ad,keys){

for(const key of keys){

if(
ad?.[key]!==undefined &&
ad?.[key]!==null &&
String(ad[key]).trim()!==""
){

return String(ad[key]);

}

}

return "";

}

/* AD LABEL */

function adLabel(type){

switch(normalize(type)){

case "featured":
return "FEATURED";

case "urgent":
return "URGENT";

case "top":
return "TOP";

case "featured_urgent_top":
return "FEATURED • URGENT • TOP";

default:
return "FREE";

}

}

/* PREMIUM PRIORITY */

function adPriority(ad){

const serverPriority=Number(ad?.priority);

if(Number.isFinite(serverPriority))
return serverPriority;

switch(normalize(ad?.ad_type)){

case "featured_urgent_top":
return 4;

case "top":
return 3;

case "featured":
return 2;

case "urgent":
return 1;

default:
return 0;

}

}

/* PHOTO */

function getPhoto(value){

if(!value)
return "";

if(/^https?:\/\//i.test(value))
return value;

return API+
"/photo?key="+
encodeURIComponent(value);

}

/* PHONE */

function cleanPhone(value){

let phone=
String(value||"")
.replace(/[^\d+]/g,"");

if(phone.startsWith("+"))
phone=phone.substring(1);

if(phone.startsWith("0"))
phone="94"+phone.substring(1);

return phone;

}

/* LOCATIONS */

async function loadProvinces(){

try{

const r=
await fetch(API+"/locations");

const d=
await r.json();

if(!r.ok||!d.success)
throw Error("Could not load provinces.");

$("province").innerHTML=
`<option value="">All Provinces</option>`+
(d.provinces||[])
.map(x=>{

const value=
typeof x==="object"
?(x.name||x.province||"")
:String(x);

return value
?`<option value="${esc(value)}">${esc(value)}</option>`
:"";

})
.join("");

}catch(e){

console.error(e);

}

}

async function loadDistricts(province){

$("district").innerHTML=
`<option value="">All Districts</option>`;

$("city").innerHTML=
`<option value="">All Cities</option>`;

$("district").disabled=true;
$("city").disabled=true;

if(!province){

applyFilters();
return;

}

try{

const r=
await fetch(
API+
"/locations?province="+
encodeURIComponent(province)
);

const d=
await r.json();

if(!r.ok||!d.success)
throw Error("Could not load districts.");

$("district").innerHTML=
`<option value="">All Districts</option>`+
(d.districts||[])
.map(x=>{

const value=
typeof x==="object"
?(x.name||x.district||"")
:String(x);

return value
?`<option value="${esc(value)}">${esc(value)}</option>`
:"";

})
.join("");

$("district").disabled=
$("district").options.length<=1;

applyFilters();

}catch(e){

console.error(e);
applyFilters();

}

}

async function loadCities(province,district){

$("city").innerHTML=
`<option value="">All Cities</option>`;

$("city").disabled=true;

if(!province||!district){

applyFilters();
return;

}

try{

const r=
await fetch(
API+
"/locations?province="+
encodeURIComponent(province)+
"&district="+
encodeURIComponent(district)
);

const d=
await r.json();

if(!r.ok||!d.success)
throw Error("Could not load cities.");

$("city").innerHTML=
`<option value="">All Cities</option>`+
(d.cities||[])
.map(x=>{

const value=
typeof x==="object"
?(x.name||x.city||"")
:String(x);

return value
?`<option value="${esc(value)}">${esc(value)}</option>`
:"";

})
.join("");

$("city").disabled=
$("city").options.length<=1;

applyFilters();

}catch(e){

console.error(e);
applyFilters();

}

}

/* FILTER */

function applyFilters(){

const q=
normalize($("search").value);

const province=
normalize($("province").value);

const district=
normalize($("district").value);

const city=
normalize($("city").value);

const type=
normalize($("type").value);

filteredAds=
allAds.filter(ad=>{

const title=
normalize(valueText(ad,[
"title",
"job_title",
"jobTitle"
]));

const description=
normalize(valueText(ad,[
"description",
"details",
"job_description",
"jobDescription"
]));

const company=
normalize(valueText(ad,[
"company",
"company_name",
"companyName",
"employer",
"employer_name",
"employerName"
]));

const category=
normalize(valueText(ad,[
"category",
"category_name",
"categoryName",
"category_slug",
"categorySlug"
]));

const adProvince=
normalize(valueText(ad,[
"province",
"province_name",
"provinceName"
]));

const adDistrict=
normalize(valueText(ad,[
"district",
"district_name",
"districtName"
]));

const adCity=
normalize(valueText(ad,[
"city",
"city_name",
"cityName"
]));

const keyword=
!q||
title.includes(q)||
description.includes(q)||
company.includes(q)||
category.includes(q)||
adProvince.includes(q)||
adDistrict.includes(q)||
adCity.includes(q);

if(!keyword)
return false;

if(province&&adProvince!==province)
return false;

if(district&&adDistrict!==district)
return false;

if(city&&adCity!==city)
return false;

if(type&&normalize(ad.ad_type)!==type)
return false;

return true;

});

/*
PREMIUM ADS FIRST

4 = Featured + Urgent + Top
3 = Top
2 = Featured
1 = Urgent
0 = Free

Then newer ads first.
*/

filteredAds.sort((a,b)=>{

const priorityA=
adPriority(a);

const priorityB=
adPriority(b);

if(priorityA!==priorityB)
return priorityB-priorityA;

const dateA=
Date.parse(
a.approved_at||
a.created_at||
""
)||0;

const dateB=
Date.parse(
b.approved_at||
b.created_at||
""
)||0;

return dateB-dateA;

});

currentPage=1;

render();

}

/* RENDER */

function render(){

const jobs=$("jobs");

$("count").textContent=
`${filteredAds.length} ${
filteredAds.length===1
?"job"
:"jobs"
} found`;

if(!filteredAds.length){

jobs.innerHTML=`
<div class="status">

<strong>
No matching jobs found.
</strong>

Try another search or filter.

</div>
`;

$("pagination").innerHTML="";

return;

}

const start=
(currentPage-1)*PER_PAGE;

const list=
filteredAds.slice(
start,
start+PER_PAGE
);

jobs.innerHTML="";

list.forEach(ad=>{

const title=
valueText(ad,[
"title",
"job_title",
"jobTitle"
])||
"Job Opportunity";

const description=
valueText(ad,[
"description",
"details",
"job_description",
"jobDescription"
])||
"No description provided.";

const location=[
valueText(ad,[
"province",
"province_name",
"provinceName"
]),

valueText(ad,[
"district",
"district_name",
"districtName"
]),

valueText(ad,[
"city",
"city_name",
"cityName"
])

]
.filter(Boolean)
.join(" • ");

const image=
getPhoto(
valueText(ad,[
"photo_url",
"photo",
"photo_key",
"image"
])
);

const whatsapp=
valueText(ad,[
"whatsapp_no",
"whatsapp_number",
"whatsapp"
]).trim();

const call=
valueText(ad,[
"call_no",
"call_number",
"phone",
"phone_number"
]).trim();

const label=
adLabel(
valueText(ad,[
"ad_type",
"adType",
"type"
])
);

const card=
document.createElement("article");

card.className="job";

card.innerHTML=`

<div class="job-main">

<div class="photo-wrap">

${
image
?
`
<img
class="job-photo"
src="${esc(image)}"
alt="${esc(title)}"
loading="lazy"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
">

<div
class="no-photo"
style="display:none">
No Photo
</div>
`
:
`
<div class="no-photo">
No Photo
</div>
`
}

</div>

<div class="job-content">

<div class="ad-label">
${esc(label)}
</div>

${
location
?
`
<div class="job-location">
📍 ${esc(location)}
</div>
`
:""
}

<div class="job-title">
${esc(title)}
</div>

<p class="description">
${esc(description)}
</p>

</div>

</div>

<div class="job-actions">

${
whatsapp
?
`
<a
class="contact-btn whatsapp"
href="https://wa.me/${cleanPhone(whatsapp)}"
target="_blank"
rel="noopener noreferrer">
WhatsApp
</a>
`
:
`
<button
class="contact-btn disabled"
disabled>
WhatsApp
</button>
`
}

${
call
?
`
<a
class="contact-btn call"
href="tel:${cleanPhone(call)}">
Call
</a>
`
:
`
<button
class="contact-btn disabled"
disabled>
Call
</button>
`
}

</div>
`;

jobs.appendChild(card);

});

renderPagination();

}

/* PAGINATION */

function renderPagination(){

const pages=
Math.ceil(
filteredAds.length/PER_PAGE
);

if(pages<=1){

$("pagination").innerHTML="";
return;

}

let html=`

<button
onclick="changePage(${currentPage-1})"
${currentPage===1?"disabled":""}>
Previous
</button>
`;

for(let i=1;i<=pages;i++){

html+=`

<button
class="${i===currentPage?"active":""}"
onclick="changePage(${i})">

${i}

</button>

`;

}

html+=`

<button
onclick="changePage(${currentPage+1})"
${currentPage===pages?"disabled":""}>
Next
</button>
`;

$("pagination").innerHTML=html;

}

function changePage(page){

const pages=
Math.ceil(
filteredAds.length/PER_PAGE
);

if(page<1||page>pages)
return;

currentPage=page;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* LOAD JOBS */

async function loadJobs(){

$("jobs").innerHTML=`
<div class="status">

<strong>
Loading jobs...
</strong>

Please wait.

</div>
`;

try{

const r=
await fetch(
API+"/latest",
{cache:"no-store"}
);

const data=
await r.json();

if(!r.ok||!data.success)
throw Error(
data.error||
"Could not load jobs."
);

allAds=
Array.isArray(data.ads)
?data.ads
:Array.isArray(data.data)
?data.data
:[];

applyFilters();

}catch(e){

console.error("Jobs error:",e);

$("jobs").innerHTML=`
<div class="status">

<strong>
Jobs could not be loaded.
</strong>

Please try again later.

</div>
`;

$("count").textContent="";

}

}

/* EVENTS */

$("province").addEventListener(
"change",
e=>loadDistricts(e.target.value)
);

$("district").addEventListener(
"change",
e=>loadCities(
$("province").value,
e.target.value
)
);

$("city").addEventListener(
"change",
applyFilters
);

$("type").addEventListener(
"change",
applyFilters
);

$("search").addEventListener(
"input",
applyFilters
);

$("searchBtn").addEventListener(
"click",
applyFilters
);

$("clear").addEventListener(
"click",
()=>{

$("search").value="";
$("province").value="";

$("district").innerHTML=
`<option value="">All Districts</option>`;

$("district").disabled=true;

$("city").innerHTML=
`<option value="">All Cities</option>`;

$("city").disabled=true;

$("type").value="";

applyFilters();

}
);

/* START */

(async()=>{

await loadProvinces();

await loadJobs();

})();
</script>

</body>
</html>
