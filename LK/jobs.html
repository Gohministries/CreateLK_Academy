<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Jobs | CreateLK Jobs</title>
<meta name="description" content="Find approved jobs and career opportunities across Sri Lanka.">
<meta name="theme-color" content="#102a56">
<link rel="icon" href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.container{width:min(1120px,92%);margin:auto}

header{background:#fff;border-bottom:1px solid #e5e9ef;position:sticky;top:0;z-index:10}
.header{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:#102a56}
.logo img{width:40px;height:40px;object-fit:contain}
.nav{display:flex;gap:8px}
.nav a{padding:9px 11px;font-size:12px;font-weight:700;color:#455168}
.nav a:hover{background:#f1f4f8;border-radius:7px}

main{padding:35px 0}
.heading{text-align:center;margin-bottom:22px}
.heading h1{color:#102a56;font-size:30px;margin-bottom:5px}
.heading p{font-size:13px;color:#718096}

.search-box{
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
padding:14px;
margin-bottom:20px
}

.search-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
gap:7px
}

.search-row input,
.search-row select{
height:40px;
border:1px solid #dce2ea;
border-radius:7px;
padding:0 9px;
font-size:12px;
background:#fff;
color:#3e4a60;
outline:none
}

.search-row input:focus,
.search-row select:focus{border-color:#102a56}

.search-btn{
height:40px;
border:0;
border-radius:7px;
background:#102a56;
color:#fff;
padding:0 15px;
font-weight:800;
cursor:pointer
}

.result{
display:flex;
justify-content:space-between;
margin-bottom:12px;
color:#718096;
font-size:12px
}

.clear{
border:0;
background:none;
color:#102a56;
font-weight:800;
cursor:pointer
}

.jobs{
display:flex;
flex-direction:column;
align-items:center;
gap:12px
}

.card{
width:100%;
max-width:850px;
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
overflow:hidden
}

.card-main{
display:grid;
grid-template-columns:190px 1fr
}

.photo,.no-photo{
width:190px;
height:190px
}

.photo{object-fit:cover;display:block}

.no-photo{
display:flex;
align-items:center;
justify-content:center;
background:#eef2f7;
color:#718096;
font-size:12px
}

.content{
text-align:center;
padding:15px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.label{
background:#fff3d6;
color:#9a6800;
border-radius:20px;
padding:4px 9px;
font-size:9px;
font-weight:800;
margin-bottom:6px
}

.location{
font-size:10px;
color:#68748a;
margin-bottom:4px
}

.title{
font-size:18px;
font-weight:800;
color:#102a56;
margin-bottom:5px
}

.desc{
font-size:12px;
color:#68748a;
max-width:550px;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
padding:7px;
border-top:1px solid #edf0f4
}

.action{
height:37px;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:800
}

.wa{background:#168b45;color:#fff}
.call{background:#102a56;color:#fff}
.disabled{background:#e3e7ed;color:#8993a4}

.status{
width:100%;
max-width:850px;
text-align:center;
background:#fff;
border:1px solid #e1e6ee;
border-radius:10px;
padding:25px;
color:#718096;
font-size:12px
}

.status strong{
display:block;
color:#102a56;
margin-bottom:3px
}

.pagination{
display:flex;
justify-content:center;
gap:6px;
margin-top:20px
}

.pagination button{
height:35px;
min-width:35px;
border:1px solid #dce2ea;
background:#fff;
border-radius:6px;
cursor:pointer
}

.pagination button:disabled{
opacity:.4;
cursor:not-allowed
}

.pagination .active{
background:#102a56;
color:#fff;
border-color:#102a56
}

@media(max-width:1000px){
.search-row{grid-template-columns:repeat(2,1fr)}
.search-row input{grid-column:1/-1}
.search-btn{width:100%}
}

@media(max-width:650px){
.container{width:92%}

.nav a{display:none}
.nav a:first-child,
.nav a:nth-child(2){display:block}

.search-row{grid-template-columns:1fr}
.search-row input{grid-column:auto}

.card-main{grid-template-columns:1fr}

.photo,.no-photo{
width:100%;
height:auto;
aspect-ratio:1
}

.actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="container header">

<a href="../index.html" class="logo">
<img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png" alt="CreateLK Jobs">
<span>CreateLK Jobs</span>
</a>

<nav class="nav">
<a href="../index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</div>
</header>

<main>
<div class="container">

<div class="heading">
<h1>Find Jobs</h1>
<p>Discover approved jobs and opportunities across Sri Lanka.</p>
</div>

<div class="search-box">

<div class="search-row">

<input
id="search"
type="search"
placeholder="Search jobs, titles or descriptions..."
autocomplete="off">

<select id="province">
<option value="">All Provinces</option>
</select>

<select id="district" disabled>
<option value="">All Districts</option>
</select>

<select id="city" disabled>
<option value="">All Cities</option>
</select>

<select id="category">
<option value="">All Categories</option>
</select>

<select id="adtype">
<option value="">All Ad Types</option>
<option value="free">Free</option>
<option value="featured">Featured</option>
<option value="urgent">Urgent</option>
<option value="top">Top</option>
<option value="featured_urgent_top">Featured + Urgent + Top</option>
</select>

<button id="searchBtn" class="search-btn">Search</button>

</div>
</div>

<div class="result">
<span id="count">Loading...</span>
<button id="clear" class="clear">Clear Filters</button>
</div>

<div class="jobs" id="jobs">
<div class="status">
<strong>Loading jobs...</strong>
Please wait.
</div>
</div>

<div class="pagination" id="pagination"></div>

</div>
</main>

<script>
const API="https://ads.createlk.workers.dev";
const CAT="https://categories.createlk.workers.dev";

let ads=[],filtered=[],page=1;
const perPage=10;
const $=id=>document.getElementById(id);
const norm=v=>String(v??"").trim().toLowerCase();

function val(a,keys){
for(const k of keys)
if(a[k]!=null&&String(a[k]).trim())return String(a[k]);
return "";
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function phone(v){
v=String(v||"").replace(/[^\d+]/g,"");
if(v.startsWith("+"))v=v.slice(1);
if(v.startsWith("0"))v="94"+v.slice(1);
return v;
}

function photo(v){
if(!v)return "";
return /^https?:\/\//i.test(v)
?v
:API+"/photo?key="+encodeURIComponent(v);
}

async function loadCategories(){
try{
const r=await fetch(CAT+"/categories",{cache:"no-store"});
const d=await r.json();
const list=Array.isArray(d.categories)?d.categories:[];

list.forEach(x=>{
if(!x.name)return;
const o=document.createElement("option");
o.value=x.id||x.slug||x.name;
o.textContent=x.name;
o.dataset.name=x.name;
o.dataset.slug=x.slug||"";
$("category").appendChild(o);
});

}catch(e){
console.error("Category error:",e);
}
}

async function loadLocations(){
try{
const r=await fetch(API+"/locations",{cache:"no-store"});
const d=await r.json();

$("province").innerHTML=
'<option value="">All Provinces</option>'+
(d.provinces||[]).map(x=>{
x=typeof x==="object"?(x.name||x.province):x;
return `<option value="${esc(x)}">${esc(x)}</option>`;
}).join("");

}catch(e){
console.error("Location error:",e);
}
}

async function loadDistricts(){

const province=$("province").value;

$("district").innerHTML='<option value="">All Districts</option>';
$("city").innerHTML='<option value="">All Cities</option>';

$("district").disabled=!province;
$("city").disabled=true;

if(!province){
filter();
return;
}

try{

const r=await fetch(
API+"/locations?province="+encodeURIComponent(province),
{cache:"no-store"}
);

const d=await r.json();

$("district").innerHTML+=
(d.districts||[]).map(x=>{
x=typeof x==="object"?(x.name||x.district):x;
return `<option value="${esc(x)}">${esc(x)}</option>`;
}).join("");

filter();

}catch(e){
console.error(e);
filter();
}
}

async function loadCities(){

const province=$("province").value;
const district=$("district").value;

$("city").innerHTML='<option value="">All Cities</option>';
$("city").disabled=!district;

if(!province||!district){
filter();
return;
}

try{

const r=await fetch(
API+"/locations?province="+encodeURIComponent(province)+
"&district="+encodeURIComponent(district),
{cache:"no-store"}
);

const d=await r.json();

$("city").innerHTML+=
(d.cities||[]).map(x=>{
x=typeof x==="object"?(x.name||x.city):x;
return `<option value="${esc(x)}">${esc(x)}</option>`;
}).join("");

filter();

}catch(e){
console.error(e);
filter();
}
}

function categoryOK(ad){

const selected=norm($("category").value);

if(!selected)return true;

const option=$("category").selectedOptions[0];

const values=[
val(ad,["category_id","categoryId"]),
val(ad,["category","category_name","categoryName","category_slug","categorySlug"])
].map(norm);

return values.includes(selected)||
values.includes(norm(option.dataset.name))||
values.includes(norm(option.dataset.slug));
}

function filter(){

const q=norm($("search").value);
const province=norm($("province").value);
const district=norm($("district").value);
const city=norm($("city").value);
const type=norm($("adtype").value);

filtered=ads.filter(ad=>{

const text=norm([
val(ad,["title","job_title","jobTitle"]),
val(ad,["description","details","job_description","jobDescription"]),
val(ad,["company","company_name","companyName"]),
val(ad,["category","category_name","categoryName"]),
val(ad,["province","province_name"]),
val(ad,["district","district_name"]),
val(ad,["city","city_name"])
].join(" "));

if(q&&!text.includes(q))return false;

if(
province&&
norm(val(ad,["province","province_name","provinceName"]))!==province
)return false;

if(
district&&
norm(val(ad,["district","district_name","districtName"]))!==district
)return false;

if(
city&&
norm(val(ad,["city","city_name","cityName"]))!==city
)return false;

if(type&&norm(ad.ad_type)!==type)return false;

if(!categoryOK(ad))return false;

return true;
});

filtered.sort((a,b)=>{

const priority=x=>({
featured_urgent_top:4,
top:3,
featured:2,
urgent:1
}[norm(x.ad_type)]||0);

const p=priority(b)-priority(a);

if(p)return p;

return(
Date.parse(b.approved_at||b.created_at||"")||0
)-
(
Date.parse(a.approved_at||a.created_at||"")||0
);

});

page=1;
render();
}

function render(){

const total=filtered.length;

$("count").textContent=
`${total} ${total===1?"job":"jobs"} found`;

if(!total){

$("jobs").innerHTML=`
<div class="status">
<strong>No matching jobs found.</strong>
Try another search or filter.
</div>
`;

$("pagination").innerHTML="";
return;
}

const start=(page-1)*perPage;

$("jobs").innerHTML=
filtered.slice(start,start+perPage).map(ad=>{

const title=
val(ad,["title","job_title","jobTitle"])||
"Job Opportunity";

const desc=
val(ad,[
"description",
"details",
"job_description",
"jobDescription"
])||
"No description provided.";

const location=[
val(ad,["province","province_name","provinceName"]),
val(ad,["district","district_name","districtName"]),
val(ad,["city","city_name","cityName"])
].filter(Boolean).join(" • ");

const img=
photo(val(ad,[
"photo_url",
"photo",
"photo_key",
"image"
]));

const whatsapp=
val(ad,[
"whatsapp_no",
"whatsapp_number",
"whatsapp"
]);

const call=
val(ad,[
"call_no",
"call_number",
"phone",
"phone_number"
]);

const label={
featured:"FEATURED",
urgent:"URGENT",
top:"TOP",
featured_urgent_top:"FEATURED • URGENT • TOP"
}[norm(ad.ad_type)]||"FREE";

return`
<article class="card">

<div class="card-main">

${
img
?`
<img
class="photo"
src="${esc(img)}"
alt="${esc(title)}"
loading="lazy"
onerror="this.style.display='none'">
`
:`
<div class="no-photo">No Photo</div>
`
}

<div class="content">

<div class="label">
${label}
</div>

${
location
?`
<div class="location">
📍 ${esc(location)}
</div>
`
:""
}

<div class="title">
${esc(title)}
</div>

<div class="desc">
${esc(desc)}
</div>

</div>

</div>

<div class="actions">

${
whatsapp
?`
<a
class="action wa"
target="_blank"
rel="noopener"
href="https://wa.me/${phone(whatsapp)}">
WhatsApp
</a>
`
:`
<span class="action disabled">
WhatsApp
</span>
`
}

${
call
?`
<a
class="action call"
href="tel:${phone(call)}">
Call
</a>
`
:`
<span class="action disabled">
Call
</span>
`
}

</div>

</article>
`;

}).join("");

renderPagination();
}

function renderPagination(){

const pages=Math.ceil(filtered.length/perPage);

if(pages<=1){
$("pagination").innerHTML="";
return;
}

let html=`
<button
onclick="changePage(${page-1})"
${page===1?"disabled":""}>
‹
</button>
`;

for(let i=1;i<=pages;i++){

html+=`
<button
class="${i===page?"active":""}"
onclick="changePage(${i})">
${i}
</button>
`;
}

html+=`
<button
onclick="changePage(${page+1})"
${page===pages?"disabled":""}>
›
</button>
`;

$("pagination").innerHTML=html;
}

function changePage(n){

const pages=Math.ceil(filtered.length/perPage);

if(n<1||n>pages)return;

page=n;
render();

window.scrollTo({
top:0,
behavior:"smooth"
});
}

function clearFilters(){

$("search").value="";
$("province").value="";

$("district").innerHTML=
'<option value="">All Districts</option>';
$("district").disabled=true;

$("city").innerHTML=
'<option value="">All Cities</option>';
$("city").disabled=true;

$("category").value="";
$("adtype").value="";

filter();
}

$("province").addEventListener("change",loadDistricts);
$("district").addEventListener("change",loadCities);
$("city").addEventListener("change",filter);
$("category").addEventListener("change",filter);
$("adtype").addEventListener("change",filter);
$("search").addEventListener("input",filter);
$("searchBtn").addEventListener("click",filter);
$("clear").addEventListener("click",clearFilters);

async function loadJobs(){

try{

const r=await fetch(
API+"/latest",
{cache:"no-store"}
);

const d=await r.json();

if(!r.ok||d.success===false)
throw Error("Could not load jobs");

ads=
Array.isArray(d.ads)
?d.ads
:Array.isArray(d.data)
?d.data
:Array.isArray(d)
?d
:[];

filter();

}catch(e){

console.error("Jobs error:",e);

$("jobs").innerHTML=`
<div class="status">
<strong>Unable to load jobs.</strong>
Please try again later.
</div>
`;

$("count").textContent="";
}
}

(async()=>{

await Promise.all([
loadCategories(),
loadLocations()
]);

await loadJobs();

})();
</script>

</body>
</html>
