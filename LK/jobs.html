<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Jobs & Services | CreateLK Jobs</title>
<meta name="description" content="Find approved jobs and services across Sri Lanka.">
<meta name="theme-color" content="#102a56">
<link rel="icon" href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.container{width:min(1120px,92%);margin:auto}

header{background:#fff;border-bottom:1px solid #e5e9ef}
.header{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:#102a56}
.logo img{width:40px;height:40px;object-fit:contain}
.nav{display:flex;gap:8px}
.nav a{padding:9px 11px;font-size:12px;font-weight:700;color:#455168}
.post{background:#d69b16;color:#fff!important;border-radius:7px}

main{padding:35px 0}
.heading{text-align:center;margin-bottom:22px}
.heading h1{color:#102a56;font-size:30px;margin-bottom:5px}
.heading p{font-size:13px;color:#718096}

.search-box{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:14px;margin-bottom:20px}
.search-row{display:grid;grid-template-columns:2fr repeat(5,1fr) auto;gap:7px}
.search-row input,.search-row select{height:40px;border:1px solid #dce2ea;border-radius:7px;padding:0 9px;font-size:12px;background:#fff}
.search-btn{height:40px;border:0;border-radius:7px;background:#102a56;color:#fff;padding:0 15px;font-weight:800;cursor:pointer}

.result{display:flex;justify-content:space-between;margin-bottom:12px;color:#718096;font-size:12px}
.clear{border:0;background:none;color:#102a56;font-weight:800;cursor:pointer}

.jobs{display:flex;flex-direction:column;align-items:center;gap:12px}
.card{width:100%;max-width:850px;background:#fff;border:1px solid #e1e6ee;border-radius:10px;overflow:hidden}
.card-main{display:grid;grid-template-columns:190px 1fr}
.photo,.no-photo{width:190px;height:190px}
.photo{object-fit:cover;display:block}
.no-photo{display:flex;align-items:center;justify-content:center;background:#eef2f7;color:#718096;font-size:12px}
.content{text-align:center;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.label{background:#fff3d6;color:#9a6800;border-radius:20px;padding:4px 9px;font-size:9px;font-weight:800;margin-bottom:6px}
.location{font-size:10px;color:#68748a;margin-bottom:4px}
.title{font-size:18px;font-weight:800;color:#102a56;margin-bottom:5px}
.desc{font-size:12px;color:#68748a;max-width:550px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px;border-top:1px solid #edf0f4}
.action{height:37px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.wa{background:#168b45;color:#fff}
.call{background:#102a56;color:#fff}
.disabled{background:#e3e7ed;color:#8993a4}

.status{width:100%;max-width:850px;text-align:center;background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:25px;color:#718096;font-size:12px}
.status strong{display:block;color:#102a56;margin-bottom:3px}

.pagination{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pagination button{height:35px;min-width:35px;border:1px solid #dce2ea;background:#fff;border-radius:6px;cursor:pointer}
.pagination .active{background:#102a56;color:#fff}

@media(max-width:1000px){
.search-row{grid-template-columns:repeat(2,1fr)}
.search-row input{grid-column:1/-1}
.search-btn{width:100%}
}

@media(max-width:650px){
.container{width:92%}
.nav a:not(.post){display:none}
.search-row{grid-template-columns:1fr}
.search-row input{grid-column:auto}
.card-main{grid-template-columns:1fr}
.photo,.no-photo{width:100%;height:auto;aspect-ratio:1}
.actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="container header">
<a href="../index.html" class="logo">
<img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">
<span>CreateLK Jobs</span>
</a>
<nav class="nav">
<a href="../index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="post-ad.html" class="post">Post a Job / Service</a>
</nav>
</div>
</header>

<main>
<div class="container">

<div class="heading">
<h1 id="heading">Find Jobs & Services</h1>
<p id="subheading">Discover approved jobs and services across Sri Lanka.</p>
</div>

<div class="search-box">
<div class="search-row">

<input id="search" placeholder="Search jobs, services, titles or descriptions...">

<select id="province">
<option value="">All Provinces</option>
</select>

<select id="district" disabled>
<option value="">All Districts</option>
</select>

<select id="city" disabled>
<option value="">All Cities</option>
</select>

<select id="category">
<option value="">All Categories</option>
</select>

<select id="adtype">
<option value="">All Ad Types</option>
<option value="free">Free</option>
<option value="featured">Featured</option>
<option value="urgent">Urgent</option>
<option value="top">Top</option>
<option value="featured_urgent_top">Featured + Urgent + Top</option>
</select>

<button class="search-btn" onclick="filter()">Search</button>

</div>
</div>

<div class="result">
<span id="count">Loading...</span>
<button class="clear" onclick="clearFilters()">Clear Filters</button>
</div>

<div class="jobs" id="jobs">
<div class="status"><strong>Loading...</strong>Please wait.</div>
</div>

<div class="pagination" id="pagination"></div>

</div>
</main>

<script>
const API="https://ads.createlk.workers.dev";
const CAT="https://categories.createlk.workers.dev";
const qs=new URLSearchParams(location.search);
const wantedType=(qs.get("type")||"").toLowerCase();
let ads=[],filtered=[],page=1;
const perPage=10;

const $=id=>document.getElementById(id);
const norm=v=>String(v??"").trim().toLowerCase();

function val(a,keys){
for(const k of keys)if(a[k]!=null&&String(a[k]).trim())return String(a[k]);
return "";
}

function phone(v){
v=String(v||"").replace(/[^\d+]/g,"");
if(v.startsWith("+"))v=v.slice(1);
if(v.startsWith("0"))v="94"+v.slice(1);
return v;
}

function photo(v){
if(!v)return "";
return /^https?:\/\//i.test(v)?v:API+"/photo?key="+encodeURIComponent(v);
}

function listingType(a){
let v=norm(val(a,[
"listing_type","listingType","post_type","postType",
"job_service_type","jobServiceType","type"
]));
if(v==="job"||v==="jobs")return"job";
if(v==="service"||v==="services")return"service";
return "";
}

async function loadCategories(){
try{
const r=await fetch(CAT+"/categories",{cache:"no-store"});
const d=await r.json();
let list=Array.isArray(d.categories)?d.categories:[];
const select=$("category");

list.forEach(x=>{
if(!x.name)return;
const o=document.createElement("option");
o.value=x.id||x.slug||x.name;
o.textContent=x.name;
o.dataset.name=x.name;
o.dataset.slug=x.slug||"";
select.appendChild(o);
});

if(!list.some(x=>norm(x.name)==="other")){
const o=document.createElement("option");
o.value="other";o.textContent="Other";
o.dataset.name="Other";o.dataset.slug="other";
select.appendChild(o);
}

if(!list.some(x=>norm(x.name)==="other services")){
const o=document.createElement("option");
o.value="other-services";o.textContent="Other Services";
o.dataset.name="Other Services";o.dataset.slug="other-services";
select.appendChild(o);
}

const opts=[...select.options];
opts.sort((a,b)=>{
const special=x=>norm(x.textContent)==="other"?1:norm(x.textContent)==="other services"?2:0;
return special(a)-special(b)||a.textContent.localeCompare(b.textContent);
});
select.innerHTML="";
opts.forEach(o=>select.appendChild(o));

const wanted=qs.get("category")||qs.get("category_name");
const match=opts.find(o=>
norm(o.value)===norm(wanted)||
norm(o.dataset.name)===norm(wanted)||
norm(o.dataset.slug)===norm(wanted)
);
if(match)select.value=match.value;

}catch(e){console.error(e)}
}

async function loadLocations(){
try{
const r=await fetch(API+"/locations",{cache:"no-store"});
const d=await r.json();
$("province").innerHTML='<option value="">All Provinces</option>'+
(d.provinces||[]).map(x=>{
x=typeof x==="object"?(x.name||x.province):x;
return `<option>${x}</option>`;
}).join("");
}catch(e){console.error(e)}
}

async function districts(){
const p=$("province").value;
$("district").innerHTML='<option value="">All Districts</option>';
$("city").innerHTML='<option value="">All Cities</option>';
$("district").disabled=!p;
$("city").disabled=true;
if(!p)return filter();

try{
const r=await fetch(API+"/locations?province="+encodeURIComponent(p));
const d=await r.json();
$("district").innerHTML+=(d.districts||[]).map(x=>{
x=typeof x==="object"?(x.name||x.district):x;
return `<option>${x}</option>`;
}).join("");
filter();
}catch(e){filter()}
}

async function cities(){
const p=$("province").value,d=$("district").value;
$("city").innerHTML='<option value="">All Cities</option>';
$("city").disabled=!d;
if(!p||!d)return filter();

try{
const r=await fetch(API+"/locations?province="+encodeURIComponent(p)+"&district="+encodeURIComponent(d));
const x=await r.json();
$("city").innerHTML+=(x.cities||[]).map(v=>{
v=typeof v==="object"?(v.name||v.city):v;
return `<option>${v}</option>`;
}).join("");
filter();
}catch(e){filter()}
}

function categoryOK(a){
const selected=norm($("category").value);
if(!selected)return true;
const o=$("category").selectedOptions[0];
const names=[
val(a,["category_id","categoryId"]),
val(a,["category","category_name","categoryName","category_slug","categorySlug"])
].map(norm);
return names.includes(selected)||
names.includes(norm(o.dataset.name))||
names.includes(norm(o.dataset.slug));
}

function filter(){
const q=norm($("search").value);
const p=norm($("province").value);
const d=norm($("district").value);
const c=norm($("city").value);
const cat=$("adtype").value;

filtered=ads.filter(a=>{
const text=norm([
val(a,["title","job_title","jobTitle"]),
val(a,["description","details","job_description"]),
val(a,["company","company_name","companyName"]),
val(a,["category","category_name"]),
val(a,["province","district","city"])
].join(" "));

if(q&&!text.includes(q))return false;
if(p&&norm(val(a,["province","province_name"]))!==p)return false;
if(d&&norm(val(a,["district","district_name"]))!==d)return false;
if(c&&norm(val(a,["city","city_name"]))!==c)return false;
if(cat&&norm(a.ad_type)!==norm(cat))return false;
if(!categoryOK(a))return false;

if(wantedType){
const t=listingType(a);
if(wantedType==="job"&&t==="service")return false;
if(wantedType==="service"&&t==="job")return false;
}

return true;
});

filtered.sort((a,b)=>{
const priority=x=>{
return {featured_urgent_top:4,top:3,featured:2,urgent:1}[norm(x.ad_type)]||0;
};
return priority(b)-priority(a)||
(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0);
});

page=1;
render();
}

function render(){
const total=filtered.length;
$("count").textContent=total+" "+(total===1?"result":"results")+" found";

if(!total){
$("jobs").innerHTML='<div class="status"><strong>No matching opportunities found.</strong>Try another search or filter.</div>';
$("pagination").innerHTML="";
return;
}

const start=(page-1)*perPage;
$("jobs").innerHTML=filtered.slice(start,start+perPage).map(a=>{

const title=val(a,["title","job_title","jobTitle"])||"Opportunity";
const desc=val(a,["description","details","job_description"])||"No description provided.";
const loc=[
val(a,["province","province_name"]),
val(a,["district","district_name"]),
val(a,["city","city_name"])
].filter(Boolean).join(" • ");

const img=photo(val(a,["photo_url","photo","photo_key","image"]));
const wa=val(a,["whatsapp_no","whatsapp_number","whatsapp"]);
const tel=val(a,["call_no","call_number","phone","phone_number"]);

return `
<article class="card">
<div class="card-main">
${img?`<img class="photo" src="${img}" alt="${title}" onerror="this.style.display='none'">`:`<div class="no-photo">No Photo</div>`}
<div class="content">
<div class="label">${norm(a.ad_type)==="free"?"FREE":String(a.ad_type||"FREE").replaceAll("_"," • ").toUpperCase()}</div>
${loc?`<div class="location">📍 ${loc}</div>`:""}
<div class="title">${title}</div>
<div class="desc">${desc}</div>
</div>
</div>
<div class="actions">
${wa?`<a class="action wa" target="_blank" href="https://wa.me/${phone(wa)}">WhatsApp</a>`:`<span class="action disabled">WhatsApp</span>`}
${tel?`<a class="action call" href="tel:${phone(tel)}">Call</a>`:`<span class="action disabled">Call</span>`}
</div>
</article>`;
}).join("");

const pages=Math.ceil(total/perPage);
$("pagination").innerHTML=pages<2?"":`
<button onclick="page--;render()" ${page===1?"disabled":""}>‹</button>
${Array.from({length:pages},(_,i)=>`
<button class="${i+1===page?"active":""}" onclick="page=${i+1};render()">${i+1}</button>
`).join("")}
<button onclick="page++;render()" ${page===pages?"disabled":""}>›</button>`;
}

function clearFilters(){
$("search").value="";
$("province").value="";
$("district").innerHTML='<option value="">All Districts</option>';
$("district").disabled=true;
$("city").innerHTML='<option value="">All Cities</option>';
$("city").disabled=true;
$("category").value="";
$("adtype").value="";
history.replaceState({}, "", "jobs.html");
filter();
}

$("province").onchange=districts;
$("district").onchange=cities;
$("city").onchange=filter;
$("category").onchange=filter;
$("adtype").onchange=filter;
$("search").oninput=filter;

(async()=>{
await Promise.all([loadCategories(),loadLocations()]);
try{
const r=await fetch(API+"/latest",{cache:"no-store"});
const d=await r.json();
ads=Array.isArray(d.ads)?d.ads:Array.isArray(d)?d:[];
filter();

if(wantedType==="job"){
$("heading").textContent="Find Jobs";
$("subheading").textContent="Discover approved jobs across Sri Lanka.";
}
if(wantedType==="service"){
$("heading").textContent="Find Services";
$("subheading").textContent="Discover approved services across Sri Lanka.";
}
}catch(e){
$("jobs").innerHTML='<div class="status"><strong>Unable to load opportunities.</strong>Please try again later.</div>';
$("count").textContent="";
}
})();
</script>

</body>
</html>
