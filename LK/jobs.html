<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Find Jobs | CreateLK Jobs</title>

<meta name="description"
content="Search approved jobs and career opportunities across Sri Lanka with CreateLK Jobs.">

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.5
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:20
}

.header{
max-width:1200px;
margin:auto;
padding:11px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.brand{
display:flex;
align-items:center;
gap:9px;
color:#172033;
text-decoration:none;
font-weight:700;
font-size:19px
}

.brand img{
width:40px;
height:40px;
object-fit:contain;
border-radius:8px
}

.nav{
display:flex;
align-items:center;
gap:6px
}

.nav a{
color:#334155;
text-decoration:none;
font-weight:600;
padding:8px 11px;
border-radius:8px
}

.nav a:hover{background:#f1f5f9}

.nav .post{
background:#2563eb;
color:#fff
}

main{
max-width:1200px;
margin:28px auto;
padding:0 16px
}

.hero{margin-bottom:22px}

h1{
font-size:30px;
margin-bottom:4px
}

.subtitle{color:#64748b}

.search-box{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:17px;
margin-bottom:20px
}

.search-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr auto;
gap:10px
}

input,select{
width:100%;
min-width:0;
padding:11px 12px;
border:1px solid #d5dae3;
border-radius:8px;
background:#fff;
color:#172033;
font:inherit
}

input:focus,select:focus{
outline:0;
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.1)
}

.search-btn{
border:0;
background:#2563eb;
color:#fff;
padding:0 18px;
border-radius:8px;
font-weight:700;
cursor:pointer
}

.search-btn:hover{background:#1d4ed8}

.result-bar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
color:#64748b;
font-size:14px
}

.clear{
border:0;
background:none;
color:#2563eb;
cursor:pointer;
font-weight:700
}

.loading,.empty{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:40px;
text-align:center;
color:#64748b
}

.empty{display:none}

.error{
display:none;
background:#fef2f2;
border:1px solid #fecaca;
color:#991b1b;
padding:13px;
border-radius:9px;
margin-bottom:18px;
font-weight:600
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px
}

.job{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.04)
}

.job-main{
display:flex;
gap:15px;
padding:16px
}

.photo{
width:170px;
height:130px;
flex-shrink:0;
border-radius:10px;
overflow:hidden;
background:#eef2f7
}

.photo img{
width:100%;
height:100%;
object-fit:cover
}

.no-photo{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#94a3b8;
font-size:13px
}

.info{
min-width:0;
flex:1
}

.title{
font-size:19px;
font-weight:700;
margin-bottom:5px;
word-break:break-word
}

.description{
color:#64748b;
font-size:14px;
display:-webkit-box;
-webkit-line-clamp:4;
-webkit-box-orient:vertical;
overflow:hidden
}

.badges{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:9px
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
font-size:11px;
font-weight:700
}

.featured{background:#fef3c7;color:#92400e}
.urgent{background:#fee2e2;color:#991b1b}
.top-ad{background:#ede9fe;color:#6d28d9}
.combined{background:#dbeafe;color:#1e40af}
.free{background:#f1f5f9;color:#475569}

.location{
color:#475569;
font-size:13px;
margin-top:9px
}

.actions{
border-top:1px solid #e5e7eb;
padding:12px 16px;
display:flex;
gap:8px
}

.actions a{
flex:1;
text-align:center;
text-decoration:none;
padding:9px;
border-radius:8px;
font-size:13px;
font-weight:700
}

.whatsapp{background:#dcfce7;color:#166534}
.call{background:#dbeafe;color:#1e40af}

.pagination{
display:flex;
justify-content:center;
gap:8px;
margin-top:25px;
flex-wrap:wrap
}

.pagination button{
border:1px solid #d5dae3;
background:#fff;
padding:8px 13px;
border-radius:8px;
cursor:pointer;
font-weight:700
}

.pagination button.active{
background:#2563eb;
border-color:#2563eb;
color:#fff
}

.pagination button:disabled{
opacity:.45;
cursor:not-allowed
}

@media(max-width:900px){
.search-row{grid-template-columns:1fr 1fr}
.search-row input{grid-column:1/-1}
.search-btn{min-height:44px}
.grid{grid-template-columns:1fr}
}

@media(max-width:600px){
.header{padding:10px 13px}
.brand span{display:none}
.nav a{padding:7px}
.nav a:first-child{display:none}
main{margin-top:20px}
h1{font-size:25px}
.search-row{grid-template-columns:1fr}
.search-row input{grid-column:auto}
.search-btn{min-height:44px}
.job-main{flex-direction:column}
.photo{width:100%;height:190px}
.actions{flex-direction:column}
}
</style>
</head>

<body>

<header>
<div class="header">

<a href="../index.html" class="brand">
<img
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">
<span>CreateLK Jobs</span>
</a>

<nav class="nav">
<a href="../index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="post-ad.html" class="post">Post a Job</a>
</nav>

</div>
</header>

<main>

<div class="hero">
<h1>Find Jobs</h1>
<p class="subtitle">
Discover approved jobs and opportunities across Sri Lanka.
</p>
</div>

<div id="error" class="error"></div>

<div class="search-box">

<div class="search-row">

<input
id="search"
type="search"
placeholder="Search jobs, titles or descriptions...">

<select id="province">
<option value="">All Provinces / Locations</option>
</select>

<select id="district" disabled>
<option value="">All Districts</option>
</select>

<select id="city" disabled>
<option value="">All Cities / Towns</option>
</select>

<select id="type">
<option value="">All Ad Types</option>
<option value="free">Free</option>
<option value="featured">Featured</option>
<option value="urgent">Urgent</option>
<option value="top">Top</option>
<option value="featured_urgent_top">
Featured + Urgent + Top
</option>
</select>

<button id="searchBtn" class="search-btn">
Search
</button>

</div>
</div>

<div class="result-bar">
<span id="count">Loading...</span>
<button id="clear" class="clear">Clear Filters</button>
</div>

<div id="loading" class="loading">
Loading approved jobs...
</div>

<div id="empty" class="empty">
<h2>No Jobs Found</h2>
<p>No approved ads match your search.</p>
</div>

<div id="grid" class="grid"></div>

<div id="pagination" class="pagination"></div>

</main>

<script>
const API="https://ads.createlk.workers.dev";

const $=id=>document.getElementById(id);

let allAds=[];
let filteredAds=[];
let currentPage=1;

const PER_PAGE=10;

function escapeHTML(value){
return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function photoURL(key){

if(!key)return "";

if(
key.startsWith("http://")||
key.startsWith("https://")
)return key;

return `${API}/photo?key=${encodeURIComponent(key)}`;
}

function normalizeType(type){
return String(type||"").toLowerCase().trim();
}

function typeName(type){

type=normalizeType(type);

return type==="featured"?"Featured":
type==="urgent"?"Urgent":
type==="top"?"Top":
type==="featured_urgent_top"
?"Featured + Urgent + Top":
"Free";
}

function typeClass(type){

type=normalizeType(type);

return type==="featured"?"featured":
type==="urgent"?"urgent":
type==="top"?"top-ad":
type==="featured_urgent_top"?"combined":
"free";
}

/*
Premium priority.

featured_urgent_top = 4
top                   = 3
featured              = 2
urgent                = 1
free                  = 0

The value from the Worker is used when available.
The fallback below keeps the correct order
if priority is missing from an API response.
*/

function adPriority(ad){

const serverPriority=Number(ad.priority);

if(Number.isFinite(serverPriority))
return serverPriority;

const type=normalizeType(ad.ad_type);

return type==="featured_urgent_top"?4:
type==="top"?3:
type==="featured"?2:
type==="urgent"?1:
0;
}

function locationText(ad){

return [
ad.city,
ad.district,
ad.province
]
.filter(Boolean)
.join(", ");
}

function whatsappURL(number){

let phone=String(number||"").replace(/\D/g,"");

if(!phone)return "#";

if(phone.startsWith("0"))
phone="94"+phone.substring(1);
else if(!phone.startsWith("94"))
phone="94"+phone;

return `https://wa.me/${phone}`;
}

function callURL(number){

const clean=String(number||"")
.replace(/[^\d+]/g,"");

return clean?`tel:${clean}`:"#";
}

function renderAd(ad){

const photo=photoURL(
ad.photo_url||
ad.photo_key||
""
);

const photoHTML=photo
?`<img
src="${escapeHTML(photo)}"
alt="${escapeHTML(ad.title)}"
loading="lazy"
onerror="this.parentElement.innerHTML='<div class=&quot;no-photo&quot;>Photo unavailable</div>'>`
:`<div class="no-photo">No photo</div>`;

return `
<article class="job">

<div class="job-main">

<div class="photo">
${photoHTML}
</div>

<div class="info">

<div class="title">
${escapeHTML(ad.title)}
</div>

<div class="description">
${escapeHTML(ad.description)}
</div>

<div class="badges">

<span class="badge ${typeClass(ad.ad_type)}">
${escapeHTML(typeName(ad.ad_type))}
</span>

</div>

<div class="location">
📍 ${escapeHTML(locationText(ad))}
</div>

</div>
</div>

<div class="actions">

<a
class="whatsapp"
href="${escapeHTML(whatsappURL(ad.whatsapp_no))}"
target="_blank"
rel="noopener">
WhatsApp
</a>

<a
class="call"
href="${escapeHTML(callURL(ad.call_no))}">
Call
</a>

</div>

</article>`;
}

/* LOCATIONS */

async function loadProvinces(){

try{

const r=await fetch(`${API}/locations`);
const d=await r.json();

if(!r.ok||!d.success)
throw Error("Could not load provinces.");

$("province").innerHTML=
`<option value="">All Provinces / Locations</option>`+
(d.provinces||[])
.map(x=>`
<option value="${escapeHTML(x)}">
${escapeHTML(x)}
</option>
`)
.join("");

}catch(e){

console.error("Province error",e);

}
}

async function loadDistricts(province){

const district=$("district");
const city=$("city");

district.disabled=true;
city.disabled=true;

district.innerHTML=
`<option value="">All Districts</option>`;

city.innerHTML=
`<option value="">All Cities / Towns</option>`;

if(!province){

applyFilters();
return;
}

try{

const r=await fetch(
`${API}/locations?province=${encodeURIComponent(province)}`
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error("Could not load districts.");

district.innerHTML=
`<option value="">All Districts</option>`+
(d.districts||[])
.map(x=>`
<option value="${escapeHTML(x)}">
${escapeHTML(x)}
</option>
`)
.join("");

district.disabled=false;

if(
province==="Remote"||
province==="Overseas"
){

district.value=province;

await loadCities(
province,
province
);

}

applyFilters();

}catch(e){

console.error("District error",e);
applyFilters();

}
}

async function loadCities(province,district){

const city=$("city");

city.disabled=true;

city.innerHTML=
`<option value="">All Cities / Towns</option>`;

if(!province||!district){

applyFilters();
return;

}

try{

const r=await fetch(
`${API}/locations?province=${encodeURIComponent(province)}&district=${encodeURIComponent(district)}`
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error("Could not load cities.");

city.innerHTML=
`<option value="">All Cities / Towns</option>`+
(d.cities||[])
.map(x=>`
<option value="${escapeHTML(x)}">
${escapeHTML(x)}
</option>
`)
.join("");

city.disabled=false;

if(
province==="Remote"||
province==="Overseas"
)
city.value=province;

applyFilters();

}catch(e){

console.error("City error",e);
applyFilters();

}
}

/* FILTER + PREMIUM SORT */

function applyFilters(){

const q=$("search").value.trim().toLowerCase();
const province=$("province").value;
const district=$("district").value;
const city=$("city").value;
const type=$("type").value;

filteredAds=allAds.filter(ad=>{

const text=[
ad.title,
ad.description,
ad.category_name
]
.join(" ")
.toLowerCase();

if(q&&!text.includes(q))
return false;

if(province&&ad.province!==province)
return false;

if(district&&ad.district!==district)
return false;

if(city&&ad.city!==city)
return false;

if(type&&normalizeType(ad.ad_type)!==type)
return false;

return true;

});

/*
IMPORTANT:
Always place premium ads before free ads.

Priority:
4 = Featured + Urgent + Top
3 = Top
2 = Featured
1 = Urgent
0 = Free

If two ads have the same priority,
the newest ad appears first.
*/

filteredAds.sort((a,b)=>{

const priorityA=adPriority(a);
const priorityB=adPriority(b);

if(priorityA!==priorityB)
return priorityB-priorityA;

const dateA=
new Date(a.created_at||0).getTime();

const dateB=
new Date(b.created_at||0).getTime();

return dateB-dateA;

});

currentPage=1;

render();

}

/* RENDER */

function render(){

$("loading").style.display="none";

$("count").textContent=
`${filteredAds.length} ${
filteredAds.length===1
?"job"
:"jobs"
} found`;

$("grid").innerHTML="";

if(!filteredAds.length){

$("empty").style.display="block";
$("pagination").innerHTML="";

return;

}

$("empty").style.display="none";

const start=
(currentPage-1)*PER_PAGE;

$("grid").innerHTML=
filteredAds
.slice(start,start+PER_PAGE)
.map(renderAd)
.join("");

renderPagination();

}

/* PAGINATION */

function renderPagination(){

const pages=
Math.ceil(filteredAds.length/PER_PAGE);

if(pages<=1){

$("pagination").innerHTML="";
return;

}

let html=`
<button
onclick="changePage(${currentPage-1})"
${currentPage===1?"disabled":""}>
Previous
</button>`;

for(let i=1;i<=pages;i++){

html+=`
<button
class="${i===currentPage?"active":""}"
onclick="changePage(${i})">
${i}
</button>`;

}

html+=`
<button
onclick="changePage(${currentPage+1})"
${currentPage===pages?"disabled":""}>
Next
</button>`;

$("pagination").innerHTML=html;

}

function changePage(page){

const pages=
Math.ceil(filteredAds.length/PER_PAGE);

if(page<1||page>pages)
return;

currentPage=page;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* LOAD ADS */

async function loadAds(){

$("loading").style.display="block";
$("empty").style.display="none";
$("error").style.display="none";

try{

const r=
await fetch(`${API}/latest`);

const d=
await r.json();

if(!r.ok||!d.success)
throw Error(
d.error||"Could not load jobs."
);

allAds=
Array.isArray(d.ads)
?d.ads
:Array.isArray(d.data)
?d.data
:[];

applyFilters();

}catch(e){

console.error("Jobs error:",e);

$("loading").style.display="none";

$("count").textContent="";

$("error").textContent=
e.message||
"Could not load approved jobs.";

$("error").style.display="block";

}
}

/* EVENTS */

$("province").addEventListener(
"change",
e=>loadDistricts(e.target.value)
);

$("district").addEventListener(
"change",
e=>loadCities(
$("province").value,
e.target.value
)
);

$("city").addEventListener(
"change",
applyFilters
);

$("type").addEventListener(
"change",
applyFilters
);

$("search").addEventListener(
"input",
applyFilters
);

$("searchBtn").addEventListener(
"click",
applyFilters
);

$("clear").addEventListener(
"click",
()=>{

$("search").value="";
$("province").value="";

$("district").innerHTML=
`<option value="">All Districts</option>`;

$("district").disabled=true;

$("city").innerHTML=
`<option value="">All Cities / Towns</option>`;

$("city").disabled=true;

$("type").value="";

applyFilters();

}
);

/* START */

(async()=>{

await loadProvinces();
await loadAds();

})();
</script>

</body>
</html>
