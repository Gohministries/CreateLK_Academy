<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Wanted | CreateLK Jobs</title>
<meta name="description" content="Create your Job Wanted profile and upload your CV on CreateLK Jobs.">
<meta name="theme-color" content="#102a56">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f7f9fc;
  color:#172033;
}
a{text-decoration:none;color:inherit}
.container{width:min(720px,92%);margin:auto}

header{
  background:#fff;
  border-bottom:1px solid #e5e9f0;
}
.header{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#102a56;
  font-weight:800;
}
.logo img{
  width:40px;
  height:40px;
  object-fit:contain;
}
.back{
  font-size:13px;
  font-weight:700;
  color:#102a56;
}

.hero{
  padding:40px 0 25px;
  text-align:center;
}
.hero h1{
  color:#102a56;
  font-size:32px;
  margin-bottom:8px;
}
.hero p{
  color:#68748a;
  font-size:13px;
  line-height:1.5;
}

.card{
  background:#fff;
  border:1px solid #e1e6ee;
  border-radius:12px;
  padding:22px;
  box-shadow:0 5px 20px rgba(16,42,86,.05);
}

label{
  display:block;
  color:#344054;
  font-size:12px;
  font-weight:800;
  margin:15px 0 6px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d8dee8;
  border-radius:7px;
  padding:11px;
  font-size:13px;
  outline:none;
  background:#fff;
}
textarea{
  min-height:100px;
  resize:vertical;
}
input:focus,select:focus,textarea:focus{
  border-color:#102a56;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.file{
  border:1px dashed #b8c2d1;
  padding:18px;
  border-radius:8px;
  background:#f9fbfd;
}

.note{
  margin-top:7px;
  color:#7b8799;
  font-size:11px;
  line-height:1.4;
}

.check{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:18px;
}
.check input{
  width:auto;
  margin-top:2px;
}
.check label{
  margin:0;
  font-weight:600;
  line-height:1.4;
}

button{
  width:100%;
  height:46px;
  margin-top:20px;
  border:0;
  border-radius:7px;
  background:#102a56;
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  font-size:12px;
  line-height:1.4;
}
.success{
  display:block;
  background:#eaf8ef;
  color:#176b36;
}
.error{
  display:block;
  background:#fff0f0;
  color:#a12626;
}

footer{
  text-align:center;
  padding:30px 0;
  color:#7b8799;
  font-size:11px;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .card{padding:17px}
  .hero h1{font-size:28px}
}
</style>
</head>

<body>

<header>
  <div class="container header">
    <a href="../index.html" class="logo">
      <img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
           alt="CreateLK Jobs">
      <span>CreateLK Jobs</span>
    </a>

    <a href="jobs.html" class="back">Find Jobs / Services</a>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <h1>Job Wanted</h1>
    <p>
      Looking for a job? Create your profile and upload your CV.
      Employers can discover approved job seekers.
    </p>
  </div>
</section>

<section>
<div class="container">

<form class="card" id="wantedForm">

<label>Full Name *</label>
<input id="name" required maxlength="100" placeholder="Your full name">

<label>Job / Position Wanted *</label>
<input id="position" required maxlength="120"
       placeholder="Example: Office Assistant">

<div class="grid">

<div>
<label>Province *</label>
<select id="province" required>
<option value="">Select Province</option>
</select>
</div>

<div>
<label>District *</label>
<select id="district" required disabled>
<option value="">Select District</option>
</select>
</div>

</div>

<label>City *</label>
<select id="city" required disabled>
<option value="">Select City</option>
</select>

<label>Skills</label>
<input id="skills" maxlength="500"
       placeholder="Example: MS Office, English, Accounting">

<label>Experience</label>
<input id="experience" maxlength="200"
       placeholder="Example: 2 years">

<label>Education</label>
<input id="education" maxlength="200"
       placeholder="Example: A/L, Diploma">

<label>Expected Salary</label>
<input id="salary" maxlength="100"
       placeholder="Optional">

<label>Short Introduction *</label>
<textarea id="description" required maxlength="1000"
placeholder="Tell employers briefly about yourself and the type of work you are looking for."></textarea>

<div class="grid">

<div>
<label>Phone Number *</label>
<input id="phone" required maxlength="20"
       placeholder="07XXXXXXXX">
</div>

<div>
<label>WhatsApp Number</label>
<input id="whatsapp" maxlength="20"
       placeholder="07XXXXXXXX">
</div>

</div>

<label>Upload CV *</label>

<div class="file">
<input id="cv" type="file" required
       accept=".pdf,.doc,.docx">
<div class="note">
PDF, DOC or DOCX only. Maximum 5 MB.
Your CV will be stored privately and will not have a public direct file URL.
</div>
</div>

<div class="check">
<input id="contactAllowed" type="checkbox" required>
<label for="contactAllowed">
I agree that approved employers may contact me regarding suitable job opportunities.
</label>
</div>

<button id="submitBtn" type="submit">
Submit Job Wanted Profile
</button>

<div id="message" class="message"></div>

</form>

</div>
</section>

</main>

<footer>
© 2026 CreateLK Jobs
</footer>

<script>

const API="https://wanted.createlk.workers.dev";

const $=id=>document.getElementById(id);

const province=$("province");
const district=$("district");
const city=$("city");

async function get(url){
  const r=await fetch(API+url,{cache:"no-store"});
  if(!r.ok) throw Error("Request failed");
  return r.json();
}

async function loadProvinces(){

  try{

    const d=await get("/locations");

    const list=d.provinces||[];

    list.forEach(x=>{
      const n=typeof x==="object"
        ?(x.name||x.province||"")
        :x;

      if(n) province.add(new Option(n,n));
    });

  }catch(e){
    console.error(e);
  }
}

province.onchange=async()=>{

  district.innerHTML='<option value="">Select District</option>';
  city.innerHTML='<option value="">Select City</option>';

  district.disabled=true;
  city.disabled=true;

  if(!province.value)return;

  try{

    const d=await get(
      "/locations?province="+encodeURIComponent(province.value)
    );

    (d.districts||[]).forEach(x=>{
      const n=typeof x==="object"
        ?(x.name||x.district||"")
        :x;

      if(n) district.add(new Option(n,n));
    });

    district.disabled=district.options.length<2;

  }catch(e){
    console.error(e);
  }
};

district.onchange=async()=>{

  city.innerHTML='<option value="">Select City</option>';
  city.disabled=true;

  if(!district.value)return;

  try{

    const d=await get(
      "/locations?province="+encodeURIComponent(province.value)+
      "&district="+encodeURIComponent(district.value)
    );

    (d.cities||[]).forEach(x=>{
      const n=typeof x==="object"
        ?(x.name||x.city||"")
        :x;

      if(n) city.add(new Option(n,n));
    });

    city.disabled=city.options.length<2;

  }catch(e){
    console.error(e);
  }
};

$("wantedForm").onsubmit=async e=>{

  e.preventDefault();

  const message=$("message");
  const button=$("submitBtn");
  const cv=$("cv").files[0];

  message.className="message";
  message.textContent="";

  if(!cv){
    message.className="message error";
    message.textContent="Please upload your CV.";
    return;
  }

  if(cv.size>5*1024*1024){
    message.className="message error";
    message.textContent="CV must be 5 MB or smaller.";
    return;
  }

  const allowed=[
    "application/pdf",
    "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  ];

  const ext=cv.name.toLowerCase().split(".").pop();

  if(!allowed.includes(cv.type) &&
     !["pdf","doc","docx"].includes(ext)){
    message.className="message error";
    message.textContent="Only PDF, DOC and DOCX files are allowed.";
    return;
  }

  button.disabled=true;
  button.textContent="Uploading...";

  try{

    const fd=new FormData();

    fd.append("name",$("name").value.trim());
    fd.append("position",$("position").value.trim());
    fd.append("province",province.value);
    fd.append("district",district.value);
    fd.append("city",city.value);
    fd.append("skills",$("skills").value.trim());
    fd.append("experience",$("experience").value.trim());
    fd.append("education",$("education").value.trim());
    fd.append("salary",$("salary").value.trim());
    fd.append("description",$("description").value.trim());
    fd.append("phone",$("phone").value.trim());
    fd.append("whatsapp",$("whatsapp").value.trim());
    fd.append("contact_allowed","1");
    fd.append("cv",cv);

    const r=await fetch(API+"/api/wanted",{
      method:"POST",
      body:fd
    });

    const d=await r.json();

    if(!r.ok) throw Error(d.error||"Submission failed");

    message.className="message success";
    message.innerHTML=
      "<strong>Profile submitted successfully.</strong><br>"+
      "Your Job Wanted profile is waiting for admin approval.";

    $("wantedForm").reset();

    district.innerHTML='<option value="">Select District</option>';
    city.innerHTML='<option value="">Select City</option>';
    district.disabled=true;
    city.disabled=true;

  }catch(e){

    message.className="message error";
    message.textContent=e.message||"Unable to submit profile.";

  }finally{

    button.disabled=false;
    button.textContent="Submit Job Wanted Profile";

  }
};

loadProvinces();

</script>

</body>
</html>
