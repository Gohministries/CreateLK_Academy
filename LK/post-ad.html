<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Post an Ad | CreateLK Jobs</title>

<meta name="description"
content="Post your job advertisement on CreateLK Jobs and reach job seekers across Sri Lanka.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 20px}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#1261d6;font-size:20px;font-weight:700}
.brand img{width:42px;height:42px;object-fit:contain}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#333;text-decoration:none;font-size:14px}
nav a:hover{color:#1261d6}
main{max-width:850px;margin:35px auto;padding:0 15px}
.card{background:#fff;border-radius:14px;padding:25px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h1{font-size:28px;margin-bottom:8px}
.subtitle{color:#666;margin-bottom:25px}
label{display:block;font-weight:600;margin:16px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d6dbe3;border-radius:8px;font-size:15px;background:#fff}
textarea{min-height:140px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.type{border:1px solid #d6dbe3;border-radius:9px;padding:13px 8px;text-align:center;cursor:pointer;background:#fff}
.type input{width:auto;margin-right:5px}
.type strong{display:block;margin-top:5px}
.type small{color:#666}
.payment{margin-top:20px;padding:18px;background:#f8fafc;border:1px solid #e1e6ed;border-radius:10px}
.bank{background:#fff;padding:14px;border-radius:8px;border:1px solid #ddd;line-height:1.7;margin-bottom:15px}
.hidden{display:none}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:#1261d6;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#0d4fae}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:15px}
.message.error{display:block;background:#fee2e2;color:#991b1b}
.message.success{display:block;background:#dcfce7;color:#166534}
.price{margin-top:15px;padding:12px;background:#eef5ff;border-radius:8px;color:#1261d6;font-weight:700}

@media(max-width:700px){
  .header-inner{align-items:flex-start;flex-direction:column}
  .row{grid-template-columns:1fr}
  .types{grid-template-columns:1fr 1fr}
  main{margin-top:20px}
  .card{padding:18px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<a class="brand" href="index.html">
<img
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">
<span>CreateLK Jobs</span>
</a>

<nav>
<a href="index.html">Home</a>
<a href="jobs.html">Find Jobs</a>
<a href="categories.html">Categories</a>
<a href="companies.html">Companies</a>
<a href="login.html">Login</a>
</nav>

</div>
</header>

<main>
<div class="card">

<h1>Post an Ad</h1>

<p class="subtitle">
Reach job seekers across Sri Lanka.
</p>

<div id="message" class="message"></div>

<form id="adForm">

<label for="title">Job Title *</label>
<input
id="title"
name="title"
type="text"
placeholder="Example: Sales Assistant"
required>

<label for="description">Job Description *</label>
<textarea
id="description"
name="description"
placeholder="Describe the job, requirements, salary and other details..."
required></textarea>

<div class="row">

<div>
<label for="whatsapp">WhatsApp Number *</label>
<input
id="whatsapp"
type="tel"
placeholder="0771234567"
required>
</div>

<div>
<label for="call">Call Number *</label>
<input
id="call"
type="tel"
placeholder="0771234567"
required>
</div>

</div>

<label for="province">Province *</label>
<select id="province" required>
<option value="">Loading provinces...</option>
</select>

<div class="row">

<div>
<label for="district">District *</label>
<select id="district" required disabled>
<option value="">Select province first</option>
</select>
</div>

<div>
<label for="city">City / Area *</label>
<select id="city" required disabled>
<option value="">Select district first</option>
</select>
</div>

</div>

<label for="category">Job Category *</label>
<select id="category" required>
<option value="">Loading categories...</option>
</select>

<label>Advertisement Type *</label>

<div class="types">

<label class="type">
<input type="radio" name="ad_type" value="free" checked>
Free
<strong>Rs. 0</strong>
<small>30 days</small>
</label>

<label class="type">
<input type="radio" name="ad_type" value="featured">
Featured
<strong>Rs. 500</strong>
<small>30 days</small>
</label>

<label class="type">
<input type="radio" name="ad_type" value="urgent">
Urgent
<strong>Rs. 500</strong>
<small>30 days</small>
</label>

<label class="type">
<input type="radio" name="ad_type" value="top">
Top Job
<strong>Rs. 500</strong>
<small>30 days</small>
</label>

</div>

<div id="priceBox" class="price">
Free advertisement — Rs. 0
</div>

<label for="photo">Job Photo *</label>
<input
id="photo"
type="file"
accept="image/jpeg,image/png,image/webp"
required>

<div id="paymentBox" class="payment hidden">

<h3>Bank Deposit</h3>

<div class="bank">
<strong>Bank:</strong> People's Bank<br>
<strong>Branch:</strong> Udapussellawa<br>
<strong>Account Name:</strong> Thinarathnam Saththiyanadan<br>
<strong>Account Number:</strong> 292200280023178
</div>

<label for="slip">Payment Slip *</label>
<input
id="slip"
type="file"
accept="image/jpeg,image/png,image/webp,.pdf">

<label for="depositDate">Deposit Date *</label>
<input id="depositDate" type="date">

<label for="depositorName">Depositor Name *</label>
<input
id="depositorName"
type="text"
placeholder="Name used for bank deposit">

<label for="referenceNumber">Reference Number</label>
<input
id="referenceNumber"
type="text"
placeholder="Bank reference number">

</div>

<button id="submitBtn" type="submit">
Post Advertisement
</button>

</form>

</div>
</main>

<script>
const ADS_API="https://ads.createlk.workers.dev";
const UPLOAD_API="https://upload.createlk.workers.dev";
const CATEGORY_API="https://categories.createlk.workers.dev";
const LOGIN_PAGE="https://createlk.com/LK/login.html";
const MY_ADS="https://createlk.com/LK/my-ads.html";
const TOKEN_KEY="createlk_session_token";

function getToken(){
  return sessionStorage.getItem(TOKEN_KEY)||
         localStorage.getItem(TOKEN_KEY)||"";
}

function showMessage(text,type="error"){
  const box=document.getElementById("message");
  box.textContent=text;
  box.className="message "+type;
}

async function api(url,options={}){
  const response=await fetch(url,options);
  let data={};

  try{
    data=await response.json();
  }catch{}

  if(!response.ok){
    throw new Error(
      data.error||
      data.message||
      "Request failed"
    );
  }

  return data;
}

async function loadLocations(){

  const province=document.getElementById("province");

  try{

    const data=await api(
      ADS_API+"/locations"
    );

    if(!data.success)
      throw new Error(data.error||"Unable to load locations.");

    province.innerHTML=
      '<option value="">Select province</option>';

    (data.provinces||[]).forEach(item=>{

      const value=
        typeof item==="string"?item:item.name;

      if(!value)return;

      const option=document.createElement("option");
      option.value=value;
      option.textContent=value;

      province.appendChild(option);

    });

  }catch(error){

    console.error(error);

    province.innerHTML=
      '<option value="">Unable to load</option>';

    showMessage(
      error.message||"Unable to load locations."
    );

  }
}

async function loadDistricts(){

  const province=document.getElementById("province").value;
  const district=document.getElementById("district");
  const city=document.getElementById("city");

  district.innerHTML=
    '<option value="">Loading districts...</option>';

  city.innerHTML=
    '<option value="">Select district first</option>';

  district.disabled=true;
  city.disabled=true;

  if(!province){

    district.innerHTML=
      '<option value="">Select province first</option>';

    return;
  }

  try{

    const data=await api(
      ADS_API+
      "/locations?province="+
      encodeURIComponent(province)
    );

    if(!data.success)
      throw new Error(data.error||"Unable to load districts.");

    district.innerHTML=
      '<option value="">Select district</option>';

    (data.districts||[]).forEach(item=>{

      const value=
        typeof item==="string"?item:item.name;

      if(!value)return;

      const option=document.createElement("option");
      option.value=value;
      option.textContent=value;

      district.appendChild(option);

    });

    district.disabled=false;

  }catch(error){

    console.error(error);

    district.innerHTML=
      '<option value="">Unable to load</option>';

    showMessage(
      error.message||"Unable to load districts."
    );
  }
}

async function loadCities(){

  const province=document.getElementById("province").value;
  const district=document.getElementById("district").value;
  const city=document.getElementById("city");

  city.innerHTML=
    '<option value="">Loading cities...</option>';

  city.disabled=true;

  if(!province||!district){

    city.innerHTML=
      '<option value="">Select district first</option>';

    return;
  }

  try{

    const data=await api(
      ADS_API+
      "/locations?province="+
      encodeURIComponent(province)+
      "&district="+
      encodeURIComponent(district)
    );

    if(!data.success)
      throw new Error(data.error||"Unable to load cities.");

    city.innerHTML=
      '<option value="">Select city / area</option>';

    (data.cities||[]).forEach(item=>{

      const value=
        typeof item==="string"?item:item.name;

      if(!value)return;

      const option=document.createElement("option");
      option.value=value;
      option.textContent=value;

      city.appendChild(option);

    });

    city.disabled=false;

  }catch(error){

    console.error(error);

    city.innerHTML=
      '<option value="">Unable to load</option>';

    showMessage(
      error.message||"Unable to load cities."
    );
  }
}

async function loadCategories(){

  const category=document.getElementById("category");

  try{

    const data=await api(
      CATEGORY_API+"/categories"
    );

    if(!data.success)
      throw new Error(data.error||"Unable to load categories.");

    category.innerHTML=
      '<option value="">Select category</option>';

    (data.categories||[]).forEach(item=>{

      const option=document.createElement("option");

      option.value=item.id;
      option.textContent=item.name;

      category.appendChild(option);

    });

  }catch(error){

    console.error(error);

    category.innerHTML=
      '<option value="">Unable to load</option>';
  }
}

function updatePayment(){

  const type=document.querySelector(
    'input[name="ad_type"]:checked'
  ).value;

  const paymentBox=document.getElementById("paymentBox");
  const priceBox=document.getElementById("priceBox");

  if(type==="free"){

    paymentBox.classList.add("hidden");

    priceBox.textContent=
      "Free advertisement — Rs. 0";

    return;
  }

  paymentBox.classList.remove("hidden");

  const price=500;

  priceBox.textContent=
    "Payment required — Rs. "+price;
}

async function uploadFile(file,folder){

  const token=getToken();

  if(!token)
    throw new Error("Please login first.");

  const formData=new FormData();

  formData.append("file",file);
  formData.append("folder",folder);

  const response=await fetch(
    UPLOAD_API+"/upload",
    {
      method:"POST",
      headers:{
        Authorization:"Bearer "+token
      },
      body:formData
    }
  );

  let data={};

  try{
    data=await response.json();
  }catch{}

  if(!response.ok||!data.success){

    throw new Error(
      data.error||"File upload failed."
    );
  }

  return data;
}

document.getElementById("province")
.addEventListener("change",loadDistricts);

document.getElementById("district")
.addEventListener("change",loadCities);

document.querySelectorAll(
  'input[name="ad_type"]'
).forEach(input=>{
  input.addEventListener(
    "change",
    updatePayment
  );
});

document.getElementById("adForm")
.addEventListener("submit",async function(event){

  event.preventDefault();

  const token=getToken();

  if(!token){

    window.location.href=LOGIN_PAGE;
    return;
  }

  const submit=document.getElementById("submitBtn");

  const type=document.querySelector(
    'input[name="ad_type"]:checked'
  ).value;

  const photo=document.getElementById("photo").files[0];
  const slip=document.getElementById("slip").files[0];

  if(!photo){

    showMessage("Please select a job photo.");
    return;
  }

  submit.disabled=true;
  submit.textContent="Uploading...";

  try{

    const photoData=
      await uploadFile(photo,"ads");

    let paymentSlipUrl="";
    let depositDate="";
    let depositorName="";
    let referenceNumber="";
    let amount=0;

    if(type!=="free"){

      if(!slip)
        throw new Error(
          "Please upload the payment slip."
        );

      depositDate=
        document.getElementById(
          "depositDate"
        ).value;

      depositorName=
        document.getElementById(
          "depositorName"
        ).value.trim();

      referenceNumber=
        document.getElementById(
          "referenceNumber"
        ).value.trim();

      if(!depositDate)
        throw new Error(
          "Please enter the deposit date."
        );

      if(!depositorName)
        throw new Error(
          "Please enter the depositor name."
        );

      submit.textContent=
        "Uploading payment slip...";

      const slipData=
        await uploadFile(
          slip,
          "payments"
        );

      paymentSlipUrl=
        slipData.key||"";

      amount=500;
    }

    submit.textContent=
      "Posting advertisement...";

    const payload={

      title:
        document.getElementById(
          "title"
        ).value.trim(),

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      whatsapp_no:
        document.getElementById(
          "whatsapp"
        ).value.trim(),

      call_no:
        document.getElementById(
          "call"
        ).value.trim(),

      province:
        document.getElementById(
          "province"
        ).value,

      district:
        document.getElementById(
          "district"
        ).value,

      city:
        document.getElementById(
          "city"
        ).value,

      category_id:
        Number(
          document.getElementById(
            "category"
          ).value
        ),

      ad_type:type,

      photo_url:
        photoData.key||"",

      payment_slip_url:
        paymentSlipUrl,

      deposit_date:
        depositDate,

      depositor_name:
        depositorName,

      reference_number:
        referenceNumber,

      amount:amount
    };

    console.log("CREATE AD:",payload);

    const result=await api(
      ADS_API+"/create",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json",
          "Authorization":
            "Bearer "+token
        },
        body:JSON.stringify(payload)
      }
    );

    if(!result.success){

      throw new Error(
        result.error||
        "Unable to post advertisement."
      );
    }

    showMessage(
      "Advertisement submitted successfully.",
      "success"
    );

    setTimeout(()=>{
      window.location.href=MY_ADS;
    },1000);

  }catch(error){

    console.error(error);

    showMessage(
      error.message||
      "Failed to post advertisement.",
      "error"
    );

    submit.disabled=false;
    submit.textContent=
      "Post Advertisement";
  }

});

(async function(){

  if(!getToken()){

    window.location.href=LOGIN_PAGE;
    return;
  }

  await Promise.all([
    loadLocations(),
    loadCategories()
  ]);

  updatePayment();

})();
</script>

</body>
</html>
