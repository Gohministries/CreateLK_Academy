<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post an Ad | CreateLK Jobs</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.header{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#172033;font-weight:700;font-size:19px}
.brand img{width:40px;height:40px;object-fit:contain}
.back{color:#2563eb;text-decoration:none;font-weight:600}
main{max-width:760px;margin:30px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:25px}
h1{font-size:27px;margin-bottom:5px}
.sub,.help{color:#64748b}
.sub{margin-bottom:25px}
.field{margin-bottom:17px}
label{display:block;font-weight:700;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d5dae3;border-radius:9px;background:#fff;font:inherit}
input:focus,textarea:focus,select:focus{outline:0;border-color:#2563eb}
textarea{min-height:140px;resize:vertical}
.help{display:block;font-size:13px;margin-top:6px}
.section{border-top:1px solid #e5e7eb;margin-top:25px;padding-top:23px}
.section h2{font-size:18px;margin-bottom:17px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.option{border:1px solid #dbe1ea;border-radius:10px;padding:13px;cursor:pointer}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option input{width:auto}
.name{font-weight:700}.price{display:block;color:#64748b;font-size:13px}
.payment{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:15px}
.bank{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}
.bank:last-child{border:0}
.label{color:#64748b;font-size:13px}.value{font-weight:700;text-align:right}
.copy{border:0;padding:5px 8px;border-radius:6px;cursor:pointer}
.amount{margin:14px 0;padding:12px;background:#ecfdf5;color:#166534;border-radius:9px;font-weight:700}
.hidden{display:none!important}
.message{display:none;padding:12px;border-radius:9px;margin-bottom:17px;font-weight:600}
.error{display:block;background:#fef2f2;color:#991b1b}
.success{display:block;background:#f0fdf4;color:#166534}
.preview{display:none;margin-top:10px}.preview img{width:100%;max-height:300px;object-fit:cover;border-radius:10px}
.submit{width:100%;margin-top:10px;padding:14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.submit:disabled{opacity:.6}
@media(max-width:600px){.card{padding:20px}.types{grid-template-columns:1fr}.bank{display:block}.value{text-align:left;margin-top:4px}}
</style>
</head>

<body>

<header>
<div class="header">

<a href="index.html" class="brand">
<img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png" alt="CreateLK Jobs">
<span>CreateLK Jobs</span>
</a>

<a href="dashboard.html" class="back">Dashboard</a>

</div>
</header>

<main>
<div class="card">

<h1>Post an Ad</h1>
<p class="sub">Reach job seekers across Sri Lanka.</p>

<div id="message" class="message"></div>

<div class="field">
<label>Ad Photo *</label>

<input
id="photo"
type="file"
accept="image/jpeg,image/png,image/webp">

<span class="help">Maximum 5 MB.</span>

<div id="preview" class="preview">
<img id="previewImg" alt="Preview">
</div>

</div>

<div class="field">
<label>Ad Title *</label>

<input
id="title"
maxlength="150"
placeholder="Example: Experienced Electrician Available">

</div>

<div class="field">
<label>Description *</label>

<textarea
id="description"
maxlength="3000"
placeholder="Describe the job or opportunity..."></textarea>

</div>

<div class="field">
<label>WhatsApp Number *</label>

<input
id="whatsapp"
type="tel"
placeholder="0771234567">

</div>

<div class="field">
<label>Call Number *</label>

<input
id="call"
type="tel"
placeholder="0771234567">

</div>

<div class="section">

<h2>Location</h2>

<div class="field">

<label>Province / Location Type *</label>

<select id="province">

<option value="">Select</option>
<option>Western Province</option>
<option>Central Province</option>
<option>Southern Province</option>
<option>Northern Province</option>
<option>Eastern Province</option>
<option>North Western Province</option>
<option>North Central Province</option>
<option>Uva Province</option>
<option>Sabaragamuwa Province</option>
<option>Remote</option>
<option>Overseas</option>

</select>

</div>

<div class="field">

<label>District *</label>

<input
id="district"
placeholder="Example: Colombo">

</div>

<div class="field">

<label>City / Town *</label>

<input
id="city"
placeholder="Example: Negombo">

</div>

</div>

<div class="section">

<h2>Ad Type</h2>

<div class="types">

<label class="option selected">

<input
type="radio"
name="type"
value="free"
checked>

<span class="name">Free Ad</span>
<span class="price">LKR 0</span>

</label>

<label class="option">

<input
type="radio"
name="type"
value="featured">

<span class="name">Featured Ad</span>
<span class="price">LKR 500</span>

</label>

<label class="option">

<input
type="radio"
name="type"
value="urgent">

<span class="name">Urgent Ad</span>
<span class="price">LKR 500</span>

</label>

<label class="option">

<input
type="radio"
name="type"
value="top">

<span class="name">Top Ad</span>
<span class="price">LKR 500</span>

</label>

</div>

</div>

<div id="paymentSection" class="section hidden">

<h2>Bank Deposit</h2>

<div class="payment">

<div class="bank">
<span class="label">Bank</span>
<span class="value">People's Bank</span>
</div>

<div class="bank">
<span class="label">Branch</span>
<span class="value">Udapussellawa</span>
</div>

<div class="bank">

<span class="label">Account Number</span>

<span class="value">

292200280023178

<button
class="copy"
data-copy="292200280023178"
type="button">

Copy

</button>

</span>

</div>

<div class="bank">

<span class="label">Customer Name</span>

<span class="value">
Thinarathnam Saththiyanan
</span>

</div>

</div>

<div id="amount" class="amount">
Amount: LKR 500
</div>

<div class="field">

<label>Deposit Date *</label>

<input
id="depositDate"
type="date">

</div>

<div class="field">

<label>Bank Slip *</label>

<input
id="slip"
type="file"
accept="image/jpeg,image/png,image/webp,application/pdf">

<span class="help">
Maximum 5 MB.
</span>

</div>

</div>

<button
id="submit"
class="submit">

Submit Ad

</button>

</div>
</main>

<script>

const LOGIN_API =
"https://login.createlk.workers.dev";

const UPLOAD_API =
"https://upload.createlk.workers.dev";

const ADS_API =
"https://ads.createlk.workers.dev";

const $ = id =>
document.getElementById(id);

let session = null;


/* MESSAGE */

function show(text,type){

const box = $("message");

box.textContent = text;

box.className =
"message " + type;

}


/* LOGIN SESSION */

async function getSession(){

try{

const response =
await fetch(
`${LOGIN_API}/session`,
{
method:"GET",
credentials:"include",
headers:{
"Accept":"application/json"
}
}
);

const text =
await response.text();

let data = {};

try{
data = text
? JSON.parse(text)
: {};
}catch{
data = {};
}

if(
!response.ok ||
!data.success ||
!data.token
){

location.href =
"login.html";

return null;

}

return data;

}catch(error){

console.error(
"SESSION ERROR:",
error
);

show(
"Please log in first.",
"error"
);

setTimeout(()=>{
location.href =
"login.html";
},1000);

return null;

}

}


/* PHOTO PREVIEW */

$("photo").onchange = e => {

const file =
e.target.files[0];

if(!file)
return;

if(file.size >
5 * 1024 * 1024){

e.target.value = "";

$("preview").style.display =
"none";

return show(
"Photo must be 5 MB or smaller.",
"error"
);

}

const allowed = [
"image/jpeg",
"image/png",
"image/webp"
];

if(!allowed.includes(file.type)){

e.target.value = "";

$("preview").style.display =
"none";

return show(
"Only JPG, PNG or WebP images are allowed.",
"error"
);

}

const reader =
new FileReader();

reader.onload = x => {

$("previewImg").src =
x.target.result;

$("preview").style.display =
"block";

};

reader.readAsDataURL(file);

};


/* AD TYPE */

const prices = {

free:0,

featured:500,

urgent:500,

top:500

};


document
.querySelectorAll(
'input[name="type"]'
)
.forEach(r => {

r.onchange = () => {

document
.querySelectorAll(".option")
.forEach(x =>
x.classList.remove(
"selected"
));

r.closest(".option")
.classList.add("selected");

if(r.value === "free"){

$("paymentSection")
.classList.add("hidden");

}else{

$("paymentSection")
.classList.remove("hidden");

$("amount").textContent =
"Amount: LKR " +
prices[r.value];

}

};

});


/* COPY */

document
.querySelectorAll(".copy")
.forEach(button => {

button.onclick =
async () => {

try{

await navigator
.clipboard
.writeText(
button.dataset.copy
);

button.textContent =
"Copied";

setTimeout(()=>{
button.textContent =
"Copy";
},1200);

}catch{

show(
"Unable to copy.",
"error"
);

}

};

});


/* UPLOAD TO R2 */

async function upload(file,folder){

if(!session ||
!session.token){

throw new Error(
"Session expired."
);

}

const form =
new FormData();

form.append(
"file",
file
);

form.append(
"folder",
folder
);

let response;

try{

response =
await fetch(
`${UPLOAD_API}/upload`,
{
method:"POST",

headers:{
Authorization:
"Bearer " +
session.token
},

body:form
}
);

}catch(error){

throw new Error(
"Unable to connect to the upload server."
);

}

const text =
await response.text();

let data = {};

try{

data = text
? JSON.parse(text)
: {};

}catch{

throw new Error(
"Invalid upload response."
);

}

if(response.status === 401){

location.href =
"login.html";

throw new Error(
"Session expired."
);

}

if(
!response.ok ||
data.success === false
){

throw new Error(
data.error ||
"Upload failed."
);

}

if(!data.key){

throw new Error(
"Upload completed but no file key was returned."
);

}

return data.key;

}


/* CREATE AD */

async function createAd(data){

if(!session ||
!session.token){

throw new Error(
"Session expired."
);

}

let response;

try{

response =
await fetch(
`${ADS_API}/create`,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer " +
session.token
},

body:
JSON.stringify(data)
}
);

}catch{

throw new Error(
"Unable to connect to the ads server."
);

}

const text =
await response.text();

let result = {};

try{

result = text
? JSON.parse(text)
: {};

}catch{

throw new Error(
"Invalid ads server response."
);

}

if(response.status === 401){

location.href =
"login.html";

throw new Error(
"Session expired."
);

}

if(
!response.ok ||
result.success === false
){

throw new Error(
result.error ||
"Unable to create the ad."
);

}

return result;

}


/* SUBMIT */

$("submit").onclick =
async () => {

if(!session){

session =
await getSession();

if(!session)
return;

}

const photo =
$("photo").files[0];

const type =
document
.querySelector(
'input[name="type"]:checked'
).value;


if(!photo)
return show(
"Please select an ad photo.",
"error"
);


if(!$("title").value.trim())
return show(
"Please enter an ad title.",
"error"
);


if(!$("description").value.trim())
return show(
"Please enter a description.",
"error"
);


if(!$("whatsapp").value.trim())
return show(
"Please enter a WhatsApp number.",
"error"
);


if(!$("call").value.trim())
return show(
"Please enter a call number.",
"error"
);


if(!$("province").value)
return show(
"Please select a province.",
"error"
);


if(!$("district").value.trim())
return show(
"Please enter the district.",
"error"
);


if(!$("city").value.trim())
return show(
"Please enter the city.",
"error"
);


let slipFile = null;

if(type !== "free"){

if(!$("depositDate").value)
return show(
"Please select the deposit date.",
"error"
);

slipFile =
$("slip").files[0];

if(!slipFile)
return show(
"Please upload the bank slip.",
"error"
);

if(
slipFile.size >
5 * 1024 * 1024
)
return show(
"Bank slip must be 5 MB or smaller.",
"error"
);

const allowedSlip = [

"image/jpeg",
"image/png",
"image/webp",
"application/pdf"

];

if(!allowedSlip.includes(
slipFile.type
))
return show(
"Only JPG, PNG, WebP or PDF bank slips are allowed.",
"error"
);

}


const button =
$("submit");

button.disabled =
true;

button.textContent =
"Uploading...";


try{

/* UPLOAD PHOTO */

const photoKey =
await upload(
photo,
"ads"
);


/* UPLOAD PAYMENT SLIP */

let slipKey = null;

if(type !== "free"){

button.textContent =
"Uploading slip...";

slipKey =
await upload(
slipFile,
"payments"
);

}


/* CREATE AD */

button.textContent =
"Submitting...";


const adData = {

title:
$("title")
.value
.trim(),

description:
$("description")
.value
.trim(),

whatsapp_no:
$("whatsapp")
.value
.trim(),

call_no:
$("call")
.value
.trim(),

province:
$("province")
.value,

district:
$("district")
.value
.trim(),

city:
$("city")
.value
.trim(),

ad_type:
type,

photo_url:
photoKey,

payment_slip_url:
slipKey,

deposit_date:
type === "free"
? null
: $("depositDate").value

};


const result =
await createAd(
adData
);


show(
type === "free"
? "Ad submitted for admin approval."
: "Ad and payment submitted for admin approval.",
"success"
);

button.textContent =
"Submitted";


setTimeout(() => {

location.href =
"my-ads.html";

},1500);


}catch(error){

console.error(
"SUBMIT ERROR:",
error
);

show(
error.message ||
"Unable to submit the ad.",
"error"
);

button.disabled =
false;

button.textContent =
"Submit Ad";

}

};


/* CHECK LOGIN */

(async()=>{

session =
await getSession();

})();

</script>

</body>
</html>
