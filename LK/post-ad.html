.option input{

.name{font-weight:700}
.price{
display:block;

}

border:1px solid #e2e8f0;

.copy{

background:#ecfdf5;
color:#166534;

.hidden{

}
.message{
display:none;
padding:12px;
border-radius:9px;
margin-bottom:17px;
font-weight:600
}
.error{
display:block;
background:#fef2f2;
color:#991b1b
}
.success{
display:block;
background:#f0fdf4;
color:#166534
}
.preview{
display:none;
margin-top:10px
}
.preview img{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:10px
}
.submit{
width:100%;
margin-top:10px;
padding:14px;
border:0;
border-radius:9px;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer
}

opacity:.6;
cursor:not-allowed
}
@media(max-width:600px){
.card{padding:20px}
.types{grid-template-columns:1fr}
.bank{display:block}
.value{

margin-top:4px
}
}

<body>

<script>

/* API */

const LOGIN_API =
"https://login.createlk.workers.dev";

const UPLOAD_API =
"https://upload.createlk.workers.dev";

const ADS_API =
"https://ads.createlk.workers.dev";

const LOGIN_PAGE =
"https://createlk.com/LK/login.html";


/* STORAGE */

const TOKEN_KEY =
"createlk_session_token";

const CUSTOMER_KEY =
"createlk_customer";


/* HELPER */

const $ =
id => document.getElementById(id);

let currentUser = null;


/* MESSAGE */

function show(text,type){

const box =
$("message");

box.textContent =
text;

box.className =
"message " + type;

}


/* TOKEN */

function getToken(){

return sessionStorage.getItem(
TOKEN_KEY
);

}


/* GET CURRENT USER */

async function getMe(token){

const response =
await fetch(
LOGIN_API + "/me",
{
method:"GET",

headers:{
Authorization:
"Bearer " + token
},

cache:"no-store"
}
);

const data =
await response
.json()
.catch(()=>({}));

if(
response.status === 401 ||
!response.ok ||
!data.success
){

throw new Error(
data.error ||
"Your session has expired."
);

}

return data;

}


/* CHECK LOGIN */

async function checkLogin(){

const token =
getToken();

if(!token){

location.replace(
LOGIN_PAGE
);

return false;

}

try{

const result =
await getMe(token);

if(!result.user){

throw new Error(
"User information is missing."
);

}

currentUser =
result.user;

try{

sessionStorage.setItem(
CUSTOMER_KEY,
JSON.stringify(
result.user
)
);

}catch{}

return true;

}catch(error){

console.error(
"LOGIN CHECK:",
error
);

sessionStorage.removeItem(
TOKEN_KEY
);

sessionStorage.removeItem(
CUSTOMER_KEY
);

location.replace(
LOGIN_PAGE
);

return false;

}


/* GET JSON */

async function getJSON(url){

const response =
await fetch(
url,
{
method:"GET",
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}

return response.json();

}


/* LOAD PROVINCES */
/* EXACT SAME API AS WORKING INDEX.HTML */

async function loadProvinces(){

const province =
$("province");

try{

const data =
await getJSON(
ADS_API + "/locations"
);

const list =
Array.isArray(
data.provinces
)
? data.provinces
: [];

province.innerHTML =
'<option value="">Select Province</option>';

list.forEach(item=>{

const option =
document.createElement(
"option"
);

if(
typeof item === "object"
){

option.value =
item.name ??
item.province ??
"";

option.textContent =
item.name ??
item.province ??
"";

}else{

option.value =
String(item);

option.textContent =
String(item);

}

if(option.value){

province.appendChild(
option
);

}

});

}catch(error){

console.error(
"Province loading error:",
error
);

province.innerHTML =
'<option value="">Unable to load provinces</option>';

show(
"Unable to load provinces.",
"error"
);

}

}


/* LOAD DISTRICTS */
/* EXACT SAME API AS WORKING INDEX.HTML */

async function loadDistricts(
name
){

const district =
$("district");

const city =
$("city");


district.innerHTML =
'<option value="">All Districts</option>';

city.innerHTML =
'<option value="">All Cities</option>';

district.disabled =
true;

city.disabled =
true;


if(!name){

district.innerHTML =
'<option value="">Select District</option>';

city.innerHTML =
'<option value="">Select City / Town</option>';

return;

}


try{

const data =
await getJSON(
ADS_API +
"/locations?province=" +
encodeURIComponent(
name
)
);

const list =
Array.isArray(
data.districts
)
? data.districts
: [];


district.innerHTML =
'<option value="">Select District</option>';


list.forEach(item=>{

const option =
document.createElement(
"option"
);

if(
typeof item === "object"
){

option.value =
item.name ??
item.district ??
"";

option.textContent =
item.name ??
item.district ??
"";

}else{

option.value =
String(item);

option.textContent =
String(item);

}

if(option.value){

district.appendChild(
option
);

}

});


district.disabled =
district.options.length <= 1;


}catch(error){

console.error(
"District loading error:",
error
);

district.innerHTML =
'<option value="">Unable to load districts</option>';

city.innerHTML =
'<option value="">Select City / Town</option>';

show(
"Unable to load districts.",
"error"
);

}

}


/* LOAD CITIES */
/* EXACT SAME API AS WORKING INDEX.HTML */

async function loadCities(
provinceName,
districtName
){

const city =
$("city");

city.innerHTML =
'<option value="">All Cities</option>';

city.disabled =
true;


if(
!provinceName ||
!districtName
){

city.innerHTML =
'<option value="">Select City / Town</option>';

return;

}


try{

const data =
await getJSON(
ADS_API +
"/locations?province=" +
encodeURIComponent(
provinceName
) +
"&district=" +
encodeURIComponent(
districtName
)
);

const list =
Array.isArray(
data.cities
)
? data.cities
: [];


city.innerHTML =
'<option value="">Select City / Town</option>';


list.forEach(item=>{

const option =
document.createElement(
"option"
);

if(
typeof item === "object"
){

option.value =
item.name ??
item.city ??
"";

option.textContent =
item.name ??
item.city ??
"";

}else{

option.value =
String(item);

option.textContent =
String(item);

}

if(option.value){

city.appendChild(
option
);

}

});


city.disabled =
city.options.length <= 1;


}catch(error){

console.error(
"City loading error:",
error
);

city.innerHTML =
'<option value="">Unable to load cities</option>';

show(
"Unable to load cities.",
"error"
);

}

}


/* PROVINCE CHANGE */

$("province").onchange =
async function(){

await loadDistricts(
this.value
);

};


/* DISTRICT CHANGE */

$("district").onchange =
async function(){

await loadCities(
$("province").value,
this.value
);

};


/* PHOTO PREVIEW */

$("photo").onchange =
event => {

const file =
event.target.files[0];

if(!file)
return;


if(
file.size >
5 * 1024 * 1024
){

event.target.value =
"";

$("preview").style.display =
"none";

return show(
"Photo must be 5 MB or smaller.",
"error"
);

}


const allowed = [

"image/jpeg",
"image/png",
"image/webp"

];


if(
!allowed.includes(
file.type
)
){

event.target.value =
"";

$("preview").style.display =
"none";

return show(
"Only JPG, PNG or WebP images are allowed.",
"error"
);

}


const reader =
new FileReader();


reader.onload =
event => {

$("previewImg").src =
event.target.result;

$("preview").style.display =
"block";

};


reader.readAsDataURL(
file
);

};


/* PRICES */

const prices = {

free:0,

featured:500,

urgent:500,

top:500

};


/* AD TYPE */

document
.querySelectorAll(
'input[name="type"]'
)
.forEach(
radio => {

radio.onchange =
() => {


document
.querySelectorAll(
".option"
)
.forEach(
option =>
option.classList.remove(
"selected"
)
);


radio
.closest(".option")
.classList.add(
"selected"
);


if(
radio.value === "free"
){

$("paymentSection")
.classList.add(
"hidden"
);

}else{

$("paymentSection")
.classList.remove(
"hidden"
);

$("amount")
.textContent =
"Amount: LKR " +
prices[
radio.value
];

}

};

}
);


/* COPY */

document
.querySelectorAll(
".copy"
)
.forEach(
button => {

button.onclick =
async () => {

try{

await navigator
.clipboard
.writeText(
button.dataset.copy
);

button.textContent =
"Copied";

setTimeout(
() => {

button.textContent =
"Copy";

},
1200
);

}catch{

show(
"Unable to copy the account number.",
"error"
);

}

};

}
);


/* UPLOAD */

async function upload(
file,
folder
){

const token =
getToken();

if(!token){

throw new Error(
"Your login session has expired."
);

}


const form =
new FormData();

form.append(
"file",
file
);

form.append(
"folder",
folder
);


let response;


try{

response =
await fetch(
UPLOAD_API + "/upload",
{
method:"POST",

headers:{
Authorization:
"Bearer " + token
},

body:form
}
);

}catch(error){

console.error(
"UPLOAD CONNECTION:",
error
);

throw new Error(
"Unable to connect to the upload server."
);

}


const text =
await response.text();

let data;


try{

data =
text
? JSON.parse(text)
: {};

}catch{

throw new Error(
"Invalid upload server response."
);

}


if(
response.status === 401
){

sessionStorage.removeItem(
TOKEN_KEY
);

sessionStorage.removeItem(
CUSTOMER_KEY
);

location.replace(
LOGIN_PAGE
);

throw new Error(
"Your login session has expired."
);

}


if(
!response.ok ||
data.success === false
){

throw new Error(
data.error ||
"Upload failed."
);

}


if(!data.key){

throw new Error(
"Upload completed but no file key was returned."
);

}


return data.key;

}


/* CREATE AD */

async function createAd(
adData
){

const token =
getToken();

if(!token){

throw new Error(
"Your login session has expired."
);

}


let response;


try{

response =
await fetch(
ADS_API + "/create",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer " + token
},

body:
JSON.stringify(
adData
)
}
);

}catch(error){

console.error(
"ADS CONNECTION:",
error
);

throw new Error(
"Unable to connect to the ads server."
);

}


const text =
await response.text();

let data;


try{

data =
text
? JSON.parse(text)
: {};

}catch{

throw new Error(
"Invalid ads server response."
);

}


if(
response.status === 401
){

sessionStorage.removeItem(
TOKEN_KEY
);

sessionStorage.removeItem(
CUSTOMER_KEY
);

location.replace(
LOGIN_PAGE
);

throw new Error(
"Your login session has expired."
);

}


if(
!response.ok ||
data.success === false
){

throw new Error(
data.error ||
"Unable to create the ad."
);

}


return data;

}


/* SUBMIT */

$("submit").onclick =
async () => {

const loggedIn =
await checkLogin();

if(!loggedIn)
return;


const photo =
$("photo").files[0];

const type =
document.querySelector(
'input[name="type"]:checked'
).value;


/* VALIDATION */

if(!photo){

return show(
"Please select an ad photo.",
"error"
);

}


if(
photo.size >
5 * 1024 * 1024
){

return show(
"Photo must be 5 MB or smaller.",
"error"
);

}


if(
!$("title").value.trim()
){

return show(
"Please enter an ad title.",
"error"
);

}


if(
!$("description").value.trim()
){

return show(
"Please enter a description.",
"error"
);

}


if(
!$("whatsapp").value.trim()
){

return show(
"Please enter a WhatsApp number.",
"error"
);

}


if(
!$("call").value.trim()
){

return show(
"Please enter a call number.",
"error"
);

}


if(
!$("province").value
){

return show(
"Please select a province.",
"error"
);

}


if(
!$("district").value
){

return show(
"Please select the district.",
"error"
);

}


if(
!$("city").value
){

return show(
"Please select the city.",
"error"
);

}


/* PAYMENT */

let slipFile =
null;


if(
type !== "free"
){

if(
!$("depositDate").value
){

return show(
"Please select the deposit date.",
"error"
);

}


slipFile =
$("slip").files[0];


if(!slipFile){

return show(
"Please upload the bank slip.",
"error"
);

}


if(
slipFile.size >
5 * 1024 * 1024
){

return show(
"Bank slip must be 5 MB or smaller.",
"error"
);

}


const allowedSlip = [

"image/jpeg",
"image/png",
"image/webp",
"application/pdf"

];


if(
!allowedSlip.includes(
slipFile.type
)
){

return show(
"Only JPG, PNG, WebP or PDF bank slips are allowed.",
"error"
);

}

}


/* BUTTON */

const button =
$("submit");

button.disabled =
true;

button.textContent =
"Uploading...";


try{


/* PHOTO */

const photoKey =
await upload(
photo,
"ads"
);


/* PAYMENT SLIP */

let slipKey =
null;


if(
type !== "free"
){

button.textContent =
"Uploading bank slip...";

slipKey =
await upload(
slipFile,
"payments"
);

}


/* CREATE */

button.textContent =
"Submitting...";


const adData = {

title:
$("title")
.value
.trim(),

description:
$("description")
.value
.trim(),

whatsapp_no:
$("whatsapp")
.value
.trim(),

call_no:
$("call")
.value
.trim(),

province:
$("province")
.value,

district:
$("district")
.value,

city:
$("city")
.value,

ad_type:
type,

photo_url:
photoKey,

payment_slip_url:
slipKey,

deposit_date:
type === "free"
? null
: $("depositDate").value

};


await createAd(
adData
);


/* SUCCESS */

show(
type === "free"
? "Ad submitted for admin approval."
: "Ad and payment submitted for admin approval.",
"success"
);


button.textContent =
"Submitted";


setTimeout(
() => {

location.href =
"my-ads.html";

},
1500
);


}catch(error){

console.error(
"SUBMIT ERROR:",
error
);

show(
error.message ||
"Unable to submit the ad.",
"error"
);

button.disabled =
false;

button.textContent =
"Submit Ad";

}

};


/* START */

(async()=>{

const loggedIn =
await checkLogin();

if(!loggedIn)
