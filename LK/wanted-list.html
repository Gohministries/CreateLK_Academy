<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Job Seeker Profiles | CreateLK Jobs</title>
<meta name="description" content="Find professional job seeker profiles across Sri Lanka.">
<meta name="theme-color" content="#102a56">

<link rel="icon" href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#182230;
}

header{
  background:#102a56;
  color:#fff;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  font-size:19px;
}

.logo img{
  width:38px;
  height:38px;
  border-radius:9px;
  object-fit:cover;
}

.back{
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:8px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:25px 16px 50px;
}

.hero{
  background:linear-gradient(135deg,#102a56,#183b73);
  color:#fff;
  border-radius:18px;
  padding:30px 22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#dbe7f7;
  line-height:1.6;
}

.filters{
  background:#fff;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(16,42,86,.08);
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
}

input,
select,
button{
  width:100%;
  min-height:44px;
  border:1px solid #d8dee8;
  border-radius:9px;
  padding:10px 12px;
  font-size:14px;
  background:#fff;
}

button{
  background:#102a56;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.92;
}

.results-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 0 12px;
  gap:10px;
}

.results-head h2{
  margin:0;
  font-size:20px;
}

.count{
  color:#667085;
  font-size:14px;
}

.list{
  display:grid;
  gap:14px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:19px;
  box-shadow:0 3px 15px rgba(16,42,86,.08);
  border:1px solid #edf0f5;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
}

.name{
  margin:0;
  color:#102a56;
  font-size:20px;
}

.position{
  margin:5px 0 0;
  font-weight:700;
  color:#d69b16;
}

.badge{
  background:#102a56;
  color:#fff;
  padding:6px 9px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px 20px;
  margin-top:16px;
  color:#4b5563;
  font-size:14px;
}

.detail strong{
  color:#202938;
}

.skills{
  margin-top:14px;
  line-height:1.6;
  font-size:14px;
}

.skills strong{
  color:#102a56;
}

.about{
  margin-top:12px;
  color:#596273;
  line-height:1.6;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.action{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:43px;
  border-radius:9px;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

.whatsapp{
  background:#25D366;
  color:#fff;
}

.whatsapp:hover{
  background:#20bd5a;
}

.view{
  background:#102a56;
  color:#fff;
}

.view:hover{
  background:#183b73;
}

.empty{
  background:#fff;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  color:#667085;
}

.loading{
  text-align:center;
  padding:30px;
  color:#667085;
}

.error{
  background:#fff0f0;
  color:#b42318;
  padding:15px;
  border-radius:10px;
}

footer{
  background:#102a56;
  color:#dbe7f7;
  text-align:center;
  padding:25px 15px;
  font-size:13px;
}

footer a{
  color:#fff;
  text-decoration:none;
  margin:0 7px;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .header-inner{
    align-items:center;
  }

  .logo{
    font-size:16px;
  }

  .logo img{
    width:34px;
    height:34px;
  }

  main{
    padding:18px 12px 40px;
  }

  .hero{
    padding:24px 18px;
  }

  .hero h1{
    font-size:25px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .details{
    grid-template-columns:1fr;
  }

  .card-top{
    flex-direction:column;
  }

  .actions{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="/jobs/index.html" class="logo">
      <img
        src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
        alt="CreateLK Jobs">
      <span>CreateLK Jobs</span>
    </a>

    <a href="/jobs/index.html" class="back">← Back</a>

  </div>
</header>

<main>

  <section class="hero">
    <h1>Find Job Seekers</h1>
    <p>
      Discover professional job seeker profiles and connect with suitable candidates across Sri Lanka.
    </p>
  </section>

  <section class="filters">

    <div class="grid">

      <input
        id="search"
        type="search"
        placeholder="Search name, position or skills..."
      >

      <select id="province">
        <option value="">All Provinces</option>
      </select>

      <select id="district">
        <option value="">All Districts</option>
      </select>

      <select id="city">
        <option value="">All Cities</option>
      </select>

    </div>

    <div style="margin-top:10px">
      <button onclick="loadProfiles()">Search Profiles</button>
    </div>

  </section>

  <div class="results-head">
    <h2>Job Seeker Profiles</h2>
    <div class="count" id="count">Loading...</div>
  </div>

  <section id="list" class="list">
    <div class="loading">Loading profiles...</div>
  </section>

</main>

<footer>

  <div>
    <a href="/jobs/index.html">Home</a>
    <a href="/LK/wanted.html">Create Profile</a>
    <a href="/jobs/terms.html">Terms</a>
    <a href="/jobs/privacy.html">Privacy</a>
    <a href="/jobs/refund.html">Refund</a>
  </div>

  <div style="margin-top:12px">
    © 2026 CreateLK Jobs
  </div>

</footer>

<script>
const API = "https://wanted.createlk.workers.dev";
const LOCATION_API = "https://ads.createlk.workers.dev";

const searchEl = document.getElementById("search");
const provinceEl = document.getElementById("province");
const districtEl = document.getElementById("district");
const cityEl = document.getElementById("city");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");


function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function isContactAllowed(profile){
  return Number(profile.contact_allowed) === 1 ||
         profile.contact_allowed === true ||
         profile.contact_allowed === "1" ||
         profile.contact_allowed === "true";
}


function whatsappNumber(number){
  let value = String(number || "")
    .replace(/[^\d]/g,"");

  if(value.startsWith("0")){
    value = "94" + value.substring(1);
  }

  return value;
}


async function loadProvinces(){

  try{

    const r = await fetch(LOCATION_API + "/locations");

    if(!r.ok) return;

    const data = await r.json();

    const provinces =
      Array.isArray(data)
        ? data
        : data.locations || data.data || [];

    provinceEl.innerHTML =
      '<option value="">All Provinces</option>';

    const names = new Set();

    provinces.forEach(x => {

      const name =
        typeof x === "string"
          ? x
          : x.province || x.name;

      if(!name || names.has(name)) return;

      names.add(name);

      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;

      provinceEl.appendChild(option);

    });

  }catch(e){

    console.error("Province loading failed",e);

  }

}


async function loadDistricts(){

  const province = provinceEl.value;

  districtEl.innerHTML =
    '<option value="">All Districts</option>';

  cityEl.innerHTML =
    '<option value="">All Cities</option>';

  if(!province) return;

  try{

    const r = await fetch(
      LOCATION_API +
      "/locations?province=" +
      encodeURIComponent(province)
    );

    if(!r.ok) return;

    const data = await r.json();

    const districts =
      Array.isArray(data)
        ? data
        : data.districts || data.data || [];

    const names = new Set();

    districts.forEach(x => {

      const name =
        typeof x === "string"
          ? x
          : x.district || x.name;

      if(!name || names.has(name)) return;

      names.add(name);

      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;

      districtEl.appendChild(option);

    });

  }catch(e){

    console.error("District loading failed",e);

  }

}


async function loadCities(){

  const province = provinceEl.value;
  const district = districtEl.value;

  cityEl.innerHTML =
    '<option value="">All Cities</option>';

  if(!province || !district) return;

  try{

    const r = await fetch(
      LOCATION_API +
      "/locations?province=" +
      encodeURIComponent(province) +
      "&district=" +
      encodeURIComponent(district)
    );

    if(!r.ok) return;

    const data = await r.json();

    const cities =
      Array.isArray(data)
        ? data
        : data.cities || data.data || [];

    const names = new Set();

    cities.forEach(x => {

      const name =
        typeof x === "string"
          ? x
          : x.city || x.name;

      if(!name || names.has(name)) return;

      names.add(name);

      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;

      cityEl.appendChild(option);

    });

  }catch(e){

    console.error("City loading failed",e);

  }

}


provinceEl.addEventListener("change",async()=>{
  await loadDistricts();
  await loadProfiles();
});


districtEl.addEventListener("change",async()=>{
  await loadCities();
  await loadProfiles();
});


cityEl.addEventListener("change",loadProfiles);


searchEl.addEventListener("keydown",e=>{
  if(e.key === "Enter"){
    loadProfiles();
  }
});


async function loadProfiles(){

  listEl.innerHTML =
    '<div class="loading">Loading profiles...</div>';

  countEl.textContent = "Loading...";

  try{

    const params = new URLSearchParams();

    const search = searchEl.value.trim();
    const province = provinceEl.value;
    const district = districtEl.value;
    const city = cityEl.value;

    if(search){
      params.set("search",search);
    }

    if(province){
      params.set("province",province);
    }

    if(district){
      params.set("district",district);
    }

    if(city){
      params.set("city",city);
    }

    const url =
      API +
      "/api/wanted" +
      (params.toString()
        ? "?" + params.toString()
        : "");

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Unable to load profiles");
    }

    const data = await response.json();

    const profiles =
      Array.isArray(data)
        ? data
        : data.profiles ||
          data.data ||
          [];

    renderProfiles(profiles);

  }catch(error){

    console.error(error);

    countEl.textContent = "Error";

    listEl.innerHTML =
      '<div class="error">Unable to load job seeker profiles. Please try again.</div>';

  }

}


function renderProfiles(profiles){

  if(!profiles.length){

    countEl.textContent = "0 profiles";

    listEl.innerHTML =
      '<div class="empty">No active job seeker profiles found.</div>';

    return;
  }

  countEl.textContent =
    profiles.length +
    (profiles.length === 1 ? " profile" : " profiles");

  listEl.innerHTML =
    profiles.map(profile => {

      const id =
        profile.id ||
        profile.profile_id;

      const name =
        escapeHTML(profile.name || "Job Seeker");

      const position =
        escapeHTML(profile.position || "Job Seeker");

      const province =
        escapeHTML(profile.province || "—");

      const district =
        escapeHTML(profile.district || "—");

      const city =
        escapeHTML(profile.city || "—");

      const salary =
        escapeHTML(profile.salary || "Not specified");

      const experience =
        escapeHTML(profile.experience || "Not specified");

      const education =
        escapeHTML(profile.education || "Not specified");

      const skills =
        escapeHTML(profile.skills || "Not specified");

      const description =
        escapeHTML(profile.description || "");

      const expires =
        profile.expires_at
          ? new Date(profile.expires_at).toLocaleDateString(
              "en-LK",
              {
                year:"numeric",
                month:"short",
                day:"numeric"
              }
            )
          : "—";

      const profileURL =
        "/LK/profile.html?id=" +
        encodeURIComponent(id);

      let whatsappButton = "";

      if(
        isContactAllowed(profile) &&
        (profile.whatsapp || profile.phone)
      ){

        const number =
          whatsappNumber(
            profile.whatsapp ||
            profile.phone
          );

        if(number){

          whatsappButton = `
            <a
              class="action whatsapp"
              href="https://wa.me/${encodeURIComponent(number)}?text=${encodeURIComponent("Hello, I found your Job Seeker Profile on CreateLK Jobs.")}"
              target="_blank"
              rel="noopener">
              WhatsApp
            </a>
          `;

        }else{

          whatsappButton = `<span></span>`;

        }

      }else{

        whatsappButton = `<span></span>`;

      }


      return `

        <article class="card">

          <div class="card-top">

            <div>
              <h3 class="name">${name}</h3>
              <div class="position">${position}</div>
            </div>

            <div class="badge">
              JOB SEEKER PROFILE
            </div>

          </div>


          <div class="details">

            <div class="detail">
              <strong>Location:</strong><br>
              ${province} • ${district} • ${city}
            </div>

            <div class="detail">
              <strong>Expected Salary:</strong><br>
              ${salary}
            </div>

            <div class="detail">
              <strong>Experience:</strong><br>
              ${experience}
            </div>

            <div class="detail">
              <strong>Education:</strong><br>
              ${education}
            </div>

          </div>


          <div class="skills">
            <strong>Skills:</strong>
            ${skills}
          </div>


          ${
            description
              ? `
                <div class="about">
                  ${description}
                </div>
              `
              : ""
          }


          <div class="about">
            Profile active until:
            <strong>${expires}</strong>
          </div>


          <div class="actions">

            ${whatsappButton}

            <a
              class="action view"
              href="${profileURL}">
              View Profile
            </a>

          </div>

        </article>

      `;

    }).join("");

}


loadProvinces();
loadProfiles();
</script>

</body>
</html>
