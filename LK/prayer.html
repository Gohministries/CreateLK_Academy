<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Prayer Points</title>
<meta name="theme-color" content="#102a56">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:#102a56;
  color:#fff;
  padding:22px 16px;
  text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;opacity:.9}
.wrap{max-width:700px;margin:auto;padding:15px}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 14px #00000012;
}
.hidden{display:none!important}
.progress{
  height:10px;
  background:#e5e9f0;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0;
}
.progress span{
  display:block;
  height:100%;
  background:#d69b16;
  width:0;
}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}
textarea{min-height:180px;resize:vertical}
button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#102a56;color:#fff}
.gold{background:#d69b16;color:#fff}
.gray{background:#e9edf3;color:#172033}
.danger{background:#c62828;color:#fff}
.row{
  display:flex;
  gap:8px;
}
.row button{flex:1}
.topline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.small{font-size:13px;color:#687386}
.status{
  margin:12px 0;
  padding:10px;
  border-radius:10px;
  background:#f1f4f8;
  font-weight:bold;
}
.prayer-title{
  font-size:21px;
  font-weight:bold;
  margin:14px 0 10px;
}
.prayer-content{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:16px;
}
.msg{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
}
.err{background:#ffe8e8;color:#a00000}
.ok{background:#e8f7ed;color:#176b35}
.user{
  font-size:13px;
  color:#687386;
  word-break:break-all;
}
</style>
</head>

<body>

<header>
  <h1>🙏 100 Prayer Points</h1>
  <p>100 prayer points • Every year</p>
</header>

<div class="wrap">

  <div id="login" class="card">
    <h2>🔐 Private Prayer Journal</h2>
    <p>Sign in to access your 100 prayer points.</p>
    <button class="primary" onclick="login()">Continue with Google</button>
    <div id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">

    <div class="card">
      <div class="topline">
        <strong>📊 Year Progress</strong>
        <span id="progressText">0 / 100</span>
      </div>

      <div class="progress">
        <span id="progressBar"></span>
      </div>

      <div class="user" id="user"></div>

      <br>
      <button class="gray" onclick="logout()">Sign Out</button>
    </div>

    <div class="card">

      <div class="small" id="selectedDate"></div>

      <label for="pointSelect">Select Prayer Point</label>
      <select id="pointSelect" onchange="selectPoint()"></select>

      <div class="small" style="margin-top:12px">
        <span id="pointLabel">Prayer Point 1 of 100</span>
      </div>

      <div id="prayerArea">
        <div class="status">Loading prayer...</div>
      </div>

      <div class="row">
        <button class="primary" onclick="editSelected()">✏️ Edit</button>
        <button id="completeBtn" class="gold" onclick="markSelected()">✅ Mark Complete</button>
      </div>

      <div id="actionMsg"></div>
    </div>

    <div class="card">
      <h2 id="formTitle">➕ Add Prayer Point</h2>

      <label for="title">Prayer Title</label>
      <input id="title" placeholder="Enter prayer title">

      <label for="content">Full Prayer</label>
      <textarea id="content" placeholder="Write the full prayer..."></textarea>

      <br><br>

      <div class="row">
        <button class="primary" onclick="save()">💾 Save Prayer Point</button>
        <button id="cancelBtn" class="gray hidden" onclick="cancelEdit()">Cancel</button>
      </div>

      <div id="formMsg"></div>
    </div>

  </div>
</div>

<script>
const API="https://prayer.createlk.workers.dev";
const MAX=100;

let token=localStorage.getItem("prayer_token")||"";
let prayers=[];
let selectedPoint=1;
let todayPoint=1;
let editId=null;

const $=id=>document.getElementById(id);

function today(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function pointFor(date){
  const d=new Date(date+"T12:00:00");
  const start=new Date(d.getFullYear(),0,1,12);
  const day=Math.floor((d-start)/86400000)+1;
  return ((day-1)%100)+1;
}

function year(){
  return new Date().getFullYear();
}

function safe(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function login(){
  location.href=API+"/login";
}

function logout(){
  localStorage.removeItem("prayer_token");
  token="";
  location.reload();
}

async function api(path,opt={}){
  opt.headers={
    ...(opt.headers||{}),
    Authorization:"Bearer "+token,
    "Content-Type":"application/json"
  };

  const r=await fetch(API+path,opt);

  let d={};
  try{
    d=await r.json();
  }catch{}

  if(!r.ok){
    if(r.status===401) logout();
    throw Error(d.error||"Request failed");
  }

  return d;
}

function createSelector(){
  $("pointSelect").innerHTML=
    Array.from({length:MAX},(_,i)=>{
      const n=i+1;
      return `<option value="${n}">Prayer Point ${n}</option>`;
    }).join("");
}

async function start(){

  createSelector();

  if(!token) return;

  try{
    const me=await api("/me");

    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("user").textContent=me.email||"";

    await load();

  }catch(e){
    $("loginMsg").innerHTML=
      `<div class="msg err">${safe(e.message)}</div>`;
  }
}

async function load(){

  try{

    const data=await api("/prayers?year="+year());

    prayers=Array.isArray(data)?data:(data.prayers||[]);

    todayPoint=pointFor(today());
    selectedPoint=todayPoint;

    $("pointSelect").value=todayPoint;

    updateProgress();

    $("selectedDate").textContent=
      "Today: "+new Date().toLocaleDateString();

    await showPoint(todayPoint);

  }catch(e){

    $("prayerArea").innerHTML=
      `<div class="msg err">${safe(e.message)}</div>`;
  }
}

function updateProgress(){

  const completed=prayers.filter(p=>Number(p.completed)===1).length;
  const percent=Math.min(100,completed);

  $("progressText").textContent=completed+" / 100";
  $("progressBar").style.width=percent+"%";
}

async function selectPoint(){

  const point=Number($("pointSelect").value);

  selectedPoint=point;

  await showPoint(point);
}

async function showPoint(point){

  selectedPoint=Number(point);

  $("pointSelect").value=selectedPoint;

  $("pointLabel").textContent=
    "Prayer Point "+selectedPoint+" of 100";

  let p=prayers.find(x=>Number(x.prayer_point)===selectedPoint);

  if(!p){

    try{

      const d=await api(
        "/today?date="+encodeURIComponent(today())+
        "&prayer_point="+selectedPoint
      );

      p=d.prayer||d;

    }catch{}

  }

  if(!p){

    $("prayerArea").innerHTML=`
      <div class="status">
        ⏳ Prayer Point ${selectedPoint} has not been added yet.
      </div>
    `;

    $("completeBtn").textContent="✅ Mark Complete";
    $("completeBtn").disabled=true;
    return;
  }

  $("completeBtn").disabled=false;

  const completed=Number(p.completed)===1;

  $("prayerArea").innerHTML=`
    <div class="status">
      ${completed?"✅ Completed":"⏳ Not completed"}
    </div>

    <div class="prayer-title">${safe(p.title||"Untitled Prayer")}</div>

    <div class="prayer-content">
      ${safe(p.content||"")}
    </div>
  `;

  $("completeBtn").textContent=
    completed ? "↩️ Mark Not Completed" : "✅ Mark Complete";
}

function editSelected(){

  const p=prayers.find(
    x=>Number(x.prayer_point)===Number(selectedPoint)
  );

  if(!p){
    $("actionMsg").innerHTML=
      `<div class="msg err">This prayer point has not been added yet.</div>`;
    return;
  }

  edit(p.id);
}

async function markSelected(){

  const p=prayers.find(
    x=>Number(x.prayer_point)===Number(selectedPoint)
  );

  if(!p){
    $("actionMsg").innerHTML=
      `<div class="msg err">Add this prayer point first.</div>`;
    return;
  }

  try{

    const completed=Number(p.completed)===1 ? 0 : 1;

    await api("/complete",{
      method:"POST",
      body:JSON.stringify({
        prayer_id:p.id,
        year:year(),
        prayer_point:selectedPoint,
        completed:completed
      })
    });

    const keep=selectedPoint;

    $("actionMsg").innerHTML=
      `<div class="msg ok">
        ${completed?"✅ Prayer marked complete.":"↩️ Prayer marked not completed."}
      </div>`;

    await load();

    if(keep!==todayPoint){
      await showPoint(keep);
    }

  }catch(e){

    $("actionMsg").innerHTML=
      `<div class="msg err">${safe(e.message)}</div>`;
  }
}

function edit(id){

  const p=prayers.find(x=>Number(x.id)===Number(id));

  if(!p) return;

  editId=p.id;

  selectedPoint=Number(p.prayer_point)||1;

  $("pointSelect").value=selectedPoint;

  $("title").value=p.title||"";
  $("content").value=p.content||"";

  $("formTitle").textContent=
    "✏️ Edit Prayer Point "+selectedPoint;

  $("cancelBtn").classList.remove("hidden");

  window.scrollTo({
    top:$("formTitle").getBoundingClientRect().top+
        window.scrollY-20,
    behavior:"smooth"
  });
}

async function save(){

  const title=$("title").value.trim();
  const content=$("content").value.trim();

  if(!title||!content){

    $("formMsg").innerHTML=
      `<div class="msg err">Please enter title and full prayer.</div>`;
    return;
  }

  try{

    let result;

    if(editId){

      result=await api("/prayer/"+editId,{
        method:"PUT",
        body:JSON.stringify({
          year:year(),
          prayer_point:selectedPoint,
          title,
          content
        })
      });

    }else{

      result=await api("/prayer",{
        method:"POST",
        body:JSON.stringify({
          year:year(),
          prayer_point:selectedPoint,
          title,
          content
        })
      });
    }

    const keep=selectedPoint;

    $("formMsg").innerHTML=
      `<div class="msg ok">✅ Prayer point saved.</div>`;

    clearForm();

    await load();

    await showPoint(keep);

  }catch(e){

    $("formMsg").innerHTML=
      `<div class="msg err">${safe(e.message)}</div>`;
  }
}

function cancelEdit(){
  clearForm();
}

function clearForm(){

  editId=null;

  $("title").value="";
  $("content").value="";

  $("formTitle").textContent=
    "➕ Add Prayer Point";

  $("cancelBtn").classList.add("hidden");
}

start();
</script>

</body>
</html>
