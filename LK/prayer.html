<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Prayer Points</title>
<meta name="theme-color" content="#102a56">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#182230}
header{background:#102a56;color:#fff;text-align:center;padding:20px}
header h1{margin:0 0 5px;font-size:24px}header p{margin:0;font-size:14px}
main{max-width:850px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 4px 15px #102a5612}
.progress{height:10px;background:#e8edf5;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:#d69b16}
.ptop{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:7px}
.account{font-size:13px;color:#667085;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.date{text-align:center;background:#102a56;color:#fff}.date b{display:block;font-size:45px;margin:5px}
.center{text-align:center}.num{font-size:14px;color:#667085}.status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:bold;margin:8px 0 14px}.done{background:#e7f7ed;color:#137333}.pending{background:#fff4d6;color:#8a5a00}
h2{color:#102a56;font-size:21px}.content{white-space:pre-wrap;line-height:1.65;color:#344054}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}
.blue{background:#102a56;color:#fff}.gold{background:#d69b16;color:#fff}.green{background:#18864b;color:#fff}.red{background:#c62828;color:#fff}.gray{background:#e9edf3;color:#344054}.outline{background:#fff;border:1px solid #d0d5dd}
input,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin-bottom:9px;font-size:15px}textarea{min-height:150px;resize:vertical}
.item{border:1px solid #e2e6ec;border-radius:13px;padding:13px;margin-bottom:10px}.itempoint{font-size:13px;color:#667085;font-weight:bold}.itemtitle{color:#102a56;font-weight:bold;margin:5px 0}.small{font-size:13px;color:#667085}.hidden{display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{text-align:center;width:400px}
@media(max-width:600px){main{padding:9px}.actions button{flex:1}}
</style>
</head>
<body>

<div id="login" class="login hidden">
<div class="card">
<div style="font-size:45px">🙏</div>
<h2>100 Prayer Points</h2>
<p class="small">100 prayer points • Every year</p>
<button class="blue" onclick="goLogin()">🔐 Sign in with Google</button>
</div>
</div>

<div id="app" class="hidden">
<header><h1>🙏 100 Prayer Points</h1><p>100 prayer points • Every year</p></header>

<main>
<div class="card">
<div class="ptop"><span id="prog">0 / 100 Prayer Points</span><span id="pct">0%</span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="account"><span id="email"></span><button class="gray" onclick="logout()">🔒 Sign Out</button></div>
</div>

<div class="card date">
<div id="weekday"></div><b id="day"></b><div id="month"></div>
</div>

<div class="card center">
<div id="point" class="num"></div>
<div id="status" class="status pending">⏳ Not completed</div>
<h2 id="titleView"></h2>
<div id="contentView" class="content"></div>

<div class="actions">
<button class="blue" onclick="editSelected()">✏️ Edit</button>
<button id="complete" class="gold" onclick="complete()">✅ Mark as Completed</button>
</div>
<div id="viewMsg" class="small"></div>
</div>

<div id="editBox" class="card hidden">
<h3>✏️ Edit Prayer Point</h3>
<input id="editTitle" placeholder="Prayer title">
<textarea id="editContent" placeholder="Write the full prayer..."></textarea>
<div class="actions">
<button class="blue" onclick="saveEdit()">💾 Save Changes</button>
<button class="gray" onclick="cancelEdit()">Cancel</button>
</div>
<div id="editMsg" class="small"></div>
</div>

<div class="card">
<h3>➕ Add Prayer Point</h3>
<input id="newTitle" placeholder="Prayer title">
<textarea id="newContent" placeholder="Write the full prayer..."></textarea>
<button class="blue" onclick="save()">💾 Save Prayer Point</button>
<div id="msg" class="small"></div>
</div>

<div class="card">
<h3>📖 100 Prayer Points</h3>
<input id="search" placeholder="Search prayer points..." oninput="render()">
<div id="list"></div>
</div>
</main>
</div>

<script>
const API="https://prayer.createlk.workers.dev",MAX=100;
let token=sessionStorage.getItem("prayer_token")||"",prayers=[],selected=1,todayPoint=1,editId=null;
const $=id=>document.getElementById(id);

function date(){
let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),n=String(d.getDate()).padStart(2,"0");
return`${y}-${m}-${n}`;
}
function point(d){
let x=new Date(d+"T12:00:00"),s=new Date(x.getFullYear(),0,1,12);
return(Math.floor((x-s)/86400000)%100)+1;
}
function gp(p){return Number(p?.prayer_point??p?.point??p?.day)||null}

async function api(path,opt={}){
let h={"Content-Type":"application/json",...(opt.headers||{})};
if(token)h.Authorization="Bearer "+token;
let r=await fetch(API+path,{...opt,headers:h}),d={};
try{d=await r.json()}catch{}
if(!r.ok)throw Error(d.error||"Request failed");
return d;
}

async function start(){
if(!token){$("login").classList.remove("hidden");return}
try{
let me=await api("/me");$("email").textContent=me.email||"";
$("app").classList.remove("hidden");await load();
}catch(e){sessionStorage.removeItem("prayer_token");location.reload()}
}

function goLogin(){
location.href=API+"/login?redirect="+encodeURIComponent("https://createlk.com/LK/prayer.html");
}
function logout(){sessionStorage.removeItem("prayer_token");location.reload()}

async function load(){
let d=await api("/prayers?year="+new Date().getFullYear());
prayers=d.prayers||[];todayPoint=point(date());selected=todayPoint;progress();showDate();render();await show(selected);
}

function progress(){
let n=prayers.filter(p=>Number(p.completed)===1).length;
$("prog").textContent=`${n} / ${MAX} Prayer Points`;
$("pct").textContent=Math.round(n/MAX*100)+"%";
$("bar").style.width=Math.round(n/MAX*100)+"%";
}

function showDate(){
let d=new Date(date()+"T12:00:00");
$("weekday").textContent=d.toLocaleDateString("en-US",{weekday:"long"});
$("day").textContent=d.getDate();
$("month").textContent=d.toLocaleDateString("en-US",{month:"long",year:"numeric"});
}

async function show(n){
selected=Number(n);$("point").textContent=`Prayer Point ${selected} of ${MAX}`;
let p=prayers.find(x=>gp(x)===selected);
if(!p)try{let d=await api("/today?date="+date()+"&prayer_point="+selected);p=d.prayer}catch{}
if(!p){
$("titleView").textContent="Prayer Point "+selected;
$("contentView").textContent="No prayer has been added yet.";
$("status").textContent="⏳ Not completed";$("status").className="status pending";
$("complete").textContent="✅ Mark as Completed";return;
}
$("titleView").textContent=p.title||"";
$("contentView").textContent=p.content||"";
let done=Number(p.completed)===1;
$("status").textContent=done?"✅ Completed":"⏳ Not completed";
$("status").className="status "+(done?"done":"pending");
$("complete").textContent=done?"↩️ Mark as Not Completed":"✅ Mark as Completed";
}

function find(){return prayers.find(p=>gp(p)===selected)}

async function complete(){
let p=find();if(!p){$("viewMsg").textContent="Add this prayer point first.";return}
await api("/complete",{method:"POST",body:JSON.stringify({
prayer_id:p.id,year:new Date().getFullYear(),prayer_point:selected,
completed:Number(p.completed)===1?0:1
})});
let keep=selected;await load();if(keep!==todayPoint)show(keep);
}

function editSelected(){
let p=find();if(!p){$("viewMsg").textContent="Prayer not found.";return}
editId=p.id;$("editTitle").value=p.title||"";$("editContent").value=p.content||"";
$("editBox").classList.remove("hidden");$("editBox").scrollIntoView({behavior:"smooth"});
}

function edit(id){
let p=prayers.find(x=>Number(x.id)===Number(id));if(!p)return;
selected=gp(p);editSelected();
}

async function saveEdit(){
let p=prayers.find(x=>Number(x.id)===Number(editId));
let title=$("editTitle").value.trim(),content=$("editContent").value.trim();
if(!p||!title||!content){$("editMsg").textContent="Enter title and prayer.";return}
await api("/prayer/"+editId,{method:"PUT",body:JSON.stringify({
year:new Date().getFullYear(),prayer_point:gp(p),title,content
})});
let keep=gp(p);cancelEdit();await load();show(keep);
}

function cancelEdit(){
editId=null;$("editBox").classList.add("hidden");$("editMsg").textContent="";
}

async function save(){
let title=$("newTitle").value.trim(),content=$("newContent").value.trim();
if(!title||!content){$("msg").textContent="Enter title and prayer.";return}
if(find()){$("msg").textContent=`Prayer Point ${selected} already exists.`;return}
await api("/prayer",{method:"POST",body:JSON.stringify({
year:new Date().getFullYear(),prayer_point:selected,title,content
})});
$("newTitle").value="";$("newContent").value="";$("msg").textContent="Saved.";
await load();show(selected);
}

async function toggle(id,value){
let p=prayers.find(x=>Number(x.id)===Number(id));if(!p)return;
await api("/complete",{method:"POST",body:JSON.stringify({
prayer_id:p.id,year:new Date().getFullYear(),prayer_point:gp(p),completed:value
})});
let keep=selected;await load();if(keep!==todayPoint)show(keep);
}

async function del(id){
if(!confirm("Delete this prayer point?"))return;
await api("/prayer/"+id,{method:"DELETE"});await load();
}

function render(){
let q=$("search").value.toLowerCase();
let a=[...prayers].sort((x,y)=>gp(x)-gp(y)).filter(p=>
!q||(String(gp(p)).includes(q)||(p.title||"").toLowerCase().includes(q))
);
$("list").innerHTML=a.length?a.map(p=>{
let done=Number(p.completed)===1,n=gp(p);
return`<div class="item">
<div class="itempoint">🙏 Prayer Point ${n}</div>
<div class="itemtitle">${safe(p.title)}</div>
<div class="small">${done?"✅ Completed":"⏳ Not completed"}</div>
<div class="actions">
<button class="outline" onclick="show(${n});scrollTo(0,0)">👆 Read Full Prayer</button>
<button class="blue" onclick="edit(${p.id})">✏️ Edit</button>
<button class="${done?"gray":"green"}" onclick="toggle(${p.id},${done?0:1})">${done?"↩️ Unmark":"✅ Mark Complete"}</button>
<button class="red" onclick="del(${p.id})">🗑 Delete</button>
</div></div>`
}).join(""):"<div class='small'>No prayer points found.</div>";
}

function safe(x){
return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

let s=new URLSearchParams(location.search).get("session");
if(s){sessionStorage.setItem("prayer_token",s);token=s;history.replaceState({},document.title,location.pathname)}
start();
</script>
</body>
</html>
