<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Prayer Points | CreateLK</title>
<meta name="theme-color" content="#102a56">
<meta name="description" content="100 Prayer Points - CreateLK">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033;
}
header{
 background:#102a56;
 color:#fff;
 padding:18px 15px;
 text-align:center;
}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;font-size:13px;opacity:.85}

main{
 max-width:700px;
 margin:auto;
 padding:15px;
}

.card{
 background:#fff;
 border-radius:16px;
 padding:16px;
 margin-bottom:15px;
 box-shadow:0 3px 15px #00000012;
}

.top{
 display:flex;
 gap:10px;
 align-items:center;
 justify-content:space-between;
 flex-wrap:wrap;
}

select,input,textarea{
 width:100%;
 padding:12px;
 border:1px solid #d8dce5;
 border-radius:10px;
 font-size:15px;
 outline:none;
}

textarea{
 min-height:150px;
 resize:vertical;
}

button{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 font-weight:bold;
 cursor:pointer;
}

.primary{background:#102a56;color:#fff}
.gold{background:#d69b16;color:#fff}
.gray{background:#e9edf3;color:#172033}
.red{background:#d92d20;color:#fff}
.green{background:#16803c;color:#fff}

.buttons{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}

.buttons button{flex:1;min-width:120px}

.progress{
 height:10px;
 background:#e5e7eb;
 border-radius:20px;
 overflow:hidden;
 margin-top:10px;
}

.progress div{
 height:100%;
 background:#16803c;
 width:0%;
 transition:.3s;
}

#message{
 margin-top:10px;
 font-size:14px;
 font-weight:bold;
}

.small{
 font-size:13px;
 color:#667085;
}

.point{
 color:#102a56;
 font-weight:bold;
 font-size:17px;
}

.completed{
 color:#16803c;
 font-weight:bold;
}

.hidden{display:none}

footer{
 text-align:center;
 padding:25px 10px;
 color:#667085;
 font-size:12px;
}
</style>
</head>

<body>

<header>
 <h1>🙏 100 Prayer Points</h1>
 <p>100 prayer points • Every year</p>
</header>

<main>

<div id="loginCard" class="card">
 <h2>🔐 Sign In</h2>
 <p class="small">
 Sign in with your authorized Google account to access your prayer points.
 </p>
 <button class="primary" onclick="login()">Continue with Google</button>
</div>

<div id="app" class="hidden">

<div class="card">
 <div class="top">
  <div>
   <strong>🙏 100 Prayer Points</strong>
   <div id="email" class="small"></div>
  </div>

  <button class="gray" onclick="logout()">🔒 Sign Out</button>
 </div>

 <hr>

 <div class="small" id="date"></div>

 <div style="margin-top:10px">
  <strong id="progressText">0 / 100 Prayer Points</strong>
  <div class="progress">
   <div id="progressBar"></div>
  </div>
  <div class="small" id="percent">0% Complete</div>
 </div>
</div>

<div class="card">
 <label><strong>🙏 Select Prayer Point</strong></label>

 <select id="pointSelect" onchange="selectPoint()"></select>

 <div style="margin-top:15px">
  <div class="point" id="pointTitle"></div>
  <div id="pointStatus" class="small" style="margin-top:6px"></div>
 </div>

 <div style="margin-top:15px">
  <div id="prayerContent"></div>
 </div>

 <div class="buttons">
  <button id="completeBtn" class="green" onclick="toggleComplete()">
   ✅ Mark Completed
  </button>

  <button class="gold" onclick="editSelected()">✏️ Edit</button>
 </div>

 <div id="message"></div>
</div>

<div class="card">
 <h3>➕ Add Prayer Point</h3>

 <label class="small">Prayer Point Number / Date</label>
 <input id="addDate" type="date">

 <label class="small">Title</label>
 <input id="addTitle" placeholder="Prayer for...">

 <label class="small">Prayer</label>
 <textarea id="addContent" placeholder="Write your prayer..."></textarea>

 <div class="buttons">
  <button class="primary" onclick="addPrayer()">➕ Add Prayer</button>
 </div>
</div>

<div id="editCard" class="card hidden">
 <h3>✏️ Edit Prayer Point</h3>

 <input id="editId" type="hidden">

 <label class="small">Date</label>
 <input id="editDate" type="date">

 <label class="small">Title</label>
 <input id="editTitle">

 <label class="small">Prayer</label>
 <textarea id="editContent"></textarea>

 <div class="buttons">
  <button class="primary" onclick="saveEdit()">💾 Save</button>
  <button class="gray" onclick="cancelEdit()">Cancel</button>
  <button class="red" onclick="deleteSelected()">🗑️ Delete</button>
 </div>
</div>

</div>
</main>

<footer>
CreateLK • 100 Prayer Points
</footer>

<script>
const API="https://prayer.createlk.workers.dev";
const LOGIN=API+"/login";

let prayers=[];
let selected=1;

function $(id){
 return document.getElementById(id);
}

function today(){
 const p=new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Colombo",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).formatToParts(new Date());

 const d={};

 p.forEach(x=>{
  if(x.type!=="literal")d[x.type]=x.value;
 });

 return `${d.year}-${d.month}-${d.day}`;
}

function auth(){
 return localStorage.getItem("prayer_session")||"";
}

function headers(){
 return {
  "Content-Type":"application/json",
  "Authorization":"Bearer "+auth()
 };
}

function login(){
 location.href=LOGIN;
}

function logout(){
 localStorage.removeItem("prayer_session");
 location.reload();
}

function getPrayer(n){
 return prayers[n-1]||null;
}

async function api(path,options={}){
 const r=await fetch(API+path,{
  ...options,
  headers:{
   ...headers(),
   ...(options.headers||{})
  }
 });

 let data={};

 try{
  data=await r.json();
 }catch{}

 if(r.status===401){
  localStorage.removeItem("prayer_session");
  location.reload();
  throw new Error("Unauthorized");
 }

 if(!r.ok||data.success===false)
  throw new Error(data.error||"Request failed");

 return data;
}

async function checkLogin(){
 const token=auth();

 if(!token){
  $("loginCard").classList.remove("hidden");
  return;
 }

 try{
  const data=await api("/me");

  if(!data.authenticated){
   localStorage.removeItem("prayer_session");
   $("loginCard").classList.remove("hidden");
   return;
  }

  $("loginCard").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("email").textContent=data.email;

  await loadPrayers();

 }catch(e){
  $("loginCard").classList.remove("hidden");
  $("app").classList.add("hidden");
 }
}

async function loadPrayers(){
 try{
  const data=await api("/prayers");

  prayers=data.prayers||[];

  $("date").textContent=
   new Date().toLocaleDateString("en-US",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric",
    timeZone:"Asia/Colombo"
   });

  buildSelector();
  updateProgress();

  if(prayers.length){
   selected=Math.min(selected,prayers.length);
   $("pointSelect").value=selected;
   showSelectedPoint();
  }

 }catch(e){
  showMessage(e.message,true);
 }
}

function buildSelector(){
 const s=$("pointSelect");

 s.innerHTML="";

 for(let i=1;i<=100;i++){
  const p=getPrayer(i);

  const o=document.createElement("option");
  o.value=i;
  o.textContent=
   "Prayer Point "+i+
   (p?.completed?" ✅":"");

  s.appendChild(o);
 }
}

function selectPoint(){
 selected=Number($("pointSelect").value)||1;
 showSelectedPoint();
}

function showSelectedPoint(){
 const p=getPrayer(selected);

 if(!p){
  $("pointTitle").textContent=
   "Prayer Point "+selected;

  $("prayerContent").textContent=
   "This prayer point has not been added yet.";

  $("pointStatus").textContent=
   "⏳ Not available";

  $("completeBtn").disabled=true;
  return;
 }

 $("completeBtn").disabled=false;

 $("pointTitle").textContent=
  "Prayer Point "+selected+
  " • "+p.title;

 $("prayerContent").textContent=p.content;

 if(Number(p.completed)===1){
  $("pointStatus").innerHTML=
   '<span class="completed">✅ Completed today</span>';

  $("completeBtn").textContent=
   "↩️ Unmark Completed";

  $("completeBtn").className="gray";
 }else{
  $("pointStatus").textContent=
   "⏳ Not completed";

  $("completeBtn").textContent=
   "✅ Mark Completed";

  $("completeBtn").className="green";
 }
}

function updateProgress(){
 const completed=prayers.filter(
  p=>Number(p.completed)===1
 ).length;

 const percent=Math.round(
  completed/100*100
 );

 $("progressText").textContent=
  `${completed} / 100 Prayer Points`;

 $("percent").textContent=
  `${percent}% Complete`;

 $("progressBar").style.width=
  percent+"%";

 buildSelector();
 $("pointSelect").value=selected;
}

async function toggleComplete(){
 const p=getPrayer(selected);

 if(!p)return;

 const currently=Number(p.completed)===1;

 try{

  const data=await api("/complete",{
   method:"POST",
   body:JSON.stringify({
    prayer_id:p.id,
    completed:!currently
   })
  });

  p.completed=data.completed?1:0;

  updateProgress();
  showSelectedPoint();

  if(!currently){

   if(selected<100){
    selected++;
    $("pointSelect").value=selected;
    showSelectedPoint();

    showMessage(
     "✅ Completed. Moving to Prayer Point "+selected+"."
    );
   }else{
    showMessage(
     "🎉 All 100 prayer points completed today!"
    );
   }

  }else{
   showMessage("↩️ Prayer point unmarked.");
  }

 }catch(e){
  showMessage(e.message,true);
 }
}

function editSelected(){
 const p=getPrayer(selected);

 if(!p){
  showMessage("Prayer point not found.",true);
  return;
 }

 $("editId").value=p.id;
 $("editDate").value=p.prayer_date||"";
 $("editTitle").value=p.title||"";
 $("editContent").value=p.content||"";

 $("editCard").classList.remove("hidden");

 window.scrollTo({
  top:$("editCard").offsetTop-10,
  behavior:"smooth"
 });
}

function cancelEdit(){
 $("editCard").classList.add("hidden");
}

async function saveEdit(){
 const id=$("editId").value;

 const body={
  prayer_date:$("editDate").value,
  title:$("editTitle").value.trim(),
  content:$("editContent").value.trim()
 };

 if(!body.prayer_date||!body.title||!body.content){
  showMessage("Please complete all fields.",true);
  return;
 }

 try{

  await api("/prayer/"+id,{
   method:"PUT",
   body:JSON.stringify(body)
  });

  showMessage("✅ Prayer point saved permanently.");

  $("editCard").classList.add("hidden");

  await loadPrayers();

 }catch(e){
  showMessage(e.message,true);
 }
}

async function addPrayer(){
 const body={
  prayer_date:$("addDate").value,
  title:$("addTitle").value.trim(),
  content:$("addContent").value.trim()
 };

 if(!body.prayer_date||!body.title||!body.content){
  showMessage("Please complete all fields.",true);
  return;
 }

 try{

  await api("/prayer",{
   method:"POST",
   body:JSON.stringify(body)
  });

  $("addDate").value="";
  $("addTitle").value="";
  $("addContent").value="";

  showMessage("✅ Prayer point added permanently.");

  await loadPrayers();

 }catch(e){
  showMessage(e.message,true);
 }
}

async function deleteSelected(){
 const id=$("editId").value;

 if(!id)return;

 if(!confirm(
  "Delete this prayer point permanently?"
 ))return;

 try{

  await api("/prayer/"+id,{
   method:"DELETE"
  });

  $("editCard").classList.add("hidden");

  showMessage("🗑️ Prayer point deleted.");

  await loadPrayers();

 }catch(e){
  showMessage(e.message,true);
 }
}

function showMessage(message,error=false){
 const el=$("message");

 el.textContent=message;
 el.style.color=error?"#d92d20":"#16803c";

 clearTimeout(window.msgTimer);

 window.msgTimer=setTimeout(()=>{
  el.textContent="";
 },4000);
}

(function(){
 const params=new URLSearchParams(location.search);
 const session=params.get("session");

 if(session){
  localStorage.setItem(
   "prayer_session",
   session
  );

  history.replaceState(
   {},
   document.title,
   location.pathname
  );
 }

 checkLogin();
})();
</script>

</body>
</html>
