<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Prayer Points</title>
<meta name="theme-color" content="#1e3a8a">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}
header{background:#1e3a8a;color:#fff;text-align:center;padding:18px}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:13px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
input,textarea,button,select{width:100%;padding:11px;margin:5px 0;border-radius:8px;font:inherit}
input,textarea,select{border:1px solid #cbd5e1}
textarea{min-height:150px}
button{border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.blue{background:#1e3a8a;color:#fff}.green{background:#15803d;color:#fff}
.red{background:#dc2626;color:#fff}.gray{background:#e2e8f0}
.google{background:#fff;border:1px solid #cbd5e1}
.hidden{display:none}
.progressText{text-align:center;font-size:20px;font-weight:bold}
.progress{height:16px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:10px 0}
.progressBar{height:100%;width:0;background:#15803d}
.percent{text-align:center;color:#64748b;font-size:13px}
.today{text-align:center;background:#eff6ff;border-radius:10px;padding:15px}
.number{font-size:34px;font-weight:bold;margin:3px}
.point{text-align:center;font-size:20px;font-weight:bold;color:#1e3a8a;margin:12px}
.status{text-align:center;padding:10px;border-radius:8px;margin:10px 0;font-weight:bold}
.done{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}
.content{white-space:pre-wrap;line-height:1.7}
.user{text-align:center;color:#64748b;font-size:13px}
.msg{padding:10px;border-radius:8px;margin-top:8px}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.item{border:1px solid #e2e8f0;border-radius:8px;padding:11px;margin:7px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.empty{text-align:center;color:#64748b;padding:15px}
@media(max-width:500px){.actions{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>🙏 100 Prayer Points</h1>
<p>100 prayer points • Every year</p>
</header>

<main>

<div id="login" class="card">
<h3>🔐 Private Prayer</h3>
<p>Sign in with your authorized Google account.</p>
<button class="google" onclick="login()">🔐 Sign in with Google</button>
<div id="loginMsg"></div>
</div>

<div id="app" class="hidden">

<div class="card">
<div class="progressText">
<span id="count">0</span> / 100 Prayer Points
</div>
<div class="progress"><div id="bar" class="progressBar"></div></div>
<div id="percent" class="percent">0% Complete</div>
<div class="user" id="user"></div>
<button class="gray" onclick="logout()">🔒 Sign Out</button>
</div>

<div class="card">

<div class="today">
<div id="weekday">Today</div>
<div id="date" class="number"></div>
<div id="month"></div>
</div>

<div id="point" class="point">Prayer Point 1 of 100</div>

<div id="status" class="status pending">⏳ Not completed</div>

<div id="prayer">
<h2>No prayer point</h2>
<div class="content">Add this prayer point below.</div>
</div>

<button id="complete" class="green" onclick="markToday()" disabled>
✅ Mark as Completed
</button>

</div>

<div class="card">
<h3 id="formTitle">➕ Prayer Point</h3>

<select id="pointSelect"></select>

<input id="title" placeholder="Prayer title">

<textarea id="content" placeholder="Write prayer..."></textarea>

<button id="save" class="blue" onclick="save()">💾 Save</button>
<button id="cancel" class="gray hidden" onclick="cancelEdit()">Cancel</button>

<div id="msg"></div>
</div>

<div class="card">
<h3>📖 My 100 Prayer Points</h3>
<input id="search" placeholder="Search..." oninput="render()">
<div id="list"></div>
</div>

</div>
</main>

<script>

const API="https://prayer.createlk.workers.dev";
const MAX=100;
let token=sessionStorage.getItem("prayer_token")||"";
let prayers=[];
let editId=null;

const $=id=>document.getElementById(id);

function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* Same 100 points repeat every year.
   Jan 1 = Point 1, then 1–100 repeats. */
function pointFor(date){
 const d=new Date(date+"T12:00:00");
 const y=d.getFullYear();
 const start=new Date(y,0,1,12);
 const n=Math.floor((d-start)/86400000)+1;
 return ((n-1)%MAX)+1;
}

function login(){
 location.href=API+"/login";
}

async function api(path,opt={}){
 opt.headers={
  ...(opt.headers||{}),
  Authorization:"Bearer "+token,
  "Content-Type":"application/json"
 };
 const r=await fetch(API+path,opt);
 let d={};try{d=await r.json()}catch{}
 if(!r.ok){
  if(r.status===401)logout();
  throw Error(d.error||"Request failed");
 }
 return d;
}

async function start(){
 if(!token)return;

 try{
  const me=await api("/me");
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("user").textContent=me.email||"";
  setupPoints();
  await load();
 }catch(e){
  $("loginMsg").innerHTML='<div class="msg err">'+safe(e.message)+'</div>';
 }
}

function setupPoints(){
 $("pointSelect").innerHTML=
  Array.from({length:MAX},(_,i)=>
   `<option value="${i+1}">Prayer Point ${i+1}</option>`
  ).join("");
}

async function load(){

 const year=new Date().getFullYear();

 const d=await api("/prayers?year="+year);

 prayers=d.prayers||[];

 progress();
 render();
 showToday();
}

function progress(){

 const done=prayers.filter(
  p=>Number(p.completed)===1
 ).length;

 const pct=Math.round(done/MAX*100);

 $("count").textContent=done;
 $("percent").textContent=pct+"% Complete";
 $("bar").style.width=pct+"%";

 if(done===100)
  $("percent").textContent="🎉 100 / 100 Complete";
}

async function showToday(){

 const date=today();
 const point=pointFor(date);
 const d=new Date(date+"T12:00:00");

 const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 const months=["January","February","March","April","May","June","July","August","September","October","November","December"];

 $("weekday").textContent=days[d.getDay()];
 $("date").textContent=d.getDate();
 $("month").textContent=months[d.getMonth()]+" "+d.getFullYear();
 $("point").textContent="Prayer Point "+point+" of 100";
 $("pointSelect").value=point;

 try{

  const data=await api("/today?date="+encodeURIComponent(date));
  const p=data.prayer;

  if(!p){
   $("prayer").innerHTML=
    `<h2>Prayer Point ${point}</h2>
     <div class="content">No prayer has been added yet.</div>`;
   $("status").className="status pending";
   $("status").textContent="⏳ Not completed";
   $("complete").disabled=true;
   return;
  }

  $("prayer").innerHTML=
   `<h2>${safe(p.title)}</h2>
    <div class="content">${safe(p.content)}</div>`;

  $("complete").disabled=false;

  if(Number(p.completed)===1){
   $("status").className="status done";
   $("status").textContent="✅ Completed";
   $("complete").textContent="↩️ Mark as Not Completed";
  }else{
   $("status").className="status pending";
   $("status").textContent="⏳ Not completed";
   $("complete").textContent="✅ Mark as Completed";
  }

 }catch(e){
  $("prayer").innerHTML=
   '<div class="msg err">'+safe(e.message)+'</div>';
 }
}

async function markToday(){

 const point=pointFor(today());

 const p=prayers.find(
  x=>Number(x.prayer_point)===point
 );

 if(!p)return;

 const value=$("complete").textContent.includes("Not Completed")?0:1;

 try{
  await api("/complete",{
   method:"POST",
   body:JSON.stringify({
    prayer_id:p.id,
    year:new Date().getFullYear(),
    prayer_point:point,
    completed:value
   })
  });

  await load();

 }catch(e){
  message("msg",e.message,"err");
 }
}

async function save(){

 const point=Number($("pointSelect").value);
 const title=$("title").value.trim();
 const content=$("content").value.trim();

 if(!title||!content){
  message("msg","Please enter a title and prayer.","err");
  return;
 }

 const existing=editId
  ? prayers.find(p=>Number(p.id)===editId)
  : prayers.find(p=>Number(p.prayer_point)===point);

 const btn=$("save");
 btn.disabled=true;
 btn.textContent="Saving...";

 try{

  const body={
   year:new Date().getFullYear(),
   prayer_point:point,
   title,
   content
  };

  const result=await api(
   existing?"/prayer/"+existing.id:"/prayer",
   {
    method:existing?"PUT":"POST",
    body:JSON.stringify(body)
   }
  );

  if(!result.success)
   throw Error(result.error||"Save failed");

  editId=null;
  $("title").value="";
  $("content").value="";
  $("cancel").classList.add("hidden");
  $("formTitle").textContent="➕ Prayer Point";

  message("msg","✅ Saved to Cloudflare.","ok");

  await load();

 }catch(e){
  message("msg","❌ "+e.message,"err");
 }finally{
  btn.disabled=false;
  btn.textContent="💾 Save";
 }
}

function edit(id){

 const p=prayers.find(x=>Number(x.id)===Number(id));
 if(!p)return;

 editId=Number(id);

 $("pointSelect").value=p.prayer_point;
 $("title").value=p.title||"";
 $("content").value=p.content||"";
 $("formTitle").textContent=
  "✏️ Edit Prayer Point "+p.prayer_point;
 $("cancel").classList.remove("hidden");

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });
}

function cancelEdit(){

 editId=null;
 $("title").value="";
 $("content").value="";
 $("cancel").classList.add("hidden");
 $("formTitle").textContent="➕ Prayer Point";
}

async function toggle(id,value){

 const p=prayers.find(x=>Number(x.id)===Number(id));
 if(!p)return;

 try{

  await api("/complete",{
   method:"POST",
   body:JSON.stringify({
    prayer_id:p.id,
    year:p.year,
    prayer_point:p.prayer_point,
    completed:value
   })
  });

  await load();

 }catch(e){
  message("msg",e.message,"err");
 }
}

async function del(id){

 if(!confirm("Delete this prayer point?"))return;

 try{
  await api("/prayer/"+id,{method:"DELETE"});
  await load();
 }catch(e){
  message("msg",e.message,"err");
 }
}

function render(){

 const q=$("search").value.toLowerCase().trim();

 const items=prayers
  .filter(p=>
   !q||
   String(p.prayer_point).includes(q)||
   String(p.title).toLowerCase().includes(q)||
   String(p.content).toLowerCase().includes(q)
  )
  .sort((a,b)=>
   Number(a.prayer_point)-Number(b.prayer_point)
  );

 if(!items.length){
  $("list").innerHTML=
   '<div class="empty">No prayer points found.</div>';
  return;
 }

 $("list").innerHTML=items.map(p=>{

  const done=Number(p.completed)===1;

  return `
  <div class="item">
   <b>Prayer Point ${p.prayer_point}</b><br>
   <strong>${safe(p.title)}</strong><br>
   <small>${done?"✅ Completed":"⏳ Not completed"}</small>

   <div class="actions">
    <button class="blue"
     onclick="edit(${p.id})">✏️ Edit</button>

    <button class="${done?"gray":"green"}"
     onclick="toggle(${p.id},${done?0:1})">
     ${done?"↩️ Unmark":"✅ Mark Complete"}
    </button>
   </div>

   <button class="red"
    onclick="del(${p.id})">🗑 Delete</button>
  </div>`;
 }).join("");
}

function message(id,text,type){
 $(id).innerHTML=
  `<div class="msg ${type}">${safe(text)}</div>`;
}

function safe(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function logout(){
 token="";
 sessionStorage.removeItem("prayer_token");
 location.href=location.pathname;
}

const session=
 new URLSearchParams(location.search).get("session");

if(session){
 token=session;
 sessionStorage.setItem("prayer_token",token);
 history.replaceState({},document.title,location.pathname);
}

start();

</script>
</body>
</html>
