<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Day Prayer Journey</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#1e293b
}

header{
 background:#1e3a8a;
 color:white;
 text-align:center;
 padding:18px
}

header h1{
 margin:0;
 font-size:23px
}

header p{
 margin:5px 0 0;
 font-size:13px
}

main{
 max-width:700px;
 margin:auto;
 padding:15px
}

.card{
 background:white;
 padding:16px;
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 2px 10px #0001
}

input,textarea,button{
 width:100%;
 font:inherit;
 padding:11px;
 margin:5px 0;
 border-radius:8px
}

input,textarea{
 border:1px solid #cbd5e1
}

textarea{
 min-height:140px;
 resize:vertical
}

button{
 border:0;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.5;
 cursor:not-allowed
}

.blue{background:#1e3a8a;color:white}
.green{background:#15803d;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e2e8f0;color:#1e293b}
.google{background:white;color:#222;border:1px solid #cbd5e1}

.hidden{display:none}

.progress{
 background:#e2e8f0;
 height:16px;
 border-radius:20px;
 overflow:hidden;
 margin:10px 0
}

.progressBar{
 height:100%;
 width:0;
 background:#15803d;
 transition:.3s
}

.progressText{
 text-align:center;
 font-weight:bold;
 font-size:18px
}

.date{
 text-align:center;
 background:#eff6ff;
 padding:12px;
 border-radius:9px
}

.date b{
 display:block;
 font-size:24px;
 margin:3px 0
}

.prayer h2{
 margin-bottom:8px
}

.content{
 white-space:pre-wrap;
 line-height:1.7
}

.status{
 text-align:center;
 padding:9px;
 border-radius:8px;
 margin:10px 0;
 font-weight:bold
}

.done{
 background:#dcfce7;
 color:#166534
}

.pending{
 background:#fef3c7;
 color:#92400e
}

.nav{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:6px
}

.item{
 border:1px solid #e2e8f0;
 border-radius:8px;
 padding:10px;
 margin:7px 0
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px
}

.msg{
 padding:10px;
 border-radius:8px;
 margin:8px 0
}

.ok{
 background:#dcfce7;
 color:#166534
}

.err{
 background:#fee2e2;
 color:#991b1b
}

.user{
 text-align:center;
 color:#64748b;
 font-size:13px;
 margin:7px
}

.empty{
 text-align:center;
 color:#64748b;
 padding:15px
}

@media(max-width:500px){
 .nav{grid-template-columns:1fr}
 .actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>🙏 100 Day Prayer Journey</h1>
<p>One day • One prayer • One step closer to God</p>
</header>

<main>

<div id="login" class="card">
<h3>🔐 Private Prayer</h3>
<p>Sign in with your authorized Google account.</p>

<button class="google" onclick="googleLogin()">
🔐 Sign in with Google
</button>

<div id="loginMsg"></div>
</div>

<div id="app" class="hidden">

<!-- PROGRESS -->

<div class="card">

<div class="progressText">
<span id="completedCount">0</span> / 100 Days
</div>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="progressPercent" style="text-align:center">
0% Complete
</div>

<div id="user" class="user"></div>

<button class="gray" onclick="logout()">
🔒 Sign Out
</button>

</div>

<!-- DAY -->

<div class="card">

<div class="date">
<span id="day"></span>
<b id="date"></b>
<span id="month"></span>
</div>

<div id="dayNumber"
style="text-align:center;font-weight:bold;margin:10px">
Day 1 of 100
</div>

<div id="status" class="status pending">
⏳ Not completed
</div>

<div id="prayer" class="prayer">
<h2>No prayer</h2>
<div class="content">
No prayer has been added for this day.
</div>
</div>

<button
id="complete"
class="green"
onclick="completePrayer()"
disabled>
✅ Mark as Completed
</button>

<div class="nav">

<button class="gray" onclick="moveDate(-1)">
◀ Yesterday
</button>

<button class="blue" onclick="goToday()">
Today
</button>

<button class="gray" onclick="moveDate(1)">
Tomorrow ▶
</button>

</div>

</div>

<!-- ADD -->

<div class="card">

<h3 id="formTitle">➕ Add Prayer</h3>

<input id="pdate" type="date">

<input
id="title"
placeholder="Prayer title">

<textarea
id="content"
placeholder="Write your prayer..."></textarea>

<button
id="saveButton"
class="blue"
onclick="savePrayer()">
💾 Save Prayer
</button>

<button
id="cancel"
class="gray hidden"
onclick="cancelEdit()">
Cancel
</button>

<div id="msg"></div>

</div>

<!-- LIST -->

<div class="card">

<h3>📖 My 100 Prayers</h3>

<input
id="search"
placeholder="Search..."
oninput="renderList()">

<div id="list"></div>

</div>

</div>

</main>

<script>

const API=
"https://prayer.createlk.workers.dev";

const MAX=100;

let token=
sessionStorage.getItem("prayer_token")||"";

let prayers=[];

let selected=
localStorage.getItem("prayer_date")||
localDate();

let editId=null;

const $=id=>
document.getElementById(id);


/* DATE */

function localDate(){

 const d=new Date();

 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}


/* LOGIN */

function googleLogin(){

 location.href=API+"/login";

}


/* API */

async function api(path,opt={}){

 opt.headers={
  ...(opt.headers||{}),
  Authorization:"Bearer "+token,
  "Content-Type":"application/json"
 };

 const r=
  await fetch(API+path,opt);

 let d={};

 try{
  d=await r.json();
 }catch{}

 if(!r.ok){

  if(r.status===401){
   logout();
  }

  throw new Error(
   d.error||"Request failed"
  );
 }

 return d;
}


/* START */

async function start(){

 if(!token)return;

 try{

  const me=
   await api("/me");

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("user").textContent=
   me.email||"";

  await load();

 }catch(e){

  token="";

  sessionStorage.removeItem(
   "prayer_token"
  );

  $("loginMsg").innerHTML=
   '<div class="msg err">'+
   safe(e.message)+
   "</div>";
 }
}


/* LOAD */

async function load(){

 const data=
  await api("/prayers");

 prayers=data.prayers||[];

 updateProgress();

 renderList();

 await showPrayer();

}


/* PROGRESS */

function updateProgress(){

 const completed=
  prayers.filter(
   p=>Number(p.completed)===1
  ).length;

 const percent=
  Math.round(
   completed/MAX*100
  );

 $("completedCount").textContent=
  completed;

 $("progressPercent").textContent=
  percent+"% Complete";

 $("progressBar").style.width=
  percent+"%";

}


/* SHOW DAY */

async function showPrayer(){

 $("pdate").value=
  selected;

 const d=
  new Date(selected+"T12:00:00");

 const days=[
  "Sunday","Monday","Tuesday",
  "Wednesday","Thursday",
  "Friday","Saturday"
 ];

 const months=[
  "January","February","March",
  "April","May","June",
  "July","August","September",
  "October","November","December"
 ];

 $("day").textContent=
  days[d.getDay()];

 $("date").textContent=
  d.getDate();

 $("month").textContent=
  months[d.getMonth()]+" "+d.getFullYear();

 const sorted=
  [...prayers].sort(
   (a,b)=>
    a.prayer_date.localeCompare(
     b.prayer_date
    )
  );

 const index=
  sorted.findIndex(
   p=>p.prayer_date===selected
  );

 $("dayNumber").textContent=
  index>=0
   ?"Day "+(index+1)+" of 100"
   :"No prayer scheduled";

 try{

  const data=
   await api(
    "/today?date="+
    encodeURIComponent(selected)
   );

  const p=data.prayer;

  if(!p){

   $("prayer").innerHTML=
    "<h2>No prayer</h2>"+
    '<div class="content">'+
    "No prayer has been added for this day."+
    "</div>";

   $("status").className=
    "status pending";

   $("status").textContent=
    "⏳ Not completed";

   $("complete").disabled=true;

   $("complete").textContent=
    "✅ Mark as Completed";

   return;
  }

  $("prayer").innerHTML=
   "<h2>"+safe(p.title)+"</h2>"+
   '<div class="content">'+
   safe(p.content)+
   "</div>";

  $("complete").disabled=false;

  if(Number(p.completed)===1){

   $("status").className=
    "status done";

   $("status").textContent=
    "✅ Completed";

   $("complete").textContent=
    "↩️ Mark as Not Completed";

  }else{

   $("status").className=
    "status pending";

   $("status").textContent=
    "⏳ Not completed";

   $("complete").textContent=
    "✅ Mark as Completed";
  }

 }catch(e){

  $("prayer").innerHTML=
   '<div class="msg err">'+
   safe(e.message)+
   "</div>";
 }
}


/* YESTERDAY / TOMORROW */

function moveDate(n){

 const d=
  new Date(selected+"T12:00:00");

 d.setDate(
  d.getDate()+n
 );

 selected=
  d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

 localStorage.setItem(
  "prayer_date",
  selected
 );

 showPrayer();

}


/* TODAY */

function goToday(){

 selected=localDate();

 localStorage.setItem(
  "prayer_date",
  selected
 );

 showPrayer();

}


/* COMPLETE */

async function completePrayer(){

 const p=
  prayers.find(
   x=>x.prayer_date===selected
  );

 if(!p)return;

 const completed=
  $("complete").textContent.includes(
   "Not Completed"
  )?0:1;

 try{

  await api(
   "/complete",
   {
    method:"POST",
    body:JSON.stringify({
     prayer_id:p.id,
     date:selected,
     completed
    })
   }
  );

  await load();

 }catch(e){

  message(
   "msg",
   e.message,
   "err"
  );
 }
}


/* SAVE */

async function savePrayer(){

 const date=
  $("pdate").value;

 const title=
  $("title").value.trim();

 const content=
  $("content").value.trim();

 if(!date||!title||!content){

  message(
   "msg",
   "Please enter the date, title and prayer.",
   "err"
  );

  return;
 }

 if(
  !editId &&
  prayers.length>=MAX
 ){

  message(
   "msg",
   "100 prayer days already reached.",
   "err"
  );

  return;
 }

 const button=
  $("saveButton");

 button.disabled=true;
 button.textContent=
  "Saving...";

 try{

  let result;

  if(editId){

   result=
    await api(
     "/prayer/"+editId,
     {
      method:"PUT",
      body:JSON.stringify({
       prayer_date:date,
       title:title,
       content:content
      })
     }
    );

  }else{

   result=
    await api(
     "/prayer",
     {
      method:"POST",
      body:JSON.stringify({
       prayer_date:date,
       title:title,
       content:content
      })
     }
    );
  }

  if(!result.success){
   throw new Error(
    result.error||"Save failed"
   );
  }

  selected=date;

  localStorage.setItem(
   "prayer_date",
   selected
  );

  editId=null;

  $("formTitle").textContent=
   "➕ Add Prayer";

  $("title").value="";
  $("content").value="";

  $("cancel").classList.add(
   "hidden"
  );

  message(
   "msg",
   "✅ Prayer saved successfully.",
   "ok"
  );

  await load();

 }catch(e){

  message(
   "msg",
   "❌ "+e.message,
   "err"
  );

 }finally{

  button.disabled=false;

  button.textContent=
   "💾 Save Prayer";
 }
}


/* EDIT */

function editPrayer(id){

 const p=
  prayers.find(
   x=>Number(x.id)===Number(id)
  );

 if(!p)return;

 editId=Number(id);

 $("formTitle").textContent=
  "✏️ Edit Prayer";

 $("pdate").value=
  p.prayer_date;

 $("title").value=
  p.title;

 $("content").value=
  p.content;

 $("cancel").classList.remove(
  "hidden"
 );

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });

}


/* CANCEL */

function cancelEdit(){

 editId=null;

 $("formTitle").textContent=
  "➕ Add Prayer";

 $("pdate").value=
  selected;

 $("title").value="";
 $("content").value="";

 $("cancel").classList.add(
  "hidden"
 );
}


/* DELETE */

async function deletePrayer(id){

 if(!confirm(
  "Delete this prayer?"
 ))return;

 try{

  await api(
   "/prayer/"+id,
   {method:"DELETE"}
  );

  await load();

 }catch(e){

  message(
   "msg",
   e.message,
   "err"
  );
 }
}


/* LIST */

function renderList(){

 const q=
  $("search").value
   .trim()
   .toLowerCase();

 const items=
  prayers.filter(p=>
   !q||
   p.title.toLowerCase().includes(q)||
   p.content.toLowerCase().includes(q)||
   p.prayer_date.includes(q)
  );

 if(!items.length){

  $("list").innerHTML=
   '<div class="empty">'+
   "No prayers found."+
   "</div>";

  return;
 }

 const sorted=
  [...items].sort(
   (a,b)=>
    a.prayer_date.localeCompare(
     b.prayer_date
    )
  );

 $("list").innerHTML=
  sorted.map((p,i)=>`

   <div class="item">

    <b>Day ${i+1} — ${safe(p.title)}</b>
    <br>

    <small>${safe(p.prayer_date)}</small>

    <div class="actions">

     <button
      class="blue"
      onclick="openPrayer('${safeAttr(p.prayer_date)}')">
      📖 Open
     </button>

     <button
      class="gray"
      onclick="editPrayer(${Number(p.id)})">
      ✏️ Edit
     </button>

    </div>

    <button
     class="red"
     onclick="deletePrayer(${Number(p.id)})">
     🗑 Delete
    </button>

   </div>

  `).join("");
}


/* OPEN */

function openPrayer(date){

 selected=date;

 localStorage.setItem(
  "prayer_date",
  selected
 );

 showPrayer();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}


/* LOGOUT */

function logout(){

 token="";

 sessionStorage.removeItem(
  "prayer_token"
 );

 location.href=
  location.pathname;
}


/* MESSAGE */

function message(id,text,type){

 $(id).innerHTML=
  '<div class="msg '+type+'">'+
  safe(text)+
  "</div>";
}


/* SAFE */

function safe(v){

 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function safeAttr(v){

 return String(v??"")
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");
}


/* GOOGLE CALLBACK */

const params=
 new URLSearchParams(
  location.search
 );

const session=
 params.get("session");

if(session){

 token=session;

 sessionStorage.setItem(
  "prayer_token",
  token
 );

 history.replaceState(
  {},
  document.title,
  location.pathname
 );
}


/* DATE CHANGE */

$("pdate").addEventListener(
 "change",
 function(){

  selected=this.value;

  localStorage.setItem(
   "prayer_date",
   selected
  );

  showPrayer();
 }
);


/* START */

start();

</script>

</body>
</html>
