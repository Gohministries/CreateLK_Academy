<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>100 Day Prayer Journey</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,sans-serif
}

header{
 background:#1e3a8a;
 color:white;
 text-align:center;
 padding:18px
}

header h1{
 margin:0;
 font-size:23px
}

header p{
 margin:6px 0 0;
 font-size:13px
}

main{
 max-width:700px;
 margin:auto;
 padding:15px
}

.card{
 background:white;
 padding:16px;
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 2px 10px #0001
}

input,
textarea,
button{
 width:100%;
 padding:11px;
 margin:5px 0;
 border-radius:8px;
 font:inherit
}

input,
textarea{
 border:1px solid #cbd5e1
}

textarea{
 min-height:150px;
 resize:vertical
}

button{
 border:0;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.5;
 cursor:not-allowed
}

.blue{
 background:#1e3a8a;
 color:white
}

.green{
 background:#15803d;
 color:white
}

.red{
 background:#dc2626;
 color:white
}

.gray{
 background:#e2e8f0;
 color:#1e293b
}

.google{
 background:white;
 color:#222;
 border:1px solid #cbd5e1
}

.hidden{
 display:none
}

.progressText{
 text-align:center;
 font-size:20px;
 font-weight:bold
}

.progress{
 width:100%;
 height:16px;
 background:#e2e8f0;
 border-radius:20px;
 overflow:hidden;
 margin:10px 0
}

.progressBar{
 height:100%;
 width:0;
 background:#15803d;
 transition:.3s
}

.percent{
 text-align:center;
 font-size:13px;
 color:#64748b
}

.today{
 text-align:center;
 background:#eff6ff;
 border-radius:10px;
 padding:15px;
 margin-bottom:12px
}

.today .weekday{
 font-size:15px;
 color:#475569
}

.today .number{
 font-size:34px;
 font-weight:bold;
 margin:3px 0
}

.today .month{
 font-weight:bold;
 color:#334155
}

.dayNumber{
 text-align:center;
 font-weight:bold;
 margin:12px 0
}

.status{
 text-align:center;
 padding:10px;
 border-radius:8px;
 margin:10px 0;
 font-weight:bold
}

.done{
 background:#dcfce7;
 color:#166534
}

.pending{
 background:#fef3c7;
 color:#92400e
}

.prayer h2{
 margin-top:0
}

.content{
 white-space:pre-wrap;
 line-height:1.7
}

.user{
 text-align:center;
 color:#64748b;
 font-size:13px;
 margin:8px
}

.msg{
 padding:10px;
 border-radius:8px;
 margin-top:8px
}

.ok{
 background:#dcfce7;
 color:#166534
}

.err{
 background:#fee2e2;
 color:#991b1b
}

.item{
 border:1px solid #e2e8f0;
 border-radius:8px;
 padding:11px;
 margin:7px 0
}

.item small{
 color:#64748b
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-top:6px
}

.empty{
 text-align:center;
 color:#64748b;
 padding:15px
}

@media(max-width:500px){
 .actions{
  grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<header>
<h1>🙏 100 Day Prayer Journey</h1>
<p>One day • One prayer • One step</p>
</header>

<main>

<!-- LOGIN -->

<div id="login" class="card">

<h3>🔐 Private Prayer</h3>

<p>
Sign in with your authorized Google account.
</p>

<button
class="google"
onclick="googleLogin()">
🔐 Sign in with Google
</button>

<div id="loginMsg"></div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<!-- PROGRESS -->

<div class="card">

<div class="progressText">
<span id="completedCount">0</span> / 100 Days
</div>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="progressPercent" class="percent">
0% Complete
</div>

<div id="user" class="user"></div>

<button
class="gray"
onclick="logout()">
🔒 Sign Out
</button>

</div>


<!-- TODAY -->

<div class="card">

<div class="today">

<div id="weekday" class="weekday">
Today
</div>

<div id="dayNumberDate" class="number">
22
</div>

<div id="monthYear" class="month">
September 2026
</div>

</div>

<div id="journeyDay" class="dayNumber">
Day 1 of 100
</div>

<div id="status" class="status pending">
⏳ Not completed
</div>

<div id="prayer" class="prayer">

<h2>No prayer for today</h2>

<div class="content">
Add today's prayer below.
</div>

</div>

<button
id="complete"
class="green"
onclick="completePrayer()"
disabled>
✅ Mark as Completed
</button>

</div>


<!-- ADD / EDIT TODAY -->

<div class="card">

<h3 id="formTitle">
➕ Today's Prayer
</h3>

<input
id="pdate"
type="date"
readonly>

<input
id="title"
placeholder="Prayer title">

<textarea
id="content"
placeholder="Write today's prayer..."></textarea>

<button
id="saveButton"
class="blue"
onclick="savePrayer()">
💾 Save Prayer
</button>

<button
id="cancelButton"
class="gray hidden"
onclick="cancelEdit()">
Cancel
</button>

<div id="msg"></div>

</div>


<!-- PRAYER LIST -->

<div class="card">

<h3>📖 My 100 Prayers</h3>

<input
id="search"
placeholder="Search prayers..."
oninput="renderList()">

<div id="list"></div>

</div>

</div>

</main>


<script>

const API=
"https://prayer.createlk.workers.dev";

const MAX_DAYS=100;

let token=
sessionStorage.getItem("prayer_token")||"";

let prayers=[];

let selected=
localDate();

let editId=null;


/* SHORTCUT */

const $=id=>
document.getElementById(id);


/* CURRENT LOCAL DATE */

function localDate(){

 const d=new Date();

 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");

}


/* GOOGLE LOGIN */

function googleLogin(){

 location.href=
 API+"/login";

}


/* API REQUEST */

async function api(path,options={}){

 options.headers={
  ...(options.headers||{}),
  Authorization:
   "Bearer "+token,
  "Content-Type":
   "application/json"
 };

 const response=
  await fetch(API+path,options);

 let data={};

 try{
  data=await response.json();
 }catch{}

 if(!response.ok){

  if(response.status===401){
   logout();
  }

  throw new Error(
   data.error||"Request failed"
  );
 }

 return data;

}


/* START */

async function start(){

 if(!token){
  return;
 }

 try{

  const me=
   await api("/me");

  $("login").classList.add(
   "hidden"
  );

  $("app").classList.remove(
   "hidden"
  );

  $("user").textContent=
   me.email||"";

  selected=
   localDate();

  $("pdate").value=
   selected;

  showTodayDate();

  await load();

 }catch(error){

  token="";

  sessionStorage.removeItem(
   "prayer_token"
  );

  $("loginMsg").innerHTML=
   '<div class="msg err">'+
   safe(error.message)+
   "</div>";
 }

}


/* TODAY DISPLAY */

function showTodayDate(){

 const d=
  new Date(
   selected+"T12:00:00"
  );

 const weekdays=[
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
 ];

 const months=[
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
 ];

 $("weekday").textContent=
  weekdays[d.getDay()];

 $("dayNumberDate").textContent=
  d.getDate();

 $("monthYear").textContent=
  months[d.getMonth()]+" "+
  d.getFullYear();

}


/* LOAD */

async function load(){

 /*
  Always use today's date.
 */
 selected=
  localDate();

 $("pdate").value=
  selected;

 showTodayDate();

 const data=
  await api("/prayers");

 prayers=
  data.prayers||[];

 updateProgress();

 renderList();

 await showToday();

}


/* PROGRESS */

function updateProgress(){

 const completed=
  prayers.filter(
   p=>Number(p.completed)===1
  ).length;

 const percent=
  Math.min(
   100,
   Math.round(
    completed/MAX_DAYS*100
   )
  );

 $("completedCount").textContent=
  completed;

 $("progressPercent").textContent=
  percent+"% Complete";

 $("progressBar").style.width=
  percent+"%";

 if(completed>=100){

  $("progressPercent").textContent=
   "🎉 100 / 100 — Journey Complete";

  $("progressBar").style.width=
   "100%";
 }

}


/* TODAY'S PRAYER */

async function showToday(){

 selected=
  localDate();

 $("pdate").value=
  selected;

 showTodayDate();

 try{

  const data=
   await api(
    "/today?date="+
    encodeURIComponent(selected)
   );

  const p=
   data.prayer;

  /*
   Calculate journey day from
   the first prayer date.
  */

  if(prayers.length){

   const sorted=
    [...prayers].sort(
     (a,b)=>
      a.prayer_date.localeCompare(
       b.prayer_date
      )
    );

   const firstDate=
    new Date(
     sorted[0].prayer_date+
     "T12:00:00"
    );

   const todayDate=
    new Date(
     selected+"T12:00:00"
    );

   const difference=
    Math.floor(
     (todayDate-firstDate)/
     86400000
    );

   const day=
    difference+1;

   if(day>=1&&day<=100){

    $("journeyDay").textContent=
     "Day "+day+" of 100";

   }else{

    $("journeyDay").textContent=
     "100 Day Prayer Journey";

   }

  }else{

   $("journeyDay").textContent=
    "Day 1 of 100";

  }


  if(!p){

   $("prayer").innerHTML=
    "<h2>No prayer for today</h2>"+
    '<div class="content">'+
    "Add today's prayer below."+
    "</div>";

   $("status").className=
    "status pending";

   $("status").textContent=
    "⏳ Not completed";

   $("complete").disabled=
    true;

   $("complete").textContent=
    "✅ Mark as Completed";

   return;
  }


  $("prayer").innerHTML=
   "<h2>"+
   safe(p.title)+
   "</h2>"+
   '<div class="content">'+
   safe(p.content)+
   "</div>";

  $("complete").disabled=
   false;


  if(Number(p.completed)===1){

   $("status").className=
    "status done";

   $("status").textContent=
    "✅ Completed";

   $("complete").textContent=
    "↩️ Mark as Not Completed";

  }else{

   $("status").className=
    "status pending";

   $("status").textContent=
    "⏳ Not completed";

   $("complete").textContent=
    "✅ Mark as Completed";

  }

 }catch(error){

  $("prayer").innerHTML=
   '<div class="msg err">'+
   safe(error.message)+
   "</div>";

 }

}


/* COMPLETE TODAY */

async function completePrayer(){

 const p=
  prayers.find(
   x=>x.prayer_date===selected
  );

 if(!p){
  return;
 }

 const isCompleted=
  $("complete").textContent.includes(
   "Not Completed"
  );

 try{

  await api(
   "/complete",
   {
    method:"POST",
    body:JSON.stringify({
     prayer_id:p.id,
     date:selected,
     completed:
      isCompleted?0:1
    })
   }
  );

  await load();

 }catch(error){

  message(
   "msg",
   error.message,
   "err"
  );

 }

}


/* SAVE TODAY'S PRAYER */

async function savePrayer(){

 /*
  Always save for today.
 */
 const date=
  localDate();

 const title=
  $("title").value.trim();

 const content=
  $("content").value.trim();

 if(!title||!content){

  message(
   "msg",
   "Please enter a title and prayer.",
   "err"
  );

  return;
 }


 /*
  If today's prayer already exists,
  update it instead of creating
  another prayer.
 */

 const existing=
  prayers.find(
   p=>p.prayer_date===date
  );


 const button=
  $("saveButton");

 button.disabled=true;

 button.textContent=
  "Saving...";


 try{

  let result;

  if(existing){

   result=
    await api(
     "/prayer/"+existing.id,
     {
      method:"PUT",
      body:JSON.stringify({
       prayer_date:date,
       title:title,
       content:content
      })
     }
    );

  }else{

   if(prayers.length>=MAX_DAYS){

    throw new Error(
     "100 prayer days already reached."
    );

   }

   result=
    await api(
     "/prayer",
     {
      method:"POST",
      body:JSON.stringify({
       prayer_date:date,
       title:title,
       content:content
      })
     }
    );

  }


  if(!result.success){

   throw new Error(
    result.error||"Save failed"
   );

  }


  editId=null;

  $("formTitle").textContent=
   "➕ Today's Prayer";

  $("title").value="";
  $("content").value="";

  $("cancelButton").classList.add(
   "hidden"
  );

  message(
   "msg",
   "✅ Today's prayer saved.",
   "ok"
  );

  await load();


 }catch(error){

  message(
   "msg",
   "❌ "+error.message,
   "err"
  );

 }finally{

  button.disabled=false;

  button.textContent=
   "💾 Save Prayer";

 }

}


/* EDIT TODAY */

function editPrayer(id){

 const p=
  prayers.find(
   x=>Number(x.id)===Number(id)
  );

 if(!p){
  return;
 }

 /*
  Only today's prayer can be edited.
 */

 if(p.prayer_date!==localDate()){

  message(
   "msg",
   "Only today's prayer can be edited.",
   "err"
  );

  return;
 }

 editId=
  Number(id);

 $("formTitle").textContent=
  "✏️ Edit Today's Prayer";

 $("pdate").value=
  localDate();

 $("title").value=
  p.title;

 $("content").value=
  p.content;

 $("cancelButton").classList.remove(
  "hidden"
 );

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });

}


/* CANCEL EDIT */

function cancelEdit(){

 editId=null;

 $("formTitle").textContent=
  "➕ Today's Prayer";

 $("pdate").value=
  localDate();

 $("title").value="";
 $("content").value="";

 $("cancelButton").classList.add(
  "hidden"
 );

}


/* DELETE */

async function deletePrayer(id){

 if(!confirm(
  "Delete today's prayer?"
 )){
  return;
 }

 try{

  await api(
   "/prayer/"+id,
   {
    method:"DELETE"
   }
  );

  await load();

 }catch(error){

  message(
   "msg",
   error.message,
   "err"
  );

 }

}


/* SEARCH */

function renderList(){

 const q=
  $("search").value
   .trim()
   .toLowerCase();

 const items=
  prayers.filter(p=>
   !q||
   String(p.title)
    .toLowerCase()
    .includes(q)||
   String(p.content)
    .toLowerCase()
    .includes(q)||
   String(p.prayer_date)
    .includes(q)
  );


 if(!items.length){

  $("list").innerHTML=
   '<div class="empty">'+
   "No prayers found."+
   "</div>";

  return;

 }


 const sorted=
  [...items].sort(
   (a,b)=>
    a.prayer_date.localeCompare(
     b.prayer_date
    )
  );


 $("list").innerHTML=
  sorted.map((p,index)=>{

   const status=
    Number(p.completed)===1
     ?"✅ Completed"
     :"⏳ Not completed";

   return `
    <div class="item">

     <b>
      Day ${index+1}
     </b>

     <br>

     <strong>
      ${safe(p.title)}
     </strong>

     <br>

     <small>
      ${safe(p.prayer_date)}
      • ${status}
     </small>

     ${
      p.prayer_date===localDate()
      ?`
       <div class="actions">

        <button
         class="blue"
         onclick="editPrayer(${Number(p.id)})">
         ✏️ Edit
        </button>

        <button
         class="red"
         onclick="deletePrayer(${Number(p.id)})">
         🗑 Delete
        </button>

       </div>
      `
      :""
     }

    </div>
   `;

  }).join("");

}


/* LOGOUT */

function logout(){

 token="";

 sessionStorage.removeItem(
  "prayer_token"
 );

 location.href=
  location.pathname;

}


/* MESSAGE */

function message(
 id,
 text,
 type
){

 $(id).innerHTML=
  '<div class="msg '+type+'">'+
  safe(text)+
  "</div>";

}


/* HTML SAFETY */

function safe(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* GOOGLE CALLBACK */

const params=
 new URLSearchParams(
  location.search
 );

const session=
 params.get("session");

if(session){

 token=session;

 sessionStorage.setItem(
  "prayer_token",
  token
 );

 history.replaceState(
  {},
  document.title,
  location.pathname
 );

}


/* START */

start();

</script>

</body>
</html>
