<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🙏 100 Prayer Points</title>
<meta name="theme-color" content="#102a56">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033;
}

header{
 background:#102a56;
 color:#fff;
 padding:22px 16px;
 text-align:center;
}

header h1{
 margin:0 0 6px;
 font-size:25px;
}

header p{
 margin:0;
 font-size:14px;
 opacity:.85;
}

.container{
 max-width:700px;
 margin:auto;
 padding:16px;
}

.card{
 background:#fff;
 border-radius:18px;
 padding:18px;
 margin-bottom:16px;
 box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.progress-title{
 display:flex;
 justify-content:space-between;
 margin-bottom:10px;
 font-weight:bold;
}

.progress{
 height:12px;
 background:#e5eaf2;
 border-radius:20px;
 overflow:hidden;
}

.progress-bar{
 height:100%;
 width:0%;
 background:#d69b16;
 transition:.3s;
}

.auth{
 margin-top:12px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 font-size:13px;
 color:#666;
}

button,
select,
input,
textarea{
 width:100%;
 font:inherit;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 16px;
 cursor:pointer;
 font-weight:bold;
}

.logout{
 width:auto;
 padding:8px 12px;
 background:#fff;
 color:#102a56;
 border:1px solid #d7dce5;
}

.primary{
 background:#102a56;
 color:#fff;
}

.gold{
 background:#d69b16;
 color:#fff;
}

.secondary{
 background:#edf1f7;
 color:#102a56;
}

.danger{
 background:#d93025;
 color:#fff;
}

select,
input,
textarea{
 border:1px solid #d7dce5;
 border-radius:12px;
 padding:12px;
 background:#fff;
}

textarea{
 min-height:180px;
 resize:vertical;
 line-height:1.6;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}

.date-display{
 text-align:center;
 font-weight:bold;
 line-height:1.6;
 margin-bottom:14px;
}

.point-number{
 color:#d69b16;
 font-size:14px;
 font-weight:bold;
 margin-bottom:7px;
}

.point-title{
 font-size:22px;
 font-weight:bold;
 margin-bottom:10px;
}

.date{
 color:#777;
 font-size:13px;
 margin-bottom:14px;
}

.status{
 display:inline-block;
 padding:7px 12px;
 border-radius:20px;
 font-size:13px;
 font-weight:bold;
 margin-bottom:15px;
}

.done{
 background:#e7f7ed;
 color:#16803c;
}

.pending{
 background:#fff4dc;
 color:#956700;
}

.prayer-content{
 white-space:pre-wrap;
 line-height:1.75;
 font-size:16px;
}

.empty{
 text-align:center;
 padding:20px 5px;
 color:#777;
}

.message{
 display:none;
 padding:12px;
 border-radius:12px;
 margin-bottom:14px;
 font-size:14px;
}

.success{
 background:#e7f7ed;
 color:#176b38;
}

.error{
 background:#fdeaea;
 color:#a52222;
}

.form-title{
 margin-top:0;
}

label{
 display:block;
 font-weight:bold;
 margin:14px 0 7px;
}

@media(max-width:520px){
 .actions{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<header>
 <h1>🙏 100 Prayer Points</h1>
 <p>100 prayer points • Every year</p>
</header>

<div class="container">

<div id="message" class="message"></div>

<!-- PROGRESS -->

<div class="card">

 <div class="progress-title">
  <span id="progressText">
   0 / 100 Prayer Points
  </span>

  <span id="percent">
   0%
  </span>
 </div>

 <div class="progress">
  <div
   id="progressBar"
   class="progress-bar">
  </div>
 </div>

 <div class="auth">

  <span id="email">
   Checking account...
  </span>

  <button
   class="logout"
   onclick="logout()">
   🔒 Sign Out
  </button>

 </div>

</div>


<!-- DATE -->

<div class="card">

 <div class="date-display">
  <span id="dayName"></span>
  <br>
  <span id="currentDate"></span>
 </div>

 <label>
  🙏 Select Prayer Point
 </label>

 <select
  id="pointSelect"
  onchange="showSelectedPoint()">
 </select>

</div>


<!-- PRAYER -->

<div class="card">

 <div id="prayerArea"></div>

</div>


<!-- ADD / EDIT -->

<div class="card">

 <h2
  id="formHeading"
  class="form-title">
  ➕ Add Prayer Point
 </h2>

 <div
  id="formMessage"
  class="message">
 </div>

 <label>
  Prayer Point
 </label>

 <select
  id="formPoint"
  onchange="updateNewPrayerDate()">
 </select>

 <!-- Never displayed to user -->
 <input
  type="hidden"
  id="prayerDate">

 <label>
  Title
 </label>

 <input
  type="text"
  id="prayerTitle"
  placeholder="Prayer title">

 <label>
  Prayer
 </label>

 <textarea
  id="prayerContent"
  placeholder="Write your prayer...">
 </textarea>

 <div class="actions">

  <button
   class="gold"
   onclick="savePrayer()">
   💾 Save Prayer
  </button>

  <button
   class="secondary"
   onclick="cancelEdit()">
   Cancel
  </button>

 </div>

</div>

</div>


<script>

const API =
 "https://prayer.createlk.workers.dev";

const LOGIN =
 API + "/login";

let session = "";
let prayers = [];
let editingId = null;


/* =========================
   POINT DATE
========================= */

function pointDate(point){

 const year =
  new Date().getFullYear();

 const d =
  new Date(
   year,
   0,
   Number(point) - 1
  );

 return (
  d.getFullYear() +
  "-" +
  String(d.getMonth()+1).padStart(2,"0") +
  "-" +
  String(d.getDate()).padStart(2,"0")
 );
}


/* =========================
   NEW PRAYER DATE
========================= */

function updateNewPrayerDate(){

 if(editingId){
  return;
 }

 const point =
  Number(
   document.getElementById(
    "formPoint"
   ).value
  );

 document.getElementById(
  "prayerDate"
 ).value =
  pointDate(point);
}


/* =========================
   TODAY
========================= */

function today(){

 const now = new Date();

 const parts =
  new Intl.DateTimeFormat(
   "en-CA",
   {
    timeZone:"Asia/Colombo",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
   }
  ).formatToParts(now);

 const obj = {};

 parts.forEach(p=>{
  if(p.type !== "literal"){
   obj[p.type] = p.value;
  }
 });

 return (
  obj.year + "-" +
  obj.month + "-" +
  obj.day
 );
}


/* =========================
   DISPLAY TODAY
========================= */

function displayToday(){

 const d =
  new Date(
   today()+"T00:00:00"
  );

 document.getElementById(
  "dayName"
 ).textContent =
  d.toLocaleDateString(
   "en-US",
   {
    weekday:"long"
   }
  );

 document.getElementById(
  "currentDate"
 ).textContent =
  d.toLocaleDateString(
   "en-US",
   {
    day:"numeric",
    month:"long",
    year:"numeric"
   }
  );
}


/* =========================
   INIT
========================= */

function init(){

 displayToday();

 const params =
  new URLSearchParams(
   location.search
  );

 session =
  params.get("session") || "";

 if(session){

  localStorage.setItem(
   "prayer_session",
   session
  );

  history.replaceState(
   {},
   document.title,
   location.pathname
  );

 }else{

  session =
   localStorage.getItem(
    "prayer_session"
   ) || "";

 }

 if(!session){

  location.href=LOGIN;
  return;
 }

 buildSelectors();

 updateNewPrayerDate();

 checkLogin();
}


/* =========================
   BUILD SELECTORS
========================= */

function buildSelectors(){

 const pointSelect =
  document.getElementById(
   "pointSelect"
  );

 const formPoint =
  document.getElementById(
   "formPoint"
  );

 pointSelect.innerHTML="";
 formPoint.innerHTML="";

 for(let i=1;i<=100;i++){

  const a =
   document.createElement("option");

  a.value=i;
  a.textContent=
   "Prayer Point "+i;

  pointSelect.appendChild(a);


  const b =
   document.createElement("option");

  b.value=i;
  b.textContent=
   "Prayer Point "+i;

  formPoint.appendChild(b);
 }

 pointSelect.value="1";
 formPoint.value="1";
}


/* =========================
   LOGIN
========================= */

async function checkLogin(){

 try{

  const r =
   await fetch(
    API+"/me",
    {
     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );

  const data =
   await r.json();

  if(!r.ok ||
     !data.authenticated){

   localStorage.removeItem(
    "prayer_session"
   );

   location.href=LOGIN;
   return;
  }

  document.getElementById(
   "email"
  ).textContent =
   data.email || "";

  await loadPrayers();

 }catch(e){

  showMessage(
   "Unable to connect to prayer server.",
   true
  );
 }
}


/* =========================
   LOAD
========================= */

async function loadPrayers(){

 try{

  const r =
   await fetch(
    API+"/prayers",
    {
     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );

  const data =
   await r.json();

  if(!r.ok){

   throw new Error(
    data.error ||
    "Unable to load prayers"
   );
  }

  prayers =
   Array.isArray(data.prayers)
    ?data.prayers
    :[];


  /*
   Worker uses:
   ORDER BY prayer_date ASC

   We preserve that order.

   Same date is ordered by ID.
  */

  prayers.sort((a,b)=>{

   const da =
    String(a.prayer_date||"");

   const db =
    String(b.prayer_date||"");

   if(da===db){

    return (
     Number(a.id||0) -
     Number(b.id||0)
    );
   }

   return da.localeCompare(db);
  });


  updateProgress();

  showSelectedPoint();

 }catch(e){

  showMessage(
   e.message ||
   "Unable to load prayers.",
   true
  );
 }
}


/* =========================
   GET PRAYER
========================= */

function getPrayer(point){

 return prayers[point-1] || null;

}


/* =========================
   SHOW SELECTED POINT
========================= */

function showSelectedPoint(){

 const point =
  Number(
   document.getElementById(
    "pointSelect"
   ).value
  );

 document.getElementById(
  "formPoint"
 ).value=point;


 /*
   Only set automatic date when
   we are NOT editing.
 */

 if(!editingId){

  updateNewPrayerDate();

 }


 const prayer =
  getPrayer(point);

 const area =
  document.getElementById(
   "prayerArea"
  );


 if(!prayer){

  area.innerHTML=`

   <div class="empty">

    <div class="point-number">
     Prayer Point ${point}
    </div>

    <div class="point-title">
     Prayer Point ${point} of 100
    </div>

    <div class="status pending">
     ⏳ Not added
    </div>

    <p>
     No prayer has been added
     for Prayer Point ${point}.
    </p>

   </div>

  `;

  return;
 }


 const completed =
  Number(prayer.completed)===1 ||
  prayer.completed===true;


 const status =
  completed

  ?`
   <div class="status done">
    ✅ Completed
   </div>
  `

  :`
   <div class="status pending">
    ⏳ Not completed
   </div>
  `;


 const dateText =
  prayer.prayer_date
   ? "📅 "+escapeHtml(
      prayer.prayer_date
     )
   : "";


 area.innerHTML=`

  <div class="point-number">
   Prayer Point ${point}
  </div>

  <div class="point-title">
   ${escapeHtml(
    prayer.title ||
    "Prayer Point "+point
   )}
  </div>

  ${
   dateText
    ? `<div class="date">
        ${dateText}
       </div>`
    : ""
  }

  ${status}

  <div class="prayer-content">
   ${escapeHtml(
    prayer.content || ""
   )}
  </div>

  <div class="actions">

   <button
    class="primary"
    onclick="
     editPrayer(
      ${Number(prayer.id)},
      ${point}
     )
    ">
    ✏️ Edit
   </button>

   <button
    class="${
     completed
      ? "secondary"
      : "gold"
    }"
    onclick="
     toggleComplete(
      ${Number(prayer.id)},
      ${point}
     )
    ">

    ${
     completed
      ? "↩️ Unmark Completed"
      : "✅ Mark Completed"
    }

   </button>

  </div>

  <div style="margin-top:10px">

   <button
    class="danger"
    onclick="
     deletePrayer(
      ${Number(prayer.id)},
      ${point}
     )
    ">
    🗑️ Delete Prayer
   </button>

  </div>

 `;
}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

 let completed=0;

 prayers.forEach(p=>{

  if(
   Number(p.completed)===1 ||
   p.completed===true
  ){
   completed++;
  }

 });

 document.getElementById(
  "progressText"
 ).textContent =
  completed+
  " / 100 Prayer Points";

 document.getElementById(
  "percent"
 ).textContent =
  completed+"%";

 document.getElementById(
  "progressBar"
 ).style.width =
  completed+"%";
}


/* =========================
   EDIT
========================= */

function editPrayer(id,point){

 const prayer =
  prayers.find(
   p =>
    Number(p.id)===Number(id)
  );

 if(!prayer){

  showFormMessage(
   "Prayer not found.",
   true
  );

  return;
 }


 editingId =
  Number(id);


 document.getElementById(
  "formHeading"
 ).textContent =
  "✏️ Edit Prayer Point "+point;


 document.getElementById(
  "formPoint"
 ).value =
  point;


 /*
   CRITICAL FIX:

   When editing, NEVER replace
   the existing prayer_date with
   pointDate().

   Keep the exact D1 date.
 */

 document.getElementById(
  "prayerDate"
 ).value =
  prayer.prayer_date || "";


 document.getElementById(
  "prayerTitle"
 ).value =
  prayer.title || "";


 document.getElementById(
  "prayerContent"
 ).value =
  prayer.content || "";


 document.getElementById(
  "formHeading"
 ).scrollIntoView({
  behavior:"smooth",
  block:"start"
 });
}


/* =========================
   CANCEL
========================= */

function cancelEdit(){

 editingId=null;

 document.getElementById(
  "formHeading"
 ).textContent =
  "➕ Add Prayer Point";

 document.getElementById(
  "prayerTitle"
 ).value="";

 document.getElementById(
  "prayerContent"
 ).value="";


 const point =
  Number(
   document.getElementById(
    "pointSelect"
   ).value
  );

 document.getElementById(
  "formPoint"
 ).value=
  point;

 updateNewPrayerDate();
}


/* =========================
   SAVE
========================= */

async function savePrayer(){

 const point =
  Number(
   document.getElementById(
    "formPoint"
   ).value
  );


 /*
   NEW:
   Automatically use the point date.

   EDIT:
   Keep the original D1 date.
 */

 let date;

 if(editingId){

  const oldPrayer =
   prayers.find(
    p =>
     Number(p.id)===
     Number(editingId)
   );

  if(!oldPrayer){

   showFormMessage(
    "Original prayer could not be found.",
    true
   );

   return;
  }

  date =
   String(
    oldPrayer.prayer_date || ""
   ).trim();

 }else{

  date =
   pointDate(point);

 }


 const title =
  document.getElementById(
   "prayerTitle"
  ).value.trim();

 const content =
  document.getElementById(
   "prayerContent"
  ).value.trim();


 if(!date){

  showFormMessage(
   "Prayer date is missing in the existing record. Please delete this record and add it again.",
   true
  );

  return;
 }


 if(!title ||
    !content){

  showFormMessage(
   "Title and prayer are required.",
   true
  );

  return;
 }


 try{

  let url;
  let method;


  if(editingId){

   url =
    API+
    "/prayer/"+
    editingId;

   method="PUT";

  }else{

   url =
    API+
    "/prayer";

   method="POST";
  }


  const r =
   await fetch(
    url,
    {
     method,

     headers:{
      Authorization:
       "Bearer "+session,

      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({

      prayer_date:date,

      title:title,

      content:content

     })
    }
   );


  const data =
   await r.json();


  if(!r.ok){

   throw new Error(
    data.error ||
    "Unable to save prayer"
   );
  }


  showFormMessage(
   editingId
    ? "✅ Prayer updated successfully."
    : "✅ Prayer added successfully.",
   false
  );


  editingId=null;


  document.getElementById(
   "formHeading"
  ).textContent =
   "➕ Add Prayer Point";


  document.getElementById(
   "prayerTitle"
  ).value="";

  document.getElementById(
   "prayerContent"
  ).value="";


  await loadPrayers();


  document.getElementById(
   "pointSelect"
  ).value =
   point;


  showSelectedPoint();


 }catch(e){

  showFormMessage(
   e.message ||
   "Unable to save prayer.",
   true
  );
 }
}


/* =========================
   MARK / UNMARK
========================= */

async function toggleComplete(id,point){

 const prayer =
  prayers.find(
   p =>
    Number(p.id)===Number(id)
  );


 if(!prayer){

  showMessage(
   "Prayer not found.",
   true
  );

  return;
 }


 const isCompleted =
  Number(prayer.completed)===1 ||
  prayer.completed===true;


 if(!prayer.prayer_date){

  showMessage(
   "This prayer has no date in D1.",
   true
  );

  return;
 }


 try{

  const r =
   await fetch(
    API+"/complete",
    {
     method:"POST",

     headers:{
      Authorization:
       "Bearer "+session,

      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({

      prayer_id:
       Number(id),

      /*
       Worker expects "date".
       Use the prayer's own date.
      */

      date:
       String(
        prayer.prayer_date
       ),

      completed:
       !isCompleted

     })
    }
   );


  const data =
   await r.json();


  if(!r.ok ||
     !data.success){

   throw new Error(
    data.error ||
    "Unable to update completion."
   );
  }


  prayer.completed =
   !isCompleted ? 1 : 0;


  updateProgress();

  showSelectedPoint();


  showMessage(
   !isCompleted
    ? "✅ Prayer marked as completed."
    : "↩️ Prayer unmarked.",
   false
  );


 }catch(e){

  showMessage(
   e.message ||
   "Unable to update prayer.",
   true
  );
 }
}


/* =========================
   DELETE
========================= */

async function deletePrayer(id,point){

 const prayer =
  prayers.find(
   p =>
    Number(p.id)===Number(id)
  );


 if(!prayer){

  showMessage(
   "Prayer not found.",
   true
  );

  return;
 }


 if(!confirm(
  "Delete Prayer Point "+
  point+
  "?\n\nThis cannot be undone."
 )){

  return;
 }


 try{

  const r =
   await fetch(
    API+
    "/prayer/"+
    Number(id),
    {
     method:"DELETE",

     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );


  const data =
   await r.json();


  if(!r.ok ||
     !data.success){

   throw new Error(
    data.error ||
    "Unable to delete prayer."
   );
  }


  editingId=null;


  showMessage(
   "🗑️ Prayer deleted.",
   false
  );


  await loadPrayers();


  document.getElementById(
   "pointSelect"
  ).value=
   Math.min(point,100);


  showSelectedPoint();


 }catch(e){

  showMessage(
   e.message ||
   "Unable to delete prayer.",
   true
  );
 }
}


/* =========================
   LOGOUT
========================= */

function logout(){

 localStorage.removeItem(
  "prayer_session"
 );

 session="";

 location.href=LOGIN;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,error){

 const box =
  document.getElementById(
   "message"
  );

 box.textContent=text;

 box.className =
  "message "+
  (
   error
    ? "error"
    : "success"
  );

 box.style.display="block";

 setTimeout(()=>{
  box.style.display="none";
 },4000);
}


function showFormMessage(text,error){

 const box =
  document.getElementById(
   "formMessage"
  );

 box.textContent=text;

 box.className =
  "message "+
  (
   error
    ? "error"
    : "success"
  );

 box.style.display="block";

 setTimeout(()=>{
  box.style.display="none";
 },5000);
}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
