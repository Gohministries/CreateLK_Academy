<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🙏 100 Prayer Points</title>

<meta name="theme-color" content="#102a56">

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033;
}

header{
 background:#102a56;
 color:white;
 padding:20px 16px;
 text-align:center;
}

header h1{
 margin:0;
 font-size:25px;
}

header p{
 margin:7px 0 0;
 opacity:.85;
}

.container{
 max-width:700px;
 margin:auto;
 padding:15px;
}

.card{
 background:white;
 border-radius:16px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.progress-title{
 font-weight:bold;
 font-size:18px;
}

.progress-number{
 font-size:27px;
 font-weight:bold;
 margin-top:8px;
 color:#102a56;
}

.progress-bar{
 height:12px;
 background:#e8ebf1;
 border-radius:20px;
 overflow:hidden;
 margin-top:12px;
}

.progress-fill{
 height:100%;
 width:0%;
 background:#d69b16;
 transition:.3s;
}

.date{
 text-align:center;
 font-weight:bold;
 color:#555;
 margin:5px 0 18px;
}

select,
input,
textarea{
 width:100%;
 padding:12px;
 border:1px solid #d7dce5;
 border-radius:10px;
 font-size:15px;
 margin-top:7px;
}

textarea{
 min-height:150px;
 resize:vertical;
}

label{
 display:block;
 margin-top:14px;
 font-weight:bold;
}

button{
 border:0;
 border-radius:10px;
 padding:12px 15px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 margin:5px 3px 0 0;
}

.primary{
 background:#102a56;
 color:white;
}

.gold{
 background:#d69b16;
 color:white;
}

.gray{
 background:#e9edf3;
 color:#222;
}

.danger{
 background:#d9363e;
 color:white;
}

.success{
 color:#16803c;
 font-weight:bold;
}

.status{
 display:inline-block;
 padding:7px 11px;
 border-radius:20px;
 font-size:13px;
 font-weight:bold;
 margin-bottom:12px;
}

.status.done{
 background:#dff6e7;
 color:#16803c;
}

.status.pending{
 background:#fff3d2;
 color:#8a6200;
}

.prayer-title{
 font-size:22px;
 font-weight:bold;
 color:#102a56;
 margin-bottom:12px;
}

.prayer-content{
 white-space:pre-wrap;
 line-height:1.7;
 font-size:16px;
}

.actions{
 margin-top:18px;
}

.message{
 margin-top:12px;
 padding:11px;
 border-radius:10px;
 display:none;
 background:#edf4ff;
 color:#102a56;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}

.email{
 font-size:13px;
 color:#666;
}

.hidden{
 display:none!important;
}

.form-title{
 font-size:19px;
 font-weight:bold;
 color:#102a56;
}

.small{
 font-size:13px;
 color:#777;
 margin-top:5px;
}

@media(max-width:500px){
 header h1{
  font-size:22px;
 }

 .container{
  padding:10px;
 }

 .card{
  padding:15px;
 }

 button{
  width:100%;
  margin-right:0;
 }
}
</style>
</head>

<body>

<header>
 <h1>🙏 100 Prayer Points</h1>
 <p>100 prayer points • Every year</p>
</header>

<div class="container">

 <!-- PROGRESS -->
 <div class="card">

  <div class="progress-title">
   Daily Prayer Progress
  </div>

  <div class="progress-number">
   <span id="completedCount">0</span> / 100 Prayer Points
  </div>

  <div id="percentText">
   0% Complete
  </div>

  <div class="progress-bar">
   <div
    id="progressFill"
    class="progress-fill">
   </div>
  </div>

 </div>


 <!-- ACCOUNT -->
 <div class="card">

  <div class="topbar">

   <div>
    <div class="email" id="email">
     Checking login...
    </div>
   </div>

   <button
    class="gray"
    onclick="logout()">
    🔒 Sign Out
   </button>

  </div>

 </div>


 <!-- DATE -->
 <div class="date" id="todayDisplay">
  Loading date...
 </div>


 <!-- SELECT -->
 <div class="card">

  <label>
   🙏 Select Prayer Point
  </label>

  <select
   id="pointSelect"
   onchange="selectPoint(this.value)">
  </select>

 </div>


 <!-- PRAYER -->
 <div
  class="card"
  id="prayerCard">

  Loading prayer...

 </div>


 <!-- FORM -->
 <div
  class="card hidden"
  id="formCard">

  <div class="form-title" id="formTitle">
   Add Prayer
  </div>

  <div class="small">
   Prayer point content is stored permanently.
   Daily completion resets automatically.
  </div>

  <label>
   Prayer Point
  </label>

  <select id="formPoint">
  </select>

  <label>
   Prayer Date
  </label>

  <input
   id="prayerDate"
   type="date">

  <label>
   Title
  </label>

  <input
   id="title"
   type="text"
   placeholder="Prayer title">

  <label>
   Prayer
  </label>

  <textarea
   id="content"
   placeholder="Write the prayer here..."></textarea>

  <button
   class="primary"
   onclick="savePrayer()">
   💾 Save Prayer
  </button>

  <button
   class="gray"
   onclick="cancelForm()">
   Cancel
  </button>

 </div>


 <div
  id="message"
  class="message">
 </div>

</div>


<script>

const API=
 "https://prayer.createlk.workers.dev";

const LOGIN=
 API+"/login";


let session="";
let prayers=[];
let editingId=null;


/* =========================
   SRI LANKA TODAY
========================= */

function today(){

 const parts=
  new Intl.DateTimeFormat(
   "en-CA",
   {
    timeZone:"Asia/Colombo",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
   }
  ).formatToParts(new Date());

 const o={};

 parts.forEach(p=>{
  if(p.type!=="literal"){
   o[p.type]=p.value;
  }
 });

 return (
  o.year+
  "-"+
  o.month+
  "-"+
  o.day
 );
}


/* =========================
   DISPLAY TODAY
========================= */

function displayToday(){

 const d=
  new Date(
   today()+"T00:00:00"
  );

 const text=
  new Intl.DateTimeFormat(
   "en-US",
   {
    timeZone:"Asia/Colombo",
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
   }
  ).format(d);

 document.getElementById(
  "todayDisplay"
 ).textContent=text;
}


/* =========================
   POINT DATE
========================= */

function pointDate(point){

 const year=
  Number(
   new Intl.DateTimeFormat(
    "en-US",
    {
     timeZone:"Asia/Colombo",
     year:"numeric"
    }
   ).format(new Date())
  );

 const d=
  new Date(
   year,
   0,
   Number(point)-1
  );

 const y=
  d.getFullYear();

 const m=
  String(d.getMonth()+1)
   .padStart(2,"0");

 const day=
  String(d.getDate())
   .padStart(2,"0");

 return y+"-"+m+"-"+day;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

 const el=
  document.getElementById(
   "message"
  );

 el.textContent=text;
 el.style.display="block";

 clearTimeout(
  window.messageTimer
 );

 window.messageTimer=
  setTimeout(()=>{
   el.style.display="none";
  },3000);
}


/* =========================
   BUILD SELECTORS
========================= */

function buildSelectors(){

 const select=
  document.getElementById(
   "pointSelect"
  );

 const formSelect=
  document.getElementById(
   "formPoint"
  );

 select.innerHTML="";
 formSelect.innerHTML="";

 for(let i=1;i<=100;i++){

  const option=
   document.createElement("option");

  option.value=i;
  option.textContent=
   "Prayer Point "+i;

  select.appendChild(option);


  const option2=
   document.createElement("option");

  option2.value=i;
  option2.textContent=
   "Prayer Point "+i;

  formSelect.appendChild(option2);
 }
}


/* =========================
   INIT
========================= */

async function init(){

 displayToday();
 buildSelectors();

 const params=
  new URLSearchParams(
   location.search
  );

 const incoming=
  params.get("session");

 if(incoming){

  session=incoming;

  localStorage.setItem(
   "prayer_session",
   session
  );

  history.replaceState(
   {},
   "",
   location.pathname
  );

 }else{

  session=
   localStorage.getItem(
    "prayer_session"
   )||"";
 }


 if(!session){

  location.href=LOGIN;
  return;
 }


 await checkLogin();
}


/* =========================
   AUTH
========================= */

async function checkLogin(){

 try{

  const r=
   await fetch(
    API+"/me",
    {
     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );

  const data=
   await r.json();

  if(
   !r.ok||
   !data.authenticated
  ){

   localStorage.removeItem(
    "prayer_session"
   );

   location.href=LOGIN;
   return;
  }

  document.getElementById(
   "email"
  ).textContent=
   data.email||"Signed in";

  await loadPrayers();

 }catch(e){

  showMessage(
   "Unable to connect to server."
  );
 }
}


/* =========================
   LOAD PRAYERS
========================= */

async function loadPrayers(){

 try{

  const r=
   await fetch(
    API+"/prayers",
    {
     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );

  const data=
   await r.json();

  if(
   !r.ok||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to load prayers"
   );
  }


  prayers=
   Array.isArray(data.prayers)
    ?data.prayers
    :[];


  prayers.sort(
   (a,b)=>
    String(a.prayer_date)
     .localeCompare(
      String(b.prayer_date)
     )
  );


  updateProgress();


  const selected=
   Number(
    document.getElementById(
     "pointSelect"
    ).value
   )||1;

  document.getElementById(
   "pointSelect"
  ).value=selected;

  document.getElementById(
   "formPoint"
  ).value=selected;

  showSelectedPoint();

 }catch(e){

  document.getElementById(
   "prayerCard"
  ).innerHTML=
   "<b>Unable to load prayers.</b><br>"+
   e.message;
 }
}


/* =========================
   GET PRAYER
========================= */

function getPrayer(point){

 return prayers[
  Number(point)-1
 ]||null;
}


/* =========================
   SELECT POINT
========================= */

function selectPoint(point){

 document.getElementById(
  "formPoint"
 ).value=point;

 showSelectedPoint();
}


/* =========================
   SHOW SELECTED
========================= */

function showSelectedPoint(){

 const point=
  Number(
   document.getElementById(
    "pointSelect"
   ).value
  );

 const prayer=
  getPrayer(point);

 const card=
  document.getElementById(
   "prayerCard"
  );


 if(!prayer){

  card.innerHTML=`
   <div class="prayer-title">
    Prayer Point ${point}
   </div>

   <p>
    No prayer has been added for this point yet.
   </p>

   <button
    class="gold"
    onclick="openAdd(${point})">
    ➕ Add Prayer
   </button>
  `;

  return;
 }


 const completed=
  prayer.completed===1||
  prayer.completed===true||
  prayer.completed==="1";


 card.innerHTML=`

  <div class="status ${
   completed
    ?"done"
    :"pending"
  }">

   ${
    completed
     ?"✅ Completed Today"
     :"⏳ Not completed today"
   }

  </div>


  <div class="prayer-title">
   🙏 ${escapeHtml(
    prayer.title||"Prayer"
   )}
  </div>


  <div class="prayer-content">
   ${escapeHtml(
    prayer.content||""
   )}
  </div>


  <div class="actions">

   <button
    class="${
     completed
      ?"gray"
      :"gold"
    }"
    onclick="toggleComplete(
     ${prayer.id},
     ${completed}
    )">

    ${
     completed
      ?"↩️ Mark Not Completed"
      :"✅ Mark Completed"
    }

   </button>


   <button
    class="primary"
    onclick="editPrayer(${prayer.id})">

    ✏️ Edit

   </button>


   <button
    class="danger"
    onclick="deletePrayer(${prayer.id})">

    🗑️ Delete

   </button>

  </div>
 `;

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

 let completed=0;

 prayers.forEach(p=>{

  if(
   p.completed===1||
   p.completed===true||
   p.completed==="1"
  ){
   completed++;
  }

 });

 const percent=
  Math.round(
   completed
   /
   100
   *
   100
  );

 document.getElementById(
  "completedCount"
 ).textContent=completed;

 document.getElementById(
  "percentText"
 ).textContent=
  percent+"% Complete";

 document.getElementById(
  "progressFill"
 ).style.width=
  percent+"%";
}


/* =========================
   TOGGLE COMPLETE
========================= */

async function toggleComplete(
 id,
 currentlyCompleted
){

 const prayer=
  prayers.find(
   p=>Number(p.id)===Number(id)
  );

 if(!prayer)return;


 const completed=
  !currentlyCompleted;


 try{

  /*
   IMPORTANT:

   We send TODAY'S date,
   NOT prayer.prayer_date.

   Therefore each day has
   its own completion record.
  */

  const r=
   await fetch(
    API+"/complete",
    {
     method:"POST",
     headers:{
      "Content-Type":
       "application/json",

      Authorization:
       "Bearer "+session
     },

     body:JSON.stringify({
      prayer_id:id,
      date:today(),
      completed
     })
    }
   );


  const data=
   await r.json();


  if(
   !r.ok||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to save completion"
   );
  }


  prayer.completed=
   completed?1:0;


  updateProgress();


  /*
   Automatically move to the
   next prayer only when
   marking completed.
  */

  if(completed){

   const current=
    Number(
     document.getElementById(
      "pointSelect"
     ).value
    );

   const next=
    Math.min(
     current+1,
     100
    );


   document.getElementById(
    "pointSelect"
   ).value=next;

   document.getElementById(
    "formPoint"
   ).value=next;


   showSelectedPoint();


   if(current<100){

    showMessage(
     "✅ Completed. Moving to Prayer Point "+
     next+"."
    );

   }else{

    showMessage(
     "🎉 All 100 prayer points completed today!"
    );
   }


  }else{

   /*
    If unmarking, stay on
    the same prayer point.
   */

   showSelectedPoint();

   showMessage(
    "Prayer marked as not completed."
   );
  }


 }catch(e){

  showMessage(
   "Error: "+e.message
  );
 }
}


/* =========================
   ADD PRAYER
========================= */

function openAdd(point){

 editingId=null;

 document.getElementById(
  "formCard"
 ).classList.remove("hidden");

 document.getElementById(
  "formTitle"
 ).textContent=
  "➕ Add Prayer";

 document.getElementById(
  "formPoint"
 ).value=point;

 document.getElementById(
  "prayerDate"
 ).value=
  pointDate(point);

 document.getElementById(
  "title"
 ).value="";

 document.getElementById(
  "content"
 ).value="";

 window.scrollTo({
  top:document.getElementById(
   "formCard"
  ).offsetTop-10,
  behavior:"smooth"
 });
}


/* =========================
   EDIT PRAYER
========================= */

function editPrayer(id){

 const prayer=
  prayers.find(
   p=>Number(p.id)===Number(id)
  );

 if(!prayer){

  showMessage(
   "Prayer not found."
  );

  return;
 }


 editingId=id;


 const point=
  prayers.indexOf(prayer)+1;


 document.getElementById(
  "formCard"
 ).classList.remove("hidden");


 document.getElementById(
  "formTitle"
 ).textContent=
  "✏️ Edit Prayer";


 document.getElementById(
  "formPoint"
 ).value=point;


 /*
  Preserve the original
  prayer date exactly.
 */

 document.getElementById(
  "prayerDate"
 ).value=
  prayer.prayer_date||"";


 document.getElementById(
  "title"
 ).value=
  prayer.title||"";


 document.getElementById(
  "content"
 ).value=
  prayer.content||"";


 window.scrollTo({
  top:document.getElementById(
   "formCard"
  ).offsetTop-10,
  behavior:"smooth"
 });
}


/* =========================
   SAVE PRAYER
========================= */

async function savePrayer(){

 const point=
  Number(
   document.getElementById(
    "formPoint"
   ).value
  );

 const date=
  document.getElementById(
   "prayerDate"
  ).value.trim();

 const title=
  document.getElementById(
   "title"
  ).value.trim();

 const content=
  document.getElementById(
   "content"
  ).value.trim();


 if(!date||!title||!content){

  showMessage(
   "Date, title and prayer are required."
  );

  return;
 }


 const body={
  prayer_date:date,
  title,
  content
 };


 try{

  let r;


  if(editingId){

   r=
    await fetch(
     API+"/prayer/"+editingId,
     {
      method:"PUT",
      headers:{
       "Content-Type":
        "application/json",

       Authorization:
        "Bearer "+session
      },
      body:
       JSON.stringify(body)
     }
    );

  }else{

   r=
    await fetch(
     API+"/prayer",
     {
      method:"POST",
      headers:{
       "Content-Type":
        "application/json",

       Authorization:
        "Bearer "+session
      },
      body:
       JSON.stringify(body)
     }
    );
  }


  const data=
   await r.json();


  if(
   !r.ok||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to save prayer"
   );
  }


  showMessage(
   editingId
    ?"Prayer updated successfully."
    :"Prayer added successfully."
  );


  cancelForm();

  await loadPrayers();


  document.getElementById(
   "pointSelect"
  ).value=point;

  document.getElementById(
   "formPoint"
  ).value=point;

  showSelectedPoint();


 }catch(e){

  showMessage(
   "Error: "+e.message
  );
 }
}


/* =========================
   CANCEL FORM
========================= */

function cancelForm(){

 editingId=null;

 document.getElementById(
  "formCard"
 ).classList.add("hidden");

 document.getElementById(
  "title"
 ).value="";

 document.getElementById(
  "content"
 ).value="";
}


/* =========================
   DELETE PRAYER
========================= */

async function deletePrayer(id){

 if(
  !confirm(
   "Delete this prayer permanently?"
  )
 ){
  return;
 }


 try{

  const r=
   await fetch(
    API+"/prayer/"+id,
    {
     method:"DELETE",
     headers:{
      Authorization:
       "Bearer "+session
     }
    }
   );


  const data=
   await r.json();


  if(
   !r.ok||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to delete prayer"
   );
  }


  showMessage(
   "Prayer deleted."
  );


  await loadPrayers();


 }catch(e){

  showMessage(
   "Error: "+e.message
  );
 }
}


/* =========================
   LOGOUT
========================= */

function logout(){

 localStorage.removeItem(
  "prayer_session"
 );

 session="";

 location.href=LOGIN;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
