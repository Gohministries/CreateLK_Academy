<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Daily Prayer</title>
<meta name="description" content="Personal daily prayer manager">
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#1e293b
}
header{
 background:#1e3a8a;
 color:#fff;
 text-align:center;
 padding:18px
}
header h1{margin:0;font-size:23px}
header p{margin:5px 0 0;font-size:13px}
main{max-width:700px;margin:auto;padding:15px}
.card{
 background:#fff;
 padding:16px;
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 2px 10px #0001
}
input,textarea,button{
 width:100%;
 font:inherit;
 padding:11px;
 margin:5px 0;
 border-radius:8px
}
input,textarea{border:1px solid #cbd5e1}
textarea{min-height:140px;resize:vertical}
button{
 border:0;
 font-weight:bold;
 cursor:pointer
}
.blue{background:#1e3a8a;color:#fff}
.green{background:#15803d;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#e2e8f0;color:#1e293b}
.google{
 background:#fff;
 color:#222;
 border:1px solid #cbd5e1;
 box-shadow:0 1px 3px #0002
}
.hidden{display:none}
.date{
 text-align:center;
 background:#eff6ff;
 padding:12px;
 border-radius:9px
}
.date b{
 display:block;
 font-size:20px;
 margin:3px 0
}
.prayer h2{margin-bottom:8px}
.content{
 white-space:pre-wrap;
 line-height:1.7
}
.status{
 text-align:center;
 padding:9px;
 border-radius:8px;
 margin:10px 0;
 font-weight:bold
}
.done{
 background:#dcfce7;
 color:#166534
}
.pending{
 background:#fef3c7;
 color:#92400e
}
.nav{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:6px
}
.item{
 border:1px solid #e2e8f0;
 border-radius:8px;
 padding:10px;
 margin:7px 0
}
.item small{color:#64748b}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px
}
.msg{
 padding:9px;
 border-radius:7px;
 margin:6px 0
}
.ok{
 background:#dcfce7;
 color:#166534
}
.err{
 background:#fee2e2;
 color:#991b1b
}
.user{
 text-align:center;
 font-size:13px;
 color:#64748b;
 margin:8px 0
}
.empty{
 text-align:center;
 color:#64748b;
 padding:15px
}
@media(max-width:500px){
 .nav{grid-template-columns:1fr}
 .actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>🙏 My Daily Prayer</h1>
<p>Personal Prayer Manager</p>
</header>

<main>

<!-- LOGIN -->
<div id="login" class="card">
<h3>🔐 Private Prayer</h3>
<p>Sign in with your authorized Google account.</p>

<button class="google" onclick="googleLogin()">
  🔐 Continue with Google
</button>

<div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="card">
<b><span id="count">0</span> / 100 prayers</b>
<div id="user" class="user"></div>

<button class="gray" onclick="logout()">
🔒 Sign Out
</button>
</div>

<!-- TODAY -->
<div class="card">

<div class="date">
<span id="day"></span>
<b id="date"></b>
<span id="month"></span>
</div>

<div id="status" class="status pending">
⏳ Not completed
</div>

<div id="prayer" class="prayer">
<h2>No prayer</h2>
<div class="content">
Add a prayer for this date.
</div>
</div>

<button
 id="complete"
 class="green"
 onclick="completePrayer()">
✅ Mark as Completed
</button>

<div class="nav">
<button class="gray" onclick="moveDate(-1)">
◀ Previous
</button>

<button class="blue" onclick="goToday()">
Today
</button>

<button class="gray" onclick="moveDate(1)">
Next ▶
</button>
</div>

</div>

<!-- ADD / EDIT -->
<div class="card">

<h3 id="formTitle">➕ Add Prayer</h3>

<input id="pdate" type="date">

<input
 id="title"
 placeholder="Prayer title">

<textarea
 id="content"
 placeholder="Write your prayer..."></textarea>

<button class="blue" onclick="savePrayer()">
💾 Save Prayer
</button>

<button
 id="cancel"
 class="gray hidden"
 onclick="cancelEdit()">
Cancel
</button>

<div id="msg"></div>

</div>

<!-- LIST -->
<div class="card">

<h3>🔎 My Prayers</h3>

<input
 id="search"
 placeholder="Search prayers..."
 oninput="renderList()">

<div id="list"></div>

</div>

</div>

</main>

<script>

const API =
"https://prayer.createlk.workers.dev";

const MAX = 100;

let token =
sessionStorage.getItem("prayer_token") || "";

let prayers = [];

let selected =
localStorage.getItem("prayer_date") ||
localDate();

let editId = null;

const $ = id =>
document.getElementById(id);


/* DATE */

function localDate(){

 const d = new Date();

 return d.getFullYear() +
 "-" +
 String(d.getMonth()+1).padStart(2,"0") +
 "-" +
 String(d.getDate()).padStart(2,"0");

}


/* GOOGLE LOGIN */

function googleLogin(){

 window.location.href =
 API + "/login";

}


/* API */

async function api(path,opt={}){

 opt.headers = {
   ...(opt.headers || {}),
   "Authorization":
     "Bearer " + token,
   "Content-Type":
     "application/json"
 };

 const r =
   await fetch(API + path,opt);

 let d;

 try{
   d = await r.json();
 }catch{
   throw new Error("Server error");
 }

 if(!r.ok){

   if(r.status === 401){
     logout(false);
   }

   throw new Error(
     d.error || "Request failed"
   );
 }

 return d;
}


/* START */

async function start(){

 if(!token) return;

 try{

   const me =
     await api("/me");

   if(!me.authenticated){
     logout(false);
     return;
   }

   $("login").classList.add("hidden");
   $("app").classList.remove("hidden");

   $("user").textContent =
     me.email || "";

   await load();

 }catch(e){

   logout(false);

   $("loginMsg").innerHTML =
     '<div class="msg err">' +
     safe(e.message) +
     '</div>';

 }

}


/* LOAD */

async function load(){

 try{

   const d =
     await api("/prayers");

   prayers =
     d.prayers || [];

   $("count").textContent =
     prayers.length;

   showPrayer();
   renderList();

 }catch(e){

   message(
     "msg",
     e.message,
     "err"
   );

 }

}


/* SHOW SELECTED DATE */

async function showPrayer(){

 $("pdate").value =
   selected;

 const d =
   new Date(selected + "T12:00:00");

 const days = [
   "Sunday",
   "Monday",
   "Tuesday",
   "Wednesday",
   "Thursday",
   "Friday",
   "Saturday"
 ];

 const months = [
   "January",
   "February",
   "March",
   "April",
   "May",
   "June",
   "July",
   "August",
   "September",
   "October",
   "November",
   "December"
 ];

 $("day").textContent =
   days[d.getDay()];

 $("date").textContent =
   d.getDate();

 $("month").textContent =
   months[d.getMonth()] +
   " " +
   d.getFullYear();

 try{

   const result =
     await api(
       "/today?date=" +
       encodeURIComponent(selected)
     );

   const p =
     result.prayer;

   if(!p){

     $("prayer").innerHTML =
       "<h2>No prayer</h2>" +
       '<div class="content">' +
       "Add a prayer for this date." +
       "</div>";

     $("status").className =
       "status pending";

     $("status").textContent =
       "⏳ Not completed";

     $("complete").disabled = true;

     $("complete").textContent =
       "✅ Mark as Completed";

     return;
   }

   $("prayer").innerHTML =
     "<h2>" +
     safe(p.title) +
     "</h2>" +
     '<div class="content">' +
     safe(p.content) +
     "</div>";

   $("complete").disabled = false;

   if(Number(p.completed) === 1){

     $("status").className =
       "status done";

     $("status").textContent =
       "✅ Completed";

     $("complete").textContent =
       "↩️ Mark as Not Completed";

   }else{

     $("status").className =
       "status pending";

     $("status").textContent =
       "⏳ Not completed";

     $("complete").textContent =
       "✅ Mark as Completed";
   }

 }catch(e){

   $("prayer").innerHTML =
     '<div class="msg err">' +
     safe(e.message) +
     "</div>";

 }

}


/* DATE NAVIGATION */

function moveDate(amount){

 const d =
   new Date(selected + "T12:00:00");

 d.setDate(
   d.getDate() + amount
 );

 selected =
   d.getFullYear() +
   "-" +
   String(d.getMonth()+1).padStart(2,"0") +
   "-" +
   String(d.getDate()).padStart(2,"0");

 localStorage.setItem(
   "prayer_date",
   selected
 );

 showPrayer();

}


function goToday(){

 selected =
   localDate();

 localStorage.setItem(
   "prayer_date",
   selected
 );

 showPrayer();

}


/* COMPLETE */

async function completePrayer(){

 const p =
   prayers.find(
     x => x.prayer_date === selected
   );

 if(!p) return;

 const button =
   $("complete");

 const completed =
   button.textContent.includes(
     "Not Completed"
   ) ? 0 : 1;

 try{

   await api(
     "/complete",
     {
       method:"POST",
       body:JSON.stringify({
         prayer_id:p.id,
         date:selected,
         completed
       })
     }
   );

   await showPrayer();

 }catch(e){

   message(
     "msg",
     e.message,
     "err"
   );

 }

}


/* SAVE */

async function savePrayer(){

 const date =
   $("pdate").value;

 const title =
   $("title").value.trim();

 const content =
   $("content").value.trim();

 if(!date || !title || !content){

   message(
     "msg",
     "Please fill in all fields.",
     "err"
   );

   return;
 }

 try{

   if(editId){

     await api(
       "/prayer/" + editId,
       {
         method:"PUT",
         body:JSON.stringify({
           prayer_date:date,
           title:title,
           content:content
         })
       }
     );

     message(
       "msg",
       "Prayer updated.",
       "ok"
     );

   }else{

     if(prayers.length >= MAX){

       message(
         "msg",
         "Maximum 100 prayers reached.",
         "err"
       );

       return;
     }

     await api(
       "/prayer",
       {
         method:"POST",
         body:JSON.stringify({
           prayer_date:date,
           title:title,
           content:content
         })
       }
     );

     message(
       "msg",
       "Prayer saved.",
       "ok"
     );

   }

   selected = date;

   localStorage.setItem(
     "prayer_date",
     selected
   );

   cancelEdit();

   await load();

 }catch(e){

   message(
     "msg",
     e.message,
     "err"
   );

 }

}


/* EDIT */

function editPrayer(id){

 const p =
   prayers.find(
     x => Number(x.id) === Number(id)
   );

 if(!p) return;

 editId =
   Number(id);

 $("formTitle").textContent =
   "✏️ Edit Prayer";

 $("pdate").value =
   p.prayer_date;

 $("title").value =
   p.title;

 $("content").value =
   p.content;

 $("cancel").classList.remove(
   "hidden"
 );

 window.scrollTo({
   top:document.body.scrollHeight,
   behavior:"smooth"
 });

}


/* CANCEL */

function cancelEdit(){

 editId = null;

 $("formTitle").textContent =
   "➕ Add Prayer";

 $("pdate").value =
   selected;

 $("title").value = "";

 $("content").value = "";

 $("cancel").classList.add(
   "hidden"
 );

}


/* DELETE */

async function deletePrayer(id){

 if(!confirm(
   "Delete this prayer?"
 )) return;

 try{

   await api(
     "/prayer/" + id,
     {
       method:"DELETE"
     }
   );

   if(editId === Number(id)){
     cancelEdit();
   }

   await load();

 }catch(e){

   message(
     "msg",
     e.message,
     "err"
   );

 }

}


/* LIST */

function renderList(){

 const q =
   $("search").value
     .trim()
     .toLowerCase();

 const items =
   prayers.filter(p =>
     !q ||
     p.title.toLowerCase().includes(q) ||
     p.content.toLowerCase().includes(q) ||
     p.prayer_date.includes(q)
   );

 if(!items.length){

   $("list").innerHTML =
     '<div class="empty">' +
     "No prayers found." +
     "</div>";

   return;
 }

 $("list").innerHTML =
   items.map(p => `
     <div class="item">

       <b>${safe(p.title)}</b>

       <br>

       <small>${safe(p.prayer_date)}</small>

       <div class="actions">

         <button
           class="blue"
           onclick="openPrayer('${safeAttr(p.prayer_date)}')">
           📖 Open
         </button>

         <button
           class="gray"
           onclick="editPrayer(${Number(p.id)})">
           ✏️ Edit
         </button>

       </div>

       <button
         class="red"
         onclick="deletePrayer(${Number(p.id)})">
         🗑 Delete
       </button>

     </div>
   `).join("");

}


/* OPEN */

function openPrayer(date){

 selected = date;

 localStorage.setItem(
   "prayer_date",
   selected
 );

 showPrayer();

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

}


/* LOGOUT */

function logout(reload=true){

 token = "";

 sessionStorage.removeItem(
   "prayer_token"
 );

 $("app").classList.add(
   "hidden"
 );

 $("login").classList.remove(
   "hidden"
 );

 if(reload){
   location.reload();
 }

}


/* MESSAGE */

function message(id,text,type){

 $(id).innerHTML =
   '<div class="msg ' +
   type +
   '">' +
   safe(text) +
   "</div>";

}


/* SECURITY */

function safe(value){

 return String(value ?? "")
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


function safeAttr(value){

 return String(value ?? "")
   .replace(/\\/g,"\\\\")
   .replace(/'/g,"\\'");

}


/* GOOGLE CALLBACK SESSION */

const params =
  new URLSearchParams(
    location.search
  );

const session =
  params.get("session");

if(session){

 token = session;

 sessionStorage.setItem(
   "prayer_token",
   token
 );

 history.replaceState(
   {},
   document.title,
   location.pathname
 );

}


/* DATE CHANGE */

$("pdate").addEventListener(
  "change",
  function(){

    selected = this.value;

    localStorage.setItem(
      "prayer_date",
      selected
    );

    showPrayer();

  }
);


/* START */

start();

</script>

</body>
</html>
