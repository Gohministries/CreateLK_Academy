<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Prayer Points</title>
<meta name="theme-color" content="#1e3a8a">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}
header{background:#1e3a8a;color:#fff;text-align:center;padding:18px}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:13px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
input,textarea,button,select{width:100%;padding:11px;margin:5px 0;border-radius:8px;font:inherit}
input,textarea,select{border:1px solid #cbd5e1;background:#fff}
textarea{min-height:150px;resize:vertical}
button{border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.blue{background:#1e3a8a;color:#fff}
.green{background:#15803d;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#e2e8f0;color:#1e293b}
.google{background:#fff;border:1px solid #cbd5e1}
.hidden{display:none}
.progressText{text-align:center;font-size:20px;font-weight:bold}
.progress{height:16px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:10px 0}
.progressBar{height:100%;width:0;background:#15803d;transition:.3s}
.percent{text-align:center;color:#64748b;font-size:13px}
.today{text-align:center;background:#eff6ff;border-radius:10px;padding:15px}
.number{font-size:34px;font-weight:bold;margin:3px}
.point{text-align:center;font-size:20px;font-weight:bold;color:#1e3a8a;margin:12px}
.status{text-align:center;padding:10px;border-radius:8px;margin:10px 0;font-weight:bold}
.done{background:#dcfce7;color:#166534}
.pending{background:#fef3c7;color:#92400e}
.content{white-space:pre-wrap;line-height:1.8}
.user{text-align:center;color:#64748b;font-size:13px}
.msg{padding:10px;border-radius:8px;margin-top:8px}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.selector label{display:block;font-weight:bold;margin-bottom:5px;color:#1e3a8a}
</style>
</head>

<body>

<header>
<h1>🙏 100 Prayer Points</h1>
<p>100 prayer points • Every year</p>
</header>

<main>

<div id="login" class="card">
<h3>🔐 Private Prayer</h3>
<p>Sign in with your authorized Google account.</p>
<button class="google" onclick="login()">🔐 Sign in with Google</button>
<div id="loginMsg"></div>
</div>

<div id="app" class="hidden">

<div class="card">

<div class="progressText">
<span id="count">0</span> / 100 Prayer Points
</div>

<div class="progress">
<div id="bar" class="progressBar"></div>
</div>

<div id="percent" class="percent">0% Complete</div>

<div class="user" id="user"></div>

<button class="gray" onclick="logout()">🔒 Sign Out</button>

</div>

<!-- DATE + PRAYER -->

<div class="card">

<div class="today">
<div id="weekday">Today</div>
<div id="date" class="number"></div>
<div id="month"></div>
</div>

<!-- POINT SELECTOR -->

<div class="selector">

<label for="pointSelect">🙏 Select Prayer Point</label>

<select id="pointSelect" onchange="selectPoint(this.value)"></select>

</div>

<div id="point" class="point">
Prayer Point 1 of 100
</div>

<div id="status" class="status pending">
⏳ Not completed
</div>

<div id="prayer">
<h2>Loading prayer...</h2>
<div class="content">Please wait...</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">

<button
class="blue"
onclick="editSelected()">
✏️ Edit
</button>

<button
id="complete"
class="green"
onclick="markSelected()"
disabled>
✅ Mark as Completed
</button>

</div>

<div id="viewMsg"></div>

</div>

<!-- ADD / EDIT -->

<div class="card">

<h3 id="formTitle">➕ Add Prayer Point</h3>

<input
id="title"
placeholder="Prayer title">

<textarea
id="content"
placeholder="Write the full prayer..."></textarea>

<button
id="save"
class="blue"
onclick="save()">
💾 Save Prayer Point
</button>

<button
id="cancel"
class="gray hidden"
onclick="cancelEdit()">
Cancel
</button>

<div id="msg"></div>

</div>

</div>

</main>

<script>

const API="https://prayer.createlk.workers.dev";
const MAX=100;

let token=sessionStorage.getItem("prayer_token")||"";
let prayers=[];
let selectedPoint=1;
let todayPoint=1;
let editId=null;

const $=id=>document.getElementById(id);

function today(){

const d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

function pointFor(date){

const d=new Date(date+"T12:00:00");

const start=new Date(
d.getFullYear(),0,1,12
);

const day=Math.floor(
(d-start)/86400000
)+1;

return((day-1)%100)+1;

}

function getPoint(p){

if(p.prayer_point!=null&&!isNaN(Number(p.prayer_point)))
return Number(p.prayer_point);

if(p.point!=null&&!isNaN(Number(p.point)))
return Number(p.point);

if(p.day!=null&&!isNaN(Number(p.day)))
return Number(p.day);

return null;

}

function login(){
location.href=API+"/login";
}

async function api(path,opt={}){

opt.headers={
...(opt.headers||{}),
Authorization:"Bearer "+token,
"Content-Type":"application/json"
};

const r=await fetch(API+path,opt);

let d={};

try{d=await r.json()}catch{}

if(!r.ok){

if(r.status===401)logout();

throw Error(d.error||"Request failed");

}

return d;

}

async function start(){

if(!token)return;

try{

const me=await api("/me");

$("login").classList.add("hidden");
$("app").classList.remove("hidden");
$("user").textContent=me.email||"";

createSelector();

await load();

}catch(e){

$("loginMsg").innerHTML=
'<div class="msg err">'+
safe(e.message)+
'</div>';

}

}

function createSelector(){

$("pointSelect").innerHTML=
Array.from(
{length:MAX},
(_,i)=>{
const n=i+1;
return`<option value="${n}">
Prayer Point ${n}
</option>`;
}
).join("");

}

async function load(){

const year=new Date().getFullYear();

const data=await api(
"/prayers?year="+year
);

prayers=data.prayers||[];

progress();

todayPoint=pointFor(today());
selectedPoint=todayPoint;

$("pointSelect").value=todayPoint;

showDate();

await showPoint(todayPoint);

}

function progress(){

const done=prayers.filter(
p=>Number(p.completed)===1
).length;

const pct=Math.round(done);

$("count").textContent=done;
$("percent").textContent=pct+"% Complete";
$("bar").style.width=pct+"%";

if(done===100)
$("percent").textContent="🎉 100 / 100 Complete";

}

function showDate(){

const d=new Date(today()+"T12:00:00");

const days=[
"Sunday","Monday","Tuesday","Wednesday",
"Thursday","Friday","Saturday"
];

const months=[
"January","February","March","April",
"May","June","July","August",
"September","October","November","December"
];

$("weekday").textContent=days[d.getDay()];
$("date").textContent=d.getDate();
$("month").textContent=
months[d.getMonth()]+" "+d.getFullYear();

}

async function showPoint(point){

point=Number(point);

if(!Number.isFinite(point))
point=todayPoint;

selectedPoint=point;

$("pointSelect").value=point;

$("point").textContent=
"Prayer Point "+point+" of 100";

let p=prayers.find(
x=>getPoint(x)===point
);

if(!p){

try{

const data=await api(
"/today?date="+
encodeURIComponent(today())+
"&prayer_point="+point
);

if(data.prayer)
p=data.prayer;

}catch{}

}

if(!p){

$("prayer").innerHTML=
`<h2>Prayer Point ${point}</h2>
<div class="content">
No prayer has been added yet.
</div>`;

$("status").className="status pending";
$("status").textContent="⏳ Not completed";
$("complete").disabled=true;

return;

}

$("prayer").innerHTML=
`<h2>${safe(p.title)}</h2>
<div class="content">${safe(p.content)}</div>`;

$("complete").disabled=false;

if(Number(p.completed)===1){

$("status").className="status done";
$("status").textContent="✅ Completed";
$("complete").textContent="↩️ Mark as Not Completed";

}else{

$("status").className="status pending";
$("status").textContent="⏳ Not completed";
$("complete").textContent="✅ Mark as Completed";

}

}

async function selectPoint(point){

await showPoint(Number(point));

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function editSelected(){

const p=prayers.find(
x=>getPoint(x)===selectedPoint
);

if(!p){

$("viewMsg").innerHTML=
'<div class="msg err">Prayer not found.</div>';

return;

}

edit(p.id);

}

async function markSelected(){

const p=prayers.find(
x=>getPoint(x)===selectedPoint
);

if(!p)return;

const completed=
$("complete").textContent.includes("Not Completed")
?0:1;

try{

await api(
"/complete",
{
method:"POST",
body:JSON.stringify({

prayer_id:p.id,
year:new Date().getFullYear(),
prayer_point:selectedPoint,
completed

})
}
);

const keep=selectedPoint;

await load();

if(keep!==todayPoint)
await showPoint(keep);

}catch(e){

message("viewMsg",e.message,"err");

}

}

async function save(){

const point=
editId
?
getPoint(
prayers.find(
p=>Number(p.id)===editId
)
)||selectedPoint
:selectedPoint;

const title=$("title").value.trim();
const content=$("content").value.trim();

if(!title||!content){

message(
"msg",
"Please enter a title and prayer.",
"err"
);

return;

}

const existing=
editId
?
prayers.find(
p=>Number(p.id)===editId
)
:
prayers.find(
p=>getPoint(p)===point
);

const btn=$("save");

btn.disabled=true;
btn.textContent="Saving...";

try{

const body={
year:new Date().getFullYear(),
prayer_point:point,
title,
content
};

const result=await api(
existing
?"/prayer/"+existing.id
:"/prayer",
{
method:existing?"PUT":"POST",
body:JSON.stringify(body)
}
);

if(!result.success)
throw Error(result.error||"Save failed");

editId=null;

$("title").value="";
$("content").value="";

$("cancel").classList.add("hidden");
$("formTitle").textContent="➕ Add Prayer Point";

message("msg","✅ Saved to Cloudflare.","ok");

await load();
await showPoint(point);

}catch(e){

message("msg","❌ "+e.message,"err");

}finally{

btn.disabled=false;
btn.textContent="💾 Save Prayer Point";

}

}

function edit(id){

const p=prayers.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

const point=getPoint(p);

editId=Number(id);
selectedPoint=point||1;

$("pointSelect").value=selectedPoint;

$("title").value=p.title||"";
$("content").value=p.content||"";

$("formTitle").textContent=
"✏️ Edit Prayer Point "+selectedPoint;

$("cancel").classList.remove("hidden");

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function cancelEdit(){

editId=null;

$("title").value="";
$("content").value="";

$("cancel").classList.add("hidden");

$("formTitle").textContent=
"➕ Add Prayer Point";

}

async function logout(){

token="";

sessionStorage.removeItem("prayer_token");

location.href=location.pathname;

}

function message(id,text,type){

$(id).innerHTML=
`<div class="msg ${type}">
${safe(text)}
</div>`;

}

function safe(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

const session=
new URLSearchParams(
location.search
).get("session");

if(session){

token=session;

sessionStorage.setItem(
"prayer_token",
token
);

history.replaceState(
{},
document.title,
location.pathname
);

}

start();

</script>

</body>
</html>
