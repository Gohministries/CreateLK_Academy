<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post a Job | CreateLK Jobs</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial;background:#f5f7fb;color:#172033}
a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid #ddd}
nav{max-width:900px;margin:auto;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}.logo span{color:#2563eb}
nav a{font-size:14px;font-weight:700;margin-left:15px}
.login{color:#2563eb}
main{max-width:700px;margin:30px auto;padding:0 15px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:25px}
h1{font-size:25px;margin-bottom:7px}
.sub{color:#666;font-size:13px;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
input,select,textarea{
width:100%;padding:12px;border:1px solid #d1d5db;
border-radius:7px;outline:0;background:#fff
}
textarea{min-height:130px;resize:vertical}
button{
width:100%;margin-top:22px;padding:13px;border:0;
border-radius:8px;background:#2563eb;color:#fff;
font-weight:800;cursor:pointer
}
button:disabled{opacity:.6}
.msg{text-align:center;margin-top:15px;font-size:13px}
footer{text-align:center;padding:30px;color:#777;font-size:12px}
</style>
</head>

<body>

<header>
<nav>
<a href="index.html" class="logo">CreateLK <span>Jobs</span></a>
<div>
<a href="jobs.html">Find Jobs</a>
<a href="login.html" class="login">Login</a>
</div>
</nav>
</header>

<main>
<div class="card">

<h1>Post a Job</h1>
<p class="sub">Reach job seekers across Sri Lanka.</p>

<form id="form">

<label>Job Title *</label>
<input id="title" required placeholder="e.g. Sales Executive">

<label>Company Name *</label>
<input id="company" required placeholder="Company name">

<label>Category *</label>
<select id="category" required>
<option value="">Select category</option>
<option>IT & Software</option>
<option>Accounting & Finance</option>
<option>Sales & Marketing</option>
<option>Administration</option>
<option>Education</option>
<option>Healthcare</option>
<option>Hospitality</option>
<option>Engineering</option>
<option>Construction</option>
<option>Driving</option>
<option>Security</option>
<option>Retail</option>
<option>Other</option>
</select>

<label>Location *</label>
<input id="location" required placeholder="e.g. Colombo">

<label>Job Type *</label>
<select id="type" required>
<option value="">Select type</option>
<option>Full Time</option>
<option>Part Time</option>
<option>Contract</option>
<option>Internship</option>
<option>Freelance</option>
</select>

<label>Work Location</label>
<select id="work_location">
<option value="">Select</option>
<option>On-site</option>
<option>Remote</option>
<option>Hybrid</option>
</select>

<label>Salary</label>
<input id="salary" placeholder="e.g. LKR 50,000 - 75,000">

<label>Job Description *</label>
<textarea id="description" required
placeholder="Describe the job, responsibilities and experience required"></textarea>

<label>Requirements</label>
<textarea id="requirements"
placeholder="Qualifications, skills and other requirements"></textarea>

<label>Application Email</label>
<input id="email" type="email"
placeholder="hr@example.com">

<button id="submit" type="submit">
Post Job
</button>

<div id="msg" class="msg"></div>

</form>

</div>
</main>

<footer>
© 2026 CreateLK Jobs
</footer>

<script>

const API="https://jobs.createlk.com/api";

const form=document.getElementById("form");
const msg=document.getElementById("msg");
const btn=document.getElementById("submit");

form.addEventListener("submit",async e=>{

e.preventDefault();

btn.disabled=true;
btn.textContent="Posting...";
msg.textContent="";

const data={
title:title.value.trim(),
company:company.value.trim(),
category:category.value,
location:location.value.trim(),
type:type.value,
work_location:work_location.value,
salary:salary.value.trim(),
description:description.value.trim(),
requirements:requirements.value.trim(),
email:email.value.trim()
};

try{

const r=await fetch(API+"/jobs",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

const result=await r.json().catch(()=>({}));

if(!r.ok){
throw Error(result.message||"Unable to post job");
}

msg.textContent="Job posted successfully.";

form.reset();

}catch(err){

msg.textContent=err.message;

}

btn.disabled=false;
btn.textContent="Post Job";

});

</script>

</body>
</html>
