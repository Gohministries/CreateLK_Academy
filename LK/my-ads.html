<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Ads | CreateLK Jobs</title>

<meta name="description"
content="Manage your job ads on CreateLK Jobs.">

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.5
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:20
}

.header{
  max-width:1100px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
  color:#172033;
  font-size:19px;
  font-weight:700
}

.brand img{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:8px
}

.nav{
  display:flex;
  gap:8px;
  align-items:center
}

.nav a{
  text-decoration:none;
  color:#334155;
  font-weight:600;
  padding:8px 11px;
  border-radius:8px
}

.nav a:hover{
  background:#f1f5f9
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 16px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px
}

h1{
  font-size:28px;
  margin-bottom:3px
}

.subtitle{
  color:#64748b
}

.post{
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  border-radius:9px;
  font-weight:700;
  white-space:nowrap
}

.post:hover{
  background:#1d4ed8
}

.message{
  display:none;
  padding:13px;
  border-radius:9px;
  margin-bottom:18px;
  font-weight:600
}

.message.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
  border:1px solid #fecaca
}

.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:35px;
  text-align:center;
  color:#64748b
}

.empty{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:45px 20px;
  text-align:center
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px
}

.empty h2{
  margin-bottom:6px
}

.empty p{
  color:#64748b;
  margin-bottom:20px
}

.empty a{
  display:inline-block;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:11px 18px;
  border-radius:9px;
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px
}

.ad{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.04)
}

.ad-top{
  display:flex;
  gap:15px;
  padding:16px
}

.photo{
  width:150px;
  height:115px;
  flex-shrink:0;
  background:#eef2f7;
  border-radius:10px;
  overflow:hidden
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.no-photo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#94a3b8;
  font-size:13px
}

.info{
  min-width:0;
  flex:1
}

.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:5px;
  word-break:break-word
}

.description{
  color:#64748b;
  font-size:14px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  font-weight:700
}

.free{
  background:#f1f5f9;
  color:#475569
}

.featured{
  background:#fef3c7;
  color:#92400e
}

.urgent{
  background:#fee2e2;
  color:#991b1b
}

.top-ad{
  background:#ede9fe;
  color:#6d28d9
}

.combined{
  background:#dbeafe;
  color:#1e40af
}

.pending{
  background:#fef3c7;
  color:#92400e
}

.approved{
  background:#dcfce7;
  color:#166534
}

.rejected{
  background:#fee2e2;
  color:#991b1b
}

.payment-pending{
  background:#fef3c7;
  color:#92400e
}

.payment-approved{
  background:#dcfce7;
  color:#166534
}

.payment-rejected{
  background:#fee2e2;
  color:#991b1b
}

.details{
  border-top:1px solid #e5e7eb;
  padding:14px 16px
}

.detail{
  display:flex;
  gap:8px;
  margin-bottom:6px;
  font-size:14px
}

.detail:last-child{
  margin-bottom:0
}

.detail-label{
  color:#64748b;
  min-width:78px
}

.detail-value{
  font-weight:600;
  word-break:break-word
}

.rejection{
  margin-top:12px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  border-radius:9px;
  padding:10px;
  font-size:13px
}

.actions{
  border-top:1px solid #e5e7eb;
  padding:13px 16px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.actions a{
  text-decoration:none;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:700
}

.view{
  background:#2563eb;
  color:#fff
}

.refresh{
  background:#f1f5f9;
  color:#334155
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr
  }

}

@media(max-width:600px){

  .header{
    padding:10px 13px
  }

  .brand span{
    display:none
  }

  .nav a{
    padding:7px
  }

  .nav a:first-child{
    display:none
  }

  main{
    margin-top:20px
  }

  .top{
    align-items:flex-start;
    flex-direction:column
  }

  .post{
    width:100%;
    text-align:center
  }

  .ad-top{
    flex-direction:column
  }

  .photo{
    width:100%;
    height:190px
  }

}
</style>
</head>

<body>

<header>

<div class="header">

<a
href="../index.html"
class="brand">

<img
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">

<span>CreateLK Jobs</span>

</a>

<nav class="nav">

<a href="dashboard.html">
Dashboard
</a>

<a href="post-ad.html">
Post Ad
</a>

</nav>

</div>

</header>


<main>

<div class="top">

<div>

<h1>My Ads</h1>

<p class="subtitle">
Manage your submitted job ads.
</p>

</div>

<a
href="post-ad.html"
class="post">

+ Post an Ad

</a>

</div>


<div
id="message"
class="message">
</div>


<div
id="loading"
class="loading">

Loading your ads...

</div>


<div
id="empty"
class="empty">

<div class="empty-icon">
📢
</div>

<h2>
No Ads Yet
</h2>

<p>
You have not posted any ads yet.
</p>

<a href="post-ad.html">
Post Your First Ad
</a>

</div>


<div
id="ads"
class="grid">
</div>

</main>


<script>

const API =
"https://ads.createlk.workers.dev";

const LOGIN =
"https://login.createlk.workers.dev";

const TOKEN =
"createlk_session_token";


const $ =
id => document.getElementById(id);


function getToken(){

return (
localStorage.getItem(TOKEN) ||
sessionStorage.getItem(TOKEN)
);

}


function logout(){

localStorage.removeItem(TOKEN);
sessionStorage.removeItem(TOKEN);

localStorage.removeItem(
"createlk_user"
);

location.href =
"login.html";

}


function showError(text){

$("loading").style.display =
"none";

$("message").textContent =
text;

$("message").className =
"message error";

}


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function formatDate(value){

if(!value)
return "-";

const d =
new Date(value.replace(" ","T"));

if(
Number.isNaN(d.getTime())
)
return value;

return d.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


function typeName(type){

switch(type){

case "featured":
return "Featured Ad";

case "urgent":
return "Urgent Ad";

case "top":
return "Top Ad";

case "featured_urgent_top":
return "Featured + Urgent + Top";

default:
return "Free Ad";

}

}


function typeClass(type){

switch(type){

case "featured":
return "featured";

case "urgent":
return "urgent";

case "top":
return "top-ad";

case "featured_urgent_top":
return "combined";

default:
return "free";

}

}


function statusClass(status){

if(status==="approved")
return "approved";

if(status==="rejected")
return "rejected";

return "pending";

}


function statusName(status){

if(status==="approved")
return "Approved";

if(status==="rejected")
return "Rejected";

return "Pending Approval";

}


function paymentClass(status){

if(status==="approved")
return "payment-approved";

if(status==="rejected")
return "payment-rejected";

return "payment-pending";

}


function paymentName(status){

if(status==="approved")
return "Payment Approved";

if(status==="rejected")
return "Payment Rejected";

return "Payment Pending";

}


function photoURL(key){

if(!key)
return "";

if(
key.startsWith("http://") ||
key.startsWith("https://")
){

return key;

}

return `${API}/photo?key=${encodeURIComponent(key)}`;

}


function renderAd(ad){

const photo =
photoURL(
ad.photo_url ||
ad.photo_key ||
""
);


const location = [
ad.city,
ad.district,
ad.province
]
.filter(Boolean)
.join(", ");


let payment = "";

if(
ad.ad_type &&
ad.ad_type!=="free"
){

payment = `
<span class="badge ${paymentClass(
ad.payment_status
)}">
${escapeHTML(
paymentName(ad.payment_status)
)}
</span>
`;

}


let rejection = "";

if(
ad.rejection_reason
){

rejection = `
<div class="rejection">
<strong>Rejection reason:</strong>
${escapeHTML(ad.rejection_reason)}
</div>
`;

}


let photoHTML = `
<div class="no-photo">
No photo
</div>
`;

if(photo){

photoHTML = `
<img
src="${escapeHTML(photo)}"
alt="${escapeHTML(ad.title)}"
loading="lazy"
onerror="this.parentElement.innerHTML='<div class=&quot;no-photo&quot;>Photo unavailable</div>'">
`;

}


let viewButton = "";

if(
ad.status==="approved"
){

viewButton = `
<a
class="view"
href="jobs.html?id=${encodeURIComponent(ad.id)}">
View Ad
</a>
`;

}


return `

<article class="ad">

<div class="ad-top">

<div class="photo">
${photoHTML}
</div>

<div class="info">

<div class="title">
${escapeHTML(ad.title)}
</div>

<div class="description">
${escapeHTML(ad.description)}
</div>

<div class="badges">

<span class="badge ${typeClass(ad.ad_type)}">
${escapeHTML(typeName(ad.ad_type))}
</span>

<span class="badge ${statusClass(ad.status)}">
${escapeHTML(statusName(ad.status))}
</span>

${payment}

</div>

</div>

</div>


<div class="details">

<div class="detail">

<span class="detail-label">
Location
</span>

<span class="detail-value">
${escapeHTML(location || "-")}
</span>

</div>


<div class="detail">

<span class="detail-label">
WhatsApp
</span>

<span class="detail-value">
${escapeHTML(ad.whatsapp_no || "-")}
</span>

</div>


<div class="detail">

<span class="detail-label">
Call
</span>

<span class="detail-value">
${escapeHTML(ad.call_no || "-")}
</span>

</div>


<div class="detail">

<span class="detail-label">
Submitted
</span>

<span class="detail-value">
${escapeHTML(
formatDate(ad.created_at)
)}
</span>

</div>


${
ad.approved_at
?
`
<div class="detail">

<span class="detail-label">
Approved
</span>

<span class="detail-value">
${escapeHTML(
formatDate(ad.approved_at)
)}
</span>

</div>
`
:
""
}


${
ad.expires_at
?
`
<div class="detail">

<span class="detail-label">
Expires
</span>

<span class="detail-value">
${escapeHTML(
formatDate(ad.expires_at)
)}
</span>

</div>
`
:
""
}


${rejection}

</div>


<div class="actions">

${viewButton}

<a
class="refresh"
href="post-ad.html">

+ Post New Ad

</a>

</div>

</article>

`;

}


async function loadAds(){

const token =
getToken();


if(!token){

location.href =
"login.html";

return;

}


$("loading").style.display =
"block";

$("empty").style.display =
"none";

$("ads").innerHTML =
"";


try{

const r =
await fetch(
`${API}/my-ads`,
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);


let data = {};

try{

data =
await r.json();

}catch{

data = {};

}


if(
r.status===401 ||
r.status===403
){

logout();

return;

}


if(!r.ok){

throw Error(
data.error ||
"Could not load your ads."
);

}


const ads =
Array.isArray(data.ads)
? data.ads
: Array.isArray(data.data)
? data.data
: [];


$("loading").style.display =
"none";


if(!ads.length){

$("empty").style.display =
"block";

return;

}


$("ads").innerHTML =
ads.map(renderAd).join("");


}catch(error){

console.error(error);

showError(
error.message ||
"Could not load your ads. Please try again."
);

}

}


/* START */

loadAds();

</script>

</body>
</html>
