<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Admin Login | CreateLK Jobs</title>

<link
  rel="icon"
  href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:16px;
  padding:35px 28px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:15px;
}

h1{
  font-size:26px;
  margin-bottom:8px;
}

.sub{
  color:#687386;
  margin-bottom:25px;
  line-height:1.5;
}

.google{
  width:100%;
  border:1px solid #d5dbe4;
  background:#fff;
  color:#202124;
  border-radius:9px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google:hover{
  background:#f7f9fc;
}

.google:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.notice{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:8px;
  background:#ffe9e9;
  color:#b42318;
  font-size:14px;
  font-weight:600;
  line-height:1.5;
}

.loading{
  display:none;
  margin-top:15px;
  color:#687386;
  font-size:14px;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#1261d6;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

</style>

</head>

<body>

<div class="card">

<img
  class="logo"
  src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
  alt="CreateLK Jobs">

<h1>Admin Login</h1>

<p class="sub">
Sign in with the authorized Google account to access the CreateLK Jobs Admin Dashboard.
</p>

<div
  id="notice"
  class="notice">
</div>

<button
  id="googleLogin"
  class="google"
  type="button">
Continue with Google
</button>

<div
  id="loading"
  class="loading">
Signing in...
</div>

<a
  class="back"
  href="../index.html">
← Back to CreateLK Jobs
</a>

</div>

<script>

const ADMIN_LOGIN =
  "https://admin-login.createlk.workers.dev";

const TOKEN =
  "createlk_session_token";


/* =========================
   ERROR
========================= */

function showError(message){

  const notice =
    document.getElementById("notice");

  notice.textContent =
    message;

  notice.style.display =
    "block";
}


/* =========================
   TOKEN
========================= */

function saveToken(token){

  localStorage.setItem(
    TOKEN,
    token
  );

  sessionStorage.setItem(
    TOKEN,
    token
  );
}


function removeToken(){

  localStorage.removeItem(
    TOKEN
  );

  sessionStorage.removeItem(
    TOKEN
  );
}


/* =========================
   EXCHANGE TICKET
========================= */

async function exchangeTicket(ticket){

  const loading =
    document.getElementById("loading");

  const button =
    document.getElementById("googleLogin");


  loading.style.display =
    "block";

  button.disabled =
    true;

  button.style.display =
    "none";


  try{

    const response =
      await fetch(
        ADMIN_LOGIN + "/exchange",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              ticket:ticket
            })
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch{

      data = {};

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Administrator login failed."
      );

    }


    if(!data.token){

      throw new Error(
        "No administrator session was returned."
      );

    }


    /*
      The Worker has already verified:
      - ticket
      - ticket expiry
      - session
      - session expiry
      - administrator email
    */

    saveToken(
      data.token
    );


    /*
      Remove ticket from browser URL.
    */

    history.replaceState(
      {},
      document.title,
      location.pathname
    );


    /*
      Go directly to admin dashboard.
    */

    location.replace(
      "admin.html"
    );


  }catch(error){

    removeToken();

    showError(
      error?.message ||
      "Administrator login failed."
    );

    button.style.display =
      "block";

    button.disabled =
      false;

  }finally{

    loading.style.display =
      "none";

  }

}


/* =========================
   GOOGLE LOGIN BUTTON
========================= */

document
  .getElementById("googleLogin")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        ADMIN_LOGIN + "/login";

    }
  );


/* =========================
   READ TICKET
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const ticket =
  params.get("ticket");


if(ticket){

  exchangeTicket(
    ticket
  );

}

</script>

</body>

</html>
