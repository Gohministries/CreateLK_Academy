<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | CreateLK Jobs</title>

  <link rel="icon" type="image/png"
    href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #102a56;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e8edf5;
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      height: 42px;
      width: auto;
      display: block;
    }

    .home-link {
      color: #102a56;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 36px;
      box-shadow:
        0 10px 35px rgba(16, 42, 86, 0.08);
      border: 1px solid #edf1f7;
      text-align: center;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      border-radius: 16px;
      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #102a56;
    }

    .subtitle {
      color: #68758a;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .google-button {
      width: 100%;
      min-height: 52px;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      background: #ffffff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .google-button:hover {
      background: #f8f9fa;
      border-color: #c9ced8;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .google-button:active {
      transform: translateY(1px);
    }

    .google-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .security-note {
      margin-top: 22px;
      font-size: 12px;
      line-height: 1.5;
      color: #8a94a6;
    }

    footer {
      padding: 22px 20px;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid #e8edf5;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 10px;
    }

    .footer-links a {
      color: #68758a;
      text-decoration: none;
      font-size: 13px;
    }

    .footer-links a:hover {
      color: #102a56;
      text-decoration: underline;
    }

    .copyright {
      color: #9aa3b2;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 18px;
      }

      .logo {
        height: 36px;
      }

      .home-link {
        font-size: 13px;
      }

      main {
        padding: 30px 16px;
      }

      .login-card {
        padding: 34px 24px;
        border-radius: 16px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <a href="https://createlk.com/">
        <img
          class="logo"
          src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
          alt="CreateLK Jobs">
      </a>

      <a
        class="home-link"
        href="https://createlk.com/">
        Home
      </a>

    </div>
  </header>

  <main>

    <section class="login-card">

      <img
        class="login-icon"
        src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
        alt="CreateLK Jobs">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Sign in securely with your Google account to continue to CreateLK Jobs.
      </p>

      <a
        class="google-button"
        href="https://login.createlk.workers.dev/login">

        <svg
          class="google-icon"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            fill="#4285F4"
            d="M21.35 12.27c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>
          <path
            fill="#34A853"
            d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"/>
          <path
            fill="#FBBC05"
            d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.09.31-1.58V7.89H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.11l3.24-2.53z"/>
          <path
            fill="#EA4335"
            d="M12 6.39c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.45 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39z"/>
        </svg>

        <span>Continue with Google</span>

      </a>

      <p class="security-note">
        Your Google account is used securely to authenticate your session.
      </p>

    </section>

  </main>

  <footer>

    <div class="footer-links">
      <a href="https://createlk.com/LK/terms.html">Terms</a>
      <a href="https://createlk.com/LK/privacy.html">Privacy</a>
      <a href="https://createlk.com/LK/refund.html">Refund</a>
      <a href="https://createlk.com/LK/contact.html">Contact</a>
    </div>

    <div class="copyright">
      © 2026 CreateLK Jobs. All rights reserved.
    </div>

  </footer>

</body>
</html>
