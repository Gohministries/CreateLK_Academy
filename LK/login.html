<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | CreateLK Jobs</title>

<style>
*{box-sizing:border-box;margin:0}
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.card{
width:100%;
max-width:400px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:30px;
text-align:center
}
.logo{
font-size:23px;
font-weight:800;
margin-bottom:35px
}
.logo span{color:#2563eb}
h1{font-size:24px;margin-bottom:8px}
p{font-size:14px;color:#6b7280;margin-bottom:25px}
.google{
width:100%;
height:50px;
border:1px solid #d1d5db;
border-radius:8px;
background:#fff;
font-weight:700;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:10px
}
.google:hover{background:#f9fafb}
.g{
font-size:20px;
font-weight:800
}
.back{
display:block;
margin-top:22px;
font-size:13px;
color:#2563eb
}
.msg{
margin-top:18px;
font-size:13px;
color:#666
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
CreateLK <span>Jobs</span>
</div>

<h1>Welcome to CreateLK Jobs</h1>

<p>
Sign in to apply for jobs or post vacancies.
</p>

<button class="google" id="googleBtn">
<span class="g">G</span>
Continue with Google
</button>

<div class="msg" id="msg"></div>

<a href="index.html" class="back">
← Back to CreateLK Jobs
</a>

</div>

<script>

const GOOGLE_LOGIN_URL =
"https://jobs.createlk.com/api/auth/google";

document.getElementById("googleBtn")
.addEventListener("click",function(){

this.disabled=true;
this.textContent="Connecting...";

window.location.href=GOOGLE_LOGIN_URL;

});

</script>

</body>
</html>
