<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e4e8ef;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.logout{
  border:0;
  background:#172033;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

h1{
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  color:#687386;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:12px;
  padding:20px;
}

.stat-title{
  color:#687386;
  font-size:14px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}

.section{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.section h2{
  font-size:20px;
  margin-bottom:18px;
}

.card{
  border:1px solid #e4e8ef;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  background:#fff;
}

.card:last-child{
  margin-bottom:0;
}

.info h3{
  font-size:19px;
  margin-bottom:10px;
}

.info p{
  margin:6px 0;
  color:#566174;
  line-height:1.5;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
}

button{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.approve{
  background:#16803c;
  color:#fff;
}

.reject{
  background:#c62828;
  color:#fff;
}

.view{
  background:#1261d6;
  color:#fff;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.photo-box{
  margin-top:16px;
  display:none;
  background:#f7f9fc;
  border:1px solid #e4e8ef;
  border-radius:10px;
  padding:12px;
}

.photo-box img{
  width:100%;
  max-width:600px;
  max-height:600px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:8px;
  background:#fff;
}

.slip-frame{
  width:100%;
  min-height:600px;
  border:0;
  border-radius:8px;
  background:#fff;
}

.empty{
  color:#687386;
  padding:10px 0;
}

.error{
  background:#ffe9e9;
  color:#b42318;
  padding:12px;
  border-radius:8px;
  margin-bottom:20px;
  display:none;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:500px;
  border-radius:14px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-box h2{
  margin-bottom:8px;
}

.modal-box p{
  color:#687386;
  margin-bottom:18px;
}

.reason-list{
  display:grid;
  gap:9px;
  margin-bottom:15px;
}

.reason-option{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #e4e8ef;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
}

.reason-option input{
  width:17px;
  height:17px;
}

.custom-reason{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid #d5dbe5;
  border-radius:8px;
  padding:11px;
  font:inherit;
  display:none;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.cancel{
  background:#e9edf3;
  color:#172033;
}

.confirm-reject{
  background:#c62828;
  color:#fff;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:20px 12px 50px;
  }

  .section{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
<div class="nav">

  <div class="brand">
    <img
      src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
      alt="CreateLK Jobs">
    <span>CreateLK Jobs Admin</span>
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>
</header>

<div class="container">

<h1>Admin Dashboard</h1>

<p class="subtitle">
Manage job advertisements and payment approvals.
</p>

<div id="error" class="error"></div>

<div class="stats">

  <div class="stat">
    <div class="stat-title">Pending Ads</div>
    <div id="pendingAds" class="stat-value">0</div>
  </div>

  <div class="stat">
    <div class="stat-title">Approved Ads</div>
    <div id="approvedAds" class="stat-value">0</div>
  </div>

  <div class="stat">
    <div class="stat-title">Rejected Ads</div>
    <div id="rejectedAds" class="stat-value">0</div>
  </div>

  <div class="stat">
    <div class="stat-title">Pending Payments</div>
    <div id="pendingPayments" class="stat-value">0</div>
  </div>

</div>


<div class="section">

<h2>Pending Advertisements</h2>

<div id="adsList">
  <div class="empty">Loading...</div>
</div>

</div>


<div class="section">

<h2>Pending Payments</h2>

<div id="paymentsList">
  <div class="empty">Loading...</div>
</div>

</div>

</div>


<!-- REJECTION MODAL -->

<div id="rejectModal" class="modal">

<div class="modal-box">

<h2 id="rejectTitle">
Reject Advertisement
</h2>

<p>
Select a reason for rejection.
</p>

<div class="reason-list">

<label class="reason-option">
<input
  type="radio"
  name="rejectReason"
  value="Invalid job information">
<span>Invalid job information</span>
</label>

<label class="reason-option">
<input
  type="radio"
  name="rejectReason"
  value="Photo not acceptable">
<span>Photo not acceptable</span>
</label>

<label class="reason-option">
<input
  type="radio"
  name="rejectReason"
  value="Duplicate advertisement">
<span>Duplicate advertisement</span>
</label>

<label class="reason-option">
<input
  type="radio"
  name="rejectReason"
  value="Payment issue">
<span>Payment issue</span>
</label>

<label class="reason-option">
<input
  type="radio"
  name="rejectReason"
  value="Other">
<span>Other</span>
</label>

</div>

<textarea
  id="customReason"
  class="custom-reason"
  placeholder="Enter rejection reason...">
</textarea>

<div class="modal-actions">

<button
  class="cancel"
  onclick="closeRejectModal()">
Cancel
</button>

<button
  class="confirm-reject"
  onclick="confirmReject()">
Reject
</button>

</div>

</div>
</div>


<script>

const API =
  "https://admin.createlk.workers.dev";

const TOKEN =
  "createlk_session_token";

let rejectType = "";
let rejectId = "";


/* TOKEN */

function getToken(){

  return (
    localStorage.getItem(TOKEN) ||
    sessionStorage.getItem(TOKEN) ||
    ""
  );
}


/* API */

async function api(path, options = {}){

  const token = getToken();

  if(!token){
    location.href = "admin-login.html";
    return null;
  }

  options.headers = {
    ...(options.headers || {}),
    "Authorization":
      "Bearer " + token,
    "Content-Type":
      "application/json"
  };

  const response =
    await fetch(API + path, options);

  if(
    response.status === 401 ||
    response.status === 403
  ){

    localStorage.removeItem(TOKEN);
    sessionStorage.removeItem(TOKEN);

    location.href =
      "admin-login.html";

    return null;
  }

  let data = {};

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){
    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}


/* ERROR */

function showError(message){

  const box =
    document.getElementById("error");

  box.textContent =
    message;

  box.style.display =
    "block";
}


/* ESCAPE */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* STATS */

async function loadStats(){

  const data =
    await api("/stats");

  if(!data) return;

  document.getElementById(
    "pendingAds"
  ).textContent =
    data.pending_ads ?? 0;

  document.getElementById(
    "approvedAds"
  ).textContent =
    data.approved_ads ?? 0;

  document.getElementById(
    "rejectedAds"
  ).textContent =
    data.rejected_ads ?? 0;

  document.getElementById(
    "pendingPayments"
  ).textContent =
    data.pending_payments ?? 0;
}


/* ADS */

async function loadAds(){

  const box =
    document.getElementById("adsList");

  try{

    const data =
      await api("/ads");

    if(!data) return;

    const ads =
      data.ads || [];

    if(!ads.length){

      box.innerHTML =
        '<div class="empty">No pending advertisements.</div>';

      return;
    }

    box.innerHTML =
      ads.map(ad => {

        const photo =
          ad.photo_url ||
          "";

        const photoId =
          "photo-" + ad.id;

        return `

<div class="card">

<div class="info">

<h3>
${esc(ad.title || "Untitled Ad")}
</h3>

<p>
<strong>Ad ID:</strong>
${esc(ad.id)}
</p>

<p>
<strong>Type:</strong>
${esc(ad.ad_type)}
</p>

<p>
<strong>Location:</strong>
${esc([
  ad.province,
  ad.district,
  ad.city
].filter(Boolean).join(", "))}
</p>

<p>
<strong>Status:</strong>
${esc(ad.status)}
</p>

<p>
<strong>User:</strong>
${esc(ad.user_name || "")}
</p>

<p>
<strong>Email:</strong>
${esc(ad.user_email || "")}
</p>

${
  ad.description
  ?
  `<p>
  <strong>Description:</strong>
  ${esc(ad.description)}
  </p>`
  :
  ""
}

</div>

<div class="actions">

${
photo
?
`
<button
class="view"
onclick="toggleAdPhoto(
'${photoId}',
'${encodeURIComponent(photo)}'
)">
View Ad Photo
</button>
`
:
`
<button class="view" disabled>
No Ad Photo
</button>
`
}

<button
class="approve"
onclick="approveAd('${ad.id}')">
Approve
</button>

<button
class="reject"
onclick="openRejectModal(
'ad',
'${ad.id}'
)">
Reject
</button>

</div>

<div
id="${photoId}"
class="photo-box">
</div>

</div>

`;

      }).join("");

  }catch(error){

    box.innerHTML =
      '<div class="empty">Failed to load advertisements.</div>';

    showError(error.message);
  }
}


/* AD PHOTO */

async function toggleAdPhoto(boxId, encodedKey){

  const box =
    document.getElementById(boxId);

  if(box.style.display === "block"){

    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  const key =
    decodeURIComponent(encodedKey);

  const url =
    API +
    "/photo?key=" +
    encodeURIComponent(key);

  box.innerHTML = `
    <img
      src="${url}"
      alt="Ad photo"
      onerror="
        this.parentElement.innerHTML=
        '<p class=&quot;empty&quot;>Unable to load this ad photo.</p>'
      ">
  `;

  box.style.display = "block";
}


/* APPROVE AD */

async function approveAd(id){

  if(
    !confirm(
      "Approve this advertisement?"
    )
  ) return;

  try{

    await api(
      "/ads/" +
      encodeURIComponent(id) +
      "/approve",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(error.message);
  }
}


/* OPEN REJECT MODAL */

function openRejectModal(type, id){

  rejectType = type;
  rejectId = id;

  document.getElementById(
    "rejectTitle"
  ).textContent =
    type === "ad"
    ?
    "Reject Advertisement"
    :
    "Reject Payment";

  document.querySelectorAll(
    'input[name="rejectReason"]'
  ).forEach(input => {
    input.checked = false;
  });

  document.getElementById(
    "customReason"
  ).value = "";

  document.getElementById(
    "customReason"
  ).style.display = "none";

  document.getElementById(
    "rejectModal"
  ).style.display = "flex";
}


/* CLOSE MODAL */

function closeRejectModal(){

  document.getElementById(
    "rejectModal"
  ).style.display = "none";

  rejectType = "";
  rejectId = "";
}


/* REASON CHANGE */

document.addEventListener(
  "change",
  function(event){

    if(
      event.target.name !==
      "rejectReason"
    ) return;

    const custom =
      document.getElementById(
        "customReason"
      );

    if(
      event.target.value ===
      "Other"
    ){
      custom.style.display =
        "block";
      custom.focus();
    }else{
      custom.style.display =
        "none";
      custom.value = "";
    }
  }
);


/* CONFIRM REJECT */

async function confirmReject(){

  const selected =
    document.querySelector(
      'input[name="rejectReason"]:checked'
    );

  if(!selected){

    alert(
      "Please select a rejection reason."
    );

    return;
  }

  let reason =
    selected.value;

  if(reason === "Other"){

    reason =
      document.getElementById(
        "customReason"
      ).value.trim();

    if(!reason){

      alert(
        "Please enter the rejection reason."
      );

      return;
    }
  }

  if(!rejectType || !rejectId){
    return;
  }

  try{

    const endpoint =
      rejectType === "ad"
      ?
      "/ads/" +
      encodeURIComponent(rejectId) +
      "/reject"
      :
      "/payments/" +
      encodeURIComponent(rejectId) +
      "/reject";

    await api(
      endpoint,
      {
        method:"POST",
        body:JSON.stringify({
          rejection_reason:
            reason
        })
      }
    );

    closeRejectModal();

    await load();

  }catch(error){

    showError(error.message);
  }
}


/* PAYMENTS */

async function loadPayments(){

  const box =
    document.getElementById(
      "paymentsList"
    );

  try{

    const data =
      await api("/payments");

    if(!data) return;

    const payments =
      data.payments || [];

    if(!payments.length){

      box.innerHTML =
        '<div class="empty">No pending payments.</div>';

      return;
    }

    box.innerHTML =
      payments.map(payment => {

        const slipKey =
          payment.slip_url ||
          "";

        const frameId =
          "slip-" +
          payment.id;

        return `

<div class="card">

<div class="info">

<h3>
Payment #${esc(payment.id)}
</h3>

<p>
<strong>Ad ID:</strong>
${esc(payment.ad_id)}
</p>

<p>
<strong>Ad:</strong>
${esc(payment.ad_title || "")}
</p>

<p>
<strong>Amount:</strong>
LKR ${esc(payment.amount)}
</p>

<p>
<strong>Status:</strong>
${esc(payment.status)}
</p>

<p>
<strong>Depositor:</strong>
${esc(payment.user_name || "")}
</p>

${
payment.deposit_date
?
`
<p>
<strong>Deposit Date:</strong>
${esc(payment.deposit_date)}
</p>
`
:
""
}

${
payment.reference_number
?
`
<p>
<strong>Reference:</strong>
${esc(payment.reference_number)}
</p>
`
:
""
}

</div>

<div class="actions">

${
slipKey
?
`
<button
class="view"
onclick="toggleSlip(
'${frameId}',
'${encodeURIComponent(slipKey)}'
)">
View Payment Slip
</button>
`
:
`
<button
class="view"
disabled>
No Payment Slip
</button>
`
}

<button
class="approve"
onclick="approvePayment('${payment.id}')">
Approve Payment
</button>

<button
class="reject"
onclick="openRejectModal(
'payment',
'${payment.id}'
)">
Reject Payment
</button>

</div>

<div
id="${frameId}"
class="photo-box">
</div>

</div>

`;

      }).join("");

  }catch(error){

    box.innerHTML =
      '<div class="empty">Failed to load payments.</div>';

    showError(error.message);
  }
}


/* PAYMENT SLIP */

async function toggleSlip(
  boxId,
  encodedKey
){

  const box =
    document.getElementById(boxId);

  if(box.style.display === "block"){

    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  const key =
    decodeURIComponent(encodedKey);

  try{

    const token =
      getToken();

    const url =
      API +
      "/slip?key=" +
      encodeURIComponent(key);

    const response =
      await fetch(
        url,
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );

    if(!response.ok){

      throw new Error(
        "Unable to load payment slip."
      );
    }

    const blob =
      await response.blob();

    const blobUrl =
      URL.createObjectURL(blob);

    if(
      (blob.type || "")
        .toLowerCase()
        .includes("pdf")
    ){

      box.innerHTML = `
        <iframe
          class="slip-frame"
          src="${blobUrl}">
        </iframe>
      `;

    }else{

      box.innerHTML = `
        <img
          src="${blobUrl}"
          alt="Bank payment slip">
      `;
    }

    box.style.display =
      "block";

  }catch(error){

    showError(error.message);
  }
}


/* APPROVE PAYMENT */

async function approvePayment(id){

  if(
    !confirm(
      "Approve this payment?"
    )
  ) return;

  try{

    await api(
      "/payments/" +
      encodeURIComponent(id) +
      "/approve",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(error.message);
  }
}


/* LOAD */

async function load(){

  document.getElementById(
    "error"
  ).style.display = "none";

  await Promise.all([
    loadStats(),
    loadAds(),
    loadPayments()
  ]);
}


/* LOGOUT */

function logout(){

  localStorage.removeItem(TOKEN);
  sessionStorage.removeItem(TOKEN);

  location.href =
    "admin-login.html";
}


/* START */

if(!getToken()){

  location.href =
    "admin-login.html";

}else{

  load();
}

</script>

</body>
</html>
