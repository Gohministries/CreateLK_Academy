<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Login | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:16px;
  padding:35px 28px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:15px;
}

h1{
  font-size:26px;
  margin-bottom:8px;
}

.sub{
  color:#687386;
  margin-bottom:25px;
  line-height:1.5;
}

.google{
  width:100%;
  border:1px solid #d5dbe4;
  background:#fff;
  color:#202124;
  border-radius:9px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google:hover{
  background:#f7f9fc;
}

.notice{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:8px;
  background:#ffe9e9;
  color:#b42318;
  font-size:14px;
  font-weight:600;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#1261d6;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.loading{
  display:none;
  margin-top:15px;
  color:#687386;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<img
class="logo"
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">

<h1>Admin Login</h1>

<p class="sub">
Sign in with the authorized Google account to access the CreateLK Jobs Admin Dashboard.
</p>

<div
id="notice"
class="notice">
</div>

<button
class="google"
id="googleLogin">
Continue with Google
</button>

<div
id="loading"
class="loading">
Signing in...
</div>

<a
class="back"
href="../index.html">
← Back to CreateLK Jobs
</a>

</div>

<script>

const ADMIN_LOGIN =
"https://admin-login.createlk.workers.dev";

const ADMIN_API =
"https://admin.createlk.workers.dev";

const TOKEN =
"createlk_session_token";


function showError(message){

  const notice =
    document.getElementById("notice");

  notice.textContent =
    message;

  notice.style.display =
    "block";
}


function saveToken(token){

  localStorage.setItem(
    TOKEN,
    token
  );

  sessionStorage.setItem(
    TOKEN,
    token
  );
}


function removeToken(){

  localStorage.removeItem(TOKEN);

  sessionStorage.removeItem(TOKEN);
}


async function exchangeTicket(ticket){

  document.getElementById(
    "loading"
  ).style.display =
    "block";

  document.getElementById(
    "googleLogin"
  ).style.display =
    "none";


  try{

    const response =
      await fetch(
        ADMIN_LOGIN + "/exchange",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            ticket:ticket
          })
        }
      );


    const data =
      await response.json()
        .catch(()=>({}));


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Administrator login failed."
      );
    }


    if(!data.token){

      throw new Error(
        "No administrator session was returned."
      );
    }


    saveToken(
      data.token
    );


    /*
      Remove the one-time ticket
      from the browser URL.
    */

    history.replaceState(
      {},
      document.title,
      location.pathname
    );


    /*
      Verify with the EXISTING
      Admin Worker.
    */

    const verify =
      await fetch(
        ADMIN_API + "/stats",
        {
          method:"GET",

          headers:{
            Authorization:
              "Bearer " + data.token
          }
        }
      );


    if(!verify.ok){

      removeToken();

      if(verify.status === 403){

        throw new Error(
          "Admin access is not authorized."
        );

      }

      throw new Error(
        "Administrator session could not be verified."
      );
    }


    /*
      Successful admin login.
    */

    location.replace(
      "admin.html"
    );


  }catch(error){

    removeToken();

    showError(
      error.message ||
      "Administrator login failed."
    );

    document.getElementById(
      "googleLogin"
    ).style.display =
      "block";

  }finally{

    document.getElementById(
      "loading"
    ).style.display =
      "none";

  }
}


/*
  Start the SEPARATE admin
  Google login.
*/

document
.getElementById("googleLogin")
.addEventListener(
  "click",
  function(){

    location.href =
      ADMIN_LOGIN + "/login";

  }
);


/*
  Google callback returns here
  with a one-time ticket.
*/

const params =
  new URLSearchParams(
    window.location.search
  );

const ticket =
  params.get("ticket");


if(ticket){

  exchangeTicket(
    ticket
  );

}

</script>

</body>
</html>
