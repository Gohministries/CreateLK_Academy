<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e4e8ef;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1200px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
  color:#1261d6;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.actions{
  display:flex;
  gap:8px;
}

button,
.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
  text-decoration:none;
}

.home{
  background:#edf3ff;
  color:#1261d6;
}

.logout,
.reject{
  background:#ffe9e9;
  color:#c62828;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

h1{
  font-size:30px;
  margin-bottom:6px;
}

.sub{
  color:#687386;
  margin-bottom:25px;
}

.notice{
  display:none;
  padding:14px;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:600;
}

.notice.error{
  display:block;
  background:#ffe9e9;
  color:#b42318;
}

.notice.success{
  display:block;
  background:#e9f8ef;
  color:#18794e;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e5eaf1;
  border-radius:12px;
  padding:20px;
}

.label{
  color:#697586;
  font-size:14px;
  margin-bottom:8px;
}

.number{
  font-size:28px;
  font-weight:800;
}

.pending{
  color:#d97706;
}

.approved{
  color:#16803c;
}

.rejected{
  color:#c62828;
}

.payments{
  color:#1261d6;
}

.panel{
  background:#fff;
  border:1px solid #e5eaf1;
  border-radius:12px;
  margin-bottom:25px;
  overflow:hidden;
}

.panel-head{
  padding:18px 20px;
  border-bottom:1px solid #e7ebf0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.panel-head h2{
  font-size:20px;
}

.refresh{
  background:#edf3ff;
  color:#1261d6;
}

.loading,
.empty{
  padding:30px;
  text-align:center;
  color:#687386;
}

.item{
  padding:20px;
  border-bottom:1px solid #edf0f4;
}

.item:last-child{
  border-bottom:0;
}

.top{
  display:flex;
  gap:18px;
}

.photo{
  width:150px;
  height:110px;
  border-radius:8px;
  object-fit:cover;
  background:#eef2f6;
}

.content{
  flex:1;
  min-width:0;
}

.title{
  font-size:19px;
  font-weight:800;
  margin-bottom:7px;
}

.description{
  color:#596579;
  line-height:1.5;
  margin-bottom:10px;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  background:#eef2f7;
}

.badge.pending{
  background:#fff4df;
  color:#a45a00;
}

.badge.free{
  background:#e8f7ed;
  color:#18794e;
}

.badge.paid{
  background:#e9f0ff;
  color:#1261d6;
}

.info{
  margin-top:8px;
  color:#687386;
  font-size:14px;
}

.buttons{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.approve{
  background:#16803c;
  color:#fff;
}

.payment{
  margin-top:15px;
  padding:14px;
  background:#f7f9fc;
  border:1px solid #e3e8ef;
  border-radius:9px;
}

.slip{
  display:inline-block;
  margin-top:10px;
  color:#1261d6;
  font-weight:700;
  text-decoration:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:20px;
}

.modal-box{
  max-width:500px;
  margin:80px auto;
  background:#fff;
  border-radius:14px;
  padding:25px;
}

.modal-box h3{
  margin-bottom:15px;
}

textarea{
  width:100%;
  min-height:120px;
  padding:12px;
  border:1px solid #ccd3dd;
  border-radius:8px;
  font:inherit;
  margin-bottom:15px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.cancel{
  background:#eef1f5;
  color:#333;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .top{
    flex-direction:column;
  }

  .photo{
    width:100%;
    height:200px;
  }

}

@media(max-width:500px){

  .container{
    padding:20px 12px;
  }

  .header{
    padding:10px 12px;
  }

  .brand span{
    font-size:17px;
  }

  .brand img{
    width:36px;
    height:36px;
  }

  .number{
    font-size:23px;
  }

  .home{
    display:none;
  }

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="brand">

<img
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">

<span>CreateLK Jobs Admin</span>

</div>

<div class="actions">

<a
class="btn home"
href="dashboard.html">
Dashboard
</a>

<button
class="btn logout"
id="logout">
Logout
</button>

</div>

</div>

</header>


<main class="container">

<h1>Admin Dashboard</h1>

<p class="sub">
Review advertisements and manage payments.
</p>

<div
id="notice"
class="notice">
</div>


<section class="stats">

<div class="stat">

<div class="label">
Pending Ads
</div>

<div
id="pending"
class="number pending">
0
</div>

</div>


<div class="stat">

<div class="label">
Approved Ads
</div>

<div
id="approved"
class="number approved">
0
</div>

</div>


<div class="stat">

<div class="label">
Rejected Ads
</div>

<div
id="rejected"
class="number rejected">
0
</div>

</div>


<div class="stat">

<div class="label">
Pending Payments
</div>

<div
id="paymentsCount"
class="number payments">
0
</div>

</div>

</section>


<section class="panel">

<div class="panel-head">

<h2>Pending Payments</h2>

<button
class="btn refresh"
onclick="load()">
Refresh
</button>

</div>

<div id="payments">

<div class="loading">
Loading...
</div>

</div>

</section>


<section class="panel">

<div class="panel-head">

<h2>Pending Ads</h2>

<button
class="btn refresh"
onclick="load()">
Refresh
</button>

</div>

<div id="ads">

<div class="loading">
Loading...
</div>

</div>

</section>

</main>


<div
class="modal"
id="modal">

<div class="modal-box">

<h3 id="modalTitle">
Reject
</h3>

<textarea
id="reason"
placeholder="Enter rejection reason...">
</textarea>

<div class="modal-actions">

<button
class="btn cancel"
onclick="closeModal()">
Cancel
</button>

<button
class="btn reject"
onclick="confirmReject()">
Reject
</button>

</div>

</div>

</div>


<script>

const API =
"https://admin.createlk.workers.dev";

const LOGIN =
"https://login.createlk.workers.dev";

const TOKEN =
"createlk_session_token";

let rejectType = "";
let rejectId = null;


function getToken(){

return (
localStorage.getItem(TOKEN) ||
sessionStorage.getItem(TOKEN)
);

}


function logout(){

localStorage.removeItem(TOKEN);
sessionStorage.removeItem(TOKEN);

localStorage.removeItem(
"createlk_user"
);

localStorage.removeItem(
"createlk_customer"
);

sessionStorage.removeItem(
"createlk_admin_login"
);

location.href =
"login.html";

}


function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function date(value){

if(!value){
return "—";
}

const d =
new Date(value);

if(isNaN(d)){
return "—";
}

return d.toLocaleString();

}


function showNotice(
text,
type="error"
){

const n =
document.getElementById(
"notice"
);

n.textContent =
text;

n.className =
"notice " + type;

}


async function api(
path,
options={}
){

const t =
getToken();

if(!t){

sessionStorage.setItem(
"createlk_admin_login",
"1"
);

location.href =
"login.html";

throw new Error(
"Login required."
);

}


const response =
await fetch(
API + path,
{
...options,

headers:{
...(options.headers || {}),
Authorization:
"Bearer " + t
}

}
);


if(response.status===401){

logout();

throw new Error(
"Unauthorized."
);

}


let data = {};

try{

data =
await response.json();

}catch{

}


if(!response.ok){

throw new Error(
data.error ||
"Request failed."
);

}


return data;

}


async function load(){

document.getElementById(
"ads"
).innerHTML =
'<div class="loading">Loading...</div>';

document.getElementById(
"payments"
).innerHTML =
'<div class="loading">Loading...</div>';


try{

const [
stats,
ads,
payments
] = await Promise.all([

api("/stats"),

api("/ads"),

api("/payments")

]);


const s =
stats.stats || {};


document.getElementById(
"pending"
).textContent =
s.pending_ads || 0;


document.getElementById(
"approved"
).textContent =
s.approved_ads || 0;


document.getElementById(
"rejected"
).textContent =
s.rejected_ads || 0;


document.getElementById(
"paymentsCount"
).textContent =
s.pending_payments || 0;


renderAds(
ads.ads || []
);


renderPayments(
payments.payments || []
);


}catch(error){

document.getElementById(
"ads"
).innerHTML =
'<div class="empty">' +
esc(error.message) +
'</div>';

document.getElementById(
"payments"
).innerHTML =
'<div class="empty">' +
esc(error.message) +
'</div>';

}

}


function renderAds(list){

if(!list.length){

document.getElementById(
"ads"
).innerHTML =
'<div class="empty">No pending advertisements.</div>';

return;

}


document.getElementById(
"ads"
).innerHTML =

list.map(ad=>{

const paid =
ad.ad_type !== "free";


let image = "";

if(ad.photo_url){

image = `
<img
class="photo"
src="https://ads.createlk.workers.dev/photo?key=${encodeURIComponent(ad.photo_url)}"
alt=""
onerror="this.style.display='none'">
`;

}


return `

<article class="item">

<div class="top">

${image}

<div class="content">

<div class="title">
${esc(ad.title)}
</div>

<div class="description">
${esc(ad.description)}
</div>


<div class="meta">

<span class="badge pending">
${esc(ad.status || "pending")}
</span>

<span class="badge ${paid ? "paid" : "free"}">
${esc(ad.ad_type)}
</span>

</div>


<div class="info">
Location:
${esc(ad.province)}
/
${esc(ad.district)}
/
${esc(ad.city)}
</div>


<div class="info">
WhatsApp:
${esc(ad.whatsapp_no)}
</div>


<div class="info">
Call:
${esc(ad.call_no)}
</div>


<div class="info">
User:
${esc(ad.user_name || "—")}
</div>


<div class="info">
Email:
${esc(ad.user_email || "—")}
</div>


<div class="info">
Submitted:
${date(ad.created_at)}
</div>


${
paid
?
`

<div class="payment">

<strong>
Payment
</strong>

<div class="info">
Amount:
LKR ${esc(ad.payment_amount || "—")}
</div>

<div class="info">
Bank:
${esc(ad.bank_name || "—")}
</div>

<div class="info">
Branch:
${esc(ad.branch_name || "—")}
</div>

<div class="info">
Account Name:
${esc(ad.account_name || "—")}
</div>

<div class="info">
Account Number:
${esc(ad.account_number || "—")}
</div>

<div class="info">
Deposit Date:
${esc(ad.deposit_date || "—")}
</div>

${
ad.slip_url
?
`
<a
class="slip"
href="${API}/slip?key=${encodeURIComponent(ad.slip_url)}"
target="_blank">
View Bank Slip
</a>
`
:
""
}

</div>

`
:
""
}


<div class="buttons">

<button
class="btn approve"
onclick="approveAd(${Number(ad.id)})">
Approve
</button>

<button
class="btn reject"
onclick="openReject('ad',${Number(ad.id)})">
Reject
</button>

</div>


</div>

</div>

</article>

`;

}).join("");

}


function renderPayments(list){

if(!list.length){

document.getElementById(
"payments"
).innerHTML =
'<div class="empty">No pending payments.</div>';

return;

}


document.getElementById(
"payments"
).innerHTML =

list.map(p=>`

<article class="item">

<div class="title">
${esc(p.ad_title || "Paid Advertisement")}
</div>

<div class="info">
User:
${esc(p.user_name || "—")}
</div>

<div class="info">
Email:
${esc(p.user_email || "—")}
</div>

<div class="info">
Ad Type:
${esc(p.ad_type || "—")}
</div>

<div class="info">
Amount:
LKR ${esc(p.amount || "—")}
</div>

<div class="info">
Bank:
${esc(p.bank_name || "—")}
</div>

<div class="info">
Branch:
${esc(p.branch_name || "—")}
</div>

<div class="info">
Account Name:
${esc(p.account_name || "—")}
</div>

<div class="info">
Account Number:
${esc(p.account_number || "—")}
</div>

<div class="info">
Deposit Date:
${esc(p.deposit_date || "—")}
</div>


${
p.slip_url
?
`
<a
class="slip"
href="${API}/slip?key=${encodeURIComponent(p.slip_url)}"
target="_blank">
View Bank Slip
</a>
`
:
""
}


<div class="buttons">

<button
class="btn approve"
onclick="approvePayment(${Number(p.id)})">
Approve Payment
</button>

<button
class="btn reject"
onclick="openReject('payment',${Number(p.id)})">
Reject Payment
</button>

</div>

</article>

`).join("");

}


async function approveAd(id){

if(!confirm(
"Approve this advertisement?"
)){
return;
}


try{

await api(
"/ads/" + id + "/approve",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:"{}"
}
);


showNotice(
"Advertisement approved successfully.",
"success"
);

load();


}catch(error){

showNotice(
error.message
);

}

}


async function approvePayment(id){

if(!confirm(
"Approve this payment?"
)){
return;
}


try{

await api(
"/payments/" + id + "/approve",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:"{}"
}
);


showNotice(
"Payment approved successfully.",
"success"
);

load();


}catch(error){

showNotice(
error.message
);

}

}


function openReject(
type,
id
){

rejectType =
type;

rejectId =
id;

document.getElementById(
"reason"
).value = "";


document.getElementById(
"modalTitle"
).textContent =
type === "payment"
?
"Reject Payment"
:
"Reject Advertisement";


document.getElementById(
"modal"
).style.display =
"block";

}


function closeModal(){

rejectType = "";

rejectId = null;

document.getElementById(
"modal"
).style.display =
"none";

}


async function confirmReject(){

const reason =
document.getElementById(
"reason"
).value.trim();


if(!reason){

alert(
"Please enter a rejection reason."
);

return;

}


const type =
rejectType;

const id =
rejectId;


try{

await api(

(type === "payment"
?
"/payments/"
:
"/ads/"
)
+
id
+
"/reject",

{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
rejection_reason:
reason
})

}

);


closeModal();


showNotice(

type === "payment"
?
"Payment rejected successfully."
:
"Advertisement rejected successfully.",

"success"

);


load();


}catch(error){

showNotice(
error.message
);

}

}


document
.getElementById("logout")
.addEventListener(
"click",
logout
);


/*
   ADMIN LOGIN REDIRECT
*/

if(!getToken()){

sessionStorage.setItem(
"createlk_admin_login",
"1"
);

location.href =
"login.html";

}else{

load();

}

</script>

</body>
</html>
