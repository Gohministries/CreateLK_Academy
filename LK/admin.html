<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Login | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:16px;
  padding:35px 28px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:15px;
}

h1{
  font-size:26px;
  margin-bottom:8px;
}

.sub{
  color:#687386;
  margin-bottom:25px;
  line-height:1.5;
}

.google{
  width:100%;
  border:1px solid #d5dbe4;
  background:#fff;
  color:#202124;
  border-radius:9px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google:hover{
  background:#f7f9fc;
}

.notice{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:8px;
  background:#ffe9e9;
  color:#b42318;
  font-size:14px;
  font-weight:600;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#1261d6;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.loading{
  display:none;
  margin-top:15px;
  color:#687386;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<img
class="logo"
src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
alt="CreateLK Jobs">

<h1>Admin Login</h1>

<p class="sub">
Sign in with the authorized Google account to access the CreateLK Jobs Admin Dashboard.
</p>

<div
id="notice"
class="notice">
</div>

<button
class="google"
id="googleLogin">
Continue with Google
</button>

<div
id="loading"
class="loading">
Checking administrator access...
</div>

<a
class="back"
href="index.html">
← Back to CreateLK Jobs
</a>

</div>


<script>

const LOGIN =
"https://login.createlk.workers.dev";

const ADMIN_API =
"https://admin.createlk.workers.dev";

const TOKEN =
"createlk_session_token";


function showError(message){

const notice =
document.getElementById("notice");

notice.textContent =
message;

notice.style.display =
"block";

}


function getToken(){

return (
localStorage.getItem(TOKEN) ||
sessionStorage.getItem(TOKEN)
);

}


async function checkAdmin(){

const token =
getToken();

if(!token){
return;
}


document.getElementById(
"loading"
).style.display =
"block";


try{

const response =
await fetch(
ADMIN_API + "/stats",
{
method:"GET",
headers:{
Authorization:
"Bearer " + token
}
}
);


if(response.ok){

location.href =
"admin.html";

return;

}


if(response.status === 403){

localStorage.removeItem(TOKEN);
sessionStorage.removeItem(TOKEN);

showError(
"Admin access is not authorized for this Google account."
);

return;

}


if(response.status === 401){

localStorage.removeItem(TOKEN);
sessionStorage.removeItem(TOKEN);

return;

}


const data =
await response.json()
.catch(()=>({}));

showError(
data.error ||
"Unable to verify administrator access."
);

}catch(error){

showError(
"Could not connect to the admin service."
);

}finally{

document.getElementById(
"loading"
).style.display =
"none";

}

}


document
.getElementById("googleLogin")
.addEventListener(
"click",
function(){

/*
   Existing user Login Worker remains unchanged.

   The admin-login flag tells
   LK/login.html to return here
   after Google authentication.
*/

sessionStorage.setItem(
"createlk_admin_login",
"1"
);

sessionStorage.setItem(
"createlk_admin_return",
"admin-login.html"
);

location.href =
LOGIN + "/login";

}
);


/*
   If an existing session belongs
   to the authorized admin, go
   directly to the dashboard.
*/

checkAdmin();

</script>

</body>
</html>
