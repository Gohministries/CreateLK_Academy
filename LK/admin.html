</div></div></main><script>

const API =
"https://admin.createlk.workers.dev";

const TOKEN =
"createlk_session_token";


function getToken(){

  return (
    localStorage.getItem(TOKEN) ||
    sessionStorage.getItem(TOKEN)
  );

}


function logout(){

  localStorage.removeItem(TOKEN);

  sessionStorage.removeItem(TOKEN);

  location.href =
    "admin-login.html";

}


function authHeaders(){

  const token =
    getToken();

  return {
    "Authorization":
      "Bearer " + token,
    "Content-Type":
      "application/json"
  };

}


function showError(message){

  const box =
    document.getElementById("error");

  box.textContent =
    message;

  box.style.display =
    "block";
}


async function api(url,options={}){

  const response =
    await fetch(
      API + url,
      {
        ...options,
        headers:{
          ...authHeaders(),
          ...(options.headers || {})
        }
      }
    );


  if(
    response.status === 401 ||
    response.status === 403
  ){

    logout();

    throw new Error(
      "Administrator session expired or access denied."
    );
  }


  const data =
    await response.json()
      .catch(()=>({}));


  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed."
    );
  }


  return data;

}


function value(data,...names){

  for(
    const name of names
  ){

    if(
      data &&
      data[name] !== undefined &&
      data[name] !== null
    ){

      return data[name];

    }
  }

  return 0;
}


async function loadStats(){

  const data =
    await api("/stats");

  document.getElementById(
    "pendingAds"
  ).textContent =
    value(
      data,
      "pending_ads",
      "pendingAds"
    );

  document.getElementById(
    "approvedAds"
  ).textContent =
    value(
      data,
      "approved_ads",
      "approvedAds"
    );

  document.getElementById(
    "rejectedAds"
  ).textContent =
    value(
      data,
      "rejected_ads",
      "rejectedAds"
    );

  document.getElementById(
    "pendingPayments"
  ).textContent =
    value(
      data,
      "pending_payments",
      "pendingPayments"
    );

}


async function loadAds(){

  const container =
    document.getElementById("ads");

  const data =
    await api("/ads");

  const ads =
    Array.isArray(data)
      ? data
      : (
          data.ads ||
          data.results ||
          []
        );


  if(!ads.length){

    container.innerHTML =
      '<div class="empty">No pending advertisements.</div>';

    return;
  }


  container.innerHTML =
    "";


  ads.forEach(
    ad => {

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.innerHTML = `

        <div class="card-title">
          ${escapeHtml(
            ad.title ||
            "Untitled Advertisement"
          )}
        </div>

        <div class="card-info">

          <strong>Ad ID:</strong>
          ${escapeHtml(
            String(ad.id || "")
          )}

          <br>

          <strong>Type:</strong>
          ${escapeHtml(
            ad.ad_type ||
            ""
          )}

          <br>

          <strong>Location:</strong>
          ${escapeHtml(
            [
              ad.province,
              ad.district,
              ad.city
            ]
            .filter(Boolean)
            .join(", ")
          )}

          <br>

          <strong>Status:</strong>
          <span class="status">
            ${escapeHtml(
              ad.status ||
              "pending"
            )}
          </span>

        </div>

        <div class="actions">

          <button
            class="action approve"
            onclick="approveAd('${escapeJs(ad.id)}')">
            Approve
          </button>

          <button
            class="action reject"
            onclick="rejectAd('${escapeJs(ad.id)}')">
            Reject
          </button>

        </div>

      `;


      container.appendChild(card);

    }
  );

}


async function loadPayments(){

  const container =
    document.getElementById("payments");

  const data =
    await api("/payments");

  const payments =
    Array.isArray(data)
      ? data
      : (
          data.payments ||
          data.results ||
          []
        );


  if(!payments.length){

    container.innerHTML =
      '<div class="empty">No pending payments.</div>';

    return;
  }


  container.innerHTML =
    "";


  payments.forEach(
    payment => {

      const card =
        document.createElement("div");

      card.className =
        "card";


      card.innerHTML = `

        <div class="card-title">
          Payment #${escapeHtml(
            String(payment.id || "")
          )}
        </div>

        <div class="card-info">

          <strong>Ad ID:</strong>
          ${escapeHtml(
            String(payment.ad_id || "")
          )}

          <br>

          <strong>Amount:</strong>
          LKR ${escapeHtml(
            String(payment.amount || "")
          )}

          <br>

          <strong>Deposit Date:</strong>
          ${escapeHtml(
            payment.deposit_date ||
            ""
          )}

          <br>

          <strong>Status:</strong>
          <span class="status">
            ${escapeHtml(
              payment.status ||
              "pending"
            )}
          </span>

        </div>

        <div class="actions">

          ${
            payment.slip_url
            ?
            `<button
              class="action view"
              onclick="viewSlip('${escapeJs(payment.slip_url)}')">
              View Bank Slip
            </button>`
            :
            ""
          }

          <button
            class="action approve"
            onclick="approvePayment('${escapeJs(payment.id)}')">
            Approve Payment
          </button>

          <button
            class="action reject"
            onclick="rejectPayment('${escapeJs(payment.id)}')">
            Reject Payment
          </button>

        </div>

      `;


      container.appendChild(card);

    }
  );

}


async function approveAd(id){

  if(
    !confirm(
      "Approve this advertisement?"
    )
  ){

    return;
  }


  await api(
    "/ads/" +
    encodeURIComponent(id) +
    "/approve",
    {
      method:"POST"
    }
  );


  await load();

}


async function rejectAd(id){

  if(
    !confirm(
      "Reject this advertisement?"
    )
  ){

    return;
  }


  await api(
    "/ads/" +
    encodeURIComponent(id) +
    "/reject",
    {
      method:"POST"
    }
  );


  await load();

}


async function approvePayment(id){

  if(
    !confirm(
      "Approve this payment?"
    )
  ){

    return;
  }


  await api(
    "/payments/" +
    encodeURIComponent(id) +
    "/approve",
    {
      method:"POST"
    }
  );


  await load();

}


async function rejectPayment(id){

  if(
    !confirm(
      "Reject this payment?"
    )
  ){

    return;
  }


  await api(
    "/payments/" +
    encodeURIComponent(id) +
    "/reject",
    {
      method:"POST"
    }
  );


  await load();

}


function viewSlip(url){

  if(!url){

    return;
  }


  if(
    String(url).startsWith(
      "http"
    )
  ){

    window.open(
      url,
      "_blank"
    );

    return;
  }


  window.open(
    API +
    "/slip?key=" +
    encodeURIComponent(url),
    "_blank"
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");

}


async function load(){

  try{

    await loadStats();

    await loadAds();

    await loadPayments();

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Could not load administrator dashboard."
    );

  }

}


if(!getToken()){

  location.href =
    "admin-login.html";

}else{

  load();

}

</script></body>
