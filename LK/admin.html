<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#ffffff;
  border-bottom:1px solid #e3e8ef;
  position:sticky;
  top:0;
  z-index:10;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:20px;
  color:#1261d6;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,
.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
  text-decoration:none;
  display:inline-block;
}

.home-btn{
  background:#edf3ff;
  color:#1261d6;
}

.logout-btn{
  background:#ffe9e9;
  color:#c62828;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

h1{
  font-size:30px;
  margin-bottom:6px;
}

.subtitle{
  color:#687386;
  margin-bottom:25px;
}

.notice{
  display:none;
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:600;
}

.notice.error{
  display:block;
  background:#ffe9e9;
  color:#b42318;
}

.notice.success{
  display:block;
  background:#e9f8ef;
  color:#18794e;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e5eaf1;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat-label{
  color:#697586;
  font-size:14px;
  margin-bottom:8px;
}

.stat-number{
  font-size:28px;
  font-weight:800;
}

.pending{
  color:#d97706;
}

.approved{
  color:#16803c;
}

.rejected{
  color:#c62828;
}

.payments{
  color:#1261d6;
}

.panel{
  background:#fff;
  border:1px solid #e5eaf1;
  border-radius:12px;
  margin-bottom:25px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.panel-header{
  padding:18px 20px;
  border-bottom:1px solid #e7ebf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.panel-header h2{
  font-size:20px;
}

.refresh{
  background:#edf3ff;
  color:#1261d6;
}

.loading{
  padding:25px;
  text-align:center;
  color:#687386;
}

.empty{
  padding:30px;
  text-align:center;
  color:#687386;
}

.ad{
  padding:20px;
  border-bottom:1px solid #edf0f4;
}

.ad:last-child{
  border-bottom:0;
}

.ad-top{
  display:flex;
  gap:18px;
}

.ad-photo{
  width:150px;
  height:110px;
  border-radius:8px;
  object-fit:cover;
  background:#eef2f6;
  flex-shrink:0;
}

.ad-content{
  flex:1;
  min-width:0;
}

.ad-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:7px;
}

.ad-description{
  color:#596579;
  line-height:1.5;
  margin-bottom:10px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  background:#eef2f7;
}

.badge.pending{
  background:#fff4df;
}

.badge.free{
  background:#e8f7ed;
  color:#18794e;
}

.badge.paid{
  background:#e9f0ff;
  color:#1261d6;
}

.location{
  margin-top:9px;
  color:#687386;
  font-size:14px;
}

.ad-actions{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.approve{
  background:#16803c;
  color:#fff;
}

.reject{
  background:#c62828;
  color:#fff;
}

.view{
  background:#edf3ff;
  color:#1261d6;
}

.payment-box{
  margin-top:15px;
  background:#f7f9fc;
  border:1px solid #e3e8ef;
  border-radius:9px;
  padding:14px;
}

.payment-box strong{
  display:block;
  margin-bottom:6px;
}

.payment-box div{
  margin:4px 0;
  font-size:14px;
}

.slip{
  margin-top:10px;
  display:inline-block;
  color:#1261d6;
  font-weight:700;
  text-decoration:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:500px;
  margin:80px auto;
  background:#fff;
  border-radius:14px;
  padding:25px;
}

.modal-box h3{
  margin-bottom:15px;
}

.modal-box textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  padding:12px;
  border:1px solid #ccd3dd;
  border-radius:8px;
  font:inherit;
  margin-bottom:15px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.cancel{
  background:#eef1f5;
  color:#333;
}

@media(max-width:850px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .ad-top{
    flex-direction:column;
  }

  .ad-photo{
    width:100%;
    height:200px;
  }
}

@media(max-width:500px){
  .container{
    padding:20px 12px 40px;
  }

  h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:23px;
  }

  .header-inner{
    padding:10px 12px;
  }

  .brand span{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img
        src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
        alt="CreateLK Jobs">
      <span>CreateLK Jobs Admin</span>
    </div>

    <div class="header-actions">
      <a class="btn home-btn" href="dashboard.html">
        Dashboard
      </a>

      <button class="btn logout-btn" id="logoutBtn">
        Logout
      </button>
    </div>

  </div>
</header>

<main class="container">

  <h1>Admin Dashboard</h1>
  <p class="subtitle">
    Review advertisements and manage payment approvals.
  </p>

  <div id="notice" class="notice"></div>

  <!-- STATS -->

  <section class="stats">

    <div class="stat">
      <div class="stat-label">Pending Ads</div>
      <div class="stat-number pending" id="pendingCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Approved Ads</div>
      <div class="stat-number approved" id="approvedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Rejected Ads</div>
      <div class="stat-number rejected" id="rejectedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Pending Payments</div>
      <div class="stat-number payments" id="paymentCount">0</div>
    </div>

  </section>

  <!-- PENDING ADS -->

  <section class="panel">

    <div class="panel-header">
      <h2>Pending Ads</h2>

      <button class="btn refresh" onclick="loadAdminData()">
        Refresh
      </button>
    </div>

    <div id="pendingAds">
      <div class="loading">
        Loading pending ads...
      </div>
    </div>

  </section>

</main>

<!-- REJECTION MODAL -->

<div class="modal" id="rejectModal">

  <div class="modal-box">

    <h3>Reject Advertisement</h3>

    <textarea
      id="rejectReason"
      placeholder="Enter rejection reason..."
    ></textarea>

    <div class="modal-actions">

      <button
        class="btn cancel"
        onclick="closeRejectModal()">
        Cancel
      </button>

      <button
        class="btn reject"
        onclick="confirmReject()">
        Reject Ad
      </button>

    </div>

  </div>

</div>

<script>

const API = "https://ads.createlk.workers.dev";
const LOGIN = "https://login.createlk.workers.dev";
const TOKEN_KEY = "createlk_session_token";

let rejectAdId = null;


/* TOKEN */

function getToken(){

  return localStorage.getItem(TOKEN_KEY) ||
         sessionStorage.getItem(TOKEN_KEY);

}


/* LOGOUT */

function logout(){

  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(TOKEN_KEY);

  localStorage.removeItem("createlk_user");
  localStorage.removeItem("createlk_customer");

  location.href = "login.html";
}


/* NOTICE */

function showNotice(message,type="error"){

  const el = document.getElementById("notice");

  el.textContent = message;

  el.className = "notice " + type;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ESCAPE HTML */

function esc(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* FORMAT DATE */

function formatDate(value){

  if(!value){
    return "—";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return esc(value);
  }

  return d.toLocaleString();

}


/* API REQUEST */

async function api(path,options={}){

  const token = getToken();

  if(!token){
    location.href = "login.html";
    throw new Error("Not logged in");
  }

  const headers = {
    ...(options.headers || {}),
    "Authorization":"Bearer " + token
  };

  const response = await fetch(
    API + path,
    {
      ...options,
      headers
    }
  );

  if(response.status === 401 ||
     response.status === 403){

    logout();
    throw new Error("Unauthorized");
  }

  let data = {};

  try{
    data = await response.json();
  }catch(e){}

  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Request failed"
    );

  }

  return data;

}


/* LOAD ADMIN DATA */

async function loadAdminData(){

  const container =
    document.getElementById("pendingAds");

  container.innerHTML =
    '<div class="loading">Loading pending ads...</div>';

  try{

    /*
      These admin endpoints must be implemented
      in the Cloudflare Ads Worker.

      GET  /admin/ads
      GET  /admin/stats
    */

    const [adsData,statsData] = await Promise.all([

      api("/admin/ads"),

      api("/admin/stats")

    ]);

    const ads =
      Array.isArray(adsData.ads)
        ? adsData.ads
        : [];

    const stats =
      statsData.stats || {};

    document.getElementById("pendingCount")
      .textContent =
        Number(stats.pending_ads || 0);

    document.getElementById("approvedCount")
      .textContent =
        Number(stats.approved_ads || 0);

    document.getElementById("rejectedCount")
      .textContent =
        Number(stats.rejected_ads || 0);

    document.getElementById("paymentCount")
      .textContent =
        Number(stats.pending_payments || 0);

    renderAds(ads);

  }catch(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">' +
      esc(error.message) +
      '</div>';

  }

}


/* RENDER ADS */

function renderAds(ads){

  const container =
    document.getElementById("pendingAds");

  if(!ads.length){

    container.innerHTML =
      '<div class="empty">' +
      'No pending advertisements.' +
      '</div>';

    return;
  }

  container.innerHTML =
    ads.map(renderAd).join("");

}


/* RENDER ONE AD */

function renderAd(ad){

  const isPaid =
    ad.ad_type !== "free";

  let paymentHTML = "";

  if(isPaid){

    paymentHTML = `

      <div class="payment-box">

        <strong>Payment Information</strong>

        <div>
          Payment:
          ${esc(ad.payment_status || "pending")}
        </div>

        <div>
          Amount:
          LKR ${esc(ad.amount || "—")}
        </div>

        <div>
          Deposit Date:
          ${esc(ad.deposit_date || "—")}
        </div>

        ${
          ad.slip_url
          ?
          `<a
             class="slip"
             href="${esc(ad.slip_url)}"
             target="_blank"
             rel="noopener">
             View Bank Slip
           </a>`
          :
          ""
        }

      </div>

    `;

  }

  return `

    <article class="ad">

      <div class="ad-top">

        ${
          ad.photo_url
          ?
          `<img
             class="ad-photo"
             src="${esc(ad.photo_url)}"
             alt="Ad photo"
             onerror="this.style.display='none'">`
          :
          ""
        }

        <div class="ad-content">

          <div class="ad-title">
            ${esc(ad.title)}
          </div>

          <div class="ad-description">
            ${esc(ad.description)}
          </div>

          <div class="meta">

            <span class="badge pending">
              ${esc(ad.status || "pending")}
            </span>

            <span class="badge ${
              isPaid ? "paid" : "free"
            }">
              ${esc(ad.ad_type)}
            </span>

            ${
              ad.payment_status
              ?
              `<span class="badge">
                Payment: ${esc(ad.payment_status)}
              </span>`
              :
              ""
            }

          </div>

          <div class="location">

            📍
            ${esc(ad.province)}
            /
            ${esc(ad.district)}
            /
            ${esc(ad.city)}

          </div>

          <div class="location">

            📱 WhatsApp:
            ${esc(ad.whatsapp_no)}

            &nbsp;&nbsp;

            ☎ Call:
            ${esc(ad.call_no)}

          </div>

          <div class="location">

            Submitted:
            ${formatDate(ad.created_at)}

          </div>

        </div>

      </div>

      ${paymentHTML}

      <div class="ad-actions">

        <button
          class="btn approve"
          onclick="approveAd(${Number(ad.id)})">
          Approve
        </button>

        <button
          class="btn reject"
          onclick="openRejectModal(${Number(ad.id)})">
          Reject
        </button>

        <button
          class="btn view"
          onclick="viewAd(${Number(ad.id)})">
          View Details
        </button>

      </div>

    </article>

  `;

}


/* APPROVE */

async function approveAd(id){

  if(!confirm(
    "Approve this advertisement?"
  )){
    return;
  }

  try{

    await api(
      "/admin/ads/" + encodeURIComponent(id) + "/approve",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({})
      }
    );

    showNotice(
      "Advertisement approved successfully.",
      "success"
    );

    await loadAdminData();

  }catch(error){

    showNotice(error.message);

  }

}


/* OPEN REJECT */

function openRejectModal(id){

  rejectAdId = id;

  document.getElementById("rejectReason").value = "";

  document.getElementById("rejectModal").style.display =
    "block";

}


/* CLOSE REJECT */

function closeRejectModal(){

  rejectAdId = null;

  document.getElementById("rejectModal").style.display =
    "none";

}


/* CONFIRM REJECT */

async function confirmReject(){

  if(!rejectAdId){
    return;
  }

  const reason =
    document.getElementById("rejectReason")
      .value
      .trim();

  if(!reason){

    alert("Please enter a rejection reason.");

    return;
  }

  try{

    await api(
      "/admin/ads/" +
      encodeURIComponent(rejectAdId) +
      "/reject",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          rejection_reason:reason
        })
      }
    );

    closeRejectModal();

    showNotice(
      "Advertisement rejected successfully.",
      "success"
    );

    await loadAdminData();

  }catch(error){

    showNotice(error.message);

  }

}


/* VIEW */

function viewAd(id){

  location.href =
    "jobs.html?id=" +
    encodeURIComponent(id);

}


/* LOGOUT */

document
  .getElementById("logoutBtn")
  .addEventListener("click",logout);


/* START */

if(!getToken()){

  location.href = "login.html";

}else{

  loadAdminData();

}

</script>

</body>
</html>
