<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | CreateLK Jobs</title>

<link rel="icon" href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e4e8ef;position:sticky;top:0;z-index:10}
.nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{width:42px;height:42px;object-fit:contain}
button{border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.logout{background:#172033;color:#fff}
.container{max-width:1200px;margin:auto;padding:30px 20px 60px}
h1{font-size:30px;margin-bottom:8px}
.subtitle,.empty{color:#687386}
.subtitle{margin-bottom:25px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:30px}
.stat,.section,.card{background:#fff;border:1px solid #e4e8ef;border-radius:12px}
.stat{padding:20px}
.stat-title{color:#687386;font-size:14px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:800}
.section{padding:22px;margin-bottom:25px}
.section h2{font-size:20px;margin-bottom:18px}
.card{padding:18px;margin-bottom:15px}
.info h3{font-size:19px;margin-bottom:10px}
.info p{margin:6px 0;color:#566174;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.approve{background:#16803c;color:#fff}
.reject{background:#c62828;color:#fff}
.view{background:#1261d6;color:#fff}
.payment-view{background:#6f42c1;color:#fff}
.media{display:none;margin-top:15px;padding:12px;background:#f7f9fc;border:1px solid #e4e8ef;border-radius:10px}
.media img{display:block;width:100%;max-width:600px;max-height:600px;object-fit:contain;margin:auto;border-radius:8px}
.media iframe{width:100%;height:600px;border:0}
.badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:12px;font-weight:800;margin-bottom:10px}
.free{background:#e8f5e9;color:#237a35}
.premium{background:#fff3cd;color:#856404}
.error{display:none;background:#ffe9e9;color:#b42318;padding:12px;border-radius:8px;margin-bottom:20px}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:14px;padding:22px}
.reason{display:grid;gap:9px;margin:15px 0}
.reason label{border:1px solid #e4e8ef;padding:11px;border-radius:8px}
.custom{display:none;width:100%;min-height:90px;padding:10px;border:1px solid #ddd;border-radius:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.cancel{background:#e9edf3}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.stats{grid-template-columns:1fr}.container{padding:20px 12px}}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="brand">
<img src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">
<span>CreateLK Jobs Admin</span>
</div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<div class="container">

<h1>Admin Dashboard</h1>
<p class="subtitle">Manage job advertisements and payment approvals.</p>

<div id="error" class="error"></div>

<div class="stats">
<div class="stat"><div class="stat-title">Pending Ads</div><div id="pendingAds" class="stat-value">0</div></div>
<div class="stat"><div class="stat-title">Approved Ads</div><div id="approvedAds" class="stat-value">0</div></div>
<div class="stat"><div class="stat-title">Rejected Ads</div><div id="rejectedAds" class="stat-value">0</div></div>
<div class="stat"><div class="stat-title">Pending Payments</div><div id="pendingPayments" class="stat-value">0</div></div>
</div>

<div class="section">
<h2>Pending Advertisements</h2>
<div id="adsList"><div class="empty">Loading...</div></div>
</div>

<div class="section">
<h2>Pending Payments</h2>
<div id="paymentsList"><div class="empty">Loading...</div></div>
</div>

</div>

<!-- REJECT MODAL -->

<div id="modal" class="modal">
<div class="modal-box">

<h2 id="modalTitle">Reject</h2>
<p class="subtitle">Select a reason.</p>

<div class="reason">

<label><input type="radio" name="reason" value="Invalid job information"> Invalid job information</label>
<label><input type="radio" name="reason" value="Photo not acceptable"> Photo not acceptable</label>
<label><input type="radio" name="reason" value="Duplicate advertisement"> Duplicate advertisement</label>
<label><input type="radio" name="reason" value="Payment issue"> Payment issue</label>
<label><input type="radio" name="reason" value="Other"> Other</label>

</div>

<textarea id="custom" class="custom" placeholder="Enter rejection reason..."></textarea>

<div class="modal-actions">
<button class="cancel" onclick="closeModal()">Cancel</button>
<button class="reject" onclick="confirmReject()">Reject</button>
</div>

</div>
</div>

<script>

const API="https://admin.createlk.workers.dev";
const TOKEN="createlk_session_token";

let rejectType="";
let rejectId="";


function getToken(){
  return localStorage.getItem(TOKEN) ||
         sessionStorage.getItem(TOKEN) || "";
}


async function api(path,options={}){

  const token=getToken();

  if(!token){
    location.href="admin-login.html";
    return null;
  }

  options.headers={
    ...(options.headers||{}),
    Authorization:"Bearer "+token,
    "Content-Type":"application/json"
  };

  const r=await fetch(API+path,options);

  if(r.status===401||r.status===403){
    localStorage.removeItem(TOKEN);
    sessionStorage.removeItem(TOKEN);
    location.href="admin-login.html";
    return null;
  }

  let data={};
  try{data=await r.json()}catch{}

  if(!r.ok) throw new Error(data.error||"Request failed.");

  return data;
}


function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function premium(type){
  return [
    "featured",
    "urgent",
    "top",
    "featured_urgent_top"
  ].includes(String(type||"").toLowerCase());
}


function showError(msg){
  const e=document.getElementById("error");
  e.textContent=msg;
  e.style.display="block";
}


/* STATS */

async function loadStats(){

  const d=await api("/stats");
  if(!d)return;

  pendingAds.textContent=d.pending_ads??0;
  approvedAds.textContent=d.approved_ads??0;
  rejectedAds.textContent=d.rejected_ads??0;
  pendingPayments.textContent=d.pending_payments??0;
}


/* ADS */

async function loadAds(){

  const box=document.getElementById("adsList");

  try{

    const d=await api("/ads");
    if(!d)return;

    const ads=d.ads||[];

    if(!ads.length){
      box.innerHTML='<div class="empty">No pending advertisements.</div>';
      return;
    }

    box.innerHTML=ads.map(ad=>{

      const paid=premium(ad.ad_type);
      const photoId="photo"+ad.id;
      const slipId="adslip"+ad.id;

      const location=[
        ad.province,
        ad.district,
        ad.city
      ].filter(Boolean)
       .filter((x,i,a)=>a.indexOf(x)===i)
       .join(", ");

      return `
      <div class="card">

        <div class="info">

          <div class="badge ${paid?"premium":"free"}">
            ${paid?"PREMIUM / PAID AD":"FREE AD"}
          </div>

          <h3>${esc(ad.title||"Untitled Ad")}</h3>

          <p><strong>Ad ID:</strong> ${esc(ad.id)}</p>
          <p><strong>Type:</strong> ${esc(ad.ad_type)}</p>
          <p><strong>Location:</strong> ${esc(location)}</p>
          <p><strong>Status:</strong> ${esc(ad.status)}</p>
          <p><strong>User:</strong> ${esc(ad.user_name)}</p>
          <p><strong>Email:</strong> ${esc(ad.user_email)}</p>

          ${ad.description?
          `<p><strong>Description:</strong> ${esc(ad.description)}</p>`:""}

          ${paid?
          `<p><strong>Payment:</strong> LKR ${esc(ad.payment_amount||"")}</p>
           <p><strong>Payment Status:</strong> ${esc(ad.payment_record_status||ad.payment_status||"pending")}</p>`
          :""}

        </div>

        <div class="actions">

          ${
          ad.photo_url?
          `<button class="view"
             onclick="showPhoto('${photoId}','${encodeURIComponent(ad.photo_url)}')">
             View Ad Photo
           </button>`:
          `<button class="view" disabled>No Ad Photo</button>`
          }

          ${
          paid&&ad.slip_url?
          `<button class="payment-view"
             onclick="showSlip('${slipId}','${encodeURIComponent(ad.slip_url)}')">
             View Payment Slip
           </button>`:""
          }

          ${
          paid&&ad.payment_id&&ad.payment_record_status==="pending"?
          `<button class="approve"
             onclick="approvePayment('${ad.payment_id}')">
             Approve Payment
           </button>`:""
          }

          <button class="approve"
             onclick="approveAd('${ad.id}')">
             Approve
          </button>

          <button class="reject"
             onclick="openModal('ad','${ad.id}')">
             Reject
          </button>

        </div>

        <div id="${photoId}" class="media"></div>

        ${
        paid&&ad.slip_url?
        `<div id="${slipId}" class="media"></div>`:""
        }

      </div>`;
    }).join("");

  }catch(e){
    box.innerHTML='<div class="empty">Failed to load advertisements.</div>';
    showError(e.message);
  }
}


/* AD PHOTO */

async function showPhoto(id,encodedKey){

  const box=document.getElementById(id);

  if(box.style.display==="block"){
    box.style.display="none";
    box.innerHTML="";
    return;
  }

  try{

    const r=await fetch(
      API+"/photo?key="+
      encodeURIComponent(decodeURIComponent(encodedKey)),
      {
        headers:{
          Authorization:"Bearer "+getToken()
        }
      }
    );

    if(!r.ok)
      throw new Error("Unable to load ad photo.");

    const blob=await r.blob();
    const url=URL.createObjectURL(blob);

    box.innerHTML=
      `<img src="${url}" alt="Ad photo">`;

    box.style.display="block";

  }catch(e){

    box.innerHTML=
      `<div class="empty">${esc(e.message)}</div>`;

    box.style.display="block";
  }
}


/* PAYMENT SLIP */

async function showSlip(id,encodedKey){

  const box=document.getElementById(id);

  if(box.style.display==="block"){
    box.style.display="none";
    box.innerHTML="";
    return;
  }

  try{

    const r=await fetch(
      API+"/slip?key="+
      encodeURIComponent(decodeURIComponent(encodedKey)),
      {
        headers:{
          Authorization:"Bearer "+getToken()
        }
      }
    );

    if(!r.ok)
      throw new Error("Unable to load payment slip.");

    const blob=await r.blob();
    const url=URL.createObjectURL(blob);

    if((blob.type||"").includes("pdf")){
      box.innerHTML=`<iframe src="${url}"></iframe>`;
    }else{
      box.innerHTML=`<img src="${url}" alt="Payment slip">`;
    }

    box.style.display="block";

  }catch(e){

    box.innerHTML=
      `<div class="empty">${esc(e.message)}</div>`;

    box.style.display="block";
  }
}


/* APPROVE AD */

async function approveAd(id){

  if(!confirm("Approve this advertisement?"))return;

  try{
    await api("/ads/"+id+"/approve",{method:"POST"});
    await load();
  }catch(e){
    showError(e.message);
  }
}


/* APPROVE PAYMENT */

async function approvePayment(id){

  if(!confirm("Approve this payment?"))return;

  try{
    await api("/payments/"+id+"/approve",{method:"POST"});
    await load();
  }catch(e){
    showError(e.message);
  }
}


/* REJECT */

function openModal(type,id){

  rejectType=type;
  rejectId=id;

  document.getElementById("modalTitle").textContent=
    type==="ad"?"Reject Advertisement":"Reject Payment";

  document.querySelectorAll(
    'input[name="reason"]'
  ).forEach(x=>x.checked=false);

  document.getElementById("custom").value="";
  document.getElementById("custom").style.display="none";

  document.getElementById("modal").style.display="flex";
}


function closeModal(){
  document.getElementById("modal").style.display="none";
  rejectType="";
  rejectId="";
}


document.addEventListener("change",e=>{

  if(e.target.name!=="reason")return;

  const custom=document.getElementById("custom");

  if(e.target.value==="Other"){
    custom.style.display="block";
    custom.focus();
  }else{
    custom.style.display="none";
    custom.value="";
  }

});


async function confirmReject(){

  const selected=document.querySelector(
    'input[name="reason"]:checked'
  );

  if(!selected){
    alert("Please select a rejection reason.");
    return;
  }

  let reason=selected.value;

  if(reason==="Other"){
    reason=document.getElementById("custom").value.trim();

    if(!reason){
      alert("Please enter the rejection reason.");
      return;
    }
  }

  const path=
    rejectType==="ad"
    ?"/ads/"+rejectId+"/reject"
    :"/payments/"+rejectId+"/reject";

  try{

    await api(path,{
      method:"POST",
      body:JSON.stringify({
        rejection_reason:reason
      })
    });

    closeModal();
    await load();

  }catch(e){
    showError(e.message);
  }
}


/* PAYMENTS */

async function loadPayments(){

  const box=document.getElementById("paymentsList");

  try{

    const d=await api("/payments");
    if(!d)return;

    const payments=d.payments||[];

    if(!payments.length){
      box.innerHTML='<div class="empty">No pending payments.</div>';
      return;
    }

    box.innerHTML=payments.map(p=>{

      const id="slip"+p.id;

      return `
      <div class="card">

        <div class="info">

          <h3>Payment #${esc(p.id)}</h3>

          <p><strong>Ad ID:</strong> ${esc(p.ad_id)}</p>
          <p><strong>Ad:</strong> ${esc(p.ad_title)}</p>
          <p><strong>Amount:</strong> LKR ${esc(p.amount)}</p>
          <p><strong>Status:</strong> ${esc(p.status)}</p>
          <p><strong>Depositor:</strong> ${esc(p.user_name)}</p>

          ${p.deposit_date?
          `<p><strong>Deposit Date:</strong> ${esc(p.deposit_date)}</p>`:""}

          ${p.reference_number?
          `<p><strong>Reference:</strong> ${esc(p.reference_number)}</p>`:""}

        </div>

        <div class="actions">

          ${
          p.slip_url?
          `<button class="payment-view"
             onclick="showSlip('${id}','${encodeURIComponent(p.slip_url)}')">
             View Payment Slip
           </button>`:
          `<button class="view" disabled>No Payment Slip</button>`
          }

          <button class="approve"
             onclick="approvePayment('${p.id}')">
             Approve Payment
          </button>

          <button class="reject"
             onclick="openModal('payment','${p.id}')">
             Reject Payment
          </button>

        </div>

        <div id="${id}" class="media"></div>

      </div>`;
    }).join("");

  }catch(e){

    box.innerHTML='<div class="empty">Failed to load payments.</div>';
    showError(e.message);
  }
}


/* LOAD */

async function load(){

  document.getElementById("error").style.display="none";

  await Promise.all([
    loadStats(),
    loadAds(),
    loadPayments()
  ]);
}


/* LOGOUT */

function logout(){

  localStorage.removeItem(TOKEN);
  sessionStorage.removeItem(TOKEN);

  location.href="admin-login.html";
}


/* START */

if(getToken()){
  load();
}else{
  location.href="admin-login.html";
}

</script>

</body>
</html>
