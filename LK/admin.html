<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | CreateLK Jobs</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e4e8ef;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.logout{
  border:0;
  background:#172033;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

h1{
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  color:#687386;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:12px;
  padding:20px;
}

.stat-title{
  color:#687386;
  font-size:14px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}

.section{
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.section h2{
  font-size:20px;
  margin-bottom:18px;
}

.card{
  border:1px solid #e4e8ef;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  background:#fff;
}

.card:last-child{
  margin-bottom:0;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.info{
  flex:1;
}

.info h3{
  font-size:19px;
  margin-bottom:10px;
}

.info p{
  margin:6px 0;
  color:#566174;
  line-height:1.5;
}

.badge{
  display:inline-block;
  background:#eef4ff;
  color:#1261d6;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
}

button{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.approve{
  background:#16803c;
  color:#fff;
}

.reject{
  background:#c62828;
  color:#fff;
}

.view{
  background:#1261d6;
  color:#fff;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.photo-box{
  margin-top:16px;
  display:none;
  background:#f7f9fc;
  border:1px solid #e4e8ef;
  border-radius:10px;
  padding:12px;
}

.photo-box img{
  width:100%;
  max-width:600px;
  max-height:600px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:8px;
  background:#fff;
}

.slip-frame{
  width:100%;
  min-height:600px;
  border:0;
  border-radius:8px;
  background:#fff;
}

.empty{
  color:#687386;
  padding:10px 0;
}

.error{
  background:#ffe9e9;
  color:#b42318;
  padding:12px;
  border-radius:8px;
  margin-bottom:20px;
  display:none;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .card-top{
    flex-direction:column;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:20px 12px 50px;
  }

  .section{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="brand">
      <img
      src="https://assets.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
      alt="CreateLK Jobs">

      <span>CreateLK Jobs Admin</span>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>
</header>


<div class="container">

  <h1>Admin Dashboard</h1>

  <p class="subtitle">
    Manage job advertisements and payment approvals.
  </p>

  <div id="error" class="error"></div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">
        Pending Ads
      </div>
      <div id="pendingAds" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        Approved Ads
      </div>
      <div id="approvedAds" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        Rejected Ads
      </div>
      <div id="rejectedAds" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        Pending Payments
      </div>
      <div id="pendingPayments" class="stat-value">
        0
      </div>
    </div>

  </div>


  <!-- PENDING ADS -->

  <div class="section">

    <h2>Pending Advertisements</h2>

    <div id="adsList">
      <div class="empty">
        Loading...
      </div>
    </div>

  </div>


  <!-- PENDING PAYMENTS -->

  <div class="section">

    <h2>Pending Payments</h2>

    <div id="paymentsList">
      <div class="empty">
        Loading...
      </div>
    </div>

  </div>

</div>


<script>

const API =
  "https://admin.createlk.workers.dev";

const TOKEN =
  "createlk_session_token";


/* =========================
   TOKEN
========================= */

function getToken(){

  return (
    localStorage.getItem(TOKEN) ||
    sessionStorage.getItem(TOKEN) ||
    ""
  );
}


/* =========================
   API REQUEST
========================= */

async function api(
  path,
  options={}
){

  const token =
    getToken();

  if(!token){
    location.href =
      "admin-login.html";
    return null;
  }

  options.headers = {
    ...(options.headers || {}),
    "Authorization":
      "Bearer " + token,
    "Content-Type":
      "application/json"
  };

  const response =
    await fetch(
      API + path,
      options
    );

  if(
    response.status === 401 ||
    response.status === 403
  ){

    localStorage.removeItem(TOKEN);
    sessionStorage.removeItem(TOKEN);

    location.href =
      "admin-login.html";

    return null;
  }

  let data = {};

  try{
    data =
      await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}


/* =========================
   ERROR
========================= */

function showError(message){

  const box =
    document.getElementById(
      "error"
    );

  box.textContent =
    message;

  box.style.display =
    "block";
}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================
   STATS
========================= */

async function loadStats(){

  const data =
    await api("/stats");

  if(!data) return;

  document.getElementById(
    "pendingAds"
  ).textContent =
    data.pending_ads ?? 0;

  document.getElementById(
    "approvedAds"
  ).textContent =
    data.approved_ads ?? 0;

  document.getElementById(
    "rejectedAds"
  ).textContent =
    data.rejected_ads ?? 0;

  document.getElementById(
    "pendingPayments"
  ).textContent =
    data.pending_payments ?? 0;
}


/* =========================
   ADS
========================= */

async function loadAds(){

  const box =
    document.getElementById(
      "adsList"
    );

  try{

    const data =
      await api("/ads");

    if(!data) return;

    const ads =
      data.ads || [];

    if(!ads.length){

      box.innerHTML =
        '<div class="empty">No pending advertisements.</div>';

      return;
    }

    box.innerHTML =
      ads.map(ad => {

        const photo =
          ad.photo_url ||
          ad.photo ||
          "";

        const photoId =
          "photo-" +
          String(ad.id);

        return `

          <div class="card">

            <div class="card-top">

              <div class="info">

                <h3>
                  ${esc(
                    ad.title ||
                    "Untitled Ad"
                  )}
                </h3>

                <p>
                  <strong>Ad ID:</strong>
                  ${esc(ad.id)}
                </p>

                <p>
                  <strong>Type:</strong>
                  ${esc(ad.ad_type)}
                </p>

                <p>
                  <strong>Location:</strong>
                  ${esc(
                    [
                      ad.province,
                      ad.district,
                      ad.city
                    ]
                    .filter(Boolean)
                    .join(", ")
                  )}
                </p>

                <p>
                  <strong>Status:</strong>
                  ${esc(ad.status)}
                </p>

                ${
                  ad.description
                  ?
                  `<p>
                    <strong>Description:</strong>
                    ${esc(ad.description)}
                  </p>`
                  :
                  ""
                }

              </div>

            </div>


            <div class="actions">

              ${
                photo
                ?
                `
                <button
                  class="view"
                  onclick="toggleAdPhoto(
                    '${photoId}',
                    '${esc(photo)}'
                  )">
                  View Ad Photo
                </button>
                `
                :
                `
                <button
                  class="view"
                  disabled>
                  No Ad Photo
                </button>
                `
              }

              <button
                class="approve"
                onclick="approveAd('${esc(ad.id)}')">
                Approve
              </button>

              <button
                class="reject"
                onclick="rejectAd('${esc(ad.id)}')">
                Reject
              </button>

            </div>


            <div
              id="${photoId}"
              class="photo-box">
            </div>

          </div>

        `;

      }).join("");

  }catch(error){

    box.innerHTML =
      '<div class="empty">Failed to load advertisements.</div>';

    showError(
      error.message
    );
  }
}


/* =========================
   SHOW AD PHOTO
========================= */

function toggleAdPhoto(
  boxId,
  url
){

  const box =
    document.getElementById(
      boxId
    );

  if(
    box.style.display ===
    "block"
  ){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    return;
  }

  box.innerHTML = `
    <img
      src="${url}"
      alt="Ad photo"
      onerror="this.parentElement.innerHTML='<p class=&quot;empty&quot;>Unable to load this ad photo.</p>'">
  `;

  box.style.display =
    "block";
}


/* =========================
   APPROVE AD
========================= */

async function approveAd(id){

  if(
    !confirm(
      "Approve this advertisement?"
    )
  ) return;

  try{

    await api(
      "/ads/" +
      encodeURIComponent(id) +
      "/approve",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(
      error.message
    );
  }
}


/* =========================
   REJECT AD
========================= */

async function rejectAd(id){

  if(
    !confirm(
      "Reject this advertisement?"
    )
  ) return;

  try{

    await api(
      "/ads/" +
      encodeURIComponent(id) +
      "/reject",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(
      error.message
    );
  }
}


/* =========================
   PAYMENTS
========================= */

async function loadPayments(){

  const box =
    document.getElementById(
      "paymentsList"
    );

  try{

    const data =
      await api("/payments");

    if(!data) return;

    const payments =
      data.payments || [];

    if(!payments.length){

      box.innerHTML =
        '<div class="empty">No pending payments.</div>';

      return;
    }

    box.innerHTML =
      payments.map(payment => {

        const slipKey =
          payment.slip_url ||
          payment.slip_key ||
          payment.bank_slip ||
          payment.key ||
          "";

        const frameId =
          "slip-" +
          String(payment.id);

        return `

          <div class="card">

            <div class="info">

              <h3>
                Payment #${esc(
                  payment.id
                )}
              </h3>

              <p>
                <strong>Ad ID:</strong>
                ${esc(
                  payment.ad_id
                )}
              </p>

              <p>
                <strong>Amount:</strong>
                LKR ${esc(
                  payment.amount
                )}
              </p>

              <p>
                <strong>Status:</strong>
                ${esc(
                  payment.status
                )}
              </p>

              ${
                payment.deposit_date
                ?
                `
                <p>
                  <strong>Deposit Date:</strong>
                  ${esc(
                    payment.deposit_date
                  )}
                </p>
                `
                :
                ""
              }

            </div>


            <div class="actions">

              ${
                slipKey
                ?
                `
                <button
                  class="view"
                  onclick="toggleSlip(
                    '${frameId}',
                    '${esc(slipKey)}'
                  )">
                  View Payment Slip
                </button>
                `
                :
                `
                <button
                  class="view"
                  disabled>
                  No Payment Photo
                </button>
                `
              }


              <button
                class="approve"
                onclick="approvePayment('${esc(payment.id)}')">
                Approve Payment
              </button>


              <button
                class="reject"
                onclick="rejectPayment('${esc(payment.id)}')">
                Reject Payment
              </button>

            </div>


            <div
              id="${frameId}"
              class="photo-box">
            </div>

          </div>

        `;

      }).join("");

  }catch(error){

    box.innerHTML =
      '<div class="empty">Failed to load payments.</div>';

    showError(
      error.message
    );
  }
}


/* =========================
   VIEW PAYMENT SLIP
========================= */

async function toggleSlip(
  boxId,
  key
){

  const box =
    document.getElementById(
      boxId
    );

  if(
    box.style.display ===
    "block"
  ){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    return;
  }

  try{

    const token =
      getToken();

    const url =
      API +
      "/slip?key=" +
      encodeURIComponent(key);

    const response =
      await fetch(
        url,
        {
          headers:{
            "Authorization":
              "Bearer " +
              token
          }
        }
      );

    if(!response.ok){

      throw new Error(
        "Unable to load payment slip."
      );
    }

    const blob =
      await response.blob();

    const blobUrl =
      URL.createObjectURL(
        blob
      );

    const type =
      blob.type || "";

    if(
      type.includes("pdf")
    ){

      box.innerHTML = `
        <iframe
          class="slip-frame"
          src="${blobUrl}">
        </iframe>
      `;

    }else{

      box.innerHTML = `
        <img
          src="${blobUrl}"
          alt="Bank payment slip"
          onerror="this.parentElement.innerHTML='<p class=&quot;empty&quot;>Unable to display payment slip.</p>'">
      `;
    }

    box.style.display =
      "block";

  }catch(error){

    showError(
      error.message
    );
  }
}


/* =========================
   APPROVE PAYMENT
========================= */

async function approvePayment(id){

  if(
    !confirm(
      "Approve this payment?"
    )
  ) return;

  try{

    await api(
      "/payments/" +
      encodeURIComponent(id) +
      "/approve",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(
      error.message
    );
  }
}


/* =========================
   REJECT PAYMENT
========================= */

async function rejectPayment(id){

  if(
    !confirm(
      "Reject this payment?"
    )
  ) return;

  try{

    await api(
      "/payments/" +
      encodeURIComponent(id) +
      "/reject",
      {
        method:"POST"
      }
    );

    await load();

  }catch(error){

    showError(
      error.message
    );
  }
}


/* =========================
   LOAD EVERYTHING
========================= */

async function load(){

  document.getElementById(
    "error"
  ).style.display =
    "none";

  await Promise.all([
    loadStats(),
    loadAds(),
    loadPayments()
  ]);
}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    TOKEN
  );

  sessionStorage.removeItem(
    TOKEN
  );

  location.href =
    "admin-login.html";
}


/* =========================
   START
========================= */

if(!getToken()){

  location.href =
    "admin-login.html";

}else{

  load();
}

</script>

</body>
</html>
