<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163A63">

<title>My Account | CreateLK Digital Learning Shop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--navy:#163A63;
--blue:#2563EB;
--light:#EFF6FF;
--bg:#F7F9FC;
--text:#263238;
--muted:#6B7785;
--border:#E2E8F0;
--white:#fff
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text)
}

a{
text-decoration:none;
color:inherit
}

header{
background:#fff;
border-bottom:1px solid var(--border)
}

.nav{
max-width:1150px;
height:62px;
margin:auto;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px;
color:var(--navy);
font-weight:800;
font-size:15px
}

.brand img{
width:36px;
height:36px;
object-fit:contain
}

.nav-links{
display:flex;
gap:4px
}

.nav-links a{
padding:8px 10px;
border-radius:7px;
font-size:13px;
font-weight:700
}

.nav-links a:hover,
.nav-links .active{
background:var(--light);
color:var(--blue)
}

main{
max-width:950px;
margin:auto;
padding:30px 16px 55px
}

.top{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:20px;
margin-bottom:18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.top h1{
font-size:24px;
color:#172B3A;
margin-bottom:4px
}

.top p{
font-size:13px;
color:var(--muted)
}

.logout{
border:1px solid var(--border);
background:#fff;
color:#DC2626;
padding:9px 13px;
border-radius:7px;
font-size:12px;
font-weight:800;
cursor:pointer
}

.logout:hover{
background:#FEF2F2
}

.section{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:20px;
margin-bottom:18px
}

.section h2{
font-size:18px;
color:#172B3A;
margin-bottom:15px
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.info-box{
background:var(--bg);
border-radius:9px;
padding:13px
}

.info-box span{
display:block;
font-size:10px;
color:var(--muted);
font-weight:700;
margin-bottom:4px
}

.info-box strong{
font-size:13px;
color:var(--navy);
word-break:break-word
}

.purchase{
border:1px solid var(--border);
border-radius:10px;
padding:14px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.purchase:last-child{
margin-bottom:0
}

.purchase h3{
font-size:15px;
color:#172B3A;
margin-bottom:5px
}

.meta{
font-size:11px;
color:var(--muted);
line-height:1.6
}

.status{
display:inline-block;
padding:4px 7px;
border-radius:5px;
font-size:10px;
font-weight:800;
margin-top:6px
}

.paid{
background:#ECFDF5;
color:#15803D
}

.pending{
background:#FFF7ED;
color:#C2410C
}

.failed,
.cancelled,
.chargedback{
background:#FEF2F2;
color:#DC2626
}

.open{
border:0;
background:var(--blue);
color:#fff;
padding:9px 13px;
border-radius:7px;
font-size:12px;
font-weight:800;
cursor:pointer;
white-space:nowrap
}

.open:hover{
background:#1D4ED8
}

.open:disabled{
opacity:.6;
cursor:not-allowed
}

.empty{
text-align:center;
padding:30px 15px;
color:var(--muted)
}

.empty strong{
display:block;
color:#172B3A;
font-size:15px;
margin-bottom:5px
}

.shop{
display:inline-block;
margin-top:12px;
background:var(--blue);
color:#fff;
padding:9px 14px;
border-radius:7px;
font-size:12px;
font-weight:800
}

.message{
display:none;
margin-bottom:15px;
padding:11px 13px;
border-radius:8px;
font-size:12px;
font-weight:700
}

.error{
display:block;
background:#FEF2F2;
color:#DC2626;
border:1px solid #FECACA
}

footer{
background:#102E50;
color:#D9E4F0;
text-align:center;
padding:24px 15px;
font-size:12px
}

.footer-links{
margin-top:9px;
display:flex;
justify-content:center;
gap:16px;
flex-wrap:wrap
}

@media(max-width:650px){

.nav{
height:58px;
padding:0 12px
}

.brand{
font-size:12px;
max-width:180px
}

.brand img{
width:33px;
height:33px
}

.nav-links a{
font-size:11px;
padding:7px
}

main{
padding:22px 12px 45px
}

.top{
padding:17px;
align-items:flex-start
}

.top h1{
font-size:21px
}

.top p{
font-size:12px
}

.logout{
padding:8px 10px
}

.info{
grid-template-columns:1fr
}

.section{
padding:16px
}

.purchase{
display:block;
padding:13px
}

.open{
width:100%;
margin-top:10px
}

}
</style>
</head>

<body>

<header>

<nav class="nav">

<a href="/index.html" class="brand">

<img
src="https://assets.createlk.com/file_000000003e448207b8c6a7ecc4a7e1d4.png"
alt="CreateLK"
>

<span>CreateLK Digital Learning Shop</span>

</a>

<div class="nav-links">

<a href="/index.html">Home</a>
<a href="/shop.html">Shop</a>
<a href="/account.html" class="active">Account</a>

</div>

</nav>

</header>

<main>

<div id="message" class="message"></div>

<section class="top">

<div>

<h1>My Account</h1>

<p id="welcome">
Loading account...
</p>

</div>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

</section>


<section class="section">

<h2>Account Information</h2>

<div class="info">

<div class="info-box">

<span>NAME</span>

<strong id="name">—</strong>

</div>

<div class="info-box">

<span>EMAIL</span>

<strong id="email">—</strong>

</div>

<div class="info-box">

<span>PHONE</span>

<strong id="phone">—</strong>

</div>

</div>

</section>


<section class="section">

<h2>My Learning Resources</h2>

<div id="purchases">

<div class="empty">
Loading your resources...
</div>

</div>

</section>

</main>


<footer>

<div>CreateLK Digital Learning Shop</div>

<div class="footer-links">

<a href="/terms.html">Terms</a>
<a href="/privacy.html">Privacy</a>
<a href="/refund.html">Refund</a>
<a href="/contact.html">Contact</a>

</div>

</footer>


<script>

const API =
"https://createlk-digital-shop.createlk.workers.dev";


/*
|--------------------------------------------------------------------------
| Session
|--------------------------------------------------------------------------
*/

let token =
localStorage.getItem("createlk_token");


const $ =
id => document.getElementById(id);


/*
|--------------------------------------------------------------------------
| Redirect if no token
|--------------------------------------------------------------------------
*/

if(!token){

location.href =
"/login.html?redirect=/account.html";

}


/*
|--------------------------------------------------------------------------
| Logout
|--------------------------------------------------------------------------
*/

function logout(){

localStorage.removeItem(
"createlk_token"
);

location.href =
"/login.html";

}


/*
|--------------------------------------------------------------------------
| Error message
|--------------------------------------------------------------------------
*/

function showError(text){

$("message").textContent =
text;

$("message").className =
"message error";

}


/*
|--------------------------------------------------------------------------
| Escape HTML
|--------------------------------------------------------------------------
*/

function esc(v){

return String(v ?? "")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/*
|--------------------------------------------------------------------------
| Load account
|--------------------------------------------------------------------------
*/

async function loadAccount(){

try{

const r =
await fetch(
API+"/auth/me",
{
headers:{
"Authorization":
"Bearer "+token
}
}
);


const d =
await r.json();


if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Session expired."
);

}


const user =
d.customer ||
d.user;


if(!user){

throw Error(
"Account information was not returned."
);

}


const fullName = [
user.first_name,
user.last_name
]
.filter(Boolean)
.join(" ");


$("name").textContent =
fullName || "—";

$("email").textContent =
user.email || "—";

$("phone").textContent =
user.phone || "Not provided";

$("welcome").textContent =
"Welcome, "+
(user.first_name || "Customer")+
".";


await loadPurchases();


}catch(e){

console.error(e);

localStorage.removeItem(
"createlk_token"
);

showError(
e.message ||
"Please login again."
);


setTimeout(
()=>{
location.href =
"/login.html?redirect=/account.html";
},
1200
);

}

}


/*
|--------------------------------------------------------------------------
| Load purchases
|--------------------------------------------------------------------------
*/

async function loadPurchases(){

try{

const r =
await fetch(
API+"/my-purchases",
{
headers:{
"Authorization":
"Bearer "+token
}
}
);


const d =
await r.json();


if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Unable to load purchases."
);

}


const list =
Array.isArray(d.purchases)
?d.purchases
:[];


if(!list.length){

$("purchases").innerHTML = `

<div class="empty">

<strong>No purchases yet</strong>

<p>
Your purchased learning resources will appear here.
</p>

<a
class="shop"
href="/shop.html"
>
Browse Shop
</a>

</div>

`;

return;

}


$("purchases").innerHTML =
list.map(p=>{

const status =
String(
p.status ||
"PENDING"
).toUpperCase();


const cls =
status==="PAID"
?"paid":
status==="PENDING"
?"pending":
status==="CANCELLED"
?"cancelled":
status==="FAILED"
?"failed":
"chargedback";


const canOpen =
status==="PAID";


return `

<div class="purchase">

<div>

<h3>
${esc(
p.title ||
"Learning Resource"
)}
</h3>

<div class="meta">

${esc(
p.subject ||
"Learning"
)}

<br>

LKR ${
Number(
p.amount || 0
).toLocaleString("en-LK")
}

</div>

<span class="status ${cls}">
${esc(status)}
</span>

</div>

${
canOpen
?
`
<button
class="open"
onclick="openLesson(${Number(p.product_id)},this)"
>
Open Lesson
</button>
`
:
""
}

</div>

`;

}).join("");


}catch(e){

console.error(e);

$("purchases").innerHTML = `

<div class="empty">

<strong>
Unable to load purchases
</strong>

<p>
Please refresh the page and try again.
</p>

</div>

`;

}

}


/*
|--------------------------------------------------------------------------
| Open purchased lesson
|--------------------------------------------------------------------------
*/

async function openLesson(
productId,
button
){

if(button){

button.disabled=true;
button.textContent=
"Opening...";
}


try{

const r =
await fetch(
API+"/content/"+productId,
{
headers:{
"Authorization":
"Bearer "+token
}
}
);


const d =
await r.json();


if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Unable to open this lesson."
);

}


/*
|--------------------------------------------------------------------------
| IMPORTANT
|
| Worker returns:
|
| {
|   success:true,
|   product:{
|     title,
|     subject,
|     content
|   }
| }
|--------------------------------------------------------------------------
*/

const product =
d.product;


if(!product){

throw Error(
"Lesson content was not returned."
);

}


const win =
window.open(
"",
"_blank"
);


if(!win){

throw Error(
"Please allow pop-ups to open the lesson."
);

}


win.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>
${esc(
product.title ||
"CreateLK Lesson"
)}
</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:850px;
margin:auto;
padding:25px 16px;
line-height:1.7;
color:#263238;
background:#fff
}

h1{
color:#163A63;
margin-bottom:8px
}

.subject{
color:#6B7785;
font-size:13px;
margin-bottom:20px
}

.content{
font-size:15px
}

</style>

</head>

<body>

<h1>
${esc(
product.title ||
"Learning Resource"
)}
</h1>

<div class="subject">
${esc(
product.subject ||
"Learning"
)}
</div>

<div class="content">

${
product.content ||
"<p>Lesson content is not available.</p>"
}

</div>

</body>

</html>

`);


win.document.close();


}catch(e){

console.error(e);

showError(
e.message ||
"Unable to open lesson."
);


if(button){

button.disabled=false;
button.textContent=
"Open Lesson";

}

}

}


/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

if(token){

loadAccount();

}

</script>

</body>
</html>
