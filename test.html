<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Payment Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:system-ui,sans-serif;
  background:#f3f6fb;
  color:#0f172a
}
.card{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:22px;
  border-radius:16px;
  border:1px solid #e2e8f0
}
h2{margin:0 0 8px}
p{font-size:14px;color:#64748b;line-height:1.5}
button{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:12px
}
button:disabled{opacity:.6}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0f172a;
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-top:15px
}
.ok{color:#047857;font-weight:800}
.err{color:#dc2626;font-weight:800}
</style>
</head>

<body>

<div class="card">

<h2>💳 CreateLK Payment Test</h2>

<p>
This page tests only the existing
<code>/api/checkout</code> endpoint.
</p>

<p>
Student ID:
<strong id="studentId">Loading...</strong>
</p>

<button id="payButton" onclick="checkout()">
💳 Test PayHere Checkout
</button>

<div id="status"></div>

<pre id="response">Waiting...</pre>

</div>

<script>

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};

try{

  student=JSON.parse(
    localStorage.getItem(STUDENT_KEY)||"{}"
  );

}catch(e){

  student={};

}


/* GET STUDENT ID */

function id(){

  return Number(
    student.id ||
    student.database_id ||
    student.student_id_number ||
    student.student_id ||
    0
  );

}


const studentId=id();

document.getElementById("studentId").textContent =
studentId || "NOT FOUND";


/* CHECKOUT TEST */

async function checkout(){

  const button=
    document.getElementById("payButton");

  const status=
    document.getElementById("status");

  const responseBox=
    document.getElementById("response");


  if(!studentId){

    status.innerHTML=
      '<p class="err">Student session not found.</p>';

    responseBox.textContent=
      "Please login again.";

    return;
  }


  button.disabled=true;

  button.textContent=
    "⏳ Connecting to payment service...";


  status.innerHTML=
    "<p>Sending checkout request...</p>";

  responseBox.textContent=
    "Waiting for server response...";


  try{

    const r=
      await fetch(
        PAYMENT+"/api/checkout",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },

          body:JSON.stringify({
            student_id:studentId
          })
        }
      );


    const raw=
      await r.text();


    console.log(
      "Checkout HTTP status:",
      r.status
    );

    console.log(
      "Checkout raw response:",
      raw
    );


    responseBox.textContent=
      "HTTP STATUS: "+r.status+
      "\n\n"+
      "RAW RESPONSE:\n"+
      raw;


    /* SERVER ERROR */

    if(!r.ok){

      let message=
        "Payment service returned HTTP "+
        r.status;

      try{

        const errorData=
          JSON.parse(raw);

        message=
          errorData.error ||
          errorData.message ||
          errorData.details ||
          message;

      }catch(e){}


      status.innerHTML=
        '<p class="err">❌ '+escapeHtml(message)+'</p>';

      button.disabled=false;

      button.textContent=
        "💳 Test PayHere Checkout";

      return;
    }


    /* DIRECT HTML PAYHERE FORM */

    if(
      raw.toLowerCase().includes("<form")
    ){

      status.innerHTML=
        '<p class="ok">✅ PayHere form received.</p>';

      const wrapper=
        document.createElement("div");

      wrapper.innerHTML=raw;

      const form=
        wrapper.querySelector("form");


      if(!form){

        throw new Error(
          "Server returned HTML but no payment form was found."
        );
      }


      document.body.innerHTML="";

      document.body.appendChild(form);

      form.submit();

      return;
    }


    /* JSON RESPONSE */

    let data;

    try{

      data=JSON.parse(raw);

    }catch(e){

      throw new Error(
        "Server returned an invalid payment response."
      );

    }


    console.log(
      "Checkout JSON:",
      data
    );


    /* CHECKOUT URL */

    if(data.url){

      status.innerHTML=
        '<p class="ok">✅ Checkout URL received. Opening PayHere...</p>';

      setTimeout(
        ()=>{
          window.location.href=data.url;
        },
        300
      );

      return;
    }


    if(data.checkout_url){

      status.innerHTML=
        '<p class="ok">✅ Checkout URL received. Opening PayHere...</p>';

      setTimeout(
        ()=>{
          window.location.href=data.checkout_url;
        },
        300
      );

      return;
    }


    /* PAYHERE FORM DATA */

    if(
      data.action &&
      data.fields
    ){

      const form=
        document.createElement("form");

      form.method="POST";

      form.action=data.action;

      form.style.display="none";


      Object.entries(data.fields)
        .forEach(
          ([name,value])=>{

            const input=
              document.createElement("input");

            input.type="hidden";

            input.name=name;

            input.value=value;

            form.appendChild(input);

          }
        );


      document.body.appendChild(form);


      status.innerHTML=
        '<p class="ok">✅ PayHere form data received. Opening checkout...</p>';


      form.submit();

      return;
    }


    throw new Error(
      data.message ||
      data.error ||
      "PayHere checkout information was not returned."
    );


  }catch(e){

    console.error(
      "Checkout error:",
      e
    );


    status.innerHTML=
      '<p class="err">❌ '+escapeHtml(
        e.message ||
        "Checkout request failed."
      )+'</p>';


    responseBox.textContent=
      responseBox.textContent+
      "\n\nJAVASCRIPT ERROR:\n"+
      (e.stack || e.message);


    button.disabled=false;

    button.textContent=
      "💳 Test PayHere Checkout";

  }

}


/* SAFE TEXT */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
