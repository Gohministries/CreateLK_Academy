<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Payment Route Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:system-ui,sans-serif;
  background:#f3f6fb;
  color:#0f172a
}

.card{
  max-width:600px;
  margin:20px auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:20px
}

h2{
  margin:0 0 8px
}

p{
  color:#64748b;
  font-size:14px;
  line-height:1.5
}

button{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  margin-top:10px
}

button:disabled{
  opacity:.6
}

pre{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px
}

.ok{
  color:#047857;
  font-weight:800
}

.bad{
  color:#dc2626;
  font-weight:800
}
</style>
</head>

<body>

<div class="card">

<h2>💳 CreateLK Payment Route Test</h2>

<p>
Testing the currently deployed payment Worker without changing it.
</p>

<p>
Student ID:
<strong id="studentId">Loading...</strong>
</p>

<button id="test" onclick="testRoutes()">
🔍 Test Payment Routes
</button>

<div id="status"></div>

<pre id="output">Waiting...</pre>

</div>

<script>

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

let student={};

try{

student=JSON.parse(
localStorage.getItem(STUDENT_KEY)||"{}"
);

}catch(e){

student={};

}

function id(){

return Number(
student.id ||
student.database_id ||
student.student_id_number ||
student.student_id ||
0
);

}

const studentId=id();

document.getElementById("studentId").textContent =
studentId || "NOT FOUND";


async function testRoute(path){

const result={
route:path
};

try{

const response=
await fetch(
PAYMENT+path,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
student_id:studentId
})
}
);

result.status=response.status;
result.statusText=response.statusText;

result.body=await response.text();

}catch(e){

result.error=e.message;

}

return result;

}


async function testRoutes(){

const button=
document.getElementById("test");

const status=
document.getElementById("status");

const output=
document.getElementById("output");


if(!studentId){

status.innerHTML=
'<p class="bad">❌ Student ID not found.</p>';

return;

}


button.disabled=true;

button.textContent=
"⏳ Testing...";

status.innerHTML=
"<p>Testing payment routes...</p>";

output.textContent="";


const routes=[

"/api/checkout",

"/checkout",

"/api/pay",

"/pay",

"/api/payment",

"/payment",

"/api/create-checkout",

"/create-checkout"

];


const results=[];


for(const route of routes){

const result=
await testRoute(route);

results.push(result);


output.textContent +=
"\n================================\n"+
"ROUTE: "+result.route+
"\nSTATUS: "+(result.status || "ERROR")+
"\n\n"+
(result.body || result.error || "")+
"\n";


/*
Stop if a real checkout response
is found.
*/

if(
result.status &&
result.status>=200 &&
result.status<300
){

status.innerHTML=
'<p class="ok">✅ Possible active checkout route found: '+
escapeHtml(route)+
'</p>';

break;

}

}


console.log(
"Payment route test results:",
results
);


button.disabled=false;

button.textContent=
"🔍 Test Payment Routes";

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
