<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK PayHere Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:system-ui,sans-serif;
  background:#f3f6fb;
  color:#0f172a
}

.card{
  max-width:600px;
  margin:30px auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:20px
}

h2{margin:0 0 8px}

p{
  color:#64748b;
  font-size:14px;
  line-height:1.5
}

button{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  margin-top:12px
}

button:disabled{opacity:.6}

pre{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px
}

.ok{
  color:#047857;
  font-weight:800
}

.err{
  color:#dc2626;
  font-weight:800
}
</style>
</head>

<body>

<div class="card">

<h2>💳 CreateLK PayHere Test</h2>

<p>
Testing the existing Premium Notify Worker directly.
</p>

<p>
Student ID:
<strong>30</strong>
</p>

<button id="payButton" onclick="testPayment()">
💳 Test PayHere
</button>

<div id="status"></div>

<pre id="output">Waiting...</pre>

</div>

<script>

const NOTIFY =
"https://createlk-premium-notify.createlk.workers.dev";

const STUDENT_ID = 30;


async function testPayment(){

  const button =
    document.getElementById("payButton");

  const status =
    document.getElementById("status");

  const output =
    document.getElementById("output");


  button.disabled = true;

  button.textContent =
    "⏳ Connecting...";

  status.innerHTML =
    "<p>Sending request...</p>";

  output.textContent =
    "Waiting for response...";


  try{

    const r =
      await fetch(
        NOTIFY,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },

          body:JSON.stringify({
            student_id:STUDENT_ID
          })
        }
      );


    const raw =
      await r.text();


    console.log(
      "HTTP:",
      r.status
    );

    console.log(
      "Response:",
      raw
    );


    output.textContent =
      "HTTP STATUS: "+
      r.status+
      "\n\n"+
      "RESPONSE:\n"+
      raw;


    if(!r.ok){

      status.innerHTML =
        '<p class="err">❌ HTTP '+
        r.status+
        '</p>';

      return;
    }


    /*
      If Worker returns a PayHere HTML form
    */

    if(
      raw.toLowerCase().includes("<form")
    ){

      status.innerHTML =
        '<p class="ok">✅ PayHere form received. Opening...</p>';


      const wrapper =
        document.createElement("div");

      wrapper.innerHTML = raw;


      const form =
        wrapper.querySelector("form");


      if(!form){

        throw new Error(
          "HTML returned but no form found."
        );
      }


      document.body.innerHTML = "";

      document.body.appendChild(form);

      form.submit();

      return;
    }


    /*
      JSON response
    */

    let data;

    try{

      data = JSON.parse(raw);

    }catch(e){

      throw new Error(
        "Worker returned non-JSON data."
      );

    }


    console.log(
      "JSON:",
      data
    );


    /*
      Direct PayHere URL
    */

    if(data.url){

      status.innerHTML =
        '<p class="ok">✅ PayHere URL received.</p>';

      window.location.href =
        data.url;

      return;
    }


    if(data.checkout_url){

      status.innerHTML =
        '<p class="ok">✅ PayHere checkout URL received.</p>';

      window.location.href =
        data.checkout_url;

      return;
    }


    /*
      PayHere form data
    */

    if(
      data.action &&
      data.fields
    ){

      const form =
        document.createElement("form");

      form.method = "POST";

      form.action = data.action;

      form.style.display = "none";


      Object.entries(data.fields)
      .forEach(
        ([name,value])=>{

          const input =
            document.createElement("input");

          input.type = "hidden";

          input.name = name;

          input.value = value;

          form.appendChild(input);

        }
      );


      document.body.appendChild(form);

      status.innerHTML =
        '<p class="ok">✅ PayHere form data received. Opening...</p>';

      form.submit();

      return;
    }


    status.innerHTML =
      '<p class="err">⚠️ Worker responded, but no PayHere checkout was returned.</p>';

  }catch(e){

    console.error(e);

    status.innerHTML =
      '<p class="err">❌ '+
      e.message+
      '</p>';

    output.textContent +=
      "\n\nERROR:\n"+
      (e.stack || e.message);

  }finally{

    button.disabled = false;

    button.textContent =
      "💳 Test PayHere";

  }

}

</script>

</body>
</html>
