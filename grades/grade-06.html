<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:10}
.menu{font-size:25px;border:0;background:none;cursor:pointer;margin-right:10px}
.logo{width:40px;height:40px;object-fit:contain;margin-right:10px}
.brand{font-weight:700;flex:1}
.badge{background:#eef4ff;color:#175cd3;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:bold}
.dash{margin-left:10px;color:#175cd3;text-decoration:none;font-size:13px}

.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:19}
.overlay.show{display:block}

.drawer{position:fixed;top:0;left:-320px;width:300px;max-width:88%;height:100%;background:#fff;z-index:20;transition:.25s;overflow:auto}
.drawer.open{left:0}
.drawer-head{padding:18px;background:linear-gradient(135deg,#071a3d,#1261d6);color:#fff;display:flex;justify-content:space-between}
.drawer-head h2{margin:0;font-size:18px}
.close{border:0;background:none;color:#fff;font-size:25px}
.subject{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}
.subject.active,.subject:hover{background:#eef4ff}
.subject small{display:block;color:#667085;margin-top:3px}

.hero{background:linear-gradient(135deg,#071a3d,#1261d6,#08a6c9);color:#fff;padding:32px 20px}
.hero-inner,.main{max-width:1050px;margin:auto}
.hero h1{margin:8px 0;font-size:30px}
.hero p{margin:0;opacity:.9}

.main{padding:20px}
.box,.lesson,.content,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px}
.box{padding:15px;margin-bottom:20px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:7px}
select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px}

.status{padding:13px 15px;border-radius:10px;margin-bottom:15px;font-size:13px;font-weight:bold}
.status.ok{background:#ecfdf3;color:#027a48}
.status.lock{background:#fff7e6;color:#b54708}
.status.expired{background:#fff1f0;color:#b42318}

.status .countdown{
display:block;
margin-top:7px;
font-size:12px;
font-weight:600
}

h2.section{font-size:20px;margin:22px 0 10px}

.units{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.unit{white-space:nowrap;padding:9px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}
.unit.active{background:#175cd3;color:#fff;border-color:#175cd3}

.lessons{display:grid;gap:10px}
.lesson{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.num{width:40px;height:40px;border-radius:10px;background:#eef4ff;color:#175cd3;display:grid;place-items:center;font-weight:bold}
.info{flex:1}
.info h3{margin:0 0 5px;font-size:15px}
.meta{font-size:12px;color:#667085}
.access{font-size:10px;font-weight:bold;padding:6px 9px;border-radius:20px}
.free{background:#ecfdf3;color:#027a48}
.premium{background:#fff4d6;color:#a15c00}

.content{padding:20px;margin-top:20px;line-height:1.7}
.content h2{margin-top:0}
.content h3{margin-top:22px}
.content-box{background:#f8fafc;padding:13px;border-radius:9px;white-space:pre-line}

.lock{background:linear-gradient(135deg,#071a3d,#175cd3);color:#fff;text-align:center;padding:30px 20px;border-radius:15px;margin-top:20px}
.lock h2{margin:8px 0}
.lock p{opacity:.9}
.btn{display:inline-block;background:#fff;color:#175cd3;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:8px}

.empty{text-align:center;padding:25px;color:#667085}
.loading{text-align:center;padding:25px;color:#667085}

@media(max-width:600px){
.badge{display:none}
.hero h1{font-size:26px}
.lesson{padding:12px}
}
</style>
</head>

<body>

<header>
<button class="menu" onclick="openMenu()">☰</button>

<img class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

<div class="brand">CreateLK Academy</div>

<span class="badge">Grade 06</span>

<a class="dash" href="/dashboard.html">Dashboard</a>
</header>


<div id="overlay" class="overlay" onclick="closeMenu()"></div>


<aside id="drawer" class="drawer">

<div class="drawer-head">
<h2>Grade 06 Subjects</h2>
<button class="close" onclick="closeMenu()">×</button>
</div>

<div id="subjects" style="padding:10px">
<div class="loading">Loading...</div>
</div>

</aside>


<section class="hero">

<div class="hero-inner">

<small>CreateLK Academy • Grade 06</small>

<h1 id="title">
English Language
</h1>

<p>
Learn step by step with structured lessons and practice.
</p>

</div>

</section>


<main class="main">

<div class="box">

<label>
Learning Language
</label>

<select id="language">

<option value="en">
English
</option>

<option value="si">
සිංහල
</option>

<option value="ta">
தமிழ்
</option>

</select>

</div>


<div id="status"></div>


<h2 class="section">
Units
</h2>

<div id="units" class="units"></div>


<h2 class="section">
Lessons
</h2>

<div id="lessons" class="lessons">
<div class="loading">
Loading lessons...
</div>
</div>


<div id="content"></div>

</main>


<script>

/* ================= CONFIG ================= */

const API =
"https://createlk-academy-api.createlk.workers.dev";

const PREMIUM_API =
"https://createlk-premium-api.createlk.workers.dev";

const PAYHERE_URL =
"https://createlk-payhere.createlk.workers.dev";

const GRADE = "06";


/* ================= STATE ================= */

let subject = "English Language";
let lessons = [];
let unit = "";
let selected = null;

let premiumActive = false;
let expiresAt = null;
let countdownTimer = null;


/* ================= HELPERS ================= */

const $ = id =>
document.getElementById(id);

function token(){
return localStorage.getItem("createlk_token");
}

function headers(){

return token()
? {Authorization:`Bearer ${token()}`}
: {};

}

function esc(v){

return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


/* ================= FREE LESSON ================= */

function isFree(lesson){

return subject === "English Language"
&& Number(lesson.lesson_number) === 1;

}


/* ================= MENU ================= */

function openMenu(){

$("drawer").classList.add("open");
$("overlay").classList.add("show");

}

function closeMenu(){

$("drawer").classList.remove("open");
$("overlay").classList.remove("show");

}


/* ================= PREMIUM STATUS ================= */

async function premiumStatus(){

clearInterval(countdownTimer);

premiumActive = false;
expiresAt = null;


if(!token()){

showPremiumStatus();

return;

}


try{

const r = await fetch(

`${PREMIUM_API}/premium/status?grade=${GRADE}`,

{
headers:headers()
}

);


const d = await r.json();


premiumActive =
d.active === true ||
d.premium === true ||
d.subscription_active === true;


expiresAt =
d.expires_at ||
d.expiresAt ||
null;


if(premiumActive && expiresAt){

if(new Date(expiresAt).getTime() <= Date.now()){

premiumActive = false;
expiresAt = null;

}

}


}catch(e){

console.error(
"Premium status error:",
e
);

}


showPremiumStatus();

}


/* ================= PREMIUM UI ================= */

function showPremiumStatus(){

clearInterval(countdownTimer);


if(!token()){

$("status").className =
"status lock";

$("status").innerHTML = `

🔒 Premium membership required.

<br>

<a class="btn"
href="${PAYHERE_URL}/?grade=${GRADE}">
Get Premium
</a>

`;

return;

}


if(premiumActive && expiresAt){

$("status").className =
"status ok";

$("status").innerHTML = `

✓ Premium Active

<span
id="countdown"
class="countdown">
Loading...
</span>

`;

updateCountdown();

countdownTimer =
setInterval(
updateCountdown,
1000
);

return;

}


$("status").className =
"status expired";

$("status").innerHTML = `

⚠ Premium expired.

<br>

<a class="btn"
href="${PAYHERE_URL}/?grade=${GRADE}">
Renew Premium
</a>

`;

}


/* ================= COUNTDOWN ================= */

function updateCountdown(){

if(!expiresAt){

return;

}


const end =
new Date(expiresAt).getTime();

const diff =
end - Date.now();


if(diff <= 0){

clearInterval(countdownTimer);

premiumActive = false;
expiresAt = null;

showPremiumStatus();

return;

}


const days =
Math.floor(
diff / 86400000
);

const hours =
Math.floor(
(diff % 86400000) / 3600000
);

const minutes =
Math.floor(
(diff % 3600000) / 60000
);

const seconds =
Math.floor(
(diff % 60000) / 1000
);


const el =
$("countdown");


if(el){

el.textContent =
`⏳ ${days}d ${hours}h ${minutes}m ${seconds}s remaining`;

}

}


/* ================= SUBJECTS ================= */

async function loadSubjects(){

try{

const r =
await fetch(
`${API}/subjects?grade=${GRADE}`
);

const d =
await r.json();

const list =
d.subjects ||
d.data ||
[];


if(!list.length){

$("subjects").innerHTML =
`<div class="empty">
No subjects available.
</div>`;

return;

}


$("subjects").innerHTML =
list.map((s,i)=>{

const name =
s.subject ||
s.name ||
"";

return `

<button
class="subject ${name===subject?"active":""}"
data-s="${encodeURIComponent(name)}"
onclick="selectSubject(this.dataset.s)">

<b>
${String(i+1).padStart(2,"0")}.
${esc(name)}
</b>

<small>
${esc(s.sinhala_name || "")}
</small>

</button>

`;

}).join("");


}catch(e){

$("subjects").innerHTML =
`<div class="empty">
Unable to load subjects.
</div>`;

}

}


/* ================= SUBJECT ================= */

async function selectSubject(s){

subject =
decodeURIComponent(s);

$("title").textContent =
subject;

closeMenu();

unit = "";
selected = null;

$("content").innerHTML = "";

await premiumStatus();

await loadLessons();

loadSubjects();

}


/* ================= LESSONS ================= */

async function loadLessons(){

$("units").innerHTML = "";

$("lessons").innerHTML =
`<div class="loading">
Loading lessons...
</div>`;


try{

const r =
await fetch(

`${API}/lessons?grade=${GRADE}&subject=${encodeURIComponent(subject)}`

);


const d =
await r.json();

lessons =
d.lessons ||
d.data ||
[];


if(!lessons.length){

$("lessons").innerHTML =
`<div class="empty">
No lessons available.
</div>`;

return;

}


const units =
[...new Set(
lessons.map(
x => x.unit || "General"
)
)];


unit =
unit && units.includes(unit)
? unit
: units[0];


$("units").innerHTML =
units.map(u=>`

<button
class="unit ${u===unit?"active":""}"
onclick="selectUnit(${JSON.stringify(u)})">

${esc(u)}

</button>

`).join("");


renderLessons();


}catch(e){

$("lessons").innerHTML =
`<div class="empty">
Unable to load lessons.
</div>`;

}

}


/* ================= UNIT ================= */

function selectUnit(u){

unit = u;

document
.querySelectorAll(".unit")
.forEach(x =>
x.classList.toggle(
"active",
x.textContent.trim() === u
)
);

renderLessons();

}


/* ================= RENDER LESSONS ================= */

function renderLessons(){

const list =
lessons.filter(
x => (x.unit || "General") === unit
);


$("lessons").innerHTML =
list.map(l=>{

const free =
isFree(l);

return `

<div
class="lesson"
onclick="openLesson(${Number(l.lesson_number)})">

<div class="num">
${Number(l.lesson_number)}
</div>

<div class="info">

<h3>
${esc(
l.title ||
l.lesson_title ||
`Lesson ${l.lesson_number}`
)}
</h3>

<div class="meta">
${l.duration
? l.duration + " minutes"
: "Lesson"}
</div>

</div>

<span
class="access ${free?"free":"premium"}">

${free ? "FREE" : "PREMIUM"}

</span>

</div>

`;

}).join("");

}


/* ================= OPEN LESSON ================= */

async function openLesson(n){

const lesson =
lessons.find(
x => Number(x.lesson_number) === Number(n)
);


if(!lesson)return;

selected = lesson;


if(isFree(lesson)){

await getLesson(n);

return;

}


if(!token()){

showLogin();

return;

}


if(!premiumActive){

showPremiumLock();

return;

}


await getLesson(n);

}


/* ================= LOGIN ================= */

function showLogin(){

$("content").innerHTML = `

<div class="lock">

<div style="font-size:40px">
🔐
</div>

<h2>
Login Required
</h2>

<p>
Please login to access this lesson.
</p>

<a
class="btn"
href="/auth/login.html">

Login

</a>

</div>

`;

}


/* ================= PREMIUM LOCK ================= */

function showPremiumLock(){

$("content").innerHTML = `

<div class="lock">

<div style="font-size:40px">
🔒
</div>

<h2>
Premium Lesson
</h2>

<p>
This lesson is available for Premium members.
</p>

<a
class="btn"
href="${PAYHERE_URL}/?grade=${GRADE}">

Get Premium

</a>

</div>

`;

}


/* ================= GET LESSON ================= */

async function getLesson(n){

$("content").innerHTML =
`<div class="loading">
Loading lesson...
</div>`;


try{

const url =
`${API}/lesson?grade=${GRADE}` +
`&subject=${encodeURIComponent(subject)}` +
`&lesson=${n}` +
`&language=${language.value}`;


const r =
await fetch(
url,
{
headers:headers()
}
);


const d =
await r.json();


if(r.status === 401){

showLogin();

return;

}


if(r.status === 403){

showPremiumLock();

return;

}


if(!r.ok){

throw Error();

}


renderLesson(d);


}catch(e){

$("content").innerHTML =
`<div class="empty">
Unable to load lesson.
</div>`;

}

}


/* ================= RENDER CONTENT ================= */

function renderLesson(d){

const l =
d.lesson ||
d.data ||
d;

const questions =
d.questions ||
[];


let html = `

<div class="content">

<h2>
${esc(l.title || "Lesson")}
</h2>

`;


if(l.objectives){

html += `

<h3>
Learning Objectives
</h3>

<div class="content-box">
${esc(l.objectives)}
</div>

`;

}


if(l.content){

html += `

<h3>
Lesson Content
</h3>

<div class="content-box">
${esc(l.content)}
</div>

`;

}


if(l.key_points){

html += `

<h3>
Key Points
</h3>

<div class="content-box">
${esc(l.key_points)}
</div>

`;

}


if(l.summary){

html += `

<h3>
Summary
</h3>

<div class="content-box">
${esc(l.summary)}
</div>

`;

}


if(l.video_url){

html += `

<h3>
Video
</h3>

<a
href="${esc(l.video_url)}"
target="_blank"
rel="noopener">

Watch Lesson Video

</a>

`;

}


if(questions.length){

html += `
<h3>
Practice Questions
</h3>
`;


questions.forEach((q,i)=>{

html += `

<div class="content-box">

<b>
${i+1}. ${esc(q.question)}
</b>

<div>
A. ${esc(q.option_a)}
</div>

<div>
B. ${esc(q.option_b)}
</div>

<div>
C. ${esc(q.option_c)}
</div>

<div>
D. ${esc(q.option_d)}
</div>

</div>

`;

});

}


html += `
</div>
`;


$("content").innerHTML =
html;


$("content").scrollIntoView({
behavior:"smooth"
});

}


/* ================= LANGUAGE ================= */

$("language").onchange = () => {

if(selected){

openLesson(
selected.lesson_number
);

}

};


/* ================= START ================= */

(async()=>{

await loadSubjects();

await premiumStatus();

await loadLessons();

})();

</script>

</body>
</html>
