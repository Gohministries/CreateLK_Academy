<script>


/* =========================
   API CONFIG
========================= */

const API =
"https://createlk-premium-api.createlk.workers.dev";

const GRADE =
"06";


/* =========================
   VARIABLES
========================= */

let token = null;

let lang = "en";

let premium = false;


/* =========================
   SUBJECT DATA
========================= */

const data = {

en:[

["mathematics","📐","Mathematics"],

["science","🔬","Science"],

["technology","⚙️","Technology for Life"],

["entrepreneurship","💡","Entrepreneurship & Financial Literacy"]

],


si:[

["mathematics","📐","ගණිතය"],

["science","🔬","විද්‍යාව"],

["english","🔤","ඉංග්‍රීසි භාෂාව"],

["sinhala","📖","සිංහල භාෂාව"],

["tamil","📚","දෙමළ භාෂාව"],

["second-language","🌐","දෙවන ජාතික භාෂාව"],

["history","🏛️","ඉතිහාසය"],

["geography","🌍","භූගෝල විද්‍යාව"],

["civic","🤝","පුරවැසි අධ්‍යාපනය"],

["religion","🕊️","ආගම හා සාරධර්ම"],

["health","❤️","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය"],

["ict","💻","ICT"],

["aesthetic","🎨","සෞන්දර්ය අධ්‍යාපනය"],

["technology","⚙️","ජීවිතය සඳහා තාක්ෂණය"],

["entrepreneurship","💡","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව"]

],


ta:[

["mathematics","📐","கணிதம்"],

["science","🔬","விஞ்ஞானம்"],

["english","🔤","ஆங்கில மொழி"],

["sinhala","📖","சிங்கள மொழி"],

["tamil","📚","தமிழ் மொழி"],

["second-language","🌐","இரண்டாம் தேசிய மொழி"],

["history","🏛️","வரலாறு"],

["geography","🌍","புவியியல்"],

["civic","🤝","குடியியல் கல்வி"],

["religion","🕊️","சமயம்"],

["health","❤️","சுகாதாரம் மற்றும் உடற்கல்வி"],

["ict","💻","ICT"],

["aesthetic","🎨","அழகியல் கல்வி"],

["technology","⚙️","வாழ்க்கைக்கான தொழில்நுட்பம்"],

["entrepreneurship","💡","தொழில்முனைவோர் மற்றும் நிதியறிவு"]

]

};


/* =========================
   LANGUAGE SWITCH
========================= */

function language(x,button){

lang = x;

document
.querySelectorAll(".lang")
.forEach(function(element){

element.classList.remove("active");

});

button.classList.add("active");

render();

}


/* =========================
   RENDER SUBJECTS
========================= */

function render(){

const subjects =
document.getElementById("subjects");

subjects.innerHTML =
data[lang].map(function(s){

return `

<div class="subject">

<div style="font-size:25px">
${s[1]}
</div>

<h3>
${s[2]}
</h3>

<button
class="open"
onclick="openSubject('${s[0]}')">

Open Subject →

</button>

</div>

`;

}).join("");

}


/* =========================
   SHOW LOGIN REQUIRED
========================= */

function showLoginRequired(message){

const status =
document.getElementById("status");

status.className =
"status inactive";

document.getElementById("statusTitle")
.textContent =
"🔴 Login Required";

document.getElementById("statusText")
.textContent =
message ||
"Please log in to access Grade 06 Premium.";

document.getElementById("pay")
.style.display =
"none";

}


/* =========================
   SHOW LOGGED IN
========================= */

function showLoggedIn(){

const status =
document.getElementById("status");

status.className =
"status loading";

document.getElementById("statusTitle")
.textContent =
"🔵 Logged In";

document.getElementById("statusText")
.textContent =
"Checking Grade 06 Premium...";

}


/* =========================
   SHOW CONNECTION ERROR
========================= */

function showConnectionError(){

const status =
document.getElementById("status");

status.className =
"status error";

document.getElementById("statusTitle")
.textContent =
"⚠️ Connection Error";

document.getElementById("statusText")
.textContent =
"Unable to check your account. Please refresh and try again.";

document.getElementById("pay")
.style.display =
"none";

}


/* =========================
   CHECK TOKEN
========================= */

function getToken(){

token =
localStorage.getItem(
"createlk_token"
);

return token;

}


/* =========================
   CHECK PREMIUM
========================= */

async function checkPremium(){

/*
  Read the latest login token.
*/

if(!getToken()){

showLoginRequired();

return;

}


/*
  Token exists.
  Do NOT call /auth/me from the
  browser. Premium API will verify it.
*/

showLoggedIn();


try{

const response =
await fetch(

API +
"/premium/status?grade=" +
encodeURIComponent(GRADE),

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token,

"Accept":
"application/json"

}

});


/*
  401 means the token is actually
  invalid or expired.
*/

if(response.status === 401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

token = null;

showLoginRequired(
"Your login session has expired. Please log in again."
);

return;

}


/*
  Read JSON.
*/

let result;

try{

result =
await response.json();

}catch(error){

console.error(
"Invalid JSON:",
error
);

showConnectionError();

return;

}


/*
  PREMIUM ACTIVE
*/

if(

response.ok &&

result.success &&

result.premium &&

result.premium.active === true

){

premium = true;


document.getElementById("status")
.className =
"status active";


document.getElementById("statusTitle")
.textContent =
"🟢 Grade 06 Premium Active";


if(result.premium.expires_at){

document.getElementById("statusText")
.textContent =
"Valid until: " +
new Date(
result.premium.expires_at
).toLocaleDateString();

}else{

document.getElementById("statusText")
.textContent =
"Premium is active.";

}


document.getElementById("pay")
.style.display =
"none";


return;

}


/*
  LOGGED IN BUT PREMIUM NOT ACTIVE
*/

premium = false;


document.getElementById("status")
.className =
"status inactive";


document.getElementById("statusTitle")
.textContent =
"🔴 Premium Inactive";


document.getElementById("statusText")
.textContent =
"Grade 06 Premium is required.";


document.getElementById("pay")
.style.display =
"block";


}catch(error){

console.error(
"Premium API error:",
error
);

showConnectionError();

}

}


/* =========================
   OPEN SUBJECT
========================= */

async function openSubject(subject){

/*
  Always get latest token.
*/

if(!getToken()){

window.location.href =
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


/*
  Do not trust the frontend
  premium variable.
  Server decides access.
*/

const message =
document.getElementById("message");

message.textContent =
"Loading...";


try{

const response =
await fetch(

API +
"/content?grade=" +
encodeURIComponent(GRADE) +

"&subject=" +
encodeURIComponent(subject) +

"&language=" +
encodeURIComponent(lang),

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token,

"Accept":
"application/json"

}

});


/*
  SESSION EXPIRED
*/

if(response.status === 401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

token = null;

window.location.href =
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


/*
  PREMIUM REQUIRED
*/

if(response.status === 403){

message.textContent =
"Grade 06 Premium is required.";

premium = false;

document.getElementById("status")
.className =
"status inactive";

document.getElementById("statusTitle")
.textContent =
"🔴 Premium Inactive";

document.getElementById("statusText")
.textContent =
"Grade 06 Premium is required.";

document.getElementById("pay")
.style.display =
"block";

return;

}


/*
  Parse response.
*/

let result;

try{

result =
await response.json();

}catch(error){

message.textContent =
"Invalid server response.";

return;

}


/*
  CONTENT ERROR
*/

if(

!response.ok ||
!result.success

){

message.textContent =
result.error ||
"Unable to load content.";

return;

}


/*
  SHOW CONTENT
*/

message.textContent = "";


document.getElementById("content")
.style.display =
"block";


document.getElementById("contentTitle")
.textContent =
result.product?.title ||
subject;


document.getElementById("lesson")
.innerHTML =
result.product?.content ||
"No content available.";


document.getElementById("content")
.scrollIntoView({
behavior:"smooth"
});


}catch(error){

console.error(
"Content error:",
error
);

message.textContent =
"Unable to connect. Please try again.";

}

}


/* =========================
   SUBSCRIBE
   LKR 999 / 30 DAYS
========================= */

async function subscribe(){

if(!getToken()){

window.location.href =
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


const button =
document.getElementById("pay");


try{

button.disabled = true;

button.textContent =
"Loading...";


const response =
await fetch(

API +
"/premium/checkout?grade=" +
encodeURIComponent(GRADE),

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token,

"Accept":
"application/json"

}

});


/*
  SESSION EXPIRED
*/

if(response.status === 401){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

token = null;

window.location.href =
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


let result;

try{

result =
await response.json();

}catch(error){

alert(
"Invalid payment server response."
);

return;

}


/*
  CHECKOUT URL
*/

if(result.checkout_url){

window.location.href =
result.checkout_url;

return;

}


alert(
result.error ||
"Payment checkout unavailable."
);


}catch(error){

console.error(
"Payment error:",
error
);

alert(
"Unable to open payment. Please try again."
);

}finally{

button.disabled = false;

button.textContent =
"Subscribe";

}

}


/* =========================
   CLOSE CONTENT
========================= */

function closeContent(){

document.getElementById("content")
.style.display =
"none";

}


/* =========================
   START PAGE
========================= */

render();

checkPremium();

</script>
