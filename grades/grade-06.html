<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title><style>
*{box-sizing:border-box}
:root{
 --primary:#2563eb;
 --primary2:#7c3aed;
 --dark:#172033;
 --muted:#687386;
 --bg:#f5f7ff;
 --card:#fff;
 --border:#e7eaf2;
 --green:#16a34a;
 --orange:#f59e0b;
}
body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:var(--bg);
 color:var(--dark)
}
header{
 height:68px;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 position:sticky;
 top:0;
 z-index:20
}
.left,.right{
 display:flex;
 align-items:center;
 gap:10px
}
.menu,.dash{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 cursor:pointer
}
.menu{
 color:#fff;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 font-weight:600
}
.dash{
 background:#f1f5ff;
 color:var(--primary);
 text-decoration:none;
 font-weight:600
}
.logo{
 width:38px;
 height:38px;
 border-radius:11px;
 display:grid;
 place-items:center;
 color:#fff;
 font-weight:800;
 background:linear-gradient(135deg,var(--primary),var(--primary2))
}
.brand{
 font-weight:800;
 font-size:16px
}
.grade{
 padding:8px 11px;
 background:#f3f4f6;
 border-radius:8px;
 font-size:12px;
 font-weight:600
}

main{
 max-width:1050px;
 margin:auto;
 padding:24px 16px 60px
}
.hero{
 position:relative;
 overflow:hidden;
 color:#fff;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 border-radius:20px;
 padding:28px;
 margin-bottom:18px;
 box-shadow:0 12px 30px #2563eb25
}
.hero:after{
 content:"";
 position:absolute;
 width:180px;
 height:180px;
 border-radius:50%;
 background:#ffffff18;
 right:-50px;
 top:-70px
}
.small{
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.1em;
 opacity:.8
}
h1{
 margin:7px 0;
 font-size:30px
}
.hero p{
 margin:0;
 opacity:.9;
 font-size:14px
}

.lang{
 display:flex;
 gap:7px;
 margin:18px 0
}
.lang button{
 border:1px solid var(--border);
 background:#fff;
 color:#596579;
 padding:9px 14px;
 border-radius:9px;
 cursor:pointer;
 font-size:12px;
 font-weight:600
}
.lang button.active{
 background:var(--dark);
 color:#fff;
 border-color:var(--dark)
}

.section-title{
 font-size:13px;
 font-weight:800;
 margin:20px 0 10px
}
.units{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding-bottom:5px
}
.unit{
 min-width:190px;
 background:#fff;
 border:1px solid var(--border);
 border-radius:13px;
 padding:14px;
 cursor:pointer;
 transition:.2s
}
.unit:hover{
 transform:translateY(-2px);
 box-shadow:0 7px 20px #0000000b
}
.unit.active{
 border:2px solid var(--primary);
 background:#f4f7ff
}
.unit small{
 color:var(--primary);
 font-size:10px;
 font-weight:800
}
.unit strong{
 display:block;
 margin-top:5px;
 font-size:14px
}

.lessons{
 margin-top:15px;
 background:#fff;
 border:1px solid var(--border);
 border-radius:15px;
 overflow:hidden
}
.lesson{
 width:100%;
 border:0;
 border-bottom:1px solid #edf0f5;
 background:#fff;
 padding:15px;
 text-align:left;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}
.lesson:last-child{border-bottom:0}
.lesson:hover{background:#f8faff}
.lesson.active{
 background:#eef4ff
}
.lesson-info{
 display:flex;
 align-items:center;
 gap:12px
}
.lesson-number{
 width:34px;
 height:34px;
 border-radius:9px;
 display:grid;
 place-items:center;
 background:#eef2ff;
 color:var(--primary);
 font-weight:800;
 font-size:12px
}
.lesson-title{
 font-weight:700;
 font-size:13px
}
.lesson-duration{
 color:#8993a3;
 font-size:11px;
 margin-top:3px
}
.badge{
 padding:5px 8px;
 border-radius:20px;
 font-size:10px;
 font-weight:800
}
.free{
 color:#15803d;
 background:#dcfce7
}
.premium{
 color:#b45309;
 background:#fef3c7
}

.content{
 margin-top:18px;
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 padding:24px;
 box-shadow:0 5px 20px #00000005
}
.content-top{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:15px;
 border-bottom:1px solid var(--border);
 padding-bottom:15px;
 margin-bottom:18px
}
.content h2{
 margin:3px 0 0;
 font-size:23px
}
.content h3{
 margin:24px 0 9px;
 font-size:15px
}
.text{
 white-space:pre-line;
 line-height:1.8;
 color:#566274;
 font-size:14px
}
.lesson-tag{
 font-size:10px;
 color:var(--primary);
 background:#eef4ff;
 padding:6px 9px;
 border-radius:7px;
 font-weight:800
}

.lock{
 text-align:center;
 padding:30px 15px
}
.lock-icon{
 font-size:35px
}
.lock h2{
 margin:10px 0 5px
}
.lock p{
 color:var(--muted);
 font-size:13px
}
.lock button{
 border:0;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 color:#fff;
 padding:11px 18px;
 border-radius:9px;
 cursor:pointer;
 font-weight:700
}

.drawer{
 position:fixed;
 top:0;
 left:0;
 bottom:0;
 width:320px;
 max-width:88%;
 background:#fff;
 z-index:40;
 transform:translateX(-100%);
 transition:.25s;
 overflow:auto;
 box-shadow:8px 0 30px #0003
}
.drawer.open{transform:translateX(0)}
.drawer-head{
 height:68px;
 padding:0 17px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--border)
}
.drawer-head button{
 border:0;
 background:#f1f5f9;
 border-radius:8px;
 width:34px;
 height:34px;
 cursor:pointer
}
.subject{
 width:100%;
 border:0;
 border-bottom:1px solid #f0f1f5;
 background:#fff;
 padding:13px 17px;
 text-align:left;
 cursor:pointer
}
.subject:hover{
 background:#f5f8ff
}
.subject-name{
 font-size:13px;
 font-weight:700
}
.subject-sub{
 color:#8a94a4;
 font-size:11px;
 margin-top:3px
}
.overlay{
 position:fixed;
 inset:0;
 background:#0006;
 z-index:30;
 display:none
}
.overlay.open{display:block}

.loading,.empty{
 padding:28px;
 text-align:center;
 color:#8993a3;
 font-size:13px
}

@media(max-width:600px){
 header{padding:0 10px}
 .brand{font-size:13px}
 .grade{display:none}
 .dash{padding:9px}
 .hero{padding:22px}
 h1{font-size:25px}
 .content{padding:18px}
 .units{margin-right:-16px}
}
</style></head><body><header>
 <div class="left">
  <button class="menu" onclick="openMenu()">☰ Subjects</button>
  <div class="logo">C</div>
  <div class="brand">CreateLK Academy</div>
 </div> <div class="right">
  <span class="grade">Grade 06</span>
  <a class="dash" href="/dashboard.html">Dashboard</a>
 </div>
</header><div class="overlay" id="overlay" onclick="closeMenu()"></div><aside class="drawer" id="drawer">
 <div class="drawer-head">
  <strong>Grade 06 Subjects</strong>
  <button onclick="closeMenu()">✕</button>
 </div> <div id="subjects">
  <div class="loading">Loading...</div>
 </div>
</aside><main><section class="hero">
 <div class="small">Grade 06 • Online Learning</div>
 <h1 id="title">English Language</h1>
 <p>Learn step by step with structured lessons and practice.</p>
</section><div class="lang">
 <button class="active" onclick="setLang('en',this)">English</button>
 <button onclick="setLang('si',this)">සිංහල</button>
 <button onclick="setLang('ta',this)">தமிழ்</button>
</div><div class="section-title">Units & Lessons</div><div id="units">
 <div class="loading">Loading...</div>
</div><div class="lessons">
 <div id="lessonList">
  <div class="empty">Loading lessons...</div>
 </div>
</div><div class="content" id="content">
 <div class="empty">Loading lesson...</div>
</div></main><script>

const API="https://createlk-academy-api.createlk.workers.dev";
const GRADE="06";

let subject="English Language";
let language="en";
let allLessons=[];
let lessons=[];
let units=[];
let currentUnit=null;
let currentLesson=null;

function authHeaders(){
 const t=localStorage.getItem("createlk_token");
 return t?{Authorization:"Bearer "+t}:{};
}

async function api(path){
 const r=await fetch(API+path,{headers:authHeaders()});
 let d={};
 try{d=await r.json()}catch(e){}
 return {r,d};
}

function openMenu(){
 drawer.classList.add("open");
 overlay.classList.add("open");
}

function closeMenu(){
 drawer.classList.remove("open");
 overlay.classList.remove("open");
}

async function loadSubjects(){

 const {r,d}=await api(`/subjects?grade=${GRADE}`);

 if(!r.ok){
  subjects.innerHTML=
   `<div class="empty">Unable to load subjects.</div>`;
  return;
 }

 subjects.innerHTML=(d.subjects||[]).map((s,i)=>`
  <button class="subject"
   onclick="loadSubject('${escAttr(s.subject)}')">

   <div class="subject-name">
    ${i+1}. ${esc(s.subject)}
   </div>

   <div class="subject-sub">
    ${esc(s.sinhala_name||"")}
   </div>

  </button>
 `).join("");
}

async function loadSubject(s){

 subject=s;
 title.textContent=s;
 currentLesson=null;
 currentUnit=null;

 closeMenu();

 lessonList.innerHTML=
  `<div class="loading">Loading lessons...</div>`;

 content.innerHTML=
  `<div class="empty">Select a lesson to begin.</div>`;

 const {r,d}=await api(
  `/lessons?grade=${GRADE}&subject=${encodeURIComponent(s)}`
 );

 if(!r.ok){
  units.innerHTML=
   `<div class="empty">Unable to load lessons.</div>`;
  return;
 }

 allLessons=d.lessons||[];

 /*
  Build units directly from the lessons.
  This avoids the Unit 5 / Basic English mismatch.
 */
 const map={};

 allLessons.forEach(l=>{
  const name=(l.unit||"General").trim();

  if(!map[name])map[name]=[];
  map[name].push(l);
 });

 units=Object.keys(map).map((name,i)=>({
  id:i+1,
  unit_number:i+1,
  unit_name:name,
  lessons:map[name]
 }));

 renderUnits();

 if(units.length){
  /*
   Automatically select the first unit.
  */
  loadUnit(units[0].id);
 }else{
  lessonList.innerHTML=
   `<div class="empty">No lessons available.</div>`;
 }
}

function renderUnits(){

 if(!units.length){
  document.getElementById("units").innerHTML=
   `<div class="empty">No units available.</div>`;
  return;
 }

 document.getElementById("units").innerHTML=`
  <div class="units">
   ${units.map(u=>`
    <div class="unit ${
     currentUnit?.id===u.id?"active":""
    }" onclick="loadUnit(${u.id})">

     <small>UNIT ${u.unit_number}</small>

     <strong>
      ${esc(u.unit_name)}
     </strong>

    </div>
   `).join("")}
  </div>
 `;
}

function loadUnit(id){

 currentUnit=units.find(u=>u.id===id);

 if(!currentUnit)return;

 lessons=currentUnit.lessons||[];

 renderUnits();
 renderLessons();

 /*
  Automatically open Lesson 1 for English.
 */
 let first=lessons[0];

 if(subject==="English Language"){
  first=
   lessons.find(l=>Number(l.lesson_number)===1)
   ||lessons[0];
 }

 if(first)loadLesson(first);
}

function renderLessons(){

 if(!lessons.length){
  lessonList.innerHTML=
   `<div class="empty">No lessons available.</div>`;
  return;
 }

 lessonList.innerHTML=lessons.map(l=>`
  <button class="lesson ${
   currentLesson?.id===l.id?"active":""
  }"
   onclick="loadLessonById(${l.id})">

   <div class="lesson-info">

    <div class="lesson-number">
     ${l.lesson_number}
    </div>

    <div>
     <div class="lesson-title">
      Lesson ${l.lesson_number}
     </div>

     <div class="lesson-duration">
      ${l.duration||0} minutes
     </div>
    </div>

   </div>

   ${
    isFree(l)
    ?'<span class="badge free">FREE</span>'
    :'<span class="badge premium">PREMIUM</span>'
   }

  </button>
 `).join("");
}

function loadLessonById(id){

 const l=lessons.find(x=>x.id===id);

 if(l)loadLesson(l);
}

async function loadLesson(l){

 if(!l)return;

 currentLesson=l;
 renderLessons();

 content.innerHTML=
  `<div class="loading">Loading lesson...</div>`;

 const {r,d}=await api(
  `/lesson?grade=${GRADE}`+
  `&subject=${encodeURIComponent(subject)}`+
  `&lesson=${l.lesson_number}`+
  `&language=${language}`
 );

 if(r.status===401){

  content.innerHTML=`
   <div class="lock">
    <div class="lock-icon">🔐</div>
    <h2>Login Required</h2>
    <p>Please login to access this lesson.</p>

    <button onclick="location.href='/auth/login.html'">
     Login
    </button>
   </div>
  `;

  return;
 }

 if(r.status===403){

  content.innerHTML=`
   <div class="lock">
    <div class="lock-icon">🔒</div>
    <h2>Premium Lesson</h2>
    <p>
     Subscribe to access this Grade 06 premium lesson.
    </p>

    <button onclick="location.href='/dashboard.html'">
     Unlock Premium
    </button>
   </div>
  `;

  return;
 }

 if(!r.ok||!d.success){

  content.innerHTML=`
   <div class="empty">
    ${esc(d.error||"Unable to load lesson.")}
   </div>
  `;

  return;
 }

 const x=d.lesson;

 content.innerHTML=`

  <div class="content-top">

   <div>
    <div class="lesson-tag">
     LESSON ${esc(x.lesson_number||l.lesson_number)}
    </div>

    <h2>${esc(x.title)}</h2>
   </div>

  </div>

  ${
   x.video_url
   ?`
   <div style="margin-bottom:20px">
    <a href="${escAttr(x.video_url)}"
       target="_blank"
       style="
        display:inline-block;
        padding:10px 14px;
        background:#eef4ff;
        color:#2563eb;
        border-radius:9px;
        text-decoration:none;
        font-size:12px;
        font-weight:700;
       ">
       ▶ Watch Lesson Video
    </a>
   </div>
   `
   :""
  }

  ${
   x.objectives
   ?`
   <h3>Learning Objectives</h3>
   <div class="text">${esc(x.objectives)}</div>
   `
   :""
  }

  ${
   x.content
   ?`
   <h3>Lesson Content</h3>
   <div class="text">${esc(x.content)}</div>
   `
   :""
  }

  ${
   x.key_points
   ?`
   <h3>Key Points</h3>
   <div class="text">${esc(x.key_points)}</div>
   `
   :""
  }

  ${
   x.summary
   ?`
   <h3>Summary</h3>
   <div class="text">${esc(x.summary)}</div>
   `
   :""
  }

  ${
   x.questions?.length
   ?`
   <h3>Practice Questions</h3>

   ${x.questions.map((q,i)=>`
    <div style="
     padding:15px;
     margin:10px 0;
     background:#f8faff;
     border:1px solid #e7ebf5;
     border-radius:10px;
    ">

     <b>${i+1}. ${esc(q.question)}</b>

     <div class="text" style="margin-top:8px">
      A. ${esc(q.option_a||"")}<br>
      B. ${esc(q.option_b||"")}<br>
      C. ${esc(q.option_c||"")}<br>
      D. ${esc(q.option_d||"")}
     </div>

    </div>
   `).join("")}
   `
   :""
  }
 `;
}

function isFree(l){

 return subject==="English Language" &&
        Number(l.lesson_number)===1;
}

function setLang(l,btn){

 language=l;

 document.querySelectorAll(".lang button")
  .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 renderUnits();

 if(currentLesson)
  loadLesson(currentLesson);
}

function esc(v){

 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function escAttr(v){
 return esc(v);
}

loadSubjects();
loadSubject("English Language");

</script></body>
</html>
