<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title><style>
*{box-sizing:border-box}

:root{
 --blue:#1769e0;
 --navy:#14213d;
 --cyan:#08a6d9;
 --bg:#f4f7fb;
 --line:#e4e9f1;
 --muted:#718096;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:#172033;
}

button,a{font:inherit}

/* HEADER */

header{
 height:64px;
 background:#fff;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 position:sticky;
 top:0;
 z-index:20;
}

.head{
 display:flex;
 align-items:center;
 gap:10px;
}

.menu{
 border:0;
 background:var(--navy);
 color:#fff;
 padding:9px 13px;
 border-radius:8px;
 cursor:pointer;
 font-size:12px;
 font-weight:bold;
}

.logo img{
 width:42px;
 height:42px;
 object-fit:contain;
 display:block;
}

.brand{
 font-weight:800;
 font-size:15px;
}

.grade,
.dash{
 padding:8px 10px;
 border-radius:8px;
 font-size:11px;
 font-weight:bold;
}

.grade{
 background:#edf4ff;
 color:var(--blue);
}

.dash{
 background:#f1f4f8;
 color:var(--navy);
 text-decoration:none;
}

/* MAIN */

main{
 max-width:1050px;
 margin:auto;
 padding:22px 15px 50px;
}

/* HERO */

.hero{
 padding:25px;
 border-radius:17px;
 color:#fff;
 background:linear-gradient(110deg,var(--navy),var(--blue),var(--cyan));
 margin-bottom:18px;
}

.hero small{
 font-size:10px;
 opacity:.75;
 text-transform:uppercase;
 letter-spacing:.1em;
}

.hero h1{
 margin:6px 0;
 font-size:27px;
}

.hero p{
 margin:0;
 font-size:13px;
 opacity:.9;
}

/* TOP */

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:16px 0 10px;
}

.label{
 font-size:13px;
 font-weight:800;
}

/* LANGUAGE */

.lang{
 display:flex;
 gap:2px;
 background:#e8edf4;
 padding:3px;
 border-radius:8px;
}

.lang button{
 border:0;
 background:transparent;
 padding:7px 11px;
 border-radius:6px;
 color:#667085;
 font-size:11px;
 cursor:pointer;
}

.lang button.active{
 background:#fff;
 color:var(--blue);
 box-shadow:0 2px 5px #0001;
}

/* UNITS */

.units{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:2px 2px 7px;
}

.unit{
 min-width:180px;
 padding:13px;
 background:#fff;
 border:1px solid var(--line);
 border-radius:11px;
 cursor:pointer;
}

.unit.active{
 border:2px solid var(--blue);
 background:#f1f6ff;
}

.unit small{
 color:var(--blue);
 font-size:9px;
 font-weight:bold;
}

.unit b{
 display:block;
 margin-top:4px;
 font-size:13px;
}

.unit span{
 display:block;
 margin-top:4px;
 color:var(--muted);
 font-size:10px;
}

/* LESSONS */

.lessons{
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 overflow:hidden;
}

.lesson{
 width:100%;
 border:0;
 border-bottom:1px solid #edf0f4;
 background:#fff;
 padding:13px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 text-align:left;
 cursor:pointer;
}

.lesson:last-child{
 border:0;
}

.lesson:hover,
.lesson.active{
 background:#f0f6ff;
}

.linfo{
 display:flex;
 align-items:center;
 gap:11px;
}

.num{
 width:34px;
 height:34px;
 border-radius:8px;
 background:#edf4ff;
 color:var(--blue);
 display:grid;
 place-items:center;
 font-size:11px;
 font-weight:bold;
 flex-shrink:0;
}

.lesson.active .num{
 background:var(--blue);
 color:#fff;
}

.ltitle{
 font-size:12px;
 font-weight:bold;
}

.meta{
 font-size:10px;
 color:var(--muted);
 margin-top:2px;
}

.badge{
 font-size:9px;
 font-weight:bold;
 padding:5px 8px;
 border-radius:20px;
}

.free{
 color:#15803d;
 background:#dcfce7;
}

.premium{
 color:#a16207;
 background:#fef3c7;
}

/* CONTENT */

.content{
 margin-top:17px;
 background:#fff;
 border:1px solid var(--line);
 border-radius:14px;
 padding:22px;
}

.content-head{
 border-bottom:1px solid var(--line);
 padding-bottom:15px;
}

.tag{
 color:var(--blue);
 background:#edf4ff;
 padding:5px 8px;
 border-radius:6px;
 font-size:9px;
 font-weight:bold;
}

.content h2{
 font-size:21px;
 margin:9px 0 0;
}

.content h3{
 font-size:14px;
 margin:21px 0 7px;
}

.text{
 white-space:pre-line;
 color:#596579;
 font-size:13px;
 line-height:1.8;
}

.video{
 display:inline-block;
 margin-top:15px;
 background:#edf4ff;
 color:var(--blue);
 padding:9px 12px;
 border-radius:8px;
 text-decoration:none;
 font-size:11px;
 font-weight:bold;
}

/* QUESTIONS */

.question{
 background:#f8faff;
 border:1px solid #e7ecf4;
 border-radius:9px;
 padding:13px;
 margin:9px 0;
}

.question b{
 font-size:12px;
}

/* LOCK */

.lock{
 text-align:center;
 padding:30px;
}

.lock-icon{
 font-size:28px;
}

.lock h2{
 font-size:19px;
 margin:10px 0 5px;
}

.lock p{
 font-size:12px;
 color:var(--muted);
}

.lock button{
 border:0;
 background:var(--blue);
 color:#fff;
 padding:10px 16px;
 border-radius:8px;
 cursor:pointer;
 font-size:12px;
 font-weight:bold;
}

/* DRAWER */

.drawer{
 position:fixed;
 inset:0 auto 0 0;
 width:310px;
 max-width:88%;
 background:#fff;
 z-index:40;
 transform:translateX(-100%);
 transition:.2s;
 overflow:auto;
 box-shadow:7px 0 25px #0003;
}

.drawer.open{
 transform:translateX(0);
}

.drawer-head{
 height:64px;
 padding:0 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--line);
}

.drawer-head button{
 border:0;
 background:#f1f4f8;
 width:31px;
 height:31px;
 border-radius:7px;
 cursor:pointer;
}

.subject{
 width:100%;
 border:0;
 border-bottom:1px solid #edf0f4;
 background:#fff;
 padding:11px 16px;
 text-align:left;
 cursor:pointer;
}

.subject:hover,
.subject.selected{
 background:#edf4ff;
}

.subject.selected{
 border-left:4px solid var(--blue);
 padding-left:12px;
}

.subject b{
 font-size:12px;
}

.subject small{
 display:block;
 color:#8993a3;
 font-size:10px;
 margin-top:2px;
}

/* OVERLAY */

.overlay{
 position:fixed;
 inset:0;
 background:#0007;
 z-index:30;
 display:none;
}

.overlay.open{
 display:block;
}

/* STATUS */

.loading,
.empty{
 text-align:center;
 padding:27px;
 color:#8993a3;
 font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

 .brand,
 .grade{
  display:none;
 }

 .logo img{
  width:39px;
  height:39px;
 }

 main{
  padding:16px 11px;
 }

 .hero{
  padding:21px;
 }

 .hero h1{
  font-size:24px;
 }

 .top{
  align-items:flex-start;
  flex-direction:column;
  gap:9px;
 }

 .lang{
  width:100%;
 }

 .lang button{
  flex:1;
 }

 .content{
  padding:17px;
 }

}
</style></head><body><header> <div class="head">  <button class="menu" onclick="menu(true)">
   ☰ Subjects
  </button>  <a class="logo" href="/dashboard.html"><img
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy">

  </a>  <span class="brand">
   CreateLK Academy
  </span> </div> <div class="head">  <span class="grade">
   GRADE 06
  </span>  <a class="dash" href="/dashboard.html">
   Dashboard
  </a> </div></header><div class="overlay" id="overlay" onclick="menu(false)"></div><aside class="drawer" id="drawer"> <div class="drawer-head"><b>Grade 06 Subjects</b>

  <button onclick="menu(false)">
   ✕
  </button> </div> <div id="subjects">  <div class="loading">
   Loading...
  </div> </div></aside><main><section class="hero"> <small>
  CreateLK Academy • Grade 06
 </small> <h1 id="title">
  English Language
 </h1> <p id="subtitle">
  Learn step by step with structured lessons and practice.
 </p></section><div class="top"> <div class="label">
  Learning Language
 </div> <div class="lang"><button
class="active"
onclick="changeLanguage('en',this)">
English
</button>

<button
onclick="changeLanguage('si',this)">
සිංහල
</button>

<button
onclick="changeLanguage('ta',this)">
தமிழ்
</button>

 </div></div><div class="label">
 Units
</div><div id="units"> <div class="loading">
  Loading...
 </div></div><div class="top"> <div class="label">
  Lessons
 </div></div><div class="lessons" id="lessons"> <div class="loading">
  Loading...
 </div></div><div class="content" id="content"> <div class="empty">
  Select a lesson.
 </div></div></main><script>

const API =
 "https://createlk-academy-api.createlk.workers.dev";

const GRADE = "06";

let subject = "English Language";
let lang = "en";

let units = [];
let lessons = [];

let currentUnit = null;
let currentLesson = null;


/* AUTH */

function getHeaders(){

 const token =
  localStorage.getItem("createlk_token");

 return token
  ? {Authorization:"Bearer "+token}
  : {};

}


/* API */

async function api(path){

 try{

  const response =
   await fetch(API+path,{
    headers:getHeaders()
   });

  let data={};

  try{
   data=await response.json();
  }catch(e){}

  return{
   r:response,
   d:data
  };

 }catch(error){

  return{
   r:{
    ok:false,
    status:0
   },
   d:{
    error:"Connection error"
   }
  };

 }

}


/* DRAWER */

function menu(open){

 document
  .getElementById("drawer")
  .classList.toggle("open",open);

 document
  .getElementById("overlay")
  .classList.toggle("open",open);

}


/* SUBJECTS */

async function loadSubjects(){

 const box =
  document.getElementById("subjects");

 const {r,d} =
  await api(`/subjects?grade=${GRADE}`);

 if(!r.ok){

  box.innerHTML=
   '<div class="empty">Unable to load subjects.</div>';

  return;
 }

 const list =
  Array.isArray(d.subjects)
  ? d.subjects
  : [];

 if(!list.length){

  box.innerHTML=
   '<div class="empty">No subjects found.</div>';

  return;
 }

 box.innerHTML =
  list.map((s,index)=>`

   <button
    class="subject ${
     s.subject===subject
     ? "selected"
     : ""
    }"
    data-subject="${encodeURIComponent(s.subject)}">

    <b>
     ${String(index+1).padStart(2,"0")}.
     ${esc(s.subject)}
    </b>

    <small>
     ${esc(
      s.sinhala_name ||
      s.tamil_name ||
      ""
     )}
    </small>

   </button>

  `).join("");


 document
  .querySelectorAll(".subject")
  .forEach(button=>{

   button.addEventListener(
    "click",
    function(){

     const selected =
      decodeURIComponent(
       this.dataset.subject
      );

     loadSubject(selected);

    }
   );

  });

}


/* SUBJECT */

async function loadSubject(selectedSubject){

 subject =
  selectedSubject;

 currentUnit=null;
 currentLesson=null;

 units=[];
 lessons=[];

 document
  .getElementById("title")
  .textContent=subject;

 document
  .getElementById("units")
  .innerHTML=
   '<div class="loading">Loading units...</div>';

 document
  .getElementById("lessons")
  .innerHTML=
   '<div class="loading">Loading lessons...</div>';

 document
  .getElementById("content")
  .innerHTML=
   '<div class="empty">Select a lesson.</div>';

 menu(false);

 await loadSubjects();


 const {r,d} =
  await api(
   `/lessons?grade=${GRADE}&subject=${
    encodeURIComponent(subject)
   }`
  );


 if(!r.ok){

  document
   .getElementById("units")
   .innerHTML=
    '<div class="empty">Unable to load units.</div>';

  document
   .getElementById("lessons")
   .innerHTML=
    '<div class="empty">Unable to load lessons.</div>';

  return;
 }


 const data =
  Array.isArray(d.lessons)
  ? d.lessons
  : [];


 const grouped={};


 data.forEach(lesson=>{

  const name =
   (lesson.unit || "General")
   .trim();

  if(!grouped[name])
   grouped[name]=[];

  grouped[name].push(lesson);

 });


 units =
  Object.keys(grouped)
   .map((name,index)=>({

    id:index+1,

    name:name,

    lessons:grouped[name]

   }));


 renderUnits();


 if(units.length){

  loadUnit(units[0].id);

 }else{

  document
   .getElementById("lessons")
   .innerHTML=
    '<div class="empty">No lessons available.</div>';

 }

}


/* UNITS */

function renderUnits(){

 const box =
  document.getElementById("units");

 if(!units.length){

  box.innerHTML=
   '<div class="empty">No units available.</div>';

  return;
 }


 box.innerHTML=`

  <div class="units">

   ${units.map(unit=>`

    <div
     class="unit ${
      currentUnit?.id===unit.id
      ? "active"
      : ""
     }"
     onclick="loadUnit(${unit.id})">

     <small>
      UNIT ${unit.id}
     </small>

     <b>
      ${esc(unit.name)}
     </b>

     <span>
      ${unit.lessons.length}
      ${
       unit.lessons.length===1
       ? "lesson"
       : "lessons"
      }
     </span>

    </div>

   `).join("")}

  </div>

 `;

}


/* SELECT UNIT */

function loadUnit(id){

 currentUnit =
  units.find(
   unit=>unit.id===id
  );

 lessons =
  currentUnit?.lessons || [];

 currentLesson=null;

 renderUnits();
 renderLessons();


 let first =
  lessons[0];


 /*
  English Language:
  automatically open Lesson 1.

  Other subjects:
  automatically open
  their first lesson.
 */

 if(subject==="English Language"){

  first =
   lessons.find(
    lesson =>
     Number(lesson.lesson_number)===1
   ) || first;

 }


 if(first){

  loadLesson(first);

 }

}


/* LESSON LIST */

function renderLessons(){

 const box =
  document.getElementById("lessons");


 if(!lessons.length){

  box.innerHTML=
   '<div class="empty">No lessons available.</div>';

  return;
 }


 box.innerHTML =

  lessons.map(lesson=>`

   <button
    class="lesson ${
     currentLesson?.id===lesson.id
     ? "active"
     : ""
    }"
    onclick="loadLessonById(${lesson.id})">

    <div class="linfo">

     <div class="num">
      ${esc(lesson.lesson_number)}
     </div>

     <div>

      <div class="ltitle">
       Lesson ${esc(lesson.lesson_number)}
      </div>

      <div class="meta">
       ${esc(lesson.duration || 0)}
       minutes
      </div>

     </div>

    </div>

    ${
     isFree(lesson)

     ? `<span class="badge free">
         FREE
        </span>`

     : `<span class="badge premium">
         🔒 PREMIUM
        </span>`
    }

   </button>

  `).join("");

}


/* SELECT LESSON */

function loadLessonById(id){

 const lesson =
  lessons.find(
   item =>
    Number(item.id)===Number(id)
  );

 if(lesson)
  loadLesson(lesson);

}


/* LOAD LESSON */

async function loadLesson(lesson){

 currentLesson=lesson;

 renderLessons();


 const box =
  document.getElementById("content");

 box.innerHTML=
  '<div class="loading">Loading lesson...</div>';


 const {r,d} =
  await api(
   `/lesson?grade=${GRADE}`+
   `&subject=${encodeURIComponent(subject)}`+
   `&lesson=${encodeURIComponent(lesson.lesson_number)}`+
   `&language=${encodeURIComponent(lang)}`
  );


 /* LOGIN */

 if(r.status===401){

  box.innerHTML=`

   <div class="lock">

    <div class="lock-icon">
     🔐
    </div>

    <h2>
     Login Required
    </h2>

    <p>
     Please login to access this lesson.
    </p>

    <button
     onclick="location.href='/auth/login.html'">
     Login
    </button>

   </div>

  `;

  return;
 }


 /* PREMIUM */

 if(r.status===403){

  box.innerHTML=`

   <div class="lock">

    <div class="lock-icon">
     🔒
    </div>

    <h2>
     Premium Lesson
    </h2>

    <p>
     Subscribe to access this lesson.
    </p>

    <button
     onclick="location.href='/dashboard.html'">
     Unlock Premium
    </button>

   </div>

  `;

  return;
 }


 /* ERROR */

 if(!r.ok || !d.success){

  box.innerHTML=`

   <div class="empty">
    ${esc(
     d.error ||
     "Unable to load lesson."
    )}
   </div>

  `;

  return;
 }


 const x =
  d.lesson;


 /* CONTENT */

 box.innerHTML=`

  <div class="content-head">

   <span class="tag">
    LESSON
    ${esc(
     x.lesson_number ||
     lesson.lesson_number
    )}
   </span>

   <h2>
    ${esc(
     x.title ||
     "Lesson"
    )}
   </h2>

  </div>


  ${
   x.video_url

   ? `<a
       class="video"
       href="${esc(x.video_url)}"
       target="_blank"
       rel="noopener">
       ▶ Watch Lesson Video
      </a>`

   : ""
  }


  ${
   x.objectives

   ? `<h3>
       🎯 Learning Objectives
      </h3>

      <div class="text">
       ${esc(x.objectives)}
      </div>`

   : ""
  }


  ${
   x.content

   ? `<h3>
       📖 Lesson Content
      </h3>

      <div class="text">
       ${esc(x.content)}
      </div>`

   : ""
  }


  ${
   x.key_points

   ? `<h3>
       💡 Key Points
      </h3>

      <div class="text">
       ${esc(x.key_points)}
      </div>`

   : ""
  }


  ${
   x.summary

   ? `<h3>
       📝 Summary
      </h3>

      <div class="text">
       ${esc(x.summary)}
      </div>`

   : ""
  }


  ${
   Array.isArray(x.questions) &&
   x.questions.length

   ? `

     <h3>
      Practice Questions
     </h3>

     ${x.questions.map(
      (q,index)=>`

       <div class="question">

        <b>
         ${index+1}.
         ${esc(q.question)}
        </b>

        <div class="text">

         A. ${esc(q.option_a || "")}<br>

         B. ${esc(q.option_b || "")}<br>

         C. ${esc(q.option_c || "")}<br>

         D. ${esc(q.option_d || "")}

        </div>

        ${
         q.explanation

         ? `<div class="text">
             <strong>Explanation:</strong>
             ${esc(q.explanation)}
            </div>`

         : ""
        }

       </div>

      `
     ).join("")}

    `

   : ""
  }

 `;

}


/* FREE RULE */

function isFree(lesson){

 return(
  subject==="English Language" &&
  Number(lesson.lesson_number)===1
 );

}


/* LANGUAGE */

function changeLanguage(selected,button){

 lang=selected;


 document
  .querySelectorAll(".lang button")
  .forEach(item=>{
   item.classList.remove("active");
  });


 button.classList.add("active");


 if(currentLesson){

  loadLesson(currentLesson);

 }

}


/* ESCAPE HTML */

function esc(value){

 return String(value ?? "")

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}


/* START */

loadSubjects();

loadSubject("English Language");

</script></body>
</html>
