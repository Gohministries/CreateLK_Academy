<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 06 Premium | CreateLK Academy</title>

<link rel="icon" href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fc;color:#172033}
a{text-decoration:none;color:inherit}

header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e8ebf2}
.header-container{max-width:1000px;min-height:70px;margin:auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:45px;height:45px;object-fit:contain}
.brand-name{font-size:19px;font-weight:800;color:#172554}
.home-btn{padding:9px 17px;border-radius:10px;background:#eef2ff;color:#3730a3;font-size:13px;font-weight:800}

main{max-width:1000px;margin:auto;padding:45px 20px 70px}
.hero{text-align:center;margin-bottom:30px}
.hero h1{color:#172554;font-size:clamp(30px,5vw,44px);margin-bottom:8px}
.hero p{color:#64748b;font-size:14px}

.status-box{max-width:700px;margin:0 auto 35px;padding:22px;border-radius:18px;background:#fff;border:1px solid #e7ebf2;box-shadow:0 10px 30px rgba(15,23,42,.06);text-align:center}
.status{font-size:18px;font-weight:900;margin-bottom:7px}
.status-details{color:#64748b;font-size:13px;line-height:1.6}
.status-login,.status-error{color:#dc2626}
.status-active{color:#15803d}
.status-free{color:#2563eb}

.login-btn,.subscribe-btn{display:inline-block;margin-top:15px;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:800;border:0;cursor:pointer}
.login-btn{background:#172554;color:#fff}
.subscribe-btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}

.subjects-heading{text-align:center;margin-bottom:22px}
.subjects-heading h2{color:#172554;font-size:25px;margin-bottom:15px}
.languages{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.language-btn{border:1px solid #dbe2ef;background:#fff;color:#475569;padding:8px 14px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}
.language-btn.active{background:#172554;color:#fff;border-color:#172554}

.subjects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.subject-card{background:#fff;border:1px solid #e7ebf2;border-radius:17px;padding:22px 18px;box-shadow:0 8px 25px rgba(15,23,42,.05)}
.subject-icon{font-size:27px;margin-bottom:12px}
.subject-name{color:#172554;font-size:16px;font-weight:900;margin-bottom:14px}
.open-btn{color:#3730a3;font-size:12px;font-weight:900}

footer{max-width:1000px;margin:auto;padding:25px 20px 35px;text-align:center;color:#64748b;font-size:12px}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-bottom:15px}

@media(max-width:800px){.subjects-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
.header-container{min-height:64px;padding:8px 15px}
.brand img{width:40px;height:40px}
.brand-name{font-size:16px}
.home-btn{padding:8px 13px;font-size:12px}
main{padding:35px 15px 55px}
.subjects-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="header-container">

<a href="../index.html" class="brand">
<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png" alt="CreateLK Academy Logo">
<div class="brand-name">CreateLK Academy</div>
</a>

<a href="../index.html" class="home-btn">← Home</a>

</div>
</header>

<main>

<section class="hero">
<h1>Grade 06 Premium</h1>
<p>Complete Grade 06 learning resources</p>
</section>

<div class="status-box">

<div id="status" class="status status-free">
Checking login...
</div>

<div id="statusDetails" class="status-details">
Please wait.
</div>

<div id="action"></div>

</div>

<section>

<div class="subjects-heading">

<h2>Grade 06 Subjects</h2>

<div class="languages">

<button class="language-btn active" data-language="en" onclick="changeLanguage('en')">English</button>

<button class="language-btn" data-language="si" onclick="changeLanguage('si')">සිංහල</button>

<button class="language-btn" data-language="ta" onclick="changeLanguage('ta')">தமிழ்</button>

</div>
</div>

<div id="subjects" class="subjects-grid"></div>

</section>

</main>

<footer>

<div class="footer-links">
<a href="../pages/about.html">About</a>
<a href="../pages/contact.html">Contact</a>
<a href="../pages/terms-and-conditions.html">Terms</a>
<a href="../pages/privacy-policy.html">Privacy</a>
<a href="../pages/refund-policy.html">Refund</a>
<a href="../pages/payment-policy.html">Payment</a>
</div>

<div>© 2026 CreateLK Academy</div>

</footer>

<script>

const AUTH_API="https://createlk-auth-api.createlk.workers.dev";
const PREMIUM_API="https://createlk-premium-api.createlk.workers.dev";
const GRADE="06";

const subjects=[
["📐","Mathematics","ගණිතය","கணிதம்"],
["🔬","Science","විද්‍යාව","விஞ்ஞானம்"],
["🔤","English Language","ඉංග්‍රීසි භාෂාව","ஆங்கில மொழி"],
["📖","Sinhala Language","සිංහල භාෂාව","சிங்கள மொழி"],
["📚","Tamil Language","දෙමළ භාෂාව","தமிழ் மொழி"],
["🌐","Second National Language","දෙවන ජාතික භාෂාව","இரண்டாம் தேசிய மொழி"],
["🏛️","History","ඉතිහාසය","வரலாறு"],
["🌍","Geography","භූගෝල විද්‍යාව","புவியியல்"],
["🤝","Civic Education","පුරවැසි අධ්‍යාපනය","குடியியல் கல்வி"],
["🕊️","Religion","ආගම","சமயம்"],
["❤️","Health & Physical Education","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය","சுகாதாரம் மற்றும் உடற்கல்வி"],
["💻","ICT","තොරතුරු හා සන්නිவேதන තාක්ෂණය","தகவல் மற்றும் தொடர்பாடல் தொழில்நுட்பம்"],
["🎨","Aesthetic Education","සෞන්දර්ය අධ්‍යාපනය","அழகியல் கல்வி"],
["⚙️","Technology for Life","ජීවිතය සඳහා තාක්ෂණය","வாழ்க்கைக்கான தொழில்நுட்பம்"],
["💡","Entrepreneurship & Financial Literacy","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව","தொழில் முனைவோர் மற்றும் நிதியறிவு"]
];

let language="en";

const status=document.getElementById("status");
const details=document.getElementById("statusDetails");
const action=document.getElementById("action");

function renderSubjects(){

const lang={en:1,si:2,ta:3}[language];

document.getElementById("subjects").innerHTML=subjects.map((s,i)=>`

<div class="subject-card">

<div class="subject-icon">${s[0]}</div>

<div class="subject-name">${s[lang]}</div>

<a href="#" class="open-btn" onclick="openSubject(${i});return false;">
Open Subject →
</a>

</div>

`).join("");

}

function changeLanguage(value){

language=value;

document.querySelectorAll(".language-btn").forEach(b=>{
b.classList.toggle("active",b.dataset.language===value);
});

renderSubjects();

}

function loginRequired(){

status.textContent="🔴 Login Required";
status.className="status status-login";

details.textContent="Please log in to access Grade 06 Premium.";

action.innerHTML=`
<a href="../auth/login.html?redirect=/grades/grade-06.html" class="login-btn">
Login
</a>`;

}

function errorMessage(){

status.textContent="⚠️ Connection Error";
status.className="status status-error";

details.textContent="Unable to check your account right now.";

action.innerHTML=`
<button class="login-btn" onclick="location.reload()">
Try Again
</button>`;

}

async function checkLogin(){

const token=localStorage.getItem("createlk_token");

if(!token){
loginRequired();
return;
}

try{

const response=await fetch(AUTH_API+"/auth/me",{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
});

if(response.status===401){

localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");

loginRequired();
return;
}

if(!response.ok) throw new Error();

const data=await response.json();

localStorage.setItem(
"createlk_customer",
JSON.stringify(data.customer||data.user||data)
);

checkPremium(token);

}catch(e){

console.error(e);
errorMessage();

}

}

async function checkPremium(token){

status.textContent="🔵 Checking Premium...";
status.className="status status-free";

details.textContent="Checking your Grade 06 Premium access.";
action.innerHTML="";

try{

const response=await fetch(
PREMIUM_API+"/premium/status?grade="+GRADE,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
});

if(response.status===401){
errorMessage();
return;
}

if(!response.ok) throw new Error();

const data=await response.json();
const premium=data.premium||{};

if(data.success===true&&premium.active===true){

status.textContent="🟢 Premium Active";
status.className="status status-active";

details.textContent=premium.expires_at
?"Your Grade 06 Premium access is active until "+formatDate(premium.expires_at)+"."
:"Your Grade 06 Premium access is active.";

}else{

status.textContent="🔵 Premium Required";
status.className="status status-free";

details.textContent="Subscribe to access Grade 06 Premium learning resources.";

action.innerHTML=`
<button class="subscribe-btn" onclick="subscribe()">
Subscribe — LKR 999 / 30 Days
</button>`;

}

}catch(e){

console.error(e);
errorMessage();

}

}

async function openSubject(index){

const token=localStorage.getItem("createlk_token");

if(!token){
loginRequired();
return;
}

const s=subjects[index];

try{

const response=await fetch(
PREMIUM_API+
"/content?grade="+GRADE+
"&subject="+encodeURIComponent(s[1])+
"&language="+language,
{
headers:{
Authorization:"Bearer "+token
}
});

if(response.status===401){
loginRequired();
return;
}

if(response.status===403){
alert("Grade 06 Premium subscription is required.");
return;
}

if(response.status===404){
alert("This subject content is not available yet.");
return;
}

if(!response.ok) throw new Error();

const data=await response.json();

if(data.success&&data.product){

sessionStorage.setItem(
"createlk_subject",
JSON.stringify(data.product)
);

alert("Premium access confirmed for "+s[{en:1,si:2,ta:3}[language]]+".");

}else{

alert("Subject content is not available yet.");

}

}catch(e){

alert("Unable to load the subject. Please try again.");

}

}

function subscribe(){

if(!localStorage.getItem("createlk_token")){

location.href="../auth/login.html?redirect=/grades/grade-06.html";
return;

}

alert("Grade 06 Premium payment will be available soon.");

}

function formatDate(value){

const date=new Date(value);

if(isNaN(date.getTime())) return value;

return date.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

}

renderSubjects();
checkLogin();

</script>

</body>
</html>
