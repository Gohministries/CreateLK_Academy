<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#102a43;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}
header a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:auto;padding:20px}
.hero{background:#102a43;color:#fff;padding:25px;border-radius:15px}
.hero h1{margin:0 0 8px}
.languages{margin-top:18px;display:flex;gap:8px}
.lang{padding:8px 14px;border:1px solid #ffffff55;border-radius:20px;background:transparent;color:#fff;cursor:pointer}
.lang.active{background:#ffd166;color:#102a43}
h2{margin-top:25px}
.subjects,.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.subject,.lesson,.content{background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:15px}
.subject,.lesson{cursor:pointer}
.subject.active{background:#eef5ff;border-color:#1d4e89}
.lesson:hover,.subject:hover{box-shadow:0 4px 15px #0001}
.badge{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:bold}
.free{background:#e8f7ed;color:#18794e}
.premium{background:#fff0f0;color:#c0392b}
.content{margin-top:20px}
.content h2{margin-top:0}
.content h3{color:#102a43;margin-bottom:6px}
p{line-height:1.7;white-space:pre-line}
.points{display:flex;flex-wrap:wrap;gap:7px}
.point{background:#eef5ff;color:#1d4e89;padding:7px 10px;border-radius:7px;font-size:13px}
.option{padding:8px;margin-top:6px;border:1px solid #ddd;border-radius:6px}
.notice{padding:15px;background:#fff;border-radius:10px}
.get{margin-top:12px;padding:10px 18px;background:#102a43;color:#fff;border:0;border-radius:7px;cursor:pointer}
video{width:100%;border-radius:10px}
footer{text-align:center;padding:25px;color:#667085}
</style>
</head>

<body>

<header>
<strong>CreateLK <span style="color:#ffd166">Academy</span></strong>
<a href="/dashboard.html">Dashboard</a>
</header>

<main>

<div class="hero">
<h1>Grade 06</h1>
<p>Learn with structured lessons, notes and questions.</p>

<div class="languages">
<button class="lang" data-lang="en">English</button>
<button class="lang" data-lang="si">සිංහල</button>
<button class="lang" data-lang="ta">தமிழ்</button>
</div>
</div>

<h2>Subjects</h2>
<div id="subjects" class="subjects"></div>

<h2>Lessons</h2>
<div id="lessons" class="lessons">
<div class="notice">Loading...</div>
</div>

<div id="content"></div>

</main>

<footer>© CreateLK Academy</footer>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const GRADE="06";

let token=localStorage.getItem("createlk_token");

/* ALWAYS START IN ENGLISH */
let language="en";

/* ENGLISH LANGUAGE IS NOW THE DEFAULT SUBJECT */
let selectedSubject="English Language";

/*
GRADE 06 SUBJECT ORDER
English Language is intentionally first.
*/
const subjects=[
["English Language","ඉංග්‍රීසි භාෂාව","ஆங்கில மொழி"],
["Mathematics","ගණිතය","கணிதம்"],
["Science","විද්‍යාව","அறிவியல்"],
["Sinhala Language","සිංහල භාෂාව","சிங்கள மொழி"],
["Tamil Language","දෙමළ භාෂාව","தமிழ் மொழி"],
["Second National Language","දෙවන ජාතික භාෂාව","இரண்டாம் தேசிய மொழி"],
["History","ඉතිහාසය","வரலாறு"],
["Geography","භූගෝල විද්‍යාව","புவியியல்"],
["Civic Education","පුරවැසි අධ්‍යාපනය","குடியுரிமைக் கல்வி"],
["Religion","ආගම","சமயம்"],
["Health & Physical Education","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය","சுகாதாரமும் உடற்கல்வியும்"],
["ICT","තොරතුරු හා සන්නිවේදන තාක්ෂණය","தகவல் மற்றும் தொடர்பாடல் தொழில்நுட்பம்"],
["Aesthetic Education","සෞන්දர्य අධ්‍යාපනය","அழகியல் கல்வி"],
["Technology for Life","ජීවිතය සඳහා තාක්ෂණය","வாழ்க்கைக்கான தொழில்நுட்பம்"],
["Entrepreneurship & Financial Literacy","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව","தொழில்முனைவோர் மற்றும் நிதி அறிவாற்றல்"]
];

const subjectsBox=document.getElementById("subjects");
const lessons=document.getElementById("lessons");
const content=document.getElementById("content");

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

function renderSubjects(){

subjectsBox.innerHTML=subjects.map((s,i)=>`

<div class="subject ${selectedSubject==s[0]?"active":""}"
onclick="selectSubject(${i})">

${esc(language=="en"?s[0]:language=="si"?s[1]:s[2])}

</div>

`).join("");

}

function selectSubject(i){

selectedSubject=subjects[i][0];

renderSubjects();
loadLessons();

}

document.querySelectorAll(".lang").forEach(btn=>{

btn.onclick=()=>{

language=btn.dataset.lang;

renderSubjects();
loadLessons();

};

});

async function loadLessons(){

lessons.innerHTML="<div class='notice'>Loading...</div>";
content.innerHTML="";

try{

const r=await fetch(
`${API}/lessons?grade=${GRADE}&subject=${encodeURIComponent(selectedSubject)}`
);

const d=await r.json();

if(!d.success||!d.lessons?.length){

lessons.innerHTML=
"<div class='notice'>No lessons available yet.</div>";

return;

}

lessons.innerHTML=d.lessons.map(l=>{

/*
LESSON 1 IS FREE ONLY WHEN ENGLISH LANGUAGE
IS SELECTED IN THE ENGLISH UI.
*/
const free=
selectedSubject==="English Language" &&
Number(l.lesson_number)===1 &&
language==="en";

return`

<div class="lesson"
onclick="openLesson(${l.lesson_number})">

<small>Lesson ${l.lesson_number}</small>

<div>
<b>${esc(l.lesson_code||"Lesson")}</b>
</div>

<span class="badge ${free?"free":"premium"}">
${free?"🟢 FREE":"🔒 PREMIUM"}
</span>

</div>

`;

}).join("");

}catch(e){

lessons.innerHTML=
"<div class='notice'>Unable to connect to Academy.</div>";

}

}

async function openLesson(number){

/*
ENGLISH LANGUAGE LESSON 1
IS THE FREE DEMO.
*/
const free=
selectedSubject==="English Language" &&
Number(number)===1 &&
language==="en";

if(!free){

content.innerHTML=`

<div class="content">

<h2>🔒 Premium Lesson</h2>

<p>
This lesson is available with
CreateLK Academy Premium.
</p>

<button class="get" onclick="premium()">
Get Premium
</button>

</div>

`;

return;

}

if(!token){

content.innerHTML=`

<div class="content">

<h2>Login Required</h2>

<p>Please log in to access this lesson.</p>

<a href="/auth/login.html">
<button class="get">Login</button>
</a>

</div>

`;

return;

}

content.innerHTML=
"<div class='content'>Loading lesson...</div>";

try{

const r=await fetch(
`${API}/lesson?grade=${GRADE}&subject=${encodeURIComponent(selectedSubject)}&lesson=${number}&language=en`,
{
headers:{
Authorization:`Bearer ${token}`
}
}
);

const d=await r.json();

if(!d.success){

content.innerHTML=
`<div class="content">${esc(d.error)}</div>`;

return;

}

showLesson(d.lesson);

}catch(e){

content.innerHTML=
"<div class='content'>Unable to load lesson.</div>";

}

}

function showLesson(l){

const points=(l.key_points||"")
.split(";")
.filter(Boolean)
.map(x=>
`<span class="point">${esc(x.trim())}</span>`
)
.join("");

const questions=(l.questions||[])
.map((q,i)=>`

<div style="margin-bottom:15px">

<b>${i+1}. ${esc(q.question)}</b>

${q.option_a?`<div class="option">A. ${esc(q.option_a)}</div>`:""}
${q.option_b?`<div class="option">B. ${esc(q.option_b)}</div>`:""}
${q.option_c?`<div class="option">C. ${esc(q.option_c)}</div>`:""}
${q.option_d?`<div class="option">D. ${esc(q.option_d)}</div>`:""}

</div>

`).join("");

content.innerHTML=`

<div class="content">

<h2>${esc(l.title||"Lesson")}</h2>

<small>
Grade ${esc(l.grade)} ·
${esc(l.subject)} ·
Lesson ${l.lesson_number}
</small>

${l.objectives?`
<h3>Learning Objectives</h3>
<p>${esc(l.objectives)}</p>
`:""}

${l.content?`
<h3>Short Note</h3>
<p>${esc(l.content)}</p>
`:""}

${points?`
<h3>Key Points</h3>
<div class="points">${points}</div>
`:""}

${l.summary?`
<h3>Summary</h3>
<p>${esc(l.summary)}</p>
`:""}

${l.video_url?`
<h3>Video</h3>
<video controls src="${esc(l.video_url)}"></video>
`:""}

${questions?`
<h3>Questions</h3>
${questions}
`:""}

</div>

`;

}

function premium(){

alert("Premium payment will be available soon.");

}


/* INITIAL PAGE */

document
.querySelector('[data-lang="en"]')
.classList.add("active");

renderSubjects();

/*
AUTOMATICALLY LOAD
ENGLISH LANGUAGE LESSON 1
*/
loadLessons().then(()=>openLesson(1));

</script>

</body>
</html>
