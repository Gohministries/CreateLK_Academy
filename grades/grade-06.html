<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fa;
 color:#172033
}
header{
 height:64px;
 background:#fff;
 border-bottom:1px solid #e5e7eb;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 position:sticky;
 top:0;
 z-index:10
}
.left,.right{display:flex;align-items:center;gap:10px}
button,a{font:inherit}
.menu,.dash{
 border:1px solid #ddd;
 background:#fff;
 padding:9px 13px;
 border-radius:9px;
 cursor:pointer
}
.menu{background:#111827;color:#fff;border-color:#111827}
.logo{
 width:36px;height:36px;border-radius:9px;
 background:#111827;color:#fff;
 display:grid;place-items:center;
 font-weight:bold
}
.brand{font-weight:700}
.grade{
 background:#f1f5f9;
 padding:8px 11px;
 border-radius:8px;
 font-size:12px
}
main{max-width:1100px;margin:auto;padding:25px 16px 50px}
.hero{
 background:#fff;
 border:1px solid #e5e7eb;
 border-radius:16px;
 padding:25px;
 margin-bottom:18px
}
.small{
 color:#7b8494;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.08em
}
h1{margin:7px 0;font-size:30px}
.hero p{margin:0;color:#687386;font-size:14px}
.lang{
 display:flex;gap:6px;margin:18px 0
}
.lang button{
 border:1px solid #ddd;
 background:#fff;
 padding:7px 11px;
 border-radius:7px;
 cursor:pointer;
 font-size:12px
}
.lang button.active{background:#111827;color:#fff}
.units{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:10px;
 margin-bottom:20px
}
.unit{
 background:#fff;
 border:1px solid #e3e7ed;
 border-radius:12px;
 padding:15px;
 cursor:pointer
}
.unit.active{border:2px solid #111827}
.unit small{color:#8b95a5}
.unit strong{display:block;margin-top:5px}
.lessons{
 background:#fff;
 border:1px solid #e3e7ed;
 border-radius:12px;
 overflow:hidden
}
.lesson{
 width:100%;
 border:0;
 border-bottom:1px solid #edf0f3;
 background:#fff;
 padding:14px;
 text-align:left;
 cursor:pointer;
 display:flex;
 justify-content:space-between
}
.lesson:hover{background:#f8fafc}
.lesson.active{background:#111827;color:#fff}
.free{color:#16803c;font-size:11px;font-weight:bold}
.premium{color:#b45309;font-size:11px;font-weight:bold}
.content{
 margin-top:18px;
 background:#fff;
 border:1px solid #e3e7ed;
 border-radius:12px;
 padding:22px
}
.content h2{margin-top:0}
.content h3{margin-top:24px}
.text{white-space:pre-line;line-height:1.8;color:#566274}
.lock{text-align:center;padding:25px}
.lock button{
 background:#111827;color:#fff;
 border:0;padding:11px 16px;
 border-radius:8px;cursor:pointer
}
.drawer{
 position:fixed;
 top:0;left:0;bottom:0;
 width:320px;max-width:85%;
 background:#fff;
 z-index:30;
 transform:translateX(-100%);
 transition:.2s;
 overflow:auto;
 box-shadow:5px 0 25px #0002
}
.drawer.open{transform:translateX(0)}
.drawer-head{
 padding:18px;
 border-bottom:1px solid #eee;
 display:flex;
 justify-content:space-between
}
.subject{
 width:100%;
 border:0;
 background:#fff;
 padding:13px 17px;
 text-align:left;
 cursor:pointer
}
.subject:hover{background:#f5f7fa}
.overlay{
 position:fixed;inset:0;
 background:#0006;
 z-index:20;
 display:none
}
.overlay.open{display:block}
.loading,.empty{
 padding:30px;text-align:center;color:#8993a3
}
@media(max-width:600px){
 .brand{font-size:14px}
 .grade{display:none}
 h1{font-size:25px}
 .hero{padding:20px}
 .content{padding:17px}
}
</style>
</head>

<body>

<header>
 <div class="left">
  <button class="menu" onclick="openMenu()">☰ Subjects</button>
  <div class="logo">C</div>
  <div class="brand">CreateLK Academy</div>
 </div>

 <div class="right">
  <span class="grade">Grade 06</span>
  <a class="dash" href="/dashboard.html">Dashboard</a>
 </div>
</header>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="drawer" id="drawer">
 <div class="drawer-head">
  <strong>Grade 06 Subjects</strong>
  <button onclick="closeMenu()">✕</button>
 </div>
 <div id="subjects">
  <div class="loading">Loading...</div>
 </div>
</aside>

<main>

<section class="hero">
 <div class="small">Grade 06 • Online Learning</div>
 <h1 id="title">English Language</h1>
 <p>Learn through structured lessons, practice and guided learning.</p>
</section>

<div class="lang">
 <button class="active" onclick="setLang('en',this)">English</button>
 <button onclick="setLang('si',this)">සිංහල</button>
 <button onclick="setLang('ta',this)">தமிழ்</button>
</div>

<div id="units">
 <div class="loading">Loading units...</div>
</div>

<div class="lessons">
 <div id="lessonList">
  <div class="empty">Select a unit.</div>
 </div>
</div>

<div class="content" id="content">
 <div class="empty">Select a lesson to begin.</div>
</div>

</main>

<script>

const API="https://createlk-academy-api.createlk.workers.dev";
const GRADE="06";

let subject="English Language";
let language="en";
let units=[];
let lessons=[];
let currentUnit=null;
let currentLesson=null;

const token=()=>localStorage.getItem("createlk_token");

async function api(url){
 const r=await fetch(API+url,{
  headers:token()?{Authorization:"Bearer "+token()}:{}
 });
 return {r,d:await r.json()};
}

function openMenu(){
 drawer.classList.add("open");
 overlay.classList.add("open");
}

function closeMenu(){
 drawer.classList.remove("open");
 overlay.classList.remove("open");
}

async function loadSubjects(){

 const {r,d}=await api(`/subjects?grade=${GRADE}`);

 if(!r.ok)return;

 subjects.innerHTML=(d.subjects||[]).map((s,i)=>`
  <button class="subject"
   onclick="loadSubject('${esc(s.subject)}')">
   <b>${i+1}. ${esc(s.subject)}</b><br>
   <small>${esc(s.sinhala_name||"")}</small>
  </button>
 `).join("");
}

async function loadSubject(s){

 subject=s;
 title.textContent=s;
 currentUnit=null;
 currentLesson=null;

 closeMenu();

 const {r,d}=await api(
  `/units?grade=${GRADE}&subject=${encodeURIComponent(s)}`
 );

 if(!r.ok){
  units.innerHTML=`<div class="empty">Unable to load units.</div>`;
  return;
 }

 units=d.units||[];
 renderUnits();

 if(units.length)loadUnit(units[0]);
}

function renderUnits(){

 if(!units.length){
  document.getElementById("units").innerHTML=
   `<div class="empty">No units available.</div>`;
  return;
 }

 document.getElementById("units").innerHTML=`
 <div class="units">
 ${units.map(u=>`
  <div class="unit ${currentUnit?.id==u.id?"active":""}"
   onclick="loadUnit(${u.id})">
   <small>UNIT ${u.unit_number}</small>
   <strong>${esc(
    language==="si"
    ?u.sinhala_name||u.unit_name
    :language==="ta"
    ?u.tamil_name||u.unit_name
    :u.unit_name
   )}</strong>
  </div>
 `).join("")}
 </div>`;
}

async function loadUnit(id){

 currentUnit=units.find(u=>u.id==id);

 renderUnits();

 const {r,d}=await api(
  `/lessons?grade=${GRADE}&subject=${encodeURIComponent(subject)}`
 );

 if(!r.ok)return;

 lessons=(d.lessons||[]).filter(l=>
  String(l.unit).trim().toLowerCase()===
  String(currentUnit.unit_name).trim().toLowerCase()
 );

 renderLessons();

 if(lessons.length){
  const first=
   subject==="English Language" &&
   Number(currentUnit.unit_number)===1
   ?lessons.find(l=>Number(l.lesson_number)===1)
   :lessons[0];

  loadLesson(first||lessons[0]);
 }
}

function renderLessons(){

 lessonList.innerHTML=lessons.length
 ?lessons.map(l=>`
  <button class="lesson ${
   currentLesson?.id==l.id?"active":""
  }" onclick="loadLessonById(${l.id})">

   <span>
    <b>Lesson ${l.lesson_number}</b><br>
    <small>${l.duration||0} min</small>
   </span>

   ${
    isFree(l)
    ?'<span class="free">FREE</span>'
    :'<span class="premium">🔒 PREMIUM</span>'
   }

  </button>
 `).join("")
 :`<div class="empty">No lessons available.</div>`;
}

function loadLessonById(id){
 loadLesson(lessons.find(l=>l.id==id));
}

async function loadLesson(l){

 if(!l)return;

 currentLesson=l;
 renderLessons();

 content.innerHTML=
 `<div class="loading">Loading lesson...</div>`;

 const {r,d}=await api(
  `/lesson?grade=${GRADE}`+
  `&subject=${encodeURIComponent(subject)}`+
  `&lesson=${l.lesson_number}`+
  `&language=${language}`
 );

 if(r.status===401){
  content.innerHTML=`
   <div class="lock">
    <h2>Login Required</h2>
    <p>Please login to access this lesson.</p>
    <button onclick="location.href='/auth/login.html'">
     Login
    </button>
   </div>`;
  return;
 }

 if(r.status===403){
  content.innerHTML=`
   <div class="lock">
    <h2>🔒 Premium Lesson</h2>
    <p>This lesson requires a Grade 06 Premium subscription.</p>
    <button onclick="location.href='/dashboard.html'">
     Unlock Premium
    </button>
   </div>`;
  return;
 }

 if(!r.ok||!d.success){
  content.innerHTML=
   `<div class="empty">${esc(d.error||"Unable to load lesson.")}</div>`;
  return;
 }

 const x=d.lesson;

 content.innerHTML=`
  <small>${esc(x.unit||"Lesson")}</small>
  <h2>${esc(x.title)}</h2>

  ${x.objectives?`
   <h3>Learning Objectives</h3>
   <div class="text">${esc(x.objectives)}</div>
  `:""}

  ${x.content?`
   <h3>Lesson Content</h3>
   <div class="text">${esc(x.content)}</div>
  `:""}

  ${x.key_points?`
   <h3>Key Points</h3>
   <div class="text">${esc(x.key_points)}</div>
  `:""}

  ${x.summary?`
   <h3>Summary</h3>
   <div class="text">${esc(x.summary)}</div>
  `:""}

  ${x.questions?.length?`
   <h3>Practice Questions</h3>
   ${x.questions.map((q,i)=>`
    <div style="margin:15px 0">
     <b>${i+1}. ${esc(q.question)}</b>
     <div class="text">
      A. ${esc(q.option_a||"")}<br>
      B. ${esc(q.option_b||"")}<br>
      C. ${esc(q.option_c||"")}<br>
      D. ${esc(q.option_d||"")}
     </div>
    </div>
   `).join("")}
  `:""}
 `;
}

function isFree(l){
 return subject==="English Language" &&
        Number(l.lesson_number)===1;
}

async function setLang(l,btn){

 language=l;

 document.querySelectorAll(".lang button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 renderUnits();

 if(currentLesson)
  loadLesson(currentLesson);
}

function esc(v){
 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

loadSubjects();
loadSubject("English Language");

</script>

</body>
</html>
