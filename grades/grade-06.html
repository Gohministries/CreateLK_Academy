<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:9}
.head{max-width:1100px;margin:auto;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:bold;color:#172554}
.brand img{width:42px;height:42px}
.btn{padding:9px 14px;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;font-size:13px}
.hero{padding:45px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#1d4ed8,#6d28d9)}
.hero h1{margin:5px;font-size:42px}
.hero span{color:#fef08a}
.hero p{font-size:14px}
.status{max-width:900px;margin:20px auto;padding:15px 18px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.active{background:#ecfdf5;color:#065f46}
.inactive{background:#fff7ed;color:#9a3412}
.container{max-width:1100px;margin:auto;padding:35px 18px}
h2{text-align:center;color:#172554}
.languages{text-align:center;margin:20px 0}
.lang{padding:10px 18px;border:1px solid #ddd;background:#fff;border-radius:8px;margin:4px;cursor:pointer;font-weight:bold}
.lang.active{background:#2563eb;color:#fff}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.subject{background:#fff;padding:18px;border-radius:14px;border:1px solid #e5e7eb;box-shadow:0 5px 15px #00000008}
.subject h3{color:#172554}
.subject p{color:#64748b;font-size:13px}
.open{width:100%;padding:10px;border:0;border-radius:8px;background:#eff6ff;color:#2563eb;font-weight:bold;cursor:pointer}
#message{text-align:center;margin:20px;padding:12px}
#content{display:none;background:#fff;padding:25px;border-radius:14px;margin-top:25px}
footer{text-align:center;background:#111827;color:#aaa;padding:30px 15px;font-size:12px}
footer a{margin:0 7px}

@media(max-width:800px){
.subjects{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){
.subjects{grid-template-columns:1fr}
.status{margin:15px;flex-direction:column;gap:10px}
.hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
<div class="head">

<a href="../index.html" class="brand">
<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">
CreateLK Academy
</a>

<a href="../index.html" class="btn">Home</a>

</div>
</header>

<section class="hero">
<h1>Grade 06 <span>Premium</span></h1>
<p>Learn Grade 06 subjects in English, සිංහල and தமிழ்.</p>
</section>

<div id="status" class="status inactive">
<div>
<b id="statusTitle">🔴 Premium Inactive</b>
<div id="statusText">Grade 06 Premium is required.</div>
</div>

<button id="pay" class="btn" onclick="subscribe()">Subscribe</button>
</div>

<main class="container">

<h2>Grade 06 Subjects</h2>

<div class="languages">

<button class="lang active"
onclick="language('en',this)">English</button>

<button class="lang"
onclick="language('si',this)">සිංහල</button>

<button class="lang"
onclick="language('ta',this)">தமிழ்</button>

</div>

<div id="subjects" class="subjects"></div>

<div id="message"></div>

<div id="content">

<h2 id="contentTitle"></h2>

<div id="lesson"></div>

<button class="open"
onclick="content.style.display='none'">
Close
</button>

</div>

</main>

<footer>

<b>CreateLK Academy</b><br><br>

<a href="../pages/about.html">About</a>
<a href="../pages/contact.html">Contact</a>
<a href="../pages/terms-and-conditions.html">Terms</a>
<a href="../pages/privacy-policy.html">Privacy</a>
<a href="../pages/refund-policy.html">Refund</a>
<a href="../pages/payment-policy.html">Payment</a>

<br><br>

© 2026 CreateLK Academy

</footer>

<script>

const API="https://createlk-premium-api.createlk.workers.dev";
const GRADE="06";

let token=localStorage.getItem("createlk_token");
let lang="en";
let premium=false;

const data={

en:[
["mathematics","📐","Mathematics"],
["science","🔬","Science"],
["english","🔤","English Language"],
["sinhala","📖","Sinhala Language"],
["tamil","📚","Tamil Language"],
["second-language","🌐","Second National Language"],
["history","🏛️","History"],
["geography","🌍","Geography"],
["civic","🤝","Civic Education"],
["religion","🕊️","Religion"],
["health","❤️","Health & Physical Education"],
["ict","💻","ICT"],
["aesthetic","🎨","Aesthetic Education"],
["technology","⚙️","Technology for Life"],
["entrepreneurship","💡","Entrepreneurship & Financial Literacy"]
],

si:[
["mathematics","📐","ගණිතය"],
["science","🔬","විද්‍යාව"],
["english","🔤","ඉංග්‍රීසි භාෂාව"],
["sinhala","📖","සිංහල භාෂාව"],
["tamil","📚","දෙමළ භාෂාව"],
["second-language","🌐","දෙවන ජාතික භාෂාව"],
["history","🏛️","ඉතිහාසය"],
["geography","🌍","භූගෝල විද්‍යාව"],
["civic","🤝","පුරවැසි අධ්‍යාපනය"],
["religion","🕊️","ආගම හා සාරධර්ම"],
["health","❤️","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය"],
["ict","💻","ICT"],
["aesthetic","🎨","සෞන්දර්ය අධ්‍යාපනය"],
["technology","⚙️","ජීවිතය සඳහා තාක්ෂණය"],
["entrepreneurship","💡","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව"]
],

ta:[
["mathematics","📐","கணிதம்"],
["science","🔬","விஞ்ஞானம்"],
["english","🔤","ஆங்கில மொழி"],
["sinhala","📖","சிங்கள மொழி"],
["tamil","📚","தமிழ் மொழி"],
["second-language","🌐","இரண்டாம் தேசிய மொழி"],
["history","🏛️","வரலாறு"],
["geography","🌍","புவியியல்"],
["civic","🤝","குடியியல் கல்வி"],
["religion","🕊️","சமயம்"],
["health","❤️","சுகாதாரம் மற்றும் உடற்கல்வி"],
["ict","💻","ICT"],
["aesthetic","🎨","அழகியல் கல்வி"],
["technology","⚙️","வாழ்க்கைக்கான தொழில்நுட்பம்"],
["entrepreneurship","💡","தொழில்முனைவோர் மற்றும் நிதியறிவு"]
]

};

function language(x,b){

lang=x;

document.querySelectorAll(".lang")
.forEach(e=>e.classList.remove("active"));

b.classList.add("active");

render();

}

function render(){

subjects.innerHTML=data[lang].map(s=>`

<div class="subject">

<div style="font-size:25px">${s[1]}</div>

<h3>${s[2]}</h3>

<button class="open"
onclick="openSubject('${s[0]}')">
Open Subject →
</button>

</div>

`).join("");

}

async function checkPremium(){

if(!token){

statusTitle.textContent="🔴 Login Required";
statusText.textContent="Please log in to access Grade 06 Premium.";
pay.style.display="none";

return;

}

try{

let r=await fetch(
API+"/premium/status?grade="+GRADE,
{
headers:{
Authorization:"Bearer "+token
}
}
);

if(r.status===401){

localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");

token=null;

statusTitle.textContent="🔴 Login Required";
statusText.textContent="Please log in to access Grade 06 Premium.";
pay.style.display="none";

return;

}

let d=await r.json();

if(r.ok&&d.success&&d.premium?.active){

premium=true;

status.className="status active";

statusTitle.textContent="🟢 Grade 06 Premium Active";

statusText.textContent=
d.premium.expires_at
?"Valid until: "+new Date(d.premium.expires_at).toLocaleDateString()
:"Premium is active";

pay.style.display="none";

}else{

premium=false;

status.className="status inactive";

statusTitle.textContent="🔴 Premium Inactive";

statusText.textContent="Grade 06 Premium is required.";

pay.style.display="block";

}

}catch(e){

statusTitle.textContent="⚠️ Unable to check Premium";
statusText.textContent="Please try again.";

}

}

async function openSubject(subject){

if(!token){

location.href="../auth/login.html?redirect=/grades/grade-06.html";

return;

}

message.textContent="Loading...";

try{

let r=await fetch(
API+"/content?grade="+GRADE+
"&subject="+encodeURIComponent(subject)+
"&language="+lang,
{
headers:{
Authorization:"Bearer "+token
}
}
);

let d=await r.json();

if(r.status===403){

subscribe();

return;

}

if(r.status===401){

localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");

location.href="../auth/login.html?redirect=/grades/grade-06.html";

return;

}

if(!r.ok||!d.success){

message.textContent=d.error||"Unable to load content.";

return;

}

message.textContent="";

content.style.display="block";

contentTitle.textContent=
d.product?.title||subject;

lesson.innerHTML=
d.product?.content||"No content available.";

content.scrollIntoView({
behavior:"smooth"
});

}catch(e){

message.textContent="Unable to connect.";

}

}

async function subscribe(){

if(!token){

location.href="../auth/login.html?redirect=/grades/grade-06.html";

return;

}

try{

let r=await fetch(
API+"/premium/checkout?grade="+GRADE,
{
headers:{
Authorization:"Bearer "+token
}
}
);

let d=await r.json();

if(d.checkout_url){

location.href=d.checkout_url;

}else{

alert(
d.error||
"Payment checkout unavailable."
);

}

}catch(e){

alert("Unable to open payment.");

}

}

render();
checkPremium();

</script>

</body>
</html>
