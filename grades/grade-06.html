<body>

<header>

<div class="head">

<a href="../index.html" class="brand">
<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

onclick="language('en',this)">

onclick="language('si',this)">

onclick="language('ta',this)">
தமிழ்

<button class="open"
onclick="document.getElementById('content').style.display='none'">
Close
</button>

</main>


<footer>

<a href="../pages/terms-and-conditions.html">Terms</a>

<a href="../pages/payment-policy.html">Payment</a>

<br><br>

© 2026 CreateLK Academy

</footer>


<script>

/* =========================
   CONFIGURATION
========================= */

const API="https://createlk-premium-api.createlk.workers.dev";

const GRADE="06";

let token=localStorage.getItem("createlk_token");

let lang="en";

let premium=false;


/* =========================
   SUBJECT DATA
========================= */

const data={

en:[

["mathematics","📐","Mathematics"],

["science","🔬","Science"],

["english","🔤","English Language"],

["sinhala","📖","Sinhala Language"],

["tamil","📚","Tamil Language"],

["second-language","🌐","Second National Language"],

["history","🏛️","History"],

["geography","🌍","Geography"],

["civic","🤝","Civic Education"],

["religion","🕊️","Religion"],

["health","❤️","Health & Physical Education"],

["ict","💻","ICT"],

["aesthetic","🎨","Aesthetic Education"],

["technology","⚙️","Technology for Life"],

["entrepreneurship","💡","Entrepreneurship & Financial Literacy"]

],


si:[

["mathematics","📐","ගණිතය"],

["science","🔬","විද්‍යාව"],

["english","🔤","ඉංග්‍රීසි භාෂාව"],

["sinhala","📖","සිංහල භාෂාව"],

["tamil","📚","දෙමළ භාෂාව"],

["second-language","🌐","දෙවන ජාතික භාෂාව"],

["history","🏛️","ඉතිහාසය"],

["geography","🌍","භූගෝල විද්‍යාව"],

["civic","🤝","පුරවැසි අධ්‍යාපනය"],

["religion","🕊️","ආගම හා සාරධර්ම"],

["health","❤️","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය"],

["ict","💻","ICT"],

["aesthetic","🎨","සෞන්දර්ය අධ්‍යාපනය"],

["technology","⚙️","ජීවිතය සඳහා තාක්ෂණය"],

["entrepreneurship","💡","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව"]

],


ta:[

["mathematics","📐","கணிதம்"],

["science","🔬","விஞ்ஞானம்"],

["english","🔤","ஆங்கில மொழி"],

["sinhala","📖","சிங்கள மொழி"],

["tamil","📚","தமிழ் மொழி"],

["second-language","🌐","இரண்டாம் தேசிய மொழி"],

["history","🏛️","வரலாறு"],

["geography","🌍","புவியியல்"],

["civic","🤝","குடியியல் கல்வி"],

["religion","🕊️","சமயம்"],

["health","❤️","சுகாதாரம் மற்றும் உடற்கல்வி"],

["ict","💻","ICT"],

["aesthetic","🎨","அழகியல் கல்வி"],

["technology","⚙️","வாழ்க்கைக்கான தொழில்நுட்பம்"],

["entrepreneurship","💡","தொழில்முனைவோர் மற்றும் நிதியறிவு"]

]

};


/* =========================
   LANGUAGE
========================= */

function language(x,b){

lang=x;

document
.querySelectorAll(".lang")
.forEach(e=>e.classList.remove("active"));

b.classList.add("active");

render();

}


/* =========================
   RENDER SUBJECTS
========================= */

function render(){

document.getElementById("subjects").innerHTML=

data[lang].map(s=>`

<div class="subject">

<div style="font-size:25px">
${s[1]}
</div>

<h3>
${s[2]}
</h3>

<button class="open"
onclick="openSubject('${s[0]}')">

Open Subject →

</button>

</div>

`).join("");

}


/* =========================
   CHECK PREMIUM
========================= */

async function checkPremium(){

if(!token){

document.getElementById("status").className=
"status inactive";

document.getElementById("statusTitle").textContent=
"🔴 Login Required";

document.getElementById("statusText").textContent=
"Please log in to access Grade 06 Premium.";

document.getElementById("pay").style.display=
"none";

return;
}


try{

let r=await fetch(

API+"/premium/status?grade="+GRADE,

{

method:"GET",

headers:{
"Authorization":"Bearer "+token
}

}

);


if(r.status===401){

localStorage.removeItem("createlk_token");

localStorage.removeItem("createlk_customer");

token=null;

document.getElementById("status").className=
"status inactive";

document.getElementById("statusTitle").textContent=
"🔴 Login Required";

document.getElementById("statusText").textContent=
"Your login session has expired. Please log in again.";

document.getElementById("pay").style.display=
"none";

return;

}


let d=await r.json();


if(r.ok && d.success && d.premium && d.premium.active){

premium=true;

document.getElementById("status").className=
"status active";

document.getElementById("statusTitle").textContent=
"🟢 Grade 06 Premium Active";


if(d.premium.expires_at){

document.getElementById("statusText").textContent=
"Valid until: "+
new Date(d.premium.expires_at).toLocaleDateString();

}else{

document.getElementById("statusText").textContent=
"Premium is active.";

}


document.getElementById("pay").style.display=
"none";

}else{

premium=false;

document.getElementById("status").className=
"status inactive";

document.getElementById("statusTitle").textContent=
"🔴 Premium Inactive";

document.getElementById("statusText").textContent=
"Grade 06 Premium is required.";

document.getElementById("pay").style.display=
"block";

}

}catch(e){

document.getElementById("statusTitle").textContent=
"⚠️ Unable to check Premium";

document.getElementById("statusText").textContent=
"Please try again.";

}

}


/* =========================
   OPEN SUBJECT
========================= */

async function openSubject(subject){

if(!token){

location.href=
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


document.getElementById("message").textContent=
"Loading...";


try{

let r=await fetch(

API+"/content?grade="+
GRADE+
"&subject="+
encodeURIComponent(subject)+
"&language="+
lang,

{

method:"GET",

headers:{
"Authorization":"Bearer "+token
}

}

);


let d=await r.json();


if(r.status===403){

document.getElementById("message").textContent=
"Grade 06 Premium is required.";

subscribe();

return;

}


if(r.status===401){

localStorage.removeItem("createlk_token");

localStorage.removeItem("createlk_customer");

token=null;

location.href=
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


if(!r.ok || !d.success){

document.getElementById("message").textContent=
d.error ||
"Unable to load content.";

return;

}


document.getElementById("message").textContent="";


document.getElementById("content").style.display=
"block";


document.getElementById("contentTitle").textContent=
d.product?.title ||
subject;


document.getElementById("lesson").innerHTML=
d.product?.content ||
"No content available.";


document.getElementById("content").scrollIntoView({
behavior:"smooth"
});


}catch(e){

document.getElementById("message").textContent=
"Unable to connect.";

}

}


/* =========================
   SUBSCRIBE
   LKR 999 / 30 DAYS
========================= */

async function subscribe(){

if(!token){

location.href=
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


try{

document.getElementById("pay").disabled=true;

document.getElementById("pay").textContent=
"Loading...";


let r=await fetch(

API+"/premium/checkout?grade="+GRADE,

{

method:"GET",

headers:{
"Authorization":"Bearer "+token
}

}

);


if(r.status===401){

localStorage.removeItem("createlk_token");

localStorage.removeItem("createlk_customer");

token=null;

location.href=
"../auth/login.html?redirect=/grades/grade-06.html";

return;

}


let d=await r.json();


if(d.checkout_url){

location.href=d.checkout_url;

}else{

alert(
d.error ||
"Payment checkout unavailable."
);

}

}catch(e){

alert(
"Unable to open payment. Please try again."
);

}


document.getElementById("pay").disabled=false;

document.getElementById("pay").textContent=
"Subscribe";

}


/* =========================
   START
========================= */

render();

checkPremium();

</script>

</body>
</html>
