<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: #f6f8fc;
      color: #172033;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e8ebf2;
    }

    .header-container {
      max-width: 1000px;
      min-height: 70px;
      margin: auto;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      color: #172554;
    }

    .home-btn {
      padding: 9px 17px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 800;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 45px 20px 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      color: #172554;
      font-size: clamp(30px, 5vw, 44px);
      margin-bottom: 8px;
    }

    .hero p {
      color: #64748b;
      font-size: 14px;
    }

    .status-box {
      max-width: 700px;
      margin: 0 auto 35px;
      padding: 22px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #e7ebf2;
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
      text-align: center;
    }

    .status {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .status-details {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .status-login {
      color: #dc2626;
    }

    .status-active {
      color: #15803d;
    }

    .status-free {
      color: #2563eb;
    }

    .status-error {
      color: #dc2626;
    }

    .login-btn,
    .subscribe-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }

    .login-btn {
      background: #172554;
      color: #ffffff;
    }

    .subscribe-btn {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
    }

    .subjects-heading {
      text-align: center;
      margin-bottom: 22px;
    }

    .subjects-heading h2 {
      color: #172554;
      font-size: 25px;
      margin-bottom: 15px;
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .language-btn {
      border: 1px solid #dbe2ef;
      background: #ffffff;
      color: #475569;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .language-btn.active {
      background: #172554;
      color: #ffffff;
      border-color: #172554;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .subject-card {
      background: #ffffff;
      border: 1px solid #e7ebf2;
      border-radius: 17px;
      padding: 22px 18px;
      box-shadow: 0 8px 25px rgba(15,23,42,0.05);
      transition: 0.2s ease;
    }

    .subject-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(15,23,42,0.08);
    }

    .subject-icon {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .subject-name {
      color: #172554;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .open-btn {
      display: inline-block;
      color: #3730a3;
      font-size: 12px;
      font-weight: 900;
    }

    .locked {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
    }

    footer {
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px 35px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
    }

    .footer-links a:hover {
      color: #3730a3;
    }

    @media (max-width: 800px) {

      .subjects-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .header-container {
        min-height: 64px;
        padding: 8px 15px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .brand-name {
        font-size: 16px;
      }

      .home-btn {
        padding: 8px 13px;
        font-size: 12px;
      }

      main {
        padding: 35px 15px 55px;
      }

      .subjects-grid {
        grid-template-columns: 1fr;
      }

      .status-box {
        padding: 20px 16px;
      }

    }

  </style>

</head>

<body>

<main>

  <!-- SUBJECTS -->

      <div class="languages">

          class="language-btn active"

          onclick="changeLanguage('en')"

        <button

          data-language="si"
          onclick="changeLanguage('si')"
        >

        <button
          class="language-btn"
          data-language="ta"
          onclick="changeLanguage('ta')"
        >
          தமிழ்

      </div>

    </div>


    <div
      id="subjects"
      class="subjects-grid"
    ></div>

  </section>

</main>


<footer>

  <div class="footer-links">

    <a href="../pages/about.html">About</a>

    <a href="../pages/contact.html">Contact</a>

    <a href="../pages/terms-and-conditions.html">Terms</a>

    <a href="../pages/privacy-policy.html">Privacy</a>

    <a href="../pages/refund-policy.html">Refund</a>

    <a href="../pages/payment-policy.html">Payment</a>

  </div>

  <div>
    © 2026 CreateLK Academy
  </div>

</footer>


<script>

  /* =========================

    "https://createlk-auth-api.createlk.workers.dev";

  const PREMIUM_API =
    "https://createlk-premium-api.createlk.workers.dev";

  const GRADE = "06";


  /* =========================

  ========================== */

  const subjects = [

    {

    {

    },

    {

      ta: "தமிழ் மொழி"
    },

    {

      en: "Second National Language",
      si: "දෙවන ජාතික භාෂාව",

    },

    {
      icon: "🏛️",
      en: "History",
      si: "ඉතිහාසය",

    },

    {
      icon: "🌍",

      si: "භූගෝල විද්‍යාව",
      ta: "புவியியல்"
    },

    {
      icon: "🤝",
      en: "Civic Education",
      si: "පුරවැසි අධ්‍යාපනය",
      ta: "குடியியல் கல்வி"
    },

    {
      icon: "🕊️",

    },

    {
      icon: "❤️",
      en: "Health & Physical Education",
      si: "සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය",
      ta: "சுகாதாரம் மற்றும் உடற்கல்வி"
    },

    {
      icon: "💻",
      en: "ICT",
      si: "තොරතුරු හා සන්නිවේදන තාක්ෂණය",
      ta: "தகவல் மற்றும் தொடர்பாடல் தொழில்நுட்பம்"
    },

    {
      icon: "🎨",
      en: "Aesthetic Education",
      si: "සෞන්දර්ය අධ්‍යාපනය",
      ta: "அழகியல் கல்வி"
    },

    {
      icon: "⚙️",
      en: "Technology for Life",
      si: "ජීවිතය සඳහා තාක්ෂණය",
      ta: "வாழ்க்கைக்கான தொழில்நுட்பம்"
    },

    {
      icon: "💡",
      en: "Entrepreneurship & Financial Literacy",
      si: "ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව",
      ta: "தொழில் முனைவோர் மற்றும் நிதியறிவு"
    }

  ];


  let currentLanguage = "en";


  /* =========================
     RENDER SUBJECTS
  ========================== */

  function renderSubjects() {

    const container =
      document.getElementById("subjects");

    container.innerHTML = "";


    subjects.forEach((subject, index) => {

      const card =
        document.createElement("div");

      card.className =
        "subject-card";


      const name =
        subject[currentLanguage];


      card.innerHTML = `

        <div class="subject-icon">
          ${subject.icon}
        </div>

        <div class="subject-name">
          ${name}
        </div>

        <a
          href="#"
          class="open-btn"
          onclick="openSubject(${index}); return false;"
        >
          Open Subject →
        </a>

      `;


      container.appendChild(card);

    });

  }


  /* =========================
     LANGUAGE
  ========================== */

  function changeLanguage(language) {

    currentLanguage =
      language;


    document
      .querySelectorAll(".language-btn")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.language === language
        );

      });


    renderSubjects();

  }


  /* =========================
     AUTHENTICATION
  ========================== */

  async function checkAuthentication() {

    const token =
      localStorage.getItem(
        "createlk_token"
      );


    if (!token) {

      showLoginRequired();

      return null;

    }


    try {

      /*
        Use exactly the same authentication
        method as the working Dashboard.
      */

      const response =
        await fetch(
          AUTH_API + "/auth/me",
          {
            method: "GET",

            headers: {
              "Authorization":
                "Bearer " + token
            }
          }
        );


      if (response.status === 401) {

        localStorage.removeItem(
          "createlk_token"
        );

        localStorage.removeItem(
          "createlk_customer"
        );

        showLoginRequired();

        return null;

      }


      if (!response.ok) {

        throw new Error(
          "Authentication service unavailable."
        );

      }


      const data =
        await response.json();


      const customer =
        data.customer ||
        data.user ||
        data;


      if (!customer) {

        throw new Error(
          "Account information unavailable."
        );

      }


      localStorage.setItem(
        "createlk_customer",
        JSON.stringify(customer)
      );


      return token;

    } catch (error) {

      console.error(
        "Authentication error:",
        error
      );


      showError(
        "Unable to verify your account. Please try again."
      );


      return null;

    }

  }


  /* =========================
     PREMIUM STATUS
  ========================== */

  async function checkPremium(token) {

    const status =
      document.getElementById(
        "status"
      );

    const details =
      document.getElementById(
        "statusDetails"
      );

    const action =
      document.getElementById(
        "action"
      );


    try {

      const response =
        await fetch(
          PREMIUM_API +
          "/premium/status?grade=" +
          encodeURIComponent(GRADE),
          {
            method: "GET",

            headers: {
              "Authorization":
                "Bearer " + token
            }
          }
        );


      /*
        Token is invalid according to
        Premium API.
      */

      if (response.status === 401) {

        localStorage.removeItem(
          "createlk_token"
        );

        localStorage.removeItem(
          "createlk_customer"
        );

        showLoginRequired();

        return;

      }


      if (!response.ok) {

        throw new Error(
          "Premium service unavailable."
        );

      }


      const data =
        await response.json();


      /*
        Your Premium Worker returns:

        {
          success: true,
          premium: {
            active: true/false,
            grade: "06"
          }
        }
      */

      const premium =
        data.premium || {};


      if (
        data.success === true &&
        premium.active === true
      ) {

        status.textContent =
          "🟢 Premium Active";

        status.className =
          "status status-active";


        details.textContent =
          premium.expires_at
            ? "Your Grade 06 Premium access is active until " +
              formatDate(premium.expires_at) + "."
            : "Your Grade 06 Premium access is active.";


        action.innerHTML = "";

      } else {

        status.textContent =
          "🔵 Premium Required";

        status.className =
          "status status-free";


        details.textContent =
          "Subscribe to access Grade 06 Premium learning content.";


        action.innerHTML = `

          <button
            class="subscribe-btn"
            onclick="subscribe()"
          >
            Subscribe — LKR 999 / 30 Days
          </button>

        `;

      }

    } catch (error) {

      console.error(
        "Premium error:",
        error
      );


      showError(
        "Unable to check Premium status. Please try again."
      );

    }

  }


  /* =========================
     LOGIN REQUIRED
  ========================== */

  function showLoginRequired() {

    const status =
      document.getElementById(
        "status"
      );

    const details =
      document.getElementById(
        "statusDetails"
      );

    const action =
      document.getElementById(
        "action"
      );


    status.textContent =
      "🔴 Login Required";

    status.className =
      "status status-login";


    details.textContent =
      "Please log in to access Grade 06 Premium.";


    action.innerHTML = `

      <a
        href="../auth/login.html?redirect=/grades/grade-06.html"
        class="login-btn"
      >
        Login
      </a>

    `;

  }


  /* =========================
     ERROR
  ========================== */

  function showError(message) {

    const status =
      document.getElementById(
        "status"
      );

    const details =
      document.getElementById(
        "statusDetails"
      );

    const action =
      document.getElementById(
        "action"
      );


    status.textContent =
      "⚠️ Connection Error";

    status.className =
      "status status-error";


    details.textContent =
      message;


    action.innerHTML = `

      <button
        class="login-btn"
        onclick="location.reload()"
      >
        Try Again
      </button>

    `;

  }


  /* =========================
     OPEN SUBJECT
  ========================== */

  async function openSubject(index) {

    const token =
      localStorage.getItem(
        "createlk_token"
      );


    if (!token) {

      showLoginRequired();

      return;

    }


    const subject =
      subjects[index];


    try {

      const response =
        await fetch(
          PREMIUM_API +
          "/content?grade=" +
          encodeURIComponent(GRADE) +
          "&subject=" +
          encodeURIComponent(subject.en) +
          "&language=" +
          encodeURIComponent(currentLanguage),
          {
            method: "GET",

            headers: {
              "Authorization":
                "Bearer " + token
            }
          }
        );


      if (response.status === 401) {

        localStorage.removeItem(
          "createlk_token"
        );

        localStorage.removeItem(
          "createlk_customer"
        );

        showLoginRequired();

        return;

      }


      if (response.status === 403) {

        alert(
          "Grade 06 Premium subscription is required to access this subject."
        );

        return;

      }


      if (!response.ok) {

        throw new Error(
          "Unable to load subject."
        );

      }


      const data =
        await response.json();


      if (
        data.success !== true ||
        !data.product
      ) {

        alert(
          "Subject content is not available yet."
        );

        return;

      }


      /*
        Content is returned by the
        Premium Worker only after
        subscription verification.

        Store temporarily for the
        subject page if needed.
      */

      sessionStorage.setItem(
        "createlk_subject",
        JSON.stringify(data.product)
      );


      /*
        Temporary content display.

        Later this can be replaced with:
        subject.html?grade=06&subject=...
      */

      alert(
        "Premium access confirmed for " +
        subject[currentLanguage] +
        "."
      );

    } catch (error) {

      console.error(
        "Subject error:",
        error
      );


      alert(
        "Unable to load the subject. Please try again."
      );

    }

  }


  /* =========================
     SUBSCRIBE
  ========================== */

  async function subscribe() {

    const token =
      localStorage.getItem(
        "createlk_token"
      );


    if (!token) {

      window.location.href =
        "../auth/login.html?redirect=/grades/grade-06.html";

      return;

    }


    /*
      Your current Premium Worker does not
      yet provide /premium/checkout.

      Therefore we do not pretend that
      payment is already available.
    */

    alert(
      "Grade 06 Premium payment will be available soon."
    );

  }


  /* =========================
     DATE
  ========================== */

  function formatDate(dateString) {

    const date =
      new Date(dateString);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return dateString;

    }


    return date.toLocaleDateString(
      "en-GB",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );

  }


  /* =========================
     START
  ========================== */

  async function init() {

    renderSubjects();


    const token =
      await checkAuthentication();


    if (!token) {

      return;

    }


    await checkPremium(token);

  }


  init();

</script>
