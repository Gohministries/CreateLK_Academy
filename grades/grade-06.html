<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 06 | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:10}
.menu{font-size:25px;border:0;background:none;cursor:pointer;margin-right:10px}
.logo{width:40px;height:40px;object-fit:contain;margin-right:10px}
.brand{font-weight:700;flex:1}
.badge{background:#eef4ff;color:#175cd3;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:bold}
.dash{margin-left:10px;color:#175cd3;text-decoration:none;font-size:13px}

.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:19}
.overlay.show{display:block}
.drawer{position:fixed;top:0;left:-320px;width:300px;max-width:88%;height:100%;background:#fff;z-index:20;transition:.25s;overflow:auto}
.drawer.open{left:0}
.drawer-head{padding:18px;background:linear-gradient(135deg,#071a3d,#1261d6);color:#fff;display:flex;justify-content:space-between}
.drawer-head h2{margin:0;font-size:18px}
.close{border:0;background:none;color:#fff;font-size:25px}
.subject{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}
.subject.active,.subject:hover{background:#eef4ff}
.subject small{display:block;color:#667085;margin-top:3px}

.hero{background:linear-gradient(135deg,#071a3d,#1261d6,#08a6c9);color:#fff;padding:32px 20px}
.hero-inner,.main{max-width:1050px;margin:auto}
.hero h1{margin:8px 0;font-size:30px}
.hero p{margin:0;opacity:.9}

.main{padding:20px}
.box,.lesson,.content,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px}
.box{padding:15px;margin-bottom:20px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:7px}
select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px}

.status{padding:11px 14px;border-radius:9px;margin-bottom:15px;font-size:13px;font-weight:bold}
.status.ok{background:#ecfdf3;color:#027a48}
.status.lock{background:#fff7e6;color:#b54708}

h2.section{font-size:20px;margin:22px 0 10px}
.units{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.unit{white-space:nowrap;padding:9px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}
.unit.active{background:#175cd3;color:#fff;border-color:#175cd3}

.lessons{display:grid;gap:10px}
.lesson{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.num{width:40px;height:40px;border-radius:10px;background:#eef4ff;color:#175cd3;display:grid;place-items:center;font-weight:bold}
.info{flex:1}
.info h3{margin:0 0 5px;font-size:15px}
.meta{font-size:12px;color:#667085}
.access{font-size:10px;font-weight:bold;padding:6px 9px;border-radius:20px}
.free{background:#ecfdf3;color:#027a48}
.premium{background:#fff4d6;color:#a15c00}

.content{padding:20px;margin-top:20px;line-height:1.7}
.content h2{margin-top:0}
.content h3{margin-top:22px}
.content-box{background:#f8fafc;padding:13px;border-radius:9px;white-space:pre-line}

.lock{background:linear-gradient(135deg,#071a3d,#175cd3);color:#fff;text-align:center;padding:30px 20px;border-radius:15px;margin-top:20px}
.lock h2{margin:8px 0}
.lock p{opacity:.9}
.btn{display:inline-block;background:#fff;color:#175cd3;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:bold}

.empty{text-align:center;padding:25px;color:#667085}
.loading{text-align:center;padding:25px;color:#667085}

@media(max-width:600px){
.badge{display:none}
.hero h1{font-size:26px}
.lesson{padding:12px}
}
</style>
</head>

<body>

<header>
<button class="menu" onclick="openMenu()">☰</button>

<img class="logo"
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<div class="brand">CreateLK Academy</div>

<span class="badge">Grade 06</span>

<a class="dash" href="/dashboard.html">Dashboard</a>
</header>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<aside id="drawer" class="drawer">
<div class="drawer-head">
<h2>Grade 06 Subjects</h2>
<button class="close" onclick="closeMenu()">×</button>
</div>
<div id="subjects" style="padding:10px">
<div class="loading">Loading...</div>
</div>
</aside>

<section class="hero">
<div class="hero-inner">
<small>CreateLK Academy • Grade 06</small>
<h1 id="title">English Language</h1>
<p>Learn step by step with structured lessons and practice.</p>
</div>
</section>

<main class="main">

<div class="box">
<label>Learning Language</label>
<select id="language">
<option value="en">English</option>
<option value="si">සිංහල</option>
<option value="ta">தமிழ்</option>
</select>
</div>

<div id="status"></div>

<h2 class="section">Units</h2>
<div id="units" class="units"></div>

<h2 class="section">Lessons</h2>
<div id="lessons" class="lessons">
<div class="loading">Loading lessons...</div>
</div>

<div id="content"></div>

</main>

<script>
const API="https://createlk-academy-api.createlk.workers.dev";
const PREMIUM="https://createlk-premium-api.createlk.workers.dev";
const GRADE="06";

let subject="English Language";
let lessons=[];
let unit="";
let selected=null;
let premiumActive=false;

const $=id=>document.getElementById(id);
const token=()=>localStorage.getItem("createlk_token");

function headers(){
 return token()?{Authorization:`Bearer ${token()}`}:{};
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function free(l){
 return subject==="English Language" &&
        Number(l.lesson_number)===1;
}

function openMenu(){
 $("drawer").classList.add("open");
 $("overlay").classList.add("show");
}

function closeMenu(){
 $("drawer").classList.remove("open");
 $("overlay").classList.remove("show");
}

async function premiumStatus(){
 premiumActive=false;

 if(!token()){
  showStatus();
  return;
 }

 try{
  const r=await fetch(
   `${PREMIUM}/premium/status?grade=${GRADE}`,
   {headers:headers()}
  );

  if(r.ok){
   const d=await r.json();
   premiumActive=
    d.active===true||
    d.premium===true||
    d.subscription_active===true;
  }
 }catch(e){}

 showStatus();
}

function showStatus(){
 if(!token()){
  $("status").className="status lock";
  $("status").textContent="🔒 Login to access Premium lessons.";
 }else if(premiumActive){
  $("status").className="status ok";
  $("status").textContent="✓ Premium membership active.";
 }else{
  $("status").className="status lock";
  $("status").textContent="🔒 Premium membership required.";
 }
}

async function loadSubjects(){
 try{
  const r=await fetch(`${API}/subjects?grade=${GRADE}`);
  const d=await r.json();
  const list=d.subjects||d.data||[];

  $("subjects").innerHTML=list.map((s,i)=>{
   const n=s.subject||s.name||"";
   return `
   <button class="subject ${n===subject?"active":""}"
   data-s="${encodeURIComponent(n)}"
   onclick="selectSubject(this.dataset.s)">
   <b>${String(i+1).padStart(2,"0")}. ${esc(n)}</b>
   <small>${esc(s.sinhala_name||"")}</small>
   </button>`;
  }).join("");
 }catch(e){
  $("subjects").innerHTML=`<div class="empty">Unable to load subjects.</div>`;
 }
}

async function selectSubject(s){
 subject=decodeURIComponent(s);
 $("title").textContent=subject;
 closeMenu();
 $("content").innerHTML="";
 unit="";
 selected=null;
 await premiumStatus();
 await loadLessons();
 loadSubjects();
}

async function loadLessons(){
 $("units").innerHTML="";
 $("lessons").innerHTML=`<div class="loading">Loading lessons...</div>`;

 try{
  const r=await fetch(
   `${API}/lessons?grade=${GRADE}&subject=${encodeURIComponent(subject)}`
  );

  const d=await r.json();
  lessons=d.lessons||d.data||[];

  if(!lessons.length){
   $("lessons").innerHTML=
    `<div class="empty">No lessons available.</div>`;
   return;
  }

  const units=[...new Set(
   lessons.map(x=>x.unit||"General")
  )];

  unit=unit&&units.includes(unit)?unit:units[0];

  $("units").innerHTML=units.map(u=>`
   <button class="unit ${u===unit?"active":""}"
   onclick="selectUnit(${JSON.stringify(u)})">
   ${esc(u)}
   </button>
  `).join("");

  renderLessons();

 }catch(e){
  $("lessons").innerHTML=
   `<div class="empty">Unable to load lessons.</div>`;
 }
}

function selectUnit(u){
 unit=u;

 document.querySelectorAll(".unit").forEach(x=>
  x.classList.toggle("active",x.textContent.trim()===u)
 );

 renderLessons();
}

function renderLessons(){
 const list=lessons.filter(
  x=>(x.unit||"General")===unit
 );

 $("lessons").innerHTML=list.map(l=>{
  const f=free(l);

  return `
  <div class="lesson"
  onclick="openLesson(${Number(l.lesson_number)})">

   <div class="num">${Number(l.lesson_number)}</div>

   <div class="info">
    <h3>${esc(
     l.title||
     l.lesson_title||
     `Lesson ${l.lesson_number}`
    )}</h3>

    <div class="meta">
     ${l.duration?l.duration+" minutes":"Lesson"}
    </div>
   </div>

   <span class="access ${f?"free":"premium"}">
    ${f?"FREE":"PREMIUM"}
   </span>

  </div>`;
 }).join("");
}

async function openLesson(n){
 const l=lessons.find(
  x=>Number(x.lesson_number)===Number(n)
 );

 if(!l)return;

 selected=l;

 if(!free(l)&&!token()){
  $("content").innerHTML=`
   <div class="lock">
    <div style="font-size:40px">🔐</div>
    <h2>Login Required</h2>
    <p>Please login to access this lesson.</p>
    <a class="btn" href="/auth/login.html">Login</a>
   </div>`;
  return;
 }

 if(!free(l)&&!premiumActive){
  $("content").innerHTML=`
   <div class="lock">
    <div style="font-size:40px">🔒</div>
    <h2>Premium Lesson</h2>
    <p>This lesson is available for Premium members.</p>
    <a class="btn" href="/premium.html">Get Premium</a>
   </div>`;
  return;
 }

 await getLesson(n);
}

async function getLesson(n){
 $("content").innerHTML=
  `<div class="loading">Loading lesson...</div>`;

 try{
  const url=
   `${API}/lesson?grade=${GRADE}`+
   `&subject=${encodeURIComponent(subject)}`+
   `&lesson=${n}`+
   `&language=${language.value}`;

  const r=await fetch(url,{headers:headers()});
  const d=await r.json();

  if(r.status===401){
   $("content").innerHTML=`
   <div class="lock">
    <h2>Login Required</h2>
    <a class="btn" href="/auth/login.html">Login</a>
   </div>`;
   return;
  }

  if(r.status===403){
   $("content").innerHTML=`
   <div class="lock">
    <h2>Premium Lesson</h2>
    <p>Premium membership is required.</p>
    <a class="btn" href="/premium.html">Get Premium</a>
   </div>`;
   return;
  }

  if(!r.ok)throw Error();

  renderLesson(d);

 }catch(e){
  $("content").innerHTML=
   `<div class="empty">Unable to load lesson.</div>`;
 }
}

function renderLesson(d){
 const l=d.lesson||d.data||d;
 const q=d.questions||[];

 let html=`
 <div class="content">
 <h2>${esc(l.title||"Lesson")}</h2>`;

 if(l.objectives)
 html+=`
 <h3>Learning Objectives</h3>
 <div class="content-box">${esc(l.objectives)}</div>`;

 if(l.content)
 html+=`
 <h3>Lesson Content</h3>
 <div class="content-box">${esc(l.content)}</div>`;

 if(l.key_points)
 html+=`
 <h3>Key Points</h3>
 <div class="content-box">${esc(l.key_points)}</div>`;

 if(l.summary)
 html+=`
 <h3>Summary</h3>
 <div class="content-box">${esc(l.summary)}</div>`;

 if(l.video_url)
 html+=`
 <h3>Video</h3>
 <a href="${esc(l.video_url)}"
 target="_blank">Watch Lesson Video</a>`;

 if(q.length){
  html+="<h3>Practice Questions</h3>";

  q.forEach((x,i)=>{
   html+=`
   <div class="content-box">
   <b>${i+1}. ${esc(x.question)}</b>
   <div>A. ${esc(x.option_a)}</div>
   <div>B. ${esc(x.option_b)}</div>
   <div>C. ${esc(x.option_c)}</div>
   <div>D. ${esc(x.option_d)}</div>
   </div>`;
  });
 }

 html+="</div>";

 $("content").innerHTML=html;

 $("content").scrollIntoView({
  behavior:"smooth"
 });
}

language.onchange=()=>{
 if(selected)openLesson(selected.lesson_number);
};

(async()=>{
 await loadSubjects();
 await premiumStatus();
 await loadLessons();
})();
</script>

</body>
</html>
