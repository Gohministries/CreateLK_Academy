<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 06 | CreateLK Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#102a43;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#ffd166;
}

.dashboard{
  color:white;
  text-decoration:none;
  background:#ffffff18;
  padding:9px 14px;
  border-radius:8px;
  font-size:14px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(135deg,#102a43,#1d4e89);
  color:white;
  border-radius:16px;
  padding:28px 22px;
  margin-bottom:20px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  opacity:.9;
  line-height:1.5;
}

.languages{
  display:flex;
  gap:8px;
  margin-top:18px;
  flex-wrap:wrap;
}

.lang-btn{
  border:1px solid #ffffff55;
  background:#ffffff15;
  color:white;
  padding:9px 16px;
  border-radius:20px;
  cursor:pointer;
}

.lang-btn.active{
  background:#ffd166;
  color:#102a43;
  border-color:#ffd166;
  font-weight:bold;
}

.section-title{
  font-size:21px;
  margin:25px 0 12px;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.subject{
  background:white;
  border:1px solid #e2e7ef;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.subject:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 18px #0000000d;
}

.subject.active{
  border-color:#1d4e89;
  background:#eef5ff;
  font-weight:bold;
}

.lessons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:12px;
}

.lesson-card{
  background:white;
  border:1px solid #e2e7ef;
  border-radius:12px;
  padding:16px;
  cursor:pointer;
}

.lesson-card:hover{
  box-shadow:0 5px 18px #00000012;
}

.lesson-number{
  font-size:13px;
  color:#667085;
  margin-bottom:6px;
}

.lesson-title{
  font-weight:700;
  line-height:1.4;
}

.free{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:15px;
  background:#e8f7ed;
  color:#18794e;
  font-size:12px;
  font-weight:bold;
}

.locked{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:15px;
  background:#fff0f0;
  color:#c0392b;
  font-size:12px;
  font-weight:bold;
}

.lesson-box{
  background:white;
  border-radius:16px;
  padding:24px;
  margin-top:20px;
  border:1px solid #e2e7ef;
}

.lesson-box h2{
  font-size:26px;
  margin-bottom:8px;
}

.meta{
  color:#667085;
  font-size:14px;
  margin-bottom:20px;
}

.content-section{
  margin-top:22px;
}

.content-section h3{
  margin-bottom:9px;
  color:#102a43;
}

.content-section p{
  white-space:pre-line;
  line-height:1.75;
  color:#344054;
}

.key-points{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.key-point{
  background:#eef5ff;
  color:#1d4e89;
  padding:8px 11px;
  border-radius:8px;
  font-size:13px;
}

.question{
  background:#f8fafc;
  padding:16px;
  border-radius:10px;
  margin-bottom:12px;
}

.options{
  margin-top:10px;
  display:grid;
  gap:7px;
}

.option{
  padding:9px;
  background:white;
  border:1px solid #e2e7ef;
  border-radius:7px;
}

.premium-box{
  background:linear-gradient(135deg,#fff8df,#fff);
  border:1px solid #f1d37a;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
}

.premium-box h3{
  margin-bottom:7px;
}

.subscribe{
  margin-top:14px;
  border:0;
  background:#102a43;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.message{
  padding:15px;
  background:white;
  border-radius:10px;
  margin-top:15px;
  color:#667085;
}

.loading{
  padding:20px;
  text-align:center;
  color:#667085;
}

footer{
  text-align:center;
  padding:30px 20px;
  color:#667085;
  font-size:13px;
}

@media(max-width:600px){
  .hero h1{
    font-size:25px;
  }

  .container{
    padding:14px;
  }

  .lesson-box{
    padding:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    CreateLK <span>Academy</span>
  </div>

  <a class="dashboard" href="/dashboard.html">
    Dashboard
  </a>
</header>

<main class="container">

  <section class="hero">
    <h1>Grade 06</h1>
    <p>
      Learn your school syllabus with structured lessons,
      short notes and questions.
    </p>

    <div class="languages">
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="si">සිංහල</button>
      <button class="lang-btn" data-lang="ta">தமிழ்</button>
    </div>
  </section>


  <h2 class="section-title">Subjects</h2>

  <div class="subjects" id="subjects"></div>


  <h2 class="section-title" id="lessonHeading">
    Lessons
  </h2>

  <div id="lessons" class="lessons">
    <div class="loading">
      Select a subject.
    </div>
  </div>


  <div id="lessonContent"></div>

</main>


<footer>
  © CreateLK Academy
</footer>


<script>

const API =
  "https://createlk-academy-api.createlk.workers.dev";

const GRADE = "06";

let token =
  localStorage.getItem("createlk_token");

let language =
  localStorage.getItem("grade06_language") || "en";

let selectedSubject = "";


const subjects = [

  {
    en:"Mathematics",
    si:"ගණිතය",
    ta:"கணிதம்"
  },

  {
    en:"Science",
    si:"විද්‍යාව",
    ta:"அறிவியல்"
  },

  {
    en:"English Language",
    si:"ඉංග්‍රීසි භාෂාව",
    ta:"ஆங்கில மொழி"
  },

  {
    en:"Sinhala Language",
    si:"සිංහල භාෂාව",
    ta:"சிங்கள மொழி"
  },

  {
    en:"Tamil Language",
    si:"දෙමළ භාෂාව",
    ta:"தமிழ் மொழி"
  },

  {
    en:"Second National Language",
    si:"දෙවන ජාතික භාෂාව",
    ta:"இரண்டாம் தேசிய மொழி"
  },

  {
    en:"History",
    si:"ඉතිහාසය",
    ta:"வரலாறு"
  },

  {
    en:"Geography",
    si:"භූගෝල විද්‍යාව",
    ta:"புவியியல்"
  },

  {
    en:"Civic Education",
    si:"පුරවැසි අධ්‍යාපනය",
    ta:"குடியுரிமைக் கல்வி"
  },

  {
    en:"Religion",
    si:"ආගම",
    ta:"சமயம்"
  },

  {
    en:"Health & Physical Education",
    si:"සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය",
    ta:"சுகாதாரமும் உடற்கல்வியும்"
  },

  {
    en:"ICT",
    si:"තොරතුරු හා සන්නිවේදන තාක්ෂණය",
    ta:"தகவல் மற்றும் தொடர்பாடல் தொழில்நுட்பம்"
  },

  {
    en:"Aesthetic Education",
    si:"සෞන්දර්ය අධ්‍යාපනය",
    ta:"அழகியல் கல்வி"
  },

  {
    en:"Technology for Life",
    si:"ජීවිතය සඳහා තාක්ෂණය",
    ta:"வாழ்க்கைக்கான தொழில்நுட்பம்"
  },

  {
    en:"Entrepreneurship & Financial Literacy",
    si:"ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව",
    ta:"தொழில்முனைவோர் மற்றும் நிதி அறிவாற்றல்"
  }

];


function subjectName(subject){
  return subject[language] || subject.en;
}


function renderSubjects(){

  const box =
    document.getElementById("subjects");

  box.innerHTML = "";

  subjects.forEach(subject => {

    const div =
      document.createElement("div");

    div.className =
      "subject" +
      (selectedSubject === subject.en
        ? " active"
        : "");

    div.textContent =
      subjectName(subject);

    div.onclick = () => {

      selectedSubject =
        subject.en;

      renderSubjects();

      loadLessons(
        selectedSubject
      );
    };

    box.appendChild(div);

  });
}


function setLanguage(lang){

  language = lang;

  localStorage.setItem(
    "grade06_language",
    lang
  );

  document
    .querySelectorAll(".lang-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );

    });

  renderSubjects();

  if(selectedSubject){
    loadLessons(selectedSubject);
  }
}


document
  .querySelectorAll(".lang-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => setLanguage(
        button.dataset.lang
      )
    );

  });


function updateLanguageButtons(){

  document
    .querySelectorAll(".lang-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.lang === language
      );

    });

}


async function loadLessons(subject){

  const lessonsBox =
    document.getElementById("lessons");

  const contentBox =
    document.getElementById("lessonContent");

  contentBox.innerHTML = "";

  lessonsBox.innerHTML =
    `<div class="loading">
      Loading lessons...
    </div>`;

  try{

    const response =
      await fetch(
        `${API}/lessons?grade=${encodeURIComponent(GRADE)}&subject=${encodeURIComponent(subject)}`
      );

    const data =
      await response.json();

    if(!data.success){

      lessonsBox.innerHTML =
        `<div class="message">
          ${data.error || "Unable to load lessons."}
        </div>`;

      return;
    }


    if(!data.lessons.length){

      lessonsBox.innerHTML =
        `<div class="message">
          No lessons available yet for this subject.
        </div>`;

      return;
    }


    lessonsBox.innerHTML = "";

    data.lessons.forEach(lesson => {

      const card =
        document.createElement("div");

      card.className =
        "lesson-card";

      const free =
        Number(lesson.is_free) === 1;

      card.innerHTML = `

        <div class="lesson-number">
          Lesson ${lesson.lesson_number}
        </div>

        <div class="lesson-title">
          ${escapeHtml(
            lesson.lesson_code || "Lesson"
          )}
        </div>

        ${
          free
          ? `<span class="free">FREE</span>`
          : `<span class="locked">🔒 PREMIUM</span>`
        }

      `;

      card.onclick = () => {

        loadLesson(
          subject,
          lesson.lesson_number
        );

      };

      lessonsBox.appendChild(card);

    });

  }catch(error){

    console.error(error);

    lessonsBox.innerHTML =
      `<div class="message">
        Unable to connect to Academy API.
      </div>`;
  }
}


async function loadLesson(
  subject,
  lessonNumber
){

  const contentBox =
    document.getElementById("lessonContent");

  contentBox.innerHTML =
    `<div class="lesson-box">
      <div class="loading">
        Loading lesson...
      </div>
    </div>`;


  if(!token){

    contentBox.innerHTML =
      `<div class="lesson-box">

        <h2>Login Required</h2>

        <p class="meta">
          Please log in to access lessons.
        </p>

        <a
          class="subscribe"
          href="/auth/login.html"
          style="display:inline-block;text-decoration:none;"
        >
          Login
        </a>

      </div>`;

    return;
  }


  try{

    const response =
      await fetch(
        `${API}/lesson?grade=${encodeURIComponent(GRADE)}&subject=${encodeURIComponent(subject)}&lesson=${lessonNumber}&language=${language}`,
        {
          headers:{
            Authorization:
              `Bearer ${token}`
          }
        }
      );


    const data =
      await response.json();


    if(response.status === 401){

      contentBox.innerHTML =
        `<div class="lesson-box">

          <h2>Login Required</h2>

          <p class="meta">
            Your login session is not available.
            Please log in again.
          </p>

          <a
            class="subscribe"
            href="/auth/login.html"
            style="display:inline-block;text-decoration:none;"
          >
            Login
          </a>

        </div>`;

      return;
    }


    if(response.status === 403){

      showPremiumMessage(
        data.lesson,
        subject
      );

      return;
    }


    if(!data.success){

      contentBox.innerHTML =
        `<div class="lesson-box">
          <div class="message">
            ${escapeHtml(
              data.error || "Unable to load lesson."
            )}
          </div>
        </div>`;

      return;
    }


    renderLesson(
      data.lesson
    );

  }catch(error){

    console.error(error);

    contentBox.innerHTML =
      `<div class="lesson-box">

        <div class="message">
          Unable to connect to the Academy API.
        </div>

      </div>`;
  }
}


function renderLesson(lesson){

  const contentBox =
    document.getElementById("lessonContent");

  const keyPoints =
    lesson.key_points
      ? lesson.key_points
          .split(";")
          .map(x => x.trim())
          .filter(Boolean)
      : [];


  const questions =
    lesson.questions || [];


  contentBox.innerHTML = `

    <article class="lesson-box">

      <h2>
        ${escapeHtml(
          lesson.title || "Lesson"
        )}
      </h2>

      <div class="meta">
        Grade ${escapeHtml(lesson.grade)}
        ·
        ${escapeHtml(lesson.subject)}
        ·
        Lesson ${lesson.lesson_number}
        ${
          lesson.free
          ? " · FREE"
          : " · PREMIUM"
        }
      </div>


      ${
        lesson.objectives
        ? `
          <section class="content-section">

            <h3>
              Learning Objectives
            </h3>

            <p>
              ${escapeHtml(
                lesson.objectives
              )}
            </p>

          </section>
        `
        : ""
      }


      ${
        lesson.content
        ? `
          <section class="content-section">

            <h3>
              Short Note
            </h3>

            <p>
              ${escapeHtml(
                lesson.content
              )}
            </p>

          </section>
        `
        : ""
      }


      ${
        keyPoints.length
        ? `
          <section class="content-section">

            <h3>
              Key Points
            </h3>

            <div class="key-points">

              ${keyPoints
                .map(point => `
                  <span class="key-point">
                    ${escapeHtml(point)}
                  </span>
                `)
                .join("")}

            </div>

          </section>
        `
        : ""
      }


      ${
        lesson.summary
        ? `
          <section class="content-section">

            <h3>
              Summary
            </h3>

            <p>
              ${escapeHtml(
                lesson.summary
              )}
            </p>

          </section>
        `
        : ""
      }


      ${
        lesson.video_url
        ? `
          <section class="content-section">

            <h3>
              Video Lesson
            </h3>

            <video
              controls
              style="width:100%;border-radius:10px;"
            >
              <source
                src="${escapeAttribute(
                  lesson.video_url
                )}"
              >
            </video>

          </section>
        `
        : ""
      }


      ${
        questions.length
        ? `
          <section class="content-section">

            <h3>
              Questions
            </h3>

            ${questions
              .map((q,index) => `

                <div class="question">

                  <strong>
                    ${index + 1}.
                    ${escapeHtml(
                      q.question
                    )}
                  </strong>

                  <div class="options">

                    ${
                      q.option_a
                      ? `<div class="option">
                          A. ${escapeHtml(q.option_a)}
                        </div>`
                      : ""
                    }

                    ${
                      q.option_b
                      ? `<div class="option">
                          B. ${escapeHtml(q.option_b)}
                        </div>`
                      : ""
                    }

                    ${
                      q.option_c
                      ? `<div class="option">
                          C. ${escapeHtml(q.option_c)}
                        </div>`
                      : ""
                    }

                    ${
                      q.option_d
                      ? `<div class="option">
                          D. ${escapeHtml(q.option_d)}
                        </div>`
                      : ""
                    }

                  </div>

                </div>

              `)
              .join("")}

          </section>
        `
        : ""
      }

    </article>

  `;
}


function showPremiumMessage(
  lesson,
  subject
){

  const contentBox =
    document.getElementById("lessonContent");

  contentBox.innerHTML = `

    <div class="premium-box">

      <h3>
        🔒 Premium Lesson
      </h3>

      <p>
        This lesson is available with
        CreateLK Academy Premium.
      </p>

      <p style="margin-top:8px;">
        Premium access:
        <strong>LKR 999 / 30 days</strong>
      </p>

      <button
        class="subscribe"
        onclick="subscribe()"
      >
        Get Premium
      </button>

    </div>

  `;
}


function subscribe(){

  alert(
    "Premium payment will be available soon."
  );
}


function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value);
}


// Initial page
updateLanguageButtons();
renderSubjects();

</script>

</body>
</html>
