<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard | CreateLK Academy</title>

<link rel="icon"
href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:#f6f8fc;
color:#172033;
}

a{
text-decoration:none;
color:inherit;
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(255,255,255,.96);
backdrop-filter:blur(12px);
border-bottom:1px solid #e8ebf2;
}

.header-container{
max-width:1000px;
min-height:70px;
margin:auto;
padding:8px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:11px;
}

.brand img{
width:45px;
height:45px;
object-fit:contain;
}

.brand-name{
font-size:19px;
font-weight:800;
color:#172554;
}

.home-btn{
padding:9px 17px;
border-radius:10px;
background:#eef2ff;
color:#3730a3;
font-size:13px;
font-weight:800;
}

main{
max-width:700px;
margin:auto;
padding:50px 20px 70px;
}

.page-heading{
text-align:center;
margin-bottom:30px;
}

.page-heading h1{
color:#172554;
font-size:clamp(30px,5vw,42px);
margin-bottom:7px;
}

.page-heading p{
color:#64748b;
font-size:14px;
}

.dashboard-card{
background:#fff;
border:1px solid #e7ebf2;
border-radius:20px;
padding:28px;
box-shadow:0 12px 35px rgba(15,23,42,.07);
}

.profile-row{
display:flex;
align-items:center;
gap:15px;
padding-bottom:23px;
margin-bottom:22px;
border-bottom:1px solid #edf0f5;
}

.profile-icon{
width:54px;
height:54px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
font-size:23px;
font-weight:800;
}

.profile-title{
color:#172554;
font-size:18px;
font-weight:800;
}

.profile-subtitle{
color:#64748b;
font-size:12px;
margin-top:3px;
}

.info-item{
padding:15px 0;
border-bottom:1px solid #edf0f5;
}

.info-item:last-child{
border-bottom:none;
padding-bottom:0;
}

.info-label{
color:#64748b;
font-size:12px;
font-weight:700;
margin-bottom:5px;
}

.info-value{
color:#172033;
font-size:15px;
font-weight:700;
word-break:break-word;
}

.premium-box{
margin-top:23px;
padding:18px;
border-radius:14px;
background:#f8fafc;
border:1px solid #e2e8f0;
}

.premium-title{
color:#334155;
font-size:12px;
font-weight:800;
margin-bottom:8px;
}

.premium-status{
font-size:16px;
font-weight:900;
}

.premium-active{
color:#15803d;
}

.premium-free{
color:#2563eb;
}

.premium-expired{
color:#dc2626;
}

.premium-details{
margin-top:6px;
color:#64748b;
font-size:12px;
line-height:1.5;
}

.premium-actions{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.pay-btn,
.lesson-btn{
display:inline-block;
padding:11px 16px;
border:0;
border-radius:9px;
font-size:13px;
font-weight:800;
cursor:pointer;
}

.pay-btn{
background:#2563eb;
color:#fff;
}

.lesson-btn{
background:#172554;
color:#fff;
}

.logout-btn{
width:100%;
margin-top:24px;
padding:12px;
border:1px solid #fecaca;
border-radius:10px;
background:#fff;
color:#dc2626;
font-size:13px;
font-weight:800;
cursor:pointer;
}

.loading{
text-align:center;
padding:30px;
color:#64748b;
font-size:14px;
}

@media(max-width:600px){

.header-container{
min-height:64px;
padding:8px 15px;
}

.brand img{
width:40px;
height:40px;
}

.brand-name{
font-size:16px;
}

.home-btn{
padding:8px 13px;
font-size:12px;
}

main{
padding:38px 15px 55px;
}

.dashboard-card{
padding:22px 18px;
border-radius:17px;
}

}

</style>

</head>

<body>

<header>

<div class="header-container">

<a href="../index.html" class="brand">

<img
src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
alt="CreateLK Academy Logo">

<div class="brand-name">
CreateLK Academy
</div>

</a>

<a href="../index.html" class="home-btn">
← Home
</a>

</div>

</header>

<main>

<div class="page-heading">

<h1>Dashboard</h1>

<p>Your account information</p>

</div>

<div id="loading" class="loading">
Loading account...
</div>

<div id="dashboard"
class="dashboard-card"
style="display:none;">

<div class="profile-row">

<div class="profile-icon" id="profileIcon">
U
</div>

<div>

<div class="profile-title" id="studentName">
—
</div>

<div class="profile-subtitle">
CreateLK Academy Account
</div>

</div>

</div>

<div class="info-item">

<div class="info-label">
Student Name
</div>

<div class="info-value" id="nameValue">
—
</div>

</div>

<div class="info-item">

<div class="info-label">
Email Address
</div>

<div class="info-value" id="emailValue">
—
</div>

</div>

<div class="info-item">

<div class="info-label">
Phone Number
</div>

<div class="info-value" id="phoneValue">
—
</div>

</div>

<div class="premium-box">

<div class="premium-title">
Grade 06 Premium
</div>

<div id="premiumStatus"
class="premium-status premium-free">
Checking...
</div>

<div id="premiumDetails"
class="premium-details">
</div>

<div id="premiumActions"
class="premium-actions">
</div>

</div>

<button
class="logout-btn"
onclick="logout()">
Logout
</button>

</div>

</main>

<script>

const API =
"https://createlk-auth-api.createlk.workers.dev";

const PREMIUM_API =
"https://createlk-premium-api.createlk.workers.dev";

const GRADE = "06";

let countdownTimer = null;


/* =========================
   ACCOUNT
========================= */

async function loadAccount(){

const token =
localStorage.getItem("createlk_token");

if(!token){

location.href =
"/auth/login.html?redirect=/dashboard.html";

return;
}

try{

const response =
await fetch(API+"/auth/me",{

method:"GET",

headers:{
"Authorization":"Bearer "+token
},

cache:"no-store"

});

if(response.status===401){

logout();
return;
}

if(!response.ok){

throw new Error("Account error");

}

const data =
await response.json();

const customer =
data.customer ||
data.user ||
data;

const firstName =
customer.first_name ||
customer.firstName ||
"";

const lastName =
customer.last_name ||
customer.lastName ||
"";

const name =
(firstName+" "+lastName).trim() ||
customer.name ||
"Student";

const email =
customer.email || "—";

const phone =
customer.phone ||
customer.phone_number ||
"—";

document.getElementById(
"studentName"
).textContent=name;

document.getElementById(
"nameValue"
).textContent=name;

document.getElementById(
"emailValue"
).textContent=email;

document.getElementById(
"phoneValue"
).textContent=phone;

document.getElementById(
"profileIcon"
).textContent=
name.charAt(0).toUpperCase();

localStorage.setItem(
"createlk_customer",
JSON.stringify(customer)
);

document.getElementById(
"loading"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="block";

loadPremium(token);

}catch(error){

console.error(error);

document.getElementById(
"loading"
).textContent=
"Unable to load your account. Please try again.";

}

}


/* =========================
   GRADE 06 PREMIUM
========================= */

async function loadPremium(token){

const status =
document.getElementById("premiumStatus");

const details =
document.getElementById("premiumDetails");

const actions =
document.getElementById("premiumActions");

try{

const response =
await fetch(
PREMIUM_API+
"/premium/status?grade="+GRADE,
{

method:"GET",

headers:{
"Authorization":"Bearer "+token
},

cache:"no-store"

});

if(response.status===401){

logout();
return;
}

if(!response.ok){

throw new Error("Premium error");

}

const data =
await response.json();

const premium =
data.premium || {};

if(
data.success===true &&
premium.active===true
){

showActivePremium(
premium,
status,
details,
actions
);

}else{

showFreePremium(
status,
details,
actions
);

}

}catch(error){

console.error(error);

status.textContent =
"Premium status unavailable";

status.className =
"premium-status premium-free";

details.textContent =
"Please try again later.";

}

}


/* =========================
   ACTIVE
========================= */

function showActivePremium(
premium,
status,
details,
actions
){

status.textContent =
"🟢 Premium Active";

status.className =
"premium-status premium-active";

actions.innerHTML = `
<a
href="/grades/grade-06.html"
class="lesson-btn">
Continue Grade 06 Lessons →
</a>
`;

if(premium.expires_at){

startCountdown(
premium.expires_at,
details
);

}else{

details.textContent =
"Your Grade 06 Premium access is active.";

}

}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(
expiresAt,
element
){

clearInterval(countdownTimer);

function update(){

const end =
new Date(expiresAt).getTime();

const now =
Date.now();

const remaining =
end-now;

if(remaining<=0){

clearInterval(countdownTimer);

element.textContent =
"Premium has expired.";

document.getElementById(
"premiumStatus"
).textContent =
"🔴 Premium Expired";

document.getElementById(
"premiumStatus"
).className =
"premium-status premium-expired";

document.getElementById(
"premiumActions"
).innerHTML = `
<button
class="pay-btn"
onclick="subscribe()">
Renew — LKR 999 / 30 Days
</button>
`;

return;
}

const days =
Math.floor(
remaining/(1000*60*60*24)
);

const hours =
Math.floor(
(remaining%(1000*60*60*24))/
(1000*60*60)
);

const minutes =
Math.floor(
(remaining%(1000*60*60))/
(1000*60)
);

const seconds =
Math.floor(
(remaining%(1000*60))/1000
);

element.textContent =
"Access expires in "+
days+"d "+
hours+"h "+
minutes+"m "+
seconds+"s";

}

update();

countdownTimer =
setInterval(update,1000);

}


/* =========================
   FREE
========================= */

function showFreePremium(
status,
details,
actions
){

status.textContent =
"🔵 Premium Required";

status.className =
"premium-status premium-free";

details.textContent =
"Get Grade 06 Premium for LKR 999 / 30 Days.";

actions.innerHTML = `
<button
class="pay-btn"
onclick="subscribe()">
Pay LKR 999 / 30 Days
</button>
`;

}


/* =========================
   PAYHERE
========================= */

async function subscribe(){

const token =
localStorage.getItem("createlk_token");

if(!token){

location.href =
"/auth/login.html?redirect=/dashboard.html";

return;
}

const button =
document.querySelector(".pay-btn");

if(button){

button.disabled=true;
button.textContent="Preparing Payment...";

}

try{

const response =
await fetch(
PREMIUM_API+
"/premium/checkout?grade="+GRADE,
{

method:"GET",

headers:{
"Authorization":"Bearer "+token
}

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Unable to create payment"
);

}

if(data.checkout_url){

window.location.href =
data.checkout_url;

return;
}

throw new Error(
"Payment URL not received"
);

}catch(error){

console.error(error);

alert(
error.message ||
"Unable to start payment."
);

if(button){

button.disabled=false;
button.textContent=
"Pay LKR 999 / 30 Days";

}

}

}


/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"createlk_token"
);

localStorage.removeItem(
"createlk_customer"
);

location.href =
"/auth/login.html";

}


/* =========================
   START
========================= */

loadAccount();

</script>

</body>
</html>
