<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Grade 06 Premium | CreateLK Academy</title>

<link rel="icon" href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f6f8fc;color:#172033}
a{text-decoration:none}

header{background:#fff;border-bottom:1px solid #e8ebf2}
.header{max-width:1000px;margin:auto;min-height:68px;padding:8px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px}
.brand b{font-size:18px;color:#172554}
.home{padding:9px 15px;background:#eef2ff;color:#3730a3;border-radius:9px;font-size:13px;font-weight:bold}

main{max-width:1000px;margin:auto;padding:42px 20px 60px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(30px,5vw,44px);color:#172554;margin-bottom:8px}
.hero p{font-size:14px;color:#64748b}

.status-box{max-width:700px;margin:auto auto 32px;background:#fff;border:1px solid #e7ebf2;border-radius:17px;padding:21px;text-align:center;box-shadow:0 8px 25px #0f172a0d}
.status{font-size:18px;font-weight:bold;margin-bottom:7px}
.status-login,.status-error{color:#dc2626}
.status-active{color:#15803d}
.status-free{color:#2563eb}
.details{font-size:13px;color:#64748b;line-height:1.5}

button,.login,.subscribe{cursor:pointer;border:0;font-weight:bold;border-radius:9px}
.login,.subscribe{display:inline-block;margin-top:14px;padding:11px 21px;font-size:13px}
.login{background:#172554;color:white}
.subscribe{background:#2563eb;color:white}

.heading{text-align:center;margin-bottom:20px}
.heading h2{font-size:24px;color:#172554;margin-bottom:14px}
.languages{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.lang{padding:8px 14px;background:white;border:1px solid #dbe2ef;border-radius:9px;color:#475569;font-size:12px;font-weight:bold}
.lang.active{background:#172554;color:white;border-color:#172554}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:white;border:1px solid #e7ebf2;border-radius:16px;padding:20px 17px;box-shadow:0 7px 20px #0f172a0a}
.icon{font-size:27px;margin-bottom:10px}
.name{font-size:15px;font-weight:bold;color:#172554;line-height:1.4;margin-bottom:13px}
.open{font-size:12px;font-weight:bold;color:#3730a3}

footer{max-width:1000px;margin:auto;padding:25px 20px 35px;text-align:center;color:#64748b;font-size:12px}
.links{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:13px}

@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){
.header{padding:8px 14px}
.brand img{width:40px;height:40px}
.brand b{font-size:16px}
main{padding:32px 14px 50px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="header">

<a href="../index.html" class="brand">
<img src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png">
<b>CreateLK Academy</b>
</a>

<a href="../index.html" class="home">← Home</a>

</div>
</header>

<main>

<section class="hero">
<h1>Grade 06 Premium</h1>
<p>Complete Grade 06 learning resources</p>
</section>

<div class="status-box">

<div id="status" class="status status-free">
Checking login...
</div>

<div id="details" class="details">
Please wait.
</div>

<div id="action"></div>

</div>

<section>

<div class="heading">

<h2>Grade 06 Subjects</h2>

<div class="languages">

<button class="lang active" data-lang="en"
onclick="setLanguage('en')">English</button>

<button class="lang" data-lang="si"
onclick="setLanguage('si')">සිංහල</button>

<button class="lang" data-lang="ta"
onclick="setLanguage('ta')">தமிழ்</button>

</div>

</div>

<div id="subjects" class="grid"></div>

</section>

</main>

<footer>

<div class="links">
<a href="../pages/about.html">About</a>
<a href="../pages/contact.html">Contact</a>
<a href="../pages/terms-and-conditions.html">Terms</a>
<a href="../pages/privacy-policy.html">Privacy</a>
<a href="../pages/refund-policy.html">Refund</a>
<a href="../pages/payment-policy.html">Payment</a>
</div>

© 2026 CreateLK Academy

</footer>

<script>

const AUTH="https://createlk-auth-api.createlk.workers.dev";
const PREMIUM="https://createlk-premium-api.createlk.workers.dev";
const GRADE="06";

if(location.hostname==="www.createlk.com"){
location.replace(
"https://createlk.com"+
location.pathname+
location.search+
location.hash
);
}

const subjects=[
["📐","Mathematics","ගණිතය","கணிதம்"],
["🔬","Science","විද්‍යාව","விஞ்ஞானம்"],
["🔤","English Language","ඉංග්‍රීසි භාෂාව","ஆங்கில மொழி"],
["📖","Sinhala Language","සිංහල භාෂාව","சிங்கள மொழி"],
["📚","Tamil Language","දෙමළ භාෂාව","தமிழ் மொழி"],
["🌐","Second National Language","දෙවන ජාතික භාෂාව","இரண்டாம் தேசிய மொழி"],
["🏛️","History","ඉතිහාසය","வரலாறு"],
["🌍","Geography","භූගෝල විද්‍යාව","புவியியல்"],
["🤝","Civic Education","පුරවැසි අධ්‍යාපනය","குடியியல் கல்வி"],
["🕊️","Religion","ආගම","சமயம்"],
["❤️","Health & Physical Education","සෞඛ්‍ය හා ශාරීරික අධ්‍යාපනය","சுகாதாரம் மற்றும் உடற்கல்வி"],
["💻","ICT","තොරතුරු හා සන්නිවේදන තාක්ෂණය","தகவல் மற்றும் தொடர்பாடல் தொழில்நுட்பம்"],
["🎨","Aesthetic Education","සෞන්දර්ය අධ්‍යාපනය","அழகியல் கல்வி"],
["⚙️","Technology for Life","ජීවිතය සඳහා තාක්ෂණය","வாழ்க்கைக்கான தொழில்நுட்பம்"],
["💡","Entrepreneurship & Financial Literacy","ව්‍යවසායකත්ව හා මූල්‍ය සාක්ෂරතාව","தொழில் முனைவோர் සහ நிதியறிவு"]
];

let language="en";

const status=document.getElementById("status");
const details=document.getElementById("details");
const action=document.getElementById("action");

function render(){

const n={en:1,si:2,ta:3}[language];

document.getElementById("subjects").innerHTML=subjects.map((s,i)=>`
<div class="card">
<div class="icon">${s[0]}</div>
<div class="name">${s[n]}</div>
<a href="#" class="open"
onclick="openSubject(${i});return false">
Open Subject →
</a>
</div>
`).join("");

}

function setLanguage(l){

language=l;

document.querySelectorAll(".lang").forEach(b=>{
b.classList.toggle("active",b.dataset.lang===l);
});

render();

}

function loginRequired(){

status.textContent="🔴 Login Required";
status.className="status status-login";

details.textContent="Please log in to access Grade 06 Premium.";

action.innerHTML=`
<a class="login"
href="/auth/login.html?redirect=/grades/grade-06.html">
Login
</a>`;

}

function connectionError(){

status.textContent="⚠️ Connection Error";
status.className="status status-error";

details.textContent="Unable to verify your account.";

action.innerHTML=`
<button class="login" onclick="location.reload()">
Try Again
</button>`;

}

async function authenticate(){

const token=localStorage.getItem("createlk_token");

if(!token){
loginRequired();
return;
}

try{

const r=await fetch(AUTH+"/auth/me",{
method:"GET",
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
});

if(r.status===401){

localStorage.removeItem("createlk_token");
localStorage.removeItem("createlk_customer");

loginRequired();
return;

}

if(!r.ok)throw Error();

const data=await r.json();

const customer=data.customer||data.user||data;

localStorage.setItem(
"createlk_customer",
JSON.stringify(customer)
);

checkPremium(token);

}catch(e){

console.error(e);
connectionError();

}

}

async function checkPremium(token){

status.textContent="🔵 Checking Premium...";
status.className="status status-free";

details.textContent="Checking your Grade 06 Premium access.";

try{

const r=await fetch(
PREMIUM+"/premium/status?grade="+GRADE,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
});

if(r.status===401){
loginRequired();
return;
}

if(!r.ok)throw Error();

const data=await r.json();
const premium=data.premium||{};

if(data.success&&premium.active){

status.textContent="🟢 Premium Active";
status.className="status status-active";

details.textContent=
"Your Grade 06 Premium access is active.";

}else{

status.textContent="🔵 Premium Required";
status.className="status status-free";

details.textContent=
"Subscribe to access Grade 06 Premium learning resources.";

action.innerHTML=`
<button class="subscribe"
onclick="subscribe()">
Subscribe — LKR 999 / 30 Days
</button>`;

}

}catch(e){

console.error(e);
connectionError();

}

}

async function openSubject(i){

const token=localStorage.getItem("createlk_token");

if(!token){
loginRequired();
return;
}

try{

const r=await fetch(
PREMIUM+
"/content?grade="+GRADE+
"&subject="+encodeURIComponent(subjects[i][1])+
"&language="+language,
{
headers:{
Authorization:"Bearer "+token
}
});

if(r.status===401){
loginRequired();
return;
}

if(r.status===403){
alert("Premium subscription is required.");
return;
}

if(r.status===404){
alert("This subject content is not available yet.");
return;
}

if(!r.ok)throw Error();

const data=await r.json();

if(data.success&&data.product){

sessionStorage.setItem(
"createlk_subject",
JSON.stringify(data.product)
);

alert("Subject access confirmed.");

}else{

alert("Subject content is not available yet.");

}

}catch(e){

alert("Unable to load the subject.");

}

}

function subscribe(){

if(!localStorage.getItem("createlk_token")){

location.href=
"/auth/login.html?redirect=/grades/grade-06.html";

return;

}

alert("Payment checkout is not connected yet.");

}

render();
authenticate();

</script>

</body>
</html>
