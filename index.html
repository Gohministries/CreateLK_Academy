

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK.com</title>
<style>
:root{--bg:#0b1628;--p:#13233b;--g:#ffd166;--t:#f4f7fc;--m:#c1cee0;--b:#304561}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Arial}
header{position:sticky;top:0;z-index:5;background:#0a1527;border-bottom:1px solid var(--b)}
nav,main{max-width:950px;margin:auto}
nav{display:flex;align-items:center;gap:7px;padding:7px}
button{border:0;border-radius:5px;padding:9px 11px;background:var(--g);color:#101b2c;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#172a45;color:white;border:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:6px;margin-right:auto;color:white;text-decoration:none;font-weight:bold;font-size:19px}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.gold{color:var(--g)}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:38px;background:var(--p);padding:12px;min-width:160px;border-radius:6px;border:1px solid var(--b)}
.menu.show{display:grid;gap:12px}
.menu a{color:var(--g);text-decoration:none}
main{padding:6px}
.hero,.panel,.ad{background:var(--p);border:1px solid var(--b);border-radius:7px;margin-bottom:7px}
.hero,.panel{padding:10px}
.hero{text-align:center}
.hero h1{font-size:23px;margin:0}
.hero p{color:var(--m);margin:7px}
h3{margin:0 0 8px}
input,select{width:100%;padding:9px;background:#0c192c;color:white;border:1px solid var(--b);border-radius:5px;font:15px Arial}
.search,.filters{display:flex;gap:6px;margin-bottom:6px}
.search input{flex:1;min-width:0}
.filters>*{min-width:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.ad{overflow:hidden;text-align:center;margin:0}
.ad img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.content{padding:8px;overflow-wrap:anywhere}
.title{display:block;font-size:15px;margin-bottom:7px}
.card-buttons{display:flex;gap:5px}
.card-buttons button{flex:1;min-width:0;padding:9px 4px;font-size:12px}
.status{color:var(--m);font-size:13px;margin:7px 0}
.popup{display:none;position:fixed;inset:0;z-index:10;background:#000c;align-items:center;justify-content:center;padding:8px}
.popup.show{display:flex}
.box{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px}
.box h2{text-align:center;margin:0 25px 12px;font-size:20px}
.close{position:absolute;right:5px;top:5px;background:#172a45;color:white}
.detail-img{width:100%;max-height:300px;object-fit:contain}
.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.detail-text a{color:#69b7ff;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;margin:9px 0}
.contact{flex:1;text-align:center;padding:10px 5px;border-radius:5px;text-decoration:none;font-weight:bold;color:#101b2c}
.call{background:var(--g)}
.wa{background:#25d366;color:#082414}
footer{text-align:center;padding:12px;color:var(--m);font-size:12px}
[hidden]{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:350px){.grid{grid-template-columns:1fr}.brand{font-size:16px}}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/Createlk.com/file_000000005fe4821193c9d67f48b23b64.png" alt="CreateLK.com">
<span>CreateLK<span class="gold">.com</span></span>
</a>
<button id="login">Sign in</button>
<img id="avatar" width="30" height="30" hidden style="border-radius:50%;object-fit:cover" alt="Profile">
<div class="menu-wrap">
<button class="secondary" id="menuBtn">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#recent">Recent Posts</a>
<a href="/create/ads.html">My Ads</a>
<a href="/create/terms.html">Terms &amp; Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy &amp; Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Find what you need.</p>
<button id="postBtn">＋ Post a Free Ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<form id="searchForm" class="search">
<input id="q" type="search" placeholder="Search products, vehicles, phones...">
<button>Search</button>
</form>
<div class="filters">
<select id="category"><option value="">All categories</option></select>
<select id="district"><option value="">All districts</option></select>
</div>
<div id="browseStatus" class="status"></div>
</section>

<div id="results" class="grid"></div>
<p style="text-align:center"><button id="more" class="secondary" hidden>Load more</button></p>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<p style="text-align:center"><button id="moreRecent" class="secondary" hidden>Load more</button></p>
</section>
</main>

<footer>© <span id="year"></span> CreateLK.com</footer>

<div id="detailPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeDetail">✕</button>
<h2 id="detailTitle">Ad Details</h2>
<div id="detailBody"></div>
</div>
</div>

<script>
"use strict";

const API="https://create-public.createlk.workers.dev";
const $=id=>document.getElementById(id);

let token=sessionStorage.getItem("apebazar_token")||"";
let user={};
let browseAds=[],recentAds=[];
let bo=0,ro=0,timer;
const PAGE=12,RECENT_PAGE=6;

$("year").textContent=new Date().getFullYear();

async function api(path,opt={}){
 const headers=new Headers(opt.headers||{});
 if(token)headers.set("Authorization","Bearer "+token);

 const options={...opt,headers};
 if(opt.body&&typeof opt.body!=="string"&&!(opt.body instanceof FormData)){
  headers.set("Content-Type","application/json");
  options.body=JSON.stringify(opt.body);
 }

 let response;
 try{
  response=await fetch(API+path,options);
 }catch{
  throw Error("Cannot connect to the API. Check Worker availability and CORS settings for createlk.com.");
 }

 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||data.message||"Request failed ("+response.status+")");
 return data;
}

function say(id,text){$(id).textContent=text}

function rows(data){
 if(Array.isArray(data))return data;
 for(const key of ["listings","ads","results","data","items","categories","districts","locations","cities"]){
  if(Array.isArray(data?.[key]))return data[key];
 }
 return [];
}

function fill(id,data,label){
 const select=$(id);
 select.replaceChildren(new Option(label,""));
 rows(data).forEach(item=>{
  if(item.id!=null&&item.name!=null)select.add(new Option(item.name,item.id));
 });
}

function authUI(){
 $("login").hidden=!!token;
 $("avatar").hidden=!token||!user.picture;
 $("logout").hidden=!token;
 if(user.picture)$("avatar").src=user.picture;
}

/* Posting page remains unchanged */
$("login").onclick=()=>location.href="/create/post.html";
$("postBtn").onclick=()=>location.href="/create/post.html";

function closePop(){
 document.querySelectorAll(".popup").forEach(p=>p.classList.remove("show"));
}
$("closeDetail").onclick=closePop;
$("detailPopup").onclick=e=>{if(e.target===$("detailPopup"))closePop()};
document.onkeydown=e=>{if(e.key==="Escape")closePop()};

$("menuBtn").onclick=e=>{
 e.stopPropagation();
 $("menu").classList.toggle("show");
};
document.onclick=e=>{
 if(!e.target.closest(".menu-wrap"))$("menu").classList.remove("show");
};

$("logout").onclick=e=>{
 e.preventDefault();
 token="";
 user={};
 sessionStorage.removeItem("apebazar_token");
 authUI();
};

async function options(){
 try{
  const [categories,locations]=await Promise.all([
   api("/api/categories"),api("/api/locations")
  ]);
  fill("category",categories,"All categories");
  fill("district",locations,"All districts");
 }catch(e){
  say("browseStatus","Could not load filters: "+e.message);
 }
}

function safeURL(value){
 try{
  const url=new URL(value,location.href);
  return ["https:","http:"].includes(url.protocol)?url.href:"";
 }catch{return ""}
}

function imageURL(ad){
 const value=ad.image_url||ad.photo_url||(Array.isArray(ad.photos)?ad.photos[0]:"");
 return safeURL(value);
}

function wa(value){
 let number=String(value||"").replace(/\D/g,"");
 if(number.startsWith("00"))number=number.slice(2);
 if(number.startsWith("94"))return number;
 if(number.startsWith("0"))return "94"+number.slice(1);
 return number.length===9?"94"+number:number;
}

function shareURL(ad){
 return ad.id==null?location.href:
  new URL("/create/ads.html?id="+encodeURIComponent(ad.id),location.origin).href;
}

async function copyLink(ad){
 const link=shareURL(ad);
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(link);
   alert("Ad link copied!");
  }else window.prompt("Copy this ad link:",link);
 }catch{window.prompt("Copy this ad link:",link)}
}

function detail(ad){
 $("detailTitle").textContent=ad.title||"Ad Details";
 const body=$("detailBody");
 body.replaceChildren();

 const photo=imageURL(ad);
 if(photo){
  const image=document.createElement("img");
  image.className="detail-img";
  image.src=photo;
  image.alt=ad.title||"Ad photo";
  body.append(image);
 }

 const add=(key,value)=>{
  if(value==null||value==="")return;
  const p=document.createElement("p");
  p.className="detail-text";
  const bold=document.createElement("b");
  bold.textContent=key+": ";
  p.append(bold);

  if(key!=="Description"){
   p.append(document.createTextNode(String(value)));
  }else{
   const text=String(value),regex=/https?:\/\/[^\s<>"']+/gi;
   let last=0,match;
   while((match=regex.exec(text))!==null){
    p.append(document.createTextNode(text.slice(last,match.index)));
    let raw=match[0],tail="";
    while(/[.,!?;:)\]]$/.test(raw)){
     tail=raw.slice(-1)+tail;
     raw=raw.slice(0,-1);
    }
    const url=safeURL(raw);
    if(url){
     const a=document.createElement("a");
     a.href=url;
     a.textContent=raw;
     a.target="_blank";
     a.rel="noopener noreferrer";
     p.append(a);
    }else p.append(document.createTextNode(raw));
    p.append(document.createTextNode(tail));
    last=match.index+match[0].length;
   }
   p.append(document.createTextNode(text.slice(last)));
  }
  body.append(p);
 };

 const types={product:"Product for Sale",service:"Service / Business",job:"Job Vacancy",website:"Website Promotion",other:"Others"};
 add("Type",types[ad.ad_type]||ad.ad_type);

 if(ad.ad_type==="job"){
  add("Salary",ad.salary_lkr==null?"":"LKR "+Number(ad.salary_lkr).toLocaleString("en-LK"));
 }else{
  add("Price",ad.price_lkr==null?"":"LKR "+Number(ad.price_lkr).toLocaleString("en-LK"));
 }

 add("Description",ad.description);
 add("Category",ad.category||ad.category_name);
 add("District",ad.district||ad.district_name);
 add("City",ad.city||ad.city_name);
 if(ad.ad_type==="product")add("Condition",ad.condition);
 add("Seller",ad.seller_name);

 if(ad.seller_phone){
  const actions=document.createElement("div");
  actions.className="actions";

  const call=document.createElement("a");
  call.className="contact call";
  call.href="tel:"+String(ad.seller_phone).replace(/[^\d+]/g,"");
  call.textContent="Call";

  const whatsapp=document.createElement("a");
  whatsapp.className="contact wa";
  whatsapp.href="https://wa.me/"+encodeURIComponent(wa(ad.seller_phone));
  whatsapp.target="_blank";
  whatsapp.rel="noopener noreferrer";
  whatsapp.textContent="WhatsApp";

  actions.append(call,whatsapp);
  body.append(actions);
 }

 const website=safeURL(ad.website_url);
 if(website){
  const link=document.createElement("a");
  link.href=website;
  link.target="_blank";
  link.rel="noopener noreferrer";
  link.className="contact call";
  link.style.display="block";
  link.textContent="Visit Website";
  body.append(link);
 }

 const copy=document.createElement("button");
 copy.className="secondary";
 copy.style.cssText="width:100%;margin-top:8px";
 copy.textContent="🔗 Copy Ad Link";
 copy.onclick=()=>copyLink(ad);
 body.append(copy);

 $("detailPopup").classList.add("show");
}

function card(ad){
 const article=document.createElement("article");
 article.className="ad";
 const photo=imageURL(ad);

 if(photo){
  const img=document.createElement("img");
  img.src=photo;
  img.alt=ad.title||"Ad photo";
  img.loading="lazy";
  img.onerror=()=>img.remove();
  article.append(img);
 }

 const content=document.createElement("div");
 content.className="content";

 const title=document.createElement("b");
 title.className="title";
 title.textContent=ad.title||"Untitled ad";

 const buttons=document.createElement("div");
 buttons.className="card-buttons";

 const view=document.createElement("button");
 view.textContent="View Post";
 view.onclick=()=>detail(ad);

 const copy=document.createElement("button");
 copy.className="secondary";
 copy.textContent="Copy Link";
 copy.onclick=()=>copyLink(ad);

 buttons.append(view,copy);
 content.append(title,buttons);
 article.append(content);
 return article;
}

function listingsURL(){
 const params=new URLSearchParams();
 if($("q").value.trim())params.set("search",$("q").value.trim());
 if($("category").value)params.set("category",$("category").value);
 if($("district").value)params.set("location",$("district").value);
 return "/api/listings"+(params.size?"?"+params.toString():"");
}

$("searchForm").onsubmit=e=>{
 e.preventDefault();
 loadBrowse();
};
$("category").onchange=loadBrowse;
$("district").onchange=loadBrowse;
$("q").oninput=()=>{
 clearTimeout(timer);
 timer=setTimeout(loadBrowse,350);
};

async function loadBrowse(){
 say("browseStatus","Loading ads...");
 $("more").hidden=true;
 try{
  browseAds=rows(await api(listingsURL()));
  bo=0;
  $("results").replaceChildren();
  renderBrowse();
 }catch(e){
  say("browseStatus","Could not load ads: "+e.message);
 }
}

function renderBrowse(){
 const batch=browseAds.slice(bo,bo+PAGE);
 batch.forEach(ad=>$("results").append(card(ad)));
 bo+=batch.length;
 $("more").hidden=bo>=browseAds.length;
 say("browseStatus",browseAds.length?browseAds.length+" ads found.":"No approved ads found.");
}
$("more").onclick=renderBrowse;

async function loadRecent(){
 say("recentStatus","Loading recent ads...");
 $("moreRecent").hidden=true;
 try{
  recentAds=rows(await api("/api/listings"));
  ro=0;
  $("recentResults").replaceChildren();
  renderRecent();
 }catch(e){
  say("recentStatus","Could not load recent ads: "+e.message);
 }
}

function renderRecent(){
 const batch=recentAds.slice(ro,ro+RECENT_PAGE);
 batch.forEach(ad=>$("recentResults").append(card(ad)));
 ro+=batch.length;
 $("moreRecent").hidden=ro>=recentAds.length;
 say("recentStatus",recentAds.length?"":"No approved ads available yet.");
}
$("moreRecent").onclick=renderRecent;

authUI();
options();
loadBrowse();
loadRecent();
</script>
</body>
</html>
