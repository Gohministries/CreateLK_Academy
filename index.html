

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK.com</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b1628;--p:#13233b;--g:#ffd166;--t:#f4f7fc;--m:#c1cee0;--b:#304561}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Arial}
header{position:sticky;top:0;background:#0a1527;border-bottom:1px solid var(--b);z-index:5}
nav,main{max-width:950px;margin:auto}
nav{display:flex;align-items:center;gap:7px;padding:7px}
button{border:0;border-radius:5px;padding:9px 11px;background:var(--g);color:#101b2c;font-weight:bold;cursor:pointer}
.secondary{background:#172a45;color:white;border:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:6px;margin-right:auto;color:white;text-decoration:none;font-weight:bold;font-size:19px}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.gold{color:var(--g)}
main{padding:6px}
.hero,.panel,.ad{background:var(--p);border:1px solid var(--b);border-radius:7px;margin-bottom:7px}
.hero,.panel{padding:10px}
.hero{text-align:center}
.hero h1{font-size:23px;margin:0}
.hero p,.status{color:var(--m)}
h3{margin:0 0 8px}
input,select,textarea{width:100%;padding:9px;background:#0c192c;color:white;border:1px solid var(--b);border-radius:5px;font:15px Arial}
textarea{min-height:85px}
.search,.filters{display:flex;gap:6px;margin-bottom:6px}
.search input,.filters>*{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.ad{overflow:hidden;text-align:center}
.ad img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.content{padding:8px;overflow-wrap:anywhere}
.title{display:block;margin-bottom:7px}
.card-buttons{display:flex;gap:5px}
.card-buttons button{flex:1;padding:8px 3px;font-size:12px}
.status{font-size:13px;margin:7px 0;overflow-wrap:anywhere}
.popup{display:none;position:fixed;inset:0;z-index:10;background:#000c;align-items:center;justify-content:center;padding:8px}
.popup.show{display:flex}
.box{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px}
.box h2{text-align:center;margin:0 25px 12px;font-size:20px}
.close{position:absolute;right:5px;top:5px;background:#172a45;color:white}
.field{margin-bottom:9px}
.field label{display:block;color:var(--m);font-size:13px;margin-bottom:4px}
.full{width:100%}
.detail-img{width:100%;max-height:280px;object-fit:contain}
.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.actions{display:flex;gap:6px;margin:9px 0}
.contact{flex:1;text-align:center;padding:10px 5px;border-radius:5px;text-decoration:none;font-weight:bold;color:#101b2c}
.call{background:var(--g)}
.wa{background:#25d366}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:38px;background:var(--p);padding:12px;min-width:160px;border:1px solid var(--b);border-radius:6px}
.menu.show{display:grid;gap:12px}
.menu a{color:var(--g);text-decoration:none}
footer{text-align:center;padding:12px;color:var(--m);font-size:12px}
[hidden]{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:350px){.grid{grid-template-columns:1fr}.brand{font-size:16px}}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/Createlk.com/file_000000005fe4821193c9d67f48b23b64.png" alt="CreateLK">
<span>CreateLK<span class="gold">.com</span></span>
</a>
<button id="login">Sign in</button>
<img id="avatar" width="30" height="30" hidden alt="Profile" style="border-radius:50%">
<div class="menu-wrap">
<button class="secondary" id="menuBtn">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#recent">Recent Posts</a>
<a href="/create/ads.html">My Ads</a>
<a href="/create/terms.html">Terms &amp; Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy &amp; Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Find what you need.</p>
<button id="postBtn">＋ Post a Free Ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<form id="searchForm" class="search">
<input id="q" type="search" placeholder="Search products, vehicles, phones...">
<button>Search</button>
</form>
<div class="filters">
<select id="category"><option value="">All categories</option></select>
<select id="district"><option value="">All districts</option></select>
</div>
<div id="browseStatus" class="status"></div>
</section>

<div id="results" class="grid"></div>
<p style="text-align:center"><button id="more" class="secondary" hidden>Load more</button></p>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<p style="text-align:center"><button id="moreRecent" class="secondary" hidden>Load more</button></p>
</section>
</main>

<footer>© <span id="year"></span> CreateLK.com</footer>

<div id="authPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeAuth">✕</button>
<h2><span class="gold">CreateLK.com</span></h2>
<div id="signInView">
<p style="text-align:center">Sign in with Google to post an ad.</p>
<div id="googleButton" style="display:flex;justify-content:center;min-height:45px"></div>
<div id="googleStatus" class="status"></div>
</div>

<div id="postView" hidden>
<p id="signedInAs" class="status"></p>
<form id="postForm">
<div class="field"><label>Ad title *</label><input id="title" required maxlength="120" placeholder="Enter ad title"></div>
<div class="field"><label>Ad type</label>
<select id="type">
<option value="product">Product for Sale</option>
<option value="service">Service / Business</option>
<option value="job">Job Vacancy</option>
<option value="website">Website Promotion</option>
<option value="other">Others</option>
</select></div>
<div class="field"><label>Category</label><select id="adCategory"><option value="">Select category</option></select></div>
<div class="field"><label id="priceLabel">Price (LKR)</label><input id="price" type="number" min="0" placeholder="Price"></div>
<div class="field" id="conditionField"><label>Condition</label><select id="condition"><option value="">Not specified</option><option>New</option><option>Used</option></select></div>
<div class="field"><label>Description *</label><textarea id="description" required maxlength="5000" placeholder="Describe your ad"></textarea></div>
<div class="field"><label>District</label><select id="adDistrict"><option value="">Select district</option></select></div>
<div class="field"><label>City / Town</label><input id="city" maxlength="100" placeholder="City or town"></div>
<div class="field"><label>Contact name *</label><input id="seller" required maxlength="100"></div>
<div class="field"><label>Phone number *</label><input id="phone" type="tel" required maxlength="25"></div>
<div class="field"><label>Website URL (optional)</label><input id="website" type="url" placeholder="https://example.com"></div>
<button class="full" id="submitAd">Submit Ad for Approval</button>
<div id="postStatus" class="status"></div>
</form>
</div>
</div>
</div>

<div id="detailPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeDetail">✕</button>
<h2 id="detailTitle">Ad Details</h2>
<div id="detailBody"></div>
</div>
</div>

<script>
"use strict";
const API="https://create-public.createlk.workers.dev";
const CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem("apebazar_token")||"",user={};
let browseAds=[],recentAds=[],bo=0,ro=0,timer;

$("year").textContent=new Date().getFullYear();

async function api(path,opt={}){
 const headers=new Headers(opt.headers||{});
 if(token)headers.set("Authorization","Bearer "+token);
 const options={...opt,headers};
 if(opt.body&&typeof opt.body!=="string"){
  headers.set("Content-Type","application/json");
  options.body=JSON.stringify(opt.body);
 }
 let res;
 try{res=await fetch(API+path,options)}
 catch{throw Error("Cannot connect to API. Check Worker and CORS settings.")}
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw Error(data.error||data.message||"Request failed: "+res.status);
 return data;
}

function rows(d){
 if(Array.isArray(d))return d;
 for(const k of ["listings","ads","results","data","items","categories","districts","locations"])
  if(Array.isArray(d?.[k]))return d[k];
 return [];
}
function say(id,s){$(id).textContent=s}
function fill(id,data,label){
 $(id).replaceChildren(new Option(label,""));
 rows(data).forEach(x=>{if(x.id!=null&&x.name!=null)$(id).add(new Option(x.name,x.id))});
}
function authUI(){
 $("login").hidden=!!token;
 $("avatar").hidden=!token||!user.picture;
 $("logout").hidden=!token;
 if(user.picture)$("avatar").src=user.picture;
}
function show(id){closePop();$(id).classList.add("show");document.body.style.overflow="hidden"}
function closePop(){
 document.querySelectorAll(".popup").forEach(x=>x.classList.remove("show"));
 document.body.style.overflow="";
}
$("closeAuth").onclick=$("closeDetail").onclick=closePop;
$("authPopup").onclick=e=>{if(e.target===$("authPopup"))closePop()};
$("detailPopup").onclick=e=>{if(e.target===$("detailPopup"))closePop()};
document.onkeydown=e=>{if(e.key==="Escape")closePop()};

$("menuBtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("show")};
document.onclick=e=>{if(!e.target.closest(".menu-wrap"))$("menu").classList.remove("show")};
$("logout").onclick=e=>{
 e.preventDefault();token="";user={};
 sessionStorage.removeItem("apebazar_token");authUI();closePop();
};

function openLogin(){
 $("signInView").hidden=false;
 $("postView").hidden=true;
 say("googleStatus","");
 show("authPopup");
 googleButton();
}
function openPost(){
 if(!token){openLogin();say("googleStatus","Sign in with Google to post your ad.");return}
 $("signInView").hidden=true;
 $("postView").hidden=false;
 say("signedInAs",user.email||"You are signed in.");
 say("postStatus","");
 show("authPopup");
}
$("login").onclick=openLogin;
$("postBtn").onclick=openPost;

function googleButton(){
 const target=$("googleButton");
 target.replaceChildren();
 if(!window.google?.accounts?.id){
  say("googleStatus","Google Sign-In is loading. Please try again.");
  return;
 }
 try{
  google.accounts.id.initialize({
   client_id:CLIENT_ID,
   callback:async response=>{
    say("googleStatus","Signing in...");
    try{
     const d=await api("/api/auth/google",{
      method:"POST",
      body:{credential:response.credential}
     });

     token=d.token||d.access_token||"";
     if(!token)throw Error("No session token returned.");

     sessionStorage.setItem("apebazar_token",token);

     let p={};
     try{
      let part=response.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
      part+="=".repeat((4-part.length%4)%4);
      p=JSON.parse(atob(part));
     }catch{}

     user={
      ...(d.user||{}),
      name:d.user?.name||p.name||"",
      email:d.user?.email||p.email||"",
      picture:d.user?.picture||p.picture||""
     };

     authUI();

     // FIX: close login popup; do not open post form.
     closePop();

    }catch(e){
     say("googleStatus",e.message);
    }
   }
  });

  google.accounts.id.renderButton(target,{
   theme:"filled_black",
   size:"large",
   text:"signin_with",
   shape:"rectangular",
   width:260
  });
 }catch(e){say("googleStatus",e.message)}
}

async function loadOptions(){
 try{
  const [c,d]=await Promise.all([
   api("/api/categories"),
   api("/api/locations")
  ]);
  fill("category",c,"All categories");
  fill("adCategory",c,"Select category");
  fill("district",d,"All districts");
  fill("adDistrict",d,"Select district");
 }catch(e){say("browseStatus","Filters: "+e.message)}
}

function safeURL(v){
 try{
  const u=new URL(v,location.href);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch{return ""}
}
function photo(a){
 return safeURL(a.image_url||a.photo_url||(Array.isArray(a.photos)?a.photos[0]:""));
}
function linkFor(a){
 return a.id==null?location.href:new URL("/create/ads.html?id="+encodeURIComponent(a.id),location.origin).href;
}
async function copyLink(a){
 const s=linkFor(a);
 try{await navigator.clipboard.writeText(s);alert("Ad link copied!")}
 catch{prompt("Copy ad link:",s)}
}
function addText(parent,label,value){
 if(value==null||value==="")return;
 const p=document.createElement("p");
 p.className="detail-text";
 const b=document.createElement("b");
 b.textContent=label+": ";
 p.append(b,document.createTextNode(String(value)));
 parent.append(p);
}
function detail(a){
 $("detailTitle").textContent=a.title||"Ad Details";
 const b=$("detailBody");
 b.replaceChildren();
 if(photo(a)){
  const img=document.createElement("img");
  img.className="detail-img";img.src=photo(a);img.alt=a.title||"Ad";b.append(img);
 }
 const types={product:"Product for Sale",service:"Service / Business",job:"Job Vacancy",website:"Website Promotion",other:"Others"};
 addText(b,"Type",types[a.ad_type]||a.ad_type);
 const price=a.ad_type==="job"?a.salary_lkr:a.price_lkr;
 if(price!=null)addText(b,a.ad_type==="job"?"Salary":"Price","LKR "+Number(price).toLocaleString("en-LK"));
 addText(b,"Description",a.description);
 addText(b,"Category",a.category_name||a.category);
 addText(b,"District",a.district_name||a.district);
 addText(b,"City",a.city_name||a.city);
 addText(b,"Seller",a.seller_name);
 if(a.seller_phone){
  const row=document.createElement("div");row.className="actions";
  const call=document.createElement("a");
  call.className="contact call";call.href="tel:"+a.seller_phone;call.textContent="Call";
  const wa=document.createElement("a");wa.className="contact wa";
  let n=String(a.seller_phone).replace(/\D/g,"");
  if(n.startsWith("0"))n="94"+n.slice(1);
  wa.href="https://wa.me/"+n;wa.target="_blank";wa.rel="noopener noreferrer";wa.textContent="WhatsApp";
  row.append(call,wa);b.append(row);
 }
 const website=safeURL(a.website_url);
 if(website){
  const x=document.createElement("a");x.href=website;x.target="_blank";
  x.rel="noopener noreferrer";x.textContent="Visit Website";b.append(x);
 }
 const copy=document.createElement("button");
 copy.className="full secondary";copy.style.marginTop="10px";
 copy.textContent="Copy Ad Link";copy.onclick=()=>copyLink(a);b.append(copy);
 show("detailPopup");
}
function card(a){
 const article=document.createElement("article");article.className="ad";
 if(photo(a)){
  const img=document.createElement("img");img.src=photo(a);img.alt=a.title||"Ad";
  img.loading="lazy";img.onerror=()=>img.remove();article.append(img);
 }
 const content=document.createElement("div");content.className="content";
 const title=document.createElement("b");title.className="title";title.textContent=a.title||"Untitled ad";
 const row=document.createElement("div");row.className="card-buttons";
 const view=document.createElement("button");view.textContent="View Post";view.onclick=()=>detail(a);
 const copy=document.createElement("button");copy.className="secondary";copy.textContent="Copy Link";copy.onclick=()=>copyLink(a);
 row.append(view,copy);content.append(title,row);article.append(content);return article;
}
function listURL(){
 const p=new URLSearchParams();
 if($("q").value.trim())p.set("search",$("q").value.trim());
 if($("category").value)p.set("category",$("category").value);
 if($("district").value)p.set("location",$("district").value);
 return "/api/listings"+(p.size?"?"+p:"");
}
$("searchForm").onsubmit=e=>{e.preventDefault();loadBrowse()};
$("category").onchange=$("district").onchange=loadBrowse;
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(loadBrowse,300)};

async function loadBrowse(){
 say("browseStatus","Loading ads...");
 $("more").hidden=true;
 try{
  browseAds=rows(await api(listURL()));
  bo=0;$("results").replaceChildren();renderBrowse();
 }catch(e){say("browseStatus","Could not load ads: "+e.message)}
}
function renderBrowse(){
 browseAds.slice(bo,bo+12).forEach(a=>$("results").append(card(a)));
 bo+=12;$("more").hidden=bo>=browseAds.length;
 say("browseStatus",browseAds.length?browseAds.length+" ads found.":"No approved ads found.");
}
$("more").onclick=renderBrowse;

async function loadRecent(){
 say("recentStatus","Loading ads...");
 $("moreRecent").hidden=true;
 try{
  recentAds=rows(await api("/api/listings"));
  ro=0;$("recentResults").replaceChildren();renderRecent();
 }catch(e){say("recentStatus","Could not load recent ads: "+e.message)}
}
function renderRecent(){
 recentAds.slice(ro,ro+6).forEach(a=>$("recentResults").append(card(a)));
 ro+=6;$("moreRecent").hidden=ro>=recentAds.length;
 say("recentStatus",recentAds.length?"":"No approved ads available yet.");
}
$("moreRecent").onclick=renderRecent;

$("type").onchange=()=>{
 const job=$("type").value==="job";
 $("priceLabel").textContent=job?"Salary (LKR)":"Price (LKR)";
 $("conditionField").hidden=$("type").value!=="product";
};

$("postForm").onsubmit=async e=>{
 e.preventDefault();
 const button=$("submitAd");
 button.disabled=true;button.textContent="Submitting...";
 say("postStatus","Submitting ad...");
 try{
  const type=$("type").value,price=$("price").value,website=$("website").value.trim();
  if(website&&!safeURL(website))throw Error("Enter a valid website URL.");
  const payload={
   title:$("title").value.trim(),
   ad_type:type,
   category_id:$("adCategory").value||null,
   price_lkr:type!=="job"&&price!==""?Number(price):null,
   salary_lkr:type==="job"&&price!==""?Number(price):null,
   condition:type==="product"?$("condition").value||null:null,
   description:$("description").value.trim(),
   district_id:$("adDistrict").value||null,
   city:$("city").value.trim(),
   seller_name:$("seller").value.trim(),
   seller_phone:$("phone").value.trim(),
   website_url:website||null
  };
  const result=await api("/api/ads",{method:"POST",body:payload});
  if(result.success===false)throw Error(result.message||"Ad submission failed.");
  say("postStatus",result.message||"Ad submitted for approval.");
  $("postForm").reset();
  $("type").dispatchEvent(new Event("change"));
  await loadBrowse();await loadRecent();
 }catch(e){say("postStatus","Could not submit: "+e.message)}
 finally{button.disabled=false;button.textContent="Submit Ad for Approval"}
};

$("type").dispatchEvent(new Event("change"));
authUI();
loadOptions();
loadBrowse();
loadRecent();
</script>
</body>
</html>
