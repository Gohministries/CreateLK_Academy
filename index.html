<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>
<meta name="description" content="Shop online in Sri Lanka with CreateLK Shop."><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f7f8fb;
color:#222
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
position:sticky;

background:#102a56;
color:#fff;

}

.top{
max-width:1200px;
margin:0 0 0 auto;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:flex-end;
gap:15px
}

.logo{
font-size:21px;
font-weight:800;
white-space:nowrap
}

.logo span{color:#d69b16}

.search{
flex:1;
max-width:500px
}

.search input{
width:100%;
border:0;
outline:0;
border-radius:25px;
padding:12px 17px;
background:#fff;
color:#222
}

.cart-btn{
border:0;
background:#fff;
color:#102a56;
border-radius:25px;
padding:11px 17px;
font-weight:700;
white-space:nowrap;
box-shadow:0 2px 6px rgba(0,0,0,.15)
}

.hero{
background:linear-gradient(135deg,#102a56,#173c78);
color:#fff;
padding:42px 18px;
text-align:center
}

.hero h1{
margin:0 0 8px;
font-size:32px
}

.hero p{
margin:0;
opacity:.9
}

main{
max-width:1200px;
margin:auto;
padding:22px 16px 80px
}

.section-title{

margin:5px 0 14px;

}

.category-select{
width:100%;

padding:13px 15px;
border:1px solid #ddd;

font-weight:600;
outline:none;
margin-bottom:15px
}

.category-select:focus{
border-color:#102a56
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);

}

.product{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 3px 15px rgba(0,0,0,.07);
display:flex;
flex-direction:column
}

.product-image{
width:100%;

background:#eee;
object-fit:cover
}

.product-body{
padding:14px;
display:flex;
flex-direction:column;

}

.product-category{
font-size:12px;
color:#777;
margin-bottom:5px
}

.product-name{
font-size:16px;
font-weight:700;
color:#102a56;
margin-bottom:8px
}

.price{
font-size:18px;
font-weight:800;
color:#102a56
}

.old-price{
font-size:13px;
color:#999;

margin-left:6px
}

.stock{
font-size:12px;
margin:8px 0;
color:#16803c
}

.stock.out{color:#c62828}

.add-btn{
margin-top:auto;
width:100%;
border:0;
border-radius:9px;
padding:11px;
background:#d69b16;
color:#fff;
font-weight:700
}

.add-btn:disabled{

}

.message{
text-align:center;
padding:35px 15px;
color:#777;

}

/* CART */

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:2000;
align-items:flex-end;
justify-content:center
}

.overlay.show{display:flex}

.cart-box{
background:#fff;
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
border-radius:18px 18px 0 0;
padding:20px
}

.cart-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.cart-head h2{
margin:0;
color:#102a56
}

.close{
border:0;
background:#eee;
width:36px;
height:36px;
border-radius:50%;
font-size:20px
}

.cart-item{
display:flex;
gap:12px;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee
}

.cart-item img{
width:65px;
height:65px;
object-fit:cover;
border-radius:8px;
background:#eee
}

.cart-info{flex:1}

.cart-name{
font-weight:700;
color:#102a56
}

.cart-price{
font-size:14px;
margin-top:4px
}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:5px
}

.qty button{
width:30px;
height:30px;
border:0;
border-radius:7px;
background:#eee;
font-weight:700
}

.remove{
border:0;
background:none;
color:#c62828;
font-size:12px;
margin-top:5px;
padding:0
}

.cart-total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:800;
color:#102a56;
padding:18px 0
}

.delivery-row{
display:flex;
justify-content:space-between;
padding:10px 0;
font-size:15px;
color:#555
}

.checkout{
margin-top:10px
}

.checkout h3{
color:#102a56
}

.field{
margin-bottom:12px
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:5px
}

.field input,
.field textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
outline:0
}

.field textarea{
min-height:90px;
resize:vertical
}

.order-btn{
width:100%;
border:0;
border-radius:10px;
padding:13px;
background:#102a56;
color:#fff;
font-weight:700
}

.order-btn:disabled{
opacity:.6
}

.success{
display:none;
background:#e8f7ed;
color:#176b35;
padding:15px;
border-radius:10px;
margin-top:15px;
line-height:1.6
}

.success.show{
display:block
}

/* FOOTER */

footer{
background:#102a56;
color:#fff;
text-align:center;
padding:28px 15px 90px
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
margin-bottom:15px
}

.footer-links a{
color:#fff;
text-decoration:none;
font-size:14px
}

.copyright{
font-size:13px;
opacity:.75
}

/* WHATSAPP */

.wa-float{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
z-index:9999;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 14px rgba(0,0,0,.28);
text-decoration:none
}

.wa-float svg{
width:34px;
height:34px
}

@media(max-width:900px){
.products{
grid-template-columns:repeat(3,1fr)
}
}

@media(max-width:600px){

.top{
flex-wrap:wrap;
justify-content:flex-end
}

.logo{
width:auto
}

.search{
order:3;
flex-basis:100%;
max-width:none
}

.hero{
padding:32px 16px
}

.hero h1{
font-size:23px
}

.products{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.product-body{
padding:11px
}

.product-name{
font-size:14px
}

.price{
font-size:16px
}

.cart-box{
max-height:94vh
}
}

@media(max-width:380px){

.products{
grid-template-columns:1fr
}

.cart-btn{
padding:10px 13px
}
}
</style></head><body><!-- 🚚 DELIVERY CHARGE: CHANGE ONLY THIS NUMBER --><script>
const DELIVERY_CHARGE = 400;
</script><header><div class="top"><div class="logo">
CreateLK <span>Shop</span>
</div><div class="search"><input
id="searchInput"
type="search"
placeholder="Search products..."
autocomplete="off">

</div><button
class="cart-btn"
onclick="openCart()">

🛒 Cart (<span id="cartCount">0</span>)

</button></div></header><section class="hero"><h1>
Shop Online in Sri Lanka
</h1><p>
Discover products from CreateLK Shop.
</p></section><main><h2 class="section-title">
Categories
</h2><select
id="categorySelect"
class="category-select">

<option value="">
All Categories
</option></select><h2
class="section-title"
style="margin-top:25px">Products

</h2><div
id="products"
class="products"><div class="message">
Loading products...
</div></div></main><footer><div class="footer-links"><a href="/shop/terms.html">
Terms & Conditions
</a><a href="/shop/privacy.html">
Privacy Policy
</a><a href="/shop/refund.html">
Refund & Returns
</a></div><div class="copyright">
© 2026 CreateLK Shop. All rights reserved.
</div></footer><!-- CART --><div
id="cartOverlay"
class="overlay"
onclick="closeCartOutside(event)"><div class="cart-box"><div class="cart-head"><h2>
Your Cart
</h2><button
class="close"
onclick="closeCart()">

×

</button></div><div id="cartItems"></div><div class="delivery-row">
<span>Delivery</span>
<span id="deliveryCharge">LKR 400</span>
</div><div class="cart-total"><span>
Total
</span><span id="cartTotal">
LKR 400
</span></div><div class="checkout"><h3>
Delivery Information
</h3><div class="field"><label>
Full Name *
</label><input
id="customerName"
type="text"
placeholder="Enter your full name">

</div><div class="field"><label>
District *
</label><input
id="customerDistrict"
type="text"
placeholder="Enter your district">

</div><div class="field"><label>
City / Town *
</label><input
id="customerCity"
type="text"
placeholder="Enter your city or town">

</div><div class="field"><label>
Delivery Address *
</label><textarea
id="customerAddress"
placeholder="Enter your complete delivery address"></textarea></div><div class="field"><label>
Mobile Number 1 *
</label><input
id="customerMobile1"
type="tel"
placeholder="0771234567">

</div><div class="field"><label>
Mobile Number 2
</label><input
id="customerMobile2"
type="tel"
placeholder="Optional">

</div><button
id="orderBtn"
class="order-btn"
onclick="placeOrder()">

Place Order

</button><div
id="success"
class="success">
</div></div></div></div><!-- WHATSAPP --><a
class="wa-float"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="Chat on WhatsApp">

<svg viewBox="0 0 32 32"><path
fill="#fff"
d="M19.11 17.39c-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.13-.42-2.15-1.34-.79-.7-1.33-1.56-1.49-1.82-.16-.27-.02-.41.12-.54.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47h-.52c-.18 0-.48.07-.73.34-.25.27-.95.93-.95 2.27s.98 2.63 1.11 2.81c.14.18 1.92 2.93 4.65 4.11.65.28 1.16.45 1.56.57.66.21 1.26.18 1.73.11.53-.08 1.6-.65 1.83-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32z"/>

<path
fill="#fff"
d="M16.01 3C8.84 3 3 8.84 3 16c0 2.29.6 4.44 1.65 6.3L3 29l6.88-1.61A12.94 12.94 0 0 0 16.01 29C23.17 29 29 23.16 29 16S23.17 3 16.01 3zm0 23.7c-2.02 0-3.9-.59-5.49-1.61l-.39-.24-4.08.96.98-3.98-.26-.41A10.98 10.98 0 1 1 16.01 26.7z"/>

</svg></a><script>

const API="https://shop-api.createlk.workers.dev";

let products=[];
let selectedCategory="";
let cart=JSON.parse(
localStorage.getItem("createlk_cart")||"[]"
);

const productsEl=
document.getElementById("products");

const categorySelect=
document.getElementById("categorySelect");

const searchInput=
document.getElementById("searchInput");

const cartCount=
document.getElementById("cartCount");

function money(value){

return "LKR "+
Number(value||0)
.toLocaleString("en-LK");

}

function saveCart(){

localStorage.setItem(
"createlk_cart",
JSON.stringify(cart)
);

updateCartCount();

}

function updateCartCount(){

cartCount.textContent=
cart.reduce(
(sum,item)=>
sum+Number(item.quantity||0),
0
);

}

function imageUrl(key){

return key
?API+"/images/"+key
:"";

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

async function loadCategories(){

try{

const res=
await fetch(API+"/api/categories");

const data=
await res.json();

const categories=
data.categories||data||[];

categorySelect.innerHTML=
'<option value="">All Categories</option>';

categories.forEach(cat=>{

const option=
document.createElement("option");

option.value=cat.id;
option.textContent=cat.name;

categorySelect.appendChild(option);

});

}catch(e){

console.error(e);

}

}

categorySelect.addEventListener(
"change",
()=>{

selectedCategory=
categorySelect.value;

loadProducts();

});

async function loadProducts(){

productsEl.innerHTML=
'<div class="message">Loading products...</div>';

try{

const params=
new URLSearchParams();

if(selectedCategory){

params.set(
"category",
selectedCategory
);

}

if(searchInput.value.trim()){

params.set(
"search",
searchInput.value.trim()
);

}

const url=
API+"/api/products"+
(
params.toString()
?"?"+params.toString()
:""
);

const res=
await fetch(url);

const data=
await res.json();

products=
data.products||data||[];

renderProducts();

}catch(e){

console.error(e);

productsEl.innerHTML=
'<div class="message">Unable to load products.</div>';

}

}

function renderProducts(){

if(!products.length){

productsEl.innerHTML=
'<div class="message">No products found.</div>';

return;

}

productsEl.innerHTML="";

products.forEach(product=>{

const price=
product.sale_price!=null &&
Number(product.sale_price)>0
?Number(product.sale_price)
:Number(product.price);

const oldPrice=
product.sale_price!=null &&
Number(product.sale_price)>0
?Number(product.price)
:0;

const stock=
Number(product.stock||0);

const card=
document.createElement("div");

card.className="product";

card.innerHTML=`

${
product.image_key
?`
<img
class="product-image"
src="${imageUrl(product.image_key)}"
alt="${escapeHtml(product.name)}"
loading="lazy">
`
:`
<div class="product-image"></div>
`
}

<div class="product-body">

<div class="product-category">
${escapeHtml(product.category_name||"")}
</div>

<div class="product-name">
${escapeHtml(product.name)}
</div>

<div class="price">

${money(price)}

${
oldPrice
?`
<span class="old-price">
${money(oldPrice)}
</span>
`
:""
}

</div>

<div
class="stock ${stock<=0?"out":""}">

${
stock>0
?stock+" in stock"
:"Out of stock"
}

</div>

<button
class="add-btn"
${stock<=0?"disabled":""}
onclick="addToCart(${Number(product.id)})">

${stock>0?"Add to Cart":"Out of Stock"}

</button>

</div>
`;

productsEl.appendChild(card);

});

}

function addToCart(id){

const product=
products.find(
p=>Number(p.id)===Number(id)
);

if(!product)return;

const existing=
cart.find(
x=>Number(x.id)===Number(id)
);

if(existing){

if(
existing.quantity<
Number(product.stock)
){

existing.quantity++;

}

}else{

cart.push({

id:Number(product.id),

name:product.name,

price:
product.sale_price!=null &&
Number(product.sale_price)>0
?Number(product.sale_price)
:Number(product.price),

image_key:
product.image_key||"",

quantity:1,

stock:
Number(product.stock||0)

});

}

saveCart();

renderCart();

openCart();

}

function changeQty(id,change){

const item=
cart.find(
x=>Number(x.id)===Number(id)
);

if(!item)return;

item.quantity+=change;

if(item.quantity<=0){

cart=
cart.filter(
x=>Number(x.id)!==Number(id)
);

}else if(
item.quantity>item.stock
){

item.quantity=item.stock;

}

saveCart();

renderCart();

}

function removeItem(id){

cart=
cart.filter(
x=>Number(x.id)!==Number(id)
);

saveCart();

renderCart();

}

function renderCart(){

const el=
document.getElementById("cartItems");

const deliveryEl=
document.getElementById("deliveryCharge");

const totalEl=
document.getElementById("cartTotal");

if(!cart.length){

el.innerHTML=
'<div class="message">Your cart is empty.</div>';

deliveryEl.textContent=
money(DELIVERY_CHARGE);

totalEl.textContent=
money(DELIVERY_CHARGE);

return;

}

let subtotal=0;

el.innerHTML="";

cart.forEach(item=>{

const itemTotal=
Number(item.price)*
Number(item.quantity);

subtotal+=itemTotal;

const row=
document.createElement("div");

row.className="cart-item";

row.innerHTML=`

${
item.image_key
?`
<img
src="${imageUrl(item.image_key)}"
alt="${escapeHtml(item.name)}">
`
:`
<div
style="
width:65px;
height:65px;
background:#eee;
border-radius:8px">
</div>
`
}

<div class="cart-info">

<div class="cart-name">
${escapeHtml(item.name)}
</div>

<div class="cart-price">
${money(item.price)}
</div>

<div class="qty">

<button
onclick="changeQty(${item.id},-1)">
−
</button>

<strong>
${item.quantity}
</strong>

<button
onclick="changeQty(${item.id},1)">
+
</button>

</div>

<button
class="remove"
onclick="removeItem(${item.id})">

Remove

</button>

</div>

<strong>
${money(itemTotal)}
</strong>

`;

el.appendChild(row);

});

const total=
subtotal+DELIVERY_CHARGE;

deliveryEl.textContent=
money(DELIVERY_CHARGE);

totalEl.textContent=
money(total);

}

function openCart(){

renderCart();

document
.getElementById("cartOverlay")
.classList.add("show");

document.body.style.overflow="hidden";

}

function closeCart(){

document
.getElementById("cartOverlay")
.classList.remove("show");

document.body.style.overflow="";

}

function closeCartOutside(e){

if(
e.target===
e.currentTarget
){

closeCart();

}

}

async function placeOrder(){

if(!cart.length){

alert("Your cart is empty.");

return;

}

const name=
document
.getElementById("customerName")
.value.trim();

const district=
document
.getElementById("customerDistrict")
.value.trim();

const city=
document
.getElementById("customerCity")
.value.trim();

const address=
document
.getElementById("customerAddress")
.value.trim();

const mobile1=
document
.getElementById("customerMobile1")
.value.trim();

const mobile2=
document
.getElementById("customerMobile2")
.value.trim();

const orderBtn=
document.getElementById("orderBtn");

if(
!name||
!district||
!city||
!address||
!mobile1
){

alert(
"Please enter your name, district, city, address and mobile number."
);

return;

}

orderBtn.disabled=true;

orderBtn.textContent=
"Placing Order...";

try{

const res=
await fetch(
API+"/api/orders",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

customer:{

name:name,
district:district,
city:city,
address:address,
mobile_1:mobile1,
mobile_2:mobile2

},

items:

cart.map(item=>({

product_id:
Number(item.id),

quantity:
Number(item.quantity)

})),

delivery_charge:
DELIVERY_CHARGE

})

});

const data=
await res.json();

if(
!res.ok||
data.success===false
){

throw new Error(
data.message||
"Unable to place order."
);

}

const orderId=
data.order_id||
data.orderId||
data.id;

cart=[];

saveCart();

renderCart();

const success=
document.getElementById("success");

success.innerHTML=
`
<strong>
Order placed successfully!
</strong>
<br>
Your Order #${escapeHtml(orderId||"")}
has been received.
We will contact you regarding your order and delivery.
`;

success.classList.add("show");

document
.getElementById("customerName")
.value="";

document
.getElementById("customerDistrict")
.value="";

document
.getElementById("customerCity")
.value="";

document
.getElementById("customerAddress")
.value="";

document
.getElementById("customerMobile1")
.value="";

document
.getElementById("customerMobile2")
.value="";

}catch(e){

console.error(e);

alert(
e.message||
"Unable to place order. Please try again."
);

}finally{

orderBtn.disabled=false;

orderBtn.textContent=
"Place Order";

}

}

let searchTimer;

searchInput.addEventListener(
"input",
()=>{

clearTimeout(searchTimer);

searchTimer=
setTimeout(
loadProducts,
350
);

});

updateCartCount();
renderCart();
loadCategories();
loadProducts();

</script></body>
</html>
