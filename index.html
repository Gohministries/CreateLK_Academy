
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK.com</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b1628;--p:#13233b;--g:#ffd166;--t:#f4f7fc;--m:#c1cee0;--b:#304561}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Arial}
header{position:sticky;top:0;background:#0a1527;border-bottom:1px solid var(--b);z-index:5}
nav,main{max-width:950px;margin:auto}
nav{display:flex;align-items:center;gap:7px;padding:7px}
button{border:0;border-radius:5px;padding:9px 11px;background:var(--g);color:#101b2c;font-weight:bold;cursor:pointer}
.secondary{background:#172a45;color:white;border:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:6px;margin-right:auto;color:white;text-decoration:none;font-weight:bold;font-size:19px}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.gold{color:var(--g)}
#avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--g);cursor:pointer}
main{padding:6px}
.hero,.panel,.ad{background:var(--p);border:1px solid var(--b);border-radius:7px;margin-bottom:7px}
.hero,.panel{padding:10px}
.hero{text-align:center}
.hero h1{font-size:23px;margin:0}
.hero p,.status{color:var(--m)}
h3{margin:0 0 8px}
input,select{width:100%;padding:9px;background:#0c192c;color:white;border:1px solid var(--b);border-radius:5px;font:15px Arial}
.search,.filters{display:flex;gap:6px;margin-bottom:6px}
.search input,.filters>*{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.ad{overflow:hidden;text-align:center}
.ad img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.content{padding:8px;overflow-wrap:anywhere}
.title{display:block;margin-bottom:7px}
.card-buttons{display:flex;gap:5px}
.card-buttons button{flex:1;padding:8px 3px;font-size:12px}
.status{font-size:13px;margin:7px 0;overflow-wrap:anywhere}
.popup{display:none;position:fixed;inset:0;z-index:10;background:#000c;align-items:center;justify-content:center;padding:8px}
.popup.show{display:flex}
.box{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px}
.box h2{text-align:center;margin:0 25px 12px;font-size:20px}
.close{position:absolute;right:5px;top:5px;background:#172a45;color:white}
.detail-img{width:100%;max-height:280px;object-fit:contain}
.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.actions{display:flex;gap:6px;margin:9px 0}
.contact{flex:1;text-align:center;padding:10px 5px;border-radius:5px;text-decoration:none;font-weight:bold;color:#101b2c}
.call{background:var(--g)}
.wa{background:#25d366}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:38px;background:var(--p);padding:12px;min-width:160px;border:1px solid var(--b);border-radius:6px}
.menu.show{display:grid;gap:12px}
.menu a{color:var(--g);text-decoration:none}
footer{text-align:center;padding:12px;color:var(--m);font-size:12px}
[hidden]{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:350px){.grid{grid-template-columns:1fr}.brand{font-size:16px}}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/Createlk.com/file_000000005fe4821193c9d67f48b23b64.png" alt="CreateLK">
<span>CreateLK<span class="gold">.com</span></span>
</a>
<button id="login">Sign in</button>
<img id="avatar" alt="Google profile" hidden title="Your Google profile">
<div class="menu-wrap">
<button class="secondary" id="menuBtn">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#recent">Recent Posts</a>
<a href="/create/ads.html" id="myAds">My Ads / Post Ad</a>
<a href="/create/terms.html">Terms &amp; Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy &amp; Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Find what you need.</p>
<button id="postBtn">＋ Post a Free Ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<form id="searchForm" class="search">
<input id="q" type="search" placeholder="Search products, vehicles, phones...">
<button>Search</button>
</form>
<div class="filters">
<select id="category"><option value="">All categories</option></select>
<select id="district"><option value="">All districts</option></select>
</div>
<div id="browseStatus" class="status"></div>
</section>
<div id="results" class="grid"></div>
<p style="text-align:center"><button id="more" class="secondary" hidden>Load more</button></p>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<p style="text-align:center"><button id="moreRecent" class="secondary" hidden>Load more</button></p>
</section>
</main>

<footer>© <span id="year"></span> CreateLK.com</footer>

<!-- Google sign-in popup -->
<div id="authPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeAuth">✕</button>
<h2><span class="gold">CreateLK.com</span></h2>
<p style="text-align:center">Sign in with Google to post an ad.</p>
<div id="googleButton" style="display:flex;justify-content:center;min-height:45px"></div>
<div id="googleStatus" class="status"></div>
</div>
</div>

<div id="detailPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeDetail">✕</button>
<h2 id="detailTitle">Ad Details</h2>
<div id="detailBody"></div>
</div>
</div>

<script>
"use strict";
const API="https://create-public.createlk.workers.dev";
const POST_PAGE="/create/ads.html";
const CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const $=id=>document.getElementById(id);
let token="",profile=null,browseAds=[],recentAds=[],bo=0,ro=0,timer,googleReady=false;

$("year").textContent=new Date().getFullYear();

function say(id,text){$(id).textContent=text}
function showPopup(id){$(id).classList.add("show");document.body.style.overflow="hidden"}
function closePopup(id){$(id).classList.remove("show");document.body.style.overflow=""}

function showGoogleProfile(p){
 profile=p;
 $("avatar").hidden=!(token&&p?.picture);
 $("login").hidden=!( !token || !p?.picture);
 $("logout").hidden=!token;
 if(token&&p?.picture)$("avatar").src=p.picture;
 else $("avatar").removeAttribute("src");
}

function loadSavedProfile(){
 try{
  token=localStorage.getItem("createlk_public_token")||
        localStorage.getItem("createlk_token")||
        sessionStorage.getItem("apebazar_token")||"";
  profile=JSON.parse(localStorage.getItem("createlk_public_user")||
          localStorage.getItem("createlk_user")||
          localStorage.getItem("apebazar_user")||
          sessionStorage.getItem("apebazar_user")||"null");
  if(!token)profile=null;
  showGoogleProfile(profile);
 }catch{token="";showGoogleProfile(null)}
}

function openLogin(){
 say("googleStatus","");
 showPopup("authPopup");
 renderGoogleButton();
}

function openPost(){
 if(!token){openLogin();say("googleStatus","Please sign in with Google before posting.");return}
 location.href=POST_PAGE;
}

$("login").onclick=openLogin;
$("postBtn").onclick=openPost;
$("avatar").onclick=openPost;
$("myAds").onclick=e=>{
 if(!token){e.preventDefault();openLogin();say("googleStatus","Please sign in before continuing.");}
};

$("logout").onclick=e=>{
 e.preventDefault();
 ["createlk_public_token","createlk_public_user","createlk_token","createlk_user","apebazar_token","apebazar_user"].forEach(k=>{
  localStorage.removeItem(k);sessionStorage.removeItem(k);
 });
 token="";profile=null;showGoogleProfile(null);location.reload();
};

$("menuBtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("show")};
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))$("menu").classList.remove("show")});
$("closeAuth").onclick=()=>closePopup("authPopup");
$("closeDetail").onclick=()=>closePopup("detailPopup");
document.querySelectorAll(".popup").forEach(p=>p.onclick=e=>{if(e.target===p)closePopup(p.id)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePopup("authPopup");closePopup("detailPopup")}});

function renderGoogleButton(){
 if(!window.google?.accounts?.id){
  say("googleStatus","Loading Google Sign-In...");
  setTimeout(renderGoogleButton,500);return;
 }
 if(!googleReady){
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:googleLogin});
  googleReady=true;
 }
 $("googleButton").replaceChildren();
 google.accounts.id.renderButton($("googleButton"),{theme:"filled_black",size:"large",text:"signin_with",shape:"rectangular",width:260});
}

async function googleLogin(response){
 say("googleStatus","Signing in...");
 try{
  const r=await fetch(API+"/public/google-login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({credential:response.credential})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.error||"Google login failed");
  token=d.token||d.access_token||"";
  if(!token)throw Error("Login token was not returned by the server");

  let claims={};
  try{claims=JSON.parse(atob(response.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch{}
  profile={...(d.user||{}),name:d.user?.name||claims.name||"",email:d.user?.email||claims.email||"",picture:d.user?.picture||claims.picture||""};

  localStorage.setItem("createlk_public_token",token);
  localStorage.setItem("createlk_public_user",JSON.stringify(profile));
  sessionStorage.setItem("apebazar_token",token);
  sessionStorage.setItem("apebazar_user",JSON.stringify(profile));
  showGoogleProfile(profile);
  closePopup("authPopup");
  location.href=POST_PAGE;
 }catch(e){say("googleStatus",e.message||"Sign-in failed. Please try again.")}
}

/* Public listings API */
async function api(path){
 let r;
 try{r=await fetch(API+path)}catch{throw Error("Cannot connect to API.")}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||d.message||"Request failed");
 return d;
}
function rows(d){
 if(Array.isArray(d))return d;
 for(const k of ["listings","ads","results","data","items","categories","districts","locations"])if(Array.isArray(d?.[k]))return d[k];
 return [];
}
function fill(id,d,label){
 $(id).replaceChildren(new Option(label,""));
 rows(d).forEach(x=>{if(x.id!=null&&x.name!=null)$(id).add(new Option(x.name,x.id))});
}
async function loadOptions(){
 try{
  const [c,d]=await Promise.all([api("/api/categories"),api("/api/locations")]);
  fill("category",c,"All categories");fill("district",d,"All districts");
 }catch(e){say("browseStatus","Filters unavailable: "+e.message)}
}
function safeURL(v){try{const u=new URL(v,location.href);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return""}}
function photo(a){return safeURL(a.image_url||a.photo_url||(Array.isArray(a.photos)?a.photos[0]:""))}
function linkFor(a){return a.id==null?location.href:new URL("/create/ads.html?id="+encodeURIComponent(a.id),location.origin).href}
async function copyLink(a){
 const u=linkFor(a);
 try{await navigator.clipboard.writeText(u);alert("Ad link copied!")}catch{prompt("Copy ad link:",u)}
}
function addText(parent,label,value){
 if(value==null||value==="")return;
 const p=document.createElement("p"),b=document.createElement("b");
 p.className="detail-text";b.textContent=label+": ";
 p.append(b,document.createTextNode(String(value)));parent.append(p);
}
function detail(a){
 $("detailTitle").textContent=a.title||"Ad Details";
 const b=$("detailBody");b.replaceChildren();
 const src=photo(a);
 if(src){const i=document.createElement("img");i.className="detail-img";i.src=src;i.alt=a.title||"Ad";b.append(i)}
 addText(b,"Description",a.description);
 addText(b,"Category",a.category_name||a.category);
 addText(b,"District",a.district_name||a.district);
 addText(b,"City",a.city_name||a.city);
 const price=a.price_lkr??a.price;
 if(price!=null)addText(b,"Price","LKR "+Number(price).toLocaleString("en-LK"));
 addText(b,"Seller",a.seller_name||a.contact_name);
 const phone=a.seller_phone||a.phone;
 if(phone){
  const box=document.createElement("div");box.className="actions";
  const call=document.createElement("a");call.className="contact call";call.href="tel:"+phone;call.textContent="Call";
  const wa=document.createElement("a");wa.className="contact wa";
  let n=String(phone).replace(/\D/g,"");if(n.startsWith("0"))n="94"+n.slice(1);
  wa.href="https://wa.me/"+n;wa.target="_blank";wa.rel="noopener noreferrer";wa.textContent="WhatsApp";
  box.append(call,wa);b.append(box);
 }
 const website=safeURL(a.website_url);
 if(website){const x=document.createElement("a");x.href=website;x.target="_blank";x.rel="noopener noreferrer";x.textContent="Visit Website";b.append(x)}
 const copy=document.createElement("button");copy.className="secondary";copy.style.marginTop="10px";copy.textContent="Copy Ad Link";copy.onclick=()=>copyLink(a);b.append(copy);
 showPopup("detailPopup");
}
function card(a){
 const article=document.createElement("article");article.className="ad";
 const src=photo(a);
 if(src){const i=document.createElement("img");i.src=src;i.alt=a.title||"Ad";i.loading="lazy";i.onerror=()=>i.remove();article.append(i)}
 const c=document.createElement("div");c.className="content";
 const t=document.createElement("b");t.className="title";t.textContent=a.title||"Untitled ad";
 const buttons=document.createElement("div");buttons.className="card-buttons";
 const view=document.createElement("button");view.textContent="View Post";view.onclick=()=>detail(a);
 const copy=document.createElement("button");copy.className="secondary";copy.textContent="Copy Link";copy.onclick=()=>copyLink(a);
 buttons.append(view,copy);c.append(t,buttons);article.append(c);return article;
}
function browseURL(){
 const p=new URLSearchParams();
 if($("q").value.trim())p.set("search",$("q").value.trim());
 if($("category").value)p.set("category",$("category").value);
 if($("district").value)p.set("location",$("district").value);
 return "/api/listings"+(p.size?"?"+p:"");
}
$("searchForm").onsubmit=e=>{e.preventDefault();loadBrowse()};
$("category").onchange=loadBrowse;$("district").onchange=loadBrowse;
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(loadBrowse,350)};
async function loadBrowse(){
 say("browseStatus","Loading ads...");$("more").hidden=true;
 try{browseAds=rows(await api(browseURL()));bo=0;$("results").replaceChildren();renderBrowse()}
 catch(e){say("browseStatus","Could not load ads: "+e.message)}
}
function renderBrowse(){
 browseAds.slice(bo,bo+12).forEach(a=>$("results").append(card(a)));
 bo+=12;$("more").hidden=bo>=browseAds.length;
 say("browseStatus",browseAds.length?browseAds.length+" ads found.":"No approved ads found.");
}
$("more").onclick=renderBrowse;
async function loadRecent(){
 say("recentStatus","Loading ads...");$("moreRecent").hidden=true;
 try{recentAds=rows(await api("/api/listings"));ro=0;$("recentResults").replaceChildren();renderRecent()}
 catch(e){say("recentStatus","Could not load recent ads: "+e.message)}
}
function renderRecent(){
 recentAds.slice(ro,ro+6).forEach(a=>$("recentResults").append(card(a)));
 ro+=6;$("moreRecent").hidden=ro>=recentAds.length;
 say("recentStatus",recentAds.length?"":"No approved ads available yet.");
}
$("moreRecent").onclick=renderRecent;

loadSavedProfile();loadOptions();loadBrowse();loadRecent();
window.addEventListener("pageshow",loadSavedProfile);
window.addEventListener("storage",loadSavedProfile);
</script>
</body>
</html>
