<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CreateLK Academy</title>

  <meta
    name="description"
    content="Login or create your CreateLK Academy account."
  >

  <link
    rel="icon"
    href="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc,
          #f5f3ff
        );

      color: #172033;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: #ffffff;

      border-radius: 24px;

      padding: 32px 28px 28px;

      box-shadow:
        0 20px 55px
        rgba(15, 23, 42, 0.10);

      border:
        1px solid #e8ebf2;
    }

    /* LOGO */

    .logo-area {
      text-align: center;

      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;

      object-fit: contain;

      margin-bottom: 12px;
    }

    .brand-name {
      font-size: 24px;

      font-weight: 900;

      color: #172554;
    }

    .brand-description {
      margin-top: 5px;

      color: #64748b;

      font-size: 13px;
    }

    /* TABS */

    .tabs {
      display: grid;

      grid-template-columns: 1fr 1fr;

      background: #f1f5f9;

      padding: 4px;

      border-radius: 12px;

      margin-bottom: 25px;
    }

    .tab {
      border: none;

      background: transparent;

      padding: 11px;

      border-radius: 9px;

      font-size: 14px;

      font-weight: 700;

      color: #64748b;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .tab.active {
      background: #ffffff;

      color: #2563eb;

      box-shadow:
        0 2px 8px
        rgba(15,23,42,0.08);
    }

    /* FORM */

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form-title {
      font-size: 21px;

      font-weight: 800;

      color: #172554;

      margin-bottom: 6px;
    }

    .form-description {
      font-size: 13px;

      color: #64748b;

      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      color: #334155;

      margin-bottom: 7px;
    }

    .field input {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #dbe2ea;

      border-radius: 10px;

      background: #ffffff;

      color: #172033;

      font-size: 14px;

      outline: none;

      transition: 0.2s ease;
    }

    .field input:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99,102,241,0.10);
    }

    .submit-btn {
      width: 100%;

      border: none;

      padding: 13px;

      margin-top: 5px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: #ffffff;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 20px
        rgba(37,99,235,0.18);

      transition: 0.25s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 11px 25px
        rgba(37,99,235,0.25);
    }

    .submit-btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;

      transform: none;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-bottom: 15px;

      padding: 11px 12px;

      border-radius: 9px;

      font-size: 13px;

      line-height: 1.4;
    }

    .message.error {
      display: block;

      background: #fef2f2;

      color: #b91c1c;

      border:
        1px solid #fecaca;
    }

    .message.success {
      display: block;

      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;
    }

    /* FOOTER */

    .auth-footer {
      text-align: center;

      margin-top: 23px;

      padding-top: 19px;

      border-top:
        1px solid #edf0f5;

      color: #94a3b8;

      font-size: 11px;

      line-height: 1.7;
    }

    .auth-footer a {
      color: #2563eb;

      font-weight: 700;
    }

    .home-link {
      display: inline-block;

      margin-top: 9px;

      color: #64748b;

      font-size: 12px;

      font-weight: 700;
    }

    .home-link:hover {
      color: #2563eb;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .auth-card {
        padding: 27px 20px 23px;

        border-radius: 20px;
      }

      .logo {
        width: 65px;
        height: 65px;
      }

      .brand-name {
        font-size: 22px;
      }

    }

  </style>
</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-card">

      <!-- LOGO -->

      <div class="logo-area">

        <img
          class="logo"
          src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
          alt="CreateLK Academy Logo"
        >

        <div class="brand-name">
          CreateLK Academy
        </div>

        <div class="brand-description">
          Online Education for Sri Lankan Students
        </div>

      </div>


      <!-- TABS -->

      <div class="tabs">

        <button
          type="button"
          class="tab active"
          id="loginTab"
          onclick="showForm('login')"
        >
          Login
        </button>

        <button
          type="button"
          class="tab"
          id="registerTab"
          onclick="showForm('register')"
        >
          Create Account
        </button>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- =========================
           LOGIN FORM
      ========================== -->

      <form
        id="loginForm"
        class="form active"
        onsubmit="login(event)"
      >

        <div class="form-title">
          Welcome Back
        </div>

        <div class="form-description">
          Login to continue your learning.
        </div>


        <div class="field">

          <label for="loginEmail">
            Email Address
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <!-- =========================
           REGISTER FORM
      ========================== -->

      <form
        id="registerForm"
        class="form"
        onsubmit="register(event)"
      >

        <div class="form-title">
          Create Your Account
        </div>

        <div class="form-description">
          Create an account to access CreateLK Academy.
        </div>


        <div class="field">

          <label for="firstName">
            First Name
          </label>

          <input
            type="text"
            id="firstName"
            placeholder="Enter your first name"
            autocomplete="given-name"
            required
          >

        </div>


        <div class="field">

          <label for="lastName">
            Last Name
          </label>

          <input
            type="text"
            id="lastName"
            placeholder="Enter your last name"
            autocomplete="family-name"
            required
          >

        </div>


        <div class="field">

          <label for="registerEmail">
            Email Address
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
            required
          >

        </div>


        <div class="field">

          <label for="registerPassword">
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <!-- FOOTER -->

      <div class="auth-footer">

        By continuing, you agree to our
        <a href="../pages/terms-and-conditions.html">
          Terms & Conditions
        </a>
        and
        <a href="../pages/privacy-policy.html">
          Privacy Policy
        </a>.

        <br>

        <a
          href="../index.html"
          class="home-link"
        >
          ← Back to CreateLK Academy
        </a>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       API
    ========================== */

    const API =
      "https://createlk-auth-api.createlk.workers.dev";


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(text, type = "error") {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className =
        "message";

    }


    /* =========================
       SWITCH FORMS
    ========================== */

    function showForm(formName) {

      clearMessage();

      const loginForm =
        document.getElementById("loginForm");

      const registerForm =
        document.getElementById("registerForm");

      const loginTab =
        document.getElementById("loginTab");

      const registerTab =
        document.getElementById("registerTab");


      if (formName === "login") {

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

      } else {

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

      }

    }


    /* =========================
       SAVE AUTH DATA
    ========================== */

    function saveAuth(data) {

      if (data.token) {

        localStorage.setItem(
          "createlk_token",
          data.token
        );

      }

      if (data.customer) {

        localStorage.setItem(
          "createlk_customer",
          JSON.stringify(data.customer)
        );

      }

    }


    /* =========================
       REDIRECT
    ========================== */

    function redirectAfterLogin() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const redirect =
        params.get("redirect");


      if (
        redirect &&
        redirect.startsWith("/") &&
        !redirect.startsWith("//")
      ) {

        window.location.href = redirect;

      } else {

        window.location.href =
          "../dashboard.html";

      }

    }


    /* =========================
       LOGIN
    ========================== */

    async function login(event) {

      event.preventDefault();

      clearMessage();


      const button =
        document.getElementById("loginButton");

      const email =
        document.getElementById("loginEmail")
          .value
          .trim();

      const password =
        document.getElementById("loginPassword")
          .value;


      button.disabled = true;

      button.textContent =
        "Logging in...";


      try {

        const response =
          await fetch(
            API + "/auth/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  email,
                  password
                })
            }
          );


        const data =
          await response.json()
            .catch(() => ({}));


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Login failed. Please check your email and password."
          );

        }


        if (!data.token) {

          throw new Error(
            "Login succeeded but no authentication token was received."
          );

        }


        saveAuth(data);

        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        setTimeout(
          redirectAfterLogin,
          300
        );


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to connect to the server."
        );

        button.disabled = false;

        button.textContent =
          "Login";

      }

    }


    /* =========================
       REGISTER
    ========================== */

    async function register(event) {

      event.preventDefault();

      clearMessage();


      const button =
        document.getElementById(
          "registerButton"
        );


      const firstName =
        document.getElementById("firstName")
          .value
          .trim();

      const lastName =
        document.getElementById("lastName")
          .value
          .trim();

      const email =
        document.getElementById("registerEmail")
          .value
          .trim();

      const phone =
        document.getElementById("phone")
          .value
          .trim();

      const password =
        document.getElementById("registerPassword")
          .value;


      button.disabled = true;

      button.textContent =
        "Creating Account...";


      try {

        const response =
          await fetch(
            API + "/auth/register",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  first_name: firstName,
                  last_name: lastName,
                  email,
                  phone,
                  password
                })
            }
          );


        const data =
          await response.json()
            .catch(() => ({}));


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Unable to create your account."
          );

        }


        if (!data.token) {

          throw new Error(
            "Account created but no authentication token was received."
          );

        }


        saveAuth(data);

        showMessage(
          "Account created successfully. Redirecting...",
          "success"
        );


        setTimeout(
          redirectAfterLogin,
          300
        );


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to connect to the server."
        );

        button.disabled = false;

        button.textContent =
          "Create Account";

      }

    }


    /* =========================
       CHECK EXISTING LOGIN
    ========================== */

    async function checkExistingLogin() {

      const token =
        localStorage.getItem(
          "createlk_token"
        );


      if (!token) {

        return;

      }


      try {

        const response =
          await fetch(
            API + "/auth/me",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + token
              }
            }
          );


        if (response.ok) {

          redirectAfterLogin();

        } else if (
          response.status === 401
        ) {

          localStorage.removeItem(
            "createlk_token"
          );

          localStorage.removeItem(
            "createlk_customer"
          );

        }

      } catch (error) {

        /*
          Do not delete the token on a
          temporary network error.
        */

        console.log(
          "Could not verify existing session.",
          error
        );

      }

    }


    /* =========================
       START
    ========================== */

    checkExistingLogin();

  </script>

</body>
</html>
