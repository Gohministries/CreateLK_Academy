<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Digital Learning Shop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
nav{max-width:1100px;margin:auto;padding:18px 20px;display:flex;gap:22px;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#2563eb;margin-right:auto}
nav a{color:#333;text-decoration:none;font-weight:600}
.hero{background:#2563eb;color:white;text-align:center;padding:70px 20px}
.hero h1{font-size:44px;margin:0 0 15px}
.hero p{max-width:650px;margin:auto;font-size:18px}
.section{max-width:1100px;margin:auto;padding:50px 20px}
h2{text-align:center;margin-bottom:30px}
.filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-bottom:25px}
select,input{padding:12px;border:1px solid #ccc;border-radius:8px;background:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border:1px solid #ddd;border-radius:12px;overflow:hidden}
.card img,.placeholder{width:100%;height:190px;object-fit:cover}
.placeholder{display:flex;align-items:center;justify-content:center;background:#e5e7eb;font-size:45px}
.content{padding:18px}
.badge{color:#2563eb;font-size:13px;font-weight:bold}
.price{font-size:21px;font-weight:bold;margin:15px 0}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}
.msg{text-align:center;grid-column:1/-1;padding:30px;color:#666}
footer{background:#111827;color:#fff;text-align:center;padding:35px}
footer a{color:#ccc;margin:0 8px}
@media(max-width:750px){
nav{flex-wrap:wrap}
nav a{font-size:14px}
.filters,.grid{grid-template-columns:1fr}
.hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">CreateLK</div>
<a href="#home">Home</a>
<a href="#courses">Courses</a>
<a href="#categories">Categories</a>
<a href="#about">About</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h1>Learn. Grow. Succeed.</h1>
<p>Affordable digital learning resources from CreateLK.</p>
</section>

<section class="section" id="categories">
<h2>Categories</h2>
<div id="categoriesGrid" class="grid"></div>
</section>

<section class="section" id="courses">
<h2>All Courses</h2>

<div class="filters">
<select id="language">
<option value="all">All Languages</option>
</select>

<select id="category">
<option value="all">All Categories</option>
</select>

<input id="search" placeholder="Search courses...">
</div>

<div id="products" class="grid">
<div class="msg">Loading...</div>
</div>
</section>

<section class="section" id="about">
<h2>About CreateLK</h2>
<p style="text-align:center">
CreateLK provides affordable digital learning materials for students and learners.
</p>
</section>

<footer>
<p>© <span id="year"></span> CreateLK</p>
<a href="terms.html">Terms</a>
<a href="privacy.html">Privacy</a>
<a href="refund.html">Refund</a>
</footer>

<script>
const API="https://createlk-digital-shop.createlk.workers.dev";

let products=[];

const $=id=>document.getElementById(id);

async function load(){
 try{
  const r=await fetch(API+"/products");
  if(!r.ok)throw Error();
  const data=await r.json();
  products=Array.isArray(data)?data:data.products||[];

  buildFilters();
  buildCategories();
  render();
 }catch(e){
  $("products").innerHTML='<div class="msg">Unable to load courses.</div>';
 }
}

function buildFilters(){
 const langs=[...new Set(products.map(p=>p.language).filter(Boolean))].sort();
 const cats=[...new Set(products.map(p=>p.subject).filter(Boolean))].sort();

 $("language").innerHTML='<option value="all">All Languages</option>'+
 langs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");

 $("category").innerHTML='<option value="all">All Categories</option>'+
 cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}

function buildCategories(){
 const cats=[...new Set(products.map(p=>p.subject).filter(Boolean))].sort();

 $("categoriesGrid").innerHTML=cats.length
 ?cats.map(c=>`
   <div class="card" style="padding:20px;cursor:pointer"
        onclick="chooseCategory('${esc(c)}')">
     <strong>${esc(c)}</strong>
   </div>
 `).join("")
 :'<div class="msg">No categories available.</div>';
}

function chooseCategory(c){
 $("category").value=c;
 location.hash="courses";
 render();
}

function render(){
 const lang=$("language").value;
 const cat=$("category").value;
 const search=$("search").value.toLowerCase();

 const list=products.filter(p=>{
  if(lang!="all" && p.language!=lang)return false;
  if(cat!="all" && p.subject!=cat)return false;

  const text=[
   p.title,p.subject,p.language,p.description
  ].join(" ").toLowerCase();

  return !search||text.includes(search);
 });

 $("products").innerHTML=list.length
 ?list.map(card).join("")
 :'<div class="msg">No courses found.</div>';
}

function card(p){
 const image=p.image
 ?`<img src="${esc(p.image)}" alt="${esc(p.title||"Course")}">`
 :`<div class="placeholder">📚</div>`;

 const buy=p.payhere_link
 ?`<button onclick="location.href='${esc(p.payhere_link)}'">Buy Now</button>`
 :`<button disabled>Payment Unavailable</button>`;

 return `
 <article class="card">
  ${image}
  <div class="content">
   <div class="badge">${esc(p.language||"English")}</div>
   <small>${esc(p.subject||"Course")}</small>
   <h3>${esc(p.title||"Untitled Course")}</h3>
   <p>${esc(p.description||"Digital learning material.")}</p>
   <div class="price">LKR ${Number(p.price||0).toFixed(2)}</div>
   ${buy}
  </div>
 </article>`;
}

function esc(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

$("language").onchange=render;
$("category").onchange=render;
$("search").oninput=render;
$("year").textContent=new Date().getFullYear();

load();
</script>

</body>
</html>
