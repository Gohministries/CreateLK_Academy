<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK.com</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
 --bg:#0b1628;
 --p:#13233b;
 --g:#ffd166;
 --t:#f4f7fc;
 --m:#c1cee0;
 --b:#304561
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--t);
 font:15px Arial
}
body.lock{overflow:hidden}
header{
 position:sticky;
 top:0;
 z-index:5;
 background:#0a1527;
 border-bottom:1px solid var(--b)
}
nav,main{max-width:950px;margin:auto}
nav{
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px
}
button{
 border:0;
 border-radius:5px;
 padding:9px 11px;
 background:var(--g);
 color:#101b2c;
 font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.6}
.secondary{
 background:#172a45;
 color:white;
 border:1px solid var(--b)
}
.brand{
 display:flex;
 align-items:center;
 gap:6px;
 margin-right:auto;
 color:white;
 text-decoration:none;
 font-weight:bold;
 font-size:19px
}
.brand img{
 width:30px;
 height:30px;
 object-fit:cover;
 border-radius:5px
}
.gold{color:var(--g)}
.menu-wrap{position:relative}
.menu{
 display:none;
 position:absolute;
 right:0;
 top:38px;
 background:var(--p);
 padding:12px;
 min-width:160px;
 border-radius:6px;
 border:1px solid var(--b)
}
.menu.show{display:grid;gap:12px}
.menu a{color:var(--g);text-decoration:none}
main{padding:6px}
.hero,.panel,.ad{
 background:var(--p);
 border:1px solid var(--b);
 border-radius:7px;
 margin-bottom:7px
}
.hero,.panel{padding:10px}
.hero{text-align:center}
.hero h1{font-size:23px;margin:0}
.hero p{color:var(--m);margin:7px}
h3{margin:0 0 8px}
input,select,textarea{
 width:100%;
 padding:9px;
 background:#0c192c;
 color:white;
 border:1px solid var(--b);
 border-radius:5px;
 font:15px Arial
}
label{
 display:block;
 color:var(--m);
 font-size:13px;
 margin:8px 0 4px
}
.search,.filters{
 display:flex;
 gap:6px;
 margin-bottom:6px
}
.search input{flex:1;min-width:0}
.filters>*{min-width:0;flex:1}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:7px
}
.ad{
 overflow:hidden;
 text-align:center;
 margin:0
}
.ad img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 display:block
}
.content{
 padding:8px;
 overflow-wrap:anywhere
}
.title{
 display:block;
 font-size:15px;
 margin-bottom:7px
}
.card-buttons{display:flex;gap:5px}
.card-buttons button{
 flex:1;
 min-width:0;
 padding:9px 4px;
 font-size:12px
}
.status{
 color:var(--m);
 font-size:13px;
 margin:7px 0
}
.popup{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#000c;
 align-items:center;
 justify-content:center;
 padding:8px
}
.popup.show{display:flex}
.box{
 position:relative;
 width:100%;
 max-width:440px;
 max-height:92vh;
 overflow:auto;
 background:var(--p);
 border:1px solid var(--b);
 border-radius:8px;
 padding:14px
}
.box h2{
 text-align:center;
 margin:0 25px 12px;
 font-size:20px
}
.close{
 position:absolute;
 right:5px;
 top:5px;
 background:#172a45;
 color:white
}
.detail-img{
 width:100%;
 max-height:300px;
 object-fit:contain
}
.detail-text{
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.5
}
.detail-text a{
 color:#69b7ff;
 overflow-wrap:anywhere
}
.actions{display:flex;gap:6px;margin:9px 0}
.contact{
 flex:1;
 text-align:center;
 padding:10px 5px;
 border-radius:5px;
 text-decoration:none;
 font-weight:bold;
 color:#101b2c
}
.call{background:var(--g)}
.wa{background:#25d366;color:#082414}
footer{
 text-align:center;
 padding:12px;
 color:var(--m);
 font-size:12px
}
[hidden]{display:none!important}

@media(min-width:600px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:350px){
 .grid{grid-template-columns:1fr}
 .brand{font-size:16px}
}
</style>
</head>

<body>

<header>
<nav>

<a class="brand" href="/">
<img
 src="https://assets.createlk.com/Createlk.com/file_000000005fe4821193c9d67f48b23b64.png"
 alt="CreateLK.com">
<span>CreateLK<span class="gold">.com</span></span>
</a>

<button id="login">Sign in</button>

<img
 id="avatar"
 width="30"
 height="30"
 hidden
 style="border-radius:50%;object-fit:cover"
 alt="Profile">

<div class="menu-wrap">
<button class="secondary" id="menuBtn">☰</button>

<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#recent">Recent Posts</a>
<a href="/create/ads.html">My Ads</a>
<a href="/create/terms.html">Terms & Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>

</nav>
</header>

<main>

<section class="hero">
<h1>Buy & Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Find what you need.</p>
<button id="postBtn">＋ Post a Free Ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>

<form id="searchForm" class="search">
<input
 id="q"
 type="search"
 placeholder="Search products, vehicles, phones...">
<button>Search</button>
</form>

<div class="filters">
<select id="category">
<option value="">All categories</option>
</select>

<select id="district">
<option value="">All districts</option>
</select>
</div>

<div id="browseStatus" class="status"></div>
</section>

<div id="results" class="grid"></div>

<p style="text-align:center">
<button id="more" class="secondary" hidden>Load more</button>
</p>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>

<p style="text-align:center">
<button id="moreRecent" class="secondary" hidden>Load more</button>
</p>
</section>

</main>

<footer>
© <span id="year"></span> CreateLK.com
</footer>

<div id="detailPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">

<button class="close" id="closeDetail">✕</button>
<h2 id="detailTitle">Ad Details</h2>
<div id="detailBody"></div>

</div>
</div>

<script>
"use strict";

const API="https://apebazar-public-api.createlk.workers.dev";

const $=id=>document.getElementById(id);

let token=sessionStorage.getItem("apebazar_token")||"";
let user={};
let browseAds=[];
let recentAds=[];
let bo=0;
let ro=0;
let timer;

$("year").textContent=new Date().getFullYear();

async function api(path,opt={}){
 const h=new Headers(opt.headers||{});

 if(token){
  h.set("Authorization","Bearer "+token);
 }

 if(opt.body&&!(opt.body instanceof FormData)){
  h.set("Content-Type","application/json");
  opt={...opt,body:JSON.stringify(opt.body)};
 }

 const r=await fetch(API+path,{...opt,headers:h});
 const d=await r.json().catch(()=>({}));

 if(!r.ok){
  throw Error(d.error||d.message||"Request failed ("+r.status+")");
 }

 return d;
}

function say(id,s){
 $(id).textContent=s;
}

function rows(d){
 if(Array.isArray(d))return d;

 for(const k of [
  "listings","ads","results","data","items",
  "categories","districts","locations","cities"
 ]){
  if(Array.isArray(d?.[k]))return d[k];
 }

 return [];
}

function fill(id,d,label){
 const s=$(id);

 s.replaceChildren(new Option(label,""));

 rows(d).forEach(x=>{
  if(x.id!=null&&x.name!=null){
   s.add(new Option(x.name,x.id));
  }
 });
}

function authUI(){
 $("login").hidden=!!token;
 $("avatar").hidden=!token||!user.picture;
 $("logout").hidden=!token;

 if(user.picture){
  $("avatar").src=user.picture;
 }
}

/* Post Ad redirects to the separate posting page */
function openPost(){
 location.href="/create/post.html";
}

$("login").onclick=openPost;
$("postBtn").onclick=openPost;

/* Popup controls */
$("closeDetail").onclick=closePop;

function closePop(){
 document.querySelectorAll(".popup").forEach(x=>{
  x.classList.remove("show");
 });
 document.body.classList.remove("lock");
}

document.querySelectorAll(".popup").forEach(p=>{
 p.onclick=e=>{
  if(e.target===p)closePop();
 };
});

document.onkeydown=e=>{
 if(e.key==="Escape")closePop();
};

/* Navigation menu */
$("menuBtn").onclick=e=>{
 e.stopPropagation();
 $("menu").classList.toggle("show");
};

document.onclick=e=>{
 if(!e.target.closest(".menu-wrap")){
  $("menu").classList.remove("show");
 }
};

$("logout").onclick=e=>{
 e.preventDefault();

 token="";
 user={};

 sessionStorage.removeItem("apebazar_token");

 authUI();
};

/* Load categories and districts */
async function options(){
 try{
  const [c,d]=await Promise.all([
   api("/api/categories"),
   api("/api/locations")
  ]);

  fill("category",c,"All categories");
  fill("district",d,"All districts");

 }catch(e){
  say("browseStatus","Could not load categories: "+e.message);
 }
}

/* URL helpers */
function safeURL(v){
 try{
  const u=new URL(v);

  return ["https:","http:"].includes(u.protocol)
   ?u.href:"";

 }catch{
  return "";
 }
}

function wa(v){
 let n=String(v||"").replace(/\D/g,"");

 if(n.startsWith("00"))n=n.slice(2);
 if(n.startsWith("94"))return n;
 if(n.startsWith("0"))return "94"+n.slice(1);

 return n.length===9?"94"+n:n;
}

/* Ad links use the /create/ path */
function shareURL(ad){
 return ad.id==null
  ?location.href
  :new URL(
    "/create/ads.html?id="+encodeURIComponent(ad.id),
    location.origin
   ).href;
}

async function copyLink(ad){
 const link=shareURL(ad);

 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(link);
   alert("Ad link copied!");
  }else{
   window.prompt("Copy this ad link:",link);
  }
 }catch{
  window.prompt("Copy this ad link:",link);
 }
}

/* Ad details */
function detail(ad){
 $("detailTitle").textContent=ad.title||"Ad Details";

 const b=$("detailBody");
 b.replaceChildren();

 const photo=
  ad.image_url||
  ad.photo_url||
  (Array.isArray(ad.photos)?ad.photos[0]:"");

 if(photo){
  const im=document.createElement("img");
  im.className="detail-img";
  im.src=photo;
  im.alt=ad.title||"Ad photo";
  b.append(im);
 }

 const add=(k,v)=>{
  if(v==null||v==="")return;

  const p=document.createElement("p");
  p.className="detail-text";

  const s=document.createElement("b");
  s.textContent=k+": ";
  p.append(s);

  if(k!=="Description"){
   p.append(document.createTextNode(String(v)));
  }else{
   const t=String(v);
   const re=/https?:\/\/[^\s<>"']+/gi;
   let last=0,m;

   while((m=re.exec(t))!==null){
    p.append(document.createTextNode(t.slice(last,m.index)));

    let u=m[0],tail="";

    while(/[.,!?;:)\]]$/.test(u)){
     tail=u.slice(-1)+tail;
     u=u.slice(0,-1);
    }

    const valid=safeURL(u);

    if(valid){
     const a=document.createElement("a");
     a.href=valid;
     a.textContent=u;
     a.target="_blank";
     a.rel="noopener noreferrer";
     p.append(a);
    }else{
     p.append(document.createTextNode(u));
    }

    p.append(document.createTextNode(tail));
    last=m.index+m[0].length;
   }

   p.append(document.createTextNode(t.slice(last)));
  }

  b.append(p);
 };

 const types={
  product:"Product for Sale",
  service:"Service / Business",
  job:"Job Vacancy",
  website:"Website Promotion",
  other:"Others"
 };

 add("Type",types[ad.ad_type]||ad.ad_type);

 if(ad.ad_type==="job"){
  add(
   "Salary",
   ad.salary_lkr==null
    ?""
    :"LKR "+Number(ad.salary_lkr).toLocaleString("en-LK")
  );
 }else{
  add(
   "Price",
   ad.price_lkr==null
    ?""
    :"LKR "+Number(ad.price_lkr).toLocaleString("en-LK")
  );
 }

 add("Description",ad.description);
 add("Category",ad.category||ad.category_name);
 add("District",ad.district||ad.district_name);
 add("City",ad.city||ad.city_name);

 if(ad.ad_type==="product"){
  add("Condition",ad.condition);
 }

 add("Seller",ad.seller_name);

 if(ad.seller_phone){
  const ac=document.createElement("div");
  ac.className="actions";

  const c=document.createElement("a");
  c.className="contact call";
  c.href="tel:"+String(ad.seller_phone).replace(/[^\d+]/g,"");
  c.textContent="Call";

  const w=document.createElement("a");
  w.className="contact wa";
  w.href="https://wa.me/"+encodeURIComponent(wa(ad.seller_phone));
  w.target="_blank";
  w.rel="noopener noreferrer";
  w.textContent="WhatsApp";

  ac.append(c,w);
  b.append(ac);
 }

 const web=safeURL(ad.website_url);

 if(web){
  const a=document.createElement("a");
  a.href=web;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.className="contact call";
  a.style.display="block";
  a.textContent="Visit Website";
  b.append(a);
 }

 const cp=document.createElement("button");
 cp.className="secondary";
 cp.style.cssText="width:100%;margin-top:8px";
 cp.textContent="🔗 Copy Ad Link";
 cp.onclick=()=>copyLink(ad);

 b.append(cp);

 $("detailPopup").classList.add("show");
 document.body.classList.add("lock");
}

/* Ad cards */
function card(ad){
 const c=document.createElement("article");
 c.className="ad";

 const photo=
  ad.image_url||
  ad.photo_url||
  (Array.isArray(ad.photos)?ad.photos[0]:"");

 if(photo){
  const im=document.createElement("img");
  im.src=photo;
  im.alt=ad.title||"Ad photo";
  im.loading="lazy";
  im.onerror=()=>im.remove();
  c.append(im);
 }

 const x=document.createElement("div");
 x.className="content";

 const t=document.createElement("b");
 t.className="title";
 t.textContent=ad.title||"Untitled ad";

 const bs=document.createElement("div");
 bs.className="card-buttons";

 const v=document.createElement("button");
 v.textContent="View Post";
 v.onclick=()=>detail(ad);

 const cp=document.createElement("button");
 cp.className="secondary";
 cp.textContent="Copy Link";
 cp.onclick=()=>copyLink(ad);

 bs.append(v,cp);
 x.append(t,bs);
 c.append(x);

 return c;
}

/* Search */
function listingsURL(){
 const p=new URLSearchParams();

 if($("q").value.trim()){
  p.set("search",$("q").value.trim());
 }

 if($("category").value){
  p.set("category",$("category").value);
 }

 if($("district").value){
  p.set("location",$("district").value);
 }

 return "/api/listings"+(p.size?"?"+p:"");
}

$("searchForm").onsubmit=e=>{
 e.preventDefault();
 loadBrowse();
};

$("category").onchange=loadBrowse;
$("district").onchange=loadBrowse;

$("q").oninput=()=>{
 clearTimeout(timer);
 timer=setTimeout(loadBrowse,350);
};

/* Browse listings */
async function loadBrowse(){
 try{
  browseAds=rows(await api(listingsURL()));
  bo=0;

  $("results").replaceChildren();
  renderBrowse();

 }catch(e){
  say("browseStatus","Could not load ads: "+e.message);
 }
}

function renderBrowse(){
 browseAds.slice(bo,bo+12).forEach(a=>{
  $("results").append(card(a));
 });

 bo+=Math.min(12,browseAds.length-bo);

 $("more").hidden=bo>=browseAds.length;

 say(
  "browseStatus",
  browseAds.length
   ?browseAds.length+" ads found."
   :"No approved ads found."
 );
}

$("more").onclick=renderBrowse;

/* Recent posts */
async function loadRecent(){
 try{
  recentAds=rows(await api("/api/listings"));
  ro=0;

  $("recentResults").replaceChildren();
  renderRecent();

 }catch(e){
  say("recentStatus","Could not load recent ads: "+e.message);
 }
}

function renderRecent(){
 recentAds.slice(ro,ro+6).forEach(a=>{
  $("recentResults").append(card(a));
 });

 ro+=Math.min(6,recentAds.length-ro);

 $("moreRecent").hidden=ro>=recentAds.length;

 say(
  "recentStatus",
  recentAds.length?"":"No approved ads available yet."
 );
}

$("moreRecent").onclick=renderRecent;

/* Initialize page */
authUI();
options();
loadBrowse();
loadRecent();

</script>
</body>
</html>
