<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
button,input,textarea{font:inherit}
button{cursor:pointer}

.header{
background:#102a56;color:#fff;position:sticky;top:0;z-index:50;
box-shadow:0 2px 8px #0002
}

.header-inner,.container{max-width:1200px;margin:auto}
.header-inner{padding:10px 12px}

.topbar{
display:flex;align-items:center;justify-content:space-between;gap:10px
}

.brand{
display:flex;align-items:center;gap:8px;color:#fff;
text-decoration:none;font-size:18px;font-weight:700
}

.logo{
width:42px;height:42px;object-fit:contain;
background:#fff;border-radius:6px
}

.cart-btn{
border:0;background:#fff;color:#102a56;
border-radius:6px;padding:9px 13px;font-weight:700
}

.search{
width:100%;margin-top:10px;padding:11px 13px;
border:0;border-radius:6px;outline:none
}

.container{padding:15px 12px}

.hero{
background:linear-gradient(135deg,#102a56,#173c78);
color:#fff;border-radius:10px;padding:24px 18px;margin-bottom:15px
}

.hero h1{margin:0 0 7px;font-size:27px}
.hero p{margin:0;opacity:.9}

.categories{
display:flex;gap:8px;overflow-x:auto;
padding:2px 0 14px;scrollbar-width:none
}

.categories::-webkit-scrollbar{display:none}

.category{
flex:0 0 auto;border:1px solid #ddd;background:#fff;color:#333;
border-radius:20px;padding:8px 13px;white-space:nowrap
}

.category.active{
background:#102a56;color:#fff;border-color:#102a56
}

.status{
display:none;margin:12px 0;padding:12px;
border-radius:7px;font-weight:600
}

.status.success{display:block;background:#e8f7ed;color:#176b32}
.status.error{display:block;background:#fdeaea;color:#a32121}
.status.info{display:block;background:#eaf1fb;color:#174f91}

.products{
display:grid;grid-template-columns:repeat(4,1fr);gap:14px
}

.product{
background:#fff;border-radius:9px;overflow:hidden;
box-shadow:0 1px 5px #0001;display:flex;flex-direction:column
}

.product-image{
width:100%;aspect-ratio:1/1;
object-fit:contain;background:#fff
}

.product-body{
padding:11px;display:flex;
flex-direction:column;flex:1
}

.product-name{
font-size:15px;font-weight:700;
line-height:1.3;margin-bottom:7px
}

.price{
font-size:18px;font-weight:700;color:#102a56
}

.old-price{
color:#888;text-decoration:line-through;
font-size:13px;margin-left:5px
}

.stock{margin-top:5px;font-size:12px}
.in-stock{color:#17813a}
.out-stock{color:#b32222}

.add-btn{
margin-top:auto;padding:10px;border:0;border-radius:6px;
background:#102a56;color:#fff;font-weight:700
}

.add-btn:disabled{
background:#aaa;cursor:not-allowed
}

.empty{
text-align:center;padding:35px 10px;
color:#666;grid-column:1/-1
}

.cart-panel{
display:none;background:#fff;border-radius:10px;
padding:16px;margin-top:18px;box-shadow:0 1px 6px #0001
}

.cart-panel.show{display:block}

.cart-title{
font-size:21px;font-weight:700;margin-bottom:12px
}

.cart-item{
display:flex;gap:10px;align-items:center;
padding:10px 0;border-bottom:1px solid #eee
}

.cart-item img{
width:65px;height:65px;object-fit:contain;
border:1px solid #eee;border-radius:6px
}

.cart-info{flex:1}
.cart-name{font-weight:700;font-size:14px}
.cart-price{margin-top:4px;font-size:13px;color:#555}

.qty{
display:flex;align-items:center;gap:6px
}

.qty button{
width:30px;height:30px;border:1px solid #ddd;
background:#fff;border-radius:5px
}

.remove{
border:0;background:none;color:#c22;font-size:12px
}

.summary{
margin-top:15px;border-top:1px solid #ddd;padding-top:12px
}

.row{
display:flex;justify-content:space-between;margin:7px 0
}

.total{
font-size:20px;font-weight:700;color:#102a56
}

.form{
margin-top:18px;display:grid;gap:10px
}

.form input,.form textarea{
width:100%;padding:11px;border:1px solid #ccc;
border-radius:6px;outline:none
}

.form input:focus,.form textarea:focus{
border-color:#102a56
}

.form textarea{
min-height:80px;resize:vertical
}

.checkout-btn{
border:0;background:#102a56;color:#fff;
padding:13px;border-radius:7px;font-weight:700
}

.checkout-btn:disabled{
opacity:.6;cursor:not-allowed
}

.footer{
margin-top:30px;background:#102a56;color:#fff;
padding:25px 15px;text-align:center
}

.footer a{
color:#fff;text-decoration:none;margin:0 7px;font-size:13px
}

.footer p{font-size:12px;opacity:.8}

@media(max-width:900px){
.products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){
.products{grid-template-columns:repeat(2,1fr);gap:9px}
.hero h1{font-size:23px}
.product-body{padding:9px}
.product-name{font-size:14px}
.price{font-size:16px}
}

@media(max-width:380px){
.products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">

<div class="topbar">

<a href="/shop/" class="brand">
<img
class="logo"
src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png"
alt="CreateLK Shop">
<span>CreateLK <span style="color:#f5b041">Shop</span></span>
</a>

<button class="cart-btn" onclick="toggleCart()">
Cart (<span id="cartCount">0</span>)
</button>

</div>

<input
id="search"
class="search"
type="search"
placeholder="Search products..."
autocomplete="off">

</div>
</header>

<main class="container">

<section class="hero">
<h1>Shop Online in Sri Lanka 🇱🇰</h1>
<p>Quality products with Cash on Delivery.</p>
</section>

<div id="categories" class="categories"></div>

<div id="status" class="status"></div>

<section id="products" class="products">
<div class="empty">Loading products...</div>
</section>

<section id="cartPanel" class="cart-panel">

<div class="cart-title">Your Cart</div>

<div id="cartItems"></div>

<div class="summary">

<div class="row">
<span>Subtotal</span>
<strong id="subtotal">LKR 0</strong>
</div>

<div class="row">
<span>Delivery</span>
<strong>LKR 400</strong>
</div>

<div class="row total">
<span>Total</span>
<strong id="total">LKR 400</strong>
</div>

</div>

<div class="form">

<input
id="customerName"
placeholder="Full Name *"
autocomplete="name">

<input
id="district"
placeholder="District">

<input
id="city"
placeholder="City / Town *"
autocomplete="address-level2">

<textarea
id="address"
placeholder="Delivery Address *"></textarea>

<input
id="mobile1"
type="tel"
placeholder="Mobile 1 *"
autocomplete="tel">

<input
id="mobile2"
type="tel"
placeholder="Mobile 2 (Optional)"
autocomplete="tel">

<button
id="checkoutBtn"
class="checkout-btn"
onclick="placeOrder()">
Place COD Order
</button>

</div>

</section>

</main>

<footer class="footer">

<div>
<a href="/shop/terms.html">Terms</a>
<a href="/shop/privacy.html">Privacy</a>
<a href="/shop/refund.html">Refund & Returns</a>
</div>

<p>© 2026 CreateLK Shop. All rights reserved.</p>

</footer>

<script>

const API="https://shop-api.createlk.workers.dev";
const DELIVERY=400;

let cart=[];
let currentCategory="";
let searchTimer=null;


/* CART */

function loadCart(){

try{
cart=JSON.parse(
localStorage.getItem("createlk_cart")||"[]"
);

if(!Array.isArray(cart))cart=[];

}catch(e){
cart=[];
}

}

function saveCart(){

try{
localStorage.setItem(
"createlk_cart",
JSON.stringify(cart)
);
}catch(e){
console.error("Cart save:",e);
}

}

function updateCartCount(){

document.getElementById("cartCount")
.textContent=
cart.reduce(
(a,x)=>a+Number(x.qty||0),0
);

}


/* CART OPEN/CLOSE
   No scrolling */

function toggleCart(){

const panel=
document.getElementById("cartPanel");

panel.classList.toggle("show");

renderCart();

}


/* MESSAGES */

function showMessage(text,type="info"){

const box=
document.getElementById("status");

box.textContent=text;
box.className="status "+type;

}

function clearMessage(){

const box=
document.getElementById("status");

box.textContent="";
box.className="status";

}


/* API */

async function api(url,options={}){

let response;

try{

response=await fetch(url,{
...options,
headers:{
"Accept":"application/json",
...(options.headers||{})
}
});

}catch(e){

throw new Error(
"Network error. Please check your internet connection."
);

}

let data={};

try{
data=await response.json();
}catch(e){}

if(!response.ok){

throw new Error(
data.error||
data.message||
`Server error (${response.status})`
);

}

return data;

}


/* CATEGORIES */

async function loadCategories(){

const box=
document.getElementById("categories");

box.innerHTML="";

const all=
document.createElement("button");

all.className="category active";
all.textContent="All";

all.onclick=()=>{

currentCategory="";
setActive(all);
loadProducts();

};

box.appendChild(all);

try{

const data=
await api(API+"/api/categories");

data
.filter(c=>{

const n=
String(c.name||"")
.trim()
.toLowerCase();

return n!=="all"&&
n!=="all categories";

})
.forEach(c=>{

const btn=
document.createElement("button");

btn.className="category";
btn.textContent=c.name;

btn.onclick=()=>{

currentCategory=
String(c.id);

setActive(btn);
loadProducts();

};

box.appendChild(btn);

});

}catch(e){

console.error("Categories:",e);

}

}

function setActive(btn){

document
.querySelectorAll(".category")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

}


/* PRODUCTS */

async function loadProducts(){

const box=
document.getElementById("products");

box.innerHTML=
'<div class="empty">Loading products...</div>';

const params=
new URLSearchParams();

const search=
document
.getElementById("search")
.value
.trim();

if(currentCategory)
params.set(
"category",
currentCategory
);

if(search)
params.set(
"search",
search
);

try{

const data=
await api(
API+"/api/products?"+
params.toString()
);

renderProducts(
Array.isArray(data)?data:[]
);

}catch(e){

box.innerHTML=`
<div class="empty">
${escapeHtml(e.message)}
<br><br>
<button
onclick="loadProducts()"
style="padding:9px 14px;border:0;border-radius:6px;background:#102a56;color:#fff">
Try Again
</button>
</div>`;

}

}

function renderProducts(products){

const box=
document.getElementById("products");

if(!products.length){

const q=
document
.getElementById("search")
.value
.trim();

box.innerHTML=
`<div class="empty">${
q
?`No products found for "${escapeHtml(q)}".`
:"No products available."
}</div>`;

return;

}

box.innerHTML="";

products.forEach(p=>{

const price=
Number(p.price||0);

const sale=
p.sale_price!==null&&
Number(p.sale_price)>0&&
Number(p.sale_price)<price
?Number(p.sale_price)
:null;

const finalPrice=
sale!==null
?sale
:price;

const stock=
Number(p.stock||0);

const image=
p.images?.length
?p.images[0].image_key
:p.image_key;

const imageUrl=
image
?API+"/images/"+
encodeURIComponent(image)
:"";

const card=
document.createElement("div");

card.className="product";

card.innerHTML=`

${
imageUrl
?`
<img
class="product-image"
src="${imageUrl}"
alt="${escapeHtml(p.name)}"
loading="lazy"
onerror="this.style.display='none'">
`
:`
<div
class="product-image"
style="display:flex;align-items:center;justify-content:center;color:#999">
No Image
</div>
`
}

<div class="product-body">

<div class="product-name">
${escapeHtml(p.name)}
</div>

<div class="price">
LKR ${money(finalPrice)}

${
sale!==null
?`
<span class="old-price">
LKR ${money(price)}
</span>
`
:""
}

</div>

<div class="stock ${
stock>0
?"in-stock"
:"out-stock"
}">
${
stock>0
?`${stock} available`
:"Out of stock"
}
</div>

<button
class="add-btn"
${stock<=0?"disabled":""}
onclick="addToCart(${Number(p.id)})">

${stock>0
?"Add to Cart"
:"Out of Stock"}

</button>

</div>
`;

box.appendChild(card);

});

}


/* ADD TO CART */

async function addToCart(id){

try{

const p=
await api(
API+"/api/products/"+id
);

if(!p?.id)
throw new Error(
"Product not found."
);

const stock=
Number(p.stock||0);

if(stock<1){

showMessage(
"This product is out of stock.",
"error"
);

return;

}

const existing=
cart.find(
x=>Number(x.id)===
Number(p.id)
);

if(existing){

if(
Number(existing.qty)+1>
stock
){

showMessage(
`Only ${stock} item(s) are available.`,
"error"
);

return;

}

existing.qty++;

}else{

const image=
p.images?.length
?p.images[0].image_key
:p.image_key;

const price=
p.sale_price!==null&&
Number(p.sale_price)>0&&
Number(p.sale_price)<Number(p.price)
?Number(p.sale_price)
:Number(p.price);

cart.push({
id:Number(p.id),
name:p.name,
price,
image,
qty:1
});

}

saveCart();
updateCartCount();
renderCart();

showMessage(
"Product added to cart.",
"success"
);

}catch(e){

console.error("Add cart:",e);

showMessage(
e.message||
"Unable to add product.",
"error"
);

}

}


/* RENDER CART */

function renderCart(){

const box=
document.getElementById("cartItems");

if(!cart.length){

box.innerHTML=
'<div style="padding:15px 0;color:#777">Your cart is empty.</div>';

document.getElementById("subtotal")
.textContent="LKR 0";

document.getElementById("total")
.textContent="LKR 400";

updateCartCount();

return;

}

let subtotal=0;

box.innerHTML="";

cart.forEach((item,index)=>{

const qty=
Number(item.qty||0);

const price=
Number(item.price||0);

subtotal+=
price*qty;

const imageUrl=
item.image
?API+"/images/"+
encodeURIComponent(item.image)
:"";

const row=
document.createElement("div");

row.className="cart-item";

row.innerHTML=`

${
imageUrl
?`
<img
src="${imageUrl}"
alt="${escapeHtml(item.name)}"
onerror="this.style.display='none'">
`
:""
}

<div class="cart-info">

<div class="cart-name">
${escapeHtml(item.name)}
</div>

<div class="cart-price">
LKR ${money(price)} × ${qty}
</div>

<button
class="remove"
onclick="removeCart(${index})">
Remove
</button>

</div>

<div class="qty">

<button onclick="changeQty(${index},-1)">
−
</button>

<strong>${qty}</strong>

<button onclick="changeQty(${index},1)">
+
</button>

</div>

`;

box.appendChild(row);

});

document.getElementById("subtotal")
.textContent=
"LKR "+money(subtotal);

document.getElementById("total")
.textContent=
"LKR "+money(subtotal+DELIVERY);

updateCartCount();

}


function changeQty(index,change){

if(!cart[index])return;

const qty=
Number(cart[index].qty)+change;

if(qty<1)
cart.splice(index,1);
else
cart[index].qty=qty;

saveCart();
renderCart();

}


function removeCart(index){

if(!cart[index])return;

cart.splice(index,1);

saveCart();
renderCart();

}


/* PLACE ORDER */

async function placeOrder(){

clearMessage();

if(!cart.length){

showMessage(
"Your cart is empty.",
"error"
);

return;

}

const customer={

name:
document
.getElementById("customerName")
.value.trim(),

district:
document
.getElementById("district")
.value.trim(),

city:
document
.getElementById("city")
.value.trim(),

address:
document
.getElementById("address")
.value.trim(),

mobile1:
document
.getElementById("mobile1")
.value.trim(),

mobile2:
document
.getElementById("mobile2")
.value.trim()

};

if(!customer.name){

showMessage(
"Please enter your full name.",
"error"
);

return;

}

if(!customer.city){

showMessage(
"Please enter your city or town.",
"error"
);

return;

}

if(!customer.address){

showMessage(
"Please enter your delivery address.",
"error"
);

return;

}

if(!customer.mobile1){

showMessage(
"Please enter your mobile number 1.",
"error"
);

return;

}

const btn=
document.getElementById("checkoutBtn");

btn.disabled=true;
btn.textContent="Processing...";

try{

const data=
await api(
API+"/api/orders",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

customer:{

name:customer.name,
district:customer.district,
city:customer.city,
address:customer.address,
mobile_1:customer.mobile1,
mobile_2:customer.mobile2

},

items:
cart.map(x=>({

product_id:Number(x.id),
quantity:Number(x.qty)

}))

})
}
);

if(!data.success){

throw new Error(
data.error||
"Order was not completed."
);

}

const orderId=
data.order_id;

cart=[];

saveCart();
renderCart();

document
.querySelectorAll(
".form input,.form textarea"
)
.forEach(x=>x.value="");

showMessage(
orderId
?`Order placed successfully! Order #${orderId}. Thank you for shopping with CreateLK Shop.`
:"Order placed successfully. Thank you!",
"success"
);

}catch(e){

console.error(
"Order error:",
e
);

showMessage(
e.message||
"Unable to place your order. Please try again.",
"error"
);

}finally{

btn.disabled=false;
btn.textContent=
"Place COD Order";

}

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
"input",
()=>{

clearTimeout(searchTimer);

searchTimer=
setTimeout(
loadProducts,
400
);

}
);


/* HELPERS */

function money(n){

return Number(n||0)
.toLocaleString("en-LK");

}

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

loadCart();
updateCartCount();
renderCart();
loadCategories();
loadProducts();

</script>

</body>
</html>
