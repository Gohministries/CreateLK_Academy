<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English</title>
<meta name="description" content="Practice English MCQ questions with CreateLK English.">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:#0b1628;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:#182943;border-radius:20px;padding:7px 11px;font-size:13px}
main{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0000000d}
h1,h2,h3{margin-top:0}
button{border:0;border-radius:10px;padding:10px 15px;background:#0b1628;color:#fff}
button.secondary{background:#e8edf5;color:#172033}
button.gold{background:#d69b16;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lesson{border:1px solid #e2e7ef;border-radius:14px;padding:16px}
.lesson h3{margin-bottom:8px}
.lesson p{color:#687386;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.center{text-align:center}
.muted{color:#697386}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:10px;background:#fff4d6;color:#705500;margin-bottom:15px}
.error{background:#ffe5e5;color:#9b1c1c}
.success{background:#e5f8eb;color:#176b31}
.question{font-size:20px;font-weight:700;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#f4f6fa;color:#172033;border:2px solid transparent;margin:9px 0;padding:13px;border-radius:11px}
.option.selected{border-color:#0b1628;background:#e9eef7}
.resultBox{text-align:center;padding:20px}
.score{font-size:42px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e5e8ee;text-align:left}
th{background:#f4f6fa}
.rankMe{font-weight:700;background:#fff8df}
.small{font-size:12px}
@media(max-width:600px){
 main{padding:12px}
 header{padding:12px}
 .question{font-size:18px}
 .logo{font-size:18px}
}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">CreateLK English</div>
<div class="stats">
<div class="badge">🪙 <span id="coins">0</span></div>
<div class="badge">⭐ <span id="xp">0</span> XP</div>
<div class="badge" id="loginBox">Checking...</div>
</div>
</div>
</header>

<main>

<div id="notice"></div>

<section id="home">
<div class="card">
<div class="row">
<div>
<h1>Learn English</h1>
<p class="muted">Practice English lessons and earn Coins and XP.</p>
</div>
<button onclick="loadLessons()">Refresh</button>
</div>
</div>

<div id="lessons" class="grid"></div>
</section>

<section id="quiz" class="hidden"></section>

<section id="leaderboardSection">
<div class="card">
<div class="row">
<div>
<h2>Monthly Leaderboard</h2>
<p class="muted small">Coins and XP reset automatically each month.</p>
</div>
<button onclick="loadLeaderboard()">Refresh</button>
</div>
<div id="leaderboard"></div>
</div>
</section>

</main>

<script>
const API="https://eng.createlk.workers.dev";

let user=null;
let lessons=[];
let qs=[];
let answers={};
let results={};
let lessonId=0;
let lessonTitle="";
let attemptId="";
let n=0;
let coins=0;
let xp=0;
let submitting=false;
let audio=null;

const $=id=>document.getElementById(id);

function notice(msg,type=""){
 const el=$("notice");
 if(!msg){el.innerHTML="";return}
 el.innerHTML=`<div class="notice ${type}">${escapeHtml(msg)}</div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

async function api(path,opt={}){
 const r=await fetch(API+path,{
  credentials:"include",
  cache:"no-store",
  ...opt
 });

 let d={};
 try{d=await r.json()}catch{}

 if(!r.ok){
  const e=Error(d.error||`Request failed (${r.status})`);
  e.status=r.status;
  e.data=d;
  throw e;
 }

 return d;
}

const post=(p,b)=>api(p,{
 method:"POST",
 headers:{
  "Content-Type":"application/json"
 },
 body:JSON.stringify(b)
});

async function loadMe(){
 try{
  const d=await api("/api/me?_="+Date.now());

  user=d.user||null;

  coins=Number(d.coins??user?.coins??0);
  xp=Number(d.xp??user?.xp??0);

  $("coins").textContent=coins;
  $("xp").textContent=xp;

  $("loginBox").textContent=user
   ? `👤 ${user.name||"Account"}`
   : "Sign in";

  if($("qCoins"))$("qCoins").textContent=coins;
  if($("qXp"))$("qXp").textContent=xp;

 }catch(e){
  console.error("ME ERROR:",e);
  user=null;
  coins=0;
  xp=0;
  $("coins").textContent=0;
  $("xp").textContent=0;
  $("loginBox").textContent="Sign in";
 }
}

async function loadLessons(){
 try{
  const d=await api("/api/titles?_="+Date.now());
  lessons=d.titles||d.lessons||d.data||[];

  renderLessons();

 }catch(e){
  console.error("LESSONS ERROR:",e);
  notice(e.message||"Unable to load lessons.","error");
 }
}

function premium(l){
 return l.is_premium===true ||
        l.premium===true ||
        Number(l.is_premium)===1 ||
        Number(l.premium)===1;
}

function renderLessons(){
 const box=$("lessons");

 if(!lessons.length){
  box.innerHTML=`
   <div class="card">
    <p class="muted">No lessons available.</p>
   </div>`;
  return;
 }

 box.innerHTML=lessons.map((l,i)=>{
  const title=escapeHtml(l.title||l.name||`Lesson ${i+1}`);
  const id=Number(l.id||l.lesson_id||i+1);
  const isPremium=premium(l);

  return `
   <div class="lesson">
    <h3>${title}</h3>
    <p>${isPremium?"🔒 Premium lesson":"Free lesson"}</p>
    <button
     class="${isPremium?"gold":""}"
     onclick="openLesson(${i})">
     ${isPremium?"Unlock Premium":"Start Lesson"}
    </button>
   </div>`;
 }).join("");
}

async function openLesson(i){
 const l=lessons[i];
 if(!l)return;

 lessonId=Number(l.id||l.lesson_id||i+1);
 lessonTitle=l.title||l.name||`Lesson ${lessonId}`;

 if(premium(l)){
  if(!user){
   notice("Please sign in to purchase Premium access.","error");
   return;
  }

  if(user.is_premium===true){
   await loadQuiz();
   return;
  }

  await startPayment();
  return;
 }

 await loadQuiz();
}

async function startPayment(){
 try{
  const p=await post("/api/payment/start",{
   lesson_id:lessonId
  });

  if(!p.success||!p.payment_url){
   throw Error(p.error||"Unable to start payment.");
  }

  location.href=p.payment_url;

 }catch(e){
  console.error("PAYMENT ERROR:",e);
  notice(e.message||"Unable to start payment.","error");
 }
}

async function loadQuiz(){
 try{
  $("home").classList.add("hidden");
  $("leaderboardSection").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  $("quiz").innerHTML=`
   <div class="card center">
    <h2>Loading quiz...</h2>
    <p class="muted">Please wait.</p>
   </div>`;

  const start=await post("/api/quiz/start",{
   lesson_id:lessonId
  });

  if(!start.success){
   throw Error(start.error||"Unable to start quiz.");
  }

  attemptId=start.attempt_id||start.id||"";

  const d=await api(
   "/api/questions?lesson_id="+encodeURIComponent(lessonId)+"&_="+Date.now()
  );

  qs=d.questions||d.data||[];

  answers={};
  results={};
  n=0;
  submitting=false;

  if(!qs.length){
   $("quiz").innerHTML=`
    <div class="card">
     <h2>${escapeHtml(lessonTitle)}</h2>
     <p class="muted">No questions are available for this lesson.</p>
     <button onclick="closeQuiz()">Back</button>
    </div>`;
   return;
  }

  renderQuestion();

 }catch(e){
  console.error("QUIZ ERROR:",e);

  $("quiz").innerHTML=`
   <div class="card">
    <div class="notice error">
     ${escapeHtml(e.message||"Failed to load quiz.")}
    </div>
    <button onclick="closeQuiz()">Back</button>
   </div>`;

  notice("");
 }
}

function renderQuestion(){
 const q=qs[n];
 if(!q)return;

 const id=Number(q.id||q.question_id||n+1);
 const question=q.question||q.text||q.question_text||"";
 let options=q.options||q.choices||[];

 if(typeof options==="string"){
  try{options=JSON.parse(options)}catch{
   options=options.split("|").map(x=>x.trim());
  }
 }

 if(!Array.isArray(options)){
  options=[];
 }

 const selected=answers[id]??"";

 $("quiz").innerHTML=`
 <div class="card">
  <div class="row">
   <div>
    <h2>${escapeHtml(lessonTitle)}</h2>
    <p class="muted">Question ${n+1} of ${qs.length}</p>
   </div>
   <div class="stats">
    <div class="badge">🪙 <span id="qCoins">${coins}</span></div>
    <div class="badge">⭐ <span id="qXp">${xp}</span></div>
   </div>
  </div>

  <hr>

  <div class="question">${escapeHtml(question)}</div>

  <div>
   ${options.map((o,i)=>{
    const value=typeof o==="object"
      ?(o.value??o.answer??o.text??o.label??"")
      :o;

    return `
     <button
      class="option ${String(selected)===String(value)?"selected":""}"
      onclick='chooseAnswer(${JSON.stringify(id)},${JSON.stringify(String(value))})'>
      ${escapeHtml(String(value))}
     </button>`;
   }).join("")}
  </div>

  <div class="row" style="margin-top:20px">
   <button class="secondary" onclick="closeQuiz()">Exit</button>
   <button id="nextBtn" onclick="nextQuestion()">
    ${n===qs.length-1?"Submit Quiz":"Next"}
   </button>
  </div>
 </div>`;
}

function chooseAnswer(id,value){
 answers[id]=value;
 renderQuestion();
}

async function nextQuestion(){
 const q=qs[n];
 if(!q)return;

 const id=Number(q.id||q.question_id||n+1);

 if(answers[id]===undefined||answers[id]===""){
  notice("Please select an answer.","error");
  return;
 }

 if(n<qs.length-1){
  n++;
  renderQuestion();
  return;
 }

 await submitQuiz();
}

async function submitQuiz(){
 if(submitting)return;

 submitting=true;

 const finishBtn=$("nextBtn");
 if(finishBtn){
  finishBtn.disabled=true;
  finishBtn.textContent="Submitting...";
 }

 try{
  const submitAnswers=Object.entries(answers).map(([id,answer])=>({
   question_id:Number(id),
   answer
  }));

  const d=await post("/api/quiz/submit",{
   attempt_id:attemptId,
   lesson_id:lessonId,
   answers:submitAnswers
  });

  if(!d.success){
   throw Error(d.error||"Unable to submit quiz.");
  }

  const score=Number(d.score||0);
  const total=Number(d.total||qs.length);
  const coinsEarned=Number(d.reward_coins||0);
  const xpEarned=Number(d.reward_xp||0);

  coins=Number(
   d.total_coins??
   (coins+coinsEarned)
  );

  xp=Number(
   d.total_xp??
   (xp+xpEarned)
  );

  $("coins").textContent=coins;
  $("xp").textContent=xp;

  await loadMe();

  const percentage=Number(
   d.percentage??
   (total?Math.round(score/total*100):0)
  );

  $("quiz").innerHTML=`
   <div class="card resultBox">
    <h2>Quiz Completed 🎉</h2>

    <div class="score">${score}/${total}</div>

    <p>${percentage}% correct</p>

    <div class="grid" style="margin-top:20px">
     <div class="card">
      <h3>🪙 Coins Earned</h3>
      <strong>+${coinsEarned}</strong>
     </div>

     <div class="card">
      <h3>⭐ XP Earned</h3>
      <strong>+${xpEarned}</strong>
     </div>

     <div class="card">
      <h3>🪙 Total Coins</h3>
      <strong>${coins}</strong>
     </div>

     <div class="card">
      <h3>⭐ Total XP</h3>
      <strong>${xp}</strong>
     </div>
    </div>

    <div style="margin-top:20px">
     <button onclick="closeQuiz()">Back to Lessons</button>
     <button class="secondary" onclick="loadLeaderboard()">
      View Leaderboard
     </button>
    </div>
   </div>`;
   
 }catch(e){
  console.error("SUBMIT ERROR:",e);

  const already=e.data?.already_submitted===true;

  $("quiz").innerHTML=`
   <div class="card">
    <div class="notice ${already?"":"error"}">
     ${escapeHtml(e.message||"Unable to submit quiz.")}
    </div>

    <button onclick="closeQuiz()">Back</button>
   </div>`;

 }finally{
  submitting=false;
 }
}

function closeQuiz(){
 $("quiz").classList.add("hidden");
 $("home").classList.remove("hidden");
 $("leaderboardSection").classList.remove("hidden");
 attemptId="";
 answers={};
 results={};
 n=0;
 notice("");
 loadMe();
}

async function loadLeaderboard(){
 try{
  const box=$("leaderboard");

  box.innerHTML=`
   <div class="center">
    <p class="muted">Loading leaderboard...</p>
   </div>`;

  const d=await api("/api/leaderboard?_="+Date.now());

  const rows=d.leaderboard||d.data||[];

  if(!rows.length){
   box.innerHTML=`
    <p class="muted">No leaderboard data yet.</p>`;
   return;
  }

  box.innerHTML=`
   <div style="overflow-x:auto">
    <table>
     <thead>
      <tr>
       <th>#</th>
       <th>User</th>
       <th>Coins</th>
       <th>XP</th>
      </tr>
     </thead>
     <tbody>
      ${rows.map((r,i)=>`
       <tr class="${user&&Number(r.id)===Number(user.id)?"rankMe":""}">
        <td>${i+1}</td>
        <td>
         ${escapeHtml(r.name||"User")}
        </td>
        <td>🪙 ${Number(r.coins||0)}</td>
        <td>⭐ ${Number(r.xp||0)}</td>
       </tr>
      `).join("")}
     </tbody>
    </table>
   </div>`;

 }catch(e){
  console.error("LEADERBOARD ERROR:",e);
  $("leaderboard").innerHTML=`
   <div class="notice error">
    ${escapeHtml(e.message||"Unable to load leaderboard.")}
   </div>`;
 }
}

async function init(){
 await loadMe();
 await loadLessons();
 await loadLeaderboard();
}

init();
</script>

</body>
</html>
