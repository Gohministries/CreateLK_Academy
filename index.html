<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Pro — Premium AI Prompts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#171923}button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e8e9ef;height:68px;display:flex;align-items:center;padding:0 22px;gap:14px}
.logo{font-size:20px;font-weight:800;margin-right:auto}.credits{background:#f1efff;color:#5b35d5;border-radius:999px;padding:8px 13px;font-weight:700}
.add{border:0;background:#6d45ed;color:#fff;width:32px;height:32px;border-radius:50%;font-size:21px}.avatar{width:35px;height:35px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.signin{border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:9px}.menu{border:0;background:transparent;font-size:23px}
.hero{text-align:center;padding:52px 20px 30px}.hero h1{margin:0 0 10px;font-size:36px}.hero p{max-width:720px;margin:auto;color:#6d7280;line-height:1.6}
.search-wrap{max-width:850px;margin:0 auto 20px;padding:0 20px;display:flex;gap:10px}.search-wrap input{flex:1;min-width:0;border:1px solid #ddd;border-radius:10px;padding:13px 15px;background:#fff}.search-wrap button{border:0;background:#171923;color:#fff;border-radius:10px;padding:0 20px}
.filters{max-width:1100px;margin:auto;padding:0 20px 25px}.filters select{width:100%;border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 12px}.chip.active{background:#171923;color:#fff}
.grid{max-width:1200px;margin:auto;padding:10px 20px 50px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border:1px solid #e6e7ed;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(20,20,40,.04)}
.image{aspect-ratio:1;background:#eee;cursor:pointer;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block}.noimg{height:100%;display:flex;align-items:center;justify-content:center;color:#999}
.body{padding:15px}.body h3{margin:0 0 13px;font-size:16px;line-height:1.4}.actions{display:flex;gap:8px}.actions button{flex:1;border-radius:9px;padding:9px}.prompt{border:0;background:#6d45ed;color:#fff}.share{border:1px solid #ddd;background:#fff}
footer{text-align:center;padding:30px 20px;color:#888;border-top:1px solid #e5e6eb}.wa{position:fixed;right:20px;bottom:20px;background:#25d366;color:#fff;padding:12px 17px;border-radius:999px;text-decoration:none;z-index:30}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.hidden{display:none!important}.modal{position:relative;background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:25px}.close{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:28px}.btn{border:0;background:#6d45ed;color:#fff;border-radius:10px;padding:12px 16px}
.share-preview{border:1px solid #e5e5ea;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center;margin:15px 0}.share-preview img{width:72px;height:72px;border-radius:9px;object-fit:cover}.share-preview b{display:block}.share-preview small{color:#888;display:block;margin-top:4px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#171923;color:#fff;padding:11px 16px;border-radius:10px;z-index:200;display:none}.toast.show{display:block}.photo-full{width:100%;max-height:75vh;object-fit:contain;border-radius:10px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:29px}.signin{display:none}}@media(max-width:480px){.header{padding:0 12px}.logo{font-size:17px}.grid{grid-template-columns:1fr}.search-wrap{flex-direction:column}.search-wrap button{padding:12px}}
</style>
</head>

<body>

<header class="header">
<div class="logo">CreateLK Pro</div>
<div id="credits" class="credits">💎 0</div>
<button class="add" onclick="location.href='/pro/bank.html'">＋</button>
<div id="avatar" class="avatar">User</div>
<button id="signin" class="signin" onclick="location.href=API+'/auth/google?return=/pro/'">Sign in</button>
<button class="menu" onclick="openM('menuModal')">☰</button>
</header>

<section class="hero">
<h1>Premium prompts for creators.</h1>
<p>Professionally crafted AI prompts for creators, marketers, designers, entrepreneurs and businesses.</p>
</section>

<div id="searchArea">
<div class="search-wrap">
<input id="search" placeholder="Search prompts..." onkeydown="if(event.key==='Enter')load()">
<button onclick="load()">Search</button>
</div>
<div class="filters">
<select id="category" onchange="load()"><option value="">All Categories</option></select>
<div id="chips" class="chips"></div>
</div>
</div>

<main><div id="grid" class="grid"></div></main>

<footer>© 2026 CreateLK Pro · All rights reserved</footer>

<a class="wa" href="https://wa.me/" target="_blank" rel="noopener">WhatsApp</a>

<!-- MENU -->
<div id="menuModal" class="modal-bg hidden" onclick="if(event.target===this)closeM('menuModal')">
<div class="modal">
<button class="close" onclick="closeM('menuModal')">×</button>
<h2>Menu</h2>
<button class="btn" style="width:100%;margin-bottom:10px" onclick="location.href='/pro/bank.html'">💎 Add Coins</button>
<button class="btn" style="width:100%;margin-bottom:10px" onclick="openHistory()">Transaction History</button>
<button class="btn" style="width:100%;background:#eee;color:#222" onclick="location.href=API+'/auth/logout'">Logout</button>
</div>
</div>

<!-- HISTORY -->
<div id="historyModal" class="modal-bg hidden" onclick="if(event.target===this)closeM('historyModal')">
<div class="modal">
<button class="close" onclick="closeM('historyModal')">×</button>
<h2>Transaction History</h2>
<div id="history"></div>
</div>
</div>

<!-- PHOTO -->
<div id="photoModal" class="modal-bg hidden" onclick="if(event.target===this)closeM('photoModal')">
<div class="modal">
<button class="close" onclick="closeM('photoModal')">×</button>
<img id="fullImage" class="photo-full" alt="">
</div>
</div>

<!-- SHARE -->
<div id="shareModal" class="modal-bg hidden" onclick="if(event.target===this)closeM('shareModal')">
<div class="modal">
<button class="close" onclick="closeM('shareModal')">×</button>
<h2>📤 Share Prompt</h2>
<div id="sharePreview"></div>
<button class="btn" style="width:100%" onclick="nativeShare()">📤 Share</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API="https://pro.createlk.workers.dev",COST=10,$=id=>document.getElementById(id);
let me=null,shareData=null;

const openM=id=>$(id).classList.remove("hidden");
const closeM=id=>$(id).classList.add("hidden");

function toast(x){
const e=$("toast");e.textContent=x;e.classList.add("show");
clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2500);
}

function esc(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

async function api(path,opt={}){
const r=await fetch(API+path,{credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
if(!r.ok){let e=new Error("API");e.status=r.status;throw e}
return r.json();
}

async function meLoad(){
try{
const d=await api("/api/me"),u=d.user||d;
me=u;
$("credits").textContent="💎 "+Number(u?.credits??d?.credits??0);
if(u?.avatar_url||u?.picture)$("avatar").innerHTML=`<img src="${esc(u.avatar_url||u.picture)}" alt="">`;
$("signin").style.display="none";
}catch{me=null}
}

async function categories(){
try{
const d=await api("/api/pro/categories");
const a=d.categories||d.data||d||[];
$("category").innerHTML='<option value="">All Categories</option>'+a.map(c=>{
const n=typeof c==="string"?c:c.name||c.title||"";
return `<option value="${esc(n)}">${esc(n)}</option>`;
}).join("");
$("chips").innerHTML=a.slice(0,12).map(c=>{
const n=typeof c==="string"?c:c.name||c.title||"";
return `<button class="chip" onclick='selectCategory(${JSON.stringify(n)})'>${esc(n)}</button>`;
}).join("");
}catch{}
}

function selectCategory(n){
$("category").value=n;
document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent.trim()===n));
load();
}

function imageUrl(u,key){
u=String(u||key||"").trim();
if(!u)return "";
if(u.startsWith("https://createlk.com/api/pro/images/"))return API+"/api/pro/images/"+u.split("/api/pro/images/")[1];
if(u.startsWith("/api/pro/images/"))return API+u;
if(/^https?:\/\//.test(u))return u;
return API+"/api/pro/images/"+encodeURIComponent(u);
}

function card(p){
const id=Number(p.id),raw=p.title||"Premium Prompt",title=esc(raw),image=imageUrl(p.image_url,p.image_key);
return `<article class="card">
<div class="image" onclick='fullPhoto(${JSON.stringify(image)},${JSON.stringify(raw)})'>
${image?`<img src="${esc(image)}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=noimg>Photo unavailable</div>'">`:`<div class="noimg">Photo unavailable</div>`}
</div>
<div class="body"><h3>${title}</h3><div class="actions">
<button class="prompt" data-copy-id="${id}" onclick="copyPromptDirect(${id})">Copy</button>
<button class="share" onclick='sharePrompt(${id},${JSON.stringify(raw)},${JSON.stringify(image)})'>Share</button>
</div></div></article>`;
}

async function load(){
const s=($("search")?.value||"").trim(),c=$("category")?.value||"";
$("grid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px">Loading...</div>';
try{
const q=new URLSearchParams();
if(s)q.set("search",s);if(c)q.set("category",c);
const d=await api("/api/pro/prompts"+(q.toString()?"?"+q:""));
const a=d.prompts||d.data||d||[];
$("grid").innerHTML=Array.isArray(a)&&a.length?a.map(card).join(""):'<div style="grid-column:1/-1;text-align:center;padding:50px">No prompts found.</div>';
}catch{$("grid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px">Unable to load prompts.</div>'}
}

async function copyPromptDirect(id){
if(!me){location.href=API+"/auth/google?return=/pro/";return}
const credits=Number(me.credits||0);
if(credits<COST){toast("Not enough Coins. Please add Coins.");setTimeout(()=>location.href="/pro/bank.html",700);return}

const b=document.querySelector(`[data-copy-id="${id}"]`),old=b?.textContent;
if(b)b.textContent="Copying...";

try{
const d=await api("/api/pro/prompts/"+encodeURIComponent(id)+"/copy",{method:"POST"});
let text=d?.prompt;
if(typeof text==="object")text=text.text||text.prompt||text.content||"";
if(!text)throw Error();

if(navigator.clipboard)await navigator.clipboard.writeText(text);
else{
const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();
}

const nc=d.credits!=null?Number(d.credits):Math.max(0,credits-COST);
me.credits=nc;$("credits").textContent="💎 "+nc;
toast("Prompt copied! 10 Coins deducted.");
}catch(e){
if(e.status===401)location.href=API+"/auth/google?return=/pro/";
else if(e.status===402){toast("Not enough Coins.");setTimeout(()=>location.href="/pro/bank.html",700)}
else toast("Unable to copy prompt.");
}finally{if(b)b.textContent=old||"Copy"}
}

function sharePrompt(id,title,image){
const ref=new URLSearchParams(location.search).get("ref");
const u=new URL(location.origin+"/pro/");
u.searchParams.set("prompt",id);
if(ref)u.searchParams.set("ref",ref);

shareData={title:title||"CreateLK Pro Prompt",image:image||"",url:u.toString()};

$("sharePreview").innerHTML=`<div class="share-preview">
${image?`<img src="${esc(image)}" alt="">`:""}
<div><b>${esc(shareData.title)}</b><small>CreateLK Pro</small></div>
</div>`;

openM("shareModal");
}

async function nativeShare(){
if(!shareData)return;
if(!navigator.share){toast("Sharing is not supported on this device.");return}

try{
let file=null;

if(shareData.image){
try{
const r=await fetch(shareData.image,{credentials:"include",cache:"no-store"});
if(r.ok){
const b=await r.blob(),ext=(b.type||"image/jpeg").split("/")[1]||"jpg";
file=new File([b],"createlk-prompt."+ext,{type:b.type||"image/jpeg"});
}
}catch{}
}

const data={title:shareData.title,url:shareData.url};
if(file&&navigator.canShare?.({files:[file]}))data.files=[file];
await navigator.share(data);
}catch(e){if(e.name!=="AbortError")toast("Unable to share.")}
}

async function shared(){
const id=new URLSearchParams(location.search).get("prompt");
if(!id)return false;

try{
const d=await api("/api/pro/prompts/"+encodeURIComponent(id));
const p=d.prompt||d.data||d;
if(!p?.id)return false;

$("grid").innerHTML=card(p);
$("searchArea").style.display="none";
document.querySelector(".hero").style.display="none";
return true;
}catch(e){
console.error(e);
return false;
}
}

function fullPhoto(image,title){
if(!image)return;
$("fullImage").src=image;
$("fullImage").alt=title||"";
openM("photoModal");
}

async function openHistory(){
if(!me){location.href=API+"/auth/google?return=/pro/";return}
openM("historyModal");$("history").innerHTML="<p>Loading...</p>";
try{
const d=await api("/api/pro/credits/transactions"),a=d.transactions||d.data||d||[];
$("history").innerHTML=Array.isArray(a)&&a.length?a.map(x=>`
<div style="padding:12px 0;border-bottom:1px solid #eee">
<b>${esc(x.type||x.description||"Transaction")}</b>
<div style="color:#777">${esc(x.amount??x.coins??"")}</div>
</div>`).join(""):"<p>No transactions yet.</p>";
}catch{$("history").innerHTML="<p>Unable to load history.</p>"}
}

/* IMPORTANT: shared() runs BEFORE categories() and load() */
(async()=>{
await meLoad();
if(await shared())return;
await categories();
await load();
})();
</script>
</body>
</html>
