

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK.com</title>
<style>
:root{--bg:#0b1628;--p:#13233b;--g:#ffd166;--t:#f4f7fc;--m:#c1cee0;--b:#304561}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Arial}
header{position:sticky;top:0;background:#0a1527;border-bottom:1px solid var(--b);z-index:5}
nav,main{max-width:950px;margin:auto}
nav{display:flex;align-items:center;gap:7px;padding:7px}
button{border:0;border-radius:5px;padding:9px 11px;background:var(--g);color:#101b2c;font-weight:bold;cursor:pointer}
.secondary{background:#172a45;color:white;border:1px solid var(--b)}
.brand{display:flex;align-items:center;gap:6px;margin-right:auto;color:white;text-decoration:none;font-weight:bold;font-size:19px}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.gold{color:var(--g)}
#avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--g);cursor:pointer}
main{padding:6px}
.hero,.panel,.ad{background:var(--p);border:1px solid var(--b);border-radius:7px;margin-bottom:7px}
.hero,.panel{padding:10px}
.hero{text-align:center}
.hero h1{font-size:23px;margin:0}
.hero p,.status{color:var(--m)}
h3{margin:0 0 8px}
input,select{width:100%;padding:9px;background:#0c192c;color:white;border:1px solid var(--b);border-radius:5px;font:15px Arial}
.search,.filters{display:flex;gap:6px;margin-bottom:6px}
.search input,.filters>*{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.ad{overflow:hidden;text-align:center}
.ad img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.content{padding:8px;overflow-wrap:anywhere}
.title{display:block;margin-bottom:7px}
.card-buttons{display:flex;gap:5px}
.card-buttons button{flex:1;padding:8px 3px;font-size:12px}
.status{font-size:13px;margin:7px 0;overflow-wrap:anywhere}
.popup{display:none;position:fixed;inset:0;z-index:10;background:#000c;align-items:center;justify-content:center;padding:8px}
.popup.show{display:flex}
.box{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px}
.box h2{text-align:center;margin:0 25px 12px;font-size:20px}
.close{position:absolute;right:5px;top:5px;background:#172a45;color:white}
.detail-img{width:100%;max-height:280px;object-fit:contain}
.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.actions{display:flex;gap:6px;margin:9px 0}
.contact{flex:1;text-align:center;padding:10px 5px;border-radius:5px;text-decoration:none;font-weight:bold;color:#101b2c}
.call{background:var(--g)}
.wa{background:#25d366}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:38px;background:var(--p);padding:12px;min-width:160px;border:1px solid var(--b);border-radius:6px}
.menu.show{display:grid;gap:12px}
.menu a{color:var(--g);text-decoration:none}
footer{text-align:center;padding:12px;color:var(--m);font-size:12px}
[hidden]{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:350px){.grid{grid-template-columns:1fr}.brand{font-size:16px}}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/Createlk.com/file_000000005fe4821193c9d67f48b23b64.png" alt="CreateLK">
<span>CreateLK<span class="gold">.com</span></span>
</a>
<button id="login">Sign in</button>
<img id="avatar" alt="Google profile" hidden title="Your Google profile">
<div class="menu-wrap">
<button class="secondary" id="menuBtn">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#recent">Recent Posts</a>
<a href="/create/ads.html">My Ads / Post Ad</a>
<a href="/create/terms.html">Terms &amp; Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy &amp; Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Find what you need.</p>
<button id="postBtn">＋ Post a Free Ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<form id="searchForm" class="search">
<input id="q" type="search" placeholder="Search products, vehicles, phones...">
<button>Search</button>
</form>
<div class="filters">
<select id="category"><option value="">All categories</option></select>
<select id="district"><option value="">All districts</option></select>
</div>
<div id="browseStatus" class="status"></div>
</section>

<div id="results" class="grid"></div>
<p style="text-align:center"><button id="more" class="secondary" hidden>Load more</button></p>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<p style="text-align:center"><button id="moreRecent" class="secondary" hidden>Load more</button></p>
</section>
</main>

<footer>© <span id="year"></span> CreateLK.com</footer>

<div id="detailPopup" class="popup" role="dialog" aria-modal="true">
<div class="box">
<button class="close" id="closeDetail">✕</button>
<h2 id="detailTitle">Ad Details</h2>
<div id="detailBody"></div>
</div>
</div>

<script>
"use strict";

const API="https://create-public.createlk.workers.dev";
const POST_PAGE="/create/ads.html";
const $=id=>document.getElementById(id);

let browseAds=[],recentAds=[],bo=0,ro=0,timer;

$("year").textContent=new Date().getFullYear();

/* Navigation */
$("postBtn").onclick=()=>location.href=POST_PAGE;
$("login").onclick=()=>location.href=POST_PAGE;
$("avatar").onclick=()=>location.href=POST_PAGE;

$("menuBtn").onclick=e=>{
 e.stopPropagation();
 $("menu").classList.toggle("show");
};
document.onclick=e=>{
 if(!e.target.closest(".menu-wrap"))$("menu").classList.remove("show");
};

/* Google profile display */
function showGoogleProfile(profile){
 const avatar=$("avatar");
 const login=$("login");
 const logout=$("logout");

 if(profile && profile.picture){
  avatar.src=profile.picture;
  avatar.hidden=false;
  login.hidden=true;
  logout.hidden=false;
  avatar.onerror=()=>{
   avatar.hidden=true;
   login.hidden=false;
  };
 }else{
  avatar.removeAttribute("src");
  avatar.hidden=true;
  login.hidden=false;
  logout.hidden=true;
 }
}

function loadSavedProfile(){
 try{
  const profile=JSON.parse(
   localStorage.getItem("createlk_public_user") ||
   localStorage.getItem("createlk_user") ||
   localStorage.getItem("apebazar_user") || "null"
  );
  const token=
   localStorage.getItem("createlk_public_token") ||
   localStorage.getItem("createlk_token") ||
   sessionStorage.getItem("apebazar_token");

  if(token && profile){
   showGoogleProfile({
    picture:profile.picture || profile.picture_url ||
      profile.avatar || profile.photoURL || profile.photo_url || "",
    name:profile.name || profile.full_name || "",
    email:profile.email || ""
   });
  }else{
   showGoogleProfile(null);
  }
 }catch{
  showGoogleProfile(null);
 }
}

$("logout").onclick=e=>{
 e.preventDefault();
 [
  "createlk_public_token","createlk_public_user",
  "createlk_token","createlk_user",
  "apebazar_token","apebazar_user"
 ].forEach(k=>{
  localStorage.removeItem(k);
  sessionStorage.removeItem(k);
 });
 showGoogleProfile(null);
 location.href="/";
};

/* API */
async function api(path){
 let response;
 try{
  response=await fetch(API+path);
 }catch{
  throw Error("Cannot connect to API. Check Worker and CORS settings.");
 }
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||data.message||"Request failed");
 return data;
}

function rows(data){
 if(Array.isArray(data))return data;
 for(const key of ["listings","ads","results","data","items","categories","districts","locations"]){
  if(Array.isArray(data?.[key]))return data[key];
 }
 return [];
}

function say(id,text){$(id).textContent=text}

function fill(id,data,label){
 $(id).replaceChildren(new Option(label,""));
 rows(data).forEach(x=>{
  if(x.id!=null && x.name!=null){
   $(id).add(new Option(x.name,x.id));
  }
 });
}

async function loadOptions(){
 try{
  const [categories,districts]=await Promise.all([
   api("/api/categories"),
   api("/api/locations")
  ]);
  fill("category",categories,"All categories");
  fill("district",districts,"All districts");
 }catch(e){
  say("browseStatus","Filters unavailable: "+e.message);
 }
}

function safeURL(value){
 try{
  const url=new URL(value,location.href);
  return ["https:","http:"].includes(url.protocol)?url.href:"";
 }catch{return ""}
}

function photo(ad){
 return safeURL(ad.image_url||ad.photo_url||
  (Array.isArray(ad.photos)?ad.photos[0]:""));
}

function linkFor(ad){
 return ad.id==null?location.href:
  new URL("/create/ads.html?id="+encodeURIComponent(ad.id),location.origin).href;
}

async function copyLink(ad){
 const url=linkFor(ad);
 try{
  await navigator.clipboard.writeText(url);
  alert("Ad link copied!");
 }catch{
  prompt("Copy ad link:",url);
 }
}

function addText(parent,label,value){
 if(value==null||value==="")return;
 const p=document.createElement("p");
 p.className="detail-text";
 const b=document.createElement("b");
 b.textContent=label+": ";
 p.append(b,document.createTextNode(String(value)));
 parent.append(p);
}

function detail(ad){
 $("detailTitle").textContent=ad.title||"Ad Details";
 const body=$("detailBody");
 body.replaceChildren();

 const image=photo(ad);
 if(image){
  const img=document.createElement("img");
  img.className="detail-img";
  img.src=image;
  img.alt=ad.title||"Advertisement";
  body.append(img);
 }

 addText(body,"Description",ad.description);
 addText(body,"Category",ad.category_name||ad.category);
 addText(body,"District",ad.district_name||ad.district);
 addText(body,"City",ad.city_name||ad.city);

 const price=ad.price_lkr??ad.price;
 if(price!=null)addText(body,"Price","LKR "+Number(price).toLocaleString("en-LK"));

 addText(body,"Seller",ad.seller_name||ad.contact_name);

 const phone=ad.seller_phone||ad.phone;
 if(phone){
  const actions=document.createElement("div");
  actions.className="actions";

  const call=document.createElement("a");
  call.className="contact call";
  call.href="tel:"+phone;
  call.textContent="Call";

  const whatsapp=document.createElement("a");
  whatsapp.className="contact wa";
  let number=String(phone).replace(/\D/g,"");
  if(number.startsWith("0"))number="94"+number.slice(1);
  whatsapp.href="https://wa.me/"+number;
  whatsapp.target="_blank";
  whatsapp.rel="noopener noreferrer";
  whatsapp.textContent="WhatsApp";

  actions.append(call,whatsapp);
  body.append(actions);
 }

 const website=safeURL(ad.website_url);
 if(website){
  const a=document.createElement("a");
  a.href=website;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent="Visit Website";
  body.append(a);
 }

 const copy=document.createElement("button");
 copy.className="full secondary";
 copy.style.marginTop="10px";
 copy.textContent="Copy Ad Link";
 copy.onclick=()=>copyLink(ad);
 body.append(copy);

 $("detailPopup").classList.add("show");
 document.body.style.overflow="hidden";
}

function card(ad){
 const article=document.createElement("article");
 article.className="ad";

 const image=photo(ad);
 if(image){
  const img=document.createElement("img");
  img.src=image;
  img.alt=ad.title||"Advertisement";
  img.loading="lazy";
  img.onerror=()=>img.remove();
  article.append(img);
 }

 const content=document.createElement("div");
 content.className="content";

 const title=document.createElement("b");
 title.className="title";
 title.textContent=ad.title||"Untitled ad";

 const buttons=document.createElement("div");
 buttons.className="card-buttons";

 const view=document.createElement("button");
 view.textContent="View Post";
 view.onclick=()=>detail(ad);

 const copy=document.createElement("button");
 copy.className="secondary";
 copy.textContent="Copy Link";
 copy.onclick=()=>copyLink(ad);

 buttons.append(view,copy);
 content.append(title,buttons);
 article.append(content);
 return article;
}

function browseURL(){
 const params=new URLSearchParams();
 if($("q").value.trim())params.set("search",$("q").value.trim());
 if($("category").value)params.set("category",$("category").value);
 if($("district").value)params.set("location",$("district").value);
 return "/api/listings"+(params.size?"?"+params.toString():"");
}

$("searchForm").onsubmit=e=>{
 e.preventDefault();
 loadBrowse();
};

$("category").onchange=loadBrowse;
$("district").onchange=loadBrowse;

$("q").oninput=()=>{
 clearTimeout(timer);
 timer=setTimeout(loadBrowse,350);
};

async function loadBrowse(){
 say("browseStatus","Loading ads...");
 $("more").hidden=true;
 try{
  browseAds=rows(await api(browseURL()));
  bo=0;
  $("results").replaceChildren();
  renderBrowse();
 }catch(e){
  say("browseStatus","Could not load ads: "+e.message);
 }
}

function renderBrowse(){
 browseAds.slice(bo,bo+12).forEach(ad=>{
  $("results").append(card(ad));
 });
 bo+=12;
 $("more").hidden=bo>=browseAds.length;
 say("browseStatus",browseAds.length?
  browseAds.length+" ads found.":"No approved ads found.");
}
$("more").onclick=renderBrowse;

async function loadRecent(){
 say("recentStatus","Loading ads...");
 $("moreRecent").hidden=true;
 try{
  recentAds=rows(await api("/api/listings"));
  ro=0;
  $("recentResults").replaceChildren();
  renderRecent();
 }catch(e){
  say("recentStatus","Could not load recent ads: "+e.message);
 }
}

function renderRecent(){
 recentAds.slice(ro,ro+6).forEach(ad=>{
  $("recentResults").append(card(ad));
 });
 ro+=6;
 $("moreRecent").hidden=ro>=recentAds.length;
 say("recentStatus",recentAds.length?"":"No approved ads available yet.");
}
$("moreRecent").onclick=renderRecent;

$("closeDetail").onclick=()=>{
 $("detailPopup").classList.remove("show");
 document.body.style.overflow="";
};
$("detailPopup").onclick=e=>{
 if(e.target===$("detailPopup")){
  $("detailPopup").classList.remove("show");
  document.body.style.overflow="";
 }
};
document.onkeydown=e=>{
 if(e.key==="Escape"){
  $("detailPopup").classList.remove("show");
  document.body.style.overflow="";
 }
};

/* Start page */
loadSavedProfile();
loadOptions();
loadBrowse();
loadRecent();

/* Update profile if the user returns from the ad/login page */
window.addEventListener("pageshow",loadSavedProfile);
window.addEventListener("storage",loadSavedProfile);
</script>
</body>
</html>
