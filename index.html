<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1628">
<title>CreateLK English</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#0b1628;color:#dbe4f0}
button,input{font:inherit}
header{padding:15px;background:#0a1527;border-bottom:1px solid #263953}
main{max-width:900px;margin:auto;padding:15px}
h1{margin:0;font-size:26px}
.sub{color:#8fa1b8;margin-top:5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:8px;padding:10px 14px;background:#d6a928;color:#101b2c;font-weight:bold;cursor:pointer}
.card{background:#13233b;border:1px solid #263953;border-radius:13px;padding:15px;margin:12px 0}
.title{font-size:17px;font-weight:bold}
.desc{color:#8fa1b8;margin:6px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:10px;font-weight:bold;padding:4px 7px;border-radius:5px}
.free{background:#193b32;color:#a9dec9}
.premium{background:#4b3b17;color:#e7c86a}
.lock{background:#38252a;color:#e4aeb5}
.bar{height:7px;background:#263953;border-radius:10px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:#d6a928}
.small{font-size:12px;color:#8fa1b8}
#quiz{display:none}
.q{font-size:18px;line-height:1.5;margin:15px 0}
.option{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid #304560;border-radius:9px;background:#172942;color:#fff;cursor:pointer}
.option:hover{background:#203653}
#result{padding:12px;border-radius:9px;background:#172942;margin-top:12px}
#loading{text-align:center;padding:30px;color:#8fa1b8}
.avatar{width:35px;height:35px;border-radius:50%;vertical-align:middle}
</style>
</head>
<body>

<header>
<div class="top">
<div>
<h1>CreateLK English</h1>
<div class="sub">English Grammar MCQ Practice</div>
</div>
<button class="btn" id="login" onclick="location.href=API+'/auth/google'">Google Login</button>
</div>
</header>

<main>
<section id="home">
<div id="user"></div>
<div id="loading">Loading lessons...</div>
<div id="lessons"></div>
</section>

<section id="quiz">
<div class="card">
<div class="row">
<button class="btn" onclick="backHome()">← Lessons</button>
<span id="quizProgress" class="small"></span>
</div>
<h2 id="quizTitle"></h2>
<div id="question"></div>
<div id="options"></div>
<div id="result" style="display:none"></div>
</div>
</section>
</main>

<script>
const API="https://createlk-english-v2.createlk.workers.dev";
let user=null,lessons=[],questions=[],current=0,lesson=null;

const $=x=>document.getElementById(x);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function get(path,opt={}){
 const r=await fetch(API+path,{
  credentials:"include",
  cache:"no-store",
  ...opt
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

async function init(){
 try{
  const m=await get("/api/me");
  user=m.user;

  if(user){
   $("login").textContent="Logout";
   $("login").onclick=()=>location.href=API+"/auth/logout";
   $("user").innerHTML=`
    <div class="card">
     <div class="row">
      <div>
       <b>${esc(user.name)}</b>
       <div class="small">${esc(user.email)}</div>
      </div>
      <span class="badge ${user.membership==="premium"?"premium":"free"}">
       ${user.membership==="premium"?"PREMIUM":"FREE"}
      </span>
     </div>
     <div class="small" style="margin-top:8px">
      XP: ${Number(user.xp||0)}
     </div>
    </div>`;
  }

  const d=await get("/api/lessons");
  lessons=d.lessons||[];
  renderLessons();
 }catch(e){
  $("loading").textContent="Unable to load. "+e.message;
 }
}

function renderLessons(){
 $("loading").style.display="none";

 $("lessons").innerHTML=lessons.map(l=>{
  const p=l.progress||{};
  const free=Number(l.is_free)===1;
  const access=!!l.accessible;

  let button;

  if(!user){
   button=`<button class="btn" onclick="loginRequired()">
   ${free?"Start":"Login to Unlock"}</button>`;
  }else if(access){
   button=`<button class="btn" onclick="openLesson(${l.id})">
   ${p.answered?"Continue":"Start"}</button>`;
  }else{
   button=`<button class="btn" onclick="premiumRequired()">
   🔒 Premium</button>`;
  }

  return`
  <div class="card">
   <div class="row">
    <div class="title">${esc(l.title)}</div>
    <span class="badge ${free?"free":"premium"}">
     ${free?"FREE":"PREMIUM"}
    </span>
   </div>

   <div class="desc">${esc(l.description||"")}</div>

   <div class="small">
    ${p.answered||0}/${p.total||0}
    answered · ${p.percent||0}%
    ${p.completed?" · ✓ Completed":""}
   </div>

   <div class="bar">
    <div class="fill" style="width:${p.percent||0}%"></div>
   </div>

   <div class="row">
    <span class="small">
     ${p.correct||0} correct
    </span>
    ${button}
   </div>
  </div>`;
 }).join("");
}

function loginRequired(){
 location.href=API+"/auth/google";
}

function premiumRequired(){
 alert("Premium membership is required for this lesson.");
}

async function openLesson(id){
 try{
  const d=await get("/api/quiz?lesson="+id);
  lesson=d.lesson;
  questions=d.questions||[];
  current=0;

  $("home").style.display="none";
  $("quiz").style.display="block";
  $("quizTitle").textContent=lesson.title;

  showQuestion();
 }catch(e){
  if(e.message.includes("Login")){
   loginRequired();
  }else{
   alert(e.message);
  }
 }
}

function showQuestion(){
 const q=questions[current];

 if(!q){
  backHome();
  return;
 }

 $("quizProgress").textContent=
  `${current+1}/${questions.length}`;

 $("question").innerHTML=
  `<div class="q">${esc(q.question)}</div>`;

 $("options").innerHTML=["A","B","C","D"].map(x=>`
  <button class="option" onclick="answer('${x}')">
   <b>${x}.</b> ${esc(q["option_"+x.toLowerCase()])}
  </button>
 `).join("");

 $("result").style.display="none";
}

async function answer(ans){
 const q=questions[current];

 document.querySelectorAll(".option")
  .forEach(b=>b.disabled=true);

 try{
  const d=await get("/api/quiz/answer",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    question_id:q.id,
    answer:ans
   })
  });

  $("result").style.display="block";
  $("result").innerHTML=`
   <b>${d.correct?"✓ Correct":"✗ Incorrect"}</b>
   <br>Correct answer: <b>${esc(d.correct_answer)}</b>
   ${d.explanation?`<br><br>${esc(d.explanation)}`:""}
   <br><br>
   <button class="btn" onclick="nextQuestion()">
    ${current+1<questions.length?"Next":"Finish"}
   </button>
  `;
 }catch(e){
  alert(e.message);
  document.querySelectorAll(".option")
   .forEach(b=>b.disabled=false);
 }
}

function nextQuestion(){
 current++;

 if(current>=questions.length){
  backHome();
  return;
 }

 showQuestion();
}

async function backHome(){
 $("quiz").style.display="none";
 $("home").style.display="block";
 await init();
}

init();
</script>
</body>
</html>
