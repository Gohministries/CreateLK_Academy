<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<meta name="description" content="CreateLK Shop - Shop quality products online in Sri Lanka with Cash on Delivery.">
<title>CreateLK Shop | Find Products in Sri Lanka</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f5f6f8;color:#222}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{background:#102a56;color:#fff;position:sticky;top:0;z-index:20;padding:10px}
.head{max-width:1200px;margin:auto}
.top{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;flex:1}
.logo{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:6px}
.actions{display:flex;gap:6px}
.menu,.cart{border:0;border-radius:6px;padding:9px 12px;white-space:nowrap}
.menu{background:#ffffff20;color:#fff}
.cart{background:#fff;color:#102a56;font-weight:bold}
.search{width:100%;margin-top:9px;padding:11px;border:0;border-radius:6px;outline:0}
main{max-width:1200px;margin:auto;padding:15px}
.hero{background:linear-gradient(135deg,#102a56,#173c78);color:#fff;padding:24px 16px;border-radius:10px;margin-bottom:14px;text-align:center}
.hero h1{margin:0 0 7px;font-size:25px;white-space:nowrap}
.hero p{margin:0}
.categoryBox{margin-bottom:14px}
.categorySelect{width:100%;padding:12px;border:1px solid #d6d9df;border-radius:8px;background:#fff;font-weight:bold}
.msg{display:none;padding:11px;margin-bottom:12px;border-radius:6px;font-weight:bold}
.success{display:block;background:#e7f7ec;color:#176b32}
.error{display:block;background:#fdeaea;color:#a22}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
.product{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 5px #0001;display:flex;flex-direction:column;height:100%}
.gallery{position:relative;aspect-ratio:1;cursor:zoom-in}
.gallery img{width:100%;height:100%;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:#102a56cc;color:#fff;width:30px;height:30px;font-size:20px}
.prev{left:6px}.next{right:6px}
.count{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:3px 7px;border-radius:15px;font-size:11px}
.body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.name{font-weight:bold;line-height:1.3}
.price{font-size:17px;font-weight:bold;color:#102a56}
.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:4px}
.stock{font-size:12px}.in{color:#16813a}.out{color:#b22}
.cardButtons{display:grid;grid-template-columns:1fr;gap:6px;margin-top:auto;padding-top:8px}
.add,.share{border:0;border-radius:6px;font-weight:bold;height:38px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{background:#102a56;color:#fff}.add:disabled{background:#aaa}
.share{background:#e9eef7;color:#102a56}
.empty{text-align:center;padding:35px;grid-column:1/-1;color:#777}
.loadingGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-column:1/-1}
.skeletonCard{background:#fff;border-radius:8px;overflow:hidden;padding-bottom:10px}
.skeleton{background:#e7e9ed;position:relative;overflow:hidden}
.skeleton:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.4s infinite}
.skeletonImage{aspect-ratio:1}
.skeletonLine{height:14px;margin:12px 10px;width:75%;border-radius:5px}
.skeletonPrice{height:17px;margin:8px 10px;width:45%;border-radius:5px}
.skeletonButton{height:36px;margin:10px;border-radius:6px}
@keyframes shimmer{100%{transform:translateX(100%)}}
.overlay{position:fixed;inset:0;background:#0008;opacity:0;visibility:hidden;transition:.2s}
.overlay.show{opacity:1;visibility:visible}
#menuPanel{position:fixed;right:0;top:0;width:min(320px,88%);height:100%;background:#fff;z-index:31;transform:translateX(100%);transition:.25s}
.showMenu{transform:translateX(0)!important}
.menuHead,.cartHead{background:#102a56;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:bold}
.close{border:0;background:#ffffff22;color:#fff;border-radius:50%;width:34px;height:34px;font-size:22px}
.link{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #eee;color:#222;text-decoration:none;font-weight:bold}
#cart{position:fixed;right:0;top:0;width:min(430px,100%);height:100%;background:#fff;z-index:25;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.showCart{transform:translateX(0)!important}
.cartBody{padding:15px;overflow:auto;flex:1}
.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.item img{width:60px;height:60px;object-fit:contain}
.info{flex:1}.qty{display:flex;gap:5px;align-items:center}
.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:5px}
.remove{border:0;background:none;color:#c22;font-size:12px}
.row{display:flex;justify-content:space-between;margin:8px 0}
.total{font-size:19px;font-weight:bold;color:#102a56}
.form{display:grid;gap:9px;margin-top:15px}
.form input,.form textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;outline:none}
.form input.invalid,.form textarea.invalid{border-color:#c22}
.form textarea{min-height:75px}
.order{border:0;background:#102a56;color:#fff;padding:12px;border-radius:6px;font-weight:bold}
.order:disabled{opacity:.6}
#viewer{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center}
.viewerImg{max-width:94%;max-height:86%;object-fit:contain}
.vclose,.varrow{position:absolute;border:0;border-radius:50%;background:#ffffff25;color:#fff}
.vclose{top:15px;right:15px;width:42px;height:42px;font-size:27px}
.varrow{top:50%;width:42px;height:42px;font-size:30px}
.vprev{left:12px}.vnext{right:12px}
.vcount{position:absolute;bottom:20px;color:#fff;background:#000b;padding:5px 10px;border-radius:15px}
footer{margin-top:25px;background:#102a56;color:#fff;text-align:center;padding:20px;font-size:12px}
@media(max-width:900px){.products,.loadingGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){
.products,.loadingGrid{grid-template-columns:repeat(2,1fr);gap:8px}
.product .body{padding:8px}.name{font-size:13px}.price{font-size:15px}
.hero h1{font-size:21px}.brand{font-size:16px}.logo{width:36px;height:36px}
.menu,.cart{padding:8px 10px}.add,.share{font-size:12px;height:36px}
#cart{top:auto;bottom:0;height:88%;border-radius:15px 15px 0 0;transform:translateY(100%)}
}
@media(max-width:380px){
.brand{font-size:15px}.logo{width:34px;height:34px}.menu,.cart{padding:8px}
.hero h1{font-size:19px}.add,.share{font-size:11px}
}
</style>
</head>

<body>

<header>
<div class="head">
<div class="top">
<a class="brand" href="/shop/">
<img class="logo" src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png" alt="CreateLK Shop">
CreateLK <span style="color:#f5b041">Shop</span>
</a>
<div class="actions">
<button class="cart" onclick="cartOpen()">Cart (<span id="cc">0</span>)</button>
<button class="menu" onclick="menu(1)">☰</button>
</div>
</div>
<input id="search" class="search" placeholder="Search products..." type="search">
</div>
</header>

<div id="menuShade" class="overlay" onclick="menu(0)"></div>

<aside id="menuPanel">
<div class="menuHead">CreateLK Shop<button class="close" onclick="menu(0)">×</button></div>
<a class="link" href="/shop/terms.html">Terms & Conditions <span>›</span></a>
<a class="link" href="/shop/privacy.html">Privacy Policy <span>›</span></a>
<a class="link" href="/shop/refund.html">Refund & Returns <span>›</span></a>
</aside>

<main>
<section class="hero">
<h1>Shop Online in Sri Lanka 🇱🇰</h1>
<p>Quality products with Cash on Delivery.</p>
</section>

<div class="categoryBox">
<select id="categorySelect" class="categorySelect">
<option value="">All Categories</option>
</select>
</div>

<div id="msg" class="msg"></div>
<section id="products" class="products"></section>
</main>

<div id="cartShade" class="overlay" onclick="cartClose()"></div>

<aside id="cart">
<div class="cartHead">Your Cart<button class="close" onclick="cartClose()">×</button></div>
<div class="cartBody">
<div id="items"></div>
<div class="row"><span>Subtotal</span><b id="sub">LKR 0</b></div>
<div class="row"><span>Delivery</span><b>LKR 400</b></div>
<div class="row total"><span>Total</span><b id="total">LKR 400</b></div>

<div class="form">
<input id="name" placeholder="Full Name *" required>
<input id="district" placeholder="District">
<input id="city" placeholder="City / Town *" required>
<textarea id="address" placeholder="Delivery Address *" required></textarea>
<input id="mobile" placeholder="Mobile 1 *" type="tel" required>
<input id="mobile2" placeholder="Mobile 2 (Optional)" type="tel">
<button id="order" class="order" onclick="placeOrder()">Place COD Order</button>
</div>
</div>
</aside>

<div id="viewer" onclick="viewerBg(event)">
<button class="vclose" onclick="viewerClose()">×</button>
<button id="vp" class="varrow vprev" onclick="viewerMove(-1,event)">‹</button>
<img id="vi" class="viewerImg" alt="Product image">
<button id="vn" class="varrow vnext" onclick="viewerMove(1,event)">›</button>
<div id="vcount" class="vcount"></div>
</div>

<footer>© 2026 CreateLK Shop. All rights reserved.</footer>

<script>
const API="https://shop-api.createlk.workers.dev",D=400,$=x=>document.getElementById(x);
const PID=new URLSearchParams(location.search).get("product");
let cart=[],cat="",timer,imgs=[],vi=0,touchX=0;

const money=n=>Number(n||0).toLocaleString("en-LK");
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));

async function api(url,o={}){
const r=await fetch(url,{...o,headers:{"Accept":"application/json",...(o.headers||{})}});
const d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||d.message||"Server error");
return d;
}

const lock=x=>document.body.style.overflow=x?"hidden":"";

function menu(x){
$("menuPanel").classList.toggle("showMenu",x);
$("menuShade").classList.toggle("show",x);
lock(x);
}

function cartOpen(){
renderCart();
$("cart").classList.add("showCart");
$("cartShade").classList.add("show");
lock(1);
}

function cartClose(){
$("cart").classList.remove("showCart");
$("cartShade").classList.remove("show");
lock(0);
}

function msg(t,c="success"){
$("msg").textContent=t;
$("msg").className="msg "+c;
}

["name","district","city","address","mobile","mobile2"].forEach(id=>{
$(id).oninput=()=>$(id).classList.remove("invalid");
});

function imageList(p){
const a=Array.isArray(p.images)
?p.images.map(x=>typeof x=="string"?x:x?.image_key||x?.key||x?.url).filter(Boolean)
:[];
return a.length?a:p.image_key?[p.image_key]:[];
}

async function categories(){
try{
const d=await api(API+"/api/categories");

(d||[])
.filter(x=>!["all","all categories"].includes(String(x.name).toLowerCase().trim()))
.forEach(x=>{
const o=document.createElement("option");
o.value=x.id;
o.textContent=x.name;
$("categorySelect").append(o);
});
}catch(e){}
}

$("categorySelect").onchange=function(){
cat=this.value;
products();
};

function loading(){
$("products").innerHTML=`<div class="loadingGrid">${Array(4).fill(0).map(()=>`
<div class="skeletonCard">
<div class="skeleton skeletonImage"></div>
<div class="skeleton skeletonLine"></div>
<div class="skeleton skeletonPrice"></div>
<div class="skeleton skeletonButton"></div>
</div>`).join("")}</div>`;
}

async function products(){
loading();

try{
const q=new URLSearchParams();

if(cat)q.set("category",cat);

const s=$("search").value.trim();
if(s)q.set("search",s);

const d=await api(API+"/api/products?"+q);

let list=Array.isArray(d)?d:[];

if(PID){
list=list.filter(p=>String(p.id)===String(PID));
}

draw(list);

}catch(e){
$("products").innerHTML=`<div class="empty">${esc(e.message)}</div>`;
}
}

function draw(list){
const box=$("products");

if(!list.length){
box.innerHTML=`<div class="empty">${PID?"Product not found.":"No products found."}</div>`;
return;
}

box.innerHTML="";

list.forEach(p=>{
const price=+p.price||0;
const sale=+p.sale_price>0&&+p.sale_price<price?+p.sale_price:null;
const stock=+p.stock||0;
const a=imageList(p);
let i=0;

const card=document.createElement("article");
card.className="product";

card.innerHTML=`
<div class="gallery">
${a.length
?`<img src="${API}/images/${encodeURIComponent(a[0])}" alt="${esc(p.name)}">`
:`<div class="empty">No Image</div>`}
${a.length>1
?`<button class="arrow prev">‹</button>
<button class="arrow next">›</button>
<span class="count">1 / ${a.length}</span>`
:""}
</div>

<div class="body">
<div class="name">${esc(p.name)}</div>

<div class="price">
LKR ${money(sale??price)}
${sale?`<span class="old">LKR ${money(price)}</span>`:""}
</div>

<div class="stock ${stock?"in":"out"}">
${stock?stock+" available":"Out of stock"}
</div>

<div class="cardButtons">
<button class="add" ${stock?"":"disabled"}>
${stock?"Add to Cart":"Out of Stock"}
</button>

<button class="share">↗ Share</button>
</div>
</div>`;

box.append(card);

if(a.length){
const g=card.querySelector(".gallery");
const im=g.querySelector("img");

const change=n=>{
i=(i+n+a.length)%a.length;
im.src=API+"/images/"+encodeURIComponent(a[i]);

const c=g.querySelector(".count");
if(c)c.textContent=`${i+1} / ${a.length}`;
};

g.onclick=e=>{
if(!e.target.classList.contains("arrow"))viewer(a,i);
};

if(a.length>1){
g.querySelector(".prev").onclick=e=>{
e.stopPropagation();
change(-1);
};

g.querySelector(".next").onclick=e=>{
e.stopPropagation();
change(1);
};
}
}

card.querySelector(".add").onclick=()=>add(p.id);
card.querySelector(".share").onclick=()=>shareProduct(p,a[i]);
});
}

async function shareProduct(p,imageKey){
const price=+p.sale_price>0&&+p.sale_price<+p.price
?+p.sale_price
:+p.price;

const url=location.origin+"/shop/?product="+encodeURIComponent(p.id);

const text=`${p.name}
Price: LKR ${money(price)}

Shop now:
${url}`;

try{
let file=null;

if(imageKey)try{
const r=await fetch(API+"/images/"+encodeURIComponent(imageKey));

if(r.ok){
const b=await r.blob();
const bm=await createImageBitmap(b);
const c=document.createElement("canvas");
const x=c.getContext("2d");
const s=1000;

c.width=c.height=s;
x.fillStyle="#fff";
x.fillRect(0,0,s,s);

const z=Math.min(s/bm.width,s/bm.height);
const w=bm.width*z;
const h=bm.height*z;

x.drawImage(bm,(s-w)/2,(s-h)/2,w,h);

const q=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));

if(q)
file=new File([q],"createlk-product.jpg",{type:"image/jpeg"});
}
}catch(e){}

if(file&&navigator.share&&navigator.canShare?.({files:[file]})){
return navigator.share({
title:p.name,
text,
url,
files:[file]
});
}

if(navigator.share){
return navigator.share({
title:p.name,
text,
url
});
}

await navigator.clipboard.writeText(text);
msg("Product details and link copied.");

}catch(e){
if(e.name!="AbortError")
try{
await navigator.clipboard.writeText(text);
msg("Product details and link copied.");
}catch(x){
msg("Unable to share this product.","error");
}
}
}

async function add(id){
try{
const p=await api(API+"/api/products/"+id);
const stock=+p.stock||0;

if(!stock)
return msg("This product is out of stock.","error");

const x=cart.find(x=>+x.id===+p.id);

if(x){
if(x.qty+1>stock)
return msg(`Only ${stock} item(s) available.`,"error");

x.qty++;
}else{
const a=imageList(p);
const price=+p.sale_price>0&&+p.sale_price<+p.price
?+p.sale_price
:+p.price;

cart.push({
id:p.id,
name:p.name,
price,
image:a[0]||"",
qty:1
});
}

save();
renderCart();
msg("Product added to cart.");

}catch(e){
msg(e.message,"error");
}
}

function save(){
localStorage.setItem("createlk_cart",JSON.stringify(cart));
$("cc").textContent=cart.reduce((n,x)=>n+(+x.qty||0),0);
}

function load(){
try{
cart=JSON.parse(localStorage.getItem("createlk_cart")||"[]");
}catch(e){
cart=[];
}

if(!Array.isArray(cart))cart=[];

save();
}

function renderCart(){
const box=$("items");
let sub=0;

if(!cart.length){
box.innerHTML='<div class="empty">Your cart is empty.</div>';
}else{
box.innerHTML="";

cart.forEach((x,i)=>{
sub+=+x.price*x.qty;

const d=document.createElement("div");
d.className="item";

d.innerHTML=`
${x.image
?`<img src="${API}/images/${encodeURIComponent(x.image)}" alt="">`
:""}

<div class="info">
<b>${esc(x.name)}</b><br>
LKR ${money(x.price)} × ${x.qty}<br>
<button class="remove" onclick="removeItem(${i})">Remove</button>
</div>

<div class="qty">
<button onclick="qty(${i},-1)">−</button>
${x.qty}
<button onclick="qty(${i},1)">+</button>
</div>`;

box.append(d);
});
}

$("sub").textContent="LKR "+money(sub);
$("total").textContent="LKR "+money(sub+D);

save();
}

function qty(i,n){
cart[i].qty+=n;

if(cart[i].qty<1)
cart.splice(i,1);

renderCart();
}

function removeItem(i){
cart.splice(i,1);
renderCart();
}

async function placeOrder(){
if(!cart.length)
return msg("Your cart is empty.","error");

for(const [id,label] of [
["name","Full Name"],
["city","City / Town"],
["address","Delivery Address"],
["mobile","Mobile Number"]
]){
$(id).classList.remove("invalid");

if(!$(id).value.trim()){
$(id).classList.add("invalid");
$(id).focus();
return msg(`Please enter your ${label}.`,"error");
}
}

const customer={
name:$("name").value.trim(),
district:$("district").value.trim(),
city:$("city").value.trim(),
address:$("address").value.trim(),
mobile_1:$("mobile").value.trim(),
mobile_2:$("mobile2").value.trim()
};

if(!/^(?:0?7\d{8}|\+947\d{8}|947\d{8})$/.test(customer.mobile_1.replace(/[\s-]/g,""))){
$("mobile").classList.add("invalid");
return msg("Please enter a valid Sri Lankan mobile number.","error");
}

const b=$("order");

b.disabled=true;
b.textContent="Processing...";

try{
const d=await api(API+"/api/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
customer,
items:cart.map(x=>({
product_id:+x.id,
quantity:+x.qty
}))
})
});

if(d.success===false)
throw Error(d.error||"Order failed");

cart=[];
save();
renderCart();

document.querySelectorAll(".form input,.form textarea").forEach(x=>{
x.value="";
x.classList.remove("invalid");
});

cartClose();

msg(
d.order_id
?`Order placed successfully! Order #${d.order_id}.`
:"Order placed successfully!"
);

}catch(e){
msg(e.message||"Unable to place order. Please try again.","error");
}

b.disabled=false;
b.textContent="Place COD Order";
}

function viewer(a,i){
imgs=a;
vi=i;

$("viewer").style.display="flex";
$("vi").src=API+"/images/"+encodeURIComponent(a[i]);

$("vcount").textContent=`${i+1} / ${a.length}`;

$("vp").style.display=
$("vn").style.display=
a.length>1?"block":"none";

lock(1);
}

function viewerMove(n,e){
e.stopPropagation();

if(imgs.length<2)return;

vi=(vi+n+imgs.length)%imgs.length;

$("vi").src=API+"/images/"+encodeURIComponent(imgs[vi]);

$("vcount").textContent=`${vi+1} / ${imgs.length}`;
}

function viewerClose(){
$("viewer").style.display="none";
lock(0);
}

function viewerBg(e){
if(e.target===$("viewer"))
viewerClose();
}

$("viewer").addEventListener(
"touchstart",
e=>touchX=e.touches[0].clientX,
{passive:true}
);

$("viewer").addEventListener(
"touchend",
e=>{
const x=e.changedTouches[0].clientX-touchX;
if(Math.abs(x)>50)
viewerMove(x<0?1:-1,e);
},
{passive:true}
);

$("search").oninput=()=>{
clearTimeout(timer);
timer=setTimeout(products,350);
};

document.onkeydown=e=>{
if(e.key==="Escape"){
viewerClose();
menu(0);
cartClose();
}
};

load();
categories();
products();
</script>

</body>
</html>
