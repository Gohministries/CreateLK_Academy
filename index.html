<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}button,input,textarea{font:inherit}button{cursor:pointer}
.header{background:#102a56;color:#fff;position:sticky;top:0;z-index:50}.header-inner,.container{max-width:1200px;margin:auto}.header-inner{padding:10px 12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:18px;font-weight:700}.logo{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:6px}.cart-btn{border:0;background:#fff;color:#102a56;border-radius:6px;padding:9px 13px;font-weight:700}.search{width:100%;margin-top:10px;padding:11px;border:0;border-radius:6px;outline:0}
.container{padding:15px 12px}.hero{background:linear-gradient(135deg,#102a56,#173c78);color:#fff;border-radius:10px;padding:22px 18px;margin-bottom:15px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.9}
.categories{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.category{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:20px;padding:8px 13px;white-space:nowrap}.category.active{background:#102a56;color:#fff}
.status{display:none;margin:10px 0;padding:11px;border-radius:7px;font-weight:600}.status.success{display:block;background:#e8f7ed;color:#176b32}.status.error{display:block;background:#fdeaea;color:#a32121}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 1px 5px #0001;display:flex;flex-direction:column}.gallery{position:relative;aspect-ratio:1;overflow:hidden;background:#fff}.gallery img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:#102a56cc;color:#fff;font-size:21px;padding:0}.gprev{left:7px}.gnext{right:7px}.gcount{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;font-size:11px;padding:4px 8px;border-radius:12px}.nopic{height:100%;display:grid;place-items:center;color:#999}
.product-body{padding:10px;display:flex;flex-direction:column;flex:1}.product-name{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:6px}.price{font-size:18px;font-weight:700;color:#102a56}.old-price{font-size:13px;color:#888;text-decoration:line-through;margin-left:5px}.stock{font-size:12px;font-weight:600;margin:5px 0}.in-stock{color:#17813a}.out-stock{color:#b32222}.add-btn{margin-top:auto;padding:9px;border:0;border-radius:6px;background:#102a56;color:#fff;font-weight:700}.add-btn:disabled{background:#aaa}.empty{grid-column:1/-1;text-align:center;padding:35px;color:#666}

/* IMAGE MODAL */
.image-modal{position:fixed;inset:0;background:#000e;z-index:999;display:none;place-items:center;padding:20px}.image-modal.show{display:grid}.image-view{position:relative;width:100%;height:100%;display:grid;place-items:center}.image-modal img{max-width:90%;max-height:88vh;object-fit:contain;user-select:none}.image-close{position:absolute;right:8px;top:8px;width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#102a56;font-size:30px;line-height:46px;text-align:center;padding:0;z-index:10;box-shadow:0 2px 10px #0006}.image-close:hover{background:#f1f1f1}.image-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#102a56;font-size:32px;line-height:1;z-index:3;display:none}.image-prev{left:15px}.image-next{right:15px}.image-modal.multi .image-nav{display:block}.image-counter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;z-index:3}

/* CART */
.cart-overlay{position:fixed;inset:0;background:#0006;z-index:100;opacity:0;visibility:hidden}.cart-overlay.show{opacity:1;visibility:visible}.cart-drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:#fff;z-index:101;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}.cart-drawer.show{transform:translateX(0)}.cart-header{background:#102a56;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}.cart-title{font-size:20px;font-weight:700}.close-cart{border:0;background:#ffffff22;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px}.cart-content{overflow:auto;padding:15px;flex:1}.cart-item{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.cart-item img{width:60px;height:60px;object-fit:contain}.cart-info{flex:1;min-width:0}.cart-name{font-weight:700;font-size:14px}.cart-price{font-size:13px;color:#555;margin:3px 0}.qty{display:flex;align-items:center;gap:5px}.qty button{width:29px;height:29px;border:1px solid #ddd;background:#fff;border-radius:5px}.remove{border:0;background:none;color:#c22;font-size:12px}.summary{border-top:1px solid #ddd;margin-top:14px;padding-top:10px}.row{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:20px;font-weight:700;color:#102a56}.form{display:grid;gap:9px;margin-top:15px}.form input,.form textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}.form textarea{min-height:75px}.checkout-btn{border:0;background:#102a56;color:#fff;padding:12px;border-radius:7px;font-weight:700}.checkout-btn:disabled{opacity:.6}.clear-cart{border:1px solid #ddd;background:#fff;color:#b32222;padding:9px;border-radius:6px}.cart-empty{text-align:center;padding:30px;color:#777}
.footer{margin-top:30px;background:#102a56;color:#fff;padding:23px;text-align:center}.footer a{color:#fff;text-decoration:none;margin:0 7px;font-size:13px}.footer p{font-size:12px;opacity:.8}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hero h1{font-size:23px}.product-body{padding:8px}.product-name{font-size:14px}.price{font-size:16px}.cart-drawer{top:auto;bottom:0;width:100%;height:min(88vh,700px);transform:translateY(100%);border-radius:16px 16px 0 0}.cart-drawer.show{transform:translateY(0)}.image-modal{padding:10px}.image-modal img{max-width:92%;max-height:82vh}.image-close{right:8px;top:8px;width:44px;height:44px;font-size:28px;line-height:44px}.image-nav{width:42px;height:42px;font-size:28px}.image-prev{left:8px}.image-next{right:8px}}@media(max-width:330px){.products{gap:6px}.product-body{padding:6px}.product-name{font-size:13px}.price{font-size:15px}.add-btn{padding:8px 3px;font-size:12px}}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="topbar">
<a href="/shop/" class="brand"><img class="logo" src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png" alt="CreateLK Shop"><span>CreateLK <b style="color:#f5b041">Shop</b></span></a>
<button class="cart-btn" onclick="toggleCart()">Cart (<span id="cartCount">0</span>)</button>
</div>
<input id="search" class="search" placeholder="Search products..." type="search">
</div>
</header>

<main class="container">
<section class="hero"><h1>Shop Online in Sri Lanka 🇱🇰</h1><p>Quality products with Cash on Delivery.</p></section>
<div id="categories" class="categories"></div>
<div id="status" class="status"></div>
<section id="products" class="products"><div class="empty">Loading products...</div></section>
</main>

<div id="imageModal" class="image-modal">
<div class="image-view">
<button id="imageClose" class="image-close" type="button" aria-label="Close image">×</button>
<button id="largePrev" class="image-nav image-prev" type="button">‹</button>
<img id="largeImage" draggable="false" alt="Product image">
<button id="largeNext" class="image-nav image-next" type="button">›</button>
<div id="imageCounter" class="image-counter"></div>
</div>
</div>

<div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>

<aside id="cartDrawer" class="cart-drawer">
<div class="cart-header"><div class="cart-title">Your Cart</div><button class="close-cart" onclick="closeCart()">×</button></div>
<div class="cart-content">
<div id="cartItems"></div>
<div class="summary">
<div class="row"><span>Subtotal</span><b id="subtotal">LKR 0</b></div>
<div class="row"><span>Delivery</span><b>LKR 400</b></div>
<div class="row total"><span>Total</span><b id="total">LKR 400</b></div>
</div>
<div class="form">
<input id="customerName" placeholder="Full Name *">
<input id="district" placeholder="District">
<input id="city" placeholder="City / Town *">
<textarea id="address" placeholder="Delivery Address *"></textarea>
<input id="mobile1" type="tel" placeholder="Mobile 1 *">
<input id="mobile2" type="tel" placeholder="Mobile 2 (Optional)">
<button id="checkoutBtn" class="checkout-btn" onclick="placeOrder()">Place COD Order</button>
<button class="clear-cart" onclick="clearCart()">Clear Cart</button>
</div>
</div>
</aside>

<footer class="footer">
<a href="/shop/terms.html">Terms</a>
<a href="/shop/privacy.html">Privacy</a>
<a href="/shop/refund.html">Refund & Returns</a>
<p>© 2026 CreateLK Shop. All rights reserved.</p>
</footer>

<script>
const API="https://shop-api.createlk.workers.dev",DELIVERY=400,$=id=>document.getElementById(id);
let cart=[],category="",timer,largeImages=[],largeIndex=0,touchX=0;

try{cart=JSON.parse(localStorage.getItem("createlk_cart")||"[]")}catch{cart=[]}

const money=n=>Number(n||0).toLocaleString("en-LK");
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
const save=()=>localStorage.setItem("createlk_cart",JSON.stringify(cart));
const count=()=>cart.reduce((a,x)=>a+Number(x.qty),0);
const available=p=>p.available!==false&&p.status!=="unavailable"&&p.status!=="inactive"&&Number(p.stock??1)!==0;

const images=p=>{
let a=Array.isArray(p.images)?p.images.map(x=>typeof x=="string"?x:x?.image_key||x?.key||x?.url).filter(Boolean):[];
return[...new Set(a.length?a:(p.image_key?[p.image_key]:[]))]
};

function msg(t,c){$("status").textContent=t;$("status").className="status "+c}
function updateCount(){$("cartCount").textContent=count()}

async function api(url,opt={}){
let r=await fetch(url,{...opt,headers:{"Accept":"application/json",...(opt.headers||{})}}),d={};
try{d=await r.json()}catch{}
if(!r.ok)throw Error(d.error||d.message||"Server error");
return d;
}

function toggleCart(){
$("cartDrawer").classList.toggle("show");
$("cartOverlay").classList.toggle("show");
document.body.style.overflow=$("cartDrawer").classList.contains("show")?"hidden":"";
renderCart();
}

function closeCart(){
$("cartDrawer").classList.remove("show");
$("cartOverlay").classList.remove("show");
document.body.style.overflow="";
}

function openImage(list,index=0){
largeImages=list||[];
largeIndex=index||0;
if(!largeImages.length)return;
$("imageModal").classList.add("show");
document.body.style.overflow="hidden";
showLargeImage();
}

function showLargeImage(){
if(!largeImages.length)return;
$("largeImage").src=API+"/images/"+encodeURIComponent(largeImages[largeIndex]);
$("imageCounter").textContent=`${largeIndex+1} / ${largeImages.length}`;
$("imageModal").classList.toggle("multi",largeImages.length>1);
}

function largeSlide(dir,e){
if(e)e.stopPropagation();
if(largeImages.length<2)return;
largeIndex=(largeIndex+dir+largeImages.length)%largeImages.length;
showLargeImage();
}

function closeImage(){
$("imageModal").classList.remove("show");
$("largeImage").src="";
largeImages=[];
largeIndex=0;
if(!$("cartDrawer").classList.contains("show"))document.body.style.overflow="";
}

$("imageClose").onclick=e=>{
e.stopPropagation();
closeImage();
};

$("imageModal").onclick=e=>{
if(e.target===$("imageModal"))closeImage();
};

$("largePrev").onclick=e=>largeSlide(-1,e);
$("largeNext").onclick=e=>largeSlide(1,e);

$("largeImage").ontouchstart=e=>touchX=e.touches[0].clientX;
$("largeImage").ontouchend=e=>{
let d=e.changedTouches[0].clientX-touchX;
if(Math.abs(d)>45)largeSlide(d<0?1:-1,e);
};

document.addEventListener("keydown",e=>{
if($("imageModal").classList.contains("show")){
if(e.key=="ArrowLeft")largeSlide(-1);
if(e.key=="ArrowRight")largeSlide(1);
if(e.key=="Escape")closeImage();
}else if(e.key=="Escape")closeCart();
});

async function loadCategories(){
let box=$("categories");box.innerHTML="";
let all=document.createElement("button");
all.className="category active";
all.textContent="All";
all.onclick=()=>{category="";active(all);loadProducts()};
box.append(all);

try{
let data=await api(API+"/api/categories");
data.filter(c=>!["all","all categories"].includes(String(c.name).toLowerCase().trim())).forEach(c=>{
let b=document.createElement("button");
b.className="category";
b.textContent=c.name;
b.onclick=()=>{category=c.id;active(b);loadProducts()};
box.append(b);
});
}catch{}
}

function active(b){
document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
}

async function loadProducts(){
let box=$("products"),q=$("search").value.trim(),p=new URLSearchParams();
if(category)p.set("category",category);
if(q)p.set("search",q);
box.innerHTML='<div class="empty">Loading products...</div>';

try{
let d=await api(API+"/api/products?"+p);
renderProducts(Array.isArray(d)?d:[]);
}catch(e){
box.innerHTML=`<div class="empty">${esc(e.message)}<br><br><button onclick="loadProducts()">Try Again</button></div>`;
}
}

function renderProducts(list){
let box=$("products");

if(!list.length){
let q=$("search").value.trim();
box.innerHTML=`<div class="empty">${q?`No products found for "${esc(q)}".`:"No products available."}</div>`;
return;
}

box.innerHTML="";

list.forEach(p=>{
let imgs=images(p),price=Number(p.price||0);
let sale=Number(p.sale_price)>0&&Number(p.sale_price)<price?Number(p.sale_price):null;
let avail=available(p);

let card=document.createElement("div");
card.className="product";

let g=document.createElement("div");
g.className="gallery";

g.innerHTML=imgs.length
?`<img src="${API}/images/${encodeURIComponent(imgs[0])}" alt="${esc(p.name)}">${imgs.length>1?'<button class="gbtn gprev">‹</button><button class="gbtn gnext">›</button><div class="gcount">1 / '+imgs.length+"</div>":""}`
:'<div class="nopic">No Image</div>';

card.append(g);

let current=0;

g.onclick=e=>{
if(e.target.tagName!="BUTTON"&&g.querySelector("img"))openImage(imgs,current);
};

if(imgs.length>1){
let img=g.querySelector("img"),cnt=g.querySelector(".gcount");

const change=n=>{
current=(current+n+imgs.length)%imgs.length;
img.src=API+"/images/"+encodeURIComponent(imgs[current]);
cnt.textContent=`${current+1} / ${imgs.length}`;
};

g.querySelector(".gprev").onclick=e=>{
e.stopPropagation();
change(-1);
};

g.querySelector(".gnext").onclick=e=>{
e.stopPropagation();
change(1);
};

let x;

g.ontouchstart=e=>x=e.touches[0].clientX;

g.ontouchend=e=>{
let d=e.changedTouches[0].clientX-x;
if(Math.abs(d)>45)change(d<0?1:-1);
};
}

let b=document.createElement("div");
b.className="product-body";

b.innerHTML=`
<div class="product-name">${esc(p.name)}</div>
<div class="price">LKR ${money(sale??price)}${sale?`<span class="old-price">LKR ${money(price)}</span>`:""}</div>
<div class="stock ${avail?"in-stock":"out-stock"}">${avail?"Available for Order":"Currently Unavailable"}</div>
<button class="add-btn" ${avail?"":"disabled"}>${avail?"Add to Cart":"Unavailable"}</button>`;

b.querySelector("button").onclick=()=>addToCart(p.id);

card.append(b);
box.append(card);
});
}

async function addToCart(id){
try{
let p=await api(API+"/api/products/"+id);
if(!p?.id||!available(p))throw Error("Product is currently unavailable.");

let x=cart.find(a=>Number(a.id)==Number(p.id));

if(x)x.qty++;
else{
let im=images(p),price=Number(p.price||0),sale=Number(p.sale_price);
cart.push({
id:Number(p.id),
name:p.name,
price:sale>0&&sale<price?sale:price,
image:im[0]||p.image_key||"",
qty:1
});
}

save();
updateCount();
renderCart();
msg("Product added to cart.","success");
}catch(e){msg(e.message,"error")}
}

function renderCart(){
let box=$("cartItems");

if(!cart.length){
box.innerHTML='<div class="cart-empty">Your cart is empty.</div>';
$("subtotal").textContent="LKR 0";
$("total").textContent="LKR "+money(DELIVERY);
updateCount();
return;
}

let sub=0;
box.innerHTML="";

cart.forEach((x,i)=>{
let q=Number(x.qty),price=Number(x.price);
sub+=q*price;

let r=document.createElement("div");
r.className="cart-item";

r.innerHTML=`
${x.image?`<img src="${API}/images/${encodeURIComponent(x.image)}" alt="">`:""}
<div class="cart-info">
<div class="cart-name">${esc(x.name)}</div>
<div class="cart-price">LKR ${money(price)} × ${q}</div>
<button class="remove" onclick="removeItem(${i})">Remove</button>
</div>
<div class="qty">
<button onclick="qty(${i},-1)">−</button>
<b>${q}</b>
<button onclick="qty(${i},1)">+</button>
</div>`;

box.append(r);
});

$("subtotal").textContent="LKR "+money(sub);
$("total").textContent="LKR "+money(sub+DELIVERY);
updateCount();
}

function qty(i,n){
cart[i].qty+=n;
if(cart[i].qty<1)cart.splice(i,1);
save();
renderCart();
}

function removeItem(i){
cart.splice(i,1);
save();
renderCart();
}

function clearCart(){
if(confirm("Clear all products from your cart?")){
cart=[];
save();
renderCart();
}
}

async function placeOrder(){
if(!cart.length)return msg("Your cart is empty.","error");

let c={
name:$("customerName").value.trim(),
district:$("district").value.trim(),
city:$("city").value.trim(),
address:$("address").value.trim(),
mobile1:$("mobile1").value.trim(),
mobile2:$("mobile2").value.trim()
};

if(!c.name||!c.city||!c.address||!c.mobile1)
return msg("Please complete all required fields.","error");

let btn=$("checkoutBtn");
btn.disabled=true;
btn.textContent="Processing...";

try{
let d=await api(API+"/api/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
customer:{
name:c.name,
district:c.district,
city:c.city,
address:c.address,
mobile_1:c.mobile1,
mobile_2:c.mobile2
},
items:cart.map(x=>({
product_id:Number(x.id),
quantity:Number(x.qty)
}))
})
});

if(!d.success)throw Error(d.error||"Order failed.");

cart=[];
save();
renderCart();

document.querySelectorAll(".form input,.form textarea").forEach(x=>x.value="");

closeCart();

msg(
d.order_id
?`Order placed successfully! Order #${d.order_id}.`
:"Order placed successfully.",
"success"
);

}catch(e){
msg(e.message,"error");
}finally{
btn.disabled=false;
btn.textContent="Place COD Order";
}
}

$("search").oninput=()=>{
clearTimeout(timer);
timer=setTimeout(loadProducts,400);
};

updateCount();
renderCart();
loadCategories();
loadProducts();
</script>
</body>
</html>
