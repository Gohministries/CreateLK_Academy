<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">

<title>CreateLK Jobs | Search Jobs in Sri Lanka</title>
<meta name="description" content="Search and find jobs in Sri Lanka with CreateLK Jobs.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033
}

header{
  background:#102a56;
  color:#fff;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:20
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.logo{
  height:42px;
  width:auto;
  display:block
}

.header a{
  color:#fff;
  text-decoration:none
}

.post-top{
  background:#d69b16;
  color:#102a56!important;
  padding:10px 15px;
  border-radius:9px;
  font-weight:700
}

.hero{
  background:linear-gradient(135deg,#102a56,#174d91);
  color:#fff;
  padding:42px 18px
}

.hero-inner{
  max-width:1100px;
  margin:auto
}

.hero h1{
  margin:0 0 10px;
  font-size:34px
}

.hero p{
  margin:0 0 22px;
  opacity:.9
}

.post-btn{
  display:inline-block;
  background:#d69b16;
  color:#102a56;
  text-decoration:none;
  padding:13px 18px;
  border-radius:10px;
  font-weight:700
}

.search-box{
  max-width:1100px;
  margin:-25px auto 30px;
  background:#fff;
  padding:18px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.1);
  position:relative;
  z-index:5
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:10px
}

input,
select,
button{
  width:100%;
  min-height:46px;
  border:1px solid #d8dee9;
  border-radius:9px;
  padding:11px 12px;
  font-size:15px;
  background:#fff
}

button{
  background:#102a56;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer
}

.container{
  max-width:1100px;
  margin:auto;
  padding:0 18px 40px
}

.status{
  text-align:center;
  padding:25px 10px;
  color:#64748b
}

.jobs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px
}

.job-card{
  background:#fff;
  border:1px solid #e4e9f0;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.05)
}

.job-card h2{
  margin:0 0 8px;
  font-size:20px;
  color:#102a56
}

.company{
  font-weight:700;
  margin-bottom:12px
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0
}

.tag{
  background:#eef4ff;
  color:#174d91;
  padding:6px 9px;
  border-radius:7px;
  font-size:13px
}

.description{
  color:#596579;
  line-height:1.5;
  margin:12px 0
}

.view-btn{
  display:block;
  text-align:center;
  background:#102a56;
  color:#fff;
  text-decoration:none;
  padding:11px;
  border-radius:9px;
  font-weight:700;
  margin-top:15px
}

footer{
  background:#102a56;
  color:#fff;
  text-align:center;
  padding:25px 18px;
  margin-top:20px
}

.whatsapp{
  display:inline-block;
  margin-top:10px;
  color:#fff;
  text-decoration:none;
  font-weight:700
}

@media(max-width:750px){
  .header{
    flex-wrap:wrap
  }

  .logo{
    height:38px
  }

  .post-top{
    padding:9px 11px;
    font-size:13px
  }

  .hero{
    padding:32px 18px
  }

  .hero h1{
    font-size:28px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .jobs{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <a href="/">
      <img
        class="logo"
        src="https://jobs.createlk.com/file_00000000f05482118c11cccfc653fd0f.png"
        alt="CreateLK Jobs">
    </a>

    <a class="post-top" href="/register/">
      ➕ Post a Job
    </a>

  </div>
</header>

<section class="hero">
  <div class="hero-inner">

    <h1>Find Your Next Job</h1>

    <p>
      Search jobs and opportunities across Sri Lanka.
    </p>

    <a class="post-btn" href="/register/">
      ➕ Post a Job
    </a>

  </div>
</section>

<div class="search-box">

  <form id="searchForm">

    <div class="form-grid">

      <input
        id="keyword"
        type="search"
        placeholder="Search jobs, companies or skills">

      <select id="category">
        <option value="">All Categories</option>
      </select>

      <select id="location">
        <option value="">All Locations</option>
      </select>

      <button type="submit">
        🔎 Search
      </button>

    </div>

  </form>

</div>

<main class="container">

  <div id="status" class="status">
    Loading jobs...
  </div>

  <div id="jobs" class="jobs"></div>

</main>

<footer>

  <strong>CreateLK Jobs</strong>

  <div>
    Find jobs. Build your future.
  </div>

  <a
    class="whatsapp"
    href="https://wa.me/94771190395"
    target="_blank"
    rel="noopener">
    WhatsApp: +94 77 119 0395
  </a>

</footer>

<script>

const JOBS_API =
  "https://createlk-jobs-api.createlk.workers.dev/api/jobs";

const CATEGORY_API =
  "https://categoriesapi.createlk.workers.dev";

const LOCATION_API =
  "https://locationsapi.createlk.workers.dev";

let allJobs = [];


/* ------------------------------
   HTML ESCAPE
------------------------------ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ------------------------------
   NORMALIZE API DATA
------------------------------ */

function getItems(data, type){

  if(Array.isArray(data)){
    return data;
  }

  if(type === "category"){
    return data.categories ||
           data.data ||
           data.results ||
           [];
  }

  if(type === "location"){
    return data.locations ||
           data.data ||
           data.results ||
           [];
  }

  return [];

}


/* ------------------------------
   GET NAME FROM API ITEM
------------------------------ */

function getItemName(item){

  if(typeof item === "string"){
    return item.trim();
  }

  if(!item || typeof item !== "object"){
    return "";
  }

  return String(
    item.name ||
    item.category_name ||
    item.location_name ||
    item.title ||
    item.label ||
    item.value ||
    ""
  ).trim();

}


/* ------------------------------
   LOAD CATEGORIES
------------------------------ */

async function loadCategories(){

  const select =
    document.getElementById("category");

  try{

    const response =
      await fetch(CATEGORY_API,{
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "Category API HTTP " + response.status
      );
    }

    const data =
      await response.json();

    const items =
      getItems(data,"category");

    select.innerHTML =
      `<option value="">All Categories</option>`;

    const names = new Set();

    items.forEach(item => {

      const name =
        getItemName(item);

      if(!name || names.has(name)){
        return;
      }

      names.add(name);

      const option =
        document.createElement("option");

      option.value = name;
      option.textContent = name;

      select.appendChild(option);

    });

    console.log(
      "Categories loaded:",
      names.size
    );

  }catch(error){

    console.error(
      "Category loading failed:",
      error
    );

    select.innerHTML =
      `<option value="">All Categories</option>`;

  }

}


/* ------------------------------
   LOAD LOCATIONS
------------------------------ */

async function loadLocations(){

  const select =
    document.getElementById("location");

  try{

    const response =
      await fetch(LOCATION_API,{
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "Location API HTTP " + response.status
      );
    }

    const data =
      await response.json();

    const items =
      getItems(data,"location");

    select.innerHTML =
      `<option value="">All Locations</option>`;

    const names = new Set();

    items.forEach(item => {

      const name =
        getItemName(item);

      if(!name || names.has(name)){
        return;
      }

      names.add(name);

      const option =
        document.createElement("option");

      option.value = name;
      option.textContent = name;

      select.appendChild(option);

    });

    console.log(
      "Locations loaded:",
      names.size
    );

  }catch(error){

    console.error(
      "Location loading failed:",
      error
    );

    select.innerHTML =
      `<option value="">All Locations</option>`;

  }

}


/* ------------------------------
   LOAD JOBS
------------------------------ */

async function loadJobs(){

  const status =
    document.getElementById("status");

  try{

    status.textContent =
      "Loading jobs...";

    const response =
      await fetch(JOBS_API,{
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "Jobs API HTTP " + response.status
      );
    }

    const data =
      await response.json();

    if(Array.isArray(data)){
      allJobs = data;
    }else{
      allJobs =
        data.jobs ||
        data.data ||
        [];
    }

    renderJobs(allJobs);

  }catch(error){

    console.error(
      "Jobs loading failed:",
      error
    );

    allJobs = [];

    status.textContent =
      "Jobs are currently unavailable.";

  }

}


/* ------------------------------
   RENDER JOBS
------------------------------ */

function renderJobs(jobs){

  const container =
    document.getElementById("jobs");

  const status =
    document.getElementById("status");

  container.innerHTML = "";

  if(!jobs.length){

    status.textContent =
      "No jobs available.";

    return;
  }

  status.textContent =
    `${jobs.length} job${jobs.length === 1 ? "" : "s"} found`;

  jobs.forEach(job => {

    const title =
      job.title || "Untitled Job";

    const company =
      job.company_name ||
      job.company ||
      "Company";

    const description =
      job.description ||
      "No description available.";

    const location =
      job.location ||
      job.city ||
      job.district ||
      "";

    const category =
      job.category ||
      "";

    const jobType =
      job.job_type ||
      "";

    const experience =
      job.experience ||
      "";

    let salary = "";

    if(
      job.salary_min != null &&
      job.salary_max != null
    ){

      salary =
        `${job.salary_min} - ${job.salary_max}`;

    }else if(job.salary_min != null){

      salary =
        `${job.salary_min}`;

    }else if(job.salary_max != null){

      salary =
        `${job.salary_max}`;

    }

    const card =
      document.createElement("article");

    card.className =
      "job-card";

    card.innerHTML = `

      <h2>
        ${escapeHtml(title)}
      </h2>

      <div class="company">
        ${escapeHtml(company)}
      </div>

      <div class="meta">

        ${
          location
          ? `<span class="tag">📍 ${escapeHtml(location)}</span>`
          : ""
        }

        ${
          category
          ? `<span class="tag">📂 ${escapeHtml(category)}</span>`
          : ""
        }

        ${
          jobType
          ? `<span class="tag">💼 ${escapeHtml(jobType)}</span>`
          : ""
        }

        ${
          experience
          ? `<span class="tag">⭐ ${escapeHtml(experience)}</span>`
          : ""
        }

        ${
          salary
          ? `<span class="tag">💰 ${escapeHtml(salary)}</span>`
          : ""
        }

      </div>

      <div class="description">
        ${escapeHtml(description)}
      </div>

      <a
        class="view-btn"
        href="/job-details/?id=${encodeURIComponent(job.id)}">
        View Job
      </a>

    `;

    container.appendChild(card);

  });

}


/* ------------------------------
   SEARCH
------------------------------ */

function searchJobs(){

  const keyword =
    document.getElementById("keyword")
      .value
      .trim()
      .toLowerCase();

  const category =
    document.getElementById("category")
      .value
      .trim()
      .toLowerCase();

  const location =
    document.getElementById("location")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    allJobs.filter(job => {

      const text = [

        job.title,
        job.company_name,
        job.company,
        job.description,
        job.category,
        job.location,
        job.city,
        job.district,
        job.province,
        job.job_type,
        job.experience,
        job.salary_min,
        job.salary_max,
        job.salary_type,
        job.package,
        job.education,
        job.skills,
        job.requirements,
        job.responsibilities

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      const jobCategory =
        String(job.category || "")
          .toLowerCase();

      const jobLocation =
        [
          job.location,
          job.city,
          job.district,
          job.province
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const keywordMatch =
        !keyword ||
        text.includes(keyword);

      const categoryMatch =
        !category ||
        jobCategory === category ||
        jobCategory.includes(category);

      const locationMatch =
        !location ||
        jobLocation.includes(location);

      return (
        keywordMatch &&
        categoryMatch &&
        locationMatch
      );

    });

  renderJobs(filtered);

}


/* ------------------------------
   FORM
------------------------------ */

document
  .getElementById("searchForm")
  .addEventListener("submit",function(event){

    event.preventDefault();

    searchJobs();

  });


/* ------------------------------
   START
------------------------------ */

loadCategories();
loadLocations();
loadJobs();

</script>

</body>
</html>
