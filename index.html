<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f8fb;color:#222}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{position:sticky;top:0;z-index:1000;background:#102a56;box-shadow:0 2px 10px #0002}
.top{max-width:1200px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}

.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;white-space:nowrap}
.brand img{width:42px;height:42px;object-fit:contain}
.brand span{font-size:20px;font-weight:700}
.brand em{color:#d69b16;font-style:normal}

.search{flex:1;max-width:520px}
.search input{width:100%;padding:11px 17px;border:0;border-radius:25px;outline:0}

.header-btn{border:0;border-radius:25px;padding:11px 15px;font-weight:bold;white-space:nowrap}
.affiliate-btn{background:#d69b16;color:#fff}
.cart-btn{background:#fff;color:#102a56}

.hero{background:linear-gradient(135deg,#102a56,#173c78);color:#fff;text-align:center;padding:40px 16px}
.hero h1{margin:0 0 8px;font-size:31px}
.hero p{margin:0;opacity:.9}
.hero strong{color:#d69b16}

main{max-width:1200px;margin:auto;padding:22px 16px 70px}
.section-title{color:#102a56;margin:5px 0 14px}

.category-select{
width:100%;
max-width:500px;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
background:#fff;
color:#102a56
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-top:22px;
min-height:200px
}

.product{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 3px 15px #0001;
display:flex;
flex-direction:column
}

.product-image{
width:100%;
aspect-ratio:1;
object-fit:cover;
background:#eee;
display:block
}

.product-body{
padding:14px;
display:flex;
flex-direction:column;
flex:1
}

.product-category{
font-size:12px;
color:#777;
margin-bottom:5px
}

.product-name{
font-size:16px;
font-weight:bold;
color:#102a56;
margin-bottom:8px
}

.price{
font-size:18px;
font-weight:bold;
color:#102a56
}

.old-price{
font-size:13px;
color:#999;
text-decoration:line-through;
margin-left:7px
}

.stock{
font-size:12px;
color:#16803c;
margin:8px 0
}

.stock.out{color:#c62828}

.add-btn,.share-btn{
width:100%;
border:0;
border-radius:9px;
padding:11px;
margin-top:8px;
font-weight:bold
}

.add-btn{background:#d69b16;color:#fff}
.add-btn:disabled{background:#aaa;cursor:not-allowed}
.share-btn{background:#102a56;color:#fff}

.message{
grid-column:1/-1;
text-align:center;
padding:35px;
color:#777
}

.error-box{
background:#fff;
border-radius:14px;
padding:30px 20px;
box-shadow:0 3px 15px #0001
}

.error-box h3{
margin:0 0 8px;
color:#102a56
}

.error-box p{
margin:0 0 15px;
color:#777
}

.retry-btn{
border:0;
background:#102a56;
color:#fff;
padding:11px 22px;
border-radius:9px;
font-weight:bold
}

.product-highlight{
outline:3px solid #d69b16;
outline-offset:3px;
scroll-margin-top:110px;
animation:pulse 1s ease-in-out 3
}

@keyframes pulse{
50%{box-shadow:0 0 25px #d69b16}
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:2000;
align-items:flex-end
}

.overlay.show{display:flex}

.cart-box{
background:#fff;
width:100%;
max-width:600px;
margin:auto auto 0;
max-height:94vh;
overflow:auto;
border-radius:18px 18px 0 0;
padding:20px
}

.cart-head{
display:flex;
justify-content:space-between;
align-items:center
}

.cart-head h2{
margin:0;
color:#102a56
}

.close{
border:0;
background:#eee;
border-radius:50%;
width:36px;
height:36px;
font-size:20px
}

.cart-item{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}

.cart-item img{
width:65px;
height:65px;
object-fit:cover;
border-radius:8px
}

.cart-info{flex:1}
.cart-name{font-weight:bold;color:#102a56}
.cart-price{font-size:14px;margin-top:4px}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:6px
}

.qty button{
width:30px;
height:30px;
border:0;
border-radius:7px;
background:#eee
}

.remove{
border:0;
background:none;
color:#c62828;
font-size:12px;
padding:0;
margin-top:5px
}

.delivery-row,.cart-total{
display:flex;
justify-content:space-between;
padding:10px 0
}

.cart-total{
font-size:20px;
font-weight:bold;
color:#102a56;
padding:16px 0
}

.checkout h3{color:#102a56}

.field{margin-bottom:12px}

.field label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:5px
}

.field input,.field textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
outline:0
}

.field textarea{
min-height:80px;
resize:vertical
}

.order-btn{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#102a56;
color:#fff;
font-weight:bold
}

.order-btn:disabled{opacity:.6}

.success{
display:none;
background:#e8f7ed;
color:#176b35;
padding:14px;
border-radius:9px;
margin-top:14px;
line-height:1.6
}

.success.show{display:block}

footer{
background:#102a56;
color:#fff;
text-align:center;
padding:28px 15px 90px
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
margin-bottom:15px
}

.footer-links a{
color:#fff;
text-decoration:none;
font-size:14px
}

.copyright{
font-size:13px;
opacity:.7
}

.wa-float{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
z-index:3000;
box-shadow:0 4px 14px #0005
}

.wa-float svg{
width:32px;
height:32px;
fill:#fff
}

@media(max-width:900px){
.products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){

.top{
display:grid;
grid-template-columns:1fr auto;
gap:8px
}

.brand{grid-column:1}
.cart-btn{grid-column:2}

.search{
grid-column:1/-1;
grid-row:2;
max-width:none
}

.affiliate-btn{
grid-column:1/-1;
width:100%;
border-radius:9px
}

.products{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.product-body{padding:11px}
.product-name{font-size:14px}
.price{font-size:16px}
.brand span{font-size:18px}
}

@media(max-width:380px){

.products{grid-template-columns:1fr}
.brand span{font-size:17px}

}
</style>
</head>

<body>

<header>
<div class="top">

<a class="brand" href="/shop/">
<img
src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png"
alt="CreateLK Shop">
<span><b>CreateLK</b> <em>Shop</em></span>
</a>

<div class="search">
<input
id="searchInput"
type="search"
placeholder="Search products...">
</div>

<button class="header-btn cart-btn" onclick="openCart()">
Cart (<span id="cartCount">0</span>)
</button>

<button
class="header-btn affiliate-btn"
onclick="openAffiliateDashboard()">
Affiliate Dashboard
</button>

</div>
</header>

<section class="hero">
<h1>Shop Online in Sri Lanka 🇱🇰</h1>
<p>Quality products with <strong>Cash on Delivery</strong></p>
</section>

<main>

<h2 class="section-title">Shop by Category</h2>

<select id="categorySelect" class="category-select">
<option value="">All Categories</option>
</select>

<div id="products" class="products"></div>

</main>

<footer>

<div class="footer-links">

<a href="/shop/terms.html">Terms</a>

<a href="/shop/privacy.html">Privacy</a>

<a href="/shop/refund.html">Refund & Returns</a>

<a href="/shop/affiliate.html">Affiliate Program</a>

<a href="/shop/affiliate.html">Affiliate Dashboard</a>

</div>

<div class="copyright">
© 2026 CreateLK Shop. All rights reserved.
</div>

</footer>

<a
class="wa-float"
href="https://wa.me/"
aria-label="WhatsApp">

<svg viewBox="0 0 24 24">
<path d="M20 3.9A11.8 11.8 0 0 0 12.1 1C5.6 1 2 6.1 2 11.8c0 2 .5 3.9 1.5 5.6L2 23l5.8-1.5c1.6.9 3.4 1.3 5.2 1.3h.1c5.8 0 10.8-4.7 10.8-10.9A11.5 11.5 0 0 0 20 3.9zm-7 17c-1.6 0-3.2-.4-4.6-1.2l-.3-.2-3.4.9.9-3.3-.2-.3a9.5 9.5 0 0 1-1.4-5c0-5.2 4.2-9.4 9.4-9.4 2.5 0 4.9 1 6.7 2.8a9.4 9.4 0 0 1 2.8 6.7c0 5.2-4.3 9-9.9 9zm5.2-7.1c-.3-.2-1.8-.9-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.7-1.4-3.8-3.2-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.6s-.7-1.7-.9-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.6s1.1 3 1.2 3.2c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.8.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.7-.4z"/>
</svg>

</a>

<div
id="cartOverlay"
class="overlay"
onclick="closeCartOutside(event)">

<div class="cart-box">

<div class="cart-head">

<h2>Your Cart</h2>

<button
class="close"
onclick="closeCart()">×</button>

</div>

<div id="cartItems"></div>

<div class="delivery-row">
<span>Delivery</span>
<strong>LKR 400</strong>
</div>

<div class="cart-total">
<span>Total</span>
<span id="cartTotal">LKR 400</span>
</div>

<div class="checkout">

<h3>Delivery Details</h3>

<div class="field">
<label>Full Name *</label>
<input id="customerName">
</div>

<div class="field">
<label>District *</label>
<input id="customerDistrict">
</div>

<div class="field">
<label>City / Town *</label>
<input id="customerCity">
</div>

<div class="field">
<label>Address *</label>
<textarea id="customerAddress"></textarea>
</div>

<div class="field">
<label>Mobile 1 *</label>
<input id="customerMobile1" type="tel">
</div>

<div class="field">
<label>Mobile 2</label>
<input id="customerMobile2" type="tel">
</div>

<button
id="orderBtn"
class="order-btn"
onclick="placeOrder()">
Place Order
</button>

<div id="success" class="success"></div>

</div>
</div>
</div>

<script>

const API="https://shop-api.createlk.workers.dev";
const DELIVERY=400;
const CART_KEY="createlk_cart";

let products=[];
let category="";
let timer;

let cart=JSON.parse(
localStorage.getItem(CART_KEY)||"[]"
);

const $=id=>document.getElementById(id);
const productsEl=$("products");

const params=new URLSearchParams(
location.search
);


/* HELPERS */

function money(n){
return "LKR "+
Number(n||0).toLocaleString("en-LK");
}

function esc(v){
return String(v??"").replace(
/[&<>"']/g,
x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[x])
);
}

function imageUrl(k){
return k
?API+"/images/"+encodeURIComponent(k)
:"";
}


/* CART */

function saveCart(){

localStorage.setItem(
CART_KEY,
JSON.stringify(cart)
);

updateCartCount();

}

function updateCartCount(){

$("cartCount").textContent=
cart.reduce(
(s,i)=>s+Number(i.quantity||0),
0
);

}


/* AFFILIATE */

const ref=params.get("affiliate");

if(ref){
localStorage.setItem(
"createlk_affiliate_ref",
ref.trim()
);
}

function openAffiliateDashboard(){

const code=
(
localStorage.getItem(
"createlk_affiliate_code"
)||""
).trim();

location.href=code
?"/shop/affiliate.html"
:"/shop/affiliate.html?redirect="+
encodeURIComponent(
location.pathname+location.search
);

}


/* CATEGORIES */

async function loadCategories(){

try{

const r=await fetch(
API+"/api/categories"
);

if(!r.ok)return;

const d=await r.json();

const list=
d.categories||d||[];

$("categorySelect").innerHTML=
'<option value="">All Categories</option>';

list.forEach(c=>{

$("categorySelect").innerHTML+=
`<option value="${esc(c.id)}">
${esc(c.name)}
</option>`;

});

}catch(e){

console.error("Category error:",e);

}

}


/* PRODUCT LOADING */

async function loadProducts(){

const sharedId=
Number(params.get("product"));

/*
If the URL contains product=ID,
load that product FIRST.
*/

if(sharedId){

await loadSharedProduct(sharedId);

/*
Then load the normal shop
products in the background.
*/

loadNormalProducts(sharedId);

return;

}

/*
Normal shop page.
*/

await loadNormalProducts();

}


/* SHARED PRODUCT */

async function loadSharedProduct(id){

try{

const r=await fetch(
API+"/api/products/"+id
);

if(!r.ok)return;

const p=await r.json();

/*
Worker returns the product directly.
*/

if(
!p ||
Number(p.id)!==Number(id)
)return;

/*
Show the shared product immediately.
*/

products=[p];

renderProducts();

highlightShared(id);

}catch(e){

console.error(
"Shared product error:",
e
);

}

}


/* NORMAL PRODUCTS */

async function loadNormalProducts(
sharedId=0
){

try{

const q=new URLSearchParams();

const s=
$("searchInput").value.trim();

if(category)
q.set("category",category);

if(s)
q.set("search",s);

const r=await fetch(
API+"/api/products"+
(q.toString()?"?"+q:"")
);

if(!r.ok)return;

const d=await r.json();

const list=
d.products||d||[];

/*
Keep the shared product
at the first position.
*/

const shared=
products.find(
p=>Number(p.id)===
Number(sharedId)
);

products=shared
?[

shared,

...list.filter(
p=>Number(p.id)!==
Number(sharedId)
)

]
:list;

renderProducts();

if(sharedId)
highlightShared(sharedId);

}catch(e){

console.error(
"Products error:",
e
);

}

}


/* HIGHLIGHT */

function highlightShared(id){

setTimeout(()=>{

const card=
document.querySelector(
`.product[data-product-id="${id}"]`
);

if(!card)return;

card.classList.add(
"product-highlight"
);

card.scrollIntoView({
behavior:"smooth",
block:"center"
});

setTimeout(()=>{

card.classList.remove(
"product-highlight"
);

},4000);

},100);

}


/* RENDER PRODUCTS */

function renderProducts(){

if(!products.length){

const s=
$("searchInput").value.trim();

productsEl.innerHTML=`

<div class="message">

<div class="error-box">

<h3>No products found</h3>

<p>
${
s
?`No products match "<strong>
${esc(s)}
</strong>".`
:"No products are currently available."
}
</p>

</div>

</div>

`;

return;

}


productsEl.innerHTML=
products.map(p=>{

const price=
p.sale_price>0
?Number(p.sale_price)
:Number(p.price);

const old=
p.sale_price>0 &&
Number(p.price)>price
?Number(p.price)
:0;

const stock=
Number(p.stock||0);

return `

<div
class="product"
data-product-id="${Number(p.id)}">

${
p.image_key
?`

<img
class="product-image"
src="${imageUrl(p.image_key)}"
alt="${esc(p.name)}"
loading="lazy">

`
:`

<div class="product-image"></div>

`
}

<div class="product-body">

<div class="product-category">
${esc(p.category_name||"")}
</div>

<div class="product-name">
${esc(p.name)}
</div>

<div class="price">

${money(price)}

${
old
?`<span class="old-price">
${money(old)}
</span>`
:""
}

</div>

<div class="stock ${
stock<=0?"out":""
}">

${
stock>0
?stock+" in stock"
:"Out of stock"
}

</div>

<button
class="add-btn"
${stock<=0?"disabled":""}
onclick="addToCart(${Number(p.id)})">

${
stock>0
?"Add to Cart"
:"Out of Stock"
}

</button>

<button
class="share-btn"
onclick="shareProduct(${Number(p.id)})">

Share & Earn

</button>

</div>

</div>

`;

}).join("");

}


/* CART FUNCTIONS */

function addToCart(id){

const p=
products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

const stock=
Number(p.stock||0);

if(stock<=0){

alert(
"This product is out of stock."
);

return;

}

let item=
cart.find(
x=>Number(x.id)===Number(id)
);

if(item){

if(item.quantity>=stock){

alert(
"Maximum available stock reached."
);

return;

}

item.quantity++;

}else{

cart.push({

id:Number(p.id),

name:p.name,

price:
p.sale_price>0
?Number(p.sale_price)
:Number(p.price),

image_key:p.image_key||"",

quantity:1,

stock

});

}

saveCart();
renderCart();
openCart();

}


function changeQty(id,n){

const item=
cart.find(
x=>Number(x.id)===Number(id)
);

if(!item)return;

item.quantity+=n;

if(item.quantity<=0){

cart=
cart.filter(
x=>Number(x.id)!==Number(id)
);

}else if(
item.quantity>item.stock
){

item.quantity=item.stock;

alert(
"Maximum available stock reached."
);

}

saveCart();
renderCart();

}


function removeItem(id){

cart=
cart.filter(
x=>Number(x.id)!==Number(id)
);

saveCart();
renderCart();

}


/* CART DISPLAY */

function renderCart(){

const el=$("cartItems");

if(!cart.length){

el.innerHTML=
'<div class="message">Your cart is empty.</div>';

$("cartTotal").textContent=
money(DELIVERY);

return;

}

let subtotal=0;

el.innerHTML=
cart.map(i=>{

const total=
Number(i.price)*
Number(i.quantity);

subtotal+=total;

return `

<div class="cart-item">

${
i.image_key
?`

<img
src="${imageUrl(i.image_key)}"
alt="">

`
:`

<div
style="width:65px;height:65px;background:#eee;border-radius:8px">
</div>

`
}

<div class="cart-info">

<div class="cart-name">
${esc(i.name)}
</div>

<div class="cart-price">
${money(i.price)}
</div>

<div class="qty">

<button
onclick="changeQty(${i.id},-1)">
−
</button>

<strong>
${i.quantity}
</strong>

<button
onclick="changeQty(${i.id},1)">
+
</button>

</div>

<button
class="remove"
onclick="removeItem(${i.id})">

Remove

</button>

</div>

<strong>
${money(total)}
</strong>

</div>

`;

}).join("");

$("cartTotal").textContent=
money(subtotal+DELIVERY);

}


/* CART MODAL */

function openCart(){

$("cartOverlay").classList.add(
"show"
);

document.body.style.overflow=
"hidden";

renderCart();

}

function closeCart(){

$("cartOverlay").classList.remove(
"show"
);

document.body.style.overflow="";

}

function closeCartOutside(e){

if(
e.target===e.currentTarget
)
closeCart();

}


/* SHARE */

async function shareProduct(id){

const p=
products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

const code=
(
localStorage.getItem(
"createlk_affiliate_code"
)||""
).trim();

if(!code){

location.href=
"/shop/affiliate.html?redirect="+
encodeURIComponent(
"/shop/?product="+p.id
);

return;

}

const price=
p.sale_price>0
?Number(p.sale_price)
:Number(p.price);

const url=
"https://createlk.com/shop/?affiliate="+
encodeURIComponent(code)+
"&product="+
encodeURIComponent(p.id);

const text=
`${p.name}

Price: ${money(price)}

Order Now:
${url}`;

try{

if(navigator.share){

await navigator.share({

title:p.name,

text,

url

});

}else{

await navigator.clipboard.writeText(
text
);

alert(
"Affiliate link copied."
);

}

}catch(e){

if(e.name!=="AbortError"){

try{

await navigator.clipboard.writeText(
text
);

alert(
"Affiliate link copied."
);

}catch(x){

alert(url);

}

}

}

}


/* ORDER */

async function placeOrder(){

if(!cart.length){

alert(
"Your cart is empty."
);

return;

}

const ids=[

"customerName",
"customerDistrict",
"customerCity",
"customerAddress",
"customerMobile1",
"customerMobile2"

];

const v=
ids.map(
id=>$(id).value.trim()
);

if(
!v[0]||
!v[1]||
!v[2]||
!v[3]||
!v[4]
){

alert(
"Please complete all required delivery details."
);

return;

}

const btn=$("orderBtn");

btn.disabled=true;
btn.textContent=
"Placing Order...";

try{

const r=
await fetch(
API+"/api/orders",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

customer:{

name:v[0],

district:v[1],

city:v[2],

address:v[3],

mobile_1:v[4],

mobile_2:v[5]

},

items:
cart.map(i=>({

product_id:Number(i.id),

quantity:Number(i.quantity)

})),

delivery_charge:DELIVERY,

affiliate_code:
localStorage.getItem(
"createlk_affiliate_ref"
)||null

})

}
);

const d=
await r.json();

if(
!r.ok||
d.success===false
)

throw new Error(
d.message||
d.error||
"Unable to place order."
);

cart=[];

saveCart();
renderCart();

$("success").innerHTML=`

<strong>
Order placed successfully!
</strong>

<br>

${
d.order_id
?`Order #${esc(d.order_id)}
has been received.<br>`
:""
}

We will contact you regarding delivery.

`;

$("success").classList.add(
"show"
);

ids.forEach(
id=>$(id).value=""
);

}catch(e){

alert(
e.message||
"Unable to place order."
);

}finally{

btn.disabled=false;

btn.textContent=
"Place Order";

}

}


/* SEARCH */

$("searchInput")
.addEventListener(
"input",
()=>{

clearTimeout(timer);

timer=setTimeout(
loadProducts,
350
);

}
);


/* CATEGORY */

$("categorySelect")
.addEventListener(
"change",
e=>{

category=e.target.value;

loadProducts();

}
);


/* START */

updateCartCount();
renderCart();
loadCategories();
loadProducts();

</script>

</body>
</html>
