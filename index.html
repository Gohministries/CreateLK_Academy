<script>
"use strict";

/* CONFIGURATION */

const API_BASE = "https://eg-academy.createlk.workers.dev";
const TOKEN_KEY = "createlk_academy_token";

const $ = id => document.getElementById(id);

let currentUser = null;
let subjects = [];
let courses = [];
let lessons = [];

let activeSubjectId = null;
let activeCourseId = null;
let selectedLessonId = null;

let currentLesson = null;
let lessonQuestions = [];
let lessonQuestionIndex = 0;
let lessonQuestionAnswered = false;

let toastTimer = null;
let coursesRequestVersion = 0;
let lessonsRequestVersion = 0;

/* GENERAL HELPERS */

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[character]);
}

function firstArray(data,...keys){
  for(const key of keys){
    if(Array.isArray(data?.[key])) return data[key];
  }
  return [];
}

function showToast(message){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  },3500);
}

/* API */

function getToken(){
  try{
    return localStorage.getItem(TOKEN_KEY);
  }catch(error){
    return null;
  }
}

function saveToken(token){
  try{
    localStorage.setItem(TOKEN_KEY,token);
  }catch(error){
    throw new Error("Browser storage is unavailable.");
  }
}

function clearToken(){
  try{
    localStorage.removeItem(TOKEN_KEY);
  }catch(error){}
}

async function apiRequest(path,options={}){
  const headers = {...(options.headers || {})};
  const token = getToken();

  if(token){
    headers.Authorization = "Bearer " + token;
  }

  if(options.body && !headers["Content-Type"]){
    headers["Content-Type"] = "application/json";
  }

  let response;

  try{
    response = await fetch(API_BASE + path,{
      ...options,
      headers
    });
  }catch(error){
    throw new Error("Could not connect to the Academy server. Please try again.");
  }

  let data = {};

  try{
    data = await response.json();
  }catch(error){}

  if(!response.ok){
    if(response.status === 401){
      clearToken();
      currentUser = null;
      updateAccountUI();
    }

    throw new Error(data.error || "Request failed (" + response.status + ").");
  }

  return data;
}

/* MEMBERSHIP */

function getPremiumExpiryTimestamp(){
  if(!currentUser) return 0;

  const expiry = currentUser.premium_expires_at;

  if(expiry === undefined || expiry === null || expiry === ""){
    return 0;
  }

  let timestamp;

  if(typeof expiry === "number" || /^\d+$/.test(String(expiry))){
    timestamp = Number(expiry);

    if(timestamp > 0 && timestamp < 100000000000){
      timestamp *= 1000;
    }
  }else{
    timestamp = new Date(expiry).getTime();
  }

  return Number.isFinite(timestamp) ? timestamp : 0;
}

function isPremium(){
  return !!currentUser && getPremiumExpiryTimestamp() > Date.now();
}

function updateAccountUI(){
  const loggedIn = !!currentUser;
  const premium = loggedIn && isPremium();

  document.body.classList.toggle("guest-mode",!loggedIn);

  $("membershipStatus").textContent =
    !loggedIn ? "Guest" : premium ? "Premium" : "Free";

  $("membershipStatus").classList.toggle("premium",premium);

  $("signInButton").classList.toggle("hidden",loggedIn);
  $("signOutButton").classList.toggle("hidden",!loggedIn);
}

async function refreshUser(){
  const data = await apiRequest("/api/me");

  if(!data.user || !data.user.id){
    throw new Error("Your account could not be verified by the server.");
  }

  currentUser = data.user;
  updateAccountUI();

  return currentUser;
}

/* LOGIN */

function openLogin(){
  $("loginModal").classList.add("show");
  $("loginMessage").textContent = "";
}

function closeLogin(){
  $("loginModal").classList.remove("show");
}

function googleLogin(){
  const button = $("googleButton");

  button.disabled = true;
  button.textContent = "Connecting to Google...";
  $("loginMessage").textContent = "Please wait...";

  window.location.href = API_BASE + "/auth/google";
}

/* SESSION RESTORE */

async function restoreSession(){
  const params = new URLSearchParams(location.search);
  const oauthCode = params.get("oauth_code");

  if(oauthCode){
    history.replaceState({},document.title,location.pathname);

    $("loginModal").classList.add("show");
    $("loginMessage").textContent = "Completing sign-in...";

    try{
      const response = await fetch(API_BASE + "/api/auth/exchange",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:oauthCode})
      });

      const data = await response.json();

      if(!response.ok || !data.success || !data.token){
        throw new Error(data.error || "Google sign-in failed.");
      }

      saveToken(data.token);
      await refreshUser();

      $("loginModal").classList.remove("show");
      showToast("Welcome to CreateLK Academy!");

      await loadSubjects();

      return;

    }catch(error){
      clearToken();
      currentUser = null;
      updateAccountUI();

      $("loginMessage").textContent = error.message;
      $("googleButton").disabled = false;
      $("googleButton").textContent = "Continue with Google";

      return;
    }
  }

  if(!getToken()){
    currentUser = null;
    updateAccountUI();
    return;
  }

  try{
    await refreshUser();
    await loadSubjects();

  }catch(error){
    clearToken();
    currentUser = null;
    updateAccountUI();
  }
}

/* SIGN OUT */

function signOut(){
  clearToken();

  currentUser = null;
  subjects = [];
  courses = [];
  lessons = [];

  activeSubjectId = null;
  activeCourseId = null;
  selectedLessonId = null;

  currentLesson = null;
  lessonQuestions = [];

  coursesRequestVersion++;
  lessonsRequestVersion++;

  updateAccountUI();

  $("learningGrid").innerHTML =
    '<div class="empty">Sign in to explore subjects.</div>';

  $("hubBreadcrumb").innerHTML = "";

  $("subjectCount").textContent = "—";
  $("courseCount").textContent = "—";
  $("subjectResultCount").textContent = "Sign in to view subjects.";

  $("subjectSearch").value = "";
  $("subjectSelect").innerHTML = '<option value="">All Subjects</option>';

  resetCourseDropdown();
  resetLessonDropdown();
  updateStartLessonButton();

  closeMenu();
  closeLogin();
  closeLesson();
  closePayment();

  window.scrollTo({top:0,behavior:"smooth"});
  showToast("You have signed out.");
}

/* NAVIGATION */

function toggleMenu(){
  if(!currentUser) return;
  $("navLinks").classList.toggle("open");
}

function closeMenu(){
  $("navLinks").classList.remove("open");
}

document.querySelectorAll("#navLinks a").forEach(link => {
  link.addEventListener("click",closeMenu);
});

function goToLearning(){
  if(!currentUser){
    openLogin();
    return;
  }

  closeMenu();
  $("learning").scrollIntoView({behavior:"smooth"});
}

/* DROPDOWN HELPERS */

function setDropdownOptions(select,placeholder,items,labelFunction){
  select.innerHTML = "";

  const firstOption = document.createElement("option");
  firstOption.value = "";
  firstOption.textContent = placeholder;
  select.appendChild(firstOption);

  items.forEach((item,index) => {
    const option = document.createElement("option");
    option.value = String(item.id);
    option.textContent = labelFunction(item,index);
    select.appendChild(option);
  });
}

function resetCourseDropdown(){
  setDropdownOptions(
    $("courseSelect"),
    "Select a subject first",
    [],
    item => item.title || "Course"
  );

  $("courseSelect").disabled = true;
}

function resetLessonDropdown(){
  setDropdownOptions(
    $("lessonSelect"),
    "Select a course first",
    [],
    item => item.title || "Lesson"
  );

  $("lessonSelect").disabled = true;
  selectedLessonId = null;
  updateStartLessonButton();
}

function updateStartLessonButton(){
  const button = $("startLessonButton");
  button.disabled = !selectedLessonId;

  button.textContent = selectedLessonId
    ? "▶ Start Lesson"
    : "▶ Select a Lesson First";
}

function updateSelectorHelp(message){
  $("selectorHelp").textContent = message;
}

/* LOAD SUBJECTS */

async function loadSubjects(){
  if(!currentUser) return;

  $("learningGrid").innerHTML =
    '<div class="empty">Loading your subjects...</div>';

  $("subjectResultCount").textContent = "Loading subjects...";

  try{
    const data = await apiRequest("/api/subjects");

    subjects = firstArray(data,"subjects","categories","items");

    $("subjectCount").textContent = subjects.length;

    renderSubjects();

  }catch(error){
    $("learningGrid").innerHTML = `
      <div class="empty">
        ${escapeHTML(error.message)}
        <br><br>
        <button class="btn btn-blue" onclick="loadSubjects()">Try again</button>
      </div>
    `;

    $("subjectResultCount").textContent = "Unable to load subjects.";
  }
}

/* SUBJECT SEARCH AND DROPDOWN */

/* Only matching subjects are shown in the dropdown.
   No subject cards are automatically generated. */

function renderSubjectDropdown(){
  const select = $("subjectSelect");
  const previousValue = select.value;

  const search = $("subjectSearch").value.trim().toLowerCase();

  const filteredSubjects = subjects.filter(subject => {
    const title = String(subject.title || subject.name || "").toLowerCase();
    const description = String(subject.description || "").toLowerCase();

    return !search ||
      title.includes(search) ||
      description.includes(search);
  });

  setDropdownOptions(
    select,
    filteredSubjects.length
      ? "Choose a subject..."
      : "No matching subjects found",
    filteredSubjects,
    subject => subject.title || subject.name || "Subject"
  );

  if(
    previousValue &&
    filteredSubjects.some(subject =>
      String(subject.id) === previousValue
    )
  ){
    select.value = previousValue;
  }

  $("subjectResultCount").textContent =
    search
      ? "Found " + filteredSubjects.length + " matching subjects"
      : subjects.length + " subjects available";

  return filteredSubjects;
}

/* SEARCH FILTER */

function filterSubjects(){
  const filteredSubjects = renderSubjectDropdown();

  /* If the selected subject no longer matches the search,
     reset its dependent course and lesson selections. */

  if(
    activeSubjectId &&
    !filteredSubjects.some(subject =>
      Number(subject.id) === Number(activeSubjectId)
    )
  ){
    activeSubjectId = null;
    activeCourseId = null;
    selectedLessonId = null;

    courses = [];
    lessons = [];

    coursesRequestVersion++;
    lessonsRequestVersion++;

    resetCourseDropdown();
    resetLessonDropdown();

    $("courseCount").textContent = "—";
    $("hubBreadcrumb").innerHTML = "";

    updateSelectorHelp(
      "Choose a subject from the filtered dropdown to see its courses."
    );

    $("learningGrid").innerHTML =
      '<div class="empty">📚 Select a subject above to explore its courses.</div>';
  }
}

/* RESET ALL SELECTIONS */

function clearSubjectFilters(){
  $("subjectSearch").value = "";

  activeSubjectId = null;
  activeCourseId = null;
  selectedLessonId = null;

  courses = [];
  lessons = [];

  coursesRequestVersion++;
  lessonsRequestVersion++;

  $("subjectTools").classList.remove("hidden");
  $("subjectResultInfo").classList.remove("hidden");

  $("hubBreadcrumb").innerHTML = "";
  $("courseCount").textContent = "—";

  resetCourseDropdown();
  resetLessonDropdown();

  updateSelectorHelp(
    "Choose a subject to see its available courses. Then select a course to see its lessons."
  );

  renderSubjectDropdown();

  $("learningGrid").innerHTML =
    '<div class="empty">📚 Select a subject above to explore its courses.</div>';
}

/* INITIAL SUBJECT DISPLAY */

/* This function intentionally does not render subject cards. */

function renderSubjects(){
  activeSubjectId = null;
  activeCourseId = null;
  selectedLessonId = null;

  courses = [];
  lessons = [];

  coursesRequestVersion++;
  lessonsRequestVersion++;

  $("subjectTools").classList.remove("hidden");
  $("subjectResultInfo").classList.remove("hidden");

  $("hubBreadcrumb").innerHTML = "";
  $("courseCount").textContent = "—";

  $("subjectSearch").value = "";

  resetCourseDropdown();
  resetLessonDropdown();

  renderSubjectDropdown();

  updateSelectorHelp(
    "Choose a subject to see its available courses. Then select a course to see its lessons."
  );

  $("learningGrid").innerHTML =
    '<div class="empty">📚 Select a subject above to explore its courses.</div>';
}

/* SELECT SUBJECT */

async function selectSubject(subjectId){
  const subject = subjects.find(
    item => Number(item.id) === Number(subjectId)
  );

  if(!subject) return;

  activeSubjectId = Number(subjectId);
  activeCourseId = null;
  selectedLessonId = null;

  courses = [];
  lessons = [];

  const requestVersion = ++coursesRequestVersion;
  lessonsRequestVersion++;

  resetCourseDropdown();
  resetLessonDropdown();

  $("subjectSelect").value = String(subjectId);

  $("subjectTools").classList.remove("hidden");
  $("subjectResultInfo").classList.remove("hidden");

  $("hubBreadcrumb").innerHTML = `
    <strong>${escapeHTML(subject.title || subject.name)}</strong>
  `;

  $("learningGrid").innerHTML =
    '<div class="empty">Loading available courses...</div>';

  updateSelectorHelp("Loading courses for your selected subject...");

  try{
    const data = await apiRequest(
      "/api/courses?category_id=" + encodeURIComponent(subjectId)
    );

    if(requestVersion !== coursesRequestVersion) return;

    courses = firstArray(data,"courses","items");

    const courseSelect = $("courseSelect");

    setDropdownOptions(
      courseSelect,
      courses.length ? "Choose a course..." : "No courses available",
      courses,
      course => course.title || course.name || "Course"
    );

    courseSelect.disabled = courses.length === 0;

    $("courseCount").textContent = courses.length;

    if(!courses.length){
      updateSelectorHelp("No courses are currently available for this subject.");

      $("learningGrid").innerHTML =
        '<div class="empty">No published courses are available in this subject yet.</div>';

      return;
    }

    updateSelectorHelp(
      "Subject selected. Now choose a course to load its available lessons."
    );

    renderCourses();

  }catch(error){
    if(requestVersion !== coursesRequestVersion) return;

    $("learningGrid").innerHTML = `
      <div class="empty">
        ${escapeHTML(error.message)}
        <br><br>
        <button class="btn btn-blue" onclick="selectSubject(${Number(subjectId)})">
          Try again
        </button>
      </div>
    `;

    updateSelectorHelp("Unable to load courses. Please try again.");
  }
}

function openSubject(subjectId){
  return selectSubject(subjectId);
}

/* RENDER COURSES */

function renderCourses(){
  const grid = $("learningGrid");

  if(!courses.length){
    grid.innerHTML =
      '<div class="empty">No published courses are available in this subject yet.</div>';
    return;
  }

  grid.innerHTML = courses.map(course => {
    const id = Number(course.id);
    const image = course.thumbnail_url || course.image_url || "";
    const locked = course.access_type === "premium" && !isPremium();

    return `
      <article class="item-card">
        ${
          image
            ? `<img src="${escapeHTML(image)}" alt=""
                style="width:100%;height:145px;object-fit:cover;border-radius:10px">`
            : '<div class="item-icon">🎓</div>'
        }

        <h3>${escapeHTML(course.title || "Course")}</h3>

        <p>${escapeHTML(course.description || "Explore this course.")}</p>

        ${
          course.access_type
            ? `<span class="tag ${course.access_type === "free" ? "free" : "premium"}">
                ${escapeHTML(course.access_type)}
              </span>`
            : ""
        }

        <button class="btn ${locked ? "btn-gold" : "btn-blue"}"
          onclick="selectCourse(${id})">
          ${locked ? "Unlock Premium" : "View Lessons"}
        </button>
      </article>
    `;
  }).join("");
}

/* SELECT COURSE */

async function selectCourse(courseId){
  const course = courses.find(
    item => Number(item.id) === Number(courseId)
  );

  if(!course) return;

  if(course.access_type === "premium" && !isPremium()){
    openPayment();
    return;
  }

  activeCourseId = Number(courseId);
  selectedLessonId = null;

  lessons = [];

  const requestVersion = ++lessonsRequestVersion;

  resetLessonDropdown();

  $("courseSelect").value = String(courseId);

  $("hubBreadcrumb").innerHTML = `
    <button class="btn btn-light" onclick="renderSubjects()">← Subjects</button>
    <strong>${escapeHTML(course.title || course.name || "Course")}</strong>
  `;

  $("learningGrid").innerHTML =
    '<div class="empty">Loading available lessons...</div>';

  updateSelectorHelp("Loading lessons for your selected course...");

  try{
    const data = await apiRequest(
      "/api/lessons?course_id=" + encodeURIComponent(courseId)
    );

    if(requestVersion !== lessonsRequestVersion) return;

    lessons = firstArray(data,"lessons","items");

    const lessonSelect = $("lessonSelect");

    setDropdownOptions(
      lessonSelect,
      lessons.length ? "Choose a lesson..." : "No lessons available",
      lessons,
      (lesson,index) => lesson.title || lesson.name || ("Lesson " + (index+1))
    );

    lessonSelect.disabled = lessons.length === 0;

    if(!lessons.length){
      updateSelectorHelp("No lessons are currently available for this course.");

      $("learningGrid").innerHTML =
        '<div class="empty">No published lessons are available in this course yet.</div>';

      return;
    }

    updateSelectorHelp(
      "Course selected. Choose a lesson from the dropdown, then press Start Lesson."
    );

    renderLessons();

  }catch(error){
    if(requestVersion !== lessonsRequestVersion) return;

    $("learningGrid").innerHTML = `
      <div class="empty">
        ${escapeHTML(error.message)}
        <br><br>
        <button class="btn btn-blue" onclick="selectCourse(${Number(courseId)})">
          Try again
        </button>
      </div>
    `;

    updateSelectorHelp("Unable to load lessons. Please try again.");
  }
}

function openCourse(courseId){
  return selectCourse(courseId);
}

/* RENDER LESSONS */

function renderLessons(){
  const grid = $("learningGrid");

  if(!lessons.length){
    grid.innerHTML =
      '<div class="empty">No published lessons are available in this course yet.</div>';
    return;
  }

  grid.innerHTML = lessons.map((lesson,index) => {
    const id = Number(lesson.id);
    const locked = lesson.access_type === "premium" && !isPremium();

    return `
      <article class="item-card">
        <div class="item-icon">▶</div>

        <h3>${escapeHTML(lesson.title || "Lesson " + (index+1))}</h3>

        <p>${escapeHTML(lesson.description || "Study this lesson and complete its activities.")}</p>

        <span class="tag ${
          locked ? "premium" :
          lesson.access_type === "free" ? "free" : ""
        }">
          ${locked ? "Premium" : lesson.access_type === "free" ? "Free lesson" : "Lesson"}
        </span>

        <button class="btn ${locked ? "btn-gold" : "btn-blue"}"
          onclick="chooseLesson(${id})">
          ${locked ? "Unlock Premium" : "Select Lesson"}
        </button>
      </article>
    `;
  }).join("");
}

/* SELECT LESSON FROM DROPDOWN */

function handleLessonSelection(){
  const lessonId = $("lessonSelect").value;

  selectedLessonId = lessonId ? Number(lessonId) : null;

  updateStartLessonButton();

  if(!selectedLessonId){
    updateSelectorHelp("Choose a lesson to continue.");
    return;
  }

  const lesson = lessons.find(
    item => Number(item.id) === selectedLessonId
  );

  if(lesson){
    updateSelectorHelp(
      "Selected: " + (lesson.title || lesson.name || "Lesson") +
      ". Press Start Lesson when you are ready."
    );
  }
}

/* SELECT LESSON FROM CARD */

function chooseLesson(lessonId){
  const lesson = lessons.find(
    item => Number(item.id) === Number(lessonId)
  );

  if(!lesson) return;

  $("lessonSelect").value = String(lessonId);
  handleLessonSelection();

  $("subjectTools").scrollIntoView({behavior:"smooth",block:"center"});
}

/* FINAL LESSON SELECTION */

function startSelectedLesson(){
  if(!selectedLessonId){
    showToast("Please select a lesson first.");
    return;
  }

  const lesson = lessons.find(
    item => Number(item.id) === Number(selectedLessonId)
  );

  if(!lesson){
    showToast("The selected lesson is unavailable. Please select again.");
    return;
  }

  if(lesson.access_type === "premium" && !isPremium()){
    openPayment();
    return;
  }

  openLesson(selectedLessonId);
}

/* LESSON VIEWER */

async function openLesson(lessonId){
  const knownLesson = lessons.find(
    item => Number(item.id) === Number(lessonId)
  );

  if(knownLesson && knownLesson.access_type === "premium" && !isPremium()){
    openPayment();
    return;
  }

  $("lessonModal").classList.add("show");
  $("lessonViewer").innerHTML = "<p>Loading lesson...</p>";

  try{
    const data = await apiRequest(
      "/api/lessons/" + encodeURIComponent(lessonId)
    );

    currentLesson = data.lesson || data;

    if(currentLesson.access_type === "premium" && !isPremium()){
      closeLesson();
      openPayment();
      return;
    }

    const resources = firstArray(data,"resources","lesson_resources");
    lessonQuestions = firstArray(data,"questions","quiz_questions");

    lessonQuestionIndex = 0;
    lessonQuestionAnswered = false;

    renderLessonContent(resources);

  }catch(error){
    $("lessonViewer").innerHTML = `
      <div class="notice">${escapeHTML(error.message)}</div>
    `;
  }
}

function safeVideoEmbed(url){
  if(!url) return "";

  try{
    const parsed = new URL(url);

    if(parsed.protocol !== "https:") return "";

    if(parsed.hostname === "www.youtube.com" || parsed.hostname === "youtube.com"){
      const id = parsed.searchParams.get("v");

      if(id){
        return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
      }
    }

    if(parsed.hostname === "youtu.be"){
      return "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(parsed.pathname.slice(1));
    }

    if(parsed.hostname === "www.youtube-nocookie.com" ||
       parsed.hostname === "youtube-nocookie.com"){
      return parsed.href;
    }

  }catch(error){}

  return "";
}

function renderLessonContent(resources){
  const lesson = currentLesson || {};
  const title = lesson.title || "Lesson";
  const content = lesson.content_html || lesson.content || "";
  const video = lesson.video_url || "";
  const embed = safeVideoEmbed(video);

  let videoHTML = "";

  if(embed){
    videoHTML = `
      <iframe src="${escapeHTML(embed)}"
        title="Lesson video"
        loading="lazy"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    `;
  }else if(video){
    try{
      const url = new URL(video);

      if(url.protocol === "https:"){
        videoHTML = `
          <video controls playsinline preload="metadata" style="width:100%">
            <source src="${escapeHTML(url.href)}">
          </video>
        `;
      }
    }catch(error){}
  }

  const resourcesHTML = resources.length
    ? resources.map(resource => {
        let url = "";

        try{
          const parsed = new URL(resource.resource_url);
          if(parsed.protocol === "https:") url = parsed.href;
        }catch(error){}

        if(!url) return "";

        return `
          <a class="resource-link"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer">
            📎 ${escapeHTML(resource.title || resource.resource_type || "Open resource")}
          </a>
        `;
      }).join("")
    : "<p>No additional resources for this lesson.</p>";

  $("lessonViewer").innerHTML = `
    <h2 style="text-align:left">${escapeHTML(title)}</h2>

    <p style="text-align:left;color:var(--muted)">
      ${escapeHTML(lesson.description || "")}
    </p>

    ${videoHTML ? `<div style="margin:18px 0">${videoHTML}</div>` : ""}

    <div class="lesson-layout">
      <article class="lesson-content">
        <h3>Lesson Content</h3>

        <div style="white-space:pre-wrap">${escapeHTML(
          content.replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ")
        )}</div>

        ${
          lesson.content_url
            ? `<p><a href="${escapeHTML(lesson.content_url)}"
                target="_blank" rel="noopener noreferrer">Open lesson material</a></p>`
            : ""
        }
      </article>

      <aside class="lesson-sidebar">
        <h3>Learning Resources</h3>
        ${resourcesHTML}
      </aside>
    </div>

    <div id="lessonQuizArea" style="text-align:left;margin-top:25px"></div>
  `;

  renderLessonQuiz();
}

/* LESSON QUIZZES */

function renderLessonQuiz(){
  if(!lessonQuestions.length){
    $("lessonQuizArea").innerHTML = `
      <h3>Lesson Quiz</h3>
      <p>No quiz questions are available for this lesson.</p>
    `;
    return;
  }

  showLessonQuestion();
}

function showLessonQuestion(){
  const area = $("lessonQuizArea");
  const question = lessonQuestions[lessonQuestionIndex];

  if(!question) return;

  lessonQuestionAnswered = false;

  const total = lessonQuestions.length;

  area.innerHTML = `
    <h3>Lesson Quiz</h3>

    <p style="color:var(--muted);font-size:12px">
      Question ${lessonQuestionIndex+1} of ${total}
    </p>

    <strong>${escapeHTML(question.question)}</strong>

    <div id="lessonQuizOptions">
      ${["A","B","C","D"].map(letter => `
        <button class="question-option"
          data-choice="${letter}"
          onclick="answerLessonQuiz('${letter}')">
          <strong>${letter}.</strong>
          ${escapeHTML(question["option_"+letter.toLowerCase()])}
        </button>
      `).join("")}
    </div>

    <div id="lessonQuizFeedback"></div>

    <button class="btn btn-blue" id="lessonQuizNext" disabled>
      ${lessonQuestionIndex === total-1 ? "Finish Quiz" : "Next Question"}
    </button>
  `;

  $("lessonQuizNext").onclick = nextLessonQuiz;
}

async function answerLessonQuiz(choice){
  if(lessonQuestionAnswered) return;

  const question = lessonQuestions[lessonQuestionIndex];
  const buttons = document.querySelectorAll("#lessonQuizOptions button");

  buttons.forEach(button => button.disabled = true);

  try{
    const result = await apiRequest("/api/lesson-quiz-answers",{
      method:"POST",
      body:JSON.stringify({
        question_id:Number(question.id),
        selected_option:choice
      })
    });

    lessonQuestionAnswered = true;

    const correct = String(result.correct_option || "").toUpperCase();

    const isCorrect =
      result.correct === true ||
      (result.correct === undefined && correct === choice);

    buttons.forEach(button => {
      if(button.dataset.choice === correct){
        button.classList.add("correct");
      }

      if(button.dataset.choice === choice && !isCorrect){
        button.classList.add("incorrect");
      }
    });

    $("lessonQuizFeedback").innerHTML = `
      <div class="feedback ${isCorrect ? "success" : "error"}">
        <strong>${isCorrect ? "Correct answer!" : "Not quite. Keep learning!"}</strong>
        <p>Correct answer: ${escapeHTML(correct || "See explanation")}</p>
        <p>${escapeHTML(result.explanation || question.explanation || "")}</p>
      </div>
    `;

    $("lessonQuizNext").disabled = false;

  }catch(error){
    buttons.forEach(button => button.disabled = false);
    showToast(error.message);
  }
}

function nextLessonQuiz(){
  if(!lessonQuestionAnswered) return;

  if(lessonQuestionIndex < lessonQuestions.length-1){
    lessonQuestionIndex++;
    showLessonQuestion();
  }else{
    $("lessonQuizArea").innerHTML = `
      <h3>Quiz completed!</h3>
      <p>You have reached the end of this lesson quiz.</p>
    `;
  }
}

function closeLesson(){
  $("lessonModal").classList.remove("show");
  currentLesson = null;
}

/* PAYHERE DIRECT PAYMENT */

function openPayment(){
  if(!currentUser){
    openLogin();
    showToast("Please sign in before purchasing Premium.");
    return;
  }

  if(isPremium()){
    showToast("Your account already has Premium access.");
    return;
  }

  $("paymentModal").classList.add("show");
}

function closePayment(){
  $("paymentModal").classList.remove("show");
}

/* MODAL CONTROLS */

document.querySelectorAll(".modal-overlay").forEach(modal => {
  modal.addEventListener("click",event => {
    if(event.target !== modal) return;
    modal.classList.remove("show");
  });
});

document.addEventListener("keydown",event => {
  if(event.key === "Escape"){
    closeLogin();
    closeLesson();
    closePayment();
    closeMenu();
  }
});

/* DROPDOWN EVENT LISTENERS */

/* Search filters the subject dropdown only. */
$("subjectSearch").addEventListener("input",filterSubjects);

/* Selecting a subject loads its courses. */
$("subjectSelect").addEventListener("change",event => {
  const subjectId = event.target.value;

  if(!subjectId){
    clearSubjectFilters();
    return;
  }

  selectSubject(Number(subjectId));
});

/* Selecting a course loads its lessons. */
$("courseSelect").addEventListener("change",event => {
  const courseId = event.target.value;

  if(!courseId){
    activeCourseId = null;
    selectedLessonId = null;
    lessons = [];

    lessonsRequestVersion++;

    resetLessonDropdown();

    updateSelectorHelp("Choose a course to load its available lessons.");

    return;
  }

  selectCourse(Number(courseId));
});

/* Selecting a lesson enables Start Lesson. */
$("lessonSelect").addEventListener("change",handleLessonSelection);

/* INITIALIZE */

$("year").textContent = new Date().getFullYear();

currentUser = null;
updateAccountUI();

restoreSession();
</script>
