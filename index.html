<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font:14px Arial;
background:#f5f6f8;
color:#222
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

/* HEADER */
header{
background:#102a56;
color:#fff;
position:sticky;
top:0;
z-index:20;
padding:10px
}

.head{
max-width:1200px;
margin:auto
}

.top{
display:flex;
align-items:center;
gap:8px
}

.brand{
display:flex;
align-items:center;
gap:8px;
color:#fff;
text-decoration:none;
font-size:18px;
font-weight:bold;
flex:1;
min-width:0
}

.logo{
width:40px;
height:40px;
object-fit:contain;
background:#fff;
border-radius:6px;
flex-shrink:0
}

.actions{
display:flex;
gap:6px;
margin-left:auto
}

.menu,.cart{
border:0;
border-radius:6px;
padding:9px 12px;
white-space:nowrap
}

.menu{
background:#ffffff20;
color:#fff
}

.cart{
background:#fff;
color:#102a56;
font-weight:bold
}

.search{
width:100%;
margin-top:9px;
padding:11px;
border:0;
border-radius:6px;
outline:0
}

/* MAIN */
main{
max-width:1200px;
margin:auto;
padding:15px
}

/* HERO */
.hero{
background:linear-gradient(135deg,#102a56,#173c78);
color:#fff;
padding:24px 16px;
border-radius:10px;
margin-bottom:14px;
text-align:center
}

.hero h1{
margin:0 0 7px;
font-size:25px;
white-space:nowrap
}

.hero p{
margin:0;
font-size:14px
}

/* CATEGORY */
.categoryBox{
margin-bottom:14px
}

.categorySelect{
width:100%;
padding:12px 14px;
border:1px solid #d6d9df;
border-radius:8px;
background:#fff;
color:#222;
font-weight:bold;
outline:none;
cursor:pointer
}

.categorySelect:focus{
border-color:#102a56;
box-shadow:0 0 0 2px #102a5620
}

/* MESSAGE */
.msg{
display:none;
padding:11px;
margin-bottom:12px;
border-radius:6px;
font-weight:bold
}

.success{
display:block;
background:#e7f7ec;
color:#176b32
}

.error{
display:block;
background:#fdeaea;
color:#a22
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.product{
background:#fff;
border-radius:8px;
overflow:hidden;
box-shadow:0 1px 5px #0001
}

.gallery{
position:relative;
aspect-ratio:1;
cursor:zoom-in
}

.gallery img{
width:100%;
height:100%;
object-fit:contain
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
border:0;
border-radius:50%;
background:#102a56cc;
color:#fff;
width:30px;
height:30px;
font-size:20px
}

.prev{left:6px}
.next{right:6px}

.count{
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);
background:#0009;
color:#fff;
padding:3px 7px;
border-radius:15px;
font-size:11px
}

.body{
padding:10px;
display:flex;
flex-direction:column;
gap:5px
}

.name{
font-weight:bold;
line-height:1.3
}

.price{
font-size:17px;
font-weight:bold;
color:#102a56
}

.old{
text-decoration:line-through;
color:#888;
font-size:12px;
margin-left:4px
}

.stock{
font-size:12px
}

.in{color:#16813a}
.out{color:#b22}

.add{
border:0;
background:#102a56;
color:#fff;
padding:9px;
border-radius:6px;
font-weight:bold;
margin-top:4px
}

.add:disabled{
background:#aaa
}

.empty{
text-align:center;
padding:35px;
grid-column:1/-1;
color:#777
}

/* LOADING SKELETON */
.loadingGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
grid-column:1/-1
}

.skeletonCard{
background:#fff;
border-radius:8px;
overflow:hidden;
box-shadow:0 1px 5px #0001;
padding-bottom:10px
}

.skeleton{
position:relative;
overflow:hidden;
background:#e7e9ed
}

.skeleton::after{
content:"";
position:absolute;
inset:0;
transform:translateX(-100%);
background:linear-gradient(
90deg,
transparent,
#fff9,
transparent
);
animation:shimmer 1.4s infinite
}

.skeletonImage{
aspect-ratio:1
}

.skeletonLine{
height:14px;
margin:12px 10px 7px;
border-radius:5px;
width:75%
}

.skeletonPrice{
height:17px;
margin:8px 10px;
border-radius:5px;
width:45%
}

.skeletonButton{
height:36px;
margin:10px;
border-radius:6px
}

@keyframes shimmer{
100%{transform:translateX(100%)}
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:#0008;
opacity:0;
visibility:hidden;
transition:.2s
}

.overlay.show{
opacity:1;
visibility:visible
}

/* MENU */
#menuPanel{
position:fixed;
right:0;
top:0;
width:min(320px,88%);
height:100%;
background:#fff;
z-index:31;
transform:translateX(100%);
transition:.25s;
box-shadow:-5px 0 20px #0003
}

.showMenu{
transform:translateX(0)!important
}

.menuHead,.cartHead{
background:#102a56;
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:19px;
font-weight:bold
}

.close{
border:0;
background:#ffffff22;
color:#fff;
border-radius:50%;
width:34px;
height:34px;
font-size:22px
}

.link{
display:flex;
justify-content:space-between;
padding:16px;
border-bottom:1px solid #eee;
color:#222;
text-decoration:none;
font-weight:bold
}

/* CART */
#cart{
position:fixed;
right:0;
top:0;
width:min(430px,100%);
height:100%;
background:#fff;
z-index:25;
transform:translateX(100%);
transition:.25s;
display:flex;
flex-direction:column;
box-shadow:-5px 0 20px #0003
}

.showCart{
transform:translateX(0)!important
}

.cartBody{
padding:15px;
overflow:auto;
flex:1
}

.item{
display:flex;
gap:8px;
align-items:center;
border-bottom:1px solid #eee;
padding:10px 0
}

.item img{
width:60px;
height:60px;
object-fit:contain
}

.info{
flex:1
}

.qty{
display:flex;
gap:5px;
align-items:center
}

.qty button{
width:28px;
height:28px;
border:1px solid #ddd;
background:#fff;
border-radius:5px
}

.remove{
border:0;
background:none;
color:#c22;
font-size:12px;
padding:4px 0
}

.row{
display:flex;
justify-content:space-between;
margin:8px 0
}

.total{
font-size:19px;
font-weight:bold;
color:#102a56
}

.form{
display:grid;
gap:9px;
margin-top:15px
}

.form input,
.form textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px
}

.form textarea{
min-height:75px
}

.order{
border:0;
background:#102a56;
color:#fff;
padding:12px;
border-radius:6px;
font-weight:bold
}

.order:disabled{
opacity:.6
}

/* VIEWER */
#viewer{
position:fixed;
inset:0;
background:#000e;
z-index:50;
display:none;
align-items:center;
justify-content:center
}

.viewerImg{
max-width:94%;
max-height:86%;
object-fit:contain
}

.vclose,.varrow{
position:absolute;
border:0;
border-radius:50%;
background:#ffffff25;
color:#fff
}

.vclose{
top:15px;
right:15px;
width:42px;
height:42px;
font-size:27px
}

.varrow{
top:50%;
width:42px;
height:42px;
font-size:30px
}

.vprev{left:12px}
.vnext{right:12px}

.vcount{
position:absolute;
bottom:20px;
color:#fff;
background:#000b;
padding:5px 10px;
border-radius:15px
}

/* FOOTER */
footer{
margin-top:25px;
background:#102a56;
color:#fff;
text-align:center;
padding:20px;
font-size:12px
}

/* RESPONSIVE */
@media(max-width:900px){

.products,.loadingGrid{
grid-template-columns:repeat(3,1fr)
}

}

@media(max-width:600px){

.products,.loadingGrid{
grid-template-columns:repeat(2,1fr);
gap:8px
}

.product .body{
padding:8px
}

.name{
font-size:13px
}

.price{
font-size:15px
}

.hero h1{
font-size:21px
}

.brand{
font-size:16px
}

.logo{
width:36px;
height:36px
}

.menu,.cart{
padding:8px 10px
}

.categorySelect{
padding:11px 12px
}

#cart{
top:auto;
bottom:0;
height:88%;
border-radius:15px 15px 0 0;
transform:translateY(100%)
}

}

@media(max-width:380px){

.brand{font-size:15px}

.logo{
width:34px;
height:34px
}

.menu,.cart{
padding:8px
}

.hero h1{
font-size:19px
}

}
</style>
</head>

<body>

<header>
<div class="head">

<div class="top">

<a class="brand" href="/shop/">

<img
class="logo"
src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png"
alt="CreateLK Shop"
>

CreateLK
<span style="color:#f5b041">Shop</span>

</a>

<div class="actions">

<button class="cart" onclick="cartOpen()">
Cart (<span id="cc">0</span>)
</button>

<button
class="menu"
onclick="menu(1)"
aria-label="Open menu"
>
☰
</button>

</div>

</div>

<input
id="search"
class="search"
placeholder="Search products..."
type="search"
>

</div>
</header>

<div
id="menuShade"
class="overlay"
onclick="menu(0)"
></div>

<aside id="menuPanel">

<div class="menuHead">

CreateLK Shop

<button class="close" onclick="menu(0)">×</button>

</div>

<a class="link" href="/shop/">
Home <span>›</span>
</a>

<a class="link" href="/shop/terms.html">
Terms & Conditions <span>›</span>
</a>

<a class="link" href="/shop/privacy.html">
Privacy Policy <span>›</span>
</a>

<a class="link" href="/shop/refund.html">
Refund & Returns <span>›</span>
</a>

</aside>

<main>

<section class="hero">

<h1>Shop Online in Sri Lanka 🇱🇰</h1>

<p>Quality products with Cash on Delivery.</p>

</section>

<div class="categoryBox">

<select id="categorySelect" class="categorySelect">

<option value="">
All Categories
</option>

</select>

</div>

<div id="msg" class="msg"></div>

<section id="products" class="products"></section>

</main>

<div
id="cartShade"
class="overlay"
onclick="cartClose()"
></div>

<aside id="cart">

<div class="cartHead">

Your Cart

<button class="close" onclick="cartClose()">×</button>

</div>

<div class="cartBody">

<div id="items"></div>

<div class="row">
<span>Subtotal</span>
<b id="sub">LKR 0</b>
</div>

<div class="row">
<span>Delivery</span>
<b>LKR 400</b>
</div>

<div class="row total">
<span>Total</span>
<b id="total">LKR 400</b>
</div>

<div class="form">

<input id="name" placeholder="Full Name *">

<input id="district" placeholder="District">

<input id="city" placeholder="City / Town *">

<textarea
id="address"
placeholder="Delivery Address *"
></textarea>

<input
id="mobile"
placeholder="Mobile 1 *"
type="tel"
>

<input
id="mobile2"
placeholder="Mobile 2 (Optional)"
type="tel"
>

<button
id="order"
class="order"
onclick="placeOrder()"
>
Place COD Order
</button>

</div>

</div>

</aside>

<div
id="viewer"
onclick="viewerBg(event)"
>

<button
class="vclose"
onclick="viewerClose()"
>
×
</button>

<button
id="vp"
class="varrow vprev"
onclick="viewerMove(-1,event)"
>
‹
</button>

<img
id="vi"
class="viewerImg"
alt="Product image"
>

<button
id="vn"
class="varrow vnext"
onclick="viewerMove(1,event)"
>
›
</button>

<div id="vcount" class="vcount"></div>

</div>

<footer>
© 2026 CreateLK Shop. All rights reserved.
</footer>

<script>

const API="https://shop-api.createlk.workers.dev";
const D=400;
const $=x=>document.getElementById(x);

let cart=[];
let cat="";
let timer;
let imgs=[];
let vi=0;
let photoX=0;


/* HELPERS */

const money=n=>
Number(n||0).toLocaleString("en-LK");

const esc=s=>
String(s??"").replace(
/[&<>"']/g,
x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[x])
);


async function api(u,o={}){

let r=await fetch(
u,
{
...o,
headers:{
"Accept":"application/json",
...(o.headers||{})
}
}
);

let d=await r.json().catch(()=>({}));

if(!r.ok)
throw Error(
d.error||
d.message||
"Server error"
);

return d;

}


/* LOCK PAGE */

function lock(x){
document.body.style.overflow=x?"hidden":"";
}


/* MENU */

function menu(x){

$("menuPanel").classList.toggle(
"showMenu",x
);

$("menuShade").classList.toggle(
"show",x
);

lock(x);

}


/* CART OPEN/CLOSE */

function cartOpen(){

renderCart();

$("cart").classList.add("showCart");
$("cartShade").classList.add("show");

lock(1);

}

function cartClose(){

$("cart").classList.remove("showCart");
$("cartShade").classList.remove("show");

lock(0);

}


/* MESSAGE */

function msg(t,c="success"){

$("msg").textContent=t;
$("msg").className="msg "+c;

}


/* IMAGES */

function imageList(p){

let a=
Array.isArray(p.images)
?
p.images.map(
x=>typeof x=="string"
?x
:x?.image_key||x?.key||x?.url
).filter(Boolean)
:
[];

return a.length
?a
:p.image_key?[p.image_key]:[];

}


/* CATEGORIES */

async function categories(){

let select=$("categorySelect");

try{

let d=
await api(API+"/api/categories");

(d||[])
.filter(x=>
!["all","all categories"].includes(
String(x.name).toLowerCase().trim()
)
)
.forEach(x=>{

let option=document.createElement("option");

option.value=x.id;
option.textContent=x.name;

select.append(option);

});

}catch(e){

console.log("Category loading error:",e);

}

}


$("categorySelect").onchange=function(){

cat=this.value;
products();

};


/* LOADING */

function showLoading(){

$("products").innerHTML=`

<div class="loadingGrid">

${Array.from({length:4},()=>`

<div class="skeletonCard">

<div class="skeleton skeletonImage"></div>

<div class="skeleton skeletonLine"></div>

<div class="skeleton skeletonPrice"></div>

<div class="skeleton skeletonButton"></div>

</div>

`).join("")}

</div>
`;

}


/* PRODUCTS */

async function products(){

showLoading();

let p=new URLSearchParams;

if(cat)
p.set("category",cat);

let search=$("search").value.trim();

if(search)
p.set("search",search);

try{

let d=
await api(API+"/api/products?"+p);

draw(
Array.isArray(d)?d:[]
);

}catch(e){

$("products").innerHTML=
`<div class="empty">${esc(e.message)}</div>`;

}

}


/* DRAW */

function draw(list){

let box=$("products");

if(!list.length){

box.innerHTML=
'<div class="empty">No products found.</div>';

return;

}

box.innerHTML="";

list.forEach(p=>{

let price=+p.price||0;

let sale=
+p.sale_price>0&&
+p.sale_price<price
?+p.sale_price:null;

let stock=+p.stock||0;

let a=imageList(p);
let i=0;

let card=document.createElement("article");

card.className="product";

card.innerHTML=`

<div class="gallery">

${
a.length
?
`<img
src="${API}/images/${encodeURIComponent(a[0])}"
alt="${esc(p.name)}"
>`
:
`<div class="empty">No Image</div>`
}

${
a.length>1
?
`
<button class="arrow prev">‹</button>
<button class="arrow next">›</button>
<span class="count">1 / ${a.length}</span>
`
:""
}

</div>

<div class="body">

<div class="name">
${esc(p.name)}
</div>

<div class="price">

LKR ${money(sale??price)}

${
sale
?
`<span class="old">
LKR ${money(price)}
</span>`
:""
}

</div>

<div class="stock ${stock?"in":"out"}">

${stock?stock+" available":"Out of stock"}

</div>

<button
class="add"
${stock?"":"disabled"}
>

${stock?"Add to Cart":"Out of Stock"}

</button>

</div>
`;

box.append(card);


if(a.length){

let g=card.querySelector(".gallery");
let im=g.querySelector("img");

const change=n=>{

i=(i+n+a.length)%a.length;

im.src=
API+"/images/"+
encodeURIComponent(a[i]);

let c=g.querySelector(".count");

if(c)
c.textContent=`${i+1} / ${a.length}`;

};


g.onclick=e=>{

if(!e.target.classList.contains("arrow"))
viewer(a,i);

};


if(a.length>1){

g.querySelector(".prev").onclick=e=>{

e.stopPropagation();
change(-1);

};

g.querySelector(".next").onclick=e=>{

e.stopPropagation();
change(1);

};

}

}


card.querySelector(".add").onclick=
()=>add(p.id);

});

}


/* ADD */

async function add(id){

try{

let p=
await api(API+"/api/products/"+id);

let stock=+p.stock||0;

if(!stock){

msg(
"This product is out of stock.",
"error"
);

return;

}

let x=
cart.find(x=>+x.id===+p.id);

if(x){

if(x.qty+1>stock){

msg(
`Only ${stock} item(s) available.`,
"error"
);

return;

}

x.qty++;

}else{

let a=imageList(p);

let price=
+p.sale_price>0&&
+p.sale_price<+p.price
?+p.sale_price
:+p.price;

cart.push({
id:p.id,
name:p.name,
price,
image:a[0]||"",
qty:1
});

}

save();
renderCart();

msg("Product added to cart.");

}catch(e){

msg(e.message,"error");

}

}


/* CART STORAGE */

function load(){

try{

cart=JSON.parse(
localStorage.getItem("createlk_cart")||"[]"
);

}catch(e){

cart=[];

}

if(!Array.isArray(cart))
cart=[];

save();

}


function save(){

localStorage.setItem(
"createlk_cart",
JSON.stringify(cart)
);

$("cc").textContent=
cart.reduce(
(n,x)=>n+(+x.qty||0),0
);

}


/* CART */

function renderCart(){

let box=$("items");
let sub=0;

if(!cart.length){

box.innerHTML=
'<div class="empty">Your cart is empty.</div>';

}else{

box.innerHTML="";

cart.forEach((x,i)=>{

sub+=+x.price*x.qty;

let d=document.createElement("div");

d.className="item";

d.innerHTML=`

${x.image
?`
<img
src="${API}/images/${encodeURIComponent(x.image)}"
alt="${esc(x.name)}"
>
`
:""
}

<div class="info">

<b>${esc(x.name)}</b>

<br>

LKR ${money(x.price)} × ${x.qty}

<br>

<button
class="remove"
onclick="removeItem(${i})"
>
Remove
</button>

</div>

<div class="qty">

<button onclick="qty(${i},-1)">−</button>

${x.qty}

<button onclick="qty(${i},1)">+</button>

</div>
`;

box.append(d);

});

}

$("sub").textContent=
"LKR "+money(sub);

$("total").textContent=
"LKR "+money(sub+D);

save();

}


function qty(i,n){

cart[i].qty+=n;

if(cart[i].qty<1)
cart.splice(i,1);

renderCart();

}


function removeItem(i){

cart.splice(i,1);
renderCart();

}


/* ORDER */

async function placeOrder(){

if(!cart.length){

msg(
"Your cart is empty.",
"error"
);

return;

}

let c={

name:$("name").value.trim(),
district:$("district").value.trim(),
city:$("city").value.trim(),
address:$("address").value.trim(),
mobile_1:$("mobile").value.trim(),
mobile_2:$("mobile2").value.trim()

};

if(
!c.name||
!c.city||
!c.address||
!c.mobile_1
){

msg(
"Please complete the required fields.",
"error"
);

return;

}

let b=$("order");

b.disabled=true;
b.textContent="Processing...";

try{

let d=
await api(
API+"/api/orders",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

customer:c,

items:cart.map(x=>({
product_id:+x.id,
quantity:+x.qty
}))

})
}
);

if(d.success===false)
throw Error(
d.error||"Order failed"
);

cart=[];
save();
renderCart();

document
.querySelectorAll(
".form input,.form textarea"
)
.forEach(x=>x.value="");

cartClose();

msg(
d.order_id
?
`Order placed successfully! Order #${d.order_id}.`
:
"Order placed successfully!"
);

}catch(e){

msg(e.message,"error");

}finally{

b.disabled=false;
b.textContent="Place COD Order";

}

}


/* VIEWER */

function viewer(a,i){

imgs=a;
vi=i;

$("viewer").style.display="flex";

$("vi").src=
API+"/images/"+
encodeURIComponent(a[i]);

$("vcount").textContent=
`${i+1} / ${a.length}`;

$("vp").style.display=
$("vn").style.display=
a.length>1?"block":"none";

lock(1);

}


function viewerMove(n,e){

e.stopPropagation();

if(imgs.length<2)
return;

vi=(vi+n+imgs.length)%imgs.length;

$("vi").src=
API+"/images/"+
encodeURIComponent(imgs[vi]);

$("vcount").textContent=
`${vi+1} / ${imgs.length}`;

}


function viewerClose(){

$("viewer").style.display="none";
lock(0);

}


function viewerBg(e){

if(e.target===$("viewer"))
viewerClose();

}


/* SWIPE */

$("viewer").addEventListener(
"touchstart",
e=>{
photoX=e.touches[0].clientX;
},
{passive:true}
);

$("viewer").addEventListener(
"touchend",
e=>{

let x=
e.changedTouches[0].clientX-photoX;

if(Math.abs(x)>50)
viewerMove(x<0?1:-1,e);

},
{passive:true}
);


/* SEARCH */

$("search").oninput=()=>{

clearTimeout(timer);

timer=setTimeout(products,350);

};


/* ESC */

document.onkeydown=e=>{

if(e.key==="Escape"){

viewerClose();
menu(0);
cartClose();

}

};


/* START */

load();
categories();
products();

</script>
