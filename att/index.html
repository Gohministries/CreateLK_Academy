<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>Prayer Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font:14px Arial}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#102a56;color:#fff}
.green{background:#16803c}.red{background:#c62828}.gray{background:#667085}
input,select{border:1px solid #ccd5e0;border-radius:9px;padding:10px;background:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:100%;max-width:380px;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0002}
.loginBox h2{text-align:center;color:#102a56}
.loginBox input{width:100%;margin:8px 0}
header{height:58px;background:#102a56;color:#fff;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:18px}
.menu{position:relative}.menuBtn{font-size:22px;border:0;border-radius:8px;padding:7px 12px}
.menuBox{position:absolute;right:0;top:45px;background:#fff;width:190px;padding:6px;border-radius:10px;box-shadow:0 8px 25px #0003}
.menuBox button{width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:7px}
main{max-width:1050px;margin:auto;padding:12px}
.box,.hero{background:#fff;border-radius:13px;padding:14px;margin-bottom:12px}
.hero{text-align:center}.hero h2{margin:0;color:#102a56;font-size:20px}
.dateBar,.periodGrid{display:grid;grid-template-columns:1fr auto auto;gap:7px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}
.stat,.reportStat{background:#fff;border-radius:10px;padding:11px;text-align:center}
.stat b,.reportStat b{display:block;color:#102a56;font-size:20px;margin-top:3px}
.memberTools{display:flex;gap:7px}.memberTools input{flex:1}
.memberList,.attList,.reportList{display:grid;gap:8px;margin-top:10px}
.memberItem{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;padding:10px;border-radius:9px}
.memberActions{display:flex;gap:5px}.memberActions button{padding:7px 9px;border:0;border-radius:7px}
.attHead{display:flex;justify-content:space-between;align-items:center}
.attCard{background:#f8fafc;border:1px solid #e1e7ef;border-radius:11px;padding:11px}
.attTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.attName{font-weight:bold;color:#102a56;font-size:16px}
.status{display:flex;gap:5px}.status button{border:1px solid #ccd5e0;background:#fff;border-radius:7px;padding:7px 10px}
.activePresent{background:#16803c!important;color:#fff}.activeAbsent{background:#c62828!important;color:#fff}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.field label{display:block;font-size:11px;color:#667085}.field input,.field select{width:100%;padding:8px}
.timeBox{text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:8px;margin-top:7px;color:#102a56;font-weight:bold}
.reportGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}
.reportDay{background:#f8fafc;border-radius:9px;padding:9px}
.reportHead{display:flex;justify-content:space-between;font-weight:bold;color:#102a56}
.reportPerson{display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;padding:5px 0}
.present{color:#16803c;font-weight:bold}.absent{color:#c62828;font-weight:bold}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modalBox{background:#fff;padding:20px;border-radius:13px;width:100%;max-width:380px}
.modalBox input{width:100%;margin:8px 0}.modalActions{display:flex;justify-content:flex-end;gap:7px}
.msg{text-align:center;color:#c62828;min-height:18px}
@media(max-width:750px){
.stats,.reportGrid{grid-template-columns:repeat(3,1fr)}
.fields{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){
main{padding:8px}
.dateBar{grid-template-columns:1fr 1fr}.dateBar input{grid-column:1/-1}
.stats,.reportGrid{grid-template-columns:1fr 1fr}
.memberTools,.attTop{flex-direction:column;align-items:stretch}
.memberTools button,.status button{width:100%}
.status{width:100%}
.fields{grid-template-columns:1fr 1fr}
.periodGrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<section id="loginPage" class="login">
<div class="loginBox">
<h2>Prayer Attendance</h2>
<input id="password" type="password" placeholder="Admin Password">
<button id="loginBtn" class="btn" style="width:100%">Login</button>
<div id="loginMsg" class="msg"></div>
</div>
</section>

<section id="app" class="hidden">
<header>
<h1>Prayer Attendance</h1>
<div class="menu">
<button id="menuBtn" class="menuBtn">☰</button>
<div id="menuBox" class="menuBox hidden">
<button onclick="go('top')">Dashboard</button>
<button onclick="go('members')">Members</button>
<button onclick="go('attendance')">Attendance</button>
<button onclick="go('report')">Period Report</button>
<button onclick="downloadCSV()">Download CSV</button>
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="logout()" style="color:#c62828">Logout</button>
</div>
</div>
</header>

<main id="top">

<div class="hero">
<h2>Korea - Sri Lanka Prayer Group</h2>
<p>Prayer Attendance</p>
<b>5:00 AM - 6:00 AM</b>
</div>

<div class="dateBar">
<input id="date" type="date">
<button id="loadBtn" class="btn">Load Date</button>
<button id="saveBtn" class="btn green">Save All</button>
</div>

<div class="stats">
<div class="stat">Members<b id="membersCount">0</b></div>
<div class="stat">Present<b id="presentCount">0</b></div>
<div class="stat">Absent<b id="absentCount">0</b></div>
<div class="stat">Present %<b id="percent">0%</b></div>
<div class="stat">Prayer Time<b id="minutes">0m</b></div>
</div>

<div class="box" id="members">
<h3 style="color:#102a56">Saved Members</h3>
<div class="memberTools">
<input id="memberName" placeholder="Member name">
<button id="addBtn" class="btn green">+ Add Member</button>
</div>
<div id="memberList" class="memberList"></div>
</div>

<div class="box" id="attendance">
<div class="attHead">
<h3 style="color:#102a56">Daily Attendance</h3>
<button id="allBtn" class="btn green">Mark All Present</button>
</div>
<div id="attList" class="attList"></div>
<div style="margin-top:10px">
<button id="save2" class="btn green">Save All</button>
<button id="deleteDay" class="btn red">Delete This Date</button>
</div>
</div>

<div class="box" id="report">
<h3 style="color:#102a56">Period Report</h3>
<div class="periodGrid">
<input id="from" type="date">
<input id="to" type="date">
<button id="reportBtn" class="btn">Load</button>
<button id="csvBtn" class="btn green">CSV</button>
<button id="pdfBtn" class="btn">PDF</button>
</div>

<div class="reportGrid">
<div class="reportStat">Present<b id="rp">0</b></div>
<div class="reportStat">Absent<b id="ra">0</b></div>
<div class="reportStat">Records<b id="rr">0</b></div>
<div class="reportStat">Minutes<b id="rm">0</b></div>
<div class="reportStat">Mic<b id="mic">0</b></div>
<div class="reportStat">Video<b id="video">0</b></div>
</div>
<div id="reportList" class="reportList"></div>
</div>

</main>
</section>

<div id="modal" class="modal hidden">
<div class="modalBox">
<h3 style="color:#102a56">Edit Member</h3>
<input id="editName" placeholder="Member name">
<div class="modalActions">
<button id="cancel" class="btn gray">Cancel</button>
<button id="editSave" class="btn green">Save</button>
</div>
</div>
</div>

<script>
const API="https://attendance.createlk.workers.dev";
const KEY="prayer_attendance_admin";
const $=x=>document.getElementById(x);

let members=[],day=[],period=[],editId=null;

const today=()=>{
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const fmt=n=>{
 n=Number(n)||0;
 return Math.floor(n/60)+"h "+n%60+"m";
};

async function api(path,opt={}){
 opt.headers={
  "Content-Type":"application/json",
  "X-Admin-Key":localStorage.getItem(KEY)||"",
  ...(opt.headers||{})
 };
 const r=await fetch(API+path,opt);
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function showApp(){
 $("loginPage").classList.add("hidden");
 $("app").classList.remove("hidden");
}

function login(){
 const p=$("password").value.trim();
 if(!p)return $("loginMsg").textContent="Enter password.";

 $("loginBtn").disabled=true;

 fetch(API+"/api/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({password:p})
 })
 .then(async r=>{
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.success)throw Error(d.error||"Login failed.");
  localStorage.setItem(KEY,p);
  showApp();
  init();
 })
 .catch(e=>$("loginMsg").textContent=e.message)
 .finally(()=>$("loginBtn").disabled=false);
}

async function check(){
 if(!localStorage.getItem(KEY))return;

 try{
  await api("/api/check-login");
  showApp();
  init();
 }catch{
  localStorage.removeItem(KEY);
 }
}

async function init(){
 const d=today();
 $("date").value=d;
 $("from").value=d.slice(0,8)+"01";
 $("to").value=d;
 await loadMembers();
 await loadDay();
 await loadPeriod();
}

async function loadMembers(){
 const d=await api("/api/members");
 members=d.rows||[];
 renderMembers();
}

function renderMembers(){
 $("memberList").innerHTML=members.map(m=>`
 <div class="memberItem">
  <b>${esc(m.name)}</b>
  <div class="memberActions">
   <button class="btn" onclick="editMember(${m.id})">Edit</button>
   <button class="btn red" onclick="deleteMember(${m.id})">Delete</button>
  </div>
 </div>`).join("")||"<div>No saved members.</div>";
}

async function addMember(){
 const name=$("memberName").value.trim();
 if(!name)return alert("Enter member name.");

 try{
  await api("/api/members",{
   method:"POST",
   body:JSON.stringify({name})
  });
  $("memberName").value="";
  await loadMembers();
  loadDay();
 }catch(e){alert(e.message)}
}

function editMember(id){
 const m=members.find(x=>Number(x.id)===Number(id));
 if(!m)return;
 editId=id;
 $("editName").value=m.name;
 $("modal").classList.remove("hidden");
}

async function saveEdit(){
 const name=$("editName").value.trim();
 if(!name)return;

 try{
  await api("/api/members/"+editId,{
   method:"PUT",
   body:JSON.stringify({name})
  });
  closeModal();
  await loadMembers();
  loadDay();
 }catch(e){alert(e.message)}
}

function closeModal(){
 editId=null;
 $("modal").classList.add("hidden");
}

async function deleteMember(id){
 const m=members.find(x=>Number(x.id)===Number(id));
 if(!m||!confirm("Delete "+m.name+" and all attendance records?"))return;

 try{
  await api("/api/members/"+id,{method:"DELETE"});
  await loadMembers();
  await loadDay();
  await loadPeriod();
 }catch(e){alert(e.message)}
}

async function loadDay(){
 const date=$("date").value;
 if(!date)return;

 try{
  const d=await api("/api/day?date="+date);
  day=d.rows||[];
  renderDay();
 }catch(e){alert(e.message)}
}

function renderDay(){
 $("attList").innerHTML=day.map((x,i)=>`
 <div class="attCard">
  <div class="attTop">
   <div class="attName">${esc(x.name)}</div>
   <div class="status">
    <button class="${x.status==="PRESENT"?"activePresent":""}" onclick="status(${i},'PRESENT')">✓ Present</button>
    <button class="${x.status!=="PRESENT"?"activeAbsent":""}" onclick="status(${i},'ABSENT')">✕ Absent</button>
   </div>
  </div>

  <div class="fields">
   <div class="field">
    <label>In Time</label>
    <input type="time" value="${x.in_time||""}" ${x.status!=="PRESENT"?"disabled":""}
    onchange="change(${i},'in_time',this.value)">
   </div>

   <div class="field">
    <label>Out Time</label>
    <input type="time" value="${x.out_time||""}" ${x.status!=="PRESENT"?"disabled":""}
    onchange="change(${i},'out_time',this.value)">
   </div>

   <div class="field">
    <label>Mic</label>
    <select ${x.status!=="PRESENT"?"disabled":""} onchange="change(${i},'mic',this.value)">
     <option value="0" ${!Number(x.mic)?"selected":""}>OFF</option>
     <option value="1" ${Number(x.mic)?"selected":""}>ON</option>
    </select>
   </div>

   <div class="field">
    <label>Video</label>
    <select ${x.status!=="PRESENT"?"disabled":""} onchange="change(${i},'video',this.value)">
     <option value="0" ${!Number(x.video)?"selected":""}>OFF</option>
     <option value="1" ${Number(x.video)?"selected":""}>ON</option>
    </select>
   </div>
  </div>

  <div class="timeBox">Prayer Time: ${fmt(x.total_minutes)}</div>
 </div>`).join("")||"<div>No saved members. Add members above.</div>";

 stats();
}

function status(i,s){
 const x=day[i];
 x.status=s;

 if(s==="ABSENT"){
  x.in_time="";
  x.out_time="";
  x.total_minutes=0;
  x.mic=0;
  x.video=0;
 }

 if(s==="PRESENT"){
  x.in_time=x.in_time||"05:00";
  x.out_time=x.out_time||"06:00";
 }

 renderDay();
}

function change(i,k,v){
 const x=day[i];
 x[k]=(k==="mic"||k==="video")?Number(v):v;

 if(x.in_time&&x.out_time){
  let a=x.in_time.split(":").map(Number);
  let b=x.out_time.split(":").map(Number);
  let n=b[0]*60+b[1]-a[0]*60-a[1];
  if(n<0)n+=1440;
  x.total_minutes=n;
 }else x.total_minutes=0;

 stats();
 document.querySelectorAll(".attCard")[i]
 ?.querySelector(".timeBox").textContent="Prayer Time: "+fmt(x.total_minutes);
}

function stats(){
 const total=day.length;
 const p=day.filter(x=>x.status==="PRESENT").length;
 const min=day.reduce((a,x)=>a+Number(x.total_minutes||0),0);

 $("membersCount").textContent=total;
 $("presentCount").textContent=p;
 $("absentCount").textContent=total-p;
 $("percent").textContent=total?Math.round(p/total*100)+"%":"0%";
 $("minutes").textContent=fmt(min);
}

function allPresent(){
 day.forEach(x=>{
  x.status="PRESENT";
  x.in_time=x.in_time||"05:00";
  x.out_time=x.out_time||"06:00";
 });
 renderDay();
}

async function saveAll(){
 if(!day.length)return alert("No members.");

 $("saveBtn").disabled=true;

 try{
  await api("/api/save",{
   method:"POST",
   body:JSON.stringify({
    rows:day.map(x=>({
     member_id:x.member_id,
     date:$("date").value,
     status:x.status,
     in_time:x.in_time||"",
     out_time:x.out_time||"",
     mic:x.mic||0,
     video:x.video||0
    }))
   })
  });

  alert("Attendance saved.");
  await loadDay();
  await loadPeriod();
 }catch(e){alert(e.message)}
 finally{$("saveBtn").disabled=false}
}

async function deleteDay(){
 const date=$("date").value;
 if(!confirm("Delete all attendance for "+date+"?"))return;

 try{
  await api("/api/delete-day?date="+date,{method:"DELETE"});
  await loadDay();
  await loadPeriod();
  alert("Deleted.");
 }catch(e){alert(e.message)}
}

async function loadPeriod(){
 const from=$("from").value,to=$("to").value;
 if(!from||!to)return;
 if(from>to)return alert("From date cannot be after To date.");

 try{
  const d=await api("/api/period?from="+from+"&to="+to);
  period=d.rows||[];
  const s=d.summary||{};

  $("rp").textContent=s.present||0;
  $("ra").textContent=s.absent||0;
  $("rr").textContent=s.total_records||0;
  $("rm").textContent=fmt(s.minutes);
  $("mic").textContent=s.mic||0;
  $("video").textContent=s.video||0;

  renderPeriod();
 }catch(e){alert(e.message)}
}

function renderPeriod(){
 const days={};

 period.forEach(x=>(days[x.date]??=[]).push(x));

 $("reportList").innerHTML=Object.keys(days).sort().map(d=>`
 <div class="reportDay">
  <div class="reportHead">
   <span>${d}</span>
   <span>${days[d].filter(x=>x.status==="PRESENT").length} Present</span>
  </div>
  ${days[d].map(x=>`
   <div class="reportPerson">
    <span>${esc(x.name)}</span>
    <span class="${x.status==="PRESENT"?"present":"absent"}">
     ${x.status==="PRESENT"?"Present":"Absent"}
    </span>
   </div>`).join("")}
 </div>`).join("")||"<div>No attendance records.</div>";
}

function downloadCSV(){
 if(!period.length)return alert("Load a period first.");

 const rows=[["Date","Name","Status","In","Out","Prayer Time","Mic","Video"]];
 period.forEach(x=>rows.push([
  x.date,x.name,x.status,x.in_time||"",x.out_time||"",
  fmt(x.total_minutes),Number(x.mic)?"ON":"OFF",Number(x.video)?"ON":"OFF"
 ]));

 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
 a.download=`prayer-attendance-${$("from").value}-to-${$("to").value}.csv`;
 a.click();
}

function downloadPDF(){
 if(!period.length)return alert("Load a period first.");

 const rows=period.map(x=>`
 <tr>
  <td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${x.status}</td>
  <td>${x.in_time||"-"}</td><td>${x.out_time||"-"}</td>
  <td>${fmt(x.total_minutes)}</td>
  <td>${Number(x.mic)?"ON":"OFF"}</td>
  <td>${Number(x.video)?"ON":"OFF"}</td>
 </tr>`).join("");

 const w=open("","_blank");
 w.document.write(`
 <html><head><title>Prayer Attendance</title>
 <style>
 body{font:12px Arial;padding:20px}h1,h2{text-align:center;color:#102a56}
 table{width:100%;border-collapse:collapse}
 th,td{border:1px solid #ccc;padding:6px}
 th{background:#102a56;color:white}
 </style></head><body>
 <h1>Korea - Sri Lanka Prayer Group</h1>
 <h2>Prayer Attendance Report</h2>
 <p style="text-align:center">Period: ${$("from").value} to ${$("to").value}</p>
 <table>
 <tr><th>Date</th><th>Name</th><th>Status</th><th>In</th><th>Out</th><th>Time</th><th>Mic</th><th>Video</th></tr>
 ${rows}</table>
 <script>onload=()=>setTimeout(()=>print(),400)<\/script>
 </body></html>`);
 w.document.close();
}

function go(id){
 $("menuBox").classList.add("hidden");
 $(id).scrollIntoView({behavior:"smooth"});
}

function logout(){
 localStorage.removeItem(KEY);
 location.reload();
}

$("loginBtn").onclick=login;
$("password").onkeydown=e=>e.key==="Enter"&&login();
$("menuBtn").onclick=()=>$("menuBox").classList.toggle("hidden");
$("addBtn").onclick=addMember;
$("loadBtn").onclick=loadDay;
$("saveBtn").onclick=saveAll;
$("save2").onclick=saveAll;
$("allBtn").onclick=allPresent;
$("deleteDay").onclick=deleteDay;
$("reportBtn").onclick=loadPeriod;
$("csvBtn").onclick=downloadCSV;
$("pdfBtn").onclick=downloadPDF;
$("cancel").onclick=closeModal;
$("editSave").onclick=saveEdit;
$("date").onchange=loadDay;
$("from").onchange=loadPeriod;
$("to").onchange=loadPeriod;

check();
</script>
</body>
</html>
