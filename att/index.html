
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Lanka–Korea Prayer Group Attendance</title>
<style>
:root{--bg:#0b1628;--panel:#13233b;--gold:#ffd166;--text:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif;padding:12px}
main{max-width:1100px;margin:auto}
header{text-align:center;padding:16px}
h1{color:var(--gold);font-size:23px}
.panel{background:var(--panel);padding:14px;border-radius:12px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
input,select,button{padding:10px;border-radius:7px;border:1px solid #52627a;font:inherit}
input,select{background:#fff;color:#111;max-width:100%}
button{background:var(--gold);color:#172033;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#dce5f2}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;background:#fff;color:#172033}
th,td{border:1px solid #cbd5e1;padding:5px;text-align:center}
th{background:#e7edf6}
th:first-child,td:first-child{position:sticky;left:0;background:#f1f5f9;z-index:1}
.name{width:145px;min-width:125px}
.cell{min-width:42px;height:38px;background:#fff;color:#172033;border:1px solid #ccd4df;padding:3px}
.marks{font-size:11px;display:block;max-width:75px;overflow-wrap:anywhere}
.small{font-size:12px;color:#cbd5e1}
#status{margin:10px 0;color:var(--gold)}
@media print{
 body{background:#fff;color:#000;padding:0}
 .no-print{display:none!important}
 .panel{background:#fff;padding:0}
 h1{color:#000}
 .table-wrap{overflow:visible}
 table{font-size:9px}
 th,td{padding:3px}
 th:first-child,td:first-child{position:static}
}
</style>
</head>
<body>
<main>
<header>
<h1>SRI LANKA – KOREA PRAYER GROUP</h1>
<p>Monthly Prayer Meeting Attendance</p>
</header>

<section class="panel no-print">
<div class="controls">
<label>Month <select id="month"></select></label>
<label>Year <input id="year" type="number" min="2000" max="2100" style="width:90px"></label>
<label>Group <input id="group" value="Prayer Group"></label>
<button onclick="changeMonth()">Open Month</button>
<button onclick="addMember()">+ Add Member</button>
<button onclick="saveLocal()">Save</button>
<button class="secondary" onclick="print()">Print / PDF</button>
<button class="secondary" onclick="exportCSV()">Export CSV</button>
<button class="secondary" onclick="downloadBackup()">Backup</button>
<button class="secondary" onclick="document.getElementById('backupFile').click()">Restore</button>
<input id="backupFile" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)">
</div>
<div id="status">Ready. Attendance is saved in this browser.</div>
<p class="small">✓ Present · X Absent · △ Video off · M Mic off · L Late in · E Early out</p>
</section>

<section class="panel">
<div class="table-wrap">
<table id="attendance">
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</section>

<section class="panel">
<h3>Monthly Report</h3>
<div class="table-wrap">
<table id="report">
<thead><tr><th>Member</th><th>✓ Present</th><th>X Absent</th><th>△ Video</th><th>M Mic</th><th>L Late</th><th>E Early</th></tr></thead>
<tbody id="reportBody"></tbody>
</table>
</div>
</section>
</main>

<script>
const symbols = ["✓","X","△","M","L","E"];
const symbolNames = {
 "✓":"Present","X":"Absent","△":"Video off",
 "M":"Mic off","L":"Late in","E":"Early out"
};
const months = [
 "January","February","March","April","May","June",
 "July","August","September","October","November","December"
];
const KEY = "slkPrayerAttendance_v1";
let records = {};
let members = [
 "Pas. Sathyanathan","Pas. John","Pas. Pushparani",
 "Pas. Chandram","Pas. Georaye","Pas. Pushpavalli",
 "Pas. Rani","Pas. Balasingam","Pas. Nixon",
 "Pas. Siva","Pas. Mohan","Pas. Vinothan","Pas. Vijay"
];
let active = {};
let currentMonth, currentYear;

const $ = id => document.getElementById(id);
months.forEach((m,i)=>{
 const option = document.createElement("option");
 option.value = i;
 option.textContent = m;
 $("month").appendChild(option);
});
const today = new Date();
$("month").value = today.getMonth();
$("year").value = today.getFullYear();

function key(){
 return ($("group").value.trim() || "Prayer Group") +
   "|" + currentYear + "|" + currentMonth;
}
function readStorage(){
 try {
  const raw = localStorage.getItem(KEY);
  if(raw){
   const saved = JSON.parse(raw);
   records = saved.records || {};
   if(Array.isArray(saved.members) && saved.members.length)
    members = saved.members;
  }
 } catch(e){ alert("Could not read saved browser data."); }
}
function saveLocal(){
 records[key()] = active;
 try {
  localStorage.setItem(KEY, JSON.stringify({records,members}));
  $("status").textContent = "Saved on this device: " +
    months[currentMonth] + " " + currentYear;
 } catch(e) {
  $("status").textContent = "Save failed. Export a backup.";
 }
}
function changeMonth(){
 saveCurrentWithoutMessage();
 currentMonth = Number($("month").value);
 currentYear = Number($("year").value);
 if(!Number.isInteger(currentYear)||currentYear<2000||currentYear>2100){
  alert("Enter a year from 2000 to 2100."); return;
 }
 active = JSON.parse(JSON.stringify(records[key()] || {}));
 render();
 $("status").textContent = "Opened " + months[currentMonth] + " " + currentYear;
}
function saveCurrentWithoutMessage(){
 if(currentMonth !== undefined) records[key()] = active;
}
function addMember(){
 const name = prompt("Enter member name:");
 if(!name || !name.trim()) return;
 members.push(name.trim());
 render();
 saveLocal();
}
function updateMark(member, day){
 const current = active[member]?.[day] || [];
 const options = symbols.map((s,i)=>
   (i+1)+". "+s+" — "+symbolNames[s]).join("\n");
 const answer = prompt(
  member + " — " + day + " " + months[currentMonth] +
  "\nEnter symbol numbers separated by commas.\n"+
  "Example: 1,3 = Present + Video off\nEnter 0 to clear.\n\n"+options,
  current.map(s=>symbols.indexOf(s)+1).join(",")
 );
 if(answer === null) return;
 if(answer.trim()==="0" || answer.trim()===""){
  if(active[member]) delete active[member][day];
 } else {
  const picked = [...new Set(answer.split(",")
   .map(x=>Number(x.trim()))
   .filter(n=>Number.isInteger(n)&&n>=1&&n<=symbols.length))]
   .map(n=>symbols[n-1]);
  if(!active[member]) active[member]={};
  if(picked.length) active[member][day]=picked;
  else delete active[member][day];
 }
 render();
 saveLocal();
}
function render(){
 const days = new Date(currentYear,currentMonth+1,0).getDate();
 $("thead").innerHTML = "";
 const hr = document.createElement("tr");
 ["No.","Member",...Array.from({length:days},(_,i)=>i+1)]
  .forEach(text=>{
   const th=document.createElement("th");
   th.textContent=text; hr.appendChild(th);
  });
 $("thead").appendChild(hr);
 const body=$("tbody"); body.innerHTML="";
 members.forEach((name,index)=>{
  const tr=document.createElement("tr");
  const num=document.createElement("td"); num.textContent=index+1;tr.appendChild(num);
  const td=document.createElement("td");
  const input=document.createElement("input");
  input.className="name";input.value=name;
  input.addEventListener("change",()=>{
   const old=members[index], value=input.value.trim()||old;
   if(value!==old){
    members[index]=value;
    if(active[old]){active[value]=active[old];delete active[old];}
    saveLocal();render();
   }
  });
  td.appendChild(input);tr.appendChild(td);
  for(let day=1;day<=days;day++){
   const cell=document.createElement("td");
   const btn=document.createElement("button");
   btn.className="cell";
   const marks=active[name]?.[day]||[];
   btn.innerHTML='<span class="marks"></span>';
   btn.querySelector(".marks").textContent=marks.join(" ");
   btn.title="Tap to mark attendance";
   btn.onclick=()=>updateMark(name,day);
   cell.appendChild(btn);tr.appendChild(cell);
  }
  body.appendChild(tr);
 });
 renderReport();
}
function renderReport(){
 const body=$("reportBody");body.innerHTML="";
 members.forEach(name=>{
  const counts=Object.fromEntries(symbols.map(s=>[s,0]));
  Object.values(active[name]||{}).forEach(dayMarks=>{
   dayMarks.forEach(s=>{if(counts[s]!==undefined)counts[s]++;});
  });
  const tr=document.createElement("tr");
  [name,...symbols.map(s=>counts[s])].forEach(value=>{
   const td=document.createElement("td");td.textContent=value;tr.appendChild(td);
  });
  body.appendChild(tr);
 });
}
function exportCSV(){
 const days=new Date(currentYear,currentMonth+1,0).getDate();
 const rows=[["Member",...Array.from({length:days},(_,i)=>i+1),
  "Present","Absent","Video off","Mic off","Late in","Early out"]];
 members.forEach(name=>{
  const counts=Object.fromEntries(symbols.map(s=>[s,0]));
  const marks=Array.from({length:days},(_,i)=>{
   const dayMarks=active[name]?.[i+1]||[];
   dayMarks.forEach(s=>counts[s]++);
   return dayMarks.join(" ");
  });
  rows.push([name,...marks,...symbols.map(s=>counts[s])]);
 });
 const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
 downloadFile(csv,months[currentMonth]+"-"+currentYear+"-attendance.csv","text/csv;charset=utf-8");
}
function downloadBackup(){
 saveLocal();
 downloadFile(JSON.stringify({records,members},null,2),
  "prayer-attendance-backup.json","application/json");
}
function restoreBackup(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!data.records || !Array.isArray(data.members)) throw Error();
   if(!confirm("Restore backup? Current browser records will be replaced."))return;
   records=data.records;members=data.members;
   localStorage.setItem(KEY,JSON.stringify({records,members}));
   active=JSON.parse(JSON.stringify(records[key()]||{}));
   render();$("status").textContent="Backup restored.";
  }catch(e){alert("Invalid backup file.");}
 };
 reader.readAsText(file);event.target.value="";
}
function downloadFile(content,name,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=name;a.click();
 URL.revokeObjectURL(url);
}
readStorage();
currentMonth=Number($("month").value);
currentYear=Number($("year").value);
active=JSON.parse(JSON.stringify(records[key()]||{}));
render();
</script>
</body>
</html>
