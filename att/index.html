

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Attendance</title>
<style>
:root{--navy:#102a56;--gold:#d69b16;--bg:#f3f6fb;--line:#dce3ed}
*{box-sizing:border-box}
body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:#17243a}
header{background:var(--navy);color:white;padding:14px 16px;border-bottom:3px solid var(--gold)}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
main{max-width:1500px;margin:auto;padding:12px}
.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px}
button{border:0;border-radius:6px;padding:9px 12px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.primary{background:var(--navy);color:white}
.gold{background:var(--gold);color:#211700}
.secondary{background:#e8edf5;color:var(--navy)}
.danger{background:#fee2e2;color:#991b1b}
.small{padding:6px 8px;font-size:12px}
input,select,textarea{font:13px Arial;width:100%;min-width:0;padding:7px;border:1px solid #cbd5e1;border-radius:5px;background:white}
label{font-weight:bold;font-size:12px}
.field{flex:1 1 130px;min-width:0}
.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.toolbar button{min-height:34px}
.hidden{display:none!important}
.muted{font-size:12px;color:#64748b}
.notice{display:none;padding:9px;margin-bottom:10px;border-radius:6px}
.notice.show{display:block}
.notice.error{background:#fee2e2;color:#991b1b}
.notice.success{background:#dcfce7;color:#166534}
.notice.info{background:#dbeafe;color:#1e40af}
.login{max-width:360px;margin:25px auto}
.login .panel{padding:18px}
.stack{display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:white;border:1px solid var(--line);border-radius:8px;padding:10px}
.stat span{display:block;color:#64748b;font-size:11px}
.stat strong{display:block;font-size:21px;margin-top:4px}
.table-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:6px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:#edf2f9;font-size:11px;white-space:nowrap}
td{background:white;font-size:12px}
thead th{position:sticky;top:0;z-index:3}
th:first-child,td:first-child{position:sticky;left:0;min-width:130px;z-index:2;background:#f8fafc}
thead th:first-child{z-index:4;background:#e4ebf5}
.day{min-width:190px}
.day select,.day input,.day textarea{margin-bottom:5px}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin:3px 0 6px}
.checks label{display:flex;align-items:center;gap:3px;font-weight:normal}
.checks input{width:auto;margin:0}
.member{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
#membersList{display:grid;gap:0}
footer{text-align:center;padding:12px;color:#64748b;font-size:11px}
@media(max-width:600px){main{padding:7px}.panel{padding:9px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}.day{min-width:175px}}
@media print{
header{padding:8px}h1{font-size:17px}main{padding:0;background:white}
#loginSection,#membersPanel,.no-print,#message,.save-status{display:none!important}
.panel{border:0;padding:4px;margin:0}.table-wrap{max-height:none;overflow:visible}
thead th,th:first-child,td:first-child{position:static}
.day{min-width:150px}input,select,textarea{border:0;padding:2px;appearance:none}
}
</style>
</head>
<body>
<header><h1>Daily Prayer Meeting Attendance</h1></header>
<main>
<div id="message" class="notice" role="status"></div>

<section id="loginSection" class="login">
<div class="panel">
<h2>Admin Login</h2>
<form id="loginForm" class="stack">
<input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
<button class="primary">Sign In</button>
</form>
</div>
</section>

<section id="appSection" class="hidden">
<div class="toolbar no-print">
<div class="field"><label for="month">Month</label><input id="month" type="month" required></div>
<div class="field"><label for="meeting">Meeting</label><input id="meeting" value="Daily Prayer Meeting"></div>
<button id="loadBtn" class="primary">Load</button>
<button id="printBtn" class="secondary">Print</button>
<button id="exportBtn" class="gold">CSV</button>
<button id="logoutBtn" class="danger">Logout</button>
</div>

<div class="stats">
<div class="stat"><span>Active Members</span><strong id="statMembers">0</strong></div>
<div class="stat"><span>Marked Records</span><strong id="statRecords">0</strong></div>
<div class="stat"><span>Absent</span><strong id="statAbsent">0</strong></div>
<div class="stat"><span>Video/Mic Off</span><strong id="statOff">0</strong></div>
</div>

<section class="panel">
<h2>Monthly Attendance</h2>
<div id="sheetStatus" class="muted" style="margin-bottom:7px"></div>
<div class="table-wrap">
<table>
<thead id="attendanceHead"></thead>
<tbody id="attendanceBody"></tbody>
</table>
</div>
</section>

<section class="panel no-print" id="membersPanel">
<h2>Manage Members</h2>
<form id="memberForm" class="toolbar">
<div class="field"><label for="memberName">Name</label><input id="memberName" maxlength="120" required></div>
<div class="field"><label for="memberRole">Role</label><input id="memberRole" maxlength="120" placeholder="Pastor / Member"></div>
<button class="primary">Add</button>
</form>
<div id="membersList"></div>
</section>
</section>
</main>
<footer>Prayer Attendance Register</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const state={authenticated:false,pastors:[],records:new Map(),month:"",meeting:"Daily Prayer Meeting"};

function localMonth(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function daysInMonth(m){
const [y,mo]=m.split("-").map(Number);
return new Date(y,mo,0).getDate();
}
function dateFor(d){return state.month+"-"+String(d).padStart(2,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function key(id,date,meeting){return `${id}|${date}|${meeting}`}
function msg(text,type="info"){
$("message").textContent=text;
$("message").className="notice show "+type;
}
async function api(url,options={}){
const opt={credentials:"same-origin",...options};
opt.headers={...(options.headers||{})};
if(options.body&&typeof options.body!=="string"){
opt.headers["Content-Type"]="application/json";
opt.body=JSON.stringify(options.body);
}
const res=await fetch(url,opt);
const ct=res.headers.get("content-type")||"";
const data=ct.includes("application/json")?await res.json():await res.text();
if(!res.ok)throw Error(data?.error||data||`HTTP ${res.status}`);
return data;
}
function showLogin(){
state.authenticated=false;
$("loginSection").classList.remove("hidden");
$("appSection").classList.add("hidden");
}
function showApp(){
state.authenticated=true;
$("loginSection").classList.add("hidden");
$("appSection").classList.remove("hidden");
}
async function checkSession(){
try{
const r=await api("/api/me");
if(r&&(r.authenticated||r.ok||r.user)){
showApp();await refresh();
}else showLogin();
}catch{showLogin()}
}

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
const btn=e.submitter;btn.disabled=true;
try{
await api("/api/login",{method:"POST",body:{password:$("password").value}});
$("password").value="";
showApp();await refresh();msg("Signed in.","success");
}catch(err){msg("Login failed: "+err.message,"error")}
finally{btn.disabled=false}
});
$("logoutBtn").onclick=async()=>{
try{await api("/api/logout",{method:"POST"})}catch{}
showLogin();msg("Logged out.");
};
$("month").value=localMonth();
$("loadBtn").onclick=refresh;
$("month").addEventListener("change",()=>{state.month=$("month").value});
$("meeting").addEventListener("change",()=>{state.meeting=$("meeting").value.trim()||"Daily Prayer Meeting"});
$("printBtn").onclick=()=>window.print();
$("exportBtn").onclick=()=>{
const from=state.month+"-01";
const to=state.month+"-"+String(daysInMonth(state.month)).padStart(2,"0");
location.href="/api/export.csv?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to);
};

async function refresh(){
if(!state.authenticated)return;
state.month=$("month").value||localMonth();
state.meeting=$("meeting").value.trim()||"Daily Prayer Meeting";
$("sheetStatus").textContent="Loading...";
try{
const [p,m]=await Promise.all([
api("/api/pastors"),
api("/api/monthly?month="+encodeURIComponent(state.month)+"&meeting="+encodeURIComponent(state.meeting))
]);
state.pastors=Array.isArray(p)?p:(p.pastors||p.members||[]);
const rows=Array.isArray(m)?m:(m.records||m.attendance||[]);
state.records.clear();
rows.forEach(r=>state.records.set(key(r.pastor_id??r.pastorId,r.date,r.meeting||state.meeting),r));
renderMembers();renderSheet();updateStats();
$("sheetStatus").textContent=state.month+" · "+state.meeting;
}catch(err){
$("sheetStatus").textContent="Load failed.";
msg("Unable to load: "+err.message,"error");
}
}
function activePastors(){
return state.pastors.filter(p=>Number(p.active??1)===1);
}
function getRecord(id,date){
return state.records.get(key(id,date,state.meeting))||{
pastor_id:id,date,meeting:state.meeting,status:"",video_off:0,mic_off:0,
arrival_time:"",departure_time:"",remarks:"",total_minutes:0
};
}
function renderSheet(){
const days=daysInMonth(state.month),members=activePastors();
$("attendanceHead").innerHTML="<tr><th>Pastor / Member</th>"+
Array.from({length:days},(_,i)=>`<th>${i+1}<br>${dateFor(i+1)}</th>`).join("")+"</tr>";
if(!members.length){
$("attendanceBody").innerHTML=`<tr><td colspan="${days+1}">Add members below.</td></tr>`;
return;
}
$("attendanceBody").innerHTML=members.map(p=>{
const id=Number(p.id);
return `<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"")}</div></td>`+
Array.from({length:days},(_,i)=>{
const date=dateFor(i+1),r=getRecord(id,date);
return `<td class="day" data-pastor="${id}" data-date="${date}">
<select data-field="status" aria-label="Status">
<option value="" ${r.status===""?"selected":""}>Not marked</option>
<option value="Present" ${r.status==="Present"?"selected":""}>Present</option>
<option value="Absent" ${r.status==="Absent"?"selected":""}>Absent</option>
<option value="Late" ${r.status==="Late"?"selected":""}>Late</option>
<option value="Excused" ${r.status==="Excused"?"selected":""}>Excused</option>
</select>
<div class="checks">
<label><input data-field="video_off" type="checkbox" ${Number(r.video_off)?"checked":""}> Video OFF</label>
<label><input data-field="mic_off" type="checkbox" ${Number(r.mic_off)?"checked":""}> Mic OFF</label>
</div>
<input data-field="arrival_time" type="time" value="${esc(r.arrival_time||"")}" aria-label="Arrival">
<input data-field="departure_time" type="time" value="${esc(r.departure_time||"")}" aria-label="Departure">
<textarea data-field="remarks" rows="1" maxlength="500" placeholder="Remarks">${esc(r.remarks||"")}</textarea>
<button class="primary small save-button" data-save="${id}" data-date="${date}">Save</button>
<span class="save-status muted"></span>
</td>`;
}).join("")+"</tr>";
}).join("");
}
$("attendanceBody").addEventListener("click",async e=>{
const b=e.target.closest("[data-save]");if(!b)return;
const td=b.closest("td"),id=Number(b.dataset.save),date=b.dataset.date;
const f=n=>td.querySelector(`[data-field="${n}"]`);
const arrival=f("arrival_time").value,departure=f("departure_time").value;
if(arrival&&departure&&departure<arrival){msg("Departure must be after arrival.","error");return}
let total=0;
if(arrival&&departure){
const [ah,am]=arrival.split(":").map(Number),[dh,dm]=departure.split(":").map(Number);
total=dh*60+dm-ah*60-am;
}
const record={
pastor_id:id,date,meeting:state.meeting,status:f("status").value,
video_off:f("video_off").checked?1:0,
mic_off:f("mic_off").checked?1:0,
arrival_time:arrival,departure_time:departure,total_minutes:total,
remarks:f("remarks").value.trim()
};
b.disabled=true;
const label=td.querySelector(".save-status");label.textContent="Saving...";
try{
const saved=await api("/api/attendance",{method:"POST",body:record});
state.records.set(key(id,date,state.meeting),{...record,...(saved.record||saved.attendance||saved)});
label.textContent="Saved";updateStats();msg("Saved "+date,"success");
}catch(err){label.textContent="Failed";msg("Save failed: "+err.message,"error")}
finally{b.disabled=false}
});
function updateStats(){
const from=state.month+"-01",to=state.month+"-"+String(daysInMonth(state.month)).padStart(2,"0");
const rows=[...state.records.values()].filter(r=>r.date>=from&&r.date<=to&&(r.meeting||state.meeting)===state.meeting);
$("statMembers").textContent=activePastors().length;
$("statRecords").textContent=rows.filter(r=>r.status).length;
$("statAbsent").textContent=rows.filter(r=>r.status==="Absent").length;
$("statOff").textContent=rows.filter(r=>Number(r.video_off)||Number(r.mic_off)).length;
}
$("memberForm").addEventListener("submit",async e=>{
e.preventDefault();
const name=$("memberName").value.trim(),role=$("memberRole").value.trim();
if(!name)return;
try{
await api("/api/pastors",{method:"POST",body:{name,role}});
$("memberName").value="";$("memberRole").value="";
await refresh();msg("Member added.","success");
}catch(err){msg("Add failed: "+err.message,"error")}
});
function renderMembers(){
const list=$("membersList");
const all=[...state.pastors].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
list.innerHTML=all.length?all.map(p=>{
const active=Number(p.active??1)===1;
return `<div class="member"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"Member")} · ${active?"Active":"Inactive"}</div></div>
<button class="${active?"danger":"secondary"} small" data-toggle-member="${Number(p.id)}" data-active="${active?1:0}">${active?"Deactivate":"Reactivate"}</button></div>`;
}).join(""):"<p class='muted'>No members added.</p>";
}
$("membersList").addEventListener("click",async e=>{
const b=e.target.closest("[data-toggle-member]");if(!b)return;
b.disabled=true;
try{
await api("/api/pastors/"+Number(b.dataset.toggleMember),{
method:"PATCH",body:{active:Number(b.dataset.active)===1?0:1}
});
await refresh();msg("Member updated.","success");
}catch(err){msg("Update failed: "+err.message,"error")}
finally{b.disabled=false}
});
checkSession();
</script>
</body>
</html>
