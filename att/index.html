<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f5f7fb;color:#102a56}
header{background:#102a56;color:#fff;padding:16px;text-align:center}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
nav button,.btn{border:0;border-radius:8px;padding:9px 12px;background:#d69b16;color:#fff;cursor:pointer}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.table{overflow:auto}
.hidden{display:none}
.danger{background:#d33!important}
h2,h3{margin-top:0}
#app{display:none}
.login{max-width:400px;margin:80px auto}
</style>
</head>

<body>

<div id="login" class="login card">
<h2>Prayer Attendance</h2>
<input id="password" type="password" placeholder="Admin Password">
<br><br>
<button class="btn" onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div id="app">
<header>
<h2>Prayer Attendance</h2>
<div>Korea - Sri Lanka Prayer Group</div>
<nav>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('attendance')">Attendance</button>
<button onclick="show('ranking')">Ranking</button>
<button onclick="csv()">Download CSV</button>
<button onclick="pdf()">Download PDF</button>
<button onclick="logout()">Logout</button>
</nav>
</header>

<main>

<div class="card">
<div class="grid">
<div>
<label>Month</label>
<input id="month" type="month" onchange="loadAll()">
</div>
<div>
<label>Date</label>
<input id="date" type="date" onchange="loadDate()">
</div>
</div>
<br>
<button class="btn" onclick="loadAll()">Refresh</button>
</div>

<section id="dashboard">
<div class="card">
<h3>Monthly Summary</h3>
<div id="summary" class="grid"></div>
</div>
</section>

<section id="attendance" class="hidden">

<div class="card">
<h3>Update Attendance</h3>

<div class="grid">
<div>
<label>Name</label>
<select id="name" onchange="newNameToggle()"></select>
</div>

<div id="newBox" class="hidden">
<label>New Name</label>
<input id="newPerson" placeholder="Enter name">
</div>

<div>
<label>Date</label>
<input id="adate" type="date">
</div>

<div>
<label>In</label>
<input id="inTime" type="time" value="05:00">
</div>

<div>
<label>Out</label>
<input id="outTime" type="time" value="06:00">
</div>

<div>
<label>Mic</label>
<select id="mic">
<option value="0">OFF</option>
<option value="1">ON</option>
</select>
</div>

<div>
<label>Camera</label>
<select id="camera">
<option value="0">OFF</option>
<option value="1">ON</option>
</select>
</div>
</div>

<br>
<button class="btn" onclick="saveAttendance()">Update / Add</button>
</div>

<div class="card">
<h3>Attendance Records</h3>
<div class="table">
<table>
<thead>
<tr>
<th>Name</th><th>Date</th><th>In</th><th>Out</th>
<th>Total</th><th>Mic</th><th>Camera</th><th>Action</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</div>

</section>

<section id="ranking" class="hidden">
<div class="card">
<h3>Monthly Ranking</h3>
<div class="table">
<table>
<thead>
<tr>
<th>Rank</th><th>Name</th><th>Meetings</th>
<th>Prayer Time</th><th>Mic</th><th>Camera</th><th>Both</th>
</tr>
</thead>
<tbody id="rank"></tbody>
</table>
</div>
</div>
</section>

</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
const API="https://attendance.createlk.workers.dev";
const KEY="prayer_attendance_admin";
let data=[],ranking=[];

const $=id=>document.getElementById(id);

function headers(){
 return {
  "Content-Type":"application/json",
  "X-Admin-Key":localStorage.getItem(KEY)||""
 };
}

async function api(url,opt={}){
 opt.headers={...headers(),...(opt.headers||{})};
 let r=await fetch(API+url,opt);
 let j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error||"Request failed");
 return j;
}

async function login(){
 try{
  let j=await api("/api/login",{
   method:"POST",
   body:JSON.stringify({password:$("password").value})
  });
  if(j.success!==false){
   localStorage.setItem(KEY,j.admin_key||$("password").value);
   openApp();
  }
 }catch(e){$("loginMsg").textContent=e.message}
}

async function check(){
 if(!localStorage.getItem(KEY))return;
 try{
  await api("/api/check-login");
  openApp();
 }catch(e){localStorage.removeItem(KEY)}
}

function openApp(){
 $("login").style.display="none";
 $("app").style.display="block";

 let d=new Date();
 $("month").value=d.toISOString().slice(0,7);
 $("date").value=d.toISOString().slice(0,10);
 $("adate").value=$("date").value;

 loadAll();
}

function logout(){
 localStorage.removeItem(KEY);
 location.reload();
}

function show(id){
 ["dashboard","attendance","ranking"].forEach(x=>
  $(x).classList.toggle("hidden",x!==id)
 );
}

async function loadAll(){
 try{
  let m=$("month").value;
  let j=await api("/api/attendance?month="+m);
  data=j.attendance||j.records||j||[];

  saveNames(data);
  loadNames();

  let s=await api("/api/summary?month="+m);
  let x=s.summary||s;

  $("summary").innerHTML=[
   ["Meetings",x.meetings||0],
   ["People",x.people||0],
   ["Prayer Time",fmt(x.total_minutes||0)],
   ["Mic",x.mic||0],
   ["Camera",x.camera||0],
   ["Both",x.both||0]
  ].map(a=>`<div class="card"><b>${a[0]}</b><h3>${a[1]}</h3></div>`).join("");

  render();
  loadRank();
 }catch(e){alert(e.message)}
}

function saveNames(a){
 let names=JSON.parse(localStorage.getItem("prayer_names")||"[]");
 a.forEach(x=>{
  if(x.name&&!names.includes(x.name))names.push(x.name);
 });
 names.sort();
 localStorage.setItem("prayer_names",JSON.stringify(names));
}

function loadNames(){
 let names=JSON.parse(localStorage.getItem("prayer_names")||"[]");
 $("name").innerHTML=
 `<option value="">Select Name</option>`+
 names.map(n=>`<option>${esc(n)}</option>`).join("")+
 `<option value="__new__">＋ Add New Person</option>`;
}

function newNameToggle(){
 $("newBox").classList.toggle("hidden",$("name").value!=="__new__");
}

function loadDate(){
 $("adate").value=$("date").value;
 let d=$("date").value;
 let r=data.find(x=>x.date===d);
 if(r){
  $("name").value=r.name;
  $("inTime").value=r.in_time||"05:00";
  $("outTime").value=r.out_time||"06:00";
  $("mic").value=r.mic?1:0;
  $("camera").value=r.camera?1:0;
 }else{
  $("name").value="";
  $("inTime").value="05:00";
  $("outTime").value="06:00";
  $("mic").value=0;
  $("camera").value=0;
 }
}

async function saveAttendance(){
 let name=$("name").value;

 if(name==="__new__"){
  name=$("newPerson").value.trim();
  if(name){
   let names=JSON.parse(localStorage.getItem("prayer_names")||"[]");
   if(!names.includes(name))names.push(name);
   names.sort();
   localStorage.setItem("prayer_names",JSON.stringify(names));
  }
 }

 if(!name||!$("adate").value)return alert("Select name and date");

 let old=data.find(x=>x.name===name&&x.date===$("adate").value);

 let body={
  name,
  date:$("adate").value,
  in_time:$("inTime").value,
  out_time:$("outTime").value,
  mic:+$("mic").value,
  camera:+$("camera").value
 };

 try{
  if(old){
   await api("/api/attendance/"+old.id,{
    method:"PUT",body:JSON.stringify(body)
   });
  }else{
   await api("/api/attendance",{
    method:"POST",body:JSON.stringify(body)
   });
  }

  $("newPerson").value="";
  loadNames();
  await loadAll();
  $("date").value=$("adate").value;
  alert(old?"Attendance updated":"Attendance added");
 }catch(e){alert(e.message)}
}

function render(){
 $("records").innerHTML=data.map(x=>`
 <tr>
 <td>${esc(x.name)}</td>
 <td>${x.date}</td>
 <td>${x.in_time||""}</td>
 <td>${x.out_time||""}</td>
 <td>${fmt(mins(x.in_time,x.out_time))}</td>
 <td>${x.mic?"ON":"OFF"}</td>
 <td>${x.camera?"ON":"OFF"}</td>
 <td><button class="btn" onclick="edit(${x.id})">Edit</button></td>
 </tr>
 `).join("");
}

function edit(id){
 let x=data.find(a=>a.id==id);
 if(!x)return;

 $("adate").value=x.date;
 $("name").value=x.name;
 $("inTime").value=x.in_time||"05:00";
 $("outTime").value=x.out_time||"06:00";
 $("mic").value=x.mic?1:0;
 $("camera").value=x.camera?1:0;

 show("attendance");
}

async function loadRank(){
 try{
  let j=await api("/api/ranking?month="+$("month").value);
  ranking=j.ranking||j||[];

  $("rank").innerHTML=ranking.map((x,i)=>`
  <tr>
   <td>${i+1}</td>
   <td>${esc(x.name)}</td>
   <td>${x.meetings||0}</td>
   <td>${fmt(x.total_minutes||x.minutes||0)}</td>
   <td>${x.mic||0}</td>
   <td>${x.camera||0}</td>
   <td>${x.both||0}</td>
  </tr>`).join("");
 }catch(e){}
}

function mins(a,b){
 if(!a||!b)return 0;
 let x=new Date("2000-01-01T"+a);
 let y=new Date("2000-01-01T"+b);
 if(y<x)y.setDate(y.getDate()+1);
 return Math.max(0,Math.round((y-x)/60000));
}

function fmt(n){
 n=+n||0;
 return Math.floor(n/60)+"h "+n%60+"m";
}

function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[m]));
}

function csv(){
 let rows=[
  ["Name","Date","In","Out","Minutes","Mic","Camera"],
  ...data.map(x=>[
   x.name,x.date,x.in_time,x.out_time,
   mins(x.in_time,x.out_time),
   x.mic?"ON":"OFF",
   x.camera?"ON":"OFF"
  ])
 ];

 let blob=new Blob(
  [rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],
  {type:"text/csv"}
 );

 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="prayer-attendance-"+$("month").value+".csv";
 a.click();
}

function pdf(){
 let {jsPDF}=window.jspdf;
 let doc=new jsPDF();

 doc.setFontSize(18);
 doc.text("Korea - Sri Lanka Prayer Group",14,18);
 doc.setFontSize(12);
 doc.text("Monthly Prayer Attendance - "+$("month").value,14,27);
 doc.text("Prayer Time: 5:00 AM - 6:00 AM",14,35);

 doc.autoTable({
  startY:43,
  head:[["Name","Date","In","Out","Total","Mic","Camera"]],
  body:data.map(x=>[
   x.name,x.date,x.in_time,x.out_time,
   fmt(mins(x.in_time,x.out_time)),
   x.mic?"ON":"OFF",
   x.camera?"ON":"OFF"
  ])
 });

 doc.save("prayer-attendance-"+$("month").value+".pdf");
}

check();
</script>
</body>
</html>
