<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#102a56;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
button,select,input,textarea{font:inherit}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer}
.btn{background:#102a56;color:#fff}
.btn.red{background:#d93025}
.btn.green{background:#188038}
.btn.gray{background:#666}
.container{max-width:1200px;margin:auto;padding:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav button{background:#ddd}
.nav button.active{background:#102a56;color:#fff}
.section{display:none}
.section.active{display:block}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:15px;box-shadow:0 1px 5px #ddd}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px}
textarea{min-height:100px;resize:vertical}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.new{background:#fff3cd;color:#856404}
.ordered{background:#d1ecf1;color:#0c5460}
.out{background:#f8d7da;color:#721c24}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#eee}
.product h3{margin:10px 0 5px}
.price{font-weight:bold;color:#102a56}
.images{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.images img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.order-status{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none}
.error{background:#ffe5e5;color:#a00;padding:10px;border-radius:7px;margin-bottom:12px}
.success{background:#e4f7e8;color:#176b2c;padding:10px;border-radius:7px;margin-bottom:12px}

@media(max-width:800px){
 .grid{grid-template-columns:1fr}
 .product-grid{grid-template-columns:repeat(2,1fr)}
 table{font-size:13px}
}
@media(max-width:500px){
 .container{padding:10px}
 .product-grid{grid-template-columns:1fr}
 header{padding:13px}
 header b{font-size:17px}
}
</style>
</head>

<body>

<header>
  <b>CreateLK Shop Admin</b>
  <button class="btn red" onclick="logout()">Logout</button>
</header>

<div class="container">

<div id="loginBox" class="card">
  <h2>Admin Login</h2>
  <p>Sign in with the authorized Google account.</p>
  <button class="btn" onclick="login()">Login with Google</button>
</div>

<div id="app" class="hidden">

<div class="nav">
  <button class="active" onclick="showSection('orders',this)">Orders</button>
  <button onclick="showSection('products',this)">Products</button>
  <button onclick="showSection('editor',this)">Add Product</button>
</div>

<div id="error" class="error hidden"></div>
<div id="success" class="success hidden"></div>

<!-- ORDERS -->

<section id="orders" class="section active">

  <div class="card">
    <h2>Orders</h2>

    <div class="nav">
      <button class="active" onclick="filterOrders('NEW',this)">
        New Orders
      </button>
      <button onclick="filterOrders('ORDERED',this)">
        Ordered
      </button>
      <button onclick="filterOrders('OUT_OF_STOCK',this)">
        Out of Stock
      </button>
    </div>

    <div id="ordersList"></div>
  </div>

</section>

<!-- PRODUCTS -->

<section id="products" class="section">

  <div class="card">
    <h2>Products</h2>

    <div class="grid">
      <div>
        <label>Search</label>
        <input id="searchProduct"
               placeholder="Search product..."
               oninput="renderProducts()">
      </div>

      <div>
        <label>Category</label>
        <select id="filterCategory"
                onchange="renderProducts()">
          <option value="">All Categories</option>
        </select>
      </div>
    </div>
  </div>

  <div id="productsList" class="product-grid"></div>

</section>

<!-- PRODUCT EDITOR -->

<section id="editor" class="section">

  <div class="card">

    <h2 id="editorTitle">Add Product</h2>

    <input type="hidden" id="productId">

    <div class="grid">

      <div>
        <label>Product Name</label>
        <input id="name" required>
      </div>

      <div>
        <label>Category</label>
        <select id="category"></select>
      </div>

      <div>
        <label>Price</label>
        <input id="price" type="number" min="0">
      </div>

      <div>
        <label>Sale Price</label>
        <input id="salePrice" type="number" min="0">
      </div>

      <div>
        <label>Stock</label>
        <input id="stock" type="number" min="0" value="0">
      </div>

      <div>
        <label>Product Status</label>
        <select id="productStatus">
          <option value="AVAILABLE">Available</option>
          <option value="PREORDER">Pre-Order</option>
          <option value="OUT_OF_STOCK">Out of Stock</option>
        </select>
      </div>

      <div class="full">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="full">
        <label>Product Images</label>
        <input id="imageFiles"
               type="file"
               accept="image/jpeg,image/png,image/webp"
               multiple>
        <div id="imagePreview" class="images"></div>
      </div>

    </div>

    <br>

    <div class="actions">
      <button class="btn green" onclick="saveProduct()">
        Save Product
      </button>

      <button class="btn gray" onclick="clearEditor()">
        Clear
      </button>
    </div>

  </div>

</section>

</div>
</div>

<script>

const API="https://shop-api.createlk.workers.dev";

let products=[];
let categories=[];
let orders=[];
let currentOrderFilter="NEW";
let selectedImages=[];

/* ---------- BASIC ---------- */

function showError(msg){
  const e=document.getElementById("error");
  e.textContent=msg;
  e.classList.remove("hidden");
  document.getElementById("success").classList.add("hidden");
}

function showSuccess(msg){
  const e=document.getElementById("success");
  e.textContent=msg;
  e.classList.remove("hidden");
  document.getElementById("error").classList.add("hidden");
}

function clearMessage(){
  document.getElementById("error").classList.add("hidden");
  document.getElementById("success").classList.add("hidden");
}

async function api(path,options={}){
  const r=await fetch(API+path,{
    credentials:"include",
    ...options
  });

  let data={};

  try{
    data=await r.json();
  }catch{}

  if(!r.ok){
    throw new Error(
      data.error||`Request failed (${r.status})`
    );
  }

  return data;
}

/* ---------- LOGIN ---------- */

function login(){
  location.href=API+"/auth/google";
}

async function logout(){
  location.href=API+"/auth/logout";
}

async function checkLogin(){

  try{
    await api("/auth/me");

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    await loadCategories();
    await loadProducts();
    await loadOrders();

  }catch{

    document.getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }
}

/* ---------- NAV ---------- */

function showSection(id,button){

  document.querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  if(button)button.classList.add("active");

  clearMessage();
}

/* ---------- CATEGORIES ---------- */

async function loadCategories(){

  categories=await api("/api/categories");

  const category=document.getElementById("category");
  const filter=document.getElementById("filterCategory");

  category.innerHTML=
    `<option value="">Select Category</option>`+
    categories.map(c=>
      `<option value="${c.id}">
        ${escapeHtml(c.name)}
      </option>`
    ).join("");

  filter.innerHTML=
    `<option value="">All Categories</option>`+
    categories.map(c=>
      `<option value="${c.id}">
        ${escapeHtml(c.name)}
      </option>`
    ).join("");
}

/* ---------- PRODUCTS ---------- */

async function loadProducts(){

  products=await api("/api/products");

  renderProducts();
}

function renderProducts(){

  const q=document.getElementById("searchProduct")
    .value.toLowerCase().trim();

  const cat=document.getElementById("filterCategory").value;

  const list=products.filter(p=>{

    const text=
      `${p.name} ${p.description||""}`
      .toLowerCase();

    return (!q||text.includes(q)) &&
           (!cat||String(p.category_id)===String(cat));
  });

  const box=document.getElementById("productsList");

  if(!list.length){
    box.innerHTML=
      `<div class="card">
        No products found.
      </div>`;
    return;
  }

  box.innerHTML=list.map(p=>{

    const image=
      p.images?.[0]?.image_key||
      p.image_key||
      "";

    const imageUrl=image
      ?`${API}/images/${encodeURIComponent(image)}`
      :"";

    let status=p.status||"AVAILABLE";

    let statusText="Available";
    let statusClass="ordered";

    if(status==="PREORDER"){
      statusText="Pre-Order";
      statusClass="new";
    }

    if(status==="OUT_OF_STOCK"){
      statusText="Out of Stock";
      statusClass="out";
    }

    return `
      <div class="card product">

        ${
          imageUrl
          ?`<img src="${imageUrl}">`
          :`<div style="height:180px;background:#eee;border-radius:8px"></div>`
        }

        <h3>${escapeHtml(p.name)}</h3>

        <div class="price">
          LKR ${Number(
            p.sale_price??p.price
          ).toLocaleString()}
        </div>

        <p>
          Stock: ${Number(p.stock||0)}
        </p>

        <span class="badge ${statusClass}">
          ${statusText}
        </span>

        <p>
          ${escapeHtml(p.category_name||"")}
        </p>

        <div class="actions">
          <button class="btn"
                  onclick="editProduct(${p.id})">
            Edit
          </button>

          <button class="btn red"
                  onclick="deleteProduct(${p.id})">
            Delete
          </button>
        </div>

      </div>
    `;
  }).join("");
}

/* ---------- EDIT PRODUCT ---------- */

function editProduct(id){

  const p=products.find(x=>Number(x.id)===Number(id));

  if(!p)return;

  document.getElementById("productId").value=p.id;
  document.getElementById("name").value=p.name||"";
  document.getElementById("category").value=p.category_id||"";
  document.getElementById("price").value=p.price||"";
  document.getElementById("salePrice").value=
    p.sale_price??"";
  document.getElementById("stock").value=p.stock||0;
  document.getElementById("description").value=
    p.description||"";

  document.getElementById("productStatus").value=
    p.status||"AVAILABLE";

  selectedImages=(p.images||[])
    .map(x=>x.image_key)
    .filter(Boolean);

  renderImagePreview();

  document.getElementById("editorTitle")
    .textContent="Edit Product";

  showSection(
    "editor",
    document.querySelectorAll(".nav button")[2]
  );
}

/* ---------- IMAGE UPLOAD ---------- */

async function uploadImage(file){

  const form=new FormData();
  form.append("file",file);

  const r=await fetch(API+"/api/upload",{
    method:"POST",
    credentials:"include",
    body:form
  });

  let data={};

  try{
    data=await r.json();
  }catch{}

  if(!r.ok)
    throw new Error(
      data.error||"Image upload failed"
    );

  return data.key;
}

document.getElementById("imageFiles")
  .addEventListener("change",async function(){

    clearMessage();

    const files=[...this.files];

    try{

      for(const file of files){

        if(file.size>5*1024*1024)
          throw new Error(
            `${file.name}: Maximum 5 MB`
          );

        const key=await uploadImage(file);

        selectedImages.push(key);
      }

      renderImagePreview();

    }catch(e){
      showError(e.message);
    }

    this.value="";
  });

function renderImagePreview(){

  document.getElementById("imagePreview")
    .innerHTML=selectedImages.map((key,i)=>`
      <div style="position:relative">
        <img src="${API}/images/${encodeURIComponent(key)}">
        <button
          style="position:absolute;top:2px;right:2px;padding:3px 6px;background:#d93025;color:white"
          onclick="removeImage(${i})">
          ×
        </button>
      </div>
    `).join("");
}

function removeImage(i){
  selectedImages.splice(i,1);
  renderImagePreview();
}

/* ---------- SAVE PRODUCT ---------- */

async function saveProduct(){

  clearMessage();

  const id=document.getElementById("productId").value;
  const name=document.getElementById("name").value.trim();

  if(!name){
    showError("Product name is required.");
    return;
  }

  try{

    const body={
      category_id:
        document.getElementById("category").value||null,

      name,

      description:
        document.getElementById("description").value,

      price:
        Number(document.getElementById("price").value||0),

      sale_price:
        document.getElementById("salePrice").value,

      stock:
        Number(document.getElementById("stock").value||0),

      status:
        document.getElementById("productStatus").value,

      image_key:
        selectedImages[0]||""
    };

    if(selectedImages.length)
      body.images=selectedImages;

    if(id){

      await api("/api/products/"+id,{
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      });

      showSuccess("Product updated successfully.");

    }else{

      await api("/api/products",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      });

      showSuccess("Product added successfully.");
    }

    await loadProducts();

    clearEditor(false);

  }catch(e){

    showError("SAVE ERROR: "+e.message);
  }
}

/* ---------- DELETE ---------- */

async function deleteProduct(id){

  if(!confirm("Delete this product?"))
    return;

  try{

    await api("/api/products/"+id,{
      method:"DELETE"
    });

    showSuccess("Product deleted.");

    await loadProducts();

  }catch(e){

    showError(e.message);
  }
}

/* ---------- CLEAR ---------- */

function clearEditor(clearMessageToo=true){

  document.getElementById("productId").value="";
  document.getElementById("name").value="";
  document.getElementById("category").value="";
  document.getElementById("price").value="";
  document.getElementById("salePrice").value="";
  document.getElementById("stock").value="0";
  document.getElementById("description").value="";

  document.getElementById("productStatus").value=
    "AVAILABLE";

  selectedImages=[];
  renderImagePreview();

  document.getElementById("editorTitle")
    .textContent="Add Product";

  if(clearMessageToo)
    clearMessage();
}

/* ---------- ORDERS ---------- */

async function loadOrders(){

  orders=await api("/api/admin/orders");

  renderOrders();
}

function filterOrders(status,button){

  currentOrderFilter=status;

  document.querySelectorAll(
    "#orders .nav button"
  ).forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  renderOrders();
}

function renderOrders(){

  const list=orders.filter(
    o=>o.status===currentOrderFilter
  );

  const box=document.getElementById("ordersList");

  if(!list.length){

    box.innerHTML=
      `<p>No ${statusName(currentOrderFilter)}
      found.</p>`;

    return;
  }

  box.innerHTML=list.map(o=>{

    const cls=
      o.status==="NEW"
        ?"new"
        :o.status==="ORDERED"
        ?"ordered"
        :"out";

    return `
      <div class="card">

        <div style="display:flex;
                    justify-content:space-between;
                    gap:10px;
                    flex-wrap:wrap">

          <b>Order #${o.id}</b>

          <span class="badge ${cls}">
            ${statusName(o.status)}
          </span>

        </div>

        <hr>

        <b>${escapeHtml(o.customer_name||"")}</b>

        <p>
          ${escapeHtml(o.address||"")},
          ${escapeHtml(o.city||"")}
        </p>

        <p>
          Mobile:
          ${escapeHtml(o.mobile_1||"")}
          ${
            o.mobile_2
            ?" / "+escapeHtml(o.mobile_2)
            :""
          }
        </p>

        ${
          o.remarks
          ?`<p>Note: ${escapeHtml(o.remarks)}</p>`
          :""
        }

        <p>
          <b>Total:
          LKR ${Number(o.total||0).toLocaleString()}
          </b>
        </p>

        <div class="order-status">

          ${
            o.status!=="ORDERED"
            ?`<button class="btn green"
                onclick="changeOrderStatus(${o.id},'ORDERED')">
                Ordered
              </button>`
            :""
          }

          ${
            o.status!=="OUT_OF_STOCK"
            ?`<button class="btn red"
                onclick="changeOrderStatus(${o.id},'OUT_OF_STOCK')">
                Out of Stock
              </button>`
            :""
          }

          ${
            o.status!=="NEW"
            ?`<button class="btn gray"
                onclick="changeOrderStatus(${o.id},'NEW')">
                New
              </button>`
            :""
          }

        </div>

      </div>
    `;

  }).join("");
}

async function changeOrderStatus(id,status){

  try{

    await api("/api/admin/orders/"+id,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({status})
    });

    await loadOrders();

    showSuccess(
      `Order #${id} changed to ${statusName(status)}.`
    );

  }catch(e){

    showError(e.message);
  }
}

function statusName(status){

  if(status==="NEW")
    return "New Order";

  if(status==="ORDERED")
    return "Ordered";

  if(status==="OUT_OF_STOCK")
    return "Out of Stock";

  return status;
}

/* ---------- SECURITY ---------- */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* ---------- START ---------- */

checkLogin();

</script>

</body>
</html>
