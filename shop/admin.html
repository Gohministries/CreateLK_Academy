<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Shop Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#102a56}
header{background:#102a56;color:#fff;padding:18px}
header h1{margin:0;font-size:21px}
header p{margin:5px 0 0;font-size:13px;opacity:.8}
.container{max-width:1100px;margin:auto;padding:18px}
.login,.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.login{max-width:430px;margin:60px auto}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px;margin-bottom:10px}
textarea{min-height:90px}
button{border:0;border-radius:9px;padding:11px 16px;background:#d69b16;color:#fff;font-weight:bold;cursor:pointer}
.hidden{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav button{background:#fff;color:#102a56;border:1px solid #ddd}
.nav button.active{background:#102a56;color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.full{grid-column:1/-1}
.form-actions{display:flex;gap:10px}
.cancel{background:#777}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}
.product img{width:100%;height:180px;object-fit:cover;background:#eee}
.product-body{padding:14px}
.product-name{font-weight:bold;margin-bottom:7px}
.price{color:#d69b16;font-weight:bold;font-size:17px}
.stock{font-size:13px;margin-top:5px}
.product-actions{display:flex;gap:7px;margin-top:12px}
.product-actions button{flex:1;font-size:12px;padding:9px}
.delete{background:#c62828}
.order{border:1px solid #eee;border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.order-head{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:12px}
.order-id{font-size:18px;font-weight:bold}
.status{background:#eef2f7;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.field{background:#f8f9fc;padding:10px;border-radius:8px}
.field strong{display:block;font-size:10px;color:#777;margin-bottom:4px}
.field span{font-size:14px;word-break:break-word}
.total{margin-top:14px;color:#d69b16;font-size:19px;font-weight:bold}
.status-actions{display:flex;gap:10px;margin-top:12px}
.status-actions select{margin:0;flex:1}
.status-actions button{width:auto}
.empty{text-align:center;padding:30px;color:#777}
.error{color:#c62828;font-size:14px;margin-top:10px}
.success{color:#16803c;font-size:14px;margin-top:10px}
.preview{max-width:160px;max-height:120px;border-radius:8px;display:none}
@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
.form-grid,.order-grid{grid-template-columns:1fr}
.products{grid-template-columns:1fr}
.full{grid-column:auto}
.status-actions{flex-direction:column}
.status-actions button{width:100%}
}
</style>
</head>

<body>

<header>
<h1>CreateLK Shop Admin</h1>
<p>Products & Orders</p>
</header>

<div id="loginBox" class="login">
<h2>Admin Login</h2>
<input type="password" id="adminKey" placeholder="Enter Admin Key">
<button onclick="login()">Login</button>
<div id="loginError" class="error"></div>
</div>

<div id="adminPanel" class="hidden">
<div class="container">

<div class="nav">
<button id="productsTab" class="active" onclick="showSection('productsSection')">Products</button>
<button id="ordersTab" onclick="showSection('ordersSection')">Orders</button>
<button onclick="logout()">Logout</button>
</div>

<section id="productsSection">

<div class="panel">
<h2 id="productFormTitle">Add Product</h2>

<input type="hidden" id="productId">

<div class="form-grid">

<div>
<label>Product Name</label>
<input id="productName" placeholder="Product name">
</div>

<div>
<label>Category</label>
<select id="productCategory">
<option value="">Select Category</option>
</select>
</div>

<div class="full">
<label>Description</label>
<textarea id="productDescription" placeholder="Product description"></textarea>
</div>

<div>
<label>Price</label>
<input type="number" id="productPrice" min="0" placeholder="0">
</div>

<div>
<label>Sale Price</label>
<input type="number" id="productSalePrice" min="0" placeholder="Optional">
</div>

<div>
<label>Stock</label>
<input type="number" id="productStock" min="0" placeholder="0">
</div>

<div>
<label>Product Image</label>
<input type="file" id="productImage" accept="image/jpeg,image/png,image/webp">
</div>

<div class="full">
<img id="preview" class="preview">
</div>

</div>

<div class="form-actions">
<button onclick="saveProduct()">Save Product</button>
<button class="cancel" onclick="clearProductForm()">Clear</button>
</div>

<div id="productMessage"></div>
</div>

<div class="panel">
<h2>Products</h2>
<div id="productsList">Loading products...</div>
</div>

</section>

<section id="ordersSection" class="hidden">

<div class="panel">
<h2>Customer Orders</h2>
<button onclick="loadOrders()">↻ Refresh Orders</button>
</div>

<div id="ordersList">Loading orders...</div>

</section>

</div>
</div>

<script>

const API="https://shop-api.createlk.workers.dev";

let ADMIN_KEY="";
let products=[];

function login(){
const key=document.getElementById("adminKey").value.trim();

if(!key){
document.getElementById("loginError").textContent="Please enter Admin Key.";
return;
}

ADMIN_KEY=key;

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");

loadCategories();
loadProducts();
}

function logout(){
ADMIN_KEY="";
document.getElementById("adminKey").value="";
document.getElementById("adminPanel").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
}

function showSection(section){

document.getElementById("productsSection").classList.add("hidden");
document.getElementById("ordersSection").classList.add("hidden");

document.getElementById(section).classList.remove("hidden");

document.getElementById("productsTab").classList.remove("active");
document.getElementById("ordersTab").classList.remove("active");

if(section==="productsSection"){
document.getElementById("productsTab").classList.add("active");
loadProducts();
}else{
document.getElementById("ordersTab").classList.add("active");
loadOrders();
}
}

async function loadCategories(){

try{

const res=await fetch(API+"/api/categories");
const data=await res.json();

if(!res.ok)throw new Error(data.error||"Unable to load categories");

const list=Array.isArray(data)?data:data.categories||[];
const select=document.getElementById("productCategory");

select.innerHTML='<option value="">Select Category</option>';

list.forEach(c=>{
const option=document.createElement("option");
option.value=c.id;
option.textContent=c.name;
select.appendChild(option);
});

}catch(e){
showMessage(e.message,true);
}
}

async function loadProducts(){

const box=document.getElementById("productsList");
box.innerHTML="Loading products...";

try{

const res=await fetch(API+"/api/products");
const data=await res.json();

if(!res.ok)throw new Error(data.error||"Unable to load products");

products=Array.isArray(data)?data:data.products||[];

if(!products.length){
box.innerHTML='<div class="empty">No products yet.</div>';
return;
}

box.innerHTML='<div class="products">'+products.map(productCard).join("")+'</div>';

}catch(e){
box.innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';
}
}

function productCard(p){

const image=p.image_key
?API+"/images/"+encodeURIComponent(p.image_key)
:"";

const price=p.sale_price!==null&&p.sale_price!==undefined
?`<div class="price">LKR ${money(p.sale_price)}
<del style="color:#888;font-size:12px"> LKR ${money(p.price)}</del></div>`
:`<div class="price">LKR ${money(p.price)}</div>`;

return `
<div class="product">

${image
?`<img src="${escapeHtml(image)}" alt="${escapeHtml(p.name)}">`
:`<div style="height:180px;display:flex;align-items:center;justify-content:center;background:#eee;color:#888">No Image</div>`}

<div class="product-body">

<div class="product-name">${escapeHtml(p.name)}</div>

<div style="font-size:12px;color:#777">
${escapeHtml(p.category_name||"No Category")}
</div>

<br>

${price}

<div class="stock">Stock: ${escapeHtml(p.stock)}</div>

<div class="product-actions">

<button onclick="editProduct(${p.id})">Edit</button>

<button class="delete" onclick="deleteProduct(${p.id})">
Delete
</button>

</div>

</div>
</div>`;
}

async function uploadImage(file){

if(!file)return "";

if(file.size>5*1024*1024)
throw new Error("Maximum image size is 5 MB.");

if(!["image/jpeg","image/png","image/webp"].includes(file.type))
throw new Error("Only JPG, PNG and WEBP images are allowed.");

const form=new FormData();
form.append("file",file);

const res=await fetch(API+"/api/upload",{
method:"POST",
headers:{"X-Admin-Key":ADMIN_KEY},
body:form
});

const data=await res.json();

if(!res.ok)
throw new Error(data.error||"Image upload failed");

return data.key;
}

async function saveProduct(){

const id=document.getElementById("productId").value;
const name=document.getElementById("productName").value.trim();
const category=document.getElementById("productCategory").value;
const description=document.getElementById("productDescription").value.trim();
const price=document.getElementById("productPrice").value;
const salePrice=document.getElementById("productSalePrice").value;
const stock=document.getElementById("productStock").value;
const file=document.getElementById("productImage").files[0];

if(!name)return showMessage("Product name is required.",true);
if(!category)return showMessage("Please select a category.",true);
if(price==="")return showMessage("Price is required.",true);

try{

showMessage(file?"Uploading image...":"Saving product...");

let imageKey="";

if(id){
const old=products.find(p=>String(p.id)===String(id));
imageKey=old?old.image_key||"":"";
}

if(file)imageKey=await uploadImage(file);

const body={
category_id:Number(category),
name:name,
description:description,
price:Number(price),
sale_price:salePrice===""?null:Number(salePrice),
stock:Number(stock),
image_key:imageKey
};

const res=await fetch(
id?API+"/api/products/"+id:API+"/api/products",
{
method:id?"PUT":"POST",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":ADMIN_KEY
},
body:JSON.stringify(body)
});

const data=await res.json();

if(!res.ok)
throw new Error(data.error||"Unable to save product");

showMessage(id?"Product updated.":"Product added.");

clearProductForm();
loadProducts();

}catch(e){
showMessage(e.message,true);
}
}

function editProduct(id){

const p=products.find(x=>Number(x.id)===Number(id));
if(!p)return;

document.getElementById("productId").value=p.id;
document.getElementById("productName").value=p.name||"";
document.getElementById("productCategory").value=p.category_id||"";
document.getElementById("productDescription").value=p.description||"";
document.getElementById("productPrice").value=p.price??"";
document.getElementById("productSalePrice").value=p.sale_price===null?"":p.sale_price;
document.getElementById("productStock").value=p.stock??"";
document.getElementById("productImage").value="";
document.getElementById("productFormTitle").textContent="Edit Product";

window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){

if(!confirm("Delete this product?"))return;

try{

const res=await fetch(API+"/api/products/"+id,{
method:"DELETE",
headers:{"X-Admin-Key":ADMIN_KEY}
});

const data=await res.json();

if(!res.ok)
throw new Error(data.error||"Unable to delete product");

loadProducts();

}catch(e){
alert(e.message);
}
}

function clearProductForm(){

document.getElementById("productId").value="";
document.getElementById("productName").value="";
document.getElementById("productCategory").value="";
document.getElementById("productDescription").value="";
document.getElementById("productPrice").value="";
document.getElementById("productSalePrice").value="";
document.getElementById("productStock").value="";
document.getElementById("productImage").value="";
document.getElementById("productFormTitle").textContent="Add Product";
document.getElementById("preview").style.display="none";
}

function showMessage(message,error=false){

const box=document.getElementById("productMessage");
box.className=error?"error":"success";
box.textContent=message;
}

async function loadOrders(){

const box=document.getElementById("ordersList");
box.innerHTML="Loading orders...";

try{

const res=await fetch(API+"/api/admin/orders",{
headers:{"X-Admin-Key":ADMIN_KEY}
});

const data=await res.json();

if(!res.ok)
throw new Error(data.error||"Unable to load orders");

if(!Array.isArray(data)||!data.length){
box.innerHTML='<div class="panel empty">No orders found.</div>';
return;
}

box.innerHTML=data.map(orderCard).join("");

}catch(e){

box.innerHTML='<div class="panel empty">'+escapeHtml(e.message)+'</div>';

}
}

function orderCard(o){

return `
<div class="order">

<div class="order-head">

<div>
<div class="order-id">Order #${escapeHtml(o.id)}</div>
<small>${escapeHtml(formatDate(o.created_at))}</small>
</div>

<div class="status">${escapeHtml(o.status)}</div>

</div>

<div class="order-grid">

<div class="field">
<strong>CUSTOMER NAME</strong>
<span>${escapeHtml(o.customer_name||"-")}</span>
</div>

<div class="field">
<strong>MOBILE 1</strong>
<span>${escapeHtml(o.mobile_1||"-")}</span>
</div>

<div class="field">
<strong>MOBILE 2</strong>
<span>${escapeHtml(o.mobile_2||"-")}</span>
</div>

<div class="field">
<strong>CITY</strong>
<span>${escapeHtml(o.city||"-")}</span>
</div>

<div class="field">
<strong>ADDRESS</strong>
<span>${escapeHtml(o.address||"-")}</span>
</div>

<div class="field">
<strong>REMARKS</strong>
<span>${escapeHtml(o.remarks||"-")}</span>
</div>

</div>

<div class="total">
Total: LKR ${money(o.total)}
</div>

<div class="status-actions">

<select id="status-${o.id}">
${statusOptions(o.status)}
</select>

<button onclick="updateStatus(${o.id})">
Update Status
</button>

</div>

</div>`;
}

function statusOptions(current){

return [
"PENDING",
"CONFIRMED",
"PROCESSING",
"SHIPPED",
"DELIVERED",
"CANCELLED"
].map(s=>`
<option value="${s}" ${s===current?"selected":""}>
${s}
</option>`).join("");
}

async function updateStatus(id){

const select=document.getElementById("status-"+id);

try{

const res=await fetch(API+"/api/admin/orders/"+id,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Admin-Key":ADMIN_KEY
},
body:JSON.stringify({status:select.value})
});

const data=await res.json();

if(!res.ok)
throw new Error(data.error||"Unable to update status");

alert("Order status updated.");
loadOrders();

}catch(e){
alert(e.message);
}
}

function money(v){
return Number(v||0).toLocaleString("en-LK");
}

function formatDate(v){

if(!v)return "-";

const d=new Date(v);

if(isNaN(d.getTime()))return v;

return d.toLocaleString("en-LK",{
dateStyle:"medium",
timeStyle:"short"
});
}

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

document.getElementById("productImage").addEventListener("change",function(){

const file=this.files[0];
const preview=document.getElementById("preview");

if(!file){
preview.style.display="none";
return;
}

preview.src=URL.createObjectURL(file);
preview.style.display="block";
});

</script>
</body>
</html>
