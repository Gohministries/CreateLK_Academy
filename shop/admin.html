<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#102a56;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
button{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:600}
.primary{background:#102a56;color:#fff}
.green{background:#18864b;color:#fff}
.red{background:#c62828;color:#fff}
.gray{background:#ddd;color:#222}
.wrap{max-width:1200px;margin:auto;padding:20px}
.login{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:12px;text-align:center;box-shadow:0 2px 12px #0001}
.login h1{color:#102a56}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:20px;box-shadow:0 1px 7px #0001}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;margin:5px 0 12px;font-size:15px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.product{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 6px #0001}
.product img{width:100%;height:180px;object-fit:contain;border-radius:7px;background:#f5f5f5}
.product h3{font-size:16px;margin:8px 0}
.price{font-weight:bold;color:#102a56}
.order{border:1px solid #ddd;border-radius:9px;padding:14px;margin-bottom:12px}
.order h3{margin:0 0 8px;color:#102a56}
.order small{color:#666}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tab.active{background:#102a56;color:#fff}
.hidden{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;background:#eee;margin-left:5px}
.count{font-size:12px;background:#d69b16;color:#fff;border-radius:20px;padding:3px 7px;margin-left:4px}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.grid,.products{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
@media(max-width:430px){.products{grid-template-columns:1fr}.grid{grid-template-columns:1fr}header b{font-size:17px}}
</style>
</head>
<body>

<div id="login" class="login">
<h1>CreateLK Shop</h1>
<h2>Admin</h2>
<p>Sign in with your authorized Google account.</p>
<button class="primary" onclick="googleLogin()">Continue with Google</button>
</div>

<div id="app" class="hidden">

<header>
<b>CreateLK Shop Admin</b>
<button class="gray" onclick="logout()">Logout</button>
</header>

<div class="wrap">

<div class="card">
<h2>Products</h2>

<input type="hidden" id="editId">

<div class="grid">
<div>
<label>Product Name</label>
<input id="name">
</div>

<div>
<label>Category</label>
<select id="category">
<option value="">Select Category</option>
</select>
</div>
</div>

<label>Description</label>
<textarea id="description"></textarea>

<div class="grid">
<div>
<label>Real / Cost Price</label>
<input id="realPrice" type="number" min="0">
</div>

<div>
<label>Profit Markup %</label>
<input id="markup" type="number" min="0" value="0" oninput="calcPrice()">
</div>

<div>
<label>Sale Price</label>
<input id="salePrice" type="number" min="0">
</div>

<div>
<label>Stock</label>
<input id="stock" type="number" min="0" value="0">
</div>
</div>

<label>Images — maximum 5</label>
<input id="images" type="file" accept="image/*" multiple>

<div id="selectedImages"></div>

<br>
<button class="primary" onclick="saveProduct()">Save Product</button>
<button class="gray" onclick="clearForm()">Clear</button>
</div>

<div class="card">
<h2>Product List</h2>
<input id="search" placeholder="Search products..." oninput="loadProducts()">
<div id="products" class="products"></div>
</div>

<div class="card">
<h2>Orders</h2>

<div class="tabs">
<button class="tab active" onclick="showOrders('new',this)">
New Orders <span id="newCount" class="count">0</span>
</button>

<button class="tab" onclick="showOrders('ordered',this)">
Ordered <span id="orderedCount" class="count">0</span>
</button>

<button class="tab" onclick="showOrders('out',this)">
Out of Stock <span id="outCount" class="count">0</span>
</button>
</div>

<div id="orders"></div>
</div>

</div>
</div>

<script>
const API="https://shop-api.createlk.workers.dev";
let selectedImages=[];
let currentTab="new";
let orders=[];

const $=id=>document.getElementById(id);

function googleLogin(){
location.href=API+"/auth/google";
}

async function api(url,opt={}){
opt.credentials="include";
opt.headers={
"Content-Type":"application/json",
...(opt.headers||{})
};

const r=await fetch(API+url,opt);

if(r.status===401){
showLogin();
throw new Error("Unauthorized");
}

const d=await r.json().catch(()=>({}));

if(!r.ok)throw new Error(d.error||"Request failed");

return d;
}

function showLogin(){
$("login").classList.remove("hidden");
$("app").classList.add("hidden");
}

async function checkLogin(){
try{
const r=await fetch(API+"/auth/me",{credentials:"include"});

if(!r.ok)throw 0;

$("login").classList.add("hidden");
$("app").classList.remove("hidden");

await loadCategories();
await loadProducts();
await loadOrders();

}catch{
showLogin();
}
}

async function logout(){
await fetch(API+"/auth/logout",{
method:"POST",
credentials:"include"
});
showLogin();
}

async function loadCategories(){
const data=await api("/api/categories");

$("category").innerHTML=
'<option value="">Select Category</option>'+
data.map(c=>
`<option value="${c.id}">${esc(c.name)}</option>`
).join("");
}

function calcPrice(){
const real=Number($("realPrice").value||0);
const markup=Number($("markup").value||0);

$("salePrice").value=
Math.round(real+(real*markup/100));
}

$("images").addEventListener("change",e=>{
selectedImages=[...e.target.files].slice(0,5);

$("selectedImages").innerHTML=
selectedImages.map(f=>`<div>${esc(f.name)}</div>`).join("");
});

async function uploadImages(){
const result=[];

for(const file of selectedImages){

const fd=new FormData();
fd.append("file",file);

const r=await fetch(API+"/api/upload",{
method:"POST",
body:fd,
credentials:"include"
});

const d=await r.json();

if(!r.ok)
throw new Error(d.error||"Image upload failed");

result.push(d.key);
}

return result;
}

async function saveProduct(){

try{

const name=$("name").value.trim();

if(!name)
return alert("Enter product name.");

const editId=$("editId").value;

let images=[];

if(selectedImages.length)
images=await uploadImages();

const body={
name,
description:$("description").value.trim(),
category_id:$("category").value||null,
real_price:Number($("realPrice").value||0),
sale_price:Number($("salePrice").value||0),
markup:Number($("markup").value||0),
stock:Number($("stock").value||0),
images
};

if(body.sale_price<body.real_price)
return alert("Sale Price cannot be lower than Real Price.");

await api(
editId?"/api/products/"+editId:"/api/products",
{
method:editId?"PUT":"POST",
body:JSON.stringify(body)
}
);

alert(editId?"Product updated.":"Product added.");

clearForm();
loadProducts();

}catch(e){
alert(e.message);
}
}

async function loadProducts(){

try{

const q=encodeURIComponent(
$("search").value.trim()
);

const data=await api(
"/api/products?search="+q
);

$("products").innerHTML=data.map(p=>{

let images=[];

try{
images=JSON.parse(p.images||"[]");
}catch{}

const image=images[0]||p.image_key;

return `
<div class="product">

${image?
`<img src="${API}/images/${encodeURIComponent(image)}">`
:
`<div style="height:180px;background:#eee"></div>`
}

<h3>${esc(p.name)}</h3>

<div>${esc(p.category_name||"")}</div>

<div class="price">
LKR ${Number(p.sale_price||0).toLocaleString()}
</div>

<div>Stock: ${Number(p.stock||0)}</div>

<br>

<button class="primary"
onclick='editProduct(${JSON.stringify(p)})'>
Edit
</button>

<button class="red"
onclick="deleteProduct(${p.id})">
Delete
</button>

</div>
`;

}).join("")||"<p>No products found.</p>";

}catch(e){

$("products").innerHTML=
"<p>"+esc(e.message)+"</p>";

}
}

function editProduct(p){

$("editId").value=p.id;
$("name").value=p.name||"";
$("description").value=p.description||"";
$("category").value=p.category_id||"";
$("realPrice").value=p.real_price||0;
$("salePrice").value=p.sale_price||0;
$("markup").value=p.markup||0;
$("stock").value=p.stock||0;

selectedImages=[];
$("images").value="";

$("selectedImages").innerHTML=
"Existing images will remain if no new images are selected.";

scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){

if(!confirm("Delete this product?"))
return;

try{

await api("/api/products/"+id,{
method:"DELETE"
});

loadProducts();

}catch(e){
alert(e.message);
}
}

function clearForm(){

$("editId").value="";
$("name").value="";
$("description").value="";
$("category").value="";
$("realPrice").value="";
$("salePrice").value="";
$("markup").value="0";
$("stock").value="0";
$("images").value="";
$("selectedImages").innerHTML="";

selectedImages=[];
}

async function loadOrders(){

try{

orders=await api("/api/admin/orders");

if(!Array.isArray(orders))
orders=[];

renderCounts();
renderOrders();

}catch(e){

$("orders").innerHTML=
"<p>"+esc(e.message)+"</p>";

}
}

function renderCounts(){

const newOrders=orders.filter(o=>
Number(o.out_of_stock)!==1 &&
String(o.status).toUpperCase()==="PENDING"
);

const out=orders.filter(o=>
Number(o.out_of_stock)===1
);

const ordered=orders.filter(o=>
Number(o.out_of_stock)!==1 &&
String(o.status).toUpperCase()!=="PENDING"
);

$("newCount").textContent=newOrders.length;
$("orderedCount").textContent=ordered.length;
$("outCount").textContent=out.length;
}

function showOrders(tab,btn){

currentTab=tab;

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

renderOrders();
}

function renderOrders(){

let list=[];

if(currentTab==="new"){

list=orders.filter(o=>
Number(o.out_of_stock)!==1 &&
String(o.status).toUpperCase()==="PENDING"
);

}

if(currentTab==="ordered"){

list=orders.filter(o=>
Number(o.out_of_stock)!==1 &&
String(o.status).toUpperCase()!=="PENDING"
);

}

if(currentTab==="out"){

list=orders.filter(o=>
Number(o.out_of_stock)===1
);

}

if(!list.length){

$("orders").innerHTML="<p>No orders.</p>";
return;
}

$("orders").innerHTML=list.map(o=>`

<div class="order">

<h3>Order #${o.id}</h3>

<div>
<b>${esc(o.customer_name||"")}</b>

<span class="badge">
${esc(o.status||"")}
</span>

${Number(o.out_of_stock)===1?
`<span class="badge">OUT OF STOCK</span>`:""}

</div>

<p>
${esc(o.address||"")}<br>
${esc(o.city||"")}<br>
📞 ${esc(o.mobile_1||"")}
${o.mobile_2?
" / "+esc(o.mobile_2):""}
</p>

${o.remarks?
`<p><b>Remarks:</b> ${esc(o.remarks)}</p>`:""}

<p>
<b>
Total:
LKR ${Number(o.total||0).toLocaleString()}
</b>
</p>

<small>
${esc(o.created_at||"")}
</small>

<br><br>

${currentTab==="new"?`

<button class="green"
onclick="setStatus(${o.id},'CONFIRMED')">
Mark Ordered
</button>

<button class="red"
onclick="setOutOfStock(${o.id},1)">
Out of Stock
</button>

`:""}

${currentTab==="ordered"?`

<button class="green"
onclick="setStatus(${o.id},'SHIPPED')">
Mark Shipped
</button>

<button class="red"
onclick="setOutOfStock(${o.id},1)">
Out of Stock
</button>

`:""}

${currentTab==="out"?`

<button class="green"
onclick="setOutOfStock(${o.id},0)">
Restore
</button>

`:""}

</div>

`).join("");
}

async function setStatus(id,status){

try{

await api("/api/admin/orders/"+id,{
method:"PUT",
body:JSON.stringify({status})
});

await loadOrders();

}catch(e){
alert(e.message);
}
}

async function setOutOfStock(id,value){

try{

await api("/api/admin/orders/"+id,{
method:"PUT",
body:JSON.stringify({
out_of_stock:value
})
});

await loadOrders();

}catch(e){
alert(e.message);
}
}

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

checkLogin();
</script>

</body>
</html>
