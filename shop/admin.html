<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#222
}

header{
background:#102a56;
color:#fff;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center
}

header h1{
margin:0;
font-size:20px
}

button{
border:0;
border-radius:7px;
padding:10px 15px;
cursor:pointer;
font-size:14px
}

.btn{
background:#102a56;
color:#fff
}

.btn:hover{
opacity:.9
}

.logout{
background:#fff;
color:#102a56
}

.container{
max-width:1100px;
margin:auto;
padding:20px
}

.card{
background:#fff;
border-radius:10px;
padding:20px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.06)
}

.login{
max-width:420px;
margin:80px auto;
text-align:center
}

.login h2{
margin-top:0;
color:#102a56
}

.google{
background:#fff;
color:#333;
border:1px solid #ddd;
width:100%;
padding:13px;
font-weight:bold
}

.google:hover{
background:#f7f7f7
}

input,textarea,select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
margin-top:5px;
margin-bottom:12px;
font-size:14px
}

textarea{
min-height:100px;
resize:vertical
}

label{
font-weight:bold;
font-size:14px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.product{
border:1px solid #ddd;
border-radius:8px;
padding:12px;
background:#fff
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:6px;
background:#eee
}

.product h3{
font-size:16px;
margin:10px 0 5px
}

.price{
font-weight:bold;
color:#102a56
}

.sale{
color:#d69b16
}

.small{
font-size:13px;
color:#666
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap
}

.danger{
background:#c62828;
color:#fff
}

.gold{
background:#d69b16;
color:#fff
}

.preview{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:12px
}

.preview img{
width:80px;
height:80px;
object-fit:cover;
border-radius:6px;
border:1px solid #ddd
}

.hidden{
display:none!important
}

.message{
padding:10px;
border-radius:6px;
margin-bottom:15px;
background:#eef4ff;
color:#102a56
}

.order{
border:1px solid #ddd;
border-radius:8px;
padding:15px;
margin-bottom:12px
}

.status{
font-weight:bold
}

@media(max-width:800px){
.products{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr
}

.products{
grid-template-columns:1fr
}

.container{
padding:12px
}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginBox" class="card login">

<h2>CreateLK Shop Admin</h2>

<p>
Sign in with the authorized Google account.
</p>

<button class="google" onclick="googleLogin()">
Continue with Google
</button>

<p id="loginMessage" class="small"></p>

</div>


<!-- ADMIN -->

<div id="adminArea" class="hidden">

<header>

<h1>CreateLK Shop Admin</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</header>

<div class="container">

<div id="message"></div>


<!-- PRODUCT FORM -->

<div class="card">

<h2 id="formTitle">Add Product</h2>

<form id="productForm">

<input type="hidden" id="productId">

<div class="grid">

<div>

<label>Product Name</label>

<input
id="name"
required
>

</div>

<div>

<label>Category</label>

<select id="category_id" required>

<option value="">
Select Category
</option>

</select>

</div>

</div>


<label>Description</label>

<textarea id="description"></textarea>


<div class="grid">

<div>

<label>Price</label>

<input
id="price"
type="number"
min="0"
required
>

</div>

<div>

<label>Sale Price</label>

<input
id="sale_price"
type="number"
min="0"
placeholder="Optional"
>

</div>

</div>


<label>Stock</label>

<input
id="stock"
type="number"
min="0"
value="0"
required
>


<label>Product Images</label>

<input
id="images"
type="file"
accept="image/jpeg,image/png,image/webp"
multiple
>

<div id="imagePreview" class="preview"></div>


<div class="actions">

<button
type="submit"
class="btn"
id="saveButton"
>
Save Product
</button>

<button
type="button"
class="gold"
onclick="resetForm()"
>
Clear
</button>

</div>

</form>

</div>


<!-- CATEGORY -->

<div class="card">

<h2>Categories</h2>

<div class="grid">

<div>

<input
id="newCategory"
placeholder="New category name"
>

</div>

<div>

<button
class="btn"
onclick="addCategory()"
>
Add Category
</button>

</div>

</div>

<div id="categoryList"></div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>Products</h2>

<div
id="products"
class="products"
>
</div>

</div>


<!-- ORDERS -->

<div class="card">

<h2>Orders</h2>

<div id="orders"></div>

</div>

</div>

</div>


<script>

const API="https://shop-api.createlk.workers.dev";

let products=[];
let selectedImages=[];

const $=id=>document.getElementById(id);


/* GOOGLE LOGIN */

function googleLogin(){

location.href=API+"/auth/google";

}


/*
IMPORTANT:

Because the current Worker uses SameSite=Lax,
we avoid depending on repeated JavaScript
/auth/me requests for keeping the page open.

The Google callback already redirects here
after successful authentication.
*/

function showAdmin(){

$("loginBox").classList.add("hidden");

$("adminArea").classList.remove("hidden");

loadCategories();
loadProducts();
loadOrders();

}


function showLogin(){

$("adminArea").classList.add("hidden");

$("loginBox").classList.remove("hidden");

}


/*
Check login once.

If the Worker accepts the cookie,
open admin.

If browser blocks the cross-site cookie,
the user can use Google login again.
*/

async function checkLogin(){

try{

const r=await fetch(API+"/auth/me",{
credentials:"include"
});

if(r.ok){

showAdmin();

}else{

showLogin();

}

}catch(e){

showLogin();

}

}


/* LOGOUT */

async function logout(){

try{

await fetch(API+"/auth/logout",{
credentials:"include"
});

}catch(e){}

showLogin();

}


/* MESSAGE */

function message(text,error=false){

$("message").innerHTML=
`<div class="message" style="color:${error?"#c62828":"#102a56"}">
${text}
</div>`;

setTimeout(()=>{
$("message").innerHTML="";
},4000);

}


/* CATEGORIES */

async function loadCategories(){

try{

const r=await fetch(API+"/api/categories");

if(!r.ok)
throw new Error("Unable to load categories");

const data=await r.json();

const select=$("category_id");

select.innerHTML=
`<option value="">Select Category</option>`;

data.forEach(c=>{

const option=document.createElement("option");

option.value=c.id;
option.textContent=c.name;

select.appendChild(option);

});


$("categoryList").innerHTML=
data.map(c=>
`<div class="small">
${escapeHtml(c.name)}
</div>`
).join("");

}catch(e){

message(e.message,true);

}

}


/* ADD CATEGORY */

async function addCategory(){

const name=$("newCategory").value.trim();

if(!name){

alert("Enter category name");

return;

}

try{

const r=await fetch(API+"/api/categories",{

method:"POST",

credentials:"include",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({name})

});

const data=await r.json();

if(!r.ok)
throw new Error(data.error||"Failed");

$("newCategory").value="";

await loadCategories();

message("Category added");

}catch(e){

message(e.message,true);

}

}


/* IMAGES */

$("images").addEventListener("change",function(){

selectedImages=Array.from(this.files);

showPreview();

});


function showPreview(){

const box=$("imagePreview");

box.innerHTML="";

selectedImages.forEach(file=>{

const img=document.createElement("img");

img.src=URL.createObjectURL(file);

box.appendChild(img);

});

}


/* UPLOAD IMAGE */

async function uploadImage(file){

const form=new FormData();

form.append("file",file);

const r=await fetch(API+"/api/upload",{

method:"POST",

credentials:"include",

body:form

});

const data=await r.json();

if(!r.ok)
throw new Error(data.error||"Image upload failed");

return data.key;

}


/* SAVE PRODUCT */

$("productForm").addEventListener(
"submit",
saveProduct
);


async function saveProduct(e){

e.preventDefault();

const id=$("productId").value;

const name=$("name").value.trim();

const description=$("description").value.trim();

const price=Number($("price").value);

const saleValue=$("sale_price").value;

const stock=Number($("stock").value);

const category_id=$("category_id").value;


if(!name){

alert("Product name required");

return;

}


/* SALE PRICE VALIDATION */

if(
saleValue!=="" &&
Number(saleValue)<price
){

alert(
"Sale price cannot be lower than the regular price."
);

return;

}


$("saveButton").disabled=true;

$("saveButton").textContent="Saving...";


try{

let imageKeys=[];


/*
Upload newly selected images.
*/

for(const file of selectedImages){

const key=await uploadImage(file);

imageKeys.push(key);

}


/*
When editing without new images,
keep existing images.
*/

if(id && !imageKeys.length){

const old=products.find(
p=>String(p.id)===String(id)
);

if(old){

imageKeys=getImages(old);

}

}


const body={

category_id:
category_id
?Number(category_id)
:null,

name,

description,

price,

sale_price:
saleValue===""
?null
:Number(saleValue),

stock,

image_key:
imageKeys[0]||"",

images:imageKeys

};


const r=await fetch(

id
?API+"/api/products/"+id
:API+"/api/products",

{

method:id?"PUT":"POST",

credentials:"include",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});


const data=await r.json();

if(!r.ok)
throw new Error(data.error||"Save failed");


message(
id
?"Product updated successfully"
:"Product added successfully"
);


resetForm();

await loadProducts();


}catch(e){

message(e.message,true);

}finally{

$("saveButton").disabled=false;

$("saveButton").textContent="Save Product";

}

}


/* GET IMAGES */

function getImages(p){

if(
Array.isArray(p.images) &&
p.images.length
){

return p.images
.map(x=>x.image_key||x)
.filter(Boolean);

}

return p.image_key
?[p.image_key]
:[];

}


/* IMAGE URL */

function imageUrl(key){

return API+
"/images/"+
encodeURIComponent(key);

}


/* LOAD PRODUCTS */

async function loadProducts(){

try{

const r=await fetch(API+"/api/products");

if(!r.ok)
throw new Error("Unable to load products");

products=await r.json();

renderProducts();

}catch(e){

message(e.message,true);

}

}


/* RENDER PRODUCTS */

function renderProducts(){

const box=$("products");

if(!products.length){

box.innerHTML=
"<p>No products found.</p>";

return;

}

box.innerHTML=products.map(p=>{

const images=getImages(p);

const image=images[0];

const sale=
p.sale_price!==null &&
p.sale_price!==undefined;

return `

<div class="product">

${
image
?`<img src="${imageUrl(image)}" alt="">`
:`<div style="height:180px;background:#eee;border-radius:6px"></div>`
}

<h3>
${escapeHtml(p.name)}
</h3>

<div class="small">
${escapeHtml(p.category_name||"No category")}
</div>

<div class="price">

${
sale
?`
<span class="sale">
LKR ${Number(p.sale_price).toLocaleString()}
</span>
<br>
<del class="small">
LKR ${Number(p.price).toLocaleString()}
</del>
`
:
`LKR ${Number(p.price).toLocaleString()}`
}

</div>

<div class="small">
Stock: ${p.stock}
</div>

<div class="small">
Images: ${images.length}
</div>

<div class="actions">

<button
class="btn"
onclick="editProduct(${p.id})"
>
Edit
</button>

<button
class="danger"
onclick="deleteProduct(${p.id})"
>
Delete
</button>

</div>

</div>

`;

}).join("");

}


/* EDIT */

function editProduct(id){

const p=products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;


$("productId").value=p.id;

$("name").value=p.name||"";

$("description").value=p.description||"";

$("price").value=p.price||"";

$("sale_price").value=
p.sale_price===null
?""
:p.sale_price;

$("stock").value=p.stock||0;

$("category_id").value=
p.category_id||"";


selectedImages=[];

$("images").value="";

const oldImages=getImages(p);

$("imagePreview").innerHTML=
oldImages.map(key=>
`<img src="${imageUrl(key)}">`
).join("");

$("formTitle").textContent="Edit Product";

$("saveButton").textContent="Update Product";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* RESET */

function resetForm(){

$("productForm").reset();

$("productId").value="";

$("category_id").value="";

$("images").value="";

selectedImages=[];

$("imagePreview").innerHTML="";

$("formTitle").textContent="Add Product";

$("saveButton").textContent="Save Product";

}


/* DELETE */

async function deleteProduct(id){

if(
!confirm(
"Are you sure you want to delete this product?"
)
)return;

try{

const r=await fetch(
API+"/api/products/"+id,
{
method:"DELETE",
credentials:"include"
}
);

const data=await r.json();

if(!r.ok)
throw new Error(data.error||"Delete failed");

message("Product deleted");

await loadProducts();

}catch(e){

message(e.message,true);

}

}


/* ORDERS */

async function loadOrders(){

try{

const r=await fetch(
API+"/api/admin/orders",
{
credentials:"include"
}
);

if(!r.ok)
return;

const orders=await r.json();

renderOrders(orders);

}catch(e){

console.log(e);

}

}


/* RENDER ORDERS */

function renderOrders(orders){

const box=$("orders");

if(!orders.length){

box.innerHTML=
"<p>No orders yet.</p>";

return;

}

box.innerHTML=orders.map(o=>`

<div class="order">

<strong>
Order #${o.id}
</strong>

<br>

Customer:
${escapeHtml(o.customer_name||"")}

<br>

Phone:
${escapeHtml(o.mobile_1||"")}

<br>

Address:
${escapeHtml(o.address||"")}

<br>

City:
${escapeHtml(o.city||"")}

<br>

Total:
<strong>
LKR ${Number(o.total||0).toLocaleString()}
</strong>

<br><br>

<select
onchange="updateOrderStatus(${o.id},this.value)"
>

${[
"PENDING",
"CONFIRMED",
"PROCESSING",
"SHIPPED",
"DELIVERED",
"CANCELLED"
].map(s=>
`<option
value="${s}"
${o.status===s?"selected":""}
>${s}</option>`
).join("")}

</select>

</div>

`).join("");

}


/* ORDER STATUS */

async function updateOrderStatus(id,status){

try{

const r=await fetch(
API+"/api/admin/orders/"+id,
{

method:"PUT",

credentials:"include",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({status})

}
);

const data=await r.json();

if(!r.ok)
throw new Error(data.error||"Update failed");

message("Order status updated");

}catch(e){

message(e.message,true);

}

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

checkLogin();

</script>

</body>
</html>
