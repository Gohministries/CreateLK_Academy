<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#20242a}
button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:700}
.primary{background:#102a56;color:#fff}.gold{background:#d69b16;color:#fff}.danger{background:#c62828;color:#fff}.light{background:#e9edf3;color:#222}
header{position:sticky;top:0;z-index:100;background:#102a56;color:#fff;box-shadow:0 2px 12px #0003}
.header-inner{max-width:1250px;margin:auto;min-height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:800}.brand span{color:#d69b16}.logout{background:#fff;color:#102a56;padding:8px 12px}
.nav{background:#fff;border-bottom:1px solid #e2e6eb;position:sticky;top:64px;z-index:90}
.nav-inner{max-width:1250px;margin:auto;display:flex;gap:5px;padding:7px 18px;overflow-x:auto}
.nav button{background:transparent;color:#555;white-space:nowrap}.nav button.active{background:#102a56;color:#fff}
.container{max-width:1250px;margin:auto;padding:22px 18px 50px}.page{display:none}.page.active{display:block}
.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.page-title h2{margin:0;font-size:23px}.page-title p{margin:5px 0;color:#777;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.stat,.card{background:#fff;border:1px solid #e5e8ed;border-radius:12px;box-shadow:0 2px 10px #00000008}
.stat{padding:18px}.stat-label{font-size:13px;color:#777}.stat-value{margin-top:8px;font-size:27px;font-weight:800;color:#102a56}
.card{padding:18px;margin-bottom:20px}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.card-title h3{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd3dd;border-radius:8px;background:#fff;outline:none}
textarea{min-height:100px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.preview img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.search-row{display:flex;margin-bottom:16px}.search-row input{flex:1}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.product{background:#fff;border:1px solid #e1e5ea;border-radius:11px;overflow:hidden}
.product-image,.no-image{width:100%;height:190px;object-fit:cover}.no-image{display:flex;align-items:center;justify-content:center;background:#eef1f5;color:#999}
.product-body{padding:13px}.product-name{margin:0 0 7px;font-size:15px}.product-price{font-size:16px;font-weight:800;color:#102a56}.product-old{font-size:12px;color:#999;text-decoration:line-through}.product-stock{margin-top:7px;font-size:13px;color:#555}
.product-actions{display:flex;gap:7px;margin-top:12px}.product-actions button{flex:1;padding:8px}
.orders{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.order-card{background:#fff;border:1px solid #e0e5eb;border-radius:12px;overflow:hidden}
.order-head{padding:14px 16px;background:#f7f9fb;border-bottom:1px solid #e5e8ed;display:flex;justify-content:space-between;gap:10px}
.order-number{font-size:16px;font-weight:800;color:#102a56}.order-date{font-size:11px;color:#777;margin-top:3px}.order-body{padding:16px}.customer{font-size:16px;font-weight:800;margin-bottom:10px}
.info{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f4;font-size:13px}.info-label{min-width:70px;color:#777;font-weight:700}.info-value{flex:1;word-break:break-word}
.order-footer{padding:13px 16px;background:#fafbfc;border-top:1px solid #e8ebef;display:flex;align-items:center;justify-content:space-between;gap:10px}.total{font-size:17px;font-weight:800;color:#102a56}.status-select{width:auto;min-width:145px;font-weight:700}
.message{padding:11px 13px;border-radius:8px;margin-bottom:15px}.success{background:#e5f7e9;color:#176b2c}.error{background:#ffe5e5;color:#a71919}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{width:100%;max-width:400px;background:#fff;padding:30px;border-radius:15px;text-align:center;box-shadow:0 5px 25px #0002}.login-logo{width:70px;height:70px;margin:auto auto 15px;border-radius:16px;background:#102a56;color:#d69b16;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.hidden{display:none!important}.empty{text-align:center;padding:35px;color:#777;background:#fff;border-radius:10px;border:1px dashed #ccd2d9}
@media(max-width:1000px){.products{grid-template-columns:repeat(3,1fr)}.orders{grid-template-columns:1fr}}
@media(max-width:700px){.header-inner{min-height:58px}.nav{top:58px}.brand{font-size:17px}.container{padding:16px 12px 40px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.products{grid-template-columns:repeat(2,1fr)}.product-image,.no-image{height:160px}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}.product-image,.no-image{height:145px}.product-actions{flex-direction:column}.order-footer{align-items:stretch;flex-direction:column}.status-select{width:100%}}
</style>
</head>
<body>

<div id="loginBox" class="login hidden">
<div class="login-card">
<div class="login-logo">CL</div>
<h2>CreateLK Shop</h2><p>Admin Dashboard</p>
<button class="primary" onclick="login()">Login with Google</button>
</div></div>

<div id="admin" class="hidden">
<header><div class="header-inner">
<div class="brand">CreateLK <span>Shop</span></div>
<button class="logout" onclick="logout()">Logout</button>
</div></header>

<nav class="nav"><div class="nav-inner">
<button id="navDashboard" class="active" onclick="showPage('dashboard')">Dashboard</button>
<button id="navProducts" onclick="showPage('productsPage')">Products</button>
<button id="navOrders" onclick="showPage('ordersPage')">Orders <span id="orderCount"></span></button>
</div></nav>

<div class="container"><div id="message"></div>

<section id="dashboard" class="page active">
<div class="page-title"><div><h2>Dashboard</h2><p>Manage your CreateLK Shop</p></div></div>
<div class="stats">
<div class="stat"><div class="stat-label">Products</div><div id="statProducts" class="stat-value">0</div></div>
<div class="stat"><div class="stat-label">Orders</div><div id="statOrders" class="stat-value">0</div></div>
<div class="stat"><div class="stat-label">New Orders</div><div id="statNew" class="stat-value">0</div></div>
</div>
<div class="card"><div class="card-title"><h3>Quick Actions</h3></div>
<div class="actions">
<button class="primary" onclick="newProduct()">+ Add Product</button>
<button class="gold" onclick="showPage('ordersPage')">View Orders</button>
</div></div>
</section>

<section id="productsPage" class="page">
<div class="page-title"><div><h2>Products</h2><p>Add and manage your products</p></div><button class="primary" onclick="newProduct()">+ Add Product</button></div>

<div class="card">
<div class="card-title"><h3 id="formTitle">Add Product</h3><button class="light" onclick="resetForm()">Clear</button></div>
<input type="hidden" id="productId">
<div class="grid">

<div class="field"><label>Product Name</label><input id="name" placeholder="Product name"></div>
<div class="field"><label>Category</label><select id="category"><option value="">Select category</option></select></div>
<div class="field full"><label>Description</label><textarea id="description" placeholder="Product description"></textarea></div>
<div class="field"><label>Cost Price (LKR)</label><input id="cost" type="number" min="0" value="0" oninput="calculatePrice()"></div>
<div class="field"><label>Markup (%)</label><input id="markup" type="number" min="0" value="30" oninput="calculatePrice()"></div>
<div class="field"><label>Selling Price (LKR)</label><input id="price" type="number" min="0" value="0"></div>
<div class="field"><label>Sale Price (Optional)</label><input id="salePrice" type="number" min="0"></div>
<div class="field"><label>Stock</label><input id="stock" type="number" min="0" value="100"></div>

<div class="field full"><label>Product Images</label>
<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="previewFiles()">
<div id="preview" class="preview"></div>
</div>
</div>

<div class="actions"><button class="primary" onclick="saveProduct()">Save Product</button><button class="light" onclick="resetForm()">Clear</button></div>
</div>

<div class="card">
<div class="card-title"><h3>Product List</h3></div>
<div class="search-row"><input id="productSearch" placeholder="Search products..." oninput="renderProducts()"></div>
<div id="products" class="products"></div>
</div>
</section>

<section id="ordersPage" class="page">
<div class="page-title"><div><h2>Orders</h2><p>Manage customer orders</p></div><button class="light" onclick="loadOrders()">Refresh</button></div>
<div id="orders" class="orders"></div>
</section>

</div></div>

<script>
const API="https://shop-api.createlk.workers.dev";
let products=[],categories=[],orders=[],editImages=[];

const $=id=>document.getElementById(id);

function login(){location.href=API+"/auth/google"}
function logout(){location.href=API+"/auth/logout"}

async function checkLogin(){
 try{
  const r=await fetch(API+"/auth/me",{credentials:"include"});
  if(r.ok){
   $("loginBox").classList.add("hidden");
   $("admin").classList.remove("hidden");
   await loadAll();
  }else{
   $("loginBox").classList.remove("hidden");
  }
 }catch{
  $("loginBox").classList.remove("hidden");
 }
}

async function api(path,opt={}){
 const r=await fetch(API+path,{credentials:"include",...opt});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function message(t,type="success"){
 $("message").innerHTML=`<div class="message ${type}">${esc(t)}</div>`;
 setTimeout(()=>$("message").innerHTML="",4000);
}

function showPage(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 $(page).classList.add("active");
 if(page==="dashboard")$("navDashboard").classList.add("active");
 if(page==="productsPage")$("navProducts").classList.add("active");
 if(page==="ordersPage"){
  $("navOrders").classList.add("active");
  loadOrders();
 }
 window.scrollTo({top:0,behavior:"smooth"});
}

async function loadAll(){
 try{
  await loadCategories();
  await loadProducts();
  await loadOrders();
  updateStats();
 }catch(e){message(e.message,"error")}
}

function updateStats(){
 $("statProducts").textContent=products.length;
 $("statOrders").textContent=orders.length;
 const n=orders.filter(x=>String(x.status||"NEW")==="NEW").length;
 $("statNew").textContent=n;
 $("orderCount").textContent=n?` (${n})`:"";
}

async function loadCategories(){
 categories=await api("/api/categories");
 $("category").innerHTML=`<option value="">Select category</option>`+
 categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
}

async function loadProducts(){
 products=await api("/api/products");
 renderProducts();
 updateStats();
}

function renderProducts(){
 const q=$("productSearch").value.toLowerCase().trim();
 const list=products.filter(p=>!q||String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q));
 $("products").innerHTML=list.length?list.map(productCard).join(""):`<div class="empty">No products found.</div>`;
}

function productCard(p){
 const image=p.images?.[0]?.image_key||p.image_key||"";
 const url=image?`${API}/images/${encodeURIComponent(image)}`:"";
 const sale=p.sale_price!==null&&p.sale_price!==undefined&&p.sale_price!=="";
 const price=sale?p.sale_price:p.price;
 return `<div class="product">${url?`<img class="product-image" src="${url}" alt="${esc(p.name)}">`:`<div class="no-image">No Image</div>`}
 <div class="product-body"><h3 class="product-name">${esc(p.name)}</h3>
 <div class="product-price">LKR ${Number(price||0).toLocaleString()}</div>
 ${sale?`<div class="product-old">LKR ${Number(p.price||0).toLocaleString()}</div>`:""}
 <div class="product-stock">Stock: ${Number(p.stock||0)}</div>
 <div class="product-actions"><button class="primary" onclick="editProduct(${p.id})">Edit</button><button class="danger" onclick="deleteProduct(${p.id})">Delete</button></div>
 </div></div>`;
}

function newProduct(){
 resetForm();
 showPage("productsPage");
 setTimeout(()=>$("name").focus(),100);
}

function calculatePrice(){
 const c=Number($("cost").value||0),m=Number($("markup").value||0);
 $("price").value=Math.round(c+c*m/100);
}

function previewFiles(){
 $("preview").innerHTML=[...$("images").files].map(f=>`<img src="${URL.createObjectURL(f)}">`).join("");
}

async function uploadImages(){
 const files=[...$("images").files];
 if(!files.length)return editImages;
 const out=[...editImages];
 for(const file of files){
  const f=new FormData();
  f.append("file",file);
  const d=await api("/api/upload",{method:"POST",body:f});
  out.push(d.key);
 }
 return out;
}

async function saveProduct(){
 try{
  const name=$("name").value.trim();
  if(!name)return message("Product name is required","error");
  const images=await uploadImages();
  const body={
   category_id:$("category").value?Number($("category").value):null,
   name,
   description:$("description").value.trim(),
   price:Number($("price").value||0),
   sale_price:$("salePrice").value===""?null:Number($("salePrice").value),
   stock:Number($("stock").value||0),
   image_key:images[0]||"",
   images
  };
  const id=$("productId").value;
  await api(id?"/api/products/"+id:"/api/products",{
   method:id?"PUT":"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(body)
  });
  message(id?"Product updated successfully.":"Product saved successfully.");
  resetForm();
  await loadProducts();
 }catch(e){message(e.message,"error")}
}

function editProduct(id){
 const p=products.find(x=>Number(x.id)===Number(id));
 if(!p)return;
 $("formTitle").textContent="Edit Product";
 $("productId").value=p.id;
 $("name").value=p.name||"";
 $("category").value=p.category_id||"";
 $("description").value=p.description||"";
 $("price").value=p.price||0;
 $("salePrice").value=p.sale_price==null?"":p.sale_price;
 $("stock").value=p.stock==null?100:p.stock;
 editImages=(p.images||[]).map(x=>x.image_key).filter(Boolean);
 $("preview").innerHTML=editImages.map(x=>`<img src="${API}/images/${encodeURIComponent(x)}">`).join("");
 showPage("productsPage");
}

async function deleteProduct(id){
 if(!confirm("Delete this product?"))return;
 try{
  await api("/api/products/"+id,{method:"DELETE"});
  message("Product deleted.");
  await loadProducts();
 }catch(e){message(e.message,"error")}
}

function resetForm(){
 $("formTitle").textContent="Add Product";
 $("productId").value="";
 $("name").value="";
 $("category").value="";
 $("description").value="";
 $("cost").value=0;
 $("markup").value=30;
 $("price").value=0;
 $("salePrice").value="";
 $("stock").value=100;
 $("images").value="";
 $("preview").innerHTML="";
 editImages=[];
}

async function loadOrders(){
 try{
  orders=await api("/api/admin/orders");
  renderOrders();
  updateStats();
 }catch(e){message(e.message,"error")}
}

function renderOrders(){
 $("orders").innerHTML=orders.length?orders.map(orderCard).join(""):`<div class="empty">No orders found.</div>`;
}

function orderCard(o){
 const s=String(o.status||"NEW").toUpperCase();
 return `<div class="order-card">
 <div class="order-head"><div><div class="order-number">Order #${o.id}</div><div class="order-date">${formatDate(o.created_at)}</div></div><strong>LKR ${Number(o.total||0).toLocaleString()}</strong></div>
 <div class="order-body"><div class="customer">${esc(o.customer_name||"")}</div>
 <div class="info"><div class="info-label">Phone</div><div class="info-value">${esc(o.mobile_1||"")}${o.mobile_2?`<br>${esc(o.mobile_2)}`:""}</div></div>
 <div class="info"><div class="info-label">Address</div><div class="info-value">${esc(o.address||"")}<br>${esc(o.city||"")}</div></div>
 ${o.remarks?`<div class="info"><div class="info-label">Note</div><div class="info-value">${esc(o.remarks)}</div></div>`:""}
 </div>
 <div class="order-footer"><div class="total">LKR ${Number(o.total||0).toLocaleString()}</div>
 <select class="status-select" onchange="changeOrderStatus(${o.id},this.value)">
 <option value="NEW" ${s==="NEW"?"selected":""}>NEW</option>
 <option value="ORDERED" ${s==="ORDERED"?"selected":""}>ORDERED</option>
 <option value="OUT_OF_STOCK" ${s==="OUT_OF_STOCK"?"selected":""}>OUT_OF_STOCK</option>
 </select></div></div>`;
}

async function changeOrderStatus(id,status){
 try{
  await api("/api/admin/orders/"+id,{
   method:"PUT",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({status})
  });
  message("Order status updated.");
  await loadOrders();
 }catch(e){message(e.message,"error")}
}

function formatDate(v){
 if(!v)return"";
 const d=new Date(String(v).replace(" ","T")+"Z");
 return isNaN(d)?esc(v):d.toLocaleString();
}

function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

checkLogin();
</script>
</body>
</html>
