<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#222}
header{background:#102a56;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
button{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:600}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;width:100%;max-width:380px;padding:30px;border-radius:12px;text-align:center;box-shadow:0 5px 25px #0001}
.login-box h2{color:#102a56}
.google{width:100%;background:#102a56;color:#fff}
#app{display:none;max-width:1200px;margin:auto;padding:20px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}
.tab{background:#fff;color:#102a56;border:1px solid #ddd;white-space:nowrap}
.tab.active{background:#102a56;color:#fff}
.refresh{background:#d69b16;color:#fff}
.section{display:none}
.section.active{display:block}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.id{font-weight:bold;color:#102a56}
.status{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold;background:#eee}
.status.PENDING{background:#fff3cd}
.status.CONFIRMED{background:#cfe2ff}
.status.PROCESSING{background:#cfe2ff}
.status.SHIPPED{background:#d1e7dd}
.status.DELIVERED{background:#d1e7dd}
.status.CANCELLED{background:#f8d7da}
.status.OUT{background:#f8d7da}
.customer{line-height:1.6;margin:12px 0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.ordered{background:#198754;color:#fff}
.out{background:#dc3545;color:#fff}
.confirm{background:#102a56;color:#fff}
.restore{background:#d69b16;color:#fff}
.empty{background:#fff;padding:30px;text-align:center;border-radius:10px;color:#777}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid #eee}
@media(max-width:600px){
 #app{padding:12px}
 header{padding:13px}
 header h1{font-size:17px}
}
</style>
</head>

<body>

<div id="login" class="login">
  <div class="login-box">
    <h2>CreateLK Shop</h2>
    <p>Admin Login</p>
    <button class="google" onclick="googleLogin()">
      Continue with Google
    </button>
  </div>
</div>

<header id="header" style="display:none">
  <h1>CreateLK Shop Admin</h1>
  <button onclick="logout()">Logout</button>
</header>

<main id="app">

  <div class="tabs">
    <button class="tab active" onclick="showTab('new',this)">
      New Orders
    </button>

    <button class="tab" onclick="showTab('ordered',this)">
      Ordered
    </button>

    <button class="tab" onclick="showTab('out',this)">
      Out of Stock
    </button>

    <button class="tab" onclick="showTab('all',this)">
      All Orders
    </button>

    <button class="refresh" onclick="loadOrders()">
      Refresh
    </button>
  </div>

  <section id="new" class="section active">
    <div id="newOrders"></div>
  </section>

  <section id="ordered" class="section">
    <div id="orderedOrders"></div>
  </section>

  <section id="out" class="section">
    <div id="outOrders"></div>
  </section>

  <section id="all" class="section">
    <div id="allOrders"></div>
  </section>

</main>

<script>
const API="https://shop-api.createlk.workers.dev";
const OUT_KEY="createlk_out_of_stock";

let orders=[];

function googleLogin(){
  location.href=API+"/auth/google";
}

function outOrders(){
  try{
    return JSON.parse(
      localStorage.getItem(OUT_KEY)||"[]"
    );
  }catch{
    return [];
  }
}

function saveOutOrders(ids){
  localStorage.setItem(
    OUT_KEY,
    JSON.stringify(ids)
  );
}

function isOut(id){
  return outOrders().includes(String(id));
}

function markOut(id){
  const ids=outOrders();

  if(!ids.includes(String(id))){
    ids.push(String(id));
    saveOutOrders(ids);
  }

  renderOrders();
}

function restoreOrder(id){
  saveOutOrders(
    outOrders().filter(x=>x!==String(id))
  );

  renderOrders();
}

async function checkLogin(){

  try{

    const r=await fetch(API+"/auth/me",{
      credentials:"include"
    });

    if(r.ok){
      showApp();
      loadOrders();
    }else{
      showLogin();
    }

  }catch{
    showLogin();
  }
}

function showLogin(){
  document.getElementById("login").style.display="flex";
  document.getElementById("header").style.display="none";
  document.getElementById("app").style.display="none";
}

function showApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("header").style.display="flex";
  document.getElementById("app").style.display="block";
}

function logout(){
  location.href=API+"/auth/logout";
}

function showTab(id,button){

  document.querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  button.classList.add("active");
}

async function loadOrders(){

  try{

    const r=await fetch(
      API+"/api/admin/orders",
      {credentials:"include"}
    );

    if(r.status===401){
      showLogin();
      return;
    }

    orders=await r.json();
    renderOrders();

  }catch(e){
    console.error(e);
    alert("Unable to load orders.");
  }
}

function renderOrders(){

  const out=orders.filter(o=>isOut(o.id));

  const normal=orders.filter(o=>!isOut(o.id));

  const newOrders=normal.filter(
    o=>o.status==="PENDING"
  );

  const ordered=normal.filter(
    o=>o.status==="CONFIRMED" ||
       o.status==="PROCESSING" ||
       o.status==="SHIPPED"
  );

  renderList("newOrders",newOrders,"new");
  renderList("orderedOrders",ordered,"ordered");
  renderList("outOrders",out,"out");
  renderList("allOrders",orders,"all");
}

function renderList(id,list,type){

  const box=document.getElementById(id);

  if(!list.length){
    box.innerHTML=
      '<div class="empty">No orders here.</div>';
    return;
  }

  box.innerHTML=list.map(o=>card(o,type)).join("");
}

function card(o,type){

  const out=isOut(o.id);

  let actions="";

  if(out){

    actions=`
      <button class="restore"
        onclick="restoreOrder(${o.id})">
        Restore Order
      </button>
    `;

  }else{

    if(o.status==="PENDING"){

      actions=`
        <button class="ordered"
          onclick="changeStatus(${o.id},'CONFIRMED')">
          ✓ Mark Ordered
        </button>

        <button class="out"
          onclick="markOut(${o.id})">
          Out of Stock
        </button>
      `;

    }else if(o.status==="CONFIRMED"){

      actions=`
        <button class="confirm"
          onclick="changeStatus(${o.id},'PROCESSING')">
          Processing
        </button>

        <button class="out"
          onclick="markOut(${o.id})">
          Out of Stock
        </button>
      `;

    }else if(o.status==="PROCESSING"){

      actions=`
        <button class="confirm"
          onclick="changeStatus(${o.id},'SHIPPED')">
          Shipped
        </button>

        <button class="out"
          onclick="markOut(${o.id})">
          Out of Stock
        </button>
      `;

    }else if(o.status==="SHIPPED"){

      actions=`
        <button class="ordered"
          onclick="changeStatus(${o.id},'DELIVERED')">
          Delivered
        </button>
      `;
    }
  }

  return `
    <div class="card">

      <div class="head">

        <div class="id">
          Order #${o.id}
        </div>

        <span class="status ${
          out ? "OUT" : o.status
        }">
          ${out ? "OUT OF STOCK" :
            String(o.status||"").replaceAll("_"," ")}
        </span>

      </div>

      <div class="customer">
        <strong>${safe(o.customer_name)}</strong><br>
        ${safe(o.address)}, ${safe(o.city)}<br>
        Mobile: ${safe(o.mobile_1)}
        ${o.mobile_2
          ?"<br>Mobile 2: "+safe(o.mobile_2)
          :""}
      </div>

      <table>

        <tr>
          <td>Total</td>
          <td>
            <strong>
              LKR ${Number(o.total||0).toLocaleString()}
            </strong>
          </td>
        </tr>

        <tr>
          <td>Date</td>
          <td>${formatDate(o.created_at)}</td>
        </tr>

      </table>

      ${
        o.remarks
        ? `<p><strong>Remarks:</strong>
           ${safe(o.remarks)}</p>`
        : ""
      }

      <div class="actions">
        ${actions}
      </div>

    </div>
  `;
}

async function changeStatus(id,status){

  let text="";

  if(status==="CONFIRMED")
    text="Mark this order as Ordered?";

  if(status==="PROCESSING")
    text="Move this order to Processing?";

  if(status==="SHIPPED")
    text="Mark this order as Shipped?";

  if(status==="DELIVERED")
    text="Mark this order as Delivered?";

  if(!confirm(text))
    return;

  try{

    const r=await fetch(
      API+"/api/admin/orders/"+id,
      {
        method:"PUT",
        credentials:"include",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({status})
      }
    );

    const data=await r.json();

    if(!r.ok)
      throw new Error(
        data.error||"Update failed"
      );

    await loadOrders();

  }catch(e){
    alert(e.message);
  }
}

function formatDate(v){
  if(!v)return "";
  return new Date(v).toLocaleString();
}

function safe(v){
  return String(v||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

checkLogin();
</script>

</body>
</html>
