<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{height:64px;background:#102a56;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:100}
.logo{font-size:21px;font-weight:700}.logo span,.login h1 span{color:#d69b16}
.headerRight{display:flex;gap:10px;align-items:center}
.logoutBtn,.menuBtn{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:7px;cursor:pointer;font-weight:600}
.logoutBtn{padding:9px 15px}.menuBtn{display:none;width:40px;height:40px;font-size:22px}
.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #ddd;padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}
.sidebar button{width:100%;border:0;background:none;padding:13px 15px;text-align:left;border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:15px}
.sidebar button:hover,.sidebar button.active{background:#102a56;color:#fff}
.main{flex:1;padding:22px;max-width:1400px}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:22px;box-shadow:0 2px 8px #0000000b}
.section h2{margin:0 0 16px;color:#102a56}.hidden{display:none}
.orderTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:64px;background:#fff;padding:8px 0;z-index:20;border-bottom:1px solid #eee}
.orderTabs button{border:1px solid #ddd;background:#f7f7f7;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:600}
.orderTabs button.active{background:#102a56;color:#fff}
.count{display:inline-block;min-width:22px;padding:2px 6px;margin-left:4px;border-radius:20px;background:#d69b16;color:#fff;font-size:12px}
.searchBox{position:relative;margin-bottom:8px}
.searchBox input{width:100%;padding:13px 45px 13px 15px;border:1px solid #d4d8de;border-radius:9px;font-size:15px}
.searchIcon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#777;pointer-events:none}
.searchInfo{color:#777;font-size:13px;margin-bottom:15px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px;font-size:14px;margin-top:6px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#102a56;box-shadow:0 0 0 2px #102a5615}
textarea{min-height:90px;resize:vertical}
label{display:block;margin-top:12px;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:600}
.primary{background:#102a56;color:#fff}.gold{background:#d69b16;color:#fff}.green{background:#198754;color:#fff}.red{background:#dc3545;color:#fff}.gray{background:#eee;color:#222}
.btn:hover{opacity:.9}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.order{border:1px solid #ddd;border-radius:10px;padding:15px;margin-bottom:12px;background:#fff}
.order h3{margin:0 0 8px;color:#102a56}
.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px;font-weight:bold}
.productsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.productCard{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #0000000b}
.productCardInfo{padding:14px}.productCard h3{margin:0 0 8px;color:#102a56;font-size:17px}
.productMeta{color:#555;font-size:14px;line-height:1.6}
.productPrice{font-size:18px;font-weight:700;color:#102a56;margin-top:7px}
.photoSlider{position:relative;width:100%;height:240px;background:#f1f3f5;overflow:hidden}
.photoSlider img{width:100%;height:100%;object-fit:contain;display:none;background:#f8f8f8}
.photoSlider img.active{display:block}
.sliderBtn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#102a56e0;color:#fff;font-size:25px;cursor:pointer;z-index:5}
.sliderPrev{left:10px}.sliderNext{right:10px}
.photoCounter{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:4px 9px;border-radius:20px;font-size:12px;z-index:6}
.sliderDots{position:absolute;bottom:10px;right:10px;display:flex;gap:5px;z-index:6}
.sliderDot{width:8px;height:8px;border:0;border-radius:50%;background:#ffffffb3;cursor:pointer;padding:0}
.sliderDot.active{background:#d69b16}
.noPhoto{height:240px;display:flex;align-items:center;justify-content:center;color:#888;background:#f5f6f8}
.currentImages{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.currentImage{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd;background:#f5f5f5}
.imageNote{font-size:12px;color:#777;margin-top:6px}
.empty{text-align:center;padding:30px;color:#777}
.login{max-width:400px;margin:100px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px #0002;text-align:center}
.login h1{color:#102a56}
@media(max-width:900px){
.sidebar{position:fixed;left:-230px;top:64px;z-index:90;transition:.25s;box-shadow:4px 0 15px #0002}
.sidebar.open{left:0}.menuBtn{display:block}.grid{grid-template-columns:1fr}
.productsGrid{grid-template-columns:repeat(2,1fr)}.main{padding:14px}
}
@media(max-width:500px){
header{padding:0 12px}.logo{font-size:18px}.logoutBtn{padding:8px 11px}
.productsGrid{grid-template-columns:1fr}.section{padding:15px}
.photoSlider,.noPhoto{height:260px}
}
</style>
</head>

<body>

<div id="loginPage" class="login">
<h1>CreateLK <span>Shop</span></h1>
<p>Admin Dashboard</p>
<button class="btn primary" onclick="googleLogin()">Continue with Google</button>
</div>

<div id="app" style="display:none">
<header>
<div class="logo">CreateLK <span>Shop</span></div>
<div class="headerRight">
<button class="logoutBtn" onclick="logout()">Logout</button>
<button class="menuBtn" onclick="toggleMenu()">☰</button>
</div>
</header>

<div class="layout">

<nav id="sidebar" class="sidebar">
<button class="active" onclick="showSection('orders',this)">🛒 Orders</button>
<button onclick="showSection('products',this)">📦 Products</button>
<button onclick="showSection('addProduct',this)">➕ Add Product</button>
</nav>

<main class="main">

<section id="orders" class="section">
<h2>Orders</h2>

<div class="orderTabs">
<button id="tabNew" class="active" onclick="showOrders('new')">New Orders <span id="newCount" class="count">0</span></button>
<button id="tabOrdered" onclick="showOrders('ordered')">Ordered <span id="orderedCount" class="count">0</span></button>
<button id="tabOut" onclick="showOrders('out')">Out of Stock <span id="outCount" class="count">0</span></button>
</div>

<div id="ordersList"></div>
</section>

<section id="products" class="section hidden">
<h2>Products</h2>

<div class="searchBox">
<input id="productSearch" type="search" placeholder="Search products by name, category or description..." oninput="searchProducts()">
<span class="searchIcon">🔍</span>
</div>

<div id="searchInfo" class="searchInfo"></div>
<div id="productsList"></div>
</section>

<section id="addProduct" class="section hidden">
<h2 id="formTitle">Add Product</h2>
<input type="hidden" id="productId">

<div class="grid">
<div><label>Product Name</label><input id="name" placeholder="Product name"></div>
<div><label>Category</label><input id="category" placeholder="Category"></div>
<div><label>Real / Cost Price</label><input id="cost" type="number" placeholder="Cost price"></div>
<div><label>Markup</label><input id="markup" type="number" value="30" placeholder="Markup"></div>
<div><label>Sale Price</label><input id="price" type="number" placeholder="Sale price"></div>
<div><label>Stock</label><input id="stock" type="number" value="100" placeholder="Stock quantity"></div>
</div>

<label>Description</label>
<textarea id="description" placeholder="Product description"></textarea>

<label>Images</label>
<input id="images" type="file" accept="image/*" multiple>

<div id="existingImages" class="currentImages"></div>
<div id="imageNote" class="imageNote"></div>

<div class="actions">
<button class="btn primary" onclick="saveProduct()">Save Product</button>
<button class="btn gray" onclick="clearForm()">Clear</button>
</div>
</section>

</main>
</div>
</div>

<script>
const API="https://shop-api.createlk.workers.dev";
let orders=[],products=[],currentOrderTab="new",productSearchText="";
const sliderTimers={};

function googleLogin(){location.href=API+"/auth/google"}

async function checkLogin(){
try{
 const r=await fetch(API+"/auth/me",{credentials:"include"});
 if(!r.ok)throw 0;
 loginPage.style.display="none";
 app.style.display="block";
 loadOrders();
 loadProducts();
}catch{
 loginPage.style.display="block";
 app.style.display="none";
}
}

async function logout(){
 try{await fetch(API+"/auth/logout",{method:"POST",credentials:"include"})}catch{}
 location.reload();
}

function toggleMenu(){sidebar.classList.toggle("open")}

function showSection(id,btn){
 document.querySelectorAll(".main .section").forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll(".sidebar button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 sidebar.classList.remove("open");
 scrollTo({top:0,behavior:"smooth"});
}

/* ORDERS */

async function loadOrders(){
try{
 const r=await fetch(API+"/api/admin/orders",{credentials:"include"});
 if(!r.ok)return;
 const data=await r.json();
 orders=Array.isArray(data)?data:[];
 newCount.textContent=orders.filter(o=>Number(o.out_of_stock)!==1&&String(o.status).toUpperCase()==="PENDING").length;
 orderedCount.textContent=orders.filter(o=>Number(o.out_of_stock)!==1&&String(o.status).toUpperCase()!=="PENDING").length;
 outCount.textContent=orders.filter(o=>Number(o.out_of_stock)===1).length;
 renderOrders();
}catch(e){console.error(e)}
}

function showOrders(tab){
 currentOrderTab=tab;
 document.querySelectorAll(".orderTabs button").forEach(x=>x.classList.remove("active"));
 document.getElementById({new:"tabNew",ordered:"tabOrdered",out:"tabOut"}[tab]).classList.add("active");
 renderOrders();
}

function renderOrders(){
 let list=orders.filter(o=>{
  if(currentOrderTab==="out")return Number(o.out_of_stock)===1;
  if(Number(o.out_of_stock)===1)return false;
  return currentOrderTab==="new"
   ?String(o.status).toUpperCase()==="PENDING"
   :String(o.status).toUpperCase()!=="PENDING";
 });

 if(!list.length){
  ordersList.innerHTML='<div class="empty">No orders found.</div>';
  return;
 }

 ordersList.innerHTML=list.map(o=>`
 <div class="order">
  <h3>Order #${safe(o.id)}</h3>
  <p><b>Customer:</b> ${safe(o.customer_name)}</p>
  <p><b>Address:</b> ${safe(o.address)}, ${safe(o.city)}</p>
  <p><b>Mobile:</b> ${safe(o.mobile_1)}${o.mobile_2?" / "+safe(o.mobile_2):""}</p>
  <p><b>Total:</b> LKR ${Number(o.total||0).toLocaleString()}</p>
  <p><b>Status:</b> <span class="status">${safe(o.status)}</span></p>
  ${o.remarks?`<p><b>Remarks:</b> ${safe(o.remarks)}</p>`:""}
  <div class="actions">
   ${currentOrderTab==="new"?`<button class="btn green" onclick="updateOrder(${Number(o.id)},{status:'CONFIRMED'})">Mark Ordered</button>`:""}
   ${currentOrderTab==="ordered"?`<button class="btn primary" onclick="updateOrder(${Number(o.id)},{status:'SHIPPED'})">Mark Shipped</button>`:""}
   ${currentOrderTab!=="out"?`<button class="btn red" onclick="updateOrder(${Number(o.id)},{out_of_stock:1})">Out of Stock</button>`:""}
   ${currentOrderTab==="out"?`<button class="btn green" onclick="updateOrder(${Number(o.id)},{out_of_stock:0})">Restore</button>`:""}
  </div>
 </div>`).join("");
}

async function updateOrder(id,data){
try{
 const r=await fetch(API+"/api/admin/orders/"+id,{
  method:"PUT",credentials:"include",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(data)
 });
 if(r.ok)loadOrders();
 else alert("Failed to update order.");
}catch{alert("Network error.")}
}

/* PRODUCTS */

async function loadProducts(){
try{
 const r=await fetch(API+"/api/products");
 if(!r.ok)return;
 const data=await r.json();
 products=Array.isArray(data)?data:[];
 renderProducts();
}catch(e){console.error("Product loading error:",e)}
}

function searchProducts(){
 productSearchText=productSearch.value.trim().toLowerCase();
 renderProducts();
}

function getFilteredProducts(){
 if(!productSearchText)return products;
 return products.filter(p=>
  String(p.name||"").toLowerCase().includes(productSearchText)||
  String(p.category||"").toLowerCase().includes(productSearchText)||
  String(p.description||"").toLowerCase().includes(productSearchText)
 );
}

/* IMAGES */

function getProductImages(p){
 let a=[];
 if(Array.isArray(p.images))a=p.images;
 else if(typeof p.images==="string"){
  let v=p.images.trim();
  if(v){
   try{
    let x=JSON.parse(v);
    a=Array.isArray(x)?x:x?[x]:[];
   }catch{
    a=v.split(",").map(x=>x.trim()).filter(Boolean);
   }
  }
 }else if(p.images&&typeof p.images==="object")a=[p.images];

 if(!a.length){
  if(p.image)a=[p.image];
  else if(p.image_url)a=[p.image_url];
  else if(p.imageUrl)a=[p.imageUrl];
 }

 return a.map(x=>{
  if(typeof x==="object")
   return x.url||x.key||x.image||x.image_url||x.imageUrl||"";
  return String(x);
 }).map(x=>x.trim()).filter(Boolean);
}

function getImageUrl(image){
 image=String(image||"").trim();
 if(!image)return "";
 if(/^https?:\/\//i.test(image)||image.startsWith("data:"))return image;
 if(image.startsWith("/images/"))return API+image;
 if(image.startsWith("images/"))return API+"/"+image;
 return API+"/images/"+encodeURIComponent(image);
}

/* SLIDER */

function stopSlider(id){
 if(sliderTimers[id]){
  clearInterval(sliderTimers[id]);
  delete sliderTimers[id];
 }
}

function stopAllSliders(){
 Object.keys(sliderTimers).forEach(stopSlider);
}

function showSlide(id,index){
 const s=document.getElementById(id);
 if(!s)return;
 const imgs=[...s.querySelectorAll("img")];
 if(!imgs.length)return;

 index=((index%imgs.length)+imgs.length)%imgs.length;
 s.dataset.index=index;

 imgs.forEach((x,i)=>x.classList.toggle("active",i===index));
 s.querySelectorAll(".sliderDot").forEach((x,i)=>x.classList.toggle("active",i===index));

 const c=document.getElementById(id+"Counter");
 if(c)c.textContent=`${index+1} / ${imgs.length}`;
}

function changeSlide(id,n){
 const s=document.getElementById(id);
 if(s)showSlide(id,Number(s.dataset.index||0)+n);
}

function goToSlide(id,n){showSlide(id,n)}

function startSlider(id){
 const s=document.getElementById(id);
 if(!s||s.querySelectorAll("img").length<2)return;
 stopSlider(id);
 sliderTimers[id]=setInterval(()=>changeSlide(id,1),4000);
}

/* PRODUCT DISPLAY */

function createProductCard(p,index){
 const images=getProductImages(p);
 const id="slider-"+String(p.id!==undefined?p.id:index);

 let photo=images.length?`
 <div class="photoSlider" id="${safe(id)}" data-index="0">
  ${images.map((x,i)=>`
   <img src="${safe(getImageUrl(x))}" class="${i===0?"active":""}" alt="${safe(p.name||"Product")}" loading="${i?"lazy":"eager"}">
  `).join("")}

  ${images.length>1?`
   <button class="sliderBtn sliderPrev" onclick="changeSlide('${safe(id)}',-1)">‹</button>
   <button class="sliderBtn sliderNext" onclick="changeSlide('${safe(id)}',1)">›</button>
   <div class="photoCounter" id="${safe(id)}Counter">1 / ${images.length}</div>
   <div class="sliderDots">
    ${images.map((_,i)=>`
     <button class="sliderDot ${i===0?"active":""}" onclick="goToSlide('${safe(id)}',${i})"></button>
    `).join("")}
   </div>
  `:""}
 </div>`:
 `<div class="noPhoto">No photo</div>`;

 return `
 <article class="productCard">
  ${photo}
  <div class="productCardInfo">
   <h3>${safe(p.name||"Unnamed Product")}</h3>
   <div class="productMeta">
    <b>Category:</b> ${safe(p.category||"-")}<br>
    <b>Stock:</b> ${safe(p.stock??0)}
   </div>
   <div class="productPrice">LKR ${Number(p.price||0).toLocaleString()}</div>
   ${p.description?`<p class="productMeta">${safe(p.description)}</p>`:""}
   <div class="actions">
    <button class="btn primary" onclick="editProduct(${Number(p.id)})">Edit</button>
    <button class="btn red" onclick="deleteProduct(${Number(p.id)})">Delete</button>
   </div>
  </div>
 </article>`;
}

function renderProducts(){
 stopAllSliders();

 const list=getFilteredProducts();

 searchInfo.textContent=productSearchText
  ?`${list.length} product${list.length===1?"":"s"} found`
  :`${products.length} product${products.length===1?"":"s"}`;

 if(!list.length){
  productsList.innerHTML='<div class="empty">No products found.</div>';
  return;
 }

 productsList.innerHTML=`<div class="productsGrid">
 ${list.map((p,i)=>createProductCard(p,i)).join("")}
 </div>`;

 list.forEach((p,i)=>{
  if(getProductImages(p).length>1)
   startSlider("slider-"+String(p.id!==undefined?p.id:i));
 });
}

/* EDIT */

function editProduct(id){
 const p=products.find(x=>Number(x.id)===Number(id));
 if(!p)return;

 productId.value=p.id||"";
 name.value=p.name||"";
 category.value=p.category||"";
 cost.value=p.cost??"";
 markup.value=p.markup??30;
 price.value=p.price??"";
 stock.value=p.stock??100;
 description.value=p.description||"";
 images.value="";
 formTitle.textContent="Edit Product";
 renderExistingImages(p);
 showSection("addProduct",document.querySelectorAll(".sidebar button")[2]);
}

function renderExistingImages(p){
 const a=getProductImages(p);

 existingImages.innerHTML=a.length
  ?a.map(x=>`<img class="currentImage" src="${safe(getImageUrl(x))}" alt="">`).join("")
  :"";

 imageNote.textContent=a.length
  ?"Current photos will remain if you do not select new photos. Selecting new photos replaces them."
  :"";
}

/* SAVE */

async function saveProduct(){
 const nameVal=name.value.trim();
 if(!nameVal){
  alert("Please enter product name.");
  return;
 }

 try{
  const files=[...images.files];
  let imageKeys=[];

  for(const file of files){
   const fd=new FormData();
   fd.append("file",file);

   const r=await fetch(API+"/api/upload",{
    method:"POST",
    credentials:"include",
    body:fd
   });

   if(!r.ok)throw new Error("Upload failed");

   const d=await r.json();
   const key=d.key||d.url||d.image||d.image_url;
   if(key)imageKeys.push(key);
  }

  const data={
   name:nameVal,
   category:category.value.trim(),
   cost:Number(cost.value||0),
   markup:Number(markup.value||0),
   price:Number(price.value||0),
   stock:Number(stock.value||0),
   description:description.value.trim()
  };

  if(imageKeys.length)data.images=imageKeys;

  const id=productId.value;
  const r=await fetch(
   id?API+"/api/products/"+id:API+"/api/products",
   {
    method:id?"PUT":"POST",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
   }
  );

  if(!r.ok){
   alert("Failed to save product.");
   return;
  }

  alert("Product saved successfully.");
  clearForm();
  await loadProducts();
  showSection("products",document.querySelectorAll(".sidebar button")[1]);

 }catch(e){
  console.error(e);
  alert("Network error.");
 }
}

/* DELETE */

async function deleteProduct(id){
 if(!confirm("Delete this product?"))return;

 try{
  const r=await fetch(API+"/api/products/"+id,{
   method:"DELETE",
   credentials:"include"
  });

  if(r.ok)loadProducts();
  else alert("Failed to delete product.");
 }catch{
  alert("Network error.");
 }
}

/* FORM */

function clearForm(){
 productId.value="";
 name.value="";
 category.value="";
 cost.value="";
 markup.value=30;
 price.value="";
 stock.value=100;
 description.value="";
 images.value="";
 existingImages.innerHTML="";
 imageNote.textContent="";
 formTitle.textContent="Add Product";
}

function safe(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

checkLogin();
</script>

</body>
</html>
