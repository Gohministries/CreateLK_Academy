
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{height:64px;background:#102a56;color:#fff;display:flex;align-items:center;
justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.logo{font-size:21px;font-weight:700}.logo span,.login h1 span{color:#d69b16}
.head{display:flex;align-items:center;gap:10px}
.logout,.menu{background:transparent;color:#fff;border:1px solid #ffffff80;
border-radius:7px;padding:9px 14px;font-weight:600}
.menu{display:none;font-size:20px;padding:7px 11px}

.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #ddd;padding:16px 12px;
position:sticky;top:64px;height:calc(100vh - 64px)}
.sidebar button{width:100%;border:0;background:none;text-align:left;padding:12px 14px;
border-radius:8px;margin-bottom:5px;font-weight:600}
.sidebar button:hover,.sidebar button.active{background:#102a56;color:#fff}

main{flex:1;padding:22px;max-width:1400px}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;
box-shadow:0 2px 8px #0000000b}
.hidden{display:none}
h2{margin:0 0 16px;color:#102a56}

.toolbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.search{padding:11px;border:1px solid #ccc;border-radius:8px;outline:none}
.searchBox{flex:1;min-width:220px}
select.search{width:200px}

input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;
border-radius:7px;outline:none;margin-top:6px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#102a56}
label{display:block;font-size:14px;font-weight:600;margin-top:12px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:600}
.primary{background:#102a56;color:#fff}.green{background:#198754;color:#fff}
.red{background:#dc3545;color:#fff}.gray{background:#eee}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

.order{border:1px solid #ddd;border-radius:10px;padding:15px;margin-bottom:12px}
.order h3{margin:0 0 8px;color:#102a56}
.status{display:inline-block;background:#eee;padding:4px 8px;border-radius:20px;font-size:12px}
.empty{text-align:center;padding:30px;color:#777}

.productsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.productCard{border:1px solid #ddd;border-radius:12px;overflow:hidden}
.productInfo{padding:14px}
.productInfo h3{margin:0 0 7px;color:#102a56}
.meta{font-size:14px;color:#555;line-height:1.6}
.price{font-size:18px;font-weight:700;color:#102a56;margin-top:7px}

.slider{height:230px;background:#f2f3f5;position:relative;overflow:hidden}
.slider img{width:100%;height:100%;object-fit:contain;display:none}
.slider img.active{display:block}
.slideBtn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;
border:0;border-radius:50%;background:#102a56dd;color:#fff;font-size:24px}
.prev{left:8px}.next{right:8px}
.counter{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
background:#000b;color:#fff;padding:4px 8px;border-radius:20px;font-size:12px}
.noPhoto{height:230px;display:flex;align-items:center;justify-content:center;color:#888}

.currentImages{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.currentImages img{width:75px;height:75px;object-fit:cover;border-radius:7px;border:1px solid #ddd}
.note{font-size:12px;color:#777;margin-top:6px}

.login{max-width:400px;margin:100px auto;background:#fff;padding:30px;border-radius:12px;
text-align:center;box-shadow:0 4px 20px #0002}
.login h1{color:#102a56}

@media(max-width:900px){
 .sidebar{position:fixed;left:-230px;top:64px;z-index:90;transition:.25s;
 box-shadow:4px 0 15px #0002}
 .sidebar.open{left:0}.menu{display:block}
 main{padding:14px}.grid{grid-template-columns:1fr}
 .productsGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
 header{padding:0 12px}.logo{font-size:18px}
 .productsGrid{grid-template-columns:1fr}
 .section{padding:15px}.slider,.noPhoto{height:250px}
}
</style>
</head>

<body>

<div id="loginPage" class="login">
<h1>CreateLK <span>Shop</span></h1>
<p>Admin Dashboard</p>
<button class="btn primary" onclick="login()">Continue with Google</button>
</div>

<div id="app" style="display:none">

<header>
 <div class="logo">CreateLK <span>Shop</span></div>
 <div class="head">
  <button class="logout" onclick="logout()">Logout</button>
  <button class="menu" onclick="toggleMenu()">☰</button>
 </div>
</header>

<div class="layout">

<nav id="sidebar" class="sidebar">
 <button class="active" onclick="show('orders',this)">🛒 Orders</button>
 <button onclick="show('products',this)">📦 Products</button>
 <button onclick="addProduct(this)">➕ Add Product</button>
</nav>

<main>

<!-- ORDERS -->
<section id="orders" class="section">
<h2>Orders</h2>

<div class="toolbar">
 <input id="orderSearch" class="search searchBox"
 placeholder="Search orders..." oninput="renderOrders()">
 <button class="btn gray" onclick="loadOrders()">Refresh</button>
</div>

<div id="ordersList"></div>
</section>


<!-- PRODUCTS -->
<section id="products" class="section hidden">
<h2>Products</h2>

<div class="toolbar">
 <input id="productSearch" class="search searchBox"
 placeholder="Search products..." oninput="renderProducts()">

 <select id="categoryFilter" class="search" onchange="renderProducts()">
  <option value="">All Categories</option>
 </select>

 <button class="btn primary" onclick="addProduct()">+ Add Product</button>
</div>

<div id="productsList"></div>
</section>


<!-- ADD / EDIT -->
<section id="addProduct" class="section hidden">

<h2 id="formTitle">Add Product</h2>

<input type="hidden" id="productId">

<div class="grid">

<div>
<label>Product Name</label>
<input id="name" placeholder="Product name">
</div>

<div>
<label>Category</label>
<select id="category">
<option value="">Select Category</option>
</select>
</div>

<div>
<label>Price (LKR)</label>
<input id="price" type="number" min="0" step="0.01">
</div>

<div>
<label>Stock</label>
<input id="stock" type="number" min="0" value="0">
</div>

</div>

<label>Description</label>
<textarea id="description" placeholder="Product description"></textarea>

<label>Product Images</label>
<input id="images" type="file"
accept="image/jpeg,image/png,image/webp" multiple>

<div id="existingImages" class="currentImages"></div>
<div id="imageNote" class="note"></div>

<div class="actions">
<button class="btn primary" onclick="saveProduct()">Save Product</button>
<button class="btn gray" onclick="clearForm()">Clear</button>
</div>

</section>

</main>
</div>
</div>


<script>
const API="https://shop-api.createlk.workers.dev";

let products=[],orders=[],categories=[];
let searchText="";
let sliderIndex={};

const $=id=>document.getElementById(id);


/* AUTH */

function login(){
 location.href=API+"/auth/google";
}

async function checkLogin(){
 try{
  const r=await fetch(API+"/auth/me",{credentials:"include"});
  const d=await r.json();

  if(!r.ok||!d.authenticated)throw 0;

  $("loginPage").style.display="none";
  $("app").style.display="block";

  await loadCategories();
  await loadProducts();
  await loadOrders();

 }catch{
  $("loginPage").style.display="block";
  $("app").style.display="none";
 }
}

async function logout(){
 try{
  await fetch(API+"/auth/logout",{credentials:"include"});
 }catch{}
 location.reload();
}


/* MENU */

function toggleMenu(){
 $("sidebar").classList.toggle("open");
}

function show(id,btn){
 document.querySelectorAll("main .section")
 .forEach(x=>x.classList.add("hidden"));

 $(id).classList.remove("hidden");

 document.querySelectorAll(".sidebar button")
 .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 $("sidebar").classList.remove("open");
 scrollTo({top:0,behavior:"smooth"});
}

function addProduct(btn){
 clearForm();
 show("addProduct",btn);
}


/* CATEGORIES */

async function loadCategories(){
 try{
  const r=await fetch(API+"/api/categories");
  if(!r.ok)throw 0;

  categories=await r.json();

  const options=categories.map(c=>
   `<option value="${c.id}">${safe(c.name)}</option>`
  ).join("");

  $("category").innerHTML=
   '<option value="">Select Category</option>'+options;

  $("categoryFilter").innerHTML=
   '<option value="">All Categories</option>'+options;

 }catch(e){
  console.error(e);
 }
}


/* ORDERS */

async function loadOrders(){
 try{
  const r=await fetch(
   API+"/api/admin/orders",
   {credentials:"include"}
  );

  if(!r.ok)throw 0;

  const d=await r.json();
  orders=Array.isArray(d)?d:(d.orders||[]);

  renderOrders();

 }catch(e){
  $("ordersList").innerHTML=
   '<div class="empty">Could not load orders.</div>';
 }
}

function renderOrders(){

 const q=$("orderSearch").value.trim().toLowerCase();

 const list=orders.filter(o=>{
  const text=`
   ${o.id||""}
   ${o.customer_name||""}
   ${o.mobile_1||""}
   ${o.city||""}
   ${o.address||""}
  `.toLowerCase();

  return !q||text.includes(q);
 });

 if(!list.length){
  $("ordersList").innerHTML=
   '<div class="empty">No orders found.</div>';
  return;
 }

 $("ordersList").innerHTML=list.map(o=>`

 <div class="order">

  <h3>Order #${safe(o.id)}</h3>

  <p><b>Customer:</b>
   ${safe(o.customer_name||"-")}
  </p>

  <p><b>Address:</b>
   ${safe(o.address||"-")}, ${safe(o.city||"-")}
  </p>

  <p><b>Mobile:</b>
   ${safe(o.mobile_1||"-")}
   ${o.mobile_2?" / "+safe(o.mobile_2):""}
  </p>

  <p><b>Total:</b>
   LKR ${Number(o.total||0).toLocaleString()}
  </p>

  <p><b>Status:</b>
   <span class="status">${safe(o.status||"PENDING")}</span>
  </p>

  <div class="actions">

   <button class="btn green"
    onclick="updateOrder(${o.id},'CONFIRMED')">
    Confirm
   </button>

   <button class="btn primary"
    onclick="updateOrder(${o.id},'SHIPPED')">
    Shipped
   </button>

   <button class="btn primary"
    onclick="updateOrder(${o.id},'DELIVERED')">
    Delivered
   </button>

   <button class="btn red"
    onclick="updateOrder(${o.id},'CANCELLED')">
    Cancel
   </button>

  </div>

 </div>

 `).join("");
}

async function updateOrder(id,status){

 try{

  const r=await fetch(
   API+"/api/admin/orders/"+id,
   {
    method:"PUT",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({status})
   }
  );

  if(!r.ok){
   const d=await r.json();
   throw new Error(d.error||"Update failed");
  }

  await loadOrders();

 }catch(e){
  alert(e.message||"Network error.");
 }
}


/* PRODUCTS */

async function loadProducts(){

 try{

  const r=await fetch(API+"/api/products");

  if(!r.ok)throw 0;

  products=await r.json();
  if(!Array.isArray(products))products=[];

  renderProducts();

 }catch(e){

  $("productsList").innerHTML=
   '<div class="empty">Could not load products.</div>';
 }
}

function renderProducts(){

 searchText=$("productSearch").value.trim().toLowerCase();

 const cat=$("categoryFilter").value;

 const list=products.filter(p=>{

  const text=`
   ${p.name||""}
   ${p.description||""}
   ${p.category_name||""}
  `.toLowerCase();

  return (!searchText||text.includes(searchText))&&
         (!cat||String(p.category_id)===String(cat));
 });

 if(!list.length){
  $("productsList").innerHTML=
   '<div class="empty">No products found.</div>';
  return;
 }

 $("productsList").innerHTML=
  '<div class="productsGrid">'+
  list.map((p,i)=>productCard(p,i)).join("")+
  '</div>';
}


/* IMAGES */

function getImages(p){

 if(!Array.isArray(p.images)){

  return p.image_key
   ?[p.image_key]
   :[];
 }

 return p.images.map(x=>
  typeof x==="string"
   ?x
   :x.image_key
 ).filter(Boolean);
}

function imageUrl(key){

 key=String(key||"");

 if(!key)return "";

 if(/^https?:\/\//i.test(key))
  return key;

 return API+"/images/"+encodeURIComponent(key);
}


/* PRODUCT CARD */

function productCard(p,index){

 const images=getImages(p);
 const i=sliderIndex[p.id]||0;
 const img=images[i]||images[0];

 return `

 <article class="productCard">

  ${
   img
   ?`

   <div class="slider">

    <img
     id="img-${p.id}"
     class="active"
     src="${safe(imageUrl(img))}"
     alt="${safe(p.name)}">

    ${
     images.length>1
     ?`

      <button class="slideBtn prev"
       onclick="slide(${p.id},-1)">‹</button>

      <button class="slideBtn next"
       onclick="slide(${p.id},1)">›</button>

      <div id="count-${p.id}" class="counter">
       ${i+1} / ${images.length}
      </div>

     `:""
    }

   </div>

   `
   :`<div class="noPhoto">No photo</div>`
  }

  <div class="productInfo">

   <h3>${safe(p.name||"Unnamed Product")}</h3>

   <div class="meta">
    <b>Category:</b>
    ${safe(p.category_name||"-")}<br>

    <b>Stock:</b>
    ${Number(p.stock||0)}
   </div>

   <div class="price">
    LKR ${Number(p.sale_price??p.price??0).toLocaleString()}
   </div>

   ${
    p.description
    ?`<p class="meta">${safe(p.description)}</p>`
    :""
   }

   <div class="actions">

    <button class="btn primary"
     onclick="editProduct(${p.id})">
     Edit
    </button>

    <button class="btn red"
     onclick="deleteProduct(${p.id})">
     Delete
    </button>

   </div>

  </div>

 </article>`;
}


/* SLIDER */

function slide(id,d){

 const p=products.find(
  x=>Number(x.id)===Number(id)
 );

 if(!p)return;

 const images=getImages(p);

 if(images.length<2)return;

 let i=sliderIndex[id]||0;

 i=(i+d+images.length)%images.length;

 sliderIndex[id]=i;

 const img=$("img-"+id);

 if(img)
  img.src=imageUrl(images[i]);

 const count=$("count-"+id);

 if(count)
  count.textContent=`${i+1} / ${images.length}`;
}


/* EDIT */

function editProduct(id){

 const p=products.find(
  x=>Number(x.id)===Number(id)
 );

 if(!p)return;

 $("productId").value=p.id;
 $("name").value=p.name||"";

 /* Worker uses category_id */
 $("category").value=p.category_id||"";

 $("price").value=p.price??"";
 $("stock").value=p.stock??0;
 $("description").value=p.description||"";

 $("images").value="";

 renderExistingImages(p);

 $("formTitle").textContent="Edit Product";

 show(
  "addProduct",
  document.querySelectorAll(".sidebar button")[2]
 );
}


/* EXISTING IMAGES */

function renderExistingImages(p){

 const images=getImages(p);

 $("existingImages").innerHTML=
  images.map(x=>`
   <img src="${safe(imageUrl(x))}"
    alt=""
    onerror="this.style.display='none'">
  `).join("");

 $("imageNote").textContent=
  images.length
   ?"Existing photos remain unless new photos are selected."
   :"";
}


/* UPLOAD */

async function uploadImage(file){

 const fd=new FormData();
 fd.append("file",file);

 const r=await fetch(
  API+"/api/upload",
  {
   method:"POST",
   credentials:"include",
   body:fd
  }
 );

 const d=await r.json();

 if(!r.ok)
  throw new Error(d.error||"Image upload failed");

 return d.key;
}


/* SAVE */

async function saveProduct(){

 const productName=$("name").value.trim();

 if(!productName){
  alert("Please enter product name.");
  return;
 }

 try{

  const oldId=$("productId").value;
  let images=[];

  for(const file of $("images").files){

   if(file.size>5*1024*1024)
    throw new Error(
     `${file.name} is larger than 5 MB`
    );

   images.push(await uploadImage(file));
  }

  /*
   * Worker expects category_id,
   * not category.
   */
  const data={
   name:productName,

   category_id:$("category").value
    ?Number($("category").value)
    :null,

   description:$("description").value.trim(),

   price:Number($("price").value||0),

   stock:Number($("stock").value||0)
  };

  if(images.length){
   data.image_key=images[0];
   data.images=images;
  }

  const url=oldId
   ?API+"/api/products/"+oldId
   :API+"/api/products";

  const r=await fetch(
   url,
   {
    method:oldId?"PUT":"POST",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
   }
  );

  const d=await r.json();

  if(!r.ok)
   throw new Error(d.error||"Save failed");

  alert(
   oldId
    ?"Product updated successfully."
    :"Product added successfully."
  );

  clearForm();
  await loadProducts();

  show(
   "products",
   document.querySelectorAll(".sidebar button")[1]
  );

 }catch(e){

  console.error(e);
  alert(e.message||"Network error.");
 }
}


/* DELETE */

async function deleteProduct(id){

 const p=products.find(
  x=>Number(x.id)===Number(id)
 );

 if(!p)return;

 if(!confirm(`Delete "${p.name}"?`))
  return;

 try{

  const r=await fetch(
   API+"/api/products/"+id,
   {
    method:"DELETE",
    credentials:"include"
   }
  );

  const d=await r.json();

  if(!r.ok)
   throw new Error(d.error||"Delete failed");

  await loadProducts();

 }catch(e){
  alert(e.message||"Network error.");
 }
}


/* CLEAR */

function clearForm(){

 $("productId").value="";
 $("name").value="";
 $("category").value="";
 $("price").value="";
 $("stock").value=0;
 $("description").value="";
 $("images").value="";
 $("existingImages").innerHTML="";
 $("imageNote").textContent="";
 $("formTitle").textContent="Add Product";
}


/* SAFE HTML */

function safe(v){

 return String(v??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m])
 );
}

checkLogin();
</script>

</body>
</html>
