<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#102a56;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}
button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:600}
.primary{background:#102a56;color:#fff}
.gold{background:#d69b16;color:#fff}
.danger{background:#c62828;color:#fff}
.light{background:#e9edf3;color:#222}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:20px;box-shadow:0 2px 10px #0000000d}
h2{margin:0 0 15px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input,textarea,select{
  width:100%;padding:11px;border:1px solid #ccd3dd;
  border-radius:7px;font-size:14px;background:#fff
}
textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.preview img{width:85px;height:85px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.product{
  background:#fff;border:1px solid #e0e4e9;border-radius:10px;
  overflow:hidden
}
.product img{width:100%;height:180px;object-fit:cover;background:#eee}
.product-body{padding:12px}
.product h3{margin:0 0 7px;font-size:15px}
.price{font-weight:700;color:#102a56}
.stock{font-size:13px;color:#555;margin-top:5px}
.small{font-size:12px;color:#777}
.search{margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:10px;border-bottom:1px solid #e5e8ed;text-align:left;font-size:13px}
th{background:#f4f6f9}
.status{
  padding:5px 8px;border-radius:20px;font-size:11px;
  font-weight:700;display:inline-block
}
.NEW{background:#e7f0ff;color:#1856a8}
.ORDERED{background:#fff2d6;color:#946200}
.OUT_OF_STOCK{background:#ffe3e3;color:#b21f1f}
.login{text-align:center;padding:60px 20px}
.hidden{display:none!important}
.message{padding:10px;border-radius:7px;margin-bottom:12px}
.success{background:#e4f7e9;color:#176b2c}
.error{background:#ffe5e5;color:#a71919}
@media(max-width:900px){
  .products{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .products{grid-template-columns:repeat(2,1fr)}
  .container{padding:12px}
}
@media(max-width:380px){
  .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>CreateLK Shop Admin</h1>
  <button class="light" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="login hidden">
  <div class="card">
    <h2>Admin Login</h2>
    <p>Sign in with the authorized Google account.</p>
    <button class="primary" onclick="login()">Login with Google</button>
  </div>
</div>

<main id="app" class="container hidden">

  <div id="message"></div>

  <!-- PRODUCT FORM -->
  <section class="card">
    <h2 id="formTitle">Add Product</h2>

    <input type="hidden" id="productId">

    <div class="grid">

      <div class="field">
        <label>Product Name</label>
        <input id="name" placeholder="Product name">
      </div>

      <div class="field">
        <label>Category</label>
        <select id="category">
          <option value="">Select category</option>
        </select>
      </div>

      <div class="field full">
        <label>Description</label>
        <textarea id="description" placeholder="Product description"></textarea>
      </div>

      <div class="field">
        <label>Cost Price (LKR)</label>
        <input id="cost" type="number" min="0" value="0"
               oninput="calculatePrice()">
      </div>

      <div class="field">
        <label>Markup (%)</label>
        <input id="markup" type="number" min="0" value="30"
               oninput="calculatePrice()">
      </div>

      <div class="field">
        <label>Selling Price (LKR)</label>
        <input id="price" type="number" min="0" value="0">
      </div>

      <div class="field">
        <label>Sale Price (Optional)</label>
        <input id="salePrice" type="number" min="0"
               placeholder="Leave empty for normal price">
      </div>

      <div class="field">
        <label>Stock</label>
        <input id="stock" type="number" min="0" value="100">
      </div>

      <div class="field full">
        <label>Product Images</label>
        <input id="images" type="file"
               accept="image/jpeg,image/png,image/webp"
               multiple onchange="previewFiles()">
        <div id="preview" class="preview"></div>
      </div>

    </div>

    <div class="actions">
      <button class="primary" onclick="saveProduct()">Save Product</button>
      <button class="light" onclick="resetForm()">Clear</button>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="card">
    <h2>Products</h2>

    <input class="search" id="productSearch"
           placeholder="Search products..."
           oninput="renderProducts()">

    <div id="products" class="products"></div>
  </section>

  <!-- ORDERS -->
  <section class="card">
    <h2>Orders</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Contact</th>
            <th>Address</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders"></tbody>
      </table>
    </div>
  </section>

</main>

<script>
const API="https://shop-api.createlk.workers.dev";

let products=[];
let categories=[];
let orders=[];
let editImages=[];

function $(id){
  return document.getElementById(id);
}

function message(text,type="success"){
  $("message").innerHTML=
    `<div class="message ${type}">${text}</div>`;
  setTimeout(()=>$("message").innerHTML="",4000);
}

function login(){
  location.href=API+"/auth/google";
}

async function checkLogin(){
  try{
    const r=await fetch(API+"/auth/me",{
      credentials:"include"
    });

    if(r.ok){
      $("app").classList.remove("hidden");
      $("loginBox").classList.add("hidden");
      await loadAll();
    }else{
      $("app").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
    }
  }catch(e){
    $("app").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
  }
}

function logout(){
  location.href=API+"/auth/logout";
}

async function api(path,options={}){
  const r=await fetch(API+path,{
    credentials:"include",
    ...options
  });

  const data=await r.json().catch(()=>({}));

  if(!r.ok)
    throw new Error(data.error||"Request failed");

  return data;
}

async function loadAll(){
  try{
    await loadCategories();
    await loadProducts();
    await loadOrders();
  }catch(e){
    message(e.message,"error");
  }
}

async function loadCategories(){
  categories=await api("/api/categories");

  $("category").innerHTML=
    `<option value="">Select category</option>`+
    categories.map(c=>
      `<option value="${c.id}">${esc(c.name)}</option>`
    ).join("");
}

async function loadProducts(){
  products=await api("/api/products");
  renderProducts();
}

function renderProducts(){
  const q=$("productSearch").value.toLowerCase().trim();

  const list=products.filter(p=>
    !q ||
    String(p.name).toLowerCase().includes(q) ||
    String(p.description||"").toLowerCase().includes(q)
  );

  $("products").innerHTML=list.length
    ?list.map(productCard).join("")
    :`<p class="small">No products found.</p>`;
}

function productCard(p){

  const image=
    p.images?.[0]?.image_key ||
    p.image_key ||
    "";

  const imageUrl=image
    ?`${API}/images/${encodeURIComponent(image)}`
    :"";

  const sale=p.sale_price!==null &&
             p.sale_price!==undefined &&
             p.sale_price!=="";

  return `
    <div class="product">
      ${
        imageUrl
        ?`<img src="${imageUrl}" alt="${esc(p.name)}">`
        :`<div style="height:180px;background:#eee"></div>`
      }

      <div class="product-body">
        <h3>${esc(p.name)}</h3>

        <div class="price">
          LKR ${Number(sale?p.sale_price:p.price).toLocaleString()}
        </div>

        ${
          sale
          ?`<div class="small">
              Regular: LKR ${Number(p.price).toLocaleString()}
            </div>`
          :""
        }

        <div class="stock">
          Stock: ${Number(p.stock||0)}
        </div>

        <div class="actions">
          <button class="primary"
            onclick="editProduct(${p.id})">Edit</button>

          <button class="danger"
            onclick="deleteProduct(${p.id})">Delete</button>
        </div>
      </div>
    </div>
  `;
}

function calculatePrice(){
  const cost=Number($("cost").value||0);
  const markup=Number($("markup").value||0);

  $("price").value=Math.round(
    cost+(cost*markup/100)
  );
}

function previewFiles(){
  const files=[...$("images").files];

  $("preview").innerHTML=files.map(file=>{
    const url=URL.createObjectURL(file);
    return `<img src="${url}" alt="">`;
  }).join("");
}

async function uploadImages(){

  const files=[...$("images").files];

  if(!files.length)
    return editImages;

  const uploaded=[...editImages];

  for(const file of files){

    const form=new FormData();
    form.append("file",file);

    const data=await api("/api/upload",{
      method:"POST",
      body:form
    });

    uploaded.push(data.key);
  }

  return uploaded;
}

async function saveProduct(){

  try{

    const name=$("name").value.trim();

    if(!name){
      message("Product name is required","error");
      return;
    }

    const images=await uploadImages();

    const body={
      category_id:$("category").value
        ?Number($("category").value)
        :null,

      name,

      description:$("description").value.trim(),

      price:Number($("price").value||0),

      sale_price:$("salePrice").value===""
        ?null
        :Number($("salePrice").value),

      stock:Number($("stock").value||0),

      image_key:images[0]||"",

      images
    };

    const id=$("productId").value;

    if(id){

      await api("/api/products/"+id,{
        method:"PUT",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      });

      message("Product updated successfully.");

    }else{

      await api("/api/products",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      });

      message("Product saved successfully.");
    }

    resetForm();
    await loadProducts();

  }catch(e){
    message(e.message,"error");
  }
}

function editProduct(id){

  const p=products.find(x=>Number(x.id)===Number(id));

  if(!p)return;

  $("formTitle").textContent="Edit Product";
  $("productId").value=p.id;
  $("name").value=p.name||"";
  $("category").value=p.category_id||"";
  $("description").value=p.description||"";
  $("price").value=p.price||0;
  $("salePrice").value=
    p.sale_price===null||
    p.sale_price===undefined
      ?""
      :p.sale_price;
  $("stock").value=
    p.stock===null||
    p.stock===undefined
      ?100
      :p.stock;

  editImages=(p.images||[])
    .map(x=>x.image_key)
    .filter(Boolean);

  $("preview").innerHTML=
    editImages.map(x=>
      `<img src="${API}/images/${encodeURIComponent(x)}">`
    ).join("");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

async function deleteProduct(id){

  if(!confirm("Delete this product?"))
    return;

  try{

    await api("/api/products/"+id,{
      method:"DELETE"
    });

    message("Product deleted.");
    await loadProducts();

  }catch(e){
    message(e.message,"error");
  }
}

function resetForm(){

  $("formTitle").textContent="Add Product";
  $("productId").value="";
  $("name").value="";
  $("category").value="";
  $("description").value="";
  $("cost").value=0;
  $("markup").value=30;
  $("price").value=0;
  $("salePrice").value="";
  $("stock").value=100;
  $("images").value="";
  $("preview").innerHTML="";
  editImages=[];
}

async function loadOrders(){

  orders=await api("/api/admin/orders");
  renderOrders();
}

function renderOrders(){

  $("orders").innerHTML=orders.length
    ?orders.map(orderRow).join("")
    :`<tr><td colspan="7">No orders found.</td></tr>`;
}

function orderRow(o){

  const status=o.status||"NEW";

  return `
    <tr>
      <td>#${o.id}</td>

      <td>
        <strong>${esc(o.customer_name||"")}</strong>
        ${
          o.remarks
          ?`<div class="small">${esc(o.remarks)}</div>`
          :""
        }
      </td>

      <td>
        ${esc(o.mobile_1||"")}
        ${
          o.mobile_2
          ?`<br>${esc(o.mobile_2)}`
          :""
        }
      </td>

      <td>
        ${esc(o.address||"")}
        <br>${esc(o.city||"")}
      </td>

      <td>
        LKR ${Number(o.total||0).toLocaleString()}
      </td>

      <td>
        ${formatDate(o.created_at)}
      </td>

      <td>
        <select
          onchange="changeOrderStatus(${o.id},this.value)"
          class="${status}">
          <option value="NEW"
            ${status==="NEW"?"selected":""}>
            NEW
          </option>

          <option value="ORDERED"
            ${status==="ORDERED"?"selected":""}>
            ORDERED
          </option>

          <option value="OUT_OF_STOCK"
            ${status==="OUT_OF_STOCK"?"selected":""}>
            OUT_OF_STOCK
          </option>
        </select>
      </td>
    </tr>
  `;
}

async function changeOrderStatus(id,status){

  try{

    await api("/api/admin/orders/"+id,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({status})
    });

    message("Order status updated.");
    await loadOrders();

  }catch(e){
    message(e.message,"error");
    await loadOrders();
  }
}

function formatDate(value){

  if(!value)return "";

  const d=new Date(
    String(value).replace(" ","T")+"Z"
  );

  if(isNaN(d))
    return esc(value);

  return d.toLocaleString();
}

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

checkLogin();
</script>

</body>
</html>
