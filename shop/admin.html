<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Shop Admin</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#102a56}
header{background:#102a56;color:#fff;padding:18px}
header h1{margin:0;font-size:21px}
header p{margin:5px 0 0;font-size:13px;opacity:.8}
.container{max-width:1100px;margin:auto;padding:18px}
.login,.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.login{max-width:430px;margin:60px auto}
.login button{width:100%;margin-top:8px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px;margin-bottom:10px}
textarea{min-height:90px}
button{border:0;border-radius:9px;padding:11px 16px;background:#d69b16;color:#fff;font-weight:bold;cursor:pointer}
.hidden{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav button{background:#fff;color:#102a56;border:1px solid #ddd}
.nav button.active{background:#102a56;color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.full{grid-column:1/-1}
.form-actions{display:flex;gap:10px}
.cancel{background:#777}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}
.product img{width:100%;height:180px;object-fit:cover;background:#eee}
.product-body{padding:14px}
.product-name{font-weight:bold;margin-bottom:7px}
.price{color:#d69b16;font-weight:bold;font-size:17px}
.stock{font-size:13px;margin-top:5px}
.product-actions{display:flex;gap:7px;margin-top:12px}
.product-actions button{flex:1;font-size:12px;padding:9px}
.delete{background:#c62828}
.order{border:1px solid #eee;border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.order-head{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:12px}
.order-id{font-size:18px;font-weight:bold}
.status{background:#eef2f7;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.field{background:#f8f9fc;padding:10px;border-radius:8px}
.field strong{display:block;font-size:10px;color:#777;margin-bottom:4px}
.field span{font-size:14px;word-break:break-word}
.total{margin-top:14px;color:#d69b16;font-size:19px;font-weight:bold}
.status-actions{display:flex;gap:10px;margin-top:12px}
.status-actions select{margin:0;flex:1}
.empty{text-align:center;padding:30px;color:#777}
.error{color:#c62828;font-size:14px;margin-top:10px}
.success{color:#16803c;font-size:14px;margin-top:10px}
.image-previews{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:5px}
.image-preview{position:relative}
.image-preview img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.remove-image{position:absolute;top:3px;right:3px;padding:2px 7px;background:#c62828;border-radius:50%}
.profit-box{background:#f8f9fc;padding:12px;border-radius:10px}
.profit-label{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-bottom:5px}
.auto-note{font-size:11px;color:#777}

@media(max-width:800px){
.products{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
.form-grid,.order-grid{grid-template-columns:1fr}
.products{grid-template-columns:1fr}
.full{grid-column:auto}
.status-actions{flex-direction:column}
.image-previews{grid-template-columns:repeat(3,1fr)}
}
</style></head><body><header>
<h1>CreateLK Shop Admin</h1>
<p>Products & Orders</p>
</header><div id="loginBox" class="login">
<h2>Admin Login</h2>
<p>Sign in with your authorized Google account.</p>
<button onclick="googleLogin()">Continue with Google</button>
<div id="loginError" class="error"></div>
</div><div id="adminPanel" class="hidden">
<div class="container"><div class="nav">
<button id="productsTab" class="active" onclick="showSection('productsSection')">Products</button>
<button id="ordersTab" onclick="showSection('ordersSection')">Orders</button>
<button onclick="logout()">Logout</button>
</div><section id="productsSection"><div class="panel"><h2 id="productFormTitle">Add Product</h2><input type="hidden" id="productId"><div class="form-grid"><div>
<label>Product Name</label>
<input id="productName" placeholder="Product name">
</div><div>
<label>Category</label>
<select id="productCategory">
<option value="">Select Category</option>
</select>
</div><div class="full">
<label>Description</label>
<textarea id="productDescription" placeholder="Product description"></textarea>
</div><div>
<label>Real / Cost Price</label>
<input type="number" id="productPrice" min="0" step="1" placeholder="1000">
</div><div class="profit-box">
<div class="profit-label">
<span>Profit Markup %</span>
<span>Default 30%</span>
</div>
<input type="number" id="profitPercent" min="0" step="1" value="30">
<div class="auto-note">Sale Price is calculated automatically.</div>
</div><div>
<label>Sale Price</label>
<input type="number" id="productSalePrice" min="0" step="1">
</div><div>
<label>Stock</label>
<input type="number" id="productStock" min="0" value="100">
</div><div class="full"><label>Product Images</label>

<input type="file"
id="productImage"
accept="image/jpeg,image/png,image/webp"
multiple>

<div style="font-size:12px;color:#777">
Select up to 5 photos. You can select more again.
</div><div id="imagePreviews" class="image-previews"></div></div></div><div class="form-actions">
<button onclick="saveProduct()">Save Product</button>
<button class="cancel" onclick="clearProductForm()">Clear</button>
</div><div id="productMessage"></div></div><div class="panel">
<h2>Products</h2>
<div id="productsList">Loading products...</div>
</div></section><section id="ordersSection" class="hidden"><div class="panel">
<h2>Customer Orders</h2>
<button onclick="loadOrders()">↻ Refresh Orders</button>
</div><div id="ordersList">Loading orders...</div></section></div>
</div><script>

const API="https://shop-api.createlk.workers.dev";

let products=[];
let selectedImages=[];

const $=id=>document.getElementById(id);


/* GOOGLE LOGIN */

function googleLogin(){
 location.href=API+"/auth/google";
}

async function checkLogin(){

 try{

  const res=await fetch(API+"/auth/me",{
   credentials:"include",
   cache:"no-store"
  });

  if(res.ok){

   showAdmin();

   await loadCategories();
   await loadProducts();

  }else{

   showLogin();

  }

 }catch(e){

  showLogin();

 }

}

function showLogin(){
 $("loginBox").classList.remove("hidden");
 $("adminPanel").classList.add("hidden");
}

function showAdmin(){
 $("loginBox").classList.add("hidden");
 $("adminPanel").classList.remove("hidden");
}

async function logout(){

 try{

  await fetch(API+"/auth/logout",{
   credentials:"include"
  });

 }finally{

  showLogin();

 }

}


/* TABS */

function showSection(section){

 $("productsSection").classList.add("hidden");
 $("ordersSection").classList.add("hidden");

 $("productsTab").classList.remove("active");
 $("ordersTab").classList.remove("active");

 $(section).classList.remove("hidden");

 if(section==="productsSection"){

  $("productsTab").classList.add("active");
  loadProducts();

 }else{

  $("ordersTab").classList.add("active");
  loadOrders();

 }

}


/* CATEGORIES */

async function loadCategories(){

 try{

  const res=await fetch(API+"/api/categories",{
   credentials:"include"
  });

  const data=await res.json();

  if(!res.ok)
   throw Error(data.error||"Unable to load categories");

  const list=Array.isArray(data)
   ?data
   :data.categories||[];

  const select=$("productCategory");

  select.innerHTML=
   '<option value="">Select Category</option>';

  list.forEach(c=>{

   const option=document.createElement("option");

   option.value=c.id;
   option.textContent=c.name;

   select.appendChild(option);

  });

 }catch(e){

  showMessage(e.message,true);

 }

}


/* PRODUCTS */

async function loadProducts(){

 const box=$("productsList");

 box.innerHTML="Loading products...";

 try{

  const res=await fetch(API+"/api/products",{
   cache:"no-store"
  });

  const data=await res.json();

  if(!res.ok)
   throw Error(data.error||"Unable to load products");

  products=
   Array.isArray(data)
    ?data
    :data.products||[];

  if(!products.length){

   box.innerHTML=
    '<div class="empty">No products yet.</div>';

   return;

  }

  box.innerHTML=
   '<div class="products">'+
   products.map(productCard).join("")+
   '</div>';

 }catch(e){

  box.innerHTML=
   '<div class="empty">'+
   escapeHtml(e.message)+
   '</div>';

 }

}


function getImages(p){

 if(Array.isArray(p.images)&&p.images.length)

  return p.images
   .map(x=>typeof x==="string"
    ?x
    :x?.image_key)
   .filter(Boolean);

 return p.image_key?[p.image_key]:[];

}


function productCard(p){

 const images=getImages(p);

 const imageHtml=images.length

  ?images.map(k=>
   `<img src="${imageUrl(k)}"
   alt="${escapeHtml(p.name)}"
   loading="lazy">`
  ).join("")

  :`<div style="height:180px;display:flex;align-items:center;justify-content:center;background:#eee;color:#888">
   No Image
   </div>`;

 const price=
  p.sale_price!==null&&
  p.sale_price!==undefined

  ?`<div class="price">
   LKR ${money(p.sale_price)}
   <del style="color:#888;font-size:12px">
   LKR ${money(p.price)}
   </del>
   </div>`

  :`<div class="price">
   LKR ${money(p.price)}
   </div>`;

 return `
 <div class="product">

  <div style="display:flex;gap:5px;overflow-x:auto;background:#eee;padding:5px">
   ${imageHtml}
  </div>

  <div class="product-body">

   <div class="product-name">
    ${escapeHtml(p.name)}
   </div>

   <div style="font-size:12px;color:#777">
    ${escapeHtml(p.category_name||"No Category")}
   </div>

   <br>

   ${price}

   <div class="stock">
    Stock: ${escapeHtml(p.stock)}
   </div>

   <div class="product-actions">

    <button onclick="editProduct(${p.id})">
     Edit
    </button>

    <button class="delete"
     onclick="deleteProduct(${p.id})">
     Delete
    </button>

   </div>

  </div>

 </div>`;
}


function imageUrl(key){
 return API+"/images/"+encodeURIComponent(key);
}


/* PROFIT */

function calculateSalePrice(){

 const price=Number($("productPrice").value);
 const percent=Number($("profitPercent").value);

 if(!Number.isFinite(price)||price<0){

  $("productSalePrice").value="";
  return;

 }

 if(!Number.isFinite(percent)||percent<0)
  return;

 $("productSalePrice").value=
  Math.round(price+(price*percent/100));

}

$("productPrice").addEventListener(
 "input",
 calculateSalePrice
);

$("profitPercent").addEventListener(
 "input",
 calculateSalePrice
);


/* IMAGES */

$("productImage").addEventListener(
 "change",
 function(){

  [...this.files].forEach(file=>{

   if(selectedImages.length>=5)return;

   if(![
    "image/jpeg",
    "image/png",
    "image/webp"
   ].includes(file.type))
    return;

   if(file.size>5*1024*1024)
    return;

   selectedImages.push(file);

  });

  this.value="";

  renderImagePreviews();

 }
);


function renderImagePreviews(){

 const box=$("imagePreviews");

 box.innerHTML="";

 selectedImages.forEach((file,i)=>{

  const div=document.createElement("div");
  div.className="image-preview";

  const img=document.createElement("img");

  img.src=URL.createObjectURL(file);

  const btn=document.createElement("button");

  btn.type="button";
  btn.className="remove-image";
  btn.textContent="×";

  btn.onclick=()=>{

   selectedImages.splice(i,1);
   renderImagePreviews();

  };

  div.append(img,btn);
  box.appendChild(div);

 });

}


/* UPLOAD */

async function uploadImage(file){

 const form=new FormData();

 form.append("file",file);

 const res=await fetch(API+"/api/upload",{
  method:"POST",
  credentials:"include",
  body:form
 });

 const data=await res.json();

 if(!res.ok)
  throw Error(data.error||"Image upload failed");

 return data.key;

}


/* SAVE PRODUCT */

async function saveProduct(){

 const id=$("productId").value;
 const name=$("productName").value.trim();
 const category=$("productCategory").value;
 const description=$("productDescription").value.trim();
 const price=$("productPrice").value;
 const salePrice=$("productSalePrice").value;
 const stock=$("productStock").value;

 if(!name)
  return showMessage(
   "Product name is required.",true
  );

 if(!category)
  return showMessage(
   "Please select a category.",true
  );

 if(price==="")
  return showMessage(
   "Price is required.",true
  );

 if(
  salePrice===""||
  Number(salePrice)<Number(price)
 )
  return showMessage(
   "Sale Price must be equal to or higher than the Real Price.",
   true
  );

 try{

  showMessage(
   selectedImages.length
    ?"Uploading images..."
    :"Saving product..."
  );

  let imageKeys=[];

  for(const file of selectedImages)
   imageKeys.push(
    await uploadImage(file)
   );

  if(id&&!imageKeys.length){

   const old=products.find(
    p=>String(p.id)===String(id)
   );

   if(old)
    imageKeys=getImages(old);

  }

  const body={

   category_id:Number(category),

   name,

   description,

   price:Number(price),

   sale_price:Number(salePrice),

   stock:Number(stock),

   image_key:imageKeys[0]||"",

   images:imageKeys

  };

  const res=await fetch(
   id
    ?API+"/api/products/"+id
    :API+"/api/products",
   {
    method:id?"PUT":"POST",
    credentials:"include",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw Error(
    data.error||"Unable to save product"
   );

  showMessage(
   id
    ?"Product updated."
    :"Product added."
  );

  clearProductForm();

  await loadProducts();

 }catch(e){

  showMessage(e.message,true);

 }

}


/* EDIT */

function editProduct(id){

 const p=products.find(
  x=>Number(x.id)===Number(id)
 );

 if(!p)return;

 selectedImages=[];

 $("productId").value=p.id;
 $("productName").value=p.name||"";
 $("productCategory").value=p.category_id||"";
 $("productDescription").value=p.description||"";
 $("productPrice").value=p.price??"";
 $("productSalePrice").value=
  p.sale_price===null
   ?""
   :p.sale_price;
 $("productStock").value=p.stock??"100";
 $("productImage").value="";
 $("imagePreviews").innerHTML="";
 $("productFormTitle").textContent="Edit Product";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* DELETE */

async function deleteProduct(id){

 if(!confirm("Delete this product?"))
  return;

 try{

  const res=await fetch(
   API+"/api/products/"+id,
   {
    method:"DELETE",
    credentials:"include"
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw Error(
    data.error||"Unable to delete product"
   );

  loadProducts();

 }catch(e){

  alert(e.message);

 }

}


/* CLEAR */

function clearProductForm(){

 selectedImages=[];

 $("productId").value="";
 $("productName").value="";
 $("productCategory").value="";
 $("productDescription").value="";
 $("productPrice").value="";
 $("profitPercent").value="30";
 $("productSalePrice").value="";
 $("productStock").value="100";
 $("productImage").value="";
 $("imagePreviews").innerHTML="";
 $("productFormTitle").textContent="Add Product";

}


/* MESSAGE */

function showMessage(message,error=false){

 const box=$("productMessage");

 box.className=
  error
   ?"error"
   :"success";

 box.textContent=message;

}


/* ORDERS */

async function loadOrders(){

 const box=$("ordersList");

 box.innerHTML="Loading orders...";

 try{

  const res=await fetch(
   API+"/api/admin/orders",
   {
    credentials:"include",
    cache:"no-store"
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw Error(
    data.error||"Unable to load orders"
   );

  if(!Array.isArray(data)||!data.length){

   box.innerHTML=
    '<div class="panel empty">No orders found.</div>';

   return;

  }

  box.innerHTML=
   data.map(orderCard).join("");

 }catch(e){

  box.innerHTML=
   '<div class="panel empty">'+
   escapeHtml(e.message)+
   '</div>';

 }

}


function orderCard(o){

 return `
 <div class="order">

  <div class="order-head">

   <div>
    <div class="order-id">
     Order #${escapeHtml(o.id)}
    </div>

    <small>
     ${escapeHtml(formatDate(o.created_at))}
    </small>
   </div>

   <div class="status">
    ${escapeHtml(o.status)}
   </div>

  </div>

  <div class="order-grid">

   <div class="field">
    <strong>CUSTOMER NAME</strong>
    <span>${escapeHtml(o.customer_name||"-")}</span>
   </div>

   <div class="field">
    <strong>MOBILE 1</strong>
    <span>${escapeHtml(o.mobile_1||"-")}</span>
   </div>

   <div class="field">
    <strong>MOBILE 2</strong>
    <span>${escapeHtml(o.mobile_2||"-")}</span>
   </div>

   <div class="field">
    <strong>CITY</strong>
    <span>${escapeHtml(o.city||"-")}</span>
   </div>

   <div class="field">
    <strong>ADDRESS</strong>
    <span>${escapeHtml(o.address||"-")}</span>
   </div>

   <div class="field">
    <strong>REMARKS</strong>
    <span>${escapeHtml(o.remarks||"-")}</span>
   </div>

  </div>

  <div class="total">
   Total: LKR ${money(o.total)}
  </div>

  <div class="status-actions">

   <select id="status-${o.id}">
    ${statusOptions(o.status)}
   </select>

   <button onclick="updateStatus(${o.id})">
    Update Status
   </button>

  </div>

 </div>`;
}


function statusOptions(current){

 return [
  "PENDING",
  "CONFIRMED",
  "PROCESSING",
  "SHIPPED",
  "DELIVERED",
  "CANCELLED"
 ].map(s=>
  `<option value="${s}"
   ${s===current?"selected":""}>
   ${s}
  </option>`
 ).join("");

}


async function updateStatus(id){

 const select=$("status-"+id);

 try{

  const res=await fetch(
   API+"/api/admin/orders/"+id,
   {
    method:"PUT",
    credentials:"include",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     status:select.value
    })
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw Error(
    data.error||"Unable to update status"
   );

  alert("Order status updated.");

  loadOrders();

 }catch(e){

  alert(e.message);

 }

}


/* HELPERS */

function money(v){
 return Number(v||0).toLocaleString("en-LK");
}

function formatDate(v){

 if(!v)return "-";

 const d=new Date(v);

 if(isNaN(d.getTime()))
  return v;

 return d.toLocaleString(
  "en-LK",
  {
   dateStyle:"medium",
   timeStyle:"short"
  }
 );
}

function escapeHtml(v){

 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* START */

checkLogin();

</script></body>
</html>
