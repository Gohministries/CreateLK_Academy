<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Marketplace Photo Maker</title>

<meta name="theme-color" content="#102a56">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#102a56;
}

header{
    background:#102a56;
    color:#fff;
    text-align:center;
    padding:21px 15px;
}

header h1{
    margin:0;
    font-size:22px;
}

header p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.85;
}

.container{
    width:min(680px,94%);
    margin:22px auto 40px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 7px 28px rgba(16,42,86,.09);
}


/* =========================
   UPLOAD
========================= */

.upload-zone{
    width:100%;
    min-height:145px;

    border:2px dashed #9caabd;
    border-radius:15px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px 15px;

    cursor:pointer;

    background:#f8faff;

    transition:.2s;
}

.upload-zone:hover,
.upload-zone.dragover{
    border-color:#102a56;
    background:#eef4fc;
}

.upload-zone input{
    display:none;
}

.upload-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#102a56;
    color:#fff;

    font-size:24px;

    margin-bottom:11px;
}

.upload-title{
    font-size:18px;
    font-weight:bold;
}

.upload-subtitle{
    margin-top:6px;
    color:#667085;
    font-size:13px;
}


/* =========================
   FORM
========================= */

.form{
    margin-top:27px;
}

.form-group{
    margin-bottom:17px;
}

.form-label{
    display:block;

    font-size:14px;
    font-weight:bold;

    margin-bottom:7px;
}

.form-input{
    width:100%;

    padding:13px 14px;

    border:1px solid #ccd4df;
    border-radius:10px;

    font-size:15px;

    color:#102a56;

    outline:none;
}

.form-input:focus{
    border-color:#102a56;
    box-shadow:0 0 0 3px rgba(16,42,86,.08);
}

.helper{
    display:block;

    margin-top:6px;

    font-size:12px;

    color:#667085;

    line-height:1.4;
}


/* =========================
   PREVIEW TITLE
========================= */

.preview-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:27px 0 10px;
}

.preview-heading h2{
    margin:0;
    font-size:18px;
}

.preview-heading span{
    color:#667085;
    font-size:12px;
}


/* =========================
   PREVIEW
========================= */

.preview{
    width:100%;

    border-radius:14px;

    overflow:hidden;

    background:#e7ebf0;

    border:1px solid #dfe4ea;
}

canvas{
    display:block;

    width:100%;
    height:auto;
}


/* =========================
   BUTTONS
========================= */

.download{
    width:100%;

    margin-top:18px;

    padding:15px;

    border:0;
    border-radius:11px;

    background:#16a34a;
    color:#fff;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 14px rgba(22,163,74,.22);
}

.download:hover{
    background:#15803d;
}

.download:disabled{
    background:#aeb8c5;
    box-shadow:none;
    cursor:not-allowed;
}

.clear{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:0;
    border-radius:11px;

    background:#e9edf3;
    color:#102a56;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.info{
    margin-top:14px;

    text-align:center;

    color:#667085;

    font-size:12px;
    line-height:1.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .container{
        width:94%;
    }

    .card{
        padding:16px;
    }

    header h1{
        font-size:20px;
    }

}

</style>
</head>

<body>


<header>

    <h1>CreateLK Marketplace Photo Maker</h1>

    <p>
        Create a professional product image for Facebook Marketplace
    </p>

</header>


<div class="container">

<div class="card">


<!-- =========================
     UPLOAD
========================= -->

<label
    class="upload-zone"
    id="uploadZone"
    for="imageInput">

    <div class="upload-icon">
        📷
    </div>

    <div class="upload-title">
        Upload Product Photo
    </div>

    <div class="upload-subtitle">
        Tap to select an image or drag and drop it here
    </div>

    <input
        type="file"
        id="imageInput"
        accept="image/*">

</label>


<!-- =========================
     FORM
========================= -->

<div class="form">


<div class="form-group">

<label
    class="form-label"
    for="shopInput">

    Shop Name

</label>

<input
    class="form-input"
    id="shopInput"
    type="text"
    value="CreateLK Shop"
    placeholder="Enter shop name">

</div>


<div class="form-group">

<label
    class="form-label"
    for="websiteInput">

    Website

</label>

<input
    class="form-input"
    id="websiteInput"
    type="text"
    value="createlk.com"
    placeholder="example.com">

</div>


<div class="form-group">

<label
    class="form-label"
    for="phoneInput">

    WhatsApp Number

</label>

<input
    class="form-input"
    id="phoneInput"
    type="text"
    value="0771190395"
    placeholder="0771190395">

<span class="helper">
    Example: 0771190395 or +94771190395
</span>

</div>


</div>


<!-- =========================
     LIVE PREVIEW
========================= -->

<div class="preview-heading">

    <h2>Live Preview</h2>

    <span>
        Updates automatically
    </span>

</div>


<div class="preview">

    <canvas id="canvas"></canvas>

</div>


<!-- =========================
     BUTTONS
========================= -->

<button
    class="download"
    id="downloadBtn"
    disabled>

    ⬇️ Download Marketplace Image

</button>


<button
    class="clear"
    id="clearBtn">

    🔄 Clear Photo

</button>


<div class="info">

    Your image is processed directly in your browser.
    Nothing is uploaded.

</div>


</div>
</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const imageInput =
    document.getElementById("imageInput");

const uploadZone =
    document.getElementById("uploadZone");

const shopInput =
    document.getElementById("shopInput");

const websiteInput =
    document.getElementById("websiteInput");

const phoneInput =
    document.getElementById("phoneInput");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const downloadBtn =
    document.getElementById("downloadBtn");

const clearBtn =
    document.getElementById("clearBtn");


let productImage = null;


/* ==================================================
   IMAGE UPLOAD
================================================== */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        loadImage(file);

    }
);


/* ==================================================
   LOAD IMAGE
================================================== */

function loadImage(file){

    if(!file.type.startsWith("image/")){

        alert(
            "Please select a valid image."
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            const img =
                new Image();


            img.onload =
                function(){

                    productImage =
                        img;

                    render();

                    downloadBtn.disabled =
                        false;

                };


            img.src =
                event.target.result;

        };


    reader.readAsDataURL(file);
}


/* ==================================================
   DRAG AND DROP
================================================== */

uploadZone.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        uploadZone.classList.add(
            "dragover"
        );

    }
);


uploadZone.addEventListener(
    "dragleave",
    function(){

        uploadZone.classList.remove(
            "dragover"
        );

    }
);


uploadZone.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        uploadZone.classList.remove(
            "dragover"
        );


        const file =
            event.dataTransfer.files[0];


        if(file){
            loadImage(file);
        }

    }
);


/* ==================================================
   RENDER
================================================== */

function render(){

    if(!productImage){
        return;
    }


    const W =
        productImage.naturalWidth;

    const H =
        productImage.naturalHeight;


    canvas.width =
        W;

    canvas.height =
        H;


    /*
       Start completely fresh.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       Original photo.
    */

    ctx.drawImage(
        productImage,
        0,
        0,
        W,
        H
    );


    /*
       Add banner.
    */

    drawBanner(
        W,
        H
    );
}


/* ==================================================
   BANNER
================================================== */

function drawBanner(W,H){

    /*
       Banner height.
    */

    const bannerH =
        Math.max(
            120,
            Math.round(W * 0.135)
        );


    const bannerY =
        H - bannerH;


    /*
       Background.
    */

    ctx.fillStyle =
        "#102a56";


    ctx.fillRect(
        0,
        bannerY,
        W,
        bannerH
    );


    /*
       SAFE HORIZONTAL PADDING
    */

    const padding =
        Math.max(
            16,
            Math.round(W * 0.025)
        );


    /*
       Split space into two
       guaranteed sections.
    */

    const leftWidth =
        Math.floor(W * 0.52);

    const rightStart =
        leftWidth;


    const rightWidth =
        W - rightStart;


    /*
       LEFT CONTENT
    */

    drawLeftContent(
        padding,
        bannerY,
        leftWidth,
        bannerH
    );


    /*
       RIGHT CONTENT
    */

    drawRightContent(
        rightStart,
        bannerY,
        rightWidth,
        bannerH
    );

}


/* ==================================================
   LEFT CONTENT
================================================== */

function drawLeftContent(
    x,
    y,
    width,
    height
){

    const shop =
        shopInput.value.trim()
        || "CreateLK Shop";


    const website =
        websiteInput.value.trim()
        || "createlk.com";


    /*
       Never allow text to reach
       the right section.
    */

    const maxWidth =
        width - x - 15;


    /*
       Shop name.
    */

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#ffffff";


    let shopFont =
        Math.max(
            18,
            Math.min(
                32,
                width * .055
            )
        );


    ctx.font =
        "bold " +
        shopFont +
        "px Arial";


    const safeShop =
        fitText(
            shop,
            maxWidth,
            shopFont
        );


    ctx.fillText(
        safeShop,
        x,
        y + height * .37
    );


    /*
       Website.
    */

    ctx.fillStyle =
        "#d8e4f2";


    let webFont =
        Math.max(
            13,
            Math.min(
                22,
                width * .037
            )
        );


    ctx.font =
        webFont +
        "px Arial";


    const safeWebsite =
        fitText(
            website,
            maxWidth,
            webFont
        );


    ctx.fillText(
        safeWebsite,
        x,
        y + height * .70
    );

}


/* ==================================================
   RIGHT CONTENT
================================================== */

function drawRightContent(
    x,
    y,
    width,
    height
){

    const number =
        phoneInput.value.trim()
        || "0771190395";


    /*
       Everything is calculated
       INSIDE this area.
    */

    const padding =
        Math.max(
            10,
            width * .07
        );


    const iconSize =
        Math.min(
            height * .50,
            width * .20
        );


    const iconX =
        x + padding + iconSize / 2;


    const iconY =
        y + height / 2;


    /*
       WhatsApp green circle.
    */

    ctx.beginPath();


    ctx.arc(
        iconX,
        iconY,
        iconSize / 2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#25D366";


    ctx.fill();


    /*
       White WhatsApp symbol.
    */

    drawWhatsAppSymbol(
        iconX,
        iconY,
        iconSize
    );


    /*
       Text begins AFTER icon.
    */

    const textX =
        iconX +
        iconSize / 2 +
        Math.max(
            7,
            width * .025
        );


    const availableWidth =
        Math.max(
            20,
            W_SAFE(
                x +
                width -
                textX -
                padding
            )
        );


    /*
       WhatsApp label.
    */

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#ffffff";


    let labelFont =
        Math.max(
            11,
            Math.min(
                18,
                width * .055
            )
        );


    ctx.font =
        "bold " +
        labelFont +
        "px Arial";


    const label =
        fitText(
            "WhatsApp",
            availableWidth,
            labelFont
        );


    ctx.fillText(
        label,
        textX,
        y + height * .37
    );


    /*
       Number.
    */

    let numberFont =
        Math.max(
            13,
            Math.min(
                21,
                width * .065
            )
        );


    ctx.font =
        "bold " +
        numberFont +
        "px Arial";


    const safeNumber =
        fitText(
            number,
            availableWidth,
            numberFont
        );


    ctx.fillText(
        safeNumber,
        textX,
        y + height * .69
    );

}


/* ==================================================
   SAFE WIDTH
================================================== */

function W_SAFE(value){

    return Math.max(
        20,
        value
    );
}


/* ==================================================
   FIT TEXT
================================================== */

function fitText(
    text,
    maxWidth,
    fontSize
){

    let result =
        String(text);


    ctx.font =
        ctx.font;


    if(
        ctx.measureText(result).width
        <= maxWidth
    ){

        return result;
    }


    while(
        result.length > 1 &&
        ctx.measureText(
            result + "..."
        ).width > maxWidth
    ){

        result =
            result.slice(
                0,
                -1
            );

    }


    return result + "...";
}


/* ==================================================
   WHATSAPP SYMBOL
================================================== */

function drawWhatsAppSymbol(
    x,
    y,
    size
){

    const bubble =
        size * .28;


    /*
       White speech bubble.
    */

    ctx.save();


    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        bubble,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
       Bubble tail.
    */

    ctx.beginPath();


    ctx.moveTo(
        x - bubble * .55,
        y + bubble * .55
    );


    ctx.lineTo(
        x - bubble * .95,
        y + bubble * .95
    );


    ctx.lineTo(
        x - bubble * .18,
        y + bubble * .63
    );


    ctx.closePath();


    ctx.fill();


    /*
       Telephone handset.
    */

    ctx.strokeStyle =
        "#25D366";


    ctx.lineWidth =
        Math.max(
            1.8,
            size * .065
        );


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        x - size * .09,
        y - size * .13
    );


    ctx.quadraticCurveTo(
        x - size * .20,
        y,
        x - size * .05,
        y + size * .13
    );


    ctx.quadraticCurveTo(
        x + size * .08,
        y + size * .23,
        x + size * .18,
        y + size * .11
    );


    ctx.stroke();


    ctx.restore();

}


/* ==================================================
   REAL-TIME UPDATE
================================================== */

shopInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


websiteInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


phoneInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


/* ==================================================
   DOWNLOAD
================================================== */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!productImage){
            return;
        }


        const link =
            document.createElement("a");


        link.download =
            "CreateLK-Marketplace-Product.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                .95
            );


        link.click();

    }
);


/* ==================================================
   CLEAR
================================================== */

clearBtn.addEventListener(
    "click",
    function(){

        productImage =
            null;


        imageInput.value =
            "";


        canvas.width =
            0;

        canvas.height =
            0;


        downloadBtn.disabled =
            true;

    }
);

</script>

</body>
</html>
