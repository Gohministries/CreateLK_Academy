<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dropin Product Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #102a56;
}

header {
    background: #102a56;
    color: white;
    padding: 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.current {
    text-align: center;
    margin-bottom: 18px;
}

.current small {
    display: block;
    color: #777;
    margin-bottom: 5px;
}

.current strong {
    font-size: 30px;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #102a56;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.go-btn {
    background: #d69b16;
    color: white;
}

.navigation {
    display: flex;
    gap: 10px;
}

.navigation button {
    flex: 1;
}

.previous {
    background: #102a56;
    color: white;
}

.next {
    background: #d69b16;
    color: white;
}

/* Open button BELOW navigation */
.open-btn {
    width: 100%;
    margin-top: 15px;
    background: #198754;
    color: white;
    padding: 15px;
}

.info {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 18px;
    line-height: 1.5;
}

.status {
    text-align: center;
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #eef3f9;
    color: #102a56;
    font-size: 14px;
}

@media (max-width: 500px) {

    .navigation {
        flex-direction: column;
    }

    .input-row {
        flex-direction: column;
    }

    .go-btn {
        width: 100%;
    }

    .container {
        margin: 15px auto;
        padding: 10px;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Dropin Product Viewer</h1>
</header>

<div class="container">

    <div class="card">

        <!-- Current Product -->
        <div class="current">
            <small>Current Product</small>
            <strong id="productNumber">11</strong>
        </div>


        <!-- Enter Product Number -->
        <div class="input-row">

            <input
                type="number"
                id="productInput"
                placeholder="Enter product number"
                min="1"
            >

            <button
                class="go-btn"
                onclick="goToProduct()">
                Go
            </button>

        </div>


        <!-- Previous / Next -->
        <div class="navigation">

            <button
                class="previous"
                onclick="previousProduct()">
                ← Previous
            </button>

            <button
                class="next"
                onclick="nextProduct()">
                Next →
            </button>

        </div>


        <!-- Open Product -->
        <button
            class="open-btn"
            onclick="openProduct()">
            Open Product
        </button>


        <!-- Status -->
        <div
            class="status"
            id="status">
            Product 11 selected
        </div>


        <!-- Information -->
        <div class="info">

            Your last product number is automatically saved.<br>

            Example:
            Enter <b>1355</b>
            → Open Dropin product 1355.

            <br><br>

            The product opens directly in your browser,
            using your existing Dropin login session.

        </div>

    </div>

</div>


<script>

/* Dropin base URL */
const BASE_URL = "https://dropin.lk/product/";


/* Starting product */
const DEFAULT_PRODUCT = 11;


/* Get saved product */
let savedProduct =
    localStorage.getItem("dropinProductNumber");


/* Use saved product or 11 */
let productNumber =
    savedProduct
        ? parseInt(savedProduct)
        : DEFAULT_PRODUCT;


/*
    Save product number
*/
function saveProduct() {

    localStorage.setItem(
        "dropinProductNumber",
        productNumber
    );

}


/*
    Update display
*/
function updateDisplay() {

    document.getElementById(
        "productNumber"
    ).textContent = productNumber;


    document.getElementById(
        "productInput"
    ).value = productNumber;


    document.getElementById(
        "status"
    ).textContent =
        "Product " + productNumber + " selected";


    saveProduct();

}


/*
    Create Dropin URL
*/
function getProductURL() {

    return BASE_URL + productNumber;

}


/*
    Open product directly
*/
function openProduct() {

    const url = getProductURL();

    /*
        Open in browser.

        This does NOT use an iframe.
        Chrome can use its existing
        Dropin login/session.
    */
    window.open(url, "_blank");

}


/*
    Next product
*/
function nextProduct() {

    productNumber++;

    updateDisplay();

    openProduct();

}


/*
    Previous product
*/
function previousProduct() {

    if (productNumber <= 1) {

        alert("Product number cannot be less than 1.");

        return;

    }

    productNumber--;

    updateDisplay();

    openProduct();

}


/*
    Go to entered product
*/
function goToProduct() {

    const input =
        document.getElementById(
            "productInput"
        );

    const value =
        parseInt(input.value);


    if (
        !value ||
        value < 1 ||
        !Number.isInteger(value)
    ) {

        alert(
            "Please enter a valid product number."
        );

        return;

    }


    productNumber = value;

    updateDisplay();

    openProduct();

}


/*
    Enter key
*/
document
    .getElementById("productInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                goToProduct();

            }

        }
    );


/*
    Load saved product
*/
updateDisplay();

</script>

</body>
</html>
