<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Marketplace Photo Maker</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f3f6fa;color:#102a56
}
header{
 background:#102a56;color:#fff;padding:16px;
 text-align:center
}
header h2{margin:0;font-size:21px}
.wrap{max-width:600px;margin:auto;padding:16px}
.card{
 background:#fff;border-radius:14px;padding:16px;
 box-shadow:0 3px 15px rgba(0,0,0,.08)
}
label{
 display:block;font-weight:bold;margin:12px 0 6px
}
input{
 width:100%;padding:12px;border:1px solid #ccd4df;
 border-radius:8px;font-size:15px
}
button{
 width:100%;padding:13px;border:0;border-radius:9px;
 background:#102a56;color:#fff;font-size:16px;
 font-weight:bold;margin-top:14px;cursor:pointer
}
button.download{background:#25D366}
.preview{
 margin-top:18px;text-align:center
}
canvas{
 width:100%;max-width:600px;
 border-radius:10px;
 background:#fff;
 box-shadow:0 2px 12px rgba(0,0,0,.15)
}
.file{
 background:#f5f7fa;
 padding:12px;border-radius:8px
}
</style>
</head>

<body>

<header>
<h2>CreateLK Marketplace Photo Maker</h2>
</header>

<div class="wrap">
<div class="card">

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">

<label>Product Name</label>
<input id="name" placeholder="Example: Men's Watch">

<label>Price (LKR)</label>
<input id="price" type="number" placeholder="2500">

<button onclick="makeImage()">Create Marketplace Photo</button>

<div class="preview">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

<button class="download" onclick="downloadImage()">
Download JPG
</button>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let productImage=null;

document.getElementById("photo").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;

 const img=new Image();
 img.onload=()=>{
  productImage=img;
  makeImage();
 };
 img.src=URL.createObjectURL(file);
});

function makeImage(){

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,1080,1080);

 if(!productImage){
  ctx.fillStyle="#102a56";
  ctx.font="bold 48px Arial";
  ctx.textAlign="center";
  ctx.fillText("Upload Product Photo",540,540);
  return;
 }

 /* Product area */
 const areaX=40,areaY=40;
 const areaW=1000,areaH=760;

 const scale=Math.min(
  areaW/productImage.width,
  areaH/productImage.height
 );

 const w=productImage.width*scale;
 const h=productImage.height*scale;

 ctx.drawImage(
  productImage,
  540-w/2,
  areaY+(areaH-h)/2,
  w,h
 );

 /* Bottom marketplace section */
 ctx.fillStyle="#102a56";
 ctx.fillRect(0,800,1080,280);

 /* Product name */
 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();

 ctx.fillStyle="#fff";
 ctx.textAlign="left";
 ctx.font="bold 42px Arial";

 let displayName=name||"Quality Product";

 if(displayName.length>28)
  displayName=displayName.substring(0,28)+"...";

 ctx.fillText(displayName,50,865);

 /* Price */
 if(price){
  ctx.fillStyle="#25D366";
  ctx.font="bold 55px Arial";
  ctx.fillText("LKR "+Number(price).toLocaleString(),50,935);
 }

 /* Website */
 ctx.fillStyle="#fff";
 ctx.font="bold 30px Arial";
 ctx.fillText("CreateLK Marketplace",50,990);

 ctx.font="25px Arial";
 ctx.fillText("createlk.com",50,1030);

 /* WhatsApp badge */
 ctx.beginPath();
 ctx.arc(970,950,58,0,Math.PI*2);
 ctx.fillStyle="#25D366";
 ctx.fill();

 drawWhatsApp(970,950,62);

 ctx.fillStyle="#fff";
 ctx.font="bold 24px Arial";
 ctx.textAlign="center";
 ctx.fillText("0771190395",970,1045);
}

function drawWhatsApp(cx,cy,size){

 const s=size/48;
 ctx.save();
 ctx.translate(cx-size/2,cy-size/2);
 ctx.scale(s,s);

 ctx.beginPath();
 ctx.arc(24,24,21,0,Math.PI*2);
 ctx.fillStyle="#fff";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(24,24,17,0,Math.PI*2);
 ctx.fillStyle="#25D366";
 ctx.fill();

 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.moveTo(31,28);
 ctx.bezierCurveTo(
 29,27,28,26,27,26
 );
 ctx.lineTo(25,28);
 ctx.bezierCurveTo(
 22,27,20,25,19,22
 );
 ctx.lineTo(21,20);
 ctx.lineTo(19,16);
 ctx.lineTo(16,16);
 ctx.bezierCurveTo(
 14,20,17,26,22,29
 );
 ctx.bezierCurveTo(
 25,31,29,31,31,29
 );
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

function downloadImage(){

 if(!productImage){
  alert("Please upload a product photo first.");
  return;
 }

 const link=document.createElement("a");
 link.download="createlk-marketplace.jpg";
 link.href=canvas.toDataURL("image/jpeg",0.95);
 link.click();
}

makeImage();
</script>

</body>
</html>
