<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Photo Maker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f7;
    color:#102a56;
}

header{
    background:#102a56;
    color:#fff;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:21px;
}

.container{
    width:min(650px,94%);
    margin:20px auto;
}

.card{
    background:#fff;
    padding:18px;
    border-radius:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.upload{
    border:2px dashed #102a56;
    border-radius:12px;
    padding:24px;
    text-align:center;
    cursor:pointer;
    margin-bottom:18px;
}

.upload input{
    display:none;
}

.upload-title{
    font-size:18px;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

.controls{
    display:grid;
    gap:12px;
    margin-bottom:18px;
}

label{
    font-size:14px;
    font-weight:bold;
}

input[type=text]{
    display:block;
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccd3dd;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

input[type=text]:focus{
    border-color:#102a56;
}

.preview{
    width:100%;
    background:#ddd;
    border-radius:12px;
    overflow:hidden;
}

canvas{
    width:100%;
    height:auto;
    display:block;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.download{
    background:#102a56;
    color:#fff;
}

.clear{
    background:#e8edf4;
    color:#102a56;
}

button:disabled{
    opacity:.45;
}

.info{
    text-align:center;
    font-size:12px;
    color:#667085;
    margin-top:14px;
}
</style>
</head>

<body>

<header>
    <h1>CreateLK Marketplace Photo Maker</h1>
</header>

<div class="container">

<div class="card">

    <label class="upload">
        <span class="upload-title">
            📷 Upload Product Photo
        </span>
        <span>
            Tap to select your product image
        </span>

        <input
            type="file"
            id="imageInput"
            accept="image/*">
    </label>


    <div class="controls">

        <div>
            <label>Shop Name</label>

            <input
                type="text"
                id="shop"
                value="CreateLK Shop">
        </div>


        <div>
            <label>Website</label>

            <input
                type="text"
                id="website"
                value="createlk.com">
        </div>


        <div>
            <label>WhatsApp</label>

            <input
                type="text"
                id="phone"
                value="0771190395">
        </div>

    </div>


    <div class="preview">

        <canvas id="canvas"></canvas>

    </div>


    <button
        id="download"
        class="download"
        disabled>

        ⬇️ Download Marketplace Image

    </button>


    <button
        id="clear"
        class="clear">

        🔄 Clear

    </button>


    <div class="info">
        The image is processed on your device.
    </div>

</div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const imageInput =
    document.getElementById("imageInput");

const shopInput =
    document.getElementById("shop");

const websiteInput =
    document.getElementById("website");

const phoneInput =
    document.getElementById("phone");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const downloadButton =
    document.getElementById("download");

const clearButton =
    document.getElementById("clear");


let productImage = null;


/* =========================================
   UPLOAD
========================================= */

imageInput.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file){
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                const img =
                    new Image();

                img.onload =
                    function(){

                        productImage = img;

                        createImage();

                        downloadButton.disabled =
                            false;
                    };

                img.src =
                    event.target.result;
            };

        reader.readAsDataURL(file);
    }
);


/* =========================================
   CREATE IMAGE
========================================= */

function createImage(){

    if(!productImage){
        return;
    }

    const W =
        productImage.naturalWidth;

    const H =
        productImage.naturalHeight;


    canvas.width = W;
    canvas.height = H;


    /*
       ALWAYS start from original image.
       This prevents duplicate overlays.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.drawImage(
        productImage,
        0,
        0,
        W,
        H
    );


    createContactBar(
        W,
        H
    );
}


/* =========================================
   CONTACT BAR
========================================= */

function createContactBar(W,H){

    /*
       One single bar.
    */

    const barHeight =
        Math.max(
            120,
            Math.round(W * 0.125)
        );


    const y =
        H - barHeight;


    /*
       Dark background
    */

    ctx.fillStyle =
        "#102a56";

    ctx.fillRect(
        0,
        y,
        W,
        barHeight
    );


    /*
       Vertical separator
    */

    const separatorX =
        Math.round(W * 0.57);

    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    ctx.fillRect(
        separatorX,
        y + barHeight * .18,
        1,
        barHeight * .64
    );


    /*
       LEFT SIDE
       Shop + website
    */

    const leftX =
        Math.round(W * 0.04);


    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";


    const shop =
        shopInput.value.trim()
        || "CreateLK Shop";


    const website =
        websiteInput.value.trim()
        || "createlk.com";


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold " +
        Math.max(22,W*0.032) +
        "px Arial";


    ctx.fillText(
        shop,
        leftX,
        y + barHeight * .37
    );


    ctx.fillStyle =
        "#dce8f5";

    ctx.font =
        Math.max(15,W*0.020) +
        "px Arial";


    ctx.fillText(
        website,
        leftX,
        y + barHeight * .70
    );


    /*
       RIGHT SIDE
       WhatsApp badge
    */

    drawWhatsAppArea(
        separatorX,
        y,
        W - separatorX,
        barHeight
    );
}


/* =========================================
   WHATSAPP AREA
========================================= */

function drawWhatsAppArea(
    x,
    y,
    width,
    height
){

    const phone =
        phoneInput.value.trim()
        || "0771190395";


    /*
       Green rounded badge
    */

    const badgeWidth =
        Math.min(
            width * .86,
            360
        );


    const badgeHeight =
        Math.min(
            height * .68,
            82
        );


    const badgeX =
        x + (width - badgeWidth) / 2;


    const badgeY =
        y + (height - badgeHeight) / 2;


    /*
       WHITE BADGE
    */

    ctx.save();

    roundRect(
        badgeX,
        badgeY,
        badgeWidth,
        badgeHeight,
        badgeHeight / 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.restore();


    /*
       REAL WHATSAPP LOGO
       drawn as SVG path style
    */

    const iconSize =
        badgeHeight * .64;


    const iconX =
        badgeX + badgeHeight * .56;


    const iconY =
        badgeY + badgeHeight / 2;


    drawWhatsAppLogo(
        iconX,
        iconY,
        iconSize
    );


    /*
       WhatsApp text + number
    */

    const textX =
        badgeX +
        badgeHeight * 1.08;


    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#128C7E";

    ctx.font =
        "bold " +
        Math.max(12,WScale(width)*.055) +
        "px Arial";


    ctx.fillText(
        "WhatsApp",
        textX,
        iconY - badgeHeight * .17
    );


    ctx.fillStyle =
        "#102a56";

    ctx.font =
        "bold " +
        Math.max(15,WScale(width)*.068) +
        "px Arial";


    ctx.fillText(
        phone,
        textX,
        iconY + badgeHeight * .19
    );
}


/* =========================================
   SCALE
========================================= */

function WScale(value){

    return Math.min(
        value / 500,
        1.2
    );
}


/* =========================================
   WHATSAPP LOGO
========================================= */

function drawWhatsAppLogo(
    x,
    y,
    size
){

    /*
       Green circular WhatsApp logo.
    */

    const r =
        size / 2;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#25D366";

    ctx.fill();


    /*
       White speech bubble
    */

    ctx.save();

    ctx.fillStyle =
        "#ffffff";


    const bubbleR =
        r * .56;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        bubbleR,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Bubble tail
    */

    ctx.beginPath();

    ctx.moveTo(
        x - bubbleR * .52,
        y + bubbleR * .55
    );

    ctx.lineTo(
        x - bubbleR * .90,
        y + bubbleR * .90
    );

    ctx.lineTo(
        x - bubbleR * .18,
        y + bubbleR * .60
    );

    ctx.closePath();

    ctx.fill();


    /*
       Telephone handset.
    */

    ctx.strokeStyle =
        "#25D366";

    ctx.lineWidth =
        Math.max(
            2,
            size * .075
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        x - size*.12,
        y - size*.18
    );

    ctx.quadraticCurveTo(
        x - size*.25,
        y - size*.03,
        x - size*.08,
        y + size*.16
    );

    ctx.quadraticCurveTo(
        x + size*.08,
        y + size*.32,
        x + size*.23,
        y + size*.14
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================
   ROUNDED RECTANGLE
========================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


/* =========================================
   LIVE TEXT UPDATE
========================================= */

shopInput.addEventListener(
    "input",
    function(){

        if(productImage){
            createImage();
        }

    }
);


websiteInput.addEventListener(
    "input",
    function(){

        if(productImage){
            createImage();
        }

    }
);


phoneInput.addEventListener(
    "input",
    function(){

        if(productImage){
            createImage();
        }

    }
);


/* =========================================
   DOWNLOAD
========================================= */

downloadButton.addEventListener(
    "click",
    function(){

        if(!productImage){
            return;
        }


        const link =
            document.createElement("a");


        link.download =
            "CreateLK-Marketplace.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                .95
            );


        link.click();
    }
);


/* =========================================
   CLEAR
========================================= */

clearButton.addEventListener(
    "click",
    function(){

        productImage = null;

        imageInput.value = "";

        canvas.width = 0;
        canvas.height = 0;

        downloadButton.disabled =
            true;
    }
);

</script>

</body>
</html>
