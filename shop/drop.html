<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dropin Product Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #102a56;
}

header {
    background: #102a56;
    color: white;
    padding: 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.current {
    text-align: center;
    margin-bottom: 18px;
}

.current small {
    display: block;
    color: #777;
    margin-bottom: 5px;
}

.current strong {
    font-size: 30px;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #102a56;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.go-btn {
    background: #d69b16;
    color: white;
}

.navigation {
    display: flex;
    gap: 10px;
}

.navigation button {
    flex: 1;
}

.previous {
    background: #102a56;
    color: white;
}

.next {
    background: #d69b16;
    color: white;
}

.open-btn {
    width: 100%;
    margin-top: 15px;
    background: #198754;
    color: white;
}

.info {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 18px;
    line-height: 1.5;
}

iframe {
    width: 100%;
    height: 75vh;
    min-height: 500px;
    border: none;
    border-radius: 10px;
    margin-top: 20px;
    background: white;
}

@media (max-width: 500px) {
    .navigation {
        flex-direction: column;
    }

    .input-row {
        flex-direction: column;
    }

    .go-btn {
        width: 100%;
    }

    iframe {
        height: 70vh;
        min-height: 450px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Dropin Product Viewer</h1>
</header>

<div class="container">

    <div class="card">

        <div class="current">
            <small>Current Product</small>
            <strong id="productNumber">11</strong>
        </div>

        <!-- Enter any product number -->
        <div class="input-row">
            <input
                type="number"
                id="productInput"
                placeholder="Enter product number"
                min="1"
            >

            <button class="go-btn" onclick="goToProduct()">
                Go
            </button>
        </div>

        <!-- Previous / Next -->
        <div class="navigation">

            <button
                class="previous"
                onclick="previousProduct()">
                ← Previous
            </button>

            <button
                class="next"
                onclick="nextProduct()">
                Next →
            </button>

        </div>

        <!-- Open product directly -->
        <button
            class="open-btn"
            onclick="openProduct()">
            Open Product
        </button>

        <div class="info">
            Your last product number is automatically saved.<br>
            Example: Enter <b>1355</b> → Dropin product 1355.
        </div>

        <!-- Product page -->
        <iframe
            id="productFrame"
            src="https://dropin.lk/product/11"
            title="Dropin Product">
        </iframe>

    </div>

</div>

<script>

const BASE_URL = "https://dropin.lk/product/";

/* Starting product */
const DEFAULT_PRODUCT = 11;

/* Load saved product number */
let productNumber = parseInt(
    localStorage.getItem("dropinProductNumber")
) || DEFAULT_PRODUCT;


/* Update page */
function updateProduct() {

    document.getElementById("productNumber").textContent =
        productNumber;

    document.getElementById("productInput").value =
        productNumber;

    document.getElementById("productFrame").src =
        BASE_URL + productNumber;

    /* Remember product */
    localStorage.setItem(
        "dropinProductNumber",
        productNumber
    );
}


/* Next product */
function nextProduct() {

    productNumber++;

    updateProduct();
}


/* Previous product */
function previousProduct() {

    if (productNumber > 1) {
        productNumber--;
        updateProduct();
    }

}


/* Go to entered product */
function goToProduct() {

    const value = parseInt(
        document.getElementById("productInput").value
    );

    if (!value || value < 1) {
        alert("Please enter a valid product number.");
        return;
    }

    productNumber = value;

    updateProduct();
}


/* Open product in a new tab */
function openProduct() {

    window.open(
        BASE_URL + productNumber,
        "_blank"
    );
}


/* Press Enter inside input */
document.getElementById("productInput").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            goToProduct();
        }

    }
);


/* Load saved product when page starts */
updateProduct();

</script>

</body>
</html>
