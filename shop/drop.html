<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Marketplace Photo Maker</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#102a56}
header{background:#102a56;color:#fff;text-align:center;padding:16px}
header h2{margin:0;font-size:20px}
.wrap{max-width:600px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:bold;margin:10px 0 5px}
input{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#102a56;color:#fff;font-size:16px;font-weight:bold;margin-top:12px}
.download{background:#25D366}
.preview{margin-top:16px}
canvas{width:100%;display:block;border-radius:10px;box-shadow:0 2px 12px #0002}
</style>
</head>

<body>

<header>
<h2>CreateLK Marketplace Photo Maker</h2>
</header>

<div class="wrap">
<div class="card">

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">

<label>Product Name</label>
<input id="name" placeholder="Product Name">

<label>Price (LKR)</label>
<input id="price" type="number" placeholder="2500">

<button onclick="makeImage()">Create Photo</button>

<div class="preview">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

<button class="download" onclick="downloadImage()">Download JPG</button>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let img=null;

document.getElementById("photo").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 const x=new Image();

 x.onload=()=>{
  img=x;
  makeImage();
 };

 x.src=URL.createObjectURL(file);
};

function makeImage(){

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,1080,1080);

 if(!img){
  ctx.fillStyle="#102a56";
  ctx.font="bold 45px Arial";
  ctx.textAlign="center";
  ctx.fillText("Upload Product Photo",540,540);
  return;
 }

 /* 1:1 crop */
 const size=Math.min(img.width,img.height);
 const sx=(img.width-size)/2;
 const sy=(img.height-size)/2;

 ctx.drawImage(
  img,
  sx,sy,size,size,
  0,0,1080,1080
 );

 /* Bottom bar */
 ctx.fillStyle="rgba(16,42,86,.95)";
 ctx.fillRect(0,920,1080,160);

 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();

 /* Product name */
 if(name){
  ctx.fillStyle="#fff";
  ctx.textAlign="left";
  ctx.font="bold 32px Arial";

  let title=name;
  if(title.length>32)
   title=title.substring(0,32)+"...";

  ctx.fillText(title,35,965);
 }

 /* Price */
 if(price){
  ctx.fillStyle="#25D366";
  ctx.font="bold 32px Arial";
  ctx.fillText(
   "LKR "+Number(price).toLocaleString(),
   35,1015
  );
 }

 /* Full-width bottom contact line */
 ctx.fillStyle="#fff";
 ctx.font="bold 25px Arial";
 ctx.textAlign="left";

 const website="createlk.com";
 const phone="0771190395";

 /* Measure everything */
 const websiteW=ctx.measureText(website).width;
 const phoneW=ctx.measureText(phone).width;
 const dotW=ctx.measureText(" • ").width;

 const badgeSize=36;
 const gap=18;

 const total=
   websiteW+
   dotW+
   badgeSize+
   gap+
   phoneW;

 let x=(1080-total)/2;

 /* Website */
 ctx.fillText(website,x,1060);
 x+=websiteW+dotW;

 /* WhatsApp */
 drawWhatsApp(x+badgeSize/2,1048,badgeSize);
 x+=badgeSize+gap;

 /* Phone */
 ctx.fillText(phone,x,1060);
}

function drawWhatsApp(cx,cy,size){

 const r=size/2;

 ctx.save();

 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.fillStyle="#25D366";
 ctx.fill();

 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(cx,cy,r*.62,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#25D366";
 ctx.beginPath();
 ctx.arc(cx,cy,r*.50,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#fff";
 ctx.lineWidth=size*.09;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.moveTo(cx-r*.18,cy-r*.20);
 ctx.quadraticCurveTo(
  cx-r*.30,cy,
  cx,cy+r*.22
 );
 ctx.quadraticCurveTo(
  cx+r*.18,cy+r*.30,
  cx+r*.25,cy+r*.08
 );
 ctx.stroke();

 ctx.restore();
}

function downloadImage(){

 if(!img){
  alert("Please upload a product photo first.");
  return;
 }

 const a=document.createElement("a");
 a.download="createlk-marketplace.jpg";
 a.href=canvas.toDataURL("image/jpeg",.95);
 a.click();
}

makeImage();
</script>

</body>
</html>
