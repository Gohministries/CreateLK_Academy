<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Marketplace Photo Maker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    color:#102a56;
}

header{
    background:#102a56;
    color:white;
    text-align:center;
    padding:18px 12px;
}

header h1{
    margin:0;
    font-size:21px;
}

.container{
    max-width:650px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.upload{
    display:block;
    border:2px dashed #102a56;
    border-radius:13px;
    padding:24px 15px;
    text-align:center;
    cursor:pointer;
    margin-bottom:18px;
}

.upload input{
    display:none;
}

.upload strong{
    display:block;
    font-size:18px;
    margin-bottom:7px;
}

.controls{
    display:grid;
    gap:12px;
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccd4df;
    border-radius:9px;
    font-size:15px;
}

.preview{
    width:100%;
    overflow:hidden;
    border-radius:12px;
    background:#e9edf2;
}

canvas{
    width:100%;
    height:auto;
    display:block;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.download{
    background:#102a56;
    color:white;
}

.clear{
    background:#e8edf4;
    color:#102a56;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.note{
    text-align:center;
    color:#667085;
    font-size:12px;
    margin-top:14px;
}
</style>
</head>

<body>

<header>
    <h1>CreateLK Marketplace Photo Maker</h1>
</header>

<div class="container">

<div class="card">

    <label class="upload">
        <strong>📷 Upload Product Photo</strong>
        <span>Select your product image</span>
        <input
            type="file"
            id="photoInput"
            accept="image/*">
    </label>

    <div class="controls">

        <div>
            <label>Shop Name</label>
            <input
                type="text"
                id="shopName"
                value="CreateLK Shop">
        </div>

        <div>
            <label>Website</label>
            <input
                type="text"
                id="website"
                value="createlk.com">
        </div>

        <div>
            <label>WhatsApp Number</label>
            <input
                type="text"
                id="whatsapp"
                value="0771190395">
        </div>

    </div>

    <div class="preview">
        <canvas id="canvas"></canvas>
    </div>

    <button
        class="download"
        id="downloadBtn"
        disabled>
        ⬇️ Download Image
    </button>

    <button
        class="clear"
        id="clearBtn">
        🔄 Clear
    </button>

    <div class="note">
        The original product photo is not changed. The contact banner is added only once.
    </div>

</div>

</div>

<script>

const photoInput =
    document.getElementById("photoInput");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const shopName =
    document.getElementById("shopName");

const website =
    document.getElementById("website");

const whatsapp =
    document.getElementById("whatsapp");

const downloadBtn =
    document.getElementById("downloadBtn");

const clearBtn =
    document.getElementById("clearBtn");

let image = null;


/* ==============================
   LOAD PHOTO
============================== */

photoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.onload = function(){

            image = img;

            render();

            downloadBtn.disabled = false;
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
});


/* ==============================
   RENDER
============================== */

function render(){

    if(!image) return;

    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBanner();
}


/* ==============================
   DRAW ONE CLEAN BANNER
============================== */

function drawBanner(){

    const W = canvas.width;
    const H = canvas.height;

    /*
       Banner size based on image size.
       Minimum sizes prevent tiny text.
    */

    const bannerH =
        Math.max(105, W * 0.115);

    const padding =
        Math.max(18, W * 0.025);

    const centerY =
        H - bannerH / 2;


    /* Background */

    ctx.fillStyle = "rgba(8,20,40,0.94)";

    ctx.fillRect(
        0,
        H - bannerH,
        W,
        bannerH
    );


    /* ==========================
       SHOP NAME
    ========================== */

    const shop =
        shopName.value.trim() || "CreateLK Shop";

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";

    ctx.font =
        `bold ${Math.max(20,W*0.028)}px Arial`;

    ctx.fillText(
        shop,
        padding,
        centerY - bannerH * 0.17
    );


    /* ==========================
       WEBSITE
    ========================== */

    const site =
        website.value.trim();

    ctx.font =
        `${Math.max(15,W*0.020)}px Arial`;

    ctx.fillStyle = "#dbe5f2";

    ctx.fillText(
        site,
        padding,
        centerY + bannerH * 0.20
    );


    /* ==========================
       WHATSAPP BADGE
    ========================== */

    const number =
        whatsapp.value.trim();

    const badgeH =
        Math.max(55, bannerH * 0.60);

    const badgeW =
        Math.max(220, W * 0.31);

    const badgeX =
        W - badgeW - padding;

    const badgeY =
        H - bannerH + (bannerH - badgeH) / 2;


    /* White rounded badge */

    ctx.save();

    roundRect(
        ctx,
        badgeX,
        badgeY,
        badgeW,
        badgeH,
        badgeH / 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();


    /* ==========================
       REAL-STYLE WHATSAPP CIRCLE
    ========================== */

    const iconSize =
        badgeH * 0.70;

    const iconCX =
        badgeX + badgeH * 0.62;

    const iconCY =
        badgeY + badgeH / 2;


    /* Green circle */

    ctx.beginPath();

    ctx.arc(
        iconCX,
        iconCY,
        iconSize / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#25D366";
    ctx.fill();


    /* White WhatsApp speech bubble */

    drawWhatsAppIcon(
        iconCX,
        iconCY,
        iconSize * 0.62
    );


    /* ==========================
       NUMBER
    ========================== */

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#102a56";

    ctx.font =
        `bold ${Math.max(16,W*0.022)}px Arial`;

    ctx.fillText(
        number,
        badgeX + badgeH * 1.15,
        iconCY
    );
}


/* ==============================
   WHATSAPP ICON
============================== */

function drawWhatsAppIcon(x,y,size){

    ctx.save();

    ctx.fillStyle = "#ffffff";

    /*
       Speech bubble
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size * 0.42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Small tail
    */

    ctx.beginPath();

    ctx.moveTo(
        x - size * 0.28,
        y + size * 0.27
    );

    ctx.lineTo(
        x - size * 0.43,
        y + size * 0.43
    );

    ctx.lineTo(
        x - size * 0.08,
        y + size * 0.30
    );

    ctx.closePath();

    ctx.fill();


    /*
       Telephone handset
    */

    ctx.strokeStyle = "#25D366";
    ctx.lineWidth = Math.max(2,size*0.11);
    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size * 0.18,
        -0.9,
        0.75
    );

    ctx.stroke();

    ctx.restore();
}


/* ==============================
   ROUNDED RECTANGLE
============================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


/* ==============================
   LIVE UPDATE
============================== */

shopName.addEventListener(
    "input",
    function(){

        if(image) render();

    }
);

website.addEventListener(
    "input",
    function(){

        if(image) render();

    }
);

whatsapp.addEventListener(
    "input",
    function(){

        if(image) render();

    }
);


/* ==============================
   DOWNLOAD
============================== */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!image) return;

        const link =
            document.createElement("a");

        link.download =
            "CreateLK-Marketplace-Product.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

    }
);


/* ==============================
   CLEAR
============================== */

clearBtn.addEventListener(
    "click",
    function(){

        image = null;

        photoInput.value = "";

        canvas.width = 0;
        canvas.height = 0;

        downloadBtn.disabled = true;

    }
);

</script>

</body>
</html>
