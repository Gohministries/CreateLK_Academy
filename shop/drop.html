<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Marketplace Photo Maker</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#102a56}
header{background:#102a56;color:#fff;text-align:center;padding:16px}
header h2{margin:0;font-size:20px}
.wrap{max-width:600px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:bold;margin:10px 0 5px}
input{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#102a56;color:#fff;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
.download{background:#25D366}
.preview{margin-top:16px}
canvas{width:100%;display:block;border-radius:10px;box-shadow:0 2px 12px #0002}
</style>
</head>

<body>

<header>
<h2>CreateLK Marketplace Photo Maker</h2>
</header>

<div class="wrap">
<div class="card">

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">

<label>Product Name</label>
<input id="name" placeholder="Product Name">

<label>Price (LKR)</label>
<input id="price" type="number" placeholder="2500">

<button onclick="makeImage()">Create Photo</button>

<div class="preview">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

<button class="download" onclick="downloadImage()">Download JPG</button>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let img=null;

document.getElementById("photo").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 const x=new Image();

 x.onload=()=>{
  img=x;
  makeImage();
 };

 x.src=URL.createObjectURL(file);
};

function makeImage(){

 ctx.clearRect(0,0,1080,1080);
 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,1080,1080);

 if(!img){
  ctx.fillStyle="#102a56";
  ctx.font="bold 45px Arial";
  ctx.textAlign="center";
  ctx.fillText("Upload Product Photo",540,540);
  return;
 }

 /* 1:1 center crop */
 const size=Math.min(img.width,img.height);
 const sx=(img.width-size)/2;
 const sy=(img.height-size)/2;

 ctx.drawImage(
  img,
  sx,sy,size,size,
  0,0,1080,1080
 );

 /* Bottom gradient */
 const gradient=ctx.createLinearGradient(0,790,0,1080);
 gradient.addColorStop(0,"rgba(0,0,0,0)");
 gradient.addColorStop(1,"rgba(0,0,0,.68)");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,790,1080,290);

 drawWhatsAppLabel();
 drawWebsite();

 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();

 /* Product name */
 if(name){
  ctx.textAlign="left";
  ctx.fillStyle="#fff";
  ctx.font="bold 36px Arial";

  let title=name;

  if(title.length>28)
   title=title.substring(0,28)+"...";

  ctx.fillText(title,35,955);
 }

 /* Price */
 if(price){
  ctx.textAlign="left";
  ctx.fillStyle="#25D366";
  ctx.font="bold 38px Arial";

  ctx.fillText(
   "LKR "+Number(price).toLocaleString(),
   35,1015
  );
 }
}

/* TOP LEFT WHATSAPP */
function drawWhatsAppLabel(){

 const x=25;
 const y=25;
 const badge=68;
 const boxW=350;
 const boxH=100;

 ctx.fillStyle="rgba(16,42,86,.95)";
 roundRect(x,y,boxW,boxH,50);
 ctx.fill();

 drawWhatsApp(x+52,y+50,badge);

 ctx.fillStyle="#fff";
 ctx.textAlign="left";
 ctx.font="bold 34px Arial";
 ctx.fillText("0771190395",x+100,y+61);
}

/* BOTTOM RIGHT WEBSITE */
function drawWebsite(){

 const text="createlk.com";
 const fontSize=34;

 ctx.font="bold "+fontSize+"px Arial";

 const textW=ctx.measureText(text).width;
 const boxW=textW+80;
 const boxH=82;

 const x=1080-boxW-25;
 const y=970;

 ctx.fillStyle="rgba(16,42,86,.95)";
 roundRect(x,y,boxW,boxH,41);
 ctx.fill();

 ctx.fillStyle="#fff";
 ctx.textAlign="center";
 ctx.font="bold "+fontSize+"px Arial";

 ctx.fillText(
  text,
  x+boxW/2,
  y+54
 );
}

function roundRect(x,y,w,h,r){

 ctx.beginPath();

 ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y);

 ctx.quadraticCurveTo(
  x+w,y,
  x+w,y+r
 );

 ctx.lineTo(x+w,y+h-r);

 ctx.quadraticCurveTo(
  x+w,y+h,
  x+w-r,y+h
 );

 ctx.lineTo(x+r,y+h);

 ctx.quadraticCurveTo(
  x,y+h,
  x,y+h-r
 );

 ctx.lineTo(x,y+r);

 ctx.quadraticCurveTo(
  x,y,
  x+r,y
 );

 ctx.closePath();
}

/* RECOGNIZABLE WHATSAPP-STYLE ICON */
function drawWhatsApp(cx,cy,size){

 const r=size/2;

 ctx.save();

 /* Green circular badge */
 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.fillStyle="#25D366";
 ctx.fill();

 /* White speech bubble */
 ctx.fillStyle="#fff";
 ctx.beginPath();

 ctx.arc(
  cx,
  cy-2,
  r*.64,
  0,
  Math.PI*2
 );

 ctx.fill();

 /* Speech bubble tail */
 ctx.beginPath();
 ctx.moveTo(cx-r*.40,cy+r*.43);
 ctx.lineTo(cx-r*.67,cy+r*.67);
 ctx.lineTo(cx-r*.25,cy+r*.56);
 ctx.closePath();
 ctx.fill();

 /* Green inner circle */
 ctx.fillStyle="#25D366";
 ctx.beginPath();

 ctx.arc(
  cx,
  cy-2,
  r*.51,
  0,
  Math.PI*2
 );

 ctx.fill();

 /* White phone receiver */
 ctx.strokeStyle="#fff";
 ctx.lineWidth=size*.105;
 ctx.lineCap="round";
 ctx.lineJoin="round";

 ctx.beginPath();

 ctx.moveTo(
  cx-r*.19,
  cy-r*.20
 );

 ctx.quadraticCurveTo(
  cx-r*.31,
  cy-r*.02,
  cx-r*.03,
  cy+r*.23
 );

 ctx.quadraticCurveTo(
  cx+r*.18,
  cy+r*.34,
  cx+r*.27,
  cy+r*.08
 );

 ctx.stroke();

 ctx.restore();
}

function downloadImage(){

 if(!img){
  alert("Please upload a product photo first.");
  return;
 }

 const a=document.createElement("a");

 a.download="createlk-marketplace.jpg";
 a.href=canvas.toDataURL("image/jpeg",.95);

 a.click();
}

makeImage();
</script>

</body>
</html>
