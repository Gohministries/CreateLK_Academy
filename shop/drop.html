<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreateLK Marketplace Photo Generator</title>

<meta name="theme-color" content="#102a56">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#102a56;
}

/* =========================
   HEADER
========================= */

header{
    background:#102a56;
    color:#fff;
    padding:22px 16px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:23px;
    font-weight:700;
}

header p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.85;
}


/* =========================
   MAIN
========================= */

.container{
    width:min(680px,94%);
    margin:24px auto 40px;
}


/* =========================
   CARD
========================= */

.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 8px 30px rgba(16,42,86,.09);
}


/* =========================
   UPLOAD AREA
========================= */

.upload-zone{
    position:relative;
    width:100%;
    min-height:150px;

    border:2px dashed #9eacc0;
    border-radius:16px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:28px 18px;

    cursor:pointer;

    background:#f8faff;

    transition:
        border-color .2s,
        background .2s,
        transform .2s;
}

.upload-zone:hover{
    border-color:#102a56;
    background:#f2f6fc;
}

.upload-zone.dragover{
    border-color:#102a56;
    background:#eaf1fb;
    transform:scale(1.01);
}

.upload-icon{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#102a56;
    color:#fff;

    font-size:25px;

    margin-bottom:12px;
}

.upload-title{
    font-size:18px;
    font-weight:700;

    margin-bottom:6px;
}

.upload-subtitle{
    color:#667085;
    font-size:13px;
    line-height:1.5;
}

.upload-zone input{
    display:none;
}


/* =========================
   FORM
========================= */

.form{
    margin-top:28px;
}

.form-group{
    margin-bottom:18px;
}

.form-label{
    display:block;

    font-size:14px;
    font-weight:700;

    margin-bottom:7px;

    color:#102a56;
}

.form-input{
    width:100%;

    padding:13px 14px;

    border:1px solid #ccd4df;
    border-radius:10px;

    background:#fff;

    color:#102a56;

    font-size:15px;

    outline:none;

    transition:border-color .2s,box-shadow .2s;
}

.form-input:focus{
    border-color:#102a56;

    box-shadow:
        0 0 0 3px rgba(16,42,86,.08);
}

.helper{
    display:block;

    margin-top:6px;

    font-size:12px;

    color:#667085;

    line-height:1.4;
}


/* =========================
   PREVIEW TITLE
========================= */

.preview-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:28px 0 10px;
}

.preview-heading h2{
    margin:0;

    font-size:18px;
}

.preview-heading span{
    font-size:12px;
    color:#667085;
}


/* =========================
   PREVIEW
========================= */

.preview-wrapper{
    width:100%;

    border-radius:14px;

    overflow:hidden;

    background:#e9edf3;

    border:1px solid #e0e5ec;
}

canvas{
    width:100%;
    height:auto;

    display:block;
}


/* =========================
   BUTTONS
========================= */

.download-btn{
    width:100%;

    margin-top:18px;

    padding:15px 18px;

    border:0;
    border-radius:11px;

    background:#16a34a;
    color:#fff;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 5px 14px rgba(22,163,74,.22);

    transition:
        transform .15s,
        background .15s;
}

.download-btn:hover{
    background:#15803d;
    transform:translateY(-1px);
}

.download-btn:active{
    transform:translateY(0);
}

.download-btn:disabled{
    background:#aeb8c5;
    box-shadow:none;
    cursor:not-allowed;
}


.clear-btn{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:0;
    border-radius:11px;

    background:#edf1f6;
    color:#102a56;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
}

.clear-btn:hover{
    background:#e2e8f0;
}


/* =========================
   INFO
========================= */

.info{
    text-align:center;

    margin-top:15px;

    color:#667085;

    font-size:12px;

    line-height:1.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .container{
        width:94%;
        margin-top:18px;
    }

    .card{
        padding:16px;
    }

    header{
        padding:19px 12px;
    }

    header h1{
        font-size:20px;
    }

    .upload-zone{
        min-height:140px;
    }

    .preview-heading h2{
        font-size:17px;
    }

}

</style>
</head>


<body>


<header>

    <h1>CreateLK Marketplace Photo Maker</h1>

    <p>
        Create a professional product image for Facebook Marketplace
    </p>

</header>


<div class="container">

<div class="card">


    <!-- =========================
         UPLOAD
    ========================== -->

    <label
        class="upload-zone"
        id="uploadZone"
        for="imageInput">

        <div class="upload-icon">
            📷
        </div>

        <div class="upload-title">
            Upload Product Photo
        </div>

        <div class="upload-subtitle">
            Tap to select an image or drag and drop it here
        </div>

        <input
            type="file"
            id="imageInput"
            accept="image/*">

    </label>


    <!-- =========================
         FORM
    ========================== -->

    <div class="form">


        <!-- SHOP -->

        <div class="form-group">

            <label
                class="form-label"
                for="shopInput">

                Shop Name

            </label>

            <input
                class="form-input"
                type="text"
                id="shopInput"
                value="CreateLK Shop"
                placeholder="Enter shop name">

        </div>


        <!-- WEBSITE -->

        <div class="form-group">

            <label
                class="form-label"
                for="websiteInput">

                Website

            </label>

            <input
                class="form-input"
                type="text"
                id="websiteInput"
                value="createlk.com"
                placeholder="example.com">

        </div>


        <!-- WHATSAPP -->

        <div class="form-group">

            <label
                class="form-label"
                for="phoneInput">

                WhatsApp Number

            </label>

            <input
                class="form-input"
                type="text"
                id="phoneInput"
                value="0771190395"
                placeholder="0771190395">

            <span class="helper">
                Enter your WhatsApp number, for example
                0771190395 or +94771190395.
            </span>

        </div>


    </div>


    <!-- =========================
         LIVE PREVIEW
    ========================== -->

    <div class="preview-heading">

        <h2>Live Preview</h2>

        <span>
            Updates automatically
        </span>

    </div>


    <div class="preview-wrapper">

        <canvas id="canvas"></canvas>

    </div>


    <!-- =========================
         DOWNLOAD
    ========================== -->

    <button
        class="download-btn"
        id="downloadBtn"
        disabled>

        ⬇️ Download Marketplace Image

    </button>


    <!-- =========================
         CLEAR
    ========================== -->

    <button
        class="clear-btn"
        id="clearBtn">

        🔄 Clear Photo

    </button>


    <div class="info">

        Your image is processed directly in your browser.
        Nothing is uploaded to a server.

    </div>


</div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const imageInput =
    document.getElementById("imageInput");

const uploadZone =
    document.getElementById("uploadZone");

const shopInput =
    document.getElementById("shopInput");

const websiteInput =
    document.getElementById("websiteInput");

const phoneInput =
    document.getElementById("phoneInput");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const downloadBtn =
    document.getElementById("downloadBtn");

const clearBtn =
    document.getElementById("clearBtn");


let productImage = null;


/* =====================================================
   UPLOAD IMAGE
===================================================== */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        loadImage(file);
    }
);


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file){

    if(!file.type.startsWith("image/")){
        alert("Please select an image file.");
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            const img =
                new Image();


            img.onload =
                function(){

                    productImage =
                        img;

                    render();

                    downloadBtn.disabled =
                        false;

                };


            img.src =
                event.target.result;
        };


    reader.readAsDataURL(file);
}


/* =====================================================
   DRAG & DROP
===================================================== */

uploadZone.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        uploadZone.classList.add(
            "dragover"
        );

    }
);


uploadZone.addEventListener(
    "dragleave",
    function(){

        uploadZone.classList.remove(
            "dragover"
        );

    }
);


uploadZone.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        uploadZone.classList.remove(
            "dragover"
        );


        const file =
            event.dataTransfer.files[0];


        if(file){

            loadImage(file);

        }

    }
);


/* =====================================================
   RENDER
===================================================== */

function render(){

    if(!productImage){
        return;
    }


    const W =
        productImage.naturalWidth;

    const H =
        productImage.naturalHeight;


    canvas.width =
        W;

    canvas.height =
        H;


    /*
       ALWAYS redraw from original image.
       This prevents duplicate overlays.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.drawImage(
        productImage,
        0,
        0,
        W,
        H
    );


    drawContactBanner(
        W,
        H
    );
}


/* =====================================================
   CONTACT BANNER
===================================================== */

function drawContactBanner(W,H){

    /*
       Responsive banner height
    */

    const bannerHeight =
        Math.max(
            120,
            Math.round(W * 0.13)
        );


    const y =
        H - bannerHeight;


    /*
       Dark blue background
    */

    ctx.fillStyle =
        "#102a56";


    ctx.fillRect(
        0,
        y,
        W,
        bannerHeight
    );


    /*
       LEFT AREA
    */

    const padding =
        Math.max(
            20,
            W * 0.035
        );


    const shop =
        shopInput.value.trim()
        || "CreateLK Shop";


    const website =
        websiteInput.value.trim()
        || "createlk.com";


    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";


    /*
       Shop
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold " +
        Math.max(
            22,
            W * 0.032
        ) +
        "px Arial";


    ctx.fillText(
        shop,
        padding,
        y + bannerHeight * .38
    );


    /*
       Website
    */

    ctx.fillStyle =
        "#d9e5f3";


    ctx.font =
        Math.max(
            15,
            W * 0.019
        ) +
        "px Arial";


    ctx.fillText(
        website,
        padding,
        y + bannerHeight * .70
    );


    /*
       Divider
    */

    const dividerX =
        W * .56;


    ctx.fillStyle =
        "rgba(255,255,255,.25)";


    ctx.fillRect(
        dividerX,
        y + bannerHeight * .20,
        1,
        bannerHeight * .60
    );


    /*
       WHATSAPP AREA
    */

    drawWhatsApp(
        dividerX,
        y,
        W - dividerX,
        bannerHeight
    );

}


/* =====================================================
   WHATSAPP BADGE
===================================================== */

function drawWhatsApp(
    areaX,
    areaY,
    areaWidth,
    areaHeight
){

    const number =
        phoneInput.value.trim()
        || "0771190395";


    /*
       Badge dimensions
    */

    const badgeHeight =
        Math.min(
            areaHeight * .68,
            82
        );


    const badgeWidth =
        Math.min(
            areaWidth * .86,
            360
        );


    const badgeX =
        areaX +
        (areaWidth - badgeWidth) / 2;


    const badgeY =
        areaY +
        (areaHeight - badgeHeight) / 2;


    /*
       WHITE BADGE
    */

    ctx.save();


    roundedRect(
        ctx,
        badgeX,
        badgeY,
        badgeWidth,
        badgeHeight,
        badgeHeight / 2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.fill();


    ctx.restore();


    /*
       GREEN WHATSAPP CIRCLE
    */

    const iconSize =
        badgeHeight * .68;


    const iconX =
        badgeX +
        badgeHeight * .58;


    const iconY =
        badgeY +
        badgeHeight / 2;


    ctx.beginPath();


    ctx.arc(
        iconX,
        iconY,
        iconSize / 2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#25D366";


    ctx.fill();


    /*
       WhatsApp white speech bubble
    */

    drawWhatsAppSymbol(
        iconX,
        iconY,
        iconSize
    );


    /*
       TEXT
    */

    const textX =
        badgeX +
        badgeHeight * 1.08;


    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";


    /*
       WhatsApp
    */

    ctx.fillStyle =
        "#128C7E";


    ctx.font =
        "bold " +
        Math.max(
            11,
            badgeHeight * .18
        ) +
        "px Arial";


    ctx.fillText(
        "WhatsApp",
        textX,
        iconY - badgeHeight * .17
    );


    /*
       Number
    */

    ctx.fillStyle =
        "#102a56";


    ctx.font =
        "bold " +
        Math.max(
            15,
            badgeHeight * .24
        ) +
        "px Arial";


    ctx.fillText(
        number,
        textX,
        iconY + badgeHeight * .19
    );

}


/* =====================================================
   WHATSAPP SYMBOL
===================================================== */

function drawWhatsAppSymbol(
    x,
    y,
    size
){

    const r =
        size * .29;


    /*
       White speech bubble
    */

    ctx.save();


    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
       Tail
    */

    ctx.beginPath();


    ctx.moveTo(
        x - r * .55,
        y + r * .55
    );


    ctx.lineTo(
        x - r * .95,
        y + r * .95
    );


    ctx.lineTo(
        x - r * .20,
        y + r * .62
    );


    ctx.closePath();


    ctx.fill();


    /*
       Phone handset
    */

    ctx.strokeStyle =
        "#25D366";


    ctx.lineWidth =
        Math.max(
            2,
            size * .075
        );


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        x - size * .10,
        y - size * .15
    );


    ctx.quadraticCurveTo(
        x - size * .24,
        y,
        x - size * .05,
        y + size * .15
    );


    ctx.quadraticCurveTo(
        x + size * .10,
        y + size * .27,
        x + size * .22,
        y + size * .12
    );


    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   ROUNDED RECTANGLE
===================================================== */

function roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    ctx.closePath();

}


/* =====================================================
   REAL-TIME PREVIEW
===================================================== */

shopInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


websiteInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


phoneInput.addEventListener(
    "input",
    function(){

        if(productImage){
            render();
        }

    }
);


/* =====================================================
   DOWNLOAD
===================================================== */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!productImage){
            return;
        }


        const link =
            document.createElement("a");


        link.download =
            "CreateLK-Marketplace-Product.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        link.click();

    }
);


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener(
    "click",
    function(){

        productImage = null;

        imageInput.value = "";


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        canvas.width = 0;
        canvas.height = 0;


        downloadBtn.disabled =
            true;

    }
);

</script>

</body>
</html>
