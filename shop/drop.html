<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Marketplace Photo Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#102a56}
header{background:#102a56;color:#fff;text-align:center;padding:16px}
header h2{margin:0;font-size:20px}
.wrap{max-width:600px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:bold;margin:10px 0 5px}
input{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#102a56;color:#fff;font-size:16px;font-weight:bold;margin-top:12px}
.download{background:#25D366}
.preview{margin-top:16px}
canvas{width:100%;display:block;border-radius:10px;box-shadow:0 2px 12px #0002}
</style>
</head>

<body>

<header>
<h2>CreateLK Marketplace Photo Maker</h2>
</header>

<div class="wrap">
<div class="card">

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">

<label>Product Name</label>
<input id="name" placeholder="Example: Men's Watch">

<label>Price (LKR)</label>
<input id="price" type="number" placeholder="2500">

<button onclick="makeImage()">Create Photo</button>

<div class="preview">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

<button class="download" onclick="downloadImage()">Download JPG</button>

</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let img=null;

document.getElementById("photo").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 const x=new Image();
 x.onload=()=>{
  img=x;
  makeImage();
 };
 x.src=URL.createObjectURL(file);
};

function makeImage(){

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,1080,1080);

 if(!img){
  ctx.fillStyle="#102a56";
  ctx.font="bold 45px Arial";
  ctx.textAlign="center";
  ctx.fillText("Upload Product Photo",540,540);
  return;
 }

 /* 1:1 crop */
 const size=Math.min(img.width,img.height);
 const sx=(img.width-size)/2;
 const sy=(img.height-size)/2;

 ctx.drawImage(
  img,
  sx,sy,size,size,
  0,0,1080,1080
 );

 /* Bottom overlay */
 ctx.fillStyle="rgba(16,42,86,.94)";
 ctx.fillRect(0,930,1080,150);

 /* Product name */
 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();

 ctx.textAlign="left";
 ctx.fillStyle="#fff";
 ctx.font="bold 34px Arial";

 let title=name||"Quality Product";
 if(title.length>30)title=title.substring(0,30)+"...";
 ctx.fillText(title,35,970);

 if(price){
  ctx.font="bold 34px Arial";
  ctx.fillText("LKR "+Number(price).toLocaleString(),35,1020);
 }

 /* Bottom brand/contact line */
 const y=1060;

 ctx.font="bold 23px Arial";
 ctx.fillStyle="#fff";
 ctx.textAlign="center";

 ctx.fillText("createlk.com",360,y);

 /* separator */
 ctx.font="bold 24px Arial";
 ctx.fillText("•",540,y);

 /* WhatsApp badge */
 drawWhatsApp(590,1040,42);

 ctx.font="bold 23px Arial";
 ctx.fillText("0771190395",780,y);
}

function drawWhatsApp(cx,cy,size){

 const r=size/2;

 ctx.save();

 /* green circle */
 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.fillStyle="#25D366";
 ctx.fill();

 /* white phone bubble */
 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(cx,cy,r*.62,0,Math.PI*2);
 ctx.fill();

 /* green inner */
 ctx.fillStyle="#25D366";
 ctx.beginPath();
 ctx.arc(cx,cy,r*.50,0,Math.PI*2);
 ctx.fill();

 /* phone shape */
 ctx.strokeStyle="#fff";
 ctx.lineWidth=size*.09;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(cx-r*.18,cy-r*.20);
 ctx.quadraticCurveTo(
  cx-r*.30,cy,
  cx,cy+r*.22
 );
 ctx.quadraticCurveTo(
  cx+r*.18,cy+r*.30,
  cx+r*.25,cy+r*.08
 );
 ctx.stroke();

 ctx.restore();
}

function downloadImage(){

 if(!img){
  alert("Please upload a product photo first.");
  return;
 }

 const a=document.createElement("a");
 a.download="createlk-marketplace.jpg";
 a.href=canvas.toDataURL("image/jpeg",.95);
 a.click();
}

makeImage();
</script>

</body>
</html>
