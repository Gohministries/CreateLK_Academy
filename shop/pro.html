<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dropin Product Navigator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #102a56;
}

header {
    background: #102a56;
    color: white;
    text-align: center;
    padding: 16px;
}

header h2 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.number-title {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 2px solid #d8deea;
    border-radius: 10px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #102a56;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.go-btn {
    background: #102a56;
    color: white;
}

.go-btn:hover {
    background: #173b76;
}

.navigation {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.nav-btn {
    flex: 1;
    background: #e9eef6;
    color: #102a56;
}

.nav-btn:hover {
    background: #dce5f2;
}

.open-btn {
    width: 100%;
    margin-top: 15px;
    background: #198754;
    color: white;
}

.open-btn:hover {
    background: #157347;
}

.info {
    margin-top: 18px;
    padding: 12px;
    background: #f0f4fa;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    color: #52627a;
}

.url-box {
    margin-top: 12px;
    padding: 10px;
    background: #fafafa;
    border: 1px solid #e1e5eb;
    border-radius: 8px;
    word-break: break-all;
    text-align: center;
    font-size: 13px;
}

@media (max-width: 480px) {
    .input-row {
        gap: 7px;
    }

    input {
        font-size: 16px;
    }

    .go-btn {
        padding-left: 15px;
        padding-right: 15px;
    }

    .navigation button {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Dropin Product Navigator</h2>
</header>

<div class="container">

    <div class="card">

        <div class="number-title">
            Enter Product Number
        </div>

        <div class="input-row">
            <input
                type="number"
                id="productNumber"
                placeholder="Example: 1355"
                min="1"
                inputmode="numeric"
            >

            <button class="go-btn" onclick="goToProduct()">
                Go
            </button>
        </div>

        <div class="navigation">

            <button class="nav-btn" onclick="previousProduct()">
                ← Previous
            </button>

            <button class="nav-btn" onclick="nextProduct()">
                Next →
            </button>

        </div>

        <button class="open-btn" onclick="openCurrentProduct()">
            Open Current Product
        </button>

        <div class="info">
            Current Product:
            <strong id="currentNumber">11</strong>
        </div>

        <div class="url-box" id="currentUrl">
            https://dropin.lk/product/11
        </div>

    </div>

</div>

<script>

const BASE_URL = "https://dropin.lk/product/";

/* Default product */
let currentProduct = parseInt(
    localStorage.getItem("dropinProductNumber")
) || 11;


/* Update screen */
function updateDisplay() {

    document.getElementById("productNumber").value = currentProduct;

    document.getElementById("currentNumber").textContent =
        currentProduct;

    document.getElementById("currentUrl").textContent =
        BASE_URL + currentProduct;

    localStorage.setItem(
        "dropinProductNumber",
        currentProduct
    );
}


/* Go to entered product */
function goToProduct() {

    const input =
        document.getElementById("productNumber");

    const number = parseInt(input.value);

    if (!number || number < 1) {
        alert("Please enter a valid product number.");
        input.focus();
        return;
    }

    currentProduct = number;

    updateDisplay();

    window.location.href =
        BASE_URL + currentProduct;
}


/* Previous product */
function previousProduct() {

    if (currentProduct > 1) {

        currentProduct--;

        updateDisplay();

        window.location.href =
            BASE_URL + currentProduct;
    }
}


/* Next product */
function nextProduct() {

    currentProduct++;

    updateDisplay();

    window.location.href =
        BASE_URL + currentProduct;
}


/* Open current product */
function openCurrentProduct() {

    updateDisplay();

    window.location.href =
        BASE_URL + currentProduct;
}


/* Press Enter inside input */
document.getElementById("productNumber")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            goToProduct();
        }

    });


/* Initial display */
updateDisplay();

</script>

</body>
</html>
