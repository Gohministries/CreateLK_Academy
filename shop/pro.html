<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreateLK Marketplace Photo Maker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#102a56;
}

header{
    background:#102a56;
    color:#fff;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:21px;
}

.container{
    max-width:600px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:#fff;
    padding:18px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.upload{
    display:block;
    border:2px dashed #102a56;
    border-radius:14px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    margin-bottom:18px;
}

.upload input{
    display:none;
}

.upload strong{
    display:block;
    font-size:18px;
    margin-bottom:8px;
}

.controls{
    display:grid;
    gap:12px;
    margin-bottom:18px;
}

label{
    font-weight:bold;
    font-size:14px;
}

input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccd4df;
    border-radius:9px;
    font-size:15px;
    margin-top:5px;
}

.preview{
    width:100%;
    background:#eee;
    border-radius:12px;
    overflow:hidden;
}

canvas{
    width:100%;
    display:block;
}

button{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.download{
    background:#102a56;
    color:white;
}

.clear{
    background:#e9edf3;
    color:#102a56;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.note{
    text-align:center;
    color:#667085;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<header>
    <h1>CreateLK Marketplace Photo Maker</h1>
</header>

<div class="container">

<div class="card">

    <label class="upload">
        <strong>📷 Upload Product Photo</strong>
        <span>Tap here to select an image</span>
        <input type="file" id="photoInput" accept="image/*">
    </label>

    <div class="controls">

        <div>
            <label>Website</label>
            <input type="text" id="website" value="createlk.com">
        </div>

        <div>
            <label>WhatsApp Number</label>
            <input type="text" id="whatsapp" value="0771190395">
        </div>

        <div>
            <label>Shop Name</label>
            <input type="text" id="shopName" value="CreateLK Shop">
        </div>

    </div>

    <div class="preview">
        <canvas id="canvas"></canvas>
    </div>

    <button class="download" id="downloadBtn" disabled>
        ⬇️ Download Image
    </button>

    <button class="clear" id="clearBtn">
        🔄 Clear
    </button>

    <div class="note">
        Image is processed directly in your browser.
    </div>

</div>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const websiteInput = document.getElementById("website");
const whatsappInput = document.getElementById("whatsapp");
const shopNameInput = document.getElementById("shopName");

const downloadBtn = document.getElementById("downloadBtn");
const clearBtn = document.getElementById("clearBtn");

let originalImage = null;


/* =========================
   UPLOAD IMAGE
========================= */

photoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            originalImage = img;

            drawImage();

            downloadBtn.disabled = false;
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
});


/* =========================
   DRAW IMAGE
========================= */

function drawImage(){

    if(!originalImage) return;

    const img = originalImage;

    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );

    addOverlay();
}


/* =========================
   OVERLAY
========================= */

function addOverlay(){

    const w = canvas.width;
    const h = canvas.height;

    /*
       Scale everything according
       to image width.
    */

    const scale = Math.max(w / 1000, 0.7);

    /*
       Bottom dark transparent bar
    */

    const barHeight = 115 * scale;

    const gradient = ctx.createLinearGradient(
        0,
        h - barHeight,
        0,
        h
    );

    gradient.addColorStop(0,"rgba(0,0,0,0)");
    gradient.addColorStop(0.35,"rgba(0,0,0,.55)");
    gradient.addColorStop(1,"rgba(0,0,0,.88)");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        h - barHeight,
        w,
        barHeight
    );


    /*
       SHOP NAME
    */

    const shopName = shopNameInput.value.trim();

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    ctx.font = `bold ${30 * scale}px Arial`;

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        shopName,
        28 * scale,
        h - 82 * scale
    );


    /*
       WEBSITE
    */

    ctx.font = `bold ${21 * scale}px Arial`;

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        "🌐 " + websiteInput.value.trim(),
        28 * scale,
        h - 45 * scale
    );


    /*
       WHATSAPP BADGE
    */

    const number = whatsappInput.value.trim();

    const badgeWidth = 260 * scale;
    const badgeHeight = 58 * scale;

    const badgeX = w - badgeWidth - 25 * scale;
    const badgeY = h - 88 * scale;

    /*
       White badge
    */

    ctx.beginPath();

    roundRect(
        ctx,
        badgeX,
        badgeY,
        badgeWidth,
        badgeHeight,
        29 * scale
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();


    /*
       WhatsApp green circle
    */

    const circleX = badgeX + 31 * scale;
    const circleY = badgeY + badgeHeight / 2;

    ctx.beginPath();

    ctx.arc(
        circleX,
        circleY,
        21 * scale,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#25D366";
    ctx.fill();


    /*
       WhatsApp telephone symbol
       styled inside green badge
    */

    ctx.save();

    ctx.fillStyle = "#ffffff";

    ctx.font = `bold ${23 * scale}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "☎",
        circleX,
        circleY + 1 * scale
    );

    ctx.restore();


    /*
       Number
    */

    ctx.textAlign = "left";

    ctx.font = `bold ${20 * scale}px Arial`;

    ctx.fillStyle = "#102a56";

    ctx.fillText(
        number,
        badgeX + 58 * scale,
        badgeY + badgeHeight / 2
    );


    /*
       Small WhatsApp label
    */

    ctx.font = `${12 * scale}px Arial`;

    ctx.fillStyle = "#555";

    ctx.fillText(
        "WhatsApp",
        badgeX + 58 * scale,
        badgeY + 17 * scale
    );
}


/* =========================
   ROUNDED RECTANGLE
========================= */

function roundRect(ctx,x,y,width,height,radius){

    ctx.beginPath();

    ctx.moveTo(x + radius,y);

    ctx.lineTo(x + width - radius,y);

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


/* =========================
   LIVE UPDATE
========================= */

websiteInput.addEventListener("input", drawImage);
whatsappInput.addEventListener("input", drawImage);
shopNameInput.addEventListener("input", drawImage);


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener("click", function(){

    if(!originalImage) return;

    const link = document.createElement("a");

    link.download = "CreateLK-Marketplace-Product.png";

    link.href = canvas.toDataURL(
        "image/png",
        1.0
    );

    link.click();
});


/* =========================
   CLEAR
========================= */

clearBtn.addEventListener("click", function(){

    originalImage = null;

    photoInput.value = "";

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.width = 0;
    canvas.height = 0;

    downloadBtn.disabled = true;
});

</script>

</body>
</html>
