<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Shop | Find Products in Sri Lanka</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6f8;
color:#222
}

button,input,textarea{
font:inherit
}

button{
cursor:pointer
}

.header{
background:#102a56;
color:#fff;
position:sticky;
top:0;
z-index:50;
box-shadow:0 2px 8px #0002
}

.header-inner,.container{
max-width:1200px;
margin:auto
}

.header-inner{
padding:10px 12px
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px
}

.brand{
display:flex;
align-items:center;
gap:7px;
color:#fff;
text-decoration:none;
font-size:16px;
font-weight:700;
white-space:nowrap
}

.logo{
width:42px;
height:42px;
aspect-ratio:1/1;
object-fit:contain;
background:#fff;
border-radius:5px;
display:block
}

.header-btn{
border:0;
background:#fff;
color:#102a56;
border-radius:5px;
padding:8px 10px;
font-size:12px;
font-weight:700
}

.search{
margin-top:9px;
display:flex;
background:#fff;
border-radius:5px;
overflow:hidden
}

.search input{
flex:1;
border:0;
outline:0;
padding:11px;
min-width:0
}

.search button{
width:45px;
border:0;
background:#f5b041;
color:#102a56
}

.container{
padding:10px
}

.hero{
background:linear-gradient(135deg,#102a56,#173d79);
color:#fff;
border-radius:7px;
padding:18px 14px;
margin-bottom:10px
}

.hero h1{
margin:0 0 5px;
font-size:22px
}

.hero p{
margin:0;
font-size:13px
}

.section-title{
font-size:17px;
font-weight:700;
margin:13px 0 8px
}

.categories{
display:flex;
gap:7px;
overflow-x:auto;
padding-bottom:4px;
scrollbar-width:none
}

.categories::-webkit-scrollbar{
display:none
}

.category{
flex:0 0 auto;
border:1px solid #ddd;
background:#fff;
border-radius:20px;
padding:7px 13px;
font-size:12px
}

.category.active{
background:#102a56;
color:#fff;
border-color:#102a56
}

.products{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px
}

.product-card{
background:#fff;
border:1px solid #e5e5e5;
border-radius:6px;
overflow:hidden
}

.product-image{
width:100%;
aspect-ratio:1/1;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.product-image img{
width:100%;
height:100%;
object-fit:contain
}

.product-info{
padding:8px
}

.product-name{
font-size:13px;
line-height:18px;
height:36px;
overflow:hidden;
margin-bottom:4px
}

.sale-price{
color:#102a56;
font-size:15px;
font-weight:700
}

.old-price{
color:#999;
text-decoration:line-through;
font-size:11px;
margin-left:4px
}

.add-cart{
width:100%;
border:0;
background:#102a56;
color:#fff;
border-radius:4px;
padding:8px 5px;
font-size:12px;
font-weight:700;
margin-top:7px
}

.add-cart:disabled{
background:#aaa
}

.empty,.loading{
grid-column:1/-1;
background:#fff;
text-align:center;
padding:30px;
color:#777;
border-radius:6px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
padding:12px;
overflow:auto
}

.modal.show{
display:block
}

.modal-box{
background:#fff;
max-width:600px;
margin:20px auto;
border-radius:8px;
overflow:hidden
}

.modal-head{
background:#102a56;
color:#fff;
padding:13px;
display:flex;
justify-content:space-between
}

.close{
border:0;
background:none;
color:#fff;
font-size:22px
}

.cart-list,
.cart-summary,
.form{
padding:10px
}

.cart-item{
display:flex;
gap:8px;
padding:8px 0;
border-bottom:1px solid #eee
}

.cart-img{
width:60px;
height:60px;
object-fit:contain;
border:1px solid #eee
}

.cart-info{
flex:1
}

.cart-name{
font-size:13px;
font-weight:600
}

.cart-price{
font-size:12px;
color:#102a56
}

.qty{
display:flex;
align-items:center;
gap:5px;
margin-top:5px
}

.qty button{
width:25px;
height:25px;
border:1px solid #ddd;
background:#f5f5f5;
border-radius:3px
}

.remove{
border:0!important;
background:none!important;
color:#d00!important;
font-size:11px
}

.total-row{
display:flex;
justify-content:space-between;
padding:4px 0;
font-size:13px
}

.total-row.final{
font-size:16px;
font-weight:700;
color:#102a56;
border-top:1px solid #ddd;
margin-top:5px;
padding-top:8px
}

.form h3{
margin:5px 0 10px;
font-size:15px
}

.form input,
.form textarea{
width:100%;
border:1px solid #ddd;
border-radius:4px;
padding:10px;
margin-bottom:8px;
outline:0
}

.form textarea{
min-height:70px
}

.checkout{
width:100%;
border:0;
background:#102a56;
color:#fff;
padding:11px;
border-radius:5px;
font-weight:700
}

.checkout:disabled{
background:#999
}

.message{
padding:10px;
font-size:12px;
text-align:center;
display:none
}

.success{
color:#087a2d;
background:#eaf8ef
}

.error{
color:#a00000;
background:#fff0f0
}

footer{
background:#102a56;
color:#fff;
margin-top:25px;
padding:22px 10px;
text-align:center
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:14px;
margin-bottom:10px
}

.footer-links a{
color:#fff;
text-decoration:none;
font-size:12px
}

footer p{
margin:0;
font-size:11px;
opacity:.75
}

@media(min-width:700px){

.products{
grid-template-columns:repeat(4,minmax(0,1fr));
gap:12px
}

.container{
padding:15px 20px
}

}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="topbar">

<a href="/shop/" class="brand">

<img
class="logo"
src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png"
alt="CreateLK Shop">

<span>CreateLK Shop</span>

</a>

<button
class="header-btn"
onclick="openCart()">

Cart (<span id="cartCount">0</span>)

</button>

</div>

<div class="search">

<input
id="searchInput"
type="search"
placeholder="Search products...">

<button onclick="loadProducts()">🔍</button>

</div>

</div>

</header>


<main class="container">

<section class="hero">

<h1>Shop Online in Sri Lanka 🇱🇰</h1>

<p>
Quality products with Cash on Delivery.
</p>

</section>


<div class="section-title">
Shop by Category
</div>


<div id="categories" class="categories">

<button
class="category active"
onclick="selectCategory(0,this)">
All
</button>

</div>


<div class="section-title">
Products
</div>


<div id="products" class="products">

<div class="loading">
Loading products...
</div>

</div>

</main>


<footer>

<div class="footer-links">

<a href="/shop/terms.html">
Terms & Conditions
</a>

<a href="/shop/privacy.html">
Privacy Policy
</a>

<a href="/shop/refund.html">
Refund & Returns
</a>

</div>

<p>
© 2026 CreateLK Shop. All rights reserved.
</p>

</footer>


<div id="cartModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<strong>
Your Cart
</strong>

<button
class="close"
onclick="closeCart()">
×
</button>

</div>


<div
id="cartList"
class="cart-list">
</div>


<div
id="cartSummary"
class="cart-summary">
</div>


<div class="form">

<h3>
Cash on Delivery
</h3>

<input
id="customerName"
placeholder="Full Name">

<input
id="district"
placeholder="District">

<input
id="city"
placeholder="City / Town">

<textarea
id="address"
placeholder="Delivery Address">
</textarea>

<input
id="mobile1"
type="tel"
placeholder="Mobile 1">

<input
id="mobile2"
type="tel"
placeholder="Mobile 2 (Optional)">


<button
id="checkoutBtn"
class="checkout"
onclick="placeOrder()">

Place COD Order

</button>

</div>


<div
id="message"
class="message">
</div>

</div>

</div>


<script>

const API="https://shop-api.createlk.workers.dev";

const DELIVERY=400;

const CART_KEY="createlk_cart";

let products=[];
let categories=[];
let cart=[];
let selectedCategory=0;


function imageKey(p){

if(p?.image_key)
return p.image_key;

if(Array.isArray(p?.images))
return p.images.find(
x=>x?.image_key
)?.image_key||"";

return "";

}


function imageUrl(key){

return key
?API+"/images/"+encodeURIComponent(key)
:"";

}


function price(p){

let sale=
Number(p?.sale_price)||0;

let normal=
Number(p?.price)||0;

return sale>0&&sale<normal
?sale
:normal;

}


function esc(v){

return String(v||"").replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


async function loadCategories(){

try{

let r=await fetch(
API+"/api/categories",
{
cache:"no-store"
}
);

if(!r.ok)
throw 0;

categories=await r.json();

let box=
document.getElementById(
"categories"
);

box.innerHTML=`

<button
class="category active"
onclick="selectCategory(0,this)">
All
</button>

`;

categories.forEach(c=>{

let b=
document.createElement("button");

b.className="category";

b.textContent=c.name;

b.onclick=()=>{

selectCategory(
Number(c.id),
b
);

};

box.appendChild(b);

});

}catch(e){

console.error(e);

}

}


function selectCategory(id,btn){

selectedCategory=id;

document
.querySelectorAll(".category")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

loadProducts();

}


async function loadProducts(){

let box=
document.getElementById(
"products"
);

box.innerHTML=
'<div class="loading">Loading products...</div>';

try{

let search=
document
.getElementById("searchInput")
.value.trim();

let url=
API+"/api/products?search="+
encodeURIComponent(search);

if(selectedCategory){

url+=
"&category="+
encodeURIComponent(
selectedCategory
);

}

let r=await fetch(
url,
{
cache:"no-store"
}
);

if(!r.ok)
throw 0;

products=await r.json();

renderProducts();

}catch(e){

box.innerHTML=
'<div class="empty">Unable to load products.</div>';

}

}


function renderProducts(){

let box=
document.getElementById(
"products"
);

if(!products.length){

box.innerHTML=
'<div class="empty">No products found.</div>';

return;

}

box.innerHTML="";


products.forEach(p=>{

let key=
imageKey(p);

let pr=
price(p);

let stock=
Number(p.stock||0);

let sale=
Number(p.sale_price)>0&&
Number(p.sale_price)<
Number(p.price);

let card=
document.createElement("div");

card.className=
"product-card";


card.innerHTML=`

<div class="product-image">

${
key
?
`<img
src="${imageUrl(key)}"
alt="${esc(p.name)}"
loading="lazy">`
:
"<span>No Image</span>"
}

</div>


<div class="product-info">

<div class="product-name">
${esc(p.name)}
</div>


<div>

<span class="sale-price">
LKR ${pr.toLocaleString()}
</span>


${
sale
?
`<span class="old-price">
LKR ${Number(p.price).toLocaleString()}
</span>`
:
""
}

</div>


<button
class="add-cart"
${stock<=0?"disabled":""}
onclick="addToCart(${p.id})">

${stock>0
?"Add to Cart"
:"Out of Stock"}

</button>

</div>

`;

box.appendChild(card);

});

}


function loadCart(){

try{

cart=
JSON.parse(
localStorage.getItem(
CART_KEY
)||"[]"
);

if(!Array.isArray(cart))
cart=[];

}catch(e){

cart=[];

}

updateCartCount();

}


function saveCart(){

localStorage.setItem(
CART_KEY,
JSON.stringify(cart)
);

updateCartCount();

}


function updateCartCount(){

document.getElementById(
"cartCount"
).textContent=
cart.reduce(
(a,x)=>a+Number(x.qty||0),
0
);

}


function addToCart(id){

let p=
products.find(
x=>Number(x.id)===Number(id)
);

if(!p||
Number(p.stock)<=0)
return;


let item=
cart.find(
x=>Number(x.id)===Number(id)
);


if(item){

if(
item.qty<
Number(p.stock)
)
item.qty++;

}else{

cart.push({

id:Number(p.id),

name:p.name,

price:price(p),

image:imageKey(p),

qty:1,

stock:Number(p.stock)

});

}


saveCart();

openCart();

}


function openCart(){

renderCart();

document
.getElementById("cartModal")
.classList.add("show");

}


function closeCart(){

document
.getElementById("cartModal")
.classList.remove("show");

}


function renderCart(){

let list=
document.getElementById(
"cartList"
);

let summary=
document.getElementById(
"cartSummary"
);


if(!cart.length){

list.innerHTML=
'<div class="empty">Your cart is empty.</div>';

summary.innerHTML="";

return;

}


list.innerHTML=
cart.map((x,i)=>`

<div class="cart-item">

${
x.image
?
`<img
class="cart-img"
src="${imageUrl(x.image)}"
alt="${esc(x.name)}">`
:
""
}


<div class="cart-info">

<div class="cart-name">
${esc(x.name)}
</div>


<div class="cart-price">
LKR ${Number(x.price).toLocaleString()}
</div>


<div class="qty">

<button
onclick="changeQty(${i},-1)">
−
</button>


<strong>
${x.qty}
</strong>


<button
onclick="changeQty(${i},1)">
+
</button>


<button
class="remove"
onclick="removeCart(${i})">
Remove
</button>

</div>

</div>

</div>

`).join("");


let subtotal=
cart.reduce(
(a,x)=>
a+
Number(x.price)*
Number(x.qty),
0
);


summary.innerHTML=`

<div class="total-row">

<span>
Subtotal
</span>

<strong>
LKR ${subtotal.toLocaleString()}
</strong>

</div>


<div class="total-row">

<span>
Delivery
</span>

<strong>
LKR ${DELIVERY.toLocaleString()}
</strong>

</div>


<div class="total-row final">

<span>
Total
</span>

<strong>
LKR ${(subtotal+DELIVERY).toLocaleString()}
</strong>

</div>

`;

}


function changeQty(i,n){

let x=cart[i];

if(!x)
return;


x.qty=
Math.max(
1,
Math.min(
Number(x.stock||999999),
x.qty+n
)
);


saveCart();

renderCart();

}


function removeCart(i){

cart.splice(i,1);

saveCart();

renderCart();

}


async function placeOrder(){

if(!cart.length)
return showMessage(
"Your cart is empty.",
true
);


let customer={

name:
document
.getElementById(
"customerName"
).value.trim(),

district:
document
.getElementById(
"district"
).value.trim(),

city:
document
.getElementById(
"city"
).value.trim(),

address:
document
.getElementById(
"address"
).value.trim(),

mobile1:
document
.getElementById(
"mobile1"
).value.trim(),

mobile2:
document
.getElementById(
"mobile2"
).value.trim()

};


if(
!customer.name||
!customer.district||
!customer.city||
!customer.address||
!customer.mobile1
){

return showMessage(
"Please complete all required fields.",
true
);

}


let btn=
document.getElementById(
"checkoutBtn"
);

btn.disabled=true;

btn.textContent=
"Processing...";


try{

let r=await fetch(
API+"/api/orders",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

customer,

items:
cart.map(x=>({

product_id:Number(x.id),

quantity:Number(x.qty)

}))

})
}
);


let data=
await r.json();


if(!r.ok)
throw new Error(
data?.error||
"Order failed."
);


cart=[];

saveCart();

renderCart();


showMessage(
"Order placed successfully. Thank you!",
false
);


document
.querySelectorAll(
".form input,.form textarea"
)
.forEach(
x=>x.value=""
);


}catch(e){

showMessage(
e.message||
"Unable to place order.",
true
);

}


btn.disabled=false;

btn.textContent=
"Place COD Order";

}


function showMessage(
text,
error
){

let box=
document.getElementById(
"message"
);

box.textContent=text;

box.className=
"message "+
(
error
?"error"
:"success"
);

box.style.display=
"block";


setTimeout(
()=>box.style.display="none",
5000
);

}


document
.getElementById(
"searchInput"
)
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
loadProducts();

}
);


async function init(){

loadCart();

await loadCategories();

await loadProducts();

}


init();

</script>

</body>
</html>
