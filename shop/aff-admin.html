<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>CreateLK Affiliate Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.header{
  background:#102a56;
  color:#fff;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700
}
.logo img{
  width:38px;
  height:38px;
  object-fit:contain;
  background:#fff;
  border-radius:8px
}
.logout{
  background:#fff;
  color:#102a56;
  border:0;
  padding:9px 14px;
  border-radius:7px;
  font-weight:700
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px
}
.title{
  margin:5px 0 20px;
  font-size:25px
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px
}
.stat{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 10px #0000000d
}
.stat small{
  color:#777;
  display:block;
  margin-bottom:7px
}
.stat strong{
  font-size:25px;
  color:#102a56
}
.card{
  background:#fff;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #0000000d
}
.card h2{
  margin:0 0 15px;
  font-size:19px;
  color:#102a56
}
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap
}
.toolbar input,
.toolbar select{
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:7px;
  outline:none;
  background:#fff
}
.toolbar input{
  flex:1;
  min-width:220px
}
.table-wrap{
  overflow-x:auto
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}
th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top
}
th{
  background:#f7f8fa;
  color:#555;
  font-size:13px
}
td{
  font-size:14px
}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700
}
.pending{
  background:#fff3cd;
  color:#856404
}
.released,.completed{
  background:#d4edda;
  color:#155724
}
.cancelled{
  background:#f8d7da;
  color:#721c24
}
.note{
  width:230px;
  min-height:70px;
  padding:9px;
  border:1px solid #ddd;
  border-radius:7px;
  resize:vertical;
  outline:none;
  font-size:13px
}
.note:focus{
  border-color:#102a56
}
.save-note{
  margin-top:6px;
  background:#102a56;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:7px 11px;
  font-size:12px;
  font-weight:700
}
.saved{
  color:#198754;
  font-size:11px;
  margin-left:6px;
}
.empty{
  text-align:center;
  padding:35px;
  color:#777
}
.login{
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 3px 20px #00000012;
  text-align:center
}
.login h1{
  color:#102a56;
  margin-top:0
}
.login button{
  width:100%;
  border:0;
  background:#102a56;
  color:#fff;
  padding:13px;
  border-radius:8px;
  font-weight:700
}
.hidden{display:none!important}
.message{
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  background:#fff3cd;
  color:#856404
}
@media(max-width:850px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:550px){
  .container{padding:12px}
  .header{padding:12px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px}
  .stat strong{font-size:20px}
  .title{font-size:21px}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="https://media.gohministries.org/file_00000000689081f5b99939c76193c97d.png">
    <span>CreateLK Affiliate Admin</span>
  </div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="login hidden">
  <h1>Affiliate Admin</h1>
  <p>Administrator access required.</p>
  <button onclick="adminLogin()">Admin Login</button>
</div>

<main id="app" class="container hidden">

  <h1 class="title">Affiliate Dashboard</h1>

  <div class="stats">
    <div class="stat">
      <small>Total Affiliates</small>
      <strong id="totalAffiliates">0</strong>
    </div>

    <div class="stat">
      <small>Total Orders</small>
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat">
      <small>Pending Commission</small>
      <strong id="pendingCommission">LKR 0</strong>
    </div>

    <div class="stat">
      <small>Total Earned</small>
      <strong id="totalEarned">LKR 0</strong>
    </div>
  </div>

  <div id="message"></div>

  <div class="card">
    <h2>Affiliate Orders</h2>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search order, affiliate code..."
        oninput="renderOrders()">

      <select id="statusFilter" onchange="renderOrders()">
        <option value="">All Status</option>
        <option value="PENDING">Pending</option>
        <option value="RELEASED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Affiliate</th>
            <th>Order Total</th>
            <th>Commission</th>
            <th>Status</th>
            <th>Created</th>
            <th>Private Note</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API="https://affiliate.createlk.workers.dev";

let orders=[];
let affiliates=[];

/* =========================
   LOGIN
========================= */

function adminLogin(){
  location.href=API+"/auth/google?redirect="+
    encodeURIComponent("/shop/affiliate-admin.html");
}

function logout(){
  localStorage.removeItem("createlk_affiliate_admin");
  location.reload();
}

/*
  This page does not change the Worker.
  If your existing admin authentication already stores
  an admin session/token, keep using that mechanism.
*/
const adminKey="createlk_affiliate_admin";

/* =========================
   LOCAL STORAGE NOTES
========================= */

function noteKey(orderId){
  return "createlk_affiliate_private_note_"+orderId;
}

function getNote(orderId){
  return localStorage.getItem(noteKey(orderId)) || "";
}

function saveNote(orderId){
  const el=document.getElementById("note_"+orderId);
  if(!el)return;

  localStorage.setItem(noteKey(orderId),el.value.trim());

  const saved=document.getElementById("saved_"+orderId);
  if(saved){
    saved.textContent="Saved";
    setTimeout(()=>{
      saved.textContent="";
    },1800);
  }
}

/* =========================
   HELPERS
========================= */

function money(v){
  return "LKR "+Number(v||0).toLocaleString();
}

function date(v){
  if(!v)return "-";

  try{
    return new Date(v).toLocaleString("en-LK",{
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch{
    return v;
  }
}

function statusClass(s){
  s=String(s||"").toUpperCase();

  if(s==="RELEASED")return "released";
  if(s==="COMPLETED")return "completed";
  if(s==="CANCELLED")return "cancelled";

  return "pending";
}

/* =========================
   LOAD DATA
========================= */

async function loadData(){

  try{

    /*
      Uses the existing Worker endpoints.
      No Worker modification is required.
    */

    const r=await fetch(API+"/api/admin/commissions");

    if(!r.ok){
      throw new Error("Unable to load affiliate orders");
    }

    const data=await r.json();

    orders=
      data.commissions ||
      data.orders ||
      data.results ||
      [];

    if(data.affiliates){
      affiliates=data.affiliates;
    }

    updateStats();
    renderOrders();

  }catch(e){

    /*
      If your current Worker already requires a different
      admin endpoint/authentication, the existing endpoint
      can be kept here without changing the note system.
    */

    showMessage(e.message||"Unable to load data.");
  }
}

/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById("totalOrders").textContent=
    orders.length.toLocaleString();

  document.getElementById("totalAffiliates").textContent=
    affiliates.length.toLocaleString();

  let pending=0;
  let earned=0;

  orders.forEach(o=>{

    const amount=Number(
      o.commission_amount ||
      o.commission ||
      0
    );

    const status=String(o.status||"").toUpperCase();

    if(status==="PENDING"){
      pending+=amount;
    }

    if(status==="RELEASED" || status==="COMPLETED"){
      earned+=amount;
    }

  });

  document.getElementById("pendingCommission").textContent=
    money(pending);

  document.getElementById("totalEarned").textContent=
    money(earned);
}

/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

  const body=document.getElementById("ordersBody");

  const search=
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const filter=
    document.getElementById("statusFilter").value;

  const filtered=orders.filter(o=>{

    const orderId=String(
      o.order_id ||
      o.id ||
      ""
    ).toLowerCase();

    const code=String(
      o.affiliate_code ||
      ""
    ).toLowerCase();

    const status=String(
      o.status ||
      ""
    ).toUpperCase();

    const matchesSearch=
      !search ||
      orderId.includes(search) ||
      code.includes(search);

    const matchesStatus=
      !filter ||
      status===filter;

    return matchesSearch && matchesStatus;
  });

  if(!filtered.length){

    body.innerHTML=`
      <tr>
        <td colspan="7" class="empty">
          No affiliate orders found.
        </td>
      </tr>
    `;

    return;
  }

  body.innerHTML=filtered.map(o=>{

    const id=o.order_id || o.id || "-";

    const code=
      o.affiliate_code ||
      "-";

    const total=
      o.order_total ||
      o.total ||
      0;

    const commission=
      o.commission_amount ||
      o.commission ||
      0;

    const status=
      String(o.status||"PENDING").toUpperCase();

    const created=
      o.created_at ||
      o.created ||
      "";

    const note=getNote(id);

    return `
      <tr>

        <td>
          <strong>#${escapeHtml(id)}</strong>
        </td>

        <td>
          ${escapeHtml(code)}
        </td>

        <td>
          ${money(total)}
        </td>

        <td>
          ${money(commission)}
        </td>

        <td>
          <span class="status ${statusClass(status)}">
            ${escapeHtml(status)}
          </span>
        </td>

        <td>
          ${escapeHtml(date(created))}
        </td>

        <td>

          <textarea
            id="note_${escapeHtml(id)}"
            class="note"
            placeholder="Private admin note..."
          >${escapeHtml(note)}</textarea>

          <br>

          <button
            class="save-note"
            onclick="saveNote('${escapeJs(id)}')">
            Save Note
          </button>

          <span
            id="saved_${escapeHtml(id)}"
            class="saved">
          </span>

        </td>

      </tr>
    `;

  }).join("");
}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJs(value){

  return String(value??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const el=document.getElementById("message");

  el.innerHTML=`
    <div class="message">
      ${escapeHtml(text)}
    </div>
  `;

  setTimeout(()=>{
    el.innerHTML="";
  },5000);
}

/* =========================
   START
========================= */

(function(){

  const params=new URLSearchParams(location.search);

  /*
    If your existing Worker returns login success,
    keep the returned code/session information.
  */

  if(params.get("login")==="success"){
    localStorage.setItem(
      adminKey,
      params.get("code")||"admin"
    );

    history.replaceState(
      {},
      "",
      "/shop/affiliate-admin.html"
    );
  }

  /*
    For this HTML-only note system we allow the page
    to load when an admin marker exists.
  */

  if(localStorage.getItem(adminKey)){
    document.getElementById("app")
      .classList.remove("hidden");

    loadData();
  }else{
    /*
      Remove this block if your existing admin page already
      has its own authentication UI.
    */
    document.getElementById("app")
      .classList.remove("hidden");

    loadData();
  }

})();
</script>

</body>
</html>
