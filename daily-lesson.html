<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Student Status - CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#2563eb;--p:#7c3aed;--g:#10b981;--d:#0f172a;--m:#64748b;--l:#e2e8f0}
body{font-family:system-ui,sans-serif;background:#f6f8fc;color:var(--d)}
header{background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
.nav,main{max-width:620px;margin:auto}
.nav{padding:11px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;color:var(--b);text-decoration:none}
.logo span{color:var(--p)}
.back{border:1px solid var(--l);background:#fff;padding:7px 10px;border-radius:8px;font-weight:700}
main{padding:12px}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,var(--b),var(--p));color:#fff;border:0}
.hero h1{font-size:20px}
.hero p{font-size:10px;margin-top:3px}
.title{font-size:13px;font-weight:800;margin-bottom:9px}
.top{display:flex;justify-content:space-between;font-size:10px}
.track{height:8px;background:#eaf0f7;border-radius:20px;margin-top:6px;overflow:hidden}
.track div{height:100%;background:linear-gradient(90deg,var(--b),var(--p));width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{border:1px solid var(--l);border-radius:9px;padding:10px;text-align:center}
.stat small{display:block;color:var(--m);font-size:7px;font-weight:800}
.stat b{font-size:12px}
.account{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{background:#f8fafc;border:1px solid var(--l);padding:8px;border-radius:8px}
.item small{display:block;color:var(--m);font-size:7px;font-weight:800}
.item b{font-size:9px;overflow-wrap:anywhere}
.premium{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:9px;padding:11px;text-align:center;font-size:10px;font-weight:700}
.payCard{border-left:4px solid var(--p)}
.payBtn{width:100%;height:42px;margin-top:9px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;font-weight:800;cursor:pointer}
.payBtn:disabled{opacity:.6}
.message{margin-top:9px;padding:9px;border-radius:8px;font-size:9px;text-align:center;font-weight:700}
.error{background:#fef2f2;color:#b91c1c}
</style>
</head>

<body>

<header>
<div class="nav">
<a class="logo" href="dashboard.html">
📚 CreateLK <span>Academy</span>
</a>

<button class="back" onclick="location.href='dashboard.html'">
← Dashboard
</button>
</div>
</header>

<main>

<section class="card hero">
<h1>🎓 Student Status</h1>
<p id="welcome">Loading...</p>
</section>

<section class="card">
<div class="title">Learning Progress</div>

<div class="top">
<span>Page <b id="page">0</b> / 100</span>
<span id="pct">0%</span>
</div>

<div class="track">
<div id="bar"></div>
</div>
</section>

<div class="stats">

<div class="stat">
<small>STUDENT ID</small>
<b id="sid">-</b>
</div>

<div class="stat">
<small>PAGES</small>
<b id="pages">0</b>
</div>

<div class="stat">
<small>MEMBERSHIP</small>
<b id="member">Free</b>
</div>

</div>

<section class="card">

<div class="title">👤 Account</div>

<div class="account">

<div class="item">
<small>NAME</small>
<b id="name">-</b>
</div>

<div class="item">
<small>EMAIL</small>
<b id="email">-</b>
</div>

<div class="item">
<small>PHONE</small>
<b id="phone">-</b>
</div>

<div class="item">
<small>PREMIUM EXPIRY</small>
<b id="expiry">Not active</b>
</div>

</div>

</section>

<div id="premiumBox"></div>

</main>

<script>

const COURSE =
"https://createlk-course-lessons.createlk.workers.dev";

const ACCOUNT =
"https://createlk-auth.createlk.workers.dev";

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev/api/checkout";

let student={};
let completed=0;

try{
student=JSON.parse(
localStorage.getItem("createlk_student")||"{}"
);
}catch(e){
student={};
}


/* =========================
STUDENT ID
========================= */

function studentId(){

return Number(
student.id||
student.database_id||
student.student_id_number||
student.student_id||
0
);

}


/* =========================
PREMIUM
========================= */

function isPremium(){

return String(
student.membership_status||
student.membershipStatus||
""
)
.trim()
.toUpperCase()==="PREMIUM";

}


/* =========================
LOAD CURRENT ACCOUNT
========================= */

async function refreshStudent(){

const id=studentId();

if(!id)return;

try{

const r=await fetch(
ACCOUNT+
"/api/student?id="+
encodeURIComponent(id),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)return;

const d=await r.json();

if(d.success&&d.student){

student={
...student,
...d.student
};

localStorage.setItem(
"createlk_student",
JSON.stringify(student)
);

}

}catch(e){

console.log(
"Account refresh failed",
e
);

}

}


/* =========================
LOAD PROGRESS
========================= */

async function loadProgress(){

const id=studentId();

try{

const r=await fetch(
COURSE+
"/api/progress?student_id="+
encodeURIComponent(id),
{
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);

const d=await r.json();

if(r.ok&&d.success){

completed=Math.min(
100,
Number(
d.completed_lessons||
d.completed||
0
)
);

if(d.membership_status){

student.membership_status=
d.membership_status;

}

}

}catch(e){

console.log(
"Progress failed",
e
);

}

}


/* =========================
DISPLAY
========================= */

function display(){

const name=
(
`${student.first_name||""} ${student.last_name||""}`
).trim()||
student.name||
"Student";

const pct=
Math.round(
completed
);

document.getElementById(
"welcome"
).textContent=
"Welcome, "+name;

document.getElementById(
"sid"
).textContent=
student.id||
student.student_id||
"-";

document.getElementById(
"name"
).textContent=
name;

document.getElementById(
"email"
).textContent=
student.email||"-";

document.getElementById(
"phone"
).textContent=
student.phone||"-";

document.getElementById(
"expiry"
).textContent=
student.membership_expiry||
student.membershipExpiry||
"Not active";

document.getElementById(
"member"
).textContent=
isPremium()?
"✓ Premium":
"Free";

document.getElementById(
"page"
).textContent=
completed;

document.getElementById(
"pages"
).textContent=
completed;

document.getElementById(
"pct"
).textContent=
pct+"%";

document.getElementById(
"bar"
).style.width=
pct+"%";


/*
Premium users:
show active status only.
*/

if(isPremium()){

document.getElementById(
"premiumBox"
).innerHTML=
`
<div class="premium">
✅ Premium membership is active.<br>
<span style="font-size:8px">
You have access to Pages 2–100.
</span>
</div>
`;

return;

}


/*
Free users:
show payment button.
*/

document.getElementById(
"premiumBox"
).innerHTML=
`
<section class="card payCard">

<div class="title">
⭐ Premium Membership
</div>

<p style="font-size:10px;color:#64748b">
Page 1 is free. Upgrade to Premium to access Pages 2–100.
</p>

<button
id="payBtn"
class="payBtn"
onclick="checkout()">

💳 Activate Premium — LKR 1,500

</button>

<div id="payMessage"></div>

</section>
`;

}


/* =========================
PAYHERE
========================= */

async function checkout(){

const id=studentId();

if(!id){

alert("Please login again.");
return;

}

const btn=
document.getElementById(
"payBtn"
);

const message=
document.getElementById(
"payMessage"
);

btn.disabled=true;
btn.textContent=
"Opening payment...";

message.innerHTML="";

try{

const r=
await fetch(
PAYMENT,
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},
body:JSON.stringify({
student_id:id
})
}
);

const text=
await r.text();

if(!r.ok){

throw new Error(
"Unable to open payment."
);

}


/*
If Worker returns
PayHere HTML form.
*/

if(
text.trim().startsWith("<form")||
text.includes("<form")
){

document.open();
document.write(text);
document.close();

return;

}


/*
If Worker returns JSON.
*/

let data;

try{

data=JSON.parse(text);

}catch(e){

throw new Error(
"Invalid payment response."
);

}

const url=
data.url||
data.checkout_url||
data.payment_url;

if(url){

location.href=url;
return;

}

throw new Error(
data.message||
"Payment link not available."
);

}catch(e){

message.innerHTML=
`
<div class="message error">
⚠️ ${e.message}
</div>
`;

btn.disabled=false;
btn.textContent=
"💳 Activate Premium — LKR 1,500";

}

}


/* =========================
START
========================= */

async function start(){

if(!studentId()){

location.href="login.html";
return;

}


/*
Refresh Cloudflare first.
This prevents old local Premium
information from being used.
*/

await refreshStudent();

await loadProgress();

display();

}

start();

</script>

</body>
</html>
