<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Payment | CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
}

.container{
max-width:520px;
margin:30px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
margin:0 0 8px;
font-size:25px;
}

.subtitle{
color:#667085;
font-size:14px;
line-height:1.6;
margin-bottom:22px;
}

.price{
background:#eef4ff;
border-radius:12px;
padding:18px;
margin-bottom:20px;
}

.price strong{
font-size:28px;
color:#155eef;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

input{
width:100%;
height:48px;
border:1px solid #d9dee8;
border-radius:9px;
padding:0 13px;
font-size:14px;
margin-bottom:16px;
outline:none;
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

input[type=file]{
height:auto;
padding:12px;
background:#fff;
}

.submit{
width:100%;
height:50px;
border:0;
border-radius:10px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

.submit:disabled{
opacity:.65;
cursor:not-allowed;
}

.message{
display:none;
margin-top:18px;
padding:13px;
border-radius:10px;
font-size:13px;
line-height:1.6;
}

.success{
display:block;
background:#f0fdf4;
border:1px solid #bbf7d0;
color:#166534;
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c;
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
}

.status{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f8fafc;
border:1px solid #eaecf0;
display:none;
}

.status strong{
display:block;
margin-bottom:5px;
}

.back{
display:inline-block;
margin-top:18px;
color:#155eef;
text-decoration:none;
font-size:14px;
font-weight:700;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>💳 Premium Membership</h1>

<p class="subtitle">
Get 30 days of CreateLK Academy Premium access.
</p>

<div class="price">

<div>Membership Price</div>

<strong>
LKR 1,500
</strong>

<div style="margin-top:5px;color:#667085;font-size:13px;">
30 Days Premium Membership
</div>

</div>


<form
id="paymentForm"
enctype="multipart/form-data">


<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your registered email"
required>


<label for="reference">
Payment Reference
</label>

<input
type="text"
id="reference"
name="payment_reference"
placeholder="Bank / PayHere transaction reference"
required>


<label for="receipt">
Payment Receipt
</label>

<input
type="file"
id="receipt"
name="receipt"
accept=".jpg,.jpeg,.png,.webp,.pdf"
required>

<div
style="font-size:12px;color:#667085;margin-top:-8px;margin-bottom:18px;">

JPG, PNG, WEBP or PDF

</div>


<button
type="submit"
id="submitButton"
class="submit">

Submit Payment

</button>

</form>


<div
id="message"
class="message">
</div>


<div
id="statusBox"
class="status">

<strong>
Payment Status
</strong>

<span id="statusText">
Checking...
</span>

</div>


<a
href="login-v2.html"
class="back">

← Back to Login

</a>

</div>

</div>


<script>

/* =========================================================
   NEW PAYMENT V2 WORKER
========================================================= */

const PAYMENT_API =
"https://YOUR-PAYMENT-V2-WORKER.workers.dev";


/*
   IMPORTANT:
   Replace the URL above with the actual workers.dev
   URL of the new Payment V2 Worker you just created.
*/


/* =========================================================
   GET LOGGED-IN STUDENT
========================================================= */

function getStudent(){

const possibleKeys = [

"student",

"studentData",

"createlk_student",

"createlk_v2_student",

"user",

"loggedInStudent"

];


for(
const key of possibleKeys
){

try{

const value =
localStorage.getItem(key);

if(!value){
continue;
}

const data =
JSON.parse(value);

if(
data &&
(
data.id ||
data.student_id
)
){

return data;

}

}catch(error){}

}


return null;

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

}


/* =========================================================
   LOAD STUDENT
========================================================= */

const student =
getStudent();


if(student){

const email =
student.email || "";

if(email){

document.getElementById(
"email"
).value =
email;

}

}


/* =========================================================
   SUBMIT PAYMENT
========================================================= */

document.getElementById(
"paymentForm"
).addEventListener(
"submit",
async function(event){

event.preventDefault();


const button =
document.getElementById(
"submitButton"
);


const email =
document.getElementById(
"email"
).value.trim();


const reference =
document.getElementById(
"reference"
).value.trim();


const receipt =
document.getElementById(
"receipt"
).files[0];


if(!student){

showMessage(
"Please login to your CreateLK Academy account before making a payment.",
"error"
);

return;

}


const studentId =
Number(
student.id ||
student.student_id
);


if(
!studentId ||
!Number.isInteger(studentId)
){

showMessage(
"Student account information is missing. Please login again.",
"error"
);

return;

}


if(!email){

showMessage(
"Please enter your email address.",
"error"
);

return;

}


if(!reference){

showMessage(
"Please enter your payment reference.",
"error"
);

return;

}


if(!receipt){

showMessage(
"Please upload your payment receipt.",
"error"
);

return;

}


/* -----------------------------------------------
   FILE SIZE
------------------------------------------------ */

if(
receipt.size >
10 * 1024 * 1024
){

showMessage(
"Receipt must be smaller than 10 MB.",
"error"
);

return;

}


/* -----------------------------------------------
   FORM DATA
------------------------------------------------ */

const formData =
new FormData();

formData.append(
"student_id",
studentId
);

formData.append(
"email",
email
);

formData.append(
"amount",
"1500"
);

formData.append(
"payment_reference",
reference
);

formData.append(
"receipt",
receipt
);


/* -----------------------------------------------
   SEND
------------------------------------------------ */

button.disabled = true;

button.textContent =
"Submitting...";


showMessage(
"Uploading your payment receipt. Please wait...",
"info"
);


try{

const response =
await fetch(
PAYMENT_API +
"/api/v2/payment",
{

method:"POST",

body:formData

}
);


let data;

try{

data =
await response.json();

}catch(error){

throw new Error(
"Invalid response from payment server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Payment submission failed."
);

}


/* -----------------------------------------------
   SUCCESS
------------------------------------------------ */

showMessage(
"✅ Payment submitted successfully. Your payment is now pending admin approval.",
"success"
);


document.getElementById(
"paymentForm"
).reset();


if(
student.email
){

document.getElementById(
"email"
).value =
student.email;

}


button.textContent =
"Payment Submitted";


loadPaymentStatus(
studentId
);


}catch(error){

console.error(
error
);

showMessage(
error.message ||
"Unable to submit payment. Please try again.",
"error"
);

button.disabled =
false;

button.textContent =
"Submit Payment";

}

});


/* =========================================================
   PAYMENT STATUS
========================================================= */

async function loadPaymentStatus(
studentId
){

try{

const response =
await fetch(
PAYMENT_API +
"/api/v2/payment-status?student_id=" +
encodeURIComponent(
studentId
)
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

return;

}


const payments =
Array.isArray(
data.payments
)
?
data.payments
:
[];


if(!payments.length){

return;

}


const latest =
payments[0];


const box =
document.getElementById(
"statusBox"
);

const text =
document.getElementById(
"statusText"
);


box.style.display =
"block";


const status =
String(
latest.status ||
"PENDING"
).toUpperCase();


if(
status === "APPROVED"
){

text.textContent =
"✅ Approved — Your Premium membership is active.";

}else if(
status === "REJECTED"
){

text.textContent =
"❌ Rejected — Please contact CreateLK Academy.";

}else{

text.textContent =
"⏳ Pending — Your payment is waiting for admin approval.";

}

}


/* =========================================================
   INITIAL STATUS
========================================================= */

if(student){

const studentId =
Number(
student.id ||
student.student_id
);

if(studentId){

loadPaymentStatus(
studentId
);

}

}

</script>

</body>
</html>
