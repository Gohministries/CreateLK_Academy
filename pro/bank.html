<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Pro — Admin</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font:14px Arial;
color:#171923;
background:#f6f4ff
}

button,input,select,textarea{
font:inherit
}

button{
border:0;
cursor:pointer
}

header{
position:sticky;
top:0;
z-index:20;
background:#ffffffee;
backdrop-filter:blur(12px);
border-bottom:1px solid #e7e2f5
}

nav{
max-width:1200px;
margin:auto;
padding:12px 18px;
display:flex;
align-items:center;
gap:10px
}

.logo{
font-size:20px;
font-weight:900;
margin-right:auto
}

.logo span{
color:#8b5cf6
}

.btn{
height:40px;
padding:0 14px;
border-radius:9px;
font-weight:800;
background:#635bff;
color:#fff
}

.light{
background:#eeebff;
color:#5b4bdc
}

.danger{
background:#ffe9e9;
color:#b42318
}

main{
max-width:1200px;
margin:auto;
padding:22px 18px 60px
}

h1{
margin:0 0 18px
}

.tabs{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-bottom:18px
}

.tab{
padding:10px 14px;
border-radius:9px;
background:#fff;
border:1px solid #ddd9ed;
font-weight:800
}

.tab.active{
background:#635bff;
color:#fff
}

.panel{
display:none;
background:#fff;
border:1px solid #e4e0ed;
border-radius:16px;
padding:18px;
box-shadow:0 7px 25px #4c3a7b0b
}

.panel.active{
display:block
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px
}

.field{
margin-bottom:12px
}

label{
display:block;
font-weight:800;
margin-bottom:6px
}

input,
select,
textarea{
width:100%;
padding:11px;
border:1px solid #ddd9ed;
border-radius:9px;
outline:0
}

textarea{
min-height:130px;
resize:vertical
}

input:focus,
select:focus,
textarea:focus{
border-color:#8b5cf6;
box-shadow:0 0 0 3px #8b5cf622
}

.table-wrap{
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:700px
}

th,
td{
padding:11px;
border-bottom:1px solid #eee;
text-align:left
}

th{
background:#f7f5ff
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:800
}

.pending{
background:#fff4d6;
color:#956800
}

.approved{
background:#e7f8ed;
color:#18743b
}

.rejected{
background:#ffe9e9;
color:#b42318
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.msg{
margin-top:12px;
padding:11px;
border-radius:9px;
display:none
}

.msg.ok{
display:block;
background:#eafaf0;
color:#18743b
}

.msg.err{
display:block;
background:#fff0f0;
color:#b42318
}

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.login-box{
width:100%;
max-width:420px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 15px 45px #39246b18;
text-align:center
}

.login-box h1{
margin-bottom:8px
}

.login-box p{
color:#777;
line-height:1.6
}

.user{
display:flex;
align-items:center;
gap:8px
}

.user img{
width:34px;
height:34px;
border-radius:50%
}

.card{
border:1px solid #e8e4ef;
border-radius:12px;
padding:14px;
margin-bottom:10px
}

.card-title{
font-weight:900;
margin-bottom:5px
}

.small{
font-size:12px;
color:#777
}

@media(max-width:600px){

nav{
padding:9px 10px
}

main{
padding:16px 10px 45px
}

.logo{
font-size:17px
}

}

</style>

</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div id="login">

<div class="login-box">

<h1>✨ CreateLK Pro</h1>

<p>
Admin dashboard
</p>

<button
class="btn"
onclick="login()"
>
Continue with Google
</button>

<div
id="loginMsg"
class="msg"
></div>

</div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="app" style="display:none">

<header>

<nav>

<div class="logo">
Create<span>LK</span> Pro
</div>

<div
id="user"
class="user"
></div>

<button
class="btn danger"
onclick="logout()"
>
Logout
</button>

</nav>

</header>


<main>

<h1>Admin Dashboard</h1>


<div class="tabs">

<button
class="tab active"
onclick="tab('deposits',this)"
>
💎 Deposits
</button>

<button
class="tab"
onclick="tab('prompts',this)"
>
✨ Prompts
</button>

<button
class="tab"
onclick="tab('categories',this)"
>
📁 Categories
</button>

<button
class="tab"
onclick="tab('packages',this)"
>
📦 Packages
</button>

</div>


<!-- =========================
     DEPOSITS
========================= -->

<section
id="deposits"
class="panel active"
>

<h2>💎 Deposits</h2>

<div
id="depositMsg"
class="msg"
></div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>ID</th>
<th>User</th>
<th>Email</th>
<th>Amount</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="depositList"></tbody>

</table>

</div>

</section>


<!-- =========================
     PROMPTS
========================= -->

<section
id="prompts"
class="panel"
>

<h2>✨ Add Prompt</h2>

<div class="grid">

<div class="field">

<label>Title</label>

<input
id="promptTitle"
placeholder="Prompt title"
>

</div>

<div class="field">

<label>Category</label>

<select id="promptCategory">

<option value="">
Select category
</option>

</select>

</div>

</div>

<div class="field">

<label>Description</label>

<textarea
id="promptDescription"
placeholder="Description"
></textarea>

</div>

<div class="field">

<label>Prompt</label>

<textarea
id="promptText"
placeholder="Prompt text"
></textarea>

</div>

<div class="field">

<label>Image</label>

<input
id="promptImage"
type="file"
accept="image/png,image/jpeg,image/webp"
>

</div>

<button
class="btn"
onclick="addPrompt()"
>
Add Prompt
</button>

<div
id="promptMsg"
class="msg"
></div>

<hr>

<h2>Existing Prompts</h2>

<div id="promptList"></div>

</section>


<!-- =========================
     CATEGORIES
========================= -->

<section
id="categories"
class="panel"
>

<h2>📁 Categories</h2>

<div class="grid">

<div class="field">

<label>Category Name</label>

<input
id="categoryName"
placeholder="Category name"
>

</div>

</div>

<button
class="btn"
onclick="addCategory()"
>
Add Category
</button>

<div
id="categoryMsg"
class="msg"
></div>

<div id="categoryList"></div>

</section>


<!-- =========================
     PACKAGES
========================= -->

<section
id="packages"
class="panel"
>

<h2>📦 Add Package</h2>

<div class="grid">

<div class="field">

<label>Name</label>

<input
id="packageName"
placeholder="Example: 500 Coins"
>

</div>

<div class="field">

<label>Credits</label>

<input
id="packageCredits"
type="number"
min="100"
placeholder="500"
>

</div>

<div class="field">

<label>Bonus</label>

<input
id="packageBonus"
type="number"
min="0"
value="0"
>

</div>

</div>

<div class="field">

<label>

<input
id="packagePopular"
type="checkbox"
style="width:auto"
>

 Popular

</label>

<label>

<input
id="packageActive"
type="checkbox"
checked
style="width:auto"
>

 Active

</label>

</div>

<button
class="btn"
onclick="addPackage()"
>
Add Package
</button>

<div
id="packageMsg"
class="msg"
></div>

<hr>

<h2>Existing Packages</h2>

<div
id="packageList"
></div>

</section>


</main>

</div>


<script>


/* =========================
   API
========================= */

const ADMIN_API =
"https://pro-admin.createlk.workers.dev";

const APPROVE_API =
"https://pro-approve.createlk.workers.dev";


/* =========================
   HELPERS
========================= */

const $ =
id => document.getElementById(id);


async function api(
 base,
 path,
 options={}
){

const r =
await fetch(
 base + path,
 {
  credentials:"include",
  ...options
 }
);

const d =
await r.json().catch(
 () => ({})
);

if(!r.ok){

throw Error(
 d.error ||
 d.message ||
 "Request failed"
);

}

return d;

}


/* =========================
   LOGIN
========================= */

function login(){

location.href =
ADMIN_API +
"/auth/google";

}


function logout(){

location.href =
ADMIN_API +
"/auth/logout";

}


/* =========================
   CHECK LOGIN
========================= */

async function loadMe(){

try{

const d =
await api(
 ADMIN_API,
 "/api/me"
);

if(!d.user){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

$("login").style.display="none";
$("app").style.display="block";

$("user").innerHTML = `

${
 d.user.photo_url
 ? `<img src="${d.user.photo_url}">`
 : ""
}

<span>
${escapeHtml(d.user.name || d.user.email)}
</span>

`;

await Promise.all([
 loadDeposits(),
 loadPrompts(),
 loadCategories(),
 loadPackages()
]);

}catch(e){

$("login").style.display="flex";
$("app").style.display="none";

}

}


/* =========================
   TABS
========================= */

function tab(
 id,
 button
){

document
.querySelectorAll(".panel")
.forEach(
 x=>x.classList.remove("active")
);

document
.querySelectorAll(".tab")
.forEach(
 x=>x.classList.remove("active")
);

$(id).classList.add("active");

button.classList.add("active");

}


/* =========================
   DEPOSITS
========================= */

async function loadDeposits(){

const d =
await api(
 ADMIN_API,
 "/api/pro/admin/deposits"
);

const list =
d.deposits || [];

$("depositList").innerHTML =
list.map(x => {

const status =
String(x.status || "")
.toLowerCase();

return `

<tr>

<td>#${x.id}</td>

<td>
${escapeHtml(x.name || "Unknown")}
</td>

<td>
${escapeHtml(x.email || "")}
</td>

<td>
LKR ${Number(x.amount || 0).toLocaleString()}
</td>

<td>
${escapeHtml(x.payment_date || "")}
</td>

<td>

<span class="badge ${status}">
${escapeHtml(status)}
</span>

</td>

<td>

${
 status === "pending"

 ? `

<div class="actions">

<button
class="btn"
onclick="approveDeposit(${x.id})"
>
Approve
</button>

<button
class="btn danger"
onclick="rejectDeposit(${x.id})"
>
Reject
</button>

</div>

`

 : "—"
}

</td>

</tr>

`;

}).join("");

}


/* =========================
   APPROVE
========================= */

async function approveDeposit(id){

if(
!confirm(
"Approve this deposit?"
)
){
return;
}

try{

const d =
await api(
 APPROVE_API,
 "/approve/" + id,
 {
  method:"POST"
 }
);

showMsg(
 "depositMsg",
 "Approved successfully. " +
 Number(
  d.credits_added || 0
 ).toLocaleString() +
 " coins added.",
 "ok"
);

await loadDeposits();

}catch(e){

showMsg(
 "depositMsg",
 e.message ||
 "Approval failed.",
 "err"
);

}

}


/* =========================
   REJECT
========================= */

async function rejectDeposit(id){

if(
!confirm(
"Reject this deposit?"
)
){
return;
}

try{

await api(
 ADMIN_API,
 "/api/pro/admin/deposits/" + id,
 {
  method:"POST",
  headers:{
   "Content-Type":
   "application/json"
  },
  body:JSON.stringify({
   action:"reject"
  })
 }
);

showMsg(
 "depositMsg",
 "Deposit rejected.",
 "ok"
);

await loadDeposits();

}catch(e){

showMsg(
 "depositMsg",
 e.message ||
 "Reject failed.",
 "err"
);

}

}


/* =========================
   CATEGORIES
========================= */

async function loadCategories(){

const d =
await api(
 ADMIN_API,
 "/api/pro/admin/categories"
);

const list =
d.categories || [];

$("promptCategory").innerHTML =

`<option value="">
Select category
</option>` +

list.map(c => `

<option value="${c.id}">
${escapeHtml(c.name)}
</option>

`).join("");

$("categoryList").innerHTML =
list.map(c => `

<div class="card">

<div class="card-title">
${escapeHtml(c.name)}
</div>

<div class="small">
ID: ${c.id}
</div>

</div>

`).join("");

}


async function addCategory(){

const name =
$("categoryName").value.trim();

if(!name){

showMsg(
 "categoryMsg",
 "Category name required.",
 "err"
);

return;

}

try{

await api(
 ADMIN_API,
 "/api/pro/admin/categories",
 {
  method:"POST",
  headers:{
   "Content-Type":
   "application/json"
  },
  body:JSON.stringify({
   name
  })
 }
);

$("categoryName").value="";

showMsg(
 "categoryMsg",
 "Category added.",
 "ok"
);

await loadCategories();

}catch(e){

showMsg(
 "categoryMsg",
 e.message,
 "err"
);

}

}


/* =========================
   PROMPTS
========================= */

async function loadPrompts(){

const d =
await api(
 ADMIN_API,
 "/api/pro/admin/prompts"
);

const list =
d.prompts || [];

$("promptList").innerHTML =
list.map(p => `

<div class="card">

<div class="card-title">
${escapeHtml(p.title || "")}
</div>

<div class="small">
${escapeHtml(
 p.category_name || "No category"
)}
</div>

${
 p.description
 ? `<p>${escapeHtml(p.description)}</p>`
 : ""
}

${
 p.prompt
 ? `<p>${escapeHtml(p.prompt)}</p>`
 : ""
}

${
 p.image_url
 ? `
 <img
 src="${p.image_url}"
 style="max-width:180px;border-radius:10px"
 >
 `
 : ""
}

</div>

`).join("");

}


async function addPrompt(){

const title =
$("promptTitle").value.trim();

const description =
$("promptDescription").value.trim();

const prompt =
$("promptText").value.trim();

const category_id =
$("promptCategory").value || null;

const file =
$("promptImage").files[0];

if(!title){

showMsg(
 "promptMsg",
 "Title required.",
 "err"
);

return;

}

if(!prompt && !file){

showMsg(
 "promptMsg",
 "Prompt or image required.",
 "err"
);

return;

}

let image="";

if(file){

if(file.size > 10*1024*1024){

showMsg(
 "promptMsg",
 "Image must be below 10MB.",
 "err"
);

return;

}

image =
await readFile(file);

}

try{

await api(
 ADMIN_API,
 "/api/pro/admin/prompts",
 {
  method:"POST",
  headers:{
   "Content-Type":
   "application/json"
  },
  body:JSON.stringify({

   title,
   description,
   prompt,
   category_id,
   image

  })
 }
);

$("promptTitle").value="";
$("promptDescription").value="";
$("promptText").value="";
$("promptImage").value="";

showMsg(
 "promptMsg",
 "Prompt added.",
 "ok"
);

await loadPrompts();

}catch(e){

showMsg(
 "promptMsg",
 e.message,
 "err"
);

}

}


/* =========================
   PACKAGES
========================= */

async function loadPackages(){

const d =
await api(
 ADMIN_API,
 "/api/pro/admin/packages"
);

const list =
d.packages || [];

$("packageList").innerHTML =
list.map(p => `

<div class="card">

<div class="card-title">
${escapeHtml(p.name || "")}
</div>

<div class="small">

${Number(p.credits || 0).toLocaleString()}
Coins ·

LKR ${Number(p.price || 0).toLocaleString()}

· Bonus ${Number(p.bonus || 0)}

</div>

<div class="small">

Status:
${p.active ? "Active" : "Inactive"}

${p.popular ? " · Popular" : ""}

</div>

</div>

`).join("");

}


async function addPackage(){

const name =
$("packageName").value.trim();

const credits =
Number($("packageCredits").value);

const bonus =
Number($("packageBonus").value || 0);

const popular =
$("packagePopular").checked;

const active =
$("packageActive").checked;

if(
!name ||
!Number.isInteger(credits) ||
credits < 100
){

showMsg(
 "packageMsg",
 "Minimum package is 100 coins.",
 "err"
);

return;

}

try{

await api(
 ADMIN_API,
 "/api/pro/admin/packages",
 {
  method:"POST",
  headers:{
   "Content-Type":
   "application/json"
  },
  body:JSON.stringify({

   name,
   credits,
   bonus,
   popular,
   active

  })
 }
);

$("packageName").value="";
$("packageCredits").value="";
$("packageBonus").value="0";
$("packagePopular").checked=false;
$("packageActive").checked=true;

showMsg(
 "packageMsg",
 "Package added.",
 "ok"
);

await loadPackages();

}catch(e){

showMsg(
 "packageMsg",
 e.message,
 "err"
);

}

}


/* =========================
   FILE
========================= */

function readFile(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
()=>resolve(reader.result);

reader.onerror =
()=>reject(
Error("Could not read image")
);

reader.readAsDataURL(file);

});

}


/* =========================
   MESSAGE
========================= */

function showMsg(
id,
text,
type
){

const el=$(id);

el.textContent=text;

el.className=
"msg "+type;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

loadMe();

</script>

</body>
</html>
