<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Pro Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f5f7fb;color:#111827}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

#login,#app{display:none}

.login{min-height:100vh;place-items:center;padding:20px}
.login-box{width:100%;max-width:420px;background:#fff;padding:35px;border-radius:20px;text-align:center;box-shadow:0 15px 50px #0001}
.login-box h1{margin:0 0 8px}
.login-box p{color:#6b7280}

.google,.primary{background:#111827;color:#fff;border:0;border-radius:9px;font-weight:700}
.google{width:100%;padding:13px}

#loading{
position:fixed;
inset:0;
z-index:9999;
display:grid;
place-items:center;
background:#f5f7fb;
font:700 16px Arial
}

header{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:900}
.admin{display:flex;align-items:center;gap:10px}
.admin img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.logout{background:#374151;color:#fff;border:0;padding:9px 13px;border-radius:8px;font-weight:700}

.nav-wrap{position:sticky;top:63px;z-index:40;background:#fff;border-bottom:1px solid #e5e7eb}
nav{max-width:1200px;margin:auto;padding:9px 20px;display:flex;gap:7px;overflow:auto}
nav button{border:0;background:#f3f4f6;color:#374151;padding:10px 15px;border-radius:9px;font-weight:700;white-space:nowrap}
nav button.active{background:#111827;color:#fff}

main{max-width:1200px;margin:auto;padding:22px 20px 60px}
.page-title{margin-bottom:20px}
.page-title h1{margin:0 0 5px;font-size:25px}
.page-title p{margin:0;color:#6b7280}

.tab{display:none}
.tab.active{display:block}

.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 3px 15px #0000000a}
.card h2{margin:0 0 15px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}

input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px;margin-top:6px;outline:0;background:#fff}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:600;margin-bottom:12px}

.primary{padding:11px 17px}

.danger,.success,.secondary,.refresh,.edit{border:0;padding:8px 12px;border-radius:8px;font-weight:700}
.danger{background:#dc2626;color:#fff}
.success{background:#059669;color:#fff}
.secondary,.refresh{background:#e5e7eb;color:#111827}
.refresh:disabled{opacity:.6}
.edit{background:#4f46e5;color:#fff}

.list{display:grid;gap:12px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:15px}
.item h3{margin:0 0 7px}
.item p{margin:6px 0;color:#6b7280;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

.preview{max-width:220px;max-height:160px;border-radius:8px;margin-top:8px}
.price{font-weight:800;font-size:22px}
.total{padding:11px;background:#f3f4f6;border-radius:9px;margin-bottom:12px}
.empty{text-align:center;color:#6b7280;padding:25px}

.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:800}
.active-badge{background:#d1fae5;color:#065f46}
.inactive-badge{background:#fee2e2;color:#991b1b}

.deposit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.search{margin-bottom:15px}
.search input{margin:0}

.edit-box{display:none;background:#f9fafb;border:1px solid #e5e7eb;padding:15px;border-radius:10px;margin-top:15px}
.edit-box.show{display:block}

/* SLIP */
.slip-modal{
display:none;
position:fixed;
inset:0;
background:#000b;
z-index:999;
align-items:center;
justify-content:center;
padding:15px
}

.slip-modal.show{display:flex}

.slip-box{
background:#fff;
width:min(850px,100%);
max-height:95vh;
border-radius:14px;
overflow:hidden
}

.slip-head,.slip-foot{
padding:12px 15px;
display:flex;
justify-content:space-between;
align-items:center
}

.slip-head{border-bottom:1px solid #ddd}
.slip-foot{border-top:1px solid #ddd}

.slip-body{
padding:10px;
text-align:center;
background:#f3f4f6;
overflow:auto
}

.slip-img{
max-width:100%;
max-height:75vh
}

.slip-pdf{
display:none;
width:100%;
height:75vh;
border:0
}

@media(max-width:600px){
header{padding:10px 12px}
.brand{font-size:17px}
.admin span{display:none}
.nav-wrap{top:58px}
nav{padding:8px 10px}
main{padding:15px 10px 45px}
.card{padding:15px}
}
</style>
</head>

<body>

<div id="loading">Loading CreateLK Pro...</div>

<div id="login" class="login">

<div class="login-box">

<h1>CreateLK Pro</h1>

<p>Administrator Dashboard</p>

<button class="google" onclick="login()">
Continue with Google
</button>

</div>

</div>


<div id="app" class="app">

<header>

<div class="brand">
CreateLK Pro Admin
</div>

<div class="admin">

<img id="adminPhoto">

<span id="adminName"></span>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</header>


<div class="nav-wrap">

<nav>

<button class="active" onclick="tab('prompts',this)">
✨ Prompts
</button>

<button onclick="tab('categories',this)">
📁 Categories
</button>

<button onclick="tab('packages',this)">
📦 Packages
</button>

<button onclick="tab('deposits',this)">
💎 Deposits
</button>

</nav>

</div>


<main>

<div class="page-title">

<h1 id="pageTitle">
Prompts
</h1>

<p id="pageDescription">
Manage your AI prompt library.
</p>

</div>


<!-- PROMPTS -->

<section id="prompts" class="tab active">

<div class="card">

<h2>Add Prompt</h2>

<form id="promptForm">

<div class="grid">

<label>
Title
<input id="promptTitle" required>
</label>

<label>
Category

<select id="promptCategory">
<option value="">No category</option>
</select>

</label>

</div>

<label>
Description
<input id="promptDescription">
</label>

<label>
Prompt
<textarea id="promptText"></textarea>
</label>

<label>
Photo
<input
id="promptImage"
type="file"
accept="image/png,image/jpeg,image/webp">
</label>

<button class="primary">
Add Prompt
</button>

</form>

</div>


<div class="card">

<h2>Prompts</h2>

<div class="search">
<input
id="promptSearch"
type="search"
placeholder="🔍 Search prompts...">
</div>

<div id="promptList" class="list"></div>

</div>

</section>


<!-- CATEGORIES -->

<section id="categories" class="tab">

<div class="card">

<h2>Add Category</h2>

<form id="categoryForm">

<label>
Category name
<input id="categoryName" required>
</label>

<button class="primary">
Add Category
</button>

</form>

</div>


<div class="card">

<h2>Categories</h2>

<div id="categoryList" class="list"></div>

</div>

</section>


<!-- PACKAGES -->

<section id="packages" class="tab">

<div class="card">

<h2>Add Package</h2>

<form id="packageForm">

<div class="grid">

<label>
Package name
<input id="packageName" required>
</label>

<label>
Paid coins
<input
id="packageCredits"
type="number"
min="100"
value="100"
required>
</label>

<label>
Price LKR
<input id="packagePrice" readonly>
</label>

<label>
Bonus coins
<input
id="packageBonus"
type="number"
min="0"
value="0">
</label>

</div>


<div class="total">
Total coins:
<b id="packageTotal">100</b>
</div>


<label>
<input id="packagePopular" type="checkbox">
Popular package
</label>

<label>
<input id="packageActive" type="checkbox" checked>
Active
</label>

<button class="primary">
Add Package
</button>

</form>

</div>


<div class="card">

<h2>Packages</h2>

<div id="packageList" class="list"></div>

</div>

</section>


<!-- DEPOSITS -->

<section id="deposits" class="tab">

<div class="card">

<div class="deposit-top">

<h2 style="margin:0">
💎 Deposits
</h2>

<button
id="refreshDepositsBtn"
class="refresh"
onclick="refreshDeposits()">
↻ Refresh
</button>

</div>

<div id="depositList" class="list"></div>

</div>

</section>

</main>

</div>


<!-- SLIP MODAL -->

<div
id="slipModal"
class="slip-modal"
onclick="closeSlip(event)">

<div
class="slip-box"
onclick="event.stopPropagation()">

<div class="slip-head">

<b>💎 Payment Slip</b>

<button
class="secondary"
onclick="closeSlip()">
✕
</button>

</div>


<div class="slip-body">

<img
id="slipImg"
class="slip-img"
alt="Payment Slip">

<iframe
id="slipPdf"
class="slip-pdf">
</iframe>

</div>


<div class="slip-foot">

<a
id="slipOpen"
class="secondary"
target="_blank"
rel="noopener">
↗ Open
</a>

<button
class="primary"
onclick="closeSlip()">
Close
</button>

</div>

</div>

</div>


<script>

const USER_API="https://pro.createlk.workers.dev";
const ADMIN_API="https://pro-admin.createlk.workers.dev";
const APPROVE_API="https://pro-approve.createlk.workers.dev";

const $=id=>document.getElementById(id);


async function api(url,opt={}){

opt.credentials="include";

const r=await fetch(url,opt);

let d={};

try{
d=await r.json();
}catch{}

if(!r.ok)
throw Error(d.error||"Request failed");

return d;

}


function login(){
location.href=ADMIN_API+"/auth/google";
}


function logout(){
location.href=ADMIN_API+"/auth/logout";
}


/* TABS */

function tab(id,btn){

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

$(id).classList.add("active");

btn.classList.add("active");

const titles={
prompts:[
"Prompts",
"Manage your AI prompt library."
],
categories:[
"Categories",
"Organize prompts into categories."
],
packages:[
"Packages",
"Manage coin packages and pricing."
],
deposits:[
"Deposits",
"Review and approve customer payments."
]
};

$("pageTitle").textContent=titles[id][0];

$("pageDescription").textContent=titles[id][1];

if(id==="prompts")
loadPrompts();

if(id==="categories")
loadCategories();

if(id==="packages")
loadPackages();

if(id==="deposits")
loadDeposits();

}


/* LOGIN */

async function loadMe(){

try{

const d=await api(
ADMIN_API+"/api/me"
);

$("loading").style.display="none";


if(!d.user){

$("login").style.display="grid";
$("app").style.display="none";

return;

}


$("login").style.display="none";
$("app").style.display="block";


$("adminName").textContent=
d.user.name||d.user.email;


if(d.user.photo_url)
$("adminPhoto").src=d.user.photo_url;


await loadCategories();
await loadPrompts();
await loadPackages();
await loadDeposits();


}catch(e){

console.error(e);

$("loading").style.display="none";

$("login").style.display="grid";
$("app").style.display="none";

}

}


/* CATEGORIES */

let categories=[];


async function loadCategories(){

try{

const d=await api(
USER_API+"/api/pro/categories"
);

categories=d.categories||[];


$("promptCategory").innerHTML=
`<option value="">No category</option>`+
categories.map(c=>
`<option value="${attr(c.id)}">
${esc(c.name)}
</option>`
).join("");


$("categoryList").innerHTML=
categories.length
?
categories.map(c=>
`<div class="item">
<b>${esc(c.name)}</b>
</div>`
).join("")
:
`<div class="empty">
No categories
</div>`;


}catch(e){

$("categoryList").innerHTML=
`<div class="empty">
${esc(e.message)}
</div>`;

}

}


$("categoryForm").onsubmit=async e=>{

e.preventDefault();

try{

await api(
ADMIN_API+"/api/pro/admin/categories",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:$("categoryName").value.trim()
})
}
);

$("categoryName").value="";

await loadCategories();

alert("Category added.");

}catch(e){

alert(e.message);

}

};


/* PROMPTS */

function imageData(file){

return new Promise((resolve,reject)=>{

if(!file){

resolve("");

return;

}

if(file.size>10*1024*1024){

reject(
Error("Image must be below 10MB.")
);

return;

}

const r=new FileReader();

r.onload=()=>resolve(r.result);

r.onerror=reject;

r.readAsDataURL(file);

});

}


$("promptForm").onsubmit=async e=>{

e.preventDefault();

try{

const image=await imageData(
$("promptImage").files[0]
);


await api(
ADMIN_API+"/api/pro/admin/prompts",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

title:
$("promptTitle").value.trim(),

description:
$("promptDescription").value.trim(),

prompt:
$("promptText").value.trim(),

category_id:
$("promptCategory").value||null,

image

})
}
);


$("promptForm").reset();

await loadPrompts();

alert("Prompt added.");

}catch(e){

alert(e.message);

}

};


let prompts=[];


async function loadPrompts(){

try{

const d=await api(
ADMIN_API+"/api/pro/admin/prompts"
);

prompts=d.prompts||[];

renderPrompts();

}catch(e){

$("promptList").innerHTML=
`<div class="empty">
${esc(e.message)}
</div>`;

}

}


$("promptSearch").oninput=renderPrompts;


function renderPrompts(){

const q=
$("promptSearch").value
.toLowerCase()
.trim();


const list=prompts.filter(p=>
[
p.title,
p.description,
p.prompt,
p.category_name
]
.join(" ")
.toLowerCase()
.includes(q)
);


$("promptList").innerHTML=
list.length
?
list.map(promptCard).join("")
:
`<div class="empty">
No prompts found.
</div>`;

}


function promptCard(p){

return `

<div class="item">

<h3>
${esc(p.title||"Untitled")}
</h3>

${p.description?
`<p>${esc(p.description)}</p>`
:""}

<p>
Category:
<b>${esc(p.category_name||"None")}</b>
</p>

${p.prompt?
`<p>
<b>Prompt:</b><br>
${esc(p.prompt)}
</p>`
:""}

${p.image_url?
`<img
class="preview"
src="${attr(p.image_url)}">`
:""}

<div class="actions">

<button
class="edit"
onclick="editPrompt(${p.id})">
✏️ Edit
</button>

</div>


<div
id="edit-${p.id}"
class="edit-box">

<label>
Title
<input
id="title-${p.id}"
value="${attr(p.title||"")}">
</label>

<label>
Description
<input
id="desc-${p.id}"
value="${attr(p.description||"")}">
</label>

<label>
Prompt
<textarea
id="text-${p.id}">${esc(p.prompt||"")}</textarea>
</label>


<div class="actions">

<button
class="success"
onclick="savePrompt(${p.id})">
✓ Save
</button>

<button
class="secondary"
onclick="editPrompt(${p.id})">
Cancel
</button>

</div>

</div>

</div>

`;

}


function editPrompt(id){

$("edit-"+id)
.classList.toggle("show");

}


async function savePrompt(id){

try{

await api(
ADMIN_API+"/api/pro/admin/prompts/"+id,
{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

title:
$("title-"+id).value.trim(),

description:
$("desc-"+id).value.trim(),

prompt:
$("text-"+id).value.trim()

})
}
);

await loadPrompts();

alert("Prompt updated.");

}catch(e){

alert(e.message);

}

}


/* PACKAGES */

function updatePackageTotal(){

const credits=
Number($("packageCredits").value)||0;

const bonus=
Number($("packageBonus").value)||0;

$("packagePrice").value=credits;

$("packageTotal").textContent=
credits+bonus;

}


$("packageCredits").oninput=
updatePackageTotal;

$("packageBonus").oninput=
updatePackageTotal;


$("packageForm").onsubmit=async e=>{

e.preventDefault();


const credits=
Number($("packageCredits").value);

const bonus=
Number($("packageBonus").value)||0;


if(
!Number.isInteger(credits)||
credits<100
){

alert("Minimum package is 100 coins.");

return;

}


try{

await api(
ADMIN_API+"/api/pro/admin/packages",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

name:
$("packageName").value.trim(),

credits,

bonus,

popular:
$("packagePopular").checked,

active:
$("packageActive").checked

})
}
);


$("packageForm").reset();

$("packageCredits").value=100;
$("packageBonus").value=0;
$("packageActive").checked=true;

updatePackageTotal();

await loadPackages();

alert("Package added.");

}catch(e){

alert(e.message);

}

};


async function loadPackages(){

try{

const d=await api(
ADMIN_API+"/api/pro/admin/packages"
);

const list=d.packages||[];


$("packageList").innerHTML=
list.length
?
list.map(p=>`

<div class="item">

<h3>
${esc(p.name)}
</h3>

<p>
Paid coins:
<b>${p.credits}</b>
</p>

<p>
Bonus:
<b>${p.bonus}</b>
</p>

<p>
Total:
<b>
${Number(p.credits)+Number(p.bonus)}
</b>
</p>

<p class="price">
LKR ${p.price}
</p>

<span class="badge ${
p.active
?"active-badge"
:"inactive-badge"
}">
${p.active?"ACTIVE":"INACTIVE"}
</span>

</div>

`).join("")
:
`<div class="empty">
No packages
</div>`;

}catch(e){

$("packageList").innerHTML=
`<div class="empty">
${esc(e.message)}
</div>`;

}

}


/* DEPOSITS */

async function loadDeposits(){

$("depositList").innerHTML=
`<div class="empty">
Loading deposits...
</div>`;


try{

const d=await api(
ADMIN_API+"/api/pro/admin/deposits"
);

const list=d.deposits||[];


$("depositList").innerHTML=
list.length
?
list.map(x=>`

<div class="item">

<h3>
Deposit #${x.id}
</h3>

<p>
User:
${esc(x.name||"")}
</p>

<p>
Email:
${esc(x.email||"")}
</p>

<p>
Amount:
<b>
LKR ${x.amount??0}
</b>
</p>

<p>
Status:

<span class="badge">
${esc(x.status||"")}
</span>

</p>


${x.receipt_key?`

<p>

<button
class="secondary"
onclick="viewSlip(${x.id})">

📷 View Payment Slip

</button>

</p>

`:""}


${x.status==="pending"?`

<div class="actions">

<button
class="success"
onclick="depositAction(${x.id},'approve')">

✓ Approve

</button>

<button
class="danger"
onclick="depositAction(${x.id},'reject')">

✕ Reject

</button>

</div>

`:""}

</div>

`).join("")
:
`<div class="empty">
No deposits
</div>`;


}catch(e){

$("depositList").innerHTML=
`<div class="empty">
❌ ${esc(e.message)}
</div>`;

}

}


/* REFRESH */

async function refreshDeposits(){

const b=$("refreshDepositsBtn");

b.disabled=true;
b.textContent="↻ Loading...";


try{

await loadDeposits();

}catch(e){

alert(e.message);

}finally{

b.disabled=false;
b.textContent="↻ Refresh";

}

}


/* APPROVE / REJECT */

async function depositAction(id,action){

if(!confirm(
action==="approve"
?
"Approve this deposit and add the coins?"
:
"Reject this deposit?"
))
return;


try{

if(action==="approve"){

await api(
APPROVE_API+
"/api/pro/admin/deposits/"+id,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"approve"
})
}
);

}else{

await api(
ADMIN_API+
"/api/pro/admin/deposits/"+id,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"reject"
})
}
);

}


await loadDeposits();


alert(
action==="approve"
?
"Deposit approved and coins added."
:
"Deposit rejected."
);


}catch(e){

alert(e.message);

}

}


/* SLIP VIEWER */

function viewSlip(id){

const url=
ADMIN_API+
"/api/pro/admin/deposits/"+
id+
"/receipt";


$("slipOpen").href=url;

$("slipImg").style.display="block";
$("slipPdf").style.display="none";

$("slipImg").src=url;


$("slipModal")
.classList.add("show");

document.body.style.overflow="hidden";

}


function closeSlip(e){

if(e&&e.target!==$("slipModal"))
return;


$("slipModal")
.classList.remove("show");

$("slipImg").src="";
$("slipPdf").src="";

document.body.style.overflow="";

}


document.addEventListener(
"keydown",
e=>{

if(e.key==="Escape")
closeSlip();

}
);


/* SECURITY */

function esc(x){

return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
