
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreateLK Pro Admin</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f6fa;color:#111827}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;font-weight:700}.primary{background:#111827;color:#fff}.danger{background:#dc2626;color:#fff}.success{background:#059669;color:#fff}.secondary{background:#e5e7eb}.login{min-height:100vh;display:grid;place-items:center}.login>div{background:#fff;padding:30px;border-radius:16px;width:min(400px,90%);text-align:center;box-shadow:0 10px 40px #0001}.login button{width:100%;background:#111827;color:#fff}.app{display:none}header{background:#111827;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.admin{display:flex;align-items:center;gap:8px}.admin img{width:35px;height:35px;border-radius:50%}.logout{background:#374151;color:#fff}.nav{background:#fff;border-bottom:1px solid #ddd;padding:8px;display:flex;gap:6px;overflow:auto}.nav button{white-space:nowrap;background:#eee}.nav button.active{background:#111827;color:#fff}main{max-width:1100px;margin:auto;padding:20px}.tab{display:none}.tab.active{display:block}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label{display:block;font-weight:bold;margin:8px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-top:5px}textarea{min-height:100px}.item{border:1px solid #ddd;border-radius:10px;padding:13px;margin:10px 0}.item h3{margin:0 0 7px}.item p{line-height:1.5;color:#555}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:15px;background:#fef3c7;font-size:11px;font-weight:bold}.preview{max-width:200px;max-height:140px;border-radius:8px}.empty{text-align:center;color:#777;padding:20px}.edit{display:none;background:#f8fafc;padding:12px;margin-top:10px;border-radius:8px}.edit.show{display:block}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:99;align-items:center;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:#fff;width:min(850px,100%);max-height:95vh;border-radius:14px;overflow:hidden}.modalhead,.modalfoot{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}.modalfoot{border-top:1px solid #ddd;border-bottom:0}.modalbody{padding:10px;text-align:center;background:#f3f4f6;overflow:auto}.slipimg{max-width:100%;max-height:70vh}.slippdf{display:none;width:100%;height:70vh;border:0}@media(max-width:600px){main{padding:10px}.admin span{display:none}}
</style></head><body>

<div id="login" class="login"><div><h2>CreateLK Pro</h2><p>Admin Dashboard</p><button onclick="login()">Continue with Google</button></div></div>

<div id="app" class="app">
<header><div class="brand">CreateLK Pro</div><div class="admin"><img id="photo"><span id="name"></span><button class="logout" onclick="logout()">Logout</button></div></header>

<div class="nav">
<button class="active" onclick="tab('prompts',this)">Prompts</button>
<button onclick="tab('categories',this)">Categories</button>
<button onclick="tab('packages',this)">Packages</button>
<button onclick="tab('deposits',this)">Deposits</button>
</div>

<main>

<section id="prompts" class="tab active">
<div class="card"><h2>Add Prompt</h2><form id="pf">
<div class="grid"><label>Title<input id="pt" required></label><label>Category<select id="pc"><option value="">None</option></select></label></div>
<label>Description<input id="pd"></label><label>Prompt<textarea id="px"></textarea></label><label>Image<input id="pi" type="file" accept="image/*"></label>
<button class="primary">Add</button></form></div>
<div class="card"><h2>Prompts</h2><input id="ps" placeholder="Search..." oninput="renderP()"><div id="pl"></div></div>
</section>

<section id="categories" class="tab">
<div class="card"><h2>Add Category</h2><form id="cf"><input id="cn" placeholder="Category name" required><br><br><button class="primary">Add</button></form></div>
<div class="card"><h2>Categories</h2><div id="cl"></div></div>
</section>

<section id="packages" class="tab">
<div class="card"><h2>Add Package</h2><form id="pkg">
<div class="grid"><label>Name<input id="pn" required></label><label>Coins<input id="pcn" type="number" min="100" value="100"></label><label>Bonus<input id="pb" type="number" value="0"></label></div>
<p>Price: LKR <b id="price">100</b> | Total: <b id="total">100</b></p>
<label><input id="pop" type="checkbox"> Popular</label><label><input id="act" type="checkbox" checked> Active</label>
<button class="primary">Add</button></form></div>
<div class="card"><h2>Packages</h2><div id="pkl"></div></div>
</section>

<section id="deposits" class="tab">
<div class="card"><h2>💎 Deposits <button class="secondary" onclick="deposits()">Refresh</button></h2><div id="dl"></div></div>
</section>

</main></div>

<div id="modal" class="modal" onclick="closeSlip(event)"><div class="modalbox" onclick="event.stopPropagation()">
<div class="modalhead"><b>Payment Slip</b><button class="secondary" onclick="closeSlip()">✕</button></div>
<div class="modalbody"><img id="si" class="slipimg"><iframe id="sp" class="slippdf"></iframe></div>
<div class="modalfoot"><a id="so" class="secondary" target="_blank" rel="noopener">Open</a><button class="primary" onclick="closeSlip()">Close</button></div>
</div></div>

<script>
const U="https://pro.createlk.workers.dev",A="https://pro-admin.createlk.workers.dev",AP="https://pro-approve.createlk.workers.dev",$=x=>document.getElementById(x);let cats=[],pros=[];

async function api(u,o={}){o.credentials="include";let r=await fetch(u,o),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function login(){location.href=A+"/auth/google"}function logout(){location.href=A+"/auth/logout"}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");b.classList.add("active");if(id=="prompts")prompts();if(id=="categories")categories();if(id=="packages")packages();if(id=="deposits")deposits()}

async function me(){try{let d=await api(A+"/api/me");if(!d.user)return;login.style.display="none";app.style.display="block";name.textContent=d.user.name||d.user.email;if(d.user.photo_url)photo.src=d.user.photo_url;await categories();await prompts();await packages();await deposits()}catch{login.style.display="grid"}}

async function categories(){try{cats=(await api(U+"/api/pro/categories")).categories||[];pc.innerHTML='<option value="">None</option>'+cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");cl.innerHTML=cats.length?cats.map(x=>`<div class=item>${esc(x.name)}</div>`).join(""):'<div class=empty>No categories</div>'}catch(e){cl.innerHTML=esc(e.message)}}
cf.onsubmit=async e=>{e.preventDefault();try{await api(A+"/api/pro/admin/categories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:cn.value.trim()})});cn.value="";categories()}catch(e){alert(e.message)}};

function file(f){return new Promise((r,j)=>{if(!f)return r("");if(f.size>1e7)return j(Error("Image must be below 10MB"));let x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}
pf.onsubmit=async e=>{e.preventDefault();try{let image=await file(pi.files[0]);await api(A+"/api/pro/admin/prompts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:pt.value,description:pd.value,prompt:px.value,category_id:pc.value||null,image})});pf.reset();prompts();alert("Added")}catch(e){alert(e.message)}};

async function prompts(){try{pros=(await api(A+"/api/pro/admin/prompts")).prompts||[];renderP()}catch(e){pl.innerHTML=esc(e.message)}}
function renderP(){let q=ps.value.toLowerCase();let l=pros.filter(x=>(x.title+" "+x.description+" "+x.prompt+" "+x.category_name).toLowerCase().includes(q));pl.innerHTML=l.length?l.map(x=>`<div class=item><h3>${esc(x.title)}</h3><p>${esc(x.description||"")}</p><p>${esc(x.prompt||"")}</p>${x.image_url?`<img class=preview src="${esc(x.image_url)}">`:""}<div class=actions><button class=secondary onclick="ep(${x.id})">Edit</button></div><div id=e${x.id} class=edit><input id=t${x.id} value="${esc(x.title)}"><input id=d${x.id} value="${esc(x.description||"")}"><textarea id=x${x.id}>${esc(x.prompt||"")}</textarea><select id=c${x.id}><option value="">None</option>${cats.map(c=>`<option value="${c.id}" ${c.id==x.category_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><input id=i${x.id} type=file accept="image/*"><br><button class=success onclick="sprompt(${x.id})">Save</button></div></div>`).join(""):'<div class=empty>No prompts</div>'}
function ep(id){$("e"+id).classList.toggle("show")}
async function sprompt(id){try{let im=await file($("i"+id).files[0]),b={title:$("t"+id).value,description:$("d"+id).value,prompt:$("x"+id).value,category_id:$("c"+id).value||null};if(im)b.image=im;await api(A+"/api/pro/admin/prompts/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});prompts()}catch(e){alert(e.message)}}

function totals(){let c=+pcn.value||0,b=+pb.value||0;price.value=c;total.value=c+b}pcn.oninput=pb.oninput=totals;
pkg.onsubmit=async e=>{e.preventDefault();try{let c=+pcn.value,b=+pb.value||0;if(c<100)throw Error("Minimum 100 coins");await api(A+"/api/pro/admin/packages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pn.value,credits:c,bonus:b,popular:pop.checked,active:act.checked})});pkg.reset();pcn.value=100;act.checked=true;totals();packages()}catch(e){alert(e.message)}};

async function packages(){try{let l=(await api(A+"/api/pro/admin/packages")).packages||[];pkl.innerHTML=l.length?l.map(x=>`<div class=item><h3>${esc(x.name)}</h3><p>Coins: ${x.credits} + ${x.bonus} bonus</p><b>LKR ${x.price}</b><p><span class=badge>${x.active?"ACTIVE":"INACTIVE"}</span></p><div class=actions><button class=secondary onclick="editpkg(${x.id})">Edit</button><button class=danger onclick="delpkg(${x.id})">Delete</button></div></div>`).join(""):'<div class=empty>No packages</div>'}catch(e){pkl.innerHTML=esc(e.message)}}
async function editpkg(id){let n=prompt("Package name"),c=+prompt("Coins","100"),b=+prompt("Bonus","0");if(!n||!c)return;try{await api(A+"/api/pro/admin/packages/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,credits:c,bonus:b,popular:confirm("Popular?"),active:confirm("Active?")})});packages()}catch(e){alert(e.message)}}
async function delpkg(id){if(confirm("Delete package?"))try{await api(A+"/api/pro/admin/packages/"+id,{method:"DELETE"});packages()}catch(e){alert(e.message)}}

async function deposits(){try{let l=(await api(A+"/api/pro/admin/deposits")).deposits||[];dl.innerHTML=l.length?l.map(x=>`<div class=item><h3>Deposit #${x.id}</h3><p>${esc(x.name||"")} · ${esc(x.email||"")}</p><p>Amount: <b>LKR ${x.amount??x.credits??0}</b></p><p>Status: <span class=badge>${esc(x.status||"")}</span></p>${x.receipt_url?`<button class=secondary onclick="slip('${esc(x.receipt_url)}')">📷 View Slip</button>`:"No slip"}${x.status=="pending"?`<div class=actions><button class=success onclick="deposit(${x.id},'approve')">Approve</button><button class=danger onclick="deposit(${x.id},'reject')">Reject</button></div>`:""}</div>`).join(""):'<div class=empty>No deposits</div>'}catch(e){dl.innerHTML=esc(e.message)}}
async function deposit(id,a){if(!confirm(a=="approve"?"Approve deposit?":"Reject deposit?"))return;try{await api((a=="approve"?AP:A)+"/api/pro/admin/deposits/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a})});deposits()}catch(e){alert(e.message)}}

function slip(u){modal.classList.add("show");so.href=u;si.style.display="none";sp.style.display="none";if(u.split("?")[0].toLowerCase().endsWith(".pdf")){sp.src=u;sp.style.display="block"}else{si.src=u;si.style.display="block"}}
function closeSlip(e){if(e&&e.target!=modal)return;modal.classList.remove("show");si.src="";sp.src=""}
document.onkeydown=e=>e.key=="Escape"&&closeSlip();me();totals();
</script></body></html>
