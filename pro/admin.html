<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Pro Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#f5f7fb;color:#111827}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:100%;max-width:420px;background:#fff;padding:35px;border-radius:20px;text-align:center;box-shadow:0 15px 50px #0001}
.login-box h1{margin:0 0 8px}.login-box p{color:#6b7280}
.google,.primary{background:#111827;color:#fff;border:0;border-radius:9px;font-weight:700}
.google{width:100%;padding:13px}.app{display:none}
header{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:900}.admin{display:flex;align-items:center;gap:10px}
.admin img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.logout{background:#374151;color:#fff;border:0;padding:9px 13px;border-radius:8px;font-weight:700}
.nav-wrap{position:sticky;top:63px;z-index:40;background:#fff;border-bottom:1px solid #e5e7eb}
nav{max-width:1200px;margin:auto;padding:9px 20px;display:flex;gap:7px;overflow:auto}
nav button{border:0;background:#f3f4f6;color:#374151;padding:10px 15px;border-radius:9px;font-weight:700;white-space:nowrap}
nav button.active{background:#111827;color:#fff}
main{max-width:1200px;margin:auto;padding:22px 20px 60px}
.page-title{margin-bottom:20px}.page-title h1{margin:0 0 5px;font-size:25px}.page-title p{margin:0;color:#6b7280}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 3px 15px #0000000a}
.card h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px;margin-top:6px;outline:0;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:600;margin-bottom:12px}
.primary{padding:11px 17px}.primary:hover{background:#1f2937}
.danger,.success,.secondary,.refresh{border:0;padding:8px 12px;border-radius:8px;font-weight:700}
.danger{background:#dc2626;color:#fff}.success{background:#059669;color:#fff}
.secondary,.refresh{background:#e5e7eb;color:#111827}
.list{display:grid;gap:12px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:15px}
.item h3{margin:0 0 7px}.item p{margin:6px 0;color:#6b7280;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.preview{max-width:180px;max-height:120px;border-radius:8px;margin-top:8px}
.price{font-weight:800;font-size:22px}.total{padding:11px;background:#f3f4f6;border-radius:9px;margin-bottom:12px}
.empty{text-align:center;color:#6b7280;padding:25px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:800}
.active-badge,.approved{background:#d1fae5;color:#065f46}
.inactive-badge,.rejected{background:#fee2e2;color:#991b1b}
.pending{background:#fef3c7;color:#92400e}
.deposit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
@media(max-width:600px){
 header{padding:10px 12px}.brand{font-size:17px}.admin span{display:none}
 .nav-wrap{top:58px}nav{padding:8px 10px}nav button{padding:9px 12px;font-size:13px}
 main{padding:15px 10px 45px}.card{padding:15px}
}
</style>
</head>

<body>

<div id="login" class="login">
<div class="login-box">
<h1>CreateLK Pro</h1>
<p>Administrator Dashboard</p>
<button class="google" onclick="login()">Continue with Google</button>
</div>
</div>

<div id="app" class="app">

<header>
<div class="brand">CreateLK Pro Admin</div>
<div class="admin">
<img id="adminPhoto" alt="">
<span id="adminName"></span>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header>

<div class="nav-wrap">
<nav>
<button class="active" onclick="tab('prompts',this)">✨ Prompts</button>
<button onclick="tab('categories',this)">📁 Categories</button>
<button onclick="tab('packages',this)">📦 Packages</button>
<button onclick="tab('deposits',this)">💎 Deposits</button>
</nav>
</div>

<main>

<div class="page-title">
<h1 id="pageTitle">Prompts</h1>
<p id="pageDescription">Manage your AI prompt library.</p>
</div>

<section id="prompts" class="tab active">

<div class="card">
<h2>Add Prompt</h2>
<form id="promptForm">

<div class="grid">
<label>Title<input id="promptTitle" required></label>

<label>Category
<select id="promptCategory">
<option value="">No category</option>
</select>
</label>
</div>

<label>Description<input id="promptDescription"></label>

<label>Prompt<textarea id="promptText"></textarea></label>

<label>Image
<input id="promptImage" type="file" accept="image/png,image/jpeg,image/webp">
</label>

<button class="primary">Add Prompt</button>
</form>
</div>

<div class="card">
<h2>Prompts</h2>
<div id="promptList" class="list"></div>
</div>

</section>


<section id="categories" class="tab">

<div class="card">
<h2>Add Category</h2>
<form id="categoryForm">
<label>Category name<input id="categoryName" required></label>
<button class="primary">Add Category</button>
</form>
</div>

<div class="card">
<h2>Categories</h2>
<div id="categoryList" class="list"></div>
</div>

</section>


<section id="packages" class="tab">

<div class="card">
<h2>Add Package</h2>

<form id="packageForm">

<div class="grid">

<label>Package name<input id="packageName" required></label>

<label>Paid coins
<input id="packageCredits" type="number" min="100" value="100" required>
</label>

<label>Price LKR
<input id="packagePrice" readonly>
</label>

<label>Bonus coins
<input id="packageBonus" type="number" min="0" value="0">
</label>

</div>

<div class="total">
Total coins: <b id="packageTotal">100</b>
</div>

<label><input id="packagePopular" type="checkbox"> Popular package</label>
<label><input id="packageActive" type="checkbox" checked> Active</label>

<button class="primary">Add Package</button>
</form>
</div>

<div class="card">
<h2>Packages</h2>
<div id="packageList" class="list"></div>
</div>

</section>


<section id="deposits" class="tab">

<div class="card">

<div class="deposit-top">
<h2 style="margin:0">💎 Deposits</h2>
<button class="refresh" onclick="loadDeposits()">↻ Refresh</button>
</div>

<div id="depositList" class="list"></div>

</div>

</section>

</main>
</div>

<script>

const USER_API="https://pro.createlk.workers.dev";
const ADMIN_API="https://pro-admin.createlk.workers.dev";
const APPROVE_API="https://pro-approve.createlk.workers.dev";

const $=id=>document.getElementById(id);

async function api(url,opt={}){
 opt.credentials="include";
 const r=await fetch(url,opt);
 let d={};
 try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function login(){
 location.href=ADMIN_API+"/auth/google";
}

function logout(){
 location.href=ADMIN_API+"/auth/logout";
}

function tab(id,btn){

 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));

 $(id).classList.add("active");
 btn.classList.add("active");

 const t={
  prompts:["Prompts","Manage your AI prompt library."],
  categories:["Categories","Organize prompts into categories."],
  packages:["Packages","Manage coin packages and pricing."],
  deposits:["Deposits","Review and approve customer payments."]
 };

 $("pageTitle").textContent=t[id][0];
 $("pageDescription").textContent=t[id][1];

 if(id==="prompts")loadPrompts();
 if(id==="categories")loadCategories();
 if(id==="packages")loadPackages();
 if(id==="deposits")loadDeposits();
}

async function loadMe(){

 try{

  const d=await api(ADMIN_API+"/api/me");

  if(!d.user){
   $("login").style.display="flex";
   $("app").style.display="none";
   return;
  }

  $("login").style.display="none";
  $("app").style.display="block";

  $("adminName").textContent=d.user.name||d.user.email;

  if(d.user.photo_url)
   $("adminPhoto").src=d.user.photo_url;

  loadCategories();
  loadPrompts();
  loadPackages();
  loadDeposits();

 }catch(e){

  console.error(e);
  $("login").style.display="flex";
  $("app").style.display="none";

 }
}


/* CATEGORIES */

async function loadCategories(){

 try{

  const d=await api(USER_API+"/api/pro/categories");
  const list=d.categories||[];

  $("promptCategory").innerHTML=
   `<option value="">No category</option>`+
   list.map(c=>`
    <option value="${c.id}">${escapeHtml(c.name)}</option>
   `).join("");

  $("categoryList").innerHTML=list.length?
   list.map(c=>`
    <div class="item"><b>${escapeHtml(c.name)}</b></div>
   `).join("")
   :`<div class="empty">No categories</div>`;

 }catch(e){
  $("categoryList").innerHTML=
   `<div class="empty">${escapeHtml(e.message)}</div>`;
 }
}

$("categoryForm").onsubmit=async e=>{

 e.preventDefault();

 try{

  await api(ADMIN_API+"/api/pro/admin/categories",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:$("categoryName").value.trim()
   })
  });

  $("categoryName").value="";
  await loadCategories();
  alert("Category added.");

 }catch(e){
  alert(e.message);
 }
};


/* PROMPTS */

$("promptForm").onsubmit=async e=>{

 e.preventDefault();

 try{

  let image="";
  const file=$("promptImage").files[0];

  if(file){

   if(file.size>10*1024*1024){
    alert("Image must be below 10MB.");
    return;
   }

   image=await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
   });
  }

  await api(ADMIN_API+"/api/pro/admin/prompts",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    title:$("promptTitle").value.trim(),
    description:$("promptDescription").value.trim(),
    prompt:$("promptText").value.trim(),
    category_id:$("promptCategory").value||null,
    image
   })
  });

  $("promptForm").reset();
  await loadPrompts();
  alert("Prompt added.");

 }catch(e){
  alert(e.message);
 }
};

async function loadPrompts(){

 try{

  const d=await api(ADMIN_API+"/api/pro/admin/prompts");
  const list=d.prompts||[];

  $("promptList").innerHTML=list.length?
   list.map(p=>`
    <div class="item">
     <h3>${escapeHtml(p.title||"Untitled")}</h3>
     ${p.description?`<p>${escapeHtml(p.description)}</p>`:""}
     <p>Category: ${escapeHtml(p.category_name||"None")}</p>
     ${p.image_url?`<img class="preview" src="${p.image_url}">`:""}
    </div>
   `).join("")
   :`<div class="empty">No prompts</div>`;

 }catch(e){
  $("promptList").innerHTML=
   `<div class="empty">${escapeHtml(e.message)}</div>`;
 }
}


/* PACKAGES */

function updatePackageTotal(){

 const credits=Number($("packageCredits").value)||0;
 const bonus=Number($("packageBonus").value)||0;

 $("packagePrice").value=credits;
 $("packageTotal").textContent=credits+bonus;
}

$("packageCredits").oninput=updatePackageTotal;
$("packageBonus").oninput=updatePackageTotal;

$("packageForm").onsubmit=async e=>{

 e.preventDefault();

 const credits=Number($("packageCredits").value);
 const bonus=Number($("packageBonus").value)||0;

 if(!Number.isInteger(credits)||credits<100){
  alert("Minimum package is 100 coins.");
  return;
 }

 try{

  await api(ADMIN_API+"/api/pro/admin/packages",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:$("packageName").value.trim(),
    credits,
    bonus,
    popular:$("packagePopular").checked,
    active:$("packageActive").checked
   })
  });

  $("packageForm").reset();
  $("packageCredits").value=100;
  $("packageBonus").value=0;
  $("packageActive").checked=true;

  updatePackageTotal();
  await loadPackages();

  alert("Package added.");

 }catch(e){
  alert(e.message);
 }
};

async function loadPackages(){

 try{

  const d=await api(ADMIN_API+"/api/pro/admin/packages");
  const list=d.packages||[];

  $("packageList").innerHTML=list.length?
   list.map(p=>`
    <div class="item">

     <h3>
      ${escapeHtml(p.name)}
      ${p.popular?` <span class="badge">POPULAR</span>`:""}
     </h3>

     <p>Paid coins: <b>${p.credits}</b></p>
     <p>Bonus: <b>${p.bonus}</b></p>
     <p>Total: <b>${Number(p.credits)+Number(p.bonus)}</b></p>
     <p class="price">LKR ${p.price}</p>

     ${
      p.active
      ?`<span class="badge active-badge">ACTIVE</span>`
      :`<span class="badge inactive-badge">INACTIVE</span>`
     }

     <div class="actions">
      <button class="secondary" onclick="editPackage(${p.id})">Edit</button>
      <button class="danger" onclick="deletePackage(${p.id})">Delete</button>
     </div>

    </div>
   `).join("")
   :`<div class="empty">No packages</div>`;

 }catch(e){
  $("packageList").innerHTML=
   `<div class="empty">${escapeHtml(e.message)}</div>`;
 }
}

async function editPackage(id){

 const name=prompt("Package name:");
 if(name===null)return;

 const credits=Number(prompt("Paid coins:","100"));
 if(!Number.isInteger(credits)||credits<100){
  alert("Minimum is 100 coins.");
  return;
 }

 const bonus=Number(prompt("Bonus coins:","0"));
 if(!Number.isInteger(bonus)||bonus<0){
  alert("Invalid bonus.");
  return;
 }

 const popular=confirm("Make this Popular?");
 const active=confirm("Keep this package Active?");

 try{

  await api(ADMIN_API+"/api/pro/admin/packages/"+id,{
   method:"PUT",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,credits,bonus,popular,active})
  });

  loadPackages();

 }catch(e){
  alert(e.message);
 }
}

async function deletePackage(id){

 if(!confirm("Delete this package?"))return;

 try{

  await api(ADMIN_API+"/api/pro/admin/packages/"+id,{
   method:"DELETE"
  });

  loadPackages();

 }catch(e){
  alert(e.message);
 }
}


/* DEPOSITS */

async function loadDeposits(){

 try{

  const d=await api(ADMIN_API+"/api/pro/admin/deposits");
  const list=d.deposits||[];

  $("depositList").innerHTML=list.length?
   list.map(x=>`

    <div class="item">

     <h3>Deposit #${x.id}</h3>

     <p>User: ${escapeHtml(x.name||"")}</p>
     <p>Email: ${escapeHtml(x.email||"")}</p>

     <p>
      Amount:
      <b>LKR ${x.amount??x.credits??0}</b>
     </p>

     <p>
      Status:
      <span class="badge ${escapeHtml(x.status||"")}">
       ${escapeHtml(x.status||"")}
      </span>
     </p>

     ${
      x.receipt_url
      ?`<p>
        <a href="${x.receipt_url}" target="_blank" rel="noopener">
         📷 View Payment Slip
        </a>
       </p>`
      :""
     }

     ${
      x.status==="pending"
      ?`
       <div class="actions">

        <button
         class="success"
         onclick="depositAction(${x.id},'approve')">
         ✓ Approve
        </button>

        <button
         class="danger"
         onclick="depositAction(${x.id},'reject')">
         ✕ Reject
        </button>

       </div>
      `
      :""
     }

    </div>

   `).join("")
   :`<div class="empty">No deposits</div>`;

 }catch(e){

  $("depositList").innerHTML=
   `<div class="empty">${escapeHtml(e.message)}</div>`;
 }
}


/* APPROVE = SEPARATE WORKER
   REJECT = ADMIN WORKER */

async function depositAction(id,action){

 const message=
  action==="approve"
  ?"Approve this deposit and add the coins?"
  :"Reject this deposit?";

 if(!confirm(message))return;

 try{

  if(action==="approve"){

   await api(
    APPROVE_API+"/api/pro/admin/deposits/"+id,
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      action:"approve"
     })
    }
   );

  }else{

   await api(
    ADMIN_API+"/api/pro/admin/deposits/"+id,
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      action:"reject"
     })
    }
   );

  }

  await loadDeposits();

  alert(
   action==="approve"
   ?"Deposit approved and coins added."
   :"Deposit rejected."
  );

 }catch(e){

  alert(e.message||"Action failed.");

 }
}


/* SECURITY */

function escapeHtml(x){

 return String(x??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* START */

updatePackageTotal();
loadMe();

</script>

</body>
</html>
