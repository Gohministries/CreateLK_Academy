<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Pro Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#111827}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box,.card{background:#fff;border-radius:15px;box-shadow:0 3px 15px #0000000a}
.login-box{width:100%;max-width:400px;padding:30px;text-align:center}
.login-box p,.item p,.page-title p{color:#6b7280}
.google,.primary,.success,.danger,.edit,.refresh,.secondary,.slip{border:0;border-radius:8px;padding:10px 13px;font-weight:700}
.google,.primary{background:#111827;color:#fff}.google{width:100%}
.app{display:none}header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:900}.admin{display:flex;align-items:center;gap:9px}.admin img{width:38px;height:38px;border-radius:50%}
.logout{background:#374151;color:#fff;border:0;border-radius:8px;padding:9px 12px}
.nav-wrap{position:sticky;top:63px;z-index:4;background:#fff;border-bottom:1px solid #ddd}
nav{max-width:1200px;margin:auto;padding:8px 20px;display:flex;gap:7px;overflow:auto}
nav button{border:0;background:#f3f4f6;padding:9px 13px;border-radius:8px;font-weight:700;white-space:nowrap}
nav button.active{background:#111827;color:#fff}
main{max-width:1200px;margin:auto;padding:20px}.page-title{margin-bottom:20px}.page-title h1{margin:0 0 5px}
.tab{display:none}.tab.active{display:block}.card{padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:600;margin-bottom:12px}input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}.list{display:grid;gap:10px}.item{border:1px solid #e5e7eb;border-radius:10px;padding:14px}.item h3{margin:0 0 7px}.item p{margin:6px 0;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.edit{background:#4f46e5;color:#fff}.secondary,.refresh{background:#e5e7eb;color:#111827}
.preview{max-width:220px;max-height:150px;border-radius:8px;margin-top:7px}.empty{text-align:center;color:#6b7280;padding:20px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700}
.active-badge{background:#d1fae5;color:#065f46}.inactive-badge{background:#fee2e2;color:#991b1b}
.price{font-size:20px;font-weight:800}.total{background:#f3f4f6;padding:10px;border-radius:8px;margin-bottom:10px}
.edit-box{display:none;background:#f9fafb;border:1px solid #ddd;padding:12px;border-radius:9px;margin-top:10px}.edit-box.show{display:block}
.deposit-top{display:flex;justify-content:space-between;align-items:center}
.slip{display:inline-block;background:#111827;color:#fff;text-decoration:none;margin-top:8px}
.slip-preview{display:block;width:100%;max-width:450px;max-height:400px;object-fit:contain;margin-top:10px;border:1px solid #ddd;border-radius:8px}
@media(max-width:600px){header{padding:10px}.brand{font-size:17px}.admin span{display:none}.nav-wrap{top:58px}nav{padding:8px 10px}main{padding:12px}.card{padding:14px}}
</style>
</head>
<body><div id="login" class="login">
<div class="login-box">
<h1>CreateLK Pro</h1>
<p>Administrator Dashboard</p>
<button class="google" onclick="login()">Continue with Google</button>
</div>
</div><div id="app" class="app">
<header>
<div class="brand">CreateLK Pro Admin</div>
<div class="admin">
<img id="adminPhoto" alt="">
<span id="adminName"></span>
<button class="logout" onclick="logout()">Logout</button>
</div>
</header><div class="nav-wrap"><nav>
<button class="active" onclick="tab('prompts',this)">✨ Prompts</button>
<button onclick="tab('categories',this)">📁 Categories</button>
<button onclick="tab('packages',this)">📦 Packages</button>
<button onclick="tab('deposits',this)">💎 Deposits</button>
</nav></div><main>
<div class="page-title">
<h1 id="pageTitle">Prompts</h1>
<p id="pageDescription">Manage your AI prompt library.</p>
</div><section id="prompts" class="tab active">
<div class="card">
<h2>Add Prompt</h2>
<form id="promptForm">
<div class="grid">
<label>Title<input id="promptTitle" required></label>
<label>Category<select id="promptCategory"><option value="">No category</option></select></label>
</div>
<label>Description<input id="promptDescription"></label>
<label>Prompt<textarea id="promptText"></textarea></label>
<label>Photo<input id="promptImage" type="file" accept="image/png,image/jpeg,image/webp"></label>
<button class="primary">Add Prompt</button>
</form>
</div>
<div class="card">
<h2>Prompts</h2>
<input id="promptSearch" placeholder="🔍 Search prompts...">
<div id="promptList" class="list" style="margin-top:12px"></div>
</div>
</section><section id="categories" class="tab">
<div class="card">
<h2>Add Category</h2>
<form id="categoryForm">
<label>Category name<input id="categoryName" required></label>
<button class="primary">Add Category</button>
</form>
</div>
<div class="card"><h2>Categories</h2><div id="categoryList" class="list"></div></div>
</section><section id="packages" class="tab">
<div class="card">
<h2>Add Package</h2>
<form id="packageForm">
<div class="grid">
<label>Name<input id="packageName" required></label>
<label>Paid coins<input id="packageCredits" type="number" min="100" value="100" required></label>
<label>Price LKR<input id="packagePrice" readonly></label>
<label>Bonus coins<input id="packageBonus" type="number" min="0" value="0"></label>
</div>
<div class="total">Total coins: <b id="packageTotal">100</b></div>
<label><input id="packagePopular" type="checkbox"> Popular</label>
<label><input id="packageActive" type="checkbox" checked> Active</label>
<button class="primary">Add Package</button>
</form>
</div>
<div class="card"><h2>Packages</h2><div id="packageList" class="list"></div></div>
</section><section id="deposits" class="tab">
<div class="card">
<div class="deposit-top">
<h2>💎 Deposits</h2>
<button class="refresh" onclick="loadDeposits()">↻ Refresh</button>
</div>
<div id="depositList" class="list"></div>
</div>
</section>
</main>
</div><script>
const USER_API="https://pro.createlk.workers.dev";
const ADMIN_API="https://pro-admin.createlk.workers.dev";
const APPROVE_API="https://pro-approve.createlk.workers.dev";
const $=id=>document.getElementById(id);

async function api(url,opt={}){
 opt.credentials="include";
 const r=await fetch(url,opt);
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function esc(x){
 return String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
const attr=esc;

function login(){location.href=ADMIN_API+"/auth/google"}
function logout(){location.href=ADMIN_API+"/auth/logout"}

function tab(id,btn){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");btn.classList.add("active");
 const t={
 prompts:["Prompts","Manage your AI prompt library."],
 categories:["Categories","Organize prompts into categories."],
 packages:["Packages","Manage coin packages and pricing."],
 deposits:["Deposits","Review and approve customer payments."]
 };
 $("pageTitle").textContent=t[id][0];
 $("pageDescription").textContent=t[id][1];
 if(id==="prompts")loadPrompts();
 if(id==="categories")loadCategories();
 if(id==="packages")loadPackages();
 if(id==="deposits")loadDeposits();
}

/* AUTH */
async function loadMe(){
 try{
  const d=await api(ADMIN_API+"/api/me");
  if(!d.user)return;
  $("login").style.display="none";
  $("app").style.display="block";
  $("adminName").textContent=d.user.name||d.user.email||"Admin";
  if(d.user.photo_url)$("adminPhoto").src=d.user.photo_url;
  await Promise.all([loadCategories(),loadPrompts(),loadPackages(),loadDeposits()]);
 }catch(e){console.error(e)}
}

/* CATEGORIES */
let categories=[];
async function loadCategories(){
 try{
  const d=await api(USER_API+"/api/pro/categories");
  categories=d.categories||[];
  $("promptCategory").innerHTML='<option value="">No category</option>'+
   categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("categoryList").innerHTML=categories.length
   ?categories.map(c=>`<div class="item"><b>${esc(c.name)}</b></div>`).join("")
   :'<div class="empty">No categories</div>';
 }catch(e){$("categoryList").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

$("categoryForm").onsubmit=async e=>{
 e.preventDefault();
 try{
  await api(ADMIN_API+"/api/pro/admin/categories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("categoryName").value.trim()})});
  $("categoryForm").reset();await loadCategories();alert("Category added.");
 }catch(e){alert(e.message)}
};

/* IMAGE */
function imageData(file){
 return new Promise((resolve,reject)=>{
  if(!file)return resolve("");
  if(file.size>10*1024*1024)return reject(Error("Image must be below 10MB."));
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
 });
}

/* PROMPTS */
$("promptForm").onsubmit=async e=>{
 e.preventDefault();
 try{
  const image=await imageData($("promptImage").files[0]);
  await api(ADMIN_API+"/api/pro/admin/prompts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   title:$("promptTitle").value.trim(),description:$("promptDescription").value.trim(),
   prompt:$("promptText").value.trim(),category_id:$("promptCategory").value||null,image
  })});
  $("promptForm").reset();await loadPrompts();alert("Prompt added.");
 }catch(e){alert(e.message)}
};

let prompts=[];
async function loadPrompts(){
 try{
  const d=await api(ADMIN_API+"/api/pro/admin/prompts");
  prompts=d.prompts||[];renderPrompts();
 }catch(e){$("promptList").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
$("promptSearch").oninput=renderPrompts;

function renderPrompts(){
 const q=$("promptSearch").value.toLowerCase().trim();
 const list=prompts.filter(p=>[p.title,p.description,p.prompt,p.category_name].join(" ").toLowerCase().includes(q));
 $("promptList").innerHTML=list.length?list.map(promptCard).join(""):'<div class="empty">No prompts found.</div>';
}

function promptCard(p){
 const id=Number(p.id);
 return `<div class="item">
 <h3>${esc(p.title||"Untitled")}</h3>
 ${p.description?`<p>${esc(p.description)}</p>`:""}
 <p>Category: <b>${esc(p.category_name||"None")}</b></p>
 ${p.prompt?`<p><b>Prompt:</b><br>${esc(p.prompt)}</p>`:""}
 ${p.image_url?`<img class="preview" src="${esc(p.image_url)}">`:""}
 <div class="actions">
 <button class="edit" onclick="editPrompt(${id})">✏️ Edit</button>
 <button class="secondary" onclick="photoPrompt(${id})">🖼️ Photo</button>
 </div>
 <div id="edit-${id}" class="edit-box">
 <label>Title<input id="title-${id}" value="${attr(p.title||"")}"></label>
 <label>Description<input id="desc-${id}" value="${attr(p.description||"")}"></label>
 <label>Category<select id="cat-${id}"><option value="">No category</option>${categories.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(p.category_id)?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
 <label>Prompt<textarea id="text-${id}">${esc(p.prompt||"")}</textarea></label><label>New Photo<input id="photo-${id}" type="file" accept="image/png,image/jpeg,image/webp"></label>

 <div class="actions"><button class="success" onclick="savePrompt(${id})">✓ Save</button><button class="secondary" onclick="editPrompt(${id})">Cancel</button></div>
 </div></div>`;
}function editPrompt(id){$("edit-"+id).classList.toggle("show")}
function photoPrompt(id){$("edit-"+id).classList.add("show");$("photo-"+id).click()}

async function savePrompt(id){
try{
const image=await imageData($("photo-"+id).files[0]);
const body={
title:$("title-"+id).value.trim(),description:$("desc-"+id).value.trim(),
prompt:$("text-"+id).value.trim(),category_id:$("cat-"+id).value||null
};
if(image)body.image=image;
await api(ADMIN_API+"/api/pro/admin/prompts/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
await loadPrompts();alert("Prompt updated.");
}catch(e){alert(e.message)}
}

/* PACKAGES */
function updatePackageTotal(){
const c=Number($("packageCredits").value)||0,b=Number($("packageBonus").value)||0;
$("packagePrice").value=c;$("packageTotal").textContent=c+b;
}
$("packageCredits").oninput=updatePackageTotal;
$("packageBonus").oninput=updatePackageTotal;

$("packageForm").onsubmit=async e=>{
e.preventDefault();
const credits=Number($("packageCredits").value),bonus=Number($("packageBonus").value)||0;
if(!Number.isInteger(credits)||credits<100)return alert("Minimum package is 100 coins.");
try{
await api(ADMIN_API+"/api/pro/admin/packages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
name:$("packageName").value.trim(),credits,bonus,popular:$("packagePopular").checked,active:$("packageActive").checked
})});
$("packageForm").reset();$("packageCredits").value=100;$("packageBonus").value=0;$("packageActive").checked=true;
updatePackageTotal();await loadPackages();alert("Package added.");
}catch(e){alert(e.message)}
};

async function loadPackages(){
try{
const d=await api(ADMIN_API+"/api/pro/admin/packages"),list=d.packages||[];
$("packageList").innerHTML=list.length?list.map(p=>`

  <div class="item">
   <h3>${esc(p.name)} ${p.popular?'<span class="badge">POPULAR</span>':""}</h3>
   <p>Paid: <b>${esc(p.credits)}</b> | Bonus: <b>${esc(p.bonus)}</b> | Total: <b>${Number(p.credits)+Number(p.bonus)}</b></p>
   <p class="price">LKR ${esc(p.price)}</p>
   <span class="badge ${p.active?"active-badge":"inactive-badge"}">${p.active?"ACTIVE":"INACTIVE"}</span>
   <div class="actions">
    <button class="secondary" onclick="editPackage(${Number(p.id)})">Edit</button>
    <button class="danger" onclick="deletePackage(${Number(p.id)})">Delete</button>
   </div>
  </div>`).join(""):'<div class="empty">No packages</div>';
 }catch(e){$("packageList").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}async function editPackage(id){
const name=prompt("Package name:");if(name===null)return;
const credits=Number(prompt("Paid coins:","100"));if(!Number.isInteger(credits)||credits<100)return alert("Minimum is 100.");
const bonus=Number(prompt("Bonus coins:","0"));if(!Number.isInteger(bonus)||bonus<0)return alert("Invalid bonus.");
try{
await api(ADMIN_API+"/api/pro/admin/packages/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,credits,bonus,popular:confirm("Popular?"),active:confirm("Active?")})});
loadPackages();
}catch(e){alert(e.message)}
}

async function deletePackage(id){
if(!confirm("Delete this package?"))return;
try{await api(ADMIN_API+"/api/pro/admin/packages/"+id,{method:"DELETE"});loadPackages()}
catch(e){alert(e.message)}
}

/* DEPOSITS + PAYMENT SLIP */
function slipUrl(d){
return d.receipt_url||d.payment_slip||d.slip_url||d.receipt||d.proof_url||d.payment_proof||"";
}

function slipHtml(d){
const url=slipUrl(d);
if(!url)return '<p>No payment slip uploaded.</p>';
const image=/.(jpg|jpeg|png|webp|gif)(?.*)?$/i.test(url);
return "<div class="slip-box"> <b>Payment Slip</b><br> ${image?"<img class="slip-preview" src="${esc(url)}" alt="Payment Slip">`:""}
<a class="slip" href="${esc(url)}" target="_blank" rel="noopener noreferrer">📷 View Payment Slip</a>

 </div>`;
}async function loadDeposits(){
try{
const d=await api(ADMIN_API+"/api/pro/admin/deposits"),list=d.deposits||[];
$("depositList").innerHTML=list.length?list.map(x=>`

  <div class="item">
   <h3>Deposit #${esc(x.id)}</h3>
   <p>User: ${esc(x.name||"")}</p>
   <p>Email: ${esc(x.email||"")}</p>
   <p>Amount: <b>LKR ${esc(x.amount??x.credits??0)}</b></p>
   <p>Status: <span class="badge">${esc(x.status||"")}</span></p>
   ${slipHtml(x)}
   ${x.status==="pending"?`<div class="actions">
    <button class="success" onclick="depositAction(${Number(x.id)},'approve')">✓ Approve</button>
    <button class="danger" onclick="depositAction(${Number(x.id)},'reject')">✕ Reject</button>
   </div>`:""}
  </div>`).join(""):'<div class="empty">No deposits</div>';
 }catch(e){$("depositList").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}async function depositAction(id,action){
if(!confirm(action==="approve"?"Approve this deposit and add coins?":"Reject this deposit?"))return;
try{
const apiUrl=action==="approve"?APPROVE_API:ADMIN_API;
await api(apiUrl+"/api/pro/admin/deposits/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action})});
await loadDeposits();alert(action==="approve"?"Deposit approved.":"Deposit rejected.");
}catch(e){alert(e.message)}
}

/* START */
updatePackageTotal();
loadMe();

</script>
</body>
</html>
