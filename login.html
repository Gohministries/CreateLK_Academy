<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreateLK — Login & Register</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#f5f7ff,#eef6ff,#f8f9ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#172033;
}

.container{
  width:100%;
  max-width:440px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(20,40,80,.12);
  border:1px solid #e9edf5;
}

.logo-area{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:82px;
  height:82px;
  object-fit:contain;
  margin-bottom:12px;
}

.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.5px;
}

.subtitle{
  color:#687386;
  font-size:14px;
  margin-top:6px;
}

.tabs{
  display:flex;
  background:#f1f4f9;
  padding:5px;
  border-radius:13px;
  margin-bottom:25px;
}

.tab{
  width:50%;
  border:0;
  background:transparent;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  color:#697386;
}

.tab.active{
  background:#fff;
  color:#155eef;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
  color:#303b4f;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #dce2eb;
  border-radius:11px;
  outline:none;
  font-size:14px;
  transition:.2s;
}

input:focus{
  border-color:#4c8bf5;
  box-shadow:0 0 0 3px rgba(76,139,245,.1);
}

.row{
  display:flex;
  gap:12px;
}

.row .field{
  width:50%;
}

.button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  background:#155eef;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.button:hover{
  background:#0f4dcc;
}

.button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:13px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.error{
  background:#fff1f1;
  color:#c62828;
  border:1px solid #ffd5d5;
}

.message.success{
  background:#effbf3;
  color:#19733a;
  border:1px solid #ccefd8;
}

.footer{
  text-align:center;
  margin-top:22px;
  font-size:12px;
  color:#7a8494;
  line-height:1.7;
}

.footer a{
  color:#155eef;
  text-decoration:none;
}

.loading{
  display:inline-block;
  width:15px;
  height:15px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:480px){
  .card{
    padding:24px 20px;
    border-radius:20px;
  }

  .row{
    flex-direction:column;
    gap:0;
  }

  .row .field{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo-area">

      <!-- Replace with your CreateLK logo -->
      <img
        class="logo"
        src="https://assets.createlk.com/file_00000000f97082119cf85b0ae761f096.png"
        alt="CreateLK"
      >

      <div class="brand">CreateLK</div>

      <div class="subtitle">
        Sign in or create your account
      </div>

    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showForm('login')">
        Login
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showForm('register')">
        Create Account
      </button>

    </div>

    <div
      id="message"
      class="message">
    </div>


    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active"
      onsubmit="login(event)">

      <div class="field">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="field">

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>

      </div>


      <button
        id="loginButton"
        class="button"
        type="submit">

        Login

      </button>

    </form>


    <!-- REGISTER -->

    <form
      id="registerForm"
      class="form"
      onsubmit="register(event)">

      <div class="row">

        <div class="field">

          <label>First Name</label>

          <input
            id="firstName"
            type="text"
            placeholder="First name"
            autocomplete="given-name"
            required>

        </div>

        <div class="field">

          <label>Last Name</label>

          <input
            id="lastName"
            type="text"
            placeholder="Last name"
            autocomplete="family-name">

        </div>

      </div>


      <div class="field">

        <label>Email</label>

        <input
          id="registerEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="field">

        <label>Phone</label>

        <input
          id="phone"
          type="tel"
          placeholder="Phone number"
          autocomplete="tel">

      </div>


      <div class="field">

        <label>Password</label>

        <input
          id="registerPassword"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          autocomplete="new-password"
          required>

      </div>


      <button
        id="registerButton"
        class="button"
        type="submit">

        Create Account

      </button>

    </form>


    <div class="footer">

      By continuing, you agree to our
      <a href="/terms.html">Terms</a>
      and
      <a href="/privacy.html">Privacy Policy</a>.

    </div>

  </div>

</div>


<script>

const API =
  "https://createlk-auth-api.createlk.workers.dev";


/* MESSAGE */

function showMessage(text,type="error"){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message show " + type;
}


/* CLEAR MESSAGE */

function clearMessage(){

  const box =
    document.getElementById("message");

  box.className =
    "message";

  box.textContent = "";

}


/* SWITCH FORM */

function showForm(type){

  clearMessage();

  const login =
    document.getElementById("loginForm");

  const register =
    document.getElementById("registerForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");


  if(type === "login"){

    login.classList.add("active");
    register.classList.remove("active");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  }else{

    register.classList.add("active");
    login.classList.remove("active");

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

  }

}


/* LOGIN */

async function login(event){

  event.preventDefault();

  clearMessage();

  const button =
    document.getElementById("loginButton");

  const email =
    document.getElementById("loginEmail").value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("loginPassword").value;


  button.disabled = true;

  button.innerHTML =
    '<span class="loading"></span>Logging in...';


  try{

    const res =
      await fetch(API + "/auth/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email,
          password
        })

      });


    const data =
      await res.json();


    if(!res.ok || !data.success){

      throw new Error(
        data.error || "Login failed."
      );

    }


    if(!data.token){

      throw new Error(
        "Login succeeded but no token was received."
      );

    }


    /* SAVE LOGIN TOKEN */

    localStorage.setItem(
      "createlk_token",
      data.token
    );


    /* SAVE CUSTOMER */

    if(data.customer){

      localStorage.setItem(
        "createlk_customer",
        JSON.stringify(data.customer)
      );

    }


    showMessage(
      "Login successful. Redirecting...",
      "success"
    );


    /*
      Change this page to your
      desired account/dashboard page.
    */

    setTimeout(()=>{

      const params =
        new URLSearchParams(
          window.location.search
        );

      const redirect =
        params.get("redirect");


      if(
        redirect &&
        redirect.startsWith("/") &&
        !redirect.startsWith("//")
      ){

        window.location.href =
          redirect;

      }else{

        window.location.href =
          "/account.html";

      }

    },700);


  }catch(error){

    showMessage(
      error.message ||
      "Unable to login.",
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Login";

  }

}


/* REGISTER */

async function register(event){

  event.preventDefault();

  clearMessage();

  const button =
    document.getElementById("registerButton");


  const first_name =
    document.getElementById("firstName").value
      .trim();

  const last_name =
    document.getElementById("lastName").value
      .trim();

  const email =
    document.getElementById("registerEmail").value
      .trim()
      .toLowerCase();

  const phone =
    document.getElementById("phone").value
      .trim();

  const password =
    document.getElementById("registerPassword").value;


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.innerHTML =
    '<span class="loading"></span>Creating account...';


  try{

    const res =
      await fetch(API + "/auth/register",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          first_name,
          last_name,
          email,
          phone,
          password

        })

      });


    const data =
      await res.json();


    if(!res.ok || !data.success){

      throw new Error(
        data.error ||
        "Registration failed."
      );

    }


    if(!data.token){

      throw new Error(
        "Account created but no login token was received."
      );

    }


    /* SAVE TOKEN */

    localStorage.setItem(
      "createlk_token",
      data.token
    );


    /* SAVE CUSTOMER */

    if(data.customer){

      localStorage.setItem(
        "createlk_customer",
        JSON.stringify(data.customer)
      );

    }


    showMessage(
      "Account created successfully. Redirecting...",
      "success"
    );


    setTimeout(()=>{

      window.location.href =
        "/account.html";

    },700);


  }catch(error){

    showMessage(
      error.message ||
      "Unable to create account.",
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Create Account";

  }

}


/* CHECK EXISTING LOGIN */

async function checkExistingLogin(){

  const token =
    localStorage.getItem(
      "createlk_token"
    );


  if(!token) return;


  try{

    const res =
      await fetch(
        API + "/auth/me",
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await res.json();


    if(res.ok && data.success){

      /*
        User is already logged in.
        You can redirect automatically
        if desired.
      */

      console.log(
        "Already logged in:",
        data.customer
      );

    }else{

      localStorage.removeItem(
        "createlk_token"
      );

      localStorage.removeItem(
        "createlk_customer"
      );

    }

  }catch(error){

    console.error(
      "Session check failed:",
      error
    );

  }

}


checkExistingLogin();

</script>

</body>
</html>
