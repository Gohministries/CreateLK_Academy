<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1"><title>Login | CreateLK Academy</title><style>

.switch{

</style></head><body><header>
<a href="index.html">← Home</a>
</header><div class="container"><div class="card"><div class="logo">
📚 CreateLK Academy
</div><p class="subtitle">
Learn English. Build Your Future.
</p><div class="switch"><button
id="loginTab"
class="active"
type="button"
onclick="showLogin()">
🔐 Login
</button>

<button
id="registerTab"
type="button"
onclick="showRegister()">
📝 Register
</button>

</div><!-- LOGIN --><div id="loginBox"><h2>Welcome Back</h2><p class="subtitle">
Login to your account
</p><form id="loginForm"><label>
Email Address
</label><input
id="loginEmail"
type="email"
placeholder="Enter your email"
required

«»

<label>
Password
</label><input
id="loginPassword"
type="password"
placeholder="Enter your password"
required

«»

<label class="stay"><input
id="stayLogin"
type="checkbox"
checked

«»

Stay logged in

</label><button
class="mainbtn"
id="loginBtn"
type="submit">
Login
</button>

</form><div
id="loginMessage"
class="message">
</div></div><!-- REGISTER --><div
id="registerBox"
class="hidden"><h2>Create Account</h2><p class="subtitle">
Join CreateLK Academy
</p><form id="registerForm"><label>
Full Name
</label><input
id="registerName"
type="text"
placeholder="Enter your name"
required

«»

<label>
Email Address
</label><input
id="registerEmail"
type="email"
placeholder="Enter your email"
required

«»

<label>
Password
</label><input
id="registerPassword"
type="password"
placeholder="Minimum 8 characters"
minlength="8"
required

«»

<label>
Confirm Password
</label><input
id="registerConfirm"
type="password"
placeholder="Confirm password"
minlength="8"
required

«»

<button
class="mainbtn"
id="registerBtn"
type="submit">
Create Account
</button>

</form><div
id="registerMessage"
class="message">
</div></div><a
class="back"
href="index.html">
🏠 Back to CreateLK Academy
</a>

</div><div class="security">
🔒 Securely processed by Cloudflare
</div></div><script>

const WORKER_URL =
"https://createlk-academy-api.createlk.workers.dev";


/* =========================================
   SWITCH
========================================= */

function showLogin(){

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("registerBox")
.classList.add("hidden");

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("registerTab")
.classList.remove("active");

}


function showRegister(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("registerBox")
.classList.remove("hidden");

document
.getElementById("loginTab")
.classList.remove("active");

document
.getElementById("registerTab")
.classList.add("active");

}


/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const btn =
document.getElementById(
"loginBtn"
);

const message =
document.getElementById(
"loginMessage"
);

const email =
document.getElementById(
"loginEmail"
)
.value
.trim()
.toLowerCase();

const password =
document.getElementById(
"loginPassword"
).value;


btn.disabled=true;
btn.textContent="Logging in...";
message.textContent="";


try{

const response =
await fetch(
WORKER_URL + "/api/login",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

message.textContent =
data.message ||
"Invalid email or password.";

btn.disabled=false;
btn.textContent="Login";

return;

}


/*
IMPORTANT:
Store the Worker token too.

This allows premium-course.html
and payment.html to authenticate
even if the browser does not send
the cookie as expected.
*/

if(data.token){

localStorage.setItem(
"createlk_token",
data.token
);

}


if(data.user){

localStorage.setItem(
"createlk_user",
JSON.stringify(
data.user
)
);

}


message.textContent =
"✅ Login successful. Checking membership...";


/* =========================================
   MEMBERSHIP CHECK
========================================= */

const headers = {};

if(data.token){

headers.Authorization =
"Bearer " + data.token;

}


const membershipResponse =
await fetch(
WORKER_URL +
"/api/membership",
{
method:"GET",

credentials:"include",

headers:headers
}
);


const membership =
await membershipResponse.json();


if(
membership.loggedIn &&
membership.active
){

/*
APPROVED PREMIUM USER
*/

window.location.replace(
"premium-course.html"
);

}else{

/*
LOGGED IN BUT NOT PREMIUM
*/

window.location.replace(
"payment.html"
);

}


}
catch(error){

console.error(error);

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent="Login";

}

});


/* =========================================
   REGISTER
========================================= */

document
.getElementById("registerForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const name =
document.getElementById(
"registerName"
)
.value
.trim();

const email =
document.getElementById(
"registerEmail"
)
.value
.trim()
.toLowerCase();

const password =
document.getElementById(
"registerPassword"
).value;

const confirm =
document.getElementById(
"registerConfirm"
).value;

const message =
document.getElementById(
"registerMessage"
);

const btn =
document.getElementById(
"registerBtn"
);


if(password.length < 8){

message.textContent =
"Password must contain at least 8 characters.";

return;

}


if(password !== confirm){

message.textContent =
"Passwords do not match.";

return;

}


btn.disabled=true;
btn.textContent="Creating Account...";
message.textContent="";


try{

const response =
await fetch(
WORKER_URL +
"/api/register",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
name:name,
email:email,
password:password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

message.textContent =
data.message ||
"Registration failed.";

btn.disabled=false;
btn.textContent=
"Create Account";

return;

}


message.textContent =
"✅ Account created successfully!";


document
.getElementById("registerForm")
.reset();


setTimeout(
function(){

showLogin();

document
.getElementById("loginEmail")
.value=email;

},
1000
);


}
catch(error){

console.error(error);

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent=
"Create Account";

}

});

</script></body>
</html>
