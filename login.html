</div></div></main><script>

/*
=========================================================
CREATE LK ACADEMY
LOGIN FRONTEND
=========================================================

IMPORTANT:

This is a NEW website.

The Cloudflare Worker API will be created separately.

Do NOT put:
- API tokens
- PayHere secrets
- Admin passwords
- Cloudflare secrets

inside this file.

The API URL will be added when the new Worker
is created.
=========================================================
*/


/*
---------------------------------------------------------
NEW CLOUDFLARE WORKER URL
---------------------------------------------------------

After we create the new Worker, replace this placeholder
with the NEW Worker URL.

Example:

const API_URL =
"https://YOUR-NEW-WORKER.workers.dev";

Do NOT use your old Worker URL.
---------------------------------------------------------
*/

const API_URL = "";


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


form.addEventListener("submit",async function(event){

    event.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    /*
    Backend is not connected yet.
    */

    if(!API_URL){

        showMessage(
            "Login system is being connected. Please try again after the backend is configured.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const response =
            await fetch(
                API_URL + "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Login failed."
            );

        }


        /*
        The backend will return a secure
        authentication token/session.

        We will define the exact response
        format when creating the Worker.
        */

        if(data.token){

            sessionStorage.setItem(
                "createlk_token",
                data.token
            );

        }


        if(data.user){

            sessionStorage.setItem(
                "createlk_user",
                JSON.stringify(data.user)
            );

        }


        showMessage(
            "Login successful. Opening your account...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "premium-course.html";

        },800);


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to connect to the server.",
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Login";

    }

});

</script></body>
