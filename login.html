<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | CreateLK Academy</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#123b70;padding:18px}header a{color:#fff;text-decoration:none}
.box{max-width:420px;margin:50px auto;padding:20px}
.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0002}
h1{text-align:center}.sub{text-align:center;color:#667085}
label{display:block;margin-top:16px;font-weight:bold}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ccd3df;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;background:#1769e0;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.links{text-align:center;margin-top:20px}.links a{color:#1769e0}
#msg{text-align:center;margin-top:15px;font-weight:bold}
</style>
</head>
<body>

<header><a href="index.html">← Home</a></header>

<div class="box">
<div class="card">
<h1>🔐 Welcome Back</h1>
<p class="sub">Login to your CreateLK Academy account</p>

<form id="form">
<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required>

<label>Password</label>
<input id="password" type="password" placeholder="Enter your password" required>

<button id="btn">Login</button>
</form>

<div id="msg"></div>

<div class="links">
<p>Don't have an account?
<a href="register.html">Create Account</a></p>
<p><a href="index.html">Back to CreateLK Academy</a></p>
</div>
</div>

<p style="text-align:center;color:#667085">
🔒 Secure Cloudflare login
</p>
</div>

<script>
const WORKER_URL="https://YOUR-WORKER.workers.dev";

form.onsubmit=async e=>{
e.preventDefault();
btn.disabled=true;
btn.textContent="Logging in...";
msg.textContent="";

try{
const r=await fetch(WORKER_URL+"/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
});

const d=await r.json();

if(!d.success){
msg.textContent=d.message||"Login failed";
btn.disabled=false;
btn.textContent="Login";
return;
}

localStorage.setItem("createlk_token",d.token);
localStorage.setItem("createlk_user",JSON.stringify(d.user));

const s=await fetch(WORKER_URL+"/api/membership",{
headers:{Authorization:"Bearer "+d.token}
});

const m=await s.json();

location.href=m.active?"premium-course.html":"payment.html";

}catch(err){
msg.textContent="Connection error. Please try again.";
btn.disabled=false;
btn.textContent="Login";
}
};
</script>

</body>
</html>
