<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | CreateLK Academy</title><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef5ff,#f8fbff);
  color:#172033;
}

header{
  background:#123b70;
  padding:16px 20px;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:430px;
  margin:35px auto;
  padding:18px;
}

.card{
  background:white;
  padding:28px;

  box-shadow:0 8px 30px #0002;
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  color:#123b70;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin-bottom:25px;
}

/* LOGIN / REGISTER TABS */

.switch{
  display:flex;
  gap:6px;
  background:#eef2f7;
  padding:5px;
  border-radius:11px;
  margin-bottom:25px;
}

.switch button{
  flex:1;
  border:0;
  padding:13px 8px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:transparent;
  color:#667085;
}

.switch button.active{
  background:white;
  color:#1769e0;
  box-shadow:0 2px 8px #0002;
}

h2{
  text-align:center;
  margin:10px 0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
}

input{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ccd3df;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#1769e0;
}

.stay{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  font-size:14px;
  color:#475569;
}

.stay input{
  width:auto;
  margin:0;
}

.mainbtn{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:#1769e0;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.mainbtn:disabled{
  opacity:.6;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  min-height:20px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#1769e0;
  text-decoration:none;
  font-weight:bold;
}

.security{
  text-align:center;
  color:#667085;
  font-size:13px;
  margin-top:20px;
}

.hidden{
  display:none !important;
}

.success{
  color:#168344;
}

.error{
  color:#c62828;
}

@media(max-width:600px){
  .container{
    margin:20px auto;
    padding:12px;
  }

  .card{
    padding:22px;
  }
}
</style></head><body><header>
  <a href="index.html">← Home</a>
</header><div class="container"><div class="card"><div class="logo">
📚 CreateLK Academy
</div><p class="subtitle">
Learn English. Build Your Future.
</p><!-- LOGIN / REGISTER --><div class="switch"><button
type="button"
id="loginTab"
class="active"
onclick="showLogin()">
🔐 Login
</button>

<button
type="button"
id="registerTab"
onclick="showRegister()">
📝 Register
</button>

</div><!-- ================= LOGIN ================= --><div id="loginBox"><h2>Welcome Back</h2><p class="subtitle">
Login to your account
</p><form id="loginForm"><label for="loginEmail">
Email Address
</label><input
id="loginEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required

«»

<label for="loginPassword">
Password
</label><input
id="loginPassword"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required

«»

<label class="stay"><input
id="stayLogin"
type="checkbox"
checked

«»

Stay logged in

</label><button
class="mainbtn"
id="loginBtn"
type="submit">
Login
</button>

</form><div
id="loginMessage"
class="message">
</div></div><!-- ================= REGISTER ================= --><div
id="registerBox"
class="hidden"><h2>Create Account</h2><p class="subtitle">
Join CreateLK Academy
</p><form id="registerForm"><label for="registerName">
Full Name
</label><input
id="registerName"
type="text"
placeholder="Enter your name"
autocomplete="name"
required

«»

<label for="registerEmail">
Email Address
</label><input
id="registerEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required

«»

<label for="registerPassword">
Password
</label><input
id="registerPassword"
type="password"
placeholder="Minimum 8 characters"
minlength="8"
autocomplete="new-password"
required

«»

<label for="registerConfirm">
Confirm Password
</label><input
id="registerConfirm"
type="password"
placeholder="Confirm password"
minlength="8"
autocomplete="new-password"
required

«»

<button
class="mainbtn"
id="registerBtn"
type="submit">
📝 Create Account
</button>

</form><div
id="registerMessage"
class="message">
</div></div><a
class="back"
href="index.html">
🏠 Back to CreateLK Academy
</a>

</div><div class="security">
🔒 Securely processed by Cloudflare
</div></div><script>

const WORKER_URL =
"https://createlk-academy-api.createlk.workers.dev";


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("registerBox")
.classList.add("hidden");

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("registerTab")
.classList.remove("active");

}


/* =====================================================
   SHOW REGISTER
===================================================== */

function showRegister(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("registerBox")
.classList.remove("hidden");

document
.getElementById("loginTab")
.classList.remove("active");

document
.getElementById("registerTab")
.classList.add("active");

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
document
.getElementById("loginEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("loginPassword")
.value;

const btn =
document.getElementById("loginBtn");

const message =
document.getElementById("loginMessage");

btn.disabled=true;
btn.textContent="Logging in...";

message.className="message";
message.textContent="";


try{

const response =
await fetch(
WORKER_URL + "/api/login",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

message.className=
"message error";

message.textContent =
data.message ||
"Login failed.";

btn.disabled=false;
btn.textContent="Login";

return;

}


/* Save token for pages that use Bearer authentication */

if(data.token){

localStorage.setItem(
"createlk_token",
data.token
);

}

if(data.user){

localStorage.setItem(
"createlk_user",
JSON.stringify(data.user)
);

}

message.className=
"message success";

message.textContent =
"✅ Login successful. Checking membership...";


/* =====================================================
   CHECK MEMBERSHIP
===================================================== */

const membershipResponse =
await fetch(
WORKER_URL + "/api/membership",
{
method:"GET",
credentials:"include",

headers:
data.token
? {
"Authorization":
"Bearer " + data.token
}
: {}
}
);


const membership =
await membershipResponse.json();


if(
membership.loggedIn &&
membership.active
){

/* Premium approved */

window.location.href =
"premium-course.html";

}else{

/* Login successful but premium not approved */

window.location.href =
"payment.html";

}


}
catch(error){

console.error(error);

message.className=
"message error";

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent="Login";

}

}
);


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registerForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();

const name =
document
.getElementById("registerName")
.value
.trim();

const email =
document
.getElementById("registerEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("registerPassword")
.value;

const confirm =
document
.getElementById("registerConfirm")
.value;

const btn =
document.getElementById("registerBtn");

const message =
document.getElementById("registerMessage");


if(
password.length < 8
){

message.className=
"message error";

message.textContent =
"Password must contain at least 8 characters.";

return;

}


if(
password !== confirm
){

message.className=
"message error";

message.textContent =
"Passwords do not match.";

return;

}


btn.disabled=true;
btn.textContent="Creating Account...";

message.className="message";
message.textContent="";


try{

const response =
await fetch(
WORKER_URL + "/api/register",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
name:name,
email:email,
password:password
})
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

message.className=
"message error";

message.textContent =
data.message ||
"Registration failed.";

btn.disabled=false;
btn.textContent="📝 Create Account";

return;

}


message.className=
"message success";

message.textContent =
"✅ Account created successfully!";


document
.getElementById("registerForm")
.reset();


setTimeout(
function(){

showLogin();

document
.getElementById("loginEmail")
.value=email;

document
.getElementById("loginPassword")
.focus();

},
1000
);


}
catch(error){

console.error(error);

message.className=
"message error";

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent="📝 Create Account";

}

}
);


/* =====================================================
   INITIAL
===================================================== */

showLogin();

</script></body>
</html>
