<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#155eef;
--purple:#7c3aed;
--pink:#ec4899;
--green:#10b981;
--dark:#172033;
--muted:#667085;
--line:#e5e7eb;
--bg:#f5f7ff
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at 10% 10%,#dbeafe 0,transparent 28%),
radial-gradient(circle at 90% 20%,#fce7f3 0,transparent 28%),
var(--bg);
color:var(--dark);
min-height:100vh
}

a{text-decoration:none}

header{
background:#ffffffee;
backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:900px;
margin:auto;
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:900;
color:var(--blue)
}

.logo span{color:var(--purple)}

.home{
font-size:14px;
font-weight:700;
color:#475467
}

main{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:35px 15px
}

.card{
width:100%;
max-width:450px;
background:#fff;
border-radius:24px;
padding:32px;
border:1px solid #fff;
box-shadow:0 20px 55px rgba(16,24,40,.12);
position:relative;
overflow:hidden
}

.card:before{
content:"";
position:absolute;
width:150px;
height:150px;
right:-75px;
top:-75px;
border-radius:50%;
background:#dbeafe
}

.card:after{
content:"";
position:absolute;
width:130px;
height:130px;
left:-65px;
bottom:-65px;
border-radius:50%;
background:#fce7f3
}

.header{
text-align:center;
position:relative;
z-index:1;
margin-bottom:25px
}

.icon{
width:68px;
height:68px;
margin:auto;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
background:linear-gradient(135deg,#eef4ff,#f5f0ff);
box-shadow:0 10px 25px rgba(21,94,239,.12)
}

h1{
font-size:28px;
margin:15px 0 7px
}

.subtitle{
font-size:14px;
line-height:1.5;
color:var(--muted)
}

.message{
display:none;
padding:13px;
border-radius:11px;
margin-bottom:18px;
font-size:13px;
line-height:1.5;
text-align:center;
position:relative;
z-index:2
}

.message.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c
}

.message.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534
}

.message.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8
}

form{
position:relative;
z-index:2
}

.group{
margin-bottom:17px
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:7px
}

input{
width:100%;
height:50px;
padding:0 14px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:14px;
outline:none
}

input:focus{
border-color:var(--blue);
box-shadow:0 0 0 3px rgba(21,94,239,.10)
}

button{
width:100%;
height:52px;
border:0;
border-radius:11px;
background:linear-gradient(135deg,var(--blue),var(--purple));
color:#fff;
font-size:15px;
font-weight:900;
cursor:pointer;
box-shadow:0 10px 25px rgba(21,94,239,.22);
transition:.2s
}

button:hover{
transform:translateY(-2px)
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none
}

.register{
position:relative;
z-index:2;
text-align:center;
margin-top:21px;
font-size:14px;
color:var(--muted)
}

.register a{
color:var(--blue);
font-weight:800
}

.support{
position:relative;
z-index:2;
text-align:center;
margin-top:18px;
font-size:12px;
color:#98a2b3
}

footer{
text-align:center;
padding:20px;
font-size:11px;
color:#98a2b3
}

.whatsapp{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
border-radius:50%;
background:#25d366;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:29px;
box-shadow:0 8px 25px #0003;
z-index:999
}

@media(max-width:500px){

.card{
padding:26px 18px;
border-radius:20px
}

h1{
font-size:25px
}

.nav{
padding:14px 15px
}

.logo{
font-size:18px
}

}
</style>
</head>

<body>

<header>
<div class="nav">

<a href="index.html" class="logo">
📚 CreateLK <span>Academy</span>
</a>

<a href="index.html" class="home">
← Home
</a>

</div>
</header>

<main>

<div class="card">

<div class="header">

<div class="icon">
🔐
</div>

<h1>Welcome Back</h1>

<div class="subtitle">
Login to continue your English learning journey.
</div>

</div>

<div id="message" class="message"></div>

<form id="loginForm">

<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
required
autocomplete="email">

</div>

<div class="group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter your password"
required
autocomplete="current-password">

</div>

<button
id="loginButton"
type="submit">
🔐 Login
</button>

</form>

<div class="register">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

<div class="support">
Need help? Contact us on WhatsApp.
</div>

</div>

</main>

<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>

<a
class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="WhatsApp">
💬
</a>

<script>

/* ==============================
   NEW AUTHENTICATION API
============================== */

const ACCOUNT_API =
"https://createlk-auth.createlk.workers.dev";


/* ==============================
   COURSE API
============================== */

const COURSE_API =
"https://createlk-course-lessons.createlk.workers.dev";


/* ==============================
   STORAGE
============================== */

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* ==============================
   ELEMENTS
============================== */

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");


/* ==============================
   MESSAGE
============================== */

function showMessage(text,type){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


/* ==============================
   LOGIN
============================== */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById("email")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value;

if(!email || !password){

showMessage(
"Please enter your email and password.",
"error"
);

return;

}

button.disabled = true;

button.textContent =
"⏳ Logging in...";

showMessage(
"Checking your account...",
"info"
);

try{

const response =
await fetch(
ACCOUNT_API + "/api/login",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})

});

const raw =
await response.text();

console.log(
"LOGIN RESPONSE:",
raw
);

let data;

try{

data =
JSON.parse(raw);

}catch{

throw new Error(
"Server returned an invalid response."
);

}

if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* ==============================
   STUDENT DATA
============================== */

const s =
data.student || {};

const studentId =
data.student_id ||
data.studentId ||
s.id;

if(!studentId){

throw new Error(
"Login succeeded, but student ID was not returned by the server."
);

}

const student = {

id:Number(studentId),

student_id:Number(studentId),

first_name:
data.first_name ||
s.first_name ||
"",

last_name:
data.last_name ||
s.last_name ||
"",

name:
data.name ||
s.name ||
(
(data.first_name || s.first_name || "") +
" " +
(data.last_name || s.last_name || "")
).trim(),

email:
data.email ||
s.email ||
email,

phone:
data.phone ||
s.phone ||
"",

membership_status:
data.membership_status ||
s.membership_status ||
"NONE",

membership_expiry:
data.membership_expiry ||
s.membership_expiry ||
null

};


/* ==============================
   SAVE LOGIN
============================== */

const saved =
JSON.stringify(student);

localStorage.setItem(
STUDENT_KEY,
saved
);

localStorage.setItem(
LOGIN_KEY,
"true"
);

sessionStorage.setItem(
STUDENT_KEY,
saved
);

sessionStorage.setItem(
LOGIN_KEY,
"true"
);

sessionStorage.setItem(
"createlk_student_id",
String(student.id)
);

sessionStorage.setItem(
"createlk_student_email",
student.email
);


/* ==============================
   SUCCESS
============================== */

showMessage(
"✅ Login successful! Opening your English course...",
"success"
);

button.textContent =
"✓ Login Successful";

setTimeout(function(){

window.location.href =
"course-lessons.html";

},800);


}catch(error){

console.error(
"LOGIN ERROR:",
error
);

showMessage(
error.message ||
"Unable to connect to CreateLK Academy.",
"error"
);

button.disabled =
false;

button.textContent =
"🔐 Login";

}

});

</script>

</body>
</html>
