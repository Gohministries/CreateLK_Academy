<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163A63">

<title>Login | CreateLK Digital Learning Shop</title>

<meta
  name="description"
  content="Login or create your CreateLK Digital Learning Shop account"
>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--navy:#163A63;
--blue:#2563EB;
--light:#EFF6FF;
--bg:#F7F9FC;
--text:#263238;
--muted:#6B7785;
--border:#E2E8F0;
--white:#fff
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh
}

a{
text-decoration:none;
color:inherit
}

header{
background:#fff;
border-bottom:1px solid var(--border)
}

.nav{
max-width:1150px;
height:62px;
margin:auto;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px;
color:var(--navy);
font-weight:800;
font-size:15px
}

.brand img{
width:36px;
height:36px;
object-fit:contain
}

.nav-links{
display:flex;
gap:4px
}

.nav-links a{
padding:8px 10px;
border-radius:7px;
font-size:13px;
font-weight:700
}

.nav-links a:hover{
background:var(--light);
color:var(--blue)
}

main{
max-width:430px;
margin:auto;
padding:42px 16px 60px
}

.card{
background:#fff;
border:1px solid var(--border);
border-radius:14px;
padding:25px;
box-shadow:0 5px 20px #163a6310
}

.logo{
width:48px;
height:48px;
object-fit:contain;
display:block;
margin:0 auto 12px
}

h1{
text-align:center;
font-size:23px;
color:#172B3A;
margin-bottom:5px
}

.sub{
text-align:center;
font-size:13px;
color:var(--muted);
margin-bottom:22px
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
background:var(--light);
padding:4px;
border-radius:8px;
margin-bottom:20px
}

.tabs button{
border:0;
background:transparent;
padding:9px;
border-radius:6px;
font-size:13px;
font-weight:800;
color:var(--muted);
cursor:pointer
}

.tabs button.active{
background:#fff;
color:var(--blue);
box-shadow:0 1px 4px #0000000d
}

.form{
display:none
}

.form.active{
display:block
}

label{
display:block;
font-size:12px;
font-weight:700;
margin:0 0 6px
}

input{
width:100%;
height:43px;
border:1px solid var(--border);
border-radius:8px;
padding:0 12px;
font-size:14px;
outline:none;
margin-bottom:14px
}

input:focus{
border-color:var(--blue)
}

.btn{
width:100%;
height:44px;
border:0;
border-radius:8px;
background:var(--blue);
color:#fff;
font-size:13px;
font-weight:800;
cursor:pointer;
margin-top:3px
}

.btn:hover{
background:#1D4ED8
}

.btn:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
padding:10px 12px;
border-radius:8px;
font-size:12px;
font-weight:700;
margin-bottom:15px
}

.success{
display:block;
background:#ECFDF5;
color:#15803D;
border:1px solid #BBF7D0
}

.error{
display:block;
background:#FEF2F2;
color:#DC2626;
border:1px solid #FECACA
}

.note{
text-align:center;
font-size:11px;
color:var(--muted);
margin-top:15px;
line-height:1.5
}

footer{
background:#102E50;
color:#D9E4F0;
text-align:center;
padding:24px 15px;
font-size:12px
}

.footer-links{
margin-top:9px;
display:flex;
justify-content:center;
gap:16px;
flex-wrap:wrap
}

@media(max-width:500px){

.nav{
height:58px;
padding:0 12px
}

.brand{
font-size:12px;
max-width:180px
}

.brand img{
width:33px;
height:33px
}

.nav-links a{
font-size:11px;
padding:7px
}

main{
padding:25px 12px 45px
}

.card{
padding:20px
}

}
</style>
</head>

<body>

<header>

<nav class="nav">

<a href="/index.html" class="brand">

<img
src="https://assets.createlk.com/file_000000003e448207b8c6a7ecc4a7e1d4.png"
alt="CreateLK"
>

<span>CreateLK Digital Learning Shop</span>

</a>

<div class="nav-links">

<a href="/index.html">Home</a>
<a href="/shop.html">Shop</a>
<a href="/account.html">Account</a>

</div>

</nav>

</header>

<main>

<div class="card">

<img
class="logo"
src="https://assets.createlk.com/file_000000003e448207b8c6a7ecc4a7e1d4.png"
alt="CreateLK"
>

<h1>Welcome to CreateLK</h1>

<p class="sub">
Access your digital learning resources
</p>

<div id="message" class="message"></div>

<div class="tabs">

<button
id="loginTab"
class="active"
type="button"
onclick="showForm('login')"
>
Login
</button>

<button
id="registerTab"
type="button"
onclick="showForm('register')"
>
Create Account
</button>

</div>


<!-- LOGIN -->

<form id="loginForm" class="form active">

<label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>

<button
id="loginBtn"
class="btn"
type="submit"
>
Login
</button>

</form>


<!-- REGISTER -->

<form id="registerForm" class="form">

<label>First Name</label>

<input
id="firstName"
type="text"
placeholder="First name"
autocomplete="given-name"
required
>

<label>Last Name</label>

<input
id="lastName"
type="text"
placeholder="Last name"
autocomplete="family-name"
>

<label>Email</label>

<input
id="registerEmail"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>

<label>Phone</label>

<input
id="phone"
type="tel"
placeholder="Phone number"
autocomplete="tel"
>

<label>Password</label>

<input
id="registerPassword"
type="password"
placeholder="Create a password"
autocomplete="new-password"
minlength="6"
required
>

<button
id="registerBtn"
class="btn"
type="submit"
>
Create Account
</button>

</form>

<p class="note">
Your account is used to securely access your purchased learning resources.
</p>

</div>

</main>

<footer>

<div>CreateLK Digital Learning Shop</div>

<div class="footer-links">

<a href="/terms.html">Terms</a>
<a href="/privacy.html">Privacy</a>
<a href="/refund.html">Refund</a>
<a href="/contact.html">Contact</a>

</div>

</footer>


<script>

const API =
"https://createlk-digital-shop.createlk.workers.dev";


/*
|--------------------------------------------------------------------------
| Redirect
|--------------------------------------------------------------------------
*/

const params =
new URLSearchParams(location.search);

let redirect =
params.get("redirect") ||
"/shop.html";


/*
|--------------------------------------------------------------------------
| Prevent external redirect URLs
|--------------------------------------------------------------------------
*/

if(
!redirect.startsWith("/") ||
redirect.startsWith("//")
){

redirect="/shop.html";

}


/*
|--------------------------------------------------------------------------
| Helpers
|--------------------------------------------------------------------------
*/

const $ =
id => document.getElementById(id);


function showMessage(text,type){

$("message").textContent=text;

$("message").className=
"message "+type;

}


function showForm(type){

$("message").className="message";

$("message").textContent="";


if(type==="login"){

$("loginForm")
.classList.add("active");

$("registerForm")
.classList.remove("active");

$("loginTab")
.classList.add("active");

$("registerTab")
.classList.remove("active");

}else{

$("loginForm")
.classList.remove("active");

$("registerForm")
.classList.add("active");

$("loginTab")
.classList.remove("active");

$("registerTab")
.classList.add("active");

}

}


/*
|--------------------------------------------------------------------------
| Login
|--------------------------------------------------------------------------
*/

$("loginForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();

const btn =
$("loginBtn");

btn.disabled=true;

btn.textContent=
"Logging in...";


try{

const r =
await fetch(
API+"/auth/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:
$("loginEmail")
.value
.trim()
.toLowerCase(),

password:
$("loginPassword")
.value

})

}
);


const d =
await r.json();


if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Login failed."
);

}


if(
!d.token ||
typeof d.token!=="string"
){

throw Error(
"Login token was not returned."
);

}


/*
|--------------------------------------------------------------------------
| Save session
|--------------------------------------------------------------------------
*/

localStorage.setItem(
"createlk_token",
d.token
);


/*
|--------------------------------------------------------------------------
| Verify session with API
|--------------------------------------------------------------------------
*/

const verify =
await fetch(
API+"/auth/me",
{
headers:{
"Authorization":
"Bearer "+d.token
}
}
);


const verifyData =
await verify.json();


if(
!verify.ok ||
!verifyData.success
){

localStorage.removeItem(
"createlk_token"
);

throw Error(
"Login succeeded, but the session could not be verified."
);

}


showMessage(
"Login successful. Opening your account...",
"success"
);


setTimeout(
()=>{
location.href=redirect;
},
600
);


}catch(err){

console.error(err);

showMessage(
err.message ||
"Unable to login. Please try again.",
"error"
);

btn.disabled=false;

btn.textContent=
"Login";

}

}
);


/*
|--------------------------------------------------------------------------
| Register
|--------------------------------------------------------------------------
*/

$("registerForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();

const btn =
$("registerBtn");

btn.disabled=true;

btn.textContent=
"Creating...";


try{

const r =
await fetch(
API+"/auth/register",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

first_name:
$("firstName")
.value
.trim(),

last_name:
$("lastName")
.value
.trim(),

email:
$("registerEmail")
.value
.trim()
.toLowerCase(),

phone:
$("phone")
.value
.trim(),

password:
$("registerPassword")
.value

})

}
);


const d =
await r.json();


if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Unable to create account."
);

}


if(
!d.token ||
typeof d.token!=="string"
){

throw Error(
"Account created, but login token was not returned."
);

}


/*
|--------------------------------------------------------------------------
| Save session
|--------------------------------------------------------------------------
*/

localStorage.setItem(
"createlk_token",
d.token
);


/*
|--------------------------------------------------------------------------
| Verify new session
|--------------------------------------------------------------------------
*/

const verify =
await fetch(
API+"/auth/me",
{
headers:{
"Authorization":
"Bearer "+d.token
}
}
);


const verifyData =
await verify.json();


if(
!verify.ok ||
!verifyData.success
){

localStorage.removeItem(
"createlk_token"
);

throw Error(
"Account was created, but the session could not be verified."
);

}


showMessage(
"Account created successfully. Opening your account...",
"success"
);


setTimeout(
()=>{
location.href=redirect;
},
600
);


}catch(err){

console.error(err);

showMessage(
err.message ||
"Unable to create account.",
"error"
);

btn.disabled=false;

btn.textContent=
"Create Account";

}

}
);

</script>

</body>
</html>
