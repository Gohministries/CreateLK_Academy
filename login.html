<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | CreateLK Academy</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef5ff,#f8fbff);
color:#172033;
}

header{
background:#123b70;
padding:16px 20px;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:430px;
margin:35px auto;
padding:18px;
}

.card{
background:white;
padding:28px;
border-radius:20px;
box-shadow:0 8px 30px #0002;
}

.logo{
text-align:center;
font-size:25px;
font-weight:bold;
color:#123b70;
}

.subtitle{
text-align:center;
color:#667085;
margin-bottom:25px;
}

.switch{
display:flex;
background:#eef2f7;
padding:4px;
border-radius:10px;
margin-bottom:25px;
}

.switch button{
width:50%;
border:0;
padding:11px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
background:transparent;
color:#667085;
}

.switch .active{
background:white;
color:#1769e0;
box-shadow:0 2px 8px #0001;
}

h2{
text-align:center;
margin:10px 0;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
}

input{
width:100%;
padding:13px;
margin-top:7px;
border:1px solid #ccd3df;
border-radius:9px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#1769e0;
}

.mainbtn{
width:100%;
padding:14px;
margin-top:22px;
border:0;
border-radius:9px;
background:#1769e0;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.mainbtn:disabled{
opacity:.6;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
min-height:20px;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#1769e0;
text-decoration:none;
font-weight:bold;
}

.security{
text-align:center;
color:#667085;
font-size:13px;
margin-top:20px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<header>
<a href="index.html">← Home</a>
</header>

<div class="container">

<div class="card">

<div class="logo">📚 CreateLK Academy</div>

<p class="subtitle">
Learn English. Build Your Future.
</p>

<div class="switch">

<button id="loginTab"
class="active"
onclick="showLogin()">
🔐 Login
</button>

<button id="registerTab"
onclick="showRegister()">
📝 Register
</button>

</div>


<!-- LOGIN -->

<div id="loginBox">

<h2>Welcome Back</h2>

<p class="subtitle">
Login to your account
</p>

<form id="loginForm">

<label>Email Address</label>

<input
id="loginEmail"
type="email"
placeholder="Enter your email"
required
>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Enter your password"
required
>

<button
class="mainbtn"
id="loginBtn"
type="submit">
Login
</button>

</form>

<div id="loginMessage" class="message"></div>

</div>


<!-- REGISTER -->

<div id="registerBox" class="hidden">

<h2>Create Account</h2>

<p class="subtitle">
Join CreateLK Academy
</p>

<form id="registerForm">

<label>Full Name</label>

<input
id="registerName"
type="text"
placeholder="Enter your name"
required
>

<label>Email Address</label>

<input
id="registerEmail"
type="email"
placeholder="Enter your email"
required
>

<label>Password</label>

<input
id="registerPassword"
type="password"
placeholder="Minimum 8 characters"
minlength="8"
required
>

<label>Confirm Password</label>

<input
id="registerConfirm"
type="password"
placeholder="Confirm password"
minlength="8"
required
>

<button
class="mainbtn"
id="registerBtn"
type="submit">
Create Account
</button>

</form>

<div id="registerMessage" class="message"></div>

</div>


<a class="back" href="index.html">
🏠 Back to CreateLK Academy
</a>

</div>

<div class="security">
🔒 Securely processed by Cloudflare
</div>

</div>


<script>

/* =========================================
   CLOUDFLARE WORKER
========================================= */

const WORKER_URL =
"https://createlk-academy-api.createlk.workers.dev";


/* =========================================
   SWITCH LOGIN / REGISTER
========================================= */

function showLogin(){

document.getElementById("loginBox")
.classList.remove("hidden");

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("registerTab")
.classList.remove("active");

}


function showRegister(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.remove("hidden");

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("registerTab")
.classList.add("active");

}


/* =========================================
   LOGIN
========================================= */

document.getElementById("loginForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const btn =
document.getElementById("loginBtn");

const message =
document.getElementById("loginMessage");

btn.disabled=true;
btn.textContent="Logging in...";
message.textContent="";

try{

const response =
await fetch(
WORKER_URL+"/api/login",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:
document.getElementById("loginEmail").value
.trim(),

password:
document.getElementById("loginPassword").value

})
}
);

const data =
await response.json();

if(!data.success){

message.textContent =
data.message ||
"Invalid email or password.";

btn.disabled=false;
btn.textContent="Login";

return;

}


/* SAVE LOGIN */

localStorage.setItem(
"createlk_token",
data.token
);

localStorage.setItem(
"createlk_user",
JSON.stringify(data.user)
);


/* CHECK PREMIUM */

const status =
await fetch(
WORKER_URL+"/api/membership",
{
headers:{
"Authorization":
"Bearer "+data.token
}
}
);

const membership =
await status.json();


if(membership.active){

window.location.href =
"premium-course.html";

}else{

window.location.href =
"payment.html";

}

}catch(error){

console.error(error);

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent="Login";

}

});


/* =========================================
   REGISTER
========================================= */

document.getElementById("registerForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const name =
document.getElementById(
"registerName"
).value.trim();

const email =
document.getElementById(
"registerEmail"
).value.trim();

const password =
document.getElementById(
"registerPassword"
).value;

const confirm =
document.getElementById(
"registerConfirm"
).value;

const message =
document.getElementById(
"registerMessage"
);

const btn =
document.getElementById(
"registerBtn"
);


if(password.length < 8){

message.textContent =
"Password must contain at least 8 characters.";

return;

}


if(password !== confirm){

message.textContent =
"Passwords do not match.";

return;

}


btn.disabled=true;
btn.textContent="Creating Account...";
message.textContent="";


try{

const response =
await fetch(
WORKER_URL+"/api/register",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name:name,
email:email,
password:password
})
}
);


const data =
await response.json();


if(!data.success){

message.textContent =
data.message ||
"Registration failed.";

btn.disabled=false;
btn.textContent="Create Account";

return;

}


message.textContent =
"✅ Account created successfully!";

document.getElementById(
"registerForm"
).reset();


setTimeout(function(){

showLogin();

document.getElementById(
"loginEmail"
).value=email;

},1200);


}catch(error){

console.error(error);

message.textContent =
"Unable to connect to CreateLK Academy.";

btn.disabled=false;
btn.textContent="Create Account";

}

});

</script>

</body>
</html>
