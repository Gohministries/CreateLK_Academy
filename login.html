<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | CreateLK Academy</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
min-height:100vh
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb
}

.nav{
max-width:900px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:800;
color:#155eef;
text-decoration:none
}

.home{
font-size:14px;
font-weight:600;
color:#475467;
text-decoration:none
}

main{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:30px 15px
}

.card{
width:100%;
max-width:450px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.06)
}

.header{
text-align:center;
margin-bottom:25px
}

.icon{
width:60px;
height:60px;
margin:auto;
border-radius:16px;
background:#eef4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px
}

h1{
font-size:27px;
margin:14px 0 7px
}

.subtitle{
font-size:14px;
color:#667085
}

.group{
margin-bottom:17px
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px
}

input{
width:100%;
height:49px;
padding:0 13px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:14px;
outline:none
}

input:focus{
border-color:#155eef;
box-shadow:0 0 0 3px rgba(21,94,239,.1)
}

button{
width:100%;
height:50px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
padding:13px;
border-radius:9px;
margin-bottom:18px;
font-size:13px;
line-height:1.5;
text-align:center
}

.error{
display:block;
background:#fff1f2;
border:1px solid #fecdd3;
color:#be123c
}

.success{
display:block;
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534
}

.info{
display:block;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8
}

.register{
text-align:center;
margin-top:20px;
font-size:14px;
color:#667085
}

.register a{
color:#155eef;
font-weight:700;
text-decoration:none
}

footer{
text-align:center;
padding:20px;
font-size:11px;
color:#98a2b3
}

@media(max-width:500px){

.card{
padding:23px 18px
}

h1{
font-size:24px
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<a href="index.html" class="logo">
📚 CreateLK Academy
</a>

<a href="index.html" class="home">
← Home
</a>

</div>

</header>


<main>

<div class="card">

<div class="header">

<div class="icon">
🔐
</div>

<h1>
Welcome Back
</h1>

<div class="subtitle">
Login to your CreateLK Academy account.
</div>

</div>


<div id="message" class="message"></div>


<form id="loginForm">

<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
autocomplete="email"
required
>

</div>


<div class="group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>

</div>


<button
id="loginButton"
type="submit"
>
🔐 Login
</button>

</form>


<div class="register">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

</div>

</main>


<footer>
© 2026 CreateLK Academy. All rights reserved.
</footer>


<script>

/* =========================
   CONFIG
========================= */

const API_URL =
"https://createlk-academy-api.createlk.workers.dev";

const STUDENT_KEY =
"createlk_student";

const LOGIN_KEY =
"createlk_logged_in";


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

message.className =
"message " + type;

message.textContent =
text;

message.style.display =
"block";

}


/* =========================
   CHECK EXISTING LOGIN
========================= */

function getSavedStudent(){

const saved =
localStorage.getItem(STUDENT_KEY) ||
sessionStorage.getItem(STUDENT_KEY);

if(!saved)
return null;

try{

return JSON.parse(saved);

}catch{

localStorage.removeItem(STUDENT_KEY);
sessionStorage.removeItem(STUDENT_KEY);

return null;

}

}


/*
 Do not automatically redirect immediately
 if the user intentionally opened login.
 The existing session can still be used by
 dashboard and AI MCQ pages.
*/


/* =========================
   LOGIN
========================= */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


const email =
document.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document.getElementById("password")
.value;


if(!email || !password){

showMessage(
"Please enter your email and password.",
"error"
);

return;

}


button.disabled =
true;

button.textContent =
"⏳ Logging in...";


showMessage(
"Checking your account...",
"info"
);


try{

const response =
await fetch(
API_URL + "/api/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const raw =
await response.text();


console.log(
"LOGIN:",
raw
);


let data;


try{

data =
JSON.parse(raw);

}catch{

throw new Error(
"Invalid response from server."
);

}


if(
!response.ok ||
data.success !== true
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/* =========================
   STUDENT DATA
========================= */

const s =
data.student || {};


const studentId =
data.student_id ||
data.studentId ||
s.id;


if(!studentId){

throw new Error(
"Login successful, but student ID was not returned."
);

}


const student = {

id:Number(studentId),

student_id:Number(studentId),

first_name:
data.first_name ||
s.first_name ||
"",

last_name:
data.last_name ||
s.last_name ||
"",

name:
data.name ||
s.name ||
`${data.first_name || s.first_name || ""} ${data.last_name || s.last_name || ""}`.trim(),

email:
data.email ||
s.email ||
email,

phone:
data.phone ||
s.phone ||
"",

membership_status:
data.membership_status ||
s.membership_status ||
"NONE",

membership_expiry:
data.membership_expiry ||
s.membership_expiry ||
null

};


/* =========================
   SAVE LOGIN
========================= */

const savedStudent =
JSON.stringify(student);


/*
 Persistent login.
 This remains after closing
 and reopening the browser.
*/

localStorage.setItem(
STUDENT_KEY,
savedStudent
);

localStorage.setItem(
LOGIN_KEY,
"true"
);


/*
 Current browser session.
*/

sessionStorage.setItem(
STUDENT_KEY,
savedStudent
);

sessionStorage.setItem(
LOGIN_KEY,
"true"
);

sessionStorage.setItem(
"createlk_student_id",
String(student.id)
);

sessionStorage.setItem(
"createlk_student_email",
student.email
);


/* =========================
   SUCCESS
========================= */

showMessage(
"✅ Login successful. Opening dashboard...",
"success"
);


button.textContent =
"✓ Login Successful";


setTimeout(
function(){

window.location.href =
"dashboard.html";

},
700
);


}catch(error){

console.error(error);


showMessage(
error.message ||
"Unable to connect to CreateLK Academy.",
"error"
);


button.disabled =
false;

button.textContent =
"🔐 Login";

}

});

</script>

</body>
</html>
