<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Book Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f1f1;
 color:#222;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#111;
 color:#fff;
 padding:12px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap;
}

header h1{
 margin:0;
 font-size:20px;
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

button{
 border:0;
 border-radius:7px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:bold;
}

.save{
 background:#d4af37;
 color:#111;
}

.pdf{
 background:#fff;
 color:#111;
}

.add{
 background:#222;
 color:#fff;
}

.remove{
 background:#b00020;
 color:#fff;
}

.outlineBtn{
 background:#eee;
 color:#111;
}

main{
 width:min(1050px,94%);
 margin:18px auto;
}

/* TOP BOOK */

.bookTop{
 background:#fff;
 border-radius:14px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 3px 15px #0002;
 text-align:center;
}

.bookTop h2{
 margin:0 0 6px;
}

.bookTop p{
 margin:5px;
 color:#666;
}

.topCover{
 max-width:220px;
 max-height:250px;
 display:block;
 margin:15px auto;
 border-radius:8px;
}

/* EDITOR */

.card{
 background:#fff;
 border-radius:14px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 3px 15px #0001;
}

label{
 display:block;
 margin-top:13px;
 font-weight:bold;
}

input,
textarea,
select{
 width:100%;
 padding:11px;
 margin-top:6px;
 border:1px solid #ccc;
 border-radius:7px;
 font-size:16px;
}

textarea{
 min-height:140px;
 resize:vertical;
}

.pageEditor{
 border:1px solid #ccc;
 border-radius:12px;
 padding:16px;
 margin-top:15px;
 background:#fafafa;
}

.pageHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.pageNumber{
 font-size:18px;
 font-weight:bold;
}

.photoPreview{
 max-width:240px;
 max-height:220px;
 display:block;
 margin:12px auto;
}

.options{
 display:flex;
 gap:15px;
 flex-wrap:wrap;
 margin-top:12px;
}

.options label{
 margin:0;
 font-weight:normal;
 display:flex;
 align-items:center;
 gap:6px;
}

.options input{
 width:auto;
 margin:0;
}

.status{
 text-align:center;
 font-weight:bold;
 margin:15px 0;
}

/* PREVIEW */

#preview{
 display:none;
}

.previewPage{
 position:relative;
 width:min(794px,100%);
 min-height:1123px;
 margin:20px auto;
 padding:55px;
 background:#fff;
 color:#000;
 border:0 solid #000;
 page-break-after:always;
 overflow:hidden;
}

.previewPage.outline{
 border:2px solid #000;
}

.previewPage h2{
 text-align:center;
 margin-top:0;
 font-size:26px;
}

.previewPage p{
 font-size:17px;
 line-height:1.8;
}

.previewPhoto{
 max-width:100%;
 max-height:350px;
 display:block;
 margin:15px auto;
 object-fit:contain;
}

.previewVerse{
 margin-top:30px;
 padding-top:15px;
 border-top:1px solid #000;
 font-style:italic;
 text-align:center;
}

.bookTitlePage{
 text-align:center;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}

.bookTitlePage h1{
 font-size:36px;
}

.bookTitlePage h3{
 font-size:21px;
 font-weight:normal;
}

.bookTitlePage img{
 max-width:350px;
 max-height:400px;
 margin:20px;
}

/* PRINT */

@media print{

 body{
  background:#fff;
 }

 header,
 .editor,
 .noPrint{
  display:none!important;
 }

 main{
  width:100%;
  margin:0;
 }

 #preview{
  display:block!important;
 }

 .previewPage{
  margin:0;
  width:210mm;
  min-height:297mm;
  box-shadow:none;
  color:#000!important;
  background:#fff!important;
  page-break-after:always;
 }
}
</style>
</head>

<body>

<header>

<h1>📖 Prayer Book Admin</h1>

<div class="actions">
<button class="save" onclick="saveBook()">☁️ Save</button>
<button onclick="togglePreview()">👁️ Preview</button>
<button class="pdf" onclick="downloadPDF()">📄 PDF</button>
</div>

</header>


<main>

<!-- BOOK SHOWN ON TOP -->

<section class="bookTop">

<h2 id="topTitle">Christian Prayer Book</h2>

<p id="topSubtitle">Prayers for Every Day</p>

<p id="topMinistry">Gate of Heaven Ministries</p>

<img
 id="topCover"
 class="topCover"
 style="display:none"
>

</section>


<!-- EDITOR -->

<section class="editor">

<div class="card">

<h2>📖 Book Details</h2>

<label>Book Title</label>
<input
 id="title"
 placeholder="Book title"
 oninput="updateTop()"
>

<label>Subtitle</label>
<input
 id="subtitle"
 placeholder="Subtitle"
 oninput="updateTop()"
>

<label>Ministry / Author</label>
<input
 id="ministry"
 placeholder="Ministry name"
 oninput="updateTop()"
>

<label>Book Cover Photo</label>

<input
 id="coverFile"
 type="file"
 accept="image/*"
 onchange="loadCover(event)"
>

</div>


<div class="card">

<h2>📄 PDF Page Settings</h2>

<div class="options">

<label>
<input
 id="outline"
 type="checkbox"
 checked
>
 Add page outline
</label>

<label>
<input
 id="pageNumbers"
 type="checkbox"
 checked
>
 Page numbers
</label>

</div>

<p>
PDF pages are always generated in
<strong>black and white</strong>.
</p>

</div>


<div class="card">

<h2>🙏 Prayer Pages</h2>

<div id="pages"></div>

<br>

<button class="add" onclick="addPage()">
＋ Add Page
</button>

</div>

</section>


<div id="status" class="status"></div>


<!-- PREVIEW -->

<section id="preview" class="card">

<h2 class="noPrint">📖 Book Preview</h2>

<div id="previewContent"></div>

</section>

</main>


<script>

let book={
 title:"Christian Prayer Book",
 subtitle:"Prayers for Every Day",
 ministry:"Gate of Heaven Ministries",
 cover:"",
 outline:true,
 pageNumbers:true,
 pages:[]
};


/* ---------- SAFE TEXT ---------- */

function esc(value){

 return String(value||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}


/* ---------- TOP BOOK ---------- */

function updateTop(){

 book.title=
  document.getElementById("title").value;

 book.subtitle=
  document.getElementById("subtitle").value;

 book.ministry=
  document.getElementById("ministry").value;

 document.getElementById("topTitle").textContent=
  book.title||"Christian Prayer Book";

 document.getElementById("topSubtitle").textContent=
  book.subtitle||"";

 document.getElementById("topMinistry").textContent=
  book.ministry||"";
}


/* ---------- COVER ---------- */

function loadCover(event){

 const file=event.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  book.cover=reader.result;

  const img=document.getElementById("topCover");

  img.src=book.cover;
  img.style.display="block";
 };

 reader.readAsDataURL(file);
}


/* ---------- PAGES ---------- */

function addPage(data={}){

 book.pages.push({

  title:data.title||"",
  text:data.text||"",
  verse:data.verse||"",
  photo:data.photo||""

 });

 renderPages();
}


function removePage(index){

 if(!confirm("Remove this page?"))
  return;

 book.pages.splice(index,1);

 renderPages();
}


function renderPages(){

 const box=document.getElementById("pages");

 box.innerHTML="";

 book.pages.forEach((page,index)=>{

  const div=document.createElement("div");

  div.className="pageEditor";

  div.innerHTML=`

   <div class="pageHead">

    <div class="pageNumber">
     Page ${index+1}
    </div>

    <button
     class="remove"
     onclick="removePage(${index})">
     Remove
    </button>

   </div>


   <label>
    Title
    <small>(optional)</small>
   </label>

   <input
    value="${esc(page.title)}"
    placeholder="Optional page title"
    oninput="
     book.pages[${index}].title=this.value;
    ">


   <label>Prayer Text</label>

   <textarea
    placeholder="Write the prayer here..."
    oninput="
     book.pages[${index}].text=this.value;
    "
   >${esc(page.text)}</textarea>


   <label>Bible Verse</label>

   <textarea
    placeholder="Optional Bible verse"
    oninput="
     book.pages[${index}].verse=this.value;
    "
   >${esc(page.verse)}</textarea>


   <label>Page Photo <small>(optional)</small></label>

   <input
    type="file"
    accept="image/*"
    onchange="loadPagePhoto(event,${index})"
   >

   ${
    page.photo
    ?`
     <img
      class="photoPreview"
      src="${page.photo}"
     >
    `
    :""
   }

  `;

  box.appendChild(div);
 });
}


function loadPagePhoto(event,index){

 const file=event.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  book.pages[index].photo=
   reader.result;

  renderPages();
 };

 reader.readAsDataURL(file);
}


/* ---------- LOAD FROM CLOUDFLARE ---------- */

async function loadBook(){

 try{

  const response=
   await fetch("/api/book");

  if(!response.ok)
   throw new Error();

  const data=
   await response.json();

  if(data){

   book={
    ...book,
    ...data,
    pages:Array.isArray(data.pages)
     ?data.pages:[]
   };

  }

  document.getElementById("title").value=
   book.title||"";

  document.getElementById("subtitle").value=
   book.subtitle||"";

  document.getElementById("ministry").value=
   book.ministry||"";

  document.getElementById("outline").checked=
   book.outline!==false;

  document.getElementById("pageNumbers").checked=
   book.pageNumbers!==false;

  if(book.cover){

   const img=
    document.getElementById("topCover");

   img.src=book.cover;
   img.style.display="block";
  }

  updateTop();
  renderPages();

 }catch(error){

  showStatus(
   "Could not load saved book.",
   true
  );
 }
}


/* ---------- SAVE ---------- */

async function saveBook(){

 updateTop();

 book.outline=
  document.getElementById("outline").checked;

 book.pageNumbers=
  document.getElementById("pageNumbers").checked;

 showStatus("☁️ Saving to Cloudflare R2...");

 try{

  const response=
   await fetch("/api/book",{

    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify(book)

   });

  if(!response.ok)
   throw new Error();

  showStatus(
   "✅ Book saved successfully to Cloudflare R2."
  );

 }catch(error){

  showStatus(
   "❌ Save failed.",
   true
  );
 }
}


function showStatus(text,error=false){

 const s=
  document.getElementById("status");

 s.textContent=text;

 s.style.color=
  error?"#b00020":"#247524";

 setTimeout(()=>{
  s.textContent="";
 },5000);
}


/* ---------- PREVIEW ---------- */

function togglePreview(){

 const preview=
  document.getElementById("preview");

 if(preview.style.display==="block"){

  preview.style.display="none";

  return;
 }

 updatePreview();

 preview.style.display="block";
}


function updatePreview(){

 updateTop();

 const outline=
  document.getElementById("outline").checked;

 const pageNumbers=
  document.getElementById("pageNumbers").checked;

 const box=
  document.getElementById("previewContent");

 let html="";


 /* COVER PAGE */

 html+=`

 <section class="previewPage bookTitlePage
  ${outline?"outline":""}">

  ${
   book.cover
   ?`
    <img src="${book.cover}">
   `
   :""
  }

  <h1>${esc(book.title)}</h1>

  <h3>${esc(book.subtitle)}</h3>

  <p>${esc(book.ministry)}</p>

 </section>
 `;


 /* PRAYER PAGES */

 book.pages.forEach((page,index)=>{

  html+=`

  <section
   class="previewPage
   ${outline?"outline":""}">

   ${
    page.title
    ?`<h2>${esc(page.title)}</h2>`
    :""
   }


   ${
    page.photo
    ?`
     <img
      class="previewPhoto"
      src="${page.photo}"
     >
    `
    :""
   }


   <p>
    ${esc(page.text)
      .replace(/\n/g,"<br>")}
   </p>


   ${
    page.verse
    ?`
     <div class="previewVerse">
      ${esc(page.verse)
       .replace(/\n/g,"<br>")}
     </div>
    `
    :""
   }


   ${
    pageNumbers
    ?`
     <div
      style="
       position:absolute;
       bottom:20px;
       left:0;
       right:0;
       text-align:center;
       font-size:13px;
      ">
      ${index+1}
     </div>
    `
    :""
   }

  </section>

  `;

 });

 box.innerHTML=html;
}


/* ---------- PDF PASSWORD ---------- */

async function downloadPDF(){

 const password=
  prompt("Enter PDF download password:");

 if(password===null)
  return;

 if(!password){

  alert("Please enter the password.");

  return;
 }


 try{

  const response=
   await fetch("/api/pdf-password",{

    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify({
     password:password
    })

   });


  if(!response.ok){

   alert("Incorrect PDF password.");

   return;
  }


  createPDF();

 }catch(error){

  alert(
   "Could not verify the password."
  );
 }
}


/* ---------- BLACK & WHITE PDF ---------- */

async function createPDF(){

 updatePreview();

 const pages=
  document.querySelectorAll(
   "#previewContent .previewPage"
  );

 if(!pages.length){

  alert("No pages available.");

  return;
 }


 const {jsPDF}=
  window.jspdf;

 const pdf=
  new jsPDF(
   "p",
   "mm",
   "a4"
  );


 for(let i=0;i<pages.length;i++){

  if(i>0)
   pdf.addPage();


  const canvas=
   await html2canvas(
    pages[i],
    {
     scale:2,
     backgroundColor:"#ffffff",
     useCORS:true
    }
   );


  const ctx=
   canvas.getContext("2d");

  const imageData=
   ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
   );


  /* FORCE BLACK & WHITE */

  for(
   let p=0;
   p<imageData.data.length;
   p+=4
  ){

   const r=imageData.data[p];
   const g=imageData.data[p+1];
   const b=imageData.data[p+2];

   const gray=
    Math.round(
     0.299*r+
     0.587*g+
     0.114*b
    );

   imageData.data[p]=gray;
   imageData.data[p+1]=gray;
   imageData.data[p+2]=gray;
  }


  ctx.putImageData(
   imageData,
   0,
   0
  );


  const image=
   canvas.toDataURL(
    "image/jpeg",
    0.95
   );


  pdf.addImage(
   image,
   "JPEG",
   0,
   0,
   210,
   297
  );
 }


 const filename=
  (book.title||"Prayer-Book")
   .replace(/[<>:"/\\|?*]+/g,"-")
   .trim();


 pdf.save(
  filename+".pdf"
 );
}


loadBook();

</script>

</body>
</html>
