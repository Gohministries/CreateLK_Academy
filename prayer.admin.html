<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Book Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4efe5;
 color:#333
}

header{
 background:#263b63;
 color:#fff;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap
}

h1{margin:0;font-size:21px}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

button{
 border:0;
 border-radius:8px;
 padding:11px 15px;
 cursor:pointer;
 font-weight:bold
}

.save{background:#d4af37}
.preview{background:#fff}
.pdf{background:#8b6f35;color:#fff}
.add{background:#263b63;color:#fff}
.remove{background:#c62828;color:#fff}

main{
 width:min(1000px,94%);
 margin:20px auto
}

.card{
 background:#fff;
 padding:20px;
 border-radius:15px;
 margin-bottom:18px;
 box-shadow:0 3px 15px #0001
}

label{
 display:block;
 font-weight:bold;
 margin-top:14px
}

input,textarea{
 width:100%;
 padding:12px;
 margin-top:6px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:16px
}

textarea{
 min-height:140px;
 resize:vertical
}

.backgrounds{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
 gap:8px;
 margin-top:12px
}

.bg{
 background:#fff;
 border:2px solid #ddd
}

.bg.active{
 border-color:#c59b25;
 background:#fff8dc
}

.page{
 border:1px solid #ddd;
 padding:15px;
 margin-top:15px;
 border-radius:12px
}

.pageHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.cover{
 max-width:260px;
 max-height:260px;
 display:block;
 margin:15px auto;
 border-radius:12px
}

#status{
 text-align:center;
 font-weight:bold;
 margin:15px
}

#preview{
 display:none
}

.previewPage{
 width:min(794px,100%);
 min-height:1050px;
 margin:20px auto;
 padding:45px;
 border-radius:10px;
 background-size:cover!important;
 background-position:center!important;
 box-shadow:0 3px 15px #0002;
 line-height:1.7
}

.previewPage h2{
 color:#263b63
}

.verse{
 margin-top:30px;
 padding-top:15px;
 border-top:1px solid #aaa;
 font-style:italic
}

@media(max-width:600px){
 header{
  flex-direction:column;
  align-items:stretch
 }

 .actions button{
  flex:1
 }

 .previewPage{
  padding:25px;
  min-height:900px
 }
}
</style>
</head>

<body>

<header>

<h1>🙏 Prayer Book Admin</h1>

<div class="actions">
<button class="save" onclick="saveBook()">☁️ Save</button>
<button class="preview" onclick="togglePreview()">👁️ Preview</button>
<button class="pdf" onclick="downloadPDF()">📄 Download PDF</button>
</div>

</header>


<main>

<div class="card">

<h2>Book Information</h2>

<label>Title</label>
<input id="title">

<label>Subtitle</label>
<input id="subtitle">

<label>Ministry</label>
<input id="ministry">

<label>Cover Photo</label>
<input
 id="coverFile"
 type="file"
 accept="image/*"
 onchange="loadCover(event)"
>

<img
 id="coverPreview"
 class="cover"
 style="display:none"
>

</div>


<div class="card">

<h2>Background</h2>

<div id="backgrounds" class="backgrounds"></div>

<label>Custom Background</label>

<input
 id="customFile"
 type="file"
 accept="image/*"
 onchange="loadCustomBackground(event)"
>

</div>


<div class="card">

<h2>Prayer Pages</h2>

<div id="pages"></div>

<br>

<button class="add" onclick="addPage()">
＋ Add Prayer Page
</button>

</div>


<div id="status"></div>


<div class="card" id="preview">

<h2>Preview</h2>

<div id="previewContent"></div>

</div>

</main>


<script>

let book={
 title:"Christian Prayer Book",
 subtitle:"Prayers for Every Day",
 ministry:"Gate of Heaven Ministries",
 cover:"",
 background:"prayer",
 customBackground:"",
 pages:[]
};


const backgrounds=[
 ["prayer","🙏 Light Prayer"],
 ["cross","✝️ Cross & Light"],
 ["srilanka","🇱🇰 Sri Lanka"],
 ["bible","📖 Open Bible"],
 ["cream","🤍 Plain Cream"],
 ["dove","🕊️ Dove & Peace"],
 ["sunrise","🌅 Sunrise"],
 ["mountain","🌄 Mountain Morning"],
 ["clouds","☁️ Heavenly Clouds"],
 ["nature","🌿 Green Nature"],
 ["forest","🌳 Forest"],
 ["water","🌊 Water & Peace"],
 ["flowers","🌸 Soft Flowers"],
 ["rose","🌹 Rose Prayer"],
 ["lavender","🪻 Lavender"],
 ["gold","⭐ Golden Light"],
 ["candle","🕯️ Candle & Prayer"],
 ["church","⛪ Church"],
 ["home","🏠 Home Prayer"],
 ["night","🌌 Night Prayer"],
 ["moon","🌙 Moonlight"],
 ["blue","💙 Blue Peace"],
 ["scripture","💛 Golden Scripture"],
 ["custom","🖼️ Custom Background"]
];


const backgroundsCSS={
 prayer:"linear-gradient(135deg,#fffaf0,#eee4cf)",
 cross:"linear-gradient(135deg,#f8f1df,#d8c08a)",
 srilanka:"linear-gradient(135deg,#fff3d6,#e5d2a2)",
 bible:"linear-gradient(135deg,#f4ead7,#fffdf7)",
 cream:"#fffaf0",
 dove:"linear-gradient(135deg,#fff,#dce8f1)",
 sunrise:"linear-gradient(135deg,#ffd9a0,#fff1d0)",
 mountain:"linear-gradient(135deg,#dfe9e4,#f8f3e5)",
 clouds:"linear-gradient(135deg,#fff,#dbe9f5)",
 nature:"linear-gradient(135deg,#e6f0df,#fff)",
 forest:"linear-gradient(135deg,#dce8d6,#f7f2e5)",
 water:"linear-gradient(135deg,#dceff5,#fff)",
 flowers:"linear-gradient(135deg,#fff0f5,#fff)",
 rose:"linear-gradient(135deg,#f9e1e5,#fff)",
 lavender:"linear-gradient(135deg,#eee5f7,#fff)",
 gold:"linear-gradient(135deg,#fff4c4,#fff)",
 candle:"linear-gradient(135deg,#fff0c7,#f8e1b2)",
 church:"linear-gradient(135deg,#eee9df,#fff)",
 home:"linear-gradient(135deg,#f5e9d8,#fff)",
 night:"linear-gradient(135deg,#18243d,#42577d)",
 moon:"linear-gradient(135deg,#dce3f3,#fff)",
 blue:"linear-gradient(135deg,#dcecff,#fff)",
 scripture:"linear-gradient(135deg,#fff0b8,#fff)"
};


function esc(v){
 return String(v||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}


function renderBackgrounds(){

 const box=document.getElementById("backgrounds");

 box.innerHTML="";

 backgrounds.forEach(item=>{

  const b=document.createElement("button");

  b.className="bg";

  if(book.background===item[0])
   b.classList.add("active");

  b.textContent=item[1];

  b.onclick=()=>{
   book.background=item[0];
   renderBackgrounds();
  };

  box.appendChild(b);
 });
}


function renderPages(){

 const box=document.getElementById("pages");

 box.innerHTML="";

 book.pages.forEach((p,i)=>{

  const div=document.createElement("div");

  div.className="page";

  div.innerHTML=`

   <div class="pageHead">
    <h3>Prayer ${i+1}</h3>

    <button
     class="remove"
     onclick="removePage(${i})">
     Remove
    </button>
   </div>

   <label>Prayer Title</label>

   <input
    value="${esc(p.title)}"
    oninput="
     book.pages[${i}].title=this.value
    "
   >

   <label>Prayer</label>

   <textarea
    oninput="
     book.pages[${i}].text=this.value
    "
   >${esc(p.text)}</textarea>

   <label>Bible Verse</label>

   <textarea
    oninput="
     book.pages[${i}].verse=this.value
    "
   >${esc(p.verse)}</textarea>

  `;

  box.appendChild(div);
 });
}


function addPage(){

 book.pages.push({
  title:"",
  text:"",
  verse:""
 });

 renderPages();
}


function removePage(i){

 if(!confirm("Remove this prayer page?"))
  return;

 book.pages.splice(i,1);

 renderPages();
}


function loadCover(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  book.cover=reader.result;

  const img=document.getElementById("coverPreview");

  img.src=book.cover;
  img.style.display="block";
 };

 reader.readAsDataURL(file);
}


function loadCustomBackground(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  book.customBackground=reader.result;
  book.background="custom";

  renderBackgrounds();
 };

 reader.readAsDataURL(file);
}


async function loadBook(){

 try{

  const r=await fetch("/api/book");

  if(!r.ok)
   throw new Error();

  const data=await r.json();

  book={
   ...book,
   ...data,
   pages:Array.isArray(data.pages)
    ?data.pages:[]
  };

  document.getElementById("title").value=
   book.title||"";

  document.getElementById("subtitle").value=
   book.subtitle||"";

  document.getElementById("ministry").value=
   book.ministry||"";

  if(book.cover){

   const img=document.getElementById("coverPreview");

   img.src=book.cover;
   img.style.display="block";
  }

  renderBackgrounds();
  renderPages();

 }catch(e){

  status("❌ Could not load saved book",true);
 }
}


async function saveBook(){

 book.title=
  document.getElementById("title").value;

 book.subtitle=
  document.getElementById("subtitle").value;

 book.ministry=
  document.getElementById("ministry").value;

 status("☁️ Saving to Cloudflare...");

 try{

  const r=await fetch("/api/book",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify(book)
  });

  if(!r.ok)
   throw new Error();

  status("✅ Saved to Cloudflare R2");

 }catch(e){

  status("❌ Save failed",true);
 }
}


function status(text,error=false){

 const s=document.getElementById("status");

 s.textContent=text;

 s.style.color=
  error?"#b00020":"#247524";
}


function bg(){

 if(
  book.background==="custom" &&
  book.customBackground
 ){
  return `url("${book.customBackground}")`;
 }

 return backgroundsCSS[book.background]||
        backgroundsCSS.prayer;
}


function updatePreview(){

 book.title=
  document.getElementById("title").value;

 book.subtitle=
  document.getElementById("subtitle").value;

 book.ministry=
  document.getElementById("ministry").value;

 document.getElementById("previewContent").innerHTML=`

  <div style="text-align:center">

   <h1>${esc(book.title)}</h1>

   <h3>${esc(book.subtitle)}</h3>

   <p><b>${esc(book.ministry)}</b></p>

   ${
    book.cover
    ?`<img class="cover" src="${book.cover}">`
    :""
   }

  </div>

  ${
   book.pages.map((p,i)=>`

    <section
     class="previewPage"
     style="background:${bg()}">

     <h2>${esc(p.title)}</h2>

     <p>
      ${esc(p.text).replace(/\n/g,"<br>")}
     </p>

     <div class="verse">
      ${esc(p.verse).replace(/\n/g,"<br>")}
     </div>

    </section>

   `).join("")
  }
 `;
}


function togglePreview(){

 const p=document.getElementById("preview");

 if(p.style.display==="block"){
  p.style.display="none";
  return;
 }

 updatePreview();

 p.style.display="block";
}


async function downloadPDF(){

 const password=prompt(
  "Enter PDF download password:"
 );

 if(password===null)return;

 if(!password){
  alert("Please enter the password.");
  return;
 }

 try{

  const r=await fetch("/api/pdf-password",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({password})
  });

  if(!r.ok){
   alert("Incorrect PDF password.");
   return;
  }

  updatePreview();

  const pages=
   document.querySelectorAll(
    ".previewPage"
   );

  if(!pages.length){
   alert("Please add a prayer page first.");
   return;
  }

  const {jsPDF}=window.jspdf;

  const pdf=new jsPDF(
   "p",
   "mm",
   "a4"
  );

  for(let i=0;i<pages.length;i++){

   if(i>0)
    pdf.addPage();

   const canvas=
    await html2canvas(pages[i],{
     scale:2,
     useCORS:true
    });

   const img=
    canvas.toDataURL("image/jpeg",.95);

   pdf.addImage(
    img,
    "JPEG",
    0,
    0,
    210,
    297
   );
  }

  pdf.save(
   (book.title||"Prayer-Book")
   .replace(/[<>:"/\\|?*]+/g,"-")
   +".pdf"
  );

 }catch(e){

  alert("PDF creation failed.");
 }
}


renderBackgrounds();
loadBook();

</script>

</body>
</html>
