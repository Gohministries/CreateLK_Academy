<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Premium Activation | CreateLK Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

.container{
  max-width:480px;
  margin:50px auto;
  padding:15px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.logo{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:#155eef;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#667085;
  font-size:13px;
  margin-bottom:25px;
}

.title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#475467;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  outline:none;
  font-size:14px;
  margin-bottom:15px;
}

input:focus{
  border-color:#155eef;
  box-shadow:0 0 0 3px rgba(21,94,239,.1);
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:#155eef;
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
}

.error{
  display:block;
  background:#fef3f2;
  border:1px solid #fecdca;
  color:#b42318;
}

.success{
  display:block;
  background:#ecfdf3;
  border:1px solid #abefc6;
  color:#067647;
}

.code-box{
  display:none;
  margin-top:18px;
  padding:18px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  text-align:center;
}

.code-label{
  font-size:11px;
  color:#667085;
  margin-bottom:8px;
}

.code{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
  color:#155eef;
  word-break:break-all;
  margin-bottom:12px;
}

.copy{
  background:#172033;
}

.student-info{
  display:none;
  margin-top:15px;
  padding:13px;
  background:#f8fafc;
  border-radius:10px;
  font-size:12px;
  line-height:1.7;
}

.warning{
  margin-top:18px;
  padding:12px;
  background:#fffaeb;
  border:1px solid #fedf89;
  border-radius:10px;
  color:#b54708;
  font-size:11px;
  line-height:1.5;
}

footer{
  text-align:center;
  color:#98a2b3;
  font-size:11px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      📚 CreateLK Academy
    </div>

    <div class="subtitle">
      Premium Activation Code Generator
    </div>


    <div class="title">
      🔐 Generate Activation Code
    </div>


    <label for="studentId">
      Student ID
    </label>

    <input
      id="studentId"
      type="number"
      min="1"
      placeholder="Example: 1"
      autocomplete="off">


    <label for="adminSecret">
      Admin Secret
    </label>

    <input
      id="adminSecret"
      type="password"
      placeholder="Enter your private Admin Secret"
      autocomplete="off">


    <button
      id="generateButton"
      type="button">

      🔑 Generate Activation Code

    </button>


    <div
      id="message"
      class="message">
    </div>


    <div
      id="studentInfo"
      class="student-info">
    </div>


    <div
      id="codeBox"
      class="code-box">

      <div class="code-label">
        PREMIUM ACTIVATION CODE
      </div>

      <div
        id="generatedCode"
        class="code">
      </div>

      <button
        id="copyCode"
        class="copy"
        type="button">

        📋 Copy Code

      </button>

    </div>


    <div class="warning">

      ⚠️ Keep your Admin Secret private.
      Never send it to students and never
      put it inside your student-facing
      Premium HTML.

    </div>

  </div>


  <footer>
    © 2026 CreateLK Academy
  </footer>

</div>


<script>

const GENERATE_API =
  "https://createlk-premium-activation.createlk.workers.dev/generate";


const studentIdInput =
  document.getElementById(
    "studentId"
  );


const adminSecretInput =
  document.getElementById(
    "adminSecret"
  );


const generateButton =
  document.getElementById(
    "generateButton"
  );


const message =
  document.getElementById(
    "message"
  );


const codeBox =
  document.getElementById(
    "codeBox"
  );


const generatedCode =
  document.getElementById(
    "generatedCode"
  );


const studentInfo =
  document.getElementById(
    "studentInfo"
  );


function showMessage(
  text,
  type
){

  message.className =
    "message " + type;

  message.textContent =
    text;

}


generateButton.addEventListener(
  "click",
  async function(){

    const studentId =
      Number(
        studentIdInput.value.trim()
      );


    const adminSecret =
      adminSecretInput.value.trim();


    codeBox.style.display =
      "none";

    studentInfo.style.display =
      "none";


    if(
      !Number.isInteger(studentId) ||
      studentId <= 0
    ){

      showMessage(
        "Please enter a valid Student ID.",
        "error"
      );

      return;

    }


    if(!adminSecret){

      showMessage(
        "Please enter your Admin Secret.",
        "error"
      );

      return;

    }


    generateButton.disabled =
      true;

    generateButton.textContent =
      "Generating...";


    showMessage(
      "Contacting the secure activation server...",
      "success"
    );


    try{

      const response =
        await fetch(
          GENERATE_API,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "X-Admin-Secret":
                adminSecret
            },

            body:JSON.stringify({

              student_id:
                studentId

            })

          }
        );


      let data = {};

      try{

        data =
          await response.json();

      }catch(error){

        data = {};

      }


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          "Unable to generate activation code."
        );

      }


      generatedCode.textContent =
        data.code;


      codeBox.style.display =
        "block";


      studentInfo.innerHTML =
        "<strong>Student:</strong> " +
        escapeHTML(
          data.student_name ||
          "Student"
        ) +
        "<br>" +
        "<strong>Student ID:</strong> " +
        escapeHTML(
          String(
            data.student_id ||
            studentId
          )
        ) +
        "<br>" +
        "<strong>Code expires:</strong> " +
        escapeHTML(
          data.code_expires_at ||
          "Not specified"
        );


      studentInfo.style.display =
        "block";


      showMessage(
        "Activation code generated successfully.",
        "success"
      );


      /*
        Clear the secret from the input
        after successful generation.
      */

      adminSecretInput.value = "";


    }catch(error){

      console.error(error);


      showMessage(
        error.message ||
        "Unable to connect to the activation server.",
        "error"
      );


    }finally{

      generateButton.disabled =
        false;

      generateButton.textContent =
        "🔑 Generate Activation Code";

    }

  }
);


/* =====================================================
   COPY CODE
===================================================== */

document.getElementById(
  "copyCode"
).addEventListener(
  "click",
  async function(){

    const code =
      generatedCode.textContent.trim();


    if(!code){
      return;
    }


    try{

      await navigator.clipboard.writeText(
        code
      );


      this.textContent =
        "✓ Copied";


      setTimeout(
        () => {

          this.textContent =
            "📋 Copy Code";

        },
        1500
      );


    }catch(error){

      alert(
        "Activation Code: " +
        code
      );

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
