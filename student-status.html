<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">

<title>Student Status - CreateLK Academy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--b:#2563eb;
--p:#7c3aed;
--d:#0f172a;
--m:#64748b;
--l:#e2e8f0;
--bg:#f3f6fb
}

html,
body{
width:100%;
min-height:100%;
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--d);
-webkit-font-smoothing:antialiased;
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:20;
background:#fff;
border-bottom:1px solid var(--l);
}

.nav{
width:100%;
max-width:760px;
margin:auto;
padding:11px 10px;

display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:15px;
font-weight:900;
color:var(--b);
text-decoration:none;
}

.logo span{
color:var(--p);
}

.back{
border:1px solid var(--l);
background:#fff;
color:var(--d);

padding:8px 11px;

border-radius:9px;

font-size:10px;
font-weight:800;

cursor:pointer;
white-space:nowrap;
}


/* MAIN */

main{
width:100%;
max-width:760px;
margin:auto;

padding:8px 3px 0;
}


/* CARD */

.card{
width:100%;

background:#fff;

border:1px solid var(--l);
border-radius:16px;

padding:17px;

margin-bottom:10px;
}


/* HERO */

.hero{
min-height:125px;

display:flex;
flex-direction:column;
justify-content:center;

background:linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:#fff;

border:0;

padding:20px;

box-shadow:
0 5px 18px rgba(37,99,235,.12);
}

.hero h1{
font-size:22px;
font-weight:900;
line-height:1.25;
}

.hero p{
font-size:10px;
line-height:1.45;
margin-top:5px;
opacity:.95;
}


/* STATS */

.stats{
width:100%;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

margin-bottom:10px;
}

.stat{
min-height:76px;

background:#fff;

border:1px solid var(--l);

border-radius:15px;

padding:10px 6px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
}

.stat small{
display:block;

color:var(--m);

font-size:7px;

font-weight:900;

letter-spacing:.2px;

margin-bottom:4px;
}

.stat b{
font-size:12px;
font-weight:900;

overflow-wrap:anywhere;
}

.statPremium{
color:#047857;
}

.statFree{
color:var(--m);
}


/* ACCOUNT */

.accountCard{
padding:18px;
}

.title{
font-size:12px;
font-weight:900;

margin-bottom:10px;
}

.account{
display:grid;

grid-template-columns:
1fr 1fr;

gap:8px;
}

.item{
min-height:58px;

background:#f8fafc;

border:1px solid var(--l);

border-radius:11px;

padding:10px;
}

.item small{
display:block;

color:var(--m);

font-size:7px;

font-weight:900;

margin-bottom:4px;
}

.item b{
display:block;

font-size:9px;

font-weight:800;

line-height:1.4;

overflow-wrap:anywhere;
}


/* PREMIUM ACTIVE */

.premiumActive{
width:100%;

background:#f0fdf4;

border:1px solid #bbf7d0;

color:#166534;

border-radius:13px;

padding:15px;

text-align:center;

font-size:10px;

font-weight:800;

margin-bottom:10px;
}


/* PREMIUM OFFER */

.premiumOffer{
padding:18px;
}

.premiumOffer p{
font-size:9px;

line-height:1.5;

color:var(--m);
}

.payButton{
width:100%;

height:46px;

margin-top:11px;

border:0;

border-radius:10px;

background:linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:#fff;

font-size:11px;

font-weight:900;

cursor:pointer;

box-shadow:
0 4px 12px rgba(37,99,235,.16);
}

.payButton:active{
transform:scale(.99);
}


/* FOOTER */

footer{
width:100%;

text-align:center;

color:var(--m);

font-size:8px;

padding:5px 0 18px;
}


/* 9:16 MOBILE */

@media(max-width:600px){

main{
padding-left:3px;
padding-right:3px;
}

.card{
border-radius:16px;
}

.hero{
min-height:125px;
}

.stats{
gap:7px;
}

.stat{
min-height:78px;
}

.accountCard{
padding:18px;
}

}


/* SMALL PHONES */

@media(max-width:380px){

.nav{
padding-left:8px;
padding-right:8px;
}

.logo{
font-size:14px;
}

.back{
font-size:9px;
padding:7px 9px;
}

main{
padding-left:3px;
padding-right:3px;
}

.hero{
min-height:115px;
padding:18px;
}

.hero h1{
font-size:21px;
}

.card{
padding:15px;
}

.stat{
min-height:70px;
}

.accountCard{
padding:15px;
}

.account{
gap:7px;
}

.item{
min-height:54px;
padding:9px;
}

}


/* TALL 9:16 PHONES */

@media(
min-height:700px
) and (
max-width:600px
){

.hero{
min-height:130px;
}

.stat{
min-height:80px;
}

.accountCard{
padding:18px;
}

footer{
padding-bottom:20px;
}

}

</style>
</head>


<body>


<header>

<div class="nav">

<a
class="logo"
href="dashboard.html">

📚 CreateLK <span>Academy</span>

</a>

<button
class="back"
onclick="location.href='dashboard.html'">

← Dashboard

</button>

</div>

</header>


<main>


<!-- HERO -->

<section class="card hero">

<h1>
🎓 Student Status
</h1>

<p id="welcome">
Loading...
</p>

</section>


<!-- BASIC STATS -->

<div class="stats">

<div class="stat">

<small>
STUDENT ID
</small>

<b id="sid">
-
</b>

</div>


<div class="stat">

<small>
LESSONS
</small>

<b id="lessons">
0
</b>

</div>


<div class="stat">

<small>
MEMBERSHIP
</small>

<b
id="member"
class="statFree">

Free

</b>

</div>

</div>


<!-- ACCOUNT -->

<section class="card accountCard">

<div class="title">
👤 Account
</div>

<div class="account">


<div class="item">

<small>
NAME
</small>

<b id="name">
-
</b>

</div>


<div class="item">

<small>
EMAIL
</small>

<b id="email">
-
</b>

</div>


<div class="item">

<small>
PHONE
</small>

<b id="phone">
-
</b>

</div>


<div class="item">

<small>
PREMIUM EXPIRY
</small>

<b id="expiry">
Not active
</b>

</div>


</div>

</section>


<!-- PREMIUM -->

<div id="premium"></div>


<footer>

© 2026 CreateLK Academy

</footer>


</main>


<script>

const PAYMENT =
"https://createlk-premium-payments.createlk.workers.dev";


let student={};


/* LOAD STUDENT */

try{

student=
JSON.parse(
localStorage.getItem(
"createlk_student"
)||"{}"
);

}catch(e){

student={};

}


/* STUDENT ID */

function id(){

return Number(

student.id ||

student.database_id ||

student.student_id_number ||

student.student_id ||

0

);

}


/* PREMIUM */

function premium(){

return String(

student.membership_status ||

student.membershipStatus ||

"FREE"

).toUpperCase()==="PREMIUM";

}


/* DISPLAY */

function display(){

const full=

(
`${student.first_name||""} ${student.last_name||""}`
).trim()

||

student.name

||

"Student";


document.getElementById(
"welcome"
).textContent=

`Welcome, ${full}`;


document.getElementById(
"sid"
).textContent=

student.student_id ||

student.studentId ||

id();


document.getElementById(
"name"
).textContent=

full;


document.getElementById(
"email"
).textContent=

student.email || "-";


document.getElementById(
"phone"
).textContent=

student.phone || "-";


document.getElementById(
"member"
).textContent=

premium()
?
"Premium"
:
"Free";


document.getElementById(
"member"
).className=

premium()
?
"statPremium"
:
"statFree";


document.getElementById(
"expiry"
).textContent=

student.membership_expiry ||

student.membershipExpiry ||

"Not active";


/* PREMIUM AREA */

const box=
document.getElementById(
"premium"
);


if(premium()){

box.innerHTML=

`
<div class="premiumActive">

✅ Premium membership is active.

</div>
`;

}else{

box.innerHTML=

`
<section class="card premiumOffer">

<div class="title">
⭐ Premium Membership
</div>

<p>
Get complete access to the 100-page Spoken English course.
</p>

<button
class="payButton"
onclick="checkout()">

💳 Pay LKR 1,500

</button>

</section>
`;

}

}


/* CHECKOUT */

async function checkout(){

try{

const r=
await fetch(

PAYMENT+
"/api/checkout",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:id()

})

}

);


const raw=
await r.text();


if(!r.ok){

throw new Error(
"Unable to open PayHere."
);

}


/* PAYMENT FORM */

if(
raw.includes("<form")
){

document.open();

document.write(raw);

document.close();

return;

}


/* JSON */

const d=
JSON.parse(raw);


if(
d.url ||
d.checkout_url
){

location.href=
d.url ||
d.checkout_url;

return;

}


throw new Error(
"Invalid payment response."
);


}catch(e){

alert(
e.message
);

}

}


/* START */

function start(){

if(!id()){

location.href=
"login.html";

return;

}

display();

}

start();

</script>

</body>
</html>
