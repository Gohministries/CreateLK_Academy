<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Student Status - CreateLK Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#2563eb;--p:#7c3aed;--d:#0f172a;--m:#64748b;--l:#e2e8f0;--bg:#f3f6fb}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--d)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l)}
.nav,main{width:100%;max-width:820px;margin:auto}
.nav{padding:11px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:15px;font-weight:900;color:var(--b);text-decoration:none}
.logo span{color:var(--p)}
.back{border:1px solid var(--l);background:#fff;color:var(--d);padding:8px 11px;border-radius:9px;font-size:10px;font-weight:800}
main{padding:7px 2px 0}
.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:17px;margin-bottom:10px}
.hero{min-height:145px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;padding:21px;box-shadow:0 5px 18px rgba(37,99,235,.12)}
.hero h1{font-size:23px;font-weight:900}
.hero p{font-size:11px;line-height:1.5;margin-top:6px}
.quote{margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.28);font-size:11px;line-height:1.55;font-style:italic;font-weight:600}
.quote:before{content:"“";font-size:20px}
.quote:after{content:"”";font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat{min-height:80px;background:#fff;border:1px solid var(--l);border-radius:15px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stat small,.item small{display:block;color:var(--m);font-size:7px;font-weight:900;letter-spacing:.2px;margin-bottom:4px}
.stat b{font-size:12px;overflow-wrap:anywhere}
.statPremium{color:#047857}.statFree{color:var(--m)}
.title{font-size:12px;font-weight:900;margin-bottom:10px}
.account{display:flex;flex-direction:column;gap:7px}
.item{min-height:54px;background:#f8fafc;border:1px solid var(--l);border-radius:10px;padding:9px 10px}
.item b{display:block;font-size:10px;line-height:1.4;overflow-wrap:anywhere}
.premiumActive{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:13px;padding:15px;text-align:center;font-size:10px;font-weight:800;margin-bottom:10px}
.premiumOffer p{font-size:9px;line-height:1.5;color:var(--m)}
.payButton{width:100%;height:46px;margin-top:11px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:11px;font-weight:900}
footer{text-align:center;color:var(--m);font-size:8px;padding:5px 0 18px}
@media(max-width:600px){main{padding:7px 2px 0}.hero{min-height:145px}}
</style>
</head><body><header>
<div class="nav">
<a class="logo" href="dashboard.html">📚 CreateLK <span>Academy</span></a>
<button class="back" onclick="location.href='dashboard.html'">← Dashboard</button>
</div>
</header><main><section class="card hero">
<h1>🎓 Student Status</h1>
<p id="welcome">Loading...</p>
<div class="quote">Every lesson you complete brings you one step closer to confident English.</div>
</section><div class="stats">
<div class="stat"><small>STUDENT ID</small><b id="sid">-</b></div>
<div class="stat"><small>LESSONS</small><b id="lessons">0</b></div>
<div class="stat"><small>MEMBERSHIP</small><b id="member" class="statFree">Free</b></div>
</div><section class="card">
<div class="title">👤 Account</div>
<div class="account">
<div class="item"><small>NAME</small><b id="name">-</b></div>
<div class="item"><small>EMAIL</small><b id="email">-</b></div>
<div class="item"><small>PHONE</small><b id="phone">-</b></div>
<div class="item"><small>PREMIUM EXPIRY</small><b id="expiry">Not active</b></div>
</div>
</section><div id="premium"></div><footer>© 2026 CreateLK Academy</footer>
</main><script>
const PROGRESS_API="https://createlk-365-progress.createlk.workers.dev";
const PAYMENT="https://createlk-premium-payments.createlk.workers.dev";
const STUDENT_KEY="createlk_student";

let student={};
try{student=JSON.parse(localStorage.getItem(STUDENT_KEY)||"{}")}catch(e){}

function id(){
return Number(student.id||student.database_id||student.student_id_number||student.student_id||0);
}

function isPremium(){
return String(student.membership_status||student.membershipStatus||"FREE").toUpperCase()==="PREMIUM";
}

function display(){
const full=(`${student.first_name||""} ${student.last_name||""}`).trim()||student.name||"Student";

welcome.textContent=`Welcome, ${full}`;
sid.textContent=student.student_id||student.studentId||id();
name.textContent=full;
email.textContent=student.email||"-";
phone.textContent=student.phone||"-";
expiry.textContent=student.membership_expiry||student.membershipExpiry||"Not active";

if(isPremium()){
member.textContent="Premium";
member.className="statPremium";
premium.innerHTML=`<div class="premiumActive">✅ Premium membership is active.</div>`;
}else{
member.textContent="Free";
member.className="statFree";
premium.innerHTML=`
<section class="card premiumOffer">
<div class="title">⭐ Premium Membership</div>
<p>Get complete access to the 100-page Spoken English course.</p>
<button class="payButton" onclick="checkout()">💳 Pay LKR 1,500</button>
</section>`;
}
}

async function loadProgress(){
const studentId=id();
if(!studentId)return;

try{
const r=await fetch(
`${PROGRESS_API}/api/progress?student_id=${encodeURIComponent(studentId)}`,
{cache:"no-store",headers:{Accept:"application/json"}}
);

if(!r.ok)return;

const d=await r.json();

if(d.success){
const completed=Math.max(
0,
Number(d.completed_lessons??d.completed??d.lessons_completed??0)
);
lessons.textContent=Math.min(365,completed);
}
}catch(e){
console.log("Progress error:",e);
}
}

async function checkout(){
try{
const r=await fetch(PAYMENT+"/api/checkout",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({student_id:id()})
});

const raw=await r.text();

if(!r.ok)throw new Error("Unable to open PayHere.");

if(raw.includes("<form")){
document.open();
document.write(raw);
document.close();
return;
}

const d=JSON.parse(raw);

if(d.url||d.checkout_url){
location.href=d.url||d.checkout_url;
return;
}

throw new Error("Invalid payment response.");
}catch(e){
alert(e.message);
}
}

async function start(){
if(!id()){
location.href="login.html";
return;
}

display();
await loadProgress();
}

start();
</script></body>
</html>
